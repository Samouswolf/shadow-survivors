<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>跑酷障碍</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(180deg, #1e1b4b 0%, #0f0f23 100%); min-height: 100vh; overflow: hidden; }
#game-container { position: relative; width: 100%; height: 100vh; }
#game-canvas { display: block; width: 100%; height: 100%; }
#game-ui { position: absolute; top: 20px; left: 20px; color: #fff; font-size: 20px; font-weight: bold; z-index: 10; }
#game-ui span { color: #a855f7; }
#game-over { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 20; flex-direction: column; align-items: center; justify-content: center; }
#game-over h2 { font-size: 48px; color: #f5576c; margin-bottom: 20px; }
#game-over p { font-size: 24px; color: #fff; margin-bottom: 30px; }
#game-over .btn { padding: 15px 40px; font-size: 20px; background: #a855f7; color: #fff; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
#start-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#start-screen h1 { font-size: 48px; color: #a855f7; margin-bottom: 20px; text-shadow: 0 0 20px rgba(168,85,247,0.5); }
#start-screen p { color: #aaa; margin-bottom: 40px; font-size: 16px; }
#start-screen .btn { padding: 18px 50px; font-size: 22px; background: linear-gradient(145deg, #a855f7, #7c3aed); color: #fff; border: none; border-radius: 15px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 20px rgba(168,85,247,0.4); }
.ad-banner-container { position: absolute; bottom: 0; left: 0; width: 100%; padding: 10px; z-index: 10; }
.sponsor-btn { position: fixed; top: 20px; right: 20px; width: 50px; height: 50px; background: rgba(255,165,0,0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; z-index: 100; box-shadow: 0 4px 15px rgba(255,165,0,0.4); }
.sponsor-panel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 200; align-items: center; justify-content: center; }
.sponsor-panel.show { display: flex; }
.sponsor-content { background: #fff; padding: 30px; border-radius: 20px; text-align: center; max-width: 90%; }
.sponsor-content h3 { margin-bottom: 20px; color: #333; }
.sponsor-close { position: absolute; top: 20px; right: 20px; width: 40px; height: 40px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; }

#loading-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a2e; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#loading-screen .loading-icon { width: 60px; height: 60px; border: 4px solid #6366f1; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#loading-screen p { color: #6366f1; margin-top: 20px; font-size: 18px; }
.interstitial-ad { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 999; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
.interstitial-ad .ad-content { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; text-align: center; min-width: 280px; max-width: 400px; }
.interstitial-ad .ad-content p { color: #aaa; font-size: 14px; margin-bottom: 12px; }
.interstitial-ad .skip-btn { padding: 8px 28px; background: rgba(255,215,0,0.15); border: 1px solid rgba(255,215,0,0.3); border-radius: 20px; color: #ffd700; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.2s; }
.interstitial-ad .skip-btn:hover { background: rgba(255,215,0,0.25); }

</style>
</head>
<body>
<div id="start-screen">
  <h1>🏃 跑酷障碍</h1>
  <p>点击屏幕跳跃或滑行<br>躲避障碍，收集金币！</p>
  <button class="btn" onclick="startGame()">开始游戏</button>
</div>

<div id="game-container">
  <canvas id="game-canvas"></canvas>
  <div id="game-ui">
    分数: <span id="score">0</span> | 最高: <span id="high-score">0</span>
  </div>
  
  <div id="game-over">
    <h2>💥 游戏结束</h2>
    <p>最终得分: <span id="final-score">0</span></p>
    <button class="btn" onclick="restartGame()">再来一次</button>
  </div>
  
  <div class="ad-banner-container">
    <div style="background:#f0f0f0;height:90px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#666;font-size:14px;">广告位</div>
  </div>
</div>

<div class="sponsor-btn" onclick="showSponsor()">☕</div>
<div class="sponsor-panel" id="sponsor-panel" onclick="hideSponsor()">
  <div class="sponsor-content" onclick="event.stopPropagation()">
    <h3>支持开发者</h3>
    <p>感谢您的支持！</p>
    <div style="color:#666;font-size:14px;margin-top:10px;">微信赞赏码</div>
  </div>
  <div class="sponsor-close" onclick="hideSponsor()">×</div>
</div>


<div id="loading-screen">
  <div class="loading-icon"></div>
  <p>加载中...</p>
</div>

<div class="interstitial-ad" id="interstitialAd">
  <div class="ad-content">
    <p>赞助商广告</p>
    <div id="interstitialAdSlot" style="min-height:250px;display:flex;align-items:center;justify-content:center;color:#888;font-size:13px;">广告加载中...</div>
  </div>
  <button class="skip-btn" id="skipInterstitial" onclick="closeInterstitial()">跳过广告</button>
</div>

<script>

// ==================== 游戏说明 ====================
// 操作说明: 使用键盘方向键或触屏控制
// 游戏目标: 获得最高分数
// 存档系统: 自动保存最高分到本地
// ==================== 模块说明 ====================
// 1. 游戏初始化模块 - 初始化Canvas和游戏状态
// 2. 游戏逻辑模块 - 处理玩家移动、碰撞检测
// 3. 渲染模块 - 绘制游戏画面和UI
// 4. 音效模块 - 播放游戏音效
// 5. 存档模块 - 管理最高分记录
// ==================== 配置参数 ====================
const GAME_NAME = '跑酷障碍';

class GameCore {
  static init(options) {
    if (options.highScore) {
      this.highScoreKey = options.highScore;
    }
  }
  
  static getHighScore() {
    return parseInt(localStorage.getItem(this.highScoreKey)) || 0;
  }
  
  static setHighScore(value) {
    const current = this.getHighScore();
    if (value > current) {
      localStorage.setItem(this.highScoreKey, value);
      return true;
    }
    return false;
  }
}

GameCore.init({ highScore: GAME_NAME });

const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const highScoreEl = document.getElementById('high-score');
const finalScoreEl = document.getElementById('final-score');

let gameRunning = false;
let score = 0;
let speed = 6;
let obstacles = [];
let coins = [];
let particles = [];
let isSliding = false;
let slideTimer = 0;

const player = {
  x: 80,
  y: 0,
  width: 35,
  height: 60,
  velocityY: 0,
  isJumping: false,
  color: '#a855f7'
};

let groundY = 0;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  groundY = canvas.height - 120;
  player.y = groundY;
}

resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function startGame() {
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('game-over').style.display = 'none';
  gameRunning = true;
  score = 0;
  speed = 6;
  obstacles = [];
  coins = [];
  particles = [];
  isSliding = false;
  slideTimer = 0;
  
  player.y = groundY;
  player.velocityY = 0;
  player.isJumping = false;
  player.height = 60;
  
  scoreEl.textContent = '0';
  highScoreEl.textContent = GameCore.getHighScore();
  
  gameLoop();
}

function restartGame() {
  startGame();
}

function showSponsor() {
  document.getElementById('sponsor-panel').classList.add('show');
}

function hideSponsor() {
  document.getElementById('sponsor-panel').classList.remove('show');
}

function jump() {
  if (!player.isJumping && !isSliding && gameRunning) {
    player.velocityY = -14;
    player.isJumping = true;
    createParticles(player.x + player.width/2, player.y + player.height, '#a855f7');
  }
}

function slide() {
  if (!player.isJumping && !isSliding && gameRunning) {
    isSliding = true;
    player.height = 30;
    player.y = groundY + 30;
    slideTimer = Date.now();
  }
}

function createParticles(x, y, color) {
  for (let i = 0; i < 5; i++) {
    particles.push({
      x: x,
      y: y,
      vx: (Math.random() - 0.5) * 4,
      vy: (Math.random() - 0.5) * 4,
      size: Math.random() * 5 + 2,
      color: color,
      life: 1
    });
  }
}

function spawnObstacle() {
  const types = ['low', 'high', 'double'];
  const type = types[Math.floor(Math.random() * types.length)];
  
  let obstacle = {
    x: canvas.width + 50,
    type: type,
    passed: false
  };
  
  if (type === 'low') {
    obstacle.width = 50;
    obstacle.height = 40;
    obstacle.y = groundY + 80;
    obstacle.color = '#f5576c';
  } else if (type === 'high') {
    obstacle.width = 40;
    obstacle.height = 80;
    obstacle.y = groundY + 40;
    obstacle.color = '#fbbf24';
  } else {
    obstacle.width = 60;
    obstacle.height = 30;
    obstacle.y = groundY + 90;
    obstacle.color = '#ef4444';
    obstacle.hasTop = true;
    obstacle.topY = groundY;
    obstacle.topHeight = 30;
  }
  
  obstacles.push(obstacle);
  
  if (Math.random() < 0.3) {
    coins.push({
      x: canvas.width + 200,
      y: groundY - 50 - Math.random() * 100,
      size: 20,
      collected: false,
      angle: 0
    });
  }
}

function update() {
  if (!gameRunning) return;
  
  score += 0.1;
  scoreEl.textContent = Math.floor(score);
  
  speed += 0.0008;
  
  if (isSliding && Date.now() - slideTimer > 500) {
    isSliding = false;
    player.height = 60;
    player.y = groundY;
  }
  
  player.velocityY += 0.7;
  player.y += player.velocityY;
  
  if (player.y >= (isSliding ? groundY + 30 : groundY)) {
    player.y = isSliding ? groundY + 30 : groundY;
    player.velocityY = 0;
    player.isJumping = false;
  }
  
  if (Math.random() < 0.015 + speed * 0.001) {
    spawnObstacle();
  }
  
  obstacles.forEach(obstacle => {
    obstacle.x -= speed;
    
    if (!obstacle.passed &&
        player.x < obstacle.x + obstacle.width &&
        player.x + player.width > obstacle.x &&
        player.y + player.height > obstacle.y &&
        player.y < obstacle.y + obstacle.height) {
      gameOver();
    }
    
    if (obstacle.hasTop && !obstacle.passed &&
        player.x < obstacle.x + obstacle.width &&
        player.x + player.width > obstacle.x &&
        player.y + player.height > obstacle.topY &&
        player.y < obstacle.topY + obstacle.topHeight) {
      gameOver();
    }
    
    if (obstacle.x + obstacle.width < -50) {
      obstacle.passed = true;
    }
  });
  
  obstacles = obstacles.filter(o => !o.passed);
  
  coins.forEach(coin => {
    coin.x -= speed;
    coin.angle += 0.1;
    
    const dx = player.x + player.width / 2 - coin.x;
    const dy = player.y + player.height / 2 - coin.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    
    if (!coin.collected && dist < 35) {
      coin.collected = true;
      score += 50;
      scoreEl.textContent = Math.floor(score);
      createParticles(coin.x, coin.y, '#ffd700');
    }
  });
  
  coins = coins.filter(c => !c.collected && c.x > -50);
  
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.03;
  });
  
  particles = particles.filter(p => p.life > 0);
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  ctx.fillStyle = '#1e1b4b';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  ctx.fillStyle = '#312e81';
  for (let i = 0; i < 60; i++) {
    const x = (i * 67 + Date.now() * 0.02) % canvas.width;
    const y = (i * 43 + Date.now() * 0.03) % canvas.height;
    ctx.fillRect(x, y, 2, 2);
  }
  
  ctx.fillStyle = '#4c1d95';
  ctx.fillRect(0, groundY + 120, canvas.width, canvas.height - groundY - 120);
  
  ctx.fillStyle = '#7c3aed';
  ctx.fillRect(0, groundY + 115, canvas.width, 5);
  
  obstacles.forEach(obstacle => {
    ctx.fillStyle = obstacle.color;
    
    if (obstacle.type === 'low') {
      ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 16px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('⚠', obstacle.x + obstacle.width/2, obstacle.y + obstacle.height/2 + 6);
    } else if (obstacle.type === 'high') {
      ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 16px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('⬆', obstacle.x + obstacle.width/2, obstacle.y + obstacle.height/2 + 6);
    } else {
      ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
      ctx.fillRect(obstacle.x, obstacle.topY, obstacle.width, obstacle.topHeight);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 16px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('↕', obstacle.x + obstacle.width/2, obstacle.y + obstacle.height/2 + 6);
    }
  });
  
  coins.forEach(coin => {
    ctx.save();
    ctx.translate(coin.x, coin.y);
    ctx.rotate(coin.angle);
    
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.arc(0, 0, coin.size, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.fillStyle = '#ffed4a';
    ctx.font = 'bold 14px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('¥', 0, 1);
    
    ctx.restore();
  });
  
  ctx.fillStyle = player.color;
  ctx.fillRect(player.x, player.y, player.width, player.height);
  
  ctx.fillStyle = '#c084fc';
  ctx.fillRect(player.x + 5, player.y + 5, player.width - 10, isSliding ? 8 : 15);
  
  ctx.fillStyle = '#fff';
  ctx.fillRect(player.x + 8, player.y + (isSliding ? 12 : 20), 4, 4);
  ctx.fillRect(player.x + 23, player.y + (isSliding ? 12 : 20), 4, 4);
  
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });
  
  ctx.globalAlpha = 1;
}

function gameLoop() {
  if (!gameRunning) return;
  
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

function gameOver() {
  gameRunning = false;
  const finalScore = Math.floor(score);
  finalScoreEl.textContent = finalScore;
  
  if (GameCore.setHighScore(finalScore)) {
    highScoreEl.textContent = finalScore;
  }
  
  document.getElementById('game-over').style.display = 'flex';
}

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    if (gameRunning) {
      jump();
    }
  } else if (e.code === 'ArrowDown') {
    e.preventDefault();
    if (gameRunning) {
      slide();
    }
  }
});

canvas.addEventListener('click', () => {
  if (gameRunning) {
    jump();
  }
});

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (gameRunning) {
    jump();
  }
});

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (gameRunning) {
    const touchY = e.touches[0].clientY;
    if (touchY > canvas.height / 2) {
      slide();
    }
  }
});

// ==================== 错误处理 ====================
function closeInterstitial() {
  try {
    var el = document.getElementById('interstitialAd');
    if (el) el.style.display = 'none';
  } catch (error) {
    console.error('关闭广告失败:', error);
  }
}

// ==================== 音效支持 ====================
var audioCtx = null;
function initAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch (error) {
    console.warn('音频初始化失败:', error);
  }
}
function playSound(freq, dur, type, vol) {
  try {
    if (!audioCtx) return;
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = type || 'square';
    o.frequency.value = freq;
    g.gain.value = vol || 0.15;
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime + dur);
  } catch (error) {
    console.warn('音效播放失败:', error);
  }
}

// ==================== 页面加载处理 ====================
window.addEventListener('load', function() {
  try {
    var loadingScreen = document.getElementById('loading-screen');
    if (loadingScreen) {
      setTimeout(function() {
        loadingScreen.style.display = 'none';
      }, 1500);
    }
  } catch (error) {
    console.error('加载界面处理失败:', error);
  }
});

</script>
</body>
</html>
