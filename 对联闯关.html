// ==================== Resize ====================
function resize() {
    const dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    c.width = W * dpr;
    c.height = H * dpr;
    c.style.width = W + 'px';
    c.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    scale = Math.min(W / 400, H / 700, 1.5);
    initBgStars();
}

function initBgStars() {
    G.bgStars = [];
    for (let i = 0; i < 60; i++) {
        G.bgStars.push({
            x: Math.random() * W,
            y: Math.random() * H,
            r: Math.random() * 2 + 0.5,
            speed: Math.random() * 0.3 + 0.1,
            alpha: Math.random() * 0.6 + 0.2,
            pulse: Math.random() * Math.PI * 2
        });
    }
}

// ==================== Particles ====================
function spawnParticles(x, y, count, color, spread) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * (spread || 3) + 1;
        G.particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            decay: Math.random() * 0.02 + 0.015,
            r: Math.random() * 4 + 2,
            color: color || COLORS.gold
        });
    }
}

function spawnCelebration() {
    const colors = [COLORS.gold, COLORS.red, COLORS.green, COLORS.blue, COLORS.purple, COLORS.accent];
    for (let i = 0; i < 80; i++) {
        const x = Math.random() * W;
        const y = Math.random() * H * 0.3;
        spawnParticles(x, y, 1, colors[Math.floor(Math.random() * colors.length)], 5);
    }
}

function updateParticles() {
    for (let i = G.particles.length - 1; i >= 0; i--) {
        const p = G.particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.05;
        p.life -= p.decay;
        if (p.life <= 0) G.particles.splice(i, 1);
    }
}

function drawParticles() {
    for (const p of G.particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

// ==================== Background ====================
function drawBg(time) {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, COLORS.bg2);
    grad.addColorStop(0.5, COLORS.bg3);
    grad.addColorStop(1, COLORS.bg1);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Stars
    for (const s of G.bgStars) {
        s.pulse += 0.02;
        const a = s.alpha * (0.6 + 0.4 * Math.sin(s.pulse));
        ctx.globalAlpha = a;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Subtle pattern overlay
    ctx.globalAlpha = 0.03;
    for (let y = 0; y < H; y += 40) {
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
    }
    ctx.globalAlpha = 1;
}

// ==================== Utility ====================
function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

function drawText(text, x, y, size, color, align, maxWidth) {
    ctx.fillStyle = color || COLORS.white;
    ctx.font = 'bold ' + size + 'px "Microsoft YaHei","SimSun",sans-serif';
    ctx.textAlign = align || 'center';
    ctx.textBaseline = 'middle';
    if (maxWidth) {
        ctx.fillText(text, x, y, maxWidth);
    } else {
        ctx.fillText(text, x, y);
    }
}

function drawShadowText(text, x, y, size, color, shadowColor) {
    ctx.fillStyle = shadowColor || 'rgba(0,0,0,0.5)';
    ctx.font = 'bold ' + size + 'px "Microsoft YaHei","SimSun",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + 2, y + 2);
    ctx.fillStyle = color || COLORS.white;
    ctx.fillText(text, x, y);
}

function loadHighScore() {
    try {
        const s = localStorage.getItem('duilian_high');
        G.highScore = s ? parseInt(s) : 0;
    } catch(e) { G.highScore = 0; }
}

function saveHighScore() {
    try {
        if (G.score > G.highScore) {
            G.highScore = G.score;
            localStorage.setItem('duilian_high', G.highScore.toString());
        }
    } catch(e) {}
}

function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function getPool() {
    let pool = COUPLETS.filter(q => q.diff <= G.difficulty);
    shuffle(pool);
    return pool.slice(0, 10);
}

// ==================== Game Logic ====================
function startGame() {
    G.score = 0;
    G.combo = 0;
    G.maxCombo = 0;
    G.correct = 0;
    G.wrong = 0;
    G.lives = G.maxLives;
    G.selectedOption = -1;
    G.showingResult = false;
    G.difficulty = 1;
    G.levelComplete = false;
    G.hintUsed = false;
    G.hintAlpha = 0;
    G.totalTime = 0;
    G.questionPool = getPool();
    G.totalQuestions = G.questionPool.length;
    G.currentQ = null;
    nextQuestion();
    G.screen = SCREEN.PLAYING;
    G.fadeIn = 1;
}

function nextQuestion() {
    if (G.questionPool.length === 0) {
        // Level complete
        if (G.difficulty < 5) {
            G.difficulty++;
            G.questionPool = getPool();
            G.totalQuestions += G.questionPool.length;
            G.levelComplete = true;
            G.levelTimer = 180;
            spawnCelebration();
            return;
        } else {
            // Game complete
            saveHighScore();
            G.screen = SCREEN.GAMEOVER;
            spawnCelebration();
            return;
        }
    }
    G.currentQ = G.questionPool.shift();
    G.selectedOption = -1;
    G.showingResult = false;
    G.hintUsed = false;
    G.hintAlpha = 0;
    G.timeLeft = G.timePerQ;
    G.timerActive = true;
    G.optionRects = [];
}

function selectOption(idx) {
    if (G.showingResult || G.levelComplete) return;
    G.selectedOption = idx;
    G.timerActive = false;
    const correct = G.currentQ.options[idx] === G.currentQ.down;
    G.showingResult = true;
    G.resultCorrect = correct;
    G.resultTimer = 90;

    if (correct) {
        const baseScore = G.difficulty * 10;
        const comboBonus = Math.min(G.combo, 10) * 5;
        const timeBonus = Math.floor(G.timeLeft);
        G.score += baseScore + comboBonus + timeBonus;
        G.combo++;
        if (G.combo > G.maxCombo) G.maxCombo = G.combo;
        G.correct++;
        spawnParticles(W / 2, H / 2, 30, COLORS.gold, 5);
    } else {
        G.combo = 0;
        G.wrong++;
        G.lives--;
        G.shakeTimer = 15;
        if (G.lives <= 0) {
            saveHighScore();
            G.screen = SCREEN.GAMEOVER;
        }
    }
}

function useHint() {
    if (G.hintUsed || G.showingResult || !G.currentQ) return;
    G.hintUsed = true;
    G.hintAlpha = 1;
    G.score = Math.max(0, G.score - 5);
}

// ==================== Input ====================
function getPos(e) {
    const rect = c.getBoundingClientRect();
    if (e.touches) {
        return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
    }
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

function handleClick(e) {
    e.preventDefault();
    const pos = getPos(e);
    handleTap(pos.x, pos.y);
}

function handleTouch(e) {
    e.preventDefault();
    const pos = getPos(e);
    handleTap(pos.x, pos.y);
}

function handleTap(x, y) {
    if (G.screen === SCREEN.MENU) {
        const bw = 200 * scale, bh = 50 * scale;
        const bx = W / 2 - bw / 2, by = H * 0.65;
        if (x >= bx && x <= bx + bw && y >= by && y <= by + bh) {
            startGame();
        }
        return;
    }

    if (G.screen === SCREEN.PLAYING) {
        // Check hint button
        const hintW = 60 * scale, hintH = 30 * scale;
        const hintX = W / 2 - hintW / 2, hintY = H * 0.85;
        if (!G.hintUsed && !G.showingResult && x >= hintX && x <= hintX + hintW && y >= hintY && y <= hintY + hintH) {
            useHint();
            return;
        }

        // Check options
        if (!G.showingResult && !G.levelComplete) {
            for (let i = 0; i < G.optionRects.length; i++) {
                const r = G.optionRects[i];
                if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) {
                    selectOption(i);
                    return;
                }
            }
        }

        // Level complete continue
        if (G.levelComplete) {
            G.levelComplete = false;
            nextQuestion();
        }
        return;
    }

    if (G.screen === SCREEN.GAMEOVER) {
        const bw = 180 * scale, bh = 45 * scale;
        const bx = W / 2 - bw / 2;
        // Restart button
        if (x >= bx && x <= bx + bw && y >= H * 0.65 && y <= H * 0.65 + bh) {
            startGame();
        }
        // Back to menu
        if (x >= bx && x <= bx + bw && y >= H * 0.65 + bh + 15 * scale && y <= H * 0.65 + bh + 15 * scale + bh) {
            G.screen = SCREEN.MENU;
        }
        return;
    }
}

function handleKey(e) {
    if (G.screen === SCREEN.PLAYING && !G.showingResult && !G.levelComplete) {
        if (e.key >= '1' && e.key <= '4') {
            selectOption(parseInt(e.key) - 1);
        }
        if (e.key === 'h' || e.key === 'H') {
            useHint();
        }
    }
    if (G.screen === SCREEN.MENU && (e.key === 'Enter' || e.key === ' ')) {
        startGame();
    }
    if (G.screen === SCREEN.GAMEOVER && (e.key === 'Enter' || e.key === ' ')) {
        startGame();
    }
    if (G.screen === SCREEN.PLAYING && G.levelComplete && (e.key === 'Enter' || e.key === ' ')) {
        G.levelComplete = false;
        nextQuestion();
    }
}

function drawPlaying(time) {
    const cx = W / 2;
    const s = scale;

    // Shake effect
    if (G.shakeTimer > 0) {
        G.shakeTimer--;
        G.shakeX = (Math.random() - 0.5) * 8;
        G.shakeY = (Math.random() - 0.5) * 8;
        ctx.save();
        ctx.translate(G.shakeX, G.shakeY);
    }

    // Top bar
    const barH = 50 * s;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(0, 0, W, barH);

    // Score
    drawText('得分: ' + G.score, 15 * s, barH / 2, 14 * s, COLORS.gold, 'left');

    // Difficulty label
    const diffNames = ['','入门','初学','进阶','挑战','大师'];
    const diffColors = ['','#4ecdc4','#44ff88','#ffd700','#ff6b9d','#ff4444'];
    drawText('难度: ' + diffNames[G.difficulty], cx, barH / 2, 14 * s, diffColors[G.difficulty]);

    // Lives
    const livesX = W - 15 * s;
    ctx.textAlign = 'right';
    for (let i = 0; i < G.maxLives; i++) {
        ctx.fillStyle = i < G.lives ? COLORS.red : 'rgba(255,255,255,0.15)';
        ctx.font = (16 * s) + 'px "Microsoft YaHei"';
        ctx.fillText('♥', livesX - i * 22 * s, barH / 2);
    }
    ctx.textAlign = 'center';

    // Combo
    if (G.combo > 1) {
        drawText('连击 x' + G.combo, cx, barH + 18 * s, 13 * s, COLORS.accent);
    }

    // Level complete overlay
    if (G.levelComplete) {
        G.levelTimer--;
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0, 0, W, H);

        const panelW = 280 * s, panelH = 180 * s;
        const px = cx - panelW / 2, py = H / 2 - panelH / 2;
        ctx.fillStyle = 'rgba(20,15,40,0.95)';
        roundRect(px, py, panelW, panelH, 16 * s);
        ctx.fill();
        ctx.strokeStyle = COLORS.gold;
        ctx.lineWidth = 2;
        roundRect(px, py, panelW, panelH, 16 * s);
        ctx.stroke();

        drawShadowText('关卡通过!', cx, py + 45 * s, 24 * s, COLORS.gold);
        drawText('难度 ' + diffNames[G.difficulty - 1] + ' → ' + diffNames[G.difficulty], cx, py + 85 * s, 14 * s, COLORS.blue);
        drawText('当前得分: ' + G.score, cx, py + 115 * s, 16 * s, COLORS.white);
        drawText('点击或按回车继续', cx, py + 150 * s, 12 * s, COLORS.gray);

        if (G.shakeTimer > 0) ctx.restore();
        updateParticles();
        drawParticles();
        return;
    }

    if (!G.currentQ) {
        if (G.shakeTimer > 0) ctx.restore();
        return;
    }

    // Question area
    const qY = barH + 50 * s;
    const cardW = Math.min(W - 40 * s, 400 * s);
    const cardX = cx - cardW / 2;

    // Up couplet card
    ctx.fillStyle = 'rgba(180,50,50,0.15)';
    roundRect(cardX, qY, cardW, 80 * s, 12 * s);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,100,100,0.3)';
    ctx.lineWidth = 1.5;
    roundRect(cardX, qY, cardW, 80 * s, 12 * s);
    ctx.stroke();

    // Label
    drawText('【上联】', cx, qY + 18 * s, 12 * s, 'rgba(255,150,150,0.7)');
    drawShadowText(G.currentQ.up, cx, qY + 50 * s, 26 * s, COLORS.white);

    // Down label
    drawText('请选出下联 ↓', cx, qY + 100 * s, 14 * s, COLORS.gray);

    // Options
    G.optionRects = [];
    const optStartY = qY + 120 * s;
    const optH = 52 * s;
    const optGap = 10 * s;
    const optW = cardW;
    const optX = cardX;

    for (let i = 0; i < G.currentQ.options.length; i++) {
        const oy = optStartY + i * (optH + optGap);
        G.optionRects.push({ x: optX, y: oy, w: optW, h: optH });

        let bgColor = 'rgba(255,255,255,0.06)';
        let borderColor = 'rgba(255,255,255,0.12)';
        let textColor = COLORS.white;

        if (G.showingResult) {
            if (G.currentQ.options[i] === G.currentQ.down) {
                bgColor = 'rgba(68,255,136,0.2)';
                borderColor = COLORS.green;
                textColor = COLORS.green;
            } else if (i === G.selectedOption && !G.resultCorrect) {
                bgColor = 'rgba(255,68,68,0.2)';
                borderColor = COLORS.red;
                textColor = COLORS.red;
            }
        }

        ctx.fillStyle = bgColor;
        roundRect(optX, oy, optW, optH, 10 * s);
        ctx.fill();
        ctx.strokeStyle = borderColor;
        ctx.lineWidth = 1.5;
        roundRect(optX, oy, optW, optH, 10 * s);
        ctx.stroke();

        // Option number
        drawText((i + 1) + '.', optX + 22 * s, oy + optH / 2, 14 * s, COLORS.gold, 'left');
        // Option text
        drawText(G.currentQ.options[i], cx + 10 * s, oy + optH / 2, 18 * s, textColor);
    }

    // Timer bar
    if (G.timerActive) {
        G.timeLeft -= 1 / 60;
        G.totalTime += 1 / 60;
        if (G.timeLeft <= 0) {
            G.timeLeft = 0;
            // Time up - wrong answer
            G.showingResult = true;
            G.resultCorrect = false;
            G.resultTimer = 90;
            G.timerActive = false;
            G.combo = 0;
            G.wrong++;
            G.lives--;
            G.shakeTimer = 15;
            if (G.lives <= 0) {
                saveHighScore();
                G.screen = SCREEN.GAMEOVER;
            }
        }
    }

    const timerY = optStartY + G.currentQ.options.length * (optH + optGap) + 10 * s;
    const timerW = cardW;
    const timerH = 8 * s;
    const pct = Math.max(0, G.timeLeft / G.timePerQ);
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    roundRect(optX, timerY, timerW, timerH, 4 * s);
    ctx.fill();
    const tColor = pct > 0.5 ? COLORS.green : pct > 0.2 ? COLORS.gold : COLORS.red;
    if (pct > 0) {
        ctx.fillStyle = tColor;
        roundRect(optX, timerY, timerW * pct, timerH, 4 * s);
        ctx.fill();
    }
    drawText(Math.ceil(G.timeLeft) + 's', cx, timerY + timerH + 14 * s, 12 * s, COLORS.gray);

    // Hint button
    if (!G.hintUsed && !G.showingResult) {
        const hintW = 60 * s, hintH = 30 * s;
        const hintX = cx - hintW / 2, hintY = H * 0.85;
        ctx.fillStyle = 'rgba(255,215,0,0.15)';
        roundRect(hintX, hintY, hintW, hintH, 8 * s);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,215,0,0.3)';
        ctx.lineWidth = 1;
        roundRect(hintX, hintY, hintW, hintH, 8 * s);
        ctx.stroke();
        drawText('提示(H)', cx, hintY + hintH / 2, 11 * s, COLORS.gold);
    }

    // Hint text
    if (G.hintAlpha > 0) {
        G.hintAlpha -= 0.005;
        ctx.globalAlpha = Math.max(0, G.hintAlpha);
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        roundRect(cardX, H * 0.78, cardW, 35 * s, 8 * s);
        ctx.fill();
        drawText('提示: ' + G.currentQ.tip, cx, H * 0.78 + 18 * s, 13 * s, COLORS.gold);
        ctx.globalAlpha = 1;
    }

    // Result feedback
    if (G.showingResult) {
        G.resultTimer--;
        if (G.resultTimer <= 0) {
            G.showingResult = false;
            nextQuestion();
        }

        // Feedback text
        const fbY = qY - 10 * s;
        if (G.resultCorrect) {
            ctx.globalAlpha = Math.min(1, G.resultTimer / 30);
            drawShadowText('正确! +' + (G.difficulty * 10 + Math.min(G.combo - 1, 10) * 5), cx, fbY, 20 * s, COLORS.green);
            ctx.globalAlpha = 1;
        } else {
            ctx.globalAlpha = Math.min(1, G.resultTimer / 30);
            drawShadowText('错误! 正确答案: ' + G.currentQ.down, cx, fbY, 18 * s, COLORS.red);
            ctx.globalAlpha = 1;
        }
    }

    // Progress
    const totalDone = (G.difficulty - 1) * 10 + (10 - G.questionPool.length - (G.showingResult ? 0 : 1));
    const totalAll = 50;
    drawText('进度: ' + Math.min(totalDone, totalAll) + '/' + totalAll, cx, H - 15 * s, 11 * s, 'rgba(255,255,255,0.3)');

    if (G.shakeTimer > 0) ctx.restore();
}

function drawGameOver(time) {
    const cx = W / 2;
    const s = scale;

    // Panel
    const panelW = Math.min(W - 40 * s, 360 * s);
    const panelH = 380 * s;
    const px = cx - panelW / 2;
    const py = H / 2 - panelH / 2;

    ctx.fillStyle = 'rgba(15,10,30,0.95)';
    roundRect(px, py, panelW, panelH, 20 * s);
    ctx.fill();
    ctx.strokeStyle = COLORS.gold;
    ctx.lineWidth = 2;
    roundRect(px, py, panelW, panelH, 20 * s);
    ctx.stroke();

    // Title
    const isWin = G.difficulty > 5 || G.lives > 0;
    if (isWin) {
        drawShadowText('恭喜通关!', cx, py + 40 * s, 28 * s, COLORS.gold);
    } else {
        drawShadowText('游戏结束', cx, py + 40 * s, 28 * s, COLORS.red);
    }

    // Stats
    const statsY = py + 90 * s;
    const lineH = 32 * s;
    drawText('最终得分: ' + G.score, cx, statsY, 20 * s, COLORS.gold);
    drawText('最高记录: ' + G.highScore, cx, statsY + lineH, 14 * s, G.score >= G.highScore ? COLORS.green : COLORS.gray);

    if (G.score >= G.highScore && G.score > 0) {
        drawText('新纪录!', cx, statsY + lineH * 2, 16 * s, COLORS.accent);
    }

    const infoY = statsY + lineH * 3;
    drawText('正确: ' + G.correct + '  错误: ' + G.wrong, cx, infoY, 13 * s, COLORS.white);
    drawText('最高连击: ' + G.maxCombo, cx, infoY + lineH * 0.7, 13 * s, COLORS.blue);
    drawText('通关难度: ' + ['','入门','初学','进阶','挑战','大师'][Math.min(G.difficulty, 5)], cx, infoY + lineH * 1.4, 13 * s, COLORS.purple);

    // Buttons
    const bw = 180 * s, bh = 45 * s;
    const bx = cx - bw / 2;

    // Restart
    const grad1 = ctx.createLinearGradient(bx, H * 0.65, bx + bw, H * 0.65 + bh);
    grad1.addColorStop(0, '#ffd700');
    grad1.addColorStop(1, '#ff8c00');
    roundRect(bx, H * 0.65, bw, bh, 10 * s);
    ctx.fillStyle = grad1;
    ctx.fill();
    drawText('再来一局', cx, H * 0.65 + bh / 2, 16 * s, '#1a0a00');

    // Back
    roundRect(bx, H * 0.65 + bh + 15 * s, bw, bh, 10 * s);
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.lineWidth = 1;
    roundRect(bx, H * 0.65 + bh + 15 * s, bw, bh, 10 * s);
    ctx.stroke();
    drawText('返回菜单', cx, H * 0.65 + bh + 15 * s + bh / 2, 16 * s, COLORS.white);
}

// ==================== Game Loop ====================
function gameLoop(time) {
    // Fade in
    if (G.fadeIn > 0) {
        G.fadeIn -= 0.03;
    }

    // Clear
    ctx.clearRect(0, 0, W, H);
    drawBg(time);

    // Draw screen
    if (G.screen === SCREEN.MENU) {
        drawMenu(time);
    } else if (G.screen === SCREEN.PLAYING) {
        drawPlaying(time);
    } else if (G.screen === SCREEN.GAMEOVER) {
        drawGameOver(time);
    }

    // Particles (always on top)
    updateParticles();
    drawParticles();

    // Fade overlay
    if (G.fadeIn > 0) {
        ctx.globalAlpha = G.fadeIn;
        ctx.fillStyle = COLORS.bg1;
        ctx.fillRect(0, 0, W, H);
        ctx.globalAlpha = 1;
    }

    G.animationId = requestAnimationFrame(gameLoop);
}

// ==================== Init ====================
function init() {
    resize();
    window.addEventListener('resize', resize);
    c.addEventListener('click', handleClick);
    c.addEventListener('touchstart', handleTouch, { passive: false });
    window.addEventListener('keydown', handleKey);
    loadHighScore();
    initBgStars();
    gameLoop();
}

init();
})();
