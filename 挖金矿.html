<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>挖金矿 - 黄金矿工</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1a2e;font-family:"Microsoft YaHei","PingFang SC",sans-serif;touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#game-wrapper{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
canvas{display:block;border-radius:8px;box-shadow:0 0 40px rgba(255,180,50,.15)}
#ui-layer{position:absolute;top:0;left:50%;transform:translateX(-50%);pointer-events:none;display:flex;flex-direction:column;align-items:center}
#hud{display:flex;gap:20px;padding:8px 16px;background:rgba(0,0,0,.6);border-radius:0 0 12px 12px;color:#ffd700;font-size:14px;font-weight:bold;pointer-events:auto}
.hud-item{display:flex;align-items:center;gap:4px}
.hud-item .icon{font-size:18px}
#shop-btn{position:absolute;top:50px;left:50%;transform:translateX(-50%);pointer-events:auto;background:rgba(255,180,50,.15);border:1px solid rgba(255,180,50,.3);color:#ffb432;padding:6px 16px;border-radius:16px;cursor:pointer;font-size:13px;font-weight:bold;transition:.2s;display:none}
#shop-btn:hover{background:rgba(255,180,50,.25)}
#shop-panel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:auto;background:rgba(20,20,40,.97);border:1px solid rgba(255,180,50,.3);border-radius:16px;padding:20px;display:none;flex-direction:column;gap:12px;min-width:260px;z-index:10}
#shop-panel h3{color:#ffd700;text-align:center;font-size:18px;margin-bottom:4px}
.shop-item{display:flex;align-items:center;gap:10px;padding:10px;background:rgba(255,255,255,.05);border-radius:10px;cursor:pointer;transition:.2s;border:1px solid transparent}
.shop-item:hover{background:rgba(255,255,255,.1);border-color:rgba(255,180,50,.3)}
.shop-item .s-icon{font-size:28px;min-width:36px;text-align:center}
.shop-item .s-info{flex:1}
.shop-item .s-name{color:#ffd700;font-size:14px;font-weight:bold}
.shop-item .s-desc{color:#aaa;font-size:11px}
.shop-item .s-cost{color:#ff6b6b;font-size:13px;font-weight:bold}
.shop-item.bought{opacity:.4;pointer-events:none}
.shop-item.bought .s-cost{color:#4a4}
#shop-close{margin-top:4px;padding:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:10px;color:#ccc;cursor:pointer;font-size:14px;text-align:center;transition:.2s}
#shop-close:hover{background:rgba(255,255,255,.15)}
#overlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:auto;background:rgba(20,20,40,.95);border:1px solid rgba(255,180,50,.3);border-radius:16px;padding:24px;display:none;flex-direction:column;align-items:center;gap:12px;z-index:10;min-width:240px;text-align:center}
#overlay h2{color:#ffd700;font-size:22px}
#overlay p{color:#ccc;font-size:14px;line-height:1.6}
#overlay .btn{display:inline-block;padding:10px 28px;background:rgba(255,180,50,.2);border:1px solid rgba(255,180,50,.4);border-radius:20px;color:#ffd700;cursor:pointer;font-size:15px;font-weight:bold;transition:.2s;margin:4px}
#overlay .btn:hover{background:rgba(255,180,50,.35)}
#overlay .btn.secondary{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#aaa}
#overlay .btn.secondary:hover{background:rgba(255,255,255,.2);color:#fff}
#dynamite-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;color:#ff6b4a;font-size:16px;font-weight:bold;display:none;text-shadow:0 0 10px rgba(255,100,50,.5);animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.6;transform:translate(-50%,-50%) scale(1)}to{opacity:1;transform:translate(-50%,-50%) scale(1.1)}}
</style>
<style>
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);height:90px;max-height:90px;overflow:hidden;contain:layout style paint;pointer-events:none!important}.ad-banner-container,.ad-banner-container *{pointer-events:none!important}.ad-banner-container iframe{max-height:90px;pointer-events:none!important}
.ad-banner-container iframe{max-width:100%}
.ad-label{position:absolute;top:1px;right:6px;font:9px "Microsoft YaHei",sans-serif;color:rgba(255,255,255,.35)}
.sponsor-btn{position:fixed;top:44px;right:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:3px 9px;border-radius:10px;font:11px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .qr-row{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.sponsor-panel .qr-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px;text-align:center;min-width:140px}
.sponsor-panel .qr-card .qr-icon{font-size:48px;margin-bottom:6px}
.sponsor-panel .qr-card .qr-label{color:#ccc;font:13px "Microsoft YaHei",sans-serif}
.sponsor-panel .qr-card .qr-hint{color:#888;font:11px "Microsoft YaHei",sans-serif;margin-top:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.interstitial-ad .ad-content{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;text-align:center;min-width:280px;max-width:400px}
.interstitial-ad .ad-content p{color:#aaa;font:14px "Microsoft YaHei",sans-serif;margin-bottom:12px}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
</style>
</head>
<body>
<div id="game-wrapper">
<canvas id="game"></canvas>
<div id="ui-layer">
<div id="hud">
<div class="hud-item"><span class="icon">🪙</span><span id="hud-money">0</span></div>
<div class="hud-item"><span class="icon">🎯</span><span id="hud-target">目标:300</span></div>
<div class="hud-item"><span class="icon">⭐</span><span id="hud-level">第1关</span></div>
<div class="hud-item"><span class="icon">⏱️</span><span id="hud-time">60</span></div>
</div>
<button id="shop-btn" onclick="openShop()">🛒 商店</button>
<div id="shop-panel">
<h3>🛒 道具商店</h3>
<div class="shop-item" id="shop-dynamite" onclick="buyItem('dynamite')">
<div class="s-icon">💣</div><div class="s-info"><div class="s-name">炸药</div><div class="s-desc">炸掉当前抓取的物品，腾出钩子</div></div><div class="s-cost">💰50</div>
</div>
<div class="shop-item" id="shop-strength" onclick="buyItem('strength')">
<div class="s-icon">💪</div><div class="s-info"><div class="s-name">力量药水</div><div class="s-desc">本关回收速度提升50%</div></div><div class="s-cost">💰80</div>
</div>
<div class="shop-item" id="shop-lucky" onclick="buyItem('lucky')">
<div class="s-icon">🍀</div><div class="s-info"><div class="s-name">幸运草</div><div class="s-desc">本关出现更多钻石和大金块</div></div><div class="s-cost">💰100</div>
</div>
<button id="shop-close" onclick="closeShop()">关闭商店</button>
</div>
<div id="dynamite-hint">💣 点击物品使用炸药!</div>
<div id="overlay">
<h2 id="overlay-title"></h2>
<p id="overlay-msg"></p>
<div id="overlay-btns"></div>
</div>
</div>
</div>
<div class="ad-banner-container" id="adBanner"><div class="ad-label">广告</div><div id="adSlot" style="width:728px;max-width:100%;height:90px;display:flex;align-items:center;justify-content:center;color:#888;font:12px 'Microsoft YaHei',sans-serif">广告加载中...</div></div>
<button class="sponsor-btn" id="sponsorBtn">☕ 赞助</button>
<div class="sponsor-panel" id="sponsorPanel">
<h2>💛 支持开发者</h2>
<div style="color:#aaa;font:14px 'Microsoft YaHei',sans-serif;text-align:center;max-width:280px">如果你喜欢这个游戏，请开发者喝杯咖啡吧 ☕<br>每一份支持都是持续更新的动力！</div>
<div class="qr-row">
<div class="qr-card"><div class="qr-icon">💚</div><div class="qr-label">微信赞赏</div><div class="qr-hint">打开微信扫一扫</div></div>
<div class="qr-card"><div class="qr-icon">💙</div><div class="qr-label">支付宝支持</div><div class="qr-hint">打开支付宝扫一扫</div></div>
</div>
<button class="sponsor-close" id="sponsorClose">关闭</button>
</div>
<div class="interstitial-ad" id="interstitialAd">
<div class="ad-content">
<p>📢 赞助商广告</p>
<div id="interstitialAdSlot" style="min-height:250px;display:flex;align-items:center;justify-content:center;color:#888;font:13px 'Microsoft YaHei',sans-serif">广告加载中...</div>
</div>
<button class="skip-btn" id="skipInterstitial">跳过广告 ▶</button>
</div>
<script>
(function(){
var canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
var W,H,cx,cy;
var GAME_W=480,GAME_H=700;
var scale=1;

function resize(){
var ww=window.innerWidth,wh=window.innerHeight;
var maxW=Math.min(ww-8,480),maxH=Math.min(wh-120,750);
scale=Math.min(maxW/GAME_W,maxH/GAME_H);
W=Math.floor(GAME_W*scale);H=Math.floor(GAME_H*scale);
canvas.width=W;canvas.height=H;
canvas.style.width=W+'px';canvas.style.height=H+'px';
cx=W/2;cy=0;
}
resize();
window.addEventListener('resize',resize);

// roundRect polyfill
if(!ctx.roundRect){
ctx.roundRect=function(x,y,w,h,r){
if(typeof r==='number')r={tl:r,tr:r,br:r,bl:r};
ctx.beginPath();
ctx.moveTo(x+r.tl,y);
ctx.lineTo(x+w-r.tr,y);
ctx.quadraticCurveTo(x+w,y,x+w,y+r.tr);
ctx.lineTo(x+w,y+h-r.br);
ctx.quadraticCurveTo(x+w,y+h,x+w-r.br,y+h);
ctx.lineTo(x+r.bl,y+h);
ctx.quadraticCurveTo(x,y+h,x,y+h-r.bl);
ctx.lineTo(x,y+r.tl);
ctx.quadraticCurveTo(x,y,x+r.tl,y);
ctx.closePath();
};
}

// 音效模拟
var sfx={};
function playSfx(n){try{if(sfx[n]){sfx[n].currentTime=0;sfx[n].play().catch(function(){})}}catch(e){}}
function initAudio(){
var ctx2=new(window.AudioContext||window.webkitAudioContext)();
function beep(f,d,t,w){
var o=ctx2.createOscillator(),g=ctx2.createGain();
o.type=t||'square';o.frequency.value=f;
g.gain.setValueAtTime(w||.05,ctx2.currentTime);
g.gain.exponentialRampToValueAtTime(.001,ctx2.currentTime+d);
o.connect(g);g.connect(ctx2.destination);
o.start();o.stop(ctx2.currentTime+d);
}
return{shoot:function(){beep(200,.15,'square',.04);beep(300,.1,'square',.03)},
grab:function(){beep(500,.08,'square',.04);beep(600,.08,'square',.03)},
money:function(){beep(800,.1,'triangle',.05);beep(1000,.15,'triangle',.04)},
diamond:function(){beep(1200,.1,'triangle',.05);beep(1500,.15,'triangle',.04)},
rock:function(){beep(80,.2,'sawtooth',.04)},
levelup:function(){beep(600,.1,'triangle',.05);beep(800,.1,'triangle',.05);beep(1000,.2,'triangle',.04)},
buy:function(){beep(400,.08,'triangle',.04);beep(500,.08,'triangle',.03)},
fail:function(){beep(200,.3,'sawtooth',.06);beep(150,.4,'sawtooth',.05)},
bomb:function(){beep(50,.3,'sawtooth',.08)}
}}
try{sfx=initAudio()}catch(e){}

// 游戏状态
var STATE={TITLE:'title',PLAYING:'playing',SHOP:'shop',LEVEL_COMPLETE:'levelComplete',GAME_OVER:'gameOver'};
var state=STATE.TITLE;
var money=0,totalScore=0,level=1;
var levelTarget=300,timeLeft=60,timerInterval=null;
var items=[],hook={};
var strengthActive=false,luckyActive=false;
var dynamiteCount=0;
var titleAnim=0;

// 物品定义
var ITEM_TYPES={
gold_small:{name:'小金块',value:50,weight:1,color:'#ffd700',size:14,icon:'🟡'},
gold_medium:{name:'金块',value:150,weight:2,color:'#ffb800',size:22,icon:'🟠'},
gold_large:{name:'大金块',value:400,weight:4,color:'#ff8c00',size:32,icon:'🔶'},
diamond:{name:'钻石',value:600,weight:.5,color:'#00e5ff',size:16,icon:'💎'},
rock:{name:'石头',value:20,weight:5,color:'#888',size:26,icon:'🪨'},
bone:{name:'骨头',value:10,weight:1.5,color:'#ddd',size:18,icon:'🦴'}
};

// 钩子状态
var HOOK_SPEED=280,HOOK_RETRACT_SPEED=180;
var hookX=cx,hookY=80, // 锚点
hookAngle=0,hookAngleSpeed=1.5, // 摆动
hookLength=0,hookMaxLength=0,
hookState='swing', // swing, extending, retracting
hookGrabbed=null;

function resetHook(){
hookX=cx;hookY=80*scale;
hookAngle=0;hookAngleSpeed=1.5;
hookLength=0;hookState='swing';
hookGrabbed=null;
document.getElementById('dynamite-hint').style.display='none';
document.getElementById('shop-btn').style.display='block';
}

function getHookTip(){
var rad=hookAngle*Math.PI/180;
var cx2=hookX+Math.sin(rad)*hookLength;
var cy2=hookY+Math.cos(rad)*hookLength;
return{x:cx2,y:cy2};
}

// 生成物品
function generateItems(){
items=[];
var count=8+level*2;
var baseY=hookY+60;
var availH=H-baseY-20;
var types=['gold_small','gold_small','gold_medium','gold_medium','gold_medium','gold_large','diamond','rock','rock','bone','bone'];
if(luckyActive){
types.push('diamond','diamond','gold_large','gold_large','gold_medium');
}
for(var i=0;i<count;i++){
var t=types[Math.floor(Math.random()*types.length)];
var it=ITEM_TYPES[t];
var attempts=0;
var ix,iy,overlap;
do{
ix=30+Math.random()*(W-60);
iy=baseY+Math.random()*availH;
overlap=false;
for(var j=0;j<items.length;j++){
var dx=items[j].x-ix,dy=items[j].y-iy;
if(Math.sqrt(dx*dx+dy*dy)<it.size+items[j].size+8){overlap=true;break}
}
attempts++;
}while(overlap&&attempts<20);
items.push({type:t,x:ix,y:iy,size:it.size,value:it.value,weight:it.weight,color:it.color,icon:it.icon,name:it.name});
}
// 确保至少1个可达目标金额的物品
var hasEnough=items.some(function(it){return it.value>=levelTarget/2});
if(!hasEnough){
var idx=Math.floor(Math.random()*items.length);
items[idx]={type:'gold_large',x:items[idx].x,y:items[idx].y,size:ITEM_TYPES.gold_large.size,value:ITEM_TYPES.gold_large.value,weight:ITEM_TYPES.gold_large.weight,color:ITEM_TYPES.gold_large.color,icon:ITEM_TYPES.gold_large.icon,name:ITEM_TYPES.gold_large.name};
}
}

function startLevel(){
generateItems();
resetHook();
money=0;
timeLeft=55+level*5;
if(timeLeft>90)timeLeft=90;
levelTarget=300+level*150;
document.getElementById('hud-target').textContent='目标:'+levelTarget;
document.getElementById('hud-level').textContent='第'+level+'关';
document.getElementById('hud-money').textContent=money;
document.getElementById('shop-btn').style.display='block';
strengthActive=false;luckyActive=false;
dynamiteCount=0;
updateShopUI();
state=STATE.PLAYING;
clearInterval(timerInterval);
timerInterval=setInterval(tick,1000);
}

function tick(){
if(state!==STATE.PLAYING)return;
timeLeft--;
if(timeLeft<=0){
timeLeft=0;
endLevel(false);
}
updateHUD();
}

function updateHUD(){
document.getElementById('hud-time').textContent=timeLeft;
document.getElementById('hud-money').textContent=money;
if(timeLeft<=10)document.getElementById('hud-time').style.color='#ff4444';
else document.getElementById('hud-time').style.color='#ffd700';
}

function endLevel(success){
clearInterval(timerInterval);
state=STATE.LEVEL_COMPLETE;
if(success){
totalScore+=money;
updateHUD();
document.getElementById('overlay-title').textContent='🎉 过关!';
document.getElementById('overlay-msg').innerHTML='获得金币: 💰'+money+'<br>累计总分: ⭐'+totalScore+'<br>目标金额: 🎯'+levelTarget;
document.getElementById('overlay-btns').innerHTML='<button class="btn" onclick="nextLevel()">下一关 ▶</button>';
document.getElementById('overlay').style.display='flex';
document.getElementById('shop-btn').style.display='none';
if(sfx.levelup)sfx.levelup();
}else{
document.getElementById('overlay-title').textContent='⏰ 时间到!';
document.getElementById('overlay-msg').innerHTML='获得金币: 💰'+money+'<br>目标金额: 🎯'+levelTarget+'<br>还差: 💰'+(levelTarget-money);
document.getElementById('overlay-btns').innerHTML='<button class="btn" onclick="retryLevel()">再试一次 🔄</button><button class="btn secondary" onclick="restartGame()">重新开始</button>';
document.getElementById('overlay').style.display='flex';
document.getElementById('shop-btn').style.display='none';
if(sfx.fail)sfx.fail();
showInterstitialAd();
}
}

function nextLevel(){
document.getElementById('overlay').style.display='none';
level++;
startLevel();
}

function retryLevel(){
document.getElementById('overlay').style.display='none';
startLevel();
}

function restartGame(){
document.getElementById('overlay').style.display='none';
money=0;totalScore=0;level=1;
startLevel();
}

// 商店
function openShop(){
if(state!==STATE.PLAYING)return;
state=STATE.SHOP;
document.getElementById('shop-panel').style.display='flex';
updateShopUI();
}

function closeShop(){
document.getElementById('shop-panel').style.display='none';
if(state===STATE.SHOP)state=STATE.PLAYING;
}

function updateShopUI(){
var ds=document.getElementById('shop-dynamite');
var ss=document.getElementById('shop-strength');
var ls=document.getElementById('shop-lucky');
if(dynamiteCount>=3)ds.classList.add('bought');
else ds.classList.remove('bought');
if(strengthActive)ss.classList.add('bought');
else ss.classList.remove('bought');
if(luckyActive)ls.classList.add('bought');
else ls.classList.remove('bought');
}

function buyItem(type){
if(state!==STATE.SHOP)return;
if(type==='dynamite'){
if(dynamiteCount>=3)return;
if(money<50)return;
money-=50;dynamiteCount++;
if(sfx.buy)sfx.buy();
}else if(type==='strength'){
if(strengthActive)return;
if(money<80)return;
money-=80;strengthActive=true;
if(sfx.buy)sfx.buy();
}else if(type==='lucky'){
if(luckyActive)return;
if(money<100)return;
money-=100;luckyActive=true;
if(sfx.buy)sfx.buy();
}
updateHUD();
updateShopUI();
}

// 物理更新
var lastTime=0;
function update(dt){
if(state!==STATE.PLAYING){titleAnim+=dt;return}
if(dt>.1)dt=.1;

if(hookState==='swing'){
hookAngle+=hookAngleSpeed*60*dt;
if(hookAngle>75){hookAngle=75;hookAngleSpeed=-Math.abs(hookAngleSpeed)}
if(hookAngle<-75){hookAngle=-75;hookAngleSpeed=Math.abs(hookAngleSpeed)}
hookLength=30*scale;
}else if(hookState==='extending'){
hookLength+=HOOK_SPEED*scale*dt;
var tip=getHookTip();
if(tip.y>H-10||tip.x<0||tip.x>W){
hookState='retracting';
return;
}
// 碰撞检测
for(var i=0;i<items.length;i++){
var it=items[i];
var dx=tip.x-it.x,dy=tip.y-it.y;
if(Math.sqrt(dx*dx+dy*dy)<it.size+8){
hookGrabbed=it;
hookState='retracting';
items.splice(i,1);
if(sfx.grab)sfx.grab();
if(dynamiteCount>0&&it.value<levelTarget/2){
document.getElementById('dynamite-hint').style.display='block';
}
break;
}
}
}else if(hookState==='retracting'){
var retractSpeed=HOOK_RETRACT_SPEED;
if(strengthActive)retractSpeed*=1.5;
if(hookGrabbed)retractSpeed/=hookGrabbed.weight;
hookLength-=retractSpeed*scale*dt;
if(hookLength<=30*scale){
if(hookGrabbed){
money+=hookGrabbed.value;
if(hookGrabbed.type==='diamond'&&sfx.diamond)sfx.diamond();
else if(hookGrabbed.type==='rock'&&sfx.rock)sfx.rock();
else if(sfx.money)sfx.money();
if(money>=levelTarget){
updateHUD();
endLevel(true);
return;
}
}
resetHook();
updateHUD();
}
}
}

// 渲染
function draw(){
ctx.clearRect(0,0,W,H);

// 深色矿洞背景
var bgGrad=ctx.createLinearGradient(0,0,0,H);
bgGrad.addColorStop(0,'#1a1a2e');
bgGrad.addColorStop(.15,'#16213e');
bgGrad.addColorStop(.3,'#0f3460');
bgGrad.addColorStop(.7,'#1a1a2e');
bgGrad.addColorStop(1,'#0d0d1a');
ctx.fillStyle=bgGrad;
ctx.fillRect(0,0,W,H);

// 矿洞纹理
ctx.fillStyle='rgba(255,255,255,.02)';
for(var i=0;i<30;i++){
var tx=((i*137+50)%W),ty=80+((i*97+30)%(H-80));
ctx.fillRect(tx,ty,2+Math.random()*3,1+Math.random()*2);
}

// 地面线
ctx.strokeStyle='#2a2a4a';
ctx.lineWidth=2;
ctx.beginPath();
ctx.moveTo(0,hookY);
ctx.lineTo(W,hookY);
ctx.stroke();

// 矿洞墙壁
ctx.fillStyle='#1a1a30';
ctx.fillRect(0,hookY,10,H-hookY);
ctx.fillRect(W-10,hookY,10,H-hookY);

// 矿洞石纹
ctx.strokeStyle='rgba(255,255,255,.04)';
ctx.lineWidth=1;
for(var i=0;i<8;i++){
var wy=hookY+20+i*((H-hookY-20)/8);
ctx.beginPath();
ctx.moveTo(0,wy);
ctx.quadraticCurveTo(W/4,wy+15,0,wy+30);
ctx.stroke();
ctx.beginPath();
ctx.moveTo(W,wy-10);
ctx.quadraticCurveTo(W*3/4,wy+10,W,wy+25);
ctx.stroke();
}

// 矿工
var minerX=hookX,minerY=hookY-10;
drawMiner(minerX,minerY);

// 物品
for(var i=0;i<items.length;i++){
var it=items[i];
drawItem(it.x,it.y,it);
}

// 钩子绳索
if(hookState!=='swing'||hookLength>0){
var tip=getHookTip();
ctx.strokeStyle='#8B7355';
ctx.lineWidth=2.5;
ctx.beginPath();
ctx.moveTo(hookX,hookY);
ctx.lineTo(tip.x,tip.y);
ctx.stroke();
// 绳索高光
ctx.strokeStyle='rgba(255,255,255,.15)';
ctx.lineWidth=1;
ctx.beginPath();
ctx.moveTo(hookX+1,hookY);
ctx.lineTo(tip.x+1,tip.y);
ctx.stroke();
}

// 钩爪
var tip=getHookTip();
drawHook(tip.x,tip.y,hookAngle);

// 如果抓住了物品，画在钩爪上
if(hookGrabbed&&hookState==='retracting'){
drawItem(tip.x,tip.y+15,hookGrabbed);
}

// 标题画面
if(state===STATE.TITLE){
ctx.fillStyle='rgba(0,0,0,.7)';
ctx.fillRect(0,0,W,H);
var titleY=H*.35;
ctx.fillStyle='#ffd700';
ctx.font='bold '+Math.floor(36*scale)+'px "Microsoft YaHei","PingFang SC",sans-serif';
ctx.textAlign='center';
ctx.fillText('⛏️ 挖金矿',W/2,titleY);
ctx.fillStyle='#ccc';
ctx.font=Math.floor(14*scale)+'px "Microsoft YaHei","PingFang SC",sans-serif';
ctx.fillText('黄金矿工',W/2,titleY+Math.floor(30*scale));
ctx.fillText('点击屏幕发射钩爪，抓取金块!',W/2,titleY+Math.floor(60*scale));
ctx.fillText('注意时间限制，每关有目标金额',W/2,titleY+Math.floor(80*scale));
var btnAlpha=.5+Math.sin(titleAnim*3)*.5;
ctx.fillStyle='rgba(255,180,50,'+btnAlpha+')';
ctx.font='bold '+Math.floor(18*scale)+'px "Microsoft YaHei","PingFang SC",sans-serif';
ctx.fillText('👆 点击开始游戏',W/2,titleY+Math.floor(120*scale));
}

function drawMiner(x,y){
var s=scale;
// 身体
ctx.fillStyle='#4a90d9';
ctx.fillRect(x-12*s,y-20*s,24*s,30*s);
// 头
ctx.fillStyle='#ffd5b8';
ctx.beginPath();
ctx.arc(x,y-26*s,10*s,0,Math.PI*2);
ctx.fill();
// 帽子
ctx.fillStyle='#8B4513';
ctx.fillRect(x-13*s,y-38*s,26*s,8*s);
ctx.fillRect(x-8*s,y-43*s,16*s,6*s);
// 眼睛
ctx.fillStyle='#000';
ctx.fillRect(x-4*s,y-30*s,3*s,3*s);
ctx.fillRect(x+2*s,y-30*s,3*s,3*s);
// 手臂
ctx.strokeStyle='#ffd5b8';
ctx.lineWidth=3*s;
ctx.beginPath();
ctx.moveTo(x-12*s,y-15*s);
ctx.lineTo(x-15*s,y-5*s);
ctx.stroke();
ctx.beginPath();
ctx.moveTo(x+12*s,y-15*s);
ctx.lineTo(x+15*s,y-5*s);
ctx.stroke();
// 镐头
ctx.fillStyle='#888';
ctx.beginPath();
ctx.moveTo(x-10*s,y-5*s);
ctx.lineTo(x-18*s,y-8*s);
ctx.lineTo(x-16*s,y-2*s);
ctx.closePath();
ctx.fill();
}

function drawItem(x,y,it){
var s=scale;
// 发光效果
ctx.shadowColor=it.color;
ctx.shadowBlur=8*s;
ctx.fillStyle=it.color;
ctx.beginPath();
if(it.type==='diamond'){
var hs=it.size*s;
ctx.moveTo(x,y-hs);
ctx.lineTo(x+hs*.6,y);
ctx.lineTo(x,y+hs);
ctx.lineTo(x-hs*.6,y);
ctx.closePath();
}else if(it.type==='bone'){
ctx.ellipse(x,y,it.size*s,it.size*.6*s,.3,0,Math.PI*2);
ctx.fill();
ctx.fillStyle='#fff';
ctx.ellipse(x-it.size*.3*s,y-it.size*.2*s,it.size*.3*s,it.size*.25*s,0,0,Math.PI*2);
ctx.fill();
ctx.ellipse(x+it.size*.3*s,y+it.size*.2*s,it.size*.3*s,it.size*.25*s,0,0,Math.PI*2);
ctx.fill();
ctx.shadowBlur=0;
return;
}else if(it.type==='rock'){
ctx.beginPath();
ctx.moveTo(x-it.size*s,y);
ctx.quadraticCurveTo(x-it.size*.7*s,y-it.size*.8*s,x,y-it.size*s);
ctx.quadraticCurveTo(x+it.size*.7*s,y-it.size*.6*s,x+it.size*s,y+it.size*.1*s);
ctx.quadraticCurveTo(x+it.size*.5*s,y+it.size*.6*s,x,y+it.size*.7*s);
ctx.quadraticCurveTo(x-it.size*.5*s,y+it.size*.5*s,x-it.size*s,y);
ctx.fill();
ctx.fillStyle='rgba(255,255,255,.2)';
ctx.beginPath();
ctx.arc(x-it.size*.25*s,y-it.size*.3*s,it.size*.3*s,0,Math.PI*2);
ctx.fill();
}else{
// 金块
ctx.beginPath();
ctx.roundRect(x-it.size*s,y-it.size*.7*s,it.size*2*s,it.size*1.4*s,4*s);
ctx.fill();
// 高光
ctx.fillStyle='rgba(255,255,255,.3)';
ctx.beginPath();
ctx.roundRect(x-it.size*.6*s,y-it.size*.5*s,it.size*1.2*s,it.size*.5*s,3*s);
ctx.fill();
// $符号
ctx.fillStyle='rgba(0,0,0,.3)';
ctx.font='bold '+(it.size*.8*s)+'px "Microsoft YaHei",sans-serif';
ctx.textAlign='center';
ctx.fillText('$',x,y+it.size*.3*s);
}
ctx.shadowBlur=0;
}

function drawHook(x,y,angle){
var s=scale;
ctx.save();
ctx.translate(x,y);
ctx.rotate(angle*Math.PI/180);
// 钩爪主体
ctx.fillStyle='#666';
ctx.fillRect(-3*s,0,6*s,15*s);
// 钩子弯
ctx.strokeStyle='#888';
ctx.lineWidth=3*s;
ctx.beginPath();
ctx.moveTo(-3*s,15*s);
ctx.quadraticCurveTo(-5*s,20*s,0,24*s);
ctx.quadraticCurveTo(5*s,20*s,3*s,15*s);
ctx.stroke();
// 钩尖
ctx.fillStyle='#aaa';
ctx.beginPath();
ctx.moveTo(0,24*s);
ctx.lineTo(-4*s,20*s);
ctx.lineTo(0,18*s);
ctx.fill();
ctx.restore();
}

// 游戏循环
function gameLoop(timestamp){
if(!lastTime)lastTime=timestamp;
var dt=(timestamp-lastTime)/1000;
lastTime=timestamp;
update(dt);
draw();
requestAnimationFrame(gameLoop);
}

// 输入处理
function handleClick(ex,ey){
if(state===STATE.TITLE){
startLevel();
return;
}
if(state===STATE.SHOP)return;
if(state===STATE.LEVEL_COMPLETE)return;
if(state!==STATE.PLAYING)return;

// 正在回收且有炸药 → 一键炸掉物品
if(hookState==='retracting'&&hookGrabbed&&dynamiteCount>0){
hookGrabbed=null;
dynamiteCount--;
document.getElementById('dynamite-hint').style.display='none';
resetHook();
if(sfx.bomb)sfx.bomb();
updateShopUI();
return;
}

if(hookState==='swing'){
hookState='extending';
hookMaxLength=H-hookY;
if(sfx.shoot)sfx.shoot();
document.getElementById('shop-btn').style.display='none';
}
}

canvas.addEventListener('click',function(e){
var rect=canvas.getBoundingClientRect();
var ex=(e.clientX-rect.left)*(GAME_W/rect.width);
var ey=(e.clientY-rect.top)*(GAME_H/rect.height);
handleClick(ex,ey);
});

canvas.addEventListener('touchstart',function(e){
e.preventDefault();
var rect=canvas.getBoundingClientRect();
var ex=(e.touches[0].clientX-rect.left)*(GAME_W/rect.width);
var ey=(e.touches[0].clientY-rect.top)*(GAME_H/rect.height);
handleClick(ex,ey);
},{passive:false});

// 键盘快捷键
document.addEventListener('keydown',function(e){
if(e.key===' '||e.key==='Enter'){
e.preventDefault();
handleClick(cx,hookY);
}
});

// 初始化
resetHook();
lastTime=performance.now();
requestAnimationFrame(gameLoop);
})();
</script>
