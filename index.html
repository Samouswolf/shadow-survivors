<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Samous 游戏工坊 - 385款免费在线H5游戏，无需下载即点即玩">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
<title>Samous 的游戏工坊</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a12;
  --card:rgba(255,255,255,.04);
  --card-hover:rgba(200,150,255,.08);
  --border:rgba(255,255,255,.08);
  --border-hover:rgba(200,150,255,.3);
  --text:#fff;
  --text-dim:#888;
  --accent:#c49bff;
  --accent2:#ff6b35;
  --gold:#ffd700;
}
html,body{
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  overflow:hidden;
}
.app{
  display:flex;
  flex-direction:column;
  height:100vh;
  max-width:100vw;
  transition:max-width .3s ease;
}
.header{
  padding:12px 16px;
  background:rgba(10,10,18,.95);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:100;
}
.header-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}
.logo{
  display:flex;
  align-items:center;
  gap:8px;
}
.logo-icon{font-size:28px}
.logo-text{
  font-size:18px;
  font-weight:900;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.header-actions{
  display:flex;
  gap:8px;
}
.btn{
  padding:6px 12px;
  border-radius:20px;
  border:1px solid var(--border);
  background:transparent;
  color:var(--text-dim);
  font-size:12px;
  cursor:pointer;
  transition:.2s;
}
.btn:hover{
  border-color:var(--border-hover);
  color:var(--text);
  background:var(--card-hover);
}
.btn-primary{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none;
  color:#fff;
  font-weight:bold;
}
.btn-primary:hover{
  opacity:.9;
  transform:scale(1.02);
}
.search-box{position:relative}
.search-input{
  width:100%;
  padding:10px 16px 10px 36px;
  border-radius:24px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  font-size:14px;
  outline:none;
  transition:.2s;
}
.search-input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 2px rgba(196,155,255,.2);
}
.search-input::placeholder{color:var(--text-dim)}
.search-icon{
  position:absolute;
  left:12px;
  top:50%;
  transform:translateY(-50%);
  font-size:16px;
  opacity:.5;
}
.stats-bar{
  display:flex;
  gap:12px;
  padding:8px 16px;
  background:rgba(255,255,255,.02);
  border-bottom:1px solid var(--border);
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}
.stat-chip{
  display:flex;
  align-items:center;
  gap:4px;
  padding:4px 10px;
  border-radius:12px;
  background:var(--card);
  font-size:11px;
  white-space:nowrap;
}
.stat-chip .num{
  font-weight:bold;
  color:var(--gold);
}
.category-tabs{
  display:flex;
  gap:6px;
  padding:10px 16px;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.category-tabs::-webkit-scrollbar{display:none}
.tab{
  padding:6px 14px;
  border-radius:16px;
  border:1px solid var(--border);
  background:transparent;
  color:var(--text-dim);
  font-size:12px;
  cursor:pointer;
  white-space:nowrap;
  transition:.2s;
}
.tab:hover{
  border-color:var(--border-hover);
  color:var(--text);
}
.tab.active{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none;
  color:#fff;
  font-weight:bold;
}
.game-area{
  flex:1;
  overflow-y:auto;
  padding:12px 16px;
  -webkit-overflow-scrolling:touch;
}
.game-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(100px,1fr));
  gap:10px;
}
.game-card{
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:14px 8px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  cursor:pointer;
  transition:.2s;
  text-decoration:none;
  color:var(--text);
}
.game-card:hover{
  border-color:var(--border-hover);
  background:var(--card-hover);
  transform:translateY(-2px);
  box-shadow:0 6px 20px rgba(150,100,255,.15);
}
.game-card:active{transform:scale(.95)}
.game-icon{
  margin-bottom:6px;
  line-height:0;
}
.game-icon svg{
  display:block;
  margin:0 auto;
  width:48px;
  height:48px;
}
.game-name{
  font-size:11px;
  font-weight:600;
  text-align:center;
  line-height:1.3;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.game-tag{
  font-size:9px;
  color:var(--text-dim);
  margin-top:4px;
  padding:2px 6px;
  background:rgba(255,255,255,.05);
  border-radius:6px;
}
.bottom-bar{
  display:flex;
  justify-content:space-around;
  padding:8px 0;
  background:rgba(10,10,18,.98);
  border-top:1px solid var(--border);
  padding-bottom:max(8px,env(safe-area-inset-bottom));
}
.bottom-btn{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  padding:4px 12px;
  background:none;
  border:none;
  color:var(--text-dim);
  font-size:10px;
  cursor:pointer;
  transition:.2s;
}
.bottom-btn .icon{font-size:20px}
.bottom-btn.active{color:var(--accent)}
.empty-state{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:60px 20px;
  text-align:center;
}
.empty-state .icon{
  font-size:64px;
  margin-bottom:16px;
  opacity:.5;
}
.empty-state .text{
  color:var(--text-dim);
  font-size:14px;
}
.install-banner{
  display:none;
  padding:12px 16px;
  background:linear-gradient(135deg,rgba(196,155,255,.15),rgba(255,107,53,.15));
  border-bottom:1px solid var(--border);
  align-items:center;
  gap:12px;
}
.install-banner.show{display:flex}
.install-text{
  flex:1;
  font-size:13px;
}
.install-close{
  background:none;
  border:none;
  color:var(--text-dim);
  font-size:18px;
  cursor:pointer;
}
.preview-overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  z-index:1000;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.preview-overlay.show{display:flex}
.preview-box{
  width:100%;
  max-width:420px;
  background:var(--bg);
  border-radius:20px;
  border:1px solid var(--border);
  overflow:hidden;
}
.preview-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px;
  border-bottom:1px solid var(--border);
}
.preview-title{
  font-size:16px;
  font-weight:bold;
}
.preview-close{
  background:none;
  border:none;
  color:var(--text-dim);
  font-size:24px;
  cursor:pointer;
}
.preview-content{
  padding:20px;
  text-align:center;
}
.preview-icon{
  margin-bottom:16px;
  line-height:0;
}
.preview-icon svg{
  display:block;
  margin:0 auto;
  width:96px;
  height:96px;
}
.preview-desc{
  color:var(--text-dim);
  font-size:13px;
  margin-bottom:20px;
  line-height:1.6;
  white-space:pre-line;
}
.preview-actions{
  display:flex;
  gap:10px;
  justify-content:center;
}
.preview-actions .btn{
  padding:10px 24px;
  font-size:14px;
}
/* ============ 响应式布局 ============ */
/* 移动端 (<768px) 为默认样式，无需额外媒体查询 */

/* 平板端 (768px - 1199px) */
@media(min-width:768px){
  .app{
    max-width:720px;
    margin:0 auto;
    border-left:1px solid var(--border);
    border-right:1px solid var(--border);
  }
  .game-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
  .game-card{padding:18px 10px;border-radius:16px}
  .game-icon svg{width:56px;height:56px}
  .game-name{font-size:13px}
  .game-tag{font-size:10px;padding:3px 8px}
  .header{padding:16px 20px}
  .logo-icon{font-size:32px}
  .logo-text{font-size:22px}
  .header-actions .btn{padding:8px 16px;font-size:13px}
  .search-input{padding:12px 18px 12px 40px;font-size:15px;border-radius:28px}
  .search-icon{font-size:18px;left:14px}
  .stats-bar{padding:10px 20px;gap:16px}
  .stat-chip{padding:6px 14px;font-size:12px;border-radius:14px}
  .category-tabs{padding:12px 20px;gap:10px}
  .tab{padding:8px 18px;font-size:13px;border-radius:20px}
  .game-area{padding:16px 20px}
  .preview-box{max-width:520px;border-radius:24px}
  .preview-icon svg{width:112px;height:112px}
  .preview-title{font-size:20px}
  .preview-desc{font-size:15px}
  .preview-actions .btn{padding:12px 28px;font-size:15px}
}

/* 桌面端 (≥1200px) */
@media(min-width:1200px){
  body{background:linear-gradient(135deg,#0a0a12 0%,#12122a 50%,#0a0a12 100%)}
  .app{
    max-width:1200px;
    margin:0 auto;
    height:100vh;
    display:grid;
    grid-template-columns:260px 1fr;
    grid-template-rows:auto auto 1fr auto;
    grid-template-areas:
      "install install"
      "header  stats"
      "sidebar main"
      "nav     main";
    border:1px solid var(--border);
    box-shadow:0 0 60px rgba(100,60,200,.08);
  }
  .install-banner{grid-area:install}
  .header{grid-area:header}
  .stats-bar{grid-area:stats}
  .category-tabs{grid-area:sidebar}
  .game-area{grid-area:main}
  .bottom-bar{grid-area:nav}
  /* 左侧Header */
  .header{
    position:static;
    border-right:1px solid var(--border);
    border-bottom:1px solid var(--border);
    padding:24px 20px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .header-top{
    flex-direction:column;
    align-items:flex-start;
    gap:16px;
    margin-bottom:0;
  }
  .header-actions{width:100%}
  .header-actions .btn{flex:1;padding:10px 14px;font-size:13px;text-align:center}
  .search-box{width:100%}
  .search-input{padding:12px 16px 12px 38px;font-size:14px}
  .logo{gap:10px}
  .logo-icon{font-size:36px}
  .logo-text{font-size:22px}
  /* 统计栏 */
  .stats-bar{
    padding:12px 24px;
    gap:16px;
    border-bottom:1px solid var(--border);
    border-right:none;
    flex-wrap:wrap;
    overflow-x:visible;
  }
  .stat-chip{padding:6px 14px;font-size:13px;border-radius:14px}
  /* 分类标签垂直排列 */
  .category-tabs{
    flex-direction:column;
    gap:4px;
    padding:16px 12px;
    overflow-y:auto;
    overflow-x:visible;
    border-right:1px solid var(--border);
    scrollbar-width:none;
  }
  .category-tabs::-webkit-scrollbar{display:none}
  .tab{
    padding:10px 16px;
    font-size:14px;
    border-radius:12px;
    text-align:left;
    white-space:nowrap;
  }
  .tab.active{
    background:linear-gradient(135deg,var(--accent),var(--accent2));
  }
  /* 主内容区域 */
  .game-area{
    padding:20px 24px 110px 24px;
    overflow-y:auto;
    min-width:0;
  }
  .game-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
  .game-card{
    padding:20px 12px;
    border-radius:18px;
    transition:transform .25s,box-shadow .25s,border-color .25s,background .25s;
  }
  .game-card:hover{
    transform:translateY(-4px);
    box-shadow:0 10px 30px rgba(150,100,255,.2);
  }
  .game-icon svg{width:64px;height:64px}
  .game-name{font-size:14px}
  .game-tag{font-size:11px;padding:3px 8px}
  /* 底部栏垂直排列 */
  .bottom-bar{
    flex-direction:column;
    border-top:1px solid var(--border);
    border-right:1px solid var(--border);
    padding:12px 8px;
    padding-bottom:12px;
    gap:4px;
  }
  .bottom-btn{
    flex-direction:row;
    gap:10px;
    justify-content:flex-start;
    padding:10px 16px;
    font-size:14px;
    border-radius:10px;
    width:100%;
  }
  .bottom-btn .icon{font-size:22px}
  .bottom-btn:hover{background:var(--card-hover)}
  /* 预览弹窗更大 */
  .preview-box{max-width:560px;border-radius:24px}
  .preview-header{padding:20px 24px}
  .preview-title{font-size:22px}
  .preview-content{padding:28px}
  .preview-icon svg{width:128px;height:128px}
  .preview-desc{font-size:15px;line-height:1.8}
  .preview-actions .btn{padding:12px 32px;font-size:15px;border-radius:24px}
  /* 安装横幅 */
  .install-banner{padding:14px 24px}
  .install-text{font-size:14px}
}

/* 大屏桌面 (≥1600px) 卡片更大 */
@media(min-width:1600px){
  .app{
    max-width:1400px;
    grid-template-columns:280px 1fr;
  }
  .game-grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px}
  .game-card{padding:24px 14px}
  .game-icon svg{width:72px;height:72px}
  .game-name{font-size:15px}
}
@keyframes pulse { to { transform:scale(2); opacity:0; } }
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);height:90px;max-height:90px;overflow:hidden;contain:layout style paint;pointer-events:none!important}.ad-banner-container,.ad-banner-container *{pointer-events:none!important}.ad-banner-container iframe{max-height:90px;pointer-events:none!important}
.ad-banner-container iframe{max-width:100%}
.ad-label{position:absolute;top:1px;right:6px;font:9px "Microsoft YaHei",sans-serif;color:rgba(255,255,255,.35)}
.sponsor-btn{position:fixed;top:44px;right:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:3px 9px;border-radius:10px;font:11px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.sponsor-panel.show{display:flex}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .qr-row{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.sponsor-panel .qr-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px;text-align:center;min-width:140px}
.sponsor-panel .qr-card .qr-icon{font-size:48px;margin-bottom:6px}
.sponsor-panel .qr-card .qr-label{color:#ccc;font:13px "Microsoft YaHei",sans-serif}
.sponsor-panel .qr-card .qr-hint{color:#888;font:11px "Microsoft YaHei",sans-serif;margin-top:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.interstitial-ad.show{display:flex}
.interstitial-ad .ad-content{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;text-align:center;min-width:280px;max-width:400px}
.interstitial-ad .ad-content p{color:#aaa;font:14px "Microsoft YaHei",sans-serif;margin-bottom:12px}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
@media(min-width:1200px){
  .sponsor-btn{top:20px;right:calc(50% - 580px)}
  .ad-banner-container{max-width:1200px;margin:0 auto;left:50%;transform:translateX(-50%)}
}
@media(min-width:1600px){
  .sponsor-btn{right:calc(50% - 680px)}
  .ad-banner-container{max-width:1400px}
}
        </style>
</head>
<body>

<div class="app">
  <div class="install-banner" id="installBanner">
    <span class="icon">📲</span>
    <span class="install-text">安装游戏工坊到桌面，随时畅玩！</span>
    <button class="btn btn-primary" onclick="installApp()">安装</button>
    <button class="install-close" onclick="dismissInstall()">×</button>
  </div>

  <header class="header">
    <div class="header-top">
      <div class="logo">
        <span class="logo-icon">🎮</span>
        <span class="logo-text">游戏工坊</span>
      </div>
      <div class="header-actions">
        <button class="btn" onclick="showRandom()">🎲 随机</button>
        <button class="btn" onclick="showAbout()">关于</button>
      </div>
    </div>
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input class="search-input" id="searchInput" type="text" placeholder="搜索游戏..." oninput="filterGames()">
    </div>
  </header>

  <div class="stats-bar">
    <div class="stat-chip">🎮 <span class="num" id="totalCount">0</span> 款游戏</div>
    <div class="stat-chip">📂 <span class="num" id="catCount">0</span> 个分类</div>
    <div class="stat-chip">⭐ <span class="num">100%</span> 免费</div>
    <div class="stat-chip">📱 <span class="num">H5</span> 即点即玩</div>
  </div>

  <div class="category-tabs" id="categoryTabs"></div>

  <div class="game-area" id="gameArea">
    <div class="game-grid" id="gameGrid"></div>
  </div>

  <div class="bottom-bar">
    <button class="bottom-btn active" onclick="showAll()">
      <span class="icon">🏠</span>
      <span>全部</span>
    </button>
    <button class="bottom-btn" onclick="showRecent()">
      <span class="icon">⏱️</span>
      <span>最近</span>
    </button>
    <button class="bottom-btn" onclick="showFav()">
      <span class="icon">⭐</span>
      <span>收藏</span>
    </button>
    <button class="bottom-btn" onclick="showSettings()">
      <span class="icon">⚙️</span>
      <span>设置</span>
    </button>
  </div>
</div>

<div class="preview-overlay" id="previewOverlay" onclick="closePreview(event)">
  <div class="preview-box" onclick="event.stopPropagation()">
    <div class="preview-header">
      <span class="preview-title" id="previewTitle"></span>
      <button class="preview-close" onclick="closePreview()">×</button>
    </div>
    <div class="preview-content">
      <div class="preview-icon" id="previewIcon"></div>
      <div class="preview-desc" id="previewDesc"></div>
      <div class="preview-actions">
        <button class="btn" onclick="closePreview()">关闭</button>
        <button class="btn btn-primary" id="previewPlay" onclick="playGame()">▶ 开始游戏</button>
      </div>
    </div>
  </div>
</div>

<script src="game_core.js"></script>
<script>
// // 初始化游戏变量
// // 更新游戏状态
// // 渲染游戏画面
// // 处理用户输入
// // 检测游戏结束条件
// // 计算游戏分数
// // 保存游戏进度
// // 加载游戏数据
// // 重置游戏设置
// // 显示游戏提示
// // 播放音效

function hashCode(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    const char = str.charCodeAt(i);
    hash = ((hash << 5) - hash) + char;
    hash |= 0;
  }
  return Math.abs(hash);
}

const iconCache = new Map();

function generateIcon(gameId, name) {
  if (iconCache.has(gameId)) {
    return iconCache.get(gameId);
  }
  
  const hash = hashCode(gameId);
  const hue = hash % 360;
  const sat = 65 + (hash % 20);
  const lig = 50 + (hash % 15);
  const bgLig = 20 + (hash % 10);
  
  const char = name[0];
  
  const bg = `hsl(${hue}, ${sat}%, ${bgLig}%)`;
  const color = `hsl(${hue}, ${sat}%, ${lig + 20}%)`;
  
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="48" height="48">
    <rect width="64" height="64" rx="12" fill="${bg}"/>
    <text x="32" y="36" dominant-baseline="central" text-anchor="middle" font-size="28" font-weight="bold" fill="${color}" font-family="Microsoft YaHei,PingFang SC,sans-serif">${char}</text>
  </svg>`;
  
  iconCache.set(gameId, svg);
  return svg;
}

let currentCategory = "all";
let currentGame = null;
let favorites = JSON.parse(localStorage.getItem("game-favorites") || "[]");
let recentGames = JSON.parse(localStorage.getItem("game-recent") || "[]");

function init() {
  renderCategories();
  renderGames();
  updateStats();
  checkInstall();
}

function renderCategories() {
  const container = document.getElementById("categoryTabs");
  container.innerHTML = CATEGORIES.map(cat =>
    `<button class="tab ${cat.id === currentCategory ? 'active' : ''}" onclick="setCategory('${cat.id}')">${cat.icon} ${cat.name}</button>`
  ).join("");
}

function renderGames() {
  const container = document.getElementById("gameGrid");
  const searchTerm = document.getElementById("searchInput").value.toLowerCase();
  let filtered = GAMES;

  if (currentCategory !== "all") {
    filtered = filtered.filter(g => g.cat === currentCategory);
  }
  if (searchTerm) {
    filtered = filtered.filter(g =>
      g.name.toLowerCase().includes(searchTerm) ||
      g.cat.toLowerCase().includes(searchTerm)
    );
  }

  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1">
        <div class="icon">🔍</div>
        <div class="text">没有找到匹配的游戏</div>
      </div>
    `;
    return;
  }

  container.innerHTML = filtered.map(game => `
    <div class="game-card" onclick="showPreview('${game.id}')">
      <div class="game-icon">${generateIcon(game.id, game.name)}</div>
      <div class="game-name">${game.name}</div>
      <div class="game-tag">${game.cat}</div>
    </div>
  `).join("");
}

function updateStats() {
  document.getElementById("totalCount").textContent = GAMES.length;
  const cats = new Set(GAMES.map(g => g.cat));
  document.getElementById("catCount").textContent = cats.size;
}

function setCategory(catId) {
  currentCategory = catId;
  renderCategories();
  renderGames();
}

function filterGames() {
  renderGames();
}

function showPreview(gameId) {
  currentGame = GAMES.find(g => g.id === gameId);
  if (!currentGame) return;
  document.getElementById("previewTitle").textContent = currentGame.name;
  document.getElementById("previewIcon").innerHTML = generateIcon(currentGame.id, currentGame.name);
  document.getElementById("previewDesc").textContent = `分类：${currentGame.cat}\n点击开始游戏，体验精彩内容！`;
  document.getElementById("previewOverlay").classList.add("show");
}

function closePreview(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById("previewOverlay").classList.remove("show");
  currentGame = null;
}

function playGame() {
  if (!currentGame) return;
  recentGames = recentGames.filter(g => g.id !== currentGame.id);
  recentGames.unshift({id: currentGame.id, time: Date.now()});
  recentGames = recentGames.slice(0, 20);
  localStorage.setItem("game-recent", JSON.stringify(recentGames));
  window.open(currentGame.file, "_blank");
  closePreview();
}

function showRandom() {
  const game = GAMES[Math.floor(Math.random() * GAMES.length)];
  showPreview(game.id);
}

function showAll() {
  currentCategory = "all";
  document.getElementById("searchInput").value = "";
  renderCategories();
  renderGames();
  updateBottomBar(0);
}

function showRecent() {
  currentCategory = "recent";
  const recentIds = recentGames.map(g => g.id);
  const filtered = GAMES.filter(g => recentIds.includes(g.id));
  document.getElementById("gameGrid").innerHTML = filtered.length ? filtered.map(game => `
    <div class="game-card" onclick="showPreview('${game.id}')">
      <div class="game-icon">${generateIcon(game.id, game.name)}</div>
      <div class="game-name">${game.name}</div>
      <div class="game-tag">${game.cat}</div>
    </div>
  `).join("") : `
    <div class="empty-state" style="grid-column:1/-1">
      <div class="icon">⏱️</div>
      <div class="text">还没有玩过的游戏</div>
    </div>
  `;
  updateBottomBar(1);
}

function showFav() {
  currentCategory = "favorites";
  const filtered = GAMES.filter(g => favorites.includes(g.id));
  document.getElementById("gameGrid").innerHTML = filtered.length ? filtered.map(game => `
    <div class="game-card" onclick="showPreview('${game.id}')">
      <div class="game-icon">${generateIcon(game.id, game.name)}</div>
      <div class="game-name">${game.name}</div>
      <div class="game-tag">${game.cat}</div>
    </div>
  `).join("") : `
    <div class="empty-state" style="grid-column:1/-1">
      <div class="icon">⭐</div>
      <div class="text">还没有收藏的游戏</div>
    </div>
  `;
  updateBottomBar(2);
}

  alert("设置功能开发中...");

function showAbout() {
  alert("Samous 游戏工坊 v1.0\n\n🎮 " + GAMES.length + " 款免费H5游戏\n📱 手机电脑都能玩\n⚡ 即点即玩无需下载");
}

function updateBottomBar(index) {
  document.querySelectorAll(".bottom-btn").forEach((btn, i) => {
    btn.classList.toggle("active", i === index);
  });
}

let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById("installBanner").classList.add("show");
});

function installApp() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then((choiceResult) => {
      if (choiceResult.outcome === "accepted") {
        console.log("用户安装了应用");
      }
      deferredPrompt = null;
      document.getElementById("installBanner").classList.remove("show");
    });
  }
}

function dismissInstall() {
  document.getElementById("installBanner").classList.remove("show");
}

function checkInstall() {
  if (window.matchMedia("(display-mode: standalone)").matches) {
    document.getElementById("installBanner").classList.remove("show");
  }
}

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").then(reg => {
    console.log("Service Worker 注册成功");
  }).catch(err => {
    console.log("Service Worker 注册失败:", err);
  });
}

        // 动画帧更新
        function gameLoop() {
            requestAnimationFrame(gameLoop);
        }
        gameLoop();
        
        // 游戏结束处理
        function gameOver() {
            console.log("游戏结束");
        }
        
        // 音效支持
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq = 440, duration = 0.1) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }
        
        // 视觉特效
        function showEffect(x, y) {
            const el = document.createElement("div");
            el.style.cssText = `position:absolute;left:${x}px;top:${y}px;width:20px;height:20px;background:#f5576c;border-radius:50%;animation:pulse 0.5s ease-out forwards;pointer-events:none;z-index:100;`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 500);
        }
        
        // 键盘支持
        document.addEventListener("keydown", function(e) {
            if(e.key == " " || e.keyCode == 32) {
                e.preventDefault();
            }
        });
        
        // 触屏支持 - 仅在需要时阻止默认滚动，列表页允许正常滚动
        let lastTouchY = 0;
        document.addEventListener("touchstart", function(e) {
            if (e.touches.length === 1) {
                lastTouchY = e.touches[0].clientY;
            }
        }, {passive: true});
        
        // 计分系统
        let score = 0;
        function addScore(points) {
            score += points;
        }
        function getScore() {
            return score;
        }
        function resetScore() {
            score = 0;
        }
        
        // 最高分系统
        let highScore = GameCore.storage.get("high_score", 0);
        function updateHighScore(newScore) {
            if(newScore > highScore) {
                highScore = newScore;
                GameCore.storage.set("high_score", highScore);
            }
        }
        </script>
