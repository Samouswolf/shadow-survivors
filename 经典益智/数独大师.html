<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>数独大师</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; color: #fff; overflow: hidden; }
        
        .game-container { width: 100%; flex: 1; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: #fff; }
        .stats { display: flex; gap: 20px; font-size: 14px; }
        
        .main-area { flex: 1; display: flex; flex-direction: column; gap: 15px; }
        
        .sudoku-container { flex: 1; display: flex; align-items: center; justify-content: center; }
        
        .sudoku-grid { display: grid; grid-template-columns: repeat(9, 1fr); grid-template-rows: repeat(9, 1fr); gap: 1px; background: #333; padding: 2px; border-radius: 5px; }
        
        .cell { width: 40px; height: 40px; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; border: none; color: #fff; }
        .cell.selected { background: rgba(78, 205, 196, 0.5); }
        .cell.fixed { color: #ffd700; font-weight: bold; }
        .cell.error { background: rgba(255, 107, 107, 0.5); }
        .cell:nth-child(3n) { border-right: 2px solid #ffd700; }
        .cell:nth-child(9n) { border-right: none; }
        .cell:nth-child(n+19):nth-child(-n+27),
        .cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 2px solid #ffd700; }
        
        .number-pad { display: grid; grid-template-columns: repeat(9, 1fr); gap: 5px; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; }
        
        .num-btn { padding: 15px; border: none; border-radius: 10px; font-size: 18px; cursor: pointer; background: rgba(255,255,255,0.2); color: #fff; }
        .num-btn:active { background: rgba(255,255,255,0.4); }
        
        .actions { display: flex; gap: 10px; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; }
        
        .action-btn { flex: 1; padding: 15px; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; background: rgba(255,255,255,0.2); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="title">🧮 数独大师</div>
            <div class="stats">
                <span>⏱️ 时间: <span id="time">0</span></span>
                <span>❌ 错误: <span id="errors">0</span></span>
            </div>
        </div>
        
        <div class="main-area">
            <div class="sudoku-container">
                <div class="sudoku-grid" id="sudokuGrid"></div>
            </div>
            
            <div class="number-pad">
                <button class="num-btn" onclick="inputNumber(1)">1</button>
                <button class="num-btn" onclick="inputNumber(2)">2</button>
                <button class="num-btn" onclick="inputNumber(3)">3</button>
                <button class="num-btn" onclick="inputNumber(4)">4</button>
                <button class="num-btn" onclick="inputNumber(5)">5</button>
                <button class="num-btn" onclick="inputNumber(6)">6</button>
                <button class="num-btn" onclick="inputNumber(7)">7</button>
                <button class="num-btn" onclick="inputNumber(8)">8</button>
                <button class="num-btn" onclick="inputNumber(9)">9</button>
            </div>
        </div>
        
        <div class="actions">
            <button class="action-btn" onclick="newGame()">🎮 新游戏</button>
            <button class="action-btn" onclick="clearCell()">🗑️ 清除</button>
        </div>
    </div>
    
    <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <script>
        const GAME_NAME = '数独大师';
        GameCore.init({ highScore: GAME_NAME });
        
        let board = [];
        let solution = [];
        let selectedCell = null;
        let time = 0;
        let errors = 0;
        let timer = null;
        
        const puzzles = [
            [
                [5, 3, 0, 0, 7, 0, 0, 0, 0],
                [6, 0, 0, 1, 9, 5, 0, 0, 0],
                [0, 9, 8, 0, 0, 0, 0, 6, 0],
                [8, 0, 0, 0, 6, 0, 0, 0, 3],
                [4, 0, 0, 8, 0, 3, 0, 0, 1],
                [7, 0, 0, 0, 2, 0, 0, 0, 6],
                [0, 6, 0, 0, 0, 0, 2, 8, 0],
                [0, 0, 0, 4, 1, 9, 0, 0, 5],
                [0, 0, 0, 0, 8, 0, 0, 7, 9]
            ]
        ];
        
        function initGame() {
            newGame();
        }
        
        function newGame() {
            stopTimer();
            time = 0;
            errors = 0;
            selectedCell = null;
            
            const puzzle = puzzles[Math.floor(Math.random() * puzzles.length)];
            board = puzzle.map(row => [...row]);
            solution = solveSudoku([...puzzle.map(row => [...row])]);
            
            renderBoard();
            startTimer();
        }
        
        function solveSudoku(grid) {
            const empty = findEmpty(grid);
            if (!empty) return grid;
            
            const [row, col] = empty;
            for (let num = 1; num <= 9; num++) {
                if (isValid(grid, row, col, num)) {
                    grid[row][col] = num;
                    if (solveSudoku(grid)) return grid;
                    grid[row][col] = 0;
                }
            }
            return null;
        }
        
        function findEmpty(grid) {
            for (let row = 0; row < 9; row++) {
                for (let col = 0; col < 9; col++) {
                    if (grid[row][col] === 0) return [row, col];
                }
            }
            return null;
        }
        
        function isValid(grid, row, col, num) {
            for (let i = 0; i < 9; i++) {
                if (grid[row][i] === num) return false;
                if (grid[i][col] === num) return false;
            }
            
            const boxRow = Math.floor(row / 3) * 3;
            const boxCol = Math.floor(col / 3) * 3;
            for (let i = boxRow; i < boxRow + 3; i++) {
                for (let j = boxCol; j < boxCol + 3; j++) {
                    if (grid[i][j] === num) return false;
                }
            }
            
            return true;
        }
        
        function renderBoard() {
            const grid = document.getElementById('sudokuGrid');
            grid.innerHTML = '';
            
            board.forEach((row, rowIndex) => {
                row.forEach((cell, colIndex) => {
                    const cellElement = document.createElement('button');
                    cellElement.className = 'cell';
                    cellElement.textContent = cell || '';
                    cellElement.dataset.row = rowIndex;
                    cellElement.dataset.col = colIndex;
                    
                    if (cell !== 0) {
                        cellElement.classList.add('fixed');
                    }
                    
                    cellElement.addEventListener('click', () => selectCell(rowIndex, colIndex));
                    
                    grid.appendChild(cellElement);
                });
            });
            
            updateUI();
        }
        
        function selectCell(row, col) {
            selectedCell = { row, col };
            document.querySelectorAll('.cell').forEach(cell => cell.classList.remove('selected'));
            const selected = document.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
            selected?.classList.add('selected');
        }
        
        function inputNumber(num) {
            if (!selectedCell) return;
            
            const { row, col } = selectedCell;
            
            if (board[row][col] !== 0) return;
            
            board[row][col] = num;
            
            if (num !== solution[row][col]) {
                errors++;
                const cell = document.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
                cell.classList.add('error');
                setTimeout(() => cell.classList.remove('error'), 500);
            }
            
            renderBoard();
            selectCell(row, col);
            checkWin();
        }
        
        function clearCell() {
            if (!selectedCell) return;
            
            const { row, col } = selectedCell;
            
            if (board[row][col] !== 0) return;
            
            board[row][col] = 0;
            renderBoard();
            selectCell(row, col);
        }
        
        function checkWin() {
            const isWin = board.every((row, rowIndex) => 
                row.every((cell, colIndex) => cell === solution[rowIndex][colIndex])
            );
            
            if (isWin) {
                stopTimer();
                GameCore.hints.show(`🎉 恭喜完成！时间: ${time}秒，错误: ${errors}`);
                GameCore.highScore.set(GAME_NAME, time);
            }
        }
        
        function startTimer() {
            timer = setInterval(() => {
                time++;
                updateUI();
            }, 1000);
        }
        
        function stopTimer() {
            if (timer) {
                clearInterval(timer);
                timer = null;
            }
        }
        
        function updateUI() {
            document.getElementById('time').textContent = time;
            document.getElementById('errors').textContent = errors;
        }
        
        initGame();
        GameCore.touch.enableAllButtons();
    </script>
</body>
</html>
