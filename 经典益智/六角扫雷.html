        </style>');
            document.body.appendChild(loading);
            setTimeout(() => { loading.style.display = 'none'; }, 500);
        });
        
        // 音效支持
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq = 440, duration = 0.1) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }
        
        // 视觉特效
        function showEffect(x, y) {
            const el = document.createElement("div");
            el.style.cssText = `position:absolute;left:${x}px;top:${y}px;width:20px;height:20px;background:#f5576c;border-radius:50%;animation:pulse 0.5s ease-out forwards;pointer-events:none;z-index:100;`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 500);
        }

<script>
// ============ 六角扫雷 - 游戏引擎 ============

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// DOM元素
const mineCountEl = document.getElementById('mineCount');
const timerEl = document.getElementById('timer');
const gameStatusEl = document.getElementById('gameStatus');
const difficultyBtns = document.querySelectorAll('.difficulty button');

// 难度配置: [列数, 行数, 雷数]
const DIFFICULTY = {
  easy:   { cols: 12, rows: 9,  mines: 15 },
  medium: { cols: 20, rows: 15, mines: 30 },
  hard:   { cols: 26, rows: 18, mines: 55 }
};

let currentLevel = 'medium';
let config = { ...DIFFICULTY.medium };

// 游戏状态
let grid = [];           // grid[row][col] = { mine, revealed, flagged, neighborMines }
let gameState = 'idle';  // idle | playing | win | lose
let mineCount = 0;
let timerValue = 0;
let timerInterval = null;
let firstClick = true;
let hexSize = 20;
let canvasCSSW = 0;
let canvasCSSH = 0;
let hoveredCell = null;

// 视口平移（用于大网格时拖动）
let panX = 0, panY = 0;
let isPanning = false;
let panStartX = 0, panStartY = 0;
let lastPanX = 0, lastPanY = 0;

// 长按检测（移动端右键替代）
let longPressTimer = null;
let longPressTriggered = false;
let touchStartTime = 0;
let touchStartPos = null;
let touchHandled = false;

// ============ 六边形几何 ============

// 奇数行偏移坐标系（flat-top六边形）
// 邻居方向：根据行奇偶性不同
function getNeighbors(col, row) {
  if (row % 2 === 1) {
    // 奇数行
    return [
      [col+1, row], [col, row-1], [col-1, row-1],
      [col-1, row], [col-1, row+1], [col, row+1]
    ];
  } else {
    // 偶数行
    return [
      [col+1, row], [col+1, row-1], [col, row-1],
      [col-1, row], [col, row+1], [col+1, row+1]
    ];
  }
}

function isValidCell(col, row) {
  return col >= 0 && col < config.cols && row >= 0 && row < config.rows;
}

// 六边形中心坐标（像素）
function hexCenter(col, row) {
  const sqrt3 = Math.sqrt(3);
  const x = col * sqrt3 * hexSize + (row % 2) * sqrt3 * hexSize / 2 + sqrt3 * hexSize / 2;
  const y = row * 1.5 * hexSize + hexSize;
  return { x: x + panX, y: y + panY };
}

// 六边形顶点
function hexVertices(cx, cy) {
  const verts = [];
  for (let i = 0; i < 6; i++) {
    const angle = Math.PI / 3 * i; // 0°, 60°, 120°, 180°, 240°, 300°
    verts.push({
      x: cx + hexSize * Math.cos(angle),
      y: cy + hexSize * Math.sin(angle)
    });
  }
  return verts;
}

// 像素坐标 → 六边形坐标（点击检测）
function pixelToHex(px, py) {
  const sqrt3 = Math.sqrt(3);
  // 先估算行
  const approxRow = Math.round((py - panY - hexSize) / (1.5 * hexSize));
  
  // 检查附近的行（±1）
  let bestDist = Infinity;
  let bestCol = -1, bestRow = -1;
  
  for (let dr = -1; dr <= 1; dr++) {
    const row = approxRow + dr;
    if (row < 0 || row >= config.rows) continue;
    for (let col = 0; col < config.cols; col++) {
      const center = hexCenter(col, row);
      const dx = px - center.x;
      const dy = py - center.y;
      // 六边形内判断：检查是否在6条边的内侧
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < hexSize * 0.95) {
        // 更精确的六边形内判断
        if (isPointInHex(px, py, center.x, center.y)) {
          return { col, row };
        }
      }
      if (dist < bestDist) {
        bestDist = dist;
        bestCol = col;
        bestRow = row;
      }
    }
  }
  
  // 如果精确检测没找到，返回最近的
  if (bestCol >= 0 && bestRow >= 0) {
    const center = hexCenter(bestCol, bestRow);
    if (isPointInHex(px, py, center.x, center.y)) {
      return { col: bestCol, row: bestRow };
    }
  }
  
  return null;
}

function isPointInHex(px, py, cx, cy) {
  // 将点转换到六边形局部坐标，检查是否在6条边内
  const dx = px - cx;
  const dy = py - cy;
  const r = hexSize;
  
  // 检查在6条边之内
  // 六边形的6条边法向量（指向外侧）
  for (let i = 0; i < 6; i++) {
    const angle = Math.PI / 3 * i + Math.PI / 6; // 边的法向量角度
    const nx = Math.cos(angle);
    const ny = Math.sin(angle);
    const dist = dx * nx + dy * ny;
    // 边的距离 = r * cos(30°) = r * sqrt(3)/2
    if (dist > r * Math.sqrt(3) / 2 + 0.5) return false;
  }
  return true;
}

// ============ 游戏逻辑 ============

function initGrid() {
  grid = [];
  for (let row = 0; row < config.rows; row++) {
    grid[row] = [];
    for (let col = 0; col < config.cols; col++) {
      grid[row][col] = {
        mine: false,
        revealed: false,
        flagged: false,
        neighborMines: 0
      };
    }
  }
}

function placeMines(safeCol, safeRow) {
  // 安全区域（首次点击位置及其邻居不布雷）
  const safeSet = new Set();
  safeSet.add(`${safeCol},${safeRow}`);
  const safeNeighbors = getNeighbors(safeCol, safeRow);
  for (const [nc, nr] of safeNeighbors) {
    if (isValidCell(nc, nr)) safeSet.add(`${nc},${nr}`);
  }
  
  let placed = 0;
  const maxAttempts = config.cols * config.rows * 10;
  let attempts = 0;
  
  while (placed < config.mines && attempts < maxAttempts) {
    const col = Math.floor(Math.random() * config.cols);
    const row = Math.floor(Math.random() * config.rows);
    const key = `${col},${row}`;
    
    if (!safeSet.has(key) && !grid[row][col].mine) {
      grid[row][col].mine = true;
      placed++;
    }
    attempts++;
  }
  
  // 如果因为安全区域太大导致雷放不够，放宽限制
  if (placed < config.mines) {
    attempts = 0;
    while (placed < config.mines && attempts < maxAttempts) {
      const col = Math.floor(Math.random() * config.cols);
      const row = Math.floor(Math.random() * config.rows);
      if (!grid[row][col].mine) {
        grid[row][col].mine = true;
        placed++;
      }
      attempts++;
    }
  }
  
  // 计算每个格子的邻居雷数
  calcNeighborMines();
}

function calcNeighborMines() {
  for (let row = 0; row < config.rows; row++) {
    for (let col = 0; col < config.cols; col++) {
      if (grid[row][col].mine) {
        grid[row][col].neighborMines = -1;
        continue;
      }
      let count = 0;
      const neighbors = getNeighbors(col, row);
      for (const [nc, nr] of neighbors) {
        if (isValidCell(nc, nr) && grid[nr][nc].mine) count++;
      }
      grid[row][col].neighborMines = count;
    }
  }
}

function revealCell(col, row) {
  if (!isValidCell(col, row)) return;
  const cell = grid[row][col];
  if (cell.revealed || cell.flagged) return;
  
  cell.revealed = true;
  
  if (cell.mine) {
    // 踩雷
    gameOver(col, row);
    return;
  }
  
  // 周围无雷 → 连锁揭开
  if (cell.neighborMines === 0) {
    const neighbors = getNeighbors(col, row);
    for (const [nc, nr] of neighbors) {
      revealCell(nc, nr);
    }
  }
}

function chordReveal(col, row) {
  // 双击已揭开数字：如果周围旗帜数等于数字，自动揭开周围未标记格子
  if (!isValidCell(col, row)) return;
  const cell = grid[row][col];
  if (!cell.revealed || cell.neighborMines <= 0) return;
  
  const neighbors = getNeighbors(col, row);
  let flagCount = 0;
  for (const [nc, nr] of neighbors) {
    if (isValidCell(nc, nr) && grid[nr][nc].flagged) flagCount++;
  }
  
  if (flagCount === cell.neighborMines) {
    for (const [nc, nr] of neighbors) {
      if (isValidCell(nc, nr) && !grid[nr][nc].flagged && !grid[nr][nc].revealed) {
        revealCell(nc, nr);
        if (gameState === 'lose') return;
      }
    }
  }
}

function toggleFlag(col, row) {
  if (!isValidCell(col, row)) return;
  const cell = grid[row][col];
  if (cell.revealed) return;
  
  cell.flagged = !cell.flagged;
  mineCount += cell.flagged ? -1 : 1;
  updateMineCount();
}

function checkWin() {
  // 胜利条件：所有非雷格子都已揭开
  for (let row = 0; row < config.rows; row++) {
    for (let col = 0; col < config.cols; col++) {
      const cell = grid[row][col];
      if (!cell.mine && !cell.revealed) return false;
    }
  }
  return true;
}

function gameOver(clickedCol, clickedRow) {
  gameState = 'lose';
  stopTimer();
  
  // 揭示所有雷
  for (let row = 0; row < config.rows; row++) {
    for (let col = 0; col < config.cols; col++) {
      if (grid[row][col].mine) {
        grid[row][col].revealed = true;
      }
    }
  }
  
  // 标记错误旗帜
  for (let row = 0; row < config.rows; row++) {
    for (let col = 0; col < config.cols; col++) {
      if (grid[row][col].flagged && !grid[row][col].mine) {
        grid[row][col].wrongFlag = true;
      }
    }
  }
  
  gameStatusEl.textContent = '💥 踩雷了！点击"新游戏"重来';
  gameStatusEl.className = 'game-status lose';
  draw();
  
  // 游戏结束插屏广告
  setTimeout(() => {
    if (typeof showInterstitialAd === 'function') showInterstitialAd();
  }, 800);
}

function winGame() {
  gameState = 'win';
  stopTimer();
  mineCount = 0;
  updateMineCount();
  
  // 自动标记所有雷
  for (let row = 0; row < config.rows; row++) {
    for (let col = 0; col < config.cols; col++) {
      if (grid[row][col].mine && !grid[row][col].flagged) {
        grid[row][col].flagged = true;
      }
    }
  }
  
  gameStatusEl.textContent = '🎉 恭喜通关！';
  gameStatusEl.className = 'game-status win';
  draw();
}

// ============ 计时器 ============

function startTimer() {
  if (timerInterval) return;
  timerInterval = setInterval(() => {
    timerValue++;
    timerEl.textContent = timerValue;
  }, 1000);
}

function stopTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
}

function resetTimer() {
  stopTimer();
  timerValue = 0;
  timerEl.textContent = '0';
}

function updateMineCount() {
  mineCountEl.textContent = mineCount;
}

// ============ 渲染 ============

function resizeCanvas() {
  const wrap = canvas.parentElement;
  const maxW = Math.min(wrap.clientWidth - 8, 800);
  const maxH = Math.min(window.innerHeight - 200, 700);
  
  const sqrt3 = Math.sqrt(3);
  const totalW = config.cols * sqrt3 * hexSize + sqrt3 * hexSize;
  const totalH = (config.rows - 1) * 1.5 * hexSize + 2 * hexSize;
  
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  
  if (totalW > maxW || totalH > maxH) {
    const scaleW = maxW / totalW;
    const scaleH = maxH / totalH;
    const scale = Math.min(scaleW, scaleH);
    hexSize = Math.max(8, hexSize * scale);
  }
  
  // 重新计算实际尺寸
  const actualW = config.cols * sqrt3 * hexSize + sqrt3 * hexSize;
  const actualH = (config.rows - 1) * 1.5 * hexSize + 2 * hexSize;
  
  canvasCSSW = actualW;
  canvasCSSH = actualH;
  
  canvas.width = Math.ceil(actualW * dpr);
  canvas.height = Math.ceil(actualH * dpr);
  canvas.style.width = actualW + 'px';
  canvas.style.height = actualH + 'px';
  
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  
  // 居中
  panX = 0;
  panY = 0;
}

function draw() {
  ctx.clearRect(0, 0, canvasCSSW, canvasCSSH);
  
  // 背景
  ctx.fillStyle = '#0f0f1a';
  ctx.fillRect(0, 0, canvasCSSW, canvasCSSH);
  
  // 绘制所有六边形
  for (let row = 0; row < config.rows; row++) {
    for (let col = 0; col < config.cols; col++) {
      drawHexCell(col, row);
    }
  }
  
  // 悬停效果
  if (hoveredCell && gameState === 'playing') {
    const { col, row } = hoveredCell;
    const cell = grid[row][col];
    if (!cell.revealed && !cell.flagged) {
      const center = hexCenter(col, row);
      drawHexPath(center.x, center.y);
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.stroke();
    }
  }
}

function drawHexCell(col, row) {
  const center = hexCenter(col, row);
  const cell = grid[row][col];
  const cx = center.x;
  const cy = center.y;
  
  drawHexPath(cx, cy);
  
  if (cell.revealed) {
    // 已揭开的格子
    if (cell.mine) {
      // 雷
      const isClickedMine = (gameState === 'lose');
      ctx.fillStyle = isClickedMine ? '#5c1010' : '#1e1e35';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.stroke();
      
      // 画雷
      ctx.fillStyle = isClickedMine ? '#ff4444' : '#e57373';
      ctx.beginPath();
      ctx.arc(cx, cy, hexSize * 0.35, 0, Math.PI * 2);
      ctx.fill();
      
      // 雷的尖刺
      const spikeLen = hexSize * 0.15;
      ctx.strokeStyle = isClickedMine ? '#ff6666' : '#ef9a9a';
      ctx.lineWidth = 2;
      for (let a = 0; a < 6; a++) {
        const angle = Math.PI / 3 * a;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(angle) * hexSize * 0.15, cy + Math.sin(angle) * hexSize * 0.15);
        ctx.lineTo(cx + Math.cos(angle) * (hexSize * 0.35 + spikeLen), cy + Math.sin(angle) * (hexSize * 0.35 + spikeLen));
        ctx.stroke();
      }
      ctx.lineWidth = 1;
    } else {
      // 数字格
      ctx.fillStyle = '#1a1a30';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.stroke();
      
      if (cell.neighborMines > 0) {
        drawNumber(cx, cy, cell.neighborMines);
      }
    }
  } else {
    // 未揭开
    const grad = ctx.createLinearGradient(cx - hexSize, cy - hexSize, cx + hexSize, cy + hexSize);
    grad.addColorStop(0, '#2a2a45');
    grad.addColorStop(0.5, '#35355a');
    grad.addColorStop(1, '#252540');
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.stroke();
    
    // 顶部高光
    drawHexPath(cx, cy);
    ctx.save();
    ctx.clip();
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    ctx.beginPath();
    ctx.arc(cx, cy - hexSize * 0.4, hexSize * 0.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    
    // 旗帜
    if (cell.flagged) {
      drawFlag(cx, cy, cell.wrongFlag);
    }
  }
}

function drawHexPath(cx, cy) {
  ctx.beginPath();
  const verts = hexVertices(cx, cy);
  ctx.moveTo(verts[0].x, verts[0].y);
  for (let i = 1; i < 6; i++) {
    ctx.lineTo(verts[i].x, verts[i].y);
  }
  ctx.closePath();
}

function drawNumber(cx, cy, num) {
  const colors = ['', '#4fc3f7', '#66bb6a', '#ef5350', '#ab47bc', '#ff7043', '#26c6da'];
  ctx.fillStyle = colors[num] || '#fff';
  ctx.font = `bold ${hexSize * 0.9}px "Microsoft YaHei","PingFang SC",sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(num, cx, cy + 1);
}

function drawFlag(cx, cy, wrong) {
  // 旗杆
  ctx.strokeStyle = '#888';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(cx, cy + hexSize * 0.2);
  ctx.lineTo(cx, cy - hexSize * 0.5);
  ctx.stroke();
  ctx.lineWidth = 1;
  
  // 旗帜
  ctx.fillStyle = wrong ? '#ff4444' : '#ff5252';
  ctx.beginPath();
  ctx.moveTo(cx, cy - hexSize * 0.5);
  ctx.lineTo(cx + hexSize * 0.45, cy - hexSize * 0.25);
  ctx.lineTo(cx, cy - hexSize * 0.05);
  ctx.closePath();
  ctx.fill();
  
  // 旗杆底座
  ctx.fillStyle = '#666';
  ctx.beginPath();
  ctx.arc(cx, cy + hexSize * 0.25, hexSize * 0.12, 0, Math.PI * 2);
  ctx.fill();
  
  if (wrong) {
    // 错误标记 ×
    ctx.strokeStyle = '#ff4444';
    ctx.lineWidth = 2;
    const s = hexSize * 0.25;
    ctx.beginPath();
    ctx.moveTo(cx - s, cy - s);
    ctx.lineTo(cx + s, cy + s);
    ctx.moveTo(cx + s, cy - s);
    ctx.lineTo(cx - s, cy + s);
    ctx.stroke();
    ctx.lineWidth = 1;
  }
}

// ============ 事件处理 ============

function getCanvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: e.clientX - rect.left,
    y: e.clientY - rect.top
  };
}

canvas.addEventListener('mousemove', (e) => {
  const pos = getCanvasPos(e);
  const hex = pixelToHex(pos.x, pos.y);
  hoveredCell = hex;
  if (gameState === 'playing') draw();
});

canvas.addEventListener('mouseleave', () => {
  hoveredCell = null;
  if (gameState === 'playing') draw();
});

canvas.addEventListener('click', (e) => {
  if (touchHandled) { touchHandled = false; return; }
  if (gameState === 'lose' || gameState === 'win') return;
  
  const pos = getCanvasPos(e);
  const hex = pixelToHex(pos.x, pos.y);
  if (!hex) return;
  
  const { col, row } = hex;
  const cell = grid[row][col];
  
  if (firstClick) {
    startGame(col, row);
  }
  
  if (gameState !== 'playing') return;
  
  if (cell.revealed && cell.neighborMines > 0) {
    // 双击数字 → 快速揭开
    chordReveal(col, row);
  } else if (!cell.flagged) {
    revealCell(col, row);
  }
  
  if (gameState === 'playing' && checkWin()) {
    winGame();
  }
  
  draw();
});

canvas.addEventListener('dblclick', (e) => {
  if (gameState !== 'playing') return;
  e.preventDefault();
  
  const pos = getCanvasPos(e);
  const hex = pixelToHex(pos.x, pos.y);
  if (!hex) return;
  
  const { col, row } = hex;
  chordReveal(col, row);
  
  if (gameState === 'playing' && checkWin()) {
    winGame();
  }
  
  draw();
});

canvas.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  if (gameState === 'lose' || gameState === 'win') return;
  
  const pos = getCanvasPos(e);
  const hex = pixelToHex(pos.x, pos.y);
  if (!hex) return;
  
  if (firstClick) {
    startGame(hex.col, hex.row);
  }
  
  if (gameState !== 'playing') return;
  
  toggleFlag(hex.col, hex.row);
  draw();
});

// 移动端触摸支持
canvas.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) {
    const pos = getCanvasPos(e.touches[0]);
    touchStartPos = { x: pos.x, y: pos.y };
    touchStartTime = Date.now();
    longPressTriggered = false;
    touchHandled = false;
    
    // 长按500ms → 插旗
    longPressTimer = setTimeout(() => {
      longPressTriggered = true;
      if (gameState === 'lose' || gameState === 'win') return;
      
      const hex = pixelToHex(touchStartPos.x, touchStartPos.y);
      if (!hex) return;
      
      if (firstClick) {
        startGame(hex.col, hex.row);
      }
      
      if (gameState !== 'playing') return;
      
      toggleFlag(hex.col, hex.row);
      draw();
      
      // 振动反馈
      if (navigator.vibrate) navigator.vibrate(15);
    }, 500);
  }
  
  if (e.touches.length === 2) {
    // 双指平移
    clearTimeout(longPressTimer);
    isPanning = true;
    panStartX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    panStartY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    lastPanX = panX;
    lastPanY = panY;
  }
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  if (isPanning && e.touches.length === 2) {
    e.preventDefault();
    const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    panX = lastPanX + (cx - panStartX);
    panY = lastPanY + (cy - panStartY);
    draw();
    return;
  }
  
  // 如果手指移动超过阈值，取消长按
  if (touchStartPos && e.touches.length === 1) {
    const pos = getCanvasPos(e.touches[0]);
    const dx = pos.x - touchStartPos.x;
    const dy = pos.y - touchStartPos.y;
    if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
      clearTimeout(longPressTimer);
    }
  }
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
  clearTimeout(longPressTimer);
  
  if (isPanning) {
    isPanning = false;
    return;
  }
  
  if (longPressTriggered) return;
  if (gameState === 'lose' || gameState === 'win') return;
  
  const pos = touchStartPos;
  if (!pos) return;
  
  const hex = pixelToHex(pos.x, pos.y);
  if (!hex) return;
  
  const { col, row } = hex;
  const cell = grid[row][col];
  
  if (firstClick) {
    startGame(col, row);
  }
  
  if (gameState !== 'playing') return;
  
  if (cell.revealed && cell.neighborMines > 0) {
    chordReveal(col, row);
  } else if (!cell.flagged) {
    revealCell(col, row);
  }
  
  if (gameState === 'playing' && checkWin()) {
    winGame();
  }
  
  draw();
  touchStartPos = null;
  touchHandled = true;
});

// ============ 游戏流程 ============

function startGame(safeCol, safeRow) {
  firstClick = false;
  gameState = 'playing';
  gameStatusEl.textContent = '';
  gameStatusEl.className = 'game-status';
  
  placeMines(safeCol, safeRow);
  startTimer();
  revealCell(safeCol, safeRow);
  
  if (checkWin()) winGame();
}

function newGame() {
  stopTimer();
  resetTimer();
  firstClick = true;
  gameState = 'idle';
  gameStatusEl.textContent = '';
  gameStatusEl.className = 'game-status';
  mineCount = config.mines;
  updateMineCount();
  panX = 0;
  panY = 0;
  initGrid();
  draw();
  document.getElementById('startScreen').classList.remove('hidden');
}

function setDifficulty(level) {
  currentLevel = level;
  config = { ...DIFFICULTY[level] };
  
  // 更新难度按钮
  difficultyBtns.forEach(btn => {
    btn.classList.toggle('active', btn.dataset.level === level);
  });
  
  // 重置hexSize并重新计算
  hexSize = 20;
  resetForNewSize();
  newGame();
}

function resetForNewSize() {
  const sqrt3 = Math.sqrt(3);
  const totalW = config.cols * sqrt3 * hexSize + sqrt3 * hexSize;
  const totalH = (config.rows - 1) * 1.5 * hexSize + 2 * hexSize;
  
  const wrap = canvas.parentElement;
  const maxW = Math.min(wrap.clientWidth - 8, 800);
  const maxH = Math.min(window.innerHeight - 200, 700);
  
  if (totalW > maxW || totalH > maxH) {
    const scaleW = maxW / totalW;
    const scaleH = maxH / totalH;
    const scale = Math.min(scaleW, scaleH);
    hexSize = Math.max(8, hexSize * scale);
  }
}

// ============ 按钮事件 ============

document.getElementById('newGameBtn').addEventListener('click', newGame);

difficultyBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    setDifficulty(btn.dataset.level);
  });
});

// 键盘快捷键
document.addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') {
    newGame();
  }
  if (e.key === '1') setDifficulty('easy');
  if (e.key === '2') setDifficulty('medium');
  if (e.key === '3') setDifficulty('hard');
});

// ============ 初始化 ============

document.getElementById('startBtn').addEventListener('click', function() {
  document.getElementById('startScreen').classList.add('hidden');
});

function init() {
  config = { ...DIFFICULTY[currentLevel] };
  resizeCanvas();
  newGame();
}

// 窗口大小变化
window.addEventListener('resize', () => {
  const oldHexSize = hexSize;
  resizeCanvas();
  if (hexSize !== oldHexSize) {
    draw();
  }
});

// 启动
init();
