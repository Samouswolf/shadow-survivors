function createBarSegments(length, cs, axis, notches, material) {

    if (!faceInfo || faceInfo.a === axis) continue; // skip if notch face is along bar axis

    const depth = Math.min(notch.depth, fullCS - 0.01);
    const whichDim = faceInfo.a === perpAxes[0] ? 0 : 1;
    const range = whichDim === 0 ? dimARange : dimBRange;

    if (faceInfo.sign > 0) {
      range[1] = Math.min(range[1], halfCS - depth);
    } else {
      range[0] = Math.max(range[0], -halfCS + depth);
    }
  }

  const dimASize = dimARange[1] - dimARange[0];
  const dimBSize = dimBRange[1] - dimBRange[0];

  if (dimASize < 0.005 || dimBSize < 0.005) return; // piece cut through completely

  const dimACenter = (dimARange[0] + dimARange[1]) / 2;
  const dimBCenter = (dimBRange[0] + dimBRange[1]) / 2;

  let bw, bh, bd, bx, by, bz;
  if (axis === 'x') {
    bw = segLen; bx = mid;
    bh = dimASize; bd = dimBSize;
    by = dimACenter; bz = dimBCenter;
  } else if (axis === 'y') {
    bh = segLen; by = mid;
    bw = dimASize; bd = dimBSize;
    bx = dimACenter; bz = dimBCenter;
  } else {
    bd = segLen; bz = mid;
    bw = dimASize; bh = dimBSize;
    bx = dimACenter; by = dimBCenter;
  }

  const geo = new THREE.BoxGeometry(bw, bh, bd);
  const mesh = new THREE.Mesh(geo, material);
  mesh.position.set(bx, by, bz);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  group.add(mesh);
}

// ─── Game State ──────────────────────────────
let currentPuzzle = 0;
let pieces = [];        // { def, group, removed, originalPos, slideOffset }
let selectedPiece = null;
let removedCount = 0;
let totalPieces = 0;
let isReassembling = false;
let gameStarted = false;

// ─── Build puzzle ────────────────────────────
const puzzleGroup = new THREE.Group();
scene.add(puzzleGroup);

function buildPuzzle(puzzleIndex) {
  // Clear existing
  while (puzzleGroup.children.length > 0) {
    const child = puzzleGroup.children[0];
    disposeGroup(child);
    puzzleGroup.remove(child);
  }
  pieces = [];
  removedCount = 0;
  totalPieces = 0;
  selectedPiece = null;
  isReassembling = false;
  stepsEl.textContent = '0';

  const puzzleDef = puzzles[puzzleIndex];
  totalPieces = puzzleDef.length;

  puzzleDef.forEach((def, i) => {
    const mat = woodMaterials[i % woodMaterials.length].clone();
    const group = createBarSegments(def.len, def.cs, def.axis, def.notches, mat);

    // Add edge lines for visual clarity
    group.children.forEach(child => {
      if (child.isMesh) {
        const edgeGeo = new THREE.EdgesGeometry(child.geometry);
        const edgeLine = new THREE.LineSegments(edgeGeo, new THREE.LineBasicMaterial({ color: '#3a2010', transparent: true, opacity: 0.3 }));
        child.add(edgeLine);
      }
    });

    group.position.set(def.cx, def.cy, def.cz);
    group.userData = {
      index: i,
      axis: def.axis,
      originalPos: new THREE.Vector3(def.cx, def.cy, def.cz),
      material: mat,
      def: def,
    };
    puzzleGroup.add(group);

    pieces.push({
      def: def,
      group: group,
      removed: false,
      originalPos: new THREE.Vector3(def.cx, def.cy, def.cz),
      slideOffset: 0,
    });
  });

  updateStepDisplay();
}

function disposeGroup(group) {
  group.traverse(child => {
    if (child.geometry) child.geometry.dispose();
    if (child.material) {
      if (Array.isArray(child.material)) {
        child.material.forEach(m => m.dispose());
      } else {
        // Don't dispose shared materials (woodMaterials, highlightMat, hintMat)
        if (child.material !== highlightMat && child.material !== hintMat &&
            !woodMaterials.includes(child.material)) {
          child.material.dispose();
        }
      }
    }
  });
}

// ─── Interaction ─────────────────────────────
const raycaster = new THREE.Raycaster();
raycaster.far = 20;
const mouse = new THREE.Vector2();
let isDragging = false;
let isSliding = false;
let dragStart = new THREE.Vector2();
let dragCurrent = new THREE.Vector2();
let slideStartWorld = new THREE.Vector3();
let slideAxis = new THREE.Vector3();

function getIntersections(event) {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const allMeshes = [];
  puzzleGroup.traverse(child => {
    if (child.isMesh) allMeshes.push(child);
  });
  return raycaster.intersectObjects(allMeshes, false);
}

function findPieceFromIntersect(intersects) {
  for (const intersect of intersects) {
    let obj = intersect.object;
    while (obj) {
      if (obj.userData && obj.userData.index !== undefined && obj.parent === puzzleGroup) {
        return obj;
      }
      if (obj.userData && obj.userData.index !== undefined) {
        // Check if this group is a direct child of puzzleGroup
        if (obj.parent === puzzleGroup) return obj;
      }
      obj = obj.parent;
    }
  }
  return null;
}

function getPieceGroup(meshOrGroup) {
  let obj = meshOrGroup;
  while (obj) {
    if (obj.userData && obj.userData.index !== undefined && obj.parent === puzzleGroup) {
      return obj;
    }
    obj = obj.parent;
  }
  return null;
}

function getPieceByGroup(group) {
  if (!group || !group.userData) return null;
  const idx = group.userData.index;
  return pieces[idx] || null;
}

function highlightPiece(group, material) {
  if (!group) return;
  group.traverse(child => {
    if (child.isMesh && child.material !== material) {
      child.userData._origMat = child.material;
      child.material = material;
    }
  });
}

function unhighlightPiece(group) {
  if (!group) return;
  group.traverse(child => {
    if (child.isMesh && child.userData._origMat) {
      child.material = child.userData._origMat;
      child.userData._origMat = null;
    }
  });
}

function unhighlightAll() {
  pieces.forEach(p => {
    if (!p.removed) unhighlightPiece(p.group);
  });
}

function checkRemovable(piece) {
  // A piece is removable if sliding it along its axis (in the removal direction)
  // doesn't collide with any other non-removed piece
  if (piece.removed) return false;

  const axis = piece.def.axis;
  const dir = new THREE.Vector3();
  if (axis === 'x') dir.set(1, 0, 0);
  else if (axis === 'y') dir.set(0, 1, 0);
  else dir.set(0, 0, 1);

  const pos = piece.group.position.clone();
  const halfLen = piece.def.len / 2 + 0.5;

  // Check both directions
  const dirs = [dir.clone(), dir.clone().multiplyScalar(-1)];
  for (const d of dirs) {
    let blocked = false;
    // Test moving the piece outward
    const testPos = pos.clone().add(d.clone().multiplyScalar(piece.def.len));
    const testBox = new THREE.Box3().setFromObject(piece.group);
    // Translate the box to test position
    const offset = d.clone().multiplyScalar(piece.def.len);
    testBox.translate(offset);

    for (const other of pieces) {
      if (other === piece || other.removed) continue;
      const otherBox = new THREE.Box3().setFromObject(other.group);
      if (testBox.intersectsBox(otherBox)) {
        blocked = true;
        break;
      }
    }
    if (!blocked) return true;
  }
  return false;
}

function getRemovablePieces() {
  return pieces.filter(p => !p.removed && checkRemovable(p));
}

function showHint() {
  unhighlightAll();
  const removable = getRemovablePieces();
  if (removable.length === 0) {
    showMessage('所有木条已拆解！', '');
    return;
  }
  removable.forEach(p => highlightPiece(p.group, hintMat));
  showMessage(`可拆 ${removable.length} 根`, '绿色高亮');
  setTimeout(() => {
    removable.forEach(p => unhighlightPiece(p.group));
  }, 2000);
}

function showMessage(text, sub) {
  messageEl.innerHTML = text + (sub ? `<small>${sub}</small>` : '');
  messageEl.classList.add('show');
  clearTimeout(messageEl._timeout);
  messageEl._timeout = setTimeout(() => messageEl.classList.remove('show'), 2000);
}

// ─── Event Handlers ──────────────────────────
function onPointerDown(event) {
  if (!gameStarted || isReassembling) return;
  if (event.target === hintBtn || event.target === resetBtn) return;

  const intersects = getIntersections(event);
  const pieceGroup = findPieceFromIntersect(intersects);

  if (pieceGroup && !getPieceByGroup(pieceGroup)?.removed) {
    // Check if piece is removable
    const piece = getPieceByGroup(pieceGroup);
    if (piece && checkRemovable(piece)) {
      selectedPiece = piece;
      unhighlightAll();
      highlightPiece(pieceGroup, highlightMat);
      isSliding = true;
      dragStart.set(event.clientX, event.clientY);
      slideStartWorld.copy(pieceGroup.position);
      slideAxis.set(0, 0, 0);
      if (piece.def.axis === 'x') slideAxis.set(1, 0, 0);
      else if (piece.def.axis === 'y') slideAxis.set(0, 1, 0);
      else slideAxis.set(0, 0, 1);
      controls.enabled = false;
    } else {
      // Piece not removable - start view rotation
      isDragging = true;
      dragStart.set(event.clientX, event.clientY);
    }
  } else {
    // No piece hit - start view rotation
    isDragging = true;
    dragStart.set(event.clientX, event.clientY);
  }
}

function onPointerMove(event) {
  if (!gameStarted || isReassembling) return;

  if (isSliding && selectedPiece) {
    dragCurrent.set(event.clientX, event.clientY);
    const delta = new THREE.Vector2(
      dragCurrent.x - dragStart.x,
      dragCurrent.y - dragStart.y
    );

    // Project mouse delta onto the slide axis in screen space
    const axisStart = selectedPiece.group.position.clone();
    const axisEnd = axisStart.clone().add(slideAxis);
    const startScreen = toScreenPosition(axisStart);
    const endScreen = toScreenPosition(axisEnd);
    const screenAxis = new THREE.Vector2(
      endScreen.x - startScreen.x,
      endScreen.y - startScreen.y
    ).normalize();

    const slideAmount = delta.x * screenAxis.x + delta.y * screenAxis.y;
    const maxSlide = selectedPiece.def.len * 0.8;
    const clampedSlide = Math.max(-maxSlide, Math.min(maxSlide, slideAmount * 0.02));

    selectedPiece.group.position.copy(selectedPiece.originalPos.clone().add(
      slideAxis.clone().multiplyScalar(clampedSlide)
    ));
    selectedPiece.slideOffset = clampedSlide;
  }
}

function onPointerUp(event) {
  if (!gameStarted || isReassembling) return;

  if (isSliding && selectedPiece) {
    const slideDist = Math.abs(selectedPiece.slideOffset);
    const threshold = selectedPiece.def.len * 0.35;

    if (slideDist > threshold) {
      // Remove piece
      removePiece(selectedPiece, selectedPiece.slideOffset > 0 ? 1 : -1);
    } else {
      // Snap back
      selectedPiece.group.position.copy(selectedPiece.originalPos);
      selectedPiece.slideOffset = 0;
      unhighlightPiece(selectedPiece.group);
    }
    selectedPiece = null;
    isSliding = false;
    controls.enabled = true;
  }

  isDragging = false;
}

function removePiece(piece, direction) {
  piece.removed = true;
  const axis = slideAxis.clone().multiplyScalar(direction);
  const targetPos = piece.originalPos.clone().add(axis.multiplyScalar(piece.def.len * 1.5));

  // Animate removal
  const startPos = piece.group.position.clone();
  const startTime = performance.now();
  const duration = 400;

  function animRemove(time) {
    const elapsed = time - startTime;
    const t = Math.min(elapsed / duration, 1);
    const ease = 1 - Math.pow(1 - t, 3);
    piece.group.position.lerpVectors(startPos, targetPos, ease);
    if (t < 1) {
      requestAnimationFrame(animRemove);
    } else {
      piece.group.position.copy(targetPos);
      unhighlightPiece(piece.group);
      removedCount++;
      updateStepDisplay();
      checkWin();
    }
  }
  requestAnimationFrame(animRemove);
}

function updateStepDisplay() {
  stepsEl.textContent = removedCount;
}

function checkWin() {
  if (removedCount >= totalPieces) {
    setTimeout(() => {
      showMessage('🎉 恭喜解开了！', '鲁班锁已完全拆解');
      showInterstitialAd();
      setTimeout(() => reassembleAnimation(), 2500);
    }, 500);
  }
}

function reassembleAnimation() {
  isReassembling = true;
  const duration = 1500;
  const startTime = performance.now();

  function animReassemble(time) {
    const elapsed = time - startTime;
    const t = Math.min(elapsed / duration, 1);
    const ease = 1 - Math.pow(1 - t, 4);

    pieces.forEach((p, i) => {
      const staggerStart = i * 0.08;
      const pieceT = Math.max(0, Math.min(1, (t - staggerStart) / (1 - staggerStart)));
      const pieceEase = 1 - Math.pow(1 - pieceT, 3);
      p.group.position.lerpVectors(
        p.group.position.clone(),
        p.originalPos,
        pieceEase
      );
    });

    if (t < 1) {
      requestAnimationFrame(animReassemble);
    } else {
      // Reset all pieces
      pieces.forEach(p => {
        p.group.position.copy(p.originalPos);
        p.removed = false;
        p.slideOffset = 0;
      });
      removedCount = 0;
      updateStepDisplay();
      isReassembling = false;
      showMessage('🔒 鲁班锁已重组', '再来一次吧');
    }
  }
  requestAnimationFrame(animReassemble);
}

function toScreenPosition(worldPos) {
  const vector = worldPos.clone().project(camera);
  return {
    x: (vector.x * 0.5 + 0.5) * window.innerWidth,
    y: (-vector.y * 0.5 + 0.5) * window.innerHeight,
  };
}

// ─── Reset ───────────────────────────────────
function resetPuzzle() {
  if (isReassembling) return;
  pieces.forEach(p => {
    p.group.position.copy(p.originalPos);
    p.removed = false;
    p.slideOffset = 0;
  });
  removedCount = 0;
  updateStepDisplay();
  unhighlightAll();
  selectedPiece = null;
  isSliding = false;
  controls.enabled = true;
  showMessage('🔄 已重置', '');
}

// ─── Event listeners ─────────────────────────
renderer.domElement.addEventListener('pointerdown', onPointerDown);
renderer.domElement.addEventListener('pointermove', onPointerMove);
renderer.domElement.addEventListener('pointerup', onPointerUp);
renderer.domElement.addEventListener('pointerleave', onPointerUp);

// Touch events for mobile
renderer.domElement.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    onPointerDown(e.touches[0]);
  }
}, { passive: false });
renderer.domElement.addEventListener('touchmove', e => {
  if (e.touches.length === 1) {
    onPointerMove(e.touches[0]);
  }
  e.preventDefault();
}, { passive: false });
renderer.domElement.addEventListener('touchend', e => {
  onPointerUp({ clientX: 0, clientY: 0 });
});

hintBtn.addEventListener('click', () => { if (!isReassembling) showHint(); });
resetBtn.addEventListener('click', resetPuzzle);

puzzleBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    const idx = parseInt(btn.dataset.puzzle);
    if (idx === currentPuzzle && gameStarted) return;
    currentPuzzle = idx;
    puzzleBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    buildPuzzle(currentPuzzle);
    controls.target.set(0, 0, 0);
    controls.update();
  });
});

startBtn.addEventListener('click', () => {
  tutorialOverlay.style.display = 'none';
  gameStarted = true;
  buildPuzzle(currentPuzzle);
  setTimeout(() => { controlsHint.style.opacity = '0'; }, 5000);
});

// ─── Ad system ───────────────────────────────
const sponsorBtn = document.getElementById('sponsorBtn');
const sponsorPanel = document.getElementById('sponsorPanel');
const sponsorClose = document.getElementById('sponsorClose');
sponsorBtn.onclick = () => { sponsorPanel.classList.add('active'); };
sponsorClose.onclick = () => { sponsorPanel.classList.remove('active'); };

const interstitialAd = document.getElementById('interstitialAd');
const skipInterstitial = document.getElementById('skipInterstitial');
skipInterstitial.onclick = () => { interstitialAd.classList.remove('active'); };
function showInterstitialAd() {
  interstitialAd.classList.add('active');
}

// ─── Resize ──────────────────────────────────
window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});

// ─── Render loop ─────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  controls.update();

  // Subtle floating animation for removed pieces
  pieces.forEach(p => {
    if (p.removed) {
      p.group.rotation.y += 0.005;
    }
  });

  renderer.render(scene, camera);
}

// ─── Init ────────────────────────────────────
// Pre-build the first puzzle for visual behind tutorial
buildPuzzle(0);
animate();

// ─── Keyboard shortcuts ──────────────────────
window.addEventListener('keydown', e => {
  if (!gameStarted) return;
  switch(e.key.toLowerCase()) {
    case 'h': showHint(); break;
    case 'r': resetPuzzle(); break;
    case '1': currentPuzzle = 0; puzzleBtns.forEach(b => b.classList.remove('active')); puzzleBtns[0].classList.add('active'); buildPuzzle(0); break;
    case '2': currentPuzzle = 1; puzzleBtns.forEach(b => b.classList.remove('active')); puzzleBtns[1].classList.add('active'); buildPuzzle(1); break;
    case '3': currentPuzzle = 2; puzzleBtns.forEach(b => b.classList.remove('active')); puzzleBtns[2].classList.add('active'); buildPuzzle(2); break;
  }
});

        // 存档支持
        const GAME_KEY = '鲁班锁';
        function saveGame(data) {
            try { localStorage.setItem(GAME_KEY, JSON.stringify(data)); } catch(e) {}
        }
        function loadGame() {
            try { return JSON.parse(localStorage.getItem(GAME_KEY) || '{}'); } catch(e) { return {}; }
        }
        
        // 加载界面
        window.addEventListener('load', function() {
            const loading = document.createElement('div');
            loading.id = 'game-loading';
            loading.style.cssText = 'position:fixed;inset:0;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;color:white;font-size:18px';
            loading.innerHTML = '<div style="width:50px;height:50px;border:4px solid #f5576c;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;"></div><div style="margin-top:20px;">加载中...</div>';
            document.head.insertAdjacentHTML('beforeend', '<style>@keyframes spin {to{transform:rotate(360deg)}} @keyframes pulse { to { transform:scale(2); opacity:0; } }
        </style>');
            document.body.appendChild(loading);
            setTimeout(() => { loading.style.display = 'none'; }, 500);
        });
        
        // 游戏结束处理
        function gameOver() {
            console.log("游戏结束");
        }
        
        // 视觉特效
        function showEffect(x, y) {
            const el = document.createElement("div");
            el.style.cssText = `position:absolute;left:${x}px;top:${y}px;width:20px;height:20px;background:#f5576c;border-radius:50%;animation:pulse 0.5s ease-out forwards;pointer-events:none;z-index:100;`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 500);
        }
        
        // 计分系统
        let score = 0;
        function addScore(points) {
            score += points;
        }
        function getScore() {
            return score;
        }
        function resetScore() {
            score = 0;
        }
        
        // 最高分系统
        let highScore = Storage.load("high_score", 0);
        function updateHighScore(newScore) {
            if(newScore > highScore) {
                highScore = newScore;
                Storage.save("high_score", highScore);
            }
        }
        </script>
