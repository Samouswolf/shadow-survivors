;(function(){
  var G = (typeof window !== 'undefined') ? window : (typeof globalThis !== 'undefined' ? globalThis : this);

  var S = G.Storage;
  var needAttach = (typeof S === 'undefined' || typeof S.load !== 'function' || typeof S.save !== 'function');
  if (!needAttach) return;
  if (typeof S === 'undefined') { S = function(){}; G.Storage = S; }
  function parseSafe(s, d){
    if (s === null || s === undefined) return d;
    try { return JSON.parse(s); } catch(e) { try { return s; } catch(e2){ return d; } }
  }
  S.load = function(k, d){ try { return parseSafe(localStorage.getItem(k), d); } catch(e){ return d; } };
  S.save = function(k, v){ try { localStorage.setItem(k, typeof v==='string'?v:JSON.stringify(v)); } catch(e){} };
  S.remove = function(k){ try { localStorage.removeItem(k); } catch(e){} };
})();

// ==================== 音频系统 ====================
var AudioCtx = window.AudioContext || window.webkitAudioContext;
var audioCtx = null;
function ensureAudio(){if(!audioCtx)audioCtx=new AudioCtx()}
function playTone(freq,dur,type){
    try{
        ensureAudio();
        var o=audioCtx.createOscillator();
        var g=audioCtx.createGain();
        o.type=type||'sine';
        o.frequency.setValueAtTime(freq,audioCtx.currentTime);
        g.gain.setValueAtTime(0.15,audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
        o.connect(g);g.connect(audioCtx.destination);
        o.start();o.stop(audioCtx.currentTime+dur);
    }catch(e){}
}
function sfxMove(){playTone(300,0.08,'square')}
function sfxSlide(){playTone(200,0.1,'triangle')}
function sfxWin(){
    var n=[523,659,784,1047];
    n.forEach(function(f,i){setTimeout(function(){playTone(f,0.3,'sine')},i*150)});

// ==================== 游戏状态 ====================
var G={
    state:'menu', // menu/playing/paused/win
    level:0,
    blocks:[],     // 当前方块列表
    grid:[],       // 网格占用情况
    steps:0,
    timer:0,       // 秒
    timerInterval:null,
    bestSteps:{},  // 各关卡最佳步数
    bestTime:{},   // 各关卡最佳时间
    selectedBlock:null,
    dragStart:null,
    dragBlock:null,
    animating:false,
    moveHistory:[],
    canvas:null,
    ctx:null,
    W:0,H:0,
    cellSize:0,
    boardX:0,boardY:0,
    hintBlock:null,

};

// ==================== 初始化 ====================
function init(){
    G.canvas=document.getElementById('C');
    G.ctx=G.canvas.getContext('2d');
    loadBest();
    resize();
    window.addEventListener('resize',resize);
    setupInput();
    requestAnimationFrame(gameLoop);
}

function resize(){
    var dpr=window.devicePixelRatio||1;
    G.W=window.innerWidth;
    G.H=window.innerHeight;
    G.canvas.width=G.W*dpr;
    G.canvas.height=G.H*dpr;
    G.canvas.style.width=G.W+'px';
    G.canvas.style.height=G.H+'px';
    G.ctx.setTransform(dpr,0,0,dpr,0,0);
    // 计算棋盘尺寸
    var maxBoardW=G.W*0.9;
    var maxBoardH=G.H*0.7;
    var cellW=Math.floor(maxBoardW/COLS);
    var cellH=Math.floor(maxBoardH/ROWS);
    G.cellSize=Math.min(cellW,cellH,120);
    G.boardX=Math.floor((G.W-COLS*G.cellSize)/2);
    G.boardY=Math.floor((G.H-ROWS*G.cellSize)/2)+20;
}

function loadBest(){
    try{
        var s=localStorage.getItem('hrd_best_steps');
        if(s)G.bestSteps=JSON.parse(s);
        var t=localStorage.getItem('hrd_best_time');
        if(t)G.bestTime=JSON.parse(t);
    }catch(e){}
}
function saveBest(){
    try{
        localStorage.setItem('hrd_best_steps',JSON.stringify(G.bestSteps));
        localStorage.setItem('hrd_best_time',JSON.stringify(G.bestTime));
    }catch(e){}
}

// ==================== 关卡加载 ====================
function loadLevel(idx){
    var lv=LEVELS[idx];
    G.blocks=[];
    G.grid=[];
    G.steps=0;
    G.timer=0;
    G.selectedBlock=null;
    G.dragBlock=null;
    G.moveHistory=[];
    G.animating=false;
    // 初始化网格
    for(var r=0;r<ROWS;r++){
        G.grid[r]=[];
        for(var c=0;c<COLS;c++){
            G.grid[r][c]=null;
        }
    }
    // 加载方块
    lv.blocks.forEach(function(bd){
        var b={type:bd.type,col:bd.col,row:bd.row,id:G.blocks.length};
        var bt=BLOCK_TYPES[b.type];
        b.w=bt.w;b.h=bt.h;
        G.blocks.push(b);
        // 标记网格
        for(var dr=0;dr<b.h;dr++){
            for(var dc=0;dc<b.w;dc++){
                G.grid[b.row+dr][b.col+dc]=b.id;
            }
        }
    });
    // 启动计时
    if(G.timerInterval)clearInterval(G.timerInterval);
    G.timerInterval=setInterval(function(){
        if(G.state==='playing')G.timer++;
    },1000);
    G.state='playing';
}

// ==================== 移动逻辑 ====================
function canMove(b,dcol,drow){
    var nc=b.col+dcol, nr=b.row+drow;
    if(nc<0||nr<0)return false;
    if(nc+b.w>COLS||nr+b.h>ROWS)return false;
    // 检查目标位置是否被其他方块占用
    if(dcol!==0){
        // 水平移动
        var scanCol=dcol>0?b.col+b.w:b.col-1;
        for(var r=b.row;r<b.row+b.h;r++){
            if(scanCol<0||scanCol>=COLS)return false;
            var occ=G.grid[r][scanCol];
            if(occ!==null&&occ!==b.id)return false;
        }
    }
    if(drow!==0){
        // 垂直移动
        var scanRow=drow>0?b.row+b.h:b.row-1;
        for(var c=b.col;c<b.col+b.w;c++){
            if(scanRow<0||scanRow>=ROWS)return false;
            var occ2=G.grid[scanRow][c];
            if(occ2!==null&&occ2!==b.id)return false;
        }
    }
    return true;
}

function moveBlock(b,dcol,drow){
    // 清除旧位置
    for(var r=b.row;r<b.row+b.h;r++){
        for(var c=b.col;c<b.col+b.w;c++){
            G.grid[r][c]=null;
        }
    }
    G.moveHistory.push({id:b.id,col:b.col,row:b.row});
    b.col+=dcol;b.row+=drow;
    // 标记新位置
    for(var r2=b.row;r2<b.row+b.h;r2++){
        for(var c2=b.col;c2<b.col+b.w;c2++){
            G.grid[r2][c2]=b.id;
        }
    }
    G.steps++;
    sfxMove();
}

function undoMove(){
    if(G.moveHistory.length===0)return;
    var m=G.moveHistory.pop();
    var b=G.blocks[m.id];
    // 清除当前位置
    for(var r=b.row;r<b.row+b.h;r++){
        for(var c=b.col;c<b.col+b.w;c++){
            G.grid[r][c]=null;
        }
    }
    b.col=m.col;b.row=m.row;
    for(var r2=b.row;r2<b.row+b.h;r2++){
        for(var c2=b.col;c2<b.col+b.w;c2++){
            G.grid[r2][c2]=b.id;
        }
    }
    G.steps--;
    sfxClick();
}

function checkWin(){
    // 曹操到达出口(顶部中间)
    var cao=G.blocks[0]; // 曹操始终是第一个
    return cao.col===EXIT_COL&&cao.row===EXIT_ROW;
}

function onWin(){
    G.state='win';
    if(G.timerInterval)clearInterval(G.timerInterval);
    sfxWin();
    // 记录最佳
    var key=''+G.level;
    if(!G.bestSteps[key]||G.steps<G.bestSteps[key])G.bestSteps[key]=G.steps;
    if(!G.bestTime[key]||G.timer<G.bestTime[key])G.bestTime[key]=G.timer;
    saveBest();
}

// ==================== 渲染 ====================
function render(){
    var ctx=G.ctx;
    var W=G.W,H=G.H;
    // 清屏
    ctx.fillStyle='#1a0a00';
    ctx.fillRect(0,0,W,H);

    if(G.state==='menu'){renderMenu(ctx,W,H);return;}
    if(G.state==='win'){renderWin(ctx,W,H);return;}

    renderBoard(ctx);
    renderBlocks(ctx);
    renderUI(ctx,W,H);
    if(G.state==='paused')renderPause(ctx,W,H);
}

function renderMenu(ctx,W,H){
    // 标题
    ctx.fillStyle='#c9a34e';
    ctx.font='bold '+(W>500?64:40)+'px "Microsoft YaHei",sans-serif';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText('华 容 道',W/2,H*0.18);

    // 副标题
    ctx.fillStyle='#8a7a5a';
    ctx.font=(W>500?20:14)+'px "Microsoft YaHei",sans-serif';
    ctx.fillText('经典滑块益智游戏',W/2,H*0.26);

    // 关卡列表
    var startY=H*0.34;
    var itemH=Math.min(50,H*0.055);
    var listW=Math.min(360,W*0.85);
    var listX=(W-listW)/2;

    for(var i=0;i<LEVELS.length;i++){
        var y=startY+i*(itemH+6);
        if(y+itemH>H*0.92)break;
        var lv=LEVELS[i];
        var key=''+i;
        var best=G.bestSteps[key];

        // 背景
        ctx.fillStyle=i===0?'rgba(201,163,78,0.15)':'rgba(201,163,78,0.08)';
        roundRect(ctx,listX,y,listW,itemH,8);
        ctx.fill();

        // 边框
        ctx.strokeStyle='rgba(201,163,78,0.3)';
        ctx.lineWidth=1;
        roundRect(ctx,listX,y,listW,itemH,8);
        ctx.stroke();

        // 关卡名
        ctx.fillStyle='#e8d5a0';
        ctx.font='bold '+(W>500?18:15)+'px "Microsoft YaHei",sans-serif';
        ctx.textAlign='left';
        ctx.fillText((i+1)+'. '+lv.name,listX+15,y+itemH/2);

        // 描述
        ctx.fillStyle='#8a7a5a';
        ctx.font=(W>500?14:11)+'px "Microsoft YaHei",sans-serif';
        ctx.textAlign='center';
        ctx.fillText(lv.desc,W/2,y+itemH/2);

        // 最佳记录
        if(best){
            ctx.fillStyle='#c9a34e';
            ctx.font=(W>500?14:11)+'px "Microsoft YaHei",sans-serif';
            ctx.textAlign='right';
            ctx.fillText(best+'步',listX+listW-15,y+itemH/2);
        }
    }
}

function renderBoard(ctx){
    var cs=G.cellSize;
    var bx=G.boardX, by=G.boardY;

    // 棋盘背景
    ctx.fillStyle='#2a1a0a';
    roundRect(ctx,bx-6,by-6,COLS*cs+12,ROWS*cs+12,10);
    ctx.fill();
    ctx.strokeStyle='#5a4a2a';
    ctx.lineWidth=2;
    roundRect(ctx,bx-6,by-6,COLS*cs+12,ROWS*cs+12,10);
    ctx.stroke();

    // 网格线
    ctx.strokeStyle='#3a2a1a';
    ctx.lineWidth=0.5;
    for(var r=0;r<=ROWS;r++){
        ctx.beginPath();ctx.moveTo(bx,by+r*cs);ctx.lineTo(bx+COLS*cs,by+r*cs);ctx.stroke();
    }
    for(var c=0;c<=COLS;c++){
        ctx.beginPath();ctx.moveTo(bx+c*cs,by);ctx.lineTo(bx+c*cs,by+ROWS*cs);ctx.stroke();
    }

    // 出口标记
    ctx.fillStyle='rgba(231,76,60,0.2)';
    ctx.fillRect(bx+EXIT_COL*cs,by,2*cs,6);
    ctx.fillStyle='#e74c3c';
    ctx.font='bold 12px "Microsoft YaHei",sans-serif';
    ctx.textAlign='center';
    ctx.fillText('出口',bx+EXIT_COL*cs+cs,by-8);
}

function renderBlocks(ctx){
    var cs=G.cellSize;
    var bx=G.boardX, by=G.boardY;

    G.blocks.forEach(function(b){
        var bt=BLOCK_TYPES[b.type];
        var x=bx+b.col*cs;
        var y=by+b.row*cs;
        var w=b.w*cs;
        var h=b.h*cs;

        // 阴影
        ctx.fillStyle='rgba(0,0,0,0.3)';
        roundRect(ctx,x+3,y+3,w-4,h-4,6);
        ctx.fill();

        // 方块背景
        var grad=ctx.createLinearGradient(x,y,x,y+h);
        grad.addColorStop(0,bt.color);
        grad.addColorStop(1,shadeColor(bt.color,-30));
        ctx.fillStyle=grad;
        roundRect(ctx,x+1,y+1,w-2,h-2,6);
        ctx.fill();

        // 高光
        ctx.fillStyle='rgba(255,255,255,0.1)';
        roundRect(ctx,x+3,y+3,w-6,h/2-3,4);
        ctx.fill();

        // 边框
        ctx.strokeStyle=shadeColor(bt.color,30);
        ctx.lineWidth=1.5;
        roundRect(ctx,x+1,y+1,w-2,h-2,6);
        ctx.stroke();

        // 文字
        if(bt.label){
            ctx.fillStyle=bt.textColor;
            var fontSize=Math.min(w,h)*0.4;
            if(b.type==='C')fontSize*=0.9;
            ctx.font='bold '+Math.floor(fontSize)+'px "Microsoft YaHei",sans-serif';
            ctx.textAlign='center';
            ctx.textBaseline='middle';
            ctx.fillText(bt.label,x+w/2,y+h/2);
        }

        // 曹操特殊标记
        if(b.type==='C'){
            ctx.strokeStyle='rgba(255,215,0,0.5)';
            ctx.lineWidth=2;
            roundRect(ctx,x+3,y+3,w-6,h-6,4);
            ctx.stroke();
        }

        // 关羽标记
        if(b.type==='G'){
            ctx.strokeStyle='rgba(0,255,0,0.3)';
            ctx.lineWidth=1;
            roundRect(ctx,x+3,y+3,w-6,h-6,4);
            ctx.stroke();
        }
    });
}

// ==================== 输入处理 ====================
function setupInput(){
    var cv=G.canvas;

    // 鼠标/触摸状态
    var pointerDown=false;
    var startPX=0,startPY=0;
    var startBRow=0,startBCol=0;
    var movedBlock=null;

    function getPos(e){
        var rect=cv.getBoundingClientRect();
        if(e.touches){
            return{x:e.touches[0].clientX-rect.left,y:e.touches[0].clientY-rect.top};
        }
        return{x:e.clientX-rect.left,y:e.clientY-rect.top};
    }

    function hitBlock(px,py){
        var cs=G.cellSize;
        var bx=G.boardX, by=G.boardY;
        for(var i=G.blocks.length-1;i>=0;i--){
            var b=G.blocks[i];
            var x=bx+b.col*cs,y=by+b.row*cs;
            if(px>=x&&px<x+b.w*cs&&py>=y&&py<y+b.h*cs)return b;
        }
        return null;
    }

    function onDown(e){
        e.preventDefault();
        if(G.state==='paused'){G.state='playing';sfxClick();return;}
        if(G.state!=='playing')return;

        var pos=getPos(e);
        pointerDown=true;
        startPX=pos.x;startPY=pos.y;
        movedBlock=null;

        var b=hitBlock(pos.x,pos.y);
        if(b){
            G.selectedBlock=b;
            startBRow=b.row;startBCol=b.col;
            sfxClick();
        }else{
            G.selectedBlock=null;
        }
    }

    function onMove(e){
        e.preventDefault();
        if(!pointerDown||G.state!=='playing')return;
        if(!G.selectedBlock||G.animating)return;

        var pos=getPos(e);
        var dx=pos.x-startPX;
        var dy=pos.y-startPY;
        var cs=G.cellSize;
        var threshold=cs*0.3;

        if(Math.abs(dx)>threshold||Math.abs(dy)>threshold){
            // 确定移动方向
            var dcol=0,drow=0;
            if(Math.abs(dx)>Math.abs(dy)){
                dcol=dx>0?1:-1;
            }else{
                drow=dy>0?1:-1;
            }
            if(canMove(G.selectedBlock,dcol,drow)){
                moveBlock(G.selectedBlock,dcol,drow);
                startPX=pos.x;startPY=pos.y;
                movedBlock=G.selectedBlock;
                if(checkWin())onWin();
            }
        }
    }

    function onUp(e){
        e.preventDefault();
        if(G.state==='menu'||G.state==='win'){
            handleClick(getPos(e.changedTouches?e.changedTouches[0]:e));
        }
        pointerDown=false;
        movedBlock=null;
    }

    cv.addEventListener('mousedown',onDown);
    cv.addEventListener('mousemove',onMove);
    cv.addEventListener('mouseup',onUp);
    cv.addEventListener('touchstart',onDown,{passive:false});
    cv.addEventListener('touchmove',onMove,{passive:false});
    cv.addEventListener('touchend',onUp,{passive:false});

    // 键盘
    document.addEventListener('keydown',function(e){
        if(G.state==='menu'){
            var k=e.key;
            if(k>='1'&&k<='9'){var n=parseInt(k)-1;if(n<LEVELS.length){G.level=n;loadLevel(n);sfxClick();}}
            return;
        }
        if(G.state==='paused'){G.state='playing';sfxClick();return;}
        if(G.state==='win'){
            if(e.key==='Enter'||e.key===' '){
                if(G.level<LEVELS.length-1){G.level++;loadLevel(G.level);}
                else{G.state='menu';}
                sfxClick();
            }
            return;
        }
        if(G.state!=='playing')return;

        var b=G.selectedBlock;
        if(!b)return;
        var dcol=0,drow=0;
        switch(e.key){
            case'ArrowLeft':case'a':dcol=-1;break;
            case'ArrowRight':case'd':dcol=1;break;
            case'ArrowUp':case'w':drow=-1;break;
            case'ArrowDown':case's':drow=1;break;
            case'z':case'Z':undoMove();return;
            case'p':case'P':case'Escape':G.state='paused';sfxClick();return;
            default:return;
        }
        e.preventDefault();
        if(dcol!==0||drow!==0){
            if(canMove(b,dcol,drow)){
                moveBlock(b,dcol,drow);
                if(checkWin())onWin();
            }
        }
    });
}

function handleClick(pos){
    var W=G.W,H=G.H,px=pos.x,py=pos.y;

    if(G.state==='menu'){
        var startY=H*0.34;
        var itemH=Math.min(50,H*0.055);
        var listW=Math.min(360,W*0.85);
        var listX=(W-listW)/2;
        for(var i=0;i<LEVELS.length;i++){
            var y=startY+i*(itemH+6);
            if(y+itemH>H*0.92)break;
            if(px>=listX&&px<=listX+listW&&py>=y&&py<=y+itemH){
                G.level=i;loadLevel(i);sfxClick();return;
            }
        }
    }

    if(G.state==='playing'){
        var btnY=G.boardY+ROWS*G.cellSize+15;
        var btnW=Math.min(80,W*0.18);
        var btnH=36;
        var btns=['undo','restart','pause','menu'];
        var totalBtnW=btns.length*(btnW+10)-10;
        var startX2=(W-totalBtnW)/2;
        for(var j=0;j<btns.length;j++){
            var bx=startX2+j*(btnW+10);
            if(px>=bx&&px<=bx+btnW&&py>=btnY&&py<=btnY+btnH){
                switch(btns[j]){
                    case'undo':undoMove();break;
                    case'restart':loadLevel(G.level);sfxClick();break;
                    case'pause':G.state='paused';sfxClick();break;
                    case'menu':G.state='menu';if(G.timerInterval)clearInterval(G.timerInterval);sfxClick();break;
                }
                return;
            }
        }
    }

    if(G.state==='win'){
        var btnW2=Math.min(160,W*0.38);
        var btnH2=44;
        var btnY2=H*0.66;
        var labels2=['next','replay','menu'];
        var spacing2=10;
        for(var k=0;k<labels2.length;k++){
            var by2=btnY2+k*(btnH2+spacing2);
            if(px>=(W-btnW2)/2&&px<=(W+btnW2)/2&&py>=by2&&py<=by2+btnH2){
                switch(labels2[k]){
                    case'next':
                        if(G.level<LEVELS.length-1){G.level++;loadLevel(G.level);}
                        else{G.state='menu';}
                        sfxClick();break;
                    case'replay':loadLevel(G.level);sfxClick();break;
                    case'menu':G.state='menu';sfxClick();break;
                }
                return;
            }
        }
    }
}

// ==================== 工具函数 ====================
function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y);
    ctx.arcTo(x+w,y,x+w,y+r,r);
    ctx.lineTo(x+w,y+h-r);
    ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
    ctx.lineTo(x+r,y+h);
    ctx.arcTo(x,y+h,x,y+h-r,r);
    ctx.lineTo(x,y+r);
    ctx.arcTo(x,y,x+r,y,r);
    ctx.closePath();
}

function shadeColor(color,percent){
    var num=parseInt(color.replace('#',''),16);
    var r=Math.min(255,Math.max(0,(num>>16)+percent));
    var g=Math.min(255,Math.max(0,((num>>8)&0xff)+percent));
    var b=Math.min(255,Math.max(0,(num&0xff)+percent));
    return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

function formatTime(s){
    var m=Math.floor(s/60);
    var ss=s%60;
    return(m<10?'0':'')+m+':'+(ss<10?'0':'')+ss;
}

function gameLoop(){
    render();
    requestAnimationFrame(gameLoop);
}

(function(){
    var b = document.getElementById('start-game-btn');
    if (b) {
        b.removeAttribute('disabled');
        b.style.setProperty('display', 'block', 'important');
        b.addEventListener('click', function(){
            try { b.style.display = 'none'; } catch(e){}
            try {
                if (typeof startGame === 'function') startGame();
                else if (typeof init === 'function') init();
                else if (typeof launchGame === 'function') launchGame();
            } catch(e){ console.error('[start-btn] err', e); }
        });
    }
    var sp=document.getElementById('sponsorPanel'); if(sp){sp.addEventListener('click',function(){sp.style.setProperty('pointer-events','auto');},true);}
    var ia=document.getElementById('interstitialAd'); if(ia){ia.addEventListener('click',function(){ia.style.setProperty('pointer-events','auto');},true);}
})();
</script>
</body>
</html>
