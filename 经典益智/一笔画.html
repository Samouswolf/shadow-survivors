<script>
/* [STORAGE-POLYFILL v1] */
;(function(){
  var G = (typeof window !== 'undefined') ? window : (typeof globalThis !== 'undefined' ? globalThis : this);
  // 浏览器已有 Storage 构造函数，需确保其带 load/save/remove 静态方法
  var S = G.Storage;
  var needAttach = (typeof S === 'undefined' || typeof S.load !== 'function' || typeof S.save !== 'function');
  if (!needAttach) return;
  if (typeof S === 'undefined') { S = function(){}; G.Storage = S; }
  function parseSafe(s, d){
    if (s === null || s === undefined) return d;
    try { return JSON.parse(s); } catch(e) { try { return s; } catch(e2){ return d; } }
  }
  S.load = function(k, d){ try { return parseSafe(localStorage.getItem(k), d); } catch(e){ return d; } };
  S.save = function(k, v){ try { localStorage.setItem(k, typeof v==='string'?v:JSON.stringify(v)); } catch(e){} };
  S.remove = function(k){ try { localStorage.removeItem(k); } catch(e){} };
})();

// ==================== 配置 ====================
const LEVELS = [
    { nodes:4, edges:4 },  { nodes:4, edges:5 },  { nodes:5, edges:5 },
    { nodes:5, edges:6 },  { nodes:5, edges:7 },  { nodes:6, edges:6 },
    { nodes:6, edges:7 },  { nodes:6, edges:8 },  { nodes:6, edges:9 },
    { nodes:7, edges:7 },  { nodes:7, edges:8 },  { nodes:7, edges:9 },
    { nodes:7, edges:10 }, { nodes:7, edges:11 }, { nodes:8, edges:8 },
    { nodes:8, edges:10 }, { nodes:8, edges:11 }, { nodes:8, edges:12 },
    { nodes:8, edges:13 }, { nodes:9, edges:9 },  { nodes:9, edges:10 },
    { nodes:9, edges:11 }, { nodes:9, edges:12 }, { nodes:9, edges:13 },
    { nodes:10,edges:11 }, { nodes:10,edges:12 }, { nodes:10,edges:13 },
    { nodes:10,edges:14 }, { nodes:11,edges:13 }, { nodes:12,edges:14 },
];

const TOTAL_LEVELS = LEVELS.length;
const STORAGE_KEY = 'yibihua_progress';

// ==================== 种子随机数 ====================
function createRNG(seed){let s=seed|0;return function(){s=(s*16807+0)%2147483647;return(s-1)/2147483646}}

// ==================== 图论工具 ====================
function isConnected(adj){
    const n=adj.length,visited=new Set([0]),stack=[0];
    while(stack.length){const v=stack.pop();for(let u=0;u<n;u++){if(adj[v][u]&&!visited.has(u)){visited.add(u);stack.push(u)}}}
    return visited.size===n
}

function getOddVertices(adj){
    const odds=[];
    for(let i=0;i<adj.length;i++){const deg=adj[i].reduce((a,b)=>a+b,0);if(deg%2===1)odds.push(i)}
    return odds
}

function hasEulerianPath(adj){const odds=getOddVertices(adj);return odds.length===0||odds.length===2}

function countEdges(adj){let c=0;for(let i=0;i<adj.length;i++)for(let j=i+1;j<adj.length;j++)if(adj[i][j])c++;return c}

// ==================== 图生成 ====================
function generateGraph(n,targetEdges,seed){
    const rng=createRNG(seed);
    const maxE=n*(n-1)/2;
    const te=Math.min(targetEdges,maxE);
    for(let attempt=0;attempt<200;attempt++){
        const adj=Array(n).fill(null).map(()=>Array(n).fill(0));
        // 生成随机生成树保证连通
        const visited=new Set([0]),unvisited=new Set();
        for(let i=1;i<n;i++)unvisited.add(i);
        while(unvisited.size>0){
            const v=randFromSet(visited,rng),u=randFromSet(unvisited,rng);
            adj[v][u]=adj[u][v]=1;visited.add(u);unvisited.delete(u)
        }
        let curE=n-1;
        // 添加额外边
        const cands=[];
        for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)if(!adj[i][j])cands.push([i,j]);
        shuffle(cands,rng);
        for(const [i,j] of cands){if(curE>=te)break;adj[i][j]=adj[j][i]=1;curE++}
        if(curE<te)continue;
        // 修复奇度顶点
        fixOddVertices(adj,rng);
        if(isConnected(adj)&&hasEulerianPath(adj))return adj
    }
    // 兜底：生成简单环
    return fallbackGraph(n,te)
}

function fallbackGraph(n,targetE){
    const adj=Array(n).fill(null).map(()=>Array(n).fill(0));
    for(let i=0;i<n;i++){const j=(i+1)%n;adj[i][j]=adj[j][i]=1}
    let curE=n;
    for(let i=0;i<n&&curE<targetE;i++)for(let j=i+2;j<n&&curE<targetE;j++){
        if(j===(i+1)%n||adj[i][j])continue;
        adj[i][j]=adj[j][i]=1;curE++
    }
    fixOddVertices(adj,()=>Math.random());
    return adj
}

function fixOddVertices(adj,rng){
    const n=adj.length;
    for(let iter=0;iter<50;iter++){
        const odds=getOddVertices(adj);
        if(odds.length<=2)return;
        let fixed=false;
        for(let i=0;i<odds.length&&!fixed;i++)for(let j=i+1;j<odds.length&&!fixed;j++){
            const v=odds[i],u=odds[j];
            if(adj[v][u]===0){adj[v][u]=adj[u][v]=1;fixed=true}
        }
        if(!fixed&&odds.length>=4){
            // 移除两条边来调整
            const a=odds[0],b=odds[1],c=odds[2],d=odds[3];
            if(adj[a][b]===1&&adj[c][d]===1){adj[a][b]=adj[b][a]=0;adj[c][d]=adj[d][c]=0}
        }
        if(!fixed)break
    }
}

function randFromSet(s,rng){const arr=[...s];return arr[Math.floor(rng()*arr.length)]}
function shuffle(arr,rng){for(let i=arr.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}}

// ==================== 游戏状态 ====================
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const hintToast=document.getElementById('hintToast');

let currentLevel=0;
let gameStarted=false;
let completed=new Set();
let graph=null,nodePos=[],traversed=new Set(),currentNode=-1,path=[],hintActive=false,isComplete=false;
let animTime=0,particles=[],edgeAnimProgress=0;

// ==================== 进度存储 ====================
function loadProgress(){try{const d=JSON.parse(localStorage.getItem(STORAGE_KEY));if(d&&Array.isArray(d))completed=new Set(d)}catch(e){}}
function saveProgress(){localStorage.setItem(STORAGE_KEY,JSON.stringify([...completed]))}
function isUnlocked(lv){if(lv===0)return true;return completed.has(lv-1)||lv<=Math.max(0,...[...completed].map(x=>x+1),0)}

// ==================== 画布尺寸 ====================
function resize(){
    const wrap=document.getElementById('canvasWrap');
    const w=wrap.clientWidth, h=wrap.clientHeight;
    const size=Math.min(w,h,500);
    canvas.width=canvas.height=size;
    canvas.style.width=canvas.style.height=size+'px';
    if(graph)computeNodePositions();
    draw()
}
window.addEventListener('resize',resize);

function computeNodePositions(){
    const n=graph.length;
    const cx=canvas.width/2,cy=canvas.height/2;
    const radius=Math.min(canvas.width,canvas.height)*0.38;
    nodePos=[];
    for(let i=0;i<n;i++){
        const angle=(2*Math.PI*i/n)-Math.PI/2;
        nodePos.push({x:cx+radius*Math.cos(angle),y:cy+radius*Math.sin(angle)})
    }
}

function nodeRadius(){const n=graph?graph.length:4;return Math.max(20,Math.min(34,140/n))}

// ==================== 关卡加载 ====================
function loadLevel(lv){
    if(lv<0||lv>=TOTAL_LEVELS)return;
    currentLevel=lv;
    const cfg=LEVELS[lv];
    graph=generateGraph(cfg.nodes,cfg.edges,lv*137+42);
    traversed=new Set();
    currentNode=-1;
    path=[];
    hintActive=false;
    isComplete=false;
    particles=[];
    edgeAnimProgress=0;
    computeNodePositions();
    document.getElementById('levelInfo').textContent=`第 ${lv+1} 关 (${cfg.nodes}点·${countEdges(graph)}线)`;
    document.getElementById('completeOverlay').style.display='none';
    draw()
}

// ==================== 边键 ====================
function edgeKey(a,b){return a<b?`${a}-${b}`:`${b}-${a}`}

// ==================== 绘制 ====================
function draw(){
    const w=canvas.width,h=canvas.height;
    ctx.clearRect(0,0,w,h);
    // 背景
    const bgGrad=ctx.createRadialGradient(w/2,h/2,0,w/2,h/2,w*.7);
    bgGrad.addColorStop(0,'#161b22');
    bgGrad.addColorStop(1,'#0a0a12');
    ctx.fillStyle=bgGrad;
    ctx.fillRect(0,0,w,h);
    // 网格
    ctx.strokeStyle='rgba(255,255,255,.015)';
    ctx.lineWidth=1;
    const gs=35;
    for(let x=0;x<w;x+=gs){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}
    for(let y=0;y<h;y+=gs){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}
    if(!graph)return;
    const n=graph.length,r=nodeRadius();
    // 收集边
    const edges=[];
    for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)if(graph[i][j])edges.push([i,j]);
    // 绘制边
    const untraversedColor='rgba(48,54,61,0.7)';
    const traversedColor='#58a6ff';
    const traversedGlow='rgba(88,166,255,0.35)';
    const hintColor='rgba(255,213,0,0.6)';
    for(const [i,j] of edges){
        const ek=edgeKey(i,j);
        const isTraversed=traversed.has(ek);
        const isHinted=hintActive&&currentNode>=0&&(i===currentNode||j===currentNode)&&!isTraversed;
        const pi=nodePos[i],pj=nodePos[j];
        ctx.beginPath();
        ctx.moveTo(pi.x,pi.y);
        ctx.lineTo(pj.x,pj.y);
        if(isTraversed){
            ctx.strokeStyle=traversedColor;
            ctx.lineWidth=3;
            ctx.shadowColor=traversedGlow;
            ctx.shadowBlur=8;
            ctx.stroke();
            ctx.shadowBlur=0;
            // 内发光线
            ctx.strokeStyle='rgba(88,166,255,0.5)';
            ctx.lineWidth=1;
            ctx.stroke()
        }else if(isHinted){
            ctx.strokeStyle=hintColor;
            ctx.lineWidth=3;
            ctx.setLineDash([6,3]);
            ctx.stroke();
            ctx.setLineDash([])
        }else{
            ctx.strokeStyle=untraversedColor;
            ctx.lineWidth=2.5;
            ctx.stroke()
        }
    }
    // 绘制节点
    const odds=getOddVertices(graph);
    for(let i=0;i<n;i++){
        const p=nodePos[i];
        const isCurrent=i===currentNode;
        const isStartEnd=odds.includes(i);
        const isHinted=hintActive&&currentNode>=0&&!traversed.has(edgeKey(currentNode,i))&&graph[currentNode][i];
        const isStartHint=hintActive&&currentNode<0&&isStartEnd;
        // 光晕
        if(isCurrent){
            const pulse=1+Math.sin(animTime*4)*0.2;
            const glow=ctx.createRadialGradient(p.x,p.y,r*0.5,p.x,p.y,r*1.8*pulse);
            glow.addColorStop(0,'rgba(88,166,255,0.5)');
            glow.addColorStop(1,'rgba(88,166,255,0)');
            ctx.fillStyle=glow;
            ctx.beginPath();ctx.arc(p.x,p.y,r*1.8*pulse,0,Math.PI*2);ctx.fill()
        }
        if(isHinted||isStartHint){
            const glow=ctx.createRadialGradient(p.x,p.y,r*0.3,p.x,p.y,r*1.5);
            glow.addColorStop(0,'rgba(255,213,0,0.35)');
            glow.addColorStop(1,'rgba(255,213,0,0)');
            ctx.fillStyle=glow;
            ctx.beginPath();ctx.arc(p.x,p.y,r*1.5,0,Math.PI*2);ctx.fill()
        }
        // 节点圆
        const grad=ctx.createRadialGradient(p.x-r*0.3,p.y-r*0.3,r*0.1,p.x,p.y,r);
        if(isCurrent){grad.addColorStop(0,'#79c0ff');grad.addColorStop(1,'#1f6feb')}
        else if(isHinted||isStartHint){grad.addColorStop(0,'#ffe066');grad.addColorStop(1,'#b08800')}
        else if(isStartEnd&&!isCurrent){grad.addColorStop(0,'#d29922');grad.addColorStop(0.6,'#8b6914')}
        else{grad.addColorStop(0,'#484f58');grad.addColorStop(1,'#21262d')}
        ctx.fillStyle=grad;
        ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();
        // 边框
        ctx.strokeStyle=isCurrent?'rgba(88,166,255,.8)':isHinted||isStartHint?'rgba(255,213,0,.6)':'rgba(255,255,255,.15)';
        ctx.lineWidth=isCurrent?2.5:1.5;
        ctx.stroke();
        // 标签
        ctx.fillStyle='#c9d1d9';
        ctx.font=`bold ${Math.floor(r*0.7)}px 'Segoe UI','Microsoft YaHei',sans-serif`;
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(i+1,p.x,p.y)
    }
    // 粒子
    for(const pt of particles){
        ctx.fillStyle=`rgba(${pt.r},${pt.g},${pt.b},${pt.a})`;
        ctx.beginPath();ctx.arc(pt.x,pt.y,pt.size,0,Math.PI*2);ctx.fill()
    }
    // 进度条
    const totalEdges=countEdges(graph);
    const doneEdges=traversed.size;
    const barW=w*.7,barH=5,barX=(w-barW)/2,barY=h-18;
    ctx.fillStyle='rgba(255,255,255,.06)';
    ctx.fillRect(barX,barY,barW,barH);
    ctx.fillStyle='#58a6ff';
    ctx.fillRect(barX,barY,barW*(doneEdges/totalEdges),barH);
    ctx.fillStyle='rgba(255,255,255,.35)';
    ctx.font='10px "Microsoft YaHei",sans-serif';
    ctx.textAlign='center';
    ctx.fillText(`${doneEdges}/${totalEdges}`,w/2,barY-4)
}

// ==================== 粒子 ====================
function spawnParticles(x,y,count){
    for(let i=0;i<count;i++){
        particles.push({
            x,y,r:88+Math.floor(Math.random()*80),g:166+Math.floor(Math.random()*40),b:255,
            a:1,size:2+Math.random()*3,
            vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,
            life:1
        })
    }
}

function updateParticles(dt){
    for(let i=particles.length-1;i>=0;i--){
        const p=particles[i];
        p.x+=p.vx;p.y+=p.vy;
        p.life-=dt*2;
        p.a=p.life;
        if(p.life<=0)particles.splice(i,1)
    }
}

// ==================== 动画循环 ====================
let lastTime=0;
function animate(time){
    if (!gameStarted) { requestAnimationFrame(animate); return; }
    const dt=lastTime?(time-lastTime)/1000:0.016;
    lastTime=time;
    animTime+=dt;
    updateParticles(dt);
    draw();
    requestAnimationFrame(animate)
}

// ==================== 交互处理 ====================
function getNodeAt(mx,my){
    if(!graph||!nodePos.length)return-1;
    const r=nodeRadius()+8;
    for(let i=0;i<nodePos.length;i++){
        const dx=mx-nodePos[i].x,dy=my-nodePos[i].y;
        if(dx*dx+dy*dy<=r*r)return i
    }
    return-1
}

function handleNodeTap(nodeIdx){
    if(isComplete)return;
    if(currentNode<0){
        // 开始：选择起点
        currentNode=nodeIdx;
        path=[nodeIdx];
        hintActive=false;
        showToast('已选择起点，点击相邻节点连线');
        draw();
        return
    }
    if(nodeIdx===currentNode)return;
    const ek=edgeKey(currentNode,nodeIdx);
    if(graph[currentNode][nodeIdx]&&!traversed.has(ek)){
        // 遍历边
        traversed.add(ek);
        const prev=currentNode;
        currentNode=nodeIdx;
        path.push(nodeIdx);
        hintActive=false;
        // 粒子
        const midX=(nodePos[prev].x+nodePos[nodeIdx].x)/2;
        const midY=(nodePos[prev].y+nodePos[nodeIdx].y)/2;
        spawnParticles(midX,midY,8);
        // 检查完成
        const totalEdges=countEdges(graph);
        if(traversed.size===totalEdges){
            onComplete()
        }
        draw()
    }else{
        // 无效移动
        if(traversed.has(ek))showToast('此线已走过！');
        else if(graph[currentNode][nodeIdx])showToast('已走过');
        else showToast('两点不相连');
        // 震动反馈
        shakeNode(currentNode)
    }
}

function shakeNode(idx){
    const orig={...nodePos[idx]};
    let count=0;
    const shake=()=>{
        if(count>=8){nodePos[idx]=orig;draw();return}
        nodePos[idx]={x:orig.x+(Math.random()-0.5)*6,y:orig.y+(Math.random()-0.5)*6};
        count++;draw();
        requestAnimationFrame(()=>setTimeout(shake,40))
    };
    shake()
}

function showToast(msg){
    hintToast.textContent=msg;
    hintToast.classList.add('show');
    clearTimeout(hintToast._timeout);
    hintToast._timeout=setTimeout(()=>hintToast.classList.remove('show'),1500)
}

// ==================== 完成处理 ====================
function onComplete(){
    isComplete=true;
    const totalEdges=countEdges(graph);
    const steps=path.length;
    const perfect=steps===totalEdges+1;
    // 星级评定
    let stars=1;
    if(perfect)stars=3;
    else if(steps<=totalEdges+3)stars=2;
    // 粒子爆发
    if(nodePos.length)for(const p of nodePos)spawnParticles(p.x,p.y,10);
    // 保存进度
    completed.add(currentLevel);
    saveProgress();
    // 显示弹窗
    document.getElementById('starsDisplay').textContent='⭐'.repeat(stars)+'☆'.repeat(3-stars);
    document.getElementById('completeMsg').textContent=perfect?'完美！一笔画完成！':`完成！用了 ${steps} 步`;
    document.getElementById('completeOverlay').style.display='flex';
    // 插屏广告
    setTimeout(()=>{if(window.showInterstitialAd)window.showInterstitialAd()},600);
    draw()
}

// ==================== 画布事件 ====================
canvas.addEventListener('click',e=>{
    const rect=canvas.getBoundingClientRect();
    const scaleX=canvas.width/rect.width;
    const scaleY=canvas.height/rect.height;
    const mx=(e.clientX-rect.left)*scaleX;
    const my=(e.clientY-rect.top)*scaleY;
    const node=getNodeAt(mx,my);
    if(node>=0)handleNodeTap(node)
});

canvas.addEventListener('touchstart',e=>{
    e.preventDefault();
    const touch=e.touches[0];
    const rect=canvas.getBoundingClientRect();
    const scaleX=canvas.width/rect.width;
    const scaleY=canvas.height/rect.height;
    const mx=(touch.clientX-rect.left)*scaleX;
    const my=(touch.clientY-rect.top)*scaleY;
    const node=getNodeAt(mx,my);
    if(node>=0)handleNodeTap(node)
},{passive:false});

// ==================== 按钮事件 ====================
document.getElementById('btnHint').addEventListener('click',()=>{
    if(isComplete)return;
    hintActive=!hintActive;
    if(hintActive){
        if(currentNode<0){
            showToast('金色节点为推荐起点（奇度顶点）');
        }else{
            const hasMove=graph[currentNode].some((v,i)=>v&&!traversed.has(edgeKey(currentNode,i)));
            if(hasMove)showToast('金色虚线为可走边');
            else showToast('当前节点无路可走，请撤销');
        }
    }
    draw()
});

document.getElementById('btnUndo').addEventListener('click',()=>{
    if(isComplete||path.length<2)return;
    const last=path.pop();
    const prev=path[path.length-1];
    const ek=edgeKey(last,prev);
    traversed.delete(ek);
    currentNode=prev;
    hintActive=false;
    showToast('已撤销');
    draw()
});

document.getElementById('btnReset').addEventListener('click',()=>{
    traversed.clear();
    currentNode=-1;
    path=[];
    hintActive=false;
    isComplete=false;
    particles=[];
    document.getElementById('completeOverlay').style.display='none';
    showToast('已重置');
    draw()
});

document.getElementById('btnLevels').addEventListener('click',openLevelSelect);
document.getElementById('btnCloseLevels').addEventListener('click',()=>{
    document.getElementById('levelSelect').style.display='none'
});
document.getElementById('btnNext').addEventListener('click',()=>{
    if(currentLevel+1<TOTAL_LEVELS){loadLevel(currentLevel+1)}
    document.getElementById('completeOverlay').style.display='none'
});

// ==================== 关卡选择 ====================
function openLevelSelect(){
    const grid=document.getElementById('levelGrid');
    grid.innerHTML='';
    for(let i=0;i<TOTAL_LEVELS;i++){
        const btn=document.createElement('button');
        btn.className='level-btn';
        btn.textContent=i+1;
        if(completed.has(i))btn.classList.add('completed');
        else if(i===currentLevel)btn.classList.add('current');
        else if(!isUnlocked(i))btn.classList.add('locked');
        if(isUnlocked(i))btn.addEventListener('click',()=>{
            document.getElementById('levelSelect').style.display='none';
            loadLevel(i)
        });
        grid.appendChild(btn)
    }
    document.getElementById('levelSelect').style.display='flex'
}

// ==================== 广告系统 ====================
(function(){
var sb=document.getElementById('sponsorBtn'),sp=document.getElementById('sponsorPanel'),sc=document.getElementById('sponsorClose');
if(sb&&sp){sb.onclick=function(){sp.style.display='flex'};if(sc)sc.onclick=function(){sp.style.display='none'}}
var ia=document.getElementById('interstitialAd'),si=document.getElementById('skipInterstitial');
if(ia&&si){si.onclick=function(){ia.style.display='none'}}
window.showInterstitialAd=function(){if(ia)ia.style.display='flex'};
})();

// ==================== 键盘快捷键 ====================
document.addEventListener('keydown',e=>{
    if(e.key==='z'&&(e.ctrlKey||e.metaKey)){e.preventDefault();document.getElementById('btnUndo').click()}
    if(e.key==='h')document.getElementById('btnHint').click();
    if(e.key==='r'&&!e.ctrlKey&&!e.metaKey){e.preventDefault();document.getElementById('btnReset').click()}
    if(e.key==='Escape'){document.getElementById('levelSelect').style.display='none';document.getElementById('completeOverlay').style.display='none'}
});

// ==================== 启动 ====================
loadProgress();
resize();
loadLevel(Math.max(0,...[...completed].map(x=>x+1),0));
requestAnimationFrame(animate);
// 开始界面
const startScreen = document.getElementById('startScreen');
const startBtn = document.getElementById('startBtn');
startBtn.addEventListener('click', () => {
  startScreen.classList.add('hidden');
  gameStarted = true;
});
// 重写reset按钮
document.getElementById('btnReset').addEventListener('click', () => {
  startScreen.classList.remove('hidden');
  gameStarted = false;
  traversed.clear();
  currentNode=-1;
  path=[];
  hintActive=false;
  isComplete=false;
  particles=[];
  edgeAnimProgress=0;
  draw();
});

        // 游戏结束处理
        function gameOver() {
            console.log("游戏结束");
        }
        
        // 音效支持
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq = 440, duration = 0.1) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }
        
        // 计分系统
        let score = 0;
        function addScore(points) {
            score += points;
        }
        function getScore() {
            return score;
        }
        function resetScore() {
            score = 0;
        }
        
        // 最高分系统
        let highScore = Storage.load("high_score", 0);
        function updateHighScore(newScore) {
            if(newScore > highScore) {
                highScore = newScore;
                Storage.save("high_score", highScore);
            }
        }
        </script>
