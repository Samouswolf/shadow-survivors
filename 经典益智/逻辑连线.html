<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>逻辑连线</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); min-height: 100vh; overflow: hidden; }
        .game-container { width: 100%; height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 10px; }
        .stat { display: flex; flex-direction: column; align-items: center; color: #fff; }
        .stat-label { font-size: 12px; opacity: 0.8; }
        .stat-value { font-size: 24px; font-weight: bold; color: #ffd700; }
        
        .canvas-container { flex: 1; position: relative; background: rgba(0,0,0,0.2); border-radius: 15px; overflow: hidden; }
        #gameCanvas { width: 100%; height: 100%; display: block; }
        
        .controls { display: flex; gap: 10px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
        .btn { padding: 12px 25px; border: none; border-radius: 25px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
        .btn-secondary { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; }
        .btn-success { background: linear-gradient(135deg, #11998e, #38ef7d); color: #fff; }
        
        .level-info { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: #fff; padding: 10px; border-radius: 10px; font-size: 12px; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 10px; font-size: 14px; }
        
        .win-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        .win-overlay.hidden { display: none; }
        .win-overlay h2 { color: #ffd700; font-size: 36px; margin-bottom: 20px; }
        .win-overlay p { color: #fff; font-size: 18px; margin-bottom: 20px; }

.sponsor-btn{position:fixed;top:44px;right:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:3px 9px;border-radius:10px;font:11px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}

.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}

.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.interstitial-ad.show{display:flex}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}

</style>
</head>
<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">关卡</div>
                <div class="stat-value" id="level">1</div>
            </div>
            <div class="stat">
                <div class="stat-label">用时</div>
                <div class="stat-value" id="time">0s</div>
            </div>
            <div class="stat">
                <div class="stat-label">正确</div>
                <div class="stat-value" id="correct">0/0</div>
            </div>
        </div>
        
        <div class="canvas-container">
            <canvas id="gameCanvas"></canvas>
            <div class="level-info" id="levelInfo">
                <div>将左列与右列正确连线</div>
                <div>点击两个匹配项完成连线</div>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" id="btnHint">💡 提示</button>
            <button class="btn btn-secondary" id="btnReset">🔄 重置</button>
            <button class="btn btn-success" id="btnNext">➡️ 下一关</button>
        </div>
        
        <div class="win-overlay hidden" id="winOverlay">
            <h2>🎉 恭喜通关！</h2>
            <p id="winText">用时：0秒</p>

        </div>
        
        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script src="../game_core.js"></script>
<script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script>
        const PAIRS = [
            ['苹果', '水果'],
            ['胡萝卜', '蔬菜'],
            ['狗', '动物'],
            ['玫瑰', '花'],
            ['太阳', '恒星'],
            ['月亮', '卫星'],
            ['钢琴', '乐器'],
            ['足球', '球类'],
            ['电脑', '电子产品'],
            ['书', '文具'],
            ['汽车', '交通工具'],
            ['飞机', '交通工具'],
            ['医生', '职业'],
            ['教师', '职业'],
            ['猫', '动物'],
            ['鸟', '动物'],
            ['鱼', '动物'],
            ['桌子', '家具'],
            ['椅子', '家具'],
            ['床', '家具'],
            ['米饭', '主食'],
            ['面条', '主食'],
            ['咖啡', '饮料'],
            ['茶', '饮料'],
            ['牛奶', '饮料'],
            ['米饭', '食物'],
            ['面包', '食物'],
            ['鸡蛋', '食物'],
            ['盐', '调味品'],
            ['糖', '调味品'],
            ['辣椒', '调味品'],
            ['蓝色', '颜色'],
            ['红色', '颜色'],
            ['绿色', '颜色'],
            ['黄色', '颜色'],
            ['夏天', '季节'],
            ['冬天', '季节'],
            ['春天', '季节'],
            ['秋天', '季节'],
            ['北京', '城市'],
            ['上海', '城市'],
            ['东京', '城市'],
            ['纽约', '城市'],
            ['巴黎', '城市']
        ];
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let level = 1;
        let pairs = [];
        let leftItems = [];
        let rightItems = [];
        let connections = [];
        let selected = null;
        let correctCount = 0;
        let startTime = 0;
        let highScore = parseInt(localStorage.getItem('highscore_逻辑连线') || '0');
        
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        
        function shuffleArray(arr) {
            const shuffled = [...arr];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }
        
        function generateLevel() {
            const pairCount = Math.min(3 + level, 10);
            const shuffledPairs = shuffleArray(PAIRS).slice(0, pairCount);
            
            pairs = shuffledPairs.map((p, i) => ({
                id: i,
                left: p[0],
                right: p[1],
                connected: false
            }));
            
            leftItems = shuffleArray(pairs.map((p, i) => ({ id: i, text: p.left, x: 0, y: 0 })));
            rightItems = shuffleArray(pairs.map((p, i) => ({ id: i, text: p.right, x: 0, y: 0 })));
            
            connections = [];
            selected = null;
            correctCount = 0;
            startTime = Date.now();
            
            updateStats();
            render();
        }
        
        function getItemPosition(item, isLeft) {
            const padding = 60;
            const itemHeight = 50;
            const items = isLeft ? leftItems : rightItems;
            const index = items.indexOf(item);
            
            const spacing = (canvas.height - padding * 2) / (items.length + 1);
            const y = padding + spacing * (index + 1);
            const x = isLeft ? padding : canvas.width - padding;
            
            item.x = x;
            item.y = y;
            
            return { x, y };
        }
        
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 绘制背景网格
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 30) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 30) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
            
            // 绘制已完成的连线
            connections.forEach(conn => {
                const leftItem = leftItems.find(i => i.id === conn.leftId);
                const rightItem = rightItems.find(i => i.id === conn.rightId);
                
                if (leftItem && rightItem) {
                    ctx.strokeStyle = conn.correct ? '#48c78e' : '#f87171';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(leftItem.x, leftItem.y);
                    ctx.lineTo(rightItem.x, rightItem.y);
                    ctx.stroke();
                }
            });
            
            // 绘制正在连接的线
            if (selected) {
                const item = selected.isLeft ? 
                    leftItems.find(i => i.id === selected.id) : 
                    rightItems.find(i => i.id === selected.id);
                
                if (item) {
                    ctx.strokeStyle = '#ffd700';
                    ctx.lineWidth = 3;
                    ctx.setLineDash([5, 5]);
                    ctx.beginPath();
                    ctx.moveTo(item.x, item.y);
                    ctx.lineTo(item.x, item.y);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            }
            
            // 绘制左侧项目
            leftItems.forEach(item => {
                const pos = getItemPosition(item, true);
                
                // 圆形背景
                ctx.fillStyle = selected && selected.isLeft && selected.id === item.id ? 
                    'rgba(255, 215, 0, 0.5)' : 'rgba(255,255,255,0.2)';
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, 25, 0, Math.PI * 2);
                ctx.fill();
                
                // 文字
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 16px Microsoft YaHei';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(item.text, pos.x, pos.y);
            });
            
            // 绘制右侧项目
            rightItems.forEach(item => {
                const pos = getItemPosition(item, false);
                
                // 圆形背景
                ctx.fillStyle = selected && !selected.isLeft && selected.id === item.id ? 
                    'rgba(255, 215, 0, 0.5)' : 'rgba(255,255,255,0.2)';
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, 25, 0, Math.PI * 2);
                ctx.fill();
                
                // 文字
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 16px Microsoft YaHei';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(item.text, pos.x, pos.y);
            });
        }
        
        function findItemAtPosition(x, y) {
            const threshold = 30;
            
            for (const item of leftItems) {
                const pos = getItemPosition(item, true);
                const dist = Math.sqrt((x - pos.x) ** 2 + (y - pos.y) ** 2);
                if (dist < threshold) {
                    return { ...item, isLeft: true };
                }
            }
            
            for (const item of rightItems) {
                const pos = getItemPosition(item, false);
                const dist = Math.sqrt((x - pos.x) ** 2 + (y - pos.y) ** 2);
                if (dist < threshold) {
                    return { ...item, isLeft: false };
                }
            }
            
            return null;
        }
        
        function handleClick(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const item = findItemAtPosition(x, y);
            
            if (!item) {
                selected = null;
                render();
                return;
            }
            
            if (!selected) {
                selected = item;
            } else if (selected.isLeft !== item.isLeft) {
                // 尝试连接
                const pair = pairs.find(p => p.id === selected.id);
                const isCorrect = pair && 
                    ((selected.isLeft && !item.isLeft && pair.left === selected.text && pair.right === item.text) ||
                     (!selected.isLeft && item.isLeft && pair.left === item.text && pair.right === selected.text));
                
                connections.push({
                    leftId: selected.isLeft ? selected.id : item.id,
                    rightId: selected.isLeft ? item.id : selected.id,
                    correct: isCorrect
                });
                
                if (isCorrect) {
                    correctCount++;
                    updateStats();
                    
                    if (correctCount === pairs.length) {
                        setTimeout(showWin, 500);
                    }
                }
                
                selected = null;
            } else {
                // 重新选择
                selected = item;
            }
            
            render();
        }
        
        function handleTouch(e) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            
            handleClick({ clientX: touch.clientX, clientY: touch.clientY });
        }
        
        function render() {
            draw();
            
            // 更新时间
            if (correctCount < pairs.length) {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                document.getElementById('time').textContent = elapsed + 's';
            }
        }
        
        function showHint() {
            if (correctCount >= pairs.length) return;
            
            // 找一个未完成的配对
            const remaining = pairs.filter(p => !connections.some(c => 
                (c.leftId === p.id || c.rightId === p.id) && c.correct));
            
            if (remaining.length > 0) {
                const hint = remaining[0];
                const leftItem = leftItems.find(i => i.id === hint.id);
                const rightItem = rightItems.find(i => i.id === hint.id);
                
                if (leftItem && rightItem) {
                    // 高亮提示
                    selected = { id: leftItem.id, isLeft: true };
                    render();
                    
                    setTimeout(() => {
                        selected = { id: rightItem.id, isLeft: false };
                        render();
                        
                        // 自动连接
                        setTimeout(() => {
                            connections.push({
                                leftId: leftItem.id,
                                rightId: rightItem.id,
                                correct: true
                            });
                            correctCount++;
                            selected = null;
                            updateStats();
                            render();
                            
                            if (correctCount === pairs.length) {
                                setTimeout(showWin, 500);
                            }
                        }, 500);
                    }, 500);
                }
            }
        }
        
        function showWin() {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            document.getElementById('winText').textContent = `用时：${elapsed}秒`;
            document.getElementById('winOverlay').classList.remove('hidden');
            
            const score = Math.max(0, 1000 - elapsed * 10);
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('highscore_逻辑连线', highScore);
            }
        }
        
        function updateStats() {
            document.getElementById('level').textContent = level;
            document.getElementById('correct').textContent = `${correctCount}/${pairs.length}`;
        }
        
        canvas.addEventListener('click', handleClick);
        canvas.addEventListener('touchstart', handleTouch, { passive: false });
        
        document.getElementById('btnHint').onclick = showHint;
        
        document.getElementById('btnReset').onclick = () => {
            connections = [];
            correctCount = 0;
            startTime = Date.now();
            selected = null;
            updateStats();
            render();
        };
        
        document.getElementById('btnNext').onclick = () => {
            level++;
            generateLevel();
        };
        
        document.getElementById('btnContinue').onclick = () => {
            document.getElementById('winOverlay').classList.add('hidden');
            level++;
            generateLevel();
        };
        
        // 初始化
        resizeCanvas();
        window.addEventListener('resize', () => {
            resizeCanvas();
            render();
        });
        
        generateLevel();
        
        // 游戏循环
        setInterval(render, 100);
    </script>

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
