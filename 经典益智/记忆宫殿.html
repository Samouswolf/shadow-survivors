<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>记忆宫殿</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; overflow: hidden; }
        .game-container { width: 100%; height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 10px; }
        .stat { display: flex; flex-direction: column; align-items: center; color: #fff; }
        .stat-label { font-size: 12px; opacity: 0.8; }
        .stat-value { font-size: 24px; font-weight: bold; color: #ffd700; }
        
        .palace-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 15px; max-width: 400px; margin: 0 auto; }
        
        .room { aspect-ratio: 1; background: rgba(255,255,255,0.1); border-radius: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s; border: 2px solid transparent; position: relative; overflow: hidden; }
        .room:hover { background: rgba(255,255,255,0.2); }
        .room.selected { border-color: #ffd700; box-shadow: 0 0 20px rgba(255,215,0,0.5); }
        .room.correct { background: rgba(72, 199, 142, 0.3); border-color: #48c78e; }
        .room.wrong { background: rgba(248, 113, 113, 0.3); border-color: #f87171; }
        .room.memorizing { background: rgba(96, 165, 250, 0.3); border-color: #60a5fa; }
        
        .room-icon { font-size: 36px; margin-bottom: 5px; }
        .room-number { font-size: 14px; color: rgba(255,255,255,0.6); }
        
        .phase-display { text-align: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 10px; }
        .phase-display h2 { color: #ffd700; margin-bottom: 10px; }
        .phase-display p { color: #fff; font-size: 14px; }
        
        .controls { display: flex; gap: 10px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
        .btn { padding: 12px 25px; border: none; border-radius: 25px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
        .btn-success { background: linear-gradient(135deg, #48c78e, #10b981); color: #fff; }
        
        .progress-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; margin-top: 10px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); transition: width 0.3s; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 10px; font-size: 14px; }
        
        .memo-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        .memo-overlay.hidden { display: none; }
        .memo-timer { font-size: 72px; font-weight: bold; color: #ffd700; }
        .memo-instruction { color: #fff; margin-top: 20px; font-size: 18px; }
    /* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}

<body>
    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">关卡</div>
                <div class="stat-value" id="level">1</div>
            </div>
            <div class="stat">
                <div class="stat-label">得分</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">最高分</div>
                <div class="stat-value" id="highScore">0</div>
            </div>
        </div>
        
        <div class="phase-display" id="phaseDisplay">
            <h2 id="phaseTitle">记忆宫殿</h2>
            <p id="phaseDesc">记住每个房间的物品位置，然后测试你的记忆！</p>
        </div>
        
        <div class="palace-grid" id="palaceGrid"></div>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" id="btnStart">🚀 开始记忆</button>
            <button class="btn btn-success" id="btnNext" style="display:none;">➡️ 下一关</button>
        </div>
        
        <div class="memo-overlay hidden" id="memoOverlay">
            <div class="memo-timer" id="memoTimer">3</div>
            <div class="memo-instruction">记住房间中的物品！</div>
        </div>
        
        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script src="../game_core.js"></script>
<script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script>
        const ITEMS = ['🗡️', '🛡️', '💎', '📜', '🔮', '🏆', '🗝️', '💰', '👑', '🎭', '🎪', '🏺', '⚗️', '🔭', '🎯', '🧭'];
        const ROOM_COUNT = 8;
        
        let level = 1;
        let score = 0;
        let highScore = parseInt(localStorage.getItem('highscore_记忆宫殿') || '0');
        let phase = 'idle'; // idle, memorizing, recalling
        let rooms = [];
        let selectedRoom = null;
        let recalledItems = [];
        let correctCount = 0;
        
        function generateLevel() {
            rooms = [];
            const items = [...ITEMS].sort(() => Math.random() - 0.5);
            
            for (let i = 0; i < ROOM_COUNT; i++) {
                rooms.push({
                    id: i,
                    item: items[i],
                    correct: false,
                    wrong: false
                });
            }
            
            render();
            updateStats();
        }
        
        function render() {
            const grid = document.getElementById('palaceGrid');
            grid.innerHTML = '';
            
            rooms.forEach((room, index) => {
                const el = document.createElement('div');
                el.className = 'room';
                el.dataset.id = room.id;
                
                if (phase === 'idle') {
                    el.classList.add('memorizing');
                    el.innerHTML = `
                        <div class="room-icon">🏛️</div>
                        <div class="room-number">房间 ${index + 1}</div>
                    `;
                } else if (phase === 'recalling') {
                    if (room.correct) {
                        el.classList.add('correct');
                        el.innerHTML = `
                            <div class="room-icon">${room.item}</div>
                            <div class="room-number">✓</div>
                        `;
                    } else if (room.wrong) {
                        el.classList.add('wrong');
                        el.innerHTML = `
                            <div class="room-icon">?</div>
                            <div class="room-number">✗</div>
                        `;
                    } else {
                        el.innerHTML = `
                            <div class="room-icon">🏛️</div>
                            <div class="room-number">房间 ${index + 1}</div>
                        `;
                        el.onclick = () => selectRoom(room.id);
                    }
                } else if (phase === 'memorizing') {
                    el.classList.add('memorizing');
                    el.innerHTML = `
                        <div class="room-icon">${room.item}</div>
                        <div class="room-number">房间 ${index + 1}</div>
                    `;
                }
                
                grid.appendChild(el);
            });
        }
        
        function selectRoom(id) {
            if (phase !== 'recalling') return;
            
            selectedRoom = id;
            render();
            
            const room = rooms.find(r => r.id === id);
            const expectedItem = room.item;
            
            // 显示物品选择
            showItemPicker(id, expectedItem);
        }
        
        function showItemPicker(roomId, expectedItem) {
            const options = [expectedItem];
            while (options.length < 4) {
                const randomItem = ITEMS[Math.floor(Math.random() * ITEMS.length)];
                if (!options.includes(randomItem)) options.push(randomItem);
            }
            options.sort(() => Math.random() - 0.5);
            
            const choice = prompt(`房间 ${roomId + 1} 的物品是？\n\nA: ${options[0]}\nB: ${options[1]}\nC: ${options[2]}\nD: ${options[3]}\n\n请输入 A/B/C/D`);
            
            const choiceMap = { 'A': 0, 'B': 1, 'C': 2, 'D': 3 };
            if (choice && choiceMap.hasOwnProperty(choice.toUpperCase())) {
                const selectedItem = options[choiceMap[choice.toUpperCase()]];
                
                if (selectedItem === expectedItem) {
                    rooms[roomId].correct = true;
                    correctCount++;
                    score += 100 * level;
                } else {
                    rooms[roomId].wrong = true;
                    score = Math.max(0, score - 50);
                }
                
                render();
                updateStats();
                checkLevelComplete();
            }
        }
        
        function checkLevelComplete() {
            const allChecked = rooms.every(r => r.correct || r.wrong);
            
            if (allChecked) {
                phase = 'idle';
                
                const percentage = (correctCount / ROOM_COUNT) * 100;
                
                if (percentage >= 75) {
                    document.getElementById('phaseTitle').textContent = '🎉 关卡完成！';
                    document.getElementById('phaseDesc').textContent = `正确率：${percentage.toFixed(0)}% (${correctCount}/${ROOM_COUNT})`;
                    document.getElementById('btnNext').style.display = 'inline-block';
                } else {
                    document.getElementById('phaseTitle').textContent = '😅 再接再厉';
                    document.getElementById('phaseDesc').textContent = `正确率：${percentage.toFixed(0)}% (${correctCount}/${ROOM_COUNT})`;
                }
            }
        }
        
        function startMemorizing() {
            phase = 'memorizing';
            document.getElementById('btnStart').style.display = 'none';
            
            const overlay = document.getElementById('memoOverlay');
            const timer = document.getElementById('memoTimer');
            overlay.classList.remove('hidden');
            
            let count = 3;
            timer.textContent = count;
            
            const interval = setInterval(() => {
                count--;
                if (count > 0) {
                    timer.textContent = count;
                } else {
                    clearInterval(interval);
                    overlay.classList.add('hidden');
                    
                    // 显示记忆时间
                    const memorizeTime = 3 + level;
                    document.getElementById('phaseTitle').textContent = '🧠 记忆时间';
                    document.getElementById('phaseDesc').textContent = `你有 ${memorizeTime} 秒记住所有物品！`;
                    
                    render();
                    
                    setTimeout(() => {
                        phase = 'recalling';
                        document.getElementById('phaseTitle').textContent = '❓ 测试时间';
                        document.getElementById('phaseDesc').textContent = '点击房间，输入正确的物品名称！';
                        render();
                    }, memorizeTime * 1000);
                }
            }, 1000);
        }
        
        function nextLevel() {
            level++;
            correctCount = 0;
            document.getElementById('btnNext').style.display = 'none';
            document.getElementById('btnStart').style.display = 'inline-block';
            
            document.getElementById('phaseTitle').textContent = '记忆宫殿';
            document.getElementById('phaseDesc').textContent = '记住每个房间的物品位置，然后测试你的记忆！';
            
            generateLevel();
        }
        
        function updateStats() {
            document.getElementById('level').textContent = level;
            document.getElementById('score').textContent = score;
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('highscore_记忆宫殿', highScore);
            }
            document.getElementById('highScore').textContent = highScore;
            
            const progress = (correctCount / ROOM_COUNT) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }
        
        document.getElementById('btnStart').onclick = startMemorizing;
        document.getElementById('btnNext').onclick = nextLevel;
        
        generateLevel();
        document.getElementById('highScore').textContent = highScore;
    </script>
<!-- [BATCH-FIX:responsive-js] -->
<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>
<!-- [/BATCH-FIX:responsive-js] -->
<!-- [BATCH-FIX:touch-support] -->
<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>
<!-- [/BATCH-FIX:touch-support] -->

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
