    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; color: #fff; }
        
        .game-container { width: 100%; flex: 1; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: #ffd700; }
        .level { font-size: 14px; opacity: 0.7; }
        
        .game-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .status { font-size: 20px; margin-bottom: 30px; }
        
        .pads-area { display: flex; gap: 10px; }

        .pad.pad-0 { background: linear-gradient(135deg, #ff6b6b, #ffa502); }
        .pad.pad-1 { background: linear-gradient(135deg, #4ecdc4, #48c78e); }
        .pad.pad-2 { background: linear-gradient(135deg, #667eea, #764ba2); }
        .pad.pad-3 { background: linear-gradient(135deg, #f093fb, #f5576c); }
        
        .controls { display: flex; gap: 10px; justify-content: center; margin-top: 30px; }
        .btn { padding: 12px 25px; border: none; border-radius: 15px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; }
        .btn-secondary { background: rgba(255,255,255,0.2); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }

<body>
    <div class="game-container">
        <div class="header">
            <div class="title">🧠 音乐记忆</div>
            <div class="level">第 <span id="level">1</span> 关</div>
        </div>
        
        <div class="game-area">
            <div class="status" id="status">点击开始游戏</div>
            
            <div class="pads-area">
                <div class="pad pad-0" id="pad0" onclick="playPad(0)">🎵</div>
                <div class="pad pad-1" id="pad1" onclick="playPad(1)">🎶</div>
                <div class="pad pad-2" id="pad2" onclick="playPad(2)">🎹</div>
                <div class="pad pad-3" id="pad3" onclick="playPad(3)">🎸</div>
            </div>
            
            <div class="controls">
                <button class="btn btn-primary" onclick="startGame()">▶️ 开始</button>
                <button class="btn btn-secondary" onclick="resetGame()">🔄 重置</button>
            </div>
        </div>
    </div>
    
    <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <script>
        const GAME_NAME = '音乐记忆';
        GameCore.init({ highScore: GAME_NAME });
        
        const freqs = [261.63, 293.66, 329.63, 392.00];
        let sequence = [];
        let playerSequence = [];
        let level = 1;
        let isShowing = false;
        let isPlaying = false;
        
        function initGame() {
            level = 1;
            sequence = [];
            playerSequence = [];
            updateLevel();
        }
        
        function updateLevel() {
            document.getElementById('level').textContent = level;
        }
        
        function startGame() {
            if (isShowing) return;
            
            level = 1;
            sequence = [];
            playerSequence = [];
            updateLevel();
            
            nextRound();
        }
        
        function nextRound() {
            playerSequence = [];
            isShowing = true;
            document.getElementById('status').textContent = '观察序列...';
            
            const newPad = Math.floor(Math.random() * 4);
            sequence.push(newPad);
            
            setTimeout(() => {
                showSequence();
            }, 500);
        }
        
        function showSequence() {
            let delay = 0;
            
            sequence.forEach((pad, index) => {
                setTimeout(() => {
                    activatePad(pad);
                    
                    setTimeout(() => {
                        deactivatePad(pad);
                        
                        if (index === sequence.length - 1) {
                            isShowing = false;
                            isPlaying = true;
                            document.getElementById('status').textContent = `重复序列 (${playerSequence.length}/${sequence.length})`;
                        }
                    }, 500);
                }, delay);
                
                delay += 800;
            });
        }
        
        function playPad(index) {
            if (isShowing || !isPlaying) return;
            
            activatePad(index);
            
            setTimeout(() => {
                deactivatePad(index);
            }, 200);
            
            playerSequence.push(index);
            document.getElementById('status').textContent = `重复序列 (${playerSequence.length}/${sequence.length})`;
            
            checkSequence();
        }
        
        function activatePad(index) {
            const pad = document.getElementById('pad' + index);
            pad.classList.add('active');
            playTone(freqs[index]);
        }
        
        function deactivatePad(index) {
            const pad = document.getElementById('pad' + index);
            pad.classList.remove('active');
        }
        
        function playTone(frequency) {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.frequency.value = frequency;
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.5);
        }
        
        function checkSequence() {
            const currentIndex = playerSequence.length - 1;
            
            if (playerSequence[currentIndex] !== sequence[currentIndex]) {
                GameCore.hints.show('😢 错误！游戏结束');
                isPlaying = false;
                document.getElementById('status').textContent = '游戏结束';
                GameCore.highScore.set(GAME_NAME, level);
                return;
            }
            
            if (playerSequence.length === sequence.length) {
                level++;
                updateLevel();
                isPlaying = false;
                document.getElementById('status').textContent = '🎉 正确！下一轮';
                GameCore.hints.show('🎉 正确！');
                
                setTimeout(() => {
                    nextRound();
                }, 1000);
            }
        }
        
        function resetGame() {
            initGame();
            document.getElementById('status').textContent = '点击开始游戏';
        }
        
        initGame();
        GameCore.touch.enableAllButtons();
    </script>

<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>
<!-- [/BATCH-FIX:responsive-js] -->
<!-- [BATCH-FIX:touch-support] -->
<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>
<!-- [/BATCH-FIX:touch-support] -->

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
