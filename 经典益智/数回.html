<script>
/* [STORAGE-POLYFILL v1] */
;(function(){
  var G = (typeof window !== 'undefined') ? window : (typeof globalThis !== 'undefined' ? globalThis : this);
  // 浏览器已有 Storage 构造函数，需确保其带 load/save/remove 静态方法
  var S = G.Storage;
  var needAttach = (typeof S === 'undefined' || typeof S.load !== 'function' || typeof S.save !== 'function');
  if (!needAttach) return;
  if (typeof S === 'undefined') { S = function(){}; G.Storage = S; }
  function parseSafe(s, d){
    if (s === null || s === undefined) return d;
    try { return JSON.parse(s); } catch(e) { try { return s; } catch(e2){ return d; } }
  }
  S.load = function(k, d){ try { return parseSafe(localStorage.getItem(k), d); } catch(e){ return d; } };
  S.save = function(k, v){ try { localStorage.setItem(k, typeof v==='string'?v:JSON.stringify(v)); } catch(e){} };
  S.remove = function(k){ try { localStorage.removeItem(k); } catch(e){} };
})();

// ==================== 数回 (Slitherlink) 核心引擎 ====================

const LEVELS = [
  { id:1,  size:5,  name:'入门',    blankRate:0.05 },
  { id:2,  size:5,  name:'初级',    blankRate:0.10 },
  { id:3,  size:5,  name:'进阶',    blankRate:0.15 },
  { id:4,  size:6,  name:'挑战',    blankRate:0.10 },
  { id:5,  size:6,  name:'困难',    blankRate:0.15 },
  { id:6,  size:6,  name:'高手',    blankRate:0.20 },
  { id:7,  size:7,  name:'大师',    blankRate:0.15 },
  { id:8,  size:7,  name:'宗师',    blankRate:0.20 },
  { id:9,  size:8,  name:'传说',    blankRate:0.18 },
  { id:10, size:8,  name:'神话',    blankRate:0.22 },
  { id:11, size:9,  name:'史诗',    blankRate:0.20 },
  { id:12, size:9,  name:'天元',    blankRate:0.25 },
  { id:13, size:10, name:'终极',    blankRate:0.22 },
  { id:14, size:10, name:'无尽',    blankRate:0.28 },
  { id:15, size:10, name:'创世',    blankRate:0.32 },
];

// ---------- 数据结构 ----------
// N = grid size (NxN cells)
// Points: (N+1) x (N+1)
// horiz[r][c]: edge between (r,c) and (r,c+1), 0<=r<=N, 0<=c<N
// vert[r][c]:  edge between (r,c) and (r+1,c), 0<=r<N, 0<=c<=N

class SlitherlinkPuzzle {
  constructor(size) {
    this.N = size;
    this.horiz = []; // (N+1) x N
    this.vert = [];  // N x (N+1)
    this.clues = []; // N x N (0-3, or -1 for blank)
    for (let r = 0; r <= size; r++) {
      this.horiz[r] = new Array(size).fill(0);
    }
    for (let r = 0; r < size; r++) {
      this.vert[r] = new Array(size + 1).fill(0);
    }
  }

  clone() {
    const p = new SlitherlinkPuzzle(this.N);
    for (let r = 0; r <= this.N; r++)
      for (let c = 0; c < this.N; c++)
        p.horiz[r][c] = this.horiz[r][c];
    for (let r = 0; r < this.N; r++)
      for (let c = 0; c <= this.N; c++)
        p.vert[r][c] = this.vert[r][c];
    for (let r = 0; r < this.N; r++) {
      p.clues[r] = [...this.clues[r]];
    }
    return p;
  }

  countSolutions(limit = 2) {
    // Backtracking solver, returns number of solutions (up to limit)
    const N = this.N;
    const horiz = this.horiz.map(r => [...r]);
    const vert = this.vert.map(r => [...r]);
    const clues = this.clues.map(r => [...r]);

    // Build edge list: each edge is (type, r, c)
    const edges = [];
    for (let r = 0; r <= N; r++)
      for (let c = 0; c < N; c++)
        edges.push(['h', r, c]);
    for (let r = 0; r < N; r++)
      for (let c = 0; c <= N; c++)
        edges.push(['v', r, c]);

    let count = 0;

    const setEdge = (type, r, c, val) => {
      if (type === 'h') horiz[r][c] = val;
      else vert[r][c] = val;
    };

    const getEdge = (type, r, c) => {
      return type === 'h' ? horiz[r][c] : vert[r][c];
    };

    // Check if solution is a single loop
    const isSingleLoop = () => {
      // Build adjacency for points that have selected edges
      const adj = new Map();
      const key = (r, c) => r * (N + 1) + c;
      for (let r = 0; r <= N; r++) {
        for (let c = 0; c <= N; c++) {
          const deg = [];
          if (r > 0 && vert[r - 1][c] === 1) deg.push([r - 1, c]);
          if (r < N && vert[r][c] === 1) deg.push([r + 1, c]);
          if (c > 0 && horiz[r][c - 1] === 1) deg.push([r, c - 1]);
          if (c < N && horiz[r][c] === 1) deg.push([r, c + 1]);
          if (deg.length > 0) adj.set(key(r, c), deg);
        }
      }
      if (adj.size === 0) return false;
      // Each vertex must have degree 0 or 2
      for (const [k, deg] of adj) {
        if (deg.length !== 2) return false;
      }
      // Check single connected component
      const visited = new Set();
      const start = adj.keys().next().value;
      const stack = [start];
      visited.add(start);
      while (stack.length > 0) {
        const k = stack.pop();
        for (const [nr, nc] of adj.get(k)) {
          const nk = key(nr, nc);
          if (!visited.has(nk)) {
            visited.add(nk);
            stack.push(nk);
          }
        }
      }
      return visited.size === adj.size;
    };

    // Forward checking: propagate forced assignments
    const propagate = () => {
      let changed = true;
      while (changed) {
        changed = false;
        // Cell constraints
        for (let r = 0; r < N; r++) {
          for (let c = 0; c < N; c++) {
            if (clues[r][c] < 0) continue;
            const edges = [
              { t: 'h', r, c },         // top
              { t: 'h', r: r + 1, c },  // bottom
              { t: 'v', r, c },         // left
              { t: 'v', r, c: c + 1 }   // right
            ];
            const vals = edges.map(e => getEdge(e.t, e.r, e.c));
            const selected = vals.filter(v => v === 1).length;
            const unknown = vals.filter(v => v === -1).length;
            const target = clues[r][c];

            if (selected > target) return false;
            if (selected === target) {
              // Mark all unknowns as 0
              for (const e of edges) {
                if (getEdge(e.t, e.r, e.c) === -1) {
                  setEdge(e.t, e.r, e.c, 0);
                  changed = true;
                }
              }
            }
            if (selected + unknown === target) {
              // Mark all unknowns as 1
              for (const e of edges) {
                if (getEdge(e.t, e.r, e.c) === -1) {
                  setEdge(e.t, e.r, e.c, 1);
                  changed = true;
                }
              }
            }
          }
        }
        // Vertex constraints: each vertex has 0 or 2 incident edges
        for (let r = 0; r <= N; r++) {
          for (let c = 0; c <= N; c++) {
            const edges = [];
            if (r > 0) edges.push({ t: 'v', r: r - 1, c });
            if (r < N) edges.push({ t: 'v', r, c });
            if (c > 0) edges.push({ t: 'h', r, c: c - 1 });
            if (c < N) edges.push({ t: 'h', r, c });
            const vals = edges.map(e => getEdge(e.t, e.r, e.c));
            const selected = vals.filter(v => v === 1).length;
            const unknown = vals.filter(v => v === -1).length;

            if (selected > 2) return false;
            if (selected === 2) {
              for (const e of edges) {
                if (getEdge(e.t, e.r, e.c) === -1) {
                  setEdge(e.t, e.r, e.c, 0);
                  changed = true;
                }
              }
            }
            // Dead end check: 1 selected and no unknowns → invalid
            if (selected === 1 && unknown === 0) return false;
            // If 1 selected and exactly 1 unknown, the unknown must be 1 (to avoid dead end)
            if (selected === 1 && unknown === 1) {
              for (const e of edges) {
                if (getEdge(e.t, e.r, e.c) === -1) {
                  setEdge(e.t, e.r, e.c, 1);
                  changed = true;
                }
              }
            }
            // If 0 selected and 1 unknown (all others 0), unknown must be 0 (can't have single edge)
            if (selected === 0 && unknown === 1 && edges.length > 1) {
              for (const e of edges) {
                if (getEdge(e.t, e.r, e.c) === -1) {
                  setEdge(e.t, e.r, e.c, 0);
                  changed = true;
                }
              }
            }
          }
        }
      }
      return true;
    };

    const saveState = () => {
      return {
        h: horiz.map(r => [...r]),
        v: vert.map(r => [...r])
      };
    };
    const restoreState = (st) => {
      for (let ri = 0; ri <= N; ri++)
        for (let ci = 0; ci < N; ci++)
          horiz[ri][ci] = st.h[ri][ci];
      for (let ri = 0; ri < N; ri++)
        for (let ci = 0; ci <= N; ci++)
          vert[ri][ci] = st.v[ri][ci];
    };

    const solve = (idx) => {
      if (count >= limit) return;

      // Propagate constraints (modifies state in place)
      if (!propagate()) return;

      // Find next unassigned edge
      let nextIdx = idx;
      while (nextIdx < edges.length) {
        const [t, r, c] = edges[nextIdx];
        if (getEdge(t, r, c) === -1) break;
        nextIdx++;
      }

      if (nextIdx >= edges.length) {
        // All assigned — check if it's a valid single loop
        for (let r = 0; r < N; r++) {
          for (let c = 0; c < N; c++) {
            if (clues[r][c] < 0) continue;
            const cnt = horiz[r][c] + horiz[r + 1][c] + vert[r][c] + vert[r][c + 1];
            if (cnt !== clues[r][c]) return;
          }
        }
        if (isSingleLoop()) count++;
        return;
      }

      const [t, r, c] = edges[nextIdx];
      // Save state after propagation, before branching
      const saved = saveState();

      // Try 0 first
      setEdge(t, r, c, 0);
      solve(nextIdx + 1);
      restoreState(saved);
      if (count >= limit) return;

      // Try 1
      setEdge(t, r, c, 1);
      solve(nextIdx + 1);
      restoreState(saved);
    };

    // Initialize all edges to -1 (unknown)
    for (let r = 0; r <= N; r++)
      for (let c = 0; c < N; c++)
        horiz[r][c] = -1;
    for (let r = 0; r < N; r++)
      for (let c = 0; c <= N; c++)
        vert[r][c] = -1;

    solve(0);
    return count;
  }

  hasUniqueSolution() {
    return this.countSolutions(2) === 1;
  }
}

// ---------- Puzzle Generator ----------

function generateLoop(N) {
  // Generate a random simple closed loop on an NxN grid
  // Uses randomized DFS with backtracking
  const totalPoints = (N + 1) * (N + 1);
  const minLength = Math.floor(totalPoints * 0.4);

  const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];

  const key = (r, c) => r * (N + 1) + c;
  const inBounds = (r, c) => r >= 0 && r <= N && c >= 0 && c <= N;

  // Try multiple times
  for (let attempt = 0; attempt < 50; attempt++) {
    // Start from a random point
    const startR = Math.floor(Math.random() * (N + 1));
    const startC = Math.floor(Math.random() * (N + 1));

    const visited = new Set();
    const path = [[startR, startC]];
    visited.add(key(startR, startC));

    const dfs = (r, c) => {
      if (path.length >= minLength) {
        // Check if we can close the loop
        for (const [dr, dc] of dirs) {
          const nr = r + dr, nc = c + dc;
          if (nr === startR && nc === startC) {
            path.push([nr, nc]);
            return true;
          }
        }
      }

      // Shuffle directions
      const shuffled = [...dirs].sort(() => Math.random() - 0.5);
      for (const [dr, dc] of shuffled) {
        const nr = r + dr, nc = c + dc;
        if (!inBounds(nr, nc)) continue;
        const nk = key(nr, nc);
        if (visited.has(nk)) continue;
        visited.add(nk);
        path.push([nr, nc]);
        if (dfs(nr, nc)) return true;
        path.pop();
        visited.delete(nk);
      }
      return false;
    };

    if (dfs(startR, startC)) {
      return path; // path is a closed loop (last point = start point)
    }
  }

  // Fallback: simple rectangular loop
  const path = [];
  for (let c = 0; c <= N; c++) path.push([0, c]);
  for (let r = 1; r <= N; r++) path.push([r, N]);
  for (let c = N - 1; c >= 0; c--) path.push([N, c]);
  for (let r = N - 1; r >= 0; r--) path.push([r, 0]);
  return path;
}

function loopToPuzzle(N, loopPath) {
  // Convert loop path to edge representation
  const puzzle = new SlitherlinkPuzzle(N);

  for (let i = 0; i < loopPath.length - 1; i++) {
    const [r1, c1] = loopPath[i];
    const [r2, c2] = loopPath[i + 1];
    if (r1 === r2) {
      // Horizontal edge
      const c = Math.min(c1, c2);
      puzzle.horiz[r1][c] = 1;
    } else {
      // Vertical edge
      const r = Math.min(r1, r2);
      puzzle.vert[r][c1] = 1;
    }
  }

  // Compute clues
  puzzle.clues = [];
  for (let r = 0; r < N; r++) {
    puzzle.clues[r] = [];
    for (let c = 0; c < N; c++) {
      const cnt = puzzle.horiz[r][c] + puzzle.horiz[r + 1][c] +
                  puzzle.vert[r][c] + puzzle.vert[r][c + 1];
      puzzle.clues[r][c] = cnt;
    }
  }

  return puzzle;
}

function generatePuzzle(N, blankRate) {
  // Generate a puzzle with unique solution
  let bestPuzzle = null;
  let bestBlanks = 0;
  const maxAttempts = N <= 7 ? 30 : N <= 9 ? 20 : 12;
  const startTime = Date.now();
  const timeout = N <= 7 ? 8000 : 15000;

  for (let attempt = 0; attempt < maxAttempts; attempt++) {
    if (Date.now() - startTime > timeout) break;

    const loop = generateLoop(N);
    const fullPuzzle = loopToPuzzle(N, loop);

    // Verify the full puzzle has unique solution
    if (!fullPuzzle.hasUniqueSolution()) continue;

    // Now try to blank out some clues
    const puzzle = fullPuzzle.clone();
    const cells = [];
    for (let r = 0; r < N; r++)
      for (let c = 0; c < N; c++)
        cells.push([r, c]);

    // Shuffle cells
    for (let i = cells.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [cells[i], cells[j]] = [cells[j], cells[i]];
    }

    const targetBlanks = Math.floor(N * N * blankRate);
    let blanks = 0;

    for (const [r, c] of cells) {
      if (blanks >= targetBlanks) break;
      if (Date.now() - startTime > timeout) break;
      const orig = puzzle.clues[r][c];
      puzzle.clues[r][c] = -1;
      if (puzzle.hasUniqueSolution()) {
        blanks++;
      } else {
        puzzle.clues[r][c] = orig; // restore
      }
    }

    if (blanks >= bestBlanks) {
      bestBlanks = blanks;
      bestPuzzle = puzzle;
    }

    if (blanks >= targetBlanks) break;
  }

  return bestPuzzle;
}

// ==================== 游戏状态管理 ====================

class Game {
  constructor() {
    this.canvas = document.getElementById('gameCanvas');
    this.ctx = this.canvas.getContext('2d');
    this.currentLevel = 0;
    this.N = 5;
    this.puzzle = null;
    this.solution = null;
    this.playerHoriz = null;
    this.playerVert = null;
    this.undoStack = [];
    this.hintsUsed = 0;
    this.timerSec = 0;
    this.timerInterval = null;
    this.gameWon = false;
    this.drawMode = true; // true=draw line, false=mark blank (X)
    this.hoveredEdge = null;
    this.conflicts = new Set(); // set of "h,r,c" or "v,r,c" strings
    this.gameStarted = false;

    this.initCanvas();
    this.loadProgress();
    this.setupUI();
    this.loadLevel(this.currentLevel);
  }

  initCanvas() {
    const wrapper = document.getElementById('canvasWrapper');
    const size = Math.min(wrapper.clientWidth, 500);
    const dpr = window.devicePixelRatio || 1;
    this.canvas.width = size * dpr;
    this.canvas.height = size * dpr;
    this.canvas.style.width = size + 'px';
    this.canvas.style.height = size + 'px';
    this.ctx.setTransform(1, 0, 0, 1, 0, 0);
    this.displaySize = size;
    this.dpr = dpr;
  }

  loadProgress() {
    try {
      const saved = JSON.parse(localStorage.getItem('slitherlink_progress') || '{}');
      this.completedLevels = saved.completed || {};
      this.unlockedLevel = saved.unlocked || 1;
      this.hintCount = saved.hints || 3;
      this.bestTimes = saved.bestTimes || {};
    } catch (e) {
      this.completedLevels = {};
      this.unlockedLevel = 1;
      this.hintCount = 3;
      this.bestTimes = {};
    }
  }

  saveProgress() {
    try {
      localStorage.setItem('slitherlink_progress', JSON.stringify({
        completed: this.completedLevels,
        unlocked: this.unlockedLevel,
        hints: this.hintCount,
        bestTimes: this.bestTimes
      }));
    } catch (e) {}
  }

  loadLevel(levelIdx) {
    this.currentLevel = levelIdx;
    const cfg = LEVELS[levelIdx];
    this.N = cfg.size;
    this.gameWon = false;
    this.hintsUsed = 0;
    this.undoStack = [];
    this.conflicts = new Set();
    this.drawMode = true;
    document.getElementById('modeLabel').textContent = '画线';

    // Generate puzzle
    this.puzzle = generatePuzzle(this.N, cfg.blankRate);
    if (!this.puzzle) {
      // Fallback: generate without blanks
      const loop = generateLoop(this.N);
      this.puzzle = loopToPuzzle(this.N, loop);
    }

    // Store solution
    this.solution = { horiz: this.puzzle.horiz.map(r => [...r]), vert: this.puzzle.vert.map(r => [...r]) };

    // Reset player state
    this.playerHoriz = [];
    this.playerVert = [];
    for (let r = 0; r <= this.N; r++) {
      this.playerHoriz[r] = new Array(this.N).fill(0);
    }
    for (let r = 0; r < this.N; r++) {
      this.playerVert[r] = new Array(this.N + 1).fill(0);
    }

    // Update UI
    document.getElementById('levelLabel').textContent = (levelIdx + 1);
    document.getElementById('gridSize').textContent = this.N + '×' + this.N;
    this.resetTimer();
    this.draw();
    this.updateHintButton();
    this.updateUndoButton();
  }

  resetTimer() {
    if (this.timerInterval) clearInterval(this.timerInterval);
    this.timerSec = 0;
    document.getElementById('timer').textContent = '00:00';
    if (!this.gameWon && this.gameStarted) {
      this.timerInterval = setInterval(() => {
        this.timerSec++;
        const m = Math.floor(this.timerSec / 60);
        const s = this.timerSec % 60;
        document.getElementById('timer').textContent =
          String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
      }, 1000);
    }
  }

  stopTimer() {
    if (this.timerInterval) {
      clearInterval(this.timerInterval);
      this.timerInterval = null;
    }
  }

  setupUI() {
    // Canvas events
    this.canvas.addEventListener('click', (e) => this.handleClick(e));
    this.canvas.addEventListener('mousemove', (e) => this.handleMove(e));
    this.canvas.addEventListener('mouseleave', () => { this.hoveredEdge = null; this.draw(); });
    this.canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      this.handleClick(e);
    }, { passive: false });
    this.canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      this.handleMove(e);
    }, { passive: false });

    // Buttons
    document.getElementById('btnUndo').addEventListener('click', () => this.undo());
    document.getElementById('btnHint').addEventListener('click', () => this.useHint());
    document.getElementById('btnReset').addEventListener('click', () => this.resetLevel());
    document.getElementById('btnLevels').addEventListener('click', () => this.showLevelSelect());
    document.getElementById('levelClose').addEventListener('click', () => this.hideLevelSelect());
    document.getElementById('btnNext').addEventListener('click', () => this.nextLevel());
    document.getElementById('btnReplay').addEventListener('click', () => {
      document.getElementById('winOverlay').classList.remove('show');
      this.loadLevel(this.currentLevel);
    });

    // Toggle draw mode
    document.getElementById('toggleMode').addEventListener('click', () => {
      this.drawMode = !this.drawMode;
      document.getElementById('modeLabel').textContent = this.drawMode ? '画线' : '标记X';
    });

    // Level grid
    this.buildLevelGrid();

    // Resize
    window.addEventListener('resize', () => {
      this.initCanvas();
      this.draw();
    });

    // Keyboard
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key === 'z') { e.preventDefault(); this.undo(); }
      if (e.key === 'h' && !e.ctrlKey) this.useHint();
      if (e.key === 'r' && !e.ctrlKey) this.resetLevel();
      if (e.key === 'm' && !e.ctrlKey) {
        this.drawMode = !this.drawMode;
        document.getElementById('modeLabel').textContent = this.drawMode ? '画线' : '标记X';
      }
    });
  }

  buildLevelGrid() {
    const grid = document.getElementById('levelGrid');
    grid.innerHTML = '';
    LEVELS.forEach((lvl, idx) => {
      const btn = document.createElement('button');
      btn.className = 'level-btn';
      if (idx + 1 > this.unlockedLevel) btn.classList.add('locked');
      if (this.completedLevels[idx + 1]) btn.classList.add('completed');
      let label = lvl.id + '. ' + lvl.name;
      if (this.completedLevels[idx + 1]) {
        const stars = this.completedLevels[idx + 1].stars || 1;
        label += '<div class="stars">' + '⭐'.repeat(stars) + '</div>';
      }
      btn.innerHTML = label;
      btn.addEventListener('click', () => {
        if (idx + 1 <= this.unlockedLevel) {
          this.hideLevelSelect();
          this.loadLevel(idx);
        }
      });
      grid.appendChild(btn);
    });
  }

  showLevelSelect() {
    this.buildLevelGrid();
    document.getElementById('levelSelect').classList.add('show');
  }

  hideLevelSelect() {
    document.getElementById('levelSelect').classList.remove('show');
  }

  // ---------- 交互 ----------

  getCanvasPos(e) {
    const rect = this.canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: (clientX - rect.left) * (this.canvas.width / rect.width),
      y: (clientY - rect.top) * (this.canvas.height / rect.height)
    };
  }

  findEdge(cx, cy) {
    const N = this.N;
    const margin = 0.08;
    const cellSize = this.canvas.width / (N + 1 + margin * 2);
    const offsetX = margin * cellSize;
    const offsetY = margin * cellSize;
    const dotR = cellSize * 0.08;
    const hitDist = cellSize * 0.25;

    let best = null;
    let bestDist = hitDist;

    // Check horizontal edges
    for (let r = 0; r <= N; r++) {
      for (let c = 0; c < N; c++) {
        const x1 = offsetX + c * cellSize;
        const y1 = offsetY + r * cellSize;
        const x2 = offsetX + (c + 1) * cellSize;
        const y2 = y1;
        const dist = this.pointToSegDist(cx, cy, x1, y1, x2, y2);
        if (dist < bestDist) {
          bestDist = dist;
          best = { type: 'h', r, c };
        }
      }
    }

    // Check vertical edges
    for (let r = 0; r < N; r++) {
      for (let c = 0; c <= N; c++) {
        const x1 = offsetX + c * cellSize;
        const y1 = offsetY + r * cellSize;
        const x2 = x1;
        const y2 = offsetY + (r + 1) * cellSize;
        const dist = this.pointToSegDist(cx, cy, x1, y1, x2, y2);
        if (dist < bestDist) {
          bestDist = dist;
          best = { type: 'v', r, c };
        }
      }
    }

    return best;
  }

  pointToSegDist(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const lenSq = dx * dx + dy * dy;
    if (lenSq === 0) return Math.hypot(px - x1, py - y1);
    let t = ((px - x1) * dx + (py - y1) * dy) / lenSq;
    t = Math.max(0, Math.min(1, t));
    const nx = x1 + t * dx, ny = y1 + t * dy;
    return Math.hypot(px - nx, py - ny);
  }

  handleMove(e) {
    if (this.gameWon) return;
    const pos = this.getCanvasPos(e);
    this.hoveredEdge = this.findEdge(pos.x, pos.y);
    this.draw();
  }

  handleClick(e) {
    if (this.gameWon) return;
    const pos = this.getCanvasPos(e);
    const edge = this.findEdge(pos.x, pos.y);
    if (!edge) return;
    this.toggleEdge(edge);
  }

  toggleEdge(edge) {
    const { type, r, c } = edge;
    const playerArr = type === 'h' ? this.playerHoriz : this.playerVert;
    const current = playerArr[r][c];

    let newVal;
    if (this.drawMode) {
      // Draw mode: cycle 0 -> 1 -> 0
      newVal = current === 1 ? 0 : 1;
    } else {
      // X mode: cycle 0 -> 2 -> 0  (2 = marked as not-line)
      newVal = current === 2 ? 0 : 2;
    }

    // Save undo
    this.undoStack.push({ type, r, c, old: current, new: newVal });
    if (this.undoStack.length > 200) this.undoStack.shift();

    playerArr[r][c] = newVal;
    this.updateUndoButton();
    this.checkConflicts();
    this.draw();

    if (this.checkWin()) {
      this.onWin();
    }
  }

  undo() {
    if (this.undoStack.length === 0) return;
    const action = this.undoStack.pop();
    const playerArr = action.type === 'h' ? this.playerHoriz : this.playerVert;
    playerArr[action.r][action.c] = action.old;
    this.updateUndoButton();
    this.checkConflicts();
    this.draw();
  }

  resetLevel() {
    for (let r = 0; r <= this.N; r++)
      for (let c = 0; c < this.N; c++)
        this.playerHoriz[r][c] = 0;
    for (let r = 0; r < this.N; r++)
      for (let c = 0; c <= this.N; c++)
        this.playerVert[r][c] = 0;
    this.undoStack = [];
    this.conflicts = new Set();
    this.updateUndoButton();
    this.resetTimer();
    const ss = document.getElementById('startScreen');
    if (ss) { ss.classList.remove('hidden'); this.gameStarted = false; this.stopTimer(); }
    this.draw();
  }

  // ---------- 冲突检测 ----------

  checkConflicts() {
    this.conflicts = new Set();
    const N = this.N;

    const key = (type, r, c) => type + ',' + r + ',' + c;

    // Check cell clue violations
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        if (this.puzzle.clues[r][c] < 0) continue;
        const top = this.playerHoriz[r][c];
        const bottom = this.playerHoriz[r + 1][c];
        const left = this.playerVert[r][c];
        const right = this.playerVert[r][c + 1];
        const cnt = (top === 1 ? 1 : 0) + (bottom === 1 ? 1 : 0) +
                    (left === 1 ? 1 : 0) + (right === 1 ? 1 : 0);
        const marked = (top === 2 ? 1 : 0) + (bottom === 2 ? 1 : 0) +
                       (left === 2 ? 1 : 0) + (right === 2 ? 1 : 0);
        const unknown = 4 - (top !== 0 ? 1 : 0) - (bottom !== 0 ? 1 : 0) -
                        (left !== 0 ? 1 : 0) - (right !== 0 ? 1 : 0);
        if (cnt > this.puzzle.clues[r][c]) {
          // Too many lines
          if (top === 1) this.conflicts.add(key('h', r, c));
          if (bottom === 1) this.conflicts.add(key('h', r + 1, c));
          if (left === 1) this.conflicts.add(key('v', r, c));
          if (right === 1) this.conflicts.add(key('v', r, c + 1));
        }
        if (cnt + unknown < this.puzzle.clues[r][c]) {
          // Can't reach the clue number
          if (top === 2) this.conflicts.add(key('h', r, c));
          if (bottom === 2) this.conflicts.add(key('h', r + 1, c));
          if (left === 2) this.conflicts.add(key('v', r, c));
          if (right === 2) this.conflicts.add(key('v', r, c + 1));
        }
      }
    }

    // Check vertex degree > 2
    for (let r = 0; r <= N; r++) {
      for (let c = 0; c <= N; c++) {
        const edges = [];
        if (r > 0) edges.push({ t: 'v', r: r - 1, c, v: this.playerVert[r - 1][c] });
        if (r < N) edges.push({ t: 'v', r, c, v: this.playerVert[r][c] });
        if (c > 0) edges.push({ t: 'h', r, c: c - 1, v: this.playerHoriz[r][c - 1] });
        if (c < N) edges.push({ t: 'h', r, c, v: this.playerHoriz[r][c] });
        const selected = edges.filter(e => e.v === 1).length;
        if (selected > 2) {
          for (const e of edges) {
            if (e.v === 1) this.conflicts.add(key(e.t, e.r, e.c));
          }
        }
      }
    }
  }

  // ---------- 胜负判定 ----------

  checkWin() {
    const N = this.N;
    // Check all edges match solution
    for (let r = 0; r <= N; r++) {
      for (let c = 0; c < N; c++) {
        const pv = this.playerHoriz[r][c];
        if (pv === 2) {
          // Marked as not-line, but we need to check it's actually not in solution
          if (this.solution.horiz[r][c] === 1) return false;
        } else if (this.solution.horiz[r][c] !== pv) {
          return false;
        }
      }
    }
    for (let r = 0; r < N; r++) {
      for (let c = 0; c <= N; c++) {
        const pv = this.playerVert[r][c];
        if (pv === 2) {
          if (this.solution.vert[r][c] === 1) return false;
        } else if (this.solution.vert[r][c] !== pv) {
          return false;
        }
      }
    }
    return true;
  }

  onWin() {
    this.gameWon = true;
    this.stopTimer();

    const m = Math.floor(this.timerSec / 60);
    const s = this.timerSec % 60;
    const timeStr = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');

    // Stars: 3 if no hints, 2 if 1 hint, 1 if 2+ hints
    let stars = 3;
    if (this.hintsUsed >= 2) stars = 1;
    else if (this.hintsUsed >= 1) stars = 2;

    document.getElementById('starsDisplay').textContent = '⭐'.repeat(stars);
    document.getElementById('winTime').textContent = '用时: ' + timeStr;
    document.getElementById('winOverlay').classList.add('show');

    // Save progress
    const lvlId = this.currentLevel + 1;
    if (!this.completedLevels[lvlId] || this.completedLevels[lvlId].stars < stars) {
      this.completedLevels[lvlId] = { stars, time: this.timerSec };
    }
    if (this.currentLevel + 2 > this.unlockedLevel) {
      this.unlockedLevel = Math.min(this.currentLevel + 2, LEVELS.length);
    }
    if (!this.bestTimes[lvlId] || this.timerSec < this.bestTimes[lvlId]) {
      this.bestTimes[lvlId] = this.timerSec;
    }
    this.saveProgress();

    // Show interstitial ad
    if (typeof showInterstitialAd === 'function') {
      setTimeout(() => showInterstitialAd(), 400);
    }
  }

  nextLevel() {
    document.getElementById('winOverlay').classList.remove('show');
    const next = this.currentLevel + 1;
    if (next < LEVELS.length) {
      this.loadLevel(next);
    } else {
      this.showLevelSelect();
    }
  }

  // ---------- 提示 ----------

  updateHintButton() {
    const btn = document.getElementById('btnHint');
    btn.textContent = '💡 提示(' + this.hintCount + ')';
    btn.disabled = this.hintCount <= 0;
  }

  useHint() {
    if (this.hintCount <= 0 || this.gameWon) return;
    const N = this.N;

    // Find an edge that player hasn't set correctly yet
    const candidates = [];
    for (let r = 0; r <= N; r++) {
      for (let c = 0; c < N; c++) {
        if (this.playerHoriz[r][c] !== this.solution.horiz[r][c]) {
          candidates.push({ type: 'h', r, c });
        }
      }
    }
    for (let r = 0; r < N; r++) {
      for (let c = 0; c <= N; c++) {
        if (this.playerVert[r][c] !== this.solution.vert[r][c]) {
          candidates.push({ type: 'v', r, c });
        }
      }
    }

    if (candidates.length === 0) return;

    // Pick a random wrong edge
    const pick = candidates[Math.floor(Math.random() * candidates.length)];
    const playerArr = pick.type === 'h' ? this.playerHoriz : this.playerVert;
    this.undoStack.push({ type: pick.type, r: pick.r, c: pick.c, old: playerArr[pick.r][pick.c], new: this.solution[pick.type === 'h' ? 'horiz' : 'vert'][pick.r][pick.c] });
    playerArr[pick.r][pick.c] = this.solution[pick.type === 'h' ? 'horiz' : 'vert'][pick.r][pick.c];

    this.hintCount--;
    this.hintsUsed++;
    this.updateHintButton();
    this.updateUndoButton();
    this.checkConflicts();
    this.draw();

    if (this.checkWin()) {
      this.onWin();
    }

    this.saveProgress();
  }

  updateUndoButton() {
    document.getElementById('btnUndo').disabled = this.undoStack.length === 0;
  }

  // ---------- 渲染 ----------

  draw() {
    if (!this.gameStarted) { requestAnimationFrame(() => this.draw()); return; }
    const ctx = this.ctx;
    const w = this.canvas.width;
    const h = this.canvas.height;
    const dpr = this.dpr;
    const N = this.N;
    const margin = 0.08;
    const cellSize = w / (N + 1 + margin * 2);
    const offsetX = margin * cellSize;
    const offsetY = margin * cellSize;
    const dotR = cellSize * 0.07;

    ctx.clearRect(0, 0, w, h);

    // Background
    ctx.fillStyle = '#16213e';
    ctx.beginPath();
    ctx.roundRect(4, 4, w - 8, h - 8, 12);
    ctx.fill();

    const key = (type, r, c) => type + ',' + r + ',' + c;

    // Draw cells (background for numbers)
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        const cx = offsetX + (c + 0.5) * cellSize;
        const cy = offsetY + (r + 0.5) * cellSize;
        const clue = this.puzzle.clues[r][c];

        if (clue >= 0) {
          // Draw subtle cell background
          ctx.fillStyle = 'rgba(15,52,96,0.5)';
          ctx.beginPath();
          ctx.roundRect(cx - cellSize * 0.35, cy - cellSize * 0.35, cellSize * 0.7, cellSize * 0.7, 4);
          ctx.fill();

          // Draw number
          ctx.fillStyle = clue === 0 ? '#888' : clue === 1 ? '#4cc9f0' : clue === 2 ? '#f0c040' : '#e94560';
          ctx.font = `bold ${cellSize * 0.45}px "Microsoft YaHei","PingFang SC",sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(clue, cx, cy);
        }
      }
    }

    // Draw edges
    const lineWidth = cellSize * 0.1;
    const xLineWidth = cellSize * 0.04;

    // Draw existing player lines
    for (let r = 0; r <= N; r++) {
      for (let c = 0; c < N; c++) {
        const val = this.playerHoriz[r][c];
        if (val === 0) continue;
        const x1 = offsetX + c * cellSize;
        const y1 = offsetY + r * cellSize;
        const x2 = offsetX + (c + 1) * cellSize;
        const y2 = y1;
        const isConflict = this.conflicts.has(key('h', r, c));

        if (val === 1) {
          ctx.strokeStyle = isConflict ? '#ff4757' : '#4cc9f0';
          ctx.lineWidth = lineWidth;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
        } else if (val === 2) {
          // Draw X mark
          ctx.strokeStyle = isConflict ? '#ff4757' : '#888';
          ctx.lineWidth = xLineWidth;
          ctx.lineCap = 'round';
          const s = cellSize * 0.15;
          const mx = (x1 + x2) / 2, my = y1;
          ctx.beginPath();
          ctx.moveTo(mx - s, my - s);
          ctx.lineTo(mx + s, my + s);
          ctx.moveTo(mx + s, my - s);
          ctx.lineTo(mx - s, my + s);
          ctx.stroke();
        }
      }
    }

    for (let r = 0; r < N; r++) {
      for (let c = 0; c <= N; c++) {
        const val = this.playerVert[r][c];
        if (val === 0) continue;
        const x1 = offsetX + c * cellSize;
        const y1 = offsetY + r * cellSize;
        const x2 = x1;
        const y2 = offsetY + (r + 1) * cellSize;
        const isConflict = this.conflicts.has(key('v', r, c));

        if (val === 1) {
          ctx.strokeStyle = isConflict ? '#ff4757' : '#4cc9f0';
          ctx.lineWidth = lineWidth;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
        } else if (val === 2) {
          ctx.strokeStyle = isConflict ? '#ff4757' : '#888';
          ctx.lineWidth = xLineWidth;
          ctx.lineCap = 'round';
          const s = cellSize * 0.15;
          const mx = x1, my = (y1 + y2) / 2;
          ctx.beginPath();
          ctx.moveTo(mx - s, my - s);
          ctx.lineTo(mx + s, my + s);
          ctx.moveTo(mx + s, my - s);
          ctx.lineTo(mx - s, my + s);
          ctx.stroke();
        }
      }
    }

    // Draw hover highlight
    if (this.hoveredEdge && !this.gameWon) {
      const { type, r, c } = this.hoveredEdge;
      let x1, y1, x2, y2;
      if (type === 'h') {
        x1 = offsetX + c * cellSize;
        y1 = offsetY + r * cellSize;
        x2 = offsetX + (c + 1) * cellSize;
        y2 = y1;
      } else {
        x1 = offsetX + c * cellSize;
        y1 = offsetY + r * cellSize;
        x2 = x1;
        y2 = offsetY + (r + 1) * cellSize;
      }
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.lineWidth = lineWidth * 1.3;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }

    // Draw dots
    for (let r = 0; r <= N; r++) {
      for (let c = 0; c <= N; c++) {
        const x = offsetX + c * cellSize;
        const y = offsetY + r * cellSize;
        ctx.fillStyle = '#e0e0e0';
        ctx.beginPath();
        ctx.arc(x, y, dotR, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
}

            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
