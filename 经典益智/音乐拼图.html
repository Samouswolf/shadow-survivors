    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>音乐拼图</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; color: #fff; }
        
        .game-container { width: 100%; flex: 1; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: #ffd700; }
        .level { font-size: 14px; opacity: 0.7; }
        
        .puzzle-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; margin-bottom: 15px; }
        .target-melody { display: flex; gap: 10px; margin-bottom: 30px; }
        .target-note { width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 24px; }
        
        .puzzle-board { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 400px; }
        .puzzle-note { width: 70px; height: 70px; border-radius: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; }
        .puzzle-note.selected { transform: scale(1.1); box-shadow: 0 0 20px rgba(255,215,0,0.5); }
        
        .controls { display: flex; gap: 10px; justify-content: center; }
        .btn { padding: 12px 25px; border: none; border-radius: 15px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; }
        .btn-secondary { background: rgba(255,255,255,0.2); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }

<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="title">🎹 音乐拼图</div>
            <div class="level">第 <span id="level">1</span> 关</div>
        </div>
        
        <div class="puzzle-area">
            <div class="target-melody" id="targetMelody"></div>
            <div class="puzzle-board" id="puzzleBoard"></div>
        </div>
        
        <div class="controls">
            <button class="btn btn-secondary" onclick="playTarget()">🔊 播放目标旋律</button>
            <button class="btn btn-primary" onclick="checkAnswer()">✅ 确认答案</button>
            <button class="btn btn-secondary" onclick="nextLevel()">➡️ 下一关</button>
        </div>
    </div>
    
    

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <script>
        const GAME_NAME = '音乐拼图';
        GameCore.init({ highScore: GAME_NAME });
        
        const notes = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
        const noteColors = {
            'C': '#ff6b6b', 'D': '#ffa502', 'E': '#ffd700',
            'F': '#48c78e', 'G': '#4ecdc4', 'A': '#667eea', 'B': '#f093fb'
        };
        
        const levels = [
            ['C', 'D', 'E'],
            ['G', 'E', 'C'],
            ['C', 'E', 'G', 'E'],
            ['D', 'F', 'A', 'F'],
            ['E', 'G', 'B', 'G', 'E'],
            ['C', 'D', 'E', 'F', 'G'],
            ['G', 'F', 'E', 'D', 'C'],
            ['A', 'C', 'E', 'G', 'C'],
            ['B', 'D', 'F', 'A', 'C', 'E'],
            ['C', 'E', 'G', 'B', 'G', 'E', 'C']
        ];
        
        let currentLevel = 0;
        let selectedNotes = [];
        
        function initGame() {
            currentLevel = 0;
            loadLevel();
        }
        
        function loadLevel() {
            const level = levels[currentLevel];
            document.getElementById('level').textContent = currentLevel + 1;
            selectedNotes = [];
            
            renderTargetMelody(level);
            renderPuzzleBoard(level);
        }
        
        function renderTargetMelody(level) {
            const container = document.getElementById('targetMelody');
            container.innerHTML = '';
            
            level.forEach(note => {
                const el = document.createElement('div');
                el.className = 'target-note';
                el.style.background = noteColors[note];
                el.textContent = note;
                container.appendChild(el);
            });
        }
        
        function renderPuzzleBoard(level) {
            const container = document.getElementById('puzzleBoard');
            container.innerHTML = '';
            
            const shuffled = [...level].sort(() => Math.random() - 0.5);
            
            shuffled.forEach(note => {
                const el = document.createElement('div');
                el.className = 'puzzle-note';
                el.style.background = noteColors[note];
                el.innerHTML = `<span>${note}</span>`;
                el.onclick = () => selectNote(note, el);
                
                container.appendChild(el);
            });
        }
        
        function selectNote(note, el) {
            if (selectedNotes.length < levels[currentLevel].length) {
                selectedNotes.push(note);
                el.classList.add('selected');
                
                if (selectedNotes.length === levels[currentLevel].length) {
                    GameCore.hints.show('可以确认答案了！');
                }
            }
        }
        
        function playTarget() {
            const level = levels[currentLevel];
            
            let delay = 0;
            level.forEach(note => {
                setTimeout(() => {
                    playNote(note);
                }, delay);
                delay += 500;
            });
        }
        
        function playNote(note) {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            const frequencies = {
                'C': 261.63, 'D': 293.66, 'E': 329.63,
                'F': 349.23, 'G': 392.00, 'A': 440.00, 'B': 493.88
            };
            
            oscillator.frequency.value = frequencies[note];
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.5);
        }
        
        function checkAnswer() {
            const level = levels[currentLevel];
            
            if (selectedNotes.length !== level.length) {
                GameCore.hints.show('请先选完所有音符！');
                return;
            }
            
            const isCorrect = selectedNotes.every((note, index) => note === level[index]);
            
            if (isCorrect) {
                GameCore.hints.show('🎉 正确！');
                GameCore.highScore.set(GAME_NAME, currentLevel + 1);
            } else {
                GameCore.hints.show('😢 不正确，请重试');
                selectedNotes = [];
                renderPuzzleBoard(level);
            }
        }
        
        function nextLevel() {
            currentLevel++;
            
            if (currentLevel >= levels.length) {
                currentLevel = 0;
                GameCore.hints.show('🎊 恭喜通关！重新开始');
            }
            
            loadLevel();
        }
        
        initGame();
        GameCore.touch.enableAllButtons();
    </script>

<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>
<!-- [/BATCH-FIX:responsive-js] -->
<!-- [BATCH-FIX:touch-support] -->
<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>
<!-- [/BATCH-FIX:touch-support] -->

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
