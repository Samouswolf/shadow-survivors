<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>音乐拼图</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; color: #fff; }
        
        .game-container { width: 100%; flex: 1; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: #ffd700; }
        .level { font-size: 14px; opacity: 0.7; }
        
        .puzzle-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; margin-bottom: 15px; }
        .target-melody { display: flex; gap: 10px; margin-bottom: 30px; }
        .target-note { width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 24px; }
        
        .puzzle-board { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 400px; }
        .puzzle-note { width: 70px; height: 70px; border-radius: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; }
        .puzzle-note.selected { transform: scale(1.1); box-shadow: 0 0 20px rgba(255,215,0,0.5); }
        
        .controls { display: flex; gap: 10px; justify-content: center; }
        .btn { padding: 12px 25px; border: none; border-radius: 15px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; }
        .btn-secondary { background: rgba(255,255,255,0.2); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="title">🎹 音乐拼图</div>
            <div class="level">第 <span id="level">1</span> 关</div>
        </div>
        
        <div class="puzzle-area">
            <div class="target-melody" id="targetMelody"></div>
            <div class="puzzle-board" id="puzzleBoard"></div>
        </div>
        
        <div class="controls">
            <button class="btn btn-secondary" onclick="playTarget()">🔊 播放目标旋律</button>
            <button class="btn btn-primary" onclick="checkAnswer()">✅ 确认答案</button>
            <button class="btn btn-secondary" onclick="nextLevel()">➡️ 下一关</button>
        </div>
    </div>
    
    <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>

    <script src="game_core.js"></script>
    <script>
        const GAME_NAME = '音乐拼图';
        GameCore.init({ highScore: GAME_NAME });
        
        const notes = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
        const noteColors = {
            'C': '#ff6b6b', 'D': '#ffa502', 'E': '#ffd700',
            'F': '#48c78e', 'G': '#4ecdc4', 'A': '#667eea', 'B': '#f093fb'
        };
        
        const levels = [
            ['C', 'D', 'E'],
            ['G', 'E', 'C'],
            ['C', 'E', 'G', 'E'],
            ['D', 'F', 'A', 'F'],
            ['E', 'G', 'B', 'G', 'E'],
            ['C', 'D', 'E', 'F', 'G'],
            ['G', 'F', 'E', 'D', 'C'],
            ['A', 'C', 'E', 'G', 'C'],
            ['B', 'D', 'F', 'A', 'C', 'E'],
            ['C', 'E', 'G', 'B', 'G', 'E', 'C']
        ];
        
        let currentLevel = 0;
        let selectedNotes = [];
        
        function initGame() {
            currentLevel = 0;
            loadLevel();
        }
        
        function loadLevel() {
            const level = levels[currentLevel];
            document.getElementById('level').textContent = currentLevel + 1;
            selectedNotes = [];
            
            renderTargetMelody(level);
            renderPuzzleBoard(level);
        }
        
        function renderTargetMelody(level) {
            const container = document.getElementById('targetMelody');
            container.innerHTML = '';
            
            level.forEach(note => {
                const el = document.createElement('div');
                el.className = 'target-note';
                el.style.background = noteColors[note];
                el.textContent = note;
                container.appendChild(el);
            });
        }
        
        function renderPuzzleBoard(level) {
            const container = document.getElementById('puzzleBoard');
            container.innerHTML = '';
            
            const shuffled = [...level].sort(() => Math.random() - 0.5);
            
            shuffled.forEach(note => {
                const el = document.createElement('div');
                el.className = 'puzzle-note';
                el.style.background = noteColors[note];
                el.innerHTML = `<span>${note}</span>`;
                el.onclick = () => selectNote(note, el);
                
                container.appendChild(el);
            });
        }
        
        function selectNote(note, el) {
            if (selectedNotes.length < levels[currentLevel].length) {
                selectedNotes.push(note);
                el.classList.add('selected');
                
                if (selectedNotes.length === levels[currentLevel].length) {
                    GameCore.hints.show('可以确认答案了！');
                }
            }
        }
        
        function playTarget() {
            const level = levels[currentLevel];
            
            let delay = 0;
            level.forEach(note => {
                setTimeout(() => {
                    playNote(note);
                }, delay);
                delay += 500;
            });
        }
        
        function playNote(note) {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            const frequencies = {
                'C': 261.63, 'D': 293.66, 'E': 329.63,
                'F': 349.23, 'G': 392.00, 'A': 440.00, 'B': 493.88
            };
            
            oscillator.frequency.value = frequencies[note];
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.5);
        }
        
        function checkAnswer() {
            const level = levels[currentLevel];
            
            if (selectedNotes.length !== level.length) {
                GameCore.hints.show('请先选完所有音符！');
                return;
            }
            
            const isCorrect = selectedNotes.every((note, index) => note === level[index]);
            
            if (isCorrect) {
                GameCore.hints.show('🎉 正确！');
                GameCore.highScore.set(GAME_NAME, currentLevel + 1);
            } else {
                GameCore.hints.show('😢 不正确，请重试');
                selectedNotes = [];
                renderPuzzleBoard(level);
            }
        }
        
        function nextLevel() {
            currentLevel++;
            
            if (currentLevel >= levels.length) {
                currentLevel = 0;
                GameCore.hints.show('🎊 恭喜通关！重新开始');
            }
            
            loadLevel();
        }
        
        initGame();
        GameCore.touch.enableAllButtons();
    </script>
</body>
</html>
