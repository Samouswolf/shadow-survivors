<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>密码破译</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 100%); min-height: 100vh; overflow: hidden; }
        .game-container { width: 100%; height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 10px; }
        .stat { display: flex; flex-direction: column; align-items: center; color: #fff; }
        .stat-label { font-size: 12px; opacity: 0.8; }
        .stat-value { font-size: 24px; font-weight: bold; color: #ffd700; }
        
        .terminal { flex: 1; background: rgba(0,0,0,0.5); border-radius: 15px; padding: 20px; font-family: 'Consolas', monospace; overflow-y: auto; }
        .terminal-line { color: #0f0; margin-bottom: 8px; font-size: 14px; }
        .terminal-line.error { color: #f55; }
        .terminal-line.info { color: #5af; }
        .terminal-line.success { color: #5f5; }
        
        .cipher-display { display: flex; justify-content: center; gap: 5px; margin: 20px 0; flex-wrap: wrap; }
        .cipher-char { width: 40px; height: 50px; background: rgba(255,255,255,0.1); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; color: #fff; }
        .cipher-char.decoded { background: rgba(72, 199, 142, 0.3); color: #48c78e; }
        .cipher-char.current { background: rgba(255, 215, 0, 0.3); border: 2px solid #ffd700; }
        
        .keyboard { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; padding: 15px; max-width: 400px; margin: 0 auto; }
        .key { height: 50px; background: rgba(255,255,255,0.1); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; color: #fff; cursor: pointer; transition: all 0.2s; }
        .key:hover { background: rgba(255,255,255,0.2); transform: scale(1.05); }
        .key:active { transform: scale(0.95); }
        .key.correct { background: rgba(72, 199, 142, 0.5); }
        .key.wrong { background: rgba(248, 113, 113, 0.5); }
        
        .controls { display: flex; gap: 10px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
        .btn { padding: 12px 25px; border: none; border-radius: 25px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; }
        .btn-secondary { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
        
        .hint-box { background: rgba(255,215,0,0.1); border: 1px solid rgba(255,215,0,0.3); border-radius: 10px; padding: 15px; margin: 10px 0; text-align: center; }
        .hint-box p { color: #ffd700; font-size: 14px; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 10px; font-size: 14px; }
    /* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */
/* [BATCH-FIX:ad-components-css] */

.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.sponsor-panel.show{display:flex}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}

.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}

.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}

<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">关卡</div>
                <div class="stat-value" id="level">1</div>
            </div>
            <div class="stat">
                <div class="stat-label">得分</div>

            </div>

            </div>
        </div>
        
        <div class="terminal" id="terminal">
            <div class="terminal-line info">> 正在连接安全服务器...</div>
            <div class="terminal-line success">> 连接成功！</div>

        </div>
        
        <div class="hint-box" id="hintBox">
            <p id="hintText">💡 提示：替换密码中的字母，破解加密</p>

        <div class="cipher-display" id="cipherDisplay"></div>
        
        <div class="keyboard" id="keyboard"></div>
        
        <div class="controls">
            <button class="btn btn-primary" id="btnHint">💡 提示</button>
            <button class="btn btn-secondary" id="btnSkip">⏭️ 跳过</button>
            <button class="btn btn-primary" id="btnNew">🔄 新关卡</button>
        </div>
        
        
    </div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script src="../game_core.js"></script>
<script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script>
        const WORDS = [
            'HACK', 'CODE', 'CYBER', 'CRYPTO', 'SECRET', 'HACKER', 'SYSTEM', 'ACCESS',
            'BREAK', 'DECODE', 'ENCRYPT', 'DECRYPT', 'CIPHER', 'BINARY', 'NETWORK',
            'SERVER', 'FIREWALL', 'PROXY', 'TROJAN', 'WORM', 'VIRUS', 'PATCH',
            'BACKUP', 'CLOUD', 'STORAGE', 'UPLOAD', 'DOWNLOAD', 'STREAM', 'BUFFER',
            'MEMORY', 'CACHE', 'STACK', 'QUEUE', 'ARRAY', 'LOOP', 'FUNCTION', 'CLASS',
            'OBJECT', 'METHOD', 'STRING', 'NUMBER', 'BOOLEAN', 'NULL', 'UNDEFINED',
            'CONSOLE', 'DEBUG', 'ERROR', 'WARNING', 'LOG', 'PRINT', 'ECHO', 'INPUT',
            'OUTPUT', 'DISPLAY', 'SCREEN', 'MONITOR', 'KEYBOARD', 'MOUSE', 'TOUCH',
            'CLICK', 'DRAG', 'DROP', 'SWIPE', 'SCROLL', 'ZOOM', 'PINCH', 'TAP',
            'START', 'BEGIN', 'END', 'CLOSE', 'OPEN', 'SAVE', 'LOAD', 'NEW', 'EDIT',
            'DELETE', 'COPY', 'PASTE', 'CUT', 'UNDO', 'REDO', 'FIND', 'REPLACE',
            'SEARCH', 'SORT', 'FILTER', 'GROUP', 'MERGE', 'SPLIT', 'COMBINE', 'LINK',
            'CONNECT', 'DISCONNECT', 'SYNC', 'REFRESH', 'UPDATE', 'UPGRADE', 'DOWNGRADE',
            'INSTALL', 'UNINSTALL', 'CONFIGURE', 'SETUP', 'RESET', 'REBOOT', 'SHUTDOWN'
        ];
        
        let level = 1;
        let score = 0;
        let highScore = parseInt(localStorage.getItem('highscore_密码破译') || '0');
        
        let originalWord = '';
        let cipherWord = '';
        let mapping = {};
        let currentIndex = 0;
        let guessedLetters = {};
        let attempts = 0;
        
        function log(message, type = '') {
            const terminal = document.getElementById('terminal');
            const line = document.createElement('div');
            line.className = 'terminal-line ' + type;
            line.textContent = '> ' + message;
            terminal.appendChild(line);
            terminal.scrollTop = terminal.scrollHeight;
        }
        
        function generateLevel() {
            originalWord = WORDS[Math.floor(Math.random() * WORDS.length)];
            
            // 生成替换映射
            const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const shuffled = letters.split('').sort(() => Math.random() - 0.5);
            mapping = {};
            
            for (let i = 0; i < letters.length; i++) {
                mapping[letters[i]] = shuffled[i];
            }
            
            // 生成密文
            cipherWord = '';
            for (const char of originalWord) {
                cipherWord += mapping[char];
            }
            
            currentIndex = 0;
            guessedLetters = {};
            attempts = 0;
            
            render();
            updateStats();
            
            log(`正在破解 ${cipherWord.length} 位密码...`, 'info');
        }
        
        function render() {
            // 渲染密文
            const display = document.getElementById('cipherDisplay');
            display.innerHTML = '';
            
            for (let i = 0; i < cipherWord.length; i++) {
                const char = cipherWord[i];
                const el = document.createElement('div');
                el.className = 'cipher-char';
                
                if (guessedLetters[char]) {
                    el.classList.add('decoded');
                    el.textContent = guessedLetters[char];
                } else if (i === currentIndex) {
                    el.classList.add('current');
                    el.textContent = char;
                } else {
                    el.textContent = char;
                }
                
                display.appendChild(el);
            }
            
            // 渲染键盘
            const keyboard = document.getElementById('keyboard');
            keyboard.innerHTML = '';
            
            const usedCipher = new Set(cipherWord.split(''));
            for (const char of 'QWERTYUIOPASDFGHJKLZXCVBNM') {
                const key = document.createElement('div');
                key.className = 'key';
                
                if (usedCipher.has(char)) {
                    key.textContent = char;
                    
                    if (guessedLetters[char]) {
                        key.classList.add('correct');
                    } else {
                        key.onclick = () => guessLetter(char);
                    }
                } else {
                    key.style.opacity = '0.3';
                    key.style.pointerEvents = 'none';
                }
                
                keyboard.appendChild(key);
            }
        }
        
        function guessLetter(cipher) {
            const original = Object.keys(mapping).find(k => mapping[k] === cipher);
            
            // 检查是否已经猜过
            if (guessedLetters[cipher]) return;
            
            // 简单提示：显示密文字母对应的原始字母（玩家输入）
            const input = prompt(`密文字母 "${cipher}" 对应的明文是？\n\n输入 A-Z 中的一个字母：`);
            
            if (input && input.length === 1) {
                const guess = input.toUpperCase();
                
                if (guess === original) {
                    guessedLetters[cipher] = guess;
                    score += 10 + (10 - attempts) * 5;
                    log(`✓ 正确！${cipher} → ${guess}`, 'success');
                    
                    // 检查是否完成
                    if (Object.keys(guessedLetters).length === new Set(cipherWord.split('')).size) {
                        setTimeout(() => {
                            log('🎉 密码破解成功！', 'success');
                            checkWin();
                        }, 500);
                    }
                } else {
                    attempts++;
                    score = Math.max(0, score - 5);
                    log(`✗ 错误！密文 ${cipher} 不是 ${guess}`, 'error');
                }
                
                render();
                updateStats();
            }
        }
        
        function checkWin() {
            const decoded = cipherWord.split('').map(c => guessedLetters[c] || '?').join('');
            
            if (decoded === originalWord) {
                score += 100 * level;
                updateStats();
                
                setTimeout(() => {
                    alert(`🎉 破解成功！\n\n原文：${originalWord}\n得分：+${100 * level}`);
                }, 100);
            }
        }
        
        function showHint() {
            const undecoded = cipherWord.split('').find(c => !guessedLetters[c]);
            if (undecoded) {
                const original = Object.keys(mapping).find(k => mapping[k] === undecoded);
                const hint = `提示：密文 "${undecoded}" 对应的明文是 "${original}"`;
                
                document.getElementById('hintText').textContent = '💡 ' + hint;
                score = Math.max(0, score - 20);
                updateStats();
            }
        }
        
        function skipLevel() {
            score = Math.max(0, score - 50);
            updateStats();
            generateLevel();
        }
        
        function updateStats() {
            document.getElementById('level').textContent = level;
            document.getElementById('score').textContent = score;
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('highscore_密码破译', highScore);
            }
            document.getElementById('highScore').textContent = highScore;
        }
        
        document.getElementById('btnHint').onclick = showHint;
        document.getElementById('btnSkip').onclick = skipLevel;
        document.getElementById('btnNew').onclick = () => {
            level++;
            generateLevel();
        };
        
        generateLevel();
        document.getElementById('highScore').textContent = highScore;
    </script>
<!-- [BATCH-FIX:responsive-js] -->
<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>
<!-- [/BATCH-FIX:responsive-js] -->
<!-- [BATCH-FIX:touch-support] -->
<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>
<!-- [/BATCH-FIX:touch-support] -->

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
