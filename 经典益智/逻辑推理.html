<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>逻辑推理</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #312e81 100%); min-height: 100vh; }
        .game-container { padding: 15px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .header-title { color: #ffd700; font-size: 20px; font-weight: bold; }
        .progress { color: #4ecdc4; font-size: 14px; }
        
        .grid-board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 15px; }
        .grid-cell { aspect-ratio: 1; background: rgba(74,85,104,0.5); border-radius: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; border: 3px solid transparent; transition: all 0.2s; }
        .grid-cell.selected { border-color: #4ecdc4; }
        .grid-cell.correct { border-color: #22c55e; background: rgba(34,197,94,0.2); }
        .grid-cell.wrong { border-color: #ef4444; background: rgba(239,68,68,0.2); }
        .cell-icon { font-size: 32px; margin-bottom: 5px; }
        .cell-label { font-size: 10px; color: #fff; }
        
        .rules-panel { background: rgba(255,255,255,0.1); border-radius: 15px; padding: 15px; margin-bottom: 15px; }
        .rules-title { color: #fff; font-size: 16px; font-weight: bold; margin-bottom: 10px; }
        .rules-list { color: #ccc; font-size: 13px; line-height: 1.8; }
        
        .clues-panel { background: rgba(251,191,36,0.1); border-radius: 15px; padding: 15px; margin-bottom: 15px; }
        .clue-item { color: #fbbf24; font-size: 14px; margin-bottom: 8px; }
        
        .actions { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 15px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-check { background: linear-gradient(135deg, #4ecdc4, #44a08d); color: #fff; }
        .btn-hint { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #fff; }
        .btn-next { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
        
        .message { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); color: #fff; padding: 20px 40px; border-radius: 15px; font-size: 20px; display: none; z-index: 100; }
        .message.show { display: block; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }
    /* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */
/* [BATCH-FIX:ad-components-css] */
.sponsor-btn{position:fixed;bottom:8px;left:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:2px 6px;border-radius:10px;font:10px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.sponsor-panel.show{display:flex}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.interstitial-ad.show{display:flex}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* [/BATCH-FIX:ad-components-css] */

/* [AD-FIX:responsive] */
@media (max-width:768px){.ad-banner-container{display:none!important}.sponsor-btn{transform:scale(.8);opacity:.6}}
/* [/AD-FIX:responsive] */
</style>
</head>
<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="header-title">🧩 逻辑推理</div>
            <div class="progress">第 <span id="level">1</span> 关</div>
        </div>
        
        <div class="grid-board" id="gridBoard"></div>
        
        <div class="rules-panel">
            <div class="rules-title">规则说明</div>
            <div class="rules-list" id="rulesList"></div>
        </div>
        
        <div class="clues-panel">
            <div id="cluesContent"></div>
        </div>
        
        <div class="actions">
            <button class="btn btn-hint" id="btnHint">💡 提示</button>
            <button class="btn btn-check" id="btnCheck">✅ 验证</button>
            <button class="btn btn-next" id="btnNext">➡️ 下一关</button>
        </div>
        
        <div class="message" id="message"></div>
        
        
    </div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script>
        const PUZZLES = [
            {
                title: '位置推理',
                icons: ['🐶', '🐱', '🐭', '🐹'],
                rules: '每个位置放一个动物，不重复',
                clues: ['🐱不在第1位', '🐶在🐭右边', '🐹在第4位'],
                solution: ['🐭', '🐶', '🐱', '🐹']
            },
            {
                title: '颜色推理',
                icons: ['🔴', '🟡', '🟢', '🔵'],
                rules: '每个格子放一种颜色，不重复',
                clues: ['🔴在最左边', '🟢在🟡右边', '🔵不在最后'],
                solution: ['🔴', '🟡', '🟢', '🔵']
            },
            {
                title: '职业推理',
                icons: ['👨‍⚕️', '👨‍🏫', '👨‍🍳', '👨‍🔧'],
                rules: '每个人一个职业，不重复',
                clues: ['👨‍⚕️不在第2位', '👨‍🍳在👨‍🏫旁边', '👨‍🔧在最后'],
                solution: ['👨‍🏫', '👨‍🍳', '👨‍⚕️', '👨‍🔧']
            },
            {
                title: '水果推理',
                icons: ['🍎', '🍊', '🍋', '🍇'],
                rules: '每个格子放一种水果，不重复',
                clues: ['🍎在🍊左边', '🍇不在第3位', '🍋在最后'],
                solution: ['🍎', '🍊', '🍇', '🍋']
            },
            {
                title: '数字推理',
                icons: ['1️⃣', '2️⃣', '3️⃣', '4️⃣'],
                rules: '每个格子放一个数字，不重复',
                clues: ['1️⃣不在第1位', '3️⃣在2️⃣右边', '4️⃣在第2位'],
                solution: ['3️⃣', '4️⃣', '2️⃣', '1️⃣']
            }
        ];
        
        let currentLevel = 0;
        let currentGrid = [];
        let selectedCell = null;
        let isSolved = false;
        
        function loadData() {
            const saved = GameCore.storage.get('logic_reason_data', null);
            if (saved) {
                currentLevel = saved.level;
            }
            initPuzzle();
        }
        
        function saveData() {
            GameCore.storage.set('logic_reason_data', { level: currentLevel });
        }
        
        function initPuzzle() {
            const puzzle = PUZZLES[currentLevel];
            document.getElementById('level').textContent = currentLevel + 1;
            document.getElementById('rulesList').textContent = puzzle.rules;
            
            const cluesEl = document.getElementById('cluesContent');
            cluesEl.innerHTML = '';
            puzzle.clues.forEach((clue, i) => {
                const el = document.createElement('div');
                el.className = 'clue-item';
                el.textContent = `${i + 1}. ${clue}`;
                cluesEl.appendChild(el);
            });
            
            currentGrid = [...puzzle.icons].sort(() => Math.random() - 0.5);
            selectedCell = null;
            isSolved = false;
            
            renderGrid();
        }
        
        function renderGrid() {
            const puzzle = PUZZLES[currentLevel];
            const gridEl = document.getElementById('gridBoard');
            gridEl.innerHTML = '';
            
            currentGrid.forEach((icon, index) => {
                const cell = document.createElement('div');
                cell.className = `grid-cell ${selectedCell === index ? 'selected' : ''}`;
                cell.innerHTML = `
                    <div class="cell-icon">${icon}</div>
                    <div class="cell-label">${index + 1}</div>
                `;
                cell.onclick = () => handleCellClick(index);
                gridEl.appendChild(cell);
            });
        }
        
        function handleCellClick(index) {
            if (isSolved) return;
            
            if (selectedCell === null) {
                selectedCell = index;
            } else if (selectedCell !== index) {
                const temp = currentGrid[selectedCell];
                currentGrid[selectedCell] = currentGrid[index];
                currentGrid[index] = temp;
                selectedCell = null;
            } else {
                selectedCell = null;
            }
            
            renderGrid();
        }
        
        function checkSolution() {
            const puzzle = PUZZLES[currentLevel];
            
            if (JSON.stringify(currentGrid) === JSON.stringify(puzzle.solution)) {
                isSolved = true;
                const cells = document.querySelectorAll('.grid-cell');
                cells.forEach(cell => cell.classList.add('correct'));
                
                showMessage('🎉 推理正确！');
                saveData();
            } else {
                showMessage('❌ 答案不对，请再想想');
            }
        }
        
        function showHint() {
            const puzzle = PUZZLES[currentLevel];
            const hint = puzzle.clues[Math.floor(Math.random() * puzzle.clues.length)];
            showMessage(`💡 提示：${hint}`);
        }
        
        function nextLevel() {
            currentLevel++;
            if (currentLevel >= PUZZLES.length) {
                showMessage('🏆 恭喜通关！');
                setTimeout(() => {
                    currentLevel = 0;
                    saveData();
                    initPuzzle();
                }, 2000);
            } else {
                initPuzzle();
                saveData();
            }
        }
        
        function showMessage(msg) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 2000);
        }
        
        document.getElementById('btnCheck').addEventListener('click', checkSolution);
        document.getElementById('btnHint').addEventListener('click', showHint);
        document.getElementById('btnNext').addEventListener('click', nextLevel);
        
        GameCore.init({ highScore: 'logic_reason' });
        loadData();
    </script>
<!-- [BATCH-FIX:responsive-js] -->
<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>
<!-- [/BATCH-FIX:responsive-js] -->
<!-- [BATCH-FIX:touch-support] -->
<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>
<!-- [/BATCH-FIX:touch-support] -->

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
