<script>
/* [STORAGE-POLYFILL v1] */
;(function(){
  var G = (typeof window !== 'undefined') ? window : (typeof globalThis !== 'undefined' ? globalThis : this);
  // 浏览器已有 Storage 构造函数，需确保其带 load/save/remove 静态方法
  var S = G.Storage;
  var needAttach = (typeof S === 'undefined' || typeof S.load !== 'function' || typeof S.save !== 'function');
  if (!needAttach) return;
  if (typeof S === 'undefined') { S = function(){}; G.Storage = S; }
  function parseSafe(s, d){
    if (s === null || s === undefined) return d;
    try { return JSON.parse(s); } catch(e) { try { return s; } catch(e2){ return d; } }
  }
  S.load = function(k, d){ try { return parseSafe(localStorage.getItem(k), d); } catch(e){ return d; } };
  S.save = function(k, v){ try { localStorage.setItem(k, typeof v==='string'?v:JSON.stringify(v)); } catch(e){} };
  S.remove = function(k){ try { localStorage.removeItem(k); } catch(e){} };
})();

// ==================== 音效系统 ====================
var audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playTone(f, d, t, v) {
    if (!audioCtx) return;
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = t || 'sine';
    o.frequency.setValueAtTime(f, audioCtx.currentTime);
    g.gain.setValueAtTime(v || 0.12, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (d || 0.08));
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + (d || 0.08));
}
function sfxMove() { playTone(660, 0.06, 'sine', 0.1); }
function sfxClick() { playTone(440, 0.05, 'square', 0.06); }
function sfxWin() {
    [523, 659, 784, 1047].forEach(function(f, i) {
        setTimeout(function() { playTone(f, 0.2, 'sine', 0.18); }, i * 120);
    });
}

// ==================== Canvas ====================
var canvas = document.getElementById('gc');
var ctx = canvas.getContext('2d');
var W, H, S; // W=width, H=height, S=scale
function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W; canvas.height = H;
    S = Math.min(W, H) / 600;
}
window.addEventListener('resize', resize);
resize();

// ==================== 粒子系统 ====================
var particles = [];
function spawnParticles(x, y, color, n) {
    for (var i = 0; i < (n || 10); i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8 - 3,
            life: 1, decay: 0.015 + Math.random() * 0.025,
            size: 2 + Math.random() * 5,
            color: color || '#FFD700'
        });
    }
}
function updateParticles() {
    for (var i = particles.length - 1; i >= 0; i--) {
        var p = particles[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.12;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
    }
}
function drawParticles() {
    for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * S, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

// ==================== 游戏状态 ====================
var DIFFICULTIES = [
    { label: '3×3', size: 3, name: '入门', moves: 30 },
    { label: '4×4', size: 4, name: '经典', moves: 80 },
    { label: '5×5', size: 5, name: '专家', moves: 200 }
];

var G = {
    state: 'menu',      // menu | playing | paused | won
    mode: 'number',     // number | image
    diffIdx: 1,         // 默认4x4
    N: 4,               // 当前棋盘尺寸
    board: [],          // 一维数组，0=空格
    emptyIdx: 15,       // 空格位置索引
    moves: 0,
    startTime: 0,
    elapsed: 0,
    bestMoves: [0, 0, 0],
    bestTimes: [0, 0, 0],
    totalGames: [0, 0, 0],
    totalWins: [0, 0, 0],
    // 动画
    animating: false,
    animFrom: 0,
    animTo: 0,
    animVal: 0,
    animT: 0,
    // 图片模式
    imageTiles: null,   // 图片分块数据
    imageSrc: null,
    // UI
    hoverBtn: null,
    touchStart: null,
    touchMoved: false,
    menuAnim: 0,
    winAnim: 0,
    // 按钮区域缓存
    btns: null
};

// ==================== 存储 ====================
function loadScores() {
    try {
        var d = JSON.parse(localStorage.getItem('slidePuzzle_scores') || '{}');
        if (d.moves) G.bestMoves = d.moves;
        if (d.times) G.bestTimes = d.times;
        if (d.games) G.totalGames = d.games;
        if (d.wins) G.totalWins = d.wins;
    } catch(e) {}
}
function saveScores() {
    try {
        localStorage.setItem('slidePuzzle_scores', JSON.stringify({
            moves: G.bestMoves, times: G.bestTimes,
            games: G.totalGames, wins: G.totalWins
        }));
    } catch(e) {}
}
loadScores();

// ==================== 逆序数可解性判断 ====================
function countInversions(arr) {
    var inv = 0;
    for (var i = 0; i < arr.length; i++) {
        if (arr[i] === 0) continue;
        for (var j = i + 1; j < arr.length; j++) {
            if (arr[j] !== 0 && arr[i] > arr[j]) inv++;
        }
    }
    return inv;
}

function isSolvable(board, N) {
    var inv = countInversions(board);
    var total = N * N;
    var emptyIdx = board.indexOf(0);
    var emptyRowFromBottom = N - Math.floor(emptyIdx / N);
    if (N % 2 === 1) {
        // 奇数宽度：逆序数为偶数即可解
        return inv % 2 === 0;
    } else {
        // 偶数宽度：逆序数+空格行号(从下往上) 为偶数即可解
        return (inv + emptyRowFromBottom) % 2 === 0;
    }
}

function makeSolvable(board, N) {
    if (isSolvable(board, N)) return board;
    // 交换前两个非空格元素使可解
    var a = board.slice();
    var i1 = -1, i2 = -1;
    for (var i = 0; i < a.length; i++) {
        if (a[i] !== 0) {
            if (i1 === -1) i1 = i;
            else if (i2 === -1) { i2 = i; break; }
        }
    }
    var tmp = a[i1]; a[i1] = a[i2]; a[i2] = tmp;
    return a;
}

function shuffleBoard(N) {
    var total = N * N;
    var arr = [];
    for (var i = 1; i < total; i++) arr.push(i);
    arr.push(0); // [1,2,3,...,15,0]
    // Fisher-Yates shuffle
    for (var i = arr.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    // 确保可解
    arr = makeSolvable(arr, N);
    // 确保不是已完成状态
    if (isSolved(arr, N)) {
        // 交换前两个非0元素
        var i1 = -1, i2 = -1;
        for (var i = 0; i < arr.length; i++) {
            if (arr[i] !== 0) {
                if (i1 === -1) i1 = i;
                else { i2 = i; break; }
            }
        }
        var tmp = arr[i1]; arr[i1] = arr[i2]; arr[i2] = tmp;
    }
    return arr;
}

function isSolved(board, N) {
    var total = N * N;
    for (var i = 0; i < total - 1; i++) {
        if (board[i] !== i + 1) return false;
    }
    return board[total - 1] === 0;
}

function idxToRC(idx, N) {
    return { r: Math.floor(idx / N), c: idx % N };
}

function rcToIdx(r, c, N) {
    return r * N + c;
}

// ==================== 游戏初始化 ====================
function initGame() {
    G.N = DIFFICULTIES[G.diffIdx].size;
    G.board = shuffleBoard(G.N);
    G.emptyIdx = G.board.indexOf(0);
    G.moves = 0;
    G.startTime = 0;
    G.elapsed = 0;
    G.animating = false;
    G.state = 'playing';
    G.totalGames[G.diffIdx]++;
    saveScores();
}

function initImageGame(img) {
    G.N = DIFFICULTIES[G.diffIdx].size;
    var total = G.N * G.N;
    // 裁剪图片为正方形
    var size = Math.min(img.width, img.height);
    var sx = (img.width - size) / 2;
    var sy = (img.height - size) / 2;
    var tileW = size / G.N;
    var tileH = size / G.N;

    // 创建离屏canvas提取每个tile
    var off = document.createElement('canvas');
    off.width = size; off.height = size;
    var octx = off.getContext('2d');
    octx.drawImage(img, sx, sy, size, size, 0, 0, size, size);

    G.imageTiles = [];
    for (var r = 0; r < G.N; r++) {
        for (var c = 0; c < G.N; c++) {
            var tc = document.createElement('canvas');
            tc.width = tileW; tc.height = tileH;
            var tctx = tc.getContext('2d');
            tctx.drawImage(off, c * tileW, r * tileH, tileW, tileH, 0, 0, tileW, tileH);
            G.imageTiles.push(tc);
        }
    }
    G.imageSrc = off; // 保存完整图片引用

    // 生成数字标记（最后一个是空格=0）
    var arr = [];
    for (var i = 1; i < total; i++) arr.push(i);
    arr.push(0);
    // Fisher-Yates shuffle
    for (var i = arr.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    arr = makeSolvable(arr, G.N);
    if (isSolved(arr, G.N)) {
        var i1 = -1, i2 = -1;
        for (var i = 0; i < arr.length; i++) {
            if (arr[i] !== 0) { if (i1 === -1) i1 = i; else { i2 = i; break; } }
        }
        var tmp = arr[i1]; arr[i1] = arr[i2]; arr[i2] = tmp;
    }
    G.board = arr;
    G.emptyIdx = G.board.indexOf(0);
    G.moves = 0;
    G.startTime = 0;
    G.elapsed = 0;
    G.animating = false;
    G.state = 'playing';
    G.totalGames[G.diffIdx]++;
    saveScores();
}

// ==================== 移动逻辑 ====================
function tryMove(idx) {
    if (G.state !== 'playing' || G.animating) return false;
    if (idx === G.emptyIdx) return false;
    var ep = idxToRC(G.emptyIdx, G.N);
    var tp = idxToRC(idx, G.N);
    var dr = Math.abs(ep.r - tp.r);
    var dc = Math.abs(ep.c - tp.c);
    if (!((dr === 1 && dc === 0) || (dr === 0 && dc === 1))) return false;

    if (G.startTime === 0) G.startTime = Date.now();
    // 记录动画
    G.animating = true;
    G.animFrom = idx;
    G.animTo = G.emptyIdx;
    G.animVal = G.board[idx];
    G.animT = 0;
    // 交换
    G.board[G.emptyIdx] = G.board[idx];
    G.board[idx] = 0;
    G.emptyIdx = idx;
    G.moves++;
    sfxMove();

    if (isSolved(G.board, G.N)) {
        setTimeout(function() { onWin(); }, 250);
    }
    return true;
}

function onWin() {
    G.state = 'won';
    G.elapsed = Date.now() - G.startTime;
    G.winAnim = 0;
    G.totalWins[G.diffIdx]++;
    if (G.bestMoves[G.diffIdx] === 0 || G.moves < G.bestMoves[G.diffIdx]) {
        G.bestMoves[G.diffIdx] = G.moves;
    }
    if (G.bestTimes[G.diffIdx] === 0 || G.elapsed < G.bestTimes[G.diffIdx]) {
        G.bestTimes[G.diffIdx] = G.elapsed;
    }
    saveScores();
    sfxWin();
    // 庆祝粒子
    var colors = ['#FFD700','#FF6B6B','#4ECDC4','#45B7D1','#96CEB4','#FFEAA7','#DDA0DD','#FF8C42'];
    for (var i = 0; i < 60; i++) {
        spawnParticles(W * Math.random(), H * Math.random(), colors[i % colors.length], 1);
    }
    // 插屏广告
    if (G.totalWins[G.diffIdx] % 3 === 0) {
        showInterstitialAd();
    }
}

// ==================== 绘制工具 ====================
function rrect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

function fmtTime(ms) {
    if (ms <= 0) return '00:00';
    var s = Math.floor(ms / 1000);
    var m = Math.floor(s / 60);
    s %= 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}

function tileColor(val, N) {
    var total = N * N;
    var t = val / total;
    if (t < 0.25) return { bg: '#4ECDC4', fg: '#1a1a2e' };
    if (t < 0.5) return { bg: '#45B7D1', fg: '#1a1a2e' };
    if (t < 0.75) return { bg: '#667eea', fg: '#fff' };
    return { bg: '#f5576c', fg: '#fff' };
}

// ==================== 绘制背景 ====================
function drawBg() {
    var grd = ctx.createLinearGradient(0, 0, 0, H);
    grd.addColorStop(0, '#0d0d1a');
    grd.addColorStop(0.5, '#1a1040');
    grd.addColorStop(1, '#0d0d1a');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, H);
}

function drawStars() {
    var t = Date.now() * 0.0005;
    for (var i = 0; i < 40; i++) {
        var x = ((i * 137.508 + t * 15) % W + W) % W;
        var y = ((i * 97.391 + Math.sin(t * 3 + i) * 30) % H + H) % H;
        var a = 0.2 + Math.sin(t * 4 + i * 0.7) * 0.15;
        ctx.globalAlpha = a;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(x, y, 1.2 * S, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

// ==================== 绘制菜单 ====================
function drawMenu() {
    drawBg();
    drawStars();
    G.menuAnim += 0.015;

    var cx = W / 2;
    var titleY = H * 0.18;

    // 标题
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var ts = Math.floor(42 * S);
    ctx.font = 'bold ' + ts + 'px "Microsoft YaHei"';
    ctx.fillStyle = '#FFD700';
    ctx.shadowColor = 'rgba(255,215,0,0.5)';
    ctx.shadowBlur = 20 * S;
    ctx.fillText('滑块拼图', cx, titleY);
    ctx.shadowBlur = 0;

    ctx.font = Math.floor(14 * S) + 'px "Microsoft YaHei"';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText('经典数字华容道 · 图片拼图', cx, titleY + 38 * S);

    // 模式选择
    var modeW = 130 * S, modeH = 44 * S, modeGap = 16 * S;
    var modeY = titleY + 80 * S;
    var modes = [
        { key: 'number', label: '🔢 数字模式', active: G.mode === 'number' },
        { key: 'image', label: '🖼️ 图片模式', active: G.mode === 'image' }
    ];
    var totalModeW = modeW * 2 + modeGap;
    for (var i = 0; i < modes.length; i++) {
        var mx = cx - totalModeW / 2 + i * (modeW + modeGap);
        rrect(mx, modeY, modeW, modeH, 10 * S);
        var m = modes[i];
        if (m.active) {
            ctx.fillStyle = 'rgba(255,215,0,0.2)';
            ctx.fill();
            ctx.strokeStyle = '#FFD700';
            ctx.lineWidth = 2 * S;
            ctx.stroke();
        } else {
            ctx.fillStyle = 'rgba(255,255,255,0.06)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.15)';
            ctx.lineWidth = 1.5 * S;
            ctx.stroke();
        }
        ctx.fillStyle = m.active ? '#FFD700' : 'rgba(255,255,255,0.7)';
        ctx.font = Math.floor(14 * S) + 'px "Microsoft YaHei"';
        ctx.fillText(m.label, mx + modeW / 2, modeY + modeH / 2);
    }
    G._menuModes = modes.map(function(m, i) {
        var mx = cx - totalModeW / 2 + i * (modeW + modeGap);
        return { key: m.key, x: mx, y: modeY, w: modeW, h: modeH };
    });

    // 难度选择
    var diffY = modeY + modeH + 24 * S;
    var diffW = Math.min(280 * S, W * 0.75);
    var diffH = 52 * S;
    var diffGap = 12 * S;
    for (var i = 0; i < DIFFICULTIES.length; i++) {
        var dy = diffY + i * (diffH + diffGap);
        var dx = cx - diffW / 2;
        var d = DIFFICULTIES[i];
        var hovered = G.hoverBtn === 'diff_' + i;
        rrect(dx, dy, diffW, diffH, 12 * S);
        ctx.fillStyle = hovered ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.05)';
        ctx.fill();
        ctx.strokeStyle = i === G.diffIdx ? 'rgba(255,215,0,0.5)' : 'rgba(255,255,255,0.12)';
        ctx.lineWidth = i === G.diffIdx ? 2 * S : 1.5 * S;
        ctx.stroke();

        // 标签
        ctx.fillStyle = '#fff';
        ctx.font = 'bold ' + Math.floor(18 * S) + 'px "Microsoft YaHei"';
        ctx.textAlign = 'left';
        ctx.fillText(d.label, dx + 18 * S, dy + diffH * 0.35);
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.font = Math.floor(12 * S) + 'px "Microsoft YaHei"';
        ctx.fillText(d.name, dx + 18 * S, dy + diffH * 0.68);

        // 最佳成绩
        var best = G.bestMoves[i];
        ctx.textAlign = 'right';
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.font = Math.floor(11 * S) + 'px "Microsoft YaHei"';
        ctx.fillText(best > 0 ? '最佳 ' + best + '步' : '未挑战', dx + diffW - 16 * S, dy + diffH / 2);
    }
    G._menuDiffs = DIFFICULTIES.map(function(d, i) {
        var dy = diffY + i * (diffH + diffGap);
        return { x: cx - diffW / 2, y: dy, w: diffW, h: diffH };
    });

    // 底部统计
    ctx.textAlign = 'center';
    var statY = H * 0.88;
    ctx.font = Math.floor(12 * S) + 'px "Microsoft YaHei"';
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    var tg = G.totalGames[0] + G.totalGames[1] + G.totalGames[2];
    var tw = G.totalWins[0] + G.totalWins[1] + G.totalWins[2];
    ctx.fillText('累计 ' + tg + ' 局 | 通关 ' + tw + ' 次', cx, statY);
}

// ==================== 绘制游戏 ====================
function drawGame() {
    drawBg();
    drawStars();

    var N = G.N;
    var pad = 16 * S;
    var headerH = 90 * S;
    var footerH = 56 * S;
    var gridGap = 2 * S;
    var availW = W - pad * 2;
    var availH = H - headerH - footerH - pad * 2 - 90 * S; // 90 for ad banner
    var tileSize = Math.floor(Math.min((availW - gridGap * (N - 1)) / N, (availH - gridGap * (N - 1)) / N));
    tileSize = Math.min(tileSize, 100 * S);
    var boardW = tileSize * N + gridGap * (N - 1);
    var boardH = tileSize * N + gridGap * (N - 1);
    var boardX = (W - boardW) / 2;
    var boardY = headerH + pad + (availH - boardH) / 2;

    // 顶部信息栏
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var infoY = 28 * S;

    // 步数
    ctx.font = 'bold ' + Math.floor(22 * S) + 'px "Microsoft YaHei"';
    ctx.fillStyle = '#4ECDC4';
    ctx.fillText(G.moves, W * 0.22, infoY);
    ctx.font = Math.floor(11 * S) + 'px "Microsoft YaHei"';
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.fillText('步数', W * 0.22, infoY + 22 * S);

    // 时间
    var elapsed = G.startTime > 0 ? Date.now() - G.startTime : 0;
    G.elapsed = elapsed;
    ctx.font = 'bold ' + Math.floor(22 * S) + 'px "Microsoft YaHei"';
    ctx.fillStyle = '#FFD700';
    ctx.fillText(fmtTime(elapsed), W * 0.5, infoY);
    ctx.font = Math.floor(11 * S) + 'px "Microsoft YaHei"';
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.fillText('用时', W * 0.5, infoY + 22 * S);

    // 难度
    ctx.font = 'bold ' + Math.floor(18 * S) + 'px "Microsoft YaHei"';
    ctx.fillStyle = '#f5576c';
    ctx.fillText(DIFFICULTIES[G.diffIdx].label, W * 0.78, infoY);
    ctx.font = Math.floor(11 * S) + 'px "Microsoft YaHei"';
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.fillText(DIFFICULTIES[G.diffIdx].name, W * 0.78, infoY + 22 * S);

    // 分隔线
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(pad, headerH - 8 * S);
    ctx.lineTo(W - pad, headerH - 8 * S);
    ctx.stroke();

    // 棋盘背景
    var bgPad = 6 * S;
    rrect(boardX - bgPad, boardY - bgPad, boardW + bgPad * 2, boardH + bgPad * 2, 12 * S);
    ctx.fillStyle = 'rgba(255,255,255,0.03)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1.5 * S;
    ctx.stroke();

    // 绘制每个tile
    for (var i = 0; i < G.board.length; i++) {
        var val = G.board[i];
        if (val === 0) continue;
        var rc = idxToRC(i, N);
        var tx = boardX + rc.c * (tileSize + gridGap);
        var ty = boardY + rc.r * (tileSize + gridGap);

        // 动画中
        if (G.animating && i === G.animTo && G.animVal === val) {
            G.animT += 0.12;
            if (G.animT >= 1) {
                G.animT = 1;
                G.animating = false;
            }
            var frc = idxToRC(G.animFrom, N);
            var trc = idxToRC(G.animTo, N);
            var fromX = boardX + frc.c * (tileSize + gridGap);
            var fromY = boardY + frc.r * (tileSize + gridGap);
            var toX = boardX + trc.c * (tileSize + gridGap);
            var toY = boardY + trc.r * (tileSize + gridGap);
            // ease-out
            var p = 1 - Math.pow(1 - G.animT, 3);
            tx = fromX + (toX - fromX) * p;
            ty = fromY + (toY - fromY) * p;
        }

        // 阴影
        ctx.shadowColor = 'rgba(0,0,0,0.4)';
        ctx.shadowBlur = 6 * S;
        ctx.shadowOffsetY = 3 * S;

        rrect(tx, ty, tileSize, tileSize, 8 * S);

        if (G.mode === 'image' && G.imageTiles && G.imageTiles[val - 1]) {
            // 图片模式
            ctx.fillStyle = '#1a1a2e';
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;
            // 圆角裁剪
            ctx.save();
            rrect(tx, ty, tileSize, tileSize, 8 * S);
            ctx.clip();
            ctx.drawImage(G.imageTiles[val - 1], tx, ty, tileSize, tileSize);
            // 数字角标
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            rrect(tx + 3 * S, ty + 3 * S, 20 * S, 18 * S, 4 * S);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.font = 'bold ' + Math.floor(10 * S) + 'px "Microsoft YaHei"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(val, tx + 3 * S + 10 * S, ty + 3 * S + 9 * S);
            ctx.restore();
        } else {
            // 数字模式
            var tc = tileColor(val, N);
            ctx.fillStyle = tc.bg;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;

            // 高光
            ctx.globalAlpha = 0.12;
            ctx.fillStyle = '#fff';
            rrect(tx + 3 * S, ty + 3 * S, tileSize - 6 * S, tileSize * 0.45, 6 * S);
            ctx.fill();
            ctx.globalAlpha = 1;

            // 数字
            var fs = Math.floor(tileSize * 0.42);
            ctx.font = 'bold ' + fs + 'px "Microsoft YaHei"';
            ctx.fillStyle = tc.fg;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(val, tx + tileSize / 2, ty + tileSize / 2);
        }
    }

    // 底部按钮
    var btnSize = 42 * S;
    var btnGap = 14 * S;
    var totalBw = btnSize * 3 + btnGap * 2;
    var btnStartX = (W - totalBw) / 2;
    var btnY = boardY + boardH + 14 * S;

    var btns = [
        { key: 'pause', icon: '⏸', label: '暂停' },
        { key: 'restart', icon: '🔄', label: '重来' },
        { key: 'menu', icon: '🏠', label: '菜单' }
    ];

    G._gameBtns = {};
    for (var i = 0; i < btns.length; i++) {
        var bx = btnStartX + i * (btnSize + btnGap);
        var b = btns[i];
        rrect(bx, btnY, btnSize, btnSize, 10 * S);
        ctx.fillStyle = G.hoverBtn === b.key ? 'rgba(255,255,255,0.15)' : 'rgba(255,255,255,0.06)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.15)';
        ctx.lineWidth = 1.2 * S;
        ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.font = Math.floor(18 * S) + 'px "Microsoft YaHei"';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(b.icon, bx + btnSize / 2, btnY + btnSize / 2);
        G._gameBtns[b.key] = { x: bx, y: btnY, w: btnSize, h: btnSize };
    }
    G._gameBoard = { x: boardX, y: boardY, w: boardW, h: boardH, ts: tileSize, gap: gridGap };
}

// ==================== 绘制暂停 ====================

// ==================== 绘制胜利 ====================

    ];

        var it = items[i];
        rrect(bx, by, bw, bh, 12 * S);
        ctx.fillStyle = G.hoverBtn === it.key ? 'rgba(255,255,255,0.15)' : 'rgba(255,255,255,0.06)';
        ctx.fill();
        ctx.strokeStyle = it.color;
        ctx.lineWidth = 2 * S;
        ctx.stroke();

    }
}

// ==================== 主循环 ====================
function loop() {
    ctx.clearRect(0, 0, W, H);
    switch (G.state) {
        case 'menu': drawMenu(); break;
        case 'playing': drawGame(); break;
        case 'paused': drawPaused(); break;
        case 'won': drawWin(); break;
    }
    requestAnimationFrame(loop);
}

// ==================== 碰撞检测 ====================
function hit(x, y, r) {
    return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
}

// ==================== 点击处理 ====================
function handleClick(x, y) {
    initAudio();
    sfxClick();

    if (G.state === 'menu') {
        // 模式切换
        if (G._menuModes) {
            for (var i = 0; i < G._menuModes.length; i++) {
                if (hit(x, y, G._menuModes[i])) {
                    G.mode = G._menuModes[i].key;
                    return;
                }
            }
        }
        // 难度选择
        if (G._menuDiffs) {
            for (var i = 0; i < G._menuDiffs.length; i++) {
                if (hit(x, y, G._menuDiffs[i])) {
                    G.diffIdx = i;
                    if (G.mode === 'image') {
                        // 触发图片上传
                        var fi = document.getElementById('fileInput');
                        fi.onchange = function(e) {
                            var file = e.target.files[0];
                            if (!file) return;
                            var reader = new FileReader();
                            reader.onload = function(ev) {
                                var img = new Image();
                                img.onload = function() {
                                    initImageGame(img);
                                };
                                img.src = ev.target.result;
                            };
                            reader.readAsDataURL(file);
                        };
                        fi.click();
                    } else {
                        initGame();
                    }
                    return;
                }
            }
        }
    } else if (G.state === 'playing') {
        if (G._gameBtns) {
            if (hit(x, y, G._gameBtns.pause)) { G.state = 'paused'; return; }
            if (hit(x, y, G._gameBtns.restart)) {
                if (G.mode === 'image' && G.imageTiles) {
                    G.board = shuffleBoard(G.N);
                    G.emptyIdx = G.board.indexOf(0);
                    G.moves = 0; G.startTime = 0; G.animating = false;
                } else {
                    initGame();
                }
                return;
            }
            if (hit(x, y, G._gameBtns.menu)) { G.state = 'menu'; G.imageTiles = null; document.getElementById('startScreen').classList.remove('hidden'); return; }
        }
        // 棋盘点击
        if (G._gameBoard) {
            var b = G._gameBoard;
            if (hit(x, y, b)) {
                var c = Math.floor((x - b.x) / (b.ts + b.gap));
                var r = Math.floor((y - b.y) / (b.ts + b.gap));
                if (r >= 0 && r < G.N && c >= 0 && c < G.N) {
                    tryMove(rcToIdx(r, c, G.N));
                }
            }
        }
    } else if (G.state === 'paused') {
        if (G._pausedBtns) {
            if (hit(x, y, G._pausedBtns.resume)) { G.state = 'playing'; return; }
            if (hit(x, y, G._pausedBtns.restart2)) {
                if (G.mode === 'image' && G.imageTiles) {
                    G.board = shuffleBoard(G.N);
                    G.emptyIdx = G.board.indexOf(0);
                    G.moves = 0; G.startTime = 0; G.animating = false;
                    G.state = 'playing';
                } else {
                    initGame();
                }
                return;
            }
            if (hit(x, y, G._pausedBtns.menu2)) { G.state = 'menu'; G.imageTiles = null; return; }
        }
    } else if (G.state === 'won') {
        if (G._winBtns) {
            if (hit(x, y, G._winBtns.again)) {
                if (G.mode === 'image' && G.imageTiles) {
                    G.board = shuffleBoard(G.N);
                    G.emptyIdx = G.board.indexOf(0);
                    G.moves = 0; G.startTime = 0; G.elapsed = 0; G.animating = false;
                    G.state = 'playing';
                } else {
                    initGame();
                }
                return;
            }
            if (hit(x, y, G._winBtns.winmenu)) { G.state = 'menu'; G.imageTiles = null; document.getElementById('startScreen').classList.remove('hidden'); return; }
        }
    }
}

// ==================== 事件绑定 ====================
canvas.addEventListener('click', function(e) {
    handleClick(e.clientX, e.clientY);
});

canvas.addEventListener('mousemove', function(e) {
    G.hoverBtn = null;
    var x = e.clientX, y = e.clientY;
    var found = false;

    if (G.state === 'menu') {
        if (G._menuModes) {
            for (var i = 0; i < G._menuModes.length; i++) {
                if (hit(x, y, G._menuModes[i])) { G.hoverBtn = 'mode_' + i; found = true; break; }
            }
        }
        if (!found && G._menuDiffs) {
            for (var i = 0; i < G._menuDiffs.length; i++) {
                if (hit(x, y, G._menuDiffs[i])) { G.hoverBtn = 'diff_' + i; found = true; break; }
            }
        }
    } else if (G.state === 'playing' && G._gameBtns) {
        var keys = ['pause', 'restart', 'menu'];
        for (var i = 0; i < keys.length; i++) {
            if (hit(x, y, G._gameBtns[keys[i]])) { G.hoverBtn = keys[i]; found = true; break; }
        }
        if (!found && G._gameBoard && hit(x, y, G._gameBoard)) { found = true; }
    } else if (G.state === 'paused' && G._pausedBtns) {
        var keys = ['resume', 'restart2', 'menu2'];
        for (var i = 0; i < keys.length; i++) {
            if (hit(x, y, G._pausedBtns[keys[i]])) { G.hoverBtn = keys[i]; found = true; break; }
        }
    } else if (G.state === 'won' && G._winBtns) {
        var keys = ['again', 'winmenu'];
        for (var i = 0; i < keys.length; i++) {
            if (hit(x, y, G._winBtns[keys[i]])) { G.hoverBtn = keys[i]; found = true; break; }
        }
    }
    canvas.style.cursor = found ? 'pointer' : 'default';
});

// 触屏
canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    var t = e.touches[0];
    G.touchStart = { x: t.clientX, y: t.clientY };
    G.touchMoved = false;
}, { passive: false });

canvas.addEventListener('touchmove', function(e) {
    e.preventDefault();
    G.touchMoved = true;
}, { passive: false });

canvas.addEventListener('touchend', function(e) {
    e.preventDefault();
    if (!G.touchStart) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - G.touchStart.x;
    var dy = t.clientY - G.touchStart.y;
    var dist = Math.sqrt(dx * dx + dy * dy);

    if (G.state === 'playing' && G._gameBoard && dist > 25) {
        // 滑动移动
        var b = G._gameBoard;
        var sx = G.touchStart.x, sy = G.touchStart.y;
        if (hit(sx, sy, b)) {
            var c = Math.floor((sx - b.x) / (b.ts + b.gap));
            var r = Math.floor((sy - b.y) / (b.ts + b.gap));
            if (r >= 0 && r < G.N && c >= 0 && c < G.N) {
                if (Math.abs(dx) > Math.abs(dy)) {
                    if (dx > 0 && c > 0) tryMove(rcToIdx(r, c - 1, G.N));
                    else if (dx < 0 && c < G.N - 1) tryMove(rcToIdx(r, c + 1, G.N));
                } else {
                    if (dy > 0 && r > 0) tryMove(rcToIdx(r - 1, c, G.N));
                    else if (dy < 0 && r < G.N - 1) tryMove(rcToIdx(r + 1, c, G.N));
                }
            }
        }
    } else if (dist < 12) {
        handleClick(t.clientX, t.clientY);
    }
    G.touchStart = null;
}, { passive: false });

// 键盘
document.addEventListener('keydown', function(e) {
    if (G.state === 'paused') {
        if (e.key === 'Escape') { G.state = 'playing'; return; }
    }
    if (G.state !== 'playing') {
        if (e.key === 'Enter' || e.key === ' ') {
            if (G.state === 'menu') {
                if (G.mode === 'image') {
                    var fi = document.getElementById('fileInput');
                    fi.onchange = function(ev) {
                        var file = ev.target.files[0];
                        if (!file) return;
                        var reader = new FileReader();
                        reader.onload = function(re) {
                            var img = new Image();
                            img.onload = function() { initImageGame(img); };
                            img.src = re.target.result;
                        };
                        reader.readAsDataURL(file);
                    };
                    fi.click();
                } else { initGame(); }
                return;
            }
            if (G.state === 'won') {
                if (G.mode === 'image' && G.imageTiles) {
                    G.board = shuffleBoard(G.N);
                    G.emptyIdx = G.board.indexOf(0);
                    G.moves = 0; G.startTime = 0; G.elapsed = 0; G.animating = false;
                    G.state = 'playing';
                } else { initGame(); }
                return;
            }
        }
        return;
    }

    var ep = idxToRC(G.emptyIdx, G.N);
    switch (e.key) {
        case 'ArrowUp': case 'w': case 'W':
            if (ep.r < G.N - 1) tryMove(rcToIdx(ep.r + 1, ep.c, G.N)); break;
        case 'ArrowDown': case 's': case 'S':
            if (ep.r > 0) tryMove(rcToIdx(ep.r - 1, ep.c, G.N)); break;
        case 'ArrowLeft': case 'a': case 'A':
            if (ep.c < G.N - 1) tryMove(rcToIdx(ep.r, ep.c + 1, G.N)); break;
        case 'ArrowRight': case 'd': case 'D':
            if (ep.c > 0) tryMove(rcToIdx(ep.r, ep.c - 1, G.N)); break;
        case 'Escape': G.state = 'paused'; break;
        case 'r': case 'R':
            if (G.mode === 'image' && G.imageTiles) {
                G.board = shuffleBoard(G.N);
                G.emptyIdx = G.board.indexOf(0);
                G.moves = 0; G.startTime = 0; G.animating = false;
            } else { initGame(); }
            break;
    }
});

  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
