<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>汉诺塔挑战</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #7f1d1d 0%, #991b1b 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
#game-container { position: relative; width: 100%; max-width: 500px; padding: 20px; }
#game-header { text-align: center; color: #fff; margin-bottom: 20px; }
#game-header h1 { font-size: 28px; font-weight: bold; margin-bottom: 10px; }
#game-header .stats { display: flex; justify-content: center; gap: 30px; font-size: 16px; }
#game-header .stats span { color: #4ade80; font-weight: bold; }
#game-board { display: flex; justify-content: center; gap: 20px; height: 300px; margin-bottom: 20px; }
.tower { display: flex; flex-direction: column-reverse; align-items: center; justify-content: flex-start; width: 120px; height: 250px; border-bottom: 4px solid #475569; position: relative; cursor: pointer; }
.tower.selected { border-bottom-color: #fbbf24; }
.disk { height: 30px; border-radius: 15px; margin-bottom: 5px; transition: all 0.3s; }
.disk-1 { width: 40px; background: #ef4444; }
.disk-2 { width: 60px; background: #f97316; }
.disk-3 { width: 80px; background: #eab308; }
.disk-4 { width: 100px; background: #22c55e; }
.disk-5 { width: 120px; background: #3b82f6; }
.tower-label { position: absolute; bottom: -30px; font-size: 18px; font-weight: bold; color: #fff; }
#controls { display: flex; gap: 15px; justify-content: center; margin-bottom: 20px; }
.btn { padding: 12px 25px; font-size: 16px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; transition: all 0.2s; }
.btn-primary { background: linear-gradient(145deg, #6366f1, #4f46e5); color: #fff; }
.btn-primary:hover { transform: translateY(-2px); }
#difficulty-select { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
.diff-btn { padding: 8px 16px; font-size: 14px; border-radius: 20px; border: none; cursor: pointer; }
.diff-btn.active { background: #6366f1; color: #fff; }
.diff-btn:not(.active) { background: rgba(255,255,255,0.2); color: #fff; }
#message { text-align: center; font-size: 18px; font-weight: bold; color: #4ade80; min-height: 30px; }
#loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #7f1d1d; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
#loading-screen .spinner { width: 50px; height: 50px; border: 4px solid rgba(99,102,241,0.3); border-top-color: #6366f1; border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.ad-banner-container { width: 100%; max-width: 728px; margin-top: auto; padding: 10px; }
.sponsor-btn { position: fixed; top: 20px; right: 20px; width: 50px; height: 50px; background: rgba(255,165,0,0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; z-index: 100; }
.sponsor-panel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 200; align-items: center; justify-content: center; }
.sponsor-panel.show { display: flex; }
.sponsor-content { background: #fff; padding: 30px; border-radius: 20px; text-align: center; }
.sponsor-close { position: absolute; top: 20px; right: 20px; width: 40px; height: 40px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; }
.interstitial-ad { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 300; align-items: center; justify-content: center; flex-direction: column; }
.interstitial-ad.show { display: flex; }
</style>
</head>
<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

<div id="loading-screen">
  <div class="spinner"></div>
  <p style="color:#fff;margin-top:20px;">游戏加载中...</p>
</div>

<div class="sponsor-btn" onclick="showSponsor()">☕</div>
<div class="sponsor-panel" id="sponsor-panel" onclick="hideSponsor()">
  <div class="sponsor-content" onclick="event.stopPropagation()">
    <h3>支持开发者</h3>
    <p>感谢您的支持！</p>
  </div>
  <div class="sponsor-close" onclick="hideSponsor()">×</div>
</div>

<div class="interstitial-ad" id="interstitial-ad">
  <h2 style="color:#fff;margin-bottom:30px;">🎉 恭喜通关！</h2>
  <button class="btn btn-primary" onclick="hideInterstitial()">继续游戏</button>
</div>

<div id="game-container">
  <div id="game-header">
    <h1>汉诺塔挑战</h1>
    <div class="stats">
      <span>步数: <span id="moves">0</span></span>
      <span>最优: <span id="optimal">7</span></span>
      <span>最佳: <span id="best">--</span></span>
    </div>
  </div>
  
  <div id="difficulty-select">
    <button class="diff-btn" onclick="setDiskCount(3)">3个圆盘</button>
    <button class="diff-btn active" onclick="setDiskCount(4)">4个圆盘</button>
    <button class="diff-btn" onclick="setDiskCount(5)">5个圆盘</button>
  </div>
  
  <div id="message"></div>
  
  <div id="game-board">
    <div class="tower" onclick="selectTower(0)">
      <div class="tower-label">A</div>
    </div>
    <div class="tower" onclick="selectTower(1)">
      <div class="tower-label">B</div>
    </div>
    <div class="tower" onclick="selectTower(2)">
      <div class="tower-label">C</div>
    </div>
  </div>
  
  <div id="controls">
    <button class="btn btn-primary" onclick="newGame()">新游戏</button>
    <button class="btn btn-primary" onclick="autoSolve()">自动演示</button>
  </div>
</div>

<div class="ad-banner-container">
  <div style="background:#f0f0f0;height:90px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#666;">广告位</div>
</div>


  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script>
class GameCore {
  static init(options) {
    if (options.loading) {
      setTimeout(() => {
        document.getElementById('loading-screen').style.display = 'none';
      }, 800);
    }
    if (options.highScore) {
      this.highScoreKey = options.highScore;
    }
  }
  
  static getHighScore() {
    return localStorage.getItem(this.highScoreKey) || '--';
  }
  
  static setHighScore(value) {
    const current = localStorage.getItem(this.highScoreKey);
    if (!current || value < parseInt(current)) {
      localStorage.setItem(this.highScoreKey, value);
      return true;
    }
    return false;
  }
}

GameCore.init({ loading: true, highScore: '汉诺塔挑战' });

class HanoiGame {
  constructor() {
    this.diskCount = 4;
    this.towers = [[], [], []];
    this.selectedTower = null;
    this.moves = 0;
    this.isAutoPlaying = false;
    
    this.towerElements = document.querySelectorAll('.tower');
    this.movesDisplay = document.getElementById('moves');
    this.optimalDisplay = document.getElementById('optimal');
    this.bestDisplay = document.getElementById('best');
    this.message = document.getElementById('message');
    
    this.init();
  }
  
  init() {
    this.bestDisplay.textContent = GameCore.getHighScore();
    this.newGame();
  }
  
  newGame() {
    this.isAutoPlaying = false;
    this.towers = [[], [], []];
    this.selectedTower = null;
    this.moves = 0;
    
    for (let i = this.diskCount; i >= 1; i--) {
      this.towers[0].push(i);
    }
    
    this.movesDisplay.textContent = '0';
    this.optimalDisplay.textContent = Math.pow(2, this.diskCount) - 1;
    this.message.textContent = '';
    
    this.render();
  }
  
  render() {
    this.towerElements.forEach((tower, index) => {
      tower.innerHTML = `<div class="tower-label">${String.fromCharCode(65 + index)}</div>`;
      
      this.towers[index].forEach(disk => {
        const diskElement = document.createElement('div');
        diskElement.className = `disk disk-${disk}`;
        tower.appendChild(diskElement);
      });
      
      if (this.selectedTower === index) {
        tower.classList.add('selected');
      } else {
        tower.classList.remove('selected');
      }
    });
  }
  
  selectTower(index) {
    if (this.isAutoPlaying) return;
    
    if (!this.selectedTower) {
      if (this.towers[index].length > 0) {
        this.selectedTower = index;
        this.render();
      }
    } else {
      if (this.selectedTower === index) {
        this.selectedTower = null;
      } else {
        this.moveDisk(this.selectedTower, index);
        this.selectedTower = null;
      }
      this.render();
    }
  }
  
  moveDisk(from, to) {
    if (this.towers[from].length === 0) return;
    
    const topDisk = this.towers[from][this.towers[from].length - 1];
    
    if (this.towers[to].length > 0) {
      const targetTop = this.towers[to][this.towers[to].length - 1];
      if (topDisk > targetTop) return;
    }
    
    this.towers[from].pop();
    this.towers[to].push(topDisk);
    this.moves++;
    this.movesDisplay.textContent = this.moves;
    
    if (this.isWin()) {
      this.win();
    }
  }
  
  isWin() {
    return this.towers[2].length === this.diskCount;
  }
  
  win() {
    this.message.textContent = '🎉 恭喜通关！';
    this.message.style.color = '#4ade80';
    
    if (GameCore.setHighScore(this.moves)) {
      this.bestDisplay.textContent = this.moves;
      this.message.textContent += ' 新纪录！';
    }
    
    setTimeout(() => {
      document.getElementById('interstitial-ad').classList.add('show');
    }, 500);
  }
  
  setDiskCount(count) {
    document.querySelectorAll('.diff-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    
    this.diskCount = count;
    this.newGame();
  }
  
  async autoSolve() {
    this.isAutoPlaying = true;
    this.newGame();
    
    await this.solve(this.diskCount, 0, 2, 1);
    
    this.isAutoPlaying = false;
  }
  
  async solve(n, from, to, aux) {
    if (n === 1) {
      await new Promise(r => setTimeout(r, 300));
      this.moveDisk(from, to);
      this.render();
      return;
    }
    
    await this.solve(n - 1, from, aux, to);
    await new Promise(r => setTimeout(r, 300));
    this.moveDisk(from, to);
    this.render();
    await this.solve(n - 1, aux, to, from);
  }
}

function showSponsor() {
  document.getElementById('sponsor-panel').classList.add('show');
}

function hideSponsor() {
  document.getElementById('sponsor-panel').classList.remove('show');
}

function hideInterstitial() {
  document.getElementById('interstitial-ad').classList.remove('show');
}

const hanoi = new HanoiGame();
</script>
</body>
</html>
