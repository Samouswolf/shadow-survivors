<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>数字华容道进阶</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
#game-container { position: relative; width: 100%; max-width: 450px; padding: 20px; }
#game-header { text-align: center; color: #fff; margin-bottom: 20px; }
#game-header h1 { font-size: 28px; font-weight: bold; margin-bottom: 10px; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
#game-header .stats { display: flex; justify-content: center; gap: 30px; font-size: 16px; }
#game-header .stats span { color: #4ade80; font-weight: bold; }
#game-board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; backdrop-filter: blur(10px); margin-bottom: 20px; }
.tile { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; border-radius: 10px; cursor: pointer; transition: all 0.2s ease; user-select: none; }
.tile.number { background: linear-gradient(145deg, #6366f1, #4f46e5); color: #fff; box-shadow: 0 4px 15px rgba(99,102,241,0.4); }
.tile.number:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(99,102,241,0.6); }
.tile.number.movable { background: linear-gradient(145deg, #22c55e, #16a34a); box-shadow: 0 4px 15px rgba(34,197,94,0.4); }
.tile.empty { background: transparent; }
#controls { display: flex; gap: 15px; justify-content: center; margin-bottom: 20px; }
.btn { padding: 12px 25px; font-size: 16px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; transition: all 0.2s ease; }
.btn-primary { background: linear-gradient(145deg, #6366f1, #4f46e5); color: #fff; box-shadow: 0 4px 15px rgba(99,102,241,0.4); }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(99,102,241,0.6); }
.btn-secondary { background: rgba(255,255,255,0.2); color: #fff; border: 2px solid rgba(255,255,255,0.3); }
.btn-secondary:hover { background: rgba(255,255,255,0.3); }
#difficulty-select { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
.diff-btn { padding: 8px 16px; font-size: 14px; border-radius: 20px; border: none; cursor: pointer; transition: all 0.2s; }
.diff-btn.active { background: #6366f1; color: #fff; }
.diff-btn:not(.active) { background: rgba(255,255,255,0.2); color: #fff; }
#message { text-align: center; font-size: 18px; font-weight: bold; color: #4ade80; min-height: 30px; margin-bottom: 10px; }
#loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a2e; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
#loading-screen .spinner { width: 50px; height: 50px; border: 4px solid rgba(99,102,241,0.3); border-top-color: #6366f1; border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#loading-screen p { color: #fff; margin-top: 20px; font-size: 18px; }
.ad-banner-container { width: 100%; max-width: 728px; margin-top: auto; padding: 10px; }
.sponsor-btn { position: fixed; top: 20px; right: 20px; width: 50px; height: 50px; background: rgba(255,165,0,0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; z-index: 100; box-shadow: 0 4px 15px rgba(255,165,0,0.4); }
.sponsor-btn:hover { transform: scale(1.1); }
.sponsor-panel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 200; align-items: center; justify-content: center; }
.sponsor-panel.show { display: flex; }
.sponsor-content { background: #fff; padding: 30px; border-radius: 20px; text-align: center; max-width: 90%; }
.sponsor-content h3 { margin-bottom: 20px; color: #333; }
.sponsor-content img { max-width: 200px; height: auto; border-radius: 10px; margin-bottom: 10px; }
.sponsor-close { position: absolute; top: 20px; right: 20px; width: 40px; height: 40px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; }
.interstitial-ad { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 300; align-items: center; justify-content: center; flex-direction: column; }
.interstitial-ad.show { display: flex; }
.interstitial-ad h2 { color: #fff; margin-bottom: 30px; font-size: 28px; }
.interstitial-ad .btn-primary { padding: 15px 40px; font-size: 18px; }
/* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */
</style>
</head>
<body>
<div id="loading-screen">
  <div class="spinner"></div>
  <p>游戏加载中...</p>
</div>

<div class="sponsor-btn" onclick="showSponsor()">☕</div>
<div class="sponsor-panel" id="sponsor-panel" onclick="hideSponsor()">
  <div class="sponsor-content" onclick="event.stopPropagation()">
    <h3>支持开发者</h3>
    <p>感谢您的支持！</p>
    <div style="color:#666;font-size:14px;margin-top:10px;">微信赞赏码</div>
  </div>
  <div class="sponsor-close" onclick="hideSponsor()">×</div>
</div>

<div class="interstitial-ad" id="interstitial-ad">
  <h2>🎉 恭喜通关！</h2>
  <button class="btn btn-primary" onclick="hideInterstitial()">继续游戏</button>
</div>

<div id="game-container">
  <div id="game-header">
    <h1>数字华容道</h1>
    <div class="stats">
      <span>步数: <span id="moves">0</span></span>
      <span>时间: <span id="time">00:00</span></span>
      <span>最佳: <span id="best">--</span></span>
    </div>
  </div>
  
  <div id="difficulty-select">
    <button class="diff-btn active" onclick="setDifficulty(3)">3×3</button>
    <button class="diff-btn" onclick="setDifficulty(4)">4×4</button>
    <button class="diff-btn" onclick="setDifficulty(5)">5×5</button>
  </div>
  
  <div id="message"></div>
  
  <div id="game-board"></div>
  
  <div id="controls">
    <button class="btn btn-primary" onclick="shuffleBoard()">重新开始</button>
    <button class="btn btn-secondary" onclick="solveBoard()">提示</button>
  </div>
</div>

<div class="ad-banner-container">
  <div style="background:#f0f0f0;height:90px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#666;font-size:14px;">广告位</div>
</div>


  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script src="../game_core.js"></script>
<script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script>
class GameCore {
  static init(options) {
    if (options.loading) {
      setTimeout(() => {
        document.getElementById('loading-screen').style.display = 'none';
      }, 800);
    }
    if (options.highScore) {
      this.highScoreKey = options.highScore;
    }
  }
  
  static getHighScore() {
    return localStorage.getItem(this.highScoreKey) || '--';
  }
  
  static setHighScore(value) {
    const current = localStorage.getItem(this.highScoreKey);
    if (!current || value < parseInt(current)) {
      localStorage.setItem(this.highScoreKey, value);
      return true;
    }
    return false;
  }
}

const GAME_NAME = '数字华容道进阶';
GameCore.init({ loading: true, highScore: GAME_NAME });

class SlidingPuzzle {
  constructor() {
    this.size = 4;
    this.tiles = [];
    this.moves = 0;
    this.time = 0;
    this.timer = null;
    this.isPlaying = false;
    
    this.board = document.getElementById('game-board');
    this.movesDisplay = document.getElementById('moves');
    this.timeDisplay = document.getElementById('time');
    this.bestDisplay = document.getElementById('best');
    this.message = document.getElementById('message');
    
    this.init();
  }
  
  init() {
    this.bestDisplay.textContent = GameCore.getHighScore();
    this.startNewGame();
  }
  
  startNewGame() {
    this.stopTimer();
    this.moves = 0;
    this.time = 0;
    this.movesDisplay.textContent = '0';
    this.timeDisplay.textContent = '00:00';
    this.message.textContent = '';
    
    this.tiles = Array.from({ length: this.size * this.size }, (_, i) => i);
    this.shuffle();
    this.render();
    this.startTimer();
    this.isPlaying = true;
  }
  
  shuffle() {
    do {
      for (let i = this.tiles.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [this.tiles[i], this.tiles[j]] = [this.tiles[j], this.tiles[i]];
      }
    } while (!this.isSolvable() || this.isSolved());
  }
  
  isSolvable() {
    let inversions = 0;
    const flatTiles = this.tiles.filter(t => t !== 0);
    
    for (let i = 0; i < flatTiles.length - 1; i++) {
      for (let j = i + 1; j < flatTiles.length; j++) {
        if (flatTiles[i] > flatTiles[j]) inversions++;
      }
    }
    
    if (this.size % 2 === 1) {
      return inversions % 2 === 0;
    } else {
      const emptyRow = Math.floor(this.tiles.indexOf(0) / this.size);
      const emptyRowFromBottom = this.size - emptyRow;
      return (inversions + emptyRowFromBottom) % 2 === 1;
    }
  }
  
  isSolved() {
    for (let i = 0; i < this.tiles.length - 1; i++) {
      if (this.tiles[i] !== i + 1) return false;
    }
    return this.tiles[this.tiles.length - 1] === 0;
  }
  
  getEmptyIndex() {
    return this.tiles.indexOf(0);
  }
  
  getMovableIndices() {
    const emptyIndex = this.getEmptyIndex();
    const emptyRow = Math.floor(emptyIndex / this.size);
    const emptyCol = emptyIndex % this.size;
    const movable = [];
    
    if (emptyRow > 0) movable.push(emptyIndex - this.size);
    if (emptyRow < this.size - 1) movable.push(emptyIndex + this.size);
    if (emptyCol > 0) movable.push(emptyIndex - 1);
    if (emptyCol < this.size - 1) movable.push(emptyIndex + 1);
    
    return movable;
  }
  
  render() {
    this.board.innerHTML = '';
    this.board.style.gridTemplateColumns = `repeat(${this.size}, 1fr)`;
    
    const movableIndices = this.getMovableIndices();
    
    this.tiles.forEach((tile, index) => {
      const div = document.createElement('div');
      div.className = 'tile';
      
      if (tile === 0) {
        div.classList.add('empty');
      } else {
        div.classList.add('number');
        div.textContent = tile;
        
        if (movableIndices.includes(index)) {
          div.classList.add('movable');
        }
        
        div.onclick = () => this.moveTile(index);
        div.ontouchstart = (e) => { e.preventDefault(); this.moveTile(index); };
      }
      
      this.board.appendChild(div);
    });
  }
  
  moveTile(index) {
    if (!this.isPlaying) return;
    
    const movableIndices = this.getMovableIndices();
    if (!movableIndices.includes(index)) return;
    
    const emptyIndex = this.getEmptyIndex();
    [this.tiles[index], this.tiles[emptyIndex]] = [this.tiles[emptyIndex], this.tiles[index]];
    
    this.moves++;
    this.movesDisplay.textContent = this.moves;
    this.render();
    
    if (this.isSolved()) {
      this.win();
    }
  }
  
  win() {
    this.isPlaying = false;
    this.stopTimer();
    this.message.textContent = '🎉 恭喜通关！';
    this.message.style.color = '#4ade80';
    
    const currentBest = GameCore.getHighScore();
    if (currentBest === '--' || this.moves < parseInt(currentBest)) {
      GameCore.setHighScore(this.moves);
      this.bestDisplay.textContent = this.moves;
      this.message.textContent += ' 新纪录！';
    }
    
    setTimeout(() => {
      document.getElementById('interstitial-ad').classList.add('show');
    }, 500);
  }
  
  startTimer() {
    this.timer = setInterval(() => {
      this.time++;
      const minutes = Math.floor(this.time / 60).toString().padStart(2, '0');
      const seconds = (this.time % 60).toString().padStart(2, '0');
      this.timeDisplay.textContent = `${minutes}:${seconds}`;
    }, 1000);
  }
  
  stopTimer() {
    if (this.timer) {
      clearInterval(this.timer);
      this.timer = null;
    }
  }
  
  shuffleBoard() {
    this.startNewGame();
  }
  
  solveBoard() {
    this.message.textContent = '提示：点击相邻的数字方块移动';
    this.message.style.color = '#fbbf24';
    setTimeout(() => {
      this.message.textContent = '';
    }, 2000);
  }
  
  setSize(size) {
    this.size = size;
    this.startNewGame();
  }
}

function setDifficulty(size) {
  document.querySelectorAll('.diff-btn').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');
  puzzle.setSize(size);
}

function showSponsor() {
  document.getElementById('sponsor-panel').classList.add('show');
}

function hideSponsor() {
  document.getElementById('sponsor-panel').classList.remove('show');
}

function hideInterstitial() {
  document.getElementById('interstitial-ad').classList.remove('show');
}

const puzzle = new SlidingPuzzle();
</script>

<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>
<!-- [/BATCH-FIX:responsive-js] -->
<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
</body>
