<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>数字接龙</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; }
        .game-container { padding: 15px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .score-display { color: #ffd700; font-size: 24px; font-weight: bold; }
        .level-display { color: #4ecdc4; font-size: 16px; }
        
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 15px; }
        .cell { aspect-ratio: 1; background: rgba(74,85,104,0.5); border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; color: #fff; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; }
        .cell:hover { background: rgba(74,85,104,0.8); }
        .cell.selected { border-color: #4ecdc4; background: rgba(78, 205, 196, 0.3); }
        .cell.correct { border-color: #22c55e; background: rgba(34,197,94,0.3); }
        .cell.wrong { border-color: #ef4444; background: rgba(239,68,68,0.3); }
        
        .stats { display: flex; justify-content: space-around; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .stat-item { text-align: center; color: #fff; }
        .stat-value { font-size: 20px; font-weight: bold; }
        .stat-label { font-size: 12px; opacity: 0.7; }
        
        .message { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); color: #fff; padding: 20px 40px; border-radius: 15px; font-size: 20px; display: none; z-index: 100; }
        .message.show { display: block; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="score-display">🔢 <span id="score">0</span></div>
            <div class="level-display">第 <span id="level">1</span> 关</div>
        </div>
        
        <div class="grid" id="grid"></div>
        
        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="found">0</div>
                <div class="stat-label">找到</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="errors">0</div>
                <div class="stat-label">错误</div>
            </div>
        </div>
        
        <div class="message" id="message"></div>
        
        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script>
        const GRID_SIZE = 25;
        
        let score = 0;
        let level = 1;
        let found = 0;
        let errors = 0;
        let numbers = [];
        let currentNumber = 1;
        
        function loadData() {
            const saved = GameCore.storage.get('number_chain_data', null);
            if (saved) {
                score = saved.score;
                level = saved.level;
            }
            updateUI();
            initGame();
        }
        
        function saveData() {
            GameCore.storage.set('number_chain_data', { score, level });
        }
        
        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
            document.getElementById('found').textContent = found;
            document.getElementById('errors').textContent = errors;
        }
        
        function initGame() {
            numbers = [];
            for (let i = 1; i <= GRID_SIZE; i++) {
                numbers.push(i);
            }
            // Shuffle
            numbers.sort(() => Math.random() - 0.5);
            
            currentNumber = 1;
            found = 0;
            errors = 0;
            
            renderGrid();
        }
        
        function renderGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            
            numbers.forEach((num, index) => {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.textContent = num;
                cell.onclick = () => selectNumber(index);
                grid.appendChild(cell);
            });
        }
        
        function selectNumber(index) {
            const cells = document.querySelectorAll('.cell');
            
            if (numbers[index] === currentNumber) {
                cells[index].classList.add('correct');
                found++;
                score += 10;
                currentNumber++;
                
                if (currentNumber > GRID_SIZE) {
                    showMessage('🎉 完成！');
                    level++;
                    setTimeout(() => initGame(), 2000);
                }
            } else {
                cells[index].classList.add('wrong');
                errors++;
                setTimeout(() => cells[index].classList.remove('wrong'), 500);
            }
            
            updateUI();
            saveData();
        }
        
        function showMessage(msg) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 2000);
        }
        
        GameCore.init({ highScore: 'number_chain' });
        loadData();
    </script>
</body>
</html>
