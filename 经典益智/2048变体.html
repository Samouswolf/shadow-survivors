<script>
// ============================================================
// 2048变体 - 多种2048玩法模式
// ============================================================

var canvas = document.getElementById('C');
var ctx = canvas.getContext('2d');
var W = 600, H = 600;
var SCALE = 1;

function resize() {
    var maxW = window.innerWidth - 20;
    var maxH = window.innerHeight - 110;
    SCALE = Math.min(maxW / W, maxH / H);
    canvas.width = W * SCALE;
    canvas.height = H * SCALE;
    canvas.style.width = (W * SCALE) + 'px';
    canvas.style.height = (H * SCALE) + 'px';
    ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ============================================================
// 游戏配置
// ============================================================
var TILE_SIZE = 100;
var GRID_SIZE = 4;
var ANIM_SPEED = 0.15;

// 颜色配置
var TILE_COLORS = {
    0: '#34495e',
    2: '#eee4da',
    4: '#ede0c8',
    8: '#f2b179',
    16: '#f59563',
    32: '#f67c5f',
    64: '#f65e3b',
    128: '#edcf72',
    256: '#edcc61',
    512: '#edc850',
    1024: '#edc53f',
    2048: '#edc22e',
    4096: '#3c3a32',
    8192: '#3c3a32'
};

var TEXT_COLORS = {
    2: '#776e65',
    4: '#776e65',
    default: '#f9f6f2'
};

var COL = {
    bg: '#1a1a2e',
    gridBg: '#34495e',
    text: '#fff',
    score: '#f1c40f'
};

// 游戏模式
var MODES = [
    {name: '经典4x4', size: 4, desc: '经典2048玩法'},
    {name: '5x5扩展', size: 5, desc: '更大棋盘，更容易达成2048'},
    {name: '3x3挑战', size: 3, desc: '更小棋盘，难度更高'},
    {name: '连线模式', size: 4, desc: '相同数字连线消除'}
];

// ============================================================
// 游戏状态
// ============================================================
var G = {
    state: 'menu', // menu, playing, gameOver, win
    mode: 0,
    grid: [],
    score: 0,
    bestScore: 0,
    tiles: [],
    animating: false,
    moveCount: 0,
    gameOver: false,
    won: false,
    canContinue: true
};

// ============================================================
// 音效系统
// ============================================================
var audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playTone(freq, dur, vol, type) {
    if (!audioCtx) return;
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = type || 'square';
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.15, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
}
function sfxMerge() { playTone(400, 0.1, 0.1, 'sine'); }
function sfxMove() { playTone(200, 0.05, 0.08, 'triangle'); }
function sfxWin() {
    [0,100,200,300].forEach(function(d,i) {
        setTimeout(function() { playTone(440 + i * 110, 0.2, 0.15, 'sine'); }, d);
    });
}

// ============================================================
// 输入处理
// ============================================================
var keys = {};
document.addEventListener('keydown', function(e) {
    keys[e.key] = true;
    if (G.state === 'playing' && !G.animating) {
        handleMove(e.key);
    }
});
document.addEventListener('keyup', function(e) { keys[e.key] = false; });

canvas.addEventListener('click', function(e) {
    initAudio();
    var rect = canvas.getBoundingClientRect();
    var x = (e.clientX - rect.left) / SCALE;
    var y = (e.clientY - rect.top) / SCALE;
    
    if (G.state === 'menu') {
        // 选择模式
        for (var i = 0; i < MODES.length; i++) {
            var btnY = H/2 - 80 + i * 40;
            if (x > W/2 - 100 && x < W/2 + 100 && y > btnY && y < btnY + 35) {
                G.mode = i;
            }
        }
        // 开始按钮
        if (x > W/2 - 80 && x < W/2 + 80 && y > H/2 + 80 && y < H/2 + 120) {
            startGame();
        }
    } else if (G.state === 'gameOver' || G.state === 'win') {
        if (x > W/2 - 80 && x < W/2 + 80 && y > H/2 + 50 && y < H/2 + 90) {
            startGame();
        }
    }
});

function startGame() {
    G.state = 'playing';
    G.score = 0;
    G.moveCount = 0;
    G.gameOver = false;
    G.won = false;
    G.canContinue = true;
    
    var size = MODES[G.mode].size;
    GRID_SIZE = size;
    TILE_SIZE = Math.floor(400 / size);
    
    // 初始化网格
    G.grid = [];
    for (var i = 0; i < size; i++) {
        G.grid[i] = [];
        for (var j = 0; j < size; j++) {
            G.grid[i][j] = 0;
        }
    }
    
    // 添加初始方块
    addRandomTile();
    addRandomTile();
}

function addRandomTile() {
    var empty = [];
    for (var i = 0; i < GRID_SIZE; i++) {
        for (var j = 0; j < GRID_SIZE; j++) {
            if (G.grid[i][j] === 0) {
                empty.push({r: i, c: j});
            }
        }
    }
    
    if (empty.length === 0) return false;
    
    var pos = empty[Math.floor(Math.random() * empty.length)];
    G.grid[pos.r][pos.c] = Math.random() < 0.9 ? 2 : 4;
    return true;
}

function handleMove(key) {
    var moved = false;
    
    if (key === 'ArrowUp' || key === 'w') {
        moved = moveUp();
    } else if (key === 'ArrowDown' || key === 's') {
        moved = moveDown();
    } else if (key === 'ArrowLeft' || key === 'a') {
        moved = moveLeft();
    } else if (key === 'ArrowRight' || key === 'd') {
        moved = moveRight();
    }
    
    if (moved) {
        sfxMove();
        G.moveCount++;
        addRandomTile();
        checkGameState();
    }
}

function moveLeft() {
    var moved = false;
    for (var r = 0; r < GRID_SIZE; r++) {
        var row = G.grid[r].slice();
        var newRow = mergeRow(row);
        if (row.join(',') !== newRow.join(',')) {
            moved = true;
            G.grid[r] = newRow;
        }
    }
    return moved;
}

function moveRight() {
    var moved = false;
    for (var r = 0; r < GRID_SIZE; r++) {
        var row = G.grid[r].slice().reverse();
        var newRow = mergeRow(row).reverse();
        if (G.grid[r].join(',') !== newRow.join(',')) {
            moved = true;
            G.grid[r] = newRow;
        }
    }
    return moved;
}

function moveUp() {
    var moved = false;
    for (var c = 0; c < GRID_SIZE; c++) {
        var col = [];
        for (var r = 0; r < GRID_SIZE; r++) {
            col.push(G.grid[r][c]);
        }
        var newCol = mergeRow(col);
        for (var r = 0; r < GRID_SIZE; r++) {
            if (G.grid[r][c] !== newCol[r]) {
                moved = true;
                G.grid[r][c] = newCol[r];
            }
        }
    }
    return moved;
}

function moveDown() {
    var moved = false;
    for (var c = 0; c < GRID_SIZE; c++) {
        var col = [];
        for (var r = 0; r < GRID_SIZE; r++) {
            col.push(G.grid[r][c]);
        }
        col.reverse();
        var newCol = mergeRow(col).reverse();
        for (var r = 0; r < GRID_SIZE; r++) {
            if (G.grid[r][c] !== newCol[r]) {
                moved = true;
                G.grid[r][c] = newCol[r];
            }
        }
    }
    return moved;
}

function mergeRow(row) {
    // 移除空格
    var filtered = row.filter(function(v) { return v !== 0; });
    
    // 合并相同数字
    var merged = [];
    for (var i = 0; i < filtered.length; i++) {
        if (i < filtered.length - 1 && filtered[i] === filtered[i + 1]) {
            merged.push(filtered[i] * 2);
            G.score += filtered[i] * 2;
            sfxMerge();
            i++; // 跳过下一个
        } else {
            merged.push(filtered[i]);
        }
    }
    
    // 补齐空格
    while (merged.length < GRID_SIZE) {
        merged.push(0);
    }
    
    return merged;
}

function checkGameState() {
    // 检查是否达到2048
    for (var r = 0; r < GRID_SIZE; r++) {
        for (var c = 0; c < GRID_SIZE; c++) {
            if (G.grid[r][c] === 2048 && G.canContinue) {
                G.won = true;
                G.state = 'win';
                sfxWin();
                if (G.score > G.bestScore) G.bestScore = G.score;
                showInterstitial();
                return;
            }
        }
    }
    
    // 检查是否还能移动
    if (!canMove()) {
        G.gameOver = true;
        G.state = 'gameOver';
        if (G.score > G.bestScore) G.bestScore = G.score;
        showInterstitial();
    }
}

function canMove() {
    // 检查是否有空格
    for (var r = 0; r < GRID_SIZE; r++) {
        for (var c = 0; c < GRID_SIZE; c++) {
            if (G.grid[r][c] === 0) return true;
        }
    }
    
    // 检查是否有相邻相同数字
    for (var r = 0; r < GRID_SIZE; r++) {
        for (var c = 0; c < GRID_SIZE; c++) {
            var val = G.grid[r][c];
            if (r < GRID_SIZE - 1 && G.grid[r + 1][c] === val) return true;
            if (c < GRID_SIZE - 1 && G.grid[r][c + 1] === val) return true;
        }
    }
    
    return false;
}

// ============================================================
// 广告系统
// ============================================================
function toggleSponsor() {
    var panel = document.getElementById('sponsorPanel');
    panel.style.display = panel.style.display === 'flex' ? 'none' : 'flex';
    panel.style.pointerEvents = panel.style.display === 'flex' ? 'auto' : 'none';
}

function showInterstitial() {
    var ad = document.getElementById('interstitialAd');
    ad.style.display = 'flex';
    ad.style.pointerEvents = 'auto';
}

function closeInterstitial() {
    var ad = document.getElementById('interstitialAd');
    ad.style.display = 'none';
    ad.style.pointerEvents = 'none';
}

// ============================================================
// 渲染
// ============================================================
function draw() {
    ctx.fillStyle = COL.bg;
    ctx.fillRect(0, 0, W, H);
    
    if (G.state === 'menu') {
        drawMenu();
    } else if (G.state === 'gameOver') {
        drawGameOver();
    } else if (G.state === 'win') {
        drawWin();
    } else {
        drawGame();
    }
}

function drawMenu() {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 48px Microsoft YaHei';
    ctx.textAlign = 'center';
    ctx.fillText('2048变体', W/2, H/2 - 140);
    
    ctx.font = '18px Microsoft YaHei';
    ctx.fillStyle = '#aaa';
    ctx.fillText('选择游戏模式', W/2, H/2 - 100);
    
    // 模式选择
    for (var i = 0; i < MODES.length; i++) {
        var btnY = H/2 - 80 + i * 40;
        ctx.fillStyle = i === G.mode ? '#3498db' : '#34495e';
        ctx.fillRect(W/2 - 100, btnY, 200, 35);
        ctx.fillStyle = '#fff';
        ctx.font = '16px Microsoft YaHei';
        ctx.fillText(MODES[i].name, W/2, btnY + 22);
    }
    
    // 开始按钮
    ctx.fillStyle = '#2ecc71';
    ctx.fillRect(W/2 - 80, H/2 + 80, 160, 40);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px Microsoft YaHei';
    ctx.fillText('开始游戏', W/2, H/2 + 105);
    
    // 最高分
    if (G.bestScore > 0) {
        ctx.fillStyle = COL.score;
        ctx.font = '18px Microsoft YaHei';
        ctx.fillText('最高分: ' + G.bestScore, W/2, H/2 + 140);
    }
}

function drawGameOver() {
    drawGame();
    
    // 半透明遮罩
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 48px Microsoft YaHei';
    ctx.textAlign = 'center';
    ctx.fillText('游戏结束', W/2, H/2 - 40);
    
    ctx.font = '24px Microsoft YaHei';
    ctx.fillStyle = COL.score;
    ctx.fillText('得分: ' + G.score, W/2, H/2);
    
    ctx.fillStyle = '#3498db';
    ctx.fillRect(W/2 - 80, H/2 + 50, 160, 40);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px Microsoft YaHei';
    ctx.fillText('重新开始', W/2, H/2 + 75);
}

function drawWin() {
    drawGame();
    
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    
    ctx.fillStyle = '#f1c40f';
    ctx.font = 'bold 48px Microsoft YaHei';
    ctx.textAlign = 'center';
    ctx.fillText('恭喜达成2048!', W/2, H/2 - 40);
    
    ctx.font = '24px Microsoft YaHei';
    ctx.fillStyle = COL.score;
    ctx.fillText('得分: ' + G.score, W/2, H/2);
    
    ctx.fillStyle = '#3498db';
    ctx.fillRect(W/2 - 80, H/2 + 50, 160, 40);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px Microsoft YaHei';
    ctx.fillText('继续挑战', W/2, H/2 + 75);
}

function drawGame() {
    var gridX = (W - GRID_SIZE * TILE_SIZE) / 2;
    var gridY = 100;
    
    // 绘制网格背景
    ctx.fillStyle = COL.gridBg;
    ctx.fillRect(gridX - 10, gridY - 10, GRID_SIZE * TILE_SIZE + 20, GRID_SIZE * TILE_SIZE + 20);
    
    // 绘制方块
    for (var r = 0; r < GRID_SIZE; r++) {
        for (var c = 0; c < GRID_SIZE; c++) {
            var val = G.grid[r][c];
            var x = gridX + c * TILE_SIZE;
            var y = gridY + r * TILE_SIZE;
            
            // 方块背景
            var color = TILE_COLORS[val] || TILE_COLORS[8192];
            ctx.fillStyle = color;
            ctx.fillRect(x + 5, y + 5, TILE_SIZE - 10, TILE_SIZE - 10);
            
            // 方块边框
            ctx.strokeStyle = 'rgba(0,0,0,0.1)';
            ctx.lineWidth = 2;
            ctx.strokeRect(x + 5, y + 5, TILE_SIZE - 10, TILE_SIZE - 10);
            
            // 数字
            if (val !== 0) {
                var textColor = TEXT_COLORS[val] || TEXT_COLORS.default;
                ctx.fillStyle = textColor;
                ctx.font = 'bold ' + (TILE_SIZE * 0.4) + 'px Microsoft YaHei';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(val, x + TILE_SIZE/2, y + TILE_SIZE/2);
            }
        }
    }
    
    // 绘制UI
    ctx.fillStyle = COL.text;
    ctx.font = 'bold 24px Microsoft YaHei';

<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>

<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
