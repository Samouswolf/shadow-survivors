<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>记忆翻牌</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; color: #fff; overflow: hidden; }
        
        .game-container { width: 100%; flex: 1; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: #fff; }
        .stats { display: flex; gap: 20px; font-size: 14px; }
        
        .main-area { flex: 1; display: flex; align-items: center; justify-content: center; }
        
        .game-grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 10px; padding: 20px; }
        
        .card { width: 70px; height: 70px; background: #4ecdc4; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 32px; cursor: pointer; transition: all 0.3s; position: relative; }
        .card.flipped { background: rgba(255,255,255,0.1); }
        .card.matched { background: #ffd700; animation: pulse 0.5s; }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        .card-back { position: absolute; width: 100%; height: 100%; background: #4ecdc4; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .card.flipped .card-back { display: none; }
        
        .actions { display: flex; gap: 10px; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; }
        
        .action-btn { flex: 1; padding: 15px; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; background: rgba(255,255,255,0.2); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="title">🃏 记忆翻牌</div>
            <div class="stats">
                <span>🎯 步数: <span id="steps">0</span></span>
                <span>⏱️ 时间: <span id="time">0</span></span>
            </div>
        </div>
        
        <div class="main-area">
            <div class="game-grid" id="gameGrid"></div>
        </div>
        
        <div class="actions">
            <button class="action-btn" onclick="newGame()">🎮 新游戏</button>
        </div>
    </div>
    
    <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <script>
        const GAME_NAME = '记忆翻牌';
        GameCore.init({ highScore: GAME_NAME });
        
        const symbols = ['🎮', '🎨', '🎵', '🎯', '💎', '⭐', '🔥', '💡'];
        
        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let steps = 0;
        let time = 0;
        let timer = null;
        let isChecking = false;
        
        function initGame() {
            newGame();
        }
        
        function newGame() {
            stopTimer();
            cards = [];
            flippedCards = [];
            matchedPairs = 0;
            steps = 0;
            time = 0;
            isChecking = false;
            
            const pairs = [...symbols, ...symbols];
            
            for (let i = pairs.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pairs[i], pairs[j]] = [pairs[j], pairs[i]];
            }
            
            pairs.forEach((symbol, index) => {
                cards.push({
                    id: index,
                    symbol: symbol,
                    flipped: false,
                    matched: false
                });
            });
            
            renderGrid();
            startTimer();
        }
        
        function renderGrid() {
            const grid = document.getElementById('gameGrid');
            grid.innerHTML = '';
            
            cards.forEach(card => {
                const cardElement = document.createElement('div');
                cardElement.className = `card ${card.flipped ? 'flipped' : ''} ${card.matched ? 'matched' : ''}`;
                cardElement.textContent = card.flipped || card.matched ? card.symbol : '';
                cardElement.dataset.id = card.id;
                
                if (!card.flipped && !card.matched) {
                    const back = document.createElement('div');
                    back.className = 'card-back';
                    back.textContent = '❓';
                    cardElement.appendChild(back);
                }
                
                cardElement.addEventListener('click', () => flipCard(card.id));
                
                grid.appendChild(cardElement);
            });
            
            updateUI();
        }
        
        function flipCard(id) {
            if (isChecking) return;
            
            const card = cards.find(c => c.id === id);
            
            if (card.flipped || card.matched) return;
            
            card.flipped = true;
            flippedCards.push(card);
            
            renderGrid();
            
            if (flippedCards.length === 2) {
                isChecking = true;
                steps++;
                updateUI();
                
                setTimeout(checkMatch, 500);
            }
        }
        
        function checkMatch() {
            const [card1, card2] = flippedCards;
            
            if (card1.symbol === card2.symbol) {
                card1.matched = true;
                card2.matched = true;
                matchedPairs++;
                
                GameCore.hints.show('🎉 配对成功！');
                
                if (matchedPairs === symbols.length) {
                    stopTimer();
                    GameCore.hints.show(`🎉 恭喜完成！步数: ${steps}，时间: ${time}秒`);
                    GameCore.highScore.set(GAME_NAME, steps);
                }
            } else {
                card1.flipped = false;
                card2.flipped = false;
                GameCore.hints.show('😔 配对失败');
            }
            
            flippedCards = [];
            isChecking = false;
            renderGrid();
        }
        
        function startTimer() {
            timer = setInterval(() => {
                time++;
                updateUI();
            }, 1000);
        }
        
        function stopTimer() {
            if (timer) {
                clearInterval(timer);
                timer = null;
            }
        }
        
        function updateUI() {
            document.getElementById('steps').textContent = steps;
            document.getElementById('time').textContent = time;
        }
        
        initGame();
        GameCore.touch.enableAllButtons();
    </script>
</body>
</html>
