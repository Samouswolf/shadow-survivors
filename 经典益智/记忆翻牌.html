<body>
<canvas id="gc"></canvas>
<script>
(function(){
'use strict';

// ==================== Canvas Setup ====================
const c = document.getElementById('gc'), ctx = c.getContext('2d');
let W, H, T;

function resize() {
    const m = Math.min(window.innerWidth, window.innerHeight);
    W = Math.floor(m * 0.95); H = Math.floor(m * 0.95);
    c.width = W; c.height = H;
    T = Math.floor(W / 6);
}
resize();
window.addEventListener('resize', resize);

// ==================== Constants ====================
const SCREEN = { MENU:0, PLAYING:1, GAMEOVER:2, PAUSED:3 };
const DIFFICULTIES = [
    { name:'简单', cols:4, rows:3, pairs:6, time:120, label:'4x3' },
    { name:'普通', cols:4, rows:4, pairs:8, time:150, label:'4x4' },
    { name:'困难', cols:6, rows:5, pairs:15, time:180, label:'6x5' },
    { name:'大师', cols:6, rows:6, pairs:18, time:210, label:'6x6' }
];
const CARD_SYMBOLS = [
    { emoji:'🍎', color:'#e74c3c' },
    { emoji:'🍊', color:'#f39c12' },
    { emoji:'🍋', color:'#f1c40f' },
    { emoji:'🍇', color:'#8e44ad' },
    { emoji:'🍓', color:'#e74c3c' },
    { emoji:'🍒', color:'#c0392b' },
    { emoji:'🍑', color:'#e67e22' },
    { emoji:'🥝', color:'#27ae60' },
    { emoji:'🌻', color:'#f1c40f' },
    { emoji:'⭐', color:'#f39c12' },
    { emoji:'🌙', color:'#f1c40f' },
    { emoji:'☀️', color:'#f39c12' },
    { emoji:'❄️', color:'#3498db' },
    { emoji:'🔥', color:'#e74c3c' },
    { emoji:'💎', color:'#3498db' },
    { emoji:'🎵', color:'#9b59b6' },
    { emoji:'🦋', color:'#8e44ad' },
    { emoji:'🌈', color:'#e74c3c' }
];
const CARD_BACK_COLOR = '#2c3e50';
const CARD_BACK_PATTERN = '#34495e';

// ==================== Audio System ====================
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(freq, dur, type, vol) {
    if (!audioCtx) return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type || 'sine';
        osc.frequency.value = freq;
        gain.gain.value = vol || 0.15;
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
    } catch(e) {}
}
function sfxFlip() { playSound(800, 0.1, 'sine', 0.12); playSound(1200, 0.08, 'sine', 0.08); }
function sfxMatch() { playSound(523, 0.15, 'sine', 0.15); setTimeout(()=>playSound(659, 0.15, 'sine', 0.15), 100); setTimeout(()=>playSound(784, 0.2, 'sine', 0.15), 200); }
function sfxNoMatch() { playSound(300, 0.15, 'sawtooth', 0.1); setTimeout(()=>playSound(250, 0.2, 'sawtooth', 0.1), 100); }
function sfxWin() { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>playSound(f, 0.3, 'sine', 0.12), i*150)); }
function sfxLose() { [400,350,300,250].forEach((f,i)=>setTimeout(()=>playSound(f, 0.3, 'sawtooth', 0.1), i*200)); }
function sfxClick() { playSound(600, 0.05, 'sine', 0.1); }

// ==================== Game State ====================
let screen = SCREEN.MENU;
let selectedDiff = 1;
let board = [];
let cards = [];
let flippedCards = [];
let matchedPairs = 0;
let totalPairs = 0;
let moves = 0;
let combo = 0;
let maxCombo = 0;
let score = 0;
let timeLeft = 0;
let gameStartTime = 0;
let pausedTime = 0;
let isChecking = false;
let bestScores = [];
let particles = [];
let menuAnim = 0;
let cursorIdx = -1; // keyboard cursor
let cardWidth = 0, cardHeight = 0, boardX = 0, boardY = 0;
let cols = 4, rows = 4;

// ==================== High Scores ====================
function loadBest() {
    try { bestScores = JSON.parse(localStorage.getItem('memflip_best') || '[]'); } catch(e) { bestScores = []; }
}
function saveBest() {
    try { localStorage.setItem('memflip_best', JSON.stringify(bestScores)); } catch(e) {}
}
loadBest();

function recordScore(diff, sc, mv, combo) {
    const entry = { diff:diff, score:sc, moves:mv, combo:combo, date:Date.now() };
    bestScores.push(entry);
    bestScores.sort((a,b) => b.score - a.score);
    bestScores = bestScores.slice(0, 10);
    saveBest();
}

// ==================== Particle System ====================
function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 3;
        particles.push({
            x:x, y:y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1.0,
            decay: 0.015 + Math.random() * 0.02,
            color: color,
            size: 2 + Math.random() * 4
        });
    }
}
function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
    }
}
function drawParticles() {
    for (const p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

// ==================== Game Logic ====================
function initGame(diffIdx) {
    const d = DIFFICULTIES[diffIdx];
    cols = d.cols; rows = d.rows;
    totalPairs = d.pairs;
    timeLeft = d.time;
    matchedPairs = 0; moves = 0; combo = 0; maxCombo = 0; score = 0;
    flippedCards = []; isChecking = false; particles = [];
    cursorIdx = 0;

    // Calculate layout
    const padding = 10;
    const maxCardW = Math.floor((W - padding * (cols + 1)) / cols);
    const maxCardH = Math.floor((H - 100 - padding * (rows + 1)) / rows);
    cardWidth = Math.min(maxCardW, maxCardH, 120);
    cardHeight = Math.floor(cardWidth * 1.3);
    boardX = Math.floor((W - cols * (cardWidth + padding) + padding) / 2);
    boardY = Math.floor((H - rows * (cardHeight + padding) + padding) / 2) + 20;

    // Create pairs
    const symbols = CARD_SYMBOLS.slice(0, totalPairs);
    let pairIds = [];
    for (let i = 0; i < totalPairs; i++) { pairIds.push(i, i); }
    // Shuffle
    for (let i = pairIds.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pairIds[i], pairIds[j]] = [pairIds[j], pairIds[i]];
    }

    // Create cards
    cards = [];
    for (let r = 0; r < rows; r++) {
        for (let col = 0; col < cols; col++) {
            const idx = r * cols + col;
            cards.push({
                row: r, col: col,
                pairId: pairIds[idx],
                symbol: symbols[pairIds[idx]],
                flipped: false,
                matched: false,
                flipAnim: 0, // 0=face down, 1=face up
                flipDir: 0,  // 0=none, 1=opening, -1=closing
                matchAnim: 0,
                shakeAnim: 0
            });
        }
    }

    board = cards;
    screen = SCREEN.PLAYING;
    gameStartTime = performance.now();
    pausedTime = 0;
}

function getCardAt(row, col) {
    return board.find(c => c.row === row && c.col === col);
}

function getCardLayout(row, col) {
    const padding = 10;
    const x = boardX + col * (cardWidth + padding);
    const y = boardY + row * (cardHeight + padding);
    return { x, y, w: cardWidth, h: cardHeight };
}

function flipCard(card) {
    if (isChecking || card.flipped || card.matched) return;
    if (flippedCards.length >= 2) return;

    card.flipped = true;
    card.flipDir = 1;
    flippedCards.push(card);
    sfxFlip();

    if (flippedCards.length === 2) {
        moves++;
        isChecking = true;
        const c1 = flippedCards[0], c2 = flippedCards[1];

        if (c1.pairId === c2.pairId) {
            // Match!
            combo++;
            if (combo > maxCombo) maxCombo = combo;
            matchedPairs++;
            const bonus = combo * 50;
            score += 100 + bonus;

            setTimeout(() => {
                c1.matched = true; c2.matched = true;
                c1.matchAnim = 1; c2.matchAnim = 1;
                const lay1 = getCardLayout(c1.row, c1.col);
                const lay2 = getCardLayout(c2.row, c2.col);
                spawnParticles(lay1.x + cardWidth/2, lay1.y + cardHeight/2, c1.symbol.color, 12);
                spawnParticles(lay2.x + cardWidth/2, lay2.y + cardHeight/2, c2.symbol.color, 12);
                sfxMatch();

                flippedCards = [];
                isChecking = false;

                if (matchedPairs >= totalPairs) {
                    setTimeout(() => {
                        // Time bonus
                        const timeBonus = Math.floor(timeLeft * 5);
                        score += timeBonus;
                        sfxWin();
                        recordScore(selectedDiff, score, moves, maxCombo);
                        screen = SCREEN.GAMEOVER;
                    }, 500);
                }
            }, 400);
        } else {
            // No match
            combo = 0;
            setTimeout(() => {
                c1.shakeAnim = 1; c2.shakeAnim = 1;
                sfxNoMatch();
                setTimeout(() => {
                    c1.flipped = false; c2.flipped = false;
                    c1.flipDir = -1; c2.flipDir = -1;
                    c1.shakeAnim = 0; c2.shakeAnim = 0;
                    flippedCards = [];
                    isChecking = false;
                }, 300);
            }, 600);
        }
    }
}

// ==================== Input Handling ====================
function getClickedCard(mx, my) {
    for (const card of board) {
        const lay = getCardLayout(card.row, card.col);
        if (mx >= lay.x && mx <= lay.x + lay.w && my >= lay.y && my <= lay.y + lay.h) {
            return card;
        }
    }
    return null;
}

function handleClick(mx, my) {
    initAudio();

    if (screen === SCREEN.MENU) {
        // Check difficulty buttons
        const btnW = 200, btnH = 50, startY = H * 0.35;
        for (let i = 0; i < DIFFICULTIES.length; i++) {
            const x = W/2 - btnW/2, y = startY + i * 65;
            if (mx >= x && mx <= x + btnW && my >= y && my <= y + btnH) {
                selectedDiff = i;
                sfxClick();
                initGame(i);
                return;
            }
        }
        // Best scores button
        const bY = startY + DIFFICULTIES.length * 65 + 20;
        if (mx >= W/2 - btnW/2 && mx <= W/2 + btnW/2 && my >= bY && my <= bY + 45) {
            // Toggle best scores display
            sfxClick();
            return;
        }
        return;
    }

    if (screen === SCREEN.PLAYING) {
        const card = getClickedCard(mx, my);
        if (card) {
            flipCard(card);
        }
        return;
    }

    if (screen === SCREEN.GAMEOVER) {
        // Restart button area
        const btnW = 180, btnH = 50;
        const btnX = W/2 - btnW/2, btnY = H * 0.72;
        if (mx >= btnX && mx <= btnX + btnW && my >= btnY && my <= btnY + btnH) {
            sfxClick();
            screen = SCREEN.MENU;
            return;
        }
        // Retry button
        const rX = W/2 - btnW/2, rY = H * 0.72 + 60;
        if (mx >= rX && mx <= rX + btnW && my >= rY && my <= rY + btnH) {
            sfxClick();
            initGame(selectedDiff);
            return;
        }
        return;
    }

    if (screen === SCREEN.PAUSED) {
        // Resume
        const btnW = 180, btnH = 50;
        const rX = W/2 - btnW/2, rY = H * 0.45;
        if (mx >= rX && mx <= rX + btnW && my >= rY && my <= rY + btnH) {
            sfxClick();
            screen = SCREEN.PLAYING;
            const pauseDur = performance.now() - pausedTime;
            gameStartTime += pauseDur;
            return;
        }
        // Back to menu
        const mX = W/2 - btnW/2, mY = H * 0.45 + 65;
        if (mx >= mX && mx <= mX + btnW && my >= mY && my <= mY + btnH) {
            sfxClick();
            screen = SCREEN.MENU;
            return;
        }
    }
}

// Mouse
c.addEventListener('click', (e) => {
    const rect = c.getBoundingClientRect();
    const scaleX = W / rect.width, scaleY = H / rect.height;
    handleClick((e.clientX - rect.left) * scaleX, (e.clientY - rect.top) * scaleY);
});

// Touch
c.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const touch = e.touches[0];
    const rect = c.getBoundingClientRect();
    const scaleX = W / rect.width, scaleY = H / rect.height;
    handleClick((touch.clientX - rect.left) * scaleX, (touch.clientY - rect.top) * scaleY);
}, { passive: false });

// Keyboard
document.addEventListener('keydown', (e) => {
    initAudio();

    if (screen === SCREEN.MENU) {
        if (e.key === 'ArrowUp') {
            selectedDiff = (selectedDiff - 1 + DIFFICULTIES.length) % DIFFICULTIES.length;
            sfxClick();
        } else if (e.key === 'ArrowDown') {
            selectedDiff = (selectedDiff + 1) % DIFFICULTIES.length;
            sfxClick();
        } else if (e.key === 'Enter' || e.key === ' ') {
            sfxClick();
            initGame(selectedDiff);
        }
        return;
    }

    if (screen === SCREEN.PLAYING) {
        if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
            screen = SCREEN.PAUSED;
            pausedTime = performance.now();
            return;
        }
        if (e.key === 'ArrowUp') {
            cursorIdx = (cursorIdx - cols + board.length) % board.length;
            sfxClick();
        } else if (e.key === 'ArrowDown') {
            cursorIdx = (cursorIdx + cols) % board.length;
            sfxClick();
        } else if (e.key === 'ArrowLeft') {
            cursorIdx = (cursorIdx - 1 + board.length) % board.length;
            sfxClick();
        } else if (e.key === 'ArrowRight') {
            cursorIdx = (cursorIdx + 1) % board.length;
            sfxClick();
        } else if (e.key === 'Enter' || e.key === ' ') {
            if (cursorIdx >= 0 && cursorIdx < board.length) {
                flipCard(board[cursorIdx]);
            }
        }
        return;
    }

    if (screen === SCREEN.PAUSED) {
        if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
            screen = SCREEN.PLAYING;
            const pauseDur = performance.now() - pausedTime;
            gameStartTime += pauseDur;
        } else if (e.key === 'r' || e.key === 'R') {
            screen = SCREEN.MENU;
        }
        return;
    }

    if (screen === SCREEN.GAMEOVER) {
        if (e.key === 'Enter' || e.key === ' ') {
            screen = SCREEN.MENU;
        } else if (e.key === 'r' || e.key === 'R') {
            initGame(selectedDiff);
        }
    }
});

// ==================== Drawing ====================
function drawRoundRect(x, y, w, h, r, fill, stroke) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); }
}

function drawCardBack(x, y, w, h) {
    drawRoundRect(x, y, w, h, 8, CARD_BACK_COLOR, '#4a6fa5');
    // Pattern
    ctx.strokeStyle = CARD_BACK_PATTERN;
    ctx.lineWidth = 1;
    const step = 12;
    for (let i = -h; i < w + h; i += step) {
        ctx.beginPath();
        ctx.moveTo(x + i, y);
        ctx.lineTo(x + i + h, y + h);
        ctx.stroke();
    }
    // Center symbol
    ctx.fillStyle = '#4a6fa5';
    ctx.font = `${Math.floor(w * 0.35)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('?', x + w/2, y + h/2);
}

function drawCardFace(x, y, w, h, card) {
    const color = card.symbol.color;
    drawRoundRect(x, y, w, h, 8, '#1a1a2e', color);
    // Emoji
    ctx.font = `${Math.floor(w * 0.5)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(card.symbol.emoji, x + w/2, y + h/2);
}

function drawCard(card) {
    const lay = getCardLayout(card.row, card.col);
    let { x, y, w, h } = lay;

    // Flip animation
    let flipProgress = card.flipAnim;
    if (card.flipDir === 1) {
        flipProgress = Math.min(1, flipProgress + 0.08);
        card.flipAnim = flipProgress;
    } else if (card.flipDir === -1) {
        flipProgress = Math.max(0, flipProgress - 0.08);
        card.flipAnim = flipProgress;
        if (flipProgress <= 0) card.flipDir = 0;
    }

    // Shake animation
    let shakeX = 0;
    if (card.shakeAnim > 0) {
        shakeX = Math.sin(card.shakeAnim * 20) * 4 * card.shakeAnim;
        card.shakeAnim = Math.max(0, card.shakeAnim - 0.04);
    }

    // Match glow
    if (card.matchAnim > 0) {
        card.matchAnim = Math.max(0, card.matchAnim - 0.02);
        ctx.shadowColor = card.symbol.color;
        ctx.shadowBlur = 20 * card.matchAnim;
    }

    ctx.save();
    ctx.translate(x + w/2 + shakeX, y + h/2);

    // Scale X for flip effect
    const scaleX = Math.abs(Math.cos(flipProgress * Math.PI));
    ctx.scale(scaleX || 0.01, 1);

    if (flipProgress > 0.5) {
        // Face up
        drawCardFace(-w/2, -h/2, w, h, card);
    } else {
        // Face down
        drawCardBack(-w/2, -h/2, w, h);
    }

    ctx.restore();
    ctx.shadowBlur = 0;

    // Keyboard cursor
    const idx = board.indexOf(card);
    if (idx === cursorIdx && screen === SCREEN.PLAYING) {
        ctx.strokeStyle = '#00ff88';
        ctx.lineWidth = 3;
        ctx.setLineDash([5, 3]);
        drawRoundRect(x - 2, y - 2, w + 4, h + 4, 10, null, '#00ff88');
        ctx.setLineDash([]);
    }
}

function drawMenu() {
    menuAnim += 0.02;

    // Background gradient
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0a0e1a');
    grad.addColorStop(1, '#1a1040');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Floating symbols background
    ctx.globalAlpha = 0.08;
    for (let i = 0; i < 20; i++) {
        const x = (Math.sin(menuAnim + i * 0.7) * 0.5 + 0.5) * W;
        const y = (Math.cos(menuAnim * 0.8 + i * 0.5) * 0.5 + 0.5) * H;
        ctx.font = '30px sans-serif';
        ctx.fillStyle = '#fff';
        ctx.fillText(CARD_SYMBOLS[i % CARD_SYMBOLS.length].emoji, x, y);
    }
    ctx.globalAlpha = 1;

    // Title
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.floor(W * 0.1)}px 'Microsoft YaHei', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('记忆翻牌', W/2, H * 0.15);

    ctx.fillStyle = '#8888aa';
    ctx.font = `${Math.floor(W * 0.04)}px sans-serif`;
    ctx.fillText('翻转配对 · 记忆挑战', W/2, H * 0.23);

    // Difficulty buttons
    const btnW = 200, btnH = 50, startY = H * 0.35;
    for (let i = 0; i < DIFFICULTIES.length; i++) {
        const d = DIFFICULTIES[i];
        const x = W/2 - btnW/2, y = startY + i * 65;
        const selected = i === selectedDiff;

        drawRoundRect(x, y, btnW, btnH, 10,
            selected ? '#3a5fa0' : '#1a2040',
            selected ? '#6a9fff' : '#3a4a6a'
        );

        ctx.fillStyle = selected ? '#fff' : '#aaa';
        ctx.font = `${Math.floor(W * 0.045)}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`${d.name} (${d.label})`, W/2, y + btnH/2);
    }

    // Best score
    const bestY = startY + DIFFICULTIES.length * 65 + 20;
    if (bestScores.length > 0) {
        const best = bestScores[0];
        ctx.fillStyle = '#f1c40f';
        ctx.font = `${Math.floor(W * 0.035)}px sans-serif`;
        ctx.fillText(`最高分: ${best.score} (${DIFFICULTIES[best.diff].name})`, W/2, bestY + 22);
    }

    // Controls hint
    ctx.fillStyle = '#555';
    ctx.font = `${Math.floor(W * 0.03)}px sans-serif`;
    ctx.fillText('方向键选择 · 回车确认 · P暂停', W/2, H * 0.92);
}

function drawPlaying() {
    // Background
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0d1117');
    grad.addColorStop(1, '#161b22');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Info bar
    const d = DIFFICULTIES[selectedDiff];
    ctx.fillStyle = '#888';
    ctx.font = `${Math.floor(W * 0.035)}px sans-serif`;
    ctx.textAlign = 'left';
    ctx.fillText(`${d.name}  配对: ${matchedPairs}/${totalPairs}`, 12, 25);
    ctx.textAlign = 'center';
    ctx.fillText(`步数: ${moves}`, W/2, 25);

    // Timer
    const elapsed = (performance.now() - gameStartTime - pausedTime) / 1000;
    timeLeft = Math.max(0, DIFFICULTIES[selectedDiff].time - elapsed);
    const mins = Math.floor(timeLeft / 60);
    const secs = Math.floor(timeLeft % 60);
    ctx.textAlign = 'right';
    ctx.fillStyle = timeLeft < 30 ? '#e74c3c' : '#888';
    ctx.fillText(`${mins}:${secs < 10 ? '0' : ''}${secs}`, W - 12, 25);

    // Combo display
    if (combo > 1) {
        ctx.fillStyle = '#f1c40f';
        ctx.font = `bold ${Math.floor(W * 0.05)}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText(`COMBO x${combo}!`, W/2, 55);
    }

    // Score
    ctx.fillStyle = '#6a9fff';
    ctx.font = `${Math.floor(W * 0.035)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(`分数: ${score}`, W/2, H - 15);

    // Draw cards
    for (const card of board) {
        drawCard(card);
    }

    // Particles
    drawParticles();

    // Time's up
    if (timeLeft <= 0 && screen === SCREEN.PLAYING) {
        sfxLose();
        recordScore(selectedDiff, score, moves, maxCombo);
        screen = SCREEN.GAMEOVER;
    }
}

function drawGameOver() {
    // Background overlay
    ctx.fillStyle = 'rgba(0,0,0,0.85)';
    ctx.fillRect(0, 0, W, H);

    const won = matchedPairs >= totalPairs;

    // Title
    ctx.fillStyle = won ? '#2ecc71' : '#e74c3c';
    ctx.font = `bold ${Math.floor(W * 0.08)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(won ? '恭喜通关!' : '时间到!', W/2, H * 0.2);

    // Stats
    const d = DIFFICULTIES[selectedDiff];
    ctx.fillStyle = '#ccc';
    ctx.font = `${Math.floor(W * 0.04)}px sans-serif`;
    const stats = [
        `难度: ${d.name}`,
        `分数: ${score}`,
        `步数: ${moves}`,
        `最大连击: ${maxCombo}`,
        `配对: ${matchedPairs}/${totalPairs}`
    ];
    stats.forEach((s, i) => {
        ctx.fillText(s, W/2, H * 0.32 + i * 35);
    });

    // Best score highlight
    if (bestScores.length > 0 && bestScores[0].score === score) {
        ctx.fillStyle = '#f1c40f';
        ctx.font = `bold ${Math.floor(W * 0.045)}px sans-serif`;
        ctx.fillText('新纪录!', W/2, H * 0.62);
    }

    // Buttons
    const btnW = 180, btnH = 50;
    drawRoundRect(W/2 - btnW/2, H * 0.72, btnW, btnH, 10, '#2c3e50', '#4a6fa5');
    ctx.fillStyle = '#fff';
    ctx.font = `${Math.floor(W * 0.04)}px sans-serif`;
    ctx.fillText('返回菜单', W/2, H * 0.72 + btnH/2);

    drawRoundRect(W/2 - btnW/2, H * 0.72 + 60, btnW, btnH, 10, '#3a5fa0', '#6a9fff');
    ctx.fillText('再来一局', W/2, H * 0.72 + 60 + btnH/2);
}

function drawPaused() {
    // Dim background
    ctx.fillStyle = 'rgba(0,0,0,0.8)';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.floor(W * 0.08)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('游戏暂停', W/2, H * 0.3);

    const btnW = 180, btnH = 50;
    drawRoundRect(W/2 - btnW/2, H * 0.45, btnW, btnH, 10, '#27ae60', '#2ecc71');
    ctx.fillStyle = '#fff';
    ctx.font = `${Math.floor(W * 0.04)}px sans-serif`;
    ctx.fillText('继续游戏', W/2, H * 0.45 + btnH/2);

    drawRoundRect(W/2 - btnW/2, H * 0.45 + 65, btnW, btnH, 10, '#7f8c8d', '#95a5a6');
    ctx.fillText('返回菜单', W/2, H * 0.45 + 65 + btnH/2);

    ctx.fillStyle = '#666';
    ctx.font = `${Math.floor(W * 0.03)}px sans-serif`;
    ctx.fillText('P/ESC 继续 · R 返回菜单', W/2, H * 0.75);
}

// ==================== Game Loop ====================
function gameLoop() {
    ctx.clearRect(0, 0, W, H);

    switch (screen) {
        case SCREEN.MENU: drawMenu(); break;
        case SCREEN.PLAYING: drawPlaying(); break;
        case SCREEN.GAMEOVER: drawGameOver(); break;
        case SCREEN.PAUSED: drawPlaying(); drawPaused(); break;
    }

    updateParticles();
    requestAnimationFrame(gameLoop);
}

gameLoop();

})();


// ===== 游戏工坊统一广告系统 =====
const GameMonetize = {
	adsterra: { enabled: !/localhost|127\.0\.0\.1/.test(location.hostname) },
	sponsor: { enabled: true, wechatQR: '', alipayQR: '' },
	interstitial: { enabled: true, cooldownMs: 180000, gameCount: 2 },
	_lastInterTime: 0, _deathCount: 0,
	_gameOverDetected: false,
	init() {
		const banner = document.getElementById('adBanner');
		if (banner && this.adsterra.enabled) {
			const s1 = document.createElement('script');
			s1.src = 'https://pl29544740.effectivecpmnetwork.com/de/26/0e/de260e17b6a348e3489772a87b1cedf1.js';
			s1.async = true;
			banner.appendChild(s1);
		}
		const spBtn = document.getElementById('sponsorBtn');
		const spPanel = document.getElementById('sponsorPanel');
		const spClose = document.getElementById('sponsorClose');
		if (spBtn && spPanel && spClose && this.sponsor.enabled) {
			spBtn.onclick = () => { spPanel.style.display = 'flex'; spPanel.style.pointerEvents = 'auto'; };
			spClose.onclick = () => { spPanel.style.display = 'none'; spPanel.style.pointerEvents = 'none'; };
			spPanel.onclick = (e) => { if (e.target === spPanel) { spPanel.style.display = 'none'; spPanel.style.pointerEvents = 'none'; } };
		} else if (spBtn) { spBtn.style.display = 'none'; }
		const skipBtn = document.getElementById('skipInterstitial');
		const interstitial = document.getElementById('interstitialAd');
		if (skipBtn && interstitial) {
			skipBtn.onclick = () => {
				interstitial.style.display = 'none'; interstitial.style.pointerEvents = 'none';
				if (this._reviveCallback) { const cb = this._reviveCallback; this._reviveCallback = null; cb(); }
			};
		}
		// 自动检测游戏结束状态
		this._startGameOverWatcher();
	},
	_startGameOverWatcher() {
		// 检测#restartBtn或包含"重新开始"/"再来一局"的按钮变为可见
		const checkGameOver = () => {
			if (this._gameOverDetected) return;
			// 方法1: 检测#restartBtn可见
			const restartBtn = document.getElementById('restartBtn');
			if (restartBtn && restartBtn.offsetParent !== null && getComputedStyle(restartBtn).display !== 'none') {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
			// 方法2: 检测#gameOverScreen可见
			const goScreen = document.getElementById('gameOverScreen');
			if (goScreen && getComputedStyle(goScreen).display !== 'none') {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
			// 方法3: 检测screen-gameover可见
			const goScreen2 = document.getElementById('screen-gameover');
			if (goScreen2 && !goScreen2.classList.contains('hidden')) {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
		};
		// 每500ms检查一次
		this._goInterval = setInterval(() => {
			checkGameOver();
			// 如果检测到了，等2秒后重置标志，允许下次检测
			if (this._gameOverDetected) {
				setTimeout(() => { this._gameOverDetected = false; }, 2000);
			}
		}, 500);
	},
	requestRevive(callback) {
		this._reviveCallback = callback || null;
		const el = document.getElementById('interstitialAd');
		if (!el) { if (callback) callback(); return; }
		const s2 = document.createElement('script');
		s2.src = 'https://pl29544742.effectivecpmnetwork.com/be/a9/6d/bea96d779c0ee07c2b15613852dd3e70.js';
		s2.async = true;
		document.getElementById('interstitialAdSlot').innerHTML = '';
		document.getElementById('interstitialAdSlot').appendChild(s2);
		el.style.display = 'flex'; el.style.pointerEvents = 'auto';

		setTimeout(() => { const slot = document.getElementById('interstitialAdSlot'); if (slot && slot.innerHTML.includes('加载中')) { slot.innerHTML = '<div style=color:#aaa;font:13px Microsoft YaHei,sans-serif>广告暂时无法加载<br>点击下方按钮继续</div>'; } }, 3000);
		const skipBtn = document.getElementById('skipInterstitial');
		if (skipBtn) {
			skipBtn.textContent = '5 秒后可跳过'; skipBtn.disabled = true;
			let cd = 5;
			const timer = setInterval(() => {
				cd--;
				if (cd <= 0) { clearInterval(timer); skipBtn.textContent = '跳过广告 ▶'; skipBtn.disabled = false; }
				else { skipBtn.textContent = cd + ' 秒后可跳过'; }
			}, 1000);
		}
	},
	onGameOver() {
		this._deathCount++;
		if (!this.interstitial.enabled) return;
		if (this._deathCount < this.interstitial.gameCount) return;
		if (Date.now() - this._lastInterTime < this.interstitial.cooldownMs) return;
		this._lastInterTime = Date.now(); this._deathCount = 0;
		this.requestRevive(null);
	},
};
GameMonetize.init();
</script>
