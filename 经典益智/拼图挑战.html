<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>拼图挑战</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1e3a8a 0%, #1e1b4b 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
#game-container { position: relative; width: 100%; max-width: 450px; padding: 20px; }
#game-header { text-align: center; color: #fff; margin-bottom: 20px; }
#game-header h1 { font-size: 28px; font-weight: bold; margin-bottom: 10px; }
#game-header .stats { display: flex; justify-content: center; gap: 30px; font-size: 16px; }
#game-header .stats span { color: #4ade80; font-weight: bold; }
#game-board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 20px; }
.piece { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: bold; background: rgba(255,255,255,0.2); border-radius: 10px; cursor: pointer; transition: all 0.2s; }
.piece.selected { background: #fbbf24; box-shadow: 0 0 20px #fbbf24; }
.piece.correct { background: #22c55e; }
#controls { display: flex; gap: 15px; justify-content: center; margin-bottom: 20px; }
.btn { padding: 12px 25px; font-size: 16px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; transition: all 0.2s; }
.btn-primary { background: linear-gradient(145deg, #6366f1, #4f46e5); color: #fff; }
.btn-primary:hover { transform: translateY(-2px); }
#difficulty-select { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
.diff-btn { padding: 8px 16px; font-size: 14px; border-radius: 20px; border: none; cursor: pointer; }
.diff-btn.active { background: #6366f1; color: #fff; }
.diff-btn:not(.active) { background: rgba(255,255,255,0.2); color: #fff; }
#message { text-align: center; font-size: 18px; font-weight: bold; color: #4ade80; min-height: 30px; }
#loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1e3a8a; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
#loading-screen .spinner { width: 50px; height: 50px; border: 4px solid rgba(99,102,241,0.3); border-top-color: #6366f1; border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.ad-banner-container { width: 100%; max-width: 728px; margin-top: auto; padding: 10px; }
.sponsor-btn { position: fixed; top: 20px; right: 20px; width: 50px; height: 50px; background: rgba(255,165,0,0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; z-index: 100; }
.sponsor-panel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 200; align-items: center; justify-content: center; }
.sponsor-panel.show { display: flex; }
.sponsor-content { background: #fff; padding: 30px; border-radius: 20px; text-align: center; }
.sponsor-close { position: absolute; top: 20px; right: 20px; width: 40px; height: 40px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; }
.interstitial-ad { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 300; align-items: center; justify-content: center; flex-direction: column; }
.interstitial-ad.show { display: flex; }
</style>
</head>
<body>
<div id="loading-screen">
  <div class="spinner"></div>
  <p style="color:#fff;margin-top:20px;">游戏加载中...</p>
</div>

<div class="sponsor-btn" onclick="showSponsor()">☕</div>
<div class="sponsor-panel" id="sponsor-panel" onclick="hideSponsor()">
  <div class="sponsor-content" onclick="event.stopPropagation()">
    <h3>支持开发者</h3>
    <p>感谢您的支持！</p>
  </div>
  <div class="sponsor-close" onclick="hideSponsor()">×</div>
</div>

<div class="interstitial-ad" id="interstitial-ad">
  <h2 style="color:#fff;margin-bottom:30px;">🎉 恭喜通关！</h2>
  <button class="btn btn-primary" onclick="hideInterstitial()">继续游戏</button>
</div>

<div id="game-container">
  <div id="game-header">
    <h1>拼图挑战</h1>
    <div class="stats">
      <span>步数: <span id="moves">0</span></span>
      <span>时间: <span id="time">00:00</span></span>
      <span>最佳: <span id="best">--</span></span>
    </div>
  </div>
  
  <div id="difficulty-select">
    <button class="diff-btn active" onclick="setDifficulty(3)">3×3</button>
    <button class="diff-btn" onclick="setDifficulty(4)">4×4</button>
    <button class="diff-btn" onclick="setDifficulty(5)">5×5</button>
  </div>
  
  <div id="message"></div>
  
  <div id="game-board"></div>
  
  <div id="controls">
    <button class="btn btn-primary" onclick="newGame()">新游戏</button>
    <button class="btn btn-primary" onclick="hint()">提示</button>
  </div>
</div>

<div class="ad-banner-container">
  <div style="background:#f0f0f0;height:90px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#666;">广告位</div>
</div>

<script>
class GameCore {
  static init(options) {
    if (options.loading) {
      setTimeout(() => {
        document.getElementById('loading-screen').style.display = 'none';
      }, 800);
    }
    if (options.highScore) {
      this.highScoreKey = options.highScore;
    }
  }
  
  static getHighScore() {
    return localStorage.getItem(this.highScoreKey) || '--';
  }
  
  static setHighScore(value) {
    const current = localStorage.getItem(this.highScoreKey);
    if (!current || value < parseInt(current)) {
      localStorage.setItem(this.highScoreKey, value);
      return true;
    }
    return false;
  }
}

GameCore.init({ loading: true, highScore: '拼图挑战' });

class PuzzleGame {
  constructor() {
    this.size = 3;
    this.pieces = [];
    this.moves = 0;
    this.time = 0;
    this.timer = null;
    this.selectedPiece = null;
    
    this.board = document.getElementById('game-board');
    this.movesDisplay = document.getElementById('moves');
    this.timeDisplay = document.getElementById('time');
    this.bestDisplay = document.getElementById('best');
    this.message = document.getElementById('message');
    
    this.init();
  }
  
  init() {
    this.bestDisplay.textContent = GameCore.getHighScore();
    this.newGame();
  }
  
  newGame() {
    this.stopTimer();
    this.moves = 0;
    this.time = 0;
    this.selectedPiece = null;
    this.movesDisplay.textContent = '0';
    this.timeDisplay.textContent = '00:00';
    
    this.pieces = Array.from({ length: this.size * this.size }, (_, i) => ({
      id: i,
      currentPos: i,
      correctPos: i
    }));
    
    this.shuffle();
    this.render();
    this.startTimer();
  }
  
  shuffle() {
    do {
      for (let i = this.pieces.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [this.pieces[i].currentPos, this.pieces[j].currentPos] = [this.pieces[j].currentPos, this.pieces[i].currentPos];
      }
    } while (!this.isSolvable() || this.isSolved());
  }
  
  isSolvable() {
    let inversions = 0;
    const positions = this.pieces.map(p => p.currentPos);
    
    for (let i = 0; i < positions.length - 1; i++) {
      for (let j = i + 1; j < positions.length; j++) {
        if (positions[i] > positions[j]) inversions++;
      }
    }
    
    return inversions % 2 === 0;
  }
  
  isSolved() {
    return this.pieces.every(p => p.currentPos === p.correctPos);
  }
  
  render() {
    this.board.innerHTML = '';
    this.board.style.gridTemplateColumns = `repeat(${this.size}, 1fr)`;
    
    const displayPieces = Array(this.size * this.size).fill(null);
    this.pieces.forEach(p => {
      displayPieces[p.currentPos] = p;
    });
    
    displayPieces.forEach((piece, index) => {
      const div = document.createElement('div');
      div.className = 'piece';
      
      if (piece) {
        div.textContent = piece.id + 1;
        
        if (piece.currentPos === piece.correctPos) {
          div.classList.add('correct');
        }
        
        if (this.selectedPiece === piece) {
          div.classList.add('selected');
        }
        
        div.onclick = () => this.selectPiece(piece);
      }
      
      this.board.appendChild(div);
    });
  }
  
  selectPiece(piece) {
    if (!this.selectedPiece) {
      this.selectedPiece = piece;
      this.render();
    } else {
      if (this.selectedPiece === piece) {
        this.selectedPiece = null;
        this.render();
      } else {
        const pos1 = this.selectedPiece.currentPos;
        const pos2 = piece.currentPos;
        
        const row1 = Math.floor(pos1 / this.size);
        const col1 = pos1 % this.size;
        const row2 = Math.floor(pos2 / this.size);
        const col2 = pos2 % this.size;
        
        if ((Math.abs(row1 - row2) === 1 && col1 === col2) || 
            (Math.abs(col1 - col2) === 1 && row1 === row2)) {
          [this.selectedPiece.currentPos, piece.currentPos] = [piece.currentPos, this.selectedPiece.currentPos];
          this.moves++;
          this.movesDisplay.textContent = this.moves;
          
          if (this.isSolved()) {
            this.win();
          }
        }
        
        this.selectedPiece = null;
        this.render();
      }
    }
  }
  
  win() {
    this.stopTimer();
    this.message.textContent = '🎉 恭喜通关！';
    this.message.style.color = '#4ade80';
    
    if (GameCore.setHighScore(this.moves)) {
      this.bestDisplay.textContent = this.moves;
      this.message.textContent += ' 新纪录！';
    }
    
    setTimeout(() => {
      document.getElementById('interstitial-ad').classList.add('show');
    }, 500);
  }
  
  startTimer() {
    this.timer = setInterval(() => {
      this.time++;
      const minutes = Math.floor(this.time / 60).toString().padStart(2, '0');
      const seconds = (this.time % 60).toString().padStart(2, '0');
      this.timeDisplay.textContent = `${minutes}:${seconds}`;
    }, 1000);
  }
  
  stopTimer() {
    if (this.timer) {
      clearInterval(this.timer);
      this.timer = null;
    }
  }
  
  hint() {
    this.message.textContent = '提示：点击相邻的方块进行交换';
    this.message.style.color = '#fbbf24';
    setTimeout(() => this.message.textContent = '', 2000);
  }
  
  setSize(size) {
    this.size = size;
    this.newGame();
  }
}

function setDifficulty(size) {
  document.querySelectorAll('.diff-btn').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');
  puzzle.setSize(size);
}

function showSponsor() {
  document.getElementById('sponsor-panel').classList.add('show');
}

function hideSponsor() {
  document.getElementById('sponsor-panel').classList.remove('show');
}

function hideInterstitial() {
  document.getElementById('interstitial-ad').classList.remove('show');
}

const puzzle = new PuzzleGame();
</script>
</body>
</html>
