<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>数字反应</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; color: #fff; }
        
        .game-container { width: 100%; flex: 1; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: #ffd700; }
        .score { font-size: 20px; color: #4ecdc4; }
        
        .game-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        
        .numbers-area { display: flex; gap: 30px; margin-bottom: 40px; }
        .number-box { width: 120px; height: 120px; border-radius: 20px; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 48px; font-weight: bold; }
        
        .controls-area { display: flex; gap: 20px; }
        .control-btn { width: 100px; height: 60px; border-radius: 15px; border: none; font-size: 24px; font-weight: bold; cursor: pointer; }
        .control-btn.smaller { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
        .control-btn.equal { background: linear-gradient(135deg, #ffa502, #ffd700); color: #fff; }
        .control-btn.larger { background: linear-gradient(135deg, #48c78e, #4ecdc4); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="title">🔢 数字反应</div>
            <div class="score">得分: <span id="score">0</span></div>
        </div>
        
        <div class="game-area">
            <div class="numbers-area">
                <div class="number-box" id="num1">0</div>
                <div class="number-box" id="num2">0</div>
            </div>
            
            <div class="controls-area">
                <button class="control-btn smaller" onclick="checkAnswer('smaller')">⬅️ 小</button>
                <button class="control-btn equal" onclick="checkAnswer('equal')">＝ 等</button>
                <button class="control-btn larger" onclick="checkAnswer('larger')">➡️ 大</button>
            </div>
        </div>
    </div>
    
    <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <script>
        const GAME_NAME = '数字反应';
        GameCore.init({ highScore: GAME_NAME });
        
        let score = 0;
        let num1 = 0;
        let num2 = 0;
        
        function initGame() {
            const highScore = GameCore.highScore.get(GAME_NAME);
            document.getElementById('score').textContent = highScore || '0';
            score = 0;
            nextRound();
        }
        
        function nextRound() {
            num1 = Math.floor(Math.random() * 100);
            num2 = Math.floor(Math.random() * 100);
            
            document.getElementById('num1').textContent = num1;
            document.getElementById('num2').textContent = num2;
        }
        
        function checkAnswer(choice) {
            let correct = false;
            
            if (num1 < num2 && choice === 'smaller') correct = true;
            if (num1 === num2 && choice === 'equal') correct = true;
            if (num1 > num2 && choice === 'larger') correct = true;
            
            if (correct) {
                score++;
                document.getElementById('score').textContent = score;
                
                if (score % 10 === 0) {
                    GameCore.hints.show(`${score}分！加油！`);
                }
                
                setTimeout(() => {
                    nextRound();
                }, 200);
            } else {
                GameCore.highScore.set(GAME_NAME, score);
                GameCore.hints.show(`游戏结束！得分: ${score}`);
                
                setTimeout(() => {
                    score = 0;
                    document.getElementById('score').textContent = score;
                    nextRound();
                }, 1000);
            }
        }
        
        initGame();
        GameCore.touch.enableAllButtons();
    </script>
</body>
</html>
