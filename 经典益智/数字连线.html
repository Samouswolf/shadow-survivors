<body>
<canvas id="gameCanvas"></canvas>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// ============ 画布尺寸 ============
const BASE_WIDTH = 400;
const BASE_HEIGHT = 700;
canvas.width = BASE_WIDTH;
canvas.height = BASE_HEIGHT;

function resizeCanvas() {
    const scale = Math.min(window.innerWidth / BASE_WIDTH, window.innerHeight / BASE_HEIGHT);
    canvas.style.width = (BASE_WIDTH * scale) + 'px';
    canvas.style.height = (BASE_HEIGHT * scale) + 'px';
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ============ 游戏状态 ============
const STATE = { MENU: 0, PLAYING: 1, PAUSED: 2, GAME_OVER: 3 };

// ============ 配置常量 ============
const GRID_COLS = 5;
const GRID_ROWS = 6;
const CELL_SIZE = 60;
const GRID_PADDING = 20;
const GRID_TOP = 150;
const TIME_LIMIT = 60; // 秒

// 色彩方案
const COLORS = {
    bg: '#0f0f2a',
    grid: '#1a1a3a',
    cell: '#2a2a4a',
    cellHover: '#3a3a5a',
    number: '#4ecdc4',
    numberActive: '#ff6b6b',
    line: '#4ecdc4',
    lineActive: '#ff6b6b',
    text: '#ffffff',
    accent: '#4ecdc4',
    warning: '#ff6b6b',
    success: '#2ecc71'
};

// ============ 游戏变量 ============
let gameState = STATE.MENU;
let grid = [];
let currentNumber = 1;
let maxNumber = 30;
let score = 0;
let highScore = parseInt(localStorage.getItem('number_link_highScore')) || 0;
let timeLeft = TIME_LIMIT;
let lastTime = 0;
let particles = [];
let lines = [];
let hoveredCell = null;
let selectedCells = [];
let comboCount = 0;
let comboTimer = 0;
let level = 1;
let shakeTimer = 0;
let shakeIntensity = 0;
let flashAlpha = 0;

// ============ 音效系统 ============
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new AudioCtx();
    }
}

function playSound(type) {
    if (!audioCtx) return;

    const oscillator = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();

    oscillator.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    const now = audioCtx.currentTime;

    switch (type) {
        case 'select':
            oscillator.frequency.setValueAtTime(523.25, now); // C5
            oscillator.frequency.exponentialRampToValueAtTime(659.25, now + 0.1); // E5
            gainNode.gain.setValueAtTime(0.3, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            oscillator.start(now);
            oscillator.stop(now + 0.2);
            break;

        case 'combo':
            oscillator.frequency.setValueAtTime(659.25, now); // E5
            oscillator.frequency.exponentialRampToValueAtTime(783.99, now + 0.1); // G5
            oscillator.frequency.exponentialRampToValueAtTime(1046.50, now + 0.2); // C6
            gainNode.gain.setValueAtTime(0.4, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            oscillator.start(now);
            oscillator.stop(now + 0.3);
            break;

        case 'wrong':
            oscillator.frequency.setValueAtTime(200, now);
            oscillator.frequency.exponentialRampToValueAtTime(100, now + 0.2);
            gainNode.gain.setValueAtTime(0.3, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            oscillator.type = 'sawtooth';
            oscillator.start(now);
            oscillator.stop(now + 0.2);
            break;

        case 'complete':
            oscillator.frequency.setValueAtTime(523.25, now); // C5
            oscillator.frequency.exponentialRampToValueAtTime(659.25, now + 0.1);
            oscillator.frequency.exponentialRampToValueAtTime(783.99, now + 0.2);
            oscillator.frequency.exponentialRampToValueAtTime(1046.50, now + 0.3);
            gainNode.gain.setValueAtTime(0.5, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
            oscillator.start(now);
            oscillator.stop(now + 0.4);
            break;

        case 'gameover':
            oscillator.frequency.setValueAtTime(400, now);
            oscillator.frequency.exponentialRampToValueAtTime(200, now + 0.3);
            oscillator.frequency.exponentialRampToValueAtTime(100, now + 0.6);
            gainNode.gain.setValueAtTime(0.4, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
            oscillator.type = 'sawtooth';
            oscillator.start(now);
            oscillator.stop(now + 0.6);
            break;

        case 'tick':
            oscillator.frequency.setValueAtTime(800, now);
            gainNode.gain.setValueAtTime(0.1, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
            oscillator.start(now);
            oscillator.stop(now + 0.05);
            break;
    }
}

// ============ 粒子系统 ============
function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6,
            life: 1,
            decay: 0.02 + Math.random() * 0.02,
            size: 3 + Math.random() * 4,
            color: color
        });
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;
        p.vx *= 0.98;
        p.vy *= 0.98;

        if (p.life <= 0) {
            particles.splice(i, 1);
        }
    }
}

function renderParticles() {
    for (const p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

// ============ 网格系统 ============
function generateGrid() {
    grid = [];
    const numbers = [];

    // 生成1到maxNumber的数组
    for (let i = 1; i <= maxNumber; i++) {
        numbers.push(i);
    }

    // 随机打乱
    for (let i = numbers.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [numbers[i], numbers[j]] = [numbers[j], numbers[i]];
    }

    // 填充网格
    let index = 0;
    for (let row = 0; row < GRID_ROWS; row++) {
        grid[row] = [];
        for (let col = 0; col < GRID_COLS; col++) {
            if (index < numbers.length) {
                grid[row][col] = {
                    number: numbers[index],
                    found: false,
                    x: GRID_PADDING + col * CELL_SIZE,
                    y: GRID_TOP + row * CELL_SIZE,
                    scale: 1,
                    flash: 0
                };
                index++;
            } else {
                grid[row][col] = null;
            }
        }
    }
}

function getCellAt(x, y) {
    for (let row = 0; row < GRID_ROWS; row++) {
        for (let col = 0; col < GRID_COLS; col++) {
            const cell = grid[row][col];
            if (cell && !cell.found) {
                const cx = cell.x + CELL_SIZE / 2;
                const cy = cell.y + CELL_SIZE / 2;
                const dx = x - cx;
                const dy = y - cy;
                if (dx * dx + dy * dy < (CELL_SIZE / 2) * (CELL_SIZE / 2)) {
                    return { row, col, cell };
                }
            }
        }
    }
    return null;
}

function selectCell(row, col) {
    const cell = grid[row][col];
    if (!cell || cell.found) return;

    if (cell.number === currentNumber) {
        // 正确选择
        cell.found = true;
        cell.flash = 1;
        selectedCells.push({ row, col, x: cell.x + CELL_SIZE / 2, y: cell.y + CELL_SIZE / 2 });

        // 连线
        if (selectedCells.length > 1) {
            const prev = selectedCells[selectedCells.length - 2];
            const curr = selectedCells[selectedCells.length - 1];
            lines.push({
                x1: prev.x, y1: prev.y,
                x2: curr.x, y2: curr.y,
                life: 1,
                decay: 0.01
            });
        }

        // 粒子效果
        spawnParticles(cell.x + CELL_SIZE / 2, cell.y + CELL_SIZE / 2, COLORS.accent, 10);

        // 连击系统
        comboCount++;
        comboTimer = 60;
        if (comboCount > 1) {
            playSound('combo');
            score += comboCount * 10;
        } else {
            playSound('select');
        }

        score += 10;
        currentNumber++;

        // 检查是否完成
        if (currentNumber > maxNumber) {
            playSound('complete');
            level++;
            maxNumber = Math.min(maxNumber + 10, 99);
            timeLeft = Math.min(timeLeft + 10, TIME_LIMIT);
            currentNumber = 1;
            selectedCells = [];
            lines = [];
            generateGrid();
            flashAlpha = 1;
        }
    } else {
        // 错误选择
        playSound('wrong');
        shakeTimer = 10;
        shakeIntensity = 5;
        spawnParticles(cell.x + CELL_SIZE / 2, cell.y + CELL_SIZE / 2, COLORS.warning, 8);
        comboCount = 0;
    }
}

// ============ 初始化游戏 ============
function initGame() {
    gameState = STATE.PLAYING;
    currentNumber = 1;
    score = 0;
    timeLeft = TIME_LIMIT;
    level = 1;
    maxNumber = 30;
    comboCount = 0;
    comboTimer = 0;
    selectedCells = [];
    lines = [];
    particles = [];
    hoveredCell = null;

    generateGrid();
}

// ============ 更新游戏 ============
function update(deltaTime) {
    if (gameState !== STATE.PLAYING) return;

    // 更新时间
    timeLeft -= deltaTime / 1000;
    if (timeLeft <= 0) {
        timeLeft = 0;
        gameState = STATE.GAME_OVER;
        playSound('gameover');
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('number_link_highScore', highScore);
        }
    }

    // 更新连击计时器
    if (comboTimer > 0) {
        comboTimer--;
        if (comboTimer <= 0) {
            comboCount = 0;
        }
    }

    // 更新粒子
    updateParticles();

    // 更新线条
    for (let i = lines.length - 1; i >= 0; i--) {
        lines[i].life -= lines[i].decay;
        if (lines[i].life <= 0) {
            lines.splice(i, 1);
        }
    }

    // 更新震动
    if (shakeTimer > 0) {
        shakeTimer--;
    }

    // 更新闪光
    if (flashAlpha > 0) {
        flashAlpha -= 0.02;
    }

    // 更新单元格闪光
    for (let row = 0; row < GRID_ROWS; row++) {
        for (let col = 0; col < GRID_COLS; col++) {
            const cell = grid[row][col];
            if (cell && cell.flash > 0) {
                cell.flash -= 0.05;
            }
        }
    }

    // 时间警告音效
    if (timeLeft <= 10 && timeLeft > 0 && Math.floor(timeLeft) !== Math.floor(timeLeft + deltaTime / 1000)) {
        playSound('tick');
    }
}

// ============ 渲染游戏 ============
function render() {
    ctx.save();

    // 震动效果
    if (shakeTimer > 0) {
        const dx = (Math.random() - 0.5) * shakeIntensity;
        const dy = (Math.random() - 0.5) * shakeIntensity;
        ctx.translate(dx, dy);
    }

    // 清屏
    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(0, 0, BASE_WIDTH, BASE_HEIGHT);

    // 绘制背景网格
    ctx.strokeStyle = COLORS.grid;
    ctx.lineWidth = 0.5;
    for (let x = 0; x < BASE_WIDTH; x += 30) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, BASE_HEIGHT);
        ctx.stroke();
    }
    for (let y = 0; y < BASE_HEIGHT; y += 30) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(BASE_WIDTH, y);
        ctx.stroke();
    }

    // 绘制标题
    ctx.fillStyle = COLORS.text;
    ctx.font = 'bold 28px "Segoe UI", Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('数字连线', BASE_WIDTH / 2, 40);

    // 绘制分数和时间
    ctx.font = '18px "Segoe UI", Arial, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillStyle = COLORS.accent;
    ctx.fillText(`分数: ${score}`, 20, 80);

    ctx.textAlign = 'right';
    ctx.fillStyle = timeLeft <= 10 ? COLORS.warning : COLORS.text;
    ctx.fillText(`时间: ${Math.ceil(timeLeft)}s`, BASE_WIDTH - 20, 80);

    // 绘制当前目标数字
    ctx.textAlign = 'center';
    ctx.font = 'bold 24px "Segoe UI", Arial, sans-serif';
    ctx.fillStyle = COLORS.accent;
    ctx.fillText(`目标: ${currentNumber}`, BASE_WIDTH / 2, 110);

    // 绘制连击
    if (comboCount > 1 && comboTimer > 0) {
        ctx.font = 'bold 20px "Segoe UI", Arial, sans-serif';
        ctx.fillStyle = COLORS.warning;
        ctx.fillText(`连击 x${comboCount}`, BASE_WIDTH / 2, 140);
    }

    // 绘制网格
    for (let row = 0; row < GRID_ROWS; row++) {
        for (let col = 0; col < GRID_COLS; col++) {
            const cell = grid[row][col];
            if (!cell) continue;

            const x = cell.x;
            const y = cell.y;
            const size = CELL_SIZE - 4;

            // 绘制单元格背景
            if (cell.found) {
                ctx.fillStyle = COLORS.accent;
                if (cell.flash > 0) {
                    ctx.globalAlpha = cell.flash;
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(x - 2, y - 2, size + 4, size + 4);
                    ctx.globalAlpha = 1;
                }
                ctx.fillStyle = COLORS.accent;
            } else if (hoveredCell && hoveredCell.row === row && hoveredCell.col === col) {
                ctx.fillStyle = COLORS.cellHover;
            } else {
                ctx.fillStyle = COLORS.cell;
            }

            // 绘制单元格
            ctx.beginPath();
            ctx.roundRect(x, y, size, size, 8);
            ctx.fill();

            // 绘制单元格边框
            ctx.strokeStyle = cell.found ? COLORS.accent : COLORS.grid;
            ctx.lineWidth = 2;
            ctx.stroke();

            // 绘制数字
            if (cell.number > 0) {
                ctx.font = 'bold 24px "Segoe UI", Arial, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = cell.found ? COLORS.bg : COLORS.number;
                ctx.fillText(cell.number, x + size / 2, y + size / 2);
            }
        }
    }

    // 绘制连线
    for (const line of lines) {
        ctx.globalAlpha = line.life;
        ctx.strokeStyle = COLORS.line;
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(line.x1, line.y1);
        ctx.lineTo(line.x2, line.y2);
        ctx.stroke();

        // 绘制连接点
        ctx.fillStyle = COLORS.line;
        ctx.beginPath();
        ctx.arc(line.x1, line.y1, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(line.x2, line.y2, 5, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 绘制粒子
    renderParticles();

    // 绘制闪光效果
    if (flashAlpha > 0) {
        ctx.globalAlpha = flashAlpha;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, BASE_WIDTH, BASE_HEIGHT);
        ctx.globalAlpha = 1;
    }

    // 绘制等级
    ctx.textAlign = 'center';
    ctx.font = '16px "Segoe UI", Arial, sans-serif';
    ctx.fillStyle = COLORS.text;
    ctx.fillText(`等级: ${level}`, BASE_WIDTH / 2, BASE_HEIGHT - 20);

    ctx.restore();
}

// ============ 菜单界面 ============
function renderMenu() {
    // 清屏
    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(0, 0, BASE_WIDTH, BASE_HEIGHT);

    // 绘制背景网格
    ctx.strokeStyle = COLORS.grid;
    ctx.lineWidth = 0.5;
    for (let x = 0; x < BASE_WIDTH; x += 30) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, BASE_HEIGHT);
        ctx.stroke();
    }
    for (let y = 0; y < BASE_HEIGHT; y += 30) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(BASE_WIDTH, y);
        ctx.stroke();
    }

    // 绘制标题
    ctx.fillStyle = COLORS.accent;
    ctx.font = 'bold 48px "Segoe UI", Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('数字连线', BASE_WIDTH / 2, 150);

    // 绘制副标题
    ctx.fillStyle = COLORS.text;
    ctx.font = '20px "Segoe UI", Arial, sans-serif';
    ctx.fillText('按顺序连接数字 1-N', BASE_WIDTH / 2, 200);

    // 绘制游戏说明
    ctx.font = '16px "Segoe UI", Arial, sans-serif';
    ctx.fillStyle = COLORS.number;
    const instructions = [
        '点击/触摸数字，按从小到大顺序连接',
        '连击可获得额外分数',
        '时间结束或完成所有数字',
        '每完成一轮增加难度'
    ];

    instructions.forEach((text, index) => {
        ctx.fillText(text, BASE_WIDTH / 2, 280 + index * 30);
    });

    // 绘制开始按钮
    const btnX = BASE_WIDTH / 2 - 80;
    const btnY = 450;
    const btnW = 160;
    const btnH = 50;

    ctx.fillStyle = COLORS.accent;
    ctx.beginPath();
    ctx.roundRect(btnX, btnY, btnW, btnH, 10);
    ctx.fill();

    ctx.fillStyle = COLORS.bg;
    ctx.font = 'bold 24px "Segoe UI", Arial, sans-serif';
    ctx.fillText('开始游戏', BASE_WIDTH / 2, btnY + btnH / 2);

    // 绘制最高分
    ctx.fillStyle = COLORS.text;
    ctx.font = '18px "Segoe UI", Arial, sans-serif';
    ctx.fillText(`最高分: ${highScore}`, BASE_WIDTH / 2, 550);

    // 绘制操作提示
    ctx.font = '14px "Segoe UI", Arial, sans-serif';
    ctx.fillStyle = COLORS.number;
    ctx.fillText('鼠标点击 / 触屏操作 / 空格键暂停', BASE_WIDTH / 2, 600);
}

// ============ 暂停界面 ============
function renderPause() {
    // 半透明遮罩
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(0, 0, BASE_WIDTH, BASE_HEIGHT);

    // 暂停文字
    ctx.fillStyle = COLORS.text;
    ctx.font = 'bold 36px "Segoe UI", Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('游戏暂停', BASE_WIDTH / 2, BASE_HEIGHT / 2 - 30);

    // 继续提示
    ctx.font = '20px "Segoe UI", Arial, sans-serif';
    ctx.fillStyle = COLORS.accent;
    ctx.fillText('按空格键继续', BASE_WIDTH / 2, BASE_HEIGHT / 2 + 20);
}

// ============ 结束界面 ============
function renderGameOver() {
    // 半透明遮罩
    ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
    ctx.fillRect(0, 0, BASE_WIDTH, BASE_HEIGHT);

    // 游戏结束文字
    ctx.fillStyle = COLORS.warning;
    ctx.font = 'bold 48px "Segoe UI", Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('游戏结束', BASE_WIDTH / 2, 200);

    // 分数
    ctx.fillStyle = COLORS.text;
    ctx.font = 'bold 32px "Segoe UI", Arial, sans-serif';
    ctx.fillText(`最终分数: ${score}`, BASE_WIDTH / 2, 280);

    // 等级
    ctx.font = '24px "Segoe UI", Arial, sans-serif';
    ctx.fillText(`达到等级: ${level}`, BASE_WIDTH / 2, 330);

    // 最高分
    ctx.fillStyle = COLORS.accent;
    ctx.font = '20px "Segoe UI", Arial, sans-serif';
    ctx.fillText(`最高分: ${highScore}`, BASE_WIDTH / 2, 380);

    // 新纪录提示
    if (score >= highScore && score > 0) {
        ctx.fillStyle = COLORS.warning;
        ctx.font = 'bold 24px "Segoe UI", Arial, sans-serif';
        ctx.fillText('新纪录!', BASE_WIDTH / 2, 420);
    }

    // 重新开始按钮
    const btnX = BASE_WIDTH / 2 - 80;
    const btnY = 480;
    const btnW = 160;
    const btnH = 50;

    ctx.fillStyle = COLORS.accent;
    ctx.beginPath();
    ctx.roundRect(btnX, btnY, btnW, btnH, 10);
    ctx.fill();

    ctx.fillStyle = COLORS.bg;
    ctx.font = 'bold 24px "Segoe UI", Arial, sans-serif';
    ctx.fillText('重新开始', BASE_WIDTH / 2, btnY + btnH / 2);

    // 返回菜单按钮
    const btn2Y = 550;
    ctx.fillStyle = COLORS.number;
    ctx.beginPath();
    ctx.roundRect(btnX, btn2Y, btnW, btnH, 10);
    ctx.fill();

    ctx.fillStyle = COLORS.bg;
    ctx.fillText('返回菜单', BASE_WIDTH / 2, btn2Y + btnH / 2);
}

// ============ 输入处理 ============
function getCanvasPos(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
    };
}

function handleMenuClick(x, y) {
    // 检查开始按钮
    const btnX = BASE_WIDTH / 2 - 80;
    const btnY = 450;
    const btnW = 160;
    const btnH = 50;

    if (x >= btnX && x <= btnX + btnW && y >= btnY && y <= btnY + btnH) {
        initAudio();
        initGame();
    }
}

function handleGameClick(x, y) {
    const result = getCellAt(x, y);
    if (result) {
        selectCell(result.row, result.col);
    }
}

function handleGameOverClick(x, y) {
    // 重新开始按钮
    const btnX = BASE_WIDTH / 2 - 80;
    const btnY = 480;
    const btnW = 160;
    const btnH = 50;

    if (x >= btnX && x <= btnX + btnW && y >= btnY && y <= btnY + btnH) {
        initGame();
        return;
    }

    // 返回菜单按钮
    const btn2Y = 550;
    if (x >= btnX && x <= btnX + btnW && y >= btn2Y && y <= btn2Y + btnH) {
        gameState = STATE.MENU;
    }
}

// 鼠标事件
canvas.addEventListener('click', (e) => {
    const pos = getCanvasPos(e.clientX, e.clientY);

    switch (gameState) {
        case STATE.MENU:
            handleMenuClick(pos.x, pos.y);
            break;
        case STATE.PLAYING:
            handleGameClick(pos.x, pos.y);
            break;
        case STATE.GAME_OVER:
            handleGameOverClick(pos.x, pos.y);
            break;
    }
});

canvas.addEventListener('mousemove', (e) => {
    if (gameState !== STATE.PLAYING) return;

    const pos = getCanvasPos(e.clientX, e.clientY);
    hoveredCell = getCellAt(pos.x, pos.y);
});

// 触屏事件
canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const touch = e.touches[0];
    const pos = getCanvasPos(touch.clientX, touch.clientY);

    switch (gameState) {
        case STATE.MENU:
            handleMenuClick(pos.x, pos.y);
            break;
        case STATE.PLAYING:
            handleGameClick(pos.x, pos.y);
            break;
        case STATE.PAUSED:
            // 点击屏幕继续游戏
            gameState = STATE.PLAYING;
            break;
        case STATE.GAME_OVER:
            handleGameOverClick(pos.x, pos.y);
            break;
    }
});

// 键盘事件
document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
        e.preventDefault();
        if (gameState === STATE.PLAYING) {
            gameState = STATE.PAUSED;
        } else if (gameState === STATE.PAUSED) {
            gameState = STATE.PLAYING;
        }
    }
});

// ============ 游戏循环 ============
function gameLoop(timestamp) {
    const deltaTime = timestamp - lastTime;
    lastTime = timestamp;

    // 限制deltaTime防止跳帧
    const dt = Math.min(deltaTime, 100);

    update(dt);

    switch (gameState) {
        case STATE.MENU:
            renderMenu();
            break;
        case STATE.PLAYING:
            render();
            break;
        case STATE.PAUSED:
            render();
            renderPause();
            break;
        case STATE.GAME_OVER:
            render();
            renderGameOver();
            break;
    }

    requestAnimationFrame(gameLoop);
}

// ============ 启动游戏 ============
lastTime = performance.now();
requestAnimationFrame(gameLoop);

	init() {

	_startGameOverWatcher() {
		// 检测#restartBtn或包含"重新开始"/"再来一局"的按钮变为可见
		const checkGameOver = () => {
			if (this._gameOverDetected) return;
			// 方法1: 检测#restartBtn可见
			const restartBtn = document.getElementById('restartBtn');
			if (restartBtn && restartBtn.offsetParent !== null && getComputedStyle(restartBtn).display !== 'none') {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
			// 方法2: 检测#gameOverScreen可见
			const goScreen = document.getElementById('gameOverScreen');
			if (goScreen && getComputedStyle(goScreen).display !== 'none') {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
			// 方法3: 检测screen-gameover可见
			const goScreen2 = document.getElementById('screen-gameover');
			if (goScreen2 && !goScreen2.classList.contains('hidden')) {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
		};
		// 每500ms检查一次
		this._goInterval = setInterval(() => {
			checkGameOver();
			// 如果检测到了，等2秒后重置标志，允许下次检测
			if (this._gameOverDetected) {
				setTimeout(() => { this._gameOverDetected = false; }, 2000);
			}
		}, 500);
	},
	requestRevive(callback) {
		this._reviveCallback = callback || null;
		const el = document.getElementById('interstitialAd');
		if (!el) { if (callback) callback(); return; }
		const s2 = document.createElement('script');
		s2.src = 'https://pl29544742.effectivecpmnetwork.com/be/a9/6d/bea96d779c0ee07c2b15613852dd3e70.js';

		const skipBtn = document.getElementById('skipInterstitial');
		if (skipBtn) {

				else { skipBtn.textContent = cd + ' 秒后可跳过'; }
			}, 1000);
		}
	},
	onGameOver() {
		this._deathCount++;
		if (!this.interstitial.enabled) return;
		if (this._deathCount < this.interstitial.gameCount) return;
		if (Date.now() - this._lastInterTime < this.interstitial.cooldownMs) return;
		this._lastInterTime = Date.now(); this._deathCount = 0;
		this.requestRevive(null);
	},
};
