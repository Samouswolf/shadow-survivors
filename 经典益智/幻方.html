(function(){
'use strict';

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const COLORS = {
  bg1: '#0a0a2e',
  bg2: '#1a1a4e',
  accent: '#4fc3f7',
  gold: '#ffd700',
  white: '#ffffff',
  text: '#ffffff',
  dim: 'rgba(255,255,255,0.5)',
  cell: 'rgba(255,255,255,0.08)',
  cellBorder: 'rgba(255,255,255,0.15)',
  cellHover: 'rgba(79,195,247,0.2)',
  cellFixed: 'rgba(79,195,247,0.15)',
  cellError: 'rgba(255,100,100,0.25)',
  success: '#4caf50',
  warning: '#ff9800',
  danger: '#f44336',
  purple: '#9c27b0',
  teal: '#009688'
};

const PUZZLES = {
  3: [
    { id: '3x3_1', name: '入门', size: 3, magicSum: 15, difficulty: 1,
      fixed: [[0,0,2],[0,2,6],[1,1,5],[2,0,6],[2,2,2]],  // pre-filled cells
      empty: [[0,1],[1,0],[1,2],[2,1]] },
    { id: '3x3_2', name: '经典', size: 3, magicSum: 15, difficulty: 1,
      fixed: [[0,0,8],[1,1,5],[2,2,2]], empty: [[0,1],[0,2],[1,0],[1,2],[2,0],[2,1]] },
    { id: '3x3_3', name: '挑战', size: 3, magicSum: 15, difficulty: 2,
      fixed: [[0,2,6],[2,0,6]], empty: [[0,0],[0,1],[1,0],[1,1],[1,2],[2,1],[2,2]] }
  ],
  4: [
    { id: '4x4_1', name: '入门', size: 4, magicSum: 34, difficulty: 2,
      fixed: [[0,0,16],[0,3,3],[1,1,10],[1,2,7],[2,1,5],[2,2,11],[3,0,9],[3,3,6]],
      empty: [[0,1],[0,2],[1,0],[1,3],[2,0],[2,3],[3,1],[3,2]] },
    { id: '4x4_2', name: '经典', size: 4, magicSum: 34, difficulty: 2,
      fixed: [[0,0,1],[0,3,15],[1,1,14],[1,2,4],[2,1,8],[2,2,9],[3,0,12],[3,3,2]],
      empty: [[0,1],[0,2],[1,0],[1,3],[2,0],[2,3],[3,1],[3,2]] },
    { id: '4x4_3', name: '挑战', size: 4, magicSum: 34, difficulty: 3,
      fixed: [[0,0,1],[1,1,14],[2,2,9],[3,3,2]],
      empty: [[0,1],[0,2],[0,3],[1,0],[1,2],[1,3],[2,0],[2,1],[2,3],[3,0],[3,1],[3,2]] }
  ],
  5: [
    { id: '5x5_1', name: '入门', size: 5, magicSum: 65, difficulty: 3,
      fixed: [[0,0,1],[0,2,24],[0,4,5],[1,1,15],[1,3,16],[2,2,13],[3,1,20],[3,3,7],[4,0,21],[4,2,12],[4,4,9]],
      empty: [[0,1],[0,3],[1,0],[1,2],[1,4],[2,0],[2,1],[2,3],[2,4],[3,0],[3,2],[3,4],[4,1],[4,3]] },
    { id: '5x5_2', name: '经典', size: 5, magicSum: 65, difficulty: 3,
      fixed: [[0,0,1],[0,4,21],[1,1,15],[1,3,16],[2,2,13],[3,1,20],[3,3,7],[4,0,5],[4,4,25]],
      empty: [[0,1],[0,2],[0,3],[1,0],[1,2],[1,4],[2,0],[2,1],[2,3],[2,4],[3,0],[3,2],[3,4],[4,1],[4,2],[4,3]] }
  ],
  6: [
    { id: '6x6_1', name: '入门', size: 6, magicSum: 111, difficulty: 4,
      fixed: [[0,0,35],[0,5,1],[1,1,8],[1,4,26],[2,2,19],[2,3,20],[3,2,23],[3,3,18],[4,1,14],[4,4,31],[5,0,5],[5,5,33]],
      empty: [[0,1],[0,2],[0,3],[0,4],[1,0],[1,2],[1,3],[1,5],[2,0],[2,1],[2,4],[2,5],[3,0],[3,1],[3,4],[3,5],[4,0],[4,2],[4,3],[4,5],[5,1],[5,2],[5,3],[5,4]] }
  ],
  7: [
    { id: '7x7_1', name: '入门', size: 7, magicSum: 175, difficulty: 5,
      fixed: [[0,0,49],[0,3,11],[0,6,7],[1,1,10],[1,5,38],[2,2,30],[2,4,21],[3,0,14],[3,3,25],[3,6,36],[4,2,27],[4,4,24],[5,1,35],[5,5,13],[6,0,28],[6,3,40],[6,6,1]],
      empty: [[0,1],[0,2],[0,4],[0,5],[1,0],[1,2],[1,3],[1,4],[1,6],[2,0],[2,1],[2,3],[2,5],[2,6],[3,1],[3,2],[3,4],[3,5],[4,0],[4,1],[4,3],[4,5],[4,6],[5,0],[5,2],[5,3],[5,4],[5,6],[6,1],[6,2],[6,4],[6,5]] }
  ]
};

const STATE = {
  MENU: 0, PLAYING: 1, PAUSED: 2, GAME_OVER: 3, WIN: 4
};

const G = {
  state: STATE.MENU,
  puzzle: null,
  grid: [],
  selected: null,
  timer: 0,
  timerInterval: null,
  score: 0,
  moves: 0,
  mistakes: 0,
  hints: 3,
  hintCells: new Set(),
  undoStack: [],
  level: 0,
  category: 3,
  menuScroll: 0,
  particles: [],
  bgParticles: [],
  animation: 0,
  adsShown: 0,
  showInterstitial: false,
  interstitialTimer: 0
};

function initBgParticles() {
  G.bgParticles = [];
  for (let i = 0; i < 50; i++) {
    G.bgParticles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      size: Math.random() * 2 + 0.5,
      speedY: Math.random() * 0.5 + 0.1,
      speedX: Math.random() * 0.3 - 0.15,
      alpha: Math.random() * 0.4 + 0.1
    });
  }
}

function updateBgParticles() {
  for (let p of G.bgParticles) {
    p.y -= p.speedY;
    p.x += p.speedX;
    if (p.y < -10) { p.y = canvas.height + 10; p.x = Math.random() * canvas.width; }
    if (p.x < -10) p.x = canvas.width + 10;
    if (p.x > canvas.width + 10) p.x = -10;
  }
}

function drawBgParticles() {
  for (let p of G.bgParticles) {
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = COLORS.accent;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    G.particles.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * 8,
      vy: (Math.random() - 0.5) * 8,
      size: Math.random() * 4 + 2,
      color: color,
      life: 1,
      decay: Math.random() * 0.02 + 0.01
    });
  }
}

function updateParticles() {
  for (let i = G.particles.length - 1; i >= 0; i--) {
    let p = G.particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= p.decay;
    if (p.life <= 0) G.particles.splice(i, 1);
  }
}

function drawParticles() {
  for (let p of G.particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  initBgParticles();
}
window.addEventListener('resize', resize);
resize();

function drawBg() {
  let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, COLORS.bg1);
  grad.addColorStop(1, COLORS.bg2);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  updateBgParticles();
  drawBgParticles();
}

function drawText(text, x, y, size, color, align) {
  ctx.font = `bold ${size}px "Microsoft YaHei", "Segoe UI", sans-serif`;
  ctx.fillStyle = color || COLORS.white;
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y);
}

function drawButton(text, x, y, w, h, hover) {
  let grad = ctx.createLinearGradient(x, y, x, y + h);
  if (hover) {
    grad.addColorStop(0, 'rgba(79,195,247,0.4)');
    grad.addColorStop(1, 'rgba(79,195,247,0.2)');
  } else {
    grad.addColorStop(0, 'rgba(79,195,247,0.2)');
    grad.addColorStop(1, 'rgba(79,195,247,0.1)');
  }
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, 8);
  ctx.fill();
  ctx.strokeStyle = hover ? COLORS.accent : 'rgba(79,195,247,0.3)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  drawText(text, x + w/2, y + h/2, Math.min(16, h * 0.4), COLORS.white);
}

function getGridArea() {
  let n = G.puzzle ? G.puzzle.size : 3;
  let maxW = canvas.width * 0.85;
  let maxH = canvas.height * 0.6;
  let cellSize = Math.min(maxW / n, maxH / n, 70);
  let gridW = cellSize * n;
  let gridH = cellSize * n;
  let x = (canvas.width - gridW) / 2;
  let y = (canvas.height - gridH) / 2 + 30;
  return { x, y, w: gridW, h: gridH, cellSize };
}

function getMagicSum(size) {
  return size * (size * size + 1) / 2;
}

function initPuzzle(puzzle) {
  G.puzzle = puzzle;
  G.grid = [];
  let n = puzzle.size;
  for (let r = 0; r < n; r++) {
    G.grid[r] = [];
    for (let c = 0; c < n; c++) {
      let fixed = puzzle.fixed.find(f => f[0] === r && f[1] === c);
      G.grid[r][c] = {
        value: fixed ? fixed[2] : 0,
        fixed: !!fixed,
        error: false,
        hint: false
      };
    }
  }
  G.selected = null;
  G.timer = 0;
  G.score = 0;
  G.moves = 0;
  G.mistakes = 0;
  G.hints = 3;
  G.hintCells = new Set();
  G.undoStack = [];
  G.particles = [];
  G.state = STATE.PLAYING;
  if (G.timerInterval) clearInterval(G.timerInterval);
  G.timerInterval = setInterval(() => {
    if (G.state === STATE.PLAYING) G.timer++;
  }, 1000);
  loadHighScore();
}

function checkRow(row) {
  let n = G.puzzle.size;
  let sum = 0;
  let filled = 0;
  for (let c = 0; c < n; c++) {
    if (G.grid[row][c].value === 0) return { sum: 0, complete: false };
    sum += G.grid[row][c].value;
    filled++;
  }
  return { sum, complete: filled === n, valid: sum === G.puzzle.magicSum };
}

function checkCol(col) {
  let n = G.puzzle.size;
  let sum = 0;
  let filled = 0;
  for (let r = 0; r < n; r++) {
    if (G.grid[r][col].value === 0) return { sum: 0, complete: false };
    sum += G.grid[r][col].value;
    filled++;
  }
  return { sum, complete: filled === n, valid: sum === G.puzzle.magicSum };
}

function checkDiag1() {
  let n = G.puzzle.size;
  let sum = 0;
  let filled = 0;
  for (let i = 0; i < n; i++) {
    if (G.grid[i][i].value === 0) return { sum: 0, complete: false };
    sum += G.grid[i][i].value;
    filled++;
  }
  return { sum, complete: filled === n, valid: sum === G.puzzle.magicSum };
}

function checkDiag2() {
  let n = G.puzzle.size;
  let sum = 0;
  let filled = 0;
  for (let i = 0; i < n; i++) {
    if (G.grid[i][n-1-i].value === 0) return { sum: 0, complete: false };
    sum += G.grid[i][n-1-i].value;
    filled++;
  }
  return { sum, complete: filled === n, valid: sum === G.puzzle.magicSum };
}

function validateGrid() {
  let n = G.puzzle.size;
  let errors = new Set();
  for (let r = 0; r < n; r++) {
    let result = checkRow(r);
    if (result.complete && !result.valid) {
      for (let c = 0; c < n; c++) errors.add(`${r},${c}`);
    }
  }
  for (let c = 0; c < n; c++) {
    let result = checkCol(c);
    if (result.complete && !result.valid) {
      for (let r = 0; r < n; r++) errors.add(`${r},${c}`);
    }
  }
  let d1 = checkDiag1();
  if (d1.complete && !d1.valid) {
    for (let i = 0; i < n; i++) errors.add(`${i},${i}`);
  }
  let d2 = checkDiag2();
  if (d2.complete && !d2.valid) {
    for (let i = 0; i < n; i++) errors.add(`${i},${n-1-i}`);
  }
  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n; c++) {
      G.grid[r][c].error = errors.has(`${r},${c}`);
    }
  }
}

function checkWin() {
  let n = G.puzzle.size;
  for (let r = 0; r < n; r++) {
    let result = checkRow(r);
    if (!result.complete || !result.valid) return false;
  }
  for (let c = 0; c < n; c++) {
    let result = checkCol(c);
    if (!result.complete || !result.valid) return false;
  }
  if (!checkDiag1().valid || !checkDiag2().valid) return false;
  return true;
}

function calculateScore() {
  let n = G.puzzle.size;
  let base = n * n * 100;
  let timeBonus = Math.max(0, 300 - G.timer) * 10;
  let movePenalty = G.moves * 2;
  let mistakePenalty = G.mistakes * 50;
  let hintPenalty = (3 - G.hints) * 100;
  return Math.max(0, base + timeBonus - movePenalty - mistakePenalty - hintPenalty);
}

function formatTime(seconds) {
  let m = Math.floor(seconds / 60);
  let s = seconds % 60;
  return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
}

function loadHighScore() {
  let key = `magic_square_${G.puzzle.id}`;
  let saved = localStorage.getItem(key);
  return saved ? parseInt(saved) : 0;
}

function saveHighScore(score) {
  let key = `magic_square_${G.puzzle.id}`;
  let current = loadHighScore();
  if (score > current) {
    localStorage.setItem(key, score.toString());
  }
}

function useHint() {
  if (G.hints <= 0 || !G.selected) return;
  let { r, c } = G.selected;
  if (G.grid[r][c].fixed || G.grid[r][c].value !== 0) return;
  let n = G.puzzle.size;
  let solution = generateSolution();
  if (solution) {
    G.grid[r][c].value = solution[r][c];
    G.grid[r][c].hint = true;
    G.hintCells.add(`${r},${c}`);
    G.hints--;
    G.moves++;
    validateGrid();
    if (checkWin()) {
      G.score = calculateScore();
      saveHighScore(G.score);
      G.state = STATE.WIN;
      spawnParticles(canvas.width/2, canvas.height/2, COLORS.gold, 50);
      showInterstitialAd();
    }
  }
}

function generateSolution() {
  let n = G.puzzle.size;
  let target = G.puzzle.magicSum;
  let solution = [];
  for (let r = 0; r < n; r++) {
    solution[r] = [];
    for (let c = 0; c < n; c++) {
      solution[r][c] = G.grid[r][c].value;
    }
  }
  let empties = [];
  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n; c++) {
      if (!G.grid[r][c].fixed && G.grid[r][c].value === 0) {
        empties.push([r, c]);
      }
    }
  }
  if (empties.length === 0) return solution;
  let used = new Set();
  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n; c++) {
      if (G.grid[r][c].value > 0) used.add(G.grid[r][c].value);
    }
  }
  function solve(idx) {
    if (idx === empties.length) {
      for (let r = 0; r < n; r++) {
        if (checkRow(r).sum !== target) return false;
      }
      for (let c = 0; c < n; c++) {
        if (checkCol(c).sum !== target) return false;
      }
      let d1 = 0, d2 = 0;
      for (let i = 0; i < n; i++) { d1 += solution[i][i]; d2 += solution[i][n-1-i]; }
      return d1 === target && d2 === target;
    }
    let [r, c] = empties[idx];
    for (let num = 1; num <= n*n; num++) {
      if (used.has(num)) continue;
      solution[r][c] = num;
      used.add(num);
      if (solve(idx + 1)) return true;
      solution[r][c] = 0;
      used.delete(num);
    }
    return false;
  }
  if (solve(0)) return solution;
  return null;
}

function undoMove() {
  if (G.undoStack.length === 0) return;
  let { r, c, value } = G.undoStack.pop();
  G.grid[r][c].value = value;
  G.grid[r][c].error = false;
  G.grid[r][c].hint = G.hintCells.has(`${r},${c}`);
  validateGrid();
}

      if (cell.error) {

        ctx.fillStyle = COLORS.cellHover;

        ctx.fillStyle = COLORS.cellFixed;

      }
      ctx.fillRect(x, y, cs, cs);
      ctx.strokeStyle = COLORS.cellBorder;
      ctx.lineWidth = 1;

        drawText(cell.value.toString(), x + cs/2, y + cs/2, cs * 0.5, color);

  }
  ctx.strokeStyle = COLORS.white;
  ctx.lineWidth = 2;
  ctx.strokeRect(area.x, area.y, area.w, area.h);

    ctx.moveTo(area.x + i * cs, area.y);

    ctx.beginPath();

        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>

<script>
