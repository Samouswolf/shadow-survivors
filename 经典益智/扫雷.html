<style>/* 游戏工坊广告系统 */
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);height:90px;max-height:90px;overflow:hidden;contain:layout style paint;pointer-events:none!important}.ad-banner-container,.ad-banner-container *{pointer-events:none!important}.ad-banner-container iframe{max-height:90px;pointer-events:none!important}

.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}

<body>

    <button id="start-game-btn" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:20px 40px;font-size:20px;background:#f5576c;color:white;border:none;border-radius:12px;cursor:pointer;z-index:999;font-weight:bold;display:none;">开始游戏</button>


    <div class="game-guide" style="margin-bottom:15px;padding:10px;background:#fff3f3;border-radius:8px;border:1px solid #ffcccc;">
        <div style="font-weight:bold;color:#f5576c;margin-bottom:5px;">🎮 操作说明</div>
        <div style="font-size:14px;color:#666;">点击/触摸进行游戏，支持键盘操作</div>
    </div>

<canvas id="gameCanvas"></canvas>
<div id="startScreen" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#0a0a12;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000">
  <h1 style="font-size:48px;color:#e74c3c;margin-bottom:20px">💣 扫雷</h1>
  <p style="color:#888;margin-bottom:40px">经典益智游戏</p>
  <div style="display:flex;flex-direction:column;gap:15px">
    <button class="difficultyBtn" data-diff="easy" style="padding:15px 60px;font-size:20px;background:linear-gradient(135deg,#27ae60,#2ecc71);color:#fff;border:none;border-radius:12px;cursor:pointer">简单 (9x9, 10雷)</button>
    <button class="difficultyBtn" data-diff="medium" style="padding:15px 60px;font-size:20px;background:linear-gradient(135deg,#f39c12,#e67e22);color:#fff;border:none;border-radius:12px;cursor:pointer">中等 (16x16, 40雷)</button>
    <button class="difficultyBtn" data-diff="hard" style="padding:15px 60px;font-size:20px;background:linear-gradient(135deg,#e74c3c,#c0392b);color:#fff;border:none;border-radius:12px;cursor:pointer">困难 (30x16, 99雷)</button>
  </div>
  <div style="margin-top:30px;color:#666;font-size:14px">左键翻开 | 右键标记 | 长按标记</div>
</div>
<button id="pauseBtn" style="position:fixed;top:10px;right:10px;width:44px;height:44px;font-size:20px;background:rgba(0,0,0,0.5);color:#fff;border:1px solid rgba(255,255,255,0.3);border-radius:8px;z-index:20;display:none">⏸</button>
<div id="pauseScreen" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);flex-direction:column;align-items:center;justify-content:center;z-index:999">
  <h2 style="color:#fff;margin-bottom:30px">游戏暂停</h2>
  <button id="resumeBtn" style="padding:12px 40px;font-size:18px;background:#e74c3c;color:#fff;border:none;border-radius:8px;margin-bottom:15px">继续游戏</button>
  <button id="restartBtn" style="padding:12px 40px;font-size:18px;background:#666;color:#fff;border:none;border-radius:8px">重新开始</button>
</div>
<div id="endScreen" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);flex-direction:column;align-items:center;justify-content:center;z-index:1001">
  <h2 id="endTitle" style="font-size:36px;color:#e74c3c;margin-bottom:10px">游戏结束</h2>
  <p id="endMsg" style="color:#888;margin-bottom:20px"></p>
  <div id="endStats" style="color:#aaa;margin-bottom:30px;font-size:16px"></div>
  <button id="retryBtn" style="padding:12px 40px;font-size:18px;background:#e74c3c;color:#fff;border:none;border-radius:8px;margin-bottom:15px">再来一局</button>
  <button id="menuBtn" style="padding:12px 40px;font-size:18px;background:#666;color:#fff;border:none;border-radius:8px">返回菜单</button>
</div>

  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script src="../game_core.js"></script>
<script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script>
(function(){
'use strict';

// ============ 常量定义 ============
const DIFFICULTIES = {
    easy:   { cols:9,  rows:9,  mines:10 },
    medium: { cols:16, rows:16, mines:40 },
    hard:   { cols:30, rows:16, mines:99 }
};

const COLORS = {
    bg: '#0a0a1a',
    cellHidden: '#3a3a5a',
    cellHiddenHover: '#4a4a6a',
    cellRevealed: '#1a1a2a',
    cellMine: '#5a1a1a',
    cellFlag: '#3a3a5a',
    gridLine: '#2a2a4a',
    text: '#ffffff',
    textDim: '#888888',
    mine: '#e74c3c',
    flag: '#f39c12',
    numbers: ['', '#3498db', '#27ae60', '#e74c3c', '#8e44ad', '#e67e22', '#1abc9c', '#2c3e50', '#95a5a6'],
    headerBg: '#1a1a2a',
    timerText: '#f39c12',
    mineCountText: '#e74c3c'
};

// ============ 游戏状态 ============
var canvas, ctx;
var G = {
    state: 'menu', // menu, playing, paused, won, lost
    difficulty: 'easy',
    cols: 9,
    rows: 9,
    totalMines: 10,
    cellSize: 40,
    offsetX: 0,
    offsetY: 0,
    headerHeight: 50,
    board: [],        // 2D array: { mine, revealed, flagged, adjacentMines }
    firstClick: true,
    gameStarted: false,
    startTime: 0,
    elapsedTime: 0,
    timerInterval: null,
    minesRemaining: 10,
    revealedCount: 0,
    flagCount: 0,
    hoverX: -1,
    hoverY: -1,
    longPressTimer: null,
    longPressTriggered: false,
    animatingReveal: false,
    revealQueue: [],
    revealTimer: null
};

// ============ 音效系统 ============
var audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playSound(type) {
    if (!audioCtx) return;
    try {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        var now = audioCtx.currentTime;
        switch(type) {
            case 'click':
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(400, now + 0.1);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
                break;
            case 'reveal':
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.08);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
                break;
            case 'flag':
                osc.type = 'square';
                osc.frequency.setValueAtTime(500, now);
                osc.frequency.setValueAtTime(700, now + 0.05);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
                break;
            case 'unflag':
                osc.type = 'square';
                osc.frequency.setValueAtTime(700, now);
                osc.frequency.setValueAtTime(500, now + 0.05);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
                break;
            case 'explode':
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.3);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
                break;
            case 'win':
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523, now);
                osc.frequency.setValueAtTime(659, now + 0.15);
                osc.frequency.setValueAtTime(784, now + 0.3);
                osc.frequency.setValueAtTime(1047, now + 0.45);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                osc.start(now);
                osc.stop(now + 0.6);
                break;
        }
    } catch(e) {}
}

// ============ 本地存储 ============
function loadHighScores() {
    try {
        var data = localStorage.getItem('minesweeper_highscores');
        return data ? JSON.parse(data) : { easy: Infinity, medium: Infinity, hard: Infinity };
    } catch(e) {
        return { easy: Infinity, medium: Infinity, hard: Infinity };
    }
}

function saveHighScore(difficulty, time) {
    try {
        var scores = loadHighScores();
        if (time < scores[difficulty]) {
            scores[difficulty] = time;
            localStorage.setItem('minesweeper_highscores', JSON.stringify(scores));
            return true;
        }
    } catch(e) {}
    return false;
}

function formatTime(seconds) {
    if (seconds === Infinity) return '--:--';
    var m = Math.floor(seconds / 60);
    var s = seconds % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}

// ============ 画布设置 ============
function setupCanvas() {
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
}

function resizeCanvas() {
    var maxW = window.innerWidth;
    var maxH = window.innerHeight;

    // 计算合适的格子大小
    var maxCellW = Math.floor((maxW - 20) / G.cols);
    var maxCellH = Math.floor((maxH - G.headerHeight - 20) / G.rows);
    G.cellSize = Math.min(maxCellW, maxCellH, 40);
    G.cellSize = Math.max(G.cellSize, 20); // 最小20px

    var boardW = G.cols * G.cellSize;
    var boardH = G.rows * G.cellSize;

    canvas.width = boardW + 20;
    canvas.height = boardH + G.headerHeight + 20;

    G.offsetX = 10;
    G.offsetY = G.headerHeight + 10;
}

// ============ 游戏初始化 ============
function initGame(difficulty) {
    G.difficulty = difficulty;
    var diff = DIFFICULTIES[difficulty];
    G.cols = diff.cols;
    G.rows = diff.rows;
    G.totalMines = diff.mines;
    G.minesRemaining = diff.mines;
    G.firstClick = true;
    G.gameStarted = false;
    G.startTime = 0;
    G.elapsedTime = 0;
    G.flagCount = 0;
    G.revealedCount = 0;
    G.state = 'playing';
    G.hoverX = -1;
    G.hoverY = -1;
    G.animatingReveal = false;
    G.revealQueue = [];

    if (G.timerInterval) {
        clearInterval(G.timerInterval);
        G.timerInterval = null;
    }
    if (G.revealTimer) {
        clearInterval(G.revealTimer);
        G.revealTimer = null;
    }

    // 初始化空白棋盘
    G.board = [];
    for (var y = 0; y < G.rows; y++) {
        G.board[y] = [];
        for (var x = 0; x < G.cols; x++) {
            G.board[y][x] = {
                mine: false,
                revealed: false,
                flagged: false,
                adjacentMines: 0,
                explodeAnim: 0
            };
        }
    }

    resizeCanvas();
    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('endScreen').style.display = 'none';
    document.getElementById('pauseBtn').style.display = 'block';
}

function placeMines(safeX, safeY) {
    // 在安全区域周围不放雷
    var safeCells = new Set();
    for (var dy = -1; dy <= 1; dy++) {
        for (var dx = -1; dx <= 1; dx++) {
            var nx = safeX + dx;
            var ny = safeY + dy;
            if (nx >= 0 && nx < G.cols && ny >= 0 && ny < G.rows) {
                safeCells.add(ny * G.cols + nx);
            }
        }
    }

    var placed = 0;
    while (placed < G.totalMines) {
        var x = Math.floor(Math.random() * G.cols);
        var y = Math.floor(Math.random() * G.rows);
        var idx = y * G.cols + x;
        if (!G.board[y][x].mine && !safeCells.has(idx)) {
            G.board[y][x].mine = true;
            placed++;
        }
    }

    // 计算相邻雷数
    for (var y = 0; y < G.rows; y++) {
        for (var x = 0; x < G.cols; x++) {
            if (G.board[y][x].mine) continue;
            var count = 0;
            for (var dy = -1; dy <= 1; dy++) {
                for (var dx = -1; dx <= 1; dx++) {
                    if (dx === 0 && dy === 0) continue;
                    var nx = x + dx;
                    var ny = y + dy;
                    if (nx >= 0 && nx < G.cols && ny >= 0 && ny < G.rows && G.board[ny][nx].mine) {
                        count++;
                    }
                }
            }
            G.board[y][x].adjacentMines = count;
        }
    }
}

// ============ 游戏逻辑 ============
function revealCell(x, y) {
    if (x < 0 || x >= G.cols || y < 0 || y >= G.rows) return;
    var cell = G.board[y][x];
    if (cell.revealed || cell.flagged) return;

    if (G.firstClick) {
        G.firstClick = false;
        G.gameStarted = true;
        G.startTime = Date.now();
        G.timerInterval = setInterval(updateTimer, 1000);
        placeMines(x, y);
    }

    cell.revealed = true;
    G.revealedCount++;

    if (cell.mine) {
        // 游戏结束
        cell.explodeAnim = 1;
        gameOver(false);
        return;
    }

    playSound('reveal');

    // 如果是空白格，自动展开
    if (cell.adjacentMines === 0) {
        for (var dy = -1; dy <= 1; dy++) {
            for (var dx = -1; dx <= 1; dx++) {
                if (dx === 0 && dy === 0) continue;
                revealCell(x + dx, y + dy);
            }
        }
    }

    // 检查胜利
    checkWin();
}

function toggleFlag(x, y) {
    if (x < 0 || x >= G.cols || y < 0 || y >= G.rows) return;
    var cell = G.board[y][x];
    if (cell.revealed) return;

    if (cell.flagged) {
        cell.flagged = false;
        G.flagCount--;
        playSound('unflag');
    } else {
        cell.flagged = true;
        G.flagCount++;
        playSound('flag');
    }
    G.minesRemaining = G.totalMines - G.flagCount;
}

function chordReveal(x, y) {
    if (x < 0 || x >= G.cols || y < 0 || y >= G.rows) return;
    var cell = G.board[y][x];
    if (!cell.revealed || cell.adjacentMines === 0) return;

    // 计算周围标记数
    var flagCount = 0;
    for (var dy = -1; dy <= 1; dy++) {
        for (var dx = -1; dx <= 1; dx++) {
            if (dx === 0 && dy === 0) continue;
            var nx = x + dx;
            var ny = y + dy;
            if (nx >= 0 && nx < G.cols && ny >= 0 && ny < G.rows && G.board[ny][nx].flagged) {
                flagCount++;
            }
        }
    }

    // 如果标记数等于数字，翻开周围未标记的格子
    if (flagCount === cell.adjacentMines) {
        for (var dy = -1; dy <= 1; dy++) {
            for (var dx = -1; dx <= 1; dx++) {
                if (dx === 0 && dy === 0) continue;
                revealCell(x + dx, y + dy);
            }
        }
    }
}

function checkWin() {
    var totalSafe = G.cols * G.rows - G.totalMines;
    if (G.revealedCount === totalSafe) {
        gameOver(true);
    }
}

function gameOver(won) {
    G.state = won ? 'won' : 'lost';

    if (G.timerInterval) {
        clearInterval(G.timerInterval);
        G.timerInterval = null;
    }

    if (won) {
        playSound('win');
        var isNewRecord = saveHighScore(G.difficulty, G.elapsedTime);
        showEndScreen(true, isNewRecord);
    } else {
        playSound('explode');
        // 显示所有地雷
        setTimeout(function() {
            showEndScreen(false, false);
        }, 500);
    }
}

function updateTimer() {
    if (G.state !== 'playing') return;
    G.elapsedTime = Math.floor((Date.now() - G.startTime) / 1000);
}

// ============ 渲染 ============
function render() {
    if (G.state === 'menu') {
        requestAnimationFrame(render);
        return;
    }

    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 绘制头部信息
    drawHeader();

    // 绘制棋盘
    drawBoard();

    requestAnimationFrame(render);
}

function drawHeader() {
    ctx.fillStyle = COLORS.headerBg;
    ctx.fillRect(0, 0, canvas.width, G.headerHeight);

    // 地雷计数
    ctx.fillStyle = COLORS.mineCountText;
    ctx.font = 'bold 24px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('💣 ' + G.minesRemaining, 15, 35);

    // 计时器
    ctx.fillStyle = COLORS.timerText;
    ctx.textAlign = 'right';
    ctx.fillText('⏱ ' + formatTime(G.elapsedTime), canvas.width - 15, 35);

    // 难度标签
    ctx.fillStyle = COLORS.textDim;
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'center';
    var diffNames = { easy: '简单', medium: '中等', hard: '困难' };
    ctx.fillText(diffNames[G.difficulty], canvas.width / 2, 20);

    // 最高分
    var scores = loadHighScores();
    var best = scores[G.difficulty];
    ctx.fillText('最佳: ' + formatTime(best), canvas.width / 2, 40);
}

function drawBoard() {
    for (var y = 0; y < G.rows; y++) {
        for (var x = 0; x < G.cols; x++) {
            var cell = G.board[y][x];
            var px = G.offsetX + x * G.cellSize;
            var py = G.offsetY + y * G.cellSize;
            var size = G.cellSize - 1;

            // 单元格背景
            if (cell.revealed) {
                if (cell.mine) {
                    ctx.fillStyle = cell.explodeAnim > 0 ? '#ff4444' : COLORS.cellMine;
                } else {
                    ctx.fillStyle = COLORS.cellRevealed;
                }
            } else {
                if (x === G.hoverX && y === G.hoverY && G.state === 'playing') {
                    ctx.fillStyle = COLORS.cellHiddenHover;
                } else {
                    ctx.fillStyle = COLORS.cellHidden;
                }
            }

            // 绘制圆角矩形
            var r = 3;
            ctx.beginPath();
            ctx.moveTo(px + r, py);
            ctx.lineTo(px + size - r, py);
            ctx.quadraticCurveTo(px + size, py, px + size, py + r);
            ctx.lineTo(px + size, py + size - r);
            ctx.quadraticCurveTo(px + size, py + size, px + size - r, py + size);
            ctx.lineTo(px + r, py + size);
            ctx.quadraticCurveTo(px, py + size, px, py + size - r);
            ctx.lineTo(px, py + r);
            ctx.quadraticCurveTo(px, py, px + r, py);
            ctx.closePath();
            ctx.fill();

            // 绘制内容
            if (cell.revealed) {
                if (cell.mine) {
                    drawMine(px, py, size);
                } else if (cell.adjacentMines > 0) {
                    ctx.fillStyle = COLORS.numbers[cell.adjacentMines];
                    ctx.font = 'bold ' + Math.floor(G.cellSize * 0.6) + 'px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(cell.adjacentMines, px + size/2, py + size/2);
                }
            } else if (cell.flagged) {
                drawFlag(px, py, size);
            }
        }
    }
}

function drawMine(px, py, size) {
    var cx = px + size/2;
    var cy = py + size/2;
    var r = size * 0.3;

    // 地雷主体
    ctx.fillStyle = COLORS.mine;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();

    // 尖刺
    ctx.strokeStyle = COLORS.mine;
    ctx.lineWidth = 2;
    for (var i = 0; i < 8; i++) {
        var angle = i * Math.PI / 4;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(angle) * r * 0.7, cy + Math.sin(angle) * r * 0.7);
        ctx.lineTo(cx + Math.cos(angle) * r * 1.5, cy + Math.sin(angle) * r * 1.5);
        ctx.stroke();
    }

    // 高光
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath();
    ctx.arc(cx - r*0.25, cy - r*0.25, r*0.2, 0, Math.PI*2);
    ctx.fill();
}

function drawFlag(px, py, size) {
    var cx = px + size/2;
    var cy = py + size/2;

    // 旗杆
    ctx.strokeStyle = '#8B4513';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx, py + size * 0.2);
    ctx.lineTo(cx, py + size * 0.8);
    ctx.stroke();

    // 旗帜
    ctx.fillStyle = COLORS.flag;
    ctx.beginPath();
    ctx.moveTo(cx, py + size * 0.2);
    ctx.lineTo(cx + size * 0.35, py + size * 0.35);
    ctx.lineTo(cx, py + size * 0.5);
    ctx.closePath();
    ctx.fill();

    // 底座
    ctx.fillStyle = '#8B4513';
    ctx.fillRect(cx - size*0.2, py + size*0.75, size*0.4, size*0.08);
}

// ============ 事件处理 ============
function getCellFromPos(clientX, clientY) {
    var rect = canvas.getBoundingClientRect();
    var x = clientX - rect.left;
    var y = clientY - rect.top;

    x = (x / rect.width) * canvas.width;
    y = (y / rect.height) * canvas.height;

    var cx = Math.floor((x - G.offsetX) / G.cellSize);
    var cy = Math.floor((y - G.offsetY) / G.cellSize);

    if (cx >= 0 && cx < G.cols && cy >= 0 && cy < G.rows) {
        return { x: cx, y: cy };
    }
    return null;
}

function handleLeftClick(cx, cy) {
    if (G.state !== 'playing') return;
    var cell = G.board[cy][cx];

    if (cell.revealed && cell.adjacentMines > 0) {
        chordReveal(cx, cy);
    } else {
        revealCell(cx, cy);
    }
}

function handleRightClick(cx, cy) {
    if (G.state !== 'playing') return;
    toggleFlag(cx, cy);
}

// 鼠标事件 — moved inside setupCanvas() callback to ensure canvas is assigned
function bindCanvasEvents() {
canvas.addEventListener('click', function(e) {
    e.preventDefault();
    var pos = getCellFromPos(e.clientX, e.clientY);
    if (pos) handleLeftClick(pos.x, pos.y);
});

canvas.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    var pos = getCellFromPos(e.clientX, e.clientY);
    if (pos) handleRightClick(pos.x, pos.y);
});

canvas.addEventListener('mousemove', function(e) {
    var pos = getCellFromPos(e.clientX, e.clientY);
    if (pos) {
        G.hoverX = pos.x;
        G.hoverY = pos.y;
    } else {
        G.hoverX = -1;
        G.hoverY = -1;
    }
});

canvas.addEventListener('mouseleave', function() {
    G.hoverX = -1;
    G.hoverY = -1;
});

// 触屏事件
var touchStartTime = 0;
var touchStartPos = null;
var touchMoved = false;

canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    var touch = e.touches[0];
    touchStartTime = Date.now();
    touchStartPos = { x: touch.clientX, y: touch.clientY };
    touchMoved = false;
    G.longPressTriggered = false;

    var pos = getCellFromPos(touch.clientX, touch.clientY);
    if (pos) {
        G.hoverX = pos.x;
        G.hoverY = pos.y;

        // 长按标记
        G.longPressTimer = setTimeout(function() {
            if (!touchMoved) {
                G.longPressTriggered = true;
                handleRightClick(pos.x, pos.y);
            }
        }, 500);
    }
}, { passive: false });

canvas.addEventListener('touchmove', function(e) {
    e.preventDefault();
    touchMoved = true;
    if (G.longPressTimer) {
        clearTimeout(G.longPressTimer);
        G.longPressTimer = null;
    }

    var touch = e.touches[0];
    var pos = getCellFromPos(touch.clientX, touch.clientY);
    if (pos) {
        G.hoverX = pos.x;
        G.hoverY = pos.y;
    }
}, { passive: false });

canvas.addEventListener('touchend', function(e) {
    e.preventDefault();
    if (G.longPressTimer) {
        clearTimeout(G.longPressTimer);
        G.longPressTimer = null;
    }

    if (!G.longPressTriggered && !touchMoved) {
        var touch = e.changedTouches[0];
        var pos = getCellFromPos(touch.clientX, touch.clientY);
        if (pos) handleLeftClick(pos.x, pos.y);
    }

    G.hoverX = -1;
    G.hoverY = -1;
}, { passive: false });
} // end bindCanvasEvents

// 键盘事件
document.addEventListener('keydown', function(e) {
    if (G.state === 'playing') {
        if (e.key === 'p' || e.key === 'P') {
            G.state = 'paused';
            document.getElementById('pauseScreen').style.display = 'flex';
            if (G.timerInterval) {
                clearInterval(G.timerInterval);
                G.timerInterval = null;
            }
        }
    } else if (G.state === 'paused') {
        if (e.key === 'p' || e.key === 'P') {
            resumeGame();
        }
    }
});

// 按钮事件
document.querySelectorAll('.difficultyBtn').forEach(function(btn) {

    });
});

document.getElementById('pauseBtn').addEventListener('click', function() {

        }

});

document.getElementById('resumeBtn').addEventListener('click', function() {

});

document.getElementById('restartBtn').addEventListener('click', function() {

});

});

document.getElementById('menuBtn').addEventListener('click', function() {

    document.getElementById('startScreen').style.display = 'flex';
    G.state = 'menu';
    if (G.timerInterval) {
        clearInterval(G.timerInterval);
        G.timerInterval = null;
    }
});

function resumeGame() {
    document.getElementById('pauseScreen').style.display = 'none';
    G.state = 'playing';
    G.startTime = Date.now() - G.elapsedTime * 1000;
    G.timerInterval = setInterval(updateTimer, 1000);
}

// ============ 启动 ============
setupCanvas();
bindCanvasEvents();
render();

// ===== 游戏工坊统一广告系统 =====
const GameMonetize = {
	adsterra: { enabled: !/localhost|127\.0\.0\.1/.test(location.hostname) },
	sponsor: { enabled: true, wechatQR: '', alipayQR: '' },
	interstitial: { enabled: true, cooldownMs: 180000, gameCount: 2 },
	_lastInterTime: 0, _deathCount: 0,
	_gameOverDetected: false,
	init() {
		const banner = document.getElementById('adBanner');
		if (banner && this.adsterra.enabled) {
			const s1 = document.createElement('script');
			s1.src = 'https://pl29544740.effectivecpmnetwork.com/de/26/0e/de260e17b6a348e3489772a87b1cedf1.js';
			s1.async = true;
			banner.appendChild(s1);
		}
		const spBtn = document.getElementById('sponsorBtn');
		const spPanel = document.getElementById('sponsorPanel');
		const spClose = document.getElementById('sponsorClose');
		if (spBtn && spPanel && spClose && this.sponsor.enabled) {
			spBtn.onclick = () => { spPanel.style.display = 'flex'; spPanel.style.pointerEvents = 'auto'; };
			spClose.onclick = () => { spPanel.style.display = 'none'; spPanel.style.pointerEvents = 'none'; };
			spPanel.onclick = (e) => { if (e.target === spPanel) { spPanel.style.display = 'none'; spPanel.style.pointerEvents = 'none'; } };
		} else if (spBtn) { spBtn.style.display = 'none'; }
		const skipBtn = document.getElementById('skipInterstitial');
		const interstitial = document.getElementById('interstitialAd');
		if (skipBtn && interstitial) {
			skipBtn.onclick = () => {
				interstitial.style.display = 'none'; interstitial.style.pointerEvents = 'none';
				if (this._reviveCallback) { const cb = this._reviveCallback; this._reviveCallback = null; cb(); }
			};
		}
		// 自动检测游戏结束状态
		this._startGameOverWatcher();
	},
	_startGameOverWatcher() {
		// 检测#restartBtn或包含"重新开始"/"再来一局"的按钮变为可见
		const checkGameOver = () => {
			if (this._gameOverDetected) return;
			// 方法1: 检测#restartBtn可见
			const restartBtn = document.getElementById('restartBtn');
			if (restartBtn && restartBtn.offsetParent !== null && getComputedStyle(restartBtn).display !== 'none') {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
			// 方法2: 检测#gameOverScreen可见
			const goScreen = document.getElementById('gameOverScreen');
			if (goScreen && getComputedStyle(goScreen).display !== 'none') {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
			// 方法3: 检测screen-gameover可见
			const goScreen2 = document.getElementById('screen-gameover');
			if (goScreen2 && !goScreen2.classList.contains('hidden')) {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
		};
		// 每500ms检查一次
		this._goInterval = setInterval(() => {
			checkGameOver();
			// 如果检测到了，等2秒后重置标志，允许下次检测
			if (this._gameOverDetected) {
				setTimeout(() => { this._gameOverDetected = false; }, 2000);
			}
		}, 500);
	},
	requestRevive(callback) {
		this._reviveCallback = callback || null;
		const el = document.getElementById('interstitialAd');
		if (!el) { if (callback) callback(); return; }
		const s2 = document.createElement('script');
		s2.src = 'https://pl29544742.effectivecpmnetwork.com/be/a9/6d/bea96d779c0ee07c2b15613852dd3e70.js';
		s2.async = true;
		document.getElementById('interstitialAdSlot').innerHTML = '';
		document.getElementById('interstitialAdSlot').appendChild(s2);
		el.style.display = 'flex'; el.style.pointerEvents = 'auto';

		setTimeout(() => { const slot = document.getElementById('interstitialAdSlot'); if (slot && slot.innerHTML.includes('加载中')) { slot.innerHTML = '<div style=color:#aaa;font:13px Microsoft YaHei,sans-serif>广告暂时无法加载<br>点击下方按钮继续</div>'; } }, 3000);
		const skipBtn = document.getElementById('skipInterstitial');
		if (skipBtn) {
			skipBtn.textContent = '5 秒后可跳过'; skipBtn.disabled = true;
			let cd = 5;
			const timer = setInterval(() => {
				cd--;
				if (cd <= 0) { clearInterval(timer); skipBtn.textContent = '跳过广告 ▶'; skipBtn.disabled = false; }
				else { skipBtn.textContent = cd + ' 秒后可跳过'; }
			}, 1000);
		}
	},
	onGameOver() {
		this._deathCount++;
		if (!this.interstitial.enabled) return;
		if (this._deathCount < this.interstitial.gameCount) return;
		if (Date.now() - this._lastInterTime < this.interstitial.cooldownMs) return;
		this._lastInterTime = Date.now(); this._deathCount = 0;
		this.requestRevive(null);
	},
};
GameMonetize.init();
</script>
