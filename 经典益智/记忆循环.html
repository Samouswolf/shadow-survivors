<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>记忆循环</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; overflow: hidden; color: #fff; }
        .game-container { width: 100%; height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 10px; }
        .stat { display: flex; flex-direction: column; align-items: center; }
        .stat-label { font-size: 12px; opacity: 0.7; }
        .stat-value { font-size: 24px; font-weight: bold; color: #ff6b6b; }
        
        .game-area { flex: 1; position: relative; background: rgba(0,0,0,0.4); border-radius: 15px; overflow: hidden; }
        #gameCanvas { width: 100%; height: 100%; display: block; }
        
        .loop-indicator { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 10px; font-size: 16px; }
        .memory-bar { position: absolute; bottom: 20px; left: 10px; right: 10px; height: 15px; background: rgba(255,255,255,0.2); border-radius: 7px; overflow: hidden; }
        .memory-fill { height: 100%; background: linear-gradient(90deg, #ff6b6b, #ffa502); transition: width 0.3s; }
        
        .controls { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
        .btn { padding: 12px 25px; border: none; border-radius: 25px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">循环</div>
                <div class="stat-value" id="loop">1</div>
            </div>
            <div class="stat">
                <div class="stat-label">分数</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">最高</div>
                <div class="stat-value" id="highScore">0</div>
            </div>
        </div>
        
        <div class="game-area">
            <canvas id="gameCanvas"></canvas>
            <div class="loop-indicator" id="loopIndicator">🔄 第1次循环</div>
            <div class="memory-bar">
                <div class="memory-fill" id="memoryFill"></div>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" id="btnStart">▶️ 开始游戏</button>
        </div>
        
        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    <script src="game_core.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const GAME_NAME = '记忆循环';
        GameCore.init({ highScore: GAME_NAME });
        
        let loop = 1;
        let score = 0;
        let gameRunning = false;
        let memory = 0;
        let maxMemory = 100;
        
        let player = { x: 50, y: 100, width: 30, height: 50, vx: 0, vy: 0, onGround: false };
        let platforms = [];
        let traps = [];
        let collectibles = [];
        let memoryPoints = [];
        
        let previousCollectibles = [];
        
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            initLevel();
        }
        
        function initLevel() {
            player.x = 50;
            player.y = canvas.height - 100;
            player.vx = 0;
            player.vy = 0;
            
            platforms = [];
            traps = [];
            collectibles = [];
            memoryPoints = [];
            
            const platformCount = 4 + Math.floor(loop / 2);
            for (let i = 0; i < platformCount; i++) {
                platforms.push({
                    x: 100 + i * 150,
                    y: 150 + Math.random() * 200,
                    width: 80 + Math.random() * 60,
                    height: 15,
                    color: '#4ecdc4'
                });
            }
            
            platforms.push({ x: 0, y: canvas.height - 20, width: canvas.width, height: 20, color: '#4a5568' });
            
            const trapCount = Math.floor(loop / 2) + 2;
            for (let i = 0; i < trapCount; i++) {
                traps.push({
                    x: 200 + i * 200,
                    y: canvas.height - 35,
                    width: 60,
                    height: 15,
                    visible: loop > 1 && Math.random() > 0.5,
                    color: '#ff6b6b'
                });
            }
            
            for (let i = 0; i < 3 + loop; i++) {
                const fromPrev = i < previousCollectibles.length && Math.random() > 0.5;
                const pos = fromPrev ? previousCollectibles[i] : {
                    x: 150 + i * 180,
                    y: 100 + Math.random() * 150
                };
                
                collectibles.push({
                    ...pos,
                    collected: false,
                    type: fromPrev ? 'memory' : 'new'
                });
            }
            
            previousCollectibles = collectibles.map(c => ({ x: c.x, y: c.y }));
            
            memoryPoints.push({
                x: canvas.width - 80,
                y: canvas.height - 80,
                width: 50,
                height: 50,
                color: '#a855f7'
            });
        }
        
        function updatePlayer() {
            player.vx *= 0.95;
            player.vy += 0.5;
            
            let onGround = false;
            platforms.forEach(platform => {
                if (player.y + player.height > platform.y &&
                    player.y + player.height < platform.y + platform.height + 10 &&
                    player.x < platform.x + platform.width &&
                    player.x + player.width > platform.x &&
                    player.vy >= 0) {
                    player.y = platform.y - player.height;
                    player.vy = 0;
                    onGround = true;
                }
            });
            player.onGround = onGround;
            
            player.x += player.vx;
            player.y += player.vy;
            
            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
        }
        
        function checkCollisions() {
            traps.forEach(trap => {
                if (player.x < trap.x + trap.width &&
                    player.x + player.width > trap.x &&
                    player.y + player.height > trap.y &&
                    player.y < trap.y + trap.height) {
                    resetLoop();
                }
            });
            
            collectibles.forEach(c => {
                if (!c.collected) {
                    const dx = player.x + player.width / 2 - c.x;
                    const dy = player.y + player.height / 2 - c.y;
                    if (Math.sqrt(dx * dx + dy * dy) < 30) {
                        c.collected = true;
                        score += c.type === 'memory' ? 200 : 100;
                        memory += 10;
                        
                        for (let i = 0; i < 8; i++) {
                            particles.push({
                                x: c.x,
                                y: c.y,
                                vx: (Math.random() - 0.5) * 5,
                                vy: (Math.random() - 0.5) * 5,
                                life: 1,
                                color: c.type === 'memory' ? '#a855f7' : '#ffd700'
                            });
                        }
                    }
                }
            });
            
            memoryPoints.forEach(mp => {
                if (player.x < mp.x + mp.width &&
                    player.x + player.width > mp.x &&
                    player.y < mp.y + mp.height &&
                    player.y + player.height > mp.y) {
                    loop++;
                    score += loop * 1000;
                    memory = Math.min(maxMemory, memory + 20);
                    initLevel();
                }
            });
            
            if (player.y > canvas.height + 100) {
                resetLoop();
            }
            
            updateStats();
        }
        
        function resetLoop() {
            memory -= 20;
            if (memory <= 0) {
                loop = 1;
                memory = 0;
                score = 0;
            }
            
            initLevel();
            updateStats();
        }
        
        function updateParticles() {
            particles = particles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;
                return p.life > 0;
            });
        }
        
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 时间流动效果
            for (let i = 0; i < 30; i++) {
                const x = (i * 53 + Date.now() / 50) % canvas.width;
                const y = (i * 37) % canvas.height;
                ctx.fillStyle = `rgba(168, 85, 247, ${0.05 + Math.sin(Date.now() / 1000 + i) * 0.03})`;
                ctx.beginPath();
                ctx.arc(x, y, 2, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // 平台
            platforms.forEach(platform => {
                ctx.fillStyle = platform.color;
                ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
            });
            
            // 陷阱
            traps.forEach(trap => {
                if (trap.visible || memory > 50) {
                    ctx.fillStyle = trap.color;
                    ctx.fillRect(trap.x, trap.y, trap.width, trap.height);
                } else {
                    ctx.fillStyle = '#4a5568';
                    ctx.fillRect(trap.x, trap.y, trap.width, trap.height);
                    ctx.strokeStyle = 'rgba(255,107,107,0.3)';
                    ctx.strokeRect(trap.x, trap.y, trap.width, trap.height);
                }
            });
            
            // 收集物
            collectibles.forEach(c => {
                if (!c.collected) {
                    ctx.fillStyle = c.type === 'memory' ? '#a855f7' : '#ffd700';
                    ctx.shadowColor = c.type === 'memory' ? '#a855f7' : '#ffd700';
                    ctx.shadowBlur = c.type === 'memory' ? 15 : 10;
                    ctx.font = '24px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(c.type === 'memory' ? '💭' : '⭐', c.x, c.y + 8);
                    ctx.shadowBlur = 0;
                }
            });
            
            // 记忆点
            memoryPoints.forEach(mp => {
                ctx.fillStyle = mp.color;
                ctx.shadowColor = mp.color;
                ctx.shadowBlur = 20;
                ctx.fillRect(mp.x, mp.y, mp.width, mp.height);
                ctx.shadowBlur = 0;
                
                ctx.fillStyle = '#fff';
                ctx.font = '24px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('🔮', mp.x + mp.width / 2, mp.y + mp.height / 2 + 8);
            });
            
            // 玩家
            ctx.fillStyle = '#f5576c';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            
            // 粒子
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }
        
        let particles = [];
        
        function updateStats() {
            document.getElementById('loop').textContent = loop;
            document.getElementById('score').textContent = score;
            document.getElementById('highScore').textContent = GameCore.highScore.get(GAME_NAME);
            document.getElementById('loopIndicator').textContent = '🔄 第' + loop + '次循环';
            document.getElementById('memoryFill').style.width = memory + '%';
            
            if (GameCore.highScore.set(GAME_NAME, score)) {
                GameCore.hints.show('新纪录！分数: ' + score);
            }
        }
        
        function gameLoop() {
            draw();
            
            if (gameRunning) {
                updatePlayer();
                checkCollisions();
                updateParticles();
            }
            
            updateStats();
            requestAnimationFrame(gameLoop);
        }
        
        document.addEventListener('keydown', e => {
            if (!gameRunning) return;
            
            if (e.code === 'ArrowRight' || e.code === 'KeyD') player.vx = 5;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') player.vx = -5;
            if (e.code === 'ArrowUp' || e.code === 'KeyW') {
                if (player.onGround) {
                    player.vy = -12;
                    player.onGround = false;
                }
            }
        });
        
        document.addEventListener('keyup', e => {
            if (e.code === 'ArrowRight' || e.code === 'KeyD' || e.code === 'ArrowLeft' || e.code === 'KeyA') player.vx = 0;
        });
        
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            if (!gameRunning) return;
            
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            
            if (x < canvas.width / 2) {
                player.vx = -5;
            } else {
                player.vx = 5;
            }
            
            if (player.onGround) {
                player.vy = -12;
                player.onGround = false;
            }
        }, { passive: false });
        
        canvas.addEventListener('touchend', () => {
            player.vx = 0;
        });
        
        document.getElementById('btnStart').onclick = () => {
            gameRunning = true;
            loop = 1;
            score = 0;
            memory = 0;
            initLevel();
        };
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        gameLoop();
    </script>
</body>
</html>
