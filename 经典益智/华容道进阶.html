;(function(){
  var G = (typeof window !== 'undefined') ? window : (typeof globalThis !== 'undefined' ? globalThis : this);
  // 浏览器已有 Storage 构造函数，需确保其带 load/save/remove 静态方法
  var S = G.Storage;
  var needAttach = (typeof S === 'undefined' || typeof S.load !== 'function' || typeof S.save !== 'function');
  if (!needAttach) return;
  if (typeof S === 'undefined') { S = function(){}; G.Storage = S; }
  function parseSafe(s, d){
    if (s === null || s === undefined) return d;
    try { return JSON.parse(s); } catch(e) { try { return s; } catch(e2){ return d; } }
  }
  S.load = function(k, d){ try { return parseSafe(localStorage.getItem(k), d); } catch(e){ return d; } };
  S.save = function(k, v){ try { localStorage.setItem(k, typeof v==='string'?v:JSON.stringify(v)); } catch(e){} };
  S.remove = function(k){ try { localStorage.removeItem(k); } catch(e){} };
})();

"use strict";

// ==================== 音频系统 ====================
let AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function ensureAudio(){if(!audioCtx)audioCtx=new AudioCtx()}
function playTone(freq,dur,type){
    try{ensureAudio();let o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(freq,audioCtx.currentTime);
    g.gain.setValueAtTime(0.12,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
    o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur);}catch(e){}
}

function sfxClick(){playTone(800,0.05,'square')}

// ==================== 游戏状态 ====================

// ==================== 工具函数 ====================
function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
    ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);
    ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);
    ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);
    ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
}
function shadeColor(hex,amt){
    let n=parseInt(hex.replace('#',''),16);
    let r=Math.min(255,Math.max(0,(n>>16)+amt));
    let g=Math.min(255,Math.max(0,((n>>8)&0xff)+amt));
    let b=Math.min(255,Math.max(0,(n&0xff)+amt));
    return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function formatTime(s){
    let m=Math.floor(s/60),ss=s%60;
    return (m<10?'0':'')+m+':'+(ss<10?'0':'')+ss;
}
function lerp(a,b,t){return a+(b-a)*t}

// ==================== 关卡加载 ====================
function buildBlocks(levelIdx){
    const lv=LEVELS[levelIdx];
    const blocks=[];
    lv.blocks.forEach((bd,i)=>{
        const pt=PIECE_TYPES[bd.t];
        blocks.push({type:bd.t,col:bd.c,row:bd.r,w:pt.w,h:pt.h,id:i});
    });
    return blocks;
}

function buildGrid(blocks){
    const grid=Array.from({length:ROWS},()=>Array(COLS).fill(-1));
    blocks.forEach((b,i)=>{
        for(let r=b.row;r<b.row+b.h;r++)
            for(let c=b.col;c<b.col+b.w;c++)
                grid[r][c]=i;
    });
    return grid;
}

function loadLevel(idx){
    G.level=idx;
    G.blocks=buildBlocks(idx);
    G.grid=buildGrid(G.blocks);
    G.steps=0;G.timer=0;
    G.selectedBlock=null;
    G.moveHistory=[];
    G.hintPiece=null;G.hintDC=0;G.hintDR=0;
    G.showSolvePanel=false;
    if(G.timerInterval)clearInterval(G.timerInterval);
    G.timerInterval=setInterval(()=>{if(G.state==='playing')G.timer++},1000);
    G.state='playing';
    // 预计算最优解
    precomputeOptimal(idx);
}

// ==================== 移动逻辑 ====================
function canMove(blocks,grid,bi,dc,dr){
    const b=blocks[bi];
    const nc=b.col+dc, nr=b.row+dr;
    if(nc<0||nr<0||nc+b.w>COLS||nr+b.h>ROWS)return false;
    for(let r=nr;r<nr+b.h;r++)
        for(let c=nc;c<nc+b.w;c++)
            if(grid[r][c]!==-1&&grid[r][c]!==bi)return false;
    return true;
}

function getValidMoves(blocks,grid){
    const moves=[];
    for(let i=0;i<blocks.length;i++){
        for(const [dc,dr] of [[0,-1],[0,1],[-1,0],[1,0]]){
            if(canMove(blocks,grid,i,dc,dr))
                moves.push({id:i,dc,dr});
        }
    }
    return moves;
}

function applyMove(blocks,bi,dc,dr){
    const nb=blocks.map(b=>({...b}));
    nb[bi]={...nb[bi],col:nb[bi].col+dc,row:nb[bi].row+dr};
    return nb;
}

function moveBlock(bi,dc,dr){
    const b=G.blocks[bi];
    // 清除旧位置
    for(let r=b.row;r<b.row+b.h;r++)
        for(let c=b.col;c<b.col+b.w;c++)
            G.grid[r][c]=-1;
    G.moveHistory.push({id:bi,col:b.col,row:b.row});
    b.col+=dc;b.row+=dr;
    // 标记新位置
    for(let r=b.row;r<b.row+b.h;r++)
        for(let c=b.col;c<b.col+b.w;c++)
            G.grid[r][c]=bi;
    G.steps++;
    G.hintPiece=null;
    sfxMove();
}

function undoMove(){
    if(G.moveHistory.length===0)return;
    const m=G.moveHistory.pop();
    const b=G.blocks[m.id];
    for(let r=b.row;r<b.row+b.h;r++)
        for(let c=b.col;c<b.col+b.w;c++)
            G.grid[r][c]=-1;
    b.col=m.col;b.row=m.row;
    for(let r=b.row;r<b.row+b.h;r++)
        for(let c=b.col;c<b.col+b.w;c++)
            G.grid[r][c]=m.id;
    G.steps--;
    G.hintPiece=null;
    sfxClick();
}

function checkWin(){
    const cao=G.blocks[0]; // 曹操始终第一个
    return cao.col===EXIT_COL && cao.row===EXIT_ROW;
}

function onWin(){
    G.state='win';
    if(G.timerInterval)clearInterval(G.timerInterval);
    sfxWin();
    const key=''+G.level;
    if(!G.bestSteps[key]||G.steps<G.bestSteps[key])G.bestSteps[key]=G.steps;
    if(!G.bestTime[key]||G.timer<G.bestTime[key])G.bestTime[key]=G.timer;
    G.completed[key]=true;
    G.streak++;
    saveData();
    // 显示插屏广告
    if(typeof showInterstitialAd==='function')showInterstitialAd();
}

// ==================== BFS求解器 ====================
function encodeState(blocks){
    // 按类型+位置排序以规范化
    const order={C:0,G:1,Z:2,S:3};
    const sorted=[...blocks].map((b,i)=>({...b,i})).sort((a,b)=>{
        if(order[a.type]!==order[b.type])return order[a.type]-order[b.type];
        if(a.col!==b.col)return a.col-b.col;
        return a.row-b.row;
    });
    return sorted.map(b=>b.type+b.col+','+b.row).join('|');
}

function bfsSolve(blocks,maxDepth=200){
    const startBlocks=blocks.map(b=>({...b}));
    const startKey=encodeState(startBlocks);

    // 已在目标位置
    if(startBlocks[0].col===EXIT_COL && startBlocks[0].row===EXIT_ROW)return [];

    const visited=new Map();
    visited.set(startKey,null);
    const queue=[{blocks:startBlocks,key:startKey,depth:0}];
    let head=0;

    while(head<queue.length){
        const {blocks:cur,key:curKey,depth}=queue[head++];
        if(depth>=maxDepth)continue;

        const grid=buildGrid(cur);
        const moves=getValidMoves(cur,grid);

        for(const m of moves){
            const nb=applyMove(cur,m.id,m.dc,m.dr);
            const nk=encodeState(nb);
            if(visited.has(nk))continue;

            visited.set(nk,{parent:curKey,move:m,blocks:nb});
            // 检查是否到达目标
            if(nb[0].col===EXIT_COL && nb[0].row===EXIT_ROW){
                // 重构路径
                const path=[];
                let k=nk;
                while(visited.has(k)){
                    const entry=visited.get(k);
                    if(!entry||!entry.move)break;
                    path.unshift(entry.move);
                    k=entry.parent;
                    if(!k)break;
                }
                return path;
            }

            queue.push({blocks:nb,key:nk,depth:depth+1});
        }

        // 安全限制
        if(queue.length>200000)break;
    }
    return null; // 无解
}

function precomputeOptimal(levelIdx){
    const key=''+levelIdx;
    if(G.optimalSteps[key]!==undefined)return;
    // 异步计算
    setTimeout(()=>{
        if(G.bfsRunning)return;
        G.bfsRunning=true;
        const blocks=buildBlocks(levelIdx);
        const path=bfsSolve(blocks,200);
        G.optimalSteps[key]=path?path.length:'?';
        G.bfsRunning=false;
        saveData();
    },100);
}

function getHint(){
    if(G.bfsRunning)return null;
    G.bfsRunning=true;
    const path=bfsSolve(G.blocks,200);
    G.bfsRunning=false;
    if(path&&path.length>0){
        G.hintPiece=path[0].id;
        G.hintDC=path[0].dc;
        G.hintDR=path[0].dr;
        G.hintTimer=120; // 2秒闪烁
        sfxHint();
        return path[0];
    }
    return null;
}

// ==================== 渲染 ====================
function render(){
    const ctx=G.ctx,W=G.W,H=G.H;
    ctx.clearRect(0,0,W,H);

    // 背景
    const bgGrad=ctx.createRadialGradient(W/2,H/3,0,W/2,H/2,W);
    bgGrad.addColorStop(0,'#1e1508');
    bgGrad.addColorStop(1,'#0c0704');
    ctx.fillStyle=bgGrad;
    ctx.fillRect(0,0,W,H);

    // 装饰纹理
    ctx.globalAlpha=0.03;
    for(let i=0;i<W;i+=40)
        for(let j=0;j<H;j+=40)
            ctx.fillRect(i,j,20,20);
    ctx.globalAlpha=1;

    if(G.state==='menu')renderMenu(ctx,W,H);
    else if(G.state==='win')renderWin(ctx,W,H);
    else renderGame(ctx,W,H);
}

function renderMenu(ctx,W,H){
    // 标题区
    const titleY=H*0.08;
    ctx.fillStyle='#c9a34e';
    ctx.font='bold '+Math.floor(W>500?52:36)+'px "KaiTi","STKaiti","Microsoft YaHei",sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('华容道',W/2,titleY+30);

    ctx.fillStyle='#8a7a5a';
    ctx.font=(W>500?22:16)+'px "Microsoft YaHei",sans-serif';
    ctx.fillText('—— 数字华容道进阶版 ——',W/2,titleY+62);

    // 已完成统计
    const doneCount=Object.keys(G.completed).length;
    ctx.fillStyle='#6a5a3a';
    ctx.font=(W>500?14:12)+'px "Microsoft YaHei",sans-serif';
    ctx.fillText('已通关 '+doneCount+'/'+LEVELS.length+' 关',W/2,titleY+88);

    // 关卡网格
    const cols=W>600?5:W>400?4:3;
    const cardW=Math.min(110,W/cols-12);
    const cardH=cardW*1.15;
    const gap=8;
    const gridW=cols*(cardW+gap)-gap;
    const startX=(W-gridW)/2;
    const startY=titleY+110;

    LEVELS.forEach((lv,i)=>{
        const col=i%cols, row=Math.floor(i/cols);
        const cx=startX+col*(cardW+gap), cy=startY+row*(cardH+gap);
        const key=''+i;
        const done=G.completed[key];
        const best=G.bestSteps[key];
        const opt=G.optimalSteps[key];

        // 卡片背景
        const alpha=done?0.18:0.08;
        ctx.fillStyle='rgba(201,163,78,'+alpha+')';
        roundRect(ctx,cx,cy,cardW,cardH,10);
        ctx.fill();
        ctx.strokeStyle=done?'rgba(201,163,78,0.5)':'rgba(201,163,78,0.25)';
        ctx.lineWidth=done?2:1;
        roundRect(ctx,cx,cy,cardW,cardH,10);
        ctx.stroke();

        // 关卡号
        ctx.fillStyle=done?'#c9a34e':'#6a5a3a';
        ctx.font='bold '+(cardW>80?16:12)+'px "Microsoft YaHei",sans-serif';
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText('第'+(i+1)+'关',cx+cardW/2,cy+cardH*0.28);

        // 关卡名
        ctx.fillStyle=done?'#e8d5a0':'#8a7a5a';
        ctx.font='bold '+(cardW>80?14:11)+'px "Microsoft YaHei",sans-serif';
        ctx.fillText(lv.name,cx+cardW/2,cy+cardH*0.52);

        // 最佳/最优
        if(done&&best){
            ctx.fillStyle='#c9a34e';
            ctx.font=(cardW>80?12:10)+'px "Microsoft YaHei",sans-serif';
            let txt='最佳 '+best+'步';
            if(opt&&opt!=='?'&&best==opt)txt+=' ★';
            ctx.fillText(txt,cx+cardW/2,cy+cardH*0.74);
        }else if(opt&&opt!=='?'){
            ctx.fillStyle='#6a5a3a';
            ctx.font=(cardW>80?11:9)+'px "Microsoft YaHei",sans-serif';
            ctx.fillText('最优 '+opt+'步',cx+cardW/2,cy+cardH*0.74);
        }

        // 完成标记
        if(done){
            ctx.fillStyle='rgba(201,163,78,0.6)';
            ctx.font=(cardW>80?20:16)+'px "Microsoft YaHei",sans-serif';
            ctx.fillText('✓',cx+cardW-18,cy+18);
        }
    });
}

function renderGame(ctx,W,H){
    // 计算布局
    const topBarH=Math.min(50,H*0.08);
    const bottomBarH=Math.min(60,H*0.1);
    const adH=70;
    const availH=H-topBarH-bottomBarH-adH;
    const maxCellW=(W*0.88)/COLS;
    const maxCellH=availH/ROWS;
    G.cellSize=Math.floor(Math.min(maxCellW,maxCellH,110));
    G.boardX=Math.floor((W-COLS*G.cellSize)/2);
    G.boardY=Math.floor(topBarH+(availH-ROWS*G.cellSize)/2);

    // 顶部栏
    const lv=LEVELS[G.level];
    ctx.fillStyle='rgba(0,0,0,0.4)';
    ctx.fillRect(0,0,W,topBarH);

    ctx.fillStyle='#c9a34e';
    ctx.font='bold '+Math.floor(W>500?18:15)+'px "Microsoft YaHei",sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('第'+(G.level+1)+'关 · '+lv.name,W/2,topBarH/2);

    // 步数和时间
    ctx.fillStyle='#e8d5a0';
    ctx.font=(W>500?15:13)+'px "Microsoft YaHei",sans-serif';
    ctx.textAlign='left';
    ctx.fillText('步数:'+G.steps,10,topBarH/2);
    ctx.textAlign='right';
    ctx.fillText(formatTime(G.timer),W-10,topBarH/2);

    // 最优步数
    const key=''+G.level;
    const opt=G.optimalSteps[key];
    if(opt&&opt!=='?'){
        ctx.fillStyle='#6a5a3a';
        ctx.font=(W>500?12:10)+'px "Microsoft YaHei",sans-serif';
        ctx.textAlign='right';
        ctx.fillText('最优:'+opt+'步',W-10,topBarH-8);
    }

    // 绘制棋盘
    renderBoard(ctx);

    // 底部栏
    const btnY=G.boardY+ROWS*G.cellSize+8;
    const btnW=Math.min(70,W*0.17);
    const btnH=Math.min(36,H*0.06);
    const btns=[
        {label:'撤销',action:'undo'},
        {label:'提示',action:'hint'},
        {label:'重来',action:'restart'},
        {label:'菜单',action:'menu'}
    ];
    const totalW=btns.length*(btnW+8)-8;
    const sx=(W-totalW)/2;

    btns.forEach((btn,i)=>{
        const bx=sx+i*(btnW+8);
        const by=btnY;
        ctx.fillStyle='rgba(201,163,78,0.12)';
        roundRect(ctx,bx,by,btnW,btnH,6);
        ctx.fill();
        ctx.strokeStyle='rgba(201,163,78,0.35)';
        ctx.lineWidth=1;
        roundRect(ctx,bx,by,btnW,btnH,6);
        ctx.stroke();
        ctx.fillStyle='#e8d5a0';
        ctx.font=(W>500?13:11)+'px "Microsoft YaHei",sans-serif';
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(btn.label,bx+btnW/2,by+btnH/2);
    });

    // 提示高亮
    if(G.hintPiece!==null&&G.hintTimer>0){
        G.hintTimer--;
        const b=G.blocks[G.hintPiece];
        const pt=PIECE_TYPES[b.type];
        const x=G.boardX+b.col*G.cellSize;
        const y=G.boardY+b.row*G.cellSize;
        const w=b.w*G.cellSize, h=b.h*G.cellSize;
        const alpha=0.3+0.3*Math.sin(G.hintTimer*0.3);
        ctx.fillStyle='rgba(255,215,0,'+alpha+')';
        roundRect(ctx,x-3,y-3,w+6,h+6,8);
        ctx.fill();
        // 方向箭头
        const cx2=x+w/2+G.hintDC*G.cellSize*0.6;
        const cy2=y+h/2+G.hintDR*G.cellSize*0.6;
        ctx.fillStyle='rgba(255,215,0,0.8)';
        ctx.font='bold 20px "Microsoft YaHei",sans-serif';
        ctx.textAlign='center';ctx.textBaseline='middle';
        const arrows={'-1,0':'◀','1,0':'▶','0,-1':'▲','0,1':'▼'};
        ctx.fillText(arrows[G.hintDC+','+G.hintDR]||'→',cx2,cy2);
        if(G.hintTimer<=0){G.hintPiece=null;G.hintDC=0;G.hintDR=0;}
    }
}

function renderBoard(ctx){
    const cs=G.cellSize, bx=G.boardX, by=G.boardY;

    // 棋盘外框（中国风）
    ctx.fillStyle='#2a1a0a';
    roundRect(ctx,bx-8,by-8,COLS*cs+16,ROWS*cs+16,12);
    ctx.fill();
    ctx.strokeStyle='#5a4a2a';
    ctx.lineWidth=2.5;
    roundRect(ctx,bx-8,by-8,COLS*cs+16,ROWS*cs+16,12);
    ctx.stroke();
    // 内框
    ctx.strokeStyle='#3a2a15';
    ctx.lineWidth=1;
    roundRect(ctx,bx-3,by-3,COLS*cs+6,ROWS*cs+6,8);
    ctx.stroke();

    // 网格线
    ctx.strokeStyle='#3a2a15';
    ctx.lineWidth=0.5;
    for(let r=0;r<=ROWS;r++){
        ctx.beginPath();ctx.moveTo(bx,by+r*cs);ctx.lineTo(bx+COLS*cs,by+r*cs);ctx.stroke();
    }
    for(let c=0;c<=COLS;c++){
        ctx.beginPath();ctx.moveTo(bx+c*cs,by);ctx.lineTo(bx+c*cs,by+ROWS*cs);ctx.stroke();
    }

    // 出口标记
    const ex=bx+EXIT_COL*cs;
    ctx.fillStyle='rgba(231,76,60,0.15)';
    ctx.fillRect(ex,by-2,cs*2,6);
    const arrowGrad=ctx.createLinearGradient(ex,by-18,ex+cs*2,by-18);
    arrowGrad.addColorStop(0,'rgba(231,76,60,0)');
    arrowGrad.addColorStop(0.5,'rgba(231,76,60,0.7)');
    arrowGrad.addColorStop(1,'rgba(231,76,60,0)');
    ctx.fillStyle=arrowGrad;
    ctx.fillRect(ex+2,by-18,cs*2-4,2);
    ctx.fillStyle='#e74c3c';
    ctx.font='bold '+Math.floor(cs*0.22)+'px "Microsoft YaHei",sans-serif';
    ctx.textAlign='center';
    ctx.fillText('▼ 出口 ▼',ex+cs,by-22);

    // 绘制所有方块
    G.blocks.forEach(b=>renderPiece(ctx,b,cs,bx,by));
}

function renderPiece(ctx,b,cs,bx,by){
    const pt=PIECE_TYPES[b.type];
    const x=bx+b.col*cs, y=by+b.row*cs;
    const w=b.w*cs, h=b.h*cs;
    const pad=Math.max(2,cs*0.04);

    // 阴影
    ctx.fillStyle='rgba(0,0,0,0.35)';
    roundRect(ctx,x+pad+2,y+pad+2,w-pad*2,h-pad*2,6);
    ctx.fill();

    // 主体渐变
    const grad=ctx.createLinearGradient(x,y,x,y+h);
    grad.addColorStop(0,pt.color);
    grad.addColorStop(0.5,shadeColor(pt.color,20));
    grad.addColorStop(1,shadeColor(pt.color,-25));
    ctx.fillStyle=grad;
    roundRect(ctx,x+pad,y+pad,w-pad*2,h-pad*2,6);
    ctx.fill();

    // 高光
    ctx.fillStyle='rgba(255,255,255,0.12)';
    roundRect(ctx,x+pad+2,y+pad+2,w-pad*2-4,(h-pad*2)/2-2,4);
    ctx.fill();

    // 边框
    ctx.strokeStyle=shadeColor(pt.color,40);
    ctx.lineWidth=1.5;
    roundRect(ctx,x+pad,y+pad,w-pad*2,h-pad*2,6);
    ctx.stroke();

    // 选中高亮
    if(G.selectedBlock===b){
        ctx.strokeStyle='rgba(255,215,0,0.7)';
        ctx.lineWidth=2.5;
        roundRect(ctx,x+pad-1,y+pad-1,w-pad*2+2,h-pad*2+2,7);
        ctx.stroke();
    }

    // 文字
    if(pt.label){
        ctx.fillStyle='#fff';
        let fontSize=Math.min(w,h)*0.38;
        if(b.type==='C')fontSize*=0.85;
        ctx.font='bold '+Math.floor(fontSize)+'px "KaiTi","STKaiti","Microsoft YaHei",sans-serif';
        ctx.textAlign='center';ctx.textBaseline='middle';
        // 文字阴影
        ctx.fillStyle='rgba(0,0,0,0.3)';
        ctx.fillText(pt.label,x+w/2+1,y+h/2+1);
        ctx.fillStyle='#fff';
        ctx.fillText(pt.label,x+w/2,y+h/2);
    }

    // 曹操金边
    if(b.type==='C'){
        ctx.strokeStyle='rgba(255,215,0,0.5)';
        ctx.lineWidth=2;
        roundRect(ctx,x+pad+2,y+pad+2,w-pad*2-4,h-pad*2-4,4);
        ctx.stroke();
    }
}

function renderWin(ctx,W,H){
    // 背景
    ctx.fillStyle='rgba(0,0,0,0.85)';

    ctx.fillText('用时',W/2-80,statsY+lineH);
    ctx.fillStyle='#e8d5a0';

        ctx.strokeStyle=bl.enabled?'rgba(201,163,78,0.5)':'rgba(201,163,78,0.2)';
        ctx.lineWidth=1.5;
        roundRect(ctx,(W-btnW)/2,by,btnW,btnH,8);
        ctx.stroke();
        ctx.fillStyle=bl.enabled?'#e8d5a0':'#5a4a2a';
        ctx.font='bold '+(W>500?17:14)+'px "Microsoft YaHei",sans-serif';
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(bl.text,W/2,by+btnH/2);
    });
}

// ==================== 输入处理 ====================
function setupInput(){
    const cv=G.canvas;

    function getPos(e){
        const rect=cv.getBoundingClientRect();
        if(e.touches)return{x:(e.touches[0]||e.changedTouches[0]).clientX-rect.left,y:(e.touches[0]||e.changedTouches[0]).clientY-rect.top};
        return{x:e.clientX-rect.left,y:e.clientY-rect.top};
    }

    function hitBlock(px,py){
        const cs=G.cellSize,bx=G.boardX,by=G.boardY;
        for(let i=G.blocks.length-1;i>=0;i--){
            const b=G.blocks[i];
            const x=bx+b.col*cs, y=by+b.row*cs;
            if(px>=x&&px<=x+b.w*cs&&py>=y&&py<=y+b.h*cs)return b;
        }
        return null;
    }

    function onDown(e){
        e.preventDefault();
        const pos=getPos(e);

        if(G.state==='win'){
            handleWinClick(pos);return;
        }
        if(G.state==='menu'){
            handleMenuClick(pos);return;
        }
        if(G.state!=='playing')return;

        G.pointerDown=true;
        G.startPX=pos.x;G.startPY=pos.y;

        const b=hitBlock(pos.x,pos.y);
        if(b){
            G.selectedBlock=b;
            G.startBRow=b.row;G.startBCol=b.col;
            sfxClick();
        }else{
            // 检查底部按钮
            handleGameBtnClick(pos);
        }
    }

    function onMove(e){
        e.preventDefault();
        if(!G.pointerDown||G.state!=='playing'||!G.selectedBlock)return;
        const pos=getPos(e);
        const dx=pos.x-G.startPX, dy=pos.y-G.startPY;
        const threshold=G.cellSize*0.25;
        if(Math.abs(dx)<threshold&&Math.abs(dy)<threshold)return;

        const bi=G.selectedBlock.id;
        let dc=0,dr=0;
        if(Math.abs(dx)>Math.abs(dy))dc=dx>0?1:-1;
        else dr=dy>0?1:-1;

        if(canMove(G.blocks,G.grid,bi,dc,dr)){
            moveBlock(bi,dc,dr);
            G.startPX=pos.x;G.startPY=pos.y;
            if(checkWin())onWin();
        }
    }

    function onUp(e){
        e.preventDefault();
        G.pointerDown=false;
    }

    cv.addEventListener('mousedown',onDown);
    cv.addEventListener('mousemove',onMove);
    cv.addEventListener('mouseup',onUp);
    cv.addEventListener('touchstart',onDown,{passive:false});
    cv.addEventListener('touchmove',onMove,{passive:false});
    cv.addEventListener('touchend',onUp,{passive:false});

    // 键盘控制
    document.addEventListener('keydown',e=>{
        if(G.state==='win'){
            if(e.key==='Enter'||e.key===' '){
                if(G.level<LEVELS.length-1){G.level++;loadLevel(G.level);}
                else G.state='menu';
                sfxClick();
            }
            if(e.key==='Escape'||e.key==='m'){G.state='menu';sfxClick();}
            return;
        }
        if(G.state==='menu'){
            const k=parseInt(e.key);
            if(k>=1&&k<=9){G.level=k-1;if(k-1<LEVELS.length){loadLevel(k-1);sfxClick();}}
            return;
        }
        if(G.state!=='playing')return;

        const b=G.selectedBlock;
        let dc=0,dr=0;
        switch(e.key){
            case'ArrowLeft':case'a':dc=-1;break;
            case'ArrowRight':case'd':dc=1;break;
            case'ArrowUp':case'w':dr=-1;break;
            case'ArrowDown':case's':dr=1;break;
            case'z':case'Z':undoMove();return;
            case'h':case'H':getHint();return;
            case'r':case'R':loadLevel(G.level);sfxClick();return;
            case'Escape':case'm':G.state='menu';if(G.timerInterval)clearInterval(G.timerInterval);sfxClick();return;
            default:return;
        }
        e.preventDefault();
        if(b&&(dc!==0||dr!==0)){
            if(canMove(G.blocks,G.grid,b.id,dc,dr)){
                moveBlock(b.id,dc,dr);
                if(checkWin())onWin();
            }
        }
    });
}

function handleGameBtnClick(pos){
    const W=G.W;
    const btnY=G.boardY+ROWS*G.cellSize+8;
    const btnW=Math.min(70,W*0.17);
    const btnH=Math.min(36,G.H*0.06);
    const btns=['undo','hint','restart','menu'];
    const totalW=btns.length*(btnW+8)-8;
    const sx=(W-totalW)/2;

    for(let i=0;i<btns.length;i++){
        const bx=sx+i*(btnW+8);
        if(pos.x>=bx&&pos.x<=bx+btnW&&pos.y>=btnY&&pos.y<=btnY+btnH){
            switch(btns[i]){
                case'undo':undoMove();break;
                case'hint':getHint();break;
                case'restart':loadLevel(G.level);sfxClick();break;
                case'menu':G.state='menu';if(G.timerInterval)clearInterval(G.timerInterval);sfxClick();break;
            }
            return;
        }
    }
}

function handleMenuClick(pos){
    const W=G.W,H=G.H;
    const titleY=H*0.08;
    const cols=W>600?5:W>400?4:3;
    const cardW=Math.min(110,W/cols-12);
    const cardH=cardW*1.15;
    const gap=8;
    const gridW=cols*(cardW+gap)-gap;
    const startX=(W-gridW)/2;
    const startY=titleY+110;

    for(let i=0;i<LEVELS.length;i++){
        const col=i%cols, row=Math.floor(i/cols);
        const cx=startX+col*(cardW+gap), cy=startY+row*(cardH+gap);
        if(pos.x>=cx&&pos.x<=cx+cardW&&pos.y>=cy&&pos.y<=cy+cardH){
            G.level=i;loadLevel(i);sfxClick();return;
        }
    }
}

function handleWinClick(pos){
    const W=G.W,H=G.H;
    const btnW=Math.min(180,W*0.42);
    const btnH=Math.min(44,H*0.07);
    const statsY=H*0.32;
    const lineH=Math.min(36,H*0.06);
    const btnStartY=statsY+lineH*3+20;
    const btnGap=12;
    const btnLabels=[
        {text:'下一关',action:'next',enabled:G.level<LEVELS.length-1},
        {text:'重玩本关',action:'replay',enabled:true},
        {text:'返回菜单',action:'menu',enabled:true}
    ];

    btnLabels.forEach((bl,i)=>{
        const by=btnStartY+i*(btnH+btnGap);
        if(pos.x>=(W-btnW)/2&&pos.x<=(W+btnW)/2&&pos.y>=by&&pos.y<=by+btnH){
            if(!bl.enabled)return;
            switch(bl.action){
                case'next':G.level++;loadLevel(G.level);sfxClick();break;
                case'replay':loadLevel(G.level);sfxClick();break;
                case'menu':G.state='menu';sfxClick();break;
            }
        }
    });
}

// ==================== 响应式布局 ====================
function resize(){
    G.dpr=window.devicePixelRatio||1;
    G.W=window.innerWidth;G.H=window.innerHeight;
    G.canvas.width=G.W*G.dpr;
    G.canvas.height=G.H*G.dpr;
    G.canvas.style.width=G.W+'px';
    G.canvas.style.height=G.H+'px';
    G.ctx.setTransform(G.dpr,0,0,G.dpr,0,0);
}
window.addEventListener('resize',resize);

// ==================== 游戏循环 ====================
function gameLoop(){
    if (G.state === 'menu') {
        document.getElementById('startScreen').classList.remove('hidden');
    }
    render();
    requestAnimationFrame(gameLoop);
}

// ==================== 初始化 ====================
function init(){
    G.canvas=document.getElementById('C');
    G.ctx=G.canvas.getContext('2d');
    loadData();
    resize();
    setupInput();
    // 预计算所有关卡最优解
    setTimeout(()=>{
        for(let i=0;i<Math.min(LEVELS.length,5);i++)precomputeOptimal(i);
    },500);
    // 延迟加载剩余关卡的最优解
    setTimeout(()=>{
        for(let i=5;i<LEVELS.length;i++)precomputeOptimal(i);
    },3000);
    requestAnimationFrame(gameLoop);
    // 开始界面
    const startScreen = document.getElementById('startScreen');
    const startBtn = document.getElementById('startBtn');
    startBtn.addEventListener('click', () => {
        startScreen.classList.add('hidden');
        loadLevel(0);
    });
}
