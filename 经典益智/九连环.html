        // 音效支持
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq = 440, duration = 0.1) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

<script>
// ==================== 配置 ====================
const RING_COUNT = 9;
const OPTIMAL_MOVES = 341;

// ==================== DOM 引用 ====================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const elMoveCount = document.getElementById('moveCount');
const elRingsLeft = document.getElementById('ringsLeft');
const btnHint = document.getElementById('btnHint');
const btnUndo = document.getElementById('btnUndo');
const btnAuto = document.getElementById('btnAuto');
const btnReset = document.getElementById('btnReset');
const speedSelector = document.getElementById('speedSelector');
const sponsorBtn = document.getElementById('sponsorBtn');
const sponsorPanel = document.getElementById('sponsorPanel');
const sponsorClose = document.getElementById('sponsorClose');
const interstitialAd = document.getElementById('interstitialAd');
const adClose = document.getElementById('adClose');
const successOverlay = document.getElementById('successOverlay');
const resultMoves = document.getElementById('resultMoves');
const starsDisplay = document.getElementById('starsDisplay');
const btnReplay = document.getElementById('btnReplay');

// ==================== 游戏状态 ====================
let rings = [true, true, true, true, true, true, true, true, true]; // true=在横杆上
let moveCount = 0;
let history = [];
let hintActive = false;
let autoSolving = false;
let autoSolveTimer = null;
let autoSolveSpeed = 150;
let autoSolveSeq = [];
let autoSolveIdx = 0;
let gameCompleted = false;
let gameStarted = false;

// 动画状态
let ringAnimY = [];    // 当前视觉Y
let ringTargetY = [];  // 目标Y
let ringPulse = [];    // 脉冲相位 (用于提示/自动演示高亮)

// Canvas 布局参数
let barY, barHeight, handleTopY, handleLength, loopRadius;
let ringRadius, ringThickness, ringOnY, ringOffY, ringSpacing, startX;
let ringX = [];

// ==================== 规则逻辑 ====================
function canToggle(index) {
  if (index < 0 || index >= RING_COUNT) return false;
  if (index === 0) return true;
  if (!rings[index - 1]) return false;
  for (let i = 0; i < index - 1; i++) {
    if (rings[i]) return false;
  }
  return true;
}

function toggleRing(index) {
  if (!canToggle(index)) return false;
  history.push({ rings: [...rings], moveCount });
  rings[index] = !rings[index];
  moveCount++;
  updateUI();
  return true;
}

function undo() {
  if (history.length === 0) return false;
  const prev = history.pop();
  rings = prev.rings;
  moveCount = prev.moveCount;
  updateUI();
  return true;
}

function resetGame() {
  stopAutoSolve();
  rings = Array(RING_COUNT).fill(true);
  moveCount = 0;
  history = [];
  hintActive = false;
  gameCompleted = false;
  updateUI();
  updateRingTargets();
  draw();
}

function isComplete() {
  return rings.every(r => !r);
}

function getValidMoves() {
  const moves = [];
  for (let i = 0; i < RING_COUNT; i++) {
    if (canToggle(i)) moves.push(i);
  }
  return moves;
}

function updateUI() {
  elMoveCount.textContent = moveCount;
  const onCount = rings.filter(r => r).length;
  elRingsLeft.textContent = onCount;
}

function updateRingTargets() {
  for (let i = 0; i < RING_COUNT; i++) {
    ringTargetY[i] = rings[i] ? ringOnY : ringOffY;
  }
}

// ==================== 自动求解 ====================
function generateRemoveSeq(n) {
  if (n === 0) return [];
  if (n === 1) return [0];
  let seq = [];
  seq = seq.concat(generateRemoveSeq(n - 2));
  seq.push(n - 1);
  seq = seq.concat(generatePutSeq(n - 2));
  seq = seq.concat(generateRemoveSeq(n - 1));
  return seq;
}

function generatePutSeq(n) {
  if (n === 0) return [];
  if (n === 1) return [0];
  let seq = [];
  seq = seq.concat(generatePutSeq(n - 1));
  seq = seq.concat(generateRemoveSeq(n - 2));
  seq.push(n - 1);
  seq = seq.concat(generatePutSeq(n - 2));
  return seq;
}

function startAutoSolve() {
  if (autoSolving) {
    stopAutoSolve();
    return;
  }
  // 先重置到全上状态
  stopAutoSolve();
  resetGame();
  rings = Array(RING_COUNT).fill(true);
  moveCount = 0;
  history = [];
  hintActive = false;
  gameCompleted = false;
  updateUI();
  updateRingTargets();
  // 强制同步动画到目标
  for (let i = 0; i < RING_COUNT; i++) ringAnimY[i] = ringTargetY[i];
  draw();

  autoSolveSeq = generateRemoveSeq(RING_COUNT);
  autoSolveIdx = 0;
  autoSolving = true;
  btnAuto.textContent = '⏸ 停止';
  btnAuto.classList.add('active');
  speedSelector.style.display = 'flex';
  btnHint.disabled = true;
  btnUndo.disabled = true;
  btnReset.disabled = true;
  gameCompleted = false;
  runAutoSolveStep();
}

function stopAutoSolve() {
  autoSolving = false;
  if (autoSolveTimer) clearTimeout(autoSolveTimer);
  autoSolveTimer = null;
  btnAuto.textContent = '▶ 演示';
  btnAuto.classList.remove('active');
  speedSelector.style.display = 'none';
  btnHint.disabled = false;
  btnUndo.disabled = false;
  btnReset.disabled = false;
}

function runAutoSolveStep() {
  if (!autoSolving) return;
  if (autoSolveIdx >= autoSolveSeq.length) {
    stopAutoSolve();
    checkCompletion();
    return;
  }
  const ringIdx = autoSolveSeq[autoSolveIdx];
  if (canToggle(ringIdx)) {
    toggleRing(ringIdx);
    updateRingTargets();
    // 脉冲高亮当前操作的环
    ringPulse[ringIdx] = 1.0;
  }
  autoSolveIdx++;
  autoSolveTimer = setTimeout(runAutoSolveStep, autoSolveSpeed);
}

// ==================== Canvas 绘制 ====================
function recalcLayout() {
  const w = canvas.width;
  const h = canvas.height;
  barY = h * 0.10;
  barHeight = Math.max(8, w * 0.016);
  handleTopY = barY + barHeight + 3;
  handleLength = h * 0.44;
  loopRadius = Math.max(4, w * 0.011);
  ringRadius = Math.max(12, w * 0.034);
  ringThickness = Math.max(2, w * 0.0065);
  ringOnY = handleTopY + ringRadius + 8;
  ringOffY = handleTopY + handleLength;
  ringSpacing = (w - ringRadius * 2.5) / (RING_COUNT - 1);
  startX = ringRadius * 1.25;
  for (let i = 0; i < RING_COUNT; i++) {
    ringX[i] = startX + i * ringSpacing;
  }
  // 初始化动画位置
  if (ringAnimY.length === 0) {
    for (let i = 0; i < RING_COUNT; i++) {
      ringAnimY[i] = ringOnY;
      ringTargetY[i] = ringOnY;
      ringPulse[i] = 0;
    }
  }
  updateRingTargets();
}

function draw() {
  const w = canvas.width;
  const h = canvas.height;
  ctx.clearRect(0, 0, w, h);

  // 背景
  const bgGrad = ctx.createLinearGradient(0, 0, 0, h);
  bgGrad.addColorStop(0, '#0f0f20');
  bgGrad.addColorStop(1, '#0a0a16');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, w, h);

  // 装饰祥云（顶部两侧）
  drawCloud(ctx, w * 0.08, barY - ringRadius * 0.6, ringRadius * 0.55, 0.06);
  drawCloud(ctx, w * 0.92, barY - ringRadius * 0.6, ringRadius * 0.55, 0.06);

  // 绘制横杆阴影
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  roundRect(ctx, startX - ringRadius * 0.5, barY + 3, ringSpacing * (RING_COUNT - 1) + ringRadius, barHeight + 2, 4);
  ctx.fill();

  // 绘制横杆
  const barGrad = ctx.createLinearGradient(0, barY, 0, barY + barHeight);
  barGrad.addColorStop(0, '#6b3a1f');
  barGrad.addColorStop(0.4, '#8b5a2b');
  barGrad.addColorStop(0.6, '#7a4a24');
  barGrad.addColorStop(1, '#4a2010');
  ctx.fillStyle = barGrad;
  const barLeft = startX - ringRadius * 0.6;
  const barRight = startX + ringSpacing * (RING_COUNT - 1) + ringRadius * 0.6;
  roundRect(ctx, barLeft, barY, barRight - barLeft, barHeight, 3);
  ctx.fill();

  // 横杆高光
  ctx.fillStyle = 'rgba(255,220,180,0.12)';
  roundRect(ctx, barLeft + 2, barY + 1, barRight - barLeft - 4, barHeight * 0.35, 2);
  ctx.fill();

  // 杆端装饰
  const endR = barHeight * 0.55;
  ctx.fillStyle = '#9b6a3b';
  ctx.beginPath();
  ctx.arc(barLeft, barY + barHeight / 2, endR, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(barRight, barY + barHeight / 2, endR, 0, Math.PI * 2);
  ctx.fill();

  // 绘制手柄和环
  for (let i = 0; i < RING_COUNT; i++) {
    const x = ringX[i];
    drawHandle(ctx, x, handleTopY, handleLength, loopRadius);
    const ringY = ringAnimY[i];
    const isOn = rings[i];
    const pulseVal = ringPulse[i];
    const isValid = hintActive && canToggle(i) && !autoSolving;

    drawRing(ctx, x, ringY, ringRadius, ringThickness, isOn, pulseVal, isValid);
  }

  // 提示文字
  if (hintActive && !autoSolving) {
    const validMoves = getValidMoves();
    if (validMoves.length > 0) {
      ctx.fillStyle = 'rgba(201,169,110,0.7)';
      ctx.font = `${Math.max(10, w * 0.018)}px "STSong","KaiTi","Microsoft YaHei",serif`;
      ctx.textAlign = 'center';
      ctx.fillText('可操作：第' + validMoves.map(i => i + 1).join('、') + '环', w / 2, h - 10);
    }
  }

  // 自动演示进度
  if (autoSolving) {
    ctx.fillStyle = 'rgba(201,169,110,0.8)';
    ctx.font = `${Math.max(11, w * 0.02)}px "STSong","KaiTi","Microsoft YaHei",serif`;
    ctx.textAlign = 'center';
    ctx.fillText(`演示中… ${autoSolveIdx}/${autoSolveSeq.length} 步`, w / 2, h - 10);
  }
}

function drawHandle(ctx, x, topY, length, loopR) {
  const bottomY = topY + length;
  // 手柄线
  ctx.strokeStyle = '#b0a090';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x, topY);
  ctx.lineTo(x, bottomY);
  ctx.stroke();

  // 手柄高光
  ctx.strokeStyle = 'rgba(220,210,190,0.3)';
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  ctx.moveTo(x - 0.5, topY);
  ctx.lineTo(x - 0.5, bottomY);
  ctx.stroke();

  // 底部环扣
  ctx.strokeStyle = '#b0a090';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(x, bottomY, loopR, 0, Math.PI * 2);
  ctx.stroke();
}

function drawRing(ctx, x, y, radius, thickness, isOn, pulse, isValid) {
  ctx.save();
  const gapHalf = 0.45; // 顶部缺口半角

  // 阴影
  ctx.shadowColor = 'rgba(0,0,0,0.5)';
  ctx.shadowBlur = 4;
  ctx.shadowOffsetX = 2;
  ctx.shadowOffsetY = 2;

  // 环主体颜色
  let baseColor, glowColor;
  if (isOn) {
    baseColor = '#daa520';
    glowColor = '#ffd700';
  } else {
    baseColor = '#8b7355';
    glowColor = '#a09070';
  }

  // 脉冲/提示发光
  if (pulse > 0.01 || isValid) {
    const alpha = isValid ? 0.5 + 0.3 * Math.sin(Date.now() / 300) : pulse * 0.7;
    ctx.shadowColor = `rgba(255,215,0,${alpha})`;
    ctx.shadowBlur = 12 + (isValid ? 6 * Math.sin(Date.now() / 300) : 0);
  }

  // 绘制环（带缺口的圆弧）
  ctx.beginPath();
  ctx.arc(x, y, radius, -Math.PI / 2 + gapHalf, -Math.PI / 2 - gapHalf + Math.PI * 2);
  ctx.lineWidth = thickness;
  ctx.strokeStyle = baseColor;
  ctx.stroke();

  // 内层高光
  ctx.shadowColor = 'transparent';
  ctx.shadowBlur = 0;
  ctx.shadowOffsetX = 0;
  ctx.shadowOffsetY = 0;
  ctx.beginPath();
  ctx.arc(x, y, radius - thickness * 0.35, -Math.PI / 2 + gapHalf + 0.15, -Math.PI / 2 - gapHalf - 0.15 + Math.PI * 2);
  ctx.lineWidth = Math.max(1, thickness * 0.3);
  ctx.strokeStyle = glowColor;
  ctx.globalAlpha = 0.5;
  ctx.stroke();
  ctx.globalAlpha = 1;

  // 缺口两端装饰小球
  const dotR = thickness * 0.55;
  for (const side of [-1, 1]) {
    const angle = -Math.PI / 2 + side * gapHalf;
    const dx = x + Math.cos(angle) * radius;
    const dy = y + Math.sin(angle) * radius;
    ctx.beginPath();
    ctx.arc(dx, dy, dotR, 0, Math.PI * 2);
    ctx.fillStyle = baseColor;
    ctx.fill();
    // 高光
    ctx.beginPath();
    ctx.arc(dx - dotR * 0.2, dy - dotR * 0.2, dotR * 0.4, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.fill();
  }

  ctx.restore();
}

function drawCloud(ctx, x, y, size, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#c9a96e';
  ctx.beginPath();
  ctx.arc(x, y, size * 0.5, 0, Math.PI * 2);
  ctx.arc(x + size * 0.45, y - size * 0.2, size * 0.4, 0, Math.PI * 2);
  ctx.arc(x + size * 0.9, y, size * 0.35, 0, Math.PI * 2);
  ctx.arc(x + size * 1.15, y + size * 0.15, size * 0.25, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ==================== 动画循环 ====================
function animate() {
  if (!gameStarted) { requestAnimationFrame(animate); return; }
  let needsRedraw = false;
  // 更新环动画位置
  for (let i = 0; i < RING_COUNT; i++) {
    if (Math.abs(ringAnimY[i] - ringTargetY[i]) > 0.3) {
      ringAnimY[i] += (ringTargetY[i] - ringAnimY[i]) * 0.35;
      needsRedraw = true;
    } else if (ringAnimY[i] !== ringTargetY[i]) {
      ringAnimY[i] = ringTargetY[i];
    }
    // 衰减脉冲
    if (ringPulse[i] > 0.005) {
      ringPulse[i] *= 0.88;
      needsRedraw = true;
    } else if (ringPulse[i] > 0) {
      ringPulse[i] = 0;
    }
  }
  // 提示模式需要持续重绘（闪烁动画）
  if (hintActive || autoSolving) needsRedraw = true;
  if (needsRedraw) draw();
  requestAnimationFrame(animate);
}

// ==================== 事件处理 ====================
function getClickPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return {
    x: (clientX - rect.left) * scaleX,
    y: (clientY - rect.top) * scaleY
  };
}

function handleCanvasClick(e) {
  if (autoSolving || gameCompleted) return;
  const pos = getClickPos(e);
  // 检测点击了哪个环
  for (let i = RING_COUNT - 1; i >= 0; i--) {
    const dx = pos.x - ringX[i];
    const dy = pos.y - ringAnimY[i];
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < ringRadius + ringThickness + 4) {
      if (canToggle(i)) {
        toggleRing(i);
        updateRingTargets();
        ringPulse[i] = 1.0;
        checkCompletion();
        draw();
      }
      return;
    }
  }
  e.preventDefault();
}

function checkCompletion() {
  if (isComplete() && !gameCompleted) {
    gameCompleted = true;
    resultMoves.textContent = moveCount;
    // 星级评价
    if (moveCount <= OPTIMAL_MOVES) {
      starsDisplay.textContent = '⭐⭐⭐';
    } else if (moveCount <= OPTIMAL_MOVES * 1.5) {
      starsDisplay.textContent = '⭐⭐';
    } else {
      starsDisplay.textContent = '⭐';
    }
    successOverlay.classList.add('show');
    spawnParticles();
    // 延迟显示插屏广告
    setTimeout(() => {
      if (gameCompleted) interstitialAd.classList.add('show');
    }, 1500);
  }
}

function spawnParticles() {
  const colors = ['#ffd700', '#c9a96e', '#daa520', '#ffec8b', '#ffb90f'];
  for (let i = 0; i < 30; i++) {
    setTimeout(() => {
      const p = document.createElement('div');
      p.className = 'particle';
      p.textContent = ['✨', '🌟', '⭐', '💫', '🎉'][Math.floor(Math.random() * 5)];
      p.style.left = (20 + Math.random() * 60) + '%';
      p.style.top = (30 + Math.random() * 40) + '%';
      p.style.animationDuration = (1 + Math.random() * 2) + 's';
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 2500);
    }, i * 40);
  }
}

function handleResize() {
  const container = canvas.parentElement;
  const maxW = Math.min(container.clientWidth - 20, 700);
  const maxH = Math.min(maxW * 0.75, 520);
  canvas.width = maxW;
  canvas.height = maxH;
  canvas.style.width = maxW + 'px';
  canvas.style.height = maxH + 'px';
  recalcLayout();
  // 动画重新同步
  for (let i = 0; i < RING_COUNT; i++) {
    ringAnimY[i] = ringTargetY[i];
  }
  draw();
}

// ==================== 按钮事件 ====================
btnHint.addEventListener('click', () => {
  if (autoSolving || gameCompleted) return;
  hintActive = !hintActive;
  btnHint.classList.toggle('active', hintActive);
  btnHint.textContent = hintActive ? '💡 提示开' : '💡 提示';
  draw();
});

btnUndo.addEventListener('click', () => {
  if (autoSolving || gameCompleted) return;
  if (undo()) {
    updateRingTargets();
    draw();
  }
});

btnAuto.addEventListener('click', () => {
  if (autoSolving) {
    stopAutoSolve();
    btnHint.disabled = false;
    btnUndo.disabled = false;
    btnReset.disabled = false;
    draw();
  } else {
    startAutoSolve();
  }
});

btnReset.addEventListener('click', () => {
  resetGame();
  for (let i = 0; i < RING_COUNT; i++) {
    ringAnimY[i] = ringTargetY[i];
  }
  draw();
});

btnReplay.addEventListener('click', () => {
  successOverlay.classList.remove('show');
  interstitialAd.classList.remove('show');
  resetGame();
  for (let i = 0; i < RING_COUNT; i++) {
    ringAnimY[i] = ringTargetY[i];
  }
  draw();
});

// 速度选择器
speedSelector.addEventListener('click', (e) => {
  if (e.target.tagName === 'BUTTON') {
    autoSolveSpeed = parseInt(e.target.dataset.speed);
    speedSelector.querySelectorAll('button').forEach(b => b.classList.remove('active-speed'));

});

// 广告组件事件

});
sponsorClose.addEventListener('click', () => {
  sponsorPanel.classList.remove('show');
});
adClose.addEventListener('click', () => {
  interstitialAd.classList.remove('show');
});
// 点击赞助面板外部关闭
sponsorPanel.addEventListener('click', (e) => {
  if (e.target === sponsorPanel) sponsorPanel.classList.remove('show');
});

  if (e.target === interstitialAd) interstitialAd.classList.remove('show');
});

// 键盘快捷键
document.addEventListener('keydown', (e) => {
  if (e.key === 'h' || e.key === 'H') {
    btnHint.click();
  } else if (e.key === 'u' || e.key === 'U') {
    btnUndo.click();
  } else if (e.key === 'r' || e.key === 'R') {
    if (!e.ctrlKey && !e.metaKey) btnReset.click();
  } else if (e.key === 'a' || e.key === 'A') {
    if (!e.ctrlKey && !e.metaKey) btnAuto.click();
  } else if (e.key === ' ') {
    if (autoSolving) { stopAutoSolve(); draw(); }
    e.preventDefault();
  }
});

// Canvas 事件
canvas.addEventListener('click', handleCanvasClick);
canvas.addEventListener('touchstart', (e) => {
  handleCanvasClick(e);
  e.preventDefault();
}, { passive: false });

// 窗口大小变化
window.addEventListener('resize', handleResize);

// ==================== 初始化 ====================
function init() {
  handleResize();
  updateUI();
  recalcLayout();
  for (let i = 0; i < RING_COUNT; i++) {
    ringAnimY[i] = ringTargetY[i];
    ringPulse[i] = 0;
  }
  draw();
  requestAnimationFrame(animate);
  // 开始界面
  const startScreen = document.getElementById('startScreen');
  const startBtn = document.getElementById('startBtn');
  startBtn.addEventListener('click', () => {
    startScreen.classList.add('hidden');
    gameStarted = true;
  });
  // 重写reset和replay
  const origResetGame = resetGame;
  resetGame = function() {
    startScreen.classList.remove('hidden');
    gameStarted = false;
    stopAutoSolve();
    origResetGame();
  };
  btnReset.addEventListener('click', () => {
    resetGame();
    for (let i = 0; i < RING_COUNT; i++) ringAnimY[i] = ringTargetY[i];
    draw();
  });
  btnReplay.addEventListener('click', () => {
    startScreen.classList.remove('hidden');
    gameStarted = false;
    successOverlay.classList.remove('show');
    interstitialAd.classList.remove('show');
    resetGame();
    for (let i = 0; i < RING_COUNT; i++) ringAnimY[i] = ringTargetY[i];
    draw();
  });
}
