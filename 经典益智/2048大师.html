<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2048大师</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; color: #fff; overflow: hidden; }
        
        .game-container { width: 100%; flex: 1; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: #fff; }
        .stats { display: flex; gap: 20px; font-size: 14px; }
        
        .main-area { flex: 1; display: flex; flex-direction: column; gap: 15px; }
        
        .game-board { flex: 1; background: rgba(0,0,0,0.5); border-radius: 15px; padding: 10px; display: flex; align-items: center; justify-content: center; }
        
        .board { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 10px; background: #333; padding: 10px; border-radius: 10px; width: 300px; height: 300px; }
        
        .tile { background: rgba(255,255,255,0.1); border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; }
        
        .tile-2 { background: #eee4da; color: #776e65; }
        .tile-4 { background: #ede0c8; color: #776e65; }
        .tile-8 { background: #f2b179; color: #f9f6f2; }
        .tile-16 { background: #f59563; color: #f9f6f2; }
        .tile-32 { background: #f67c5f; color: #f9f6f2; }
        .tile-64 { background: #f65e3b; color: #f9f6f2; }
        .tile-128 { background: #edcf72; color: #f9f6f2; }
        .tile-256 { background: #edcc61; color: #f9f6f2; }
        .tile-512 { background: #edc850; color: #f9f6f2; }
        .tile-1024 { background: #edc53f; color: #f9f6f2; }
        .tile-2048 { background: #edc22e; color: #f9f6f2; }
        
        .actions { display: flex; gap: 10px; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; }
        
        .action-btn { flex: 1; padding: 15px; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; background: rgba(255,255,255,0.2); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="title">🎮 2048大师</div>
            <div class="stats">
                <span>⭐ 分数: <span id="score">0</span></span>
                <span>🏆 最高分: <span id="best">0</span></span>
            </div>
        </div>
        
        <div class="main-area">
            <div class="game-board">
                <div class="board" id="board"></div>
            </div>
        </div>
        
        <div class="actions">
            <button class="action-btn" onclick="newGame()">🎮 新游戏</button>
        </div>
    </div>
    
    <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <script>
        const GAME_NAME = '2048大师';
        GameCore.init({ highScore: GAME_NAME });
        
        let board = [];
        let score = 0;
        let best = 0;
        
        function initGame() {
            best = GameCore.highScore.get(GAME_NAME) || 0;
            newGame();
        }
        
        function newGame() {
            board = Array(4).fill(null).map(() => Array(4).fill(0));
            score = 0;
            addRandomTile();
            addRandomTile();
            renderBoard();
        }
        
        function addRandomTile() {
            const emptyCells = [];
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    if (board[i][j] === 0) {
                        emptyCells.push({ row: i, col: j });
                    }
                }
            }
            
            if (emptyCells.length > 0) {
                const { row, col } = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                board[row][col] = Math.random() < 0.9 ? 2 : 4;
            }
        }
        
        function renderBoard() {
            const boardElement = document.getElementById('board');
            boardElement.innerHTML = '';
            
            board.forEach((row, rowIndex) => {
                row.forEach((tile, colIndex) => {
                    const tileElement = document.createElement('div');
                    tileElement.className = `tile ${tile > 0 ? `tile-${tile}` : ''}`;
                    tileElement.textContent = tile || '';
                    boardElement.appendChild(tileElement);
                });
            });
            
            document.getElementById('score').textContent = score;
            document.getElementById('best').textContent = best;
        }
        
        function move(direction) {
            let moved = false;
            
            if (direction === 'left') {
                for (let i = 0; i < 4; i++) {
                    const row = board[i].filter(x => x !== 0);
                    const merged = [];
                    
                    for (let j = 0; j < row.length; j++) {
                        if (j + 1 < row.length && row[j] === row[j + 1]) {
                            merged.push(row[j] * 2);
                            score += row[j] * 2;
                            j++;
                            moved = true;
                        } else {
                            merged.push(row[j]);
                        }
                    }
                    
                    while (merged.length < 4) merged.push(0);
                    
                    if (JSON.stringify(board[i]) !== JSON.stringify(merged)) {
                        moved = true;
                        board[i] = merged;
                    }
                }
            } else if (direction === 'right') {
                for (let i = 0; i < 4; i++) {
                    const row = board[i].filter(x => x !== 0);
                    const merged = [];
                    
                    for (let j = row.length - 1; j >= 0; j--) {
                        if (j - 1 >= 0 && row[j] === row[j - 1]) {
                            merged.unshift(row[j] * 2);
                            score += row[j] * 2;
                            j--;
                            moved = true;
                        } else {
                            merged.unshift(row[j]);
                        }
                    }
                    
                    while (merged.length < 4) merged.unshift(0);
                    
                    if (JSON.stringify(board[i]) !== JSON.stringify(merged)) {
                        moved = true;
                        board[i] = merged;
                    }
                }
            } else if (direction === 'up') {
                for (let j = 0; j < 4; j++) {
                    const col = [];
                    for (let i = 0; i < 4; i++) col.push(board[i][j]);
                    
                    const filtered = col.filter(x => x !== 0);
                    const merged = [];
                    
                    for (let i = 0; i < filtered.length; i++) {
                        if (i + 1 < filtered.length && filtered[i] === filtered[i + 1]) {
                            merged.push(filtered[i] * 2);
                            score += filtered[i] * 2;
                            i++;
                            moved = true;
                        } else {
                            merged.push(filtered[i]);
                        }
                    }
                    
                    while (merged.length < 4) merged.push(0);
                    
                    for (let i = 0; i < 4; i++) {
                        if (board[i][j] !== merged[i]) {
                            moved = true;
                            board[i][j] = merged[i];
                        }
                    }
                }
            } else if (direction === 'down') {
                for (let j = 0; j < 4; j++) {
                    const col = [];
                    for (let i = 0; i < 4; i++) col.push(board[i][j]);
                    
                    const filtered = col.filter(x => x !== 0);
                    const merged = [];
                    
                    for (let i = filtered.length - 1; i >= 0; i--) {
                        if (i - 1 >= 0 && filtered[i] === filtered[i - 1]) {
                            merged.unshift(filtered[i] * 2);
                            score += filtered[i] * 2;
                            i--;
                            moved = true;
                        } else {
                            merged.unshift(filtered[i]);
                        }
                    }
                    
                    while (merged.length < 4) merged.unshift(0);
                    
                    for (let i = 0; i < 4; i++) {
                        if (board[i][j] !== merged[i]) {
                            moved = true;
                            board[i][j] = merged[i];
                        }
                    }
                }
            }
            
            if (moved) {
                addRandomTile();
                renderBoard();
                
                if (score > best) {
                    best = score;
                    GameCore.highScore.set(GAME_NAME, best);
                }
                
                checkWin();
            }
        }
        
        function checkWin() {
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    if (board[i][j] === 2048) {
                        GameCore.hints.show('🎉 恭喜达到2048！');
                        return;
                    }
                }
            }
            
            let hasEmpty = false;
            let canMerge = false;
            
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    if (board[i][j] === 0) hasEmpty = true;
                    if (i < 3 && board[i][j] === board[i + 1][j]) canMerge = true;
                    if (j < 3 && board[i][j] === board[i][j + 1]) canMerge = true;
                }
            }
            
            if (!hasEmpty && !canMerge) {
                GameCore.hints.show('😔 游戏结束！');
            }
        }
        
        document.addEventListener('keydown', (e) => {
            const keyMap = {
                'ArrowUp': 'up',
                'ArrowDown': 'down',
                'ArrowLeft': 'left',
                'ArrowRight': 'right'
            };
            
            if (keyMap[e.key]) {
                move(keyMap[e.key]);
                e.preventDefault();
            }
        });
        
        let touchStartX = 0;
        let touchStartY = 0;
        
        document.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });
        
        document.addEventListener('touchend', (e) => {
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            
            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;
            
            if (Math.abs(dx) > Math.abs(dy)) {
                if (Math.abs(dx) > 30) {
                    move(dx > 0 ? 'right' : 'left');
                }
            } else {
                if (Math.abs(dy) > 30) {
                    move(dy > 0 ? 'down' : 'up');
                }
            }
        });
        
        initGame();
        GameCore.touch.enableAllButtons();
    </script>
</body>
</html>
