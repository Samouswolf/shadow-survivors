<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>好友拼图</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; color: #fff; }
        
        .game-container { width: 100%; flex: 1; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: #ffd700; }
        .players { display: flex; gap: 10px; }
        .player-tag { padding: 5px 15px; border-radius: 20px; font-size: 14px; }
        .player-tag.you { background: #4ecdc4; color: #fff; }
        .player-tag.friend { background: #f5576c; color: #fff; }
        
        .puzzle-area { flex: 1; display: flex; justify-content: center; align-items: center; margin-bottom: 15px; }
        .puzzle-board { display: grid; gap: 5px; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 15px; }
        .puzzle-piece { aspect-ratio: 1; border: 2px solid rgba(255,255,255,0.2); border-radius: 8px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; background-size: cover; background-position: center; }
        .puzzle-piece.selected { border-color: #ffd700; box-shadow: 0 0 20px rgba(255,215,0,0.5); transform: scale(1.05); }
        .puzzle-piece.correct { border-color: #48c78e; box-shadow: 0 0 15px rgba(72,199,142,0.5); }
        
        .progress-bar { height: 10px; background: rgba(255,255,255,0.2); border-radius: 5px; overflow: hidden; margin-bottom: 15px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #4ecdc4, #48c78e); transition: width 0.3s; }
        
        .controls { display: flex; gap: 10px; justify-content: center; }
        .btn { padding: 12px 25px; border: none; border-radius: 15px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; }
        .btn-secondary { background: rgba(255,255,255,0.2); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="title">🧩 好友拼图</div>
            <div class="players">
                <div class="player-tag you">👤 你</div>
                <div class="player-tag friend">👥 好友</div>
            </div>
        </div>
        
        <div class="puzzle-area">
            <div class="puzzle-board" id="puzzleBoard"></div>
        </div>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
        </div>
        
        <div class="controls">
            <button class="btn btn-secondary" onclick="shufflePuzzle()">🔀 打乱</button>
            <button class="btn btn-primary" onclick="hintPuzzle()">💡 提示</button>
            <button class="btn btn-secondary" onclick="resetPuzzle()">🔄 重置</button>
        </div>
    </div>
    
    <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>

    <script src="game_core.js"></script>
    <script>
        const GAME_NAME = '好友拼图';
        GameCore.init({ highScore: GAME_NAME });
        
        const gridSize = 3;
        let pieces = [];
        let selectedPiece = null;
        let correctCount = 0;
        
        const images = [
            'linear-gradient(135deg, #ff6b6b, #ffa502)',
            'linear-gradient(135deg, #4ecdc4, #48c78e)',
            'linear-gradient(135deg, #667eea, #764ba2)',
            'linear-gradient(135deg, #f093fb, #f5576c)',
            'linear-gradient(135deg, #ffa502, #ffd700)',
            'linear-gradient(135deg, #ffd700, #48c78e)',
            'linear-gradient(135deg, #48c78e, #4ecdc4)',
            'linear-gradient(135deg, #4ecdc4, #667eea)',
            'linear-gradient(135deg, #667eea, #f093fb)'
        ];
        
        function initPuzzle() {
            pieces = [];
            
            for (let i = 0; i < gridSize * gridSize; i++) {
                pieces.push({
                    id: i,
                    currentPos: i,
                    correctPos: i,
                    image: images[i],
                    isCorrect: false
                });
            }
            
            shufflePuzzle();
        }
        
        function shufflePuzzle() {
            for (let i = pieces.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pieces[i].currentPos, pieces[j].currentPos] = [pieces[j].currentPos, pieces[i].currentPos];
            }
            
            correctCount = 0;
            pieces.forEach(p => {
                p.isCorrect = p.currentPos === p.correctPos;
                if (p.isCorrect) correctCount++;
            });
            
            renderPuzzle();
        }
        
        function renderPuzzle() {
            const board = document.getElementById('puzzleBoard');
            board.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
            board.style.width = 'min(80vw, 400px)';
            
            board.innerHTML = '';
            
            pieces.forEach(piece => {
                const el = document.createElement('div');
                el.className = `puzzle-piece ${piece.isCorrect ? 'correct' : ''} ${selectedPiece === piece ? 'selected' : ''}`;
                el.style.background = piece.image;
                el.onclick = () => selectPiece(piece);
                
                board.appendChild(el);
            });
            
            updateProgress();
        }
        
        function selectPiece(piece) {
            if (!piece.isCorrect) {
                if (selectedPiece) {
                    swapPieces(selectedPiece, piece);
                    selectedPiece = null;
                    
                    setTimeout(() => {
                        aiMove();
                    }, 500);
                } else {
                    selectedPiece = piece;
                }
                renderPuzzle();
            }
        }
        
        function swapPieces(p1, p2) {
            const tempPos = p1.currentPos;
            p1.currentPos = p2.currentPos;
            p2.currentPos = tempPos;
            
            p1.isCorrect = p1.currentPos === p1.correctPos;
            p2.isCorrect = p2.currentPos === p2.correctPos;
            
            if (p1.isCorrect) correctCount++;
            if (p2.isCorrect) correctCount++;
            
            checkWin();
        }
        
        function aiMove() {
            const incorrectPieces = pieces.filter(p => !p.isCorrect);
            
            if (incorrectPieces.length === 0) return;
            
            const piece1 = incorrectPieces[Math.floor(Math.random() * incorrectPieces.length)];
            const piece2 = incorrectPieces[Math.floor(Math.random() * incorrectPieces.length)];
            
            if (piece1 !== piece2 && Math.random() < 0.6) {
                setTimeout(() => {
                    swapPieces(piece1, piece2);
                    renderPuzzle();
                    GameCore.hints.show('👥 好友移动了拼图');
                }, 800);
            }
        }
        
        function checkWin() {
            if (correctCount === pieces.length) {
                GameCore.hints.show('🎉 拼图完成！');
                GameCore.highScore.set(GAME_NAME, correctCount);
            }
        }
        
        function hintPuzzle() {
            const incorrectPieces = pieces.filter(p => !p.isCorrect);
            
            if (incorrectPieces.length > 0) {
                const hintPiece = incorrectPieces[0];
                selectedPiece = hintPiece;
                renderPuzzle();
                GameCore.hints.show(`💡 试试移动这块拼图`);
            }
        }
        
        function resetPuzzle() {
            initPuzzle();
        }
        
        function updateProgress() {
            const progress = (correctCount / pieces.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }
        
        initPuzzle();
        GameCore.touch.enableAllButtons();
    </script>
</body>
</html>
