const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
const pauseBtn=document.getElementById('pauseBtn');
const helpText=document.getElementById('helpText');
const pauseOverlay=document.getElementById('pauseOverlay');
const sponsorBtn=document.getElementById('sponsorBtn');
const sponsorModal=document.getElementById('sponsorModal');
const interstitialAd=document.getElementById('interstitialAd');
const adContainer=document.getElementById('adContainer');
const adTimer=document.getElementById('adTimer');
const CONFIG={
BASE_CELL_SIZE:50,
MIN_CELL_SIZE:30,
MAX_CELL_SIZE:80,
GRID_PADDING:20,
ANIMATION_SPEED:0.15,
PARTICLE_COUNT:30,
MAX_PARTICLES:100,
COMBO_TIMEOUT:2000,
LEVELS:[
{id:1,name:'入门迷宫',size:3,maxNum:5,timeLimit:60,bonusTime:10,desc:'5x5迷宫，简单入门'},
{id:2,name:'初级迷宫',size:4,maxNum:8,timeLimit:90,bonusTime:12,desc:'6x6迷宫，逐步提升'},
{id:3,name:'中级迷宫',size:5,maxNum:12,timeLimit:120,bonusTime:15,desc:'7x7迷宫，考验观察力'},
{id:4,name:'高级迷宫',size:6,maxNum:16,timeLimit:150,bonusTime:18,desc:'8x8迷宫，策略挑战'},
{id:5,name:'专家迷宫',size:7,maxNum:20,timeLimit:180,bonusTime:20,desc:'9x9迷宫，极限挑战'},
{id:6,name:'大师迷宫',size:8,maxNum:25,timeLimit:240,bonusTime:25,desc:'10x10迷宫，终极考验'}
],
COLORS:{
background:['#0f0c29','#302b63','#24243e'],
grid:'rgba(100,200,255,0.1)',
cell:'rgba(100,200,255,0.05)',
cellHover:'rgba(100,200,255,0.2)',
number:['#4facfe','#00f2fe','#f093fb','#f5576c','#43e97b','#38f9d7','#667eea','#764ba2'],
path:'rgba(100,200,255,0.6)',
pathActive:'rgba(100,200,255,0.9)',
particle:['#4facfe','#00f2fe','#f093fb','#f5576c','#43e97b'],
text:'#ffffff',
textShadow:'rgba(100,200,255,0.8)',
uiBackground:'rgba(0,0,0,0.5)',
button:['#4facfe','#00f2fe'],
buttonHover:['#f093fb','#f5576c']
}
};
let G={
state:'menu',
level:1,
score:0,
highScore:parseInt(localStorage.getItem('数字迷宫_highScore'))||0,
combo:0,
maxCombo:0,
lastComboTime:0,
moves:0,
totalMoves:0,
timeLeft:0,
timer:null,
grid:[],
numbers:[],
path:[],
currentNum:1,
maxNum:0,
selectedCell:null,
hoveredCell:null,
cellSize:0,
gridOffsetX:0,
gridOffsetY:0,
particles:[],
animations:[],
shake:0,
shakeIntensity:0,
fadeAlpha:1,
fadeDirection:0,
adCooldown:0,
lastAdTime:0,
gameCount:0,
touchStart:null,
touchCurrent:null,
isDragging:false,
difficulty:1,
achievements:[],
showAchievement:false,
achievementText:'',
achievementTimer:0,
stars:0,
perfectMoves:0,
levelStartTime:0,
totalTime:0,
comboMultiplier:1,
specialEffects:[],
screenFlash:0,
screenFlashColor:'',
cellAnimations:[],
pathAnimations:[],
numAnimations:[],
gridLines:[],
backgroundParticles:[]
};
let animFrame;
let lastTime=0;
let deltaTime=0;
function resizeCanvas(){
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
if(G.state==='game'){
calculateGridSize();
}
initBackgroundParticles();
}
function calculateGridSize(){
const level=CONFIG.LEVELS[G.level-1];
const availableWidth=canvas.width-CONFIG.GRID_PADDING*2;
const availableHeight=canvas.height-CONFIG.GRID_PADDING*2-80;
const maxCellWidth=Math.floor(availableWidth/(level.size+2));
const maxCellHeight=Math.floor(availableHeight/(level.size+2));
G.cellSize=Math.max(CONFIG.MIN_CELL_SIZE,Math.min(CONFIG.MAX_CELL_SIZE,Math.min(maxCellWidth,maxCellHeight)));
G.gridOffsetX=Math.floor((canvas.width-(level.size+2)*G.cellSize)/2);
G.gridOffsetY=Math.floor((canvas.height-(level.size+2)*G.cellSize)/2)+20;
}
function initBackgroundParticles(){
G.backgroundParticles=[];
for(let i=0;i<50;i++){
G.backgroundParticles.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
size:Math.random()*2+1,
speedX:(Math.random()-0.5)*0.5,
speedY:(Math.random()-0.5)*0.5,
opacity:Math.random()*0.5+0.1
});
}
}
function initGame(){
G.state='game';
G.score=0;
G.combo=0;
G.maxCombo=0;
G.moves=0;
G.totalMoves=0;
G.currentNum=1;
G.path=[];
G.selectedCell=null;
G.hoveredCell=null;
G.particles=[];
G.animations=[];
G.shake=0;
G.fadeAlpha=1;
G.fadeDirection=0;

G.levelStartTime=Date.now();
G.totalTime=0;

G.comboMultiplier=1;
G.specialEffects=[];
G.screenFlash=0;
G.cellAnimations=[];
G.pathAnimations=[];
G.numAnimations=[];
const level=CONFIG.LEVELS[G.level-1];
G.maxNum=level.maxNum;
G.timeLeft=level.timeLimit;
calculateGridSize();
generateMaze();
pauseBtn.style.display='block';
helpText.style.display='block';
sponsorBtn.style.display='block';
adContainer.style.display='flex';
startTimer();
if(G.gameCount%3===0&&Date.now()-G.lastAdTime>60000){
setTimeout(showInterstitialAd,2000);
}
}
function generateMaze(){
const level=CONFIG.LEVELS[G.level-1];
const size=level.size+2;
G.grid=[];
G.numbers=[];
for(let y=0;y<size;y++){
G.grid[y]=[];
for(let x=0;x<size;x++){
G.grid[y][x]={
walkable:true,
number:0,
visited:false,
highlighted:false,
animation:0,
pulse:0
};
}
}
const positions=[];
for(let i=0;i<size;i++){
for(let j=0;j<size;j++){
if(i===0||i===size-1||j===0||j===size-1){
positions.push({x:j,y:i});
}
}
}
shuffleArray(positions);
for(let num=1;num<=G.maxNum;num++){
const pos=positions[num-1];
G.grid[pos.y][pos.x].number=num;
G.numbers.push({x:pos.x,y:pos.y,num:num,found:false,animation:0});
}
for(let i=0;i<size*size*0.15;i++){
const x=Math.floor(Math.random()*size);
const y=Math.floor(Math.random()*size);
if(G.grid[y][x].number===0){
G.grid[y][x].walkable=false;
}
}
if(!isPathPossible()){
generateMaze();
}
}
function isPathPossible(){
const level=CONFIG.LEVELS[G.level-1];
const size=level.size+2;
for(let num=1;num<=G.maxNum;num++){
const start=G.numbers.find(n=>n.num===num);
const end=G.numbers.find(n=>n.num===num+1);
if(!end)continue;
if(!hasPath(start.x,start.y,end.x,end.y,size)){
return false;
}
}
return true;
}
function hasPath(startX,startY,endX,endY,size){
const visited=new Set();
const queue=[{x:startX,y:startY}];
visited.add(`${startX},${startY}`);
const dirs=[{x:0,y:-1},{x:0,y:1},{x:-1,y:0},{x:1,y:0}];
while(queue.length>0){
const current=queue.shift();
if(current.x===endX&&current.y===endY){
return true;
}
for(const dir of dirs){
const newX=current.x+dir.x;
const newY=current.y+dir.y;
const key=`${newX},${newY}`;
if(newX>=0&&newX<size&&newY>=0&&newY<size&&!visited.has(key)&&G.grid[newY][newX].walkable){
visited.add(key);
queue.push({x:newX,y:newY});
}
}
}
return false;
}
function shuffleArray(array){
for(let i=array.length-1;i>0;i--){
const j=Math.floor(Math.random()*(i+1));
[array[i],array[j]]=[array[j],array[i]];
}
}

function handleCellClick(x,y){
if(G.state!=='game')return;
const gridX=Math.floor((x-G.gridOffsetX)/G.cellSize);
const gridY=Math.floor((y-G.gridOffsetY)/G.cellSize);
const level=CONFIG.LEVELS[G.level-1];
const size=level.size+2;
if(gridX<0||gridX>=size||gridY<0||gridY>=size)return;
const cell=G.grid[gridY][gridX];
if(!cell.walkable)return;
if(cell.number===G.currentNum){
handleNumberFound(gridX,gridY);
}else if(cell.number===0&&G.path.length>0){
handlePathMove(gridX,gridY);
}
}
function handleNumberFound(x,y){
const cell=G.grid[y][x];
cell.visited=true;
cell.animation=1;
G.path.push({x,y,num:G.currentNum});
G.currentNum++;
G.moves++;
G.totalMoves++;
G.lastComboTime=Date.now();
G.combo++;
if(G.combo>G.maxCombo)G.maxCombo=G.combo;
G.comboMultiplier=1+Math.floor(G.combo/3)*0.5;
const baseScore=100*G.level;
const comboBonus=Math.floor(baseScore*(G.comboMultiplier-1));
const totalScore=baseScore+comboBonus;
G.score+=totalScore;
G.numbers.find(n=>n.num===cell.number).found=true;
G.numbers.find(n=>n.num===cell.number).animation=1;
createParticles(x,y,CONFIG.COLORS.number[G.currentNum%CONFIG.COLORS.number.length]);
G.specialEffects.push({
type:'score',
x:G.gridOffsetX+x*G.cellSize+G.cellSize/2,
y:G.gridOffsetY+y*G.cellSize,
text:`+${totalScore}`,
color:CONFIG.COLORS.number[G.currentNum%CONFIG.COLORS.number.length],
life:60,
maxLife:60
});
if(G.combo>1){
G.specialEffects.push({
type:'combo',
x:canvas.width/2,
y:100,
text:`${G.combo}连击! x${G.comboMultiplier.toFixed(1)}`,

});
}

}
function handlePathMove(x,y){
const lastPos=G.path[G.path.length-1];
const dx=Math.abs(x-lastPos.x);
const dy=Math.abs(y-lastPos.y);
if((dx===1&&dy===0)||(dx===0&&dy===1)){
if(G.grid[y][x].visited)return;
G.grid[y][x].visited=true;
G.grid[y][x].animation=0.5;
G.path.push({x,y,num:0});
G.moves++;
G.totalMoves++;
createParticles(x,y,'rgba(100,200,255,0.5)');
}
}
function createParticles(x,y,color){
for(let i=0;i<8;i++){
const angle=Math.random()*Math.PI*2;

G.particles.push({
x:G.gridOffsetX+x*G.cellSize+G.cellSize/2,
y:G.gridOffsetY+y*G.cellSize+G.cellSize/2,
vx:Math.cos(angle)*speed,
vy:Math.sin(angle)*speed,
size:Math.random()*4+2,
color:color,
life:40+Math.random()*20,
maxLife:60
});
}
if(G.particles.length>CONFIG.MAX_PARTICLES){
G.particles=G.particles.slice(-CONFIG.MAX_PARTICLES);

}

G.stars=stars;

const efficiencyBonus=Math.floor(efficiency*5);
const starBonus=stars*500*G.level;

function updateParticles(){
for(let i=G.particles.length-1;i>=0;i--){
const p=G.particles[i];
p.x+=p.vx;
p.y+=p.vy;
p.life--;
p.vx*=0.98;
p.vy*=0.98;
if(p.life<=0){
G.particles.splice(i,1);
}
}
}
function updateSpecialEffects(){
for(let i=G.specialEffects.length-1;i>=0;i--){
const e=G.specialEffects[i];
e.life--;
e.y-=1;
if(e.life<=0){
G.specialEffects.splice(i,1);
}
}
}
function updateBackgroundParticles(){
for(const p of G.backgroundParticles){
p.x+=p.speedX;
p.y+=p.speedY;
if(p.x<0)p.x=canvas.width;
if(p.x>canvas.width)p.x=0;
if(p.y<0)p.y=canvas.height;
if(p.y>canvas.height)p.y=0;
}
}
function updateAnimations(){
for(const num of G.numbers){
if(num.animation>0){
num.animation-=CONFIG.ANIMATION_SPEED;
if(num.animation<0)num.animation=0;
}
}
for(let y=0;y<G.grid.length;y++){
for(let x=0;x<G.grid[y].length;x++){
if(G.grid[y][x].animation>0){
G.grid[y][x].animation-=CONFIG.ANIMATION_SPEED;
if(G.grid[y][x].animation<0)G.grid[y][x].animation=0;
}
G.grid[y][x].pulse=Math.sin(Date.now()*0.003+x+y)*0.1+0.1;
}
}
if(G.shake>0){
G.shake-=0.1;
if(G.shake<0)G.shake=0;
}
if(G.fadeDirection!==0){
G.fadeAlpha+=G.fadeDirection*0.02;
if(G.fadeAlpha<=0){
G.fadeAlpha=0;
G.fadeDirection=0;
}else if(G.fadeAlpha>=1){
G.fadeAlpha=1;
G.fadeDirection=0;
}
}
if(G.combo>0&&Date.now()-G.lastComboTime>CONFIG.COMBO_TIMEOUT){
G.combo=0;
G.comboMultiplier=1;
}
}

function drawGrid(){
const level=CONFIG.LEVELS[G.level-1];
const size=level.size+2;
ctx.strokeStyle=CONFIG.COLORS.grid;
ctx.lineWidth=1;
for(let x=0;x<=size;x++){

ctx.lineTo(G.gridOffsetX+x*G.cellSize,G.gridOffsetY+size*G.cellSize);
ctx.stroke();
}
for(let y=0;y<=size;y++){
ctx.beginPath();
ctx.moveTo(G.gridOffsetX,G.gridOffsetY+y*G.cellSize);
ctx.lineTo(G.gridOffsetX+size*G.cellSize,G.gridOffsetY+y*G.cellSize);
ctx.stroke();
}
for(let y=0;y<size;y++){
for(let x=0;x<size;x++){
const cell=G.grid[y][x];
const cellX=G.gridOffsetX+x*G.cellSize;
const cellY=G.gridOffsetY+y*G.cellSize;
if(!cell.walkable){
ctx.fillStyle='rgba(50,50,80,0.8)';
ctx.fillRect(cellX+1,cellY+1,G.cellSize-2,G.cellSize-2);
}else if(cell.visited){
const alpha=0.3+cell.animation*0.4;
ctx.fillStyle=`rgba(100,200,255,${alpha})`;
ctx.fillRect(cellX+1,cellY+1,G.cellSize-2,G.cellSize-2);

const pulse=cell.pulse;
ctx.fillStyle=`rgba(240,147,251,${0.1+pulse})`;
ctx.fillRect(cellX+1,cellY+1,G.cellSize-2,G.cellSize-2);
}
}
}
}

);

switch(G.state){
case 'menu':
drawMenu();
break;
case 'game':
drawBackground();
drawGrid();
drawPath();
drawNumbers();
drawParticles();
drawSpecialEffects();
drawUI();
break;
case 'levelComplete':
drawLevelComplete();
break;
case 'gameOver':
drawGameOver();
break;
}
if(G.fadeAlpha<1){
ctx.fillStyle=`rgba(0,0,0,${1-G.fadeAlpha})`;
ctx.fillRect(0,0,canvas.width,canvas.height);
}
if(G.shake>0){
ctx.restore();
}
}
function update(){
updateParticles();
updateSpecialEffects();
updateBackgroundParticles();
updateAnimations();
}
function gameLoop(currentTime){
deltaTime=currentTime-lastTime;
lastTime=currentTime;
update();
draw();
animFrame=requestAnimationFrame(gameLoop);
}
function handleMouseDown(e){
e.preventDefault();
const rect=canvas.getBoundingClientRect();
const x=e.clientX-rect.left;
const y=e.clientY-rect.top;
handleClick(x,y);
}
function handleMouseMove(e){
e.preventDefault();
const rect=canvas.getBoundingClientRect();
const x=e.clientX-rect.left;
const y=e.clientY-rect.top;
handleHover(x,y);
}
function handleTouchStart(e){
e.preventDefault();
const touch=e.touches[0];
const rect=canvas.getBoundingClientRect();
const x=touch.clientX-rect.left;
const y=touch.clientY-rect.top;
G.touchStart={x,y};
G.touchCurrent={x,y};
G.isDragging=true;
handleHover(x,y);
}
function handleTouchMove(e){
e.preventDefault();
if(!G.isDragging)return;
const touch=e.touches[0];
const rect=canvas.getBoundingClientRect();
const x=touch.clientX-rect.left;
const y=touch.clientY-rect.top;
G.touchCurrent={x,y};
handleHover(x,y);
}
function handleTouchEnd(e){
e.preventDefault();
if(!G.isDragging)return;
G.isDragging=false;
if(G.touchStart&&G.touchCurrent){
const dx=G.touchCurrent.x-G.touchStart.x;
const dy=G.touchCurrent.y-G.touchStart.y;
const distance=Math.sqrt(dx*dx+dy*dy);
if(distance<10){
handleClick(G.touchCurrent.x,G.touchCurrent.y);
}
}
G.touchStart=null;
G.touchCurrent=null;
}
function handleClick(x,y){
switch(G.state){
case 'menu':
handleMenuClick(x,y);
break;
case 'game':
handleCellClick(x,y);
break;
case 'levelComplete':
handleLevelCompleteClick(x,y);
break;
case 'gameOver':
handleGameOverClick(x,y);
break;
}
}
function handleHover(x,y){
if(G.state!=='game')return;
const gridX=Math.floor((x-G.gridOffsetX)/G.cellSize);
const gridY=Math.floor((y-G.gridOffsetY)/G.cellSize);
const level=CONFIG.LEVELS[G.level-1];
const size=level.size+2;
if(gridX>=0&&gridX<size&&gridY>=0&&gridY<size){
G.hoveredCell={x:gridX,y:gridY};
}else{
G.hoveredCell=null;
}
}
function handleMenuClick(x,y){
const centerX=canvas.width/2;
const centerY=canvas.height/2;
const btnWidth=200;
const btnHeight=50;
const btnX=centerX-btnWidth/2;
const btnY=centerY;
if(x>=btnX&&x<=btnX+btnWidth&&y>=btnY&&y<=btnY+btnHeight){
initGame();
return;
}
const levels=CONFIG.LEVELS;
const levelBtnSize=50;
const levelBtnGap=10;
const levelStartX=centerX-(levels.length*(levelBtnSize+levelBtnGap)-levelBtnGap)/2;
const levelBtnY=centerY+150;
for(let i=0;i<levels.length;i++){
const btnX=levelStartX+i*(levelBtnSize+levelBtnGap);
if(x>=btnX&&x<=btnX+levelBtnSize&&y>=levelBtnY&&y<=levelBtnY+levelBtnSize){
G.level=levels[i].id;
return;
}
}
}
function handleLevelCompleteClick(x,y){
const centerX=canvas.width/2;
const centerY=canvas.height/2;
const btnWidth=180;
const btnHeight=45;
const btnY=centerY+160;
if(G.level<CONFIG.LEVELS.length){
if(x>=centerX-btnWidth/2&&x<=centerX+btnWidth/2&&y>=btnY&&y<=btnY+btnHeight){
G.level++;
initGame();
return;
}
}
const restartBtnY=btnY+btnHeight+20;
if(x>=centerX-btnWidth/2&&x<=centerX+btnWidth/2&&y>=restartBtnY&&y<=restartBtnY+btnHeight){
G.state='menu';
adContainer.style.display='none';
return;
}
}
function handleGameOverClick(x,y){
const centerX=canvas.width/2;
const centerY=canvas.height/2;
const btnWidth=180;
const btnHeight=45;
const btnY=centerY+80;
if(x>=centerX-btnWidth/2&&x<=centerX+btnWidth/2&&y>=btnY&&y<=btnY+btnHeight){
initGame();
return;
}
const menuBtnY=btnY+btnHeight+20;
if(x>=centerX-btnWidth/2&&x<=centerX+btnWidth/2&&y>=menuBtnY&&y<=menuBtnY+btnHeight){
G.state='menu';
adContainer.style.display='none';
return;
}
}
function handleKeyDown(e){
if(G.state==='game'){
switch(e.key){
case 'ArrowUp':
case 'w':
case 'W':
moveSelection(0,-1);
break;
case 'ArrowDown':
case 's':
case 'S':
moveSelection(0,1);
break;
case 'ArrowLeft':
case 'a':
case 'A':
moveSelection(-1,0);
break;
case 'ArrowRight':
case 'd':
case 'D':
moveSelection(1,0);
break;
case 'Enter':
case ' ':
if(G.selectedCell){
handleCellClick(
G.gridOffsetX+G.selectedCell.x*G.cellSize+G.cellSize/2,
G.gridOffsetY+G.selectedCell.y*G.cellSize+G.cellSize/2
);
}
break;
case 'Escape':
togglePause();
break;
}
}
}
function moveSelection(dx,dy){
const level=CONFIG.LEVELS[G.level-1];
const size=level.size+2;
if(!G.selectedCell){
G.selectedCell={x:1,y:1};
return;
}
const newX=G.selectedCell.x+dx;
const newY=G.selectedCell.y+dy;
if(newX>=0&&newX<size&&newY>=0&&newY<size){
G.selectedCell={x:newX,y:newY};
}
}
function init(){
resizeCanvas();
window.addEventListener('resize',resizeCanvas);
canvas.addEventListener('mousedown',handleMouseDown);
canvas.addEventListener('mousemove',handleMouseMove);
canvas.addEventListener('touchstart',handleTouchStart,{passive:false});
canvas.addEventListener('touchmove',handleTouchMove,{passive:false});
canvas.addEventListener('touchend',handleTouchEnd,{passive:false});
window.addEventListener('keydown',handleKeyDown);
G.state='menu';
gameLoop(0);
}
init();

        function playSound(freq = 440, duration = 0.1) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

    _timerIds.push({type: 'timeout', id: id});

  };
  window.setInterval = function(fn, delay) {
