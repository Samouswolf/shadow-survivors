<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>推箱子进阶版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#c0c0d0;font-family:"Microsoft YaHei","PingFang SC",sans-serif;overflow:hidden;height:100dvh;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#gameContainer{position:relative;width:100%;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center}
#topBar{position:absolute;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:linear-gradient(180deg,rgba(0,0,0,.8),transparent);pointer-events:none}
#topBar>*{pointer-events:auto}
#levelInfo{color:#0ff;font:bold 14px "Microsoft YaHei",sans-serif;text-shadow:0 0 8px rgba(0,255,255,.5)}
#stepInfo{color:#ff0;font:13px "Microsoft YaHei",sans-serif}
#bestInfo{color:#0f0;font:12px "Microsoft YaHei",sans-serif}
#toolBar{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{padding:7px 14px;border:1px solid rgba(0,255,255,.3);border-radius:6px;background:rgba(0,20,30,.85);color:#0ff;font:13px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s;backdrop-filter:blur(4px)}
.btn:hover{background:rgba(0,255,255,.15);border-color:rgba(0,255,255,.6)}
.btn:active{transform:scale(.95)}
.btn.accent{border-color:rgba(255,200,0,.4);color:#fc0}
.btn.accent:hover{background:rgba(255,200,0,.15)}
.btn.danger{border-color:rgba(255,80,80,.4);color:#f66}
.btn.danger:hover{background:rgba(255,80,80,.15)}
#levelSelect{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.95);display:none;flex-direction:column;align-items:center;padding:20px;overflow-y:auto}
#levelSelect h2{color:#0ff;font:bold 24px "Microsoft YaHei",sans-serif;margin:16px 0;text-shadow:0 0 12px rgba(0,255,255,.4)}
#levelGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px;max-width:500px;width:100%;padding:0 8px}
.lvlBtn{aspect-ratio:1;border:1px solid rgba(0,255,255,.2);border-radius:8px;background:rgba(0,30,40,.7);color:#0aa;font:bold 14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center}
.lvlBtn:hover{background:rgba(0,255,255,.15);border-color:rgba(0,255,255,.5)}
.lvlBtn.done{border-color:rgba(0,255,100,.4);color:#0f0;background:rgba(0,40,10,.7)}
.lvlBtn.locked{opacity:.3;pointer-events:none}
.lvlBtn.current{border-color:#ff0;color:#ff0;box-shadow:0 0 8px rgba(255,255,0,.3)}
.lvlBtn .star{font-size:10px;margin-left:2px}
#closeLvl{position:absolute;top:16px;right:20px;font-size:28px;color:#888;cursor:pointer;z-index:101}
#closeLvl:hover{color:#fff}
#winOverlay{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.9);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px}
#winOverlay h2{color:#ffd700;font:bold 28px "Microsoft YaHei",sans-serif;text-shadow:0 0 20px rgba(255,215,0,.5)}
#winOverlay .win-stats{color:#ccc;font:16px "Microsoft YaHei",sans-serif;text-align:center;line-height:2}
#hintPanel{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.9);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#hintPanel p{color:#0ff;font:15px "Microsoft YaHei",sans-serif;text-align:center;max-width:280px}
#hintPanel .moves{color:#ff0;font:bold 18px "Microsoft YaHei",sans-serif;letter-spacing:4px}
#mobileControls{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);z-index:10;display:none;grid-template-areas:". up ." "left . right" ". down .";gap:4px}
.mctrl{width:48px;height:48px;border:1px solid rgba(0,255,255,.25);border-radius:10px;background:rgba(0,20,30,.8);color:#0ff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;-webkit-tap-highlight-color:transparent}
.mctrl:active{background:rgba(0,255,255,.2);border-color:rgba(0,255,255,.6)}
.mctrl.up{grid-area:up}
.mctrl.down{grid-area:down}
.mctrl.left{grid-area:left}
.mctrl.right{grid-area:right}
.solve-progress{color:#ff0;font:12px "Microsoft YaHei",sans-serif;margin-top:4px}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}

.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);height:90px;max-height:90px;overflow:hidden;contain:layout style paint;pointer-events:none!important}.ad-banner-container,.ad-banner-container *{pointer-events:none!important}.ad-banner-container iframe{max-height:90px;pointer-events:none!important}
.ad-banner-container iframe{max-width:100%}
.ad-label{position:absolute;top:1px;right:6px;font:9px "Microsoft YaHei",sans-serif;color:rgba(255,255,255,.35)}
.sponsor-btn{position:fixed;bottom:8px;left:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:2px 6px;border-radius:10px;font:10px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .qr-row{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.sponsor-panel .qr-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px;text-align:center;min-width:140px}
.sponsor-panel .qr-card .qr-icon{font-size:48px;margin-bottom:6px}
.sponsor-panel .qr-card .qr-label{color:#ccc;font:13px "Microsoft YaHei",sans-serif}
.sponsor-panel .qr-card .qr-hint{color:#888;font:11px "Microsoft YaHei",sans-serif;margin-top:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}

.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}

.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* 开始界面 */
.start-screen{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.88);gap:20px;pointer-events:auto}
.start-screen.hidden{display:none}
.start-screen h1{font-size:clamp(28px,6vw,48px);font-weight:900;color:#fff;text-shadow:0 0 30px rgba(255,255,255,.3);letter-spacing:3px;text-align:center;padding:0 20px}

.start-screen .start-btn:hover{transform:scale(1.05);box-shadow:0 8px 40px rgba(102,126,234,.6)}

@keyframes startPulse{0%,100%{box-shadow:0 6px 30px rgba(102,126,234,.4)}50%{box-shadow:0 6px 50px rgba(102,126,234,.7)}}

/* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}

<script>
/* [STORAGE-POLYFILL v1] */
;(function(){
  var G = (typeof window !== 'undefined') ? window : (typeof globalThis !== 'undefined' ? globalThis : this);
  // 浏览器已有 Storage 构造函数，需确保其带 load/save/remove 静态方法
  var S = G.Storage;
  var needAttach = (typeof S === 'undefined' || typeof S.load !== 'function' || typeof S.save !== 'function');
  if (!needAttach) return;
  if (typeof S === 'undefined') { S = function(){}; G.Storage = S; }
  function parseSafe(s, d){
    if (s === null || s === undefined) return d;
    try { return JSON.parse(s); } catch(e) { try { return s; } catch(e2){ return d; } }
  }
  S.load = function(k, d){ try { return parseSafe(localStorage.getItem(k), d); } catch(e){ return d; } };
  S.save = function(k, v){ try { localStorage.setItem(k, typeof v==='string'?v:JSON.stringify(v)); } catch(e){} };
  S.remove = function(k){ try { localStorage.removeItem(k); } catch(e){} };
})();

// ============ 关卡数据 ============
// 符号: #=墙, ' '=空地, @=玩家, $=普通箱, .=普通目标
// R=红箱, B=蓝箱, G=绿箱, Y=黄箱
// r=红目标, b=蓝目标, g=绿目标, y=黄目标
// 0-9=传送门对(同数字配对), I=冰面
const RAW_LEVELS = [
// 1-5: 基础教程
{name:"第一步",grid:["#####","#@$.#","#####"]},
{name:"转角",grid:["#####","#  $#","# @.#","#####"]},
{name:"双箱",grid:["######","# .  #","# $  #","#@$.#","#   #","######"]},
{name:"L型",grid:["#####","#  .#","# $ #","#@$.#","#####"]},
{name:"初试身手",grid:["######","# .  #","# $$ #","#  @ #","#  .#","######"]},

// 6-10: 入门传送门
{name:"传送初探",grid:["######","#0. 0#","# $  #","#  @ #","######"]},
{name:"穿墙而过",grid:["######","#0.  #","# @  #","#$ 0#","#  .#","######"]},
{name:"双门传送",grid:["######","#0. 1#","# $  #","#  @ #","#1 $0#","######"]},
{name:"曲折传送",grid:["######","#0.  #","#    #","#@$ 1#","#  . #","#  10#","######"]},
{name:"传送迷宫",grid:["#######","#0.   #","#  $1 #","# @#  #","#  $ 0#","#  .1 #","#######"]},

// 11-15: 冰面入门
{name:"滑冰初试",grid:["######","#@I .#","#  $ #","######"]},
{name:"冰上推箱",grid:["######","# .  #","# $I #","#@I. #","######"]},
{name:"冰道",grid:["######","#@.  #","#II$ #","#  . #","######"]},
{name:"曲折冰道",grid:["######","# .  #","# $I #","#@ II#","#  .#","######"]},
{name:"冰面快递",grid:["#######","# .   #","#  $  #","# III #","# @   #","# .   #","#######"]},

// 16-20: 彩色箱子
{name:"红蓝配",grid:["######","#R   #","# @  #","#  r #","#  Bb#","######"]},
{name:"三色箱",grid:["######","#R   #","# @  #","# G  #","#  r #","#  gB#","#   b#","######"]},
{name:"四色齐全",grid:["########","#R     #","# @    #","#  G   #","#   r  #","#    gB#","#     b#","#  Yy  #","########"]},
{name:"颜色迷宫",grid:["########","#R  r  #","#  ##  #","# @  B #","#  ##  #","#  b   #","########"]},
{name:"色彩大师",grid:["########","#R    Y#","# ## # #","# @  G #","# # ## #","#B  r y#","#g   b #","########"]},

// 21-25: 传送门+冰面
{name:"冰上传送",grid:["######","#0.I #","#@I  #","#  $0#","######"]},
{name:"传送滑冰",grid:["######","#0I  #","#  I #","#@ $0#","#  .#","######"]},
{name:"冰门组合",grid:["#######","#0.I  #","#  I1 #","#@$   #","#   . #","# 1 0#","#######"]},
{name:"滑入传送",grid:["#######","#0.   #","# III #","# $   #","# @ 1 #","#   .1#","#   0#","#######"]},
{name:"终极冰门",grid:["#######","#0. I #","#  $  #","# II1 #","# @   #","#  .  #","# 1 0#","#######"]},

// 26-30: 全部机制综合
{name:"全能挑战1",grid:["########","#R 0   #","#  II  #","# @ $  #","#  r 1 #","#  . 0 #","#  Bb1 #","########"]},
{name:"全能挑战2",grid:["########","#0R    #","# III  #","#  $   #","#@  .1 #","#  I I #","#  Gr0 #","#  Bb1 #","########"]},
{name:"全能挑战3",grid:["########","#0 Y   #","# III  #","#  $ 1 #","#@  .  #","#  I I #","#  Rr0 #","#  Bb1 #","# Gg   #","########"]},
{name:"终极试炼",grid:["#########","#0R  Y  #","# IIII  #","#  $$ 1 #","#@  .. #","#  IIII #","#  Gg 0 #","#  Bb 1 #","#########"]},
{name:"大师殿堂",grid:["#########","#0R  Y 2#","# IIII  #","#  $$   #","#@  ..  #","#  IIII #","#  Gg 3 #","#  Bb 2 #","#  r 3 #","#########"]},

// 31-35: 额外挑战
{name:"绕圈传送",grid:["########","#0. 1  #","#  $   #","# @ #  #","#  $   #","#   .  #","# 1  0#","########"]},
{name:"冰上芭蕾",grid:["########","#  ..  #","# I$$I #","# I  I #","# I@ I #","#  II  #","########"]},
{name:"颜色传送",grid:["########","#0R  r #","#  I   #","# @ $  #","#  I   #","#  Bb0 #","########"]},
{name:"全能王者",grid:["##########","#0R  .  Y #","# III  III#","#  $$  $$ #","#@   ..  1#","#  IIIIII #","#  Gg  Bb #","#  1  0   #","##########"]},
{name:"终极迷宫",grid:["##########","#0R  .  Y1#","# III  III#","#  $$  $$ #","#@   ..   #","#  IIIII  #","#  Gg  Bb #","# 2  r  3 #","# 1  3  2#","# 0      #","##########"]},
];

// 解析关卡
function parseLevel(raw) {
  const h = raw.grid.length;
  const w = Math.max(...raw.grid.map(r=>r.length));
  const cells = [];
  const boxes = [];
  const targets = [];
  const portals = {};
  let px = 0, py = 0;
  const colorMap = {R:'red',B:'blue',G:'green',Y:'yellow'};
  const targetColorMap = {r:'red',b:'blue',g:'green',y:'yellow'};

  for (let y=0; y<h; y++) {
    cells[y] = [];
    const row = raw.grid[y];
    for (let x=0; x<w; x++) {
      const ch = x < row.length ? row[x] : ' ';
      cells[y][x] = {type:'floor', portalId: -1};

      if (ch === '#') { cells[y][x].type = 'wall'; }
      else if (ch === 'I') { cells[y][x].type = 'ice'; }
      else if (ch >= '0' && ch <= '9') {
        cells[y][x].type = 'portal';
        cells[y][x].portalId = parseInt(ch);
        if (!portals[ch]) portals[ch] = [];
        portals[ch].push({x,y});
      }
      else if (ch === '.') { cells[y][x].type = 'target'; targets.push({x,y,color:null}); }
      else if (targetColorMap[ch]) {
        cells[y][x].type = 'target';
        cells[y][x].targetColor = targetColorMap[ch];
        targets.push({x,y,color:targetColorMap[ch]});
      }
      else if (ch === '@') { px=x; py=y; }
      else if (ch === '$') { boxes.push({x,y,color:null}); }
      else if (colorMap[ch]) { boxes.push({x,y,color:colorMap[ch]}); }
    }
  }
  return {w, h, cells, boxes, targets, portals, px, py, name: raw.name};
}

// ============ 游戏状态 ============
const LEVELS = RAW_LEVELS.map(parseLevel);
let currentLevelIdx = 0;
let level = null;
let playerX = 0, playerY = 0;
let boxes = [];
let steps = 0;
let history = [];
let bestRecords = {};
let unlockedLevel = 0;
let animFrame = 0;
let particles = [];
let portalGlow = 0;
let isSolving = false;
let solveCancel = false;
let solveWorker = null;
let gameStarted = false;

// ============ 存储 ============
function loadProgress() {
  try {
    const p = localStorage.getItem('sokoban_adv_progress');
    if (p !== null) unlockedLevel = parseInt(p);
    const b = localStorage.getItem('sokoban_adv_best');
    if (b !== null) bestRecords = JSON.parse(b);
  } catch(e) {}
}
function saveProgress() {
  try {
    localStorage.setItem('sokoban_adv_progress', unlockedLevel.toString());
    localStorage.setItem('sokoban_adv_best', JSON.stringify(bestRecords));
  } catch(e) {}
}

// ============ Canvas ============
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let cellSize = 48;
let offsetX = 0, offsetY = 0;

function resize() {
  const isMobile = window.innerWidth < 768;
  document.getElementById('mobileControls').style.display = isMobile ? 'grid' : 'none';
  document.getElementById('toolBar').style.bottom = isMobile ? '170px' : '100px';

  const maxW = Math.min(window.innerWidth - 16, 600);
  const maxH = Math.min(window.innerHeight - (isMobile ? 260 : 150), 600);
  if (!level) return;
  const cs = Math.min(Math.floor(maxW / level.w), Math.floor(maxH / level.h), 64);
  cellSize = Math.max(24, cs);
  canvas.width = cellSize * level.w;
  canvas.height = cellSize * level.h;
  offsetX = (window.innerWidth - canvas.width) / 2;
  offsetY = Math.max(30, (window.innerHeight - canvas.height) / 2 - 30);
  canvas.style.position = 'absolute';
  canvas.style.left = offsetX + 'px';
  canvas.style.top = offsetY + 'px';
}

// ============ 渲染 ============
function draw() {
  if (!level) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 背景网格
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = 'rgba(0,255,255,.04)';
  ctx.lineWidth = .5;
  for (let x=0; x<=level.w; x++) {
    ctx.beginPath(); ctx.moveTo(x*cellSize,0); ctx.lineTo(x*cellSize,canvas.height); ctx.stroke();
  }
  for (let y=0; y<=level.h; y++) {
    ctx.beginPath(); ctx.moveTo(0,y*cellSize); ctx.lineTo(canvas.width,y*cellSize); ctx.stroke();
  }

  portalGlow += .03;

  for (let y=0; y<level.h; y++) {
    for (let x=0; x<level.w; x++) {
      const cx = x * cellSize + cellSize/2;
      const cy = y * cellSize + cellSize/2;
      const cell = level.cells[y][x];

      if (cell.type === 'wall') {
        const grad = ctx.createLinearGradient(x*cellSize,y*cellSize,x*cellSize+cellSize,y*cellSize+cellSize);
        grad.addColorStop(0,'#1a2a3a'); grad.addColorStop(.5,'#1e3048'); grad.addColorStop(1,'#162030');
        ctx.fillStyle = grad;
        ctx.fillRect(x*cellSize+1,y*cellSize+1,cellSize-2,cellSize-2);
        ctx.strokeStyle = 'rgba(0,255,255,.15)';
        ctx.strokeRect(x*cellSize+1,y*cellSize+1,cellSize-2,cellSize-2);
        // 科技边框
        ctx.strokeStyle = 'rgba(0,255,255,.08)';
        ctx.beginPath(); ctx.moveTo(x*cellSize+4,y*cellSize+2); ctx.lineTo(x*cellSize+cellSize-4,y*cellSize+2); ctx.stroke();
      } else if (cell.type === 'ice') {
        const grad = ctx.createLinearGradient(x*cellSize,y*cellSize,x*cellSize,y*cellSize+cellSize);
        grad.addColorStop(0,'rgba(100,200,255,.15)'); grad.addColorStop(1,'rgba(100,200,255,.05)');
        ctx.fillStyle = grad;
        ctx.fillRect(x*cellSize+1,y*cellSize+1,cellSize-2,cellSize-2);
        // 冰晶效果
        const iceAlpha = .3 + Math.sin(animFrame*.05 + x + y)*.15;
        ctx.fillStyle = `rgba(180,220,255,${iceAlpha})`;
        const s = cellSize/6;
        ctx.beginPath(); ctx.arc(x*cellSize+s*3,y*cellSize+s*2,s*.6,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x*cellSize+s*2,y*cellSize+s*4,s*.4,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x*cellSize+s*4.5,y*cellSize+s*3.5,s*.5,0,Math.PI*2); ctx.fill();
      } else if (cell.type === 'portal') {
        const glow = .4 + Math.sin(portalGlow*2 + cell.portalId)*.3;
        const grad = ctx.createRadialGradient(cx,cy,cellSize*.05,cx,cy,cellSize*.45);
        grad.addColorStop(0,`rgba(0,255,200,${glow})`);
        grad.addColorStop(.5,`rgba(0,150,200,${glow*.6})`);
        grad.addColorStop(1,'rgba(0,50,100,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(x*cellSize,y*cellSize,cellSize,cellSize);
        // 旋转环
        ctx.save(); ctx.translate(cx,cy);
        ctx.rotate(animFrame*.03 + cell.portalId);
        ctx.strokeStyle = `rgba(0,255,200,${glow*.8})`;
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(0,0,cellSize*.3,0,Math.PI*1.5); ctx.stroke();
        ctx.strokeStyle = `rgba(0,200,255,${glow*.5})`;
        ctx.beginPath(); ctx.arc(0,0,cellSize*.22,Math.PI,Math.PI*2.5); ctx.stroke();
        ctx.restore();
        // 数字
        ctx.fillStyle = `rgba(0,255,200,${glow})`;
        ctx.font = `bold ${cellSize*.35}px "Microsoft YaHei"`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(cell.portalId, cx, cy);
      }

      // 目标点
      if (cell.type === 'target') {
        const tc = cell.targetColor || '#0f0';
        ctx.fillStyle = tc === 'red' ? 'rgba(255,80,80,.3)' : tc === 'blue' ? 'rgba(80,120,255,.3)' : tc === 'green' ? 'rgba(80,255,80,.3)' : tc === 'yellow' ? 'rgba(255,255,80,.3)' : 'rgba(0,255,0,.2)';
        ctx.fillRect(x*cellSize+3,y*cellSize+3,cellSize-6,cellSize-6);
        ctx.strokeStyle = tc === 'red' ? 'rgba(255,80,80,.6)' : tc === 'blue' ? 'rgba(80,120,255,.6)' : tc === 'green' ? 'rgba(80,255,80,.6)' : tc === 'yellow' ? 'rgba(255,255,80,.6)' : 'rgba(0,255,0,.5)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([3,3]);
        ctx.strokeRect(x*cellSize+3,y*cellSize+3,cellSize-6,cellSize-6);
        ctx.setLineDash([]);
        const pulse = .5 + Math.sin(animFrame*.06 + x + y)*.3;
        ctx.fillStyle = tc === 'red' ? `rgba(255,80,80,${pulse})` : tc === 'blue' ? `rgba(80,120,255,${pulse})` : tc === 'green' ? `rgba(80,255,80,${pulse})` : tc === 'yellow' ? `rgba(255,255,80,${pulse})` : `rgba(0,255,0,${pulse})`;
        ctx.beginPath(); ctx.arc(cx,cy,cellSize*.12,0,Math.PI*2); ctx.fill();
      }
    }
  }

  // 箱子
  for (const box of boxes) {
    const bx = box.x * cellSize, by = box.y * cellSize;
    const bc = box.color || '#888';
    const colorMap = {red:'#e04040',blue:'#4080e0',green:'#40c040',yellow:'#e0c040'};
    const fill = colorMap[bc] || '#708090';
    const border = bc === 'red' ? '#ff6060' : bc === 'blue' ? '#60a0ff' : bc === 'green' ? '#60e060' : bc === 'yellow' ? '#ffe060' : '#90a0b0';

    // 阴影
    ctx.fillStyle = 'rgba(0,0,0,.4)';
    ctx.fillRect(bx+4,by+4,cellSize-8,cellSize-8);

    // 主体
    const grad = ctx.createLinearGradient(bx,by,bx+cellSize,by+cellSize);
    grad.addColorStop(0,fill); grad.addColorStop(1,border);
    ctx.fillStyle = grad;
    ctx.fillRect(bx+3,by+3,cellSize-10,cellSize-10);

    ctx.strokeStyle = border;
    ctx.lineWidth = 2;
    ctx.strokeRect(bx+3,by+3,cellSize-10,cellSize-10);

    // 十字标记
    ctx.strokeStyle = 'rgba(255,255,255,.2)';
    ctx.lineWidth = 1;
    const m = cellSize/2;
    ctx.beginPath(); ctx.moveTo(bx+m-4,by+m); ctx.lineTo(bx+m+4,by+m); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bx+m,by+m-4); ctx.lineTo(bx+m,by+m+4); ctx.stroke();

    // 检查是否在目标上
    const cell = level.cells[box.y] && level.cells[box.y][box.x];
    if (cell && cell.type === 'target') {
      const tColor = cell.targetColor;
      if ((!bc && !tColor) || (bc === tColor)) {
        ctx.strokeStyle = 'rgba(255,255,255,.5)';
        ctx.lineWidth = 2;
        ctx.setLineDash([2,2]);
        ctx.strokeRect(bx+1,by+1,cellSize-6,cellSize-6);
        ctx.setLineDash([]);
      }
    }
  }

  // 玩家
  const px = playerX * cellSize, py = playerY * cellSize;
  ctx.save();
  ctx.translate(px + cellSize/2, py + cellSize/2);
  const bounce = Math.sin(animFrame*.08)*2;
  ctx.translate(0, bounce);

  // 光晕
  const glow = ctx.createRadialGradient(0,0,cellSize*.1,0,0,cellSize*.45);
  glow.addColorStop(0,'rgba(0,255,255,.3)');
  glow.addColorStop(1,'rgba(0,255,255,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(0,0,cellSize*.45,0,Math.PI*2); ctx.fill();

  // 身体
  ctx.fillStyle = '#0ff';
  ctx.beginPath(); ctx.arc(0,0,cellSize*.3,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.stroke();

  // 眼睛
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(-cellSize*.08,-cellSize*.06,cellSize*.07,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cellSize*.08,-cellSize*.06,cellSize*.07,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-cellSize*.06,-cellSize*.08,cellSize*.03,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cellSize*.1,-cellSize*.08,cellSize*.03,0,Math.PI*2); ctx.fill();

  ctx.restore();

  // 粒子
  for (let i=particles.length-1; i>=0; i--) {
    const p = particles[i];
    p.life -= .02;
    if (p.life <= 0) { particles.splice(i,1); continue; }
    ctx.fillStyle = `rgba(0,255,255,${p.life})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
  }
}

// ============ 游戏逻辑 ============
function loadLevel(idx) {
  currentLevelIdx = idx;
  level = LEVELS[idx];
  playerX = level.px;
  playerY = level.py;
  boxes = level.boxes.map(b=>({x:b.x,y:b.y,color:b.color}));
  steps = 0;
  history = [];
  updateUI();
  resize();
  emitParticles(3);
}

function getState() {
  return {
    px: playerX, py: playerY,
    boxes: boxes.map(b=>({x:b.x,y:b.y,color:b.color}))
  };
}

function restoreState(s) {
  playerX = s.px; playerY = s.py;
  boxes = s.boxes.map(b=>({x:b.x,y:b.y,color:b.color}));
}

function pushState() {
  history.push(getState());
  if (history.length > 200) history.shift();
}

function isWall(x, y) {
  if (x<0||y<0||x>=level.w||y>=level.h) return true;
  return level.cells[y][x].type === 'wall';
}

function getBoxAt(x, y) {
  return boxes.findIndex(b => b.x === x && b.y === y);
}

function getPortalExit(x, y) {
  const cell = level.cells[y] && level.cells[y][x];
  if (!cell || cell.type !== 'portal') return null;
  const pid = cell.portalId;
  const pair = level.portals[pid];
  if (!pair || pair.length < 2) return null;
  for (const p of pair) {
    if (p.x !== x || p.y !== y) return {x: p.x, y: p.y};
  }
  return null;
}

function canMoveTo(x, y, pushing) {
  if (isWall(x, y)) return false;
  const bi = getBoxAt(x, y);
  if (bi >= 0) {
    if (!pushing) return false;
    const box = boxes[bi];
    const dx = x - (pushing ? playerX : x);
    const dy = y - (pushing ? playerY : y);
    // Check if we can push the box
    const nx = x + dx, ny = y + dy;
    if (isWall(nx, ny)) return false;
    if (getBoxAt(nx, ny) >= 0) return false;
    // Check portal exit for box
    const portalExit = getPortalExit(nx, ny);
    if (portalExit) {
      if (isWall(portalExit.x, portalExit.y)) return false;
      if (getBoxAt(portalExit.x, portalExit.y) >= 0) return false;
    }
    return true;
  }
  return true;
}

function movePlayer(dx, dy) {
  if (!level) return;
  const nx = playerX + dx, ny = playerY + dy;

  if (isWall(nx, ny)) {
    // Check portal
    const portalExit = getPortalExit(nx, ny);
    if (portalExit && !isWall(portalExit.x, portalExit.y) && getBoxAt(portalExit.x, portalExit.y) < 0) {
      pushState();
      playerX = portalExit.x; playerY = portalExit.y;
      steps++;
      emitParticles(5);
      updateUI();
      checkWin();
      return;
    }
    return;
  }

  const bi = getBoxAt(nx, ny);
  if (bi >= 0) {
    // Push box
    const bnx = nx + dx, bny = ny + dy;
    const portalExit = getPortalExit(bnx, bny);
    let destX = bnx, destY = bny;

    if (portalExit) {
      destX = portalExit.x; destY = portalExit.y;
    }

    if (isWall(destX, destY) || getBoxAt(destX, destY) >= 0) return;

    pushState();
    boxes[bi].x = destX;
    boxes[bi].y = destY;
    playerX = nx; playerY = ny;
    steps++;
    emitParticles(8);
    if (portalExit) emitParticles(5, destX * cellSize + cellSize/2, destY * cellSize + cellSize/2);

    // Ice slide for pushed box
    slideBox(bi);
    // Ice slide for player
    slidePlayer(dx, dy);
    updateUI();
    checkWin();
    return;
  }

  pushState();
  playerX = nx; playerY = ny;
  steps++;
  emitParticles(2);

  // Ice slide
  slidePlayer(dx, dy);
  updateUI();
  checkWin();
}

function slidePlayer(dx, dy) {
  const cell = level.cells[playerY] && level.cells[playerY][playerX];
  if (!cell || cell.type !== 'ice') return;
  const nx = playerX + dx, ny = playerY + dy;
  if (isWall(nx, ny) || getBoxAt(nx, ny) >= 0) return;
  playerX = nx; playerY = ny;
  emitParticles(2);
  slidePlayer(dx, dy);
}

function slideBox(bi) {
  const box = boxes[bi];
  const cell = level.cells[box.y] && level.cells[box.y][box.x];
  if (!cell || cell.type !== 'ice') return;
  // Find direction from previous position
  const prev = history.length > 0 ? history[history.length-1] : null;
  if (!prev) return;
  const prevBox = prev.boxes[bi];
  if (!prevBox) return;
  const dx = box.x - prevBox.x;
  const dy = box.y - prevBox.y;
  if (dx === 0 && dy === 0) return;
  const nx = box.x + dx, ny = box.y + dy;
  const portalExit = getPortalExit(nx, ny);
  let destX = nx, destY = ny;
  if (portalExit) { destX = portalExit.x; destY = portalExit.y; }
  if (isWall(destX, destY) || getBoxAt(destX, destY) >= 0) return;
  box.x = destX; box.y = destY;
  emitParticles(4, box.x * cellSize + cellSize/2, box.y * cellSize + cellSize/2);
  slideBox(bi);
}

function emitParticles(count, px, py) {
  const cx = px !== undefined ? px : playerX * cellSize + cellSize/2;
  const cy = py !== undefined ? py : playerY * cellSize + cellSize/2;
  for (let i=0; i<count; i++) {
    particles.push({
      x: cx + (Math.random()-.5)*cellSize*.5,
      y: cy + (Math.random()-.5)*cellSize*.5,
      life: .6 + Math.random()*.4,
      size: 1.5 + Math.random()*2.5
    });
  }
}

function checkWin() {
  for (const box of boxes) {
    const cell = level.cells[box.y] && level.cells[box.y][box.x];
    if (!cell || cell.type !== 'target') return false;
    if (box.color && cell.targetColor !== box.color) return false;
    if (!box.color && cell.targetColor) return false;
  }
  // Win!
  setTimeout(() => {
    const best = bestRecords[currentLevelIdx];
    const isNew = best === undefined || steps < best;
    if (isNew) bestRecords[currentLevelIdx] = steps;
    if (currentLevelIdx + 1 > unlockedLevel && currentLevelIdx < LEVELS.length - 1) {
      unlockedLevel = currentLevelIdx + 1;
    }
    saveProgress();
    document.getElementById('winStats').innerHTML =
      `🎯 步数: <b>${steps}</b><br>🏆 最佳: <b>${bestRecords[currentLevelIdx]}</b>${isNew ? ' <span style="color:#ff0">NEW!</span>' : ''}`;
    document.getElementById('winOverlay').style.display = 'flex';
    showInterstitialAd();
  }, 300);
  return true;
}

function undo() {
  if (history.length === 0) return;
  restoreState(history.pop());
  steps = Math.max(0, steps - 1);
  updateUI();
}

function reset() {
  loadLevel(currentLevelIdx);
}

function updateUI() {
  document.getElementById('levelInfo').textContent = `第${currentLevelIdx+1}关 · ${level.name}`;
  document.getElementById('stepInfo').textContent = `步数: ${steps}`;
  const best = bestRecords[currentLevelIdx];
  document.getElementById('bestInfo').textContent = best !== undefined ? `最佳: ${best}` : '最佳: -';
  buildLevelGrid();
}

// ============ 关卡选择 ============
function buildLevelGrid() {
  const grid = document.getElementById('levelGrid');
  grid.innerHTML = '';
  for (let i = 0; i < LEVELS.length; i++) {
    const btn = document.createElement('div');
    btn.className = 'lvlBtn';
    if (i > unlockedLevel) btn.className += ' locked';
    else if (bestRecords[i] !== undefined) btn.className += ' done';
    if (i === currentLevelIdx) btn.className += ' current';
    btn.textContent = (i + 1);
    if (bestRecords[i] !== undefined) {
      const star = document.createElement('span');
      star.className = 'star';
      star.textContent = '⭐';
      btn.appendChild(star);
    }
    btn.onclick = () => {
      if (i <= unlockedLevel) {
        document.getElementById('levelSelect').style.display = 'none';
        loadLevel(i);
      }
    };
    grid.appendChild(btn);
  }
}

// ============ BFS求解器 ============
function bfsSolve() {
  if (isSolving) return;
  isSolving = true;
  solveCancel = false;

  const hintPanel = document.getElementById('hintPanel');
  const progressEl = document.getElementById('solveProgress');
  hintPanel.style.display = 'flex';
  progressEl.textContent = '探索中...';

  // Run in chunks to avoid blocking
  const startState = getState();
  const visited = new Set();
  const queue = [{state: startState, moves: []}];
  let stateKey = (s) => s.px+','+s.py+'|'+s.boxes.map(b=>b.x+','+b.y+','+(b.color||'n')).sort().join('|');
  visited.add(stateKey(startState));

  const dirs = [{dx:0,dy:-1,name:'上'},{dx:1,dy:0,name:'右'},{dx:0,dy:1,name:'下'},{dx:-1,dy:0,name:'左'}];

  function isWinState(s) {
    for (const box of s.boxes) {
      const cell = level.cells[box.y] && level.cells[box.y][box.x];
      if (!cell || cell.type !== 'target') return false;
      if (box.color && cell.targetColor !== box.color) return false;
      if (!box.color && cell.targetColor) return false;
    }
    return true;
  }

  function canMove(s, dx, dy) {
    const nx = s.px + dx, ny = s.py + dy;
    if (nx<0||ny<0||nx>=level.w||ny>=level.h) return null;
    if (level.cells[ny][nx].type === 'wall') return null;

    const bi = s.boxes.findIndex(b => b.x === nx && b.y === ny);
    if (bi >= 0) {
      const bnx = nx + dx, bny = ny + dy;
      let destX = bnx, destY = bny;
      if (bnx>=0&&bny>=0&&bnx<level.w&&bny<level.h) {
        const pcell = level.cells[bny][bnx];
        if (pcell.type === 'portal') {
          const portalExit = getPortalExit(bnx, bny);
          if (portalExit) { destX = portalExit.x; destY = portalExit.y; }
        }
      }
      if (destX<0||destY<0||destX>=level.w||destY>=level.h) return null;
      if (level.cells[destY][destX].type === 'wall') return null;
      if (s.boxes.some(b => b.x === destX && b.y === destY)) return null;
      const newBoxes = s.boxes.map((b,i) => i===bi ? {x:destX,y:destY,color:b.color} : b);
      return {px:nx,py:ny,boxes:newBoxes};
    }
    return {px:nx,py:ny,boxes:s.boxes};
  }

  let iterCount = 0;
  const maxIters = 200000;

  function processChunk() {
    if (solveCancel) {
      isSolving = false;
      hintPanel.style.display = 'none';
      return;
    }
    const chunkSize = 2000;
    let processed = 0;

    while (queue.length > 0 && processed < chunkSize && iterCount < maxIters) {
      const {state, moves} = queue.shift();
      iterCount++;
      processed++;

      if (isWinState(state)) {
        isSolving = false;
        hintPanel.style.display = 'none';
        showHintMoves(moves);
        return;
      }

      for (const d of dirs) {
        const result = canMove(state, d.dx, d.dy);
        if (!result) continue;
        const key = stateKey(result);
        if (visited.has(key)) continue;
        visited.add(key);
        queue.push({state: result, moves: [...moves, d.name]});
      }
    }

    if (queue.length === 0 || iterCount >= maxIters) {
      isSolving = false;
      hintPanel.style.display = 'none';
      if (iterCount >= maxIters) {
        alert('求解空间过大，无法在限定时间内找到解法。请尝试手动完成！');
      }
      return;
    }

    progressEl.textContent = `探索中... ${visited.size} 状态`;
    requestAnimationFrame(processChunk);
  }

  requestAnimationFrame(processChunk);
}

function showHintMoves(moves) {
  if (moves.length === 0) {
    alert('已经完成！');
    return;
  }
  const preview = moves.length > 10 ? moves.slice(0,10).join('') + '...' : moves.join('');
  const msg = `找到解法！共 ${moves.length} 步\n前几步: ${preview}\n\n是否自动演示前5步？`;
  if (confirm(msg)) {
    autoPlay(moves.slice(0, Math.min(5, moves.length)));
  }
}

function autoPlay(moves) {
  const dirMap = {上:{dx:0,dy:-1},下:{dx:0,dy:1},左:{dx:-1,dy:0},右:{dx:1,dy:0}};
  let i = 0;
  function step() {
    if (i >= moves.length) return;
    const d = dirMap[moves[i]];
    movePlayer(d.dx, d.dy);
    i++;
    setTimeout(step, 350);
  }
  step();
}

// ============ 事件处理 ============
document.addEventListener('keydown', e => {
  if (document.getElementById('levelSelect').style.display === 'flex') {
    if (e.key === 'Escape') document.getElementById('levelSelect').style.display = 'none';
    return;
  }
  if (document.getElementById('winOverlay').style.display === 'flex') {
    if (e.key === 'Enter') { document.getElementById('winOverlay').style.display = 'none'; loadLevel(Math.min(currentLevelIdx+1, LEVELS.length-1)); }
    return;
  }
  const map = {ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};
  const d = map[e.key];
  if (d) { e.preventDefault(); movePlayer(d[0], d[1]); return; }
  if (e.key === 'z' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); undo(); }
  if (e.key === 'r' && !e.ctrlKey) { e.preventDefault(); reset(); }
  if (e.key === 'u') { e.preventDefault(); undo(); }
  if (e.key === 'h') { e.preventDefault(); bfsSolve(); }
  if (e.key === 'l') { e.preventDefault(); document.getElementById('levelSelect').style.display = 'flex'; }
});

// 触摸滑动
let touchStartX = 0, touchStartY = 0;
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, {passive: false});
canvas.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  const threshold = 20;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > threshold) {
    movePlayer(dx > 0 ? 1 : -1, 0);
  } else if (Math.abs(dy) > threshold) {
    movePlayer(0, dy > 0 ? 1 : -1);
  }
});

// 移动端按钮
document.querySelectorAll('.mctrl').forEach(btn => {
  btn.addEventListener('touchstart', e => {
    e.preventDefault();
    const map = {up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
    for (const [cls, d] of Object.entries(map)) {
      if (btn.classList.contains(cls)) movePlayer(d[0], d[1]);
    }
  });
  btn.addEventListener('mousedown', e => {
    const map = {up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
    for (const [cls, d] of Object.entries(map)) {
      if (btn.classList.contains(cls)) movePlayer(d[0], d[1]);
    }
  });
});

        // 音效支持
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq = 440, duration = 0.1) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>

  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {

    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };

    window.clearAllBatchTimers();
  });
})();
