<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>数字推推推</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; overflow: hidden; }
        .game-container { width: 100%; height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 10px; }
        .stat { display: flex; flex-direction: column; align-items: center; color: #fff; }
        .stat-label { font-size: 12px; opacity: 0.8; }
        .stat-value { font-size: 24px; font-weight: bold; color: #ffd700; }
        
        .game-board { flex: 1; display: flex; align-items: center; justify-content: center; }
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; max-width: 350px; width: 100%; aspect-ratio: 1; padding: 15px; background: rgba(0,0,0,0.3); border-radius: 15px; }
        
        .cell { display: flex; align-items: center; justify-content: center; border-radius: 10px; font-size: 24px; font-weight: bold; color: #fff; cursor: pointer; transition: all 0.2s; min-height: 60px; }
        .cell:active { transform: scale(0.95); }
        .cell.empty { background: rgba(255,255,255,0.1); }
        
        .cell[data-num="2"] { background: #4facfe; }
        .cell[data-num="4"] { background: #43e97b; }
        .cell[data-num="8"] { background: #fa709a; }
        .cell[data-num="16"] { background: #fee140; color: #333; }
        .cell[data-num="32"] { background: #f5576c; }
        .cell[data-num="64"] { background: #a855f7; }
        .cell[data-num="128"] { background: #3b82f6; font-size: 20px; }
        .cell[data-num="256"] { background: #ec4899; font-size: 20px; }
        .cell[data-num="512"] { background: #f59e0b; font-size: 20px; }
        .cell[data-num="1024"] { background: #10b981; font-size: 16px; }
        .cell[data-num="2048"] { background: linear-gradient(135deg, #ffd700, #ff6b6b); font-size: 16px; }
        
        .controls { display: flex; gap: 10px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
        .btn { padding: 12px 25px; border: none; border-radius: 25px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; }
        .btn-secondary { background: linear-gradient(135deg, #4facfe, #00f2fe); color: #fff; }
        
        .info-panel { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); color: #fff; padding: 30px; border-radius: 15px; text-align: center; display: none; z-index: 100; }
        .info-panel.show { display: block; }
        .info-panel h2 { color: #ffd700; margin-bottom: 15px; }
        .info-panel p { margin-bottom: 10px; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">分数</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">最高分</div>
                <div class="stat-value" id="highScore">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">步数</div>
                <div class="stat-value" id="moves">0</div>
            </div>
        </div>
        
        <div class="game-board">
            <div class="grid" id="grid"></div>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" id="btnNew">🔄 新游戏</button>
            <button class="btn btn-secondary" id="btnHint">💡 提示</button>
        </div>
        
        <div class="info-panel" id="winPanel">
            <h2>🎉 恭喜通关！</h2>
            <p>你达到了 <span id="winNum">2048</span></p>
            <p>用了 <span id="winMoves">0</span> 步</p>
            <button class="btn btn-primary" id="btnContinue">继续挑战</button>
        </div>
        
        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    <script>
        const SIZE = 5;
        let grid = [];
        let score = 0;
        let moves = 0;
        let highScore = parseInt(localStorage.getItem('highscore_数字推推推') || '0');
        let targetNum = 2048;
        let won = false;
        
        function init() {
            grid = Array(SIZE).fill(null).map(() => Array(SIZE).fill(0));
            score = 0;
            moves = 0;
            won = false;
            
            addRandom();
            addRandom();
            render();
            updateStats();
        }
        
        function addRandom() {
            const empty = [];
            for (let i = 0; i < SIZE; i++) {
                for (let j = 0; j < SIZE; j++) {
                    if (grid[i][j] === 0) empty.push({i, j});
                }
            }
            if (empty.length > 0) {
                const cell = empty[Math.floor(Math.random() * empty.length)];
                grid[cell.i][cell.j] = Math.random() < 0.9 ? 2 : 4;
            }
        }
        
        function render() {
            const gridEl = document.getElementById('grid');
            gridEl.innerHTML = '';
            
            for (let i = 0; i < SIZE; i++) {
                for (let j = 0; j < SIZE; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    const num = grid[i][j];
                    if (num === 0) {
                        cell.classList.add('empty');
                    } else {
                        cell.dataset.num = num;
                        cell.textContent = num;
                    }
                    
                    // 点击交换
                    cell.onclick = () => handleClick(i, j);
                    gridEl.appendChild(cell);
                }
            }
        }
        
        let selected = null;
        
        function handleClick(i, j) {
            if (grid[i][j] === 0) return;
            
            if (!selected) {
                selected = {i, j};
                render();
                highlight(i, j);
            } else {
                if (selected.i === i && selected.j === j) {
                    selected = null;
                    render();
                } else {
                    // 检查是否相邻
                    const di = Math.abs(selected.i - i);
                    const dj = Math.abs(selected.j - j);
                    
                    if ((di === 1 && dj === 0) || (di === 0 && dj === 1)) {
                        // 交换
                        swap(selected.i, selected.j, i, j);
                        moves++;
                        selected = null;
                        render();
                        updateStats();
                    } else {
                        // 重新选择
                        selected = {i, j};
                        render();
                        highlight(i, j);
                    }
                }
            }
        }
        
        function highlight(i, j) {
            const cells = document.querySelectorAll('.cell');
            const index = i * SIZE + j;
            cells[index].style.boxShadow = '0 0 20px #ffd700';
            cells[index].style.transform = 'scale(1.1)';
        }
        
        function swap(i1, j1, i2, j2) {
            const val1 = grid[i1][j1];
            const val2 = grid[i2][j2];
            
            if (val1 === val2) {
                // 合并
                const newVal = val1 * 2;
                grid[i2][j2] = newVal;
                grid[i1][j1] = 0;
                score += newVal;
                
                if (newVal >= targetNum && !won) {
                    won = true;
                    showWin(newVal);
                }
            } else {
                // 交换位置
                grid[i1][j1] = val2;
                grid[i2][j2] = val1;
            }
            
            // 检查是否需要添加新数字
            setTimeout(() => {
                if (hasEmpty()) {
                    addRandom();
                    render();
                }
                
                if (isGameOver()) {
                    setTimeout(() => alert('游戏结束！分数：' + score), 100);
                }
            }, 100);
        }
        
        function hasEmpty() {
            for (let i = 0; i < SIZE; i++) {
                for (let j = 0; j < SIZE; j++) {
                    if (grid[i][j] === 0) return true;
                }
            }
            return false;
        }
        
        function isGameOver() {
            // 检查是否还能合并
            for (let i = 0; i < SIZE; i++) {
                for (let j = 0; j < SIZE; j++) {
                    if (grid[i][j] === 0) return false;
                    // 检查右边
                    if (j < SIZE - 1 && grid[i][j] === grid[i][j + 1]) return false;
                    // 检查下边
                    if (i < SIZE - 1 && grid[i][j] === grid[i + 1][j]) return false;
                }
            }
            return true;
        }
        
        function showWin(num) {
            document.getElementById('winNum').textContent = num;
            document.getElementById('winMoves').textContent = moves;
            document.getElementById('winPanel').classList.add('show');
        }
        
        function updateStats() {
            document.getElementById('score').textContent = score;
            document.getElementById('moves').textContent = moves;
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('highscore_数字推推推', highScore);
            }
            document.getElementById('highScore').textContent = highScore;
        }
        
        function findHint() {
            // 找最佳合并位置
            for (let i = 0; i < SIZE; i++) {
                for (let j = 0; j < SIZE; j++) {
                    if (grid[i][j] !== 0) {
                        // 检查右边
                        if (j < SIZE - 1 && grid[i][j] === grid[i][j + 1]) {
                            return {i1: i, j1: j, i2: i, j2: j + 1};
                        }
                        // 检查下边
                        if (i < SIZE - 1 && grid[i][j] === grid[i + 1][j]) {
                            return {i1: i, j1: j, i2: i + 1, j2: j};
                        }
                    }
                }
            }
            return null;
        }
        
        document.getElementById('btnNew').onclick = () => {
            document.getElementById('winPanel').classList.remove('show');
            init();
        };
        
        document.getElementById('btnHint').onclick = () => {
            const hint = findHint();
            if (hint) {
                selected = {i: hint.i1, j: hint.j1};
                render();
                highlight(hint.i1, hint.j1);
                setTimeout(() => {
                    selected = {i: hint.i2, j: hint.j2};
                    render();
                    highlight(hint.i2, hint.j2);
                }, 500);
                setTimeout(() => {
                    selected = null;
                    render();
                }, 1500);
            } else {
                alert('没有可合并的相邻方块了！');
            }
        };
        
        document.getElementById('btnContinue').onclick = () => {
            document.getElementById('winPanel').classList.remove('show');
            targetNum *= 2;
        };
        
        // 键盘支持
        document.addEventListener('keydown', (e) => {
            if (selected) {
                const {i, j} = selected;
                let target = null;
                
                switch(e.key) {
                    case 'ArrowUp': if (i > 0) target = {i: i - 1, j}; break;
                    case 'ArrowDown': if (i < SIZE - 1) target = {i: i + 1, j}; break;
                    case 'ArrowLeft': if (j > 0) target = {i, j: j - 1}; break;
                    case 'ArrowRight': if (j < SIZE - 1) target = {i, j: j + 1}; break;
                    case 'Enter': selected = null; render(); return;
                }
                
                if (target) {
                    e.preventDefault();
                    swap(i, j, target.i, target.j);
                    moves++;
                    selected = null;
                    render();
                    updateStats();
                }
            }
        });
        
        init();
    </script>
</body>
</html>
