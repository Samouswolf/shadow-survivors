<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>华容道挑战</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1c1917 0%, #292524 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
#game-container { position: relative; width: 100%; max-width: 450px; padding: 20px; }
#game-header { text-align: center; color: #fff; margin-bottom: 20px; }
#game-header h1 { font-size: 28px; font-weight: bold; margin-bottom: 10px; }
#game-header .stats { display: flex; justify-content: center; gap: 30px; font-size: 16px; }
#game-header .stats span { color: #4ade80; font-weight: bold; }
#game-board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; padding: 10px; background: #44403c; border-radius: 10px; margin-bottom: 20px; }
.cell { aspect-ratio: 1; background: #78716c; border-radius: 4px; }
.piece { position: absolute; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
.piece.selected { box-shadow: 0 0 15px #fbbf24; }
.piece.cao { background: #ef4444; color: #fff; }
.piece.guan { background: #f97316; color: #fff; }
.piece.zhao { background: #eab308; color: #fff; }
.piece.ma { background: #22c55e; color: #fff; }
.piece.huang { background: #3b82f6; color: #fff; }
.exit { background: #22c55e; }
#controls { display: flex; gap: 15px; justify-content: center; margin-bottom: 20px; }
.btn { padding: 12px 25px; font-size: 16px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; transition: all 0.2s; }
.btn-primary { background: linear-gradient(145deg, #6366f1, #4f46e5); color: #fff; }
.btn-primary:hover { transform: translateY(-2px); }
#message { text-align: center; font-size: 18px; font-weight: bold; color: #4ade80; min-height: 30px; }
#loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1c1917; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
#loading-screen .spinner { width: 50px; height: 50px; border: 4px solid rgba(99,102,241,0.3); border-top-color: #6366f1; border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.ad-banner-container { width: 100%; max-width: 728px; margin-top: auto; padding: 10px; }
.sponsor-btn { position: fixed; top: 20px; right: 20px; width: 50px; height: 50px; background: rgba(255,165,0,0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; z-index: 100; }
.sponsor-panel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 200; align-items: center; justify-content: center; }
.sponsor-panel.show { display: flex; }
.sponsor-content { background: #fff; padding: 30px; border-radius: 20px; text-align: center; }
.sponsor-close { position: absolute; top: 20px; right: 20px; width: 40px; height: 40px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; }
.interstitial-ad { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 300; align-items: center; justify-content: center; flex-direction: column; }
.interstitial-ad.show { display: flex; }
</style>
</head>
<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

<div id="loading-screen">
  <div class="spinner"></div>
  <p style="color:#fff;margin-top:20px;">游戏加载中...</p>
</div>

<div class="sponsor-btn" onclick="showSponsor()">☕</div>
<div class="sponsor-panel" id="sponsor-panel" onclick="hideSponsor()">
  <div class="sponsor-content" onclick="event.stopPropagation()">
    <h3>支持开发者</h3>
    <p>感谢您的支持！</p>
  </div>
  <div class="sponsor-close" onclick="hideSponsor()">×</div>
</div>

<div class="interstitial-ad" id="interstitial-ad">
  <h2 style="color:#fff;margin-bottom:30px;">🎉 恭喜通关！</h2>
  <button class="btn btn-primary" onclick="hideInterstitial()">继续游戏</button>
</div>

<div id="game-container">
  <div id="game-header">
    <h1>华容道挑战</h1>
    <div class="stats">
      <span>步数: <span id="moves">0</span></span>
      <span>最佳: <span id="best">--</span></span>
    </div>
  </div>
  
  <div id="message"></div>
  
  <div id="game-board">
    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell"></div><div class="cell exit"></div><div class="cell exit"></div><div class="cell"></div>
  </div>
  
  <div id="controls">
    <button class="btn btn-primary" onclick="newGame()">新游戏</button>
    <button class="btn btn-primary" onclick="resetGame()">重置</button>
  </div>
</div>

<div class="ad-banner-container">
  <div style="background:#f0f0f0;height:90px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#666;">广告位</div>
</div>


  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script>
class GameCore {
  static init(options) {
    if (options.loading) {
      setTimeout(() => {
        document.getElementById('loading-screen').style.display = 'none';
      }, 800);
    }
    if (options.highScore) {
      this.highScoreKey = options.highScore;
    }
  }
  
  static getHighScore() {
    return localStorage.getItem(this.highScoreKey) || '--';
  }
  
  static setHighScore(value) {
    const current = localStorage.getItem(this.highScoreKey);
    if (!current || value < parseInt(current)) {
      localStorage.setItem(this.highScoreKey, value);
      return true;
    }
    return false;
  }
}

GameCore.init({ loading: true, highScore: '华容道挑战' });

class HuarongRoadGame {
  constructor() {
    this.board = [];
    this.pieces = [];
    this.selectedPiece = null;
    this.moves = 0;
    
    this.boardElement = document.getElementById('game-board');
    this.movesDisplay = document.getElementById('moves');
    this.bestDisplay = document.getElementById('best');
    this.message = document.getElementById('message');
    
    this.cellSize = 0;
    
    this.init();
  }
  
  init() {
    this.bestDisplay.textContent = GameCore.getHighScore();
    this.newGame();
    this.resize();
    window.addEventListener('resize', () => this.resize());
  }
  
  newGame() {
    this.pieces = [
      { id: 'cao', name: '曹操', x: 1, y: 0, w: 2, h: 2, color: 'cao' },
      { id: 'guan', name: '关羽', x: 0, y: 0, w: 1, h: 2, color: 'guan' },
      { id: 'zhao', name: '赵云', x: 3, y: 0, w: 1, h: 2, color: 'zhao' },
      { id: 'ma', name: '马超', x: 0, y: 2, w: 1, h: 2, color: 'ma' },
      { id: 'huang', name: '黄忠', x: 3, y: 2, w: 1, h: 2, color: 'huang' },
      { id: 'zu1', name: '卒', x: 1, y: 2, w: 1, h: 1, color: 'guan' },
      { id: 'zu2', name: '卒', x: 2, y: 2, w: 1, h: 1, color: 'zhao' },
      { id: 'zu3', name: '卒', x: 1, y: 3, w: 1, h: 1, color: 'ma' },
      { id: 'zu4', name: '卒', x: 2, y: 3, w: 1, h: 1, color: 'huang' }
    ];
    
    this.moves = 0;
    this.movesDisplay.textContent = '0';
    this.selectedPiece = null;
    
    this.render();
  }
  
  resize() {
    const boardWidth = this.boardElement.offsetWidth - 20;
    this.cellSize = boardWidth / 4;
    this.render();
  }
  
  render() {
    const piecesContainer = this.boardElement.querySelector('.pieces');
    if (piecesContainer) piecesContainer.remove();
    
    const container = document.createElement('div');
    container.className = 'pieces';
    container.style.position = 'absolute';
    container.style.top = '10px';
    container.style.left = '10px';
    container.style.width = 'calc(100% - 20px)';
    container.style.height = 'calc(100% - 20px)';
    
    this.pieces.forEach(piece => {
      const element = document.createElement('div');
      element.className = `piece piece-${piece.color}`;
      element.textContent = piece.name;
      
      element.style.width = piece.w * this.cellSize + 'px';
      element.style.height = piece.h * this.cellSize + 'px';
      element.style.left = piece.x * this.cellSize + 'px';
      element.style.top = piece.y * this.cellSize + 'px';
      
      if (this.selectedPiece === piece) {
        element.classList.add('selected');
      }
      
      element.onclick = () => this.selectPiece(piece);
      
      container.appendChild(element);
    });
    
    this.boardElement.appendChild(container);
  }
  
  selectPiece(piece) {
    if (!this.selectedPiece) {
      this.selectedPiece = piece;
      this.render();
    } else {
      if (this.selectedPiece === piece) {
        this.selectedPiece = null;
        this.render();
      } else {
        this.selectedPiece = null;
        this.render();
      }
    }
  }
  
  movePiece(dx, dy) {
    if (!this.selectedPiece) return;
    
    const piece = this.selectedPiece;
    const newX = piece.x + dx;
    const newY = piece.y + dy;
    
    if (newX < 0 || newX + piece.w > 4 || newY < 0 || newY + piece.h > 5) {
      return;
    }
    
    if (this.checkCollision(newX, newY, piece.w, piece.h, piece)) {
      return;
    }
    
    piece.x = newX;
    piece.y = newY;
    this.moves++;
    this.movesDisplay.textContent = this.moves;
    this.render();
    
    if (this.isWin()) {
      this.win();
    }
  }
  
  checkCollision(x, y, w, h, excludePiece) {
    for (const piece of this.pieces) {
      if (piece === excludePiece) continue;
      
      if (x < piece.x + piece.w && x + w > piece.x &&
          y < piece.y + piece.h && y + h > piece.y) {
        return true;
      }
    }
    return false;
  }
  
  isWin() {
    const cao = this.pieces.find(p => p.id === 'cao');
    return cao.x === 1 && cao.y === 3;
  }
  
  win() {
    this.message.textContent = '🎉 恭喜通关！';
    this.message.style.color = '#4ade80';
    
    if (GameCore.setHighScore(this.moves)) {
      this.bestDisplay.textContent = this.moves;
      this.message.textContent += ' 新纪录！';
    }
    
    setTimeout(() => {
      document.getElementById('interstitial-ad').classList.add('show');
    }, 500);
  }
  
  resetGame() {
    this.newGame();
  }
  
  setupControls() {
    document.addEventListener('keydown', (e) => {
      if (!this.selectedPiece) return;
      
      switch(e.key) {
        case 'ArrowUp': e.preventDefault(); this.movePiece(0, -1); break;
        case 'ArrowDown': e.preventDefault(); this.movePiece(0, 1); break;
        case 'ArrowLeft': e.preventDefault(); this.movePiece(-1, 0); break;
        case 'ArrowRight': e.preventDefault(); this.movePiece(1, 0); break;
      }
    });
  }
}

function showSponsor() {
  document.getElementById('sponsor-panel').classList.add('show');
}

function hideSponsor() {
  document.getElementById('sponsor-panel').classList.remove('show');
}

function hideInterstitial() {
  document.getElementById('interstitial-ad').classList.remove('show');
}

const huarong = new HuarongRoadGame();
</script>
</body>
</html>
