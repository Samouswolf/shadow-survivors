<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>拼图大师</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; color: #fff; overflow: hidden; }
        
        .game-container { width: 100%; flex: 1; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: #fff; }
        .stats { display: flex; gap: 20px; font-size: 14px; }
        
        .main-area { flex: 1; display: flex; flex-direction: column; gap: 15px; }
        
        .puzzle-container { flex: 1; background: rgba(0,0,0,0.5); border-radius: 15px; padding: 10px; display: flex; align-items: center; justify-content: center; }
        
        .puzzle-grid { display: grid; gap: 2px; background: #333; padding: 5px; border-radius: 10px; }
        
        .puzzle-piece { background: #4ecdc4; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .puzzle-piece.selected { background: #ff6b6b; }
        .puzzle-piece.correct { background: #4ecdc4; }
        
        .preview { width: 100%; height: 80px; background: rgba(255,255,255,0.1); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 32px; }
        
        .actions { display: flex; gap: 10px; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; }
        
        .action-btn { flex: 1; padding: 15px; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; background: rgba(255,255,255,0.2); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }
    /* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}

<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="title">🧩 拼图大师</div>
            <div class="stats">
                <span>🎯 步数: <span id="steps">0</span></span>
                <span>⏱️ 时间: <span id="time">0</span></span>
            </div>
        </div>
        
        <div class="main-area">
            <div class="preview">🧩 🎨 ✨ 🎮</div>
            
            <div class="puzzle-container">
                <div class="puzzle-grid" id="puzzleGrid"></div>
            </div>
        </div>
        
        <div class="actions">
            <button class="action-btn" onclick="newGame()">🎮 新游戏</button>
            <button class="action-btn" onclick="shuffle()">🔀 打乱</button>
        </div>
    </div>
    
    

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;

<script src="../game_core.js"></script>
    <script>
        const GAME_NAME = '拼图大师';
        GameCore.init({ highScore: GAME_NAME });
        
        let gridSize = 3;
        let pieces = [];
        let selectedPiece = null;
        let steps = 0;
        let time = 0;
        let timer = null;
        
        const colors = ['#4ecdc4', '#ff6b6b', '#ffe66d', '#95e1d3', '#f38181', '#aa96da', '#fcbad3', '#a8d8ea', '#ff9a9e'];
        const symbols = ['🔴', '🟢', '🔵', '🟡', '🟣', '🟠', '🟤', '⚫', '⚪'];
        
        function initGame() {
            newGame();
        }
        
        function newGame() {
            stopTimer();
            steps = 0;
            time = 0;
            selectedPiece = null;
            
            pieces = Array.from({ length: gridSize * gridSize }, (_, i) => ({
                value: i,
                symbol: symbols[i],
                color: colors[i],
                correctPos: i
            }));
            
            renderPuzzle();
            startTimer();
        }
        
        function shuffle() {
            for (let i = pieces.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pieces[i], pieces[j]] = [pieces[j], pieces[i]];
            }
            
            steps = 0;
            time = 0;
            selectedPiece = null;
            renderPuzzle();
            startTimer();
        }
        
        function renderPuzzle() {
            const grid = document.getElementById('puzzleGrid');
            grid.innerHTML = '';
            
            grid.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
            grid.style.gridTemplateRows = `repeat(${gridSize}, 1fr)`;
            grid.style.width = '300px';
            grid.style.height = '300px';
            
            pieces.forEach((piece, index) => {
                const cell = document.createElement('div');
                cell.className = 'puzzle-piece';
                cell.textContent = piece.symbol;
                cell.style.background = piece.color;
                cell.dataset.index = index;
                
                cell.addEventListener('click', () => selectPiece(index));
                
                grid.appendChild(cell);
            });
            
            updateUI();
        }
        
        function selectPiece(index) {
            if (selectedPiece === null) {
                selectedPiece = index;
                document.querySelectorAll('.puzzle-piece')[index].classList.add('selected');
            } else if (selectedPiece === index) {
                selectedPiece = null;
                document.querySelectorAll('.puzzle-piece')[index].classList.remove('selected');
            } else {
                swapPieces(selectedPiece, index);
                selectedPiece = null;
                document.querySelectorAll('.puzzle-piece')[selectedPiece]?.classList.remove('selected');
            }
        }
        
        function swapPieces(index1, index2) {
            [pieces[index1], pieces[index2]] = [pieces[index2], pieces[index1]];
            steps++;
            renderPuzzle();
            
            checkWin();
        }
        
        function checkWin() {
            const isWin = pieces.every((piece, index) => piece.correctPos === index);
            
            if (isWin) {
                stopTimer();
                GameCore.hints.show(`🎉 恭喜完成！步数: ${steps}，时间: ${time}秒`);
                GameCore.highScore.set(GAME_NAME, steps);
            }
        }
        
        function startTimer() {
            timer = setInterval(() => {
                time++;
                updateUI();
            }, 1000);
        }
        
        function stopTimer() {
            if (timer) {
                clearInterval(timer);
                timer = null;
            }
        }
        
        function updateUI() {
            document.getElementById('steps').textContent = steps;
            document.getElementById('time').textContent = time;
        }
        
        initGame();
        GameCore.touch.enableAllButtons();
    </script>
<!-- [BATCH-FIX:responsive-js] -->
<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>
<!-- [/BATCH-FIX:responsive-js] -->
<!-- [BATCH-FIX:touch-support] -->
<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>
<!-- [/BATCH-FIX:touch-support] -->

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
