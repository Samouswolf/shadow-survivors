function getPos(e){const r=canvas.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:(t.clientX-r.left)/scale,y:(t.clientY-r.top)/scale};}

function nodeX(c){return 56+c*94;}
function nodeY(r){return HUD_H+30+r*104;}

function buildMap(){
    G.nodes=[];G.edges=[];G.obstacles=[];G.roadMarks=[];G.npcs_cars=[];
    for(let r=0;r<GRID;r++)for(let c=0;c<GRID;c++){
        const idx=r*GRID+c;
        let tp='customer';
        if(r===0&&c===0)tp='depot';
        else if(Math.random()<0.32)tp='merchant';
        else if(Math.random()<0.18)tp='service';
        G.nodes.push({id:idx,r:r,c:c,x:nodeX(c),y:nodeY(r),type:tp,name:NODE_NAMES[idx%NODE_NAMES.length],visits:0});
    }
    for(let r=0;r<GRID;r++)for(let c=0;c<GRID;c++){
        const i=r*GRID+c;
        if(c<GRID-1)G.edges.push({a:i,b:i+1,horiz:true,heavy:Math.random()<0.25});
        if(r<GRID-1)G.edges.push({a:i,b:i+GRID,horiz:false,heavy:Math.random()<0.25});
    }
    for(let i=0;i<9;i++){
        G.obstacles.push({x:50+Math.random()*(W-100),y:HUD_H+40+Math.random()*(H-HUD_H-TASK_H-80),w:28+Math.random()*40,h:22+Math.random()*28,type:Math.random()<0.45?'cone':(Math.random()<0.6?'barrier':'pothole'),col:Math.random()<0.5?'#ff7043':(Math.random()<0.5?'#78909c':'#5d4037')});
    }
    for(let i=0;i<48;i++)G.roadMarks.push({x:Math.random()*W,y:HUD_H+30+Math.random()*(H-HUD_H-TASK_H-60),len:10+Math.random()*20,rot:Math.random()*Math.PI*0.5,col:Math.random()<0.3?'#fdd835':'#e0e0e0'});
    for(let i=0;i<5;i++)G.npcs_cars.push({x:60+Math.random()*(W-120),y:HUD_H+50+Math.random()*(H-HUD_H-TASK_H-100),vx:(Math.random()<0.5?-1:1)*(0.5+Math.random()*1.2),vy:0,col:VEHICLE_PALETTE[Math.floor(Math.random()*VEHICLE_PALETTE.length)],angle:Math.random()*Math.PI,speed:0.8+Math.random()*1.2});
}
buildMap();
G.player.x=G.nodes[0].x;G.player.y=G.nodes[0].y;

function toast(text,life,col){G.toaster.push({text:text,life:life||180,maxLife:life||180,y:0,col:col||'#fff'});}
function floatText(x,y,text,col,life){G.floatingTexts.push({x:x,y:y,text:text,col:col||'#fff',life:life||50,maxLife:life||50,vy:-1.2});}
function spawnBurst(x,y,col,n,speed){for(let i=0;i<n;i++)G.particles.push({x:x,y:y,vx:(Math.random()-0.5)*(speed||5),vy:(Math.random()-0.5)*(speed||5)-2,life:28+Math.random()*28,maxLife:50,color:col,size:1.5+Math.random()*3});}
function spawnTrail(x,y,col){G.particles.push({x:x+(Math.random()-0.5)*4,y:y+(Math.random()-0.5)*4,vx:(Math.random()-0.5)*0.5,vy:0.1+Math.random()*0.3,life:14+Math.random()*10,maxLife:22,color:col,size:2+Math.random()*2});}

function manhattanDist(a,b){return Math.abs(a.x-b.x)+Math.abs(a.y-b.y);}
function euclid(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}

function makeTask(level){
    const avlTypes=Math.min(TASK_TYPES.length,2+level);
    let typeIdx=Math.floor(Math.random()*avlTypes);
    const isForcedVip=G.nextVip3&&Math.random()<0.35;
    if(isForcedVip){typeIdx=3;G.nextVip3=false;}
    const nonDepot=G.nodes.filter(n=>n.type!=='depot');
    const pickN=nonDepot[Math.floor(Math.random()*nonDepot.length)];
    let dropN=nonDepot[Math.floor(Math.random()*nonDepot.length)];
    let tries=0;while(dropN.id===pickN.id&&tries<20){dropN=nonDepot[Math.floor(Math.random()*nonDepot.length)];tries++;}
    const dist=manhattanDist(pickN,dropN);
    const base=50+level*28+Math.floor(dist*0.18)+Math.floor(Math.random()*40);
    const timeBase=(18+Math.floor(dist/50)-level)*G.timeBonus;
    const timeLimit=Math.max(10,Math.floor(timeBase+Math.random()*14));
    return{
        id:Math.random().toString(36).slice(2,10),
        typeIdx:typeIdx,typeName:TASK_TYPE_NAMES[typeIdx],typeCol:TASK_TYPE_COLORS[typeIdx],
        pickNode:pickN.id,dropNode:dropN.id,
        pickX:pickN.x,pickY:pickN.y,dropX:dropN.x,dropY:dropN.y,
        pickName:pickN.name,dropName:dropN.name,
        status:'pending',reward:base,tip:0,penalty:0,
        timeLeft:timeLimit*60,totalTime:timeLimit*60,
        isVip:typeIdx===3,fragile:typeIdx===4,cold:typeIdx===6,highValue:typeIdx===7,
        vipMul:typeIdx===3?3:(typeIdx===7?2:1),progress:0,
        cargoName:CARGO_NAMES[Math.floor(Math.random()*CARGO_NAMES.length)],
        acceptT:0,dist:dist,priority:typeIdx
    };
}

    G.activeEvents=[];G.eventCooldown=480;G.achievements={};

    G.statDim1=0;G.statDim2=100;G.loadedItems=0;G.maxCapacity=4;
    G.totalEarned=0;G.bestStreak=0;G.trafficLevel=1;
    G.weather=0;G.weatherTimer=0;G.weatherCooldown=360;
    G.shakeTimer=0;G.shakeIntensity=0;G.screenFlash=0;
    G.tutorialStep=0;G.showTutorial=true;G.currentLevelTasks=0;
    for(let i=0;i<ACH.length;i++)ACH[i].done=false;
    for(let i=0;i<2;i++)G.tasks.push(makeTask(1));
    toast('🚀 '+GAME_TIME+'秒航天发射挑战开始!走近任务点自动处理',300);
    toast('💡 提示:WASD/方向键移动,触屏拖动,U升级',360);
}

function startGame(){initAudio();initState();sfxStart();}
function endGame(){
    G.state=STATE_OVER;
    let achBonus=0;ACH.forEach(a=>{if(a.done)achBonus+=100;});
    G.score+=achBonus;
    if(G.score>G.high){G.high=G.score;Storage.save('rocket_highscore',G.high);G.screenFlash=30;G.flashColor='#ffd700';}
    sfxError();
}
function togglePause(){if(G.state===STATE_PLAYING)G.state=STATE_PAUSE;else if(G.state===STATE_PAUSE)G.state=STATE_PLAYING;sfxBtn();}

function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();}
function drawBtn(c,x,y,w,h,text,name,color,textColor,fontSize){
    G.btnRects[name]={x:x,y:y,w:w,h:h};
    c.fillStyle=color||'#ff6b35';c.strokeStyle='rgba(255,255,255,0.9)';c.lineWidth=2;
    roundRect(c,x,y,w,h,8);c.fill();c.stroke();
    c.fillStyle=textColor||'#fff';c.font='bold '+(fontSize||14)+'px "Microsoft YaHei"';
    c.textAlign='center';c.textBaseline='middle';
    c.fillText(text,x+w/2,y+h/2);
    c.textBaseline='alphabetic';c.textAlign='left';
}
function hitBtn(p,name){const r=G.btnRects[name];return r&&p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;}

function tryTriggerEvent(){
    G.eventCooldown--;
    if(G.eventCooldown>0)return;
    if(G.activeEvents.length>=2)return;
    if(G.tickAcc%30!==0)return;
    if(Math.random()<0.028){
        const ev=EVENTS_DATA[Math.floor(Math.random()*EVENTS_DATA.length)];
        if(ev.dur>0)G.activeEvents.push({...ev,timeLeft:ev.dur});
        ev.onS(G);G.eventCooldown=420+Math.floor(Math.random()*300);
        sfxEvent();toast('📢 '+ev.name+' · '+ev.desc,280,'#ffd700');
        spawnBurst(W/2,HUD_H/2+10,'#ffd700',18,7);
    }
}
function updateEvents(){
    for(let i=G.activeEvents.length-1;i>=0;i--){
        G.activeEvents[i].timeLeft--;
        if(G.activeEvents[i].timeLeft<=0){
            G.activeEvents[i].onE(G);
            toast('📢 事件结束: '+G.activeEvents[i].name,180,'#bdbdbd');
            G.activeEvents.splice(i,1);
        }
    }
}

function updateWeather(){
    if(G.weatherTimer>0){G.weatherTimer--;return;}
    if(G.weatherCooldown>0){G.weatherCooldown--;return;}
    if(G.tickAcc%80!==0||Math.random()>=0.04)return;
    let nw=Math.floor(Math.random()*WEATHER_STATES.length);
    if(nw===G.weather)nw=(nw+1+Math.floor(Math.random()*(WEATHER_STATES.length-1)))%WEATHER_STATES.length;
    G.weather=nw;G.weatherTimer=420+Math.floor(Math.random()*420);G.weatherCooldown=300;
    toast('🌤️ 天气变化: '+WEATHER_STATES[nw].name+' ('+WEATHER_STATES[nw].desc+')',260);
}

function tryBuyUpgrade(idx){
    const u=UPGRADES[idx];
    if(G.upgradesBought[u.id]){sfxError();toast('⚠️ 该升级已拥有',120,'#ef5350');return false;}
    if(G.score<u.cost){sfxError();toast('💸 分数不足!需要 '+u.cost,150,'#ef5350');return false;}
    G.score-=u.cost;G.upgradesBought[u.id]=true;sfxUpgrade();
    if(u.id==='speed')G.speedMul=1.25;
    if(u.id==='cap'){G.capBonus=2;G.maxCapacity=6;}
    if(u.id==='safe')G.safeMul=0.5;
    if(u.id==='bonus')G.bonusMul=1.3;
    if(u.id==='radar')G.radarMul=1.3;
    if(u.id==='time')G.timeBonus=1.2;
    toast('⬆️ '+u.icon+' 升级成功: '+u.name,220,'#8bc34a');
    spawnBurst(W/2,HUD_H+40,'#8bc34a',22,6);
    return true;
}

function checkAchievements(){
    for(let i=0;i<ACH.length;i++){
        const a=ACH[i];
        if(!a.done&&a.req(G)){
            a.done=true;G.achievements[a.id]=true;
            G.score+=60;sfxAchieve();
            toast('🏅 成就解锁: '+a.icon+' '+a.name+' (+60分)',300,'#ffd700');
            spawnBurst(W/2,120,'#ffd700',30,8);
            G.screenFlash=10;G.flashColor='#ffd700';
        }
    }
}

function acceptTask(t){
    if(t.status!=='pending')return false;
    t.status='accepted';t.acceptT=G.tickAcc;sfxPickup();
    toast('📝 接单: ['+t.typeName+'] '+t.cargoName+' → 基础'+t.reward,200);
    floatText(t.pickX,t.pickY-15,'接!'+t.typeCol,'#fff',40);
    return true;
}

function pickCargo(t){
    if(t.status!=='accepted')return false;
    if(G.loadedItems>=G.maxCapacity){sfxError();toast('📦 载货已满!先送货再装',150,'#ef5350');return false;}
    if(euclid(G.player,t)>45*G.radarMul){sfxError();toast('📍 请先到达取货点 '+t.pickName,150,'#ef5350');return false;}
    t.status='loaded';G.loadedItems++;sfxPickup();
    const n=G.nodes[t.pickNode];n.visits++;
    toast('✅ 装货: '+t.cargoName+' 前往'+t.dropName,180,'#8bc34a');
    floatText(t.pickX,t.pickY-20,'装!','#4caf50',45);
    spawnBurst(t.pickX,t.pickY,'#8bc34a',10,4);
    return true;
}

function deliverTask(t){
    if(t.status!=='loaded')return false;
    if(euclid(G.player,t)>45*G.radarMul){sfxError();toast('📍 请先到达收货点 '+t.dropName,150,'#ef5350');return false;}
    const timeRatio=t.timeLeft/t.totalTime;
    let base=t.reward*t.vipMul;
    let tip=0,pen=0;
    if(timeRatio>0.72){tip=Math.floor(base*0.5*G.tipMul);G.early++;}
    else if(timeRatio>0.42){tip=Math.floor(base*0.22*G.tipMul);}
    else if(timeRatio<=0.02){pen=Math.floor(base*0.52);G.failed++;}
    if(t.fragile&&G.accidents===0)tip=Math.floor(tip*1.6);
    if(t.cold)tip=Math.floor(tip*1.25);
    const levelMul=LEVEL_MULS[Math.min(4,G.level-1)];
    const total=Math.max(0,Math.floor((base+tip-pen)*G.scoreMul*G.bonusMul*levelMul));
    G.score=Math.max(0,G.score+total);G.totalEarned+=total;
    G.completed++;G.combo++;G.loadedItems--;G.currentLevelTasks++;
    if(t.isVip)G.vipDone++;
    G.statDim1=Math.min(100,G.statDim1+6.5);
    G.statDim2=Math.max(0,Math.min(100,G.statDim2+(pen>0?-5:(tip>0?3:1))));
    G.maxCombo=Math.max(G.maxCombo,G.combo);G.bestStreak=G.maxCombo;
    const dn=G.nodes[t.dropNode];dn.visits++;
    G.scorePopups.push({x:t.dropX,y:t.dropY-20,text:'+'+total,life:65,maxLife:65,color:tip>base*0.35?'#ffd700':'#8bc34a'});
    spawnBurst(t.dropX,t.dropY,tip>0?'#ffd700':'#8bc34a',14,5);
    if(pen>0)G.combo=0;
    sfxSuccess();if(tip>0)sfxCoin();if(tip>base*0.5)sfxAlarm();
    toast('💯 送达!+'+total+'分'+(tip>0?' 小费+'+tip:'')+(pen>0?' 超时-'+pen:''),200,tip>0?'#ffd700':(pen>0?'#ef5350':'#8bc34a'));
    if(G.currentLevelTasks>=G.tasksPerLevel&&G.level<5){
        G.level++;G.currentLevelTasks=0;G.tasksPerLevel+=2;
        toast('🎖️ 升级! 第'+G.level+'关 '+LEVEL_NAMES[G.level-1]+' x'+LEVEL_MULS[G.level-1],300,LEVEL_COLORS[G.level-1]);
        sfxLevelUp();spawnBurst(W/2,HUD_H+60,LEVEL_COLORS[G.level-1],40,9);
        G.screenFlash=20;G.flashColor=LEVEL_COLORS[G.level-1];
    }
    return true;
}

function updatePlayer(){
    let dx=0,dy=0;
    if(G.keys['ArrowLeft']||G.keys['a']||G.keys['A'])dx-=1;
    if(G.keys['ArrowRight']||G.keys['d']||G.keys['D'])dx+=1;
    if(G.keys['ArrowUp']||G.keys['w']||G.keys['W'])dy-=1;
    if(G.keys['ArrowDown']||G.keys['s']||G.keys['S'])dy+=1;
    if(G.pointerActive&&G.pointerTarget){
        const ddx=G.pointerTarget.x-G.player.x,ddy=G.pointerTarget.y-G.player.y;
        const d=Math.hypot(ddx,ddy);
        if(d>6){dx=ddx/d;dy=ddy/d;}
    }
    const ws=WEATHER_STATES[G.weather];
    const sp=G.player.speed*G.speedMul*G.roadBad*G.rainMul*ws.speed;
    const mag=Math.hypot(dx,dy);
    if(mag>0){dx/=mag;dy/=mag;G.player.angle=Math.atan2(dy,dx);}
    G.player.vx+=dx*sp*0.27;G.player.vy+=dy*sp*0.27;
    G.player.vx*=0.81;G.player.vy*=0.81;
    const mv=sp;const vv=Math.hypot(G.player.vx,G.player.vy);
    if(vv>mv){G.player.vx*=mv/vv;G.player.vy*=mv/vv;}
    const oldX=G.player.x,oldY=G.player.y;
    G.player.x+=G.player.vx;G.player.y+=G.player.vy;
    G.player.x=Math.max(28,Math.min(W-28,G.player.x));
    G.player.y=Math.max(HUD_H+20,Math.min(H-TASK_H-20,G.player.y));
    G.totalDistance+=Math.hypot(G.player.x-oldX,G.player.y-oldY);
    if(vv>1.2&&G.tickAcc%4===0)spawnTrail(G.player.x,G.player.y+6,'rgba(180,180,180,0.4)');
    G.player.trail.push({x:G.player.x,y:G.player.y,life:20});
    if(G.player.trail.length>22)G.player.trail.shift();
    G.player.trail.forEach(tr=>tr.life--);
    
    for(let oi=0;oi<G.obstacles.length;oi++){
        const ob=G.obstacles[oi];
        if(G.player.x>ob.x-20&&G.player.x<ob.x+ob.w+20&&G.player.y>ob.y-20&&G.player.y<ob.y+ob.h+20){
            const cx=ob.x+ob.w/2,cy=ob.y+ob.h/2;
            const ddx=G.player.x-cx,ddy=G.player.y-cy;const dd=Math.max(1,Math.hypot(ddx,ddy));
            G.player.x=cx+ddx/dd*(ob.w/2+24);G.player.y=cy+ddy/dd*(ob.h/2+24);
            G.player.vx*=-0.32;G.player.vy*=-0.32;
            G.accidents++;G.combo=0;
            const loss=Math.floor(32*G.safeMul*(ob.type==='pothole'?1.4:1));
            G.score=Math.max(0,G.score-loss);
            G.statDim2=Math.max(0,G.statDim2-3);
            G.shakeTimer=14;G.shakeIntensity=Math.random()<0.5?4:6;
            G.scorePopups.push({x:G.player.x,y:G.player.y-30,text:'-'+loss,life:55,maxLife:55,color:'#ef5350'});
            spawnBurst(G.player.x,G.player.y,'#ef5350',14,6);sfxHit();
            toast('💥 撞'+(ob.type==='cone'?'锥桶':(ob.type==='barrier'?'护栏':'坑洞'))+'! -'+loss+'分 连击×0',170,'#ef5350');
            break;
        }
    }
    
    for(const nc of G.npcs_cars){
        if(Math.hypot(G.player.x-nc.x,G.player.y-nc.y)<32&&Math.random()<0.015*G.rainAcc){
            G.combo=0;G.accidents++;
            const loss=Math.floor(22*G.safeMul);
            G.score=Math.max(0,G.score-loss);G.shakeTimer=10;G.shakeIntensity=4;
            spawnBurst((G.player.x+nc.x)/2,(G.player.y+nc.y)/2,'#ffb300',10,5);
            G.scorePopups.push({x:G.player.x,y:G.player.y-28,text:'-'+loss,life:45,maxLife:45,color:'#ffb300'});
            floatText(G.player.x,G.player.y-40,'剐蹭!','#ffb300',40);
        }
    }
}

function updateNpcs(){
    for(const nc of G.npcs_cars){
        nc.x+=nc.vx;nc.y+=nc.vy;
        if(nc.x<35){nc.vx=Math.abs(nc.vx);nc.angle=0;}
        if(nc.x>W-35){nc.vx=-Math.abs(nc.vx);nc.angle=Math.PI;}
        if(nc.y<HUD_H+30){nc.vy=Math.abs(nc.vy);}
        if(nc.y>H-TASK_H-30){nc.vy=-Math.abs(nc.vy);}
        if(Math.random()<0.01){
            nc.vx=(Math.random()<0.5?-1:1)*(0.5+Math.random()*1.2);
            nc.angle=nc.vx<0?Math.PI:0;
        }
    }
}

function updateTasks(){
    G.spawnTimer--;
    const interval=Math.max(90,Math.floor(270/(G.spawnMul||1)));
    if(G.spawnTimer<=0){
        G.spawnTimer=interval;
        if(G.tasks.length<G.maxTasks)G.tasks.push(makeTask(G.level));
    }
    for(let i=G.tasks.length-1;i>=0;i--){
        const t=G.tasks[i];
        if(t.status==='accepted'||t.status==='loaded'){
            t.timeLeft--;
            if(t.timeLeft<=-200){
                G.score=Math.max(0,G.score-45);G.failed++;G.combo=0;
                G.statDim1=Math.max(0,G.statDim1-3);G.statDim2=Math.max(0,G.statDim2-10);
                if(t.status==='loaded')G.loadedItems--;
                const tx=t.status==='loaded'?t.dropX:t.pickX,ty=t.dropY-20;
                G.scorePopups.push({x:tx,y:ty,text:'-45',life:55,maxLife:55,color:'#ef5350'});
                sfxError();toast('❌ 任务超时! -45分 ['+t.typeName+'] '+t.cargoName,200,'#ef5350');
                spawnBurst(tx,ty,'#ef5350',15,6);
                G.tasks.splice(i,1);continue;
            }
        }else if(t.status==='pending'){
            t.acceptT++;
            if(t.acceptT>960){G.tasks.splice(i,1);continue;}
        }
    }
}

function tryInteract(){
    for(let i=G.tasks.length-1;i>=0;i--){
        const t=G.tasks[i];
        if(t.status==='pending'&&euclid(G.player,{x:t.pickX,y:t.pickY})<36*G.radarMul){acceptTask(t);return;}
    }
    for(let i=G.tasks.length-1;i>=0;i--){
        const t=G.tasks[i];
        if(t.status==='accepted'&&euclid(G.player,{x:t.pickX,y:t.pickY})<42*G.radarMul){pickCargo(t);return;}
    }
    for(let i=G.tasks.length-1;i>=0;i--){
        const t=G.tasks[i];
        if(t.status==='loaded'&&euclid(G.player,{x:t.dropX,y:t.dropY})<42*G.radarMul){deliverTask(t);G.tasks.splice(i,1);return;}
    }
}

function update(){
    if(G.state!==STATE_PLAYING)return;
    G.timeLeft--;G.tickAcc++;
    tryTriggerEvent();updateEvents();updateWeather();checkAchievements();
    if(G.shakeTimer>0)G.shakeTimer--;
    if(G.screenFlash>0)G.screenFlash--;
    updatePlayer();updateNpcs();updateTasks();
    if(G.tickAcc%28===0)tryInteract();
    
    for(let i=G.scorePopups.length-1;i>=0;i--){G.scorePopups[i].y-=0.9;G.scorePopups[i].life--;if(G.scorePopups[i].life<=0)G.scorePopups.splice(i,1);}
    for(let i=G.floatingTexts.length-1;i>=0;i--){const ft=G.floatingTexts[i];ft.y+=ft.vy;ft.vy*=0.96;ft.life--;if(ft.life<=0)G.floatingTexts.splice(i,1);}
    for(let i=G.particles.length-1;i>=0;i--){const p=G.particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.19;p.vx*=0.99;p.life--;if(p.life<=0)G.particles.splice(i,1);}
    for(let i=G.toaster.length-1;i>=0;i--){G.toaster[i].life--;G.toaster[i].y+=(G.toaster.length-1-i)*0.32;if(G.toaster[i].life<=0)G.toaster.splice(i,1);}
    
    if(G.timeLeft<=0){endGame();return;}
}

function drawSkyAndGround(){
    const ws=WEATHER_STATES[G.weather];
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,ws.col1);g.addColorStop(0.28,ws.col2);g.addColorStop(1,'#33691e');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#2e7d32';ctx.fillRect(0,HUD_H,W,H-HUD_H);
    ctx.strokeStyle='rgba(0,70,0,0.28)';ctx.lineWidth=1;
    for(let y=HUD_H+4;y<H;y+=17){ctx.beginPath();for(let x=0;x<W;x+=13){ctx.moveTo(x,y);ctx.lineTo(x+3,y+7);}ctx.stroke();}
}

function drawRoads(){
    for(const e of G.edges){
        const a=G.nodes[e.a],b=G.nodes[e.b];
        ctx.strokeStyle=e.heavy?ROAD_PALETTE[1]:ROAD_PALETTE[2];ctx.lineWidth=e.heavy?44:36;ctx.lineCap='round';
        ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
        ctx.strokeStyle=ROAD_PALETTE[0];ctx.lineWidth=e.heavy?36:28;
        ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
    }
    for(const e of G.edges){
        const a=G.nodes[e.a],b=G.nodes[e.b];
        ctx.strokeStyle='#fdd835';ctx.lineWidth=2.5;ctx.setLineDash(e.heavy?[14,14]:[11,11]);
        ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
    }
    ctx.setLineDash([]);
}

function drawObstacles(){
    for(const ob of G.obstacles){
        ctx.fillStyle='rgba(0,0,0,0.34)';roundRect(ctx,ob.x+2,ob.y+5,ob.w,ob.h,4);ctx.fill();
        ctx.fillStyle=ob.col;roundRect(ctx,ob.x,ob.y,ob.w,ob.h,4);ctx.fill();
        ctx.strokeStyle='rgba(0,0,0,0.45)';ctx.lineWidth=1.5;ctx.stroke();
        if(ob.type==='cone'){
            ctx.fillStyle='#fff';ctx.fillRect(ob.x+4,ob.y+ob.h*0.34,ob.w-8,ob.h*0.16);
            ctx.fillRect(ob.x+4,ob.y+ob.h*0.72,ob.w-8,ob.h*0.16);
        }else if(ob.type==='barrier'){
            ctx.fillStyle='#fff';for(let s=0;s<3;s++)ctx.fillRect(ob.x+3+s*(ob.w-6)/3,ob.y+3,(ob.w-6)/3-2,ob.h-6);
        }else{
            ctx.fillStyle='rgba(40,20,0,0.55)';ctx.beginPath();ctx.ellipse(ob.x+ob.w/2,ob.y+ob.h/2,ob.w/2-2,ob.h/2-2,0,0,Math.PI*2);ctx.fill();
        }
    }
}

function drawNodes(){
    for(const n of G.nodes){
        const rt=G.tasks.find(t=>t.pickNode===n.id&&(t.status==='pending'||t.status==='accepted'));
        const dl=G.tasks.find(t=>t.dropNode===n.id&&t.status==='loaded');
        const related=rt||dl;
        let col='#78909c',ic='📍';
        if(n.type==='depot'){col='#455a64';ic='🏠';}
        else if(n.type==='merchant'){col='#fb8c00';ic='🛒';}
        else if(n.type==='service'){col='#7e57c2';ic='⛽';}
        else{col='#00897b';ic='🏘️';}
        if(related)col=dl?'#43a047':(rt.status==='accepted'?'#ffb300':'#e53935');
        ctx.fillStyle='rgba(0,0,0,0.38)';ctx.beginPath();ctx.arc(n.x+2,n.y+5,n.r+1,0,Math.PI*2);ctx.fill();
        ctx.fillStyle=col;ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='#fff';ctx.lineWidth=2.8;ctx.stroke();
        ctx.font='18px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(ic,n.x,n.y+1);
        ctx.textAlign='left';ctx.textBaseline='alphabetic';
        ctx.fillStyle='#fff';ctx.font='bold 10px "Microsoft YaHei"';ctx.textAlign='center';
        ctx.fillText(n.name,n.x,n.y+n.r+13);
        if(n.visits>0){ctx.fillStyle='#ffd700';ctx.font='9px Arial';ctx.fillText('★'.repeat(Math.min(3,n.visits)),n.x,n.y+n.r+25);}
        ctx.textAlign='left';
        if(related){

function drawMiniMap(){

        const rt=G.tasks.find(t=>t.pickNode===n.id&&(t.status==='pending'||t.status==='accepted'));
        const dl=G.tasks.find(t=>t.dropNode===n.id&&t.status==='loaded');
        let c='#78909c';

    }
    ctx.fillStyle='#ffeb3b';ctx.beginPath();ctx.arc(m.x+G.player.x*sx,m.y+(G.player.y-HUD_H)*sy,3.4,0,Math.PI*2);ctx.fill();

}

function handlePointerDown(p){
    if(G.showTutorial&&G.state===STATE_PLAYING){G.showTutorial=false;}
    if(G.state===STATE_MENU){
        if(hitBtn(p,'startBtn')){startGame();return;}
        startGame();return;
    }
    if(G.state===STATE_OVER){
        if(hitBtn(p,'restartBtn')){initState();sfxBtn();return;}
        if(hitBtn(p,'menuBtn')){G.state=STATE_MENU;sfxBtn();return;}
    }
    if(G.state===STATE_PAUSE){
        if(hitBtn(p,'resumeBtn')){togglePause();return;}
        if(hitBtn(p,'shopBtn')){togglePause();G.showUpgrade=true;sfxBtn();return;}
        if(hitBtn(p,'quitBtn')){G.state=STATE_MENU;sfxBtn();return;}
    }
    if(G.state===STATE_PLAYING){
        if(hitBtn(p,'btnPause')){togglePause();return;}
        if(hitBtn(p,'btnUp')){G.showUpgrade=true;sfxBtn();return;}
        if(G.showUpgrade){
            for(let i=0;i<UPGRADES.length;i++)if(hitBtn(p,'up'+i)){tryBuyUpgrade(i);return;}
            if(hitBtn(p,'closeUp')){G.showUpgrade=false;sfxBtn();return;}
        }
        G.pointerActive=true;G.pointerTarget={x:p.x,y:p.y};G.dragStart={...p};
    }
}
function handlePointerMove(p){if(G.state===STATE_PLAYING&&G.pointerActive)G.pointerTarget={x:p.x,y:p.y};}
function handlePointerUp(){G.pointerActive=false;G.pointerTarget=null;G.dragStart=null;}

canvas.addEventListener('mousedown',e=>{e.preventDefault();handlePointerDown(getPos(e));},{passive:false});
canvas.addEventListener('mousemove',e=>handlePointerMove(getPos(e)));
canvas.addEventListener('mouseup',()=>handlePointerUp());
canvas.addEventListener('mouseleave',()=>handlePointerUp());
canvas.addEventListener('touchstart',e=>{e.preventDefault();handlePointerDown(getPos(e));},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();handlePointerMove(getPos(e));},{passive:false});
canvas.addEventListener('touchend',e=>{e.preventDefault();handlePointerUp();},{passive:false});

window.addEventListener('keydown',e=>{
    G.keys[e.key]=true;
    if(e.key===' '||e.key==='Enter'){
        if(G.state===STATE_MENU){startGame();e.preventDefault();}
        else if(G.state===STATE_OVER){initState();e.preventDefault();}
    }
    if(e.key==='Escape'){
        if(G.showUpgrade){G.showUpgrade=false;sfxBtn();e.preventDefault();}
        else if(G.state===STATE_PLAYING||G.state===STATE_PAUSE){togglePause();e.preventDefault();}
    }
    if((e.key==='u'||e.key==='U')&&G.state===STATE_PLAYING){G.showUpgrade=!G.showUpgrade;sfxBtn();}
    if(e.key==='m'||e.key==='M'){G.miniMap.show=!G.miniMap.show;}
});
window.addEventListener('keyup',e=>{G.keys[e.key]=false;});

// ================= 天气粒子渲染 =================
const WEATHER_PARTICLES = [];
function updateWeatherParticles() {
    const ws = WEATHER_STATES[G.weather];
    const density = (ws.id === 2 || ws.id === 4) ? 80 : (ws.id === 3 ? 12 : 0);
    while (WEATHER_PARTICLES.length < density) {
        WEATHER_PARTICLES.push({
            x: Math.random() * W,
            y: HUD_H + Math.random() * (H - HUD_H - TASK_H),
            vx: ws.id === 2 ? 0.6 + Math.random() * 0.6 : (ws.id === 4 ? 0.2 : 0),
            vy: ws.id === 4 ? 1.5 + Math.random() * 1.5 : (ws.id === 2 ? 5 + Math.random() * 3 : 0.8),
            life: 180 + Math.random() * 120,
            size: ws.id === 4 ? 2.5 + Math.random() * 1.5 : 1.8,
            len: ws.id === 2 ? 8 + Math.random() * 6 : 0
        });
    }
    while (WEATHER_PARTICLES.length > density) WEATHER_PARTICLES.pop();
    for (let i = WEATHER_PARTICLES.length - 1; i >= 0; i--) {
        const p = WEATHER_PARTICLES[i];
        p.x += p.vx; p.y += p.vy; p.life--;
        if (p.y > H - TASK_H || p.x > W || p.life <= 0) {
            p.x = Math.random() * W; p.y = HUD_H - 20; p.life = 180 + Math.random() * 100;
        }
    }
}
function drawWeatherParticles() {
    const ws = WEATHER_STATES[G.weather];
    if (ws.id === 2) {
        ctx.strokeStyle = 'rgba(180, 210, 255, 0.65)'; ctx.lineWidth = 1.5;
        for (const p of WEATHER_PARTICLES) {
            ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + p.len * 0.3, p.y + p.len); ctx.stroke();
        }
    } else if (ws.id === 4) {
        for (const p of WEATHER_PARTICLES) {
            ctx.fillStyle = 'rgba(255,255,255,0.85)';
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
        }
    } else if (ws.id === 3) {
        ctx.fillStyle = 'rgba(220,225,230,0.35)';
        for (const p of WEATHER_PARTICLES) {
            ctx.beginPath(); ctx.arc(p.x, p.y, 10 + Math.sin(G.tickAcc / 20 + p.x) * 3, 0, Math.PI * 2); ctx.fill();
        }
    }
    if (ws.id >= 2) {
        ctx.globalAlpha = 0.22;
        const g = ctx.createLinearGradient(0, HUD_H, 0, H - TASK_H);
        g.addColorStop(0, ws.col2); g.addColorStop(1, 'rgba(0,0,0,0.4)');
        ctx.fillStyle = g; ctx.fillRect(0, HUD_H, W, H - HUD_H - TASK_H);
        ctx.globalAlpha = 1;
    }
}

            sfxAchieve();
            G.screenFlash = 14; G.flashColor = '#ffd700';
            spawnBurst(W / 2, H / 2, '#ffd700', 50, 10);
        }
    }
}

// ================= update/draw 增强钩子 =================
const _origUpdate = update;
update = function () {
    _origUpdate();
    if (G.state !== STATE_PLAYING) return;
    updateTollAndGas();
    updateWeatherParticles();
    checkMilestones();
};

const _origDraw = draw;
draw = function () {
    ctx.save();
    if (G.state === STATE_MENU) { drawMenu(); ctx.restore(); return; }
    drawSkyAndGround();
    drawRoads();
    drawWeatherParticles();
    drawTollAndGas();
    drawTaskPaths();
    drawObstacles();
    drawMiniMap();
    drawNodes();
    drawTaskTooltips();
    drawNpcs();
    drawPlayer();
    drawEffects();
    drawHUD();
    drawTaskPanel();
    drawToasts();
    drawTutorial();
    if (G.showUpgrade && G.state === STATE_PLAYING) drawUpgradePanel();
    if (G.state === STATE_PAUSE) drawPause();
    if (G.state === STATE_OVER) drawOver();
    drawDetailedStats();
    drawScreenFlash();
    ctx.restore();
};

// ================= Tab 键切换统计面板 =================
window.addEventListener('keydown', function (e) {
    if (e.key === 'Tab') {
        SHOW_STATS = !SHOW_STATS;
        if (SHOW_STATS) sfxBtn();
        e.preventDefault();
    }
});


setInterval(function loop(){
    if(G.state===STATE_PLAYING)update();
    draw();
},16);

const _sbtn=document.getElementById('start-game-btn');
_sbtn.addEventListener('click',function(){initAudio();startGame();this.style.display='none';});

})();
</script>

<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>

<script>
(function(){

  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
