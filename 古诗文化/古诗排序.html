.interstitial-ad .ad-content p{color:#aaa;font:14px "Microsoft YaHei",sans-serif;margin-bottom:12px}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}

    {t:"凉州词",a:"王翰",l:["葡萄美酒夜光杯","欲饮琵琶马上催","醉卧沙场君莫笑","古来征战几人回"]},
    {t:"凉州词",a:"王之涣",l:["黄河远上白云间","一片孤城万仞山","羌笛何须怨杨柳","春风不度玉门关"]},

// ===== 粒子系统 =====
var particles=[];
function Particle(x,y,vx,vy,life,color,size){
    this.x=x;this.y=y;this.vx=vx;this.vy=vy;
    this.life=life;this.maxLife=life;this.color=color;this.size=size;
}
function spawnParticles(x,y,count,color,speed,size){
    for(var i=0;i<count;i++){
        var a=Math.random()*Math.PI*2;
        var s=Math.random()*speed;
        particles.push(new Particle(x,y,Math.cos(a)*s,Math.sin(a)*s,60+Math.random()*40,color||"#ffd700",size||2+Math.random()*3));
    }
}
function updateParticles(){
    for(var i=particles.length-1;i>=0;i--){
        var p=particles[i];
        p.x+=p.vx;p.y+=p.vy;p.vy+=0.05;p.life--;
        if(p.life<=0) particles.splice(i,1);
    }
}
function drawParticles(){
    for(var i=0;i<particles.length;i++){
        var p=particles[i];
        var a=p.life/p.maxLife;
        ctx.globalAlpha=a;
        ctx.fillStyle=p.color;
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.size*a,0,Math.PI*2);
        ctx.fill();
    }
    ctx.globalAlpha=1;
}

// ===== 工具函数 =====
function rand(a,b){return a+Math.random()*(b-a);}
function randInt(a,b){return Math.floor(rand(a,b+1));}
function shuffle(arr){
    for(var i=arr.length-1;i>0;i--){
        var j=randInt(0,i);
        var t=arr[i];arr[i]=arr[j];arr[j]=t;
    }
    return arr;
}
function lerp(a,b,t){return a+(b-a)*t;}
function clamp(v,mn,mx){return v<mn?mn:v>mx?mx:v;}
function dist(x1,y1,x2,y2){return Math.sqrt((x2-x1)*(x2-x1)+(y2-y1)*(y2-y1));}
function easeOut(t){return 1-(1-t)*(1-t);}
function easeIn(t){return t*t;}

// ===== 绘图工具 =====
function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
}
function drawBg(grad){
    var cols=grad||COLORS.bg1;
    var grd=ctx.createLinearGradient(0,0,0,H);
    grd.addColorStop(0,cols[0]);grd.addColorStop(0.5,cols[1]);grd.addColorStop(1,cols[2]||cols[0]);
    ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
}
function drawText(txt,x,y,size,color,align,baseline,bold){
    ctx.font=(bold?"bold ":"")+size+"px 'Microsoft YaHei','PingFang SC',sans-serif";
    ctx.fillStyle=color||"#fff";
    ctx.textAlign=align||"center";
    ctx.textBaseline=baseline||"middle";
    ctx.fillText(txt,x,y);
}
function drawBtn(x,y,w,h,text,colors,fontSize){
    var r=h*0.3;
    // shadow
    ctx.shadowColor="rgba(0,0,0,0.3)";ctx.shadowBlur=10;ctx.shadowOffsetY=4;
    var grd=ctx.createLinearGradient(x,y,x,y+h);
    grd.addColorStop(0,colors[0]);grd.addColorStop(1,colors[1]||colors[0]);
    ctx.fillStyle=grd;
    roundRect(x,y,w,h,r);ctx.fill();
    ctx.shadowColor="transparent";ctx.shadowBlur=0;ctx.shadowOffsetY=0;
    // border
    ctx.strokeStyle="rgba(255,255,255,0.15)";ctx.lineWidth=1;
    roundRect(x,y,w,h,r);ctx.stroke();
    // text
    drawText(text,x+w/2,y+h/2,fontSize||16*h/44,"#fff","center","middle",true);
}

// ===== 游戏逻辑 =====
function pickPoem(difficulty){
    var maxLines=G.difficultyLines[difficulty];
    // 筛选合适长度的诗
    var pool=[];
    for(var i=0;i<POEMS.length;i++){
        if(POEMS[i].l.length>=maxLines) pool.push(i);
    }
    if(pool.length===0) pool=[0]; // fallback
    var idx=pool[randInt(0,pool.length-1)];
    return POEMS[idx];
}

function startGame(difficulty){
    G.state=STATE.PLAY;
    G.difficulty=difficulty;
    G.score=0;G.combo=0;G.maxCombo=0;
    G.totalPoems=0;G.correctPoems=0;
    G.feedback=null;G.feedbackTimer=0;
    G.dragging=-1;
    particles=[];
    nextRound();
}

function nextRound(){
    G.poem=pickPoem(G.difficulty);
    var n=G.difficultyLines[G.difficulty];
    G.lines=G.poem.l.slice(0,n);
    G.correct=G.lines.slice();

    // 打乱
    G.order=[];
    for(var i=0;i<n;i++) G.order.push(i);
    // 确保打乱后不与原序相同
    do{shuffle(G.order);}while(arraysEqual(G.order,correctOrder()));

    // 计算布局
    calcLayout();

    G.dragging=-1;
    G.feedback=null;
    G.feedbackTimer=0;
}

function correctOrder(){
    var o=[];
    for(var i=0;i<G.lines.length;i++) o.push(i);
    return o;
}

function arraysEqual(a,b){
    if(a.length!==b.length) return false;
    for(var i=0;i<a.length;i++) if(a[i]!==b[i]) return false;
    return true;
}

function calcLayout(){
    var n=G.lines.length;
    var padX=Math.min(30,W*0.06);
    G.slotW=W-padX*2;
    G.slotH=Math.max(30,Math.min(56,(H*0.65)/n));
    G.slotX=padX;
    var topArea=130;
    var bottomArea=100;
    var availH=H-topArea-bottomArea;
    G.slotY0=topArea+(availH-G.slotH*n)/2;
}

function checkAnswer(){
    // 检查当前顺序是否正确
    for(var i=0;i<G.lines.length;i++){
        if(G.order[i]!==i) return false;
    }
    return true;
}

function onCorrect(){
    G.combo++;
    if(G.combo>G.maxCombo) G.maxCombo=G.combo;
    var base=100*G.lines.length;
    var comboBonus=G.combo*20;
    var earned=base+comboBonus;
    G.score+=earned;
    G.correctPoems++;
    G.totalPoems++;
    G.feedback={text:"正确! +"+earned,color:"#2ecc71",sub:"连击 x"+G.combo};
    G.feedbackTimer=90;
    spawnParticles(W/2,H/2,30,"#2ecc71",4,3);
    // 延迟进入下一题
    setTimeout(function(){if(G.state===STATE.PLAY) nextRound();},1200);
}

function onWrong(){
    G.combo=0;
    G.totalPoems++;
    G.feedback={text:"顺序有误",color:"#e74c3c",sub:"再试试吧"};
    G.feedbackTimer=60;
    spawnParticles(W/2,H/2,15,"#e74c3c",3,2);
}

// ===== 游戏渲染 =====
function drawGame(){
    drawBg(COLORS.bg1);

    // 顶部信息栏
    var barH=50;
    ctx.fillStyle="rgba(0,0,0,0.4)";
    ctx.fillRect(0,0,W,barH);

    drawText("得分: "+G.score,10,barH/2,16,"#ffd700","left","middle",true);
    drawText("连击: "+G.combo,W/2,barH/2,16,"#ff6b6b","center","middle",true);
    drawText(G.poem.t+" · "+G.poem.a,W-10,barH/2,14,"rgba(255,255,255,0.6)","right","middle",false);

    // 提示文字
    drawText("拖拽诗句到正确顺序",W/2,barH+25,14,"rgba(255,255,255,0.4)","center","middle",false);

    // 绘制诗句卡片
    var n=G.lines.length;
    for(var i=0;i<n;i++){
        if(i===G.dragging) continue; // 拖拽中的最后画
        drawSlot(i);
    }
    // 绘制拖拽中的
    if(G.dragging>=0){
        drawDragCard();
    }

    // 反馈
    if(G.feedbackTimer>0){
        G.feedbackTimer--;
        var a=Math.min(1,G.feedbackTimer/30);
        ctx.globalAlpha=a;
        drawText(G.feedback.text,W/2,H*0.45,Math.min(36,W*0.09),G.feedback.color,"center","middle",true);
        if(G.feedback.sub) drawText(G.feedback.sub,W/2,H*0.45+40,18,"rgba(255,255,255,0.7)","center","middle",false);
        ctx.globalAlpha=1;
    }

    // 检查按钮
    var btnW=Math.min(200,W*0.5);
    var btnH=48;
    var btnX=W/2-btnW/2;
    var btnY=H-70;
    drawBtn(btnX,btnY,btnW,btnH,"确认排序",COLORS.btn1,18);
    G.checkBtn={x:btnX,y:btnY,w:btnW,h:btnH};
}

function drawSlot(i){
    var y=G.slotY0+i*G.slotH;
    var x=G.slotX;
    var w=G.slotW;
    var h=G.slotH-6;

    // 卡片背景
    var grd=ctx.createLinearGradient(x,y,x+w,y);
    grd.addColorStop(0,"rgba(30,30,63,0.85)");
    grd.addColorStop(1,"rgba(42,42,74,0.85)");
    ctx.fillStyle=grd;
    roundRect(x,y,w,h,10);ctx.fill();

    // 边框
    ctx.strokeStyle="rgba(255,255,255,0.1)";ctx.lineWidth=1;
    roundRect(x,y,w,h,10);ctx.stroke();

    // 序号
    var numR=h*0.35;
    var numCx=x+numR+12;
    var numCy=y+h/2;
    ctx.fillStyle="rgba(108,99,255,0.3)";
    ctx.beginPath();ctx.arc(numCx,numCy,numR,0,Math.PI*2);ctx.fill();
    drawText(""+(i+1),numCx,numCy,14,"#fff","center","middle",true);

    // 诗句
    var lineIdx=G.order[i];
    var txt=G.lines[lineIdx];
    var fs=Math.min(20,W*0.045);
    if(txt.length>7) fs=Math.min(16,W*0.038);
    drawText(txt,x+w/2+numR,y+h/2,fs,"#e0e0e0","center","middle",false);

    // 存储位置用于拖拽检测
    G.slots=G.slots||[];
    G.slots[i]={x:x,y:y,w:w,h:h};
}

function drawDragCard(){
    var i=G.dragging;
    var lineIdx=G.order[i];
    var txt=G.lines[lineIdx];
    var w=G.slotW;
    var h=G.slotH-6;
    var x=G.dragX-G.dragOfsX;
    var y=G.dragY-G.dragOfsY;

    // 阴影
    ctx.shadowColor="rgba(0,0,0,0.5)";ctx.shadowBlur=20;ctx.shadowOffsetY=8;
    var grd=ctx.createLinearGradient(x,y,x+w,y);
    grd.addColorStop(0,"rgba(108,99,255,0.9)");
    grd.addColorStop(1,"rgba(92,107,192,0.9)");
    ctx.fillStyle=grd;
    roundRect(x,y,w,h,10);ctx.fill();
    ctx.shadowColor="transparent";ctx.shadowBlur=0;ctx.shadowOffsetY=0;

    // 边框高亮
    ctx.strokeStyle="rgba(255,215,0,0.5)";ctx.lineWidth=2;
    roundRect(x,y,w,h,10);ctx.stroke();

    // 序号
    var numR=h*0.35;
    var numCx=x+numR+12;
    var numCy=y+h/2;
    ctx.fillStyle="rgba(255,215,0,0.3)";
    ctx.beginPath();ctx.arc(numCx,numCy,numR,0,Math.PI*2);ctx.fill();
    drawText(""+(i+1),numCx,numCy,14,"#ffd700","center","middle",true);

    // 诗句
    var fs=Math.min(20,W*0.045);
    if(txt.length>7) fs=Math.min(16,W*0.038);
    drawText(txt,x+w/2+numR,y+h/2,fs,"#fff","center","middle",true);
}

// ===== 输入处理 =====
function getPos(e){
    var r=cv.getBoundingClientRect();
    if(e.touches&&e.touches.length>0){
        return {x:e.touches[0].clientX-r.left,y:e.touches[0].clientY-r.top};
    }
    return {x:e.clientX-r.left,y:e.clientY-r.top};
}

function hitTest(px,py,rect){
    return px>=rect.x&&px<=rect.x+rect.w&&py>=rect.y&&py<=rect.y+rect.h;
}

function onDown(e){
    e.preventDefault();
    var p=getPos(e);

    if(G.state===STATE.MENU){
        for(var i=0;i<G.menuBtns.length;i++){
            if(hitTest(p.x,p.y,G.menuBtns[i])){
                startGame(G.menuBtns[i].d);
                return;
            }
        }
    } else if(G.state===STATE.PLAY){
        // 检查点击确认按钮
        if(G.checkBtn&&hitTest(p.x,p.y,G.checkBtn)){
            if(checkAnswer()){
                onCorrect();
            } else {
                onWrong();
            }
            return;
        }
        // 检查拖拽诗句
        if(G.slots){
            for(var i=0;i<G.slots.length;i++){
                if(hitTest(p.x,p.y,G.slots[i])){
                    G.dragging=i;
                    G.dragX=p.x;G.dragY=p.y;
                    G.dragOfsX=p.x-G.slots[i].x;
                    G.dragOfsY=p.y-G.slots[i].y;
                    return;
                }
            }
        }
    } else if(G.state===STATE.OVER){
        for(var i=0;i<G.overBtns.length;i++){
            if(hitTest(p.x,p.y,G.overBtns[i])){
                if(G.overBtns[i].action==="retry") startGame(G.difficulty);
                else initMenu();
                return;
            }
        }
    }
}

function onMove(e){
    e.preventDefault();
    if(G.state===STATE.PLAY&&G.dragging>=0){
        var p=getPos(e);
        G.dragX=p.x;G.dragY=p.y;
    }
}

function onUp(e){
    e.preventDefault();
    if(G.state===STATE.PLAY&&G.dragging>=0){
        var p=getPos(e.changedTouches?e.changedTouches[0]:e);
        var r=cv.getBoundingClientRect();
        var px=p.clientX-r.left;
        var py=p.clientY-r.top;

        // 找到目标槽位
        var fromIdx=G.dragging;
        var toIdx=-1;
        if(G.slots){
            for(var i=0;i<G.slots.length;i++){
                if(hitTest(px,py,G.slots[i])){
                    toIdx=i;break;
                }
            }
        }

        if(toIdx>=0&&toIdx!==fromIdx){
            // 交换
            var tmp=G.order[fromIdx];
            G.order[fromIdx]=G.order[toIdx];
            G.order[toIdx]=tmp;
            spawnParticles(G.slots[toIdx].x+G.slotW/2,G.slots[toIdx].y+G.slotH/2,8,"#6c63ff",2,2);
        }
        G.dragging=-1;
    }
}

cv.addEventListener("mousedown",onDown);
cv.addEventListener("mousemove",onMove);
cv.addEventListener("mouseup",onUp);
cv.addEventListener("touchstart",onDown,{passive:false});
cv.addEventListener("touchmove",onMove,{passive:false});
cv.addEventListener("touchend",onUp,{passive:false});

// 键盘支持：数字键快速排序
document.addEventListener("keydown",function(e){
    if(G.state===STATE.MENU){
        if(e.key==="1") startGame(0);
        else if(e.key==="2") startGame(1);
        else if(e.key==="3") startGame(2);
    } else if(G.state===STATE.PLAY){
        if(e.key==="Enter"||e.key===" "){
            if(checkAnswer()) onCorrect(); else onWrong();
        } else if(e.key==="r"||e.key==="R"){
            // 重新打乱当前诗
            G.order=[];
            for(var i=0;i<G.lines.length;i++) G.order.push(i);
            do{shuffle(G.order);}while(arraysEqual(G.order,correctOrder()));
        }
    } else if(G.state===STATE.OVER){
        if(e.key==="Enter"||e.key===" ") startGame(G.difficulty);
        else if(e.key==="Escape") initMenu();
    }
});

// ===== 主循环 =====
function gameLoop(){
    G.animFrame++;
    updateParticles();

    if(G.state===STATE.MENU) drawMenu();
    else if(G.state===STATE.PLAY) drawGame();
    else if(G.state===STATE.OVER) drawOver();

    drawParticles();
    requestAnimationFrame(gameLoop);
}

// ===== 启动 =====
initMenu();
gameLoop();

  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>

  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };

})();
