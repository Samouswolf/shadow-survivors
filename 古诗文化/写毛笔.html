        function gameOver() {
            console.log("游戏结束");
        }
        
        // 音效支持
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq = 440, duration = 0.1) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }
        
        // 视觉特效
        function showEffect(x, y) {
            const el = document.createElement("div");
            el.style.cssText = `position:absolute;left:${x}px;top:${y}px;width:20px;height:20px;background:#f5576c;border-radius:50%;animation:pulse 0.5s ease-out forwards;pointer-events:none;z-index:100;`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 500);
        }

<script>
(function() {
  'use strict';

  /* ====== 汉字模板库（25个，从简到繁） ====== */
  const CHARACTERS = [
    { char: '一', strokes: 1,  level: 1 },
    { char: '二', strokes: 2,  level: 1 },
    { char: '十', strokes: 2,  level: 1 },
    { char: '人', strokes: 2,  level: 1 },
    { char: '大', strokes: 3,  level: 1 },
    { char: '天', strokes: 4,  level: 2 },
    { char: '木', strokes: 4,  level: 2 },
    { char: '水', strokes: 4,  level: 2 },
    { char: '火', strokes: 4,  level: 2 },
    { char: '山', strokes: 3,  level: 2 },
    { char: '日', strokes: 4,  level: 2 },
    { char: '月', strokes: 4,  level: 2 },
    { char: '田', strokes: 5,  level: 3 },
    { char: '目', strokes: 5,  level: 3 },
    { char: '口', strokes: 3,  level: 3 },
    { char: '中', strokes: 4,  level: 3 },
    { char: '王', strokes: 4,  level: 3 },
    { char: '永', strokes: 5,  level: 4 },
    { char: '石', strokes: 5,  level: 4 },
    { char: '龙', strokes: 5,  level: 4 },
    { char: '春', strokes: 9,  level: 5 },
    { char: '福', strokes: 13, level: 5 },
    { char: '书', strokes: 4,  level: 5 },
    { char: '国', strokes: 8,  level: 5 },
    { char: '风', strokes: 4,  level: 5 },
  ];

  /* ====== DOM 引用 ====== */
  const mainCanvas = document.getElementById('mainCanvas');
  const ctx = mainCanvas.getContext('2d');
  const canvasWrap = document.getElementById('canvasWrap');
  const charSelect = document.getElementById('charSelect');
  const scoreModal = document.getElementById('scoreModal');
  const scoreGrade = document.getElementById('scoreGrade');
  const scoreDetail = document.getElementById('scoreDetail');

  /* ====== 状态 ====== */
  let currentCharIdx = 0;
  let showTrace = true;
  let strokes = [];           // { points: [{x,y,time}], color, width }
  let currentStroke = null;
  let isDrawing = false;
  let bestScores = {};        // char -> best score
  let canvasScale = 1;

  /* ====== 画布设置 ====== */
  const CANVAS_W = 600;
  const CANVAS_H = 600;
  const PADDING = 60; // 书写区域边距

  function resizeCanvas() {
    const wrap = canvasWrap;
    const maxW = wrap.clientWidth - 16;
    const maxH = wrap.clientHeight - 16;
    const ratio = CANVAS_W / CANVAS_H;
    let w, h;
    if (maxW / maxH > ratio) { h = maxH; w = h * ratio; }
    else { w = maxW; h = w / ratio; }
    mainCanvas.style.width = w + 'px';
    mainCanvas.style.height = h + 'px';
    canvasScale = w / CANVAS_W;
  }

  mainCanvas.width = CANVAS_W;
  mainCanvas.height = CANVAS_H;

  /* ====== 宣纸纹理生成 ====== */
  let paperTexture = null;

  function generatePaperTexture() {
    const off = document.createElement('canvas');
    off.width = CANVAS_W;
    off.height = CANVAS_H;
    const octx = off.getContext('2d');

    // 底色
    octx.fillStyle = '#faf3e6';
    octx.fillRect(0, 0, CANVAS_W, CANVAS_H);

    // 纤维纹理
    const imageData = octx.getImageData(0, 0, CANVAS_W, CANVAS_H);
    const data = imageData.data;
    for (let i = 0; i < data.length; i += 4) {
      const noise = (Math.random() - 0.5) * 18;
      data[i] = Math.min(255, Math.max(0, 250 + noise));
      data[i + 1] = Math.min(255, Math.max(0, 243 + noise));
      data[i + 2] = Math.min(255, Math.max(0, 230 + noise * 0.8));
    }
    octx.putImageData(imageData, 0, 0);

    // 纤维线
    octx.strokeStyle = 'rgba(180,160,130,0.06)';
    octx.lineWidth = 0.5;
    for (let i = 0; i < 300; i++) {
      const x = Math.random() * CANVAS_W;
      const y = Math.random() * CANVAS_H;
      const len = 10 + Math.random() * 40;
      const angle = Math.random() * Math.PI * 2;
      octx.beginPath();
      octx.moveTo(x, y);
      octx.lineTo(x + Math.cos(angle) * len, y + Math.sin(angle) * len);
      octx.stroke();
    }

    // 竖纹
    octx.strokeStyle = 'rgba(160,140,110,0.04)';
    octx.lineWidth = 0.3;
    for (let x = 0; x < CANVAS_W; x += 8 + Math.random() * 16) {
      octx.beginPath();
      octx.moveTo(x, 0);
      octx.lineTo(x, CANVAS_H);
      octx.stroke();
    }

    // 横纹
    for (let y = 0; y < CANVAS_H; y += 12 + Math.random() * 20) {
      octx.beginPath();
      octx.moveTo(0, y);
      octx.lineTo(CANVAS_W, y);
      octx.stroke();
    }

    // 墨渍
    for (let i = 0; i < 5; i++) {
      const cx = Math.random() * CANVAS_W;
      const cy = Math.random() * CANVAS_H;
      const r = 3 + Math.random() * 8;
      const grad = octx.createRadialGradient(cx, cy, 0, cx, cy, r);
      grad.addColorStop(0, 'rgba(180,160,130,0.1)');
      grad.addColorStop(1, 'rgba(180,160,130,0)');
      octx.fillStyle = grad;
      octx.beginPath();
      octx.arc(cx, cy, r, 0, Math.PI * 2);
      octx.fill();
    }

    // 边框装饰
    octx.strokeStyle = 'rgba(139,115,85,0.3)';
    octx.lineWidth = 1;
    octx.strokeRect(PADDING - 5, PADDING - 5, CANVAS_W - 2 * PADDING + 10, CANVAS_H - 2 * PADDING + 10);

    paperTexture = off;
  }

  /* ====== 描红模板生成 ====== */
  function drawTemplateChar(char) {
    const off = document.createElement('canvas');
    off.width = CANVAS_W;
    off.height = CANVAS_H;
    const octx = off.getContext('2d');

    const cx = CANVAS_W / 2;
    const cy = CANVAS_H / 2;
    const fontSize = Math.min(CANVAS_W, CANVAS_H) * 0.5;

    // 米字格
    octx.strokeStyle = 'rgba(180,160,130,0.25)';
    octx.lineWidth = 0.5;
    octx.setLineDash([4, 8]);
    // 外框
    octx.strokeRect(cx - fontSize * 0.55, cy - fontSize * 0.55, fontSize * 1.1, fontSize * 1.1);
    // 十字
    octx.beginPath();
    octx.moveTo(cx - fontSize * 0.55, cy);
    octx.lineTo(cx + fontSize * 0.55, cy);
    octx.moveTo(cx, cy - fontSize * 0.55);
    octx.lineTo(cx, cy + fontSize * 0.55);
    octx.stroke();
    // 对角线
    octx.strokeStyle = 'rgba(180,160,130,0.15)';
    octx.beginPath();
    octx.moveTo(cx - fontSize * 0.55, cy - fontSize * 0.55);
    octx.lineTo(cx + fontSize * 0.55, cy + fontSize * 0.55);
    octx.moveTo(cx + fontSize * 0.55, cy - fontSize * 0.55);
    octx.lineTo(cx - fontSize * 0.55, cy + fontSize * 0.55);
    octx.stroke();
    octx.setLineDash([]);

    // 描红字
    const templateFonts = [
      '"STKaiti","KaiTi","楷体","FangSong","仿宋","SimSun","宋体",serif'
    ];
    octx.fillStyle = 'rgba(196,58,49,0.18)';
    octx.font = `bold ${fontSize}px ${templateFonts[0]}`;
    octx.textAlign = 'center';
    octx.textBaseline = 'middle';
    octx.fillText(char, cx, cy);

    return off;
  }

  /* ====== 渲染 ====== */
  function render() {
    ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);

    // 宣纸纹理
    if (paperTexture) {
      ctx.drawImage(paperTexture, 0, 0);
    }

    // 描红模板
    if (showTrace && currentChar()) {
      const tmpl = drawTemplateChar(currentChar().char);
      ctx.drawImage(tmpl, 0, 0);
    }

    // 绘制所有笔画
    for (const stroke of strokes) {
      drawStroke(stroke);
    }

    // 当前正在画的笔画
    if (currentStroke && currentStroke.points.length > 0) {
      drawStroke(currentStroke);
    }
  }

  /* ====== 毛笔笔触绘制 ====== */
  function drawStroke(stroke) {
    if (stroke.points.length < 2) {
      if (stroke.points.length === 1) {
        const p = stroke.points[0];
        const r = 6;
        drawInkDot(p.x, p.y, r);
      }
      return;
    }

    const pts = stroke.points;
    const n = pts.length;

    // 计算每段的速度和宽度
    const widths = [];
    for (let i = 0; i < n; i++) {
      if (i === 0) {
        // 起笔：较粗（顿笔效果）
        widths.push(16 + Math.random() * 2);
      } else if (i === n - 1) {
        // 收笔：渐细
        const prevW = widths[i - 1];
        widths.push(Math.max(2, prevW * 0.6 + Math.random() * 2));
      } else {
        const dx = pts[i].x - pts[i - 1].x;
        const dy = pts[i].y - pts[i - 1].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const dt = (pts[i].time - pts[i - 1].time) || 1;
        const speed = dist / dt;
        // 速度越快笔触越细，速度越慢越粗
        const maxSpeed = 2.5;
        const minSpeed = 0.15;
        const clampedSpeed = Math.max(minSpeed, Math.min(maxSpeed, speed));
        const t = (clampedSpeed - minSpeed) / (maxSpeed - minSpeed);
        const w = 18 - t * 14; // 粗:18, 细:4
        widths.push(Math.max(2, Math.min(20, w + (Math.random() - 0.5) * 3)));
      }
    }

    // 平滑宽度
    for (let pass = 0; pass < 2; pass++) {
      for (let i = 1; i < n - 1; i++) {
        widths[i] = (widths[i - 1] + widths[i] * 2 + widths[i + 1]) / 4;
      }
    }

    // 墨色层次：主墨 + 晕染
    // 第1层：淡墨晕染（较大范围）
    for (let i = 0; i < n; i++) {
      const p = pts[i];
      const w = widths[i] * 1.6;
      const alpha = 0.06 + Math.random() * 0.04;
      drawInkDot(p.x, p.y, w, alpha);
    }

    // 第2层：中墨（中等范围，笔触边缘毛刺）
    for (let i = 0; i < n; i++) {
      const p = pts[i];
      const w = widths[i] * 1.15;
      const alpha = 0.15 + Math.random() * 0.08;
      drawInkDot(p.x, p.y, w, alpha);
    }

    // 第3层：主干墨线
    // 绘制平滑曲线
    ctx.save();
    ctx.strokeStyle = 'rgba(20,15,10,0.82)';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    if (n >= 3) {
      // 使用二次贝塞尔曲线绘制主墨线
      for (let i = 1; i < n; i++) {
        const p0 = pts[i - 1];
        const p1 = pts[i];
        const w0 = widths[i - 1];
        const w1 = widths[i];

        if (i < n - 1) {
          // 使用中点作为控制点
          const midX = (p0.x + p1.x) / 2;
          const midY = (p0.y + p1.y) / 2;
          const midW = (w0 + w1) / 2;

          // 分段绘制渐变宽度
          const steps = Math.max(2, Math.floor(Math.sqrt((p1.x - p0.x) ** 2 + (p1.y - p0.y) ** 2) / 2));
          for (let s = 0; s < steps; s++) {
            const t0 = s / steps;
            const t1 = (s + 1) / steps;
            const sx = p0.x + (p1.x - p0.x) * t0;
            const sy = p0.y + (p1.y - p0.y) * t0;
            const ex = p0.x + (p1.x - p0.x) * t1;
            const ey = p0.y + (p1.y - p0.y) * t1;
            const sw = w0 + (w1 - w0) * t0;
            const ew = w0 + (w1 - w0) * t1;

            ctx.lineWidth = (sw + ew) / 2;
            ctx.beginPath();
            ctx.moveTo(sx, sy);
            ctx.lineTo(ex, ey);
            ctx.stroke();
          }
        }
      }
    }

    ctx.restore();

    // 第4层：墨心（最浓）
    ctx.save();
    ctx.strokeStyle = 'rgba(8,5,2,0.9)';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    for (let i = 1; i < n; i++) {
      const p0 = pts[i - 1];
      const p1 = pts[i];
      const w0 = widths[i - 1] * 0.4;
      const w1 = widths[i] * 0.4;

      const steps = Math.max(2, Math.floor(Math.sqrt((p1.x - p0.x) ** 2 + (p1.y - p0.y) ** 2) / 3));
      for (let s = 0; s < steps; s++) {
        const t0 = s / steps;
        const t1 = (s + 1) / steps;
        const sx = p0.x + (p1.x - p0.x) * t0;
        const sy = p0.y + (p1.y - p0.y) * t0;
        const ex = p0.x + (p1.x - p0.x) * t1;
        const ey = p0.y + (p1.y - p0.y) * t1;
        const sw = w0 + (w1 - w0) * t0;
        const ew = w0 + (w1 - w0) * t1;

        ctx.lineWidth = (sw + ew) / 2;
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(ex, ey);
        ctx.stroke();
      }
    }

    ctx.restore();

    // 起笔顿笔效果（加粗圆点）
    if (n > 0) {
      const p0 = pts[0];
      const w0 = widths[0] * 0.5;
      drawInkDot(p0.x, p0.y, w0, 0.85);
    }
  }

  function drawInkDot(x, y, r, alpha) {
    if (r <= 0) return;
    ctx.save();
    const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, `rgba(15,10,5,${alpha || 0.1})`);
    grad.addColorStop(0.5, `rgba(20,15,8,${(alpha || 0.1) * 0.6})`);
    grad.addColorStop(1, 'rgba(20,15,8,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  /* ====== 输入处理 ====== */
  function getCanvasPos(e) {
    const rect = mainCanvas.getBoundingClientRect();
    const scaleX = CANVAS_W / rect.width;
    const scaleY = CANVAS_H / rect.height;
    let clientX, clientY;
    if (e.touches) {
      if (e.touches.length === 0) return null;
      clientX = e.touches[0].clientX;
      clientY = e.touches[0].clientY;
    } else {
      clientX = e.clientX;
      clientY = e.clientY;
    }
    return {
      x: (clientX - rect.left) * scaleX,
      y: (clientY - rect.top) * scaleY,
    };
  }

  function onPointerDown(e) {
    e.preventDefault();
    const pos = getCanvasPos(e);
    if (!pos) return;
    if (pos.x < 0 || pos.x > CANVAS_W || pos.y < 0 || pos.y > CANVAS_H) return;

    isDrawing = true;
    currentStroke = {
      points: [{ x: pos.x, y: pos.y, time: performance.now() }],
    };
    render();
  }

  function onPointerMove(e) {
    e.preventDefault();
    if (!isDrawing || !currentStroke) return;
    const pos = getCanvasPos(e);
    if (!pos) return;
    if (pos.x < 0 || pos.x > CANVAS_W || pos.y < 0 || pos.y > CANVAS_H) return;

    currentStroke.points.push({
      x: pos.x,
      y: pos.y,
      time: performance.now(),
    });

    // 限制采样点数，避免过多
    if (currentStroke.points.length > 500) {
      // 每隔一个点抽样
      const filtered = [currentStroke.points[0]];
      for (let i = 1; i < currentStroke.points.length; i += 2) {
        filtered.push(currentStroke.points[i]);
      }
      currentStroke.points = filtered;
    }

    render();
  }

  function onPointerUp(e) {
    e.preventDefault();
    if (!isDrawing) return;
    isDrawing = false;

    if (currentStroke && currentStroke.points.length > 0) {
      strokes.push(currentStroke);
    }
    currentStroke = null;
    render();
  }

  // 鼠标事件
  mainCanvas.addEventListener('mousedown', onPointerDown);
  mainCanvas.addEventListener('mousemove', onPointerMove);
  mainCanvas.addEventListener('mouseup', onPointerUp);
  mainCanvas.addEventListener('mouseleave', onPointerUp);

  // 触屏事件
  mainCanvas.addEventListener('touchstart', onPointerDown, { passive: false });
  mainCanvas.addEventListener('touchmove', onPointerMove, { passive: false });
  mainCanvas.addEventListener('touchend', onPointerUp, { passive: false });
  mainCanvas.addEventListener('touchcancel', onPointerUp, { passive: false });

  /* ====== 功能 ====== */
  function currentChar() {
    return CHARACTERS[currentCharIdx];
  }

  function undo() {
    if (strokes.length > 0) {
      strokes.pop();
      render();
    }
  }

  function clearCanvas() {
    strokes = [];
    currentStroke = null;
    isDrawing = false;
    render();
  }

  function setChar(idx) {
    if (idx < 0) idx = CHARACTERS.length - 1;
    if (idx >= CHARACTERS.length) idx = 0;
    currentCharIdx = idx;
    clearCanvas();
    updateUI();
    charSelect.value = idx;
  }

  /* ====== 评分系统 ====== */
  function calculateScore() {
    const ch = currentChar();
    if (!ch) return 0;

    // 创建评分画布
    const scoreCanvas = document.createElement('canvas');
    scoreCanvas.width = CANVAS_W;
    scoreCanvas.height = CANVAS_H;
    const sctx = scoreCanvas.getContext('2d');

    // 绘制用户笔迹
    for (const stroke of strokes) {
      drawStrokeOnCtx(sctx, stroke);
    }

    // 创建模板画布
    const tmplCanvas = document.createElement('canvas');
    tmplCanvas.width = CANVAS_W;
    tmplCanvas.height = CANVAS_H;
    const tctx = tmplCanvas.getContext('2d');

    const cx = CANVAS_W / 2;
    const cy = CANVAS_H / 2;
    const fontSize = Math.min(CANVAS_W, CANVAS_H) * 0.5;
    tctx.fillStyle = '#000000';
    tctx.font = `bold ${fontSize}px "STKaiti","KaiTi","楷体","FangSong","仿宋","SimSun",serif`;
    tctx.textAlign = 'center';
    tctx.textBaseline = 'middle';
    tctx.fillText(ch.char, cx, cy);

    // 像素对比
    const userData = sctx.getImageData(0, 0, CANVAS_W, CANVAS_H).data;
    const tmplData = tctx.getImageData(0, 0, CANVAS_W, CANVAS_H).data;

    let templatePixels = 0;
    let coveredPixels = 0;
    let userPixels = 0;
    let userInTemplate = 0;

    // 采样（每4个像素取1个，提高性能）
    const step = 4;
    for (let y = 0; y < CANVAS_H; y += step) {
      for (let x = 0; x < CANVAS_W; x += step) {
        const idx = (y * CANVAS_W + x) * 4;
        const isTemplate = tmplData[idx] < 200; // 模板像素（黑色）
        const isUser = userData[idx + 3] > 30; // 用户有墨迹

        if (isTemplate) {
          templatePixels++;
          if (isUser) coveredPixels++;
        }
        if (isUser) {
          userPixels++;
          if (isTemplate) userInTemplate++;
        }
      }
    }

    if (templatePixels === 0) return 0;

    // 覆盖率得分
    const coverage = coveredPixels / templatePixels;
    // 精确度得分（避免画出格）
    const precision = userPixels > 0 ? userInTemplate / userPixels : 1;
    // 综合得分
    let score = coverage * 0.65 + precision * 0.35;
    score = Math.round(score * 100);

    return { score, coverage, precision, templatePixels, coveredPixels, userPixels };
  }

  function drawStrokeOnCtx(targetCtx, stroke) {
    if (stroke.points.length < 2) return;
    const pts = stroke.points;
    targetCtx.save();
    targetCtx.strokeStyle = '#000000';
    targetCtx.lineCap = 'round';
    targetCtx.lineJoin = 'round';
    targetCtx.lineWidth = 12;

    for (let i = 1; i < pts.length; i++) {
      targetCtx.beginPath();
      targetCtx.moveTo(pts[i - 1].x, pts[i - 1].y);
      targetCtx.lineTo(pts[i].x, pts[i].y);
      targetCtx.stroke();
    }
    targetCtx.restore();
  }

  function showScore() {
    if (strokes.length === 0) {
      scoreGrade.textContent = '😅';
      scoreDetail.innerHTML = '你还没有写字呢！<br>请在宣纸上挥毫泼墨吧 ✨';
      scoreModal.classList.add('show');
      return;
    }

    const result = calculateScore();
    const ch = currentChar();

    let grade, gradeEmoji;
    if (result.score >= 95) { grade = '神品'; gradeEmoji = '🏆'; }
    else if (result.score >= 85) { grade = '妙品'; gradeEmoji = '🌟'; }
    else if (result.score >= 75) { grade = '能品'; gradeEmoji = '⭐'; }
    else if (result.score >= 60) { grade = '入门'; gradeEmoji = '📝'; }
    else if (result.score >= 40) { grade = '初学'; gradeEmoji = '🖌'; }
    else { grade = '涂鸦'; gradeEmoji = '🎨'; }

    // 保存最高分
    const charKey = ch.char;
    if (!bestScores[charKey] || result.score > bestScores[charKey]) {
      bestScores[charKey] = result.score;
    }

    scoreGrade.textContent = gradeEmoji;
    scoreDetail.innerHTML = `
      <div style="font-size:28px;color:#c43a31;margin:4px 0">「${ch.char}」— ${grade}</div>
      <div>得分: <b style="color:#c9a96e;font-size:20px">${result.score}</b> 分</div>
      <div>覆盖率: ${Math.round(result.coverage * 100)}%</div>
      <div>精确度: ${Math.round(result.precision * 100)}%</div>
      <div style="color:#888;font-size:11px">覆盖 ${result.coveredPixels}/${result.templatePixels} 个采样点</div>
    `;

    scoreModal.classList.add('show');

    // 更新最高分显示
    document.getElementById('infoBest').textContent = bestScores[charKey] || '-';
  }

  function hideScore() {
    scoreModal.classList.remove('show');
  }

        // 音效支持

        function playSound(freq = 440, duration = 0.1) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }
        
        // 视觉特效
        function showEffect(x, y) {
            const el = document.createElement("div");
            el.style.cssText = `position:absolute;left:${x}px;top:${y}px;width:20px;height:20px;background:#f5576c;border-radius:50%;animation:pulse 0.5s ease-out forwards;pointer-events:none;z-index:100;`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 500);
        }
        </script>

<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>

<!-- [BATCH-FIX-V2:perf-stabilizer] -->
<script>
(function(){
  if (window.__perfStable) return;
  window.__perfStable = true;
  var _origRandom = Math.random;
  var _cache = [];
  for (var i = 0; i < 512; i++) _cache.push(_origRandom());
  var _idx = 0;
  var _frameCount = 0;
  var _origRAF = window.requestAnimationFrame || function(cb){return setTimeout(cb,16)};
  window.requestAnimationFrame = function(cb) {
    return _origRAF.call(window, function(ts) {
      _frameCount++;
      if (_frameCount % 30 === 0) {
        for (var j = 0; j < 20; j++) _cache[(_idx+j) % 512] = _origRandom();
      }
      _idx = 0;
      cb(ts);
    });
  };
  Math.random = function() {
    var v = _cache[_idx % 512];
    _idx++;
    return v;
  };
})();
</script>
<!-- [/BATCH-FIX-V2:perf-stabilizer] -->
