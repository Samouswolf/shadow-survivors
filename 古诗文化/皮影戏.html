*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a0a00;font-family:'Microsoft YaHei',sans-serif}
canvas{display:block;position:absolute;top:0;left:0;width:100%;height:100%}

#pauseBtn{position:absolute;top:10px;right:10px;width:50px;height:50px;background:rgba(0,0,0,0.5);border:2px solid #f0c040;border-radius:50%;color:#f0c040;font-size:24px;cursor:pointer;display:none;z-index:20}

#adContainer{position:absolute;bottom:0;left:0;width:100%;height:60px;background:linear-gradient(135deg,#2d1810,#4a2520);border-top:2px solid #8b4513;display:flex;align-items:center;justify-content:center;z-index:30}

#adText{color:#d4a574;font-size:14px;margin-right:15px}
#sponsorBtn{padding:8px 20px;background:linear-gradient(135deg,#8b4513,#a0522d);border:2px solid #d4a574;border-radius:20px;color:#f0c040;font-size:14px;cursor:pointer}
#sponsorBtn:active{transform:scale(0.95)}
#sponsorModal{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:none;z-index:40;align-items:center;justify-content:center}
#sponsorModal.show{display:flex}
#sponsorContent{background:linear-gradient(135deg,#2d1810,#4a2520);border:3px solid #f0c040;border-radius:15px;padding:30px;text-align:center;max-width:300px}
#sponsorContent h2{color:#f0c040;margin-bottom:15px}
#sponsorContent p{color:#d4a574;margin-bottom:20px;font-size:14px}
#closeSponsor{padding:10px 30px;background:linear-gradient(135deg,#8b4513,#a0522d);border:2px solid #d4a574;border-radius:20px;color:#f0c040;font-size:16px;cursor:pointer}
#interstitial{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);display:none;z-index:50;align-items:center;justify-content:center;flex-direction:column}
#interstitial.show{display:flex}
#interstitial p{color:#f0c040;font-size:18px;margin-bottom:20px}
#skipAd{padding:10px 30px;background:linear-gradient(135deg,#8b4513,#a0522d);border:2px solid #d4a574;border-radius:20px;color:#f0c040;font-size:16px;cursor:pointer}

    document.getElementById('skipAd').onclick=skipAd;
    document.getElementById('pauseBtn').onclick=togglePause;

    // 开始游戏循环
    lastTime=performance.now();
    requestAnimationFrame(gameLoop);
}

function resizeCanvas(){
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
    W=canvas.width;
    H=canvas.height;
    scale=Math.min(W/800,H/600);
}

function setupEvents(){
    // 键盘事件
    document.addEventListener('keydown',e=>{
        if(gameState==='menu'){
            if(e.key==='Enter'||e.key===' '){
                gameState='playSelect';
            }
        }else if(gameState==='playSelect'){
            if(e.key==='ArrowUp'||e.key==='w') selectedPlay=Math.max(0,selectedPlay-1);
            if(e.key==='ArrowDown'||e.key==='s') selectedPlay=Math.min(PLAYS.length-1,selectedPlay+1);
            if(e.key==='Enter'||e.key===' '){
                if(unlockedPlays[selectedPlay]) startPlay(selectedPlay);
            }
            if(e.key==='Escape') gameState='menu';
        }else if(gameState==='playing'){
            if(e.key==='p'||e.key==='Escape') togglePause();
        }else if(gameState==='paused'){
            if(e.key==='p'||e.key==='Escape') togglePause();
        }else if(gameState==='gameOver'||gameState==='sceneEnd'){
            if(e.key==='Enter'||e.key===' '){
                if(gameState==='gameOver'){
                    gameState='menu';
                }else{
                    nextScene();
                }
            }
        }
    });

    // 鼠标事件
    canvas.addEventListener('mousedown',e=>{
        mouseX=e.clientX;
        mouseY=e.clientY;
        isMouseDown=true;
        handleInputDown(mouseX,mouseY);
    });

    canvas.addEventListener('mousemove',e=>{
        mouseX=e.clientX;
        mouseY=e.clientY;
        if(isMouseDown&&gameState==='playing'){
            handleInputMove(mouseX,mouseY);
        }
    });

    canvas.addEventListener('mouseup',e=>{
        isMouseDown=false;
        handleInputUp();
    });

    // 触屏事件
    canvas.addEventListener('touchstart',e=>{
        e.preventDefault();
        const t=e.touches[0];
        mouseX=t.clientX;
        mouseY=t.clientY;
        touchStartX=mouseX;
        touchStartY=mouseY;
        isMouseDown=true;
        handleInputDown(mouseX,mouseY);
    });

    canvas.addEventListener('touchmove',e=>{
        e.preventDefault();
        const t=e.touches[0];
        mouseX=t.clientX;
        mouseY=t.clientY;
        if(isMouseDown&&gameState==='playing'){
            handleInputMove(mouseX,mouseY);
        }
    });

    canvas.addEventListener('touchend',e=>{
        e.preventDefault();
        isMouseDown=false;
        handleInputUp();
    });
}

function handleInputDown(x,y){
    if(gameState==='menu'){
        // 检查开始按钮
        const btnX=W/2,btnY=H*0.65;
        if(distance(x,y,btnX,btnY)<80*scale){
            gameState='playSelect';
        }
    }else if(gameState==='playSelect'){
        // 检查剧目选择
        const startY=H*0.25;
        for(let i=0;i<PLAYS.length;i++){
            const btnY=startY+i*70*scale;
            if(Math.abs(y-btnY)<30*scale&&Math.abs(x-W/2)<200*scale){
                if(unlockedPlays[i]) startPlay(i);
            }
        }
        // 返回按钮
        if(y>H*0.85&&Math.abs(x-W/2)<100*scale){
            gameState='menu';
        }
    }else if(gameState==='playing'&&shadowPuppet){
        // 检查关节点击
        const joints=getWorldJoints();
        for(let name in joints){
            const j=joints[name];
            if(distance(x,y,j.x,j.y)<jointRadius*scale){
                selectedJoint=name;
                break;
            }
        }
    }else if(gameState==='gameOver'){
        // "再来一局"按钮
        const restartY=H*0.6;
        if(Math.abs(y-restartY)<40*scale&&Math.abs(x-W/2)<120*scale){
            startPlay(currentPlay);
            return;
        }
        // "返回主菜单"按钮
        const btnY=H*0.7;
        if(Math.abs(y-btnY)<40*scale&&Math.abs(x-W/2)<120*scale){
            gameState='menu';
        }
    }else if(gameState==='sceneEnd'){
        const btnY=H*0.7;
        if(Math.abs(y-btnY)<40*scale&&Math.abs(x-W/2)<120*scale){
            nextScene();
        }
    }
}

function handleInputMove(x,y){
    if(selectedJoint&&shadowPuppet&&currentPose){
        // 移动选中的关节
        const baseX=W/2;
        const baseY=H*0.55;
        const relX=(x-baseX)/scale;
        const relY=(y-baseY)/scale;

        if(!currentPose[selectedJoint]) currentPose[selectedJoint]={};
        currentPose[selectedJoint].x=relX;
        currentPose[selectedJoint].y=relY;

        // 检查与目标姿势的匹配度
        checkPoseMatch();
    }
}

function handleInputUp(){
    selectedJoint=null;
}

function getWorldJoints(){
    if(!shadowPuppet||!currentPose) return {};
    const baseX=W/2;
    const baseY=H*0.55;
    const result={};

    for(let name in JOINTS){
        const base=JOINTS[name];
        const offset=currentPose[name]||{x:0,y:0};
        result[name]={
            x:baseX+(base.x+offset.x)*scale,
            y:baseY+(base.y+offset.y)*scale
        };
    }
    return result;
}

// ==================== 游戏逻辑 ====================
function startPlay(index){
    currentPlay=index;
    currentScene=0;
    score=0;
    combo=0;
    maxCombo=0;
    perfectHits=0;
    goodHits=0;
    missedHits=0;
    startScene();
}

function startScene(){
    const play=PLAYS[currentPlay];
    const scene=play.scenes[currentScene];

    gameState='playing';
    sceneTimer=scene.duration;
    sceneScore=0;
    poseTimer=0;

    // 初始化皮影姿势
    initPuppetPose();

    // 设置目标姿势
    targetPose=scene.poses[0];

    // 显示广告
    adTimer+=scene.duration*1000;
    if(adTimer>=CONFIG.adInterval){
        showInterstitial();
        adTimer=0;
    }

    // 显示暂停按钮
    document.getElementById('pauseBtn').style.display='block';
    document.getElementById('adContainer').classList.remove('hidden');
}

function initPuppetPose(){
    shadowPuppet={x:W/2,y:H*0.55};
    currentPose={};
    for(let name in JOINTS){
        currentPose[name]={x:0,y:0};
    }
}

function checkPoseMatch(){
    if(!targetPose||!targetPose.joints) return;

    let totalMatch=0;
    let jointCount=0;

    for(let name in targetPose.joints){
        const target=targetPose.joints[name];
        const current=currentPose[name];
        if(!current) continue;

        const dx=current.x-target.x;
        const dy=current.y-target.y;
        const dist=Math.sqrt(dx*dx+dy*dy);

        if(dist<10){
            totalMatch+=1;
        }else if(dist<25){
            totalMatch+=0.6;
        }else if(dist<50){
            totalMatch+=0.3;
        }
        jointCount++;
    }

    if(jointCount>0){
        const matchPercent=totalMatch/jointCount;
        if(matchPercent>0.8){
            // 完美匹配
            score+=10*combo;
            sceneScore+=10;
            combo++;
            perfectHits++;
            spawnParticles(W/2,H/2,'#f0c040',15);
            screenShake=5;
            advancePose();
        }else if(matchPercent>0.5){
            // 良好匹配
            score+=5*combo;
            sceneScore+=5;
            combo++;
            goodHits++;
            spawnParticles(W/2,H/2,'#d4a574',8);
        }
    }

    if(combo>maxCombo) maxCombo=combo;
}

function advancePose(){
    const play=PLAYS[currentPlay];
    const scene=play.scenes[currentScene];

    poseTimer++;
    if(poseTimer<scene.poses.length){
        targetPose=scene.poses[poseTimer];
        spawnParticles(W/2,H*0.3,'#ff6b6b',20);
    }
}

function nextScene(){
    const play=PLAYS[currentPlay];
    currentScene++;

    if(currentScene>=play.scenes.length){
        // 剧目完成
        if(score>=play.scenes.reduce((a,b)=>a+b.targetScore,0)){
            // 解锁下一个剧目
            if(currentPlay+1<PLAYS.length){
                unlockedPlays[currentPlay+1]=true;
                localStorage.setItem('shadowPlayUnlocked',JSON.stringify(unlockedPlays));
            }
        }

        // 更新高分
        if(score>highScore){
            highScore=score;
            localStorage.setItem('shadowPlayHighScore',highScore.toString());
        }

        gameState='gameOver';
        document.getElementById('pauseBtn').style.display='none';
        document.getElementById('adContainer').classList.add('hidden');

        // 显示插屏广告
        showInterstitial();
    }else{
        startScene();
    }
}

function togglePause(){
    if(gameState==='playing'){
        gameState='paused';
        document.getElementById('pauseBtn').textContent='▶';
    }else if(gameState==='paused'){
        gameState='playing';
        document.getElementById('pauseBtn').textContent='||';
    }
}

function showSponsorModal(){
    document.getElementById('sponsorModal').classList.add('show');
}

function hideSponsorModal(){
    document.getElementById('sponsorModal').classList.remove('show');
}

function showInterstitial(){
    adShowing=true;
    adSkipTimer=CONFIG.adDuration/1000;
    document.getElementById('interstitial').classList.add('show');
    updateSkipButton();
}

function skipAd(){
    if(adSkipTimer<=0){
        adShowing=false;
        document.getElementById('interstitial').classList.remove('show');
    }
}

function updateSkipButton(){
    const btn=document.getElementById('skipAd');
    if(adSkipTimer>0){
        btn.textContent=`跳过 (${Math.ceil(adSkipTimer)}秒)`;
        btn.style.opacity='0.5';
    }else{
        btn.textContent='跳过';
        btn.style.opacity='1';
    }
}

// ==================== 粒子系统 ====================
function initMenuParticles(){
    menuParticles=[];
    for(let i=0;i<CONFIG.particleCount;i++){
        menuParticles.push({
            x:Math.random()*W,
            y:Math.random()*H,
            vx:(Math.random()-0.5)*0.5,
            vy:-Math.random()*0.5-0.2,
            size:Math.random()*3+1,
            alpha:Math.random()*0.5+0.2,
            color:Math.random()>0.5?'#f0c040':'#d4a574'
        });
    }
}

function spawnParticles(x,y,color,count){
    for(let i=0;i<count;i++){
        particles.push({
            x:x,
            y:y,
            vx:(Math.random()-0.5)*4,
            vy:(Math.random()-0.5)*4-2,
            size:Math.random()*4+2,
            alpha:1,
            color:color,
            life:60
        });
    }
}

function updateParticles(){
    // 菜单粒子
    for(let p of menuParticles){
        p.x+=p.vx;
        p.y+=p.vy;
        if(p.y<-10){p.y=H+10;p.x=Math.random()*W;}
        if(p.x<-10) p.x=W+10;
        if(p.x>W+10) p.x=-10;
    }

    // 游戏粒子
    for(let i=particles.length-1;i>=0;i--){
        const p=particles[i];
        p.x+=p.vx;
        p.y+=p.vy;
        p.vy+=0.05;
        p.alpha-=0.015;
        p.life--;
        if(p.life<=0||p.alpha<=0){
            particles.splice(i,1);
        }
    }
}

// ==================== 渲染函数 ====================
function render(){
    ctx.save();

    // 屏幕震动
    if(screenShake>0){
        screenShakeX=(Math.random()-0.5)*screenShake*2;
        screenShakeY=(Math.random()-0.5)*screenShake*2;
        screenShake*=0.9;
        if(screenShake<0.5) screenShake=0;
        ctx.translate(screenShakeX,screenShakeY);
    }

    // 清除画布
    ctx.fillStyle='#1a0a00';
    ctx.fillRect(-10,-10,W+20,H+20);

    switch(gameState){
        case 'menu': renderMenu(); break;
        case 'playSelect': renderPlaySelect(); break;
        case 'playing': renderGame(); break;
        case 'paused': renderGame(); renderPauseOverlay(); break;
        case 'sceneEnd': renderSceneEnd(); break;
        case 'gameOver': renderGameOver(); break;
    }

    // 渲染粒子
    renderParticles();

    ctx.restore();
}

function renderMenu(){
    // 渐变背景
    const gradient=ctx.createLinearGradient(0,0,0,H);
    gradient.addColorStop(0,'#1a0a00');
    gradient.addColorStop(0.5,'#2d1810');
    gradient.addColorStop(1,'#4a2520');
    ctx.fillStyle=gradient;
    ctx.fillRect(0,0,W,H);

    // 装饰线条
    ctx.strokeStyle='rgba(240,192,64,0.1)';
    ctx.lineWidth=1;
    for(let i=0;i<10;i++){
        const y=H*0.1+i*H*0.08;
        ctx.beginPath();
        ctx.moveTo(W*0.1,y);
        ctx.lineTo(W*0.9,y);
        ctx.stroke();
    }

    // 标题
    ctx.fillStyle='#f0c040';
    ctx.font=`bold ${72*scale}px "Microsoft YaHei"`;
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText('皮 影 戏',W/2,H*0.3);

    // 副标题
    ctx.fillStyle='#d4a574';
    ctx.font=`${24*scale}px "Microsoft YaHei"`;
    ctx.fillText('传承千年的光影艺术',W/2,H*0.38);

    // 开始按钮
    const btnY=H*0.65;
    const btnRadius=70*scale;

    // 按钮光晕
    const glowGradient=ctx.createRadialGradient(W/2,btnY,0,W/2,btnY,btnRadius*1.5);
    glowGradient.addColorStop(0,'rgba(240,192,64,0.3)');
    glowGradient.addColorStop(1,'rgba(240,192,64,0)');
    ctx.fillStyle=glowGradient;
    ctx.beginPath();
    ctx.arc(W/2,btnY,btnRadius*1.5,0,Math.PI*2);
    ctx.fill();

    // 按钮主体
    ctx.fillStyle='#8b4513';
    ctx.strokeStyle='#f0c040';
    ctx.lineWidth=3*scale;
    ctx.beginPath();
    ctx.arc(W/2,btnY,btnRadius,0,Math.PI*2);
    ctx.fill();
    ctx.stroke();

    // 按钮文字
    ctx.fillStyle='#f0c040';
    ctx.font=`bold ${28*scale}px "Microsoft YaHei"`;
    ctx.fillText('开始游戏',W/2,btnY);

    // 提示文字
    ctx.fillStyle='rgba(212,165,116,0.6)';
    ctx.font=`${16*scale}px "Microsoft YaHei"`;
    ctx.fillText('点击或按 Enter 开始',W/2,H*0.78);

    // 高分显示
    if(highScore>0){
        ctx.fillStyle='#d4a574';
        ctx.font=`${18*scale}px "Microsoft YaHei"`;
        ctx.fillText(`最高分: ${highScore}`,W/2,H*0.85);
    }

    // 版本信息
    ctx.fillStyle='rgba(212,165,116,0.3)';
    ctx.font=`${12*scale}px "Microsoft YaHei"`;
    ctx.fillText('v1.0 - 皮影戏艺术',W/2,H*0.95);
}

function renderPlaySelect(){
    // 渐变背景
    const gradient=ctx.createLinearGradient(0,0,0,H);
    gradient.addColorStop(0,'#1a0a00');
    gradient.addColorStop(0.5,'#2d1810');
    gradient.addColorStop(1,'#4a2520');
    ctx.fillStyle=gradient;
    ctx.fillRect(0,0,W,H);

    // 标题
    ctx.fillStyle='#f0c040';
    ctx.font=`bold ${48*scale}px "Microsoft YaHei"`;
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText('选择剧目',W/2,H*0.12);

    // 剧目列表
    const startY=H*0.25;
    const itemHeight=70*scale;

    for(let i=0;i<PLAYS.length;i++){
        const y=startY+i*itemHeight;
        const isSelected=i===selectedPlay;
        const isUnlocked=unlockedPlays[i];

        // 背景框
        ctx.fillStyle=isSelected?'rgba(139,69,19,0.6)':'rgba(45,24,16,0.6)';
        ctx.strokeStyle=isUnlocked?'#f0c040':'#666';
        ctx.lineWidth=isSelected?3:1;
        ctx.beginPath();
        ctx.roundRect(W/2-200*scale,y-25*scale,400*scale,50*scale,10*scale);
        ctx.fill();
        ctx.stroke();

        // 剧目名称
        ctx.fillStyle=isUnlocked?'#f0c040':'#666';
        ctx.font=`bold ${24*scale}px "Microsoft YaHei"`;
        ctx.fillText(isUnlocked?PLAYS[i].name:'???',W/2,y-5*scale);

        // 解锁条件
        if(!isUnlocked){
            ctx.fillStyle='rgba(212,165,116,0.5)';
            ctx.font=`${14*scale}px "Microsoft YaHei"`;
            ctx.fillText('完成上一个剧目解锁',W/2,y+15*scale);
        }
    }

    // 返回按钮
    ctx.fillStyle='#8b4513';
    ctx.strokeStyle='#f0c040';
    ctx.lineWidth=2*scale;
    ctx.beginPath();
    ctx.roundRect(W/2-80*scale,H*0.85-20*scale,160*scale,40*scale,10*scale);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle='#f0c040';
    ctx.font=`${20*scale}px "Microsoft YaHei"`;
    ctx.fillText('返回',W/2,H*0.85);
}

function renderGame(){
    const play=PLAYS[currentPlay];
    const scene=play.scenes[currentScene];

    // 背景渐变
    const bgIndex=Math.min(currentScene,play.bgColors.length-1);
    const gradient=ctx.createLinearGradient(0,0,0,H);
    gradient.addColorStop(0,play.bgColors[bgIndex]);
    gradient.addColorStop(1,'#000');
    ctx.fillStyle=gradient;
    ctx.fillRect(0,0,W,H);

    // 幕布装饰
    renderCurtain();

    // 舞台灯光
    renderStageLight();

    // 皮影角色
    if(shadowPuppet){
        renderPuppet();
    }

    // 目标姿势提示
    if(targetPose&&targetPose.joints){
        renderTargetPose();
    }

    // UI信息
    renderGameUI();

    // 场景信息
    renderSceneInfo();
}

function renderCurtain(){
    // 左幕布
    ctx.fillStyle='rgba(139,0,0,0.3)';
    ctx.fillRect(0,0,W*0.08,H);

    // 右幕布
    ctx.fillRect(W*0.92,0,W*0.08,H);

    // 幕布边缘装饰
    ctx.strokeStyle='rgba(240,192,64,0.2)';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(W*0.08,0);
    ctx.lineTo(W*0.08,H);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(W*0.92,0);
    ctx.lineTo(W*0.92,H);
    ctx.stroke();
}

function renderStageLight(){
    // 中心聚光灯
    const lightGradient=ctx.createRadialGradient(W/2,H*0.3,0,W/2,H*0.3,H*0.5);
    lightGradient.addColorStop(0,'rgba(240,192,64,0.15)');
    lightGradient.addColorStop(1,'rgba(240,192,64,0)');
    ctx.fillStyle=lightGradient;
    ctx.beginPath();
    ctx.arc(W/2,H*0.3,H*0.5,0,Math.PI*2);
    ctx.fill();
}

function renderPuppet(){
    const joints=getWorldJoints();

    // 绘制骨骼
    ctx.strokeStyle='#8b4513';
    ctx.lineCap='round';

    for(let bone of BONES){
        const from=joints[bone.from];
        const to=joints[bone.to];
        if(!from||!to) continue;

        ctx.lineWidth=bone.width*scale;
        ctx.beginPath();
        ctx.moveTo(from.x,from.y);
        ctx.lineTo(to.x,to.y);
        ctx.stroke();
    }

    // 绘制关节
    for(let name in joints){
        const j=joints[name];
        const isSelected=selectedJoint===name;

        // 关节光晕
        if(isSelected){
            ctx.fillStyle='rgba(240,192,64,0.3)';
            ctx.beginPath();
            ctx.arc(j.x,j.y,jointRadius*scale*1.5,0,Math.PI*2);
            ctx.fill();
        }

        // 关节主体
        ctx.fillStyle=isSelected?'#f0c040':'#d4a574';
        ctx.strokeStyle='#8b4513';
        ctx.lineWidth=2*scale;
        ctx.beginPath();
        ctx.arc(j.x,j.y,jointRadius*scale*0.6,0,Math.PI*2);
        ctx.fill();
        ctx.stroke();
    }

    // 绘制头部装饰
    const head=joints.head;
    if(head){
        // 头冠
        ctx.fillStyle='#f0c040';
        ctx.beginPath();
        ctx.moveTo(head.x-12*scale,head.y-8*scale);
        ctx.lineTo(head.x+12*scale,head.y-8*scale);
        ctx.lineTo(head.x+8*scale,head.y-18*scale);
        ctx.lineTo(head.x-8*scale,head.y-18*scale);
        ctx.closePath();
        ctx.fill();
    }
}

function renderTargetPose(){
    const baseX=W/2;
    const baseY=H*0.55;

    // 半透明目标
    ctx.globalAlpha=0.3;
    ctx.strokeStyle='#f0c040';
    ctx.lineWidth=2*scale;
    ctx.setLineDash([5,5]);

    for(let bone of BONES){
        const fromBase=JOINTS[bone.from];
        const toBase=JOINTS[bone.to];
        const fromOffset=targetPose.joints[bone.from]||{x:0,y:0};
        const toOffset=targetPose.joints[bone.to]||{x:0,y:0};

        const fromX=baseX+(fromBase.x+fromOffset.x)*scale;
        const fromY=baseY+(fromBase.y+fromOffset.y)*scale;
        const toX=baseX+(toBase.x+toOffset.x)*scale;
        const toY=baseY+(toBase.y+toOffset.y)*scale;

        ctx.beginPath();
        ctx.moveTo(fromX,fromY);
        ctx.lineTo(toX,toY);
        ctx.stroke();
    }

    // 目标关节
    for(let name in targetPose.joints){
        const base=JOINTS[name];
        const offset=targetPose.joints[name];
        const x=baseX+(base.x+offset.x)*scale;
        const y=baseY+(base.y+offset.y)*scale;

        ctx.fillStyle='#f0c040';
        ctx.beginPath();
        ctx.arc(x,y,8*scale,0,Math.PI*2);
        ctx.fill();
    }

    ctx.setLineDash([]);
    ctx.globalAlpha=1;
}

function renderGameUI(){
    // 分数
    ctx.fillStyle='#f0c040';
    ctx.font=`bold ${28*scale}px "Microsoft YaHei"`;
    ctx.textAlign='left';
    ctx.textBaseline='top';
    ctx.fillText(`分数: ${score}`,20*scale,20*scale);

    // 连击
    if(combo>1){
        ctx.fillStyle='#ff6b6b';
        ctx.font=`bold ${36*scale}px "Microsoft YaHei"`;
        ctx.textAlign='center';
        ctx.fillText(`${combo}x 连击!`,W/2,20*scale);
    }

    // 场景时间
    ctx.fillStyle='#d4a574';
    ctx.font=`${20*scale}px "Microsoft YaHei"`;
    ctx.textAlign='right';
    ctx.fillText(`时间: ${Math.ceil(sceneTimer)}s`,W-20*scale,20*scale);

    // 进度条
    const progress=poseTimer/PLAYS[currentPlay].scenes[currentScene].poses.length;
    ctx.fillStyle='rgba(139,69,19,0.5)';
    ctx.fillRect(20*scale,60*scale,W-40*scale,10*scale);
    ctx.fillStyle='#f0c040';
    ctx.fillRect(20*scale,60*scale,(W-40*scale)*progress,10*scale);
}

function renderSceneInfo(){

    // 剧目名称
    ctx.fillStyle='rgba(240,192,64,0.7)';
    ctx.font=`${16*scale}px "Microsoft YaHei"`;
    ctx.textAlign='center';
    ctx.fillText(`${play.name} - ${scene.name}`,W/2,H-40*scale);

function renderPauseOverlay(){

function renderSceneEnd(){
    const play=PLAYS[currentPlay];
    const scene=play.scenes[currentScene];

    // 背景
    const gradient=ctx.createLinearGradient(0,0,0,H);
    gradient.addColorStop(0,'#1a0a00');
    gradient.addColorStop(1,'#000');
    ctx.fillStyle=gradient;
    ctx.fillRect(0,0,W,H);

    // 标题
    ctx.fillStyle='#f0c040';
    ctx.font=`bold ${40*scale}px "Microsoft YaHei"`;
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText('场景完成!',W/2,H*0.25);

    // 场景信息
    ctx.fillStyle='#d4a574';
    ctx.font=`${24*scale}px "Microsoft YaHei"`;
    ctx.fillText(scene.name,W/2,H*0.35);

    // 统计
    ctx.font=`${20*scale}px "Microsoft YaHei"`;
    ctx.fillText(`完美匹配: ${perfectHits}`,W/2,H*0.45);
    ctx.fillText(`良好匹配: ${goodHits}`,W/2,H*0.5);
    ctx.fillText(`最大连击: ${maxCombo}`,W/2,H*0.55);
    ctx.fillText(`场景得分: ${sceneScore}`,W/2,H*0.6);

    // 继续按钮
    ctx.fillStyle='#8b4513';
    ctx.strokeStyle='#f0c040';
    ctx.lineWidth=3*scale;
    ctx.beginPath();
    ctx.roundRect(W/2-100*scale,H*0.7-25*scale,200*scale,50*scale,10*scale);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle='#f0c040';
    ctx.font=`bold ${24*scale}px "Microsoft YaHei"`;
    ctx.fillText('继续',W/2,H*0.7);
}

function renderGameOver(){
    const play=PLAYS[currentPlay];

    // 背景
    const gradient=ctx.createLinearGradient(0,0,0,H);
    gradient.addColorStop(0,'#1a0a00');
    gradient.addColorStop(1,'#000');
    ctx.fillStyle=gradient;
    ctx.fillRect(0,0,W,H);

    // 标题
    ctx.fillStyle='#f0c040';
    ctx.font=`bold ${48*scale}px "Microsoft YaHei"`;
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText('剧目完成!',W/2,H*0.15);

    // 剧目名称
    ctx.fillStyle='#d4a574';
    ctx.font=`${28*scale}px "Microsoft YaHei"`;
    ctx.fillText(play.name,W/2,H*0.25);

    // 总分
    ctx.fillStyle='#f0c040';
    ctx.font=`bold ${36*scale}px "Microsoft YaHei"`;
    ctx.fillText(`总分: ${score}`,W/2,H*0.35);

    // 高分
    if(score>=highScore){
        ctx.fillStyle='#ff6b6b';
        ctx.font=`${24*scale}px "Microsoft YaHei"`;
        ctx.fillText('新纪录!',W/2,H*0.42);
    }else{
        ctx.fillStyle='#d4a574';
        ctx.font=`${20*scale}px "Microsoft YaHei"`;
        ctx.fillText(`最高分: ${highScore}`,W/2,H*0.42);
    }

    // 统计
    ctx.fillStyle='#d4a574';
    ctx.font=`${18*scale}px "Microsoft YaHei"`;
    ctx.fillText(`完美匹配: ${perfectHits} | 良好匹配: ${goodHits}`,W/2,H*0.5);
    ctx.fillText(`最大连击: ${maxCombo}`,W/2,H*0.55);

    // 解锁提示
    if(currentPlay+1<PLAYS.length&&unlockedPlays[currentPlay+1]){
        ctx.fillStyle='#90EE90';
        ctx.font=`${20*scale}px "Microsoft YaHei"`;
        ctx.fillText(`解锁新剧目: ${PLAYS[currentPlay+1].name}`,W/2,H*0.62);
    }

    // 再来一局按钮
    ctx.fillStyle='#8b0000';
    ctx.strokeStyle='#ff6b6b';
    ctx.lineWidth=3*scale;
    ctx.beginPath();
    ctx.roundRect(W/2-100*scale,H*0.6-25*scale,200*scale,50*scale,10*scale);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle='#ff6b6b';
    ctx.font=`bold ${24*scale}px "Microsoft YaHei"`;
    ctx.fillText('再来一局',W/2,H*0.6);

    // 返回按钮
    ctx.fillStyle='#8b4513';
    ctx.strokeStyle='#f0c040';
    ctx.lineWidth=3*scale;
    ctx.beginPath();
    ctx.roundRect(W/2-100*scale,H*0.7-25*scale,200*scale,50*scale,10*scale);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle='#f0c040';
    ctx.font=`bold ${24*scale}px "Microsoft YaHei"`;
    ctx.fillText('返回主菜单',W/2,H*0.7);
}

function renderParticles(){
    // 菜单粒子
    for(let p of menuParticles){
        ctx.globalAlpha=p.alpha;
        ctx.fillStyle=p.color;
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
        ctx.fill();
    }

    // 游戏粒子
    for(let p of particles){
        ctx.globalAlpha=p.alpha;
        ctx.fillStyle=p.color;
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
        ctx.fill();
    }

    ctx.globalAlpha=1;
}

// ==================== 更新函数 ====================
function update(dt){
    // 更新粒子
    updateParticles();

    // 广告计时
    if(adShowing){
        adSkipTimer-=dt/1000;
        updateSkipButton();
        if(adSkipTimer<=0){
            adSkipTimer=0;
        }
    }

    // 游戏状态更新
    if(gameState==='playing'){
        // 场景计时
        sceneTimer-=dt/1000;
        if(sceneTimer<=0){
            sceneTimer=0;
            gameState='sceneEnd';
            document.getElementById('pauseBtn').style.display='none';
            document.getElementById('adContainer').classList.add('hidden');
        }

        // 检查是否完成所有姿势
        const scene=PLAYS[currentPlay].scenes[currentScene];
        if(poseTimer>=scene.poses.length&&sceneTimer>0){
            // 提前完成，给予奖励
            score+=Math.floor(sceneTimer*10);
            sceneTimer=0;
            gameState='sceneEnd';
            document.getElementById('pauseBtn').style.display='none';
            document.getElementById('adContainer').classList.add('hidden');
        }

        // 连击衰减
        if(combo>0&&selectedJoint===null){
            // 如果没有在拖动关节，连击缓慢衰减
        }
    }

    // 菜单粒子动画
    if(gameState==='menu'){
        for(let p of menuParticles){
            p.x+=p.vx;
            p.y+=p.vy;
            if(p.y<-10){p.y=H+10;p.x=Math.random()*W;}
        }
    }
}

// ==================== 工具函数 ====================
function distance(x1,y1,x2,y2){
    const dx=x1-x2;
    const dy=y1-y2;
    return Math.sqrt(dx*dx+dy*dy);
}

// roundRect polyfill
if(!CanvasRenderingContext2D.prototype.roundRect){
    CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
        if(typeof r==='number') r={tl:r,tr:r,br:r,bl:r};
        this.beginPath();
        this.moveTo(x+r.tl,y);
        this.lineTo(x+w-r.tr,y);
        this.quadraticCurveTo(x+w,y,x+w,y+r.tr);
        this.lineTo(x+w,y+h-r.br);
        this.quadraticCurveTo(x+w,y+h,x+w-r.br,y+h);
        this.lineTo(x+r.bl,y+h);
        this.quadraticCurveTo(x,y+h,x,y+h-r.bl);
        this.lineTo(x,y+r.tl);
        this.quadraticCurveTo(x,y,x+r.tl,y);
        this.closePath();
        return this;
    };
}

// ==================== 游戏循环 ====================
function gameLoop(timestamp){
    deltaTime=timestamp-lastTime;
    lastTime=timestamp;

    // 限制deltaTime防止跳帧
    if(deltaTime>100) deltaTime=100;

    update(deltaTime);
    render();

    requestAnimationFrame(gameLoop);
}

  window.setInterval = function(fn, delay) {
