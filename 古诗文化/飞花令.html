<script>
// ============================================
// 游戏名称: 飞花令
// 功能描述: 该游戏提供休闲娱乐体验
// 创建时间: 2026-06-23
// ============================================

const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W,H,gameState='menu',score=0,turn=0,targetChar='',usedPoems=[],playerInput='',highScore=+localStorage.getItem('feihualing_hi')||0;
let timer=30,frameCount=0,message='',msgTimer=0,particles=[],combo=0;

function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight}
addEventListener('resize',resize);resize();

// 200+ 诗句库
const POEMS=[
"床前明月光","疑是地上霜","举头望明月","低头思故乡","白日依山尽","黄河入海流","欲穷千里目","更上一层楼",
"春眠不觉晓","处处闻啼鸟","夜来风雨声","花落知多少","千山鸟飞绝","万径人踪灭","孤舟蓑笠翁","独钓寒江雪",
"锄禾日当午","汗滴禾下土","谁知盘中餐","粒粒皆辛苦","离离原上草","一岁一枯荣","野火烧不尽","春风吹又生",
"两个黄鹂鸣翠柳","一行白鹭上青天","窗含西岭千秋雪","门泊东吴万里船","鹅鹅鹅","曲项向天歌","白毛浮绿水","红掌拨清波",
"小时不识月","呼作白玉盘","又疑瑶台镜","飞在青云端","危楼高百尺","手可摘星辰","不敢高声语","恐惊天上人",
"返景入深林","复照青苔上","空山不见人","但闻人语响","空山新雨后","天气晚来秋","明月松间照","清泉石上流",
"独在异乡为异客","每逢佳节倍思亲","遥知兄弟登高处","遍插茱萸少一人","桃花潭水深千尺","不及汪伦送我情",
"朝辞白帝彩云间","千里江陵一日还","两岸猿声啼不住","轻舟已过万重山","故人西辞黄鹤楼","烟花三月下扬州",
"孤帆远影碧空尽","唯见长江天际流","日照香炉生紫烟","遥看瀑布挂前川","飞流直下三千尺","疑是银河落九天",
"天门中断楚江开","碧水东流至此回","两岸青山相对出","孤帆一片日边来","秦时明月汉时关","万里长征人未还",
"但使龙城飞将在","不教胡马度阴山","寒雨连江夜入吴","平明送客楚山孤","洛阳亲友如相问","一片冰心在玉壶",
"葡萄美酒夜光杯","欲饮琵琶马上催","醉卧沙场君莫笑","古来征战几人回","黄河远上白云间","一片孤城万仞山",
"羌笛何须怨杨柳","春风不度玉门关","渭城朝雨浥轻尘","客舍青青柳色新","劝君更尽一杯酒","西出阳关无故人",
"月落乌啼霜满天","江枫渔火对愁眠","姑苏城外寒山寺","夜半钟声到客船","湖光秋月两相和","潭面无风镜未磨",
"遥望洞庭山水翠","白银盘里一青螺","九曲黄河万里沙","浪淘风簸自天涯","如今直上银河去","同到牵牛织女家",
"西塞山前白鹭飞","桃花流水鳜鱼肥","青箬笠","绿蓑衣","月黑雁飞高","单于夜遁逃","欲将轻骑逐","大雪满弓刀",
"不论平地与山尖","无限风光尽被占","采得百花成蜜后","为谁辛苦为谁甜","咬定青山不放松","立根原在破岩中",
"千磨万击还坚劲","任尔东西南北风","九州生气恃风雷","万马齐喑究可哀","我劝天公重抖擞","不拘一格降人才",
"草长莺飞二月天","拂堤杨柳醉春烟","儿童散学归来早","忙趁东风放纸鸢","牧童骑黄牛","歌声振林樾",
"意欲捕鸣蝉","忽然闭口立","泉眼无声惜细流","树阴照水爱晴柔","小荷才露尖尖角","早有蜻蜓立上头",
"毕竟西湖六月中","风光不与四时同","接天莲叶无穷碧","映日荷花别样红","昼出耘田夜绩麻","村庄儿女各当家",
"童孙未解供耕织","也傍桑阴学种瓜","死去元知万事空","但悲不见九州同","王师北定中原日","家祭无忘告乃翁",
"三万里河东入海","五千仞岳上摩天","遗民泪尽胡尘里","南望王师又一年","黑云翻墨未遮山","白雨跳珠乱入船",
"卷地风来忽吹散","望湖楼下水如天","水光潋滟晴方好","山色空蒙雨亦奇","欲把西湖比西子","淡妆浓抹总相宜",
"横看成岭侧成峰","远近高低各不同","不识庐山真面目","只缘身在此山中","梅子金黄杏子肥","麦花雪白菜花稀",
"日长篱落无人过","唯有蜻蜓蛱蝶飞","篱落疏疏一径深","树头新绿未成阴","儿童急走追黄蝶","飞入菜花无处寻",
"茅檐长扫净无苔","花木成畦手自栽","一水护田将绿绕","两山排闼送青来","京口瓜洲一水间","钟山只隔数重山",
"春风又绿江南岸","明月何时照我还","爆竹声中一岁除","春风送暖入屠苏","千门万户曈曈日","总把新桃换旧符",
"好雨知时节","当春乃发生","随风潜入夜","润物细无声","野径云俱黑","江船火独明","晓看红湿处","花重锦官城",
"国破山河在","城春草木深","感时花溅泪","恨别鸟惊心","烽火连三月","家书抵万金","白头搔更短","浑欲不胜簪",
"松下问童子","言师采药去","只在此山中","云深不知处","远上寒山石径斜","白云深处有人家","停车坐爱枫林晚","霜叶红于二月花",
"清明时节雨纷纷","路上行人欲断魂","借问酒家何处有","牧童遥指杏花村","胜日寻芳泗水滨","无边光景一时新",
"等闲识得东风面","万紫千红总是春","应怜屐齿印苍苔","小扣柴扉久不开","春色满园关不住","一枝红杏出墙来",
"生当作人杰","死亦为鬼雄","至今思项羽","不肯过江东","众鸟高飞尽","孤云独去闲","相看两不厌","只有敬亭山",
"李白乘舟将欲行","忽闻岸上踏歌声","桃花潭水深千尺","不及汪伦送我情","黄四娘家花满蹊","千朵万朵压枝低",
"留连戏蝶时时舞","自在娇莺恰恰啼","迟日江山丽","春风花草香","泥融飞燕子","沙暖睡鸳鸯",
"江碧鸟逾白","山青花欲燃","今春看又过","何日是归年","日暮苍山远","天寒白屋贫","柴门闻犬吠","风雪夜归人",
"千锤万凿出深山","烈火焚烧若等闲","粉骨碎身浑不怕","要留清白在人间","煮豆燃豆萁","豆在釜中泣",
"本是同根生","相煎何太急","红豆生南国","春来发几枝","愿君多采撷","此物最相思",
"君自故乡来","应知故乡事","来日绮窗前","寒梅著花未","移舟泊烟渚","日暮客愁新","野旷天低树","江清月近人",
"葡萄美酒夜光杯","欲饮琵琶马上催","醉卧沙场君莫笑","古来征战几人回","青海长云暗雪山","孤城遥望玉门关",
"黄沙百战穿金甲","不破楼兰终不还","大漠沙如雪","燕山月似钩","何当金络脑","快走踏清秋",
"慈母手中线","游子身上衣","临行密密缝","意恐迟迟归","谁言寸草心","报得三春晖",
"解落三秋叶","能开二月花","过江千尺浪","入竹万竿斜","云想衣裳花想容","春风拂槛露华浓",
"若非群玉山头见","会向瑶台月下逢","一枝红艳露凝香","云雨巫山枉断肠","名花倾国两相欢","长得君王带笑看",
"解释春风无限恨","沉香亭北倚阑干","凤凰台上凤凰游","凤去台空江自流","吴宫花草埋幽径","晋代衣冠成古丘",
"三山半落青天外","二水中分白鹭洲","总为浮云能蔽日","长安不见使人愁","长安一片月","万户捣衣声",
"秋风吹不尽","总是玉关情","何日平胡虏","良人罢远征","明月出天山","苍茫云海间","长风几万里","吹度玉门关",
"汉下白登道","胡窥青海湾","由来征战地","不见有人还","戍客望边邑","思归多苦颜","高楼当此夜","叹息未应闲",
"花间一壶酒","独酌无相亲","举杯邀明月","对影成三人","月既不解饮","影徒随我身","暂伴月将影","行乐须及春",
"我歌月徘徊","我舞影零乱","醒时同交欢","醉后各分散","永结无情游","相期邈云汉",
"青山横北郭","白水绕东城","此地一为别","孤蓬万里征","浮云游子意","落日故人情","挥手自兹去","萧萧班马鸣",
"渡远荆门外","来从楚国游","山随平野尽","江入大荒流","月下飞天镜","云生结海楼","仍怜故乡水","万里送行舟",
"客路青山外","行舟绿水前","潮平两岸阔","风正一帆悬","海日生残夜","江春入旧年","乡书何处达","归雁洛阳边",
"青山隐隐水迢迢","秋尽江南草未凋","二十四桥明月夜","玉人何处教吹箫","烟笼寒水月笼沙","夜泊秦淮近酒家",
"商女不知亡国恨","隔江犹唱后庭花","折戟沉沙铁未销","自将磨洗认前朝","东风不与周郎便","铜雀春深锁二乔",
"烟笼寒水月笼沙","夜泊秦淮近酒家","商女不知亡国恨","隔江犹唱后庭花","锦瑟无端五十弦","一弦一柱思华年",
"庄生晓梦迷蝴蝶","望帝春心托杜鹃","沧海月明珠有泪","蓝田日暖玉生烟","此情可待成追忆","只是当时已惘然",
"相见时难别亦难","东风无力百花残","春蚕到死丝方尽","蜡炬成灰泪始干","晓镜但愁云鬓改","夜吟应觉月光寒",
"蓬山此去无多路","青鸟殷勤为探看","君问归期未有期","巴山夜雨涨秋池","何当共剪西窗烛","却话巴山夜雨时",
"向晚意不适","驱车登古原","夕阳无限好","只是近黄昏","宣室求贤访逐臣","贾生才调更无伦",
"可怜夜半虚前席","不问苍生问鬼神","云母屏风烛影深","长河渐落晓星沉","嫦娥应悔偷灵药","碧海青天夜夜心",
"昨夜星辰昨夜风","画楼西畔桂堂东","身无彩凤双飞翼","心有灵犀一点通","飒飒东风细雨来","芙蓉塘外有轻雷",
"金蟾啮锁烧香入","玉虎牵丝汲井回","贾氏窥帘韩掾少","宓妃留枕魏王才","春心莫共花争发","一寸相思一寸灰",
"重帏深下莫愁堂","卧后清宵细细长","神女生涯原是梦","小姑居处本无郎","风波不信菱枝弱","月露谁教桂叶香",
"直道相思了无益","未妨惆怅是清狂","来是空言去绝踪","月斜楼上五更钟","梦为远别啼难唤","书被催成墨未浓",
"蜡照半笼金翡翠","麝薰微度绣芙蓉","刘郎已恨蓬山远","更隔蓬山一万重","凤尾香罗薄几重","碧文圆顶夜深缝",
"扇裁月魄羞难掩","车走雷声语未通","曾是寂寥金烬暗","断无消息石榴红","斑骓只系垂杨岸","何处西南任好风",
"昨夜星辰昨夜风","画楼西畔桂堂东","身无彩凤双飞翼","心有灵犀一点通","隔座送钩春酒暖","分曹射覆蜡灯红",
"嗟余听鼓应官去","走马兰台类转蓬","闻道阊门萼绿华","昔年相望抵天涯","岂知一夜秦楼客","偷看吴王苑内花",
"海外徒闻更九州","他生未卜此生休","空闻虎旅传宵柝","无复鸡人报晓筹","此日六军同驻马","当时七夕笑牵牛",
"如何四纪为天子","不及卢家有莫愁","宣室求贤访逐臣","贾生才调更无伦","可怜夜半虚前席","不问苍生问鬼神",

// 按字索引
const charIndex={};
POEMS.forEach(p=>{
    for(const ch of p){
        if(!charIndex[ch])charIndex[ch]=[];
        if(!charIndex[ch].includes(p))charIndex[ch].push(p);
    }
});

const TARGET_CHARS='月风花雪云山水春江天日月人雨夜山烟楼酒'.split('');

function drawBg(){
    const g=ctx.createLinearGradient(0,0,W,H);
    g.addColorStop(0,'#1a0a2e');g.addColorStop(0.5,'#2d1b4e');g.addColorStop(1,'#1a0a2e');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
function drawText(t,x,y,s,c,a){ctx.fillStyle=c||'#fff';ctx.font=`bold ${s}px 'Microsoft YaHei',sans-serif`;ctx.textAlign=a||'center';ctx.textBaseline='middle';ctx.fillText(t,x,y)}

class Particle{
    constructor(x,y,c){this.x=x;this.y=y;this.vx=(Math.random()-0.5)*4;this.vy=(Math.random()-0.5)*4;this.life=1;this.color=c;this.size=Math.random()*4+2}
    update(){this.x+=this.vx;this.y+=this.vy;this.life-=0.015;this.vy+=0.03}
    draw(){ctx.globalAlpha=this.life;ctx.fillStyle=this.color;ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}
}
function spawnP(x,y,n,c){for(let i=0;i<n;i++)particles.push(new Particle(x,y,c))}

function startGame(){
    gameState='playing';score=0;turn=0;usedPoems=[];combo=0;playerInput='';
    targetChar=TARGET_CHARS[Math.floor(Math.random()*TARGET_CHARS.length)];
    timer=30;message=`含"${targetChar}"的诗句`;msgTimer=90;
}

function checkInput(){
    const input=playerInput.trim();
    if(!input)return;
    if(usedPoems.includes(input)){message='已用过！';msgTimer=60;playerInput='';return}
    if(!input.includes(targetChar)){message=`必须含"${targetChar}"！`;msgTimer=60;playerInput='';return}
    // 检查是否在库中（模糊匹配）
    const found=POEMS.some(p=>p.includes(input)||input.includes(p));
    if(!found&&!charIndex[targetChar]?.some(p=>p.includes(input))){message='不在诗句库中！';msgTimer=60;playerInput='';return}
    usedPoems.push(input);combo++;score+=10+combo*5;
    if(score>highScore){highScore=score;localStorage.setItem('feihualing_hi',highScore)}
    spawnP(W/2,H/2,20,'#ffd700');
    timer=Math.min(timer+5,45);
    playerInput='';turn=1;
    // AI回合
    setTimeout(aiTurn,800);
}

function aiTurn(){
    const available=(charIndex[targetChar]||[]).filter(p=>!usedPoems.includes(p));
    if(available.length===0){message='AI无诗可接，你赢了！';gameState='win';return}
    const pick=available[Math.floor(Math.random()*available.length)];
    usedPoems.push(pick);combo=0;
    message=`AI: ${pick}`;msgTimer=90;
    spawnP(W/2,H/2-50,10,'#ff69b4');
    timer=30;turn=0;
}

function drawMenu(){
    drawBg();
    drawText('飞 花 令',W/2,H*0.2,Math.min(W*0.1,56),'#ffd700');
    drawText('含指定字的诗句对决',W/2,H*0.32,Math.min(W*0.035,18),'#c9a0dc');
    const bw=Math.min(W*0.4,200),bh=50,bx=W/2-bw/2,by=H*0.48;
    ctx.fillStyle='#7b2d8e';ctx.beginPath();ctx.roundRect(bx,by,bw,bh,12);ctx.fill();
    drawText('开始对决',W/2,by+bh/2,20,'#fff');
    drawText(`最高分: ${highScore}`,W/2,H*0.62,16,'#c9a0dc');
    drawText('限时30秒 | 接诗句得分',W/2,H*0.72,14,'#8b5da8');
    drawText('200+诗句库',W/2,H*0.78,14,'#8b5da8');
    drawText('点击按钮或按空格开始',W/2,H*0.88,12,'#aaa');
}

function drawGame(){
    drawBg();
    // 标题
    drawText(`飞花令 · 含"${targetChar}"`,W/2,35,Math.min(W*0.05,24),'#ffd700');
    drawText(`得分: ${score}  连击: ${combo}`,W/2,62,14,'#c9a0dc');
    // 计时器
    const tw=Math.min(W*0.5,200),tx=W/2-tw/2,ty=78;
    ctx.fillStyle='rgba(255,255,255,0.1)';ctx.fillRect(tx,ty,tw,12);
    ctx.fillStyle=timer>10?'#7b2d8e':'#ff4444';ctx.fillRect(tx,ty,tw*(timer/30),12);
    drawText(`${Math.ceil(timer)}s`,W/2,ty+6,10,'#fff');
    // 已用诗句
    const recent=usedPoems.slice(-5);
    if(recent.length){
        ctx.fillStyle='rgba(123,45,142,0.15)';ctx.beginPath();ctx.roundRect(W*0.05,100,W*0.9,Math.min(recent.length*28+20,160),12);ctx.fill();
        recent.forEach((p,i)=>{
            drawText(p,W/2,115+i*28,Math.min(W*0.03,14),i===recent.length-1?'#ffd700':'#c9a0dc');
        });
    }
    // 输入
    if(turn===0){
        const iy=H*0.6,iw=Math.min(W*0.75,380),ih=50,ix=W/2-iw/2;
        ctx.fillStyle='rgba(123,45,142,0.2)';ctx.beginPath();ctx.roundRect(ix,iy,iw,ih,12);ctx.fill();
        ctx.strokeStyle='#7b2d8e';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(ix,iy,iw,ih,12);ctx.stroke();
        drawText(playerInput||'输入含该字的诗句...',W/2,iy+ih/2,16,playerInput?'#fff':'#666');
        drawText('回车确认',W/2,iy+ih+20,12,'#8b5da8');
    }else{
        drawText('AI思考中...',W/2,H*0.65,18,'#ff69b4');
    }
    if(msgTimer>0){
        const my=H*0.82;
        ctx.fillStyle='rgba(0,0,0,0.5)';ctx.beginPath();ctx.roundRect(W*0.05,my-15,W*0.9,30,8);ctx.fill();
        drawText(message,W/2,my,Math.min(W*0.03,14),'#ffd700');msgTimer--;
    }
}

function drawEnd(){
    drawBg();
    const isWin=gameState==='win';
    drawText(isWin?'🎉 你赢了！':'⏰ 时间到！',W/2,H*0.28,Math.min(W*0.07,36),isWin?'#ffd700':'#ff6b6b');
    drawText(`得分: ${score}`,W/2,H*0.4,24,'#fff');
    drawText(`接了 ${usedPoems.length} 句诗`,W/2,H*0.48,18,'#c9a0dc');
    const bw=Math.min(W*0.4,200),bh=50,bx=W/2-bw/2,by=H*0.6;
    ctx.fillStyle='#7b2d8e';ctx.beginPath();ctx.roundRect(bx,by,bw,bh,12);ctx.fill();
    drawText('再来一局',W/2,by+bh/2,20,'#fff');
}

addEventListener('keydown',e=>{
    if(gameState==='playing'&&turn===0){
        if(e.key==='Enter')checkInput();
        else if(e.key==='Backspace')playerInput=playerInput.slice(0,-1);
        else if(e.key.length===1&&playerInput.length<30)playerInput+=e.key;
    }else if(e.key==='Enter'){
        if(gameState==='menu')startGame();
        else if(gameState==='win'||gameState==='gameover')startGame();
    }
});

addEventListener('click',e=>{
    if(gameState==='menu'){
        const bw=Math.min(W*0.4,200),bh=50,bx=W/2-bw/2,by=H*0.48;
        if(e.clientX>=bx&&e.clientX<=bx+bw&&e.clientY>=by&&e.clientY<=by+bh)startGame();
    }else if(gameState==='playing'&&turn===0&&/Mobi|Android/i.test(navigator.userAgent)){
        const input=prompt(`输入含"${targetChar}"的诗句：`);
        if(input){playerInput=input;checkInput()}
    }else if(gameState==='win'||gameState==='gameover'){
        const bw=Math.min(W*0.4,200),bh=50,bx=W/2-bw/2,by=H*0.6;
        if(e.clientX>=bx&&e.clientX<=bx+bw&&e.clientY>=by&&e.clientY<=by+bh)startGame();
    }
});

function loop(){
    if(gameState==='playing'){
        frameCount++;
        if(frameCount%60===0&&turn===0){timer--;if(timer<=0){gameState='gameover'}}
    }
    if(gameState==='menu')drawMenu();
    else if(gameState==='playing')drawGame();
    else drawEnd();
    particles.forEach(p=>{p.update();p.draw()});particles=particles.filter(p=>p.life>0);
    requestAnimationFrame(loop);
}
loop();

<script>
(function(){
  if (window.__touchBridgeInstalled) return;
  window.__touchBridgeInstalled = true;
  function dispatchMouseLike(type, touch) {
    var target = document.elementFromPoint(touch.clientX, touch.clientY) || document.querySelector('canvas');
    if (!target) return;
    target.dispatchEvent(new MouseEvent(type, {
      bubbles: true,
      cancelable: true,
      clientX: touch.clientX,
      clientY: touch.clientY,
      screenX: touch.screenX,
      screenY: touch.screenY,
      button: 0
    }));
  }
  document.addEventListener('touchstart', function(e) {
    if (!e.touches || !e.touches.length) return;
    e.preventDefault();
    dispatchMouseLike('mousedown', e.touches[0]);
    dispatchMouseLike('click', e.touches[0]);
  }, { passive: false });
  document.addEventListener('touchmove', function(e) {
    if (!e.touches || !e.touches.length) return;
    e.preventDefault();
    dispatchMouseLike('mousemove', e.touches[0]);
  }, { passive: false });
  document.addEventListener('touchend', function(e) {
    var touch = e.changedTouches && e.changedTouches[0];
    if (!touch) return;
    e.preventDefault();
    dispatchMouseLike('mouseup', touch);
  }, { passive: false });
})();

<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>

<script>

  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
