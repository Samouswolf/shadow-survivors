function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

function generateGrid(poem){
    const chars=poem.split('');
    // 加入干扰字
    const extra='的了在是我他她它这那有不人大中来上出到会生子时年面事行能说起开过好看天地方日月水火风雪雨花草树木鸟虫鱼龙虎马牛羊鸡犬猪猫狗'.split('');
    const allChars=shuffle([...chars,...shuffle(extra).slice(0,9-poem.length)]);
    return shuffle(allChars).slice(0,9);
}

function drawBg(){
    const g=ctx.createLinearGradient(0,0,W,H);
    g.addColorStop(0,'#0d1117');g.addColorStop(0.5,'#161b22');g.addColorStop(1,'#0d1117');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
function drawText(t,x,y,s,c,a){ctx.fillStyle=c||'#fff';ctx.font=`bold ${s}px 'Microsoft YaHei',sans-serif`;ctx.textAlign=a||'center';ctx.textBaseline='middle';ctx.fillText(t,x,y)}

class Particle{
    constructor(x,y,c){this.x=x;this.y=y;this.vx=(Math.random()-0.5)*4;this.vy=(Math.random()-0.5)*4;this.life=1;this.color=c;this.size=Math.random()*4+2}
    update(){this.x+=this.vx;this.y+=this.vy;this.life-=0.015}
    draw(){ctx.globalAlpha=this.life;ctx.fillStyle=this.color;ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}
}
function spawnP(x,y,n,c){for(let i=0;i<n;i++)particles.push(new Particle(x,y,c))}

function loadLevel(){
    if(level>=LEVELS.length){gameState='win';return}
    const l=LEVELS[level];
    targetPoem=l.poem;
    grid=generateGrid(l.poem);
    selectedCells=[];foundPoem='';
}

function drawMenu(){
    drawBg();
    drawText('诗词九宫格',W/2,H*0.22,Math.min(W*0.08,44),'#e8d5b7');
    drawText('九宫格中藏诗句',W/2,H*0.32,Math.min(W*0.035,18),'#8b7355');
    const bw=Math.min(W*0.4,200),bh=50,bx=W/2-bw/2,by=H*0.48;
    ctx.fillStyle='#6b5b4f';ctx.beginPath();ctx.roundRect(bx,by,bw,bh,12);ctx.fill();
    drawText('开始游戏',W/2,by+bh/2,20,'#fff');
    drawText(`最高分: ${highScore}`,W/2,H*0.62,16,'#8b7355');
    drawText('50关 | 连线读出诗句',W/2,H*0.72,14,'#5a4a3a');
}

function drawGame(){
    drawBg();
    drawText(`第 ${level+1}/${LEVELS.length} 关`,W/2,30,16,'#8b7355');
    drawText(`得分: ${score}`,W/2,55,16,'#e8d5b7');
    // 提示
    const l=LEVELS[level];
    drawText(l.hint,W/2,85,14,'#6b5b4f');
    drawText(`找出 ${targetPoem.length} 个字的诗句`,W/2,108,14,'#8b7355');
    // 九宫格
    const cellSize=Math.min(W*0.22,H*0.12,80);
    const gridSize=cellSize*3+12;
    const gx=W/2-gridSize/2,gy=130;
    for(let r=0;r<3;r++){
        for(let c=0;c<3;c++){
            const idx=r*3+c;
            const cx=gx+c*(cellSize+6),cy=gy+r*(cellSize+6);
            const isSelected=selectedCells.includes(idx);
            ctx.fillStyle=isSelected?'rgba(107,91,79,0.5)':'rgba(255,255,255,0.08)';
            ctx.beginPath();ctx.roundRect(cx,cy,cellSize,cellSize,12);ctx.fill();
            ctx.strokeStyle=isSelected?'#e8d5b7':'#3a3a4a';ctx.lineWidth=2;
            ctx.beginPath();ctx.roundRect(cx,cy,cellSize,cellSize,12);ctx.stroke();
            drawText(grid[idx]||'',cx+cellSize/2,cy+cellSize/2,Math.min(cellSize*0.5,32),isSelected?'#ffd700':'#fff');
        }
    }
    // 已选
    const selectedText=selectedCells.map(i=>grid[i]).join('');
    drawText(`已选: ${selectedText}`,W/2,gy+gridSize+30,18,'#e8d5b7');
    // 进度条
    const pw=Math.min(W*0.6,250),px=W/2-pw/2,py=gy+gridSize+55;
    ctx.fillStyle='rgba(255,255,255,0.1)';ctx.fillRect(px,py,pw,10);
    ctx.fillStyle='#6b5b4f';ctx.fillRect(px,py,pw*(selectedText.length/targetPoem.length),10);
    // 按钮
    const btnY=py+30,btnW=80,btnH=36;
    ctx.fillStyle='#555';ctx.beginPath();ctx.roundRect(W/2-btnW-10,btnY,btnW,btnH,8);ctx.fill();
    drawText('清除',W/2-btnW/2-10,btnY+btnH/2,14,'#fff');
    ctx.fillStyle='#6b5b4f';ctx.beginPath();ctx.roundRect(W/2+10,btnY,btnW,btnH,8);ctx.fill();
    drawText('确认',W/2+btnW/2+10,btnY+btnH/2,14,'#fff');
    // 消息
    if(msgTimer>0){drawText(message,W/2,H*0.88,16,message.includes('✅')?'#4caf50':'#ff6b6b');msgTimer--}
}

function drawEnd(){
    drawBg();
    const isWin=gameState==='win';
    drawText(isWin?'🎉 全部通关！':'诗词九宫格',W/2,H*0.28,Math.min(W*0.07,36),isWin?'#ffd700':'#e8d5b7');
    drawText(`得分: ${score}`,W/2,H*0.42,24,'#fff');
    drawText(`通过: ${level} 关`,W/2,H*0.5,18,'#8b7355');
    const bw=Math.min(W*0.4,200),bh=50,bx=W/2-bw/2,by=H*0.62;
    ctx.fillStyle='#6b5b4f';ctx.beginPath();ctx.roundRect(bx,by,bw,bh,12);ctx.fill();
    drawText('再来一局',W/2,by+bh/2,20,'#fff');
}

function startGame(){gameState='playing';score=0;level=0;loadLevel()}

addEventListener('click',e=>{
    const x=e.clientX,y=e.clientY;
    if(gameState==='menu'){
        const bw=Math.min(W*0.4,200),bh=50,bx=W/2-bw/2,by=H*0.48;
        if(x>=bx&&x<=bx+bw&&y>=by&&y<=by+bh)startGame();
    }else if(gameState==='playing'){
        const cellSize=Math.min(W*0.22,H*0.12,80);
        const gridSize=cellSize*3+12;
        const gx=W/2-gridSize/2,gy=130;
        // 九宫格点击
        for(let r=0;r<3;r++){
            for(let c=0;c<3;c++){
                const idx=r*3+c;
                const cx=gx+c*(cellSize+6),cy=gy+r*(cellSize+6);
                if(x>=cx&&x<=cx+cellSize&&y>=cy&&y<=cy+cellSize){
                    if(selectedCells.includes(idx))selectedCells=selectedCells.filter(i=>i!==idx);
                    else if(selectedCells.length<targetPoem.length)selectedCells.push(idx);
                }
            }
        }
        // 按钮
        const btnY=gy+gridSize+85,btnW=80,btnH=36;
        if(y>=btnY&&y<=btnY+btnH){
            if(x>=W/2-btnW-10&&x<=W/2-10){selectedCells=[]} // 清除
            if(x>=W/2+10&&x<=W/2+btnW+10){ // 确认
                const text=selectedCells.map(i=>grid[i]).join('');
                if(text===targetPoem){
                    score+=10;level++;message='✅ 正确！';msgTimer=60;
                    spawnP(W/2,H/2,25,'#ffd700');
                    if(score>highScore){highScore=score;localStorage.setItem('poem9_hi',highScore)}
                    setTimeout(()=>{if(gameState==='playing')loadLevel()},600);
                }else{message='❌ 不对哦，再想想';msgTimer=60;selectedCells=[]}
            }
        }
    }else if(gameState==='win'||gameState==='gameover'){
        const bw=Math.min(W*0.4,200),bh=50,bx=W/2-bw/2,by=H*0.62;
        if(x>=bx&&x<=bx+bw&&y>=by&&y<=by+bh)startGame();
    }
});

addEventListener('keydown',e=>{
    if(e.key==='Enter'){if(gameState==='menu')startGame();else if(gameState==='win')startGame()}
    if(e.key==='Escape'&&gameState==='playing')selectedCells=[];
});

function loop(){
    if(gameState==='menu')drawMenu();
    else if(gameState==='playing')drawGame();
    else drawEnd();
    particles.forEach(p=>{p.update();p.draw()});particles=particles.filter(p=>p.life>0);
    requestAnimationFrame(loop);
}
loop();

(function(){
  if (window.__touchBridgeInstalled) return;
  window.__touchBridgeInstalled = true;
  function dispatchMouseLike(type, touch) {
    var target = document.elementFromPoint(touch.clientX, touch.clientY) || document.querySelector('canvas');
    if (!target) return;
    target.dispatchEvent(new MouseEvent(type, {
      bubbles: true,
      cancelable: true,
      clientX: touch.clientX,
      clientY: touch.clientY,
      screenX: touch.screenX,
      screenY: touch.screenY,
      button: 0
    }));
  }
  document.addEventListener('touchstart', function(e) {
    if (!e.touches || !e.touches.length) return;
    e.preventDefault();
    dispatchMouseLike('mousedown', e.touches[0]);
    dispatchMouseLike('click', e.touches[0]);
  }, { passive: false });
  document.addEventListener('touchmove', function(e) {
    if (!e.touches || !e.touches.length) return;
    e.preventDefault();
    dispatchMouseLike('mousemove', e.touches[0]);
  }, { passive: false });
  document.addEventListener('touchend', function(e) {
    var touch = e.changedTouches && e.changedTouches[0];
    if (!touch) return;
    e.preventDefault();
    dispatchMouseLike('mouseup', touch);
  }, { passive: false });
})();

        // 音效支持

            osc.connect(gain);

        c.width = pw;
