<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>古诗拼图</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; font-family: 'Microsoft YaHei', sans-serif; }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    </style>

<style>
/* 游戏工坊广告系统 */
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);height:90px;max-height:90px;overflow:hidden;contain:layout style paint;pointer-events:none!important}.ad-banner-container,.ad-banner-container *{pointer-events:none!important}.ad-banner-container iframe{max-height:90px;pointer-events:none!important}
.ad-banner-container iframe{max-width:100%}
.ad-label{position:absolute;top:1px;right:6px;font:9px "Microsoft YaHei",sans-serif;color:rgba(255,255,255,.35)}
.sponsor-btn{position:fixed;top:44px;right:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:3px 9px;border-radius:10px;font:11px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .qr-row{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.sponsor-panel .qr-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px;text-align:center;min-width:140px}
.sponsor-panel .qr-card .qr-icon{font-size:48px;margin-bottom:6px}
.sponsor-panel .qr-card .qr-label{color:#ccc;font:13px "Microsoft YaHei",sans-serif}
.sponsor-panel .qr-card .qr-hint{color:#888;font:11px "Microsoft YaHei",sans-serif;margin-top:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.interstitial-ad .ad-content{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;text-align:center;min-width:280px;max-width:400px}
.interstitial-ad .ad-content p{color:#aaa;font:14px "Microsoft YaHei",sans-serif;margin-bottom:12px}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
</style>
</head>
<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

<canvas id="cv"></canvas>

  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script>
// ===== 古诗拼图游戏 =====
// 打乱经典古诗句顺序，拖拽拼回原诗，计时挑战，内置50+古诗

// ===== Canvas Setup =====
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

function resizeCanvas() {
    cv.width = window.innerWidth;
    cv.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ===== 常量定义 =====
const SAVE_KEY = 'poemPuzzle_best';
const POEMS_DATA = [
    // 五言绝句 (4句)
    { title: '静夜思', author: '李白', lines: ['床前明月光','疑是地上霜','举头望明月','低头思故乡'] },
    { title: '春晓', author: '孟浩然', lines: ['春眠不觉晓','处处闻啼鸟','夜来风雨声','花落知多少'] },
    { title: '登鹳雀楼', author: '王之涣', lines: ['白日依山尽','黄河入海流','欲穷千里目','更上一层楼'] },
    { title: '相思', author: '王维', lines: ['红豆生南国','春来发几枝','愿君多采撷','此物最相思'] },
    { title: '江雪', author: '柳宗元', lines: ['千山鸟飞绝','万径人踪灭','孤舟蓑笠翁','独钓寒江雪'] },
    { title: '夜宿山寺', author: '李白', lines: ['危楼高百尺','手可摘星辰','不敢高声语','恐惊天上人'] },
    { title: '悯农(一)', author: '李绅', lines: ['春种一粒粟','秋收万颗子','四海无闲田','农夫犹饿死'] },
    { title: '悯农(二)', author: '李绅', lines: ['锄禾日当午','汗滴禾下土','谁知盘中餐','粒粒皆辛苦'] },
    { title: '寻隐者不遇', author: '贾岛', lines: ['松下问童子','言师采药去','只在此山中','云深不知处'] },
    { title: '独坐敬亭山', author: '李白', lines: ['众鸟高飞尽','孤云独去闲','相看两不厌','只有敬亭山'] },
    { title: '鹿柴', author: '王维', lines: ['空山不见人','但闻人语响','返景入深林','复照青苔上'] },
    { title: '竹里馆', author: '王维', lines: ['独坐幽篁里','弹琴复长啸','深林人不知','明月来相照'] },
    { title: '送别', author: '王维', lines: ['山中相送罢','日暮掩柴扉','春草明年绿','王孙归不归'] },
    { title: '问刘十九', author: '白居易', lines: ['绿蚁新醅酒','红泥小火炉','晚来天欲雪','能饮一杯无'] },
    { title: '池上', author: '白居易', lines: ['小娃撑小艇','偷采白莲回','不解藏踪迹','浮萍一道开'] },
    { title: '风', author: '李峤', lines: ['解落三秋叶','能开二月花','过江千尺浪','入竹万竿斜'] },
    { title: '山中', author: '王维', lines: ['荆溪白石出','天寒红叶稀','山路元无雨','空翠湿人衣'] },
    { title: '秋浦歌', author: '李白', lines: ['白发三千丈','缘愁似个长','不知明镜里','何处得秋霜'] },
    { title: '渡汉江', author: '宋之问', lines: ['岭外音书断','经冬复历春','近乡情更怯','不敢问来人'] },
    { title: '乐游原', author: '李商隐', lines: ['向晚意不适','驱车登古原','夕阳无限好','只是近黄昏'] },
    { title: '塞下曲', author: '卢纶', lines: ['月黑雁飞高','单于夜遁逃','欲将轻骑逐','大雪满弓刀'] },
    { title: '逢雪宿芙蓉山主人', author: '刘长卿', lines: ['日暮苍山远','天寒白屋贫','柴门闻犬吠','风雪夜归人'] },
    { title: '绝句', author: '杜甫', lines: ['迟日江山丽','春风花草香','泥融飞燕子','沙暖睡鸳鸯'] },
    { title: '马诗', author: '李贺', lines: ['大漠沙如雪','燕山月似钩','何当金络脑','快走踏清秋'] },
    { title: '夏日绝句', author: '李清照', lines: ['生当作人杰','死亦为鬼雄','至今思项羽','不肯过江东'] },
    // 七言绝句 (4句)
    { title: '早发白帝城', author: '李白', lines: ['朝辞白帝彩云间','千里江陵一日还','两岸猿声啼不住','轻舟已过万重山'] },
    { title: '望庐山瀑布', author: '李白', lines: ['日照香炉生紫烟','遥看瀑布挂前川','飞流直下三千尺','疑是银河落九天'] },
    { title: '黄鹤楼送孟浩然之广陵', author: '李白', lines: ['故人西辞黄鹤楼','烟花三月下扬州','孤帆远影碧空尽','唯见长江天际流'] },
    { title: '望天门山', author: '李白', lines: ['天门中断楚江开','碧水东流至此回','两岸青山相对出','孤帆一片日边来'] },
    { title: '别董大', author: '高适', lines: ['千里黄云白日曛','北风吹雁雪纷纷','莫愁前路无知己','天下谁人不识君'] },
    { title: '出塞', author: '王昌龄', lines: ['秦时明月汉时关','万里长征人未还','但使龙城飞将在','不教胡马度阴山'] },
    { title: '枫桥夜泊', author: '张继', lines: ['月落乌啼霜满天','江枫渔火对愁眠','姑苏城外寒山寺','夜半钟声到客船'] },
    { title: '清明', author: '杜牧', lines: ['清明时节雨纷纷','路上行人欲断魂','借问酒家何处有','牧童遥指杏花村'] },
    { title: '山行', author: '杜牧', lines: ['远上寒山石径斜','白云深处有人家','停车坐爱枫林晚','霜叶红于二月花'] },
    { title: '江南春', author: '杜牧', lines: ['千里莺啼绿映红','水村山郭酒旗风','南朝四百八十寺','多少楼台烟雨中'] },
    { title: '回乡偶书', author: '贺知章', lines: ['少小离家老大回','乡音无改鬓毛衰','儿童相见不相识','笑问客从何处来'] },
    { title: '咏柳', author: '贺知章', lines: ['碧玉妆成一树高','万条垂下绿丝绦','不知细叶谁裁出','二月春风似剪刀'] },
    { title: '凉州词', author: '王翰', lines: ['葡萄美酒夜光杯','欲饮琵琶马上催','醉卧沙场君莫笑','古来征战几人回'] },
    { title: '赠汪伦', author: '李白', lines: ['李白乘舟将欲行','忽闻岸上踏歌声','桃花潭水深千尺','不及汪伦送我情'] },
    { title: '九月九日忆山东兄弟', author: '王维', lines: ['独在异乡为异客','每逢佳节倍思亲','遥知兄弟登高处','遍插茱萸少一人'] },
    { title: '题西林壁', author: '苏轼', lines: ['横看成岭侧成峰','远近高低各不同','不识庐山真面目','只缘身在此山中'] },
    { title: '饮湖上初晴后雨', author: '苏轼', lines: ['水光潋滟晴方好','山色空蒙雨亦奇','欲把西湖比西子','淡妆浓抹总相宜'] },
    { title: '示儿', author: '陆游', lines: ['死去元知万事空','但悲不见九州同','王师北定中原日','家祭无忘告乃翁'] },
    { title: '秋夜将晓出篱门迎凉有感', author: '陆游', lines: ['三万里河东入海','五千仞岳上摩天','遗民泪尽胡尘里','南望王师又一年'] },
    { title: '春日', author: '朱熹', lines: ['胜日寻芳泗水滨','无边光景一时新','等闲识得东风面','万紫千红总是春'] },
    { title: '游园不值', author: '叶绍翁', lines: ['应怜屐齿印苍苔','小扣柴扉久不开','春色满园关不住','一枝红杏出墙来'] },
    { title: '泊船瓜洲', author: '王安石', lines: ['京口瓜洲一水间','钟山只隔数重山','春风又绿江南岸','明月何时照我还'] },
    { title: '元日', author: '王安石', lines: ['爆竹声中一岁除','春风送暖入屠苏','千门万户曈曈日','总把新桃换旧符'] },
    { title: '小池', author: '杨万里', lines: ['泉眼无声惜细流','树阴照水爱晴柔','小荷才露尖尖角','早有蜻蜓立上头'] },
    { title: '晓出净慈寺送林子方', author: '杨万里', lines: ['毕竟西湖六月中','风光不与四时同','接天莲叶无穷碧','映日荷花别样红'] },
    { title: '凉州词', author: '王之涣', lines: ['黄河远上白云间','一片孤城万仞山','羌笛何须怨杨柳','春风不度玉门关'] },
    { title: '芙蓉楼送辛渐', author: '王昌龄', lines: ['寒雨连江夜入吴','平明送客楚山孤','洛阳亲友如相问','一片冰心在玉壶'] },
    { title: '从军行', author: '王昌龄', lines: ['青海长云暗雪山','孤城遥望玉门关','黄沙百战穿金甲','不破楼兰终不还'] },
    { title: '竹枝词', author: '刘禹锡', lines: ['杨柳青青江水平','闻郎江上踏歌声','东边日出西边雨','道是无晴却有晴'] },
    { title: '乌衣巷', author: '刘禹锡', lines: ['朱雀桥边野草花','乌衣巷口夕阳斜','旧时王谢堂前燕','飞入寻常百姓家'] },
    { title: '望洞庭', author: '刘禹锡', lines: ['湖光秋月两相和','潭面无风镜未磨','遥望洞庭山水翠','白银盘里一青螺'] },
    { title: '江南逢李龟年', author: '杜甫', lines: ['岐王宅里寻常见','崔九堂前几度闻','正是江南好风景','落花时节又逢君'] },
    { title: '绝句', author: '杜甫', lines: ['两个黄鹂鸣翠柳','一行白鹭上青天','窗含西岭千秋雪','门泊东吴万里船'] },
    { title: '江畔独步寻花', author: '杜甫', lines: ['黄四娘家花满蹊','千朵万朵压枝低','留连戏蝶时时舞','自在娇莺恰恰啼'] },
    { title: '浪淘沙', author: '刘禹锡', lines: ['九曲黄河万里沙','浪淘风簸自天涯','如今直上银河去','同到牵牛织女家'] },
    { title: '蜂', author: '罗隐', lines: ['不论平地与山尖','无限风光尽被占','采得百花成蜜后','为谁辛苦为谁甜'] },
    { title: '己亥杂诗', author: '龚自珍', lines: ['浩荡离愁白日斜','吟鞭东指即天涯','落红不是无情物','化作春泥更护花'] },
    { title: '夜雨寄北', author: '李商隐', lines: ['君问归期未有期','巴山夜雨涨秋池','何当共剪西窗烛','却话巴山夜雨时'] },
    { title: '嫦娥', author: '李商隐', lines: ['云母屏风烛影深','长河渐落晓星沉','嫦娥应悔偷灵药','碧海青天夜夜心'] },
    { title: '赤壁', author: '杜牧', lines: ['折戟沉沙铁未销','自将磨洗认前朝','东风不与周郎便','铜雀春深锁二乔'] },
    { title: '秋夕', author: '杜牧', lines: ['银烛秋光冷画屏','轻罗小扇扑流萤','天阶夜色凉如水','卧看牵牛织女星'] },
    { title: '过华清宫', author: '杜牧', lines: ['长安回望绣成堆','山顶千门次第开','一骑红尘妃子笑','无人知是荔枝来'] },
    { title: '泊秦淮', author: '杜牧', lines: ['烟笼寒水月笼沙','夜泊秦淮近酒家','商女不知亡国恨','隔江犹唱后庭花'] },
    { title: '滁州西涧', author: '韦应物', lines: ['独怜幽草涧边生','上有黄鹂深树鸣','春潮带雨晚来急','野渡无人舟自横'] },
    { title: '约客', author: '赵师秀', lines: ['黄梅时节家家雨','青草池塘处处蛙','有约不来过夜半','闲敲棋子落灯花'] },
    { title: '三衢道中', author: '曾几', lines: ['梅子黄时日日晴','小溪泛尽却山行','绿阴不减来时路','添得黄鹂四五声'] },
    { title: '惠崇春江晚景', author: '苏轼', lines: ['竹外桃花三两枝','春江水暖鸭先知','蒌蒿满地芦芽短','正是河豚欲上时'] },
    { title: '墨梅', author: '王冕', lines: ['吾家洗砚池头树','个个花开淡墨痕','不要人夸好颜色','只流清气满乾坤'] },
    { title: '石灰吟', author: '于谦', lines: ['千锤万凿出深山','烈火焚烧若等闲','粉身碎骨浑不怕','要留清白在人间'] },
    { title: '竹石', author: '郑燮', lines: ['咬定青山不放松','立根原在破岩中','千磨万击还坚劲','任尔东西南北风'] },
    { title: '己亥杂诗', author: '龚自珍', lines: ['九州生气恃风雷','万马齐喑究可哀','我劝天公重抖擞','不拘一格降人才'] },
    { title: '村居', author: '高鼎', lines: ['草长莺飞二月天','拂堤杨柳醉春烟','儿童散学归来早','忙趁东风放纸鸢'] },
    { title: '所见', author: '袁枚', lines: ['牧童骑黄牛','歌声振林樾','意欲捕鸣蝉','忽然闭口立'] },
    { title: '舟夜书所见', author: '查慎行', lines: ['月黑见渔灯','孤光一点萤','微微风簇浪','散作满河星'] },
    { title: '春夜喜雨', author: '杜甫', lines: ['好雨知时节','当春乃发生','随风潜入夜','润物细无声','野径云俱黑','江船火独明','晓看红湿处','花重锦官城'] },
    { title: '游子吟', author: '孟郊', lines: ['慈母手中线','游子身上衣','临行密密缝','意恐迟迟归','谁言寸草心','报得三春晖'] },
    { title: '赋得古原草送别', author: '白居易', lines: ['离离原上草','一岁一枯荣','野火烧不尽','春风吹又生','远芳侵古道','晴翠接荒城','又送王孙去','萋萋满别情'] },

// ===== 难度配置 =====
const DIFFICULTY = {
    easy: { name: '简单', lineCount: 4, timeBonus: 60, scoreMultiplier: 1 },
    medium: { name: '中等', lineCount: 6, timeBonus: 90, scoreMultiplier: 1.5 },
    hard: { name: '困难', lineCount: 8, timeBonus: 120, scoreMultiplier: 2 }
};

// ===== 游戏状态 =====
var G = {
    state: 'menu', // menu, playing, complete, gameover
    difficulty: 'easy',
    currentPoem: null,
    shuffledLines: [],
    selectedSlot: -1,
    slots: [],
    draggedLine: null,
    dragX: 0,
    dragY: 0,
    dragOffsetX: 0,
    dragOffsetY: 0,
    isDragging: false,
    clickedLine: -1,
    dragStartX: 0, dragStartY: 0,
    timeLeft: 0,
    timer: 0,
    score: 0,
    combo: 0,
    maxCombo: 0,
    correctCount: 0,
    totalCount: 0,
    level: 1,
    poemsCompleted: 0,
    bestScore: 0,
    particles: [],
    stars: [],
    shakeTimer: 0,
    shakeIntensity: 0,
    flashTimer: 0,
    flashColor: '',
    menuButtons: [],
    difficultyButtons: [],
    gameButtons: [],
    lastTime: 0,
    deltaTime: 0
};

// ===== 加载最高分 =====
function loadBestScore() {
    try {
        var saved = localStorage.getItem(SAVE_KEY);
        G.bestScore = saved ? parseInt(saved) : 0;
    } catch(e) {
        G.bestScore = 0;
    }
}

function saveBestScore() {
    try {
        localStorage.setItem(SAVE_KEY, G.bestScore.toString());
    } catch(e) {}
}

// ===== 工具函数 =====
function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
}

function distance(x1, y1, x2, y2) {
    return Math.sqrt((x2-x1)*(x2-x1) + (y2-y1)*(y2-y1));
}

function lerp(a, b, t) { return a + (b - a) * t; }

function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

function pointInRect(px, py, x, y, w, h) {
    return px >= x && px <= x + w && py >= y && py <= y + h;
}

// ===== 粒子系统 =====
function createParticle(x, y, color, type) {
    var angle = Math.random() * Math.PI * 2;
    var speed = type === 'burst' ? 2 + Math.random() * 4 : 1 + Math.random() * 2;
    return {
        x: x, y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - (type === 'rise' ? 2 : 0),
        life: 1.0,
        decay: 0.01 + Math.random() * 0.02,
        size: type === 'burst' ? 3 + Math.random() * 4 : 2 + Math.random() * 3,
        color: color,
        type: type
    };
}

function updateParticles() {
    for (var i = G.particles.length - 1; i >= 0; i--) {
        var p = G.particles[i];
        p.x += p.vx;
        p.y += p.vy;
        if (p.type === 'rise') p.vy += 0.02;
        if (p.type === 'burst') { p.vx *= 0.98; p.vy *= 0.98; }
        p.life -= p.decay;
        if (p.life <= 0) G.particles.splice(i, 1);
    }
}

function drawParticles() {
    for (var i = 0; i < G.particles.length; i++) {
        var p = G.particles[i];
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

function spawnBurst(x, y, color, count) {
    for (var i = 0; i < (count || 20); i++) {
        G.particles.push(createParticle(x, y, color, 'burst'));
    }
}

function spawnConfetti(x, y, count) {
    var colors = ['#FFD700','#FF6B6B','#4ECDC4','#45B7D1','#96CEB4','#FFEAA7','#DDA0DD','#98D8C8'];
    for (var i = 0; i < (count || 30); i++) {
        G.particles.push(createParticle(x, y, colors[i % colors.length], 'burst'));
    }
}

// ===== 星空背景 =====
function initStars() {
    G.stars = [];
    for (var i = 0; i < 80; i++) {
        G.stars.push({
            x: Math.random() * cv.width,
            y: Math.random() * cv.height,
            size: 0.5 + Math.random() * 2,
            twinkle: Math.random() * Math.PI * 2,
            speed: 0.5 + Math.random() * 1.5
        });
    }
}

function updateStars() {
    for (var i = 0; i < G.stars.length; i++) {
        G.stars[i].twinkle += 0.02 * G.stars[i].speed;
    }
}

function drawStars() {
    for (var i = 0; i < G.stars.length; i++) {
        var s = G.stars[i];
        var alpha = 0.3 + 0.4 * Math.sin(s.twinkle);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

// ===== 绘制渐变背景 =====
function drawBackground() {
    var grad = ctx.createLinearGradient(0, 0, 0, cv.height);
    grad.addColorStop(0, '#0a0a2e');
    grad.addColorStop(0.5, '#1a1a4e');
    grad.addColorStop(1, '#0d0d3d');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, cv.width, cv.height);
    drawStars();
}

// ===== 按钮绘制 =====
function drawButton(x, y, w, h, text, hovered, fontSize) {
    var fs = fontSize || Math.min(24, cv.width * 0.04);
    ctx.save();
    // 阴影
    ctx.shadowColor = hovered ? '#FFD700' : 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = hovered ? 20 : 10;
    ctx.shadowOffsetY = 3;
    // 背景
    var grad = ctx.createLinearGradient(x, y, x, y + h);
    if (hovered) {
        grad.addColorStop(0, '#FFD700');
        grad.addColorStop(1, '#FFA500');
    } else {
        grad.addColorStop(0, '#2a2a6a');
        grad.addColorStop(1, '#1a1a4a');
    }
    ctx.fillStyle = grad;
    roundRect(ctx, x, y, w, h, 12);
    ctx.fill();
    // 边框
    ctx.shadowBlur = 0;
    ctx.strokeStyle = hovered ? '#FFD700' : '#4a4a8a';
    ctx.lineWidth = 2;
    roundRect(ctx, x, y, w, h, 12);
    ctx.stroke();
    // 文字
    ctx.fillStyle = hovered ? '#1a1a2e' : '#e0e0ff';
    ctx.font = 'bold ' + fs + 'px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + w/2, y + h/2);
    ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

// ===== 诗句方块绘制 =====
function drawLineBlock(x, y, w, h, text, state, fontSize) {
    var fs = fontSize || Math.min(22, cv.width * 0.035);
    ctx.save();
    // 背景
    var grad = ctx.createLinearGradient(x, y, x, y + h);
    if (state === 'correct') {
        grad.addColorStop(0, '#2d5a2d');
        grad.addColorStop(1, '#1a3a1a');
    } else if (state === 'wrong') {
        grad.addColorStop(0, '#5a2d2d');
        grad.addColorStop(1, '#3a1a1a');
    } else if (state === 'dragging') {
        grad.addColorStop(0, '#4a3a6a');
        grad.addColorStop(1, '#2a1a4a');
    } else if (state === 'selected') {
        grad.addColorStop(0, '#3a3a6a');
        grad.addColorStop(1, '#1a1a4a');
    } else {
        grad.addColorStop(0, '#2a2a5a');
        grad.addColorStop(1, '#1a1a3a');
    }
    ctx.fillStyle = grad;
    roundRect(ctx, x, y, w, h, 8);
    ctx.fill();
    // 边框
    if (state === 'correct') {
        ctx.strokeStyle = '#4CAF50';
        ctx.lineWidth = 2;
    } else if (state === 'wrong') {
        ctx.strokeStyle = '#f44336';
        ctx.lineWidth = 2;
    } else if (state === 'dragging') {
        ctx.strokeStyle = '#FFD700';
        ctx.lineWidth = 3;
    } else if (state === 'selected') {
        ctx.strokeStyle = '#7c7cff';
        ctx.lineWidth = 2;
    } else {
        ctx.strokeStyle = '#4a4a8a';
        ctx.lineWidth = 1;
    }
    roundRect(ctx, x, y, w, h, 8);
    ctx.stroke();
    // 文字
    ctx.fillStyle = state === 'correct' ? '#8AFF8A' : (state === 'wrong' ? '#FF8A8A' : '#d0d0ff');
    ctx.font = fs + 'px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + w/2, y + h/2);
    ctx.restore();
}

// ===== 游戏初始化 =====
function initGame(difficulty) {
    G.difficulty = difficulty || 'easy';
    G.state = 'playing';
    G.score = 0;
    G.combo = 0;
    G.maxCombo = 0;
    G.correctCount = 0;
    G.totalCount = 0;
    G.level = 1;
    G.poemsCompleted = 0;
    G.particles = [];
    G.shakeTimer = 0;
    G.flashTimer = 0;
    G.clickedLine = -1;
    G.selectedSlot = -1;
    G.isDragging = false;
    G.draggedLine = null;
    loadNewPoem();
}

function loadNewPoem() {
    var diff = DIFFICULTY[G.difficulty];
    // 过滤出符合行数要求的诗
    var candidates = POEMS_DATA.filter(function(p) { return p.lines.length >= diff.lineCount; });
    if (candidates.length === 0) candidates = POEMS_DATA;
    G.currentPoem = candidates[Math.floor(Math.random() * candidates.length)];
    // 取前lineCount行
    var lines = G.currentPoem.lines.slice(0, diff.lineCount);
    G.totalCount = lines.length;
    G.correctCount = 0;
    // 打乱
    G.shuffledLines = shuffle(lines);
    // 确保不是原序
    var attempts = 0;
    while (attempts < 10 && isOriginalOrder(G.shuffledLines, lines)) {
        G.shuffledLines = shuffle(lines);
        attempts++;
    }
    // 创建槽位
    G.slots = [];
    for (var i = 0; i < lines.length; i++) {
        G.slots.push({ text: '', placed: false, correct: false });
    }
    G.selectedSlot = -1;
    G.draggedLine = null;
    G.isDragging = false;
    // 计时
    G.timeLeft = diff.timeBonus + lines.length * 10;
    G.timer = 0;
}

function isOriginalOrder(arr1, arr2) {
    for (var i = 0; i < arr1.length; i++) {
        if (arr1[i] !== arr2[i]) return false;
    }
    return true;
}

// ===== 计分 =====
function addScore(base) {
    var diff = DIFFICULTY[G.difficulty];
    var comboBonus = G.combo > 1 ? G.combo * 0.2 : 0;
    var score = Math.floor(base * diff.scoreMultiplier * (1 + comboBonus));
    G.score += score;
    if (G.score > G.bestScore) {
        G.bestScore = G.score;
        saveBestScore();
    }
    return score;
}

// ===== 游戏逻辑 =====
function checkCompletion() {
    var allPlaced = true;
    var allCorrect = true;
    for (var i = 0; i < G.slots.length; i++) {
        if (!G.slots[i].placed) { allPlaced = false; break; }
        if (!G.slots[i].correct) { allCorrect = false; }
    }
    if (allPlaced && allCorrect) {
        // 诗句完成
        var bonus = addScore(100 + G.correctCount * 20);
        spawnConfetti(cv.width/2, cv.height/2, 50);
        G.flashTimer = 30;
        G.flashColor = '#FFD700';
        G.poemsCompleted++;
        G.level = Math.floor(G.poemsCompleted / 3) + 1;
        // 加载下一首
        setTimeout(function() {
            loadNewPoem();
        }, 1000);
    } else if (allPlaced && !allCorrect) {
        // 全放了但顺序错
        G.shakeTimer = 20;
        G.shakeIntensity = 5;
        G.combo = 0;
        // 标记错误的
        for (var i = 0; i < G.slots.length; i++) {
            if (!G.slots[i].correct) {
                G.slots[i].placed = false;
                // 把错误的诗句放回可用列表
                G.shuffledLines.push(G.slots[i].text);
                G.slots[i].text = '';
            }
        }
    }
}

// ===== 输入处理 =====
var input = { x: 0, y: 0, down: false, tapped: false };

function getEventPos(e) {
    var rect = cv.getBoundingClientRect();
    var scaleX = cv.width / rect.width;
    var scaleY = cv.height / rect.height;
    if (e.touches && e.touches.length > 0) {
        return {
            x: (e.touches[0].clientX - rect.left) * scaleX,
            y: (e.touches[0].clientY - rect.top) * scaleY
        };
    }
    return {
        x: (e.clientX - rect.left) * scaleX,
        y: (e.clientY - rect.top) * scaleY
    };
}

function getLayout() {
    var w = cv.width;
    var h = cv.height;
    var isPortrait = h > w;
    var lineCount = G.slots ? G.slots.length : 4;
    var blockH = Math.min(50, h * 0.07);
    var blockW = Math.min(350, w * 0.8);
    var gap = Math.min(10, h * 0.015);
    var startY = h * 0.15;
    // 可用诗句区域
    var availY = startY + (lineCount + 1) * (blockH + gap) + 20;
    var availBlockH = Math.min(45, h * 0.06);
    return {
        w: w, h: h, isPortrait: isPortrait,
        blockH: blockH, blockW: blockW, gap: gap,
        startY: startY, availY: availY, availBlockH: availBlockH,
        lineCount: lineCount
    };
}

function getSlotRect(index) {
    var L = getLayout();
    var x = (L.w - L.blockW) / 2;
    var y = L.startY + index * (L.blockH + L.gap);
    return { x: x, y: y, w: L.blockW, h: L.blockH };
}

function getAvailLineRect(index) {
    var L = getLayout();
    var totalAvail = G.shuffledLines.length;
    var cols = L.isPortrait ? 1 : Math.min(2, totalAvail);
    var colW = L.blockW;
    var x = (L.w - colW * cols - (cols-1) * 10) / 2 + (index % cols) * (colW + 10);
    var y = L.availY + Math.floor(index / cols) * (L.availBlockH + L.gap);
    return { x: x, y: y, w: colW, h: L.availBlockH };
}

function handlePointerDown(px, py) {
    input.x = px;
    input.y = py;
    input.down = true;
    input.tapped = true;

    if (G.state === 'menu') {
        handleMenuClick(px, py);
        return;
    }
    if (G.state === 'complete' || G.state === 'gameover') {
        handleEndClick(px, py);
        return;
    }
    if (G.state !== 'playing') return;

    // 检查点击可用诗句
    for (var i = 0; i < G.shuffledLines.length; i++) {
        var r = getAvailLineRect(i);
        if (pointInRect(px, py, r.x, r.y, r.w, r.h)) {
            G.draggedLine = { index: i, text: G.shuffledLines[i] };
            G.dragOffsetX = px - r.x;
            G.dragOffsetY = py - r.y;
            G.isDragging = true;
            G.clickedLine = i;  // 记录点击的行
            G.dragStartX = px; G.dragStartY = py;
            return;
        }
    }

    // 检查点击槽位（取出已放置的）
    for (var i = 0; i < G.slots.length; i++) {
        if (G.slots[i].placed) {
            var r = getSlotRect(i);
            if (pointInRect(px, py, r.x, r.y, r.w, r.h)) {
                // 取出
                G.shuffledLines.push(G.slots[i].text);
                G.slots[i].text = '';
                G.slots[i].placed = false;
                G.slots[i].correct = false;
                return;
            }
        }
    }

    // 检查点击空槽位 — 如果有选中的行，直接放置
    for (var i = 0; i < G.slots.length; i++) {
        if (!G.slots[i].placed) {
            var r = getSlotRect(i);
            if (pointInRect(px, py, r.x, r.y, r.w, r.h)) {
                if (G.clickedLine !== -1 && G.clickedLine < G.shuffledLines.length) {
                    // 有点击选中的行，直接放置
                    var li = G.clickedLine;
                    G.slots[i].text = G.shuffledLines[li];
                    G.slots[i].placed = true;
                    G.slots[i].correct = (G.shuffledLines[li] === G.currentPoem.lines[i]);
                    G.shuffledLines.splice(li, 1);
                    if (G.slots[i].correct) {
                        G.correctCount++; G.combo++;
                        if (G.combo > G.maxCombo) G.maxCombo = G.combo;
                        addScore(50);
                    } else { G.combo = 0; }
                    G.clickedLine = -1;
                    checkCompletion();
                }
                G.selectedSlot = i;
                return;
            }
        }
    }
    // 点击空白区域取消选择
    G.clickedLine = -1;
}

function handlePointerMove(px, py) {
    input.x = px;
    input.y = py;
}

function handlePointerUp(px, py) {
    input.down = false;

    if (G.state !== 'playing' || !G.isDragging || !G.draggedLine) {
        G.isDragging = false;
        G.draggedLine = null;
        return;
    }

    // 检查放到哪个槽位
    for (var i = 0; i < G.slots.length; i++) {
        if (!G.slots[i].placed) {
            var r = getSlotRect(i);
            if (pointInRect(px, py, r.x, r.y, r.w, r.h)) {
                // 放置
                G.slots[i].text = G.draggedLine.text;
                G.slots[i].placed = true;
                G.slots[i].correct = (G.draggedLine.text === G.currentPoem.lines[i]);
                G.shuffledLines.splice(G.draggedLine.index, 1);
                if (G.slots[i].correct) {
                    G.correctCount++;
                    G.combo++;
                    if (G.combo > G.maxCombo) G.maxCombo = G.combo;
                    addScore(50);
                    spawnBurst(r.x + r.w/2, r.y + r.h/2, '#4CAF50', 15);
                } else {
                    G.combo = 0;
                    spawnBurst(r.x + r.w/2, r.y + r.h/2, '#f44336', 10);
                    G.shakeTimer = 10;
                    G.shakeIntensity = 3;
                }
                checkCompletion();
                break;
            }
        }
    }

    G.isDragging = false;
    G.draggedLine = null;
}

// ===== 菜单处理 =====
function handleMenuClick(px, py) {
    for (var i = 0; i < G.menuButtons.length; i++) {
        var b = G.menuButtons[i];
        if (pointInRect(px, py, b.x, b.y, b.w, b.h)) {
            if (b.action === 'start') {
                G.state = 'difficulty';
            }
            return;
        }
    }
    for (var i = 0; i < G.difficultyButtons.length; i++) {
        var b = G.difficultyButtons[i];
        if (pointInRect(px, py, b.x, b.y, b.w, b.h)) {
            if (b.action === 'easy') initGame('easy');
            else if (b.action === 'medium') initGame('medium');
            else if (b.action === 'hard') initGame('hard');
            else if (b.action === 'back') G.state = 'menu';
            return;
        }
    }
}

function handleEndClick(px, py) {
    for (var i = 0; i < G.gameButtons.length; i++) {
        var b = G.gameButtons[i];
        if (pointInRect(px, py, b.x, b.y, b.w, b.h)) {
            if (b.action === 'restart') {
                initGame(G.difficulty);
            } else if (b.action === 'menu') {
                G.state = 'menu';
            }
            return;
        }
    }
}

// ===== 事件绑定 =====
cv.addEventListener('mousedown', function(e) {
    var pos = getEventPos(e);
    handlePointerDown(pos.x, pos.y);
});
cv.addEventListener('mousemove', function(e) {
    var pos = getEventPos(e);
    handlePointerMove(pos.x, pos.y);
});
cv.addEventListener('mouseup', function(e) {
    var pos = getEventPos(e);
    handlePointerUp(pos.x, pos.y);
});

cv.addEventListener('touchstart', function(e) {
    e.preventDefault();
    var pos = getEventPos(e);
    handlePointerDown(pos.x, pos.y);
}, { passive: false });
cv.addEventListener('touchmove', function(e) {
    e.preventDefault();
    var pos = getEventPos(e);
    handlePointerMove(pos.x, pos.y);
}, { passive: false });
cv.addEventListener('touchend', function(e) {
    e.preventDefault();
    var pos = getEventPos(e);
    handlePointerUp(pos.x, pos.y);
}, { passive: false });

// ===== 更新 =====
function update() {
    updateStars();
    updateParticles();

    if (G.shakeTimer > 0) G.shakeTimer--;
    if (G.flashTimer > 0) G.flashTimer--;

    if (G.state === 'playing') {
        G.timer++;
        if (G.timer >= 60) {
            G.timer = 0;
            G.timeLeft--;
            if (G.timeLeft <= 0) {
                G.state = 'gameover';
            }
        }
    }
}

// ===== 渲染 =====
function drawMenu() {
    var w = cv.width;
    var h = cv.height;
    var fs = Math.min(48, w * 0.08);

    // 标题
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold ' + fs + 'px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = '#FFD700';
    ctx.shadowBlur = 20;
    ctx.fillText('古诗拼图', w/2, h * 0.2);
    ctx.shadowBlur = 0;

    // 副标题
    var subFs = Math.min(20, w * 0.035);
    ctx.fillStyle = '#aaa';
    ctx.font = subFs + 'px "Microsoft YaHei", sans-serif';
    ctx.fillText('打乱经典古诗句，拖拽拼回原诗', w/2, h * 0.28);
    ctx.fillText('计时挑战，考考你的诗词功底！', w/2, h * 0.33);

    // 最高分
    if (G.bestScore > 0) {
        ctx.fillStyle = '#FFD700';
        ctx.font = Math.min(18, w * 0.03) + 'px "Microsoft YaHei", sans-serif';
        ctx.fillText('最高分: ' + G.bestScore, w/2, h * 0.4);
    }

    // 开始按钮
    var btnW = Math.min(200, w * 0.4);
    var btnH = Math.min(55, h * 0.08);
    var btnX = (w - btnW) / 2;
    var btnY = h * 0.5;
    var mx = input.x, my = input.y;
    var hovered = pointInRect(mx, my, btnX, btnY, btnW, btnH);
    drawButton(btnX, btnY, btnW, btnH, '开始游戏', hovered, Math.min(22, w * 0.04));
    G.menuButtons = [{ x: btnX, y: btnY, w: btnW, h: btnH, action: 'start' }];

    // 说明
    var infoFs = Math.min(16, w * 0.028);
    ctx.fillStyle = '#888';
    ctx.font = infoFs + 'px "Microsoft YaHei", sans-serif';
    ctx.fillText('拖拽诗句到正确位置，组成完整古诗', w/2, h * 0.7);
    ctx.fillText('内置 ' + POEMS_DATA.length + ' 首经典古诗', w/2, h * 0.75);
}

function drawDifficultySelect() {
    var w = cv.width;
    var h = cv.height;
    var fs = Math.min(36, w * 0.06);

    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold ' + fs + 'px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('选择难度', w/2, h * 0.15);

    G.difficultyButtons = [];
    var btnW = Math.min(220, w * 0.45);
    var btnH = Math.min(55, h * 0.08);
    var mx = input.x, my = input.y;
    var yStart = h * 0.3;
    var gap = btnH + 20;

    var diffs = ['easy', 'medium', 'hard'];
    var labels = ['简单 (4句)', '中等 (6句)', '困难 (8句)'];
    var descs = ['四句古诗，轻松入门', '六句古诗，经典挑战', '八句古诗，高手对决'];

    for (var i = 0; i < 3; i++) {
        var btnX = (w - btnW) / 2;
        var btnY = yStart + i * gap;
        var hovered = pointInRect(mx, my, btnX, btnY, btnW, btnH);
        drawButton(btnX, btnY, btnW, btnH, labels[i], hovered, Math.min(20, w * 0.035));
        G.difficultyButtons.push({ x: btnX, y: btnY, w: btnW, h: btnH, action: diffs[i] });

        // 描述
        ctx.fillStyle = '#888';
        ctx.font = Math.min(14, w * 0.025) + 'px "Microsoft YaHei", sans-serif';
        ctx.fillText(descs[i], w/2, btnY + btnH + 15);
    }

    // 返回按钮
    var backBtnW = Math.min(120, w * 0.25);
    var backBtnX = (w - backBtnW) / 2;
    var backBtnY = yStart + 3 * gap + 20;
    var hovered = pointInRect(mx, my, backBtnX, backBtnY, backBtnW, btnH);
    drawButton(backBtnX, backBtnY, backBtnW, btnH, '返回', hovered, Math.min(18, w * 0.03));
    G.difficultyButtons.push({ x: backBtnX, y: backBtnY, w: backBtnW, h: btnH, action: 'back' });
}

function drawPlaying() {
    var w = cv.width;
    var h = cv.height;
    var L = getLayout();

    // 震动效果
    if (G.shakeTimer > 0) {
        ctx.save();
        var sx = (Math.random() - 0.5) * G.shakeIntensity * 2;
        var sy = (Math.random() - 0.5) * G.shakeIntensity * 2;
        ctx.translate(sx, sy);
    }

    // 顶部信息栏
    var infoFs = Math.min(18, w * 0.03);
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold ' + infoFs + 'px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText('分数: ' + G.score, 20, 15);
    ctx.fillText('连击: ' + G.combo, 20, 15 + infoFs + 5);

    ctx.textAlign = 'right';
    ctx.fillStyle = G.timeLeft <= 10 ? '#f44336' : '#4ECDC4';
    ctx.fillText('时间: ' + G.timeLeft + 's', w - 20, 15);
    ctx.fillStyle = '#aaa';
    ctx.fillText('难度: ' + DIFFICULTY[G.difficulty].name, w - 20, 15 + infoFs + 5);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#888';
    ctx.fillText('已完成: ' + G.poemsCompleted + ' 首', w/2, 15);

    // 诗题信息
    if (G.currentPoem) {
        ctx.fillStyle = '#FFD700';
        ctx.font = 'bold ' + Math.min(20, w * 0.035) + 'px "Microsoft YaHei", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('《' + G.currentPoem.title + '》 - ' + G.currentPoem.author, w/2, L.startY - 30);
    }

    // 槽位
    for (var i = 0; i < G.slots.length; i++) {
        var r = getSlotRect(i);
        var state = 'empty';
        if (G.slots[i].placed) {
            state = G.slots[i].correct ? 'correct' : 'wrong';
        }
        drawLineBlock(r.x, r.y, r.w, r.h, G.slots[i].placed ? G.slots[i].text : ('第' + (i+1) + '句'), state);

        // 序号
        ctx.fillStyle = '#666';
        ctx.font = Math.min(14, w * 0.025) + 'px "Microsoft YaHei", sans-serif';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        ctx.fillText((i+1) + '.', r.x - 8, r.y + r.h/2);
    }

    // 可用诗句
    ctx.fillStyle = '#888';
    ctx.font = Math.min(16, w * 0.028) + 'px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('可选诗句:', w/2, L.availY - 20);

    for (var i = 0; i < G.shuffledLines.length; i++) {
        var r = getAvailLineRect(i);
        drawLineBlock(r.x, r.y, r.w, r.h, G.shuffledLines[i], 'normal');
    }

    // 拖拽中的诗句
    if (G.isDragging && G.draggedLine) {
        var dx = input.x - G.dragOffsetX;
        var dy = input.y - G.dragOffsetY;
        var r = getAvailLineRect(0);
        drawLineBlock(dx, dy, r.w, r.h, G.draggedLine.text, 'dragging');
    }

    // 闪光效果
    if (G.flashTimer > 0) {
        ctx.globalAlpha = G.flashTimer / 30 * 0.3;
        ctx.fillStyle = G.flashColor;
        ctx.fillRect(0, 0, w, h);
        ctx.globalAlpha = 1;
    }

    if (G.shakeTimer > 0) {
        ctx.restore();
    }

    // 操作提示
    ctx.fillStyle = '#666';
    ctx.font = Math.min(14, w * 0.025) + 'px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('拖拽诗句到上方槽位，点击槽位可取出', w/2, h - 20);
}

function drawGameOver() {
    var w = cv.width;
    var h = cv.height;
    var fs = Math.min(42, w * 0.07);

    // 半透明遮罩
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, w, h);

    ctx.fillStyle = '#f44336';
    ctx.font = 'bold ' + fs + 'px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('时间到！', w/2, h * 0.25);

    var infoFs = Math.min(22, w * 0.038);
    ctx.fillStyle = '#fff';
    ctx.font = infoFs + 'px "Microsoft YaHei", sans-serif';
    ctx.fillText('得分: ' + G.score, w/2, h * 0.38);
    ctx.fillText('完成: ' + G.poemsCompleted + ' 首', w/2, h * 0.45);
    ctx.fillText('最高连击: ' + G.maxCombo, w/2, h * 0.52);

    if (G.score >= G.bestScore && G.score > 0) {
        ctx.fillStyle = '#FFD700';
        ctx.font = 'bold ' + infoFs + 'px "Microsoft YaHei", sans-serif';
        ctx.fillText('新纪录！', w/2, h * 0.6);
    }

    G.gameButtons = [];
    var btnW = Math.min(180, w * 0.35);
    var btnH = Math.min(50, h * 0.07);
    var mx = input.x, my = input.y;

    var btnX = (w - btnW) / 2;
    var btnY = h * 0.7;
    var hovered = pointInRect(mx, my, btnX, btnY, btnW, btnH);
    drawButton(btnX, btnY, btnW, btnH, '再来一局', hovered);
    G.gameButtons.push({ x: btnX, y: btnY, w: btnW, h: btnH, action: 'restart' });

    btnY = h * 0.7 + btnH + 15;
    hovered = pointInRect(mx, my, btnX, btnY, btnW, btnH);
    drawButton(btnX, btnY, btnW, btnH, '返回菜单', hovered);
    G.gameButtons.push({ x: btnX, y: btnY, w: btnW, h: btnH, action: 'menu' });
}

function drawComplete() {
    // 同 gameOver 样式
    drawGameOver();
}

function render() {
    drawBackground();

    if (G.state === 'menu') {
        drawMenu();
    } else if (G.state === 'difficulty') {
        drawDifficultySelect();
    } else if (G.state === 'playing') {
        drawPlaying();
    } else if (G.state === 'gameover') {
        drawPlaying();
        drawGameOver();
    } else if (G.state === 'complete') {
        drawPlaying();
        drawComplete();
    }

    drawParticles();
}

// ===== 游戏循环 =====
function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
}

// ===== 初始化 =====
initStars();
loadBestScore();
gameLoop();

        function playSound(freq = 440, duration = 0.1) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }
