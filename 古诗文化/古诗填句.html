function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function drawBg(){
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#0d1117');g.addColorStop(0.5,'#161b22');g.addColorStop(1,'#0d1117');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
function drawText(t,x,y,s,c,a){ctx.fillStyle=c||'#fff';ctx.font=`bold ${s}px 'Microsoft YaHei',sans-serif`;ctx.textAlign=a||'center';ctx.textBaseline='middle';ctx.fillText(t,x,y)}

class Particle{
    constructor(x,y,c){this.x=x;this.y=y;this.vx=(Math.random()-0.5)*3;this.vy=(Math.random()-0.5)*3;this.life=1;this.color=c;this.size=Math.random()*3+1}
    update(){this.x+=this.vx;this.y+=this.vy;this.life-=0.02;this.vy+=0.05}
    draw(){ctx.globalAlpha=this.life;ctx.fillStyle=this.color;ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}
}
function spawnP(x,y,n,c){for(let i=0;i<n;i++)particles.push(new Particle(x,y,c))}

function nextQuestion(){
    if(level>=POEMS.length){gameState='win';return}
    const q=POEMS[level];
    currentQ={...q,opts:shuffle(q.opts)};
    selected=-1;feedback='';
}

    drawText('给上句，选下句',W/2,H*0.32,Math.min(W*0.035,18),'#8b7355');
    const bw=Math.min(W*0.4,200),bh=50,bx=W/2-bw/2,by=H*0.48;
    ctx.fillStyle='#6b5b4f';ctx.beginPath();ctx.roundRect(bx,by,bw,bh,12);ctx.fill();
    drawText('开始挑战',W/2,by+bh/2,20,'#fff');
    drawText(`最高分: ${highScore}`,W/2,H*0.62,16,'#8b7355');
    drawText('50首经典古诗 | 选择题',W/2,H*0.72,14,'#5a4a3a');
    drawText('点击按钮或按空格开始',W/2,H*0.85,12,'#aaa');
}

function drawGame(){
    drawBg();
    drawText(`第 ${level+1}/${POEMS.length} 题`,W/2,30,16,'#8b7355');
    drawText(`得分: ${score}  ❤️: ${'❤️'.repeat(lives)}`,W/2,55,16,'#e8d5b7');
    if(!currentQ)return;
    // 题目
    ctx.fillStyle='rgba(107,91,79,0.2)';ctx.beginPath();ctx.roundRect(W*0.08,80,W*0.84,100,16);ctx.fill();
    drawText(`【${currentQ.title}】${currentQ.author}`,W/2,105,14,'#8b7355');
    drawText(`"${currentQ.up}"`,W/2,145,Math.min(W*0.05,28),'#e8d5b7');
    drawText('⬇ 请选择下句 ⬇',W/2,195,14,'#6b5b4f');
    // 选项
    const optY=220,optH=55,optW=Math.min(W*0.75,380),optX=W/2-optW/2;
    currentQ.opts.forEach((opt,i)=>{
        const y=optY+i*(optH+12);
        let bg='rgba(107,91,79,0.15)';let border='#3a3a4a';
        if(selected===i){
            bg=opt===currentQ.down?'rgba(76,175,80,0.3)':'rgba(244,67,54,0.3)';
            border=opt===currentQ.down?'#4caf50':'#f44336';
        }else if(selected>=0&&opt===currentQ.down){
            bg='rgba(76,175,80,0.2)';border='#4caf50';
        }
        ctx.fillStyle=bg;ctx.beginPath();ctx.roundRect(optX,y,optW,optH,12);ctx.fill();
        ctx.strokeStyle=border;ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(optX,y,optW,optH,12);ctx.stroke();
        drawText(`${['A','B','C','D'][i]}. ${opt}`,W/2,y+optH/2,Math.min(W*0.03,16),'#fff');
    });
    if(fbTimer>0){drawText(feedback,W/2,H*0.88,18,feedback.includes('✅')?'#4caf50':'#f44336');fbTimer--}
}

function drawEnd(){
    drawBg();
    const isWin=gameState==='win';
    drawText(isWin?'🎉 全部答完！':'😢 游戏结束',W/2,H*0.28,Math.min(W*0.07,36),isWin?'#e8d5b7':'#ff6b6b');
    drawText(`得分: ${score}`,W/2,H*0.4,24,'#fff');
    drawText(`答对: ${level} 题`,W/2,H*0.48,18,'#aaa');
    if(score>highScore){highScore=score;localStorage.setItem('poem_hi',highScore);drawText('新纪录！',W/2,H*0.56,20,'#ffd700')}
    const bw=Math.min(W*0.4,200),bh=50,bx=W/2-bw/2,by=H*0.65;
    ctx.fillStyle='#6b5b4f';ctx.beginPath();ctx.roundRect(bx,by,bw,bh,12);ctx.fill();
    drawText('再来一局',W/2,by+bh/2,20,'#fff');
}

function startGame(){gameState='playing';score=0;level=0;lives=3;nextQuestion()}

addEventListener('click',e=>{
    const x=e.clientX,y=e.clientY;
    if(gameState==='menu'){
        const bw=Math.min(W*0.4,200),bh=50,bx=W/2-bw/2,by=H*0.48;
        if(x>=bx&&x<=bx+bw&&y>=by&&y<=by+bh)startGame();
    }else if(gameState==='playing'&&currentQ&&selected<0){
        const optY=220,optH=55,optW=Math.min(W*0.75,380),optX=W/2-optW/2;
        currentQ.opts.forEach((opt,i)=>{
            const oy=optY+i*(optH+12);
            if(x>=optX&&x<=optX+optW&&y>=oy&&y<=oy+optH){
                selected=i;
                if(opt===currentQ.down){score+=10;level++;feedback='✅ 正确！';spawnP(W/2,oy+optH/2,20,'#4caf50');fbTimer=60;setTimeout(()=>{if(gameState==='playing')nextQuestion()},800)}
                else{lives--;feedback='❌ 错误！';fbTimer=60;if(lives<=0)gameState='gameover';else{setTimeout(()=>{selected=-1;feedback=''},800)}}
            }
        });
    }else if(gameState==='win'||gameState==='gameover'){
        const bw=Math.min(W*0.4,200),bh=50,bx=W/2-bw/2,by=H*0.65;
        if(x>=bx&&x<=bx+bw&&y>=by&&y<=by+bh)startGame();
    }
});

addEventListener('keydown',e=>{
    if(gameState==='playing'&&currentQ&&selected<0){
        const idx={'a':0,'b':1,'c':2,'d':3}[e.key.toLowerCase()];
        if(idx!==undefined&&idx<currentQ.opts.length){
            selected=idx;
            const opt=currentQ.opts[idx];
            if(opt===currentQ.down){score+=10;level++;feedback='✅ 正确！';spawnP(W/2,H/2,20,'#4caf50');fbTimer=60;setTimeout(()=>{if(gameState==='playing')nextQuestion()},800)}
            else{lives--;feedback='❌ 错误！';fbTimer=60;if(lives<=0)gameState='gameover';else{setTimeout(()=>{selected=-1;feedback=''},800)}}
        }
    }else if(e.key==='Enter'){if(gameState==='menu')startGame();else if(gameState==='win'||gameState==='gameover')startGame()}
});

function loop(){
    if(gameState==='menu')drawMenu();
    else if(gameState==='playing')drawGame();
    else drawEnd();
    particles.forEach(p=>{p.update();p.draw()});particles=particles.filter(p=>p.life>0);
    requestAnimationFrame(loop);
}
loop();

  function dispatchMouseLike(type, touch) {
    var target = document.elementFromPoint(touch.clientX, touch.clientY) || document.querySelector('canvas');
    if (!target) return;
    target.dispatchEvent(new MouseEvent(type, {
      bubbles: true,
      cancelable: true,
      clientX: touch.clientX,
      clientY: touch.clientY,
      screenX: touch.screenX,
      screenY: touch.screenY,
      button: 0
    }));
  }
  document.addEventListener('touchstart', function(e) {
    if (!e.touches || !e.touches.length) return;
    e.preventDefault();
    dispatchMouseLike('mousedown', e.touches[0]);
    dispatchMouseLike('click', e.touches[0]);
  }, { passive: false });
  document.addEventListener('touchmove', function(e) {
    if (!e.touches || !e.touches.length) return;
    e.preventDefault();
    dispatchMouseLike('mousemove', e.touches[0]);
  }, { passive: false });
  document.addEventListener('touchend', function(e) {
    var touch = e.changedTouches && e.changedTouches[0];
    if (!touch) return;
    e.preventDefault();
    dispatchMouseLike('mouseup', touch);
  }, { passive: false });
})();
