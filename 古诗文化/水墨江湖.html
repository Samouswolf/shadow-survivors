<body>
<button id="start-game-btn" type="button" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:20px 40px;font-size:20px;background:#ff6b35;color:white;border:none;border-radius:12px;cursor:pointer;z-index:999;font-weight:bold;font-family:'Microsoft YaHei',sans-serif;">开始游戏</button>

            </div>

  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="../game_core.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const GAME_NAME = '水墨江湖';
        GameCore.init({ highScore: GAME_NAME });
        
        let level = 1;
        let score = 0;
        let gameRunning = false;
        let ink = 100;
        
        let player = { x: 50, y: 300, width: 30, height: 50, vx: 0, vy: 0 };
        let enemies = [];
        let inkTrails = [];
        let targets = [];
        
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            initLevel();
        }
        
        function initLevel() {
            player.x = 50;
            player.y = canvas.height / 2;
            player.vx = 0;
            player.vy = 0;
            ink = 100;
            
            enemies = [];
            inkTrails = [];
            targets = [];
            
            const enemyCount = 3 + level;
            for (let i = 0; i < enemyCount; i++) {
                enemies.push({
                    x: canvas.width - 100 - i * 100,
                    y: 50 + Math.random() * (canvas.height - 100),
                    width: 30,
                    height: 30,
                    vx: -1 - Math.random() * level,
                    inkLevel: 50
                });
            }
            
            targets.push({
                x: canvas.width - 80,
                y: canvas.height / 2,
                width: 40,
                height: 40,
                activated: false
            });
        }
        
        function drawInkLine(x1, y1, x2, y2) {
            if (ink <= 0) return;
            
            inkTrails.push({
                x1, y1, x2, y2,
                opacity: 1,
                width: 3 + Math.random() * 3
            });
            
            ink -= 0.5;
        }
        
        function updatePlayer() {
            player.x += player.vx;
            player.y += player.vy;
            player.vx *= 0.95;
            player.vy *= 0.95;
            
            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
            if (player.y < 0) player.y = 0;
            if (player.y > canvas.height - player.height) player.y = canvas.height - player.height;
        }
        
        function updateEnemies() {
            enemies = enemies.filter(enemy => {
                enemy.x += enemy.vx;
                
                // 检查墨汁轨迹碰撞
                inkTrails.forEach(trail => {
                    if (enemy.inkLevel > 0) {
                        const dist = pointToLineDistance(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2,
                            trail.x1, trail.y1, trail.x2, trail.y2);
                        
                        if (dist < 20) {
                            enemy.inkLevel -= 1;
                            trail.opacity -= 0.1;
                        }
                    }
                });
                
                if (enemy.inkLevel <= 0) {
                    score += 200;
                    return false;
                }
                
                return enemy.x > -50;
            });
            
            inkTrails = inkTrails.filter(t => t.opacity > 0);
            
            if (enemies.length === 0) {
                targets[0].activated = true;
            }
        }
        
        function pointToLineDistance(px, py, x1, y1, x2, y2) {
            const A = px - x1;
            const B = py - y1;
            const C = x2 - x1;
            const D = y2 - y1;
            
            const dot = A * C + B * D;
            const lenSq = C * C + D * D;
            let param = -1;
            
            if (lenSq !== 0) param = dot / lenSq;
            
            let xx, yy;
            
            if (param < 0) {
                xx = x1;
                yy = y1;
            } else if (param > 1) {
                xx = x2;
                yy = y2;
            } else {
                xx = x1 + param * C;
                yy = y1 + param * D;
            }
            
            const dx = px - xx;
            const dy = py - yy;
            return Math.sqrt(dx * dx + dy * dy);
        }
        
        function checkCollisions() {
            targets.forEach(target => {
                if (target.activated) {
                    if (player.x < target.x + target.width &&
                        player.x + player.width > target.x &&
                        player.y < target.y + target.height &&
                        player.y + player.height > target.y) {
                        level++;
                        score += level * 500;
                        initLevel();
                    }
                }
            });
            
            if (ink <= 0) {
                gameRunning = false;
                GameCore.hints.show('墨汁耗尽！游戏结束！\n分数: ' + score, 5000);
            }
            
            updateStats();
        }
        
        function draw() {
            ctx.fillStyle = '#f5f5f5';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 水墨纹理背景
            ctx.fillStyle = 'rgba(0,0,0,0.02)';
            for (let i = 0; i < 50; i++) {
                ctx.beginPath();
                ctx.arc(Math.random() * canvas.width, Math.random() * canvas.height, Math.random() * 50, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // 墨汁轨迹
            inkTrails.forEach(trail => {
                ctx.strokeStyle = `rgba(0,0,0,${trail.opacity})`;
                ctx.lineWidth = trail.width;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(trail.x1, trail.y1);
                ctx.lineTo(trail.x2, trail.y2);
                ctx.stroke();
            });
            
            // 敌人
            enemies.forEach(enemy => {
                ctx.fillStyle = `rgba(0,0,0,${enemy.inkLevel / 50})`;
                ctx.beginPath();
                ctx.arc(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, enemy.width / 2, 0, Math.PI * 2);
                ctx.fill();
                
                // 血条
                ctx.fillStyle = '#333';
                ctx.fillRect(enemy.x - 10, enemy.y - 20, 50, 5);
                ctx.fillStyle = '#8b0000';
                ctx.fillRect(enemy.x - 10, enemy.y - 20, 50 * (enemy.inkLevel / 50), 5);
            });
            
            // 目标
            targets.forEach(target => {
                ctx.strokeStyle = target.activated ? '#8b0000' : '#999';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(target.x, target.y);
                ctx.lineTo(target.x + target.width, target.y + target.height);
                ctx.moveTo(target.x + target.width, target.y);
                ctx.lineTo(target.x, target.y + target.height);
                ctx.stroke();
                
                if (target.activated) {
                    ctx.fillStyle = '#8b0000';
                    ctx.font = '24px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('🚪', target.x + target.width / 2, target.y + target.height / 2 + 8);
                }
            });
            
            // 玩家
            ctx.fillStyle = '#333';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            
            // 毛笔效果
            ctx.fillStyle = '#8b0000';
            ctx.beginPath();
            ctx.moveTo(player.x + player.width / 2, player.y);
            ctx.lineTo(player.x + player.width, player.y + 10);
            ctx.lineTo(player.x + player.width / 2, player.y + 5);
            ctx.lineTo(player.x, player.y + 10);
            ctx.closePath();
            ctx.fill();
        }
        
        function updateStats() {
            document.getElementById('level').textContent = level;
            document.getElementById('score').textContent = score;
            document.getElementById('highScore').textContent = GameCore.highScore.get(GAME_NAME);
            document.getElementById('inkIndicator').textContent = '墨汁: ' + Math.round(ink) + '%';
            
            if (GameCore.highScore.set(GAME_NAME, score)) {
                GameCore.hints.show('新纪录！分数: ' + score);
            }
        }
        
        let lastX, lastY;
        
        function gameLoop() {
            draw();
            
            if (gameRunning) {
                updatePlayer();
                updateEnemies();
                checkCollisions();
                
                if (ink < 100) ink += 0.1;
            }
            
            updateStats();
            requestAnimationFrame(gameLoop);
        }
        
        document.addEventListener('keydown', e => {
            if (!gameRunning) return;
            
            if (e.code === 'ArrowRight' || e.code === 'KeyD') player.vx = 5;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') player.vx = -5;
            if (e.code === 'ArrowUp' || e.code === 'KeyW') player.vy = -5;
            if (e.code === 'ArrowDown' || e.code === 'KeyS') player.vy = 5;
        });
        
        document.addEventListener('keyup', e => {
            if (e.code === 'ArrowRight' || e.code === 'KeyD' || e.code === 'ArrowLeft' || e.code === 'KeyA') player.vx = 0;
            if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'ArrowDown' || e.code === 'KeyS') player.vy = 0;
        });
        
        canvas.addEventListener('mousedown', e => {
            const rect = canvas.getBoundingClientRect();
            lastX = e.clientX - rect.left;
            lastY = e.clientY - rect.top;
        });
        
        canvas.addEventListener('mousemove', e => {
            if (!gameRunning || !lastX) return;
            
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            drawInkLine(lastX, lastY, x, y);
            
            lastX = x;
            lastY = y;
        });
        
        canvas.addEventListener('mouseup', () => {
            lastX = null;
            lastY = null;
        });
        
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            if (!gameRunning) return;
            
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            lastX = touch.clientX - rect.left;
            lastY = touch.clientY - rect.top;
        }, { passive: false });
        
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            if (!gameRunning || !lastX) return;
            
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            
            drawInkLine(lastX, lastY, x, y);
            
            lastX = x;
            lastY = y;
        }, { passive: false });
        
        canvas.addEventListener('touchend', () => {
            lastX = null;
            lastY = null;
        });
        
        document.getElementById('btnStart').onclick = () => {
            gameRunning = true;
            level = 1;
            score = 0;
            initLevel();
        };
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        gameLoop();
    </script>

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
