<script>
"use strict";

/* ==================== 常量 ==================== */
const CONFIG = {

/* ==================== 题库（60题） ==================== */
const POEMS = [

    { text: "好雨知时节", author: "杜甫", title: "春夜喜雨" },

    { text: "随风潜入夜", author: "杜甫", title: "春夜喜雨" },
    { text: "润物细无声", author: "杜甫", title: "春夜喜雨" },
    { text: "月落乌啼霜满天", author: "张继", title: "枫桥夜泊" },
    { text: "江枫渔火对愁眠", author: "张继", title: "枫桥夜泊" },
    { text: "姑苏城外寒山寺", author: "张继", title: "枫桥夜泊" },
    { text: "夜半钟声到客船", author: "张继", title: "枫桥夜泊" },
    { text: "空山新雨后", author: "王维", title: "山居秋暝" },
    { text: "天气晚来秋", author: "王维", title: "山居秋暝" },
    { text: "明月松间照", author: "王维", title: "山居秋暝" },
    { text: "清泉石上流", author: "王维", title: "山居秋暝" },
    { text: "国破山河在", author: "杜甫", title: "春望" },
    { text: "城春草木深", author: "杜甫", title: "春望" },
    { text: "感时花溅泪", author: "杜甫", title: "春望" },
    { text: "恨别鸟惊心", author: "杜甫", title: "春望" },
    { text: "大漠孤烟直", author: "王维", title: "使至塞上" },
    { text: "长河落日圆", author: "王维", title: "使至塞上" },
    { text: "海上生明月", author: "张九龄", title: "望月怀远" },
    { text: "天涯共此时", author: "张九龄", title: "望月怀远" }
];

/* ==================== 颜色主题 ==================== */
const COLORS = {
    bg1: '#0f0c29', bg2: '#302b63', bg3: '#24243e',
    text: '#e8e8e8', gold: '#ffd700', accent: '#ff6b6b',
    nodeLeft: ['#667eea', '#764ba2'],
    nodeRight: ['#f093fb', '#f5576c'],
    correct: '#00e676', wrong: '#ff5252',
    line: 'rgba(255,255,255,0.3)', lineActive: 'rgba(255,215,0,0.8)',
    lineCorrect: 'rgba(0,230,118,0.7)', lineWrong: 'rgba(255,82,82,0.7)',
    combo: ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#9b59b6']
};

/* ==================== 游戏状态 ==================== */
var canvas, ctx, W, H, dpr;
var G = {
    state: 'menu', score: 0, combo: 0, maxCombo: 0,
    timeLeft: CONFIG.TIME_LIMIT, totalCorrect: 0, totalWrong: 0,
    questions: [], currentIndex: 0, totalQuestions: 0,
    leftNodes: [], rightNodes: [],
    selectedLeft: -1, selectedRight: -1,
    connections: [], correctConnections: [],
    animating: false, animProgress: 0,
    animLine: null, animResult: null,
    particles: [], shakeTimer: 0, shakeX: 0, shakeY: 0,
    lastTime: 0, highScore: 0,
    timerInterval: null,
    difficulty: 'normal',
    fadeAlpha: 1, fadeDir: -1
};

/* ==================== 粒子系统 ==================== */
function createParticle(x, y, color, count) {
    for (var i = 0; i < count; i++) {
        var angle = Math.random() * Math.PI * 2;
        var speed = 1 + Math.random() * 4;
        G.particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1, decay: 0.015 + Math.random() * 0.02,
            size: 2 + Math.random() * 4,
            color: color || COLORS.gold
        });
    }
}

function updateParticles() {
    for (var i = G.particles.length - 1; i >= 0; i--) {
        var p = G.particles[i];
        p.x += p.vx; p.y += p.vy;
        p.vy += 0.05; p.life -= p.decay;
        if (p.life <= 0) G.particles.splice(i, 1);
    }
}

function drawParticles() {
    for (var i = 0; i < G.particles.length; i++) {
        var p = G.particles[i];
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

/* ==================== 背景星星 ==================== */
var stars = [];
function initStars() {
    stars = [];
    for (var i = 0; i < 80; i++) {
        stars.push({
            x: Math.random() * W, y: Math.random() * H,
            size: 0.5 + Math.random() * 2,
            speed: 0.2 + Math.random() * 0.5,
            alpha: 0.3 + Math.random() * 0.7
        });
    }
}

function drawStars() {
    var t = Date.now() * 0.001;
    for (var i = 0; i < stars.length; i++) {
        var s = stars[i];
        var twinkle = 0.5 + 0.5 * Math.sin(t * s.speed + i);
        ctx.globalAlpha = s.alpha * twinkle;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

/* ==================== Canvas初始化 ==================== */
function initCanvas() {
    canvas = document.getElementById('c');
    ctx = canvas.getContext('2d');
    dpr = window.devicePixelRatio || 1;
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
}

function resizeCanvas() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    initStars();
}

/* ==================== 渐变背景 ==================== */
function drawBackground() {
    var gradient = ctx.createLinearGradient(0, 0, 0, H);
    gradient.addColorStop(0, COLORS.bg1);
    gradient.addColorStop(0.5, COLORS.bg2);
    gradient.addColorStop(1, COLORS.bg3);
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, W, H);
}

/* ==================== 工具函数 ==================== */
function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
}

function drawRoundRect(x, y, w, h, r, fill, stroke) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); }
}

function drawButton(x, y, w, h, text, fontSize, colors) {
    var r = Math.min(h / 2, 16);
    var grad = ctx.createLinearGradient(x, y, x, y + h);
    grad.addColorStop(0, colors[0]);
    grad.addColorStop(1, colors[1]);
    drawRoundRect(x, y, w, h, r, grad);
    ctx.fillStyle = '#fff';
    ctx.font = (fontSize || 20) + 'px ' + CONFIG.FONT_FAMILY;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, x + w / 2, y + h / 2);
}

function pointInRect(px, py, x, y, w, h) {
    return px >= x && px <= x + w && py >= y && py <= y + h;
}

function pointInCircle(px, py, cx, cy, r) {
    var dx = px - cx, dy = py - cy;
    return dx * dx + dy * dy <= r * r;
}

/* ==================== 生成题目 ==================== */
function generateQuestions(count) {
    var pool = shuffle(POEMS).slice(0, count);
    G.questions = pool;
    G.totalQuestions = pool.length;
    G.currentIndex = 0;
    loadQuestion();
}

function loadQuestion() {
    if (G.currentIndex >= G.questions.length) {
        endGame();
        return;
    }
    var q = G.questions[G.currentIndex];
    var usedAuthors = [q.author];
    var usedTitles = [q.title];

    // 生成干扰项
    var wrongAuthors = shuffle(POEMS.filter(function(p) { return p.author !== q.author; }))
        .slice(0, 3).map(function(p) { return p.author; });
    var wrongTitles = shuffle(POEMS.filter(function(p) { return p.title !== q.title; }))
        .slice(0, 3).map(function(p) { return p.title; });

    // 左侧：诗句+作者（正确+3干扰）
    var leftItems = [{ text: q.author, isCorrect: true, poemIdx: 0 }];
    for (var i = 0; i < wrongAuthors.length; i++) {
        leftItems.push({ text: wrongAuthors[i], isCorrect: false, poemIdx: -1 });
    }

    // 右侧：题目（正确+3干扰）
    var rightItems = [{ text: q.title, isCorrect: true, poemIdx: 0 }];
    for (var i = 0; i < wrongTitles.length; i++) {
        rightItems.push({ text: wrongTitles[i], isCorrect: false, poemIdx: -1 });
    }

    G.leftNodes = shuffle(leftItems);
    G.rightNodes = shuffle(rightItems);
    G.selectedLeft = -1;
    G.selectedRight = -1;
    G.connections = [];
    G.correctConnections = [];
    G.animating = false;

    // 计算节点位置
    calcNodePositions();
}

function calcNodePositions() {
    var isMobile = W < 700;
    var nodeR = isMobile ? 22 : CONFIG.NODE_RADIUS;
    var spacing = isMobile ? 55 : 70;
    var startY = H / 2 - (G.leftNodes.length - 1) * spacing / 2;
    var leftX = isMobile ? W * 0.2 : W * 0.3;
    var rightX = isMobile ? W * 0.8 : W * 0.7;

    for (var i = 0; i < G.leftNodes.length; i++) {
        G.leftNodes[i].x = leftX;
        G.leftNodes[i].y = startY + i * spacing;
        G.leftNodes[i].r = nodeR;
    }
    for (var i = 0; i < G.rightNodes.length; i++) {
        G.rightNodes[i].x = rightX;
        G.rightNodes[i].y = startY + i * spacing;
        G.rightNodes[i].r = nodeR;
    }
}

/* ==================== 游戏逻辑 ==================== */
function handleMatch() {
    if (G.selectedLeft < 0 || G.selectedRight < 0) return;
    if (G.animating) return;

    var left = G.leftNodes[G.selectedLeft];
    var right = G.rightNodes[G.selectedRight];
    var isCorrect = left.isCorrect && right.isCorrect;

    G.animating = true;
    G.animProgress = 0;
    G.animLine = {
        x1: left.x + left.r, y1: left.y,
        x2: right.x - right.r, y2: right.y
    };
    G.animResult = isCorrect;

    if (isCorrect) {
        G.combo++;
        if (G.combo > G.maxCombo) G.maxCombo = G.combo;
        var bonus = CONFIG.CORRECT_SCORE + Math.min(G.combo - 1, 5) * CONFIG.COMBO_BONUS;
        G.score += bonus;
        G.totalCorrect++;
        createParticle(W / 2, H / 2, COLORS.correct, 20);
    } else {
        G.combo = 0;
        G.score = Math.max(0, G.score - CONFIG.WRONG_PENALTY);
        G.totalWrong++;
        G.shakeTimer = 10;
        createParticle(left.x, left.y, COLORS.wrong, 8);
        createParticle(right.x, right.y, COLORS.wrong, 8);
    }
}

function completeMatch() {
    G.animating = false;
    if (G.animResult) {
        G.currentIndex++;
        G.selectedLeft = -1;
        G.selectedRight = -1;
        if (G.currentIndex >= G.questions.length) {
            endGame();
        } else {
            loadQuestion();
        }
    } else {
        G.selectedLeft = -1;
        G.selectedRight = -1;
    }
}

/* ==================== 开始游戏 ==================== */
function startGame(difficulty) {
    G.state = 'playing';
    G.score = 0; G.combo = 0; G.maxCombo = 0;
    G.totalCorrect = 0; G.totalWrong = 0;
    G.particles = []; G.shakeTimer = 0;
    G.difficulty = difficulty || 'normal';
    G.fadeAlpha = 1; G.fadeDir = -1;

    if (difficulty === 'easy') { G.timeLeft = 180; G.totalQuestions = 20; }
    else if (difficulty === 'hard') { G.timeLeft = 90; G.totalQuestions = 50; }
    else { G.timeLeft = CONFIG.TIME_LIMIT; G.totalQuestions = 40; }

    generateQuestions(G.totalQuestions);

    if (G.timerInterval) clearInterval(G.timerInterval);
    G.timerInterval = setInterval(function() {
        if (G.state === 'playing') {
            G.timeLeft--;
            if (G.timeLeft <= 0) {
                G.timeLeft = 0;
                endGame();
            }
        }
    }, 1000);
}

function endGame() {
    G.state = 'gameover';
    if (G.timerInterval) { clearInterval(G.timerInterval); G.timerInterval = null; }
    if (G.score > G.highScore) {
        G.highScore = G.score;
        try { localStorage.setItem('poem_link_high', G.highScore); } catch(e) {}
    }
    createParticle(W / 2, H / 2, COLORS.gold, 40);
}

/* ==================== 绘制：菜单 ==================== */
function drawMenu() {
    drawBackground(); drawStars();

    var isMobile = W < 700;
    var titleSize = isMobile ? 36 : 56;
    var subSize = isMobile ? 14 : 18;

    // 标题
    ctx.fillStyle = COLORS.gold;
    ctx.font = 'bold ' + titleSize + 'px ' + CONFIG.FONT_FAMILY;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = COLORS.gold; ctx.shadowBlur = 20;
    ctx.fillText('古诗连线', W / 2, H * 0.2);
    ctx.shadowBlur = 0;

    // 副标题
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.font = subSize + 'px ' + CONFIG.FONT_FAMILY;
    ctx.fillText('将诗句与正确的作者/题目配对', W / 2, H * 0.2 + titleSize * 0.7);

    // 装饰诗
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.font = (isMobile ? 13 : 16) + 'px ' + CONFIG.FONT_FAMILY;
    var poemY = H * 0.35;
    var deco = ['床前明月光，疑是地上霜。', '举头望明月，低头思故乡。', '—— 李白《静夜思》'];
    for (var i = 0; i < deco.length; i++) {
        ctx.fillText(deco[i], W / 2, poemY + i * 24);
    }

    // 按钮
    var btnW = isMobile ? 200 : 260;
    var btnH = isMobile ? 44 : 52;
    var btnX = (W - btnW) / 2;
    var btnY = H * 0.52;
    var gap = isMobile ? 14 : 18;

    drawButton(btnX, btnY, btnW, btnH, '简单模式（20题/3分钟）', isMobile ? 14 : 16, ['#43cea2', '#185a9d']);
    drawButton(btnX, btnY + btnH + gap, btnW, btnH, '普通模式（40题/2分钟）', isMobile ? 14 : 16, ['#667eea', '#764ba2']);
    drawButton(btnX, btnY + (btnH + gap) * 2, btnW, btnH, '困难模式（50题/1.5分钟）', isMobile ? 14 : 16, ['#f5576c', '#ff6b6b']);

    // 存储按钮区域
    G.menuButtons = [
        { x: btnX, y: btnY, w: btnW, h: btnH, difficulty: 'easy' },
        { x: btnX, y: btnY + btnH + gap, w: btnW, h: btnH, difficulty: 'normal' },
        { x: btnX, y: btnY + (btnH + gap) * 2, w: btnW, h: btnH, difficulty: 'hard' }
    ];

    // 最高分
    if (G.highScore > 0) {
        ctx.fillStyle = COLORS.gold;
        ctx.font = (isMobile ? 14 : 16) + 'px ' + CONFIG.FONT_FAMILY;
        ctx.fillText('最高分: ' + G.highScore, W / 2, H * 0.85);
    }

    // 操作说明
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = (isMobile ? 11 : 13) + 'px ' + CONFIG.FONT_FAMILY;
    ctx.fillText('点击左侧作者 → 点击右侧题目 → 自动判定配对', W / 2, H * 0.92);
}

/* ==================== 绘制：游戏中 ==================== */
function drawGame() {
    drawBackground(); drawStars();

    var isMobile = W < 700;

    // 屏幕震动
    if (G.shakeTimer > 0) {
        G.shakeX = (Math.random() - 0.5) * 8;
        G.shakeY = (Math.random() - 0.5) * 8;
        G.shakeTimer--;
        ctx.save(); ctx.translate(G.shakeX, G.shakeY);
    }

    // 顶部信息栏
    drawGameHeader(isMobile);

    // 当前诗句
    var q = G.questions[G.currentIndex];
    ctx.fillStyle = COLORS.gold;
    ctx.font = 'bold ' + (isMobile ? 20 : 28) + 'px ' + CONFIG.FONT_FAMILY;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = COLORS.gold; ctx.shadowBlur = 10;
    ctx.fillText('"' + q.text + '"', W / 2, isMobile ? 70 : 90);
    ctx.shadowBlur = 0;

    // 提示
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = (isMobile ? 12 : 14) + 'px ' + CONFIG.FONT_FAMILY;
    ctx.fillText('请选择正确的作者和题目', W / 2, isMobile ? 95 : 120);

    // 绘制连线
    drawConnections();

    // 绘制节点
    drawNodes(G.leftNodes, 'left', isMobile);
    drawNodes(G.rightNodes, 'right', isMobile);

    // 绘制动画中的连线
    if (G.animating && G.animLine) {
        drawAnimLine();
    }

    // 绘制粒子
    drawParticles();

    if (G.shakeTimer > 0 || G.shakeTimer === 0) {
        if (G.shakeTimer >= 0) ctx.restore();
    }

    // 淡入效果
    if (G.fadeAlpha > 0) {
        ctx.globalAlpha = G.fadeAlpha;
        ctx.fillStyle = COLORS.bg1;
        ctx.fillRect(0, 0, W, H);
        ctx.globalAlpha = 1;
    }
}

function drawGameHeader(isMobile) {
    var y = 20;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    drawRoundRect(10, y, W - 20, isMobile ? 35 : 40, 10, 'rgba(0,0,0,0.3)');

    ctx.fillStyle = '#fff';
    ctx.font = (isMobile ? 13 : 16) + 'px ' + CONFIG.FONT_FAMILY;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('分数: ' + G.score, 20, y + (isMobile ? 17 : 20));

    ctx.textAlign = 'center';
    var progress = G.currentIndex + '/' + G.totalQuestions;
    ctx.fillText(progress, W / 2, y + (isMobile ? 17 : 20));

    ctx.textAlign = 'right';
    var timeColor = G.timeLeft <= 30 ? COLORS.wrong : (G.timeLeft <= 60 ? COLORS.gold : '#fff');
    ctx.fillStyle = timeColor;
    ctx.fillText(G.timeLeft + 's', W - 20, y + (isMobile ? 17 : 20));

    // 连击
    if (G.combo > 1) {
        var ci = G.combo % COLORS.combo.length;
        ctx.fillStyle = COLORS.combo[ci];
        ctx.font = 'bold ' + (isMobile ? 14 : 18) + 'px ' + CONFIG.FONT_FAMILY;
        ctx.textAlign = 'center';
        ctx.fillText('连击 x' + G.combo, W / 2, y + (isMobile ? 50 : 55));
    }
}

function drawNodes(nodes, side, isMobile) {
    for (var i = 0; i < nodes.length; i++) {
        var n = nodes[i];
        var selected = (side === 'left' && G.selectedLeft === i) ||
                       (side === 'right' && G.selectedRight === i);
        var colors = side === 'left' ? COLORS.nodeLeft : COLORS.nodeRight;

        // 节点背景
        var grad = ctx.createLinearGradient(n.x - n.r, n.y - n.r, n.x + n.r, n.y + n.r);
        if (selected) {
            grad.addColorStop(0, COLORS.gold);
            grad.addColorStop(1, '#ffaa00');
        } else {
            grad.addColorStop(0, colors[0]);
            grad.addColorStop(1, colors[1]);
        }

        ctx.beginPath();
        ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();

        if (selected) {
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            ctx.stroke();
            // 发光效果
            ctx.shadowColor = COLORS.gold;
            ctx.shadowBlur = 15;
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        // 文字
        ctx.fillStyle = '#fff';
        var fontSize = isMobile ? 11 : 14;
        if (n.text.length > 4) fontSize -= 2;
        ctx.font = fontSize + 'px ' + CONFIG.FONT_FAMILY;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(n.text, n.x, n.y);
    }
}

function drawConnections() {
    for (var i = 0; i < G.connections.length; i++) {
        var c = G.connections[i];
        ctx.beginPath();
        ctx.moveTo(c.x1, c.y1);
        ctx.lineTo(c.x2, c.y2);
        ctx.strokeStyle = c.correct ? COLORS.lineCorrect : COLORS.lineWrong;
        ctx.lineWidth = CONFIG.LINE_WIDTH;
        ctx.setLineDash([8, 4]);
        ctx.stroke();
        ctx.setLineDash([]);
    }
}

function drawAnimLine() {
    var a = G.animLine;
    var progress = Math.min(G.animProgress, 1);
    var cx = a.x1 + (a.x2 - a.x1) * progress;
    var cy = a.y1 + (a.y2 - a.y1) * progress;

    ctx.beginPath();
    ctx.moveTo(a.x1, a.y1);
    ctx.lineTo(cx, cy);
    ctx.strokeStyle = G.animResult ? COLORS.lineCorrect : COLORS.lineWrong;
    ctx.lineWidth = CONFIG.LINE_WIDTH + 1;
    ctx.shadowColor = G.animResult ? COLORS.correct : COLORS.wrong;
    ctx.shadowBlur = 10;
    ctx.stroke();
    ctx.shadowBlur = 0;

    // 移动的光点
    ctx.beginPath();
    ctx.arc(cx, cy, 6, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
}

/* ==================== 绘制：游戏结束 ==================== */
function drawGameOver() {
    drawBackground(); drawStars(); drawParticles();

    var isMobile = W < 700;
    var titleSize = isMobile ? 32 : 48;
    var infoSize = isMobile ? 16 : 22;

    // 标题
    ctx.fillStyle = COLORS.gold;
    ctx.font = 'bold ' + titleSize + 'px ' + CONFIG.FONT_FAMILY;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = COLORS.gold; ctx.shadowBlur = 20;
    ctx.fillText('游戏结束', W / 2, H * 0.15);
    ctx.shadowBlur = 0;

    // 分数
    ctx.fillStyle = '#fff';
    ctx.font = 'bold ' + (isMobile ? 28 : 40) + 'px ' + CONFIG.FONT_FAMILY;
    ctx.fillText(G.score + ' 分', W / 2, H * 0.28);

    // 新纪录
    if (G.score >= G.highScore && G.score > 0) {
        ctx.fillStyle = COLORS.accent;
        ctx.font = 'bold ' + (isMobile ? 16 : 20) + 'px ' + CONFIG.FONT_FAMILY;
        ctx.fillText('新纪录！', W / 2, H * 0.35);
    }

    // 统计信息
    var stats = [
        '正确配对: ' + G.totalCorrect,
        '错误次数: ' + G.totalWrong,
        '最大连击: ' + G.maxCombo,
        '准确率: ' + (G.totalCorrect + G.totalWrong > 0 ?
            Math.round(G.totalCorrect / (G.totalCorrect + G.totalWrong) * 100) : 0) + '%'
    ];

    ctx.font = infoSize + 'px ' + CONFIG.FONT_FAMILY;
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    for (var i = 0; i < stats.length; i++) {
        ctx.fillText(stats[i], W / 2, H * 0.43 + i * (isMobile ? 28 : 36));
    }

    // 评价
    var rate = G.totalCorrect + G.totalWrong > 0 ?
        G.totalCorrect / (G.totalCorrect + G.totalWrong) : 0;
    var grade = rate >= 0.9 ? '诗仙' : rate >= 0.7 ? '诗圣' : rate >= 0.5 ? '秀才' : '书童';
    var gradeColor = rate >= 0.9 ? COLORS.gold : rate >= 0.7 ? '#ff9800' :
                     rate >= 0.5 ? '#4caf50' : '#9e9e9e';
    ctx.fillStyle = gradeColor;
    ctx.font = 'bold ' + (isMobile ? 22 : 30) + 'px ' + CONFIG.FONT_FAMILY;
    ctx.fillText('等级: ' + grade, W / 2, H * 0.68);

    // 按钮
    var btnW = isMobile ? 180 : 220;
    var btnH = isMobile ? 42 : 50;
    var btnX = (W - btnW) / 2;
    var btnY = H * 0.78;

    drawButton(btnX, btnY, btnW, btnH, '再来一局', isMobile ? 16 : 18, ['#667eea', '#764ba2']);
    drawButton(btnX, btnY + btnH + 15, btnW, btnH, '返回菜单', isMobile ? 16 : 18, ['#43cea2', '#185a9d']);

    G.overButtons = [
        { x: btnX, y: btnY, w: btnW, h: btnH, action: 'retry' },
        { x: btnX, y: btnY + btnH + 15, w: btnW, h: btnH, action: 'menu' }
    ];
}

/* ==================== 输入处理 ==================== */
function handleClick(px, py) {
    if (G.state === 'menu') {
        if (G.menuButtons) {
            for (var i = 0; i < G.menuButtons.length; i++) {
                var b = G.menuButtons[i];
                if (pointInRect(px, py, b.x, b.y, b.w, b.h)) {
                    startGame(b.difficulty);
                    return;
                }
            }
        }
    } else if (G.state === 'playing') {
        if (G.animating) return;

        // 检查左侧节点
        for (var i = 0; i < G.leftNodes.length; i++) {
            var n = G.leftNodes[i];
            if (pointInCircle(px, py, n.x, n.y, n.r + 10)) {
                G.selectedLeft = i;
                if (G.selectedRight >= 0) handleMatch();
                return;
            }
        }

        // 检查右侧节点
        for (var i = 0; i < G.rightNodes.length; i++) {
            var n = G.rightNodes[i];
            if (pointInCircle(px, py, n.x, n.y, n.r + 10)) {
                G.selectedRight = i;
                if (G.selectedLeft >= 0) handleMatch();
                return;
            }
        }
    } else if (G.state === 'gameover') {
        if (G.overButtons) {
            for (var i = 0; i < G.overButtons.length; i++) {
                var b = G.overButtons[i];
                if (pointInRect(px, py, b.x, b.y, b.w, b.h)) {
                    if (b.action === 'retry') startGame(G.difficulty);
                    else G.state = 'menu';
                    return;
                }
            }
        }
    }
}

function getEventPos(e) {
    var rect = canvas.getBoundingClientRect();
    if (e.touches && e.touches.length > 0) {
        return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
    }
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

function bindCanvasEvents() {
    canvas.addEventListener('click', function(e) {
        var pos = getEventPos(e);
        handleClick(pos.x, pos.y);
    });

    canvas.addEventListener('touchstart', function(e) {
        e.preventDefault();
        var pos = getEventPos(e);
        handleClick(pos.x, pos.y);
    }, { passive: false });
}

/* 键盘支持 */
document.addEventListener('keydown', function(e) {
    if (G.state === 'menu') {
        if (e.key === '1' || e.key === 'Enter') startGame('easy');
        else if (e.key === '2') startGame('normal');
        else if (e.key === '3') startGame('hard');
    } else if (G.state === 'playing' && !G.animating) {
        if (e.key >= '1' && e.key <= '4') {
            var idx = parseInt(e.key) - 1;
            if (G.selectedLeft < 0) {
                if (idx < G.leftNodes.length) {
                    G.selectedLeft = idx;
                    if (G.selectedRight >= 0) handleMatch();
                }
            } else {
                if (idx < G.rightNodes.length) {
                    G.selectedRight = idx;
                    handleMatch();
                }
            }
        }
        // Q/W/E/R 选左侧
        var leftKeys = { 'q': 0, 'w': 1, 'e': 2, 'r': 3 };
        if (leftKeys[e.key] !== undefined && G.selectedLeft < 0) {
            var idx = leftKeys[e.key];
            if (idx < G.leftNodes.length) {
                G.selectedLeft = idx;
                if (G.selectedRight >= 0) handleMatch();
            }
        }
        // A/S/D/F 选右侧
        var rightKeys = { 'a': 0, 's': 1, 'd': 2, 'f': 3 };
        if (rightKeys[e.key] !== undefined && G.selectedRight < 0) {
            var idx = rightKeys[e.key];
            if (idx < G.rightNodes.length) {
                G.selectedRight = idx;
                if (G.selectedLeft >= 0) handleMatch();
            }
        }
        // Esc 取消选择
        if (e.key === 'Escape') {
            G.selectedLeft = -1;
            G.selectedRight = -1;
        }
    } else if (G.state === 'gameover') {
        if (e.key === 'Enter' || e.key === ' ') startGame(G.difficulty);
        else if (e.key === 'Escape') G.state = 'menu';
    }
});

/* ==================== 主循环 ==================== */
function gameLoop(timestamp) {
    var dt = timestamp - G.lastTime;
    G.lastTime = timestamp;

    // 淡入动画
    if (G.fadeAlpha > 0 && G.fadeDir < 0) {
        G.fadeAlpha -= 0.03;
        if (G.fadeAlpha <= 0) G.fadeAlpha = 0;
    }

    // 连线动画
    if (G.animating) {
        G.animProgress += CONFIG.ANIMATION_SPEED;
        if (G.animProgress >= 1) {
            G.animProgress = 1;
            // 动画结束
            if (G.animResult) {
                createParticle(G.animLine.x2, G.animLine.y2, COLORS.correct, 15);
            }
            setTimeout(function() { completeMatch(); }, 200);
            G.animating = false;
        }
    }

    // 粒子更新
    updateParticles();

    // 渲染
    if (G.state === 'menu') drawMenu();
    else if (G.state === 'playing') drawGame();
    else if (G.state === 'gameover') drawGameOver();

    requestAnimationFrame(gameLoop);
}

/* ==================== 初始化 ==================== */
function init() {
    initCanvas();
    bindCanvasEvents();
    try { G.highScore = parseInt(localStorage.getItem('poem_link_high')) || 0; } catch(e) {}
    G.lastTime = performance.now();
    requestAnimationFrame(gameLoop);
}

init();

            osc.connect(gain);

<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
