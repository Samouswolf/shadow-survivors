<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>捕鱼达人</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a1628;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;font-family:"Microsoft YaHei","PingFang SC",sans-serif}
canvas{display:block;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
#ui-layer{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:10}
#ui-layer>*{pointer-events:auto}
#coin-display{position:fixed;top:8px;left:8px;z-index:15;background:rgba(0,0,0,.55);border:1px solid rgba(255,215,0,.3);border-radius:20px;padding:4px 14px;display:flex;align-items:center;gap:6px;color:#ffd700;font:bold 16px "Microsoft YaHei",sans-serif;backdrop-filter:blur(4px)}
#coin-display .coin-icon{font-size:20px}
#level-display{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:15;background:rgba(0,0,0,.55);border:1px solid rgba(0,200,255,.3);border-radius:20px;padding:4px 14px;color:#0cf;font:bold 14px "Microsoft YaHei",sans-serif;backdrop-filter:blur(4px)}
#upgrade-btn{position:fixed;top:8px;right:8px;z-index:15;background:linear-gradient(135deg,rgba(255,120,0,.6),rgba(255,60,0,.6));border:1px solid rgba(255,150,0,.4);border-radius:20px;padding:6px 16px;color:#fff;font:bold 14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s;backdrop-filter:blur(4px)}
#upgrade-btn:hover{background:linear-gradient(135deg,rgba(255,150,0,.8),rgba(255,80,0,.8));transform:scale(1.05)}
#upgrade-btn:active{transform:scale(.95)}
#upgrade-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
#msg-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;color:#ffd700;font:bold 28px "Microsoft YaHei",sans-serif;text-shadow:0 0 20px rgba(255,215,0,.6);pointer-events:none;opacity:0;transition:opacity .3s}
#game-over-overlay{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.85);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;pointer-events:none}
#game-over-overlay.active{display:flex;pointer-events:auto}
#game-over-overlay h2{color:#ff4444;font:bold 36px "Microsoft YaHei",sans-serif}
#game-over-overlay .score-text{color:#ffd700;font:20px "Microsoft YaHei",sans-serif}
#game-over-overlay button{padding:12px 40px;background:linear-gradient(135deg,#ff6600,#ff3300);border:none;border-radius:25px;color:#fff;font:bold 18px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
#game-over-overlay button:hover{transform:scale(1.05)}
#game-over-overlay button:active{transform:scale(.95)}
#low-coin-warn{position:fixed;top:44px;left:50%;transform:translateX(-50%);z-index:16;background:rgba(255,0,0,.7);border-radius:12px;padding:4px 12px;color:#fff;font:bold 12px "Microsoft YaHei",sans-serif;opacity:0;transition:opacity .3s;pointer-events:none}
</style>
<style>
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);height:90px;max-height:90px;overflow:hidden;contain:layout style paint;pointer-events:none!important}.ad-banner-container,.ad-banner-container *{pointer-events:none!important}.ad-banner-container iframe{max-height:90px;pointer-events:none!important}
.ad-banner-container iframe{max-width:100%}
.ad-label{position:absolute;top:1px;right:6px;font:9px "Microsoft YaHei",sans-serif;color:rgba(255,255,255,.35)}
.sponsor-btn{position:fixed;top:44px;right:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:3px 9px;border-radius:10px;font:11px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .qr-row{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.sponsor-panel .qr-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px;text-align:center;min-width:140px}
.sponsor-panel .qr-card .qr-icon{font-size:48px;margin-bottom:6px}
.sponsor-panel .qr-card .qr-label{color:#ccc;font:13px "Microsoft YaHei",sans-serif}
.sponsor-panel .qr-card .qr-hint{color:#888;font:11px "Microsoft YaHei",sans-serif;margin-top:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.interstitial-ad .ad-content{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;text-align:center;min-width:280px;max-width:400px}
.interstitial-ad .ad-content p{color:#aaa;font:14px "Microsoft YaHei",sans-serif;margin-bottom:12px}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
</style>

<body>
<canvas id="C"></canvas>
<div id="coin-display"><span class="coin-icon">🪙</span><span id="coin-val">500</span></div>
<div id="level-display">🔫 Lv.<span id="lvl-val">1</span> | 💰<span id="cost-val">1</span>/发</div>
<button id="upgrade-btn">⬆ 升级 <span id="upgrade-cost">200</span>🪙</button>
<div id="low-coin-warn">金币不足！</div>
<div id="msg-popup"></div>
<div id="game-over-overlay">
<h2>金币耗尽</h2>
<div class="score-text">总捕获: <span id="total-catch">0</span> 条</div>
<button id="restart-btn">🔄 重新开始</button>
</div>
<div class="ad-banner-container" id="adBanner"><div class="ad-label">广告</div><div id="adSlot" style="width:728px;max-width:100%;height:90px;display:flex;align-items:center;justify-content:center;color:#888;font:12px 'Microsoft YaHei',sans-serif">广告加载中...</div></div>
<button class="sponsor-btn" id="sponsorBtn">☕ 赞助</button>
<div class="sponsor-panel" id="sponsorPanel">
<h2>💛 支持开发者</h2>
<div style="color:#aaa;font:14px 'Microsoft YaHei',sans-serif;text-align:center;max-width:280px">如果你喜欢这个游戏，请开发者喝杯咖啡吧 ☕<br>每一份支持都是持续更新的动力！</div>
<div class="qr-row">
<div class="qr-card"><div class="qr-icon">💚</div><div class="qr-label">微信赞赏</div><div class="qr-hint">打开微信扫一扫</div></div>
<div class="qr-card"><div class="qr-icon">💙</div><div class="qr-label">支付宝支持</div><div class="qr-hint">打开支付宝扫一扫</div></div>
</div>
<button class="sponsor-close" id="sponsorClose">关闭</button>
</div>
<div class="interstitial-ad" id="interstitialAd">
<div class="ad-content">
<p>📢 赞助商广告</p>

</div>
<button class="skip-btn" id="skipInterstitial">跳过广告 ▶</button>
</div>
<script>
// ============================================================
// 捕鱼达人 - 海底捕鱼射击游戏
// ============================================================

// --- Canvas Setup ---
var canvas = document.getElementById('C');
var ctx = canvas.getContext('2d');
var W, H, SCALE;

function resize() {
    var dpr = window.devicePixelRatio || 1;
    var maxW = window.innerWidth, maxH = window.innerHeight;
    var designW = 800, designH = 500;
    var adH = 90;
    var availH = maxH - adH;
    SCALE = Math.min(maxW / designW, availH / designH);
    W = designW; H = designH;
    canvas.width = W * SCALE * dpr;
    canvas.height = H * SCALE * dpr;
    canvas.style.width = (W * SCALE) + 'px';
    canvas.style.height = (H * SCALE) + 'px';
    ctx.setTransform(SCALE * dpr, 0, 0, SCALE * dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ============================================================
// Audio System
// ============================================================
var audioCtx = null;
function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(freq, dur, type, vol) {
    if (!audioCtx) return;
    var now = audioCtx.currentTime;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, now);
    osc.frequency.exponentialRampToValueAtTime(freq * 0.3, now + dur);
    gain.gain.setValueAtTime(vol || 0.06, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + dur);
}

// ============================================================
// Game State
// ============================================================
var coins = 500;
var cannonLevel = 1;
var totalCatch = 0;
var gameOver = false;
var cannonAngle = 0; // radians, 0=up, PI/2=right
var cannonX = 0, cannonY = 0;
var mouseX = 0, mouseY = 0;
var bullets = [];
var fishes = [];
var effects = []; // coin animations, hit effects
var bubbles = [];
var seaweeds = [];
var frameCount = 0;
var fishSpawnTimer = 0;
var lastShotTime = 0;
var shotCooldown = 180; // ms between shots
var autoShoot = false;
var touchActive = false;

// Cannon config
var cannonConfig = [
    { level: 1, power: 1, speed: 8, cost: 1, color: '#fff', upgradeCost: 200, desc: '青铜炮' },
    { level: 2, power: 1.5, speed: 9, cost: 2, color: '#0f0', upgradeCost: 500, desc: '白银炮' },
    { level: 3, power: 2, speed: 10, cost: 3, color: '#0cf', upgradeCost: 1000, desc: '黄金炮' },
    { level: 4, power: 3, speed: 11, cost: 5, color: '#f0f', upgradeCost: 2000, desc: '激光炮' },
    { level: 5, power: 4.5, speed: 12, cost: 8, color: '#f80', upgradeCost: 5000, desc: '离子炮' },
    { level: 6, power: 7, speed: 14, cost: 15, color: '#f00', upgradeCost: 10000, desc: '核能炮' },
    { level: 7, power: 10, speed: 16, cost: 25, color: '#ff0', upgradeCost: 0, desc: '天罚炮' }
];

// Fish types: [name, minSize, maxSize, speed, score, probability weight, color]
var fishTypes = [
    { name: '小丑鱼', minSize: 20, maxSize: 28, speed: 1.5, score: 20, weight: 35, color: '#ff6b35', color2: '#fff' },
    { name: '热带鱼', minSize: 18, maxSize: 26, speed: 1.8, score: 25, weight: 30, color: '#00d4ff', color2: '#ff0' },
    { name: '天使鱼', minSize: 24, maxSize: 34, speed: 1.3, score: 40, weight: 15, color: '#ff69b4', color2: '#fff' },
    { name: '河豚', minSize: 30, maxSize: 40, speed: 1.0, score: 60, weight: 10, color: '#4caf50', color2: '#a5d6a7' },
    { name: '海龟', minSize: 38, maxSize: 50, speed: 0.7, score: 100, weight: 6, color: '#2e7d32', color2: '#81c784' },
    { name: '鳐鱼', minSize: 50, maxSize: 70, speed: 0.5, score: 200, weight: 3, color: '#5d4037', color2: '#8d6e63' },
    { name: '鲨鱼', minSize: 65, maxSize: 90, speed: 0.4, score: 500, weight: 1, color: '#607d8b', color2: '#cfd8dc' }
];

// ============================================================
// Particle Effects
// ============================================================
function spawnEffect(x, y, color, count) {
    for (var i = 0; i < count; i++) {
        var angle = Math.random() * Math.PI * 2;
        var speed = 1 + Math.random() * 3;
        effects.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 30 + Math.random() * 20,
            maxLife: 50,
            color: color,
            size: 2 + Math.random() * 3
        });
    }
}

function spawnCoinAnimation(x, y, amount) {
    effects.push({
        x: x, y: y,
        vx: 0, vy: -1.5,
        life: 40, maxLife: 40,
        text: '+' + amount,
        color: '#ffd700',
        isCoin: true
    });
}

// ============================================================
// Bubbles & Seaweed
// ============================================================
function initBubbles() {
    bubbles = [];
    for (var i = 0; i < 30; i++) {
        bubbles.push({
            x: Math.random() * W,
            y: Math.random() * H,
            r: 2 + Math.random() * 4,
            speed: 0.2 + Math.random() * 0.6,
            wobble: Math.random() * Math.PI * 2,
            wobbleSpeed: 0.01 + Math.random() * 0.02
        });
    }
}

function initSeaweeds() {
    seaweeds = [];
    for (var i = 0; i < 8; i++) {
        seaweeds.push({
            x: 40 + i * 100 + Math.random() * 30,
            height: 40 + Math.random() * 80,
            segments: 5 + Math.floor(Math.random() * 6),
            sway: Math.random() * Math.PI * 2
        });
    }
}

// ============================================================
// Spawn Fish
// ============================================================
function spawnFish() {
    var totalWeight = 0;
    for (var i = 0; i < fishTypes.length; i++) {
        totalWeight += fishTypes[i].weight;
    }
    var roll = Math.random() * totalWeight;
    var acc = 0;
    var selectedType = 0;
    for (var i = 0; i < fishTypes.length; i++) {
        acc += fishTypes[i].weight;
        if (roll <= acc) { selectedType = i; break; }
    }

    var ft = fishTypes[selectedType];
    var size = ft.minSize + Math.random() * (ft.maxSize - ft.minSize);
    var speed = ft.speed * (0.8 + Math.random() * 0.4);
    var pathType = getPathType(selectedType);

    // Determine spawn edge and direction
    var edge = Math.floor(Math.random() * 4); // 0:left, 1:right, 2:top, 3:bottom
    var x, y, dir;
    var margin = 60;

    if (edge === 0) { // left
        x = -size;
        y = margin + Math.random() * (H - margin * 2);
        dir = 1; // moving right
    } else if (edge === 1) { // right
        x = W + size;
        y = margin + Math.random() * (H - margin * 2);
        dir = -1; // moving left
    } else if (edge === 2) { // top
        x = margin + Math.random() * (W - margin * 2);
        y = -size;
        dir = Math.random() > 0.5 ? 1 : -1;
    } else { // bottom
        x = margin + Math.random() * (W - margin * 2);
        y = H + size;
        dir = Math.random() > 0.5 ? 1 : -1;
    }

    var fish = {
        x: x, y: y,
        type: selectedType,
        size: size,
        speed: speed,
        dir: dir,
        pathType: pathType,
        pathOffset: Math.random() * Math.PI * 2,
        pathAmp: 30 + Math.random() * 50,
        pathFreq: 0.01 + Math.random() * 0.02,
        startY: y,
        startX: x,
        alive: true,
        wobble: 0,
        wobbleSpeed: 0.05 + Math.random() * 0.1,
        flip: dir < 0 // true if facing left
    };

    fishes.push(fish);
}

function getPathType(fishType) {
    // Smaller fish more likely to wave, big fish more likely straight
    var r = Math.random();
    if (fishType <= 1) { // small fish
        if (r < 0.3) return 0; else if (r < 0.8) return 1; else return 2;
    } else if (fishType <= 3) { // medium
        if (r < 0.5) return 0; else if (r < 0.85) return 1; else return 2;
    } else { // large
        if (r < 0.7) return 0; else return 1;
    }
}

// ============================================================
// Update Fish
// ============================================================
function updateFishes() {
    for (var i = fishes.length - 1; i >= 0; i--) {
        var f = fishes[i];
        if (!f.alive) continue;

        f.wobble += f.wobbleSpeed;

        var dx = f.speed * f.dir;
        var dy = 0;

        if (f.pathType === 1) { // sine wave
            dy = Math.sin(f.x * f.pathFreq + f.pathOffset) * f.pathAmp * 0.3;
        } else if (f.pathType === 2) { // arc
            var progress = Math.abs(f.x - f.startX) / (W * 0.6);
            dy = Math.sin(progress * Math.PI) * f.pathAmp * 0.5 * -1;
        }

        f.x += dx;
        f.y += dy;

        // Remove if off screen
        var margin = f.size * 2;
        if (f.x < -margin || f.x > W + margin || f.y < -margin || f.y > H + margin) {
            fishes.splice(i, 1);
        }
    }
}

// ============================================================
// Fire Bullet
// ============================================================
function fireBullet() {
    var cfg = cannonConfig[cannonLevel - 1];
    if (coins < cfg.cost) {
        showLowCoinWarning();
        return;
    }
    coins -= cfg.cost;
    updateCoinDisplay();

    var cx = cannonX;
    var cy = cannonY;
    var angle = cannonAngle - Math.PI / 2; // convert to math angle

    bullets.push({
        x: cx + Math.cos(angle) * 30,
        y: cy + Math.sin(angle) * 30,
        vx: Math.cos(angle) * cfg.speed,
        vy: Math.sin(angle) * cfg.speed,
        power: cfg.power,
        alive: true,
        life: 0,
        maxLife: 120
    });

    playSound(600, 0.08, 'square', 0.04);
    lastShotTime = performance.now();

    // Muzzle flash effect
    spawnEffect(
        cx + Math.cos(angle) * 25,
        cy + Math.sin(angle) * 25,
        cfg.color, 5
    );
}

// ============================================================
// Update Bullets
// ============================================================
function updateBullets() {
    for (var i = bullets.length - 1; i >= 0; i--) {
        var b = bullets[i];
        if (!b.alive) continue;
        b.x += b.vx;
        b.y += b.vy;
        b.life++;

        // Trail effect
        if (frameCount % 2 === 0) {
            effects.push({
                x: b.x, y: b.y,
                vx: 0, vy: 0,
                life: 8, maxLife: 8,
                color: 'rgba(255,255,255,0.6)',
                size: 2,
                isTrail: true
            });
        }

        // Out of bounds
        if (b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20 || b.life > b.maxLife) {
            bullets.splice(i, 1);
        }
    }
}

// ============================================================
// Collision Detection
// ============================================================
function checkCollisions() {
    for (var i = bullets.length - 1; i >= 0; i--) {
        var b = bullets[i];
        if (!b.alive) continue;

        for (var j = fishes.length - 1; j >= 0; j--) {
            var f = fishes[j];
            if (!f.alive) continue;

            var dx = b.x - f.x;
            var dy = b.y - f.y;
            var dist = Math.sqrt(dx * dx + dy * dy);
            var hitRadius = f.size * 0.7;

            if (dist < hitRadius) {
                // Hit! Apply power
                var ft = fishTypes[f.type];
                var catchChance = (b.power / (f.size * 0.1)) * (1 / (f.type + 1));
                catchChance = Math.min(catchChance, 0.95);

                if (Math.random() < catchChance) {
                    // Caught!
                    f.alive = false;
                    var score = Math.floor(ft.score * (f.size / ft.maxSize));
                    coins += score;
                    totalCatch++;
                    spawnEffect(f.x, f.y, ft.color, 15);
                    spawnCoinAnimation(f.x, f.y, score);
                    playSound(300, 0.15, 'sawtooth', 0.06);
                    updateCoinDisplay();
                    showMsgPopup('+' + score, 800);
                } else {
                    // Missed - fish takes damage but lives
                    spawnEffect(b.x, b.y, '#fff', 5);
                    playSound(200, 0.05, 'triangle', 0.03);
                }

                // Remove bullet on hit
                b.alive = false;
                bullets.splice(i, 1);
                break;
            }
        }
    }
}

// ============================================================
// Update Effects
// ============================================================
function updateEffects() {
    for (var i = effects.length - 1; i >= 0; i--) {
        var e = effects[i];
        e.x += e.vx || 0;
        e.y += e.vy || 0;
        e.life--;
        if (e.life <= 0) {
            effects.splice(i, 1);
        }
    }
}

// ============================================================
// Update Bubbles
// ============================================================
function updateBubbles() {
    for (var i = 0; i < bubbles.length; i++) {
        var bbl = bubbles[i];
        bbl.y -= bbl.speed;
        bbl.wobble += bbl.wobbleSpeed;
        bbl.x += Math.sin(bbl.wobble) * 0.3;
        if (bbl.y < -10) {
            bbl.y = H + 10;
            bbl.x = Math.random() * W;
        }
    }
}

// ============================================================
// Seaweed sway
// ============================================================
function updateSeaweeds() {
    for (var i = 0; i < seaweeds.length; i++) {
        seaweeds[i].sway += 0.02;
    }
}

// ============================================================
// Upgrade
// ============================================================
function upgradeCannon() {
    if (cannonLevel >= 7) return;
    var cfg = cannonConfig[cannonLevel - 1];
    if (coins < cfg.upgradeCost) {
        showLowCoinWarning();
        return;
    }
    coins -= cfg.upgradeCost;
    cannonLevel++;
    updateCoinDisplay();
    updateLevelDisplay();
    updateUpgradeBtn();
    showMsgPopup('⬆ 升级成功！Lv.' + cannonLevel, 1500);
    playSound(800, 0.2, 'sine', 0.08);
    setTimeout(function() { playSound(1200, 0.2, 'sine', 0.08); }, 200);
}

// ============================================================
// UI Updates
// ============================================================
function updateCoinDisplay() {
    document.getElementById('coin-val').textContent = coins;
    var display = document.getElementById('coin-display');
    if (coins < 50) {
        display.style.borderColor = 'rgba(255,0,0,.5)';
    } else {
        display.style.borderColor = 'rgba(255,215,0,.3)';
    }
}

function updateLevelDisplay() {
    document.getElementById('lvl-val').textContent = cannonLevel;
    document.getElementById('cost-val').textContent = cannonConfig[cannonLevel - 1].cost;
}

function updateUpgradeBtn() {
    var btn = document.getElementById('upgrade-btn');
    var costEl = document.getElementById('upgrade-cost');
    if (cannonLevel >= 7) {
        btn.disabled = true;
        btn.textContent = '🏆 MAX';
        costEl.textContent = '';
    } else {
        var cost = cannonConfig[cannonLevel - 1].upgradeCost;
        costEl.textContent = cost;
        if (coins < cost) {
            btn.disabled = true;
        } else {
            btn.disabled = false;
        }
    }
}

function showLowCoinWarning() {
    var el = document.getElementById('low-coin-warn');
    el.style.opacity = '1';
    setTimeout(function() { el.style.opacity = '0'; }, 1500);
}

function showMsgPopup(text, duration) {
    var el = document.getElementById('msg-popup');
    el.textContent = text;
    el.style.opacity = '1';
    clearTimeout(el._timeout);
    el._timeout = setTimeout(function() {
        el.style.opacity = '0';
    }, duration || 1000);
}

function showGameOver() {
    gameOver = true;
    document.getElementById('total-catch').textContent = totalCatch;
    document.getElementById('game-over-overlay').classList.add('active');
    if (window.showInterstitialAd) window.showInterstitialAd();
}

function restartGame() {
    coins = 500;
    cannonLevel = 1;
    totalCatch = 0;
    gameOver = false;
    bullets = [];
    fishes = [];
    effects = [];
    updateCoinDisplay();
    updateLevelDisplay();
    updateUpgradeBtn();
    document.getElementById('game-over-overlay').classList.remove('active');
}

// ============================================================
// Rendering
// ============================================================

// Draw background
function drawBackground() {
    // Ocean gradient
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#001a33');
    grad.addColorStop(0.3, '#003366');
    grad.addColorStop(0.6, '#004d80');
    grad.addColorStop(1, '#001a33');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Light rays from top
    ctx.save();
    for (var i = 0; i < 5; i++) {
        var rayX = 80 + i * 160 + Math.sin(frameCount * 0.01 + i) * 30;
        var rayGrad = ctx.createLinearGradient(rayX, 0, rayX, H * 0.6);
        rayGrad.addColorStop(0, 'rgba(255,255,255,0.06)');
        rayGrad.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = rayGrad;
        ctx.beginPath();
        ctx.moveTo(rayX - 30, 0);
        ctx.lineTo(rayX + 30, 0);
        ctx.lineTo(rayX + 100, H * 0.6);
        ctx.lineTo(rayX - 100, H * 0.6);
        ctx.fill();
    }
    ctx.restore();

    // Sandy bottom
    var sandGrad = ctx.createLinearGradient(0, H - 50, 0, H);
    sandGrad.addColorStop(0, 'rgba(139,119,90,0)');
    sandGrad.addColorStop(0.3, 'rgba(139,119,90,0.2)');
    sandGrad.addColorStop(1, 'rgba(139,119,90,0.5)');
    ctx.fillStyle = sandGrad;
    ctx.fillRect(0, H - 50, W, 50);
}

// Draw seaweed
function drawSeaweed(sw) {
    ctx.save();
    ctx.beginPath();
    var x = sw.x;
    var y = H - 10;
    ctx.moveTo(x, y);
    var segH = sw.height / sw.segments;
    for (var i = 0; i < sw.segments; i++) {
        var sway = Math.sin(sw.sway + i * 0.5) * (8 + i * 2);
        var cpX = x + sway;
        var cpY = y - segH * (i + 0.5);
        var endX = x + Math.sin(sw.sway + (i + 1) * 0.5) * (8 + (i + 1) * 2);
        var endY = y - segH * (i + 1);
        ctx.quadraticCurveTo(cpX, cpY, endX, endY);
    }
    ctx.strokeStyle = 'rgba(34,139,34,0.7)';
    ctx.lineWidth = 4;
    ctx.stroke();
    ctx.strokeStyle = 'rgba(46,180,46,0.5)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
}

// Draw bubbles
function drawBubble(bbl) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(bbl.x, bbl.y, bbl.r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.lineWidth = 0.5;
    ctx.stroke();
    // Highlight
    ctx.beginPath();
    ctx.arc(bbl.x - bbl.r * 0.3, bbl.y - bbl.r * 0.3, bbl.r * 0.3, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fill();
    ctx.restore();
}

// Draw fish
function drawFish(f) {
    if (!f.alive) return;
    var ft = fishTypes[f.type];
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.scale(f.dir, 1);

    var size = f.size;
    var wobbleY = Math.sin(f.wobble) * 2;

    // Body
    ctx.beginPath();
    ctx.ellipse(0, wobbleY, size * 0.5, size * 0.25, 0, 0, Math.PI * 2);
    ctx.fillStyle = ft.color;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.2)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Belly highlight
    ctx.beginPath();
    ctx.ellipse(size * 0.05, wobbleY + size * 0.05, size * 0.3, size * 0.12, 0, 0, Math.PI * 2);
    ctx.fillStyle = ft.color2;
    ctx.globalAlpha = 0.3;
    ctx.fill();
    ctx.globalAlpha = 1;

    // Tail
    ctx.beginPath();
    ctx.moveTo(-size * 0.45, wobbleY);
    ctx.lineTo(-size * 0.7, wobbleY - size * 0.2);
    ctx.lineTo(-size * 0.7, wobbleY + size * 0.2);
    ctx.closePath();
    ctx.fillStyle = ft.color;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.15)';
    ctx.lineWidth = 0.8;
    ctx.stroke();

    // Dorsal fin
    ctx.beginPath();
    ctx.moveTo(size * 0.05, wobbleY - size * 0.22);
    ctx.quadraticCurveTo(0, wobbleY - size * 0.4, -size * 0.2, wobbleY - size * 0.22);
    ctx.fillStyle = ft.color;
    ctx.globalAlpha = 0.7;
    ctx.fill();
    ctx.globalAlpha = 1;

    // Eye
    ctx.beginPath();
    ctx.arc(size * 0.2, wobbleY - size * 0.05, size * 0.08, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(size * 0.22, wobbleY - size * 0.05, size * 0.04, 0, Math.PI * 2);
    ctx.fillStyle = '#000';
    ctx.fill();

    // Special features for certain fish
    if (f.type === 3) { // Pufferfish - spikes
        ctx.strokeStyle = ft.color;
        ctx.lineWidth = 1.5;
        for (var s = 0; s < 8; s++) {
            var angle = (s / 8) * Math.PI * 2;
            ctx.beginPath();
            ctx.moveTo(Math.cos(angle) * size * 0.4, wobbleY + Math.sin(angle) * size * 0.2);
            ctx.lineTo(Math.cos(angle) * size * 0.55, wobbleY + Math.sin(angle) * size * 0.3);
            ctx.stroke();
        }
    } else if (f.type === 6) { // Shark - dorsal fin
        ctx.beginPath();
        ctx.moveTo(0, wobbleY - size * 0.22);
        ctx.lineTo(-size * 0.1, wobbleY - size * 0.45);
        ctx.lineTo(-size * 0.25, wobbleY - size * 0.22);
        ctx.fillStyle = '#455a64';
        ctx.fill();
        // Teeth mark
        ctx.beginPath();
        ctx.moveTo(size * 0.45, wobbleY - size * 0.05);
        ctx.lineTo(size * 0.5, wobbleY);
        ctx.lineTo(size * 0.45, wobbleY + size * 0.05);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1;
        ctx.stroke();
    }

    ctx.restore();
}

// Draw cannon
function drawCannon() {
    var cfg = cannonConfig[cannonLevel - 1];
    ctx.save();
    ctx.translate(cannonX, cannonY);
    ctx.rotate(cannonAngle);

    // Cannon barrel
    var barrelW = 12 + cannonLevel * 2;
    var barrelH = 40 + cannonLevel * 3;
    var grad = ctx.createLinearGradient(0, -barrelW / 2, 0, barrelW / 2);
    grad.addColorStop(0, '#555');
    grad.addColorStop(0.3, '#888');
    grad.addColorStop(0.5, '#aaa');
    grad.addColorStop(0.7, '#888');
    grad.addColorStop(1, '#555');
    ctx.fillStyle = grad;
    ctx.fillRect(0, -barrelW / 2, barrelH, barrelW);

    // Barrel tip
    ctx.fillStyle = cfg.color;
    ctx.fillRect(barrelH - 5, -barrelW / 2 - 2, 8, barrelW + 4);

    // Glow effect
    ctx.fillStyle = cfg.color;
    ctx.globalAlpha = 0.3 + Math.sin(frameCount * 0.1) * 0.15;
    ctx.beginPath();
    ctx.arc(barrelH + 5, 0, barrelW * 0.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // Base
    ctx.fillStyle = '#444';
    ctx.beginPath();
    ctx.arc(0, 0, 18, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#666';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Inner base
    var innerGrad = ctx.createRadialGradient(0, 0, 2, 0, 0, 14);
    innerGrad.addColorStop(0, cfg.color);
    innerGrad.addColorStop(1, '#333');
    ctx.fillStyle = innerGrad;
    ctx.beginPath();
    ctx.arc(0, 0, 14, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

// Draw bullet
function drawBullet(b) {
    ctx.save();
    ctx.fillStyle = '#fff';
    ctx.shadowColor = cannonConfig[cannonLevel - 1].color;
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}

// Draw effects
function drawEffects() {
    for (var i = 0; i < effects.length; i++) {
        var e = effects[i];
        var alpha = e.life / e.maxLife;
        if (e.isCoin) {
            ctx.fillStyle = 'rgba(255,215,0,' + alpha + ')';
            ctx.font = 'bold 14px "Microsoft YaHei",sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(e.text, e.x, e.y);
        } else if (e.isTrail) {
            ctx.fillStyle = 'rgba(255,255,255,' + (alpha * 0.5) + ')';
            ctx.beginPath();
            ctx.arc(e.x, e.y, e.size * alpha, 0, Math.PI * 2);
            ctx.fill();
        } else {
            ctx.fillStyle = e.color.replace(')', ',' + alpha + ')').replace('rgb', 'rgba');
            if (e.color.startsWith('#')) {
                ctx.fillStyle = e.color;
                ctx.globalAlpha = alpha;
            }
            ctx.beginPath();
            ctx.arc(e.x, e.y, e.size * alpha, 0, Math.PI * 2);
            ctx.fill();
        }
    }
    ctx.globalAlpha = 1;
}

// Draw UI hints
function drawUIHints() {
    // Cannon level indicator ring
    var cfg = cannonConfig[cannonLevel - 1];
    ctx.strokeStyle = cfg.color;
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.3;
    ctx.beginPath();
    ctx.arc(cannonX, cannonY, 25, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;

    // "点击发射" hint
    if (fishes.length === 0 && frameCount < 120) {
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.font = '16px "Microsoft YaHei",sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('🐟 点击屏幕发射子弹，捕获鱼群！', W / 2, H / 2);
    }
}

// Main render
function render() {
    ctx.clearRect(0, 0, W, H);

    drawBackground();

    // Draw seaweeds
    for (var i = 0; i < seaweeds.length; i++) {
        drawSeaweed(seaweeds[i]);
    }

    // Draw bubbles
    for (var i = 0; i < bubbles.length; i++) {
        drawBubble(bubbles[i]);
    }

    // Draw fishes
    for (var i = 0; i < fishes.length; i++) {
        drawFish(fishes[i]);
    }

    // Draw bullets
    for (var i = 0; i < bullets.length; i++) {
        drawBullet(bullets[i]);
    }

    // Draw effects
    drawEffects();

    // Draw cannon
    drawCannon();

    // Draw UI hints
    drawUIHints();
}

// ============================================================
// Game Loop
// ============================================================
function gameLoop(timestamp) {
    if (gameOver) {
        requestAnimationFrame(gameLoop);
        return;
    }

    frameCount++;

    // Auto-shoot when holding
    if (autoShoot && performance.now() - lastShotTime > shotCooldown) {
        fireBullet();
    }

    // Spawn fish
    fishSpawnTimer++;
    var spawnRate = 40 + Math.max(0, 60 - cannonLevel * 3); // Higher level = more fish
    if (fishSpawnTimer > spawnRate && fishes.length < 20) {
        fishSpawnTimer = 0;
        spawnFish();
    }

    // Ensure minimum fish
    if (fishes.length < 3 && frameCount % 30 === 0) {
        spawnFish();
    }

    updateFishes();
    updateBullets();
    checkCollisions();
    updateEffects();
    updateBubbles();
    updateSeaweeds();

    // Check game over
    if (coins <= 0 && bullets.length === 0 && fishes.length === 0 && effects.length === 0) {
        showGameOver();
    }

    // Update UI periodically
    if (frameCount % 10 === 0) {
        updateUpgradeBtn();
    }

    render();
    requestAnimationFrame(gameLoop);
}

// ============================================================
// Input Handling
// ============================================================
function getCanvasPos(e) {
    var rect = canvas.getBoundingClientRect();
    var x = (e.clientX - rect.left) / SCALE;
    var y = (e.clientY - rect.top) / SCALE;
    return { x: x, y: y };
}

canvas.addEventListener('mousemove', function(e) {
    var pos = getCanvasPos(e);
    mouseX = pos.x;
    mouseY = pos.y;
    updateCannonAngle();
});

canvas.addEventListener('click', function(e) {
    initAudio();
    var pos = getCanvasPos(e);
    mouseX = pos.x;
    mouseY = pos.y;
    updateCannonAngle();
    fireBullet();
});

canvas.addEventListener('mousedown', function(e) {
    e.preventDefault();
    initAudio();
    autoShoot = true;
    var pos = getCanvasPos(e);
    mouseX = pos.x;
    mouseY = pos.y;
    updateCannonAngle();
    fireBullet();
});

canvas.addEventListener('mouseup', function(e) {
    autoShoot = false;
});

canvas.addEventListener('mouseleave', function(e) {
    autoShoot = false;
});

canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    initAudio();
    touchActive = true;
    autoShoot = true;
    var pos = getCanvasPos(e.touches[0]);
    mouseX = pos.x;
    mouseY = pos.y;
    updateCannonAngle();
    fireBullet();
}, { passive: false });

canvas.addEventListener('touchmove', function(e) {
    e.preventDefault();
    if (touchActive) {
        var pos = getCanvasPos(e.touches[0]);
        mouseX = pos.x;
        mouseY = pos.y;
        updateCannonAngle();
    }
}, { passive: false });

canvas.addEventListener('touchend', function(e) {
    e.preventDefault();
    touchActive = false;
    autoShoot = false;
});

canvas.addEventListener('touchcancel', function(e) {
    touchActive = false;
    autoShoot = false;
});

function updateCannonAngle() {
    var dx = mouseX - cannonX;
    var dy = mouseY - cannonY;
    // Clamp angle: can't shoot downward
    var rawAngle = Math.atan2(dy, dx);
    cannonAngle = Math.max(-Math.PI * 0.85, Math.min(Math.PI * 0.85, rawAngle));
}

// ============================================================
// Upgrade Button
// ============================================================
document.getElementById('upgrade-btn').addEventListener('click', function(e) {
    e.stopPropagation();
    upgradeCannon();
});

document.getElementById('restart-btn').addEventListener('click', function(e) {
    e.stopPropagation();
    restartGame();
});

// ============================================================
// Ad System
// ============================================================
(function(){
    var sb = document.getElementById('sponsorBtn'),
        sp = document.getElementById('sponsorPanel'),
        sc = document.getElementById('sponsorClose');
    if (sb && sp) {
        sb.onclick = function(e) { e.stopPropagation(); sp.style.display = 'flex'; };
        if (sc) sc.onclick = function(e) { e.stopPropagation(); sp.style.display = 'none'; };
    }
    var ia = document.getElementById('interstitialAd'),
        si = document.getElementById('skipInterstitial');
    if (ia && si) {
        si.onclick = function(e) { e.stopPropagation(); ia.style.display = 'none'; };
    }
    window.showInterstitialAd = function() {
        if (ia) ia.style.display = 'flex';
    };
})();

// ============================================================
// Init
// ============================================================
function init() {
    cannonX = W / 2;
    cannonY = H - 45;
    mouseX = W / 2;
    mouseY = H / 2;
    updateCannonAngle();
    initBubbles();
    initSeaweeds();
    updateCoinDisplay();
    updateLevelDisplay();
    updateUpgradeBtn();

    // Spawn initial fish
    for (var i = 0; i < 6; i++) {
        spawnFish();
    }

    requestAnimationFrame(gameLoop);
}

init();
</script>
