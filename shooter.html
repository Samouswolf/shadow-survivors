<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>苍穹射击</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    width: 100%; height: 100%;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
}
canvas {
    display: block;
    background: #0a0a1a;
    image-rendering: pixelated;
    max-width: 100vw;
    max-height: 100vh;
}
#ui-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}
#ui-overlay > * { pointer-events: auto; }
.hidden { display: none !important; }
.screen {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,0.85);
    color: #fff;
    font-family: 'Segoe UI', Arial, sans-serif;
}
.screen h1 {
    font-size: 3em;
    margin-bottom: 0.3em;
    text-shadow: 0 0 20px #00aaff, 0 0 40px #0066ff;
    letter-spacing: 0.1em;
}
.screen p {
    font-size: 1.1em;
    color: #aac;
    margin-bottom: 1.5em;
}
.btn {
    padding: 14px 48px;
    font-size: 1.3em;
    border: 2px solid #00aaff;
    background: rgba(0,170,255,0.15);
    color: #fff;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    margin: 8px;
    min-width: 200px;
    text-align: center;
}
.btn:hover {
    background: rgba(0,170,255,0.35);
    box-shadow: 0 0 20px rgba(0,170,255,0.4);
}
.btn-small {
    padding: 10px 24px;
    font-size: 1em;
    min-width: auto;
}
.game-over-score {
    font-size: 2em;
    color: #ffdd44;
    margin: 10px 0;
}
.wave-info {
    font-size: 1.2em;
    color: #88ccff;
    margin-bottom: 10px;
}
#touch-controls {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 50%;
    pointer-events: none;
    display: none;
}
#touch-joystick {
    position: absolute;
    width: 120px; height: 120px;
    border-radius: 60px;
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(255,255,255,0.15);
    bottom: 80px; left: 60px;
    pointer-events: auto;
    touch-action: none;
}
#touch-joystick-knob {
    position: absolute;
    width: 50px; height: 50px;
    border-radius: 25px;
    background: rgba(0,170,255,0.4);
    border: 2px solid rgba(0,170,255,0.6);
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    pointer-events: none;
}
#touch-fire {
    position: absolute;
    width: 80px; height: 80px;
    border-radius: 40px;
    background: rgba(255,50,50,0.2);
    border: 2px solid rgba(255,50,50,0.4);
    bottom: 100px; right: 60px;
    pointer-events: auto;
    touch-action: none;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.4);
    font-size: 1.2em;
}
#touch-bomb {
    position: absolute;
    width: 70px; height: 70px;
    border-radius: 35px;
    background: rgba(68,255,68,0.15);
    border: 2px solid rgba(68,255,68,0.3);
    bottom: 100px; right: 160px;
    pointer-events: auto;
    touch-action: none;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.5);
    font-size: 1.4em;
    font-weight: bold;
}
#loading-bar-bg {
    width: 300px;
    height: 20px;
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
    overflow: hidden;
    margin-top: 20px;
}
#loading-bar {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #0066ff, #00aaff);
    border-radius: 10px;
    transition: width 0.2s;
}
@media (pointer: coarse) {
    #touch-controls { display: block; }
}
@media(max-width:768px){
.desktop-hint{display:none!important}
.mobile-hint{display:block!important}
}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="touch-controls">
    <div id="touch-joystick"><div id="touch-joystick-knob"></div></div>
    <div id="touch-fire">&#9654;</div>
    <div id="touch-bomb">B</div>
</div>

<div id="loading-screen" style="position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#0a0a1a;z-index:100;">
    <h2 style="color:#4488ff;font-family:Arial,sans-serif;margin-bottom:20px;">加载中...</h2>
    <div id="loading-bar-bg"><div id="loading-bar"></div></div>
</div>

<div id="ui-overlay">
    <div id="screen-title" class="screen">
        <h1>苍穹射击</h1>
        <p>SKY SHOOTER</p>
        <div class="btn" id="btn-start">开始游戏</div>
        <div class="btn btn-small" style="margin-top:20px;font-size:0.9em;min-width:auto;padding:8px 20px;background:transparent;border-color:rgba(255,255,255,0.2);color:#888;" id="btn-controls-help">操作说明</div>
        <div class="desktop-hint" style="margin-top:30px;color:#556;font-size:0.8em;">WASD/方向键移动 &middot; 空格/J 射击</div>
        <div class="mobile-hint" style="margin-top:30px;color:#556;font-size:0.8em;display:none">触屏摇杆移动 &middot; 射击按钮攻击</div>
    </div>
    <div id="screen-controls" class="screen hidden">
        <h2 style="margin-bottom:20px;">操作说明</h2>
        <div style="text-align:left;line-height:2;color:#aac;font-size:1.1em;">
            <p><b>移动:</b> WASD / 方向键</p>
            <p><b>射击:</b> 空格 / J / K</p>
            <p><b>炸弹:</b> E / B (触屏左下 B 按钮)</p>
            <p><b>暂停:</b> Escape / P</p>
            <p><b>手机:</b> 触屏摇杆 + 射击按钮</p>
            <hr style="border-color:#334;margin:15px 0;">
            <p>击败敌机获取分数</p>
            <p>收集道具强化火力</p>
            <p>每5波遭遇 Boss 战</p>
        </div>
        <div class="btn btn-small" id="btn-controls-back" style="margin-top:25px;">返回</div>
    </div>
    <div id="screen-gameover" class="screen hidden">
        <h1>游戏结束</h1>
        <div class="game-over-score" id="final-score">0</div>
        <div class="wave-info" id="final-wave">第 0 波</div>
        <div class="btn" id="btn-restart">再来一局</div>
        <div class="btn btn-small" id="btn-menu">返回主菜单</div>
    </div>
    <div id="screen-pause" class="screen hidden">
        <h1>暂停</h1>
        <div class="btn" id="btn-resume">继续游戏</div>
        <div class="btn btn-small" id="btn-quit">退出</div>
    </div>
    <div id="screen-levelup" class="screen hidden" style="background:rgba(0,0,0,0.7);">
        <h1 style="color:#ffdd44;text-shadow:0 0 30px rgba(255,200,0,0.5);">WARNING</h1>
        <h2 id="boss-wave-text" style="color:#ff8844;margin-bottom:20px;">BOSS 逼近</h2>
        <div class="btn" id="btn-boss-ready" style="border-color:#ff4400;background:rgba(255,68,0,0.2);">迎战!</div>
    </div>
</div>

const SPRITES = {};
const spritesheet = new Image();

// --- Sound system (procedural Web Audio API) ---
let audioCtx = null;
let explosionBuffer = null;

function getAudioContext() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    return audioCtx;
}

function playSound(type) {
    try {
        const ctx = getAudioContext();
        if (ctx.state === 'suspended') ctx.resume();

        switch (type) {
            case 'shoot': {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'square';
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(220, ctx.currentTime + 0.04);
                gain.gain.setValueAtTime(0.08, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.08);
                break;
            }
            case 'explosion': {
                if (!explosionBuffer) {
                    const bufferSize = Math.floor(ctx.sampleRate * 0.3);
                    explosionBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                    const data = explosionBuffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 3);
                    }
                }
                const noise = ctx.createBufferSource();
                noise.buffer = explosionBuffer;
                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0.12, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                noise.connect(gain);
                gain.connect(ctx.destination);
                noise.start(ctx.currentTime);
                break;
            }
            case 'powerup': {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.06, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.18);
                break;
            }
            case 'boss': {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(90, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.3);

                const osc2 = ctx.createOscillator();
                const gain2 = ctx.createGain();
                osc2.connect(gain2);
                gain2.connect(ctx.destination);
                osc2.type = 'sawtooth';
                osc2.frequency.setValueAtTime(110, ctx.currentTime + 0.4);
                gain2.gain.setValueAtTime(0.08, ctx.currentTime + 0.4);
                gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.7);
                osc2.start(ctx.currentTime + 0.4);
                osc2.stop(ctx.currentTime + 0.7);
                break;
            }
        }
    } catch (e) {
        // Audio is non-critical
    }
}

// --- Sprite loading ---
function drawSprite(name, x, y, w, h, flipX, flipY) {
    const s = SPRITES[name];
    if (!s) return;
    const dx = x || 0;
    const dy = y || 0;
    const dw = w || s.w;
    const dh = h || s.h;
    if (flipX || flipY) {
        ctx.save();
        ctx.translate(dx + dw/2, dy + dh/2);
        ctx.scale(flipX ? -1 : 1, flipY ? -1 : 1);
        ctx.drawImage(spritesheet, s.x, s.y, s.w, s.h, -dw/2, -dh/2, dw, dh);
        ctx.restore();
    } else {
        ctx.drawImage(spritesheet, s.x, s.y, s.w, s.h, dx, dy, dw, dh);
    }
}

function drawSpriteCentered(name, cx, cy, scale) {
    const s = SPRITES[name];
    if (!s) return;
    const sc = scale || 1;
    const w = s.w * sc;
    const h = s.h * sc;
    ctx.drawImage(spritesheet, s.x, s.y, s.w, s.h, cx - w/2, cy - h/2, w, h);
}

function getSpriteSize(name) {
    const s = SPRITES[name];
    return s ? { w: s.w, h: s.h } : { w: 32, h: 32 };
}

// --- Stars background ---
function initStars() {
    game.stars = [];
    for (let i = 0; i < 80; i++) {
        game.stars.push({
            x: Math.random() * W,
            y: Math.random() * H,
            size: 0.5 + Math.random() * 1.5,
            speed: 20 + Math.random() * 60,
            brightness: 0.3 + Math.random() * 0.7,
        });
    }
}

function updateStars(dt) {
    for (const s of game.stars) {
        s.y += s.speed * dt;
        if (s.y > H) {
            s.y = -2;
            s.x = Math.random() * W;
        }
    }
}

function drawStars() {
    for (const s of game.stars) {
        ctx.globalAlpha = s.brightness;
        ctx.fillStyle = '#fff';
        ctx.fillRect(s.x, s.y, s.size, s.size);
    }
    ctx.globalAlpha = 1;
}

// --- Player ---
function createPlayer() {
    const size = getSpriteSize('spaceShips_001');
    return {
        x: W / 2,
        y: H - 100,
        w: size.w * SHIP_SCALE,
        h: size.h * SHIP_SCALE,
        sprite: 'spaceShips_001',
        speed: PLAYER_SPEED,
        shootCooldown: 0,
        alive: true,
    };
}

function updatePlayer(dt) {
    const p = game.player;
    if (!p || !p.alive) return;

    let dx = 0, dy = 0;
    if (game.keys['ArrowLeft'] || game.keys['KeyA']) dx = -1;
    if (game.keys['ArrowRight'] || game.keys['KeyD']) dx = 1;
    if (game.keys['ArrowUp'] || game.keys['KeyW']) dy = -1;
    if (game.keys['ArrowDown'] || game.keys['KeyS']) dy = 1;

    if (game.touchActive) {
        const dist = Math.sqrt(game.touchDirX * game.touchDirX + game.touchDirY * game.touchDirY);
        if (dist > 0.1) {
            dx = game.touchDirX / dist;
            dy = game.touchDirY / dist;
        }
    }

    const len = Math.sqrt(dx*dx + dy*dy);
    if (len > 0) {
        dx /= len;
        dy /= len;
        p.x += dx * p.speed * dt;
        p.y += dy * p.speed * dt;
    }

    p.x = Math.max(p.w/2, Math.min(W - p.w/2, p.x));
    p.y = Math.max(p.h/2, Math.min(H - p.h/2, p.y));

    p.shootCooldown -= dt;

    const isFiring = game.keys['Space'] || game.keys['KeyJ'] || game.keys['KeyK'] || game.touchActive;
    if (isFiring && p.shootCooldown <= 0) {
        playerShoot();
        p.shootCooldown = game.fireRate;
    }

    // Shield timer
    if (game.shieldActive) {
        game.shieldTimer -= dt;
        if (game.shieldTimer <= 0) {
            game.shieldActive = false;
        }
    }

    // Invincible timer
    if (game.invincibleTimer > 0) {
        game.invincibleTimer -= dt;
    }

    // Combo timer
    if (game.comboTimer > 0) {
        game.comboTimer -= dt;
        if (game.comboTimer <= 0) {
            game.combo = 0;
        }
    }

    // Speed powerup timer
    if (game.speedPowerupTimer > 0) {
        game.speedPowerupTimer -= dt;
        if (game.speedPowerupTimer <= 0) {
            p.speed = PLAYER_SPEED;
        }
    }

    // Fire rate from weapon level
    game.fireRate = Math.max(0.10, 0.25 - game.weaponLevel * 0.07);
}

function playerShoot() {
    const p = game.player;
    const level = game.weaponLevel;
    const bulletDamage = 1 + level;

    const bullets = [];
    const addBullet = (x, y, angle) => {
        bullets.push({
            x: x, y: y,
            vx: Math.sin(angle) * BULLET_SPEED,
            vy: -Math.cos(angle) * BULLET_SPEED,
            w: 6, h: 14,
            damage: bulletDamage,
            isPlayer: true,
            sprite: 'spaceMissiles_001',
        });
    };

    if (level === 0) {
        // Lv1: Single shot
        addBullet(p.x, p.y - p.h/2 - 8, 0);
    } else if (level === 1) {
        // Lv2: Dual angled shot
        addBullet(p.x - 8, p.y - p.h/2 - 8, -0.12);
        addBullet(p.x + 8, p.y - p.h/2 - 8, 0.12);
    } else {
        // Lv3: Triple scatter
        addBullet(p.x, p.y - p.h/2 - 10, 0);
        addBullet(p.x - 14, p.y - p.h/2 - 5, 0.18);
        addBullet(p.x + 14, p.y - p.h/2 - 5, -0.18);
    }

    for (const b of bullets) {
        game.bullets.push(b);
    }
    playSound('shoot');
}

// --- Player bullets update ---
function updateBullets(dt) {
    for (let i = game.bullets.length - 1; i >= 0; i--) {
        const b = game.bullets[i];
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        if (b.y < -20 || b.y > H + 20 || b.x < -20 || b.x > W + 20) {
            game.bullets.splice(i, 1);
        }
    }
}

        speed: type.speed + game.difficulty * 5,
        score: type.score,
        sprite: type.sprite,
        typeIdx: typeIdx,
        fireRate: type.fireRate,
        fireTimer: type.fireRate > 0 ? Math.random() * type.fireRate : 0,
        time: 0,
        movePattern: Math.floor(Math.random() * 3), // 0=straight, 1=sine, 2=diagonal
        alive: true,
    };
    game.enemies.push(enemy);
}

function spawnEnemyFormation(count, wave) {
    const cols = Math.min(5, count);
    const rows = Math.ceil(count / cols);
    const spacingX = 80;
    const startX = (W - (cols - 1) * spacingX) / 2;
    const typeIdx = Math.min(Math.floor(wave / 3), ENEMY_TYPES.length - 1);
    const type = ENEMY_TYPES[typeIdx];

    for (let i = 0; i < count; i++) {
        const col = i % cols;
        const row = Math.floor(i / cols);
        const enemy = {
            x: startX + col * spacingX,
            y: -60 - row * 80,
            w: type.w * SHIP_SCALE,
            h: type.h * SHIP_SCALE,
            hp: type.hp + Math.floor(game.difficulty / 3),
            maxHp: type.hp + Math.floor(game.difficulty / 3),
            speed: type.speed + game.difficulty * 5,
            score: type.score,
            sprite: type.sprite,
            typeIdx: typeIdx,
            fireRate: type.fireRate,
            fireTimer: type.fireRate > 0 ? Math.random() * type.fireRate : 0,
            time: 0,
            movePattern: 0,
            alive: true,
        };
        game.enemies.push(enemy);
    }
}

function updateEnemies(dt) {
    for (let i = game.enemies.length - 1; i >= 0; i--) {
        const e = game.enemies[i];
        if (!e.alive) {
            game.enemies.splice(i, 1);
            continue;
        }

        e.time += dt;
        e.y += e.speed * dt;

        if (e.movePattern === 1) {
            e.x += Math.sin(e.time * 2) * 60 * dt;
        } else if (e.movePattern === 2) {
            e.x += (e.typeIdx % 2 === 0 ? 1 : -1) * 40 * dt;
        }

        e.x = Math.max(e.w/2, Math.min(W - e.w/2, e.x));

        // Enemy shooting
        if (e.fireRate > 0 && e.y > 0) {
            e.fireTimer -= dt;
            if (e.fireTimer <= 0) {
                e.fireTimer = e.fireRate;
                const angle = Math.atan2(game.player.x - e.x, game.player.y - e.y);
                game.enemyBullets.push({
                    x: e.x,
                    y: e.y + e.h/2,
                    vx: Math.sin(angle) * ENEMY_BULLET_SPEED,
                    vy: Math.cos(angle) * ENEMY_BULLET_SPEED,
                    w: 8, h: 8,
                    damage: 1,
                });
            }
        }

        // Remove if off-screen
        if (e.y > H + 60) {
            e.alive = false;
            game.enemies.splice(i, 1);
        }
    }

    // Update enemy bullets
    for (let i = game.enemyBullets.length - 1; i >= 0; i--) {
        const b = game.enemyBullets[i];
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        if (b.y > H + 20 || b.y < -20 || b.x < -20 || b.x > W + 20) {
            game.enemyBullets.splice(i, 1);
        }
    }
}

// --- Boss ---
const BOSS_TYPES = [
    { sprite: 'spaceShips_007', hp: 30, speed: 30, score: 2000, w: 172, h: 151, fireRate: 0.8 },
    { sprite: 'spaceShips_005', hp: 25, speed: 35, score: 1500, w: 136, h: 84, fireRate: 0.6 },
    { sprite: 'spaceShips_004', hp: 40, speed: 25, score: 3000, w: 126, h: 108, fireRate: 0.5 },
];

function spawnBoss(wave) {
    const typeIdx = wave >= 15 ? 2 : (wave >= 10 ? 1 : 0);
    const type = BOSS_TYPES[typeIdx];
    const boss = {
        x: W / 2,
        y: -80,
        w: type.w * SHIP_SCALE,
        h: type.h * SHIP_SCALE,
        hp: type.hp + wave * 3,
        maxHp: type.hp + wave * 3,
        speed: type.speed,
        score: type.score + wave * 200,
        sprite: type.sprite,
        fireRate: Math.max(0.3, type.fireRate - wave * 0.02),
        fireTimer: 1.0,
        time: 0,
        movePattern: 0,
        alive: true,
        isBoss: true,
        phase: 0,
        phaseTimer: 0,
        entering: true,
    };
    game.enemies.push(boss);
    game.bossActive = true;
}

function updateBoss(boss, dt) {
    boss.time += dt;

    if (boss.entering) {
        boss.y += 60 * dt;
        if (boss.y >= 80) {
            boss.entering = false;
        }
        return;
    }

    boss.phaseTimer += dt;

    // Boss movement pattern
    if (boss.phaseTimer < 2) {
        boss.x += Math.sin(boss.time * 0.8) * 80 * dt;
    } else if (boss.phaseTimer < 4) {
        boss.x += Math.cos(boss.time) * 60 * dt;
    } else {
        boss.phaseTimer = 0;
    }

    boss.x = Math.max(boss.w/2 + 20, Math.min(W - boss.w/2 - 20, boss.x));

    // Boss shooting patterns
    boss.fireTimer -= dt;
    if (boss.fireTimer <= 0) {
        boss.fireTimer = boss.fireRate;
        const bType = Math.floor(boss.time / 5) % 3;

        if (bType === 0) {
            // Spread shot
            for (let a = -0.4; a <= 0.4; a += 0.2) {
                const angle = Math.atan2(game.player.x - boss.x, game.player.y - boss.y) + a;
                game.enemyBullets.push({
                    x: boss.x, y: boss.y + boss.h/2,
                    vx: Math.sin(angle) * (ENEMY_BULLET_SPEED * 1.2),
                    vy: Math.cos(angle) * (ENEMY_BULLET_SPEED * 1.2),
                    w: 10, h: 10, damage: 1,
                });
            }
        } else if (bType === 1) {
            // Aimed shot
            const angle = Math.atan2(game.player.x - boss.x, game.player.y - boss.y);
            game.enemyBullets.push({
                x: boss.x, y: boss.y + boss.h/2,
                vx: Math.sin(angle) * ENEMY_BULLET_SPEED * 2,
                vy: Math.cos(angle) * ENEMY_BULLET_SPEED * 2,
                w: 12, h: 12, damage: 1,
            });
        } else {
            // Circle burst
            for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
                game.enemyBullets.push({
                    x: boss.x + Math.sin(a) * 30,
                    y: boss.y + Math.cos(a) * 30,
                    vx: Math.sin(a) * ENEMY_BULLET_SPEED * 0.8,
                    vy: Math.cos(a) * ENEMY_BULLET_SPEED * 0.8,
                    w: 7, h: 7, damage: 1,
                });
            }
        }

        // Spawn minions in later phases
        if (boss.hp < boss.maxHp * 0.5 && Math.random() < 0.3) {
            const type = ENEMY_TYPES[0];
            const minion = {
                x: boss.x + (Math.random() - 0.5) * 100,
                y: boss.y + 40,
                w: type.w * SHIP_SCALE, h: type.h * SHIP_SCALE,
                hp: 1, maxHp: 1,
                speed: 100, score: 100,
                sprite: type.sprite,
                typeIdx: 0,
                fireRate: 0,
                fireTimer: 0,
                time: 0,
                movePattern: 0,
                alive: true,
            };
            game.enemies.push(minion);
        }
    }
}

const POWERUP_TYPES = [
    { id: 'weapon', sprite: 'spaceParts_001', color: '#ff6644', label: '武器升级' },
    { id: 'shield', sprite: 'spaceParts_003', color: '#44aaff', label: '护盾' },
    { id: 'health', sprite: 'spaceParts_005', color: '#44ff66', label: '修复' },
    { id: 'speed', sprite: 'spaceParts_002', color: '#ffdd44', label: '加速' },
    { id: 'bomb', sprite: 'spaceMissiles_012', color: '#44ff44', label: '炸弹' },
];

function spawnPowerup(x, y) {
    const type = POWERUP_TYPES[Math.floor(Math.random() * POWERUP_TYPES.length)];
    game.powerups.push({
        x: x, y: y,
        vx: (Math.random() - 0.5) * 30,
        vy: 40 + Math.random() * 20,
        type: type,
        time: 0,
        w: 20, h: 20,
    });
}

function spawnBombPowerup(x, y) {
    const type = { id: 'bomb', sprite: 'spaceMissiles_012', color: '#44ff44', label: '炸弹' };
    game.powerups.push({
        x: x, y: y,
        vx: (Math.random() - 0.5) * 30,
        vy: 40 + Math.random() * 20,
        type: type,
        time: 0,
        w: 20, h: 20,
    });
}

function updatePowerups(dt) {
    for (let i = game.powerups.length - 1; i >= 0; i--) {
        const p = game.powerups[i];
        p.time += dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.x += Math.sin(p.time * 3) * 15 * dt;

        if (p.y > H + 20) {
            game.powerups.splice(i, 1);
        }
    }
}

function collectPowerup(pu) {
    playSound('powerup');
    switch (pu.type.id) {
        case 'weapon':
            game.weaponLevel = Math.min(2, game.weaponLevel + 1);
            showMessage('武器升级!', '#ff6644');
            break;
        case 'shield':
            game.shieldActive = true;
            game.shieldTimer = 8;
            showMessage('护盾激活!', '#44aaff');
            break;
        case 'health':
            game.lives = Math.min(MAX_LIVES, game.lives + 1);
            showMessage('生命+1', '#44ff66');
            break;
        case 'speed':
            game.player.speed = PLAYER_SPEED * 1.5;
            game.speedPowerupTimer = 5;
            showMessage('加速!', '#ffdd44');
            break;
        case 'bomb':
            game.bombs = Math.min(MAX_BOMBS, game.bombs + 1);
            showMessage('炸弹 +1', '#44ff44');
            break;
    }
}

// --- Particles ---
function spawnExplosion(x, y, count, color1, color2) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 50 + Math.random() * 150;
        const colors = [color1 || '#ff6644', color2 || '#ffaa00', '#ff4400', '#ffdd44', '#fff'];
        game.particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 0.3 + Math.random() * 0.6,
            maxLife: 0.3 + Math.random() * 0.6,
            size: 2 + Math.random() * 4,
            color: colors[Math.floor(Math.random() * colors.length)],
        });
    }
}

function spawnDebris(x, y, sprite) {
    for (let i = 0; i < 5; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 30 + Math.random() * 80;
        game.particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 0.5 + Math.random() * 0.8,
            maxLife: 0.5 + Math.random() * 0.8,
            size: 3 + Math.random() * 5,
            color: '#aaa',
            isDebris: true,
            debrisSprite: sprite,
            rotation: Math.random() * Math.PI * 2,
            rotSpeed: (Math.random() - 0.5) * 4,
        });
    }
}

function spawnScorePopup(x, y, score) {
    game.particles.push({
        x: x, y: y,
        vx: 0,
        vy: -40,
        life: 1.0,
        maxLife: 1.0,
        size: 0,
        color: '#ffdd44',
        isText: true,
        text: '+' + score,
    });
}

function updateParticles(dt) {
    for (let i = game.particles.length - 1; i >= 0; i--) {
        const p = game.particles[i];
        p.life -= dt;
        if (p.life <= 0) {
            game.particles.splice(i, 1);
            continue;
        }
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        if (p.isDebris) {
            p.rotation += p.rotSpeed * dt;
        }
    }
}

function drawParticles() {
    for (const p of game.particles) {
        const alpha = p.life / p.maxLife;
        ctx.globalAlpha = alpha;
        if (p.isText) {
            ctx.fillStyle = p.color;
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(p.text, p.x, p.y);
        } else if (p.isDebris) {
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rotation);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
            ctx.restore();
        } else {
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * (0.5 + alpha * 0.5), 0, Math.PI * 2);
            ctx.fill();
        }
    }
    ctx.globalAlpha = 1;
}

// --- Collision ---
function rectCollide(a, b) {
    return a.x - a.w/2 < b.x + b.w/2 &&
           a.x + a.w/2 > b.x - b.w/2 &&
           a.y - a.h/2 < b.y + b.h/2 &&
           a.y + a.h/2 > b.y - b.h/2;
}

function detonateBomb() {
    if (game.bombs <= 0 || game.state !== 'playing') return;
    game.bombs--;

    for (const e of game.enemies) {
        if (e.alive) {
            game.score += e.score;
            spawnScorePopup(e.x, e.y - 20, e.score);
            if (e.isBoss) {
                game.bossActive = false;
                for (let k = 0; k < 3; k++) {
                    spawnPowerup(e.x + (Math.random() - 0.5) * 60, e.y);
                }
            }
            spawnExplosion(e.x, e.y, e.isBoss ? 30 : 12, '#ff6644', '#ffaa00');
        }
    }
    game.enemies = [];

    for (const b of game.enemyBullets) {
        spawnExplosion(b.x, b.y, 3, '#ff4444', '#ff8844');
    }
    game.enemyBullets = [];

    spawnExplosion(W/2, H/2, 80, '#44ff44', '#88ff88');
    spawnExplosion(W/2, H/2, 60, '#ffffff', '#44ff44');
    game.screenFlash = 0.3;

    playSound('explosion');
    setTimeout(() => playSound('explosion'), 100);

    showMessage('炸弹!', '#44ff44');
}

function checkCollisions() {
    const p = game.player;
    if (!p || !p.alive) return;

    // Player bullets vs enemies
    for (let bi = game.bullets.length - 1; bi >= 0; bi--) {
        const b = game.bullets[bi];
        let bulletUsed = false;

        for (let ei = game.enemies.length - 1; ei >= 0; ei--) {
            const e = game.enemies[ei];
            if (!e.alive) continue;

            if (rectCollide(
                { x: b.x, y: b.y, w: b.w, h: b.h },
                { x: e.x, y: e.y, w: e.w, h: e.h }
            )) {
                e.hp -= b.damage;
                bulletUsed = true;
                spawnExplosion(b.x, b.y, 3, '#ffaa44', '#ffdd44');

                if (e.hp <= 0) {
                    e.alive = false;
                    const score = e.score * (1 + game.combo * 0.1);
                    game.score += Math.floor(score);
                    game.combo++;
                    game.comboTimer = 2.0;

                    spawnExplosion(e.x, e.y, e.isBoss ? 40 : 15, '#ff6644', '#ffaa00');
                    spawnScorePopup(e.x, e.y - 20, Math.floor(score));
                    playSound('explosion');

                    if (e.isBoss) {
                        game.bossActive = false;
                        game.screenShake = 0.5;
                        // Boss drops multiple powerups
                        for (let k = 0; k < 3; k++) {
                            spawnPowerup(e.x + (Math.random() - 0.5) * 60, e.y);
                        }
                    } else {
                        if (Math.random() < POWERUP_DROP_CHANCE) {
                            spawnPowerup(e.x, e.y);
                        }
                        if (Math.random() < BOMB_DROP_CHANCE) {
                            spawnBombPowerup(e.x, e.y);
                        }
                    }
                } else {
                    spawnExplosion(b.x, b.y, 2, '#ffaa44', '#ffdd44');
                }

                if (bulletUsed) {
                    game.bullets.splice(bi, 1);
                    break;
                }
            }
        }
    }

    // Enemy bullets vs player
    if (game.invincibleTimer <= 0) {
        let playerHitThisFrame = false;
        for (let bi = game.enemyBullets.length - 1; bi >= 0; bi--) {
            const b = game.enemyBullets[bi];
            if (rectCollide(
                { x: b.x, y: b.y, w: b.w, h: b.h },
                { x: p.x, y: p.y, w: p.w - 10, h: p.h - 10 }
            )) {
                game.enemyBullets.splice(bi, 1);
                playerHit();
                playerHitThisFrame = true;
                break;
            }
        }

        // Enemies vs player (skip if already hit this frame)
        if (!playerHitThisFrame && game.invincibleTimer <= 0) {
            for (const e of game.enemies) {
                if (!e.alive) continue;
                if (rectCollide(
                    { x: p.x, y: p.y, w: p.w - 10, h: p.h - 10 },
                    { x: e.x, y: e.y, w: e.w, h: e.h }
                )) {
                    playerHit();
                    if (e.isBoss) break;
                    e.hp -= 3;
                    if (e.hp <= 0) {
                        e.alive = false;
                        game.score += e.score;
                        spawnExplosion(e.x, e.y, 15, '#ff6644', '#ffaa00');
                    }
                    break;
                }
            }
        }
    }

    // Powerups vs player
    for (let i = game.powerups.length - 1; i >= 0; i--) {
        const pu = game.powerups[i];
        if (rectCollide(
            { x: p.x, y: p.y, w: p.w, h: p.h },
            { x: pu.x, y: pu.y, w: pu.w, h: pu.h }
        )) {
            collectPowerup(pu);
            game.powerups.splice(i, 1);
        }
    }
}

function playerHit() {
    if (game.shieldActive) {
        game.shieldActive = false;
        game.shieldTimer = 0;
        spawnExplosion(game.player.x, game.player.y, 20, '#44aaff', '#88ddff');
        playSound('explosion');
        return;
    }

    if (game.invincibleTimer > 0) return;

    if (game.weaponLevel > 0) {
        game.weaponLevel--;
        showMessage('火力下降!', '#ff6644');
    }

    game.lives--;
    game.invincibleTimer = INVINCIBLE_TIME;
    game.combo = 0;
    game.screenShake = 0.2;
    spawnExplosion(game.player.x, game.player.y, 20, '#ff6644', '#ffaa00');
    playSound('explosion');

    if (game.lives <= 0) {
        game.player.alive = false;
        spawnExplosion(game.player.x, game.player.y, 50, '#ff4400', '#ffdd00');
        game.pendingGameOver = true;
        game.pendingGameOverTimer = 1.0;
    }
}

// --- Wave system ---
function startWave() {
    game.wave++;
    game.enemiesSpawned = 0;
    game.enemiesRemaining = 0;
    game.spawnTimer = 0;

    // Check for boss wave
    if (game.wave % BOSS_WAVE_INTERVAL === 0 && game.wave > 0) {
        showBossWarning();
        return;
    }

    game.maxEnemiesPerWave = Math.min(30, 6 + game.wave * 2);
    game.enemiesRemaining = game.maxEnemiesPerWave;
    game.spawnTimer = 0.5;

    const baseDifficulty = 1 + Math.floor(game.wave / 2);
    if (game.wave % BOSS_WAVE_INTERVAL === 1 && game.wave > 1) {
        game.difficulty = baseDifficulty + 2;
    } else {
        game.difficulty = baseDifficulty;
    }

    showMessage('第 ' + game.wave + ' 波', '#88ccff');
}

function showBossWarning() {
    document.getElementById('screen-levelup').classList.remove('hidden');
    document.getElementById('boss-wave-text').textContent = '第 ' + game.wave + ' 波 BOSS 来袭!';
}

function startBossWave() {
    playSound('boss');
    document.getElementById('screen-levelup').classList.add('hidden');
    game.enemiesRemaining = 0;
    spawnBoss(game.wave);
}

function updateWaves(dt) {
    if (game.bossActive) return;

    if (game.enemiesRemaining > 0) {
        game.spawnTimer -= dt;
        if (game.spawnTimer <= 0) {
            const spawnCount = Math.min(3, game.enemiesRemaining);
            const formationSize = Math.min(5, game.enemiesRemaining);
            if (Math.random() < 0.3 && game.enemiesRemaining >= 3) {
                spawnEnemyFormation(formationSize, game.wave);
                game.enemiesRemaining -= formationSize;
            } else {
                for (let i = 0; i < spawnCount; i++) {
                    spawnEnemy();
                }
                game.enemiesRemaining -= spawnCount;
            }
            game.spawnTimer = Math.max(0.3, 1.5 - game.wave * 0.05);
        }
    } else if (game.enemies.length === 0 && !game.bossActive) {
        // Wave complete
        game.waveTimer += game.delta;
        if (game.waveTimer > 1.5) {
            game.waveTimer = 0;
            startWave();
        }
    }
}

function gameOver() {
    game.state = 'gameover';
    document.getElementById('final-score').textContent = '得分: ' + Math.floor(game.score);
    document.getElementById('final-wave').textContent = '第 ' + game.wave + ' 波';
    document.getElementById('screen-gameover').classList.remove('hidden');
}

    }

    ctx.fillStyle = '#ff8844';
    ctx.font = '14px Arial';
    ctx.fillText('火力: ' + (game.weaponLevel + 1), 15, 75);

    // Shield indicator
    if (game.shieldActive) {
        ctx.fillStyle = '#44aaff';
        ctx.font = '14px Arial';
        ctx.textAlign = 'left';
        ctx.fillText('护盾: ' + game.shieldTimer.toFixed(1) + 's', 15, 92);
    }

    // Bomb count
    ctx.fillStyle = '#44ff44';
    ctx.font = 'bold 16px Arial';
    ctx.textAlign = 'left';
    ctx.fillText('BOMB x ' + game.bombs, 15, 112);

    if (game.combo > 1) {
        ctx.textAlign = 'center';
        ctx.fillStyle = '#ffdd44';
        ctx.font = 'bold 16px Arial';
        ctx.fillText('COMBO x' + game.combo, W / 2, 50);

    // Message
    if (messageTimer > 0) {
        const alpha = Math.min(1, messageTimer);
        ctx.globalAlpha = alpha;
        ctx.textAlign = 'center';
        ctx.fillStyle = messageColor;
        ctx.font = 'bold 28px Arial';
        ctx.fillText(messageText, W / 2, H / 2 - 60);
        ctx.globalAlpha = 1;
    }

    // Boss HP bar
    for (const e of game.enemies) {
        if (e.isBoss && e.alive) {
            const barW = 300;
            const barH = 12;
            const barX = (W - barW) / 2;
            const barY = 110;
            const hpRatio = e.hp / e.maxHp;

            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(barX - 2, barY - 2, barW + 4, barH + 4);

            ctx.fillStyle = '#333';
            ctx.fillRect(barX, barY, barW, barH);

            const grad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
            if (hpRatio > 0.5) {
                grad.addColorStop(0, '#ff4444');
                grad.addColorStop(1, '#ff8844');
            } else if (hpRatio > 0.25) {
                grad.addColorStop(0, '#ff6600');
                grad.addColorStop(1, '#ffaa00');
            } else {
                grad.addColorStop(0, '#ff0000');
                grad.addColorStop(1, '#ff4400');
            }
            ctx.fillStyle = grad;
            ctx.fillRect(barX, barY, barW * hpRatio, barH);

            ctx.strokeStyle = '#ff4444';
            ctx.lineWidth = 1;
            ctx.strokeRect(barX, barY, barW, barH);

            ctx.textAlign = 'center';
            ctx.fillStyle = '#fff';
            ctx.font = '12px Arial';
            ctx.fillText('BOSS', W/2, barY - 5);
        }
    }
}

// --- Message timer update ---
function updateMessage(dt) {
    if (messageTimer > 0) {
        messageTimer -= dt;
    }
}

// --- Screen shake ---
function updateScreenShake(dt) {
    if (game.screenShake > 0) {
        game.screenShake -= dt;
    }
}

// --- Main render ---
function render() {
    ctx.save();

    // Screen shake
    if (game.screenShake > 0) {
        const intensity = game.screenShake * 8;
        ctx.translate(
            (Math.random() - 0.5) * intensity,
            (Math.random() - 0.5) * intensity
        );
    }

    // Background
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(-10, -10, W + 20, H + 20);

    // Stars
    drawStars();

    if (game.state === 'playing' || game.state === 'gameover' || game.state === 'paused') {
        // Powerups
        for (const pu of game.powerups) {
            const glow = Math.sin(pu.time * 4) * 0.3 + 0.7;
            ctx.globalAlpha = glow;
            ctx.fillStyle = pu.type.color;
            ctx.beginPath();
            ctx.arc(pu.x, pu.y, 14, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;

            drawSpriteCentered(pu.type.sprite, pu.x, pu.y, SHIP_SCALE * 0.5);
        }

        // Player
        const p = game.player;
        if (p && p.alive) {
            if (game.invincibleTimer > 0 && Math.floor(game.invincibleTimer * 10) % 2 === 0) {
                ctx.globalAlpha = 0.4;
            }
            // Shield glow
            if (game.shieldActive) {
                ctx.strokeStyle = 'rgba(68,170,255,' + (0.3 + Math.sin(Date.now() * 0.005) * 0.15) + ')';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(p.x, p.y, Math.max(p.w, p.h) * 0.7, 0, Math.PI * 2);
                ctx.stroke();
            }
            drawSpriteCentered(p.sprite, p.x, p.y, SHIP_SCALE);
            ctx.globalAlpha = 1;
        }

        // Bullets (batched shadow)
        if (game.bullets.length > 0) {
            ctx.fillStyle = '#44ddff';
            ctx.shadowColor = '#44ddff';
            ctx.shadowBlur = 8;
            for (const b of game.bullets) {
                ctx.fillRect(b.x - 2, b.y - b.h/2, 4, b.h);
            }
            ctx.shadowBlur = 0;
        }

        // Enemy bullets (batched shadow)
        if (game.enemyBullets.length > 0) {
            ctx.fillStyle = '#ff4444';
            ctx.shadowColor = '#ff4444';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            for (const b of game.enemyBullets) {
                ctx.moveTo(b.x + b.w/2, b.y);
                ctx.arc(b.x, b.y, b.w/2, 0, Math.PI * 2);
            }
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        // Enemies
        for (const e of game.enemies) {
            if (!e.alive) continue;
            drawSpriteCentered(e.sprite, e.x, e.y, SHIP_SCALE);

            // Enemy HP bar (for tougher enemies)
            if (e.maxHp > 1 && !e.isBoss) {
                const barW = e.w * 0.8;
                const barH = 4;
                const barX = e.x - barW / 2;
                const barY = e.y - e.h / 2 - 8;
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(barX, barY, barW, barH);
                ctx.fillStyle = e.hp / e.maxHp > 0.5 ? '#44ff66' : '#ff6644';
                ctx.fillRect(barX, barY, barW * (e.hp / e.maxHp), barH);
            }
        }

        // Particles
        drawParticles();

        // HUD
        drawHUD();

        // Screen flash overlay
        if (game.screenFlash > 0) {
            ctx.fillStyle = 'rgba(255,255,255,' + Math.min(1, game.screenFlash * 3) + ')';
            ctx.fillRect(-10, -10, W + 20, H + 20);
        }
    }

    ctx.restore();
}

// --- Touch controls ---
function setupTouch() {
    const joystick = document.getElementById('touch-joystick');
    const knob = document.getElementById('touch-joystick-knob');
    const fireBtn = document.getElementById('touch-fire');

    game.isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
    if (game.isMobile) {
        document.getElementById('touch-controls').style.display = 'block';
    }

    let joyId = null;
    joystick.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const t = e.changedTouches[0];
        joyId = t.identifier;
        game.touchActive = true;
    });
    joystick.addEventListener('touchmove', (e) => {
        e.preventDefault();
        for (const t of e.changedTouches) {
            if (t.identifier === joyId) {
                const rect = joystick.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                const dx = t.clientX - cx;
                const dy = t.clientY - cy;
                const dist = Math.sqrt(dx*dx + dy*dy);
                const maxDist = rect.width / 2;

                const clampedDist = Math.min(dist, maxDist);
                const angle = Math.atan2(dy, dx);
                const knobX = Math.cos(angle) * clampedDist;
                const knobY = Math.sin(angle) * clampedDist;
                knob.style.transform = 'translate(-50%,-50%) translate(' + knobX + 'px,' + knobY + 'px)';

                game.touchDirX = dx / maxDist;
                game.touchDirY = dy / maxDist;
                game.touchActive = true;
            }
        }
    });
    joystick.addEventListener('touchend', (e) => {
        for (const t of e.changedTouches) {
            if (t.identifier === joyId) {
                joyId = null;
                knob.style.transform = 'translate(-50%,-50%) translate(0,0)';
                game.touchActive = false;
                game.touchDirX = 0;
                game.touchDirY = 0;
            }
        }
    });
    joystick.addEventListener('touchcancel', () => {
        joyId = null;
        knob.style.transform = 'translate(-50%,-50%) translate(0,0)';
        game.touchActive = false;
        game.touchDirX = 0;
        game.touchDirY = 0;
    });

    // Fire button as touch area
    fireBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        game.keys['Space'] = true;
    });
    fireBtn.addEventListener('touchend', (e) => {
        game.keys['Space'] = false;
    });
    fireBtn.addEventListener('touchcancel', () => {
        game.keys['Space'] = false;
    });

    const bombBtn = document.getElementById('touch-bomb');
    bombBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        detonateBomb();
    });
}

// --- Keyboard input ---
function setupKeyboard() {
    document.addEventListener('keydown', (e) => {
        game.keys[e.code] = true;
        if (e.code === 'Escape' || e.code === 'KeyP') {
            if (game.state === 'playing') {
                togglePause();
            } else if (game.state === 'paused') {
                togglePause();
            }
        }
        if (e.code === 'KeyE' || e.code === 'KeyB') {
            detonateBomb();
            e.preventDefault();
        }
        if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','KeyW','KeyA','KeyS','KeyD','KeyJ','KeyK','KeyP','KeyE','KeyB','Escape'].includes(e.code)) {
            e.preventDefault();
        }
    });
    document.addEventListener('keyup', (e) => {
        game.keys[e.code] = false;
    });
}

function togglePause() {
    if (game.state === 'playing') {
        game.state = 'paused';
        game.paused = true;
        document.getElementById('screen-pause').classList.remove('hidden');
    } else if (game.state === 'paused') {
        game.state = 'playing';
        game.paused = false;
        document.getElementById('screen-pause').classList.add('hidden');
    }
}

// --- Button handlers ---
function setupUI() {
    document.getElementById('btn-start').addEventListener('click', startGame);
    document.getElementById('btn-restart').addEventListener('click', startGame);
    document.getElementById('btn-menu').addEventListener('click', () => {
        document.getElementById('screen-gameover').classList.add('hidden');
        document.getElementById('screen-title').classList.remove('hidden');
        game.state = 'menu';
    });
    document.getElementById('btn-resume').addEventListener('click', togglePause);
    document.getElementById('btn-quit').addEventListener('click', () => {
        game.state = 'menu';
        game.paused = false;
        document.getElementById('screen-pause').classList.add('hidden');
        document.getElementById('screen-title').classList.remove('hidden');
    });
    document.getElementById('btn-boss-ready').addEventListener('click', startBossWave);
    document.getElementById('btn-controls-help').addEventListener('click', () => {
        document.getElementById('screen-title').classList.add('hidden');
        document.getElementById('screen-controls').classList.remove('hidden');
    });
    document.getElementById('btn-controls-back').addEventListener('click', () => {
        document.getElementById('screen-controls').classList.add('hidden');
        document.getElementById('screen-title').classList.remove('hidden');
    });
}

function startGame() {
    // Reset game state
    document.getElementById('screen-title').classList.add('hidden');
    document.getElementById('screen-gameover').classList.add('hidden');
    document.getElementById('screen-levelup').classList.add('hidden');
    document.getElementById('screen-pause').classList.add('hidden');

    game.state = 'playing';
    game.score = 0;
    game.lives = MAX_LIVES;
    game.wave = 0;
    game.difficulty = 1;
    game.combo = 0;
    game.comboTimer = 0;
    game.weaponLevel = 0;
    game.shieldActive = false;
    game.shieldTimer = 0;
    game.bombs = 0;
    game.screenFlash = 0;
    game.invincibleTimer = 0;
    game.bossActive = false;
    game.bossWarningShown = false;
    game.screenShake = 0;
    game.waveTimer = 0;
    game.speedPowerupTimer = 0;
    game.pendingGameOver = false;
    game.pendingGameOverTimer = 0;
    game.touchDirX = 0;
    game.touchDirY = 0;
    game.enemies = [];
    game.bullets = [];
    game.enemyBullets = [];
    game.particles = [];
    game.powerups = [];
    game.player = createPlayer();
    game.fireRate = 0.25;
    messageTimer = 0;

    initStars();
    startWave();
}

// --- Loading ---
function loadAssets(callback) {
    const loadingBar = document.getElementById('loading-bar');
    // Sprite data is inlined as SPRITES_DATA — no fetch needed
    Object.assign(SPRITES, SPRITES_DATA);
    loadingBar.style.width = '50%';

    const assetDirs = [
        'assets/苍穹射击/',
        '../assets/苍穹射击/',
        '../../assets/苍穹射击/',
    ];
    let dirIndex = 0;
    function tryLoadSheet() {
        if (dirIndex >= assetDirs.length) {
            console.error('All spritesheet paths failed');
            loadingBar.style.width = '100%';
            setTimeout(callback, 300);
            return;
        }
        const dir = assetDirs[dirIndex++];
        spritesheet.onload = () => {
            loadingBar.style.width = '100%';
            setTimeout(callback, 300);
        };
        spritesheet.onerror = () => {
            console.warn('Failed spritesheet at:', dir);
            tryLoadSheet();
        };
        spritesheet.src = dir + 'spritesheet.png';
    }
    tryLoadSheet();
}

// --- Game loop ---
function gameLoop(timestamp) {
    if (!game.lastTime) game.lastTime = timestamp;
    const dt = Math.min((timestamp - game.lastTime) / 1000, 0.05);
    game.delta = dt;
    game.lastTime = timestamp;

    if (game.state === 'playing' && !game.paused) {
        updateStars(dt);
        updatePlayer(dt);
        updateBullets(dt);
        updateEnemies(dt);

        // Update boss logic
        for (const e of game.enemies) {
            if (e.isBoss && e.alive && !e.entering) {
                updateBoss(e, dt);
            }
        }

        updateWaves(dt);
        updatePowerups(dt);
        updateParticles(dt);
        updateMessage(dt);
        updateScreenShake(dt);
        if (game.screenFlash > 0) game.screenFlash -= dt * 3;
        checkCollisions();

        // Pending game-over timer
        if (game.pendingGameOver) {
            game.pendingGameOverTimer -= dt;
            if (game.pendingGameOverTimer <= 0) {
                game.pendingGameOver = false;
                gameOver();
            }
        }
    } else if (game.state === 'paused') {
        // Still render when paused
    }

    render();
    requestAnimationFrame(gameLoop);
}

// --- Init ---
function init() {
    setupKeyboard();
    setupTouch();
    setupUI();

    loadAssets(() => {
        document.getElementById('loading-screen').style.display = 'none';
        initStars();
        // Hide loading, show title
        requestAnimationFrame(gameLoop);
    });
}

init();

})();
</script>
