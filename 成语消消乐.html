<body>
<canvas id="gameCanvas"></canvas>
<script>
// ============================================================
// 成语消消乐 - Idiom Match & Clear
// 核心玩法：从字盘选字填成语，消除得分，关卡递进
// ============================================================

// ==================== 常量定义 ====================
const CONFIG = {
CANVAS_BG: '#1a1a2e',
GRID_COLS: 6,
GRID_ROWS: 6,
CELL_SIZE: 60,
CELL_GAP: 8,
START_TIME: 90,
TIME_BONUS: 10,
TIME_PENALTY: 5,
SCORE_PER_IDIOM: 100,
COMBO_MULTIPLIER: 0.5,
MAX_COMBO: 10,
LEVELS: [
{ target: 5, time: 90, blanks: 1, desc: '入门' },
{ target: 8, time: 85, blanks: 1, desc: '初级' },
{ target: 12, time: 80, blanks: 1, desc: '中级' },
{ target: 16, time: 75, blanks: 2, desc: '高级' },
{ target: 20, time: 70, blanks: 2, desc: '大师' },
{ target: 25, time: 65, blanks: 2, desc: '宗师' },
{ target: 30, time: 60, blanks: 2, desc: '传说' },
{ target: 40, time: 55, blanks: 2, desc: '神话' },
{ target: 50, time: 50, blanks: 2, desc: '至尊' },
{ target: 999, time: 45, blanks: 2, desc: '无尽' }
],
COLORS: {
primary: '#667eea',
secondary: '#764ba2',
success: '#4ade80',
danger: '#ef4444',
warning: '#f59e0b',
gold: '#ffd700',
text: '#ffffff',
textDim: '#94a3b8',
cellBg: 'rgba(255,255,255,0.1)',
cellHover: 'rgba(255,255,255,0.2)',
cellSelected: 'rgba(102,126,234,0.6)',
cellCorrect: 'rgba(74,222,128,0.4)',
cellWrong: 'rgba(239,68,68,0.4)',
blankBg: 'rgba(255,255,255,0.15)',
blankFilled: 'rgba(74,222,128,0.3)',
}
};

// ==================== 成语数据库 (120+) ====================
const IDIOM_DB = [
'一心一意','三心二意','四面八方','五颜六色','七上八下',
'九牛一毛','十全十美','百发百中','千军万马','万水千山',
'花好月圆','风和日丽','山清水秀','鸟语花香','春暖花开',
'秋高气爽','冰天雪地','骄阳似火','电闪雷鸣','风雨交加',
'画龙点睛','守株待兔','亡羊补牢','掩耳盗铃','刻舟求剑',
'叶公好龙','愚公移山','精卫填海','卧薪尝胆','破釜沉舟',
'心旷神怡','心花怒放','心惊胆战','心急如焚','心满意足',
'心心相印','心领神会','心照不宣','心悦诚服','心血来潮',
'鹤立鸡群','龙飞凤舞','虎头蛇尾','狐假虎威','狗急跳墙',
'狼吞虎咽','鸡飞蛋打','马到成功','牛刀小试','鼠目寸光',
'一举两得','三长两短','五湖四海','六神无主','八仙过海',
'九死一生','十拿九稳','百里挑一','千变万化','万众一心',
'大公无私','光明正大','堂堂正正','兢兢业业','勤勤恳恳',
'踏踏实实','认认真真','老老实实','诚心诚意','真心实意',
'天长地久','日月如梭','光阴似箭','岁月如流','白驹过隙',
'稍纵即逝','瞬息万变','一日千里','地久天长','年深日久',
'情投意合','志同道合','相濡以沫','举案齐眉','白头偕老',
'百年好合','永结同心','一见钟情','青梅竹马','两小无猜',
'学富五车','博古通今','才高八斗','学贯中西','满腹经纶',
'博学多才','见多识广','文武双全','出类拔萃','鹤立鸡群',
'喜出望外','喜笑颜开','喜气洋洋','欢天喜地','欢欣鼓舞',
'皆大欢喜','笑逐颜开','眉开眼笑','捧腹大笑','嫣然一笑',
'高山流水','阳春白雪','下里巴人','曲高和寡','雅俗共赏',
'妙笔生花','笔走龙蛇','入木三分','力透纸背','龙飞凤舞',
'左右逢源','得心应手','游刃有余','驾轻就熟','信手拈来',
'天衣无缝','完美无缺','十全十美','无懈可击','尽善尽美',
'柳暗花明','峰回路转','豁然开朗','茅塞顿开','恍然大悟',
'雪中送炭','锦上添花','如虎添翼','画龙点睛','精益求精'
];

// ==================== 游戏状态 ====================
var canvas, ctx;
var W, H, scale;
var G = {
state: 'menu', // menu, playing, paused, gameover, levelup
score: 0,
highScore: 0,
level: 0,
combo: 0,
maxCombo: 0,
idiomsCleared: 0,
timeLeft: 90,
currentIdiom: '',
idiomChars: [],
blanks: [],
blankPositions: [],
selectedChar: '',
grid: [],
gridSize: 0,
cellSize: 0,
gridOffsetX: 0,
gridOffsetY: 0,
particles: [],
floatTexts: [],
shakeTimer: 0,
shakeIntensity: 0,
lastTime: 0,
deltaTime: 0,
animFrame: 0,
hintTimer: 0,
hintChar: '',
cellAnimations: [],
};

// ==================== 初始化 ====================
function init() {
canvas = document.getElementById('gameCanvas');
ctx = canvas.getContext('2d');
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
canvas.addEventListener('click', handleClick);
canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
window.addEventListener('keydown', handleKeyDown);
loadHighScore();
requestAnimationFrame(gameLoop);
}

function resizeCanvas() {
var dpr = window.devicePixelRatio || 1;
W = window.innerWidth;
H = window.innerHeight;
canvas.width = W * dpr;
canvas.height = H * dpr;
canvas.style.width = W + 'px';
canvas.style.height = H + 'px';
ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
scale = Math.min(W / 414, H / 736);
scale = Math.max(0.6, Math.min(scale, 1.5));
}

// ==================== 游戏循环 ====================
function gameLoop(timestamp) {
G.deltaTime = Math.min((timestamp - G.lastTime) / 1000, 0.05);
G.lastTime = timestamp;
G.animFrame++;
update();
render();
requestAnimationFrame(gameLoop);
}

// ==================== 更新逻辑 ====================
function update() {
if (G.state === 'playing') {
updateTimer();
updateParticles();
updateFloatTexts();
updateCellAnimations();
updateShake();
updateHint();
} else if (G.state === 'menu' || G.state === 'gameover' || G.state === 'levelup') {
updateParticles();
updateFloatTexts();
}
}

function updateTimer() {
G.timeLeft -= G.deltaTime;
if (G.timeLeft <= 0) {
G.timeLeft = 0;
gameOver();
}
}

function updateParticles() {
for (var i = G.particles.length - 1; i >= 0; i--) {
var p = G.particles[i];
p.x += p.vx * G.deltaTime;
p.y += p.vy * G.deltaTime;
p.vy += 200 * G.deltaTime;
p.life -= G.deltaTime;
p.alpha = Math.max(0, p.life / p.maxLife);
p.size *= 0.99;
if (p.life <= 0) G.particles.splice(i, 1);
}
}

function updateFloatTexts() {
for (var i = G.floatTexts.length - 1; i >= 0; i--) {
var ft = G.floatTexts[i];
ft.y -= 60 * G.deltaTime;
ft.life -= G.deltaTime;
ft.alpha = Math.max(0, ft.life / ft.maxLife);
if (ft.life <= 0) G.floatTexts.splice(i, 1);
}
}

function updateCellAnimations() {
for (var i = G.cellAnimations.length - 1; i >= 0; i--) {
var anim = G.cellAnimations[i];
anim.timer -= G.deltaTime;
anim.progress = 1 - Math.max(0, anim.timer / anim.duration);
if (anim.timer <= 0) G.cellAnimations.splice(i, 1);
}
}

function updateShake() {
if (G.shakeTimer > 0) {
G.shakeTimer -= G.deltaTime;
G.shakeIntensity *= 0.9;
}
}

function updateHint() {
if (G.hintTimer > 0) {
G.hintTimer -= G.deltaTime;
if (G.hintTimer <= 0) G.hintChar = '';
}
}

// ==================== 游戏逻辑 ====================
function startGame() {
G.state = 'playing';
G.score = 0;
G.level = 0;
G.combo = 0;
G.maxCombo = 0;
G.idiomsCleared = 0;
G.particles = [];
G.floatTexts = [];
G.cellAnimations = [];
startLevel();
}

function startLevel() {
var lvl = CONFIG.LEVELS[Math.min(G.level, CONFIG.LEVELS.length - 1)];
G.timeLeft = lvl.time;
selectNewIdiom(lvl.blanks);
generateGrid();
}

function selectNewIdiom(blanks) {
var idiom = IDIOM_DB[Math.floor(Math.random() * IDIOM_DB.length)];
G.currentIdiom = idiom;
G.idiomChars = idiom.split('');
G.blanks = [];
G.blankPositions = [];
var positions = [0, 1, 2, 3];
shuffleArray(positions);
for (var i = 0; i < blanks; i++) {
G.blankPositions.push(positions[i]);
G.blanks.push(G.idiomChars[positions[i]]);
}
G.blankPositions.sort();
G.selectedChar = '';
G.hintChar = '';
G.hintTimer = 0;
}

function generateGrid() {
var allChars = [];
for (var i = 0; i < G.blanks.length; i++) {
allChars.push(G.blanks[i]);
}
var extraChars = IDIOM_DB.join('').split('');
shuffleArray(extraChars);
var needed = CONFIG.GRID_COLS * CONFIG.GRID_ROWS - allChars.length;
for (var i = 0; i < needed && i < extraChars.length; i++) {
allChars.push(extraChars[i]);
}
while (allChars.length < CONFIG.GRID_COLS * CONFIG.GRID_ROWS) {
allChars.push(String.fromCharCode(0x4e00 + Math.floor(Math.random() * 0x9e00)));
}
shuffleArray(allChars);
G.grid = [];
for (var r = 0; r < CONFIG.GRID_ROWS; r++) {
G.grid[r] = [];
for (var c = 0; c < CONFIG.GRID_COLS; c++) {
G.grid[r][c] = {
char: allChars[r * CONFIG.GRID_COLS + c],
selected: false,
correct: false,
wrong: false,
animTimer: 0
};
}
}
calculateGridLayout();
}

function calculateGridLayout() {
var totalW = CONFIG.GRID_COLS * (CONFIG.CELL_SIZE + CONFIG.CELL_GAP) - CONFIG.CELL_GAP;
var totalH = CONFIG.GRID_ROWS * (CONFIG.CELL_SIZE + CONFIG.CELL_GAP) - CONFIG.CELL_GAP;
var maxW = W * 0.9;
var maxH = H * 0.4;
var s = Math.min(maxW / totalW, maxH / totalH, 1);
G.cellSize = CONFIG.CELL_SIZE * s;
var gridW = CONFIG.GRID_COLS * (G.cellSize + CONFIG.CELL_GAP * s) - CONFIG.CELL_GAP * s;
var gridH = CONFIG.GRID_ROWS * (G.cellSize + CONFIG.CELL_GAP * s) - CONFIG.CELL_GAP * s;
G.gridOffsetX = (W - gridW) / 2;
G.gridOffsetY = H * 0.45;
}

function handleGridClick(x, y) {
var cs = G.cellSize;
var gap = CONFIG.CELL_GAP * (cs / CONFIG.CELL_SIZE);
for (var r = 0; r < CONFIG.GRID_ROWS; r++) {
for (var c = 0; c < CONFIG.GRID_COLS; c++) {
var cx = G.gridOffsetX + c * (cs + gap);
var cy = G.gridOffsetY + r * (cs + gap);
if (x >= cx && x <= cx + cs && y >= cy && y <= cy + cs) {
selectCell(r, c);
return;
}
}
}
}

function selectCell(r, c) {
var cell = G.grid[r][c];
if (cell.correct) return;
if (G.selectedChar === cell.char) {
G.selectedChar = '';
cell.selected = false;
return;
}
for (var i = 0; i < G.grid.length; i++) {
for (var j = 0; j < G.grid[i].length; j++) {
G.grid[i][j].selected = false;
}
}
G.selectedChar = cell.char;
cell.selected = true;
checkAnswer();
}

function checkAnswer() {
if (!G.selectedChar) return;
var filled = '';
var blankIdx = 0;
for (var i = 0; i < 4; i++) {
if (G.blankPositions.indexOf(i) >= 0) {
filled += G.selectedChar;
blankIdx++;
} else {
filled += G.idiomChars[i];
}
}
if (filled === G.currentIdiom) {
onCorrectAnswer();
} else {
onWrongAnswer();
}
}

function onCorrectAnswer() {
G.combo++;
if (G.combo > G.maxCombo) G.maxCombo = G.combo;
var multiplier = 1 + Math.min(G.combo, CONFIG.MAX_COMBO) * CONFIG.COMBO_MULTIPLIER;
var score = Math.floor(CONFIG.SCORE_PER_IDIOM * multiplier);
G.score += score;
G.idiomsCleared++;
var lvl = CONFIG.LEVELS[Math.min(G.level, CONFIG.LEVELS.length - 1)];
G.timeLeft = Math.min(G.timeLeft + CONFIG.TIME_BONUS, lvl.time + 20);
for (var i = 0; i < G.grid.length; i++) {
for (var j = 0; j < G.grid[i].length; j++) {
if (G.grid[i][j].selected) {
G.grid[i][j].correct = true;
spawnParticles(G.gridOffsetX + j * (G.cellSize + CONFIG.CELL_GAP) + G.cellSize / 2,
G.gridOffsetY + i * (G.cellSize + CONFIG.CELL_GAP) + G.cellSize / 2, CONFIG.COLORS.success, 15);
}
}
}
addFloatText('+' + score + (G.combo > 1 ? ' x' + G.combo : ''), W / 2, H * 0.4, CONFIG.COLORS.gold);
addFloatText('✓ ' + G.currentIdiom, W / 2, H * 0.35, CONFIG.COLORS.success);
setTimeout(function() {
if (G.idiomsCleared >= lvl.target) {
levelUp();
} else {
selectNewIdiom(lvl.blanks);
generateGrid();
}
}, 800);
}

function onWrongAnswer() {
G.combo = 0;
G.timeLeft = Math.max(0, G.timeLeft - CONFIG.TIME_PENALTY);
G.shakeTimer = 0.3;
G.shakeIntensity = 8;
for (var i = 0; i < G.grid.length; i++) {
for (var j = 0; j < G.grid[i].length; j++) {
if (G.grid[i][j].selected) {
G.grid[i][j].wrong = true;
G.grid[i][j].animTimer = 0.5;
}
}
}
addFloatText('-' + CONFIG.TIME_PENALTY + '秒', W / 2, H * 0.4, CONFIG.COLORS.danger);
G.hintChar = G.blanks[0];
G.hintTimer = 3;
setTimeout(function() {
for (var i = 0; i < G.grid.length; i++) {
for (var j = 0; j < G.grid[i].length; j++) {
G.grid[i][j].wrong = false;
G.grid[i][j].selected = false;
}
}
G.selectedChar = '';
}, 500);
}

function levelUp() {
G.level++;
if (G.level >= CONFIG.LEVELS.length) {
gameOver();
return;
}
G.state = 'levelup';
spawnParticles(W / 2, H / 2, CONFIG.COLORS.gold, 50);
}

function continueLevel() {
G.state = 'playing';
startLevel();
}

function gameOver() {
G.state = 'gameover';
if (G.score > G.highScore) {
G.highScore = G.score;
saveHighScore();
}
}

// ==================== 存档 ====================
function loadHighScore() {
try {
var saved = localStorage.getItem('idiomMatch_highScore');
if (saved) G.highScore = parseInt(saved) || 0;
} catch(e) {}
}

function saveHighScore() {
try {
localStorage.setItem('idiomMatch_highScore', G.highScore.toString());
} catch(e) {}
}

// ==================== 特效 ====================
function spawnParticles(x, y, color, count) {
for (var i = 0; i < count; i++) {
var angle = Math.random() * Math.PI * 2;
var speed = 50 + Math.random() * 150;
G.particles.push({
x: x, y: y,
vx: Math.cos(angle) * speed,
vy: Math.sin(angle) * speed - 50,
size: 3 + Math.random() * 5,
color: color,
life: 0.8 + Math.random() * 0.5,
maxLife: 1.3,
alpha: 1
});
}
}

function addFloatText(text, x, y, color) {
G.floatTexts.push({
text: text,
x: x, y: y,
color: color,
life: 1.5,
maxLife: 1.5,
alpha: 1,
size: 24
});
}

// ==================== 渲染 ====================
function render() {
ctx.save();
if (G.shakeTimer > 0) {
ctx.translate(
Math.random() * G.shakeIntensity - G.shakeIntensity / 2,
Math.random() * G.shakeIntensity - G.shakeIntensity / 2
);
}
drawBackground();
if (G.state === 'menu') drawMenu();
else if (G.state === 'playing') drawGame();
else if (G.state === 'paused') drawGame();
else if (G.state === 'gameover') drawGameOver();
else if (G.state === 'levelup') drawLevelUp();
drawParticles();
drawFloatTexts();
ctx.restore();
}

function drawBackground() {
var grad = ctx.createLinearGradient(0, 0, W, H);
grad.addColorStop(0, '#1a1a2e');
grad.addColorStop(0.5, '#16213e');
grad.addColorStop(1, '#0f3460');
ctx.fillStyle = grad;
ctx.fillRect(0, 0, W, H);
for (var i = 0; i < 30; i++) {
var x = (i * 137.5 + G.animFrame * 0.1) % (W + 50) - 25;
var y = (i * 97.3 + G.animFrame * 0.05) % (H + 50) - 25;
ctx.fillStyle = 'rgba(255,255,255,' + (0.02 + Math.sin(G.animFrame * 0.02 + i) * 0.015) + ')';
ctx.beginPath();
ctx.arc(x, y, 1 + Math.sin(G.animFrame * 0.03 + i * 0.5) * 0.5, 0, Math.PI * 2);
ctx.fill();
}
}

function drawMenu() {
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
var titleY = H * 0.25;
ctx.fillStyle = CONFIG.COLORS.gold;
ctx.font = 'bold ' + Math.floor(48 * scale) + 'px "Microsoft YaHei", sans-serif';
ctx.fillText('成语消消乐', W / 2, titleY);
ctx.fillStyle = CONFIG.COLORS.textDim;
ctx.font = Math.floor(16 * scale) + 'px "Microsoft YaHei", sans-serif';
ctx.fillText('选字填成语，消除得分', W / 2, titleY + 40 * scale);
var btnW = 200 * scale;
var btnH = 56 * scale;
var btnX = (W - btnW) / 2;
var btnY = H * 0.45;
drawButton(btnX, btnY, btnW, btnH, '开始游戏', CONFIG.COLORS.primary, CONFIG.COLORS.secondary);
if (G.highScore > 0) {
ctx.fillStyle = CONFIG.COLORS.textDim;
ctx.font = Math.floor(14 * scale) + 'px "Microsoft YaHei", sans-serif';
ctx.fillText('最高分: ' + G.highScore, W / 2, H * 0.58);
}
ctx.fillStyle = CONFIG.COLORS.textDim;
ctx.font = Math.floor(12 * scale) + 'px "Microsoft YaHei", sans-serif';
ctx.fillText('点击开始 | 支持键盘鼠标触屏', W / 2, H * 0.85);
var idioms = IDIOM_DB;
var dispY = H * 0.65;
ctx.fillStyle = 'rgba(255,255,255,0.08)';
ctx.font = Math.floor(11 * scale) + 'px "Microsoft YaHei", sans-serif';
var displayCount = Math.min(12, idioms.length);
var startX = W * 0.1;
var stepX = (W * 0.8) / displayCount;
for (var i = 0; i < displayCount; i++) {
var idx = (Math.floor(G.animFrame * 0.005) + i) % idioms.length;
ctx.fillText(idioms[idx], startX + i * stepX + stepX / 2, dispY + (i % 2) * 20);
}
}

function drawGame() {
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
drawHeader();
drawIdiomDisplay();
drawGrid();
drawHint();
}

function drawHeader() {
var y = 20 * scale;
var fontSize = Math.floor(14 * scale);
ctx.font = fontSize + 'px "Microsoft YaHei", sans-serif';
ctx.textAlign = 'left';
ctx.fillStyle = CONFIG.COLORS.text;
ctx.fillText('分数: ' + G.score, 15, y + 10);
ctx.fillStyle = CONFIG.COLORS.gold;
ctx.fillText('连击: ' + G.combo, 15, y + 30);
ctx.textAlign = 'center';
var lvl = CONFIG.LEVELS[Math.min(G.level, CONFIG.LEVELS.length - 1)];
ctx.fillStyle = CONFIG.COLORS.text;
ctx.fillText('第' + (G.level + 1) + '关 ' + lvl.desc, W / 2, y + 10);
ctx.fillStyle = CONFIG.COLORS.textDim;
ctx.fillText(G.idiomsCleared + '/' + lvl.target, W / 2, y + 30);
ctx.textAlign = 'right';
var timeColor = G.timeLeft > 20 ? CONFIG.COLORS.text : (G.timeLeft > 10 ? CONFIG.COLORS.warning : CONFIG.COLORS.danger);
ctx.fillStyle = timeColor;
ctx.font = 'bold ' + Math.floor(20 * scale) + 'px "Microsoft YaHei", sans-serif';
ctx.fillText(Math.ceil(G.timeLeft) + 's', W - 15, y + 15);
var barW = 100 * scale;
var barH = 6;
var barX = W - 15 - barW;
var barY = y + 30;
ctx.fillStyle = 'rgba(255,255,255,0.1)';
roundRect(ctx, barX, barY, barW, barH, 3);
ctx.fill();
var pct = G.timeLeft / lvl.time;
ctx.fillStyle = timeColor;
roundRect(ctx, barX, barY, barW * pct, barH, 3);
ctx.fill();
}

function drawIdiomDisplay() {
var chars = G.idiomChars;
var charSize = Math.floor(50 * scale);
var gap = Math.floor(10 * scale);
var totalW = 4 * (charSize + gap) - gap;
var startX = (W - totalW) / 2;
var y = H * 0.18;
for (var i = 0; i < 4; i++) {
var cx = startX + i * (charSize + gap);
var isBlank = G.blankPositions.indexOf(i) >= 0;
if (isBlank) {
var filled = false;
if (G.state === 'playing' && G.selectedChar) {
var testIdiom = '';
for (var j = 0; j < 4; j++) {
if (G.blankPositions.indexOf(j) >= 0) testIdiom += G.selectedChar;
else testIdiom += G.idiomChars[j];
}
if (testIdiom === G.currentIdiom) filled = true;
}
var grad = ctx.createLinearGradient(cx, y, cx, y + charSize);
if (filled) {
grad.addColorStop(0, 'rgba(74,222,128,0.4)');
grad.addColorStop(1, 'rgba(74,222,128,0.2)');
} else {
grad.addColorStop(0, 'rgba(255,255,255,0.15)');
grad.addColorStop(1, 'rgba(255,255,255,0.05)');
}
ctx.fillStyle = grad;
roundRect(ctx, cx, y, charSize, charSize, 8);
ctx.fill();
ctx.strokeStyle = filled ? CONFIG.COLORS.success : 'rgba(255,255,255,0.3)';
ctx.lineWidth = 2;
roundRect(ctx, cx, y, charSize, charSize, 8);
ctx.stroke();
if (G.selectedChar && !filled) {
ctx.fillStyle = CONFIG.COLORS.text;
ctx.font = 'bold ' + charSize * 0.7 + 'px "Microsoft YaHei", sans-serif';
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.fillText(G.selectedChar, cx + charSize / 2, y + charSize / 2);
}
ctx.fillStyle = 'rgba(255,255,255,0.3)';
ctx.font = Math.floor(12 * scale) + 'px "Microsoft YaHei", sans-serif';
ctx.textAlign = 'center';
ctx.fillText('?', cx + charSize / 2, y + charSize + 15);
} else {
var grad = ctx.createLinearGradient(cx, y, cx, y + charSize);
grad.addColorStop(0, 'rgba(102,126,234,0.3)');
grad.addColorStop(1, 'rgba(118,75,162,0.3)');
ctx.fillStyle = grad;
roundRect(ctx, cx, y, charSize, charSize, 8);
ctx.fill();
ctx.fillStyle = CONFIG.COLORS.text;
ctx.font = 'bold ' + charSize * 0.7 + 'px "Microsoft YaHei", sans-serif';
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.fillText(chars[i], cx + charSize / 2, y + charSize / 2);
}
}
}

function drawGrid() {
var cs = G.cellSize;
var gap = CONFIG.CELL_GAP * (cs / CONFIG.CELL_SIZE);
for (var r = 0; r < CONFIG.GRID_ROWS; r++) {
for (var c = 0; c < CONFIG.GRID_COLS; c++) {
var cell = G.grid[r][c];
var cx = G.gridOffsetX + c * (cs + gap);
var cy = G.gridOffsetY + r * (cs + gap);
var bgColor = CONFIG.COLORS.cellBg;
if (cell.selected) bgColor = CONFIG.COLORS.cellSelected;
else if (cell.correct) bgColor = CONFIG.COLORS.cellCorrect;
else if (cell.wrong) bgColor = CONFIG.COLORS.cellWrong;
if (cell.wrong && cell.animTimer > 0) {
var shake = Math.sin(cell.animTimer * 20) * 3;
cx += shake;
}
var grad = ctx.createLinearGradient(cx, cy, cx, cy + cs);
grad.addColorStop(0, bgColor);
grad.addColorStop(1, bgColor.replace('0.1', '0.05').replace('0.2', '0.1').replace('0.4', '0.2').replace('0.6', '0.3'));
ctx.fillStyle = grad;
roundRect(ctx, cx, cy, cs, cs, 8);
ctx.fill();
if (cell.selected) {
ctx.strokeStyle = CONFIG.COLORS.primary;
ctx.lineWidth = 2;
roundRect(ctx, cx, cy, cs, cs, 8);
ctx.stroke();
}
if (G.hintChar === cell.char && G.hintTimer > 0) {
ctx.strokeStyle = CONFIG.COLORS.warning;
ctx.lineWidth = 3;
ctx.setLineDash([4, 4]);
roundRect(ctx, cx - 2, cy - 2, cs + 4, cs + 4, 10);
ctx.stroke();
ctx.setLineDash([]);
}
var fontSize = Math.floor(cs * 0.55);
ctx.font = 'bold ' + fontSize + 'px "Microsoft YaHei", sans-serif';
ctx.fillStyle = cell.correct ? CONFIG.COLORS.success : (cell.wrong ? CONFIG.COLORS.danger : CONFIG.COLORS.text);
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.fillText(cell.char, cx + cs / 2, cy + cs / 2);
}
}
}

function drawHint() {
if (G.hintTimer > 0 && G.hintChar) {
ctx.fillStyle = CONFIG.COLORS.warning;
ctx.font = Math.floor(14 * scale) + 'px "Microsoft YaHei", sans-serif';
ctx.textAlign = 'center';
ctx.globalAlpha = Math.min(1, G.hintTimer);
ctx.fillText('提示: 找找 "' + G.hintChar + '" 这个字', W / 2, H * 0.42);
ctx.globalAlpha = 1;
}
}

function drawGameOver() {
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.fillStyle = 'rgba(0,0,0,0.7)';
ctx.fillRect(0, 0, W, H);
var y = H * 0.3;
ctx.fillStyle = CONFIG.COLORS.danger;
ctx.font = 'bold ' + Math.floor(40 * scale) + 'px "Microsoft YaHei", sans-serif';
ctx.fillText('游戏结束', W / 2, y);
y += 60 * scale;
ctx.fillStyle = CONFIG.COLORS.text;
ctx.font = Math.floor(24 * scale) + 'px "Microsoft YaHei", sans-serif';
ctx.fillText('最终分数: ' + G.score, W / 2, y);
y += 40 * scale;
ctx.fillStyle = CONFIG.COLORS.textDim;
ctx.font = Math.floor(16 * scale) + 'px "Microsoft YaHei", sans-serif';
ctx.fillText('消除成语: ' + G.idiomsCleared + '  |  最大连击: ' + G.maxCombo, W / 2, y);
y += 30 * scale;
ctx.fillText('到达第 ' + (G.level + 1) + ' 关', W / 2, y);
if (G.score >= G.highScore && G.score > 0) {
y += 50 * scale;
ctx.fillStyle = CONFIG.COLORS.gold;
ctx.font = 'bold ' + Math.floor(20 * scale) + 'px "Microsoft YaHei", sans-serif';
ctx.fillText('新纪录!', W / 2, y);
spawnParticles(W / 2, y, CONFIG.COLORS.gold, 3);
}
y += 60 * scale;
drawButton((W - 180 * scale) / 2, y, 180 * scale, 48 * scale, '再来一次', CONFIG.COLORS.primary, CONFIG.COLORS.secondary);
y += 70 * scale;
drawButton((W - 180 * scale) / 2, y, 180 * scale, 48 * scale, '返回主菜单', 'rgba(255,255,255,0.1)', 'rgba(255,255,255,0.2)');
}

function drawLevelUp() {
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.fillStyle = 'rgba(0,0,0,0.6)';
ctx.fillRect(0, 0, W, H);
var y = H * 0.3;
ctx.fillStyle = CONFIG.COLORS.gold;
ctx.font = 'bold ' + Math.floor(36 * scale) + 'px "Microsoft YaHei", sans-serif';
ctx.fillText('关卡通过!', W / 2, y);
y += 50 * scale;
ctx.fillStyle = CONFIG.COLORS.text;
ctx.font = Math.floor(20 * scale) + 'px "Microsoft YaHei", sans-serif';
ctx.fillText('第 ' + (G.level + 1) + ' 关', W / 2, y);
y += 30 * scale;
var lvl = CONFIG.LEVELS[Math.min(G.level, CONFIG.LEVELS.length - 1)];
ctx.fillStyle = CONFIG.COLORS.textDim;
ctx.font = Math.floor(16 * scale) + 'px "Microsoft YaHei", sans-serif';
ctx.fillText('难度: ' + lvl.desc + ' | 消除 ' + lvl.target + ' 个成语', W / 2, y);
y += 20 * scale;
ctx.fillText('时间: ' + lvl.time + '秒 | 空格: ' + lvl.blanks + '个', W / 2, y);
y += 60 * scale;
drawButton((W - 200 * scale) / 2, y, 200 * scale, 50 * scale, '继续挑战', CONFIG.COLORS.success, '#22c55e');
}

function drawButton(x, y, w, h, text, color1, color2) {
var grad = ctx.createLinearGradient(x, y, x + w, y + h);
grad.addColorStop(0, color1);
grad.addColorStop(1, color2);
ctx.fillStyle = grad;
roundRect(ctx, x, y, w, h, 12);
ctx.fill();
ctx.fillStyle = CONFIG.COLORS.text;
var fontSize = Math.floor(18 * scale);
ctx.font = 'bold ' + fontSize + 'px "Microsoft YaHei", sans-serif';
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.fillText(text, x + w / 2, y + h / 2);
}

function drawParticles() {
for (var i = 0; i < G.particles.length; i++) {
var p = G.particles[i];
ctx.globalAlpha = p.alpha;
ctx.fillStyle = p.color;
ctx.beginPath();
ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
ctx.fill();
}
ctx.globalAlpha = 1;
}

function drawFloatTexts() {
for (var i = 0; i < G.floatTexts.length; i++) {
var ft = G.floatTexts[i];
ctx.globalAlpha = ft.alpha;
ctx.fillStyle = ft.color;
ctx.font = 'bold ' + Math.floor(ft.size * scale) + 'px "Microsoft YaHei", sans-serif';
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.fillText(ft.text, ft.x, ft.y);
}
ctx.globalAlpha = 1;
}

// ==================== 输入处理 ====================
function handleClick(e) {
var rect = canvas.getBoundingClientRect();
var x = (e.clientX - rect.left) * (W / rect.width);
var y = (e.clientY - rect.top) * (H / rect.height);
handleInput(x, y);
}

function handleTouchStart(e) {
e.preventDefault();
if (e.touches.length > 0) {
var rect = canvas.getBoundingClientRect();
var x = (e.touches[0].clientX - rect.left) * (W / rect.width);
var y = (e.touches[0].clientY - rect.top) * (H / rect.height);
handleInput(x, y);
}
}

function handleTouchMove(e) {
e.preventDefault();
}

function handleTouchEnd(e) {
e.preventDefault();
}

function handleKeyDown(e) {
if (G.state === 'menu') {
if (e.key === 'Enter' || e.key === ' ') {
startGame();
}
} else if (G.state === 'playing') {
if (e.key === 'Escape') {
G.state = 'paused';
}
} else if (G.state === 'paused') {
if (e.key === 'Escape' || e.key === ' ') {
G.state = 'playing';
}
} else if (G.state === 'gameover') {
if (e.key === 'Enter' || e.key === ' ') {
startGame();
}
} else if (G.state === 'levelup') {
if (e.key === 'Enter' || e.key === ' ') {
continueLevel();
}
}
}

function handleInput(x, y) {
if (G.state === 'menu') {
var btnW = 200 * scale;
var btnH = 56 * scale;
var btnX = (W - btnW) / 2;
var btnY = H * 0.45;
if (x >= btnX && x <= btnX + btnW && y >= btnY && y <= btnY + btnH) {
startGame();
}
} else if (G.state === 'playing') {
handleGridClick(x, y);
} else if (G.state === 'gameover') {
var btnW = 180 * scale;
var btnH = 48 * scale;
var btnX = (W - btnW) / 2;
var y1 = H * 0.3 + 60 * scale + 40 * scale + 30 * scale + 60 * scale;
var y2 = y1 + 70 * scale;
if (x >= btnX && x <= btnX + btnW) {
if (y >= y1 && y <= y1 + btnH) {
startGame();
} else if (y >= y2 && y <= y2 + btnH) {
G.state = 'menu';
}
}
} else if (G.state === 'levelup') {
var btnW = 200 * scale;
var btnH = 50 * scale;
var btnX = (W - btnW) / 2;
var btnY = H * 0.3 + 50 * scale + 30 * scale + 20 * scale + 60 * scale;
if (x >= btnX && x <= btnX + btnW && y >= btnY && y <= btnY + btnH) {
continueLevel();
}
} else if (G.state === 'paused') {
G.state = 'playing';
}
}

// ==================== 工具函数 ====================
function roundRect(ctx, x, y, w, h, r) {
if (w < 2 * r) r = w / 2;
if (h < 2 * r) r = h / 2;
ctx.beginPath();
ctx.moveTo(x + r, y);
ctx.arcTo(x + w, y, x + w, y + h, r);
ctx.arcTo(x + w, y + h, x, y + h, r);
ctx.arcTo(x, y + h, x, y, r);
ctx.arcTo(x, y, x + w, y, r);
ctx.closePath();
}

function shuffleArray(arr) {
for (var i = arr.length - 1; i > 0; i--) {
var j = Math.floor(Math.random() * (i + 1));
var temp = arr[i];
arr[i] = arr[j];
arr[j] = temp;
}
return arr;
}
