<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>数字炸弹</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#434343 0%,#000000 100%);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:"Microsoft YaHei",sans-serif}
canvas{display:block;margin:0 auto}
.sponsor-close,#sponsorClose,.skip-btn,#skipInterstitial{pointer-events:auto!important;}
</style>
<style>
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);height:90px;max-height:90px;overflow:hidden;contain:layout style paint;pointer-events:none!important}.ad-banner-container,.ad-banner-container *{pointer-events:none!important}.ad-banner-container iframe{max-height:90px;pointer-events:none!important}
.ad-banner-container iframe{max-width:100%}
.ad-label{position:absolute;top:1px;right:6px;font:9px "Microsoft YaHei",sans-serif;color:rgba(255,255,255,.35)}
.sponsor-btn{position:fixed;bottom:8px;left:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:2px 6px;border-radius:10px;font:10px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .qr-row{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.sponsor-panel .qr-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px;text-align:center;min-width:140px}
.sponsor-panel .qr-card .qr-icon{font-size:48px;margin-bottom:6px}
.sponsor-panel .qr-card .qr-label{color:#ccc;font:13px "Microsoft YaHei",sans-serif}
.sponsor-panel .qr-card .qr-hint{color:#888;font:11px "Microsoft YaHei",sans-serif;margin-top:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.interstitial-ad .ad-content{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;text-align:center;min-width:280px;max-width:400px}
.interstitial-ad .ad-content p{color:#aaa;font:14px "Microsoft YaHei",sans-serif;margin-bottom:12px}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */

/* [AD-FIX:responsive] */
@media (max-width:768px){.ad-banner-container{display:none!important}.sponsor-btn{transform:scale(.8);opacity:.6}}
/* [/AD-FIX:responsive] */
</style>
</head>
<body>

<button id="start-game-btn" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:20px 40px;font-size:20px;background:#ff5252;color:white;border:none;border-radius:12px;cursor:pointer;z-index:999;font-weight:bold;">开始游戏</button>

<canvas id="c"></canvas>

<script>
if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
</script>
<script src="../game_core.js"></script>
<script>
(function(){
"use strict";

const W=480,H=720;

let audioCtx=null;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
function playTone(freq,dur,type,vol){
    if(!audioCtx)return;
    try{
        const o=audioCtx.createOscillator(),g=audioCtx.createGain();
        o.type=type||'sine';o.frequency.value=freq;g.gain.value=vol||0.15;
        g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
        o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur);
    }catch(e){}
}
function sfxBtn(){playTone(650,0.08,'sine',0.12)}
function sfxGuess(cold){playTone(cold?350:600,0.1,'sine',0.15)}
function sfxHot(){playTone(800,0.08,'square',0.18);setTimeout(()=>playTone(900,0.1,'square',0.15),60)}
function sfxBoom(){
    if(!audioCtx)return;
    for(let i=0;i<5;i++){
        setTimeout(()=>{
            try{
                const o=audioCtx.createOscillator(),g=audioCtx.createGain();
                o.type='sawtooth';o.frequency.value=200-i*30;g.gain.value=0.18;
                g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.3);
                o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+0.35);
            }catch(e){}
        },i*50);
    }
}
function sfxWin(){playTone(523,0.1,'sine',0.2);setTimeout(()=>playTone(659,0.1,'sine',0.2),100);setTimeout(()=>playTone(784,0.15,'sine',0.2),200);setTimeout(()=>playTone(1046,0.3,'sine',0.2),350)}
function sfxTick(){playTone(1200,0.03,'square',0.1)}

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let scale=1;
function resize(){
    const r=W/H;let cw=window.innerWidth,ch=window.innerHeight;
    if(cw/ch>r){ch=cw/r}else{cw=ch*r}
    canvas.width=cw;canvas.height=ch;scale=cw/W;
    ctx.setTransform(scale,0,0,scale,0,0);
}
window.addEventListener('resize',resize);resize();

const MODES=[
    {n:'简单',min:1,max:50,bonus:80},
    {n:'普通',min:1,max:100,bonus:150},
    {n:'困难',min:1,max:300,bonus:300},
    {n:'噩梦',min:1,max:999,bonus:800}
];

const G={
    state:STATE_MENU,
    mode:1,
    target:50,
    low:1,high:100,
    guesses:[],
    score:0,highScore:0,
    lives:3,
    rounds:0,maxRounds:5,
    phase:0,
    timeLeft:0,selectTime:30,
    inputActive:false,input:'',
    btnRects:{},
    particles:[],
    paused:false,
    floatMsgs:[],
    bgShapes:[],
    boomAnim:0,
    winAnim:0,
    combo:0,maxCombo:0,
    lastTemp:'',
    roundScore:0,
    totalGuesses:0
};
G.highScore=parseInt(Storage.load('bomb_high','0'));

for(let i=0;i<25;i++){
    G.bgShapes.push({x:Math.random()*W,y:Math.random()*H,s:10+Math.random()*20,
        r:Math.random()*Math.PI*2,vr:(Math.random()-0.5)*0.02,
        vx:(Math.random()-0.5)*0.3,vy:(Math.random()-0.5)*0.3,
        shape:Math.floor(Math.random()*4),
        hue:Math.random()*60,a:0.06+Math.random()*0.1});
}

function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

function drawBtn(ctx,x,y,w,h,text,name,color,textColor,fontSize,disabled){
    G.btnRects[name]={x:x,y:y,w:w,h:h,disabled:disabled};
    ctx.fillStyle=disabled?'rgba(150,150,150,0.4)':(color||'#ff5252');
    roundRect(ctx,x,y,w,h,12);ctx.fill();
    ctx.strokeStyle=disabled?'rgba(255,255,255,0.2)':'rgba(255,255,255,0.55)';
    ctx.lineWidth=2;roundRect(ctx,x,y,w,h,12);ctx.stroke();
    ctx.fillStyle=disabled?'#bbb':(textColor||'#fff');
    ctx.font='bold '+(fontSize||16)+'px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(text,x+w/2,y+h/2);ctx.textBaseline='alphabetic';
}
function hitBtn(p,name){
    const r=G.btnRects[name];
    return r && !r.disabled && p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;
}
function getPos(e){
    const rect=canvas.getBoundingClientRect();
    const t=e.touches?e.touches[0]:e;
    return{x:(t.clientX-rect.left)/scale,y:(t.clientY-rect.top)/scale};
}

function updateBg(){
    for(const s of G.bgShapes){
        s.x+=s.vx;s.y+=s.vy;s.r+=s.vr;
        if(s.x<-40)s.x=W+40;if(s.x>W+40)s.x=-40;
        if(s.y<-40)s.y=H+40;if(s.y>H+40)s.y=-40;
    }
}
function drawBg(ctx){
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#434343');g.addColorStop(1,'#000000');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    for(const s of G.bgShapes){
        ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.r);ctx.globalAlpha=s.a;
        ctx.strokeStyle=`hsl(${s.hue},80%,65%)`;ctx.lineWidth=2;
        if(s.shape===0){ctx.beginPath();ctx.arc(0,0,s.s/2,0,Math.PI*2);ctx.stroke()}
        else if(s.shape===1){ctx.strokeRect(-s.s/2,-s.s/2,s.s,s.s)}
        else if(s.shape===2){ctx.beginPath();for(let i=0;i<5;i++){
            const a=-Math.PI/2+i*Math.PI*2/5;
            const px=Math.cos(a)*s.s/2,py=Math.sin(a)*s.s/2;
            i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
            const a2=a+Math.PI/5;
            ctx.lineTo(Math.cos(a2)*s.s/4,Math.sin(a2)*s.s/4);
        }ctx.closePath();ctx.stroke()}
        else{ctx.beginPath();ctx.moveTo(0,-s.s/2);ctx.lineTo(s.s/2,s.s/2);ctx.lineTo(-s.s/2,s.s/2);ctx.closePath();ctx.stroke()}
        ctx.restore();
    }
    ctx.globalAlpha=1;
}

function spawnParticles(x,y,color,count){
    for(let i=0;i<(count||15);i++){
        G.particles.push({x:x,y:y,vx:(Math.random()-0.5)*14,vy:(Math.random()-0.5)*14-4,
            life:60,maxLife:60,size:3+Math.random()*5,color:color,
            rot:Math.random()*Math.PI*2,vr:(Math.random()-0.5)*0.3});
    }
}
function updateParticles(){
    for(let i=G.particles.length-1;i>=0;i--){
        const p=G.particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.28;
        p.vx*=0.995;p.rot+=p.vr;p.life--;
        if(p.life<=0)G.particles.splice(i,1);
    }
}
function drawParticles(ctx){
    for(const p of G.particles){
        ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
        ctx.globalAlpha=p.life/p.maxLife;
        ctx.fillStyle=p.color;
        ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size);
        ctx.restore();
    }
    ctx.globalAlpha=1;
}
function addFloat(x,y,text,color){
    G.floatMsgs.push({x:x,y:y,text:text,color:color||'#fff',life:50,vy:-1.3});
}
function updateFloat(){
    for(let i=G.floatMsgs.length-1;i>=0;i--){
        const f=G.floatMsgs[i];f.y+=f.vy;f.life--;
        if(f.life<=0)G.floatMsgs.splice(i,1);
    }
}
function drawFloat(ctx){
    for(const f of G.floatMsgs){
        ctx.globalAlpha=f.life/50;
        ctx.fillStyle=f.color;
        ctx.font='bold 20px "Microsoft YaHei"';
        ctx.textAlign='center';ctx.fillText(f.text,f.x,f.y);
    }
    ctx.globalAlpha=1;ctx.textAlign='left';
}

window.addEventListener('keydown',function(e){
    G.keys=G.keys||{};G.keys[e.key.toLowerCase()]=true;
    if(e.key==='Escape'){if(G.state===STATE_PLAYING)togglePause()}
    if(G.state===STATE_PLAYING&&G.inputActive){
        if(e.key==='Backspace'){G.input=G.input.slice(0,-1);sfxBtn()}
        else if(e.key==='Enter'){submitGuess()}
        else if(/^[0-9]$/.test(e.key)){G.input+=e.key;sfxBtn()}
    }
    initAudio();
});
window.addEventListener('keyup',function(e){if(G.keys)G.keys[e.key.toLowerCase()]=false});

function handlePointerDown(e){
    initAudio();
    const p=getPos(e);
    if(G.state===STATE_MENU){
        if(hitBtn(p,'start')){startGame();return}
        for(let i=0;i<MODES.length;i++)if(hitBtn(p,'m'+i)){G.mode=i;sfxBtn();return}
        if(hitBtn(p,'r3')){G.maxRounds=3;sfxBtn();return}
        if(hitBtn(p,'r5')){G.maxRounds=5;sfxBtn();return}
        if(hitBtn(p,'r8')){G.maxRounds=8;sfxBtn();return}
    } else if(G.state===STATE_OVER){
        if(hitBtn(p,'restart')){startGame();return}
        if(hitBtn(p,'menu')){G.state=STATE_MENU;return}
    } else if(G.state===STATE_PLAYING&&!G.paused){
        if(hitBtn(p,'pause')){togglePause();return}
        if(G.phase===0){
            if(hitBtn(p,'openInput')){G.inputActive=true;sfxBtn();return}
            for(let i=0;i<10;i++){
                const n='n'+i;
                if(hitBtn(p,n)){if(G.input.length<3)G.input+=i;sfxBtn();return}
            }
            if(hitBtn(p,'backspace')){G.input=G.input.slice(0,-1);sfxBtn();return}
            if(hitBtn(p,'submitGuess')){submitGuess();return}
            if(hitBtn(p,'halve')){halveHint();return}
        } else if(G.phase===1){
            if(hitBtn(p,'submitInput')){submitGuess();return}
            if(hitBtn(p,'cancelInput')){G.inputActive=false;G.input='';sfxBtn();return}
        } else if(G.phase===2){
            if(hitBtn(p,'nextR')){nextRound();return}
        }
    }
}
function handlePointerMove(e){}
function handlePointerUp(e){}
canvas.addEventListener('mousedown',handlePointerDown);
canvas.addEventListener('mousemove',handlePointerMove);
canvas.addEventListener('mouseup',handlePointerUp);
canvas.addEventListener('touchstart',function(e){e.preventDefault();handlePointerDown(e)},{passive:false});
canvas.addEventListener('touchmove',function(e){e.preventDefault();handlePointerMove(e)},{passive:false});
canvas.addEventListener('touchend',function(e){e.preventDefault();handlePointerUp(e)},{passive:false});

function startGame(){
    initAudio();
    G.state=STATE_PLAYING;G.score=0;G.combo=0;G.maxCombo=0;
    G.lives=3;G.rounds=0;G.boomAnim=0;G.winAnim=0;G.totalGuesses=0;
    nextRound();
    sfxWin();spawnParticles(W/2,H/2,'#ffd700',25);
}
function endGame(){
    G.state=STATE_OVER;
    if(G.score>G.highScore){G.highScore=G.score;Storage.save('bomb_high',G.highScore)}
    sfxWin();
}
function togglePause(){G.paused=!G.paused;sfxBtn()}

function nextRound(){
    G.rounds++;
    if(G.rounds>G.maxRounds){endGame();return}
    const m=MODES[G.mode];
    G.target=m.min+Math.floor(Math.random()*(m.max-m.min+1));
    G.low=m.min;G.high=m.max;
    G.guesses=[];G.roundScore=m.bonus;G.phase=0;G.input='';
    G.timeLeft=G.selectTime*60;G.inputActive=false;G.boomAnim=0;G.winAnim=0;
    sfxBtn();addFloat(W/2,120,'🔔 第 '+G.rounds+' 轮 范围 '+m.min+'-'+m.max,'#ffd700');
}

function submitGuess(){
    if(G.phase>=2)return;
    if(G.input===''){addFloat(W/2,350,'先输入一个数字！','#ffcdd2');sfxBtn();return}
    const g=parseInt(G.input);
    const m=MODES[G.mode];
    if(isNaN(g)||g<m.min||g>m.max){
        addFloat(W/2,350,'范围在 '+m.min+' 到 '+m.max+' !','#ffcdd2');
        sfxGuess(true);G.input='';return;
    }
    for(const it of G.guesses){if(it.n===g){addFloat(W/2,350,'猜过啦，换一个！','#ffcdd2');sfxGuess(true);G.input='';return}}
    G.totalGuesses++;
    G.inputActive=false;G.input='';
    if(g===G.target){
        G.phase=2;G.winAnim=1;G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);
        const tb=Math.floor(G.timeLeft/18);
        const cb=G.combo*15;
        const total=G.roundScore+tb+cb;
        G.score+=total;
        sfxWin();spawnParticles(W/2,360,'#ffd700',50);
        spawnParticles(W/2,360,'#ff9800',40);
        spawnParticles(W/2,360,'#43e97b',30);
        addFloat(W/2,330,'🎉 安全了！+'+total+(' ('+G.guesses.length+1+'次猜中, 连击 '+G.combo+')'),'#ffd700');
    } else {
        const dist=Math.abs(G.target-g);
        const range=G.high-G.low;
        const ratio=dist/range;
        if(ratio<0.05){sfxHot();addFloat(W/2,360,'🔥🔥🔥 太接近了！就差一点点！','#ff5252');spawnParticles(W/2,360,'#ff5252',18)}
        else if(ratio<0.15){sfxHot();addFloat(W/2,360,'🔥 很烫很接近！','#ff9800');spawnParticles(W/2,360,'#ff9800',14)}
        else if(ratio<0.35){sfxGuess(false);addFloat(W/2,360,'🌡️ 有点热了','#ffc107')}
        else if(ratio<0.6){sfxGuess(false);addFloat(W/2,360,'☁️ 温温的','#cddc39')}
        else{sfxGuess(true);addFloat(W/2,360,'❄️ 好冷啊，离得远','#64b5f6')}
        if(g<G.target){G.low=Math.max(G.low,g+1)}else{G.high=Math.min(G.high,g-1)}
        G.guesses.push({n:g,r:ratio});
        G.roundScore=Math.max(20,G.roundScore-12);
        G.timeLeft=G.selectTime*60;
    }
}

function halveHint(){
    const m=MODES[G.mode];
    if(G.roundScore<=30||G.score<30){addFloat(W/2,350,'分数不够或分太少!','#ffcdd2');sfxBtn();return}
    G.score=Math.max(0,G.score-30);G.roundScore=Math.max(10,G.roundScore-10);
    const mid=Math.floor((G.low+G.high)/2);
    if(G.target<=mid){G.high=mid;addFloat(W/2,140,'✂️ 二分缩小:上半 '+G.low+'-'+G.high+' -30分','#ffe66d')}
    else{G.low=mid+1;addFloat(W/2,140,'✂️ 二分缩小:下半 '+G.low+'-'+G.high+' -30分','#ffe66d')}
    sfxBtn();
}

function update(){
    updateBg();updateParticles();updateFloat();
    if(G.boomAnim>0){G.boomAnim+=0.05;if(G.boomAnim>=2){G.boomAnim=0}}
    if(G.winAnim>0){G.winAnim+=0.03;if(G.winAnim>=2)G.winAnim=0}
    if(G.state!==STATE_PLAYING||G.paused)return;
    if(G.phase===0&&G.timeLeft>0){
        G.timeLeft--;
        if(G.timeLeft<=0){
            G.phase=2;G.boomAnim=1;G.combo=0;G.lives--;
            sfxBoom();
            for(let i=0;i<5;i++)setTimeout(()=>{spawnParticles(W/2+(Math.random()-0.5)*150,320+Math.random()*100,['#ff5252','#ff9800','#ffeb3b','#ff4081'][i%4],15)},i*80);
            addFloat(W/2,340,'💥 时间到！炸了 -1 ❤️  ('+G.target+')','#ff5252');
            if(G.lives<=0)setTimeout(endGame,1800);
        }
        if(G.timeLeft===300||G.timeLeft===180||G.timeLeft===60)sfxTick();
    }
}

function drawHUD(ctx){
    ctx.fillStyle='rgba(255,82,82,0.15)';
    roundRect(ctx,10,10,W-20,78,14);ctx.fill();
    ctx.strokeStyle='rgba(255,82,82,0.5)';ctx.lineWidth=2;
    roundRect(ctx,10,10,W-20,78,14);ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold 14px "Microsoft YaHei"';ctx.textAlign='left';
    ctx.fillText('💣 炸弹',25,32);
    ctx.font='bold 22px Arial';ctx.fillStyle='#ffd700';
    ctx.fillText(G.rounds+'/'+G.maxRounds,90,32);
    ctx.fillStyle='#fff';ctx.font='bold 12px "Microsoft YaHei"';
    ctx.fillText(MODES[G.mode].n,140,32);
    for(let i=0;i<3;i++){
        const on=i<G.lives;
        ctx.font='24px serif';
        ctx.fillText(on?'❤️':'🖤',25+i*28,60);
    }
    const ratio=G.timeLeft/(G.selectTime*60);
    const barW=170,barH=20,bx=W/2-barW/2;

function drawBomb(ctx){
    const cy=125,cw=W-40,ch=220;
    ctx.fillStyle='rgba(255,255,255,0.06)';
    roundRect(ctx,20,cy,cw,ch,18);ctx.fill();
    ctx.strokeStyle='rgba(255,82,82,0.4)';ctx.lineWidth=2;
    roundRect(ctx,20,cy,cw,ch,18);ctx.stroke();
    ctx.fillStyle='rgba(255,82,82,0.15)';
    roundRect(ctx,20,cy,cw,38,{tl:18,tr:18,bl:0,br:0});roundRect(ctx,20,cy,cw,38,18);ctx.fill();
    ctx.fillStyle='#ff8a80';ctx.font='bold 16px "Microsoft YaHei"';
    ctx.textAlign='left';ctx.fillText('🎯 当前猜测范围：['+G.low+' , '+G.high+']  共 '+(G.high-G.low+1)+' 个数',35,cy+25);
    const bx=W/2,by=cy+135;
    const pulse=1+Math.sin(Date.now()/150)*0.03;
    ctx.save();ctx.translate(bx,by);ctx.scale(pulse,pulse);
    ctx.fillStyle='#212121';
    ctx.beginPath();ctx.arc(0,0,70,0,Math.PI*2);ctx.fill();
    const g=ctx.createRadialGradient(-20,-20,5,0,0,70);
    g.addColorStop(0,'rgba(255,255,255,0.35)');g.addColorStop(0.4,'rgba(120,120,120,0.2)');g.addColorStop(1,'rgba(0,0,0,0.8)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,70,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#ff5252';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(0,0,72+Math.sin(Date.now()/100)*3,0,Math.PI*2);ctx.globalAlpha=0.4+Math.sin(Date.now()/100)*0.3;ctx.stroke();ctx.globalAlpha=1;
    ctx.strokeStyle='#5d4037';ctx.lineWidth=5;
    ctx.beginPath();ctx.moveTo(45,-45);ctx.quadraticCurveTo(55,-60,65,-65);ctx.stroke();
    const sf=Math.sin(Date.now()/80)*2;
    ctx.fillStyle='#ff9800';ctx.beginPath();ctx.arc(65+sf,-65-sf,6+Math.sin(Date.now()/50)*1.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffeb3b';ctx.beginPath();ctx.arc(65+sf,-65-sf,3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 15px "Microsoft YaHei"';ctx.textAlign='center';
    ctx.fillText('?',0,5);
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='bold 12px Arial';
    ctx.fillText(G.guesses.length+' 次尝试',0,26);
    ctx.restore();
    if(G.guesses.length>0){
        const gxs=280,gy=cy+45,gw=cw/2-30,gh=160;
        ctx.fillStyle='rgba(255,255,255,0.08)';
        roundRect(ctx,gxs,gy,gw,gh,10);ctx.fill();
        ctx.fillStyle='#ffe0b2';ctx.font='bold 13px "Microsoft YaHei"';
        ctx.textAlign='left';ctx.fillText('📋 已猜 ('+G.guesses.length+')：',gxs+8,gy+20);
        const cols=3;
        const sorted=[...G.guesses].sort((a,b)=>a.n-b.n);
        for(let i=0;i<Math.min(sorted.length,15);i++){
            const c=i%cols,r=Math.floor(i/cols);
            const gx=gxs+8+c*(gw/3),gy2=gy+38+r*28;
            const it=sorted[i];
            const col=it.r<0.05?'#ff5252':it.r<0.15?'#ff9800':it.r<0.35?'#ffc107':it.r<0.6?'#cddc39':'#64b5f6';
            ctx.font='bold 13px Arial';ctx.fillStyle=col;
            ctx.fillText(it.n<G.target?'↗ ':it.n>G.target?'↘ ':'🎯',gx,gy2);
            ctx.fillStyle='#fff';
            ctx.fillText(it.n,gx+16,gy2);
        }
        ctx.textAlign='left';
    }
    ctx.textAlign='left';
}

function drawResultOverlay(ctx){
    if(G.phase<2)return;
    if(G.winAnim>0){
        ctx.globalAlpha=Math.sin(G.winAnim*Math.PI)*0.5;
        const col=G.guesses.find(x=>x.n===G.target)?'#ffd700':'#43e97b';
        ctx.font='bold 90px "Microsoft YaHei"';ctx.textAlign='center';ctx.fillStyle=col;
        ctx.fillText('🎉',W/2,350);
        ctx.font='bold 44px Arial';
        ctx.fillText(G.target,W/2,420);
        ctx.globalAlpha=1;
    } else if(G.boomAnim>0){
        const a=Math.sin(G.boomAnim*Math.PI)*0.7;
        ctx.save();ctx.translate(W/2,360);
        const ss=1+(G.boomAnim-1)*0.6;
        ctx.scale(ss,ss);
        ctx.globalAlpha=a;
        ctx.font='bold 120px "Microsoft YaHei"';ctx.textAlign='center';
        ctx.fillStyle='#ff5252';ctx.strokeStyle='#fff';ctx.lineWidth=6;
        ctx.strokeText('💥',0,0);ctx.fillText('💥',0,0);
        ctx.font='bold 28px Arial';ctx.fillStyle='#ffd700';
        ctx.strokeText(G.target,0,70);ctx.fillText(G.target,0,70);
        ctx.restore();
        ctx.globalAlpha=1;ctx.textAlign='left';
    }
    ctx.textAlign='left';
}

function drawGame(ctx){

function drawGameOver(ctx){
    drawBg(ctx);
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,W,H);
    const isNew=G.score>=G.highScore&&G.score>0;
    ctx.fillStyle=isNew?'#ffd700':'#fff';ctx.font='bold 44px "Microsoft YaHei"';ctx.textAlign='center';
    ctx.fillText(isNew?'🏆 新纪录!':(G.lives<=0?'💥 挑战结束':'🎊 通关成功!'),W/2,100);
    ctx.fillStyle='#fff';ctx.font='bold 22px "Microsoft YaHei"';
    ctx.fillText('最终得分',W/2,160);
    ctx.fillStyle='#ffd700';ctx.font='bold 96px Arial';
    ctx.fillText(G.score,W/2,268);
    ctx.fillStyle='rgba(255,255,255,0.95)';ctx.font='bold 18px "Microsoft YaHei"';
    ctx.fillText(G.rounds-1+' / '+G.maxRounds+' 轮  |  '+G.maxRounds+(G.rounds>G.maxRounds?'':0)+(G.lives>0?' 提前完成':' 挑战失败'),W/2,318);
    ctx.fillText('平均每轮 '+ (G.totalGuesses/Math.max(1,G.rounds-1)).toFixed(1)+' 次猜对',W/2,345);
    ctx.fillText('❤ 剩余 '+G.lives+'  |  最高连击 '+G.maxCombo+' 连',W/2,372);
    ctx.fillStyle='#ffd700';ctx.font='bold 20px "Microsoft YaHei"';
    ctx.fillText('🏆 最高纪录: '+G.highScore,W/2,420);
    const ratings=[
        {min:1500,t:'拆弹专家 🧨',c:'#ffd700'},
        {min:900,t:'幸运之星 🍀',c:'#f093fb'},
        {min:500,t:'成功脱险 ✅',c:'#4ecdc4'},
        {min:200,t:'还能再战 🔄',c:'#a8e6cf'},
        {min:0,t:'下次加油 💪',c:'#ff8b94'}
    ];
    let ra=ratings[ratings.length-1];
    for(const r of ratings){if(G.score>=r.min){ra=r;break}}
    ctx.fillStyle=ra.c;ctx.font='bold 32px "Microsoft YaHei"';
    ctx.fillText(ra.t,W/2,478);
    drawBtn(ctx,W/2-115,528,230,65,'🔄 再来一次','restart','#ff5252','#fff',20);
    drawBtn(ctx,W/2-80,605,160,45,'🏠 返回菜单','menu','rgba(255,255,255,0.2)','#fff',16);
    ctx.textAlign='left';
}

function draw(){
    switch(G.state){
        case STATE_MENU:drawMenu(ctx);break;
        case STATE_PLAYING:drawGame(ctx);break;
        case STATE_OVER:drawGameOver(ctx);break;
        case STATE_PAUSE:drawGame(ctx);break;
    }
}
function gameLoop(){requestAnimationFrame(gameLoop);update();draw()}

    } else if(st===STATE_SETTINGS||st===STATE_ACHIEVEMENTS||st===STATE_HELP||st===STATE_STATS){
        if(hitBtn2(p,'closeSub')||hitBtn2(p,'backMain')){G.state=STATE_MENU;return}
        if(st===STATE_SETTINGS){
            if(hitBtn2(p,'set_soundOn')){SETTINGS.soundOn=!SETTINGS.soundOn;saveSettings();return}
            if(hitBtn2(p,'set_vibOn')){SETTINGS.vibOn=!SETTINGS.vibOn;saveSettings();return}
            if(hitBtn2(p,'set_showTimer')){SETTINGS.showTimer=!SETTINGS.showTimer;saveSettings();return}
            if(hitBtn2(p,'resetData')){
                if(confirm('确定清除所有存档、统计和成就吗？无法恢复！')){
                    for(const k of ['_g','_c','_w','_bc','_h','_bs','_unlock'])Storage.remove(SK+k);
                    STAT.totalGames=0;STAT.totalCorrect=0;STAT.totalWrong=0;STAT.bestCombo=0;

            for(let i=0;i<THEMES.length;i++){
                if(hitBtn2(p,'theme_'+i)){SETTINGS.theme=i;saveSettings();applyTheme();return}
            }
        }
    }
    return origPointerDown(e);
}

const DAILY_KEY='bomb_daily_v1';
function getDailySeed(){
    const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
}
function getDailyStatus(){
    const today=getDailySeed();
    const prev=parseInt(Storage.load(DAILY_KEY+'_d','0'));
    const best=parseInt(Storage.load(DAILY_KEY+'_b','0'));
    const done=prev===today;
    return {today,best:done?best:0,done};
}
function setDailyDone(score){
    const s=getDailyStatus();
    if(s.today!==parseInt(Storage.load(DAILY_KEY+'_d','0')) || score>s.best){
        Storage.save(DAILY_KEY+'_d',String(s.today));
        Storage.save(DAILY_KEY+'_b',String(score));
    }
}
function seededRand(seed){let t=seed+0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296}

    drawBackground(ctx);drawSubPageBackdrop(ctx,'🏆 本地排行榜 TOP 10');
    drawLeaderboard(ctx,null,35,155,W-70,H-290,THEMES[SETTINGS.theme%THEMES.length].accent);
    if(typeof drawBtn==='function')drawBtn(ctx,W/2-70,H-120,140,42,'返回菜单','backMain','#9c27b0','#fff',16);
}
function drawDailyChallengePage(ctx){
    drawBackground(ctx);drawSubPageBackdrop(ctx,'🌟 每日挑战');
    const ds=getDailyStatus();
    const y=170;
    ctx.fillStyle='#333';ctx.textAlign='center';
    ctx.font='bold 20px "Microsoft YaHei"';ctx.fillText('挑战日期：'+String(ds.today).slice(0,4)+'/'+String(ds.today).slice(4,6)+'/'+String(ds.today).slice(6,8),W/2,y);
    ctx.font='bold 16px "Microsoft YaHei"';ctx.fillStyle=ds.done?'#4caf50':'#ff5722';
    ctx.fillText(ds.done?'✓ 今日已完成，最佳：'+ds.best:'今日挑战进行中！完成后奖励双倍经验！',W/2,y+40);
    ctx.font='14px "Microsoft YaHei"';ctx.fillStyle='#666';
    ctx.fillText('每日0点自动刷新，使用当日种子题目，记录每日最佳',W/2,y+75);
    ctx.fillText('奖励：完成每日挑战额外奖励500 XP',W/2,y+100);
    ctx.fillText('历史最佳排行榜可在主菜单查看',W/2,y+125);
    // 双倍加成说明
    ctx.fillStyle='rgba(255,152,0,0.08)';
    if(typeof roundRect==='function'){roundRect(ctx,50,y+155,W-100,80,12);ctx.fill();
    ctx.strokeStyle='rgba(255,152,0,0.4)';ctx.lineWidth=2;roundRect(ctx,50,y+155,W-100,80,12);ctx.stroke();}
    ctx.fillStyle='#e65100';ctx.font='bold 15px "Microsoft YaHei"';
    ctx.fillText('🎁 完成今日挑战 = 500 XP额外奖励',W/2,y+188);
    ctx.font='13px "Microsoft YaHei"';ctx.fillText('直接返回主菜单，使用正常开始按钮即可完成当日挑战',W/2,y+212);
    if(typeof drawBtn==='function')drawBtn(ctx,W/2-70,H-120,140,42,'返回菜单','backMain','#9c27b0','#fff',16);
    ctx.textAlign='left';
}
const _origDrawEx2=typeof drawEx==='function'?drawEx:(typeof draw==='function'?draw:function(){});
function drawEx2(){
    switch(G.state){
        case STATE_LEADERBOARD:drawLeaderboardPage(ctx);break;
        case STATE_DAILY:drawDailyChallengePage(ctx);break;
        case STATE_MENU:drawMenuExtended2(ctx);break;
        default:_origDrawEx2();
    }
}
// 点击钩子扩展
const _origPD2=typeof handlePointerDown2==='function'?handlePointerDown2:(typeof handlePointerDown==='function'?handlePointerDown:function(){});
function handlePointerDown3(e){
    const p=typeof getPos==='function'?getPos(e):{x:0,y:0};
    const st=G.state;
    if(st===STATE_MENU){
        if(hitBtn2(p,'lbBtn')){G.state=STATE_LEADERBOARD;return}
        if(hitBtn2(p,'dailyBtn')){G.state=STATE_DAILY;return}
    } else if(st===STATE_LEADERBOARD||st===STATE_DAILY){
        if(hitBtn2(p,'closeSub')||hitBtn2(p,'backMain')){G.state=STATE_MENU;return}
    }
    return _origPD2(e);
}
if(typeof canvas!=='undefined'){
    canvas.addEventListener('mousedown',handlePointerDown3);
    canvas.addEventListener('touchstart',function(e){e.preventDefault();handlePointerDown3(e)},{passive:false});
}
window.cancelAnimationFrame(window.__raf3||0);
(function loop3(){window.__raf3=requestAnimationFrame(loop3);if(typeof update==='function')update();drawEx2()})();

// 自动保存排行榜（在结束时）
const _origUAAG=typeof updateAchievementsAfterGame==='function'?updateAchievementsAfterGame:function(){};
if(typeof window!=='undefined'){
    window['bomb_postGame']=function(score){
        _origUAAG();
        addToLeaderboard(score,'玩家'+LV.level);
        addXp(50+Math.floor(score/20));
        setDailyDone(score);
    }
}

applyTheme();
})();
</script>

<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>

<script>

  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
