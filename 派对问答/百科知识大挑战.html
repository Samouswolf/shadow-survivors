<style>

.ad-banner-container iframe{max-width:100%}
.ad-label{position:absolute;top:1px;right:6px;font:9px "Microsoft YaHei",sans-serif;color:rgba(255,255,255,.35)}

<canvas id="c"></canvas>

<script>
if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
</script>
<script src="../game_core.js"></script>
<script>
(function(){
"use strict";

const W=480,H=720;

const QUESTIONS = [
    {q:"世界上最高的山峰是？",opts:["珠穆朗玛峰","乔戈里峰","干城章嘉峰","洛子峰"],a:0,c:"地理"},

    {q:"中国的首都是？",opts:["上海","广州","北京","深圳"],a:2,c:"常识"},
    {q:"水的化学分子式是？",opts:["CO2","H2O","O2","NaCl"],a:1,c:"化学"},

    {q:"太阳系中最大的行星是？",opts:["地球","火星","土星","木星"],a:3,c:"天文"},
    {q:"万里长城始建于哪个朝代？",opts:["汉朝","秦朝","唐朝","明朝"],a:1,c:"历史"},
    {q:"篮球比赛每队上场几人？",opts:["4人","5人","6人","7人"],a:1,c:"体育"},
    {q:"地球绕太阳一周大约需要多久？",opts:["一天","一个月","一年","一百年"],a:2,c:"天文"},
    {q:"中国国旗的颜色是？",opts:["红黄","红绿","红蓝","红白"],a:0,c:"常识"},
    {q:"DNA的中文名称是？",opts:["核糖核酸","脱氧核糖核酸","蛋白质","氨基酸"],a:1,c:"生物"},
    {q:"世界四大洋中面积最大的是？",opts:["大西洋","印度洋","太平洋","北冰洋"],a:2,c:"地理"},
    {q:"《西游记》中孙悟空使用的武器是？",opts:["青龙偃月刀","方天画戟","如意金箍棒","丈八蛇矛"],a:2,c:"文学"},
    {q:"一年中的第一天是？",opts:["1月1日","2月14日","12月31日","春节"],a:0,c:"常识"},

    {q:"中国古代四大发明不包括？",opts:["造纸术","指南针","火药","丝绸"],a:3,c:"历史"},
    {q:"世界上最长的河流是？",opts:["长江","尼罗河","亚马逊河","黄河"],a:1,c:"地理"},
    {q:"奥运会几年举办一次？",opts:["1年","2年","4年","8年"],a:2,c:"体育"},

    {q:"《论语》记录的是谁的言行？",opts:["孟子","孔子","老子","庄子"],a:1,c:"文学"},
    {q:"彩虹一般有几种颜色？",opts:["5种","6种","7种","8种"],a:2,c:"物理"},
    {q:"中国的国宝动物是？",opts:["东北虎","金丝猴","大熊猫","丹顶鹤"],a:2,c:"常识"},
    {q:"世界上人口最多的国家是？",opts:["美国","中国","印度","俄罗斯"],a:1,c:"地理"},
    {q:"电脑使用的基本语言是？",opts:["中文","英文","二进制","十进制"],a:2,c:"科技"},
    {q:"长城上著名的关口是？",opts:["函谷关","山海关","嘉峪关","玉门关"],a:1,c:"历史"},
    {q:"鲸鱼属于什么类动物？",opts:["鱼类","鸟类","哺乳类","爬行类"],a:2,c:"生物"},
    {q:"月球绕地球一周大约需要？",opts:["1天","7天","27天","365天"],a:2,c:"天文"},
    {q:"中国象棋中有多少个棋子？",opts:["28个","32个","36个","40个"],a:1,c:"文化"},
    {q:"世界上最大的海洋动物是？",opts:["鲨鱼","鲸鱼","蓝鲸","章鱼"],a:2,c:"生物"},
    {q:"钻石的主要成分是？",opts:["黄金","碳","硅","铁"],a:1,c:"化学"},
    {q:"《水浒传》描写的是哪个朝代的故事？",opts:["唐朝","宋朝","元朝","明朝"],a:1,c:"文学"},
    {q:"中国有多少个民族？",opts:["50个","55个","56个","60个"],a:2,c:"常识"},
    {q:"空气中含量最多的气体是？",opts:["氧气","氮气","二氧化碳","氢气"],a:1,c:"化学"},
    {q:"世界上最小的国家是？",opts:["卢森堡","梵蒂冈","摩纳哥","冰岛"],a:1,c:"地理"},
    {q:"人体最大的骨头是？",opts:["颅骨","股骨","胫骨","肋骨"],a:1,c:"生物"},
    {q:"《三国演义》的作者是？",opts:["罗贯中","施耐庵","吴承恩","曹雪芹"],a:0,c:"文学"},
    {q:"地球的卫星是？",opts:["太阳","月球","火星","金星"],a:1,c:"天文"},
    {q:"中国传统节日端午节吃什么？",opts:["月饼","饺子","粽子","汤圆"],a:2,c:"文化"},
    {q:"世界上最大的沙漠是？",opts:["戈壁滩","撒哈拉沙漠","塔克拉玛干","沙漠"],a:1,c:"地理"},
    {q:"声音在什么介质中传播最快？",opts:["空气","水","真空","固体"],a:3,c:"物理"},
    {q:"熊猫主要吃什么？",opts:["肉","鱼","竹子","水果"],a:2,c:"生物"},
    {q:"太阳从哪个方向升起？",opts:["东","南","西","北"],a:0,c:"常识"},
    {q:"中国的母亲河是？",opts:["长江","黄河","珠江","淮河"],a:1,c:"文化"},
    {q:"国际象棋有多少种棋子？",opts:["4种","5种","6种","7种"],a:2,c:"体育"},
    {q:"人体大约有多少块骨头？",opts:["106块","206块","306块","406块"],a:1,c:"生物"}
];

const CATEGORIES = ["全部","地理","历史","文学","科学","体育","文化","常识","生物","化学"];

let audioCtx=null;
function initAudio(){
    if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
}
function playTone(freq,dur,type,vol){
    if(!audioCtx)return;
    try{
        const o=audioCtx.createOscillator();
        const g=audioCtx.createGain();
        o.type=type||'sine';
        o.frequency.value=freq;
        g.gain.value=vol||0.15;
        g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
        o.connect(g);g.connect(audioCtx.destination);
        o.start();o.stop(audioCtx.currentTime+dur);
    }catch(e){}
}
function sfxBtn(){playTone(700,0.08,'sine',0.12)}
function sfxCorrect(){playTone(880,0.1,'sine',0.18);setTimeout(()=>playTone(1100,0.15,'sine',0.18),80)}
function sfxWrong(){playTone(220,0.1,'sawtooth',0.15);setTimeout(()=>playTone(180,0.2,'sawtooth',0.12),100)}
function sfxWin(){playTone(523,0.1,'sine',0.2);setTimeout(()=>playTone(659,0.1,'sine',0.2),100);setTimeout(()=>playTone(784,0.15,'sine',0.2),200);setTimeout(()=>playTone(1046,0.3,'sine',0.2),350)}
function sfxTick(){playTone(900,0.03,'square',0.08)}
function sfxBonus(){playTone(700,0.08,'triangle',0.18);setTimeout(()=>playTone(900,0.08,'triangle',0.18),60);setTimeout(()=>playTone(1200,0.15,'triangle',0.18),120)}

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let scale=1;
function resize(){
    const r=W/H;
    let cw=window.innerWidth,ch=window.innerHeight;
    if(cw/ch>r){ch=cw/r}else{cw=ch*r}
    canvas.width=cw;canvas.height=ch;
    scale=cw/W;
    ctx.setTransform(scale,0,0,scale,0,0);
}
window.addEventListener('resize',resize);
resize();

const G={
    state:STATE_MENU,
    category:0,
    currentQ:null,
    qIdx:-1,
    qList:[],
    score:0,
    highScore:0,
    combo:0,
    maxCombo:0,
    correct:0,
    wrong:0,
    total:10,
    answered:0,
    selected:-1,
    answeredFlag:false,
    btnRects:{},
    particles:[],
    paused:false,
    bgBubbles:[],
    timeLeft:0,
    qTime:20,
    timerActive:false,
    difficulty:1,
    fiftyUsed:false,
    hintUsed:false,
    skipUsed:false,
    removedOpts:[],
    floatMsgs:[],
    resultAnim:0,
    bonusShown:false
};

G.highScore=parseInt(Storage.load('quiz_high','0'));

for(let i=0;i<20;i++){
    G.bgBubbles.push({
        x:Math.random()*W,
        y:H+Math.random()*H,
        r:15+Math.random()*35,
        speed:0.3+Math.random()*0.7,
        hue:180+Math.random()*60,
        alpha:0.08+Math.random()*0.1
    });
}

function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
}

function drawBtn(ctx,x,y,w,h,text,name,color,textColor,fontSize,disabled){
    G.btnRects[name]={x:x,y:y,w:w,h:h,disabled:disabled};
    ctx.fillStyle=disabled?'rgba(150,150,150,0.4)':(color||'#26d0ce');
    roundRect(ctx,x,y,w,h,12);
    ctx.fill();
    ctx.strokeStyle=disabled?'rgba(255,255,255,0.2)':'rgba(255,255,255,0.5)';
    ctx.lineWidth=2;
    roundRect(ctx,x,y,w,h,12);
    ctx.stroke();
    ctx.fillStyle=disabled?'#bbb':(textColor||'#fff');
    ctx.font='bold '+(fontSize||18)+'px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(text,x+w/2,y+h/2);
    ctx.textBaseline='alphabetic';
}

function hitBtn(p,name){
    const r=G.btnRects[name];
    return r && !r.disabled && p.x>=r.x && p.x<=r.x+r.w && p.y>=r.y && p.y<=r.y+r.h;
}

function getPos(e){
    const rect=canvas.getBoundingClientRect();
    const t=e.touches?e.touches[0]:e;
    return{x:(t.clientX-rect.left)/scale,y:(t.clientY-rect.top)/scale};
}

function updateBubbles(){
    for(const b of G.bgBubbles){
        b.y-=b.speed;
        if(b.y+b.r<0){b.y=H+b.r;b.x=Math.random()*W}
    }
}
function drawBubbles(ctx){
    for(const b of G.bgBubbles){
        ctx.globalAlpha=b.alpha;
        const grad=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r);
        grad.addColorStop(0,`hsla(${b.hue},70%,70%,0.8)`);
        grad.addColorStop(1,`hsla(${b.hue},70%,50%,0.1)`);
        ctx.fillStyle=grad;
        ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
}

function spawnParticles(x,y,color,count){
    for(let i=0;i<(count||15);i++){
        G.particles.push({
            x:x,y:y,
            vx:(Math.random()-0.5)*10,
            vy:(Math.random()-0.5)*10-3,
            life:50,maxLife:50,
            size:3+Math.random()*4,
            color:color
        });
    }
}
function updateParticles(){
    for(let i=G.particles.length-1;i>=0;i--){
        const p=G.particles[i];
        p.x+=p.vx;p.y+=p.vy;
        p.vy+=0.25;
        p.life--;
        if(p.life<=0) G.particles.splice(i,1);
    }
}
function drawParticles(ctx){
    for(const p of G.particles){
        ctx.globalAlpha=p.life/p.maxLife;
        ctx.fillStyle=p.color;
        ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
}

function addFloat(x,y,text,color){
    G.floatMsgs.push({x:x,y:y,text:text,color:color||'#fff',life:50,vy:-1.2});
}
function updateFloat(){
    for(let i=G.floatMsgs.length-1;i>=0;i--){
        const f=G.floatMsgs[i];
        f.y+=f.vy;f.life--;
        if(f.life<=0) G.floatMsgs.splice(i,1);
    }
}
function drawFloat(ctx){
    for(const f of G.floatMsgs){
        ctx.globalAlpha=f.life/50;
        ctx.fillStyle=f.color;
        ctx.font='bold 20px "Microsoft YaHei"';
        ctx.textAlign='center';
        ctx.fillText(f.text,f.x,f.y);
    }
    ctx.globalAlpha=1;ctx.textAlign='left';
}

window.addEventListener('keydown',function(e){
    G.keys=G.keys||{};
    G.keys[e.key.toLowerCase()]=true;
    if(e.key==='Escape'){if(G.state===STATE_PLAYING)togglePause()}
    if(G.state===STATE_PLAYING && !G.answeredFlag){
        if(e.key==='1'||e.key==='2'||e.key==='3'||e.key==='4'){
            selectAnswer(parseInt(e.key)-1);
        }
    }
    initAudio();
});
window.addEventListener('keyup',function(e){
    if(G.keys) G.keys[e.key.toLowerCase()]=false;
});

function handlePointerDown(e){
    initAudio();
    const p=getPos(e);
    if(G.state===STATE_MENU){
        if(hitBtn(p,'start')){startGame();return}
        for(let i=0;i<CATEGORIES.length;i++){
            if(hitBtn(p,'cat'+i)){G.category=i;sfxBtn();return}
        }
        for(let i=0;i<3;i++){
            if(hitBtn(p,'diff'+i)){G.difficulty=i+1;sfxBtn();G.qTime=i===0?30:i===1?20:15;return}
        }
    } else if(G.state===STATE_OVER){
        if(hitBtn(p,'restart')){startGame();return}
        if(hitBtn(p,'menu')){G.state=STATE_MENU;return}
    } else if(G.state===STATE_PLAYING && !G.paused){
        if(hitBtn(p,'pause')){togglePause();return}
        if(!G.answeredFlag){
            for(let i=0;i<4;i++){
                if(hitBtn(p,'opt'+i) && !G.removedOpts.includes(i)){selectAnswer(i);return}
            }
            if(hitBtn(p,'fifty') && !G.fiftyUsed){useFifty();return}
            if(hitBtn(p,'hint') && !G.hintUsed){useHint();return}
            if(hitBtn(p,'skip') && !G.skipUsed){useSkip();return}
        } else {
            if(hitBtn(p,'nextQ')){nextQuestion();return}
        }
    }
}
function handlePointerMove(e){}
function handlePointerUp(e){}

canvas.addEventListener('mousedown',handlePointerDown);
canvas.addEventListener('mousemove',handlePointerMove);
canvas.addEventListener('mouseup',handlePointerUp);
canvas.addEventListener('touchstart',function(e){e.preventDefault();handlePointerDown(e)},{passive:false});
canvas.addEventListener('touchmove',function(e){e.preventDefault();handlePointerMove(e)},{passive:false});
canvas.addEventListener('touchend',function(e){e.preventDefault();handlePointerUp(e)},{passive:false});

function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    return arr;
}

function buildQuestionList(){
    G.qList=[];
    const pool=QUESTIONS.filter(q=>G.category===0||q.c===CATEGORIES[G.category]);
    const list=shuffle([...pool]);
    for(let i=0;i<Math.min(G.total,list.length);i++){
        G.qList.push(list[i]);
    }
    while(G.qList.length<G.total){
        G.qList.push(QUESTIONS[Math.floor(Math.random()*QUESTIONS.length)]);
    }
}

function startGame(){
    initAudio();
    G.state=STATE_PLAYING;
    G.score=0;
    G.combo=0;G.maxCombo=0;
    G.correct=0;G.wrong=0;G.answered=0;
    G.fiftyUsed=false;G.hintUsed=false;G.skipUsed=false;
    G.bonusShown=false;
    G.total=[10,15,20][G.difficulty-1];
    buildQuestionList();
    G.qIdx=-1;
    nextQuestion();
    sfxWin();
    spawnParticles(W/2,H/2,'#ffd700',25);
}

function endGame(){
    G.state=STATE_OVER;
    if(G.score>G.highScore){
        G.highScore=G.score;
        Storage.save('quiz_high',G.highScore);
    }
    sfxWin();
}

function togglePause(){
    G.paused=!G.paused;
    sfxBtn();
}

function nextQuestion(){
    G.qIdx++;
    if(G.qIdx>=G.total){endGame();return}
    G.currentQ=G.qList[G.qIdx];
    G.selected=-1;
    G.answeredFlag=false;
    G.removedOpts=[];
    G.timerActive=true;
    G.timeLeft=G.qTime*60;
    G.resultAnim=0;
    sfxBtn();
}

function selectAnswer(idx){
    if(G.answeredFlag||G.removedOpts.includes(idx))return;
    G.selected=idx;
    G.answeredFlag=true;
    G.timerActive=false;
    G.resultAnim=1;
    const correct=idx===G.currentQ.a;
    if(correct){
        G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);
        G.correct++;
        const timeBonus=Math.floor(G.timeLeft/30);
        const comboBonus=Math.max(0,G.combo-1)*10;
        const base=100*G.difficulty;
        const total=base+timeBonus+comboBonus;
        G.score+=total;
        sfxCorrect();
        spawnParticles(W/2,380,'#43e97b',25);
        addFloat(W/2,340,'+'+total+(comboBonus>0?' ('+G.combo+'连击!)':''),'#43e97b');
        if(G.combo>=3 && !G.bonusShown){
            G.bonusShown=true;
            sfxBonus();
        }
    } else {
        G.combo=0;
        G.wrong++;
        sfxWrong();
        spawnParticles(W/2,380,'#fa709a',20);
        addFloat(W/2,340,'答错了','#fa709a');
    }
    G.answered++;
}

function useFifty(){
    G.fiftyUsed=true;
    const right=G.currentQ.a;
    const wrongs=[];
    for(let i=0;i<4;i++){if(i!==right)wrongs.push(i)}
    shuffle(wrongs);
    G.removedOpts.push(wrongs[0],wrongs[1]);
    sfxBtn();
    addFloat(W/2,250,'✂️ 去除2个错误答案','#ffe66d');
}
function useHint(){
    G.hintUsed=true;
    const right=G.currentQ.a;
    sfxBtn();
    G.removedOpts.push(right);
    setTimeout(()=>{G.removedOpts.pop()},200);
    addFloat(W/2,250,'💡 答案提示:闪烁的是正确答案','#ffe66d');
}
function useSkip(){
    G.skipUsed=true;
    G.score=Math.max(0,G.score-30);
    addFloat(W/2,250,'⏭ 跳过 -30分','#a8e6cf');
    nextQuestion();
}

function update(){
    updateBubbles();
    updateParticles();
    updateFloat();
    if(G.state!==STATE_PLAYING||G.paused) return;
    if(G.timerActive){
        G.timeLeft--;
        if(G.timeLeft<=0){
            G.timerActive=false;
            G.answeredFlag=true;
            G.combo=0;G.wrong++;
            sfxWrong();
            addFloat(W/2,340,'⏰ 超时！','#fa709a');
        }
        if(G.timeLeft===300)sfxTick();
        if(G.timeLeft===180)sfxTick();
        if(G.timeLeft===60)sfxTick();
    }
}

function drawBackground(ctx){
    const grad=ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,'#1a2980');
    grad.addColorStop(1,'#26d0ce');
    ctx.fillStyle=grad;
    ctx.fillRect(0,0,W,H);
    drawBubbles(ctx);
}

function drawHUD(ctx){
    ctx.fillStyle='rgba(0,0,0,0.4)';
    roundRect(ctx,10,10,W-20,70,12);ctx.fill();
    ctx.fillStyle='#fff';
    ctx.font='bold 14px "Microsoft YaHei"';
    ctx.textAlign='left';
    ctx.fillText('题目',25,32);
    ctx.font='bold 22px Arial';
    ctx.fillStyle='#ffd700';
    ctx.fillText((G.qIdx+1)+'/'+G.total,60,32);
    ctx.fillStyle='#fff';
    ctx.font='bold 13px "Microsoft YaHei"';
    ctx.fillText('('+G.currentQ.c+')',110,32);
    ctx.textAlign='center';
    const ratio=G.timeLeft/(G.qTime*60);
    const barW=160,barH=18;
    const bx=W/2-barW/2;
    ctx.fillStyle='rgba(0,0,0,0.3)';
    roundRect(ctx,bx,23,barW,barH,9);ctx.fill();
    const c=ratio<0.25?'#fa709a':ratio<0.5?'#ffe66d':'#43e97b';
    ctx.fillStyle=c;
    roundRect(ctx,bx+2,25,(barW-4)*Math.max(0,ratio),barH-4,7);ctx.fill();
    ctx.fillStyle='#fff';
    ctx.font='bold 13px Arial';
    ctx.fillText(Math.ceil(G.timeLeft/60)+'s',W/2,36);
    ctx.textAlign='right';
    ctx.fillStyle='#fff';
    ctx.font='bold 14px "Microsoft YaHei"';
    ctx.fillText('得分',W-25,32);
    ctx.fillStyle='#ffd700';
    ctx.font='bold 24px Arial';
    ctx.fillText(G.score,W-25,58);
    ctx.textAlign='left';
    ctx.fillStyle='rgba(255,255,255,0.75)';
    ctx.font='11px "Microsoft YaHei"';
    ctx.textAlign='center';
    const combo=G.combo>0?G.combo+'连击 | ':'';
    ctx.fillText(combo+'✓'+G.correct+' ✗'+G.wrong,W/2,70);
    ctx.textAlign='left';
}

function drawQuestion(ctx){
    if(!G.currentQ)return;
    const qy=130,qw=W-40;
    const grad=ctx.createLinearGradient(20,qy,W-20,qy);
    grad.addColorStop(0,'rgba(255,255,255,0.12)');
    grad.addColorStop(0.5,'rgba(255,255,255,0.18)');
    grad.addColorStop(1,'rgba(255,255,255,0.12)');
    ctx.fillStyle=grad;
    roundRect(ctx,20,qy,qw,125,16);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.3)';
    ctx.lineWidth=2;
    roundRect(ctx,20,qy,qw,125,16);ctx.stroke();
    ctx.fillStyle='rgba(255,215,0,0.95)';
    ctx.font='bold 16px "Microsoft YaHei"';
    ctx.fillText('Q'+(G.qIdx+1)+'. ['+G.currentQ.c+']',35,qy+28);
    ctx.fillStyle='#fff';
    ctx.font='bold 19px "Microsoft YaHei"';
    ctx.textAlign='left';
    const words=G.currentQ.q.split('');
    let line='',lines=[];
    for(let i=0;i<words.length;i++){
        const t=line+words[i];
        if(ctx.measureText(t).width>qw-30){lines.push(line);line=words[i]}
        else line=t;
    }
    lines.push(line);
    for(let i=0;i<lines.length;i++){
        ctx.fillText(lines[i],35,qy+58+i*26);
    }
    ctx.textAlign='left';
}

function drawOptions(ctx){
    if(!G.currentQ)return;
    const oy=275,oh=58,ogap=12;
    const ow=W-40;
    for(let i=0;i<4;i++){
        const y=oy+i*(oh+ogap);
        let bg='rgba(255,255,255,0.18)';
        let border='rgba(255,255,255,0.4)';
        let textC='#fff';
        const removed=G.removedOpts.includes(i);
        if(removed){bg='rgba(100,100,100,0.25)';textC='#888';border='rgba(150,150,150,0.2)'}
        if(G.answeredFlag){
            if(i===G.currentQ.a){bg='#43e97b';textC='#fff';border='#fff'}
            else if(i===G.selected && i!==G.currentQ.a){bg='#fa709a';textC='#fff';border='#fff'}
            else if(removed){}
            else{bg='rgba(255,255,255,0.1)';textC='rgba(255,255,255,0.5)'}
        }
        if(G.hintUsed && i===G.currentQ.a && !G.answeredFlag){
            const f=Math.sin(Date.now()/80)>0;
            if(f){bg='rgba(255,230,109,0.5)';border='#ffe66d'}
        }
        G.btnRects['opt'+i]={x:20,y:y,w:ow,h:oh,disabled:G.answeredFlag||removed};
        ctx.fillStyle=bg;
        roundRect(ctx,20,y,ow,oh,14);ctx.fill();
        ctx.strokeStyle=border;ctx.lineWidth=2.5;
        roundRect(ctx,20,y,ow,oh,14);ctx.stroke();
        ctx.fillStyle=i===0?'#ff6b6b':i===1?'#4ecdc4':i===2?'#ffe66d':'#a78bfa';
        ctx.font='bold 18px Arial';
        ctx.fillText(String.fromCharCode(65+i),40,y+oh/2+6);
        ctx.fillStyle=textC;
        ctx.font='bold 17px "Microsoft YaHei"';
        ctx.textAlign='center';
        const txt=removed?'✖ 已移除':G.currentQ.opts[i];
        ctx.fillText(txt,20+ow/2,y+oh/2+6);
        if(G.answeredFlag && i===G.currentQ.a){
            ctx.font='bold 24px Arial';
            ctx.fillStyle='#fff';
            ctx.fillText('✓',20+ow-40,y+oh/2+6);
        } else if(G.answeredFlag && i===G.selected && i!==G.currentQ.a){
            ctx.font='bold 24px Arial';
            ctx.fillStyle='#fff';
            ctx.fillText('✗',20+ow-40,y+oh/2+6);
        }
        ctx.textAlign='left';
    }
}

function drawPowerups(ctx){
    if(G.answeredFlag){
        drawBtn(ctx,W/2-90,H-100,180,55,'▶ 下一题','nextQ','#ffd700','#333',18);
        return;
    }
    const bw=(W-50)/3,by=H-85;
    drawBtn(ctx,15,by,bw,50,'✂ 50/50','fifty',G.fiftyUsed?'rgba(150,150,150,0.3)':'#ff6b6b','#fff',14,G.fiftyUsed);
    drawBtn(ctx,25+bw,by,bw,50,'💡 提示','hint',G.hintUsed?'rgba(150,150,150,0.3)':'#ffe66d','#333',14,G.hintUsed);
    drawBtn(ctx,35+bw*2,by,bw,50,'⏭ 跳过-30','skip',G.skipUsed?'rgba(150,150,150,0.3)':'#4ecdc4','#fff',13,G.skipUsed);
    drawBtn(ctx,W-60,90,45,35,'⏸','pause','rgba(255,255,255,0.25)');
}

function drawMenu(ctx){

    const col=['#26d0ce','#ffd700','#ff6b6b'];
    for(let i=0;i<3;i++){ctx.fillStyle=col[i];ctx.beginPath();ctx.arc(-50+i*50,0,50-i*8,0,Math.PI*2);ctx.fill()}
    ctx.globalAlpha=1;ctx.fillStyle='#fff';
    ctx.font='bold 44px "Microsoft YaHei"';ctx.textAlign='center';
    ctx.fillText('🧠 百科知识',0,15);
    ctx.restore();
    ctx.fillStyle='#ffe66d';
    ctx.font='bold 40px "Microsoft YaHei"';ctx.textAlign='center';
    ctx.fillText('大挑战',W/2,170);
    ctx.fillStyle='#c7ceea';ctx.font='bold 16px Arial';
    ctx.fillText('KNOWLEDGE QUIZ CHALLENGE',W/2,198);
    ctx.fillStyle='#fff';ctx.font='bold 17px "Microsoft YaHei"';
    ctx.fillText('选择题库',W/2,235);
    let cx0=15,cy0=260,cw0=105,ch0=42,cgap=7;

    }

    ctx.fillText('难度选择',W/2,415);
    const db=[
        {n:'diff0',t:'简单\n30s/题',x:W/2-160,y:445,w:100,h:60},
        {n:'diff1',t:'普通\n20s/题',x:W/2-50,y:445,w:100,h:60},
        {n:'diff2',t:'困难\n15s/题',x:W/2+60,y:445,w:100,h:60}

        const sel=(b.n==='diff0'&&G.difficulty===1)||(b.n==='diff1'&&G.difficulty===2)||(b.n==='diff2'&&G.difficulty===3);
        drawBtn(ctx,b.x,b.y,b.w,b.h,b.t.replace('\n',' '),b.n,

    }

    ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='14px "Microsoft YaHei"';
    ctx.fillText('答对 +基础分  剩余时间越多加分越多',W/2,650);
    ctx.fillStyle='rgba(255,255,255,0.75)';ctx.font='12px "Microsoft YaHei"';
    ctx.fillText('3连击以上有额外奖励！道具：50/50 · 提示 · 跳过',W/2,675);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='12px "Microsoft YaHei"';
    ctx.fillText('键盘1-4选择答案  ESC暂停',W/2,700);
    ctx.textAlign='left';
}

function drawGame(ctx){
    drawBackground(ctx);
    drawHUD(ctx);
    drawQuestion(ctx);
    drawOptions(ctx);
    drawPowerups(ctx);
    drawParticles(ctx);
    drawFloat(ctx);
    if(G.paused){
        ctx.fillStyle='rgba(0,0,0,0.78)';
        ctx.fillRect(0,0,W,H);
        ctx.fillStyle='#fff';ctx.font='bold 48px "Microsoft YaHei"';ctx.textAlign='center';
        ctx.fillText('⏸ 暂停',W/2,H/2-20);
        ctx.font='18px "Microsoft YaHei"';ctx.fillStyle='rgba(255,255,255,0.7)';
        ctx.fillText('按 ESC 继续游戏',W/2,H/2+30);ctx.textAlign='left';
    }
}

function drawGameOver(ctx){
    drawBackground(ctx);
    ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(0,0,W,H);
    const isNew=G.score>=G.highScore&&G.score>0;
    ctx.fillStyle=isNew?'#ffd700':'#fff';
    ctx.font='bold 44px "Microsoft YaHei"';ctx.textAlign='center';
    ctx.fillText(isNew?'🏆 新纪录!':'🎊 挑战结束',W/2,110);
    ctx.fillStyle='#fff';ctx.font='bold 22px "Microsoft YaHei"';
    ctx.fillText('最终得分',W/2,170);
    ctx.fillStyle='#ffd700';ctx.font='bold 96px Arial';
    ctx.fillText(G.score,W/2,275);
    ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='bold 18px "Microsoft YaHei"';
    ctx.fillText('答题 '+G.answered+' 道  |  正确 '+G.correct+'  |  错误 '+G.wrong,W/2,325);
    const acc=G.answered>0?Math.round(G.correct/G.answered*100):0;
    ctx.fillText('正确率 '+acc+'%  |  最高连击 '+G.maxCombo+' 连',W/2,355);
    ctx.fillStyle='#ffd700';ctx.font='bold 20px "Microsoft YaHei"';
    ctx.fillText('🏆 最高分纪录: '+G.highScore,W/2,405);
    const ratings=[
        {min:2500,t:'百科全书 📚',c:'#ffd700'},
        {min:1800,t:'知识达人 🧠',c:'#f093fb'},
        {min:1200,t:'学霸附体 🎓',c:'#4ecdc4'},
        {min:600,t:'初露锋芒 🌟',c:'#a8e6cf'},
        {min:0,t:'继续学习 💪',c:'#ff8b94'}
    ];
    let ra=ratings[ratings.length-1];
    for(const r of ratings){if(G.score>=r.min){ra=r;break}}
    ctx.fillStyle=ra.c;ctx.font='bold 32px "Microsoft YaHei"';
    ctx.fillText(ra.t,W/2,465);
    drawBtn(ctx,W/2-110,515,220,65,'🔄 再来挑战','restart','#fff','#1a2980',20);
    drawBtn(ctx,W/2-80,595,160,45,'🏠 返回菜单','menu','rgba(255,255,255,0.3)','#fff',16);
    ctx.textAlign='left';
}

function draw(){
    switch(G.state){
        case STATE_MENU: drawMenu(ctx); break;
        case STATE_PLAYING: drawGame(ctx); break;
        case STATE_OVER: drawGameOver(ctx); break;
        case STATE_PAUSE: drawGame(ctx); break;
    }
}

function gameLoop(){
    requestAnimationFrame(gameLoop);
    update();
    draw();
}

gameLoop();

function hitBtn2(p,name){
    const r=G.btnRects[name];if(!r||r.disabled)return false;
    return p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;
}
function handlePointerDown2(e){
    const p=typeof getPos==='function'?getPos(e):{x:0,y:0};
    const st=G.state;
    if(st===STATE_MENU){
        if(hitBtn2(p,'openSettings')){G.state=STATE_SETTINGS;return}
        if(hitBtn2(p,'openAch')){G.state=STATE_ACHIEVEMENTS;return}
        if(hitBtn2(p,'openStats')){G.state=STATE_STATS;return}
        if(hitBtn2(p,'openHelp')){G.state=STATE_HELP;return}
    } else if(st===STATE_SETTINGS||st===STATE_ACHIEVEMENTS||st===STATE_HELP||st===STATE_STATS){
        if(hitBtn2(p,'closeSub')||hitBtn2(p,'backMain')){G.state=STATE_MENU;return}
        if(st===STATE_SETTINGS){
            if(hitBtn2(p,'set_soundOn')){SETTINGS.soundOn=!SETTINGS.soundOn;saveSettings();return}
            if(hitBtn2(p,'set_vibOn')){SETTINGS.vibOn=!SETTINGS.vibOn;saveSettings();return}
            if(hitBtn2(p,'set_showTimer')){SETTINGS.showTimer=!SETTINGS.showTimer;saveSettings();return}
            if(hitBtn2(p,'resetData')){
                if(confirm('确定清除所有存档、统计和成就吗？无法恢复！')){
                    for(const k of ['_g','_c','_w','_bc','_h','_bs','_unlock'])Storage.remove(SK+k);
                    STAT.totalGames=0;STAT.totalCorrect=0;STAT.totalWrong=0;STAT.bestCombo=0;
                    STAT.totalHintUsed=0;STAT.bestScore=0;STAT.unlocked=[];
                    for(const a of ACHIEVEMENTS)a.unlocked=false;if(G)G.highScore=0;saveStat();
                }
                return;
            }
            for(let i=0;i<THEMES.length;i++){
                if(hitBtn2(p,'theme_'+i)){SETTINGS.theme=i;saveSettings();applyTheme();return}
            }
        }
    }
    return origPointerDown(e);
}

function getDailyStatus(){
    const today=getDailySeed();
    const prev=parseInt(Storage.load(DAILY_KEY+'_d','0'));
    const best=parseInt(Storage.load(DAILY_KEY+'_b','0'));
    const done=prev===today;
    return {today,best:done?best:0,done};
}
function setDailyDone(score){
    const s=getDailyStatus();
    if(s.today!==parseInt(Storage.load(DAILY_KEY+'_d','0')) || score>s.best){
        Storage.save(DAILY_KEY+'_d',String(s.today));
        Storage.save(DAILY_KEY+'_b',String(score));
    }
}
function seededRand(seed){let t=seed+0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296}

// ==================== 更多成就钩子 ====================
function checkSpeedAchieve(t){if(t&&t<10)unlockAchieve('speed')}
function checkPartyAchieve(players){if(players&&players>=5)unlockAchieve('party1')}
function checkTryhardAchieve(){
    const KEY='quiz_streak_v1';
    const today=new Date().toDateString();
    const rec=JSON.parse(Storage.load(KEY,'{"last":"","days":0}'));
    if(rec.last!==today){
        const y=new Date(Date.now()-86400000).toDateString();
        if(rec.last===y)rec.days++;else rec.days=1;
        rec.last=today;Storage.save(KEY,JSON.stringify(rec));
    }
    if(rec.days>=3)unlockAchieve('tryhard');
}

// ==================== 更丰富的动画粒子系统 ====================
const TRAILS=[];
function addTrail(x,y,color){TRAILS.push({x,y,color,life:1})}
function updateTrails(){for(let i=TRAILS.length-1;i>=0;i--){const t=TRAILS[i];t.life-=0.03;t.y+=0.6;if(t.life<=0)TRAILS.splice(i,1)}}
function drawTrails(ctx){
    for(const t of TRAILS){ctx.globalAlpha=t.life*0.7;ctx.fillStyle=t.color;ctx.beginPath();ctx.arc(t.x,t.y,4*t.life+1,0,Math.PI*2);ctx.fill()}
    ctx.globalAlpha=1;
}

// ==================== 更多菜单内容 ====================
const _oldDrawMenuEx=typeof drawMenuEx==='function'?drawMenuEx:(typeof drawMenu==='function'?drawMenu:function(){});
function drawMenuExtended2(ctx){
    _oldDrawMenuEx(ctx);
    // 等级徽章
    drawLevelBadge(ctx,42,108,42);
    ctx.fillStyle='#fff';ctx.font='bold 12px "Microsoft YaHei"';ctx.textAlign='left';
    ctx.fillText('Lv.'+LV.level,70,102);
    // 经验条
    ctx.fillStyle='rgba(0,0,0,0.25)';
    if(typeof roundRect==='function')roundRect(ctx,70,110,130,10,5);ctx.fill();
    const pg=getLvProgress();
    ctx.fillStyle='#ffd700';
    if(typeof roundRect==='function')roundRect(ctx,70,110,130*pg,10,5);ctx.fill();
    // 每日挑战
    const ds=getDailyStatus();
    if(typeof drawBtn==='function'){
        drawBtn(ctx,W-140,90,125,38,ds.done?('✓ 今日最佳:'+ds.best):'🌟 每日挑战','dailyBtn',ds.done?'#bdbdbd':'#ff9800','#fff',13);
    }
    // 排行榜按钮
    if(typeof drawBtn==='function'){
        drawBtn(ctx,W-140,136,125,34,'🏆 排行榜','lbBtn','rgba(255,255,255,0.8)','#333',13);
    }
    checkTryhardAchieve();
    updateTrails();
    drawTrails(ctx);
}
// 排行榜模态状态
const STATE_LEADERBOARD=105;
const STATE_DAILY=106;
function drawLeaderboardPage(ctx){
    drawBackground(ctx);drawSubPageBackdrop(ctx,'🏆 本地排行榜 TOP 10');
    drawLeaderboard(ctx,null,35,155,W-70,H-290,THEMES[SETTINGS.theme%THEMES.length].accent);
    if(typeof drawBtn==='function')drawBtn(ctx,W/2-70,H-120,140,42,'返回菜单','backMain','#9c27b0','#fff',16);
}
function drawDailyChallengePage(ctx){
    drawBackground(ctx);drawSubPageBackdrop(ctx,'🌟 每日挑战');
    const ds=getDailyStatus();
    const y=170;
    ctx.fillStyle='#333';ctx.textAlign='center';
    ctx.font='bold 20px "Microsoft YaHei"';ctx.fillText('挑战日期：'+String(ds.today).slice(0,4)+'/'+String(ds.today).slice(4,6)+'/'+String(ds.today).slice(6,8),W/2,y);
    ctx.font='bold 16px "Microsoft YaHei"';ctx.fillStyle=ds.done?'#4caf50':'#ff5722';
    ctx.fillText(ds.done?'✓ 今日已完成，最佳：'+ds.best:'今日挑战进行中！完成后奖励双倍经验！',W/2,y+40);
    ctx.font='14px "Microsoft YaHei"';ctx.fillStyle='#666';
    ctx.fillText('每日0点自动刷新，使用当日种子题目，记录每日最佳',W/2,y+75);
    ctx.fillText('奖励：完成每日挑战额外奖励500 XP',W/2,y+100);
    ctx.fillText('历史最佳排行榜可在主菜单查看',W/2,y+125);
    // 双倍加成说明
    ctx.fillStyle='rgba(255,152,0,0.08)';
    if(typeof roundRect==='function'){roundRect(ctx,50,y+155,W-100,80,12);ctx.fill();
    ctx.strokeStyle='rgba(255,152,0,0.4)';ctx.lineWidth=2;roundRect(ctx,50,y+155,W-100,80,12);ctx.stroke();}
    ctx.fillStyle='#e65100';ctx.font='bold 15px "Microsoft YaHei"';
    ctx.fillText('🎁 完成今日挑战 = 500 XP额外奖励',W/2,y+188);
    ctx.font='13px "Microsoft YaHei"';ctx.fillText('直接返回主菜单，使用正常开始按钮即可完成当日挑战',W/2,y+212);
    if(typeof drawBtn==='function')drawBtn(ctx,W/2-70,H-120,140,42,'返回菜单','backMain','#9c27b0','#fff',16);
    ctx.textAlign='left';
}
const _origDrawEx2=typeof drawEx==='function'?drawEx:(typeof draw==='function'?draw:function(){});
function drawEx2(){
    switch(G.state){
        case STATE_LEADERBOARD:drawLeaderboardPage(ctx);break;
        case STATE_DAILY:drawDailyChallengePage(ctx);break;
        case STATE_MENU:drawMenuExtended2(ctx);break;
        default:_origDrawEx2();
    }
}
// 点击钩子扩展
const _origPD2=typeof handlePointerDown2==='function'?handlePointerDown2:(typeof handlePointerDown==='function'?handlePointerDown:function(){});
function handlePointerDown3(e){
    const p=typeof getPos==='function'?getPos(e):{x:0,y:0};
    const st=G.state;
    if(st===STATE_MENU){
        if(hitBtn2(p,'lbBtn')){G.state=STATE_LEADERBOARD;return}
        if(hitBtn2(p,'dailyBtn')){G.state=STATE_DAILY;return}
    } else if(st===STATE_LEADERBOARD||st===STATE_DAILY){
        if(hitBtn2(p,'closeSub')||hitBtn2(p,'backMain')){G.state=STATE_MENU;return}
    }
    return _origPD2(e);
}
if(typeof canvas!=='undefined'){
    canvas.addEventListener('mousedown',handlePointerDown3);
    canvas.addEventListener('touchstart',function(e){e.preventDefault();handlePointerDown3(e)},{passive:false});
}
window.cancelAnimationFrame(window.__raf3||0);
(function loop3(){window.__raf3=requestAnimationFrame(loop3);if(typeof update==='function')update();drawEx2()})();

// 自动保存排行榜（在结束时）
const _origUAAG=typeof updateAchievementsAfterGame==='function'?updateAchievementsAfterGame:function(){};
if(typeof window!=='undefined'){
    window['quiz_postGame']=function(score){
        _origUAAG();
        addToLeaderboard(score,'玩家'+LV.level);
        addXp(50+Math.floor(score/20));
        setDailyDone(score);
    }
}

applyTheme();
})();
</script>

<script>

  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>

  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });

})();
