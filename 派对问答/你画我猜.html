<!DOCTYPE html>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>你画我猜</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#ffecd2 0%,#fcb69f 100%);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:"Microsoft YaHei",sans-serif}
canvas{display:block;margin:0 auto}
#start-game-btn{display:block!important;}
.sponsor-close,#sponsorClose,.skip-btn,#skipInterstitial{pointer-events:auto!important;}
</style>
<style>
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);height:90px;max-height:90px;overflow:hidden;contain:layout style paint;pointer-events:none!important}.ad-banner-container,.ad-banner-container *{pointer-events:none!important}.ad-banner-container iframe{max-height:90px;pointer-events:none!important}
.ad-banner-container iframe{max-width:100%}
.ad-label{position:absolute;top:1px;right:6px;font:9px "Microsoft YaHei",sans-serif;color:rgba(255,255,255,.35)}
.sponsor-btn{position:fixed;top:44px;right:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:3px 9px;border-radius:10px;font:11px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .qr-row{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.sponsor-panel .qr-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px;text-align:center;min-width:140px}
.sponsor-panel .qr-card .qr-icon{font-size:48px;margin-bottom:6px}
.sponsor-panel .qr-card .qr-label{color:#ccc;font:13px "Microsoft YaHei",sans-serif}
.sponsor-panel .qr-card .qr-hint{color:#888;font:11px "Microsoft YaHei",sans-serif;margin-top:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.interstitial-ad .ad-content{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;text-align:center;min-width:280px;max-width:400px}
.interstitial-ad .ad-content p{color:#aaa;font:14px "Microsoft YaHei",sans-serif;margin-bottom:12px}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */
</style>
</head>
<body>

<button id="start-game-btn" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:20px 40px;font-size:20px;background:#fcb69f;color:white;border:none;border-radius:12px;cursor:pointer;z-index:999;font-weight:bold;display:none;">开始游戏</button>

<canvas id="c"></canvas>

<script>
if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
</script>
<script src="../game_core.js"></script>
<script>
(function(){
"use strict";

const W=480,H=720;

const WORDS = [
    {w:"苹果",h:["水果","红色","圆形","牛顿"],cat:"食物"},
    {w:"太阳",h:["天空","白天","热","发光"],cat:"自然"},
    {w:"狗",h:["动物","宠物","汪汪","忠诚"],cat:"动物"},
    {w:"猫",h:["动物","宠物","喵喵","抓老鼠"],cat:"动物"},
    {w:"手机",h:["电器","打电话","智能","触屏"],cat:"科技"},
    {w:"西瓜",h:["水果","夏天","绿色","黑色籽"],cat:"食物"},
    {w:"房子",h:["住人","屋顶","窗户","家"],cat:"建筑"},
    {w:"飞机",h:["交通工具","天上飞","快","大"],cat:"交通"},
    {w:"雨伞",h:["下雨","挡雨","折叠","五颜六色"],cat:"日用品"},
    {w:"篮球",h:["运动","圆形","橙色","投篮"],cat:"体育"},
    {w:"蝴蝶",h:["昆虫","美丽","翅膀","花"],cat:"动物"},
    {w:"眼镜",h:["戴在眼睛上","近视","两片镜片","看清楚"],cat:"日用品"},
    {w:"冰淇淋",h:["夏天吃","冷","甜","蛋筒"],cat:"食物"},
    {w:"熊猫",h:["动物","中国国宝","黑白","竹子"],cat:"动物"},
    {w:"月亮",h:["天上","晚上","圆","嫦娥"],cat:"自然"},
    {w:"铅笔",h:["文具","写字","木头","橡皮擦"],cat:"学习"},
    {w:"书包",h:["上学","装书","背在背上","学生"],cat:"学习"},
    {w:"电脑",h:["电器","上网","办公","键盘"],cat:"科技"},
    {w:"医生",h:["职业","医院","看病","白大褂"],cat:"职业"},
    {w:"蛋糕",h:["生日","甜点","奶油","蜡烛"],cat:"食物"},
    {w:"火车",h:["交通工具","铁轨","长","呜呜"],cat:"交通"},
    {w:"兔子",h:["动物","长耳朵","爱吃萝卜","跳"],cat:"动物"},
    {w:"老虎",h:["动物","森林之王","条纹","凶猛"],cat:"动物"},
    {w:"花",h:["植物","美丽","香","春天"],cat:"植物"},
    {w:"树",h:["植物","高","叶子","绿色"],cat:"植物"},
    {w:"冰箱",h:["电器","厨房","冷","放食物"],cat:"家电"},
    {w:"电视",h:["电器","看节目","遥控器","屏幕"],cat:"家电"},
    {w:"筷子",h:["餐具","中国","吃饭","一双"],cat:"日用品"},
    {w:"青蛙",h:["动物","呱呱","绿","跳"],cat:"动物"},
    {w:"鱼",h:["动物","水里游","鳃","鳞片"],cat:"动物"},
    {w:"蜜蜂",h:["昆虫","采蜜","嗡嗡","黄黑"],cat:"动物"},
    {w:"草莓",h:["水果","红色","小籽","甜"],cat:"食物"},
    {w:"自行车",h:["交通工具","两个轮子","脚蹬","环保"],cat:"交通"},
    {w:"鸟",h:["动物","翅膀","飞","叽叽喳喳"],cat:"动物"},
    {w:"护士",h:["职业","医院","照顾病人","白衣天使"],cat:"职业"},
    {w:"警察",h:["职业","抓坏人","制服","警车"],cat:"职业"},
    {w:"老师",h:["职业","学校","上课","黑板"],cat:"职业"},
    {w:"厨师",h:["职业","做饭","餐厅","帽子"],cat:"职业"},
    {w:"雪人",h:["冬天","雪","胡萝卜鼻子","围巾"],cat:"其他"},
    {w:"彩虹",h:["自然现象","下雨后","七种颜色","弯弯的"],cat:"自然"}
];

const COLORS = ['#000000','#ff0000','#ff6b00','#ffe600','#00c853','#00bcd4','#2979ff','#9c27b0','#795548','#ffffff'];
const BRUSH_SIZES = [3,6,10,16,24];

let audioCtx=null;
function initAudio(){
    if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
}
function playTone(freq,dur,type,vol){
    if(!audioCtx)return;
    try{
        const o=audioCtx.createOscillator();
        const g=audioCtx.createGain();
        o.type=type||'sine';
        o.frequency.value=freq;
        g.gain.value=vol||0.15;
        g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
        o.connect(g);g.connect(audioCtx.destination);
        o.start();o.stop(audioCtx.currentTime+dur);
    }catch(e){}
}
function sfxBtn(){playTone(650,0.08,'sine',0.12)}
function sfxDraw(){playTone(500+Math.random()*200,0.02,'sine',0.06)}
function sfxCorrect(){playTone(880,0.1,'sine',0.2);setTimeout(()=>playTone(1100,0.15,'sine',0.18),80)}
function sfxWrong(){playTone(250,0.15,'sawtooth',0.15)}
function sfxWin(){playTone(523,0.1,'sine',0.2);setTimeout(()=>playTone(659,0.1,'sine',0.2),100);setTimeout(()=>playTone(784,0.15,'sine',0.2),200);setTimeout(()=>playTone(1046,0.3,'sine',0.2),350)}
function sfxTick(){playTone(900,0.03,'square',0.08)}
function sfxReveal(){playTone(700,0.08,'triangle',0.15);setTimeout(()=>playTone(1000,0.12,'triangle',0.15),80)}

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let scale=1;
function resize(){
    const r=W/H;
    let cw=window.innerWidth,ch=window.innerHeight;
    if(cw/ch>r){ch=cw/r}else{cw=ch*r}
    canvas.width=cw;canvas.height=ch;
    scale=cw/W;
    ctx.setTransform(scale,0,0,scale,0,0);
}
window.addEventListener('resize',resize);
resize();

const drawCanvas=document.createElement('canvas');
drawCanvas.width=420;drawCanvas.height=340;
const dctx=drawCanvas.getContext('2d');
dctx.fillStyle='#fff';dctx.fillRect(0,0,420,340);

const G={
    state:STATE_MENU,
    currentWord:null,
    wordsDone:[],
    score:0,
    highScore:0,
    rounds:0,
    maxRounds:10,
    guessInput:'',
    inputActive:false,
    hintsShown:0,
    btnRects:{},
    particles:[],
    paused:false,
    bgShapes:[],
    color:0,
    brush:1,
    drawing:false,
    lastX:0,lastY:0,
    phase:0,
    timeLeft:0,
    drawTime:60,
    guessTime:30,
    timerActive:false,
    guessers:[],
    correctCount:0,
    skipCount:0,
    floatMsgs:[],
    hintUnlocked:false,
    showHintBar:false,
    resultShown:false,
    revealAnim:0,
    drawerName:'画家'
};

G.highScore=parseInt(Storage.load('drawguess_high','0'));

for(let i=0;i<30;i++){
    G.bgShapes.push({
        x:Math.random()*W,
        y:Math.random()*H,
        s:8+Math.random()*20,
        vy:-0.3-Math.random()*0.5,
        vx:(Math.random()-0.5)*0.4,
        r:Math.random()*Math.PI*2,
        vr:(Math.random()-0.5)*0.02,
        shape:Math.floor(Math.random()*3),
        a:0.12+Math.random()*0.1
    });
}

function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
}

function drawBtn(ctx,x,y,w,h,text,name,color,textColor,fontSize,disabled){
    G.btnRects[name]={x:x,y:y,w:w,h:h,disabled:disabled};
    ctx.fillStyle=disabled?'rgba(150,150,150,0.4)':(color||'#fcb69f');
    roundRect(ctx,x,y,w,h,10);
    ctx.fill();
    ctx.strokeStyle=disabled?'rgba(255,255,255,0.2)':'rgba(255,255,255,0.55)';
    ctx.lineWidth=2;
    roundRect(ctx,x,y,w,h,10);
    ctx.stroke();
    ctx.fillStyle=disabled?'#bbb':(textColor||'#fff');
    ctx.font='bold '+(fontSize||16)+'px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(text,x+w/2,y+h/2);
    ctx.textBaseline='alphabetic';
}

function hitBtn(p,name){
    const r=G.btnRects[name];
    return r && !r.disabled && p.x>=r.x && p.x<=r.x+r.w && p.y>=r.y && p.y<=r.y+r.h;
}

function getPos(e){
    const rect=canvas.getBoundingClientRect();
    const t=e.touches?e.touches[0]:e;
    return{x:(t.clientX-rect.left)/scale,y:(t.clientY-rect.top)/scale};
}

function updateShapes(){
    for(const s of G.bgShapes){
        s.y+=s.vy;s.x+=s.vx;s.r+=s.vr;
        if(s.y+s.s<0){s.y=H+s.s;s.x=Math.random()*W}
        if(s.x<-s.s)s.x=W+s.s;if(s.x>W+s.s)s.x=-s.s;
    }
}
function drawShapes(ctx){
    for(const s of G.bgShapes){
        ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.r);ctx.globalAlpha=s.a;
        ctx.fillStyle='#fff';
        if(s.shape===0){ctx.beginPath();ctx.arc(0,0,s.s/2,0,Math.PI*2);ctx.fill()}
        else if(s.shape===1){ctx.fillRect(-s.s/2,-s.s/2,s.s,s.s)}
        else{ctx.beginPath();ctx.moveTo(0,-s.s/2);ctx.lineTo(s.s/2,s.s/2);ctx.lineTo(-s.s/2,s.s/2);ctx.closePath();ctx.fill()}
        ctx.restore();
    }
    ctx.globalAlpha=1;
}

function spawnParticles(x,y,color,count){
    for(let i=0;i<(count||15);i++){
        G.particles.push({
            x:x,y:y,
            vx:(Math.random()-0.5)*10,
            vy:(Math.random()-0.5)*10-3,
            life:50,maxLife:50,
            size:3+Math.random()*4,
            color:color
        });
    }
}
function updateParticles(){
    for(let i=G.particles.length-1;i>=0;i--){
        const p=G.particles[i];
        p.x+=p.vx;p.y+=p.vy;
        p.vy+=0.25;p.life--;
        if(p.life<=0) G.particles.splice(i,1);
    }
}
function drawParticles(ctx){
    for(const p of G.particles){
        ctx.globalAlpha=p.life/p.maxLife;
        ctx.fillStyle=p.color;
        ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
}

function addFloat(x,y,text,color){
    G.floatMsgs.push({x:x,y:y,text:text,color:color||'#fff',life:50,vy:-1.2});
}
function updateFloat(){
    for(let i=G.floatMsgs.length-1;i>=0;i--){
        const f=G.floatMsgs[i];f.y+=f.vy;f.life--;
        if(f.life<=0) G.floatMsgs.splice(i,1);
    }
}
function drawFloat(ctx){
    for(const f of G.floatMsgs){
        ctx.globalAlpha=f.life/50;
        ctx.fillStyle=f.color;
        ctx.font='bold 18px "Microsoft YaHei"';
        ctx.textAlign='center';
        ctx.fillText(f.text,f.x,f.y);
    }
    ctx.globalAlpha=1;ctx.textAlign='left';
}

window.addEventListener('keydown',function(e){
    G.keys=G.keys||{};G.keys[e.key.toLowerCase()]=true;
    if(e.key==='Escape'){if(G.state===STATE_PLAYING)togglePause()}
    if(G.state===STATE_PLAYING && G.inputActive){
        if(e.key==='Backspace'){G.guessInput=G.guessInput.slice(0,-1);sfxBtn()}
        else if(e.key==='Enter'){submitGuess()}
        else if(e.key.length===1){G.guessInput+=e.key;sfxBtn()}
    }
    initAudio();
});
window.addEventListener('keyup',function(e){if(G.keys)G.keys[e.key.toLowerCase()]=false});

function handlePointerDown(e){
    initAudio();
    const p=getPos(e);
    if(G.state===STATE_MENU){
        if(hitBtn(p,'start')){startGame();return}
        if(hitBtn(p,'r5')){G.maxRounds=5;sfxBtn();return}
        if(hitBtn(p,'r10')){G.maxRounds=10;sfxBtn();return}
        if(hitBtn(p,'r20')){G.maxRounds=20;sfxBtn();return}
    } else if(G.state===STATE_OVER){
        if(hitBtn(p,'restart')){startGame();return}
        if(hitBtn(p,'menu')){G.state=STATE_MENU;return}
    } else if(G.state===STATE_PLAYING && !G.paused){
        if(hitBtn(p,'pause')){togglePause();return}
        if(G.phase===0){
            if(hitBtn(p,'startDraw')){startDrawing();return}
            if(hitBtn(p,'skipWord')){pickWord(true);return}
        } else if(G.phase===1){
            for(let i=0;i<COLORS.length;i++){if(hitBtn(p,'col'+i)){G.color=i;sfxBtn();return}}
            for(let i=0;i<BRUSH_SIZES.length;i++){if(hitBtn(p,'sz'+i)){G.brush=i;sfxBtn();return}}
            if(hitBtn(p,'eraser')){G.color=COLORS.length-1;sfxBtn();return}
            if(hitBtn(p,'clear')){clearCanvas();return}
            if(hitBtn(p,'showHint')){showNextHint();return}
            if(hitBtn(p,'openGuess')){G.inputActive=true;sfxBtn();return}
            if(hitBtn(p,'doneDraw')){doneDrawing();return}
            if(onCanvas(p)){
                G.drawing=true;
                const cp=toCanvas(p);
                G.lastX=cp.x;G.lastY=cp.y;
                drawAt(cp.x,cp.y);
            }
        } else if(G.phase===2){
            if(hitBtn(p,'openGuess')){G.inputActive=true;sfxBtn();return}
            if(hitBtn(p,'submitGuess')){submitGuess();return}
            if(hitBtn(p,'cancelGuess')){G.inputActive=false;G.guessInput='';sfxBtn();return}
            if(hitBtn(p,'giveUp')){giveUp();return}
        } else if(G.phase===3){
            if(hitBtn(p,'nextWord')){nextRound();return}
        }
    }
}
function handlePointerMove(e){
    if(G.drawing && G.phase===1){
        const p=getPos(e);
        if(onCanvas(p)){
            const cp=toCanvas(p);
            drawLine(G.lastX,G.lastY,cp.x,cp.y);
            G.lastX=cp.x;G.lastY=cp.y;
            if(Math.random()<0.3)sfxDraw();
        } else {
            G.drawing=false;
        }
    }
}
function handlePointerUp(e){G.drawing=false}

canvas.addEventListener('mousedown',handlePointerDown);
canvas.addEventListener('mousemove',handlePointerMove);
canvas.addEventListener('mouseup',handlePointerUp);
canvas.addEventListener('touchstart',function(e){e.preventDefault();handlePointerDown(e)},{passive:false});
canvas.addEventListener('touchmove',function(e){e.preventDefault();handlePointerMove(e)},{passive:false});
canvas.addEventListener('touchend',function(e){e.preventDefault();handlePointerUp(e)},{passive:false});

const CANVAS_X=30,CANVAS_Y=160,CANVAS_W=420,CANVAS_H=340;
function onCanvas(p){return p.x>=CANVAS_X&&p.x<=CANVAS_X+CANVAS_W&&p.y>=CANVAS_Y&&p.y<=CANVAS_Y+CANVAS_H}
function toCanvas(p){return{x:p.x-CANVAS_X,y:p.y-CANVAS_Y}}
function clearCanvas(){dctx.fillStyle='#fff';dctx.fillRect(0,0,CANVAS_W,CANVAS_H);sfxBtn()}
function drawAt(x,y){
    dctx.fillStyle=COLORS[G.color];
    const sz=BRUSH_SIZES[G.brush];
    dctx.beginPath();dctx.arc(x,y,sz/2,0,Math.PI*2);dctx.fill();
}
function drawLine(x1,y1,x2,y2){
    dctx.strokeStyle=COLORS[G.color];
    dctx.lineWidth=BRUSH_SIZES[G.brush];
    dctx.lineCap='round';dctx.lineJoin='round';
    dctx.beginPath();dctx.moveTo(x1,y1);dctx.lineTo(x2,y2);dctx.stroke();
}

function pickWord(skip){
    if(skip){G.skipCount++;G.score=Math.max(0,G.score-20);addFloat(W/2,140,'跳过 -20','#ff6b6b')}
    let pool=[];
    for(let i=0;i<WORDS.length;i++){if(!G.wordsDone.includes(i))pool.push(i)}
    if(pool.length===0){G.wordsDone=[];pool=[];for(let i=0;i<WORDS.length;i++)pool.push(i)}
    const idx=pool[Math.floor(Math.random()*pool.length)];
    G.currentWord=WORDS[idx];
    G.wordsDone.push(idx);
    G.hintsShown=0;
    G.hintUnlocked=false;
    clearCanvas();
    G.phase=0;
    G.guessInput='';G.inputActive=false;
    G.resultShown=false;G.revealAnim=0;
    sfxBtn();
}

function startGame(){
    initAudio();
    G.state=STATE_PLAYING;
    G.score=0;G.rounds=0;G.wordsDone=[];
    G.correctCount=0;G.skipCount=0;
    G.color=0;G.brush=1;
    nextRound();
    sfxWin();
    spawnParticles(W/2,H/2,'#ffd700',25);
}

function endGame(){
    G.state=STATE_OVER;
    if(G.score>G.highScore){G.highScore=G.score;Storage.save('drawguess_high',G.highScore)}
    sfxWin();
}

function togglePause(){G.paused=!G.paused;sfxBtn()}

function startDrawing(){
    G.phase=1;
    G.timerActive=true;
    G.timeLeft=G.drawTime*60;
    G.color=0;G.brush=1;
    sfxReveal();
    addFloat(W/2,130,'🎨 开始作画！','#4ecdc4');
}

function doneDrawing(){
    G.phase=2;
    G.timerActive=true;
    G.timeLeft=G.guessTime*60;
    sfxBtn();
}

function showNextHint(){
    if(G.hintsShown>=G.currentWord.h.length+1){return}
    G.hintsShown++;
    G.score=Math.max(0,G.score-10);
    sfxBtn();
    addFloat(W/2,140,'💡 提示 -10分','#ffe66d');
}

function submitGuess(){
    if(!G.guessInput)return;
    const g=G.guessInput.trim();
    G.inputActive=false;
    const w=G.currentWord.w;
    const correct=g===w||w.includes(g)||g.includes(w);
    if(correct){
        const timeBonus=Math.floor(G.timeLeft/30);
        const hintPenalty=G.hintsShown*15;
        const base=G.phase===1?200:150;
        const total=Math.max(30,base+timeBonus*3-hintPenalty);
        G.score+=total;
        G.correctCount++;
        G.phase=3;G.resultShown=true;
        G.timerActive=false;
        sfxCorrect();
        spawnParticles(W/2,330,'#4ecdc4',30);
        addFloat(W/2,135,'🎉 猜对了！+'+total,'#4ecdc4');
    } else {
        sfxWrong();
        addFloat(W/2,130,'✗ 不对，再试试','#ff6b6b');
    }
    G.guessInput='';
}

function giveUp(){
    G.phase=3;G.resultShown=true;G.revealAnim=1;
    G.timerActive=false;
    G.score=Math.max(0,G.score-40);
    sfxWrong();
    addFloat(W/2,135,'答案是：'+G.currentWord.w,'#ff6b6b');
}

function nextRound(){
    G.rounds++;
    if(G.rounds>=G.maxRounds){endGame();return}
    pickWord(false);
    sfxBtn();
}

function update(){
    updateShapes();updateParticles();updateFloat();
    if(G.state!==STATE_PLAYING||G.paused) return;
    if(G.timerActive){
        G.timeLeft--;
        if(G.timeLeft<=0){
            G.timerActive=false;
            if(G.phase===1)doneDrawing();
            else if(G.phase===2){giveUp()}
        }
        if(G.timeLeft===300||G.timeLeft===180||G.timeLeft===60)sfxTick();
    }
}

function drawBackground(ctx){
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#ffecd2');g.addColorStop(1,'#fcb69f');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    drawShapes(ctx);
}

function drawCanvas(ctx){
    ctx.fillStyle='rgba(0,0,0,0.12)';
    roundRect(ctx,CANVAS_X+4,CANVAS_Y+4,CANVAS_W,CANVAS_H,14);ctx.fill();
    ctx.fillStyle='#fff';
    roundRect(ctx,CANVAS_X,CANVAS_Y,CANVAS_W,CANVAS_H,14);ctx.fill();
    ctx.strokeStyle='#9c27b0';ctx.lineWidth=3;
    roundRect(ctx,CANVAS_X,CANVAS_Y,CANVAS_W,CANVAS_H,14);ctx.stroke();
    ctx.drawImage(drawCanvas,CANVAS_X,CANVAS_Y,CANVAS_W,CANVAS_H);
}

function drawPalette(ctx){
    if(G.phase!==1) return;
    const py=CANVAS_Y+CANVAS_H+8;
    const sx=30,ex=W-30;
    const gap=(ex-sx)/COLORS.length;
    for(let i=0;i<COLORS.length;i++){
        const x=sx+gap*i+gap/2-14;
        G.btnRects['col'+i]={x:x,y:py,w:28,h:28,disabled:false};
        ctx.fillStyle=COLORS[i];
        ctx.beginPath();ctx.arc(x+14,py+14,13,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle=G.color===i?'#ff6b6b':'rgba(0,0,0,0.2)';
        ctx.lineWidth=G.color===i?3:1.5;
        ctx.beginPath();ctx.arc(x+14,py+14,13,0,Math.PI*2);ctx.stroke();
        if(i===COLORS.length-1){ctx.strokeStyle='#999';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x+6,py+22);ctx.lineTo(x+22,py+6);ctx.stroke()}
    }
    const sy=py+40;
    for(let i=0;i<BRUSH_SIZES.length;i++){
        const x=sx+50+i*42;
        G.btnRects['sz'+i]={x:x,y:sy,w:34,h:30,disabled:false};
        ctx.fillStyle=G.brush===i?'#fff2e0':'rgba(255,255,255,0.5)';
        roundRect(ctx,x,y,34,30,8);ctx.fill();
        ctx.strokeStyle=G.brush===i?'#ff6b00':'rgba(0,0,0,0.15)';ctx.lineWidth=2;
        roundRect(ctx,x,y,34,30,8);ctx.stroke();
        ctx.fillStyle='#333';ctx.beginPath();
        ctx.arc(x+17,sy+15,BRUSH_SIZES[i]/2,0,Math.PI*2);ctx.fill();
    }
    drawBtn(ctx,sx+290,sy,60,30,'🧽 橡皮','eraser','#fff','#555',13);
    drawBtn(ctx,sx+355,sy,55,30,'🗑 清空','clear','#fff59d','#555',13);
}

        roundRect(ctx,30,100,W-60,55,12);ctx.fill();
        ctx.strokeStyle='#ff6b00';ctx.lineWidth=2;

        if(G.revealAnim<1){G.revealAnim+=0.04}
        const txt=G.currentWord.w;
        const ww=ctx.measureText(txt).width;
        const show=Math.floor(txt.length*Math.min(1,G.revealAnim));
        ctx.fillText(txt.substring(0,show)+(G.revealAnim<1?'_':''),W/2,146);
        drawBtn(ctx,40,CANVAS_Y+CANVAS_H+10,190,50,'🎨 开始作画','startDraw','#00c853','#fff',17);

    } else {

        roundRect(ctx,30,98,W-60,60,12);ctx.fill();

            ctx.fillStyle='#2979ff';ctx.font='bold 15px "Microsoft YaHei"';
            ctx.textAlign='left';ctx.fillText('🎨 画家正在画...',40,120);
            ctx.font='13px "Microsoft YaHei"';ctx.fillStyle='#666';

            if(G.hintsShown>0){
                ctx.textAlign='right';ctx.fillStyle='#00c853';ctx.font='bold 13px "Microsoft YaHei"';
                for(let i=0;i<G.hintsShown;i++){

            ctx.textAlign='left';ctx.fillText('🤔 猜一猜画家画的是什么？',40,120);
            ctx.font='13px "Microsoft YaHei"';ctx.fillStyle='#666';
            ctx.fillText('已用提示：'+G.hintsShown+'/'+(G.currentWord.h.length+1)+'  (每个-10分)',40,143);
            if(G.hintsShown>0){
                ctx.textAlign='right';ctx.fillStyle='#00c853';ctx.font='bold 13px "Microsoft YaHei"';

                    if(i<G.currentWord.h.length)
                        ctx.fillText('💡'+G.currentWord.h[i],W-40,122+i*18);

            ctx.textAlign='center';
            ctx.font='bold 15px "Microsoft YaHei"';
            ctx.fillStyle=G.correctCount>G.rounds-G.skipCount-G.correctCount?'#00c853':'#ff5252';
            ctx.fillText(G.correctCount>G.rounds-G.skipCount-G.correctCount?'🎉 正确！':'😢 正确答案是：',W/2,118);
            ctx.font='bold 28px "Microsoft YaHei"';ctx.fillStyle='#ff6b00';
            ctx.fillText(G.currentWord.w,W/2,146);

}

function drawGame(ctx){
    drawBackground(ctx);
    drawHUD(ctx);
    drawCanvas(ctx);
    drawWordArea(ctx);
    drawBottomActions(ctx);
    drawParticles(ctx);
    drawFloat(ctx);
    drawGuessPanel(ctx);
    if(G.paused){
        ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(0,0,W,H);
        ctx.fillStyle='#fff';ctx.font='bold 48px "Microsoft YaHei"';ctx.textAlign='center';

        ctx.fillText('按 ESC 继续游戏',W/2,H/2+30);ctx.textAlign='left';

}

function drawGameOver(ctx){
    drawBackground(ctx);
    ctx.fillStyle='rgba(0,0,0,0.35)';ctx.fillRect(0,0,W,H);
    const isNew=G.score>=G.highScore&&G.score>0;
    ctx.fillStyle=isNew?'#ffd700':'#fff';
    ctx.font='bold 44px "Microsoft YaHei"';ctx.textAlign='center';
    ctx.fillText(isNew?'🏆 新纪录!':'🎊 游戏结束',W/2,115);
    ctx.fillStyle='#fff';ctx.font='bold 22px "Microsoft YaHei"';
    ctx.fillText('最终得分',W/2,175);
    ctx.fillStyle='#ff6b00';ctx.font='bold 96px Arial';
    ctx.fillText(G.score,W/2,280);
    ctx.fillStyle='rgba(255,255,255,0.95)';ctx.font='bold 18px "Microsoft YaHei"';
    ctx.fillText(G.maxRounds+'回合 · 猜对 '+G.correctCount+' 个 · 跳过/放弃 '+G.skipCount+' 个',W/2,330);
    const acc=G.rounds>0?Math.round(G.correctCount/G.maxRounds*100):0;
    ctx.fillText('完成率: '+acc+'%',W/2,358);
    ctx.fillStyle='#ffd700';ctx.font='bold 20px "Microsoft YaHei"';
    ctx.fillText('🏆 最高分纪录: '+G.highScore,W/2,410);
    const ratings=[
        {min:1500,t:'灵魂画手 🎨',c:'#ffd700'},
        {min:1000,t:'绘画大师 🖌',c:'#f093fb'},
        {min:600,t:'小有名气 ✏️',c:'#4ecdc4'},
        {min:300,t:'初出茅庐 📝',c:'#a8e6cf'},
        {min:0,t:'再接再厉 💪',c:'#ff8b94'}
    ];
    let ra=ratings[ratings.length-1];
    for(const r of ratings){if(G.score>=r.min){ra=r;break}}
    ctx.fillStyle=ra.c;ctx.font='bold 32px "Microsoft YaHei"';
    ctx.fillText(ra.t,W/2,470);
    drawBtn(ctx,W/2-115,520,230,65,'🔄 再来一局','restart','#fff','#ff6b00',20);
    drawBtn(ctx,W/2-80,595,160,45,'🏠 返回菜单','menu','rgba(255,255,255,0.5)','#555',16);
    ctx.textAlign='left';
}

function draw(){
    switch(G.state){
        case STATE_MENU: drawMenu(ctx); break;
        case STATE_PLAYING: drawGame(ctx); break;
        case STATE_OVER: drawGameOver(ctx); break;
        case STATE_PAUSE: drawGame(ctx); break;
    }
}

function gameLoop(){
    requestAnimationFrame(gameLoop);
    update();
    draw();
}

gameLoop();

function hitBtn2(p,name){
    const r=G.btnRects[name];if(!r||r.disabled)return false;
    return p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;
}
function handlePointerDown2(e){
    const p=typeof getPos==='function'?getPos(e):{x:0,y:0};
    const st=G.state;
    if(st===STATE_MENU){
        if(hitBtn2(p,'openSettings')){G.state=STATE_SETTINGS;return}
        if(hitBtn2(p,'openAch')){G.state=STATE_ACHIEVEMENTS;return}
        if(hitBtn2(p,'openStats')){G.state=STATE_STATS;return}
        if(hitBtn2(p,'openHelp')){G.state=STATE_HELP;return}
    } else if(st===STATE_SETTINGS||st===STATE_ACHIEVEMENTS||st===STATE_HELP||st===STATE_STATS){
        if(hitBtn2(p,'closeSub')||hitBtn2(p,'backMain')){G.state=STATE_MENU;return}
        if(st===STATE_SETTINGS){
            if(hitBtn2(p,'set_soundOn')){SETTINGS.soundOn=!SETTINGS.soundOn;saveSettings();return}
            if(hitBtn2(p,'set_vibOn')){SETTINGS.vibOn=!SETTINGS.vibOn;saveSettings();return}
            if(hitBtn2(p,'set_showTimer')){SETTINGS.showTimer=!SETTINGS.showTimer;saveSettings();return}
            if(hitBtn2(p,'resetData')){
                if(confirm('确定清除所有存档、统计和成就吗？无法恢复！')){
                    for(const k of ['_g','_c','_w','_bc','_h','_bs','_unlock'])Storage.remove(SK+k);
                    STAT.totalGames=0;STAT.totalCorrect=0;STAT.totalWrong=0;STAT.bestCombo=0;
                    STAT.totalHintUsed=0;STAT.bestScore=0;STAT.unlocked=[];
                    for(const a of ACHIEVEMENTS)a.unlocked=false;if(G)G.highScore=0;saveStat();
                }
                return;
            }
            for(let i=0;i<THEMES.length;i++){
                if(hitBtn2(p,'theme_'+i)){SETTINGS.theme=i;saveSettings();applyTheme();return}
            }
        }
    }
    return origPointerDown(e);
}

    if(lb.length===0){ctx.fillStyle='#999';ctx.font='13px "Microsoft YaHei"';ctx.textAlign='center';ctx.fillText('暂无记录，快去挑战吧！',x+w/2,y+h/2);}
    ctx.restore();
}

// ==================== 每日挑战系统 ====================
const DAILY_KEY='draw_daily_v1';
function getDailySeed(){
    const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
}
function getDailyStatus(){
    const today=getDailySeed();
    const prev=parseInt(Storage.load(DAILY_KEY+'_d','0'));
    const best=parseInt(Storage.load(DAILY_KEY+'_b','0'));
    const done=prev===today;
    return {today,best:done?best:0,done};
}
function setDailyDone(score){
    const s=getDailyStatus();
    if(s.today!==parseInt(Storage.load(DAILY_KEY+'_d','0')) || score>s.best){
        Storage.save(DAILY_KEY+'_d',String(s.today));
        Storage.save(DAILY_KEY+'_b',String(score));
    }
}
function seededRand(seed){let t=seed+0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296}

// ==================== 更多成就钩子 ====================
function checkSpeedAchieve(t){if(t&&t<10)unlockAchieve('speed')}
function checkPartyAchieve(players){if(players&&players>=5)unlockAchieve('party1')}
function checkTryhardAchieve(){
    const KEY='draw_streak_v1';
    const today=new Date().toDateString();
    const rec=JSON.parse(Storage.load(KEY,'{"last":"","days":0}'));
    if(rec.last!==today){
        const y=new Date(Date.now()-86400000).toDateString();
        if(rec.last===y)rec.days++;else rec.days=1;
        rec.last=today;Storage.save(KEY,JSON.stringify(rec));
    }
    if(rec.days>=3)unlockAchieve('tryhard');
}

// ==================== 更丰富的动画粒子系统 ====================
const TRAILS=[];
function addTrail(x,y,color){TRAILS.push({x,y,color,life:1})}
function updateTrails(){for(let i=TRAILS.length-1;i>=0;i--){const t=TRAILS[i];t.life-=0.03;t.y+=0.6;if(t.life<=0)TRAILS.splice(i,1)}}
function drawTrails(ctx){
    for(const t of TRAILS){ctx.globalAlpha=t.life*0.7;ctx.fillStyle=t.color;ctx.beginPath();ctx.arc(t.x,t.y,4*t.life+1,0,Math.PI*2);ctx.fill()}
    ctx.globalAlpha=1;
}

// ==================== 更多菜单内容 ====================
const _oldDrawMenuEx=typeof drawMenuEx==='function'?drawMenuEx:(typeof drawMenu==='function'?drawMenu:function(){});
function drawMenuExtended2(ctx){
    _oldDrawMenuEx(ctx);
    // 等级徽章
    drawLevelBadge(ctx,42,108,42);
    ctx.fillStyle='#fff';ctx.font='bold 12px "Microsoft YaHei"';ctx.textAlign='left';
    ctx.fillText('Lv.'+LV.level,70,102);
    // 经验条
    ctx.fillStyle='rgba(0,0,0,0.25)';
    if(typeof roundRect==='function')roundRect(ctx,70,110,130,10,5);ctx.fill();
    const pg=getLvProgress();
    ctx.fillStyle='#ffd700';
    if(typeof roundRect==='function')roundRect(ctx,70,110,130*pg,10,5);ctx.fill();
    // 每日挑战
    const ds=getDailyStatus();
    if(typeof drawBtn==='function'){
        drawBtn(ctx,W-140,90,125,38,ds.done?('✓ 今日最佳:'+ds.best):'🌟 每日挑战','dailyBtn',ds.done?'#bdbdbd':'#ff9800','#fff',13);
    }
    // 排行榜按钮
    if(typeof drawBtn==='function'){
        drawBtn(ctx,W-140,136,125,34,'🏆 排行榜','lbBtn','rgba(255,255,255,0.8)','#333',13);
    }
    checkTryhardAchieve();
    updateTrails();
    drawTrails(ctx);
}
// 排行榜模态状态
const STATE_LEADERBOARD=105;
const STATE_DAILY=106;
function drawLeaderboardPage(ctx){
    drawBackground(ctx);drawSubPageBackdrop(ctx,'🏆 本地排行榜 TOP 10');
    drawLeaderboard(ctx,null,35,155,W-70,H-290,THEMES[SETTINGS.theme%THEMES.length].accent);
    if(typeof drawBtn==='function')drawBtn(ctx,W/2-70,H-120,140,42,'返回菜单','backMain','#9c27b0','#fff',16);
}
function drawDailyChallengePage(ctx){
    drawBackground(ctx);drawSubPageBackdrop(ctx,'🌟 每日挑战');
    const ds=getDailyStatus();
    const y=170;
    ctx.fillStyle='#333';ctx.textAlign='center';
    ctx.font='bold 20px "Microsoft YaHei"';ctx.fillText('挑战日期：'+String(ds.today).slice(0,4)+'/'+String(ds.today).slice(4,6)+'/'+String(ds.today).slice(6,8),W/2,y);
    ctx.font='bold 16px "Microsoft YaHei"';ctx.fillStyle=ds.done?'#4caf50':'#ff5722';
    ctx.fillText(ds.done?'✓ 今日已完成，最佳：'+ds.best:'今日挑战进行中！完成后奖励双倍经验！',W/2,y+40);
    ctx.font='14px "Microsoft YaHei"';ctx.fillStyle='#666';
    ctx.fillText('每日0点自动刷新，使用当日种子题目，记录每日最佳',W/2,y+75);
    ctx.fillText('奖励：完成每日挑战额外奖励500 XP',W/2,y+100);
    ctx.fillText('历史最佳排行榜可在主菜单查看',W/2,y+125);
    // 双倍加成说明
    ctx.fillStyle='rgba(255,152,0,0.08)';
    if(typeof roundRect==='function'){roundRect(ctx,50,y+155,W-100,80,12);ctx.fill();
    ctx.strokeStyle='rgba(255,152,0,0.4)';ctx.lineWidth=2;roundRect(ctx,50,y+155,W-100,80,12);ctx.stroke();}
    ctx.fillStyle='#e65100';ctx.font='bold 15px "Microsoft YaHei"';
    ctx.fillText('🎁 完成今日挑战 = 500 XP额外奖励',W/2,y+188);
    ctx.font='13px "Microsoft YaHei"';ctx.fillText('直接返回主菜单，使用正常开始按钮即可完成当日挑战',W/2,y+212);
    if(typeof drawBtn==='function')drawBtn(ctx,W/2-70,H-120,140,42,'返回菜单','backMain','#9c27b0','#fff',16);
    ctx.textAlign='left';
}
const _origDrawEx2=typeof drawEx==='function'?drawEx:(typeof draw==='function'?draw:function(){});
function drawEx2(){
    switch(G.state){
        case STATE_LEADERBOARD:drawLeaderboardPage(ctx);break;
        case STATE_DAILY:drawDailyChallengePage(ctx);break;
        case STATE_MENU:drawMenuExtended2(ctx);break;
        default:_origDrawEx2();
    }
}
// 点击钩子扩展
const _origPD2=typeof handlePointerDown2==='function'?handlePointerDown2:(typeof handlePointerDown==='function'?handlePointerDown:function(){});
function handlePointerDown3(e){
    const p=typeof getPos==='function'?getPos(e):{x:0,y:0};
    const st=G.state;
    if(st===STATE_MENU){
        if(hitBtn2(p,'lbBtn')){G.state=STATE_LEADERBOARD;return}
        if(hitBtn2(p,'dailyBtn')){G.state=STATE_DAILY;return}
    } else if(st===STATE_LEADERBOARD||st===STATE_DAILY){
        if(hitBtn2(p,'closeSub')||hitBtn2(p,'backMain')){G.state=STATE_MENU;return}
    }
    return _origPD2(e);
}
if(typeof canvas!=='undefined'){
    canvas.addEventListener('mousedown',handlePointerDown3);
    canvas.addEventListener('touchstart',function(e){e.preventDefault();handlePointerDown3(e)},{passive:false});
}
window.cancelAnimationFrame(window.__raf3||0);
(function loop3(){window.__raf3=requestAnimationFrame(loop3);if(typeof update==='function')update();drawEx2()})();

// 自动保存排行榜（在结束时）
const _origUAAG=typeof updateAchievementsAfterGame==='function'?updateAchievementsAfterGame:function(){};
if(typeof window!=='undefined'){
    window['draw_postGame']=function(score){
        _origUAAG();
        addToLeaderboard(score,'玩家'+LV.level);
        addXp(50+Math.floor(score/20));
        setDailyDone(score);
    }
}

applyTheme();
})();
</script>

    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {

  }

})();
