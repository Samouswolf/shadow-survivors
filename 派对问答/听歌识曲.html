let audioCtx=null;
function initAudio(){if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
let noteTimers=[];
function stopMusic(){for(const t of noteTimers)clearTimeout(t);noteTimers=[]}
function playSong(song,onDone){
    if(!audioCtx)return;stopMusic();
    let t=0;let time=1;
    for(const n of song.notes){
        const freq=n[0],dur=n[1];
        const tm=setTimeout(()=>playNote(freq,dur),t);
        noteTimers.push(tm);
        t+=dur*1000+50;time+=dur;
    }
    if(onDone){setTimeout(onDone,t+200);noteTimers.push(setTimeout(()=>{},t+200))}
}
function playNote(freq,dur){
    if(!audioCtx)return;
    try{
        const o=audioCtx.createOscillator();
        const g=audioCtx.createGain();
        o.type='triangle';
        o.frequency.value=freq;
        g.gain.setValueAtTime(0.001,audioCtx.currentTime);
        g.gain.linearRampToValueAtTime(0.2,audioCtx.currentTime+0.02);
        g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
        o.connect(g);g.connect(audioCtx.destination);
        o.start();o.stop(audioCtx.currentTime+dur+0.05);
        addWave();
    }catch(e){}
}
function sfxBtn(){playTone(600,0.08,'sine',0.12)}
function sfxPlay(){playTone(523,0.08,'triangle',0.15);setTimeout(()=>playTone(659,0.08,'triangle',0.15),80);setTimeout(()=>playTone(784,0.12,'triangle',0.15),160)}
function playTone(freq,dur,type,vol){
    if(!audioCtx)return;
    try{
        const o=audioCtx.createOscillator();
        const g=audioCtx.createGain();
        o.type=type||'sine';
        o.frequency.value=freq;
        g.gain.value=vol||0.15;
        g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
        o.connect(g);g.connect(audioCtx.destination);
        o.start();o.stop(audioCtx.currentTime+dur);
    }catch(e){}
}
function sfxCorrect(){playTone(880,0.1,'sine',0.2);setTimeout(()=>playTone(1100,0.15,'sine',0.18),80)}
function sfxWrong(){playTone(200,0.15,'sawtooth',0.15);setTimeout(()=>playTone(160,0.2,'sawtooth',0.12),100)}
function sfxWin(){playTone(523,0.1,'sine',0.2);setTimeout(()=>playTone(659,0.1,'sine',0.2),100);setTimeout(()=>playTone(784,0.15,'sine',0.2),200);setTimeout(()=>playTone(1046,0.3,'sine',0.2),350)}
function sfxTick(){playTone(900,0.03,'square',0.08)}

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let scale=1;
function resize(){
    const r=W/H;let cw=window.innerWidth,ch=window.innerHeight;
    if(cw/ch>r){ch=cw/r}else{cw=ch*r}
    canvas.width=cw;canvas.height=ch;scale=cw/W;
    ctx.setTransform(scale,0,0,scale,0,0);
}
window.addEventListener('resize',resize);resize();

const G={
    state:STATE_MENU,
    current:null,
    options:[],
    qIdx:0,
    total:10,
    score:0,
    highScore:0,
    correct:0,
    wrong:0,
    combo:0,maxCombo:0,
    selected:-1,answered:false,
    btnRects:{},
    particles:[],
    paused:false,
    waves:[],
    notes:[],
    timeLeft:0,listenTime:25,guessTime:15,
    phase:0,playing:false,
    playsUsed:0,maxPlays:3,
    hintUsed:false,
    floatMsgs:[],
    category:0,
    lyricsShown:false,
    playProgress:0
};
G.highScore=parseInt(Storage.load('music_high','0'));
const CATS=["全部","儿童","经典","流行"];

function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

function drawBtn(ctx,x,y,w,h,text,name,color,textColor,fontSize,disabled){
    G.btnRects[name]={x:x,y:y,w:w,h:h,disabled:disabled};
    ctx.fillStyle=disabled?'rgba(150,150,150,0.4)':(color||'#764ba2');
    roundRect(ctx,x,y,w,h,12);ctx.fill();
    ctx.strokeStyle=disabled?'rgba(255,255,255,0.2)':'rgba(255,255,255,0.5)';
    ctx.lineWidth=2;roundRect(ctx,x,y,w,h,12);ctx.stroke();
    ctx.fillStyle=disabled?'#bbb':(textColor||'#fff');
    ctx.font='bold '+(fontSize||16)+'px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(text,x+w/2,y+h/2);
    ctx.textBaseline='alphabetic';
}
function hitBtn(p,name){
    const r=G.btnRects[name];
    return r && !r.disabled && p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;
}
function getPos(e){
    const rect=canvas.getBoundingClientRect();
    const t=e.touches?e.touches[0]:e;
    return{x:(t.clientX-rect.left)/scale,y:(t.clientY-rect.top)/scale};
}

function addWave(){
    for(let i=0;i<5;i++){
        G.waves.push({x:W/2,y:260,r:10,a:0.4+i*0.1,v:2.5+i*0.4,life:90});
    }
}
function updateWaves(){
    for(let i=G.waves.length-1;i>=0;i--){
        const w=G.waves[i];
        w.r+=w.v;w.a*=0.99;w.life--;
        if(w.life<=0||w.r>280)G.waves.splice(i,1);
    }
}
function drawWaves(ctx){
    for(const w of G.waves){
        ctx.globalAlpha=w.a*(w.life/90);
        ctx.strokeStyle='#fff';ctx.lineWidth=2;
        ctx.beginPath();ctx.arc(w.x,w.y,w.r,0,Math.PI*2);ctx.stroke();
    }
    ctx.globalAlpha=1;
}

function spawnParticles(x,y,color,count){
    for(let i=0;i<(count||15);i++){
        G.particles.push({x:x,y:y,vx:(Math.random()-0.5)*10,vy:(Math.random()-0.5)*10-3,
            life:50,maxLife:50,size:3+Math.random()*4,color:color});
    }
}
function updateParticles(){
    for(let i=G.particles.length-1;i>=0;i--){
        const p=G.particles[i];
        p.x+=p.vx;p.y+=p.vy;p.vy+=0.25;p.life--;
        if(p.life<=0)G.particles.splice(i,1);
    }
}
function drawParticles(ctx){
    for(const p of G.particles){
        ctx.globalAlpha=p.life/p.maxLife;
        ctx.fillStyle=p.color;
        ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
}
function addFloat(x,y,text,color){
    G.floatMsgs.push({x:x,y:y,text:text,color:color||'#fff',life:50,vy:-1.2});
}
function updateFloat(){
    for(let i=G.floatMsgs.length-1;i>=0;i--){
        const f=G.floatMsgs[i];f.y+=f.vy;f.life--;
        if(f.life<=0)G.floatMsgs.splice(i,1);
    }
}
function drawFloat(ctx){
    for(const f of G.floatMsgs){
        ctx.globalAlpha=f.life/50;
        ctx.fillStyle=f.color;
        ctx.font='bold 18px "Microsoft YaHei"';
        ctx.textAlign='center';ctx.fillText(f.text,f.x,f.y);
    }
    ctx.globalAlpha=1;ctx.textAlign='left';
}

window.addEventListener('keydown',function(e){
    G.keys=G.keys||{};G.keys[e.key.toLowerCase()]=true;
    if(e.key==='Escape'){if(G.state===STATE_PLAYING)togglePause()}
    if(G.state===STATE_PLAYING&&!G.answered){
        if(e.key==='1'||e.key==='2'||e.key==='3'||e.key==='4'){
            selectAnswer(parseInt(e.key)-1);
        }
    }
    initAudio();
});
window.addEventListener('keyup',function(e){if(G.keys)G.keys[e.key.toLowerCase()]=false});

function handlePointerDown(e){
    initAudio();
    const p=getPos(e);
    if(G.state===STATE_MENU){
        if(hitBtn(p,'start')){startGame();return}
        for(let i=0;i<CATS.length;i++)if(hitBtn(p,'cat'+i)){G.category=i;sfxBtn();return}
        if(hitBtn(p,'n5')){G.total=5;sfxBtn()}
        else if(hitBtn(p,'n10')){G.total=10;sfxBtn()}
        else if(hitBtn(p,'n15')){G.total=15;sfxBtn()}
    } else if(G.state===STATE_OVER){
        if(hitBtn(p,'restart')){startGame();return}
        if(hitBtn(p,'menu')){G.state=STATE_MENU;return}
    } else if(G.state===STATE_PLAYING&&!G.paused){
        if(hitBtn(p,'pause')){togglePause();return}
        if(hitBtn(p,'play')){playCurrent();return}
        if(!G.answered){
            for(let i=0;i<4;i++)if(hitBtn(p,'opt'+i)){selectAnswer(i);return}
            if(hitBtn(p,'hint')&&!G.hintUsed){useHint();return}
            if(hitBtn(p,'lyrics')&&!G.lyricsShown){G.lyricsShown=true;sfxBtn();G.score=Math.max(0,G.score-20);addFloat(W/2,150,'📜 显示歌词 -20','#ffe66d')}
        } else {
            if(hitBtn(p,'next')){nextSong();return}
        }
    }
}
function handlePointerMove(e){}
function handlePointerUp(e){}
canvas.addEventListener('mousedown',handlePointerDown);
canvas.addEventListener('mousemove',handlePointerMove);
canvas.addEventListener('mouseup',handlePointerUp);
canvas.addEventListener('touchstart',function(e){e.preventDefault();handlePointerDown(e)},{passive:false});
canvas.addEventListener('touchmove',function(e){e.preventDefault();handlePointerMove(e)},{passive:false});
canvas.addEventListener('touchend',function(e){e.preventDefault();handlePointerUp(e)},{passive:false});

function shuffle(a){
    for(let i=a.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [a[i],a[j]]=[a[j],a[i]];
    }return a;
}
function buildOptions(){
    const pool=SONGS.filter(s=>G.category===0||s.cat===CATS[G.category]);
    const others=pool.filter(x=>x.t!==G.current.t);
    shuffle(others);
    const opts=[G.current];
    for(let i=0;i<3&&i<others.length;i++)opts.push(others[i]);
    while(opts.length<4)opts.push(SONGS[Math.floor(Math.random()*SONGS.length)]);
    shuffle(opts);
    G.options=opts;
}
function startGame(){
    initAudio();stopMusic();
    G.state=STATE_PLAYING;G.score=0;G.combo=0;G.maxCombo=0;G.correct=0;G.wrong=0;G.qIdx=0;
    G.hintUsed=false;G.lyricsShown=false;
    nextSong();
    sfxWin();spawnParticles(W/2,H/2,'#ffd700',25);
}
function endGame(){
    G.state=STATE_OVER;stopMusic();
    if(G.score>G.highScore){G.highScore=G.score;Storage.save('music_high',G.highScore)}
    sfxWin();
}
function togglePause(){G.paused=!G.paused;sfxBtn();if(G.paused)stopMusic()}

function nextSong(){
    stopMusic();G.qIdx++;
    if(G.qIdx>G.total){endGame();return}
    const pool=SONGS.filter(s=>G.category===0||s.cat===CATS[G.category]);
    const list=shuffle([...pool]);
    G.current=list[0];
    buildOptions();
    G.selected=-1;G.answered=false;G.phase=0;G.playing=false;G.playsUsed=0;
    G.hintUsed=false;G.lyricsShown=false;G.playProgress=0;
    G.timeLeft=G.listenTime*60;
    sfxBtn();
}

function playCurrent(){
    if(G.playsUsed>=G.maxPlays){addFloat(W/2,280,'次数用完','#fa709a');return}
    G.playsUsed++;G.playing=true;G.playProgress=0;
    G.timeLeft=G.listenTime*60;
    sfxPlay();
    playSong(G.current,()=>{G.playing=false});
}
function useHint(){
    G.hintUsed=true;
    const right=G.options.indexOf(G.current);
    const arr=[];
    for(let i=0;i<4;i++)if(i!==right)arr.push(i);
    shuffle(arr);
    addFloat(W/2,150,'💡 答案提示:闪烁 -30分','#ffe66d');
    G.score=Math.max(0,G.score-30);
    sfxBtn();
}
function selectAnswer(idx){
    if(G.answered)return;
    G.selected=idx;G.answered=true;stopMusic();
    const isRight=G.options[idx]===G.current;
    if(isRight){
        G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);G.correct++;
        const timeBonus=Math.floor(G.timeLeft/20);
        const playPenalty=(G.playsUsed-1)*30;
        const hintPenalty=G.hintUsed?20:0;
        const lyricsPenalty=G.lyricsShown?10:0;
        const total=Math.max(40,150+timeBonus*5-playPenalty-hintPenalty-lyricsPenalty+G.combo*8);
        G.score+=total;
        sfxCorrect();spawnParticles(W/2,500,'#43e97b',25);
        addFloat(W/2,470,'🎉 猜对 +'+total+(G.combo>=2?' ('+G.combo+'连击!)':''),'#43e97b');
    } else {
        G.combo=0;G.wrong++;
        sfxWrong();spawnParticles(W/2,500,'#fa709a',20);
        addFloat(W/2,470,'✗ 错了！正确是：'+G.current.t+' - '+G.current.a,'#fa709a');
    }
}

function update(){
    updateWaves();updateParticles();updateFloat();
    if(G.state!==STATE_PLAYING||G.paused)return;
    if(G.playing&&G.playsUsed<=G.maxPlays){G.playProgress+=0.3;if(G.playProgress>100)G.playProgress=0}
    if(G.timeLeft>0){
        G.timeLeft--;
        if(G.timeLeft<=0&&!G.answered){
            G.answered=true;G.combo=0;G.wrong++;
            stopMusic();
            sfxWrong();
            addFloat(W/2,470,'⏰ 超时！正确是：'+G.current.t,'#fa709a');
        }
        if(G.timeLeft===300||G.timeLeft===180||G.timeLeft===60)sfxTick();
    }
}

function drawBackground(ctx){
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#667eea');g.addColorStop(1,'#764ba2');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    for(let i=0;i<30;i++){
        const x=(i*137+Date.now()/30)%(W+200)-100;
        const y=H-((Date.now()/20+i*50)%H);
        ctx.globalAlpha=0.07;ctx.fillStyle='#fff';
        ctx.beginPath();ctx.arc(x,y,8+(i%5)*2,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
}

function drawDisc(ctx,x,y,playing){
    const t=Date.now()/250;
    ctx.save();ctx.translate(x,y);
    ctx.rotate(playing?t*0.05:0);
    ctx.globalAlpha=0.2;ctx.fillStyle='#000';
    ctx.beginPath();ctx.arc(0,5,80,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
    ctx.fillStyle='#111';ctx.beginPath();ctx.arc(0,0,80,0,Math.PI*2);ctx.fill();
    for(let i=0;i<8;i++){
        ctx.strokeStyle='rgba(255,255,255,0.08)';ctx.lineWidth=1.5;
        ctx.beginPath();ctx.arc(0,0,20+i*7,0,Math.PI*2);ctx.stroke();
    }
    ctx.save();
    const grad=ctx.createRadialGradient(0,0,0,0,0,35);
    grad.addColorStop(0,'#ff4081');grad.addColorStop(1,'#9c27b0');
    ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,35,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,0,35,0,Math.PI*2);ctx.stroke();
    ctx.restore();
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(0,0,5,0,Math.PI*2);ctx.fill();
    ctx.restore();
    drawWaves(ctx);
}

function drawHUD(ctx){
    ctx.fillStyle='rgba(0,0,0,0.35)';
    roundRect(ctx,10,10,W-20,70,12);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 14px "Microsoft YaHei"';
    ctx.textAlign='left';ctx.fillText('歌曲',25,32);
    ctx.font='bold 22px Arial';ctx.fillStyle='#ffd700';
    ctx.fillText(G.qIdx+'/'+G.total,65,32);
    ctx.font='bold 13px "Microsoft YaHei"';ctx.fillStyle='#ffe66d';
    ctx.fillText('('+G.current.cat+')',120,32);
    const ratio=G.timeLeft/(G.listenTime*60);
    const barW=150,barH=18,bx=W/2-barW/2;
    ctx.fillStyle='rgba(0,0,0,0.3)';
    roundRect(ctx,bx,23,barW,barH,9);ctx.fill();
    ctx.fillStyle=ratio<0.25?'#fa709a':ratio<0.5?'#ffe66d':'#43e97b';
    roundRect(ctx,bx+2,25,(barW-4)*Math.max(0,ratio),barH-4,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 13px Arial';ctx.textAlign='center';
    ctx.fillText(Math.ceil(G.timeLeft/60)+'s',W/2,36);
    ctx.textAlign='right';ctx.fillStyle='#fff';ctx.font='bold 14px "Microsoft YaHei"';
    ctx.fillText('得分',W-25,32);
    ctx.fillStyle='#ffd700';ctx.font='bold 24px Arial';
    ctx.fillText(G.score,W-25,58);
    ctx.textAlign='center';
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='11px "Microsoft YaHei"';
    ctx.fillText((G.combo>0?G.combo+' 连击 | ':'')+'✓'+G.correct+'  ✗'+G.wrong,W/2,70);
    ctx.textAlign='left';
}

function drawListenArea(ctx){
    const ay=100,ah=240;
    ctx.fillStyle='rgba(255,255,255,0.1)';
    roundRect(ctx,20,ay,W-40,ah,20);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=2;
    roundRect(ctx,20,ay,W-40,ah,20);ctx.stroke();
    drawDisc(ctx,W/2,ay+ah/2-20,G.playing);
    if(!G.answered){
        drawBtn(ctx,20,ay+ah-58,140,48,G.playsUsed<G.maxPlays?'▶ 播放 ('+(G.maxPlays-G.playsUsed)+'次)':'次数用完','play',
            G.playsUsed<G.maxPlays?'#ff4081':'#999','#fff',14,G.playsUsed>=G.maxPlays);
        drawBtn(ctx,170,ay+ah-58,140,48,'💡 闪烁答案-30','hint',
            G.hintUsed?'rgba(150,150,150,0.4)':'#ffe66d','#333',13,G.hintUsed);
        drawBtn(ctx,320,ay+ah-58,140,48,'📜 歌词提示-20','lyrics',
            G.lyricsShown?'rgba(150,150,150,0.4)':'#43e97b','#333',13,G.lyricsShown);

    if(G.lyricsShown){
        ctx.fillStyle='rgba(0,0,0,0.5)';

function drawOptions(ctx){
    const oy=355,oh=60,ogap=10,ow=W-40;
    for(let i=0;i<4;i++){
        const y=oy+i*(oh+ogap);
        let bg='rgba(255,255,255,0.22)',border='rgba(255,255,255,0.45)',tc='#fff';
        const right=G.options[i]===G.current;
        if(G.answered){
            if(right){bg='#43e97b';tc='#fff';border='#fff'}
            else if(i===G.selected){bg='#fa709a';tc='#fff';border='#fff'}
            else{bg='rgba(255,255,255,0.12)';tc='rgba(255,255,255,0.55)'}
        }
        if(G.hintUsed&&right&&!G.answered){
            const f=Math.sin(Date.now()/80)>0;
            if(f){bg='rgba(255,230,109,0.55)';border='#ffe66d'}
        }
        G.btnRects['opt'+i]={x:20,y:y,w:ow,h:oh,disabled:G.answered};
        ctx.fillStyle=bg;roundRect(ctx,20,y,ow,oh,14);ctx.fill();
        ctx.strokeStyle=border;ctx.lineWidth=2.5;roundRect(ctx,20,y,ow,oh,14);ctx.stroke();
        ctx.fillStyle=tc;
        ctx.textAlign='left';
        ctx.font='bold 18px Arial';
        ctx.fillStyle=['#ff6b6b','#4ecdc4','#ffe66d','#a78bfa'][i];
        ctx.fillText(String.fromCharCode(65+i),40,y+oh/2+6);
        ctx.fillStyle=tc;ctx.font='bold 18px "Microsoft YaHei"';
        ctx.textAlign='center';
        ctx.fillText(G.options[i].t,20+ow/2-20,y+oh/2+6);
        ctx.font='12px "Microsoft YaHei"';ctx.textAlign='right';
        ctx.fillStyle=G.answered?(right?'#fff':(i===G.selected?'#fff':'rgba(255,255,255,0.4)')):'rgba(255,255,255,0.65)';
        ctx.fillText(' - '+G.options[i].a,20+ow-20,y+oh/2+6);
        if(G.answered&&right){
            ctx.font='bold 24px Arial';ctx.fillStyle='#fff';
            ctx.fillText('✓',20+ow-36,y+oh/2+6);
        } else if(G.answered&&i===G.selected&&!right){
            ctx.font='bold 24px Arial';ctx.fillStyle='#fff';
            ctx.fillText('✗',20+ow-36,y+oh/2+6);
        }
        ctx.textAlign='left';
    }
    if(G.answered){
        drawBtn(ctx,W/2-85,H-90,170,55,'下一首 ▶','next','#fff','#764ba2',18);
    }
    drawBtn(ctx,W-60,90,45,32,'⏸','pause','rgba(255,255,255,0.3)');
}

function drawGameOver(ctx){
    drawBackground(ctx);
    ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(0,0,W,H);
    const isNew=G.score>=G.highScore&&G.score>0;
    ctx.fillStyle=isNew?'#ffd700':'#fff';
    ctx.font='bold 44px "Microsoft YaHei"';ctx.textAlign='center';
    ctx.fillText(isNew?'🏆 新纪录!':'🎊 挑战结束',W/2,110);
    ctx.fillStyle='#fff';ctx.font='bold 22px "Microsoft YaHei"';
    ctx.fillText('最终得分',W/2,170);
    ctx.fillStyle='#ffd700';ctx.font='bold 96px Arial';
    ctx.fillText(G.score,W/2,275);
    ctx.fillStyle='rgba(255,255,255,0.95)';ctx.font='bold 18px "Microsoft YaHei"';
    ctx.fillText(G.total+'首歌曲  |  猜对 '+G.correct+'  |  猜错/超时 '+G.wrong,W/2,325);
    const acc=G.correct+G.wrong>0?Math.round(G.correct/(G.correct+G.wrong)*100):0;
    ctx.fillText('正确率 '+acc+'%  |  最高连击 '+G.maxCombo+' 连',W/2,355);
    ctx.fillStyle='#ffd700';ctx.font='bold 20px "Microsoft YaHei"';
    ctx.fillText('🏆 最高分纪录: '+G.highScore,W/2,405);
    const ratings=[
        {min:1200,t:'音乐大师 🎼',c:'#ffd700'},
        {min:800,t:'乐坛新星 ⭐',c:'#f093fb'},
        {min:500,t:'爱听音乐 🎧',c:'#4ecdc4'},
        {min:200,t:'普通听众 👂',c:'#a8e6cf'},
        {min:0,t:'再接再厉 💪',c:'#ff8b94'}
    ];
    let ra=ratings[ratings.length-1];
    for(const r of ratings){if(G.score>=r.min){ra=r;break}}
    ctx.fillStyle=ra.c;ctx.font='bold 32px "Microsoft YaHei"';
    ctx.fillText(ra.t,W/2,465);
    drawBtn(ctx,W/2-110,515,220,65,'🔄 再来一局','restart','#fff','#764ba2',20);
    drawBtn(ctx,W/2-80,595,160,45,'🏠 返回菜单','menu','rgba(255,255,255,0.3)','#fff',16);
    ctx.textAlign='left';
}

function draw(){
    switch(G.state){
        case STATE_MENU:drawMenu(ctx);break;
        case STATE_PLAYING:drawGame(ctx);break;
        case STATE_OVER:drawGameOver(ctx);break;
        case STATE_PAUSE:drawGame(ctx);break;
    }
}
function gameLoop(){requestAnimationFrame(gameLoop);update();draw()}

    } else if(st===STATE_SETTINGS||st===STATE_ACHIEVEMENTS||st===STATE_HELP||st===STATE_STATS){
        if(hitBtn2(p,'closeSub')||hitBtn2(p,'backMain')){G.state=STATE_MENU;return}

            if(hitBtn2(p,'set_showTimer')){SETTINGS.showTimer=!SETTINGS.showTimer;saveSettings();return}

                if(confirm('确定清除所有存档、统计和成就吗？无法恢复！')){

const DAILY_KEY='music_daily_v1';
function getDailySeed(){
    const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
}
function getDailyStatus(){
    const today=getDailySeed();
    const prev=parseInt(Storage.load(DAILY_KEY+'_d','0'));
    const best=parseInt(Storage.load(DAILY_KEY+'_b','0'));
    const done=prev===today;
    return {today,best:done?best:0,done};
}
function setDailyDone(score){
    const s=getDailyStatus();
    if(s.today!==parseInt(Storage.load(DAILY_KEY+'_d','0')) || score>s.best){
        Storage.save(DAILY_KEY+'_d',String(s.today));
        Storage.save(DAILY_KEY+'_b',String(score));
    }
}
function seededRand(seed){let t=seed+0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296}

    ctx.fillStyle='rgba(0,0,0,0.25)';
    if(typeof roundRect==='function')roundRect(ctx,70,110,130,10,5);ctx.fill();
    const pg=getLvProgress();
    ctx.fillStyle='#ffd700';
    if(typeof roundRect==='function')roundRect(ctx,70,110,130*pg,10,5);ctx.fill();
    // 每日挑战
    const ds=getDailyStatus();
    if(typeof drawBtn==='function'){
        drawBtn(ctx,W-140,90,125,38,ds.done?('✓ 今日最佳:'+ds.best):'🌟 每日挑战','dailyBtn',ds.done?'#bdbdbd':'#ff9800','#fff',13);
    }
    // 排行榜按钮
    if(typeof drawBtn==='function'){
        drawBtn(ctx,W-140,136,125,34,'🏆 排行榜','lbBtn','rgba(255,255,255,0.8)','#333',13);
    }
    checkTryhardAchieve();
    updateTrails();
    drawTrails(ctx);
}
// 排行榜模态状态
const STATE_LEADERBOARD=105;
const STATE_DAILY=106;
function drawLeaderboardPage(ctx){
    drawBackground(ctx);drawSubPageBackdrop(ctx,'🏆 本地排行榜 TOP 10');
    drawLeaderboard(ctx,null,35,155,W-70,H-290,THEMES[SETTINGS.theme%THEMES.length].accent);
    if(typeof drawBtn==='function')drawBtn(ctx,W/2-70,H-120,140,42,'返回菜单','backMain','#9c27b0','#fff',16);
}
function drawDailyChallengePage(ctx){
    drawBackground(ctx);drawSubPageBackdrop(ctx,'🌟 每日挑战');
    const ds=getDailyStatus();
    const y=170;
    ctx.fillStyle='#333';ctx.textAlign='center';
    ctx.font='bold 20px "Microsoft YaHei"';ctx.fillText('挑战日期：'+String(ds.today).slice(0,4)+'/'+String(ds.today).slice(4,6)+'/'+String(ds.today).slice(6,8),W/2,y);
    ctx.font='bold 16px "Microsoft YaHei"';ctx.fillStyle=ds.done?'#4caf50':'#ff5722';
    ctx.fillText(ds.done?'✓ 今日已完成，最佳：'+ds.best:'今日挑战进行中！完成后奖励双倍经验！',W/2,y+40);
    ctx.font='14px "Microsoft YaHei"';ctx.fillStyle='#666';
    ctx.fillText('每日0点自动刷新，使用当日种子题目，记录每日最佳',W/2,y+75);
    ctx.fillText('奖励：完成每日挑战额外奖励500 XP',W/2,y+100);
    ctx.fillText('历史最佳排行榜可在主菜单查看',W/2,y+125);
    // 双倍加成说明
    ctx.fillStyle='rgba(255,152,0,0.08)';
    if(typeof roundRect==='function'){roundRect(ctx,50,y+155,W-100,80,12);ctx.fill();
    ctx.strokeStyle='rgba(255,152,0,0.4)';ctx.lineWidth=2;roundRect(ctx,50,y+155,W-100,80,12);ctx.stroke();}
    ctx.fillStyle='#e65100';ctx.font='bold 15px "Microsoft YaHei"';
    ctx.fillText('🎁 完成今日挑战 = 500 XP额外奖励',W/2,y+188);
    ctx.font='13px "Microsoft YaHei"';ctx.fillText('直接返回主菜单，使用正常开始按钮即可完成当日挑战',W/2,y+212);
    if(typeof drawBtn==='function')drawBtn(ctx,W/2-70,H-120,140,42,'返回菜单','backMain','#9c27b0','#fff',16);
    ctx.textAlign='left';
}
const _origDrawEx2=typeof drawEx==='function'?drawEx:(typeof draw==='function'?draw:function(){});
function drawEx2(){
    switch(G.state){
        case STATE_LEADERBOARD:drawLeaderboardPage(ctx);break;
        case STATE_DAILY:drawDailyChallengePage(ctx);break;
        case STATE_MENU:drawMenuExtended2(ctx);break;
        default:_origDrawEx2();
    }
}
// 点击钩子扩展
const _origPD2=typeof handlePointerDown2==='function'?handlePointerDown2:(typeof handlePointerDown==='function'?handlePointerDown:function(){});
function handlePointerDown3(e){
    const p=typeof getPos==='function'?getPos(e):{x:0,y:0};
    const st=G.state;
    if(st===STATE_MENU){
        if(hitBtn2(p,'lbBtn')){G.state=STATE_LEADERBOARD;return}
        if(hitBtn2(p,'dailyBtn')){G.state=STATE_DAILY;return}
    } else if(st===STATE_LEADERBOARD||st===STATE_DAILY){
        if(hitBtn2(p,'closeSub')||hitBtn2(p,'backMain')){G.state=STATE_MENU;return}
    }
    return _origPD2(e);
}
if(typeof canvas!=='undefined'){
    canvas.addEventListener('mousedown',handlePointerDown3);
    canvas.addEventListener('touchstart',function(e){e.preventDefault();handlePointerDown3(e)},{passive:false});
}
window.cancelAnimationFrame(window.__raf3||0);
(function loop3(){window.__raf3=requestAnimationFrame(loop3);if(typeof update==='function')update();drawEx2()})();

// 自动保存排行榜（在结束时）
const _origUAAG=typeof updateAchievementsAfterGame==='function'?updateAchievementsAfterGame:function(){};
if(typeof window!=='undefined'){
    window['music_postGame']=function(score){
        _origUAAG();
        addToLeaderboard(score,'玩家'+LV.level);
        addXp(50+Math.floor(score/20));
        setDailyDone(score);
    }
}

applyTheme();
})();
</script>

  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>
