<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>谁是卧底</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#0f0c29 0%,#302b63 50%,#24243e 100%);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:"Microsoft YaHei",sans-serif}
canvas{display:block;margin:0 auto}
.sponsor-close,#sponsorClose,.skip-btn,#skipInterstitial{pointer-events:auto!important;}
</style>
<style>
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);height:90px;max-height:90px;overflow:hidden;contain:layout style paint;pointer-events:none!important}.ad-banner-container,.ad-banner-container *{pointer-events:none!important}.ad-banner-container iframe{max-height:90px;pointer-events:none!important}
.ad-banner-container iframe{max-width:100%}
.ad-label{position:absolute;top:1px;right:6px;font:9px "Microsoft YaHei",sans-serif;color:rgba(255,255,255,.35)}
.sponsor-btn{position:fixed;bottom:8px;left:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:2px 6px;border-radius:10px;font:10px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}

.sponsor-panel .qr-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px;text-align:center;min-width:140px}
.sponsor-panel .qr-card .qr-icon{font-size:48px;margin-bottom:6px}
.sponsor-panel .qr-card .qr-label{color:#ccc;font:13px "Microsoft YaHei",sans-serif}
.sponsor-panel .qr-card .qr-hint{color:#888;font:11px "Microsoft YaHei",sans-serif;margin-top:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.interstitial-ad .ad-content{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;text-align:center;min-width:280px;max-width:400px}
.interstitial-ad .ad-content p{color:#aaa;font:14px "Microsoft YaHei",sans-serif;margin-bottom:12px}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}

canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}

/* [AD-FIX:responsive] */
@media (max-width:768px){.ad-banner-container{display:none!important}.sponsor-btn{transform:scale(.8);opacity:.6}}
/* [/AD-FIX:responsive] */
</style>
</head>
<body>

<button id="start-game-btn" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:20px 40px;font-size:20px;background:#7B68EE;color:white;border:none;border-radius:12px;cursor:pointer;z-index:999;font-weight:bold;">开始游戏</button>

<canvas id="c"></canvas>

<script>
if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
</script>
<script src="../game_core.js"></script>
<script>
(function(){
"use strict";

const W=480,H=720;

const WORD_PAIRS = [
    {normal:"苹果",undercover:"梨"},
    {normal:"可乐",undercover:"雪碧"},
    {normal:"老虎",undercover:"狮子"},
    {normal:"篮球",undercover:"足球"},
    {normal:"鼠标",undercover:"键盘"},
    {normal:"学校",undercover:"公司"},
    {normal:"老师",undercover:"教授"},
    {normal:"电影",undercover:"电视剧"},
    {normal:"空调",undercover:"电风扇"},
    {normal:"筷子",undercover:"叉子"},
    {normal:"馒头",undercover:"包子"},
    {normal:"牛奶",undercover:"豆浆"},
    {normal:"手机",undercover:"平板"},
    {normal:"火车",undercover:"地铁"},
    {normal:"沙发",undercover:"椅子"},
    {normal:"眼镜",undercover:"墨镜"},
    {normal:"胡子",undercover:"眉毛"},
    {normal:"筷子",undercover:"牙签"},
    {normal:"麻雀",undercover:"鸽子"},
    {normal:"饺子",undercover:"馄饨"},
    {normal:"足球",undercover:"橄榄球"},
    {normal:"口红",undercover:"唇膏"},
    {normal:"面包",undercover:"蛋糕"},
    {normal:"警察",undercover:"保安"},
    {normal:"老师",undercover:"教官"},
    {normal:"西瓜",undercover:"哈密瓜"},
    {normal:"筷子",undercover:"勺子"},
    {normal:"雨衣",undercover:"雨伞"},
    {normal:"宿舍",undercover:"酒店"},
    {normal:"婚礼",undercover:"葬礼"},
    {normal:"童话",undercover:"神话"},
    {normal:"作家",undercover:"编剧"},
    {normal:"太监",undercover:"人妖"},
    {normal:"香水",undercover:"香薰"},
    {normal:"吉他",undercover:"琵琶"},
    {normal:"微信",undercover:"QQ"},
    {normal:"红包",undercover:"压岁钱"},
    {normal:"麻将",undercover:"扑克"},
    {normal:"烧烤",undercover:"火锅"},
    {normal:"年终奖",undercover:"压岁钱"}
];

const PLAYER_NAMES = ["玩家1号","玩家2号","玩家3号","玩家4号","玩家5号","玩家6号","玩家7号","玩家8号"];

let audioCtx=null;
function initAudio(){
    if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
}
function playTone(freq,dur,type,vol){
    if(!audioCtx)return;
    try{
        const o=audioCtx.createOscillator();
        const g=audioCtx.createGain();
        o.type=type||'sine';
        o.frequency.value=freq;
        g.gain.value=vol||0.15;
        g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
        o.connect(g);g.connect(audioCtx.destination);
        o.start();o.stop(audioCtx.currentTime+dur);
    }catch(e){}
}
function sfxBtn(){playTone(650,0.08,'sine',0.12)}
function sfxCard(){playTone(450,0.15,'triangle',0.15);setTimeout(()=>playTone(680,0.15,'triangle',0.12),80)}
function sfxVote(){playTone(550,0.08,'sine',0.15)}
function sfxElim(){playTone(220,0.3,'sawtooth',0.18);setTimeout(()=>playTone(160,0.4,'sawtooth',0.18),200)}
function sfxWin(){playTone(523,0.1,'sine',0.2);setTimeout(()=>playTone(659,0.1,'sine',0.2),100);setTimeout(()=>playTone(784,0.15,'sine',0.2),200);setTimeout(()=>playTone(1046,0.3,'sine',0.2),350)}
function sfxReveal(){playTone(800,0.1,'triangle',0.15);setTimeout(()=>playTone(1000,0.15,'triangle',0.15),100)}

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let scale=1;
function resize(){
    const r=W/H;
    let cw=window.innerWidth,ch=window.innerHeight;
    if(cw/ch>r){ch=cw/r}else{cw=ch*r}
    canvas.width=cw;canvas.height=ch;
    scale=cw/W;
    ctx.setTransform(scale,0,0,scale,0,0);
}
window.addEventListener('resize',resize);
resize();

const G={
    state:STATE_MENU,
    players:4,
    undercoverCount:1,
    playerWords:[],
    wordPair:null,
    undercoverIdx:[],
    phase:0,
    currentPlayer:0,
    votes:[],
    voteCount:[],
    eliminated:[],
    rounds:0,
    maxRounds:10,
    score:0,
    highScore:0,
    winner:0,
    btnRects:{},
    particles:[],
    paused:false,
    bgStars:[],
    cardReveal:false,
    showRoles:false,
    currentSpeaker:0,
    talkPhase:false,
    votePhase:false,
    phaseTimer:0,
    floatMsgs:[],
    resultShown:false,
    nightMode:true
};

G.highScore=parseInt(Storage.load('undercover_high','0'));

for(let i=0;i<80;i++){
    G.bgStars.push({
        x:Math.random()*W,
        y:Math.random()*H,
        r:Math.random()*1.5+0.3,
        twinkle:Math.random()*Math.PI*2,
        speed:0.02+Math.random()*0.04
    });
}

function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
}

function drawBtn(ctx,x,y,w,h,text,name,color,textColor,fontSize){
    G.btnRects[name]={x:x,y:y,w:w,h:h};
    ctx.fillStyle=color||'#7B68EE';
    roundRect(ctx,x,y,w,h,12);
    ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.5)';
    ctx.lineWidth=2;
    roundRect(ctx,x,y,w,h,12);
    ctx.stroke();
    ctx.fillStyle=textColor||'#fff';
    ctx.font='bold '+(fontSize||18)+'px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(text,x+w/2,y+h/2);
    ctx.textBaseline='alphabetic';
}

function hitBtn(p,name){
    const r=G.btnRects[name];
    return r && p.x>=r.x && p.x<=r.x+r.w && p.y>=r.y && p.y<=r.y+r.h;
}

function getPos(e){
    const rect=canvas.getBoundingClientRect();
    const t=e.touches?e.touches[0]:e;
    return{x:(t.clientX-rect.left)/scale,y:(t.clientY-rect.top)/scale};
}

function updateStars(){
    for(const s of G.bgStars){
        s.twinkle+=s.speed;
    }
}
function drawStars(ctx){
    for(const s of G.bgStars){
        const a=0.3+Math.sin(s.twinkle)*0.5;
        ctx.globalAlpha=Math.max(0.1,Math.min(1,a));
        ctx.fillStyle='#fff';
        ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
}

function spawnParticles(x,y,color,count){
    for(let i=0;i<(count||15);i++){
        G.particles.push({
            x:x,y:y,
            vx:(Math.random()-0.5)*10,
            vy:(Math.random()-0.5)*10-3,
            life:50,maxLife:50,
            size:3+Math.random()*4,
            color:color
        });
    }
}
function updateParticles(){
    for(let i=G.particles.length-1;i>=0;i--){
        const p=G.particles[i];
        p.x+=p.vx;p.y+=p.vy;
        p.vy+=0.25;
        p.life--;
        if(p.life<=0) G.particles.splice(i,1);
    }
}
function drawParticles(ctx){
    for(const p of G.particles){
        ctx.globalAlpha=p.life/p.maxLife;
        ctx.fillStyle=p.color;
        ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
}

function addFloat(x,y,text,color){
    G.floatMsgs.push({x:x,y:y,text:text,color:color||'#fff',life:50,vy:-1.2});
}
function updateFloat(){
    for(let i=G.floatMsgs.length-1;i>=0;i--){
        const f=G.floatMsgs[i];
        f.y+=f.vy;f.life--;
        if(f.life<=0) G.floatMsgs.splice(i,1);
    }
}
function drawFloat(ctx){
    for(const f of G.floatMsgs){
        ctx.globalAlpha=f.life/50;
        ctx.fillStyle=f.color;
        ctx.font='bold 18px "Microsoft YaHei"';
        ctx.textAlign='center';
        ctx.fillText(f.text,f.x,f.y);
    }
    ctx.globalAlpha=1;
    ctx.textAlign='left';
}

window.addEventListener('keydown',function(e){
    G.keys=G.keys||{};
    G.keys[e.key.toLowerCase()]=true;
    if(e.key==='Escape'){if(G.state===STATE_PLAYING)togglePause()}
    initAudio();
});
window.addEventListener('keyup',function(e){
    if(G.keys) G.keys[e.key.toLowerCase()]=false;
});

function handlePointerDown(e){
    initAudio();
    const p=getPos(e);
    if(G.state===STATE_MENU){
        if(hitBtn(p,'start')){startGame();return}
        if(hitBtn(p,'p3')){G.players=3;G.undercoverCount=1;sfxBtn();return}
        if(hitBtn(p,'p4')){G.players=4;G.undercoverCount=1;sfxBtn();return}
        if(hitBtn(p,'p6')){G.players=6;G.undercoverCount=1;sfxBtn();return}
        if(hitBtn(p,'p8')){G.players=8;G.undercoverCount=2;sfxBtn();return}
        if(hitBtn(p,'u1')){G.undercoverCount=1;sfxBtn();return}
        if(hitBtn(p,'u2')){if(G.players>=6){G.undercoverCount=2;sfxBtn()}return}
    } else if(G.state===STATE_OVER){
        if(hitBtn(p,'restart')){startGame();return}
        if(hitBtn(p,'menu')){G.state=STATE_MENU;return}
    } else if(G.state===STATE_PLAYING && !G.paused){
        if(hitBtn(p,'pause')){togglePause();return}
        if(G.phase===0){
            for(let i=0;i<G.players;i++){
                if(hitBtn(p,'view'+i)){viewWord(i);return}
            }
            if(hitBtn(p,'nextPhase')){startTalkPhase();return}
        } else if(G.phase===1){
            if(hitBtn(p,'speaked')){nextSpeaker();return}
        } else if(G.phase===2){
            for(let i=0;i<G.players;i++){
                if(hitBtn(p,'vote'+i) && !G.eliminated[i]){voteFor(i);return}
            }
            if(hitBtn(p,'confirmVote')){confirmVote();return}
        } else if(G.phase===3){
            if(hitBtn(p,'nextRound')){startNewRound();return}
        }
    }
}
function handlePointerMove(e){}
function handlePointerUp(e){}

canvas.addEventListener('mousedown',handlePointerDown);
canvas.addEventListener('mousemove',handlePointerMove);
canvas.addEventListener('mouseup',handlePointerUp);
canvas.addEventListener('touchstart',function(e){e.preventDefault();handlePointerDown(e)},{passive:false});
canvas.addEventListener('touchmove',function(e){e.preventDefault();handlePointerMove(e)},{passive:false});
canvas.addEventListener('touchend',function(e){e.preventDefault();handlePointerUp(e)},{passive:false});

function assignWords(){
    G.wordPair=WORD_PAIRS[Math.floor(Math.random()*WORD_PAIRS.length)];
    G.undercoverIdx=[];
    const pool=[];
    for(let i=0;i<G.players;i++) pool.push(i);
    for(let i=0;i<G.undercoverCount;i++){
        const idx=Math.floor(Math.random()*pool.length);
        G.undercoverIdx.push(pool[idx]);
        pool.splice(idx,1);
    }
    G.playerWords=[];
    for(let i=0;i<G.players;i++){
        G.playerWords.push(G.undercoverIdx.includes(i)?G.wordPair.undercover:G.wordPair.normal);
    }
}

function startGame(){
    initAudio();
    G.state=STATE_PLAYING;
    G.rounds=0;
    G.score=0;
    G.votes=[];
    G.voteCount=[];
    G.eliminated=[];
    for(let i=0;i<G.players;i++){G.votes.push(-1);G.voteCount.push(0);G.eliminated.push(false)}
    G.phase=0;
    G.currentPlayer=0;
    G.currentSpeaker=0;
    G.resultShown=false;
    G.winner=0;
    G.cardReveal=false;
    G.showRoles=false;
    G.talkPhase=false;
    G.votePhase=false;
    assignWords();
    sfxWin();
    spawnParticles(W/2,H/2,'#ffd700',25);
}

function endGame(winner){
    G.state=STATE_OVER;
    G.winner=winner;
    if(winner===1) G.score+=200;
    else G.score+=80;
    if(G.score>G.highScore){
        G.highScore=G.score;
        Storage.save('undercover_high',G.highScore);
    }
    sfxWin();
}

function togglePause(){
    G.paused=!G.paused;
    sfxBtn();
}

function viewWord(i){
    if(G.eliminated[i]) return;
    G.cardReveal=true;
    G.currentPlayer=i;
    sfxReveal();
    spawnParticles(W/2,H/2,'#87CEEB',12);
}

function startTalkPhase(){
    G.phase=1;
    G.currentSpeaker=0;
    while(G.eliminated[G.currentSpeaker] && G.currentSpeaker<G.players) G.currentSpeaker++;
    G.talkPhase=true;
    sfxCard();
}

function nextSpeaker(){
    G.currentSpeaker++;
    while(G.currentSpeaker<G.players && G.eliminated[G.currentSpeaker]) G.currentSpeaker++;
    if(G.currentSpeaker>=G.players){
        G.phase=2;
        G.votePhase=true;
        for(let i=0;i<G.players;i++){G.votes[i]=-1;G.voteCount[i]=0}
    }
    sfxVote();
}

function voteFor(i){
    let currentVoter=0;
    while(currentVoter<G.players && (G.eliminated[currentVoter] || G.votes[currentVoter]!==-1)) currentVoter++;
    if(currentVoter>=G.players) return;
    G.votes[currentVoter]=i;
    G.voteCount[i]++;
    addFloat(80+i*50,450,'+1','#ff6b6b');
    sfxVote();
}

function confirmVote(){
    let maxV=0,maxIdx=-1,tie=false;
    for(let i=0;i<G.players;i++){
        if(G.eliminated[i]) continue;
        if(G.voteCount[i]>maxV){maxV=G.voteCount[i];maxIdx=i;tie=false}
        else if(G.voteCount[i]===maxV) tie=true;
    }
    if(maxV===0){sfxBtn();return}
    G.phase=3;
    G.votePhase=false;
    if(!tie && maxIdx>=0){
        G.eliminated[maxIdx]=true;
        sfxElim();
        spawnParticles(80+maxIdx*50,450,'#ff6b6b',20);
    }else{
        addFloat(W/2,400,'平票！无人淘汰','#ffd700');
        sfxBtn();
    }
    setTimeout(checkWinner,500);
}

function checkWinner(){
    let aliveU=0, aliveN=0;
    for(let i=0;i<G.players;i++){
        if(!G.eliminated[i]){
            if(G.undercoverIdx.includes(i)) aliveU++;
            else aliveN++;
        }
    }
    if(aliveU===0){
        G.score+=aliveN*30;
        endGame(1);
    } else if(aliveU>=aliveN){
        G.score+=50;
        endGame(2);
    }
    G.resultShown=true;
}

function startNewRound(){
    G.rounds++;
    if(G.rounds>=G.maxRounds){
        endGame(0);
        return;
    }
    G.phase=0;
    G.currentSpeaker=0;
    G.resultShown=false;
    sfxCard();
}

function update(){
    updateStars();
    updateParticles();
    updateFloat();
    if(G.state!==STATE_PLAYING||G.paused) return;
}

function drawBackground(ctx){
    const grad=ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,'#0f0c29');
    grad.addColorStop(0.5,'#302b63');
    grad.addColorStop(1,'#24243e');
    ctx.fillStyle=grad;
    ctx.fillRect(0,0,W,H);
    drawStars(ctx);
}

function drawPlayerCard(ctx,x,y,idx,isActive,isViewed){
    const isU=G.undercoverIdx.includes(idx);
    const isOut=G.eliminated[idx];
    const w=56,h=76;
    const colors=['#ff6b6b','#4ecdc4','#ffe66d','#a8e6cf','#ff8b94','#c7ceea','#b5ead7','#ffdac1'];
    let bg=isOut?'rgba(80,80,80,0.6)':colors[idx%colors.length];
    if(isActive){
        ctx.save();
        ctx.shadowColor=isU && G.showRoles?'#ff4444':'#ffd700';
        ctx.shadowBlur=20;
    }
    ctx.fillStyle=bg;
    roundRect(ctx,x-w/2,y-h/2,w,h,10);ctx.fill();
    if(isActive) ctx.restore();
    ctx.strokeStyle=isActive?'#ffd700':'rgba(255,255,255,0.4)';
    ctx.lineWidth=isActive?3:2;
    roundRect(ctx,x-w/2,y-h/2,w,h,10);ctx.stroke();
    ctx.fillStyle=isOut?'#999':'#fff';
    ctx.font='bold 26px Arial';
    ctx.textAlign='center';
    ctx.fillText(idx+1,x,y-10);
    ctx.font='bold 11px "Microsoft YaHei"';
    ctx.fillText(PLAYER_NAMES[idx].replace('玩家','玩家'),x,y+16);
    if(isOut){
        ctx.strokeStyle='#fff';
        ctx.lineWidth=3;
        ctx.beginPath();ctx.moveTo(x-w/2,y-h/2);ctx.lineTo(x+w/2,y+h/2);ctx.stroke();
        ctx.fillStyle='#fff';
        ctx.font='bold 14px "Microsoft YaHei"';
        ctx.fillText('淘汰',x,y+35);
    }
    if(isU && G.showRoles){

        let voted=0,total=0;
        for(let i=0;i<G.players;i++){if(!G.eliminated[i])total++;if(G.votes[i]!==-1)voted++}

        ctx.font='12px "Microsoft YaHei"';
        ctx.fillText('投票进度 '+voted+'/'+total+' 点击头像投票',W/2,52);

function drawPlayersGrid(ctx){
    const positions=[];
    if(G.players<=4){
        positions.push([W/2-80,210]);positions.push([W/2+80,210]);
        positions.push([W/2-80,320]);positions.push([W/2+80,320]);
    } else if(G.players<=6){
        positions.push([W/2-140,190]);positions.push([W/2,190]);positions.push([W/2+140,190]);
        positions.push([W/2-140,310]);positions.push([W/2,310]);positions.push([W/2+140,310]);
    } else {
        positions.push([W/2-150,180]);positions.push([W/2-50,180]);positions.push([W/2+50,180]);positions.push([W/2+150,180]);
        positions.push([W/2-150,300]);positions.push([W/2-50,300]);positions.push([W/2+50,300]);positions.push([W/2+150,300]);
    }
    for(let i=0;i<G.players;i++){
        const isActive=(G.phase===1 && i===G.currentSpeaker) || (G.phase===0 && !G.eliminated[i]);
        drawPlayerCard(ctx,positions[i][0],positions[i][1],i,isActive,true);
        if(G.phase===0 && !G.eliminated[i]){
            drawBtn(ctx,positions[i][0]-25,positions[i][1]+50,50,28,
                G.votes[i]!==undefined && G.votes[i]===-100?'已看👁','👁 查看','view'+i,
                G.eliminated[i]?'rgba(150,150,150,0.5)':'rgba(255,255,255,0.3)','#fff',11);
        }
        if(G.phase===2 && !G.eliminated[i]){
            const v=G.voteCount[i];
            if(v>0){
                ctx.fillStyle='#ff6b6b';
                ctx.font='bold 20px Arial';
                ctx.textAlign='center';
                ctx.fillText(v+'票',positions[i][0],positions[i][1]+55);
                ctx.textAlign='left';
            }
        }
    }
    if(G.phase===2){
        const votersY=410;
        ctx.fillStyle='rgba(255,255,255,0.6)';
        ctx.font='bold 13px "Microsoft YaHei"';
        ctx.textAlign='center';
        ctx.fillText('投票情况：',W/2,votersY);
        for(let i=0;i<G.players;i++){
            if(G.eliminated[i])continue;
            const x=W/2-(G.players*20)/2+i*20+10;
            ctx.fillStyle=G.votes[i]===-1?'#ff6b6b':'#4ecdc4';
            ctx.beginPath();ctx.arc(x,votersY+20,7,0,Math.PI*2);ctx.fill();
            ctx.fillStyle='#fff';
            ctx.font='bold 10px Arial';
            ctx.fillText(i+1,x,votersY+24);
        }
        ctx.textAlign='left';
    }
}

function drawWordCard(ctx){
    if(!G.cardReveal) return;
    const word=G.playerWords[G.currentPlayer];
    const isU=G.undercoverIdx.includes(G.currentPlayer);
    ctx.fillStyle='rgba(0,0,0,0.75)';
    ctx.fillRect(0,0,W,H);
    const cx=W/2,cy=H/2;
    const w=340,h=280;
    ctx.fillStyle='rgba(0,0,0,0.3)';
    roundRect(ctx,cx-w/2+8,cy-h/2+8,w,h,20);ctx.fill();
    const color=isU?'#ff6b6b':'#4ecdc4';
    const grad=ctx.createLinearGradient(cx-w/2,cy-h/2,cx+w/2,cy+h/2);
    grad.addColorStop(0,color);
    grad.addColorStop(1,isU?'#ee5a24':'#00b894');
    ctx.fillStyle=grad;
    roundRect(ctx,cx-w/2,cy-h/2,w,h,20);ctx.fill();
    ctx.strokeStyle='#fff';
    ctx.lineWidth=3;
    roundRect(ctx,cx-w/2,cy-h/2,w,h,20);ctx.stroke();
    ctx.fillStyle='#fff';
    ctx.font='bold 20px "Microsoft YaHei"';
    ctx.textAlign='center';
    ctx.fillText(PLAYER_NAMES[G.currentPlayer]+' 的词语是：',cx,cy-h/2+45);
    ctx.fillStyle='rgba(255,255,255,0.95)';
    ctx.font='bold 15px "Microsoft YaHei"';
    ctx.fillText('请记住，不要让别人看到！',cx,cy-h/2+75);
    ctx.fillStyle='#fff';
    ctx.font='bold 64px "Microsoft YaHei"';
    ctx.fillText(word,cx,cy+15);
    ctx.font='14px "Microsoft YaHei"';
    ctx.fillStyle='rgba(255,255,255,0.8)';
    ctx.fillText('点击任意位置继续游戏',cx,cy+h/2-30);
    ctx.textAlign='left';
    G.tempCloseCard=function(){G.cardReveal=false;G.votes[G.currentPlayer]=-100};
}

function drawBottomActions(ctx){
    if(G.phase===0){
        let all=true;
        for(let i=0;i<G.players;i++){if(!G.eliminated[i] && G.votes[i]!==-100)all=false}

            all?'▶ 开始发言':'请先让所有玩家查看词语','nextPhase',
            all?'#7B68EE':'rgba(255,255,255,0.25)',all?'#fff':'#ccc',17);

        drawBtn(ctx,W/2-100,H-120,200,60,'我说完了 ▶','speaked','#ffd700','#333',18);
    } else if(G.phase===2){
        drawBtn(ctx,W/2-100,H-120,200,60,'🗳 确认投票结果','confirmVote','#ff6b6b','#fff',18);

        if(!G.resultShown){

            drawBtn(ctx,W/2-110,H-130,220,55,'游戏结束','nextRound','#7B68EE','#fff',17);

}

    drawBackground(ctx);
    drawHUD(ctx);
    drawPlayersGrid(ctx);
    drawBottomActions(ctx);
    drawParticles(ctx);
    drawFloat(ctx);
    drawWordCard(ctx);
    if(G.paused){
        ctx.fillStyle='rgba(0,0,0,0.8)';
        ctx.fillRect(0,0,W,H);
        ctx.fillStyle='#fff';
        ctx.font='bold 48px "Microsoft YaHei"';

        ctx.fillText('按 ESC 继续游戏',W/2,H/2+30);
        ctx.textAlign='left';
    }
}

function drawGameOver(ctx){
    drawBackground(ctx);
    ctx.fillStyle='rgba(0,0,0,0.5)';
    ctx.fillRect(0,0,W,H);
    const isNew=G.score>=G.highScore&&G.score>0;
    ctx.fillStyle=isNew?'#ffd700':(G.winner===1?'#4ecdc4':'#ff6b6b');
    ctx.font='bold 44px "Microsoft YaHei"';
    ctx.textAlign='center';
    let title='游戏结束';
    if(G.winner===1)title='🎉 平民胜利！';
    else if(G.winner===2)title='🕵️ 卧底胜利！';
    if(isNew) title='🏆 新纪录！ '+title;
    ctx.fillText(title,W/2,110);
    const cardW=400,cardH=260;
    const cx=W/2,cy=310;
    ctx.fillStyle='rgba(0,0,0,0.3)';
    roundRect(ctx,cx-cardW/2+5,cy-cardH/2+5,cardW,cardH,20);ctx.fill();
    const grd=ctx.createLinearGradient(cx-cardW/2,cy-cardH/2,cx+cardW/2,cy+cardH/2);
    grd.addColorStop(0,G.winner===1?'#4ecdc4':'#ff6b6b');
    grd.addColorStop(1,G.winner===1?'#00b894':'#ee5a24');
    ctx.fillStyle=grd;
    roundRect(ctx,cx-cardW/2,cy-cardH/2,cardW,cardH,20);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.6)';
    ctx.lineWidth=3;
    roundRect(ctx,cx-cardW/2,cy-cardH/2,cardW,cardH,20);ctx.stroke();
    ctx.fillStyle='#fff';
    ctx.font='bold 22px "Microsoft YaHei"';
    ctx.fillText('本轮词语',cx,cy-cardH/2+42);
    ctx.font='bold 18px "Microsoft YaHei"';
    ctx.fillStyle='rgba(255,255,255,0.85)';
    ctx.fillText('平民词: '+G.wordPair.normal+'   卧底词: '+G.wordPair.undercover,cx,cy-cardH/2+75);
    ctx.font='bold 20px "Microsoft YaHei"';
    ctx.fillStyle='#fff';
    ctx.fillText('卧底身份揭晓：',cx,cy-cardH/2+120);
    const xStep=cardW/(G.players+1);
    for(let i=0;i<G.players;i++){
        const x=cx-cardW/2+(i+1)*xStep;
        const y=cy-20;
        const isU=G.undercoverIdx.includes(i);
        ctx.fillStyle=isU?'#ff4444':'rgba(255,255,255,0.3)';
        ctx.beginPath();ctx.arc(x,y,22,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='#fff';ctx.lineWidth=2;
        ctx.beginPath();ctx.arc(x,y,22,0,Math.PI*2);ctx.stroke();
        ctx.fillStyle='#fff';
        ctx.font='bold 16px Arial';
        ctx.fillText((i+1),x,y+5);
        if(isU){
            ctx.fillStyle='#ff4444';
            ctx.font='bold 11px "Microsoft YaHei"';
            ctx.fillText('卧底',x,y+40);
        } else if(G.eliminated[i]){
            ctx.fillStyle='#ccc';
            ctx.font='bold 10px "Microsoft YaHei"';
            ctx.fillText('平民(出局)',x,y+40);
        } else {
            ctx.fillStyle='#a8e6cf';
            ctx.font='bold 10px "Microsoft YaHei"';
            ctx.fillText('平民(存活)',x,y+40);
        }
    }
    ctx.fillStyle='#fff';
    ctx.font='bold 20px "Microsoft YaHei"';
    ctx.fillText('本局得分',cx,cy+80);
    ctx.fillStyle='#ffd700';
    ctx.font='bold 48px Arial';
    ctx.fillText(G.score+' 分',cx,cy+125);
    ctx.fillStyle='#ffd700';
    ctx.font='bold 18px "Microsoft YaHei"';
    ctx.fillText('🏆 最高分纪录: '+G.highScore,W/2,500);
    const ratings=[
        {min:500,text:'推理大师 🕵️',color:'#ffd700'},
        {min:350,text:'火眼金睛 👁',color:'#f093fb'},
        {min:200,text:'逻辑高手 🧠',color:'#4ecdc4'},
        {min:100,text:'初露锋芒 🌟',color:'#a8e6cf'},
        {min:0,text:'再接再厉 💪',color:'#ff8b94'}
    ];
    let rating=ratings[ratings.length-1];
    for(const r of ratings){if(G.score>=r.min){rating=r;break}}
    ctx.fillStyle=rating.color;
    ctx.font='bold 28px "Microsoft YaHei"';
    ctx.fillText(rating.text,W/2,545);
    drawBtn(ctx,W/2-110,580,220,60,'🔄 再来一局','restart','#fff','#7B68EE',20);
    drawBtn(ctx,W/2-80,650,160,45,'🏠 返回菜单','menu','rgba(255,255,255,0.3)','#fff',16);
    ctx.textAlign='left';
}

function draw(){
    switch(G.state){
        case STATE_MENU: drawMenu(ctx); break;
        case STATE_PLAYING: drawGame(ctx); break;
        case STATE_OVER: drawGameOver(ctx); break;
        case STATE_PAUSE: drawGame(ctx); break;
    }
}

canvas.addEventListener('click',function(){
    if(G.cardReveal && G.tempCloseCard){G.tempCloseCard();G.tempCloseCard=null}
});

function gameLoop(){
    requestAnimationFrame(gameLoop);
    update();
    draw();
}

    const a=ACHIEVEMENTS.find(x=>x.id===id);

function updateAchievementsAfterGame(){
    STAT.totalGames++;
    if(G){
        STAT.totalCorrect+=G.correct||0;STAT.totalWrong+=G.wrong||0;
        STAT.bestCombo=Math.max(STAT.bestCombo,G.maxCombo||0);
        STAT.bestScore=Math.max(STAT.bestScore,G.score||0);
        STAT.totalHintUsed+=G.hintsUsed||0;
    }
    if(STAT.totalGames>=1)unlockAchieve('first_win');
    if((G.score||0)>=500)unlockAchieve('score_500');
    if((G.score||0)>=1000)unlockAchieve('score_1000');
    if((G.score||0)>=2000)unlockAchieve('score_2000');
    if((G.maxCombo||0)>=5)unlockAchieve('combo_5');
    if((G.maxCombo||0)>=10)unlockAchieve('combo_10');
    if(STAT.totalGames>=10)unlockAchieve('game_10');
    if(STAT.totalGames>=30)unlockAchieve('game_30');
    if(STAT.totalCorrect>=100)unlockAchieve('q_100');
    if(G&&G.highScore&&G.score>G.highScore)unlockAchieve('best');
    saveStat();
}

    const pct=uc/ACHIEVEMENTS.length;
    ctx.fillStyle='rgba(0,0,0,0.08)';
    if(typeof roundRect==='function')roundRect(ctx,35,145,W-70,22,11);ctx.fill();
    ctx.fillStyle=THEMES[SETTINGS.theme%THEMES.length].accent;
    if(typeof roundRect==='function')roundRect(ctx,35,145,(W-70)*pct,22,11);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 13px Arial';ctx.textAlign='center';ctx.fillText(uc+' / '+ACHIEVEMENTS.length,W/2,160);
    const sy=185;
    for(let i=0;i<ACHIEVEMENTS.length;i++){
        const a=ACHIEVEMENTS[i];const y=sy+i*50;if(y>H-130)break;
        ctx.fillStyle=a.unlocked?'rgba(255,215,0,0.12)':'rgba(0,0,0,0.04)';
        if(typeof roundRect==='function'){
            roundRect(ctx,30,y,W-60,44,10);ctx.fill();
            ctx.strokeStyle=a.unlocked?'#ffc107':'rgba(0,0,0,0.08)';ctx.lineWidth=1.5;
            roundRect(ctx,30,y,W-60,44,10);ctx.stroke();
        }
        ctx.font='28px serif';ctx.textAlign='left';
        if(a.unlocked)ctx.fillText(a.icon,48,y+32);
        else{ctx.globalAlpha=0.3;ctx.fillText('?',48,y+32);ctx.globalAlpha=1}
        ctx.fillStyle=a.unlocked?'#333':'#999';ctx.font='bold 15px "Microsoft YaHei"';
        ctx.textAlign='left';ctx.fillText(a.name,90,y+20);
        ctx.font='12px "Microsoft YaHei"';ctx.fillStyle=a.unlocked?'#555':'#aaa';ctx.fillText(a.desc,90,y+38);
    }
    if(typeof drawBtn==='function')drawBtn(ctx,W/2-70,H-120,140,42,'返回菜单','backMain','#9c27b0','#fff',16);
    ctx.textAlign='left';
}
function drawStatsPage(ctx){
    drawBackground(ctx);drawSubPageBackdrop(ctx,'个人游戏统计');
    const cw=W-70;
    const hs=G?(G.highScore||0):0;
    const stats=[
        {k:'游戏总场次',v:String(STAT.totalGames),c:'#e91e63'},
        {k:'累计答对',v:String(STAT.totalCorrect),c:'#43e97b'},
        {k:'累计答错跳过',v:String(STAT.totalWrong),c:'#ef5350'},
        {k:'最高连击',v:String(STAT.bestCombo),c:'#ff9800'},
        {k:'使用提示次数',v:String(STAT.totalHintUsed),c:'#00bcd4'},
        {k:'历史最高分',v:String(Math.max(STAT.bestScore,hs)),c:'#3f51b5'}
    ];
    let y=155;
    for(let i=0;i<stats.length;i++){
        const s=stats[i];
        ctx.fillStyle=i%2===0?'rgba(0,0,0,0.03)':'rgba(0,0,0,0.0)';
        if(typeof roundRect==='function')roundRect(ctx,35,y,cw,50,8);ctx.fill();
        ctx.fillStyle='#333';ctx.font='bold 15px "Microsoft YaHei"';ctx.textAlign='left';ctx.fillText(s.k,55,y+30);
        ctx.fillStyle=s.c;ctx.font='bold 22px Arial';ctx.textAlign='right';ctx.fillText(s.v,W-55,y+32);y+=52;
    }
    const acc=STAT.totalCorrect+STAT.totalWrong>0?Math.round(STAT.totalCorrect/(STAT.totalCorrect+STAT.totalWrong)*100):0;
    ctx.fillStyle='rgba(156,39,176,0.08)';
    if(typeof roundRect==='function'){
        roundRect(ctx,35,y,cw,50,12);ctx.fill();
        ctx.strokeStyle='rgba(156,39,176,0.35)';ctx.lineWidth=1.5;roundRect(ctx,35,y,cw,50,12);ctx.stroke();

    ctx.fillStyle='#333';ctx.font='bold 15px "Microsoft YaHei"';ctx.textAlign='left';ctx.fillText('历史综合正确率',55,y+30);

}
const origPointerDown=typeof handlePointerDown==='function'?handlePointerDown:function(){};
function hitBtn2(p,name){
    const r=G.btnRects[name];if(!r||r.disabled)return false;
    return p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;
}
function handlePointerDown2(e){
    const p=typeof getPos==='function'?getPos(e):{x:0,y:0};
    const st=G.state;
    if(st===STATE_MENU){
        if(hitBtn2(p,'openSettings')){G.state=STATE_SETTINGS;return}
        if(hitBtn2(p,'openAch')){G.state=STATE_ACHIEVEMENTS;return}
        if(hitBtn2(p,'openStats')){G.state=STATE_STATS;return}
        if(hitBtn2(p,'openHelp')){G.state=STATE_HELP;return}
    } else if(st===STATE_SETTINGS||st===STATE_ACHIEVEMENTS||st===STATE_HELP||st===STATE_STATS){
        if(hitBtn2(p,'closeSub')||hitBtn2(p,'backMain')){G.state=STATE_MENU;return}
        if(st===STATE_SETTINGS){
            if(hitBtn2(p,'set_soundOn')){SETTINGS.soundOn=!SETTINGS.soundOn;saveSettings();return}
            if(hitBtn2(p,'set_vibOn')){SETTINGS.vibOn=!SETTINGS.vibOn;saveSettings();return}
            if(hitBtn2(p,'set_showTimer')){SETTINGS.showTimer=!SETTINGS.showTimer;saveSettings();return}
            if(hitBtn2(p,'resetData')){
                if(confirm('确定清除所有存档、统计和成就吗？无法恢复！')){
                    for(const k of ['_g','_c','_w','_bc','_h','_bs','_unlock'])Storage.remove(SK+k);
                    STAT.totalGames=0;STAT.totalCorrect=0;STAT.totalWrong=0;STAT.bestCombo=0;
                    STAT.totalHintUsed=0;STAT.bestScore=0;STAT.unlocked=[];
                    for(const a of ACHIEVEMENTS)a.unlocked=false;if(G)G.highScore=0;saveStat();
                }
                return;
            }
            for(let i=0;i<THEMES.length;i++){
                if(hitBtn2(p,'theme_'+i)){SETTINGS.theme=i;saveSettings();applyTheme();return}
            }
        }
    }
    return origPointerDown(e);
}
if(typeof canvas!=='undefined'){
    canvas.addEventListener('mousedown',handlePointerDown2);
    canvas.addEventListener('touchstart',function(e){e.preventDefault();handlePointerDown2(e)},{passive:false});
}
const origDraw=typeof draw==='function'?draw:function(){};
function drawEx(){
    switch(G.state){
        case STATE_SETTINGS:drawSettingsPage(ctx);break;
        case STATE_ACHIEVEMENTS:drawAchievementsPage(ctx);break;
        case STATE_HELP:drawHelpPage(ctx);break;
        case STATE_STATS:drawStatsPage(ctx);break;
        case STATE_MENU:drawMenuEx(ctx);break;
        default:origDraw();
    }
}
window.cancelAnimationFrame(window.__raf||0);
(function loop2(){window.__raf=requestAnimationFrame(loop2);if(typeof update==='function')update();drawEx()})();
applyTheme();
})();

      c.style.maxWidth = '100%';

        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
