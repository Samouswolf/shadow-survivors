let audioCtx=null;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
function playTone(freq,dur,type,vol){
    if(!audioCtx)return;
    try{
        const o=audioCtx.createOscillator(),g=audioCtx.createGain();
        o.type=type||'sine';o.frequency.value=freq;g.gain.value=vol||0.15;
        g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
        o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur);
    }catch(e){}
}
function sfxBtn(){playTone(650,0.08,'sine',0.12)}
function sfxCorrect(){playTone(880,0.1,'sine',0.2);setTimeout(()=>playTone(1100,0.15,'sine',0.18),80)}
function sfxWrong(){playTone(220,0.15,'sawtooth',0.15);setTimeout(()=>playTone(180,0.2,'sawtooth',0.12),100)}
function sfxWin(){playTone(523,0.1,'sine',0.2);setTimeout(()=>playTone(659,0.1,'sine',0.2),100);setTimeout(()=>playTone(784,0.15,'sine',0.2),200);setTimeout(()=>playTone(1046,0.3,'sine',0.2),350)}
function sfxTick(){playTone(900,0.03,'square',0.08)}
function sfxChain(){playTone(523,0.08,'triangle',0.2);setTimeout(()=>playTone(659,0.08,'triangle',0.2),70);setTimeout(()=>playTone(784,0.12,'triangle',0.2),140)}

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let scale=1;
function resize(){
    const r=W/H;let cw=window.innerWidth,ch=window.innerHeight;
    if(cw/ch>r){ch=cw/r}else{cw=ch*r}
    canvas.width=cw;canvas.height=ch;scale=cw/W;
    ctx.setTransform(scale,0,0,scale,0,0);
}
window.addEventListener('resize',resize);resize();

const G={
    state:STATE_MENU,
    chain:[],
    used:new Set(),
    current:null,
    lastChar:'',
    options:[],
    score:0,highScore:0,
    chainCount:0,maxChain:0,
    timeLeft:0,qTime:20,
    phase:0,
    lives:3,
    btnRects:{},
    particles:[],
    paused:false,
    floatMsgs:[],
    bgWaves:[],
    chainX:0,chainAnim:0,
    bonusShown:false,
    hintUsed:false,
    inputActive:false,input:''
};
G.highScore=parseInt(Storage.load('idiom_high','0'));

for(let i=0;i<6;i++){
    G.bgWaves.push({y:100+i*120,amp:20+Math.random()*30,
        phase:Math.random()*Math.PI*2,spd:0.01+Math.random()*0.02,
        col:`hsla(${190+i*10},70%,80%,${0.1+i*0.02})`});
}

function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

function drawBtn(ctx,x,y,w,h,text,name,color,textColor,fontSize,disabled){
    G.btnRects[name]={x:x,y:y,w:w,h:h,disabled:disabled};
    ctx.fillStyle=disabled?'rgba(150,150,150,0.4)':(color||'#6dd5ed');
    roundRect(ctx,x,y,w,h,12);ctx.fill();
    ctx.strokeStyle=disabled?'rgba(255,255,255,0.2)':'rgba(255,255,255,0.55)';
    ctx.lineWidth=2;roundRect(ctx,x,y,w,h,12);ctx.stroke();
    ctx.fillStyle=disabled?'#bbb':(textColor||'#fff');
    ctx.font='bold '+(fontSize||16)+'px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(text,x+w/2,y+h/2);ctx.textBaseline='alphabetic';
}
function hitBtn(p,name){
    const r=G.btnRects[name];
    return r && !r.disabled && p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;
}
function getPos(e){
    const rect=canvas.getBoundingClientRect();
    const t=e.touches?e.touches[0]:e;
    return{x:(t.clientX-rect.left)/scale,y:(t.clientY-rect.top)/scale};
}

function updateWaves(){
    for(const w of G.bgWaves)w.phase+=w.spd;
}
function drawWaves(ctx){
    for(const w of G.bgWaves){
        ctx.fillStyle=w.col;
        ctx.beginPath();
        ctx.moveTo(0,w.y);
        for(let x=0;x<=W;x+=10){
            ctx.lineTo(x,w.y+Math.sin(x/50+w.phase)*w.amp);
        }
        ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
    }
}

function spawnParticles(x,y,color,count){
    for(let i=0;i<(count||15);i++){
        G.particles.push({x:x,y:y,vx:(Math.random()-0.5)*10,vy:(Math.random()-0.5)*10-3,
            life:50,maxLife:50,size:3+Math.random()*4,color:color});
    }
}
function updateParticles(){
    for(let i=G.particles.length-1;i>=0;i--){
        const p=G.particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.25;p.life--;
        if(p.life<=0)G.particles.splice(i,1);
    }
}
function drawParticles(ctx){
    for(const p of G.particles){
        ctx.globalAlpha=p.life/p.maxLife;
        ctx.fillStyle=p.color;
        ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
}
function addFloat(x,y,text,color){
    G.floatMsgs.push({x:x,y:y,text:text,color:color||'#fff',life:50,vy:-1.2});
}
function updateFloat(){
    for(let i=G.floatMsgs.length-1;i>=0;i--){
        const f=G.floatMsgs[i];f.y+=f.vy;f.life--;
        if(f.life<=0)G.floatMsgs.splice(i,1);
    }
}
function drawFloat(ctx){
    for(const f of G.floatMsgs){
        ctx.globalAlpha=f.life/50;
        ctx.fillStyle=f.color;
        ctx.font='bold 18px "Microsoft YaHei"';
        ctx.textAlign='center';ctx.fillText(f.text,f.x,f.y);
    }
    ctx.globalAlpha=1;ctx.textAlign='left';
}

window.addEventListener('keydown',function(e){
    G.keys=G.keys||{};G.keys[e.key.toLowerCase()]=true;
    if(e.key==='Escape'){if(G.state===STATE_PLAYING)togglePause()}
    if(G.state===STATE_PLAYING&&G.inputActive){
        if(e.key==='Backspace'){G.input=G.input.slice(0,-1);sfxBtn()}
        else if(e.key==='Enter'){submitInput()}
        else if(e.key.length===1){G.input+=e.key;sfxBtn()}
    }
    initAudio();
});
window.addEventListener('keyup',function(e){if(G.keys)G.keys[e.key.toLowerCase()]=false});

function handlePointerDown(e){
    initAudio();
    const p=getPos(e);
    if(G.state===STATE_MENU){
        if(hitBtn(p,'start')){startGame();return}
    } else if(G.state===STATE_OVER){
        if(hitBtn(p,'restart')){startGame();return}
        if(hitBtn(p,'menu')){G.state=STATE_MENU;return}
    } else if(G.state===STATE_PLAYING&&!G.paused){
        if(hitBtn(p,'pause')){togglePause();return}
        if(G.phase===0){
            for(let i=0;i<4;i++){
                if(hitBtn(p,'opt'+i)){selectOpt(i);return}
            }
            if(hitBtn(p,'hint')&&!G.hintUsed){useHint();return}
            if(hitBtn(p,'openInput')){G.inputActive=true;sfxBtn();return}
            if(hitBtn(p,'skip')){skip();return}
        } else if(G.phase===1){
            if(hitBtn(p,'submitIn')){submitInput();return}
            if(hitBtn(p,'cancelIn')){G.inputActive=false;G.input='';sfxBtn();return}
        } else if(G.phase===2){
            if(hitBtn(p,'next')){nextIdiom();return}
        }
    }
}
function handlePointerMove(e){}
function handlePointerUp(e){}
canvas.addEventListener('mousedown',handlePointerDown);
canvas.addEventListener('mousemove',handlePointerMove);
canvas.addEventListener('mouseup',handlePointerUp);
canvas.addEventListener('touchstart',function(e){e.preventDefault();handlePointerDown(e)},{passive:false});
canvas.addEventListener('touchmove',function(e){e.preventDefault();handlePointerMove(e)},{passive:false});
canvas.addEventListener('touchend',function(e){e.preventDefault();handlePointerUp(e)},{passive:false});

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function buildOptions(char){
    const pool=IDIOMS.filter(x=>!G.used.has(x.w)&&x.w[0]===char);
    let correct;
    if(pool.length>0)correct=pool[Math.floor(Math.random()*pool.length)];
    else correct=null;
    const opts=[];
    if(correct)opts.push(correct);
    const others=IDIOMS.filter(x=>!G.used.has(x.w)&&x.w[0]!==char);
    shuffle(others);
    for(let i=0;i<3&&i<others.length;i++)opts.push(others[i]);
    while(opts.length<4)opts.push(IDIOMS[Math.floor(Math.random()*IDIOMS.length)]);
    shuffle(opts);
    G.options=opts;
    G.correct=correct;
}

function startGame(){
    initAudio();
    G.state=STATE_PLAYING;G.score=0;G.chainCount=0;G.maxChain=0;
    G.chain=[];G.used=new Set();G.lives=3;G.chainAnim=0;G.bonusShown=false;
    G.current=IDIOMS[Math.floor(Math.random()*IDIOMS.length)];
    G.chain.push(G.current);G.used.add(G.current.w);G.chainCount=1;
    G.lastChar=G.current.w[G.current.w.length-1];
    G.phase=0;G.hintUsed=false;G.input='';G.inputActive=false;
    buildOptions(G.lastChar);
    G.timeLeft=G.qTime*60;
    sfxWin();spawnParticles(W/2,H/2,'#ffd700',25);
    addFloat(W/2,140,'🔗 龙 '+G.chainCount+' 起步！','#ffd700');
}
function endGame(){
    G.state=STATE_OVER;
    if(G.score>G.highScore){G.highScore=G.score;Storage.save('idiom_high',G.highScore)}
    sfxWin();
}
function togglePause(){G.paused=!G.paused;sfxBtn()}

function skip(){
    G.lives--;
    if(G.lives<=0){addFloat(W/2,140,'❤️ 用完了！','#fa709a');endGame();return}
    G.phase=2;
    sfxWrong();
    addFloat(W/2,140,'⏭ 跳过 -1 ❤️','#fa709a');
}

function useHint(){
    G.hintUsed=true;G.score=Math.max(0,G.score-30);sfxBtn();
    addFloat(W/2,140,'💡 提示 -30 分','#ffe66d');
}

function nextIdiom(){
    G.chainCount++;G.maxChain=Math.max(G.maxChain,G.chainCount);
    G.chainAnim=1;
    G.phase=0;G.hintUsed=false;G.inputActive=false;G.input='';
    if(!G.correct||G.options.length===0){
        addFloat(W/2,140,'🎉 接不下去啦！挑战成功！','#ffd700');
        G.score+=300;
        endGame();return;
    }
    G.lastChar=G.correct.w[G.correct.w.length-1];
    G.current=G.correct;
    G.chain.push(G.current);G.used.add(G.current.w);
    buildOptions(G.lastChar);
    G.timeLeft=G.qTime*60;
    sfxChain();
    if(G.chainCount>=5&&!G.bonusShown){G.bonusShown=true;G.score+=200;addFloat(W/2,130,'🏆 5连击！额外 +200','#ffd700')}
    if(G.chainCount>=10){G.score+=500;addFloat(W/2,110,'🏅 10连击！超神 +500','#ffd700')}
}

function selectOpt(idx){
    const w=G.options[idx].w;
    if(!G.correct||w!==G.correct.w){
        const valid=G.used.has(w)?false:(w[0]===G.lastChar);
        if(!valid){
            G.lives--;G.chainCount=0;G.phase=2;
            sfxWrong();spawnParticles(W/2,500,'#fa709a',20);
            const reason=G.used.has(w)?'已用过':'首字不匹配';
            addFloat(W/2,140,'✗ 接龙失败! ('+reason+') -1 ❤️','#fa709a');
            if(G.lives<=0){endGame();return}
            return;
        }
    }
    G.phase=2;
    const timeBonus=Math.floor(G.timeLeft/25);
    const chainBonus=G.chainCount*8;
    const hintPenalty=G.hintUsed?30:0;
    const total=Math.max(40,100+timeBonus*5+chainBonus-hintPenalty);
    G.score+=total;
    sfxCorrect();spawnParticles(W/2,500,'#43e97b',25);
    addFloat(W/2,135,'✅ 接龙成功！🔗龙'+(G.chainCount+1)+' +'+total,'#43e97b');
}

function submitInput(){
    const g=G.input.trim();
    G.inputActive=false;
    if(!g)return;
    const found=IDIOMS.find(x=>x.w===g);
    if(!found){sfxWrong();addFloat(W/2,140,'✗ 不是成语，再想想！','#fa709a');G.input='';return}
    if(G.used.has(g)){sfxWrong();addFloat(W/2,140,'✗ 这个成语用过啦！','#fa709a');G.input='';return}
    if(g[0]!==G.lastChar){sfxWrong();addFloat(W/2,140,'✗ 首字不匹配！要接：'+G.lastChar,'#fa709a');G.input='';return}
    G.phase=2;G.correct=found;
    const timeBonus=Math.floor(G.timeLeft/20);
    const chainBonus=G.chainCount*10;
    const total=Math.max(50,150+timeBonus*5+chainBonus);
    G.score+=total;
    sfxCorrect();spawnParticles(W/2,500,'#43e97b',30);
    addFloat(W/2,135,'🎯 手输入正确！🔗龙'+(G.chainCount+1)+' +'+total,'#43e97b');
    G.input='';
}

function update(){
    updateWaves();updateParticles();updateFloat();
    if(G.state!==STATE_PLAYING||G.paused)return;
    if(G.phase===0&&G.timeLeft>0){
        G.timeLeft--;
        if(G.timeLeft<=0){
            G.lives--;G.chainCount=0;G.phase=2;
            sfxWrong();
            addFloat(W/2,140,'⏰ 超时！ -1 ❤️','#fa709a');
            if(G.lives<=0)endGame();
        }
        if(G.timeLeft===300||G.timeLeft===180||G.timeLeft===60)sfxTick();
    }
    if(G.chainAnim>0){G.chainAnim-=0.03;if(G.chainAnim<0)G.chainAnim=0}
}

function drawBackground(ctx){
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#2193b0');g.addColorStop(1,'#6dd5ed');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    drawWaves(ctx);
}

function drawHUD(ctx){
    ctx.fillStyle='rgba(255,255,255,0.55)';
    roundRect(ctx,10,10,W-20,75,14);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.9)';ctx.lineWidth=2;
    roundRect(ctx,10,10,W-20,75,14);ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold 14px "Microsoft YaHei"';ctx.textAlign='left';
    ctx.fillText('🔗 接龙',25,32);
    ctx.font='bold 22px Arial';ctx.fillStyle='#ffd700';
    ctx.fillText(G.chainCount,85,32);
    ctx.fillStyle='#fff';ctx.font='bold 12px "Microsoft YaHei"';
    ctx.fillText('(最高'+G.maxChain+')',120,32);
    ctx.font='bold 14px "Microsoft YaHei"';
    for(let i=0;i<3;i++){
        ctx.fillStyle=i<G.lives?'#ff4081':'rgba(0,0,0,0.2)';
        ctx.font='22px serif';
        ctx.fillText('❤',25+i*28,60);
    }
    ctx.textAlign='center';
    const ratio=G.timeLeft/(G.qTime*60);
    const barW=170,barH=20,bx=W/2-barW/2;
    ctx.fillStyle='rgba(0,0,0,0.25)';roundRect(ctx,bx,18,barW,barH,10);ctx.fill();
    ctx.fillStyle=ratio<0.25?'#fa709a':ratio<0.5?'#ffe66d':'#43e97b';
    roundRect(ctx,bx+2,20,(barW-4)*Math.max(0,ratio),barH-4,8);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 14px Arial';
    ctx.fillText(Math.ceil(G.timeLeft/60)+'s',W/2,33);
    ctx.font='bold 14px "Microsoft YaHei"';ctx.fillStyle='#fff';
    ctx.fillText('接字：'+G.lastChar,W/2,58);
    ctx.textAlign='right';ctx.fillStyle='#fff';ctx.font='bold 14px "Microsoft YaHei"';
    ctx.fillText('得分',W-25,32);
    ctx.fillStyle='#ffd700';ctx.font='bold 24px Arial';
    ctx.fillText(G.score,W-25,58);
    ctx.textAlign='left';
}

function drawChain(ctx){
    if(G.chain.length===0)return;
    const cy=100,cw=W-40,ch=70;
    ctx.fillStyle='rgba(255,255,255,0.9)';
    roundRect(ctx,20,cy,cw,ch,14);ctx.fill();
    ctx.strokeStyle='#2193b0';ctx.lineWidth=3;
    roundRect(ctx,20,cy,cw,ch,14);ctx.stroke();
    ctx.fillStyle='#666';ctx.font='bold 13px "Microsoft YaHei"';
    ctx.textAlign='left';ctx.fillText('🔗 接龙历史（点击看意思）',30,cy+20);
    ctx.font='bold 18px "Microsoft YaHei"';
    let x=30,maxX=cw-30,yText=cy+48;
    ctx.textBaseline='middle';
    const last=G.chain.length>=1?G.chain[G.chain.length-1]:null;
    const prev=G.chain.length>=2?G.chain[G.chain.length-2]:null;
    for(let i=Math.max(0,G.chain.length-6);i<G.chain.length;i++){
        const it=G.chain[i];
        const isLast=i===G.chain.length-1;
        const t=it.w;
        ctx.font='bold '+(isLast?22:16)+'px "Microsoft YaHei"';
        const tw=ctx.measureText(t).width;
        if(x+tw>maxX){x=30;yText+=26;if(yText>cy+ch-10)break}
        if(i>0){
            ctx.fillStyle='#bbb';
            ctx.font='14px serif';
            ctx.fillText('→',x-6,yText);
            x+=8;
        }
        for(let j=0;j<t.length;j++){
            const isLink=(isLast&&j===0)||(i===G.chain.length-2&&j===t.length-1);
            const c=isLast?'#ff6b00':(isLink?'#ff4081':'#333');
            ctx.fillStyle=c;
            ctx.font='bold '+(isLast?22:16)+'px "Microsoft YaHei"';
            ctx.fillText(t[j],x,yText);
            x+=ctx.measureText(t[j]).width+1;
        }
        x+=6;
    }
    ctx.textBaseline='alphabetic';ctx.textAlign='left';
    if(last){
        ctx.fillStyle='rgba(33,147,176,0.1)';
        roundRect(ctx,20,cy+ch-18,cw,18,{bl:14,br:14,tl:0,tr:0});roundRect(ctx,20,cy+ch-18,cw,18,14);ctx.fill();
        ctx.fillStyle='#1565c0';ctx.font='bold 13px "Microsoft YaHei"';
        ctx.textAlign='center';
        ctx.fillText('📖 '+last.w+'：'+last.m,20+cw/2,cy+ch-4);
        ctx.textAlign='left';
    }
}

function drawQuestion(ctx){
    const qy=G.chain.length>0?185:100,qh=90;
    ctx.fillStyle='rgba(255,255,255,0.98)';

function drawOptions(ctx){
    const oy=G.chain.length>0?290:205;
    const oh=60,og=10,ow=W-40;
    for(let i=0;i<4;i++){
        const y=oy+i*(oh+og);
        const o=G.options[i];
        let bg='rgba(255,255,255,0.9)',border='rgba(255,255,255,0.5)',tc='#444';
        if(G.hintUsed&&G.correct&&o.w===G.correct.w&&G.phase===0){
            const f=Math.sin(Date.now()/80)>0;
            if(f){bg='rgba(255,230,109,0.6)';border='#ffe66d'}
        }
        if(G.phase>=2){
            if(G.correct&&o.w===G.correct.w){bg='#43e97b';border='#fff';tc='#fff'}
            else if(o.w[0]!==G.lastChar||G.used.has(o.w)){bg='rgba(255,255,255,0.6)';tc='rgba(0,0,0,0.4)';border='rgba(255,255,255,0.2)'}
        }
        G.btnRects['opt'+i]={x:20,y:y,w:ow,h:oh,disabled:G.phase>=2};
        ctx.fillStyle=bg;roundRect(ctx,20,y,ow,oh,14);ctx.fill();
        ctx.strokeStyle=border;ctx.lineWidth=2.5;roundRect(ctx,20,y,ow,oh,14);ctx.stroke();
        const isMatch=G.correct&&o.w===G.correct.w;
        ctx.textAlign='left';
        ctx.font='bold 18px Arial';ctx.fillStyle=['#ff6b6b','#4ecdc4','#ffe66d','#a78bfa'][i];
        ctx.fillText(String.fromCharCode(65+i),40,y+oh/2+6);
        ctx.textAlign='center';ctx.fillStyle=tc;ctx.font='bold 22px "Microsoft YaHei"';
        for(let j=0;j<o.w.length;j++){
            const cj=(o.w[0]===G.lastChar&&j===0)?'#ff4081':tc;
            ctx.fillStyle=cj;
            ctx.font='bold 22px "Microsoft YaHei"';
            const off=(o.w.length-1)*12;
            ctx.fillText(o.w[j],20+ow/2-off+j*24,y+oh/2+6);
        }
        if(G.phase>=2&&isMatch){
            ctx.font='bold 26px Arial';ctx.fillStyle='#fff';ctx.textAlign='right';
            ctx.fillText('✓',20+ow-30,y+oh/2+6);
        }
        ctx.textAlign='left';
    }
    if(G.phase===0){
        drawBtn(ctx,15,H-200,140,52,'💡 提示-30','hint',G.hintUsed?'rgba(150,150,150,0.4)':'#ffe66d','#333',14,G.hintUsed);
        drawBtn(ctx,170,H-200,150,52,'✏️ 手输答案','openInput','#ff6b00','#fff',15);

    } else if(G.phase===2){
        drawBtn(ctx,W/2-95,H-190,190,58,'🔗 接下去 ▶','next','#fff','#2193b0',18);
    }
    drawBtn(ctx,W-60,90,45,32,'⏸','pause','rgba(255,255,255,0.6)','#555');
}

// ==================== 每日挑战系统 ====================
const DAILY_KEY='idiom_daily_v1';
function getDailySeed(){
    const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
}
function getDailyStatus(){
    const today=getDailySeed();
    const prev=parseInt(Storage.load(DAILY_KEY+'_d','0'));
    const best=parseInt(Storage.load(DAILY_KEY+'_b','0'));
    const done=prev===today;
    return {today,best:done?best:0,done};
}
function setDailyDone(score){
    const s=getDailyStatus();
    if(s.today!==parseInt(Storage.load(DAILY_KEY+'_d','0')) || score>s.best){
        Storage.save(DAILY_KEY+'_d',String(s.today));
        Storage.save(DAILY_KEY+'_b',String(score));
    }
}
function seededRand(seed){let t=seed+0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296}

}

<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>

<script>

  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
