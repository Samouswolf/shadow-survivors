<button id="start-game-btn" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:20px 40px;font-size:20px;background:#f093fb;color:white;border:none;border-radius:12px;cursor:pointer;z-index:999;font-weight:bold;">开始游戏</button>

<canvas id="c"></canvas>

<script>
if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
</script>
<script src="../game_core.js"></script>
<script>
(function(){

const W=480,H=720;

    "模仿你最讨厌的明星的招牌动作",
    "背诵一首古诗，要配上夸张的动作",
    "把冰放在衣领里，坚持10秒钟",
    "给大家表演一个魔术，穿帮就算输"
];

const PLAYERS_POOL = [
    "小明", "小红", "阿强", "小美", "大伟", "小丽",
    "阿杰", "小芳", "小龙", "小燕", "阿飞", "小静",
    "阿宝", "小雪", "阿东", "小云"
];

let audioCtx=null;
function initAudio(){
    if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
}
function playTone(freq,dur,type,vol){
    if(!audioCtx)return;
    try{
        const o=audioCtx.createOscillator();
        const g=audioCtx.createGain();
        o.type=type||'sine';
        o.frequency.value=freq;
        g.gain.value=vol||0.15;
        g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
        o.connect(g);g.connect(audioCtx.destination);
        o.start();o.stop(audioCtx.currentTime+dur);
    }catch(e){}
}
function sfxBtn(){playTone(600,0.08,'sine',0.12)}
function sfxCard(){playTone(440,0.15,'triangle',0.15);setTimeout(()=>playTone(660,0.15,'triangle',0.12),80)}
function sfxTruth(){playTone(523,0.1,'sine',0.18);setTimeout(()=>playTone(659,0.1,'sine',0.15),100)}
function sfxDare(){playTone(330,0.15,'sawtooth',0.15);setTimeout(()=>playTone(220,0.2,'sawtooth',0.18),120)}
function sfxWin(){playTone(523,0.1,'sine',0.2);setTimeout(()=>playTone(659,0.1,'sine',0.2),100);setTimeout(()=>playTone(784,0.2,'sine',0.2),200)}
function sfxTick(){playTone(800,0.03,'square',0.08)}

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let scale=1;
function resize(){
    const r=W/H;
    let cw=window.innerWidth,ch=window.innerHeight;
    if(cw/ch>r){ch=cw/r}else{cw=ch*r}
    canvas.width=cw;canvas.height=ch;
    scale=cw/W;
    ctx.setTransform(scale,0,0,scale,0,0);
}
window.addEventListener('resize',resize);
resize();

const G={
    state:STATE_MENU,
    mode:0,
    currentPlayer:'',
    playerIndex:0,
    players:[],
    currentQuestion:'',
    currentType:0,
    questionHistory:[],
    rounds:0,
    maxRounds:20,
    truthCount:0,
    dareCount:0,
    score:0,
    highScore:0,
    btnRects:{},
    cardAnim:0,
    showCard:false,
    particles:[],
    paused:false,
    bgParticles:[],
    selectedOption:-1,
    timer:0,
    timerActive:false,
    resultShown:false,
    spinAngle:0,
    spinning:false,
    spinResult:-1
};

G.highScore=parseInt(Storage.load('truthdare_high','0'));

for(let i=0;i<40;i++){
    G.bgParticles.push({
        x:Math.random()*W,
        y:Math.random()*H,
        r:2+Math.random()*4,
        vx:(Math.random()-0.5)*0.5,
        vy:(Math.random()-0.5)*0.5,
        color:`hsla(${260+Math.random()*60},70%,60%,0.4)`
    });
}

function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
}

function drawBtn(ctx,x,y,w,h,text,name,color,textColor){
    G.btnRects[name]={x:x,y:y,w:w,h:h};
    ctx.fillStyle=color||'#f093fb';
    roundRect(ctx,x,y,w,h,12);
    ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.5)';
    ctx.lineWidth=2;
    roundRect(ctx,x,y,w,h,12);
    ctx.stroke();
    ctx.fillStyle=textColor||'#fff';
    ctx.font='bold 18px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(text,x+w/2,y+h/2);
    ctx.textBaseline='alphabetic';
}

function hitBtn(p,name){
    const r=G.btnRects[name];
    return r && p.x>=r.x && p.x<=r.x+r.w && p.y>=r.y && p.y<=r.y+r.h;
}

function getPos(e){
    const rect=canvas.getBoundingClientRect();
    const t=e.touches?e.touches[0]:e;
    return{x:(t.clientX-rect.left)/scale,y:(t.clientY-rect.top)/scale};
}

function updateBgParticles(){
    for(const p of G.bgParticles){
        p.x+=p.vx;p.y+=p.vy;
        if(p.x<-10)p.x=W+10;if(p.x>W+10)p.x=-10;
        if(p.y<-10)p.y=H+10;if(p.y>H+10)p.y=-10;
    }
}
function drawBgParticles(ctx){
    for(const p of G.bgParticles){
        ctx.fillStyle=p.color;
        ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    }
}

function spawnParticles(x,y,color,count){
    for(let i=0;i<(count||15);i++){
        G.particles.push({
            x:x,y:y,
            vx:(Math.random()-0.5)*10,
            vy:(Math.random()-0.5)*10-3,
            life:50,maxLife:50,
            size:3+Math.random()*4,
            color:color
        });
    }
}
function updateParticles(){
    for(let i=G.particles.length-1;i>=0;i--){
        const p=G.particles[i];
        p.x+=p.vx;p.y+=p.vy;
        p.vy+=0.25;
        p.life--;
        if(p.life<=0) G.particles.splice(i,1);
    }
}
function drawParticles(ctx){
    for(const p of G.particles){
        ctx.globalAlpha=p.life/p.maxLife;
        ctx.fillStyle=p.color;
        ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
}

window.addEventListener('keydown',function(e){
    G.keys=G.keys||{};
    G.keys[e.key.toLowerCase()]=true;
    if(e.key==='Escape'){if(G.state===STATE_PLAYING)togglePause()}
    initAudio();
});
window.addEventListener('keyup',function(e){
    if(G.keys) G.keys[e.key.toLowerCase()]=false;
});

function handlePointerDown(e){
    initAudio();
    const p=getPos(e);
    if(G.state===STATE_MENU){
        if(hitBtn(p,'start')){startGame();return}
        if(hitBtn(p,'players2')){setPlayers(2);return}
        if(hitBtn(p,'players4')){setPlayers(4);return}
        if(hitBtn(p,'players6')){setPlayers(6);return}
        if(hitBtn(p,'players8')){setPlayers(8);return}
        if(hitBtn(p,'rounds10')){G.maxRounds=10;sfxBtn();return}
        if(hitBtn(p,'rounds20')){G.maxRounds=20;sfxBtn();return}
        if(hitBtn(p,'rounds30')){G.maxRounds=30;sfxBtn();return}
    } else if(G.state===STATE_OVER){
        if(hitBtn(p,'restart')){startGame();return}
        if(hitBtn(p,'menu')){G.state=STATE_MENU;return}
    } else if(G.state===STATE_PLAYING && !G.paused){
        if(!G.showCard){
            if(hitBtn(p,'truth')){chooseTruth();return}
            if(hitBtn(p,'dare')){chooseDare();return}
            if(hitBtn(p,'random')){chooseRandom();return}
        } else {
            if(hitBtn(p,'next')){nextTurn();return}
            if(hitBtn(p,'complete')){completeChallenge();return}
            if(hitBtn(p,'skip')){skipChallenge();return}
        }
        if(hitBtn(p,'pause')){togglePause();return}
    }
}
function handlePointerMove(e){}
function handlePointerUp(e){}

canvas.addEventListener('mousedown',handlePointerDown);
canvas.addEventListener('mousemove',handlePointerMove);
canvas.addEventListener('mouseup',handlePointerUp);
canvas.addEventListener('touchstart',function(e){e.preventDefault();handlePointerDown(e)},{passive:false});
canvas.addEventListener('touchmove',function(e){e.preventDefault();handlePointerMove(e)},{passive:false});
canvas.addEventListener('touchend',function(e){e.preventDefault();handlePointerUp(e)},{passive:false});

function setPlayers(n){
    G.players=[];
    for(let i=0;i<n;i++){
        G.players.push(PLAYERS_POOL[i]);
    }
    sfxBtn();
}

function startGame(){
    initAudio();
    if(G.players.length===0) setPlayers(4);
    G.state=STATE_PLAYING;
    G.rounds=0;
    G.score=0;
    G.truthCount=0;
    G.dareCount=0;
    G.questionHistory=[];
    G.currentQuestion='';
    G.showCard=false;
    G.cardAnim=0;
    G.selectedOption=-1;
    G.timerActive=false;
    G.resultShown=false;
    G.playerIndex=Math.floor(Math.random()*G.players.length);
    G.currentPlayer=G.players[G.playerIndex];
    sfxWin();
    spawnParticles(W/2,H/2,'#ffd700',25);
}

function endGame(){
    G.state=STATE_OVER;
    if(G.score>G.highScore){
        G.highScore=G.score;
        Storage.save('truthdare_high',G.highScore);
    }
    sfxWin();
}

function togglePause(){
    G.paused=!G.paused;
    sfxBtn();
}

function chooseTruth(){
    G.currentType=0;
    let idx;
    do{
        idx=Math.floor(Math.random()*TRUTH_QUESTIONS.length);
    }while(G.questionHistory.includes('T'+idx) && G.questionHistory.length<TRUTH_QUESTIONS.length*0.8);
    G.currentQuestion=TRUTH_QUESTIONS[idx];
    G.questionHistory.push('T'+idx);
    G.truthCount++;
    G.showCard=true;
    G.cardAnim=0;
    G.resultShown=false;
    sfxTruth();
    spawnParticles(W/2,300,'#4facfe',20);
}

function chooseDare(){
    G.currentType=1;
    let idx;
    do{
        idx=Math.floor(Math.random()*DARE_CHALLENGES.length);
    }while(G.questionHistory.includes('D'+idx) && G.questionHistory.length<DARE_CHALLENGES.length*0.8);
    G.currentQuestion=DARE_CHALLENGES[idx];
    G.questionHistory.push('D'+idx);
    G.dareCount++;
    G.showCard=true;
    G.cardAnim=0;
    G.resultShown=false;
    sfxDare();
    spawnParticles(W/2,300,'#f5576c',20);
}

function chooseRandom(){
    if(Math.random()<0.5){
        chooseTruth();
    }else{
        chooseDare();
    }
}

function completeChallenge(){
    G.score+=G.currentType===0?10:20;
    G.resultShown=true;
    sfxWin();
    spawnParticles(W/2,H/2,'#ffd700',30);
}

function skipChallenge(){
    G.score=Math.max(0,G.score-5);
    nextTurn();
    sfxBtn();
}

function nextTurn(){
    G.rounds++;
    if(G.rounds>=G.maxRounds){
        endGame();
        return;
    }
    G.playerIndex=(G.playerIndex+1)%G.players.length;
    G.currentPlayer=G.players[G.playerIndex];
    G.showCard=false;
    G.currentQuestion='';
    G.cardAnim=0;
    G.resultShown=false;
    sfxCard();
}

function wrapText(ctx,text,x,y,maxWidth,lineHeight){
    const words=text.split('');
    let line='';
    let lines=[];
    for(let i=0;i<words.length;i++){
        const testLine=line+words[i];
        const metrics=ctx.measureText(testLine);
        if(metrics.width>maxWidth && i>0){
            lines.push(line);
            line=words[i];
        }else{
            line=testLine;
        }
    }
    lines.push(line);
    for(let i=0;i<lines.length;i++){
        ctx.fillText(lines[i],x,y+i*lineHeight);
    }
    return lines.length;
}

function update(){
    updateBgParticles();
    updateParticles();
    if(G.state!==STATE_PLAYING||G.paused) return;
    if(G.showCard && G.cardAnim<1){
        G.cardAnim+=0.05;
    }
    if(G.timerActive){
        G.timer--;
        if(G.timer<=0){
            G.timerActive=false;
        }
    }
}

function drawBackground(ctx){
    const grad=ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,'#667eea');
    grad.addColorStop(1,'#764ba2');
    ctx.fillStyle=grad;

function drawPlayerBubble(ctx,x,y,name,isActive,idx){
    const colors=['#f093fb','#4facfe','#43e97b','#fa709a','#fee140','#30cfd0','#a8edea','#ff9a9e'];
    const color=colors[idx%colors.length];
    ctx.fillStyle=isActive?color:'rgba(255,255,255,0.2)';
    ctx.beginPath();ctx.arc(x,y,28,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=isActive?'#ffd700':'rgba(255,255,255,0.4)';
    ctx.lineWidth=isActive?4:2;
    ctx.beginPath();ctx.arc(x,y,28,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle=isActive?'#fff':'rgba(255,255,255,0.7)';
    ctx.font='bold 14px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(name,x,y);
    ctx.textBaseline='alphabetic';ctx.textAlign='left';
}

function drawCard(ctx){
    if(!G.showCard) return;
    const anim=Math.min(1,G.cardAnim);
    const cardW=380,cardH=340;
    const cx=W/2,cy=300;
    const scaleY=Math.sin(anim*Math.PI/2);
    ctx.save();
    ctx.translate(cx,cy);
    ctx.scale(1,scaleY);
    const color=G.currentType===0?'#4facfe':'#f5576c';
    const color2=G.currentType===0?'#00f2fe':'#f093fb';
    const grad=ctx.createLinearGradient(-cardW/2,-cardH/2,cardW/2,cardH/2);
    grad.addColorStop(0,color);
    grad.addColorStop(1,color2);
    ctx.fillStyle='rgba(0,0,0,0.2)';
    roundRect(ctx,-cardW/2+5,-cardH/2+5,cardW,cardH,20);
    ctx.fill();
    ctx.fillStyle=grad;
    roundRect(ctx,-cardW/2,-cardH/2,cardW,cardH,20);
    ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.6)';
    ctx.lineWidth=3;
    roundRect(ctx,-cardW/2,-cardH/2,cardW,cardH,20);
    ctx.stroke();
    ctx.fillStyle='#fff';
    ctx.font='bold 36px "Microsoft YaHei"';
    ctx.textAlign='center';
    const label=G.currentType===0?'💬 真心话':'🔥 大冒险';
    ctx.fillText(label,0,-cardH/2+55);
    ctx.strokeStyle='rgba(255,255,255,0.5)';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(-cardW/2+40,-cardH/2+80);
    ctx.lineTo(cardW/2-40,-cardH/2+80);
    ctx.stroke();
    if(anim>=0.8){
        ctx.fillStyle='#fff';
        ctx.font='bold 20px "Microsoft YaHei"';
        ctx.textAlign='center';
        const lines=wrapText(ctx,G.currentQuestion,0,-10,cardW-60,34);
    }
    if(G.resultShown){
        ctx.fillStyle='rgba(255,215,0,0.95)';
        roundRect(ctx,-100,cardH/2-80,200,50,25);
        ctx.fill();
        ctx.fillStyle='#fff';
        ctx.font='bold 24px "Microsoft YaHei"';
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText('✓ 完成！+'+(G.currentType===0?10:20)+'分',0,cardH/2-55);
        ctx.textBaseline='alphabetic';
    }
    ctx.textAlign='left';
    ctx.restore();
}

    switch(G.state){

}

const origPointerDown=typeof handlePointerDown==='function'?handlePointerDown:function(){};
function hitBtn2(p,name){
    const r=G.btnRects[name];if(!r||r.disabled)return false;
    return p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;
}
function handlePointerDown2(e){
    const p=typeof getPos==='function'?getPos(e):{x:0,y:0};
    const st=G.state;
    if(st===STATE_MENU){
        if(hitBtn2(p,'openSettings')){G.state=STATE_SETTINGS;return}
        if(hitBtn2(p,'openAch')){G.state=STATE_ACHIEVEMENTS;return}
        if(hitBtn2(p,'openStats')){G.state=STATE_STATS;return}
        if(hitBtn2(p,'openHelp')){G.state=STATE_HELP;return}
    } else if(st===STATE_SETTINGS||st===STATE_ACHIEVEMENTS||st===STATE_HELP||st===STATE_STATS){
        if(hitBtn2(p,'closeSub')||hitBtn2(p,'backMain')){G.state=STATE_MENU;return}
        if(st===STATE_SETTINGS){
            if(hitBtn2(p,'set_soundOn')){SETTINGS.soundOn=!SETTINGS.soundOn;saveSettings();return}
            if(hitBtn2(p,'set_vibOn')){SETTINGS.vibOn=!SETTINGS.vibOn;saveSettings();return}
            if(hitBtn2(p,'set_showTimer')){SETTINGS.showTimer=!SETTINGS.showTimer;saveSettings();return}
            if(hitBtn2(p,'resetData')){
                if(confirm('确定清除所有存档、统计和成就吗？无法恢复！')){
                    for(const k of ['_g','_c','_w','_bc','_h','_bs','_unlock'])Storage.remove(SK+k);
                    STAT.totalGames=0;STAT.totalCorrect=0;STAT.totalWrong=0;STAT.bestCombo=0;
                    STAT.totalHintUsed=0;STAT.bestScore=0;STAT.unlocked=[];
                    for(const a of ACHIEVEMENTS)a.unlocked=false;if(G)G.highScore=0;saveStat();
                }
                return;
            }
            for(let i=0;i<THEMES.length;i++){
                if(hitBtn2(p,'theme_'+i)){SETTINGS.theme=i;saveSettings();applyTheme();return}
            }
        }
    }
    return origPointerDown(e);
}
if(typeof canvas!=='undefined'){

const LV_XP_TABLE=[0,50,120,220,360,550,800,1150,1600,2200,3000,4000,5500,7500,10000,14000,20000];
const LV_KEY='tod_lv_v1';
let LV={level:parseInt(Storage.load(LV_KEY+'_l','1')),xp:parseInt(Storage.load(LV_KEY+'_x','0'))};
function saveLv(){Storage.save(LV_KEY+'_l',LV.level);Storage.save(LV_KEY+'_x',LV.xp);}
function addXp(amt){
    LV.xp+=amt;
    while(LV.level<LV_XP_TABLE.length-1 && LV.xp>=LV_XP_TABLE[LV.level]){
        LV.xp-=LV_XP_TABLE[LV.level];LV.level++;
        if(typeof addFloat==='function')addFloat(W/2,H/2,'升级！Lv.'+LV.level,'#ffd700');
        if(typeof spawnParticles==='function')spawnParticles(W/2,H/2,'#ffd700',60);
    }
    saveLv();
}
function getLvProgress(){
    const cur=LV_XP_TABLE[Math.min(LV.level,LV_XP_TABLE.length-1)]||1;
    return Math.min(1,LV.xp/cur);
}
function drawLevelBadge(ctx,x,y,size){
    const rad=size/2;
    ctx.save();ctx.translate(x,y);
    const g=ctx.createRadialGradient(0,0,2,0,0,rad);
    g.addColorStop(0,'#fff176');g.addColorStop(0.6,'#ffd700');g.addColorStop(1,'#ff8f00');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,rad,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#b26a00';ctx.lineWidth=size/18;ctx.stroke();
    ctx.fillStyle='#5d2f00';ctx.font='bold '+Math.floor(rad*0.9)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(String(LV.level),0,2);
    ctx.restore();
}

const LB_KEY='tod_lb_v1';

// ==================== 每日挑战系统 ====================
const DAILY_KEY='tod_daily_v1';
function getDailySeed(){
    const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
}
function getDailyStatus(){
    const today=getDailySeed();
    const prev=parseInt(Storage.load(DAILY_KEY+'_d','0'));
    const best=parseInt(Storage.load(DAILY_KEY+'_b','0'));
    const done=prev===today;
    return {today,best:done?best:0,done};
}
function setDailyDone(score){
    const s=getDailyStatus();
    if(s.today!==parseInt(Storage.load(DAILY_KEY+'_d','0')) || score>s.best){
        Storage.save(DAILY_KEY+'_d',String(s.today));
        Storage.save(DAILY_KEY+'_b',String(score));
    }
}
function seededRand(seed){let t=seed+0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296}

function checkSpeedAchieve(t){if(t&&t<10)unlockAchieve('speed')}

function checkTryhardAchieve(){
    const KEY='tod_streak_v1';
    const today=new Date().toDateString();
    const rec=JSON.parse(Storage.load(KEY,'{"last":"","days":0}'));
    if(rec.last!==today){
        const y=new Date(Date.now()-86400000).toDateString();
        if(rec.last===y)rec.days++;else rec.days=1;
        rec.last=today;Storage.save(KEY,JSON.stringify(rec));
    }
    if(rec.days>=3)unlockAchieve('tryhard');
}

const TRAILS=[];
function addTrail(x,y,color){TRAILS.push({x,y,color,life:1})}
function updateTrails(){for(let i=TRAILS.length-1;i>=0;i--){const t=TRAILS[i];t.life-=0.03;t.y+=0.6;if(t.life<=0)TRAILS.splice(i,1)}}
function drawTrails(ctx){
    for(const t of TRAILS){ctx.globalAlpha=t.life*0.7;ctx.fillStyle=t.color;ctx.beginPath();ctx.arc(t.x,t.y,4*t.life+1,0,Math.PI*2);ctx.fill()}
    ctx.globalAlpha=1;
}

    ctx.font='13px "Microsoft YaHei"';ctx.fillText('直接返回主菜单，使用正常开始按钮即可完成当日挑战',W/2,y+212);
    if(typeof drawBtn==='function')drawBtn(ctx,W/2-70,H-120,140,42,'返回菜单','backMain','#9c27b0','#fff',16);
    ctx.textAlign='left';
}
const _origDrawEx2=typeof drawEx==='function'?drawEx:(typeof draw==='function'?draw:function(){});
function drawEx2(){
    switch(G.state){
        case STATE_LEADERBOARD:drawLeaderboardPage(ctx);break;
        case STATE_DAILY:drawDailyChallengePage(ctx);break;
        case STATE_MENU:drawMenuExtended2(ctx);break;
        default:_origDrawEx2();
    }
}
// 点击钩子扩展
const _origPD2=typeof handlePointerDown2==='function'?handlePointerDown2:(typeof handlePointerDown==='function'?handlePointerDown:function(){});
function handlePointerDown3(e){
    const p=typeof getPos==='function'?getPos(e):{x:0,y:0};
    const st=G.state;
    if(st===STATE_MENU){
        if(hitBtn2(p,'lbBtn')){G.state=STATE_LEADERBOARD;return}
        if(hitBtn2(p,'dailyBtn')){G.state=STATE_DAILY;return}
    } else if(st===STATE_LEADERBOARD||st===STATE_DAILY){
        if(hitBtn2(p,'closeSub')||hitBtn2(p,'backMain')){G.state=STATE_MENU;return}
    }
    return _origPD2(e);
}
if(typeof canvas!=='undefined'){
    canvas.addEventListener('mousedown',handlePointerDown3);
    canvas.addEventListener('touchstart',function(e){e.preventDefault();handlePointerDown3(e)},{passive:false});
}
window.cancelAnimationFrame(window.__raf3||0);
(function loop3(){window.__raf3=requestAnimationFrame(loop3);if(typeof update==='function')update();drawEx2()})();

// 自动保存排行榜（在结束时）
const _origUAAG=typeof updateAchievementsAfterGame==='function'?updateAchievementsAfterGame:function(){};
if(typeof window!=='undefined'){
    window['tod_postGame']=function(score){
        _origUAAG();
        addToLeaderboard(score,'玩家'+LV.level);
        addXp(50+Math.floor(score/20));
        setDailyDone(score);
    }
}

applyTheme();
})();
</script>

  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>
