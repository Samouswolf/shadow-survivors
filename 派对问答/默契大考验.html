let audioCtx=null;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
function playTone(freq,dur,type,vol){
    if(!audioCtx)return;
    try{
        const o=audioCtx.createOscillator(),g=audioCtx.createGain();
        o.type=type||'sine';o.frequency.value=freq;g.gain.value=vol||0.15;
        g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
        o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur);
    }catch(e){}
}
function sfxBtn(){playTone(600,0.08,'sine',0.12)}
function sfxMatch(){playTone(523,0.1,'sine',0.2);setTimeout(()=>playTone(659,0.1,'sine',0.2),100);setTimeout(()=>playTone(784,0.15,'sine',0.2),200)}
function sfxMiss(){playTone(300,0.1,'sawtooth',0.15);setTimeout(()=>playTone(200,0.15,'sawtooth',0.12),100)}
function sfxWin(){playTone(523,0.1,'sine',0.2);setTimeout(()=>playTone(659,0.1,'sine',0.2),100);setTimeout(()=>playTone(784,0.15,'sine',0.2),200);setTimeout(()=>playTone(1046,0.3,'sine',0.2),350)}
function sfxTick(){playTone(900,0.03,'square',0.08)}

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let scale=1;
function resize(){
    const r=W/H;let cw=window.innerWidth,ch=window.innerHeight;
    if(cw/ch>r){ch=cw/r}else{cw=ch*r}
    canvas.width=cw;canvas.height=ch;scale=cw/W;
    ctx.setTransform(scale,0,0,scale,0,0);
}
window.addEventListener('resize',resize);resize();

const G={
    state:STATE_MENU,
    players:2,
    curPlayer:1,
    p1Selections:[],p2Selections:[],
    current:null,
    qIdx:0,total:10,
    p1Score:0,p2Score:0,matchScore:0,
    highScore:0,
    matches:0,partials:0,misses:0,
    phase:0,
    timeLeft:0,selectTime:25,
    btnRects:{},
    particles:[],
    paused:false,
    floatMsgs:[],
    hearts:[],
    sparkles:[],
    p1Name:'玩家A',p2Name:'玩家B',
    resultP1:null,resultP2:null,
    matchAnim:0
};
G.highScore=parseInt(Storage.load('tacit_high','0'));

for(let i=0;i<20;i++){
    G.hearts.push({
        x:Math.random()*W,y:H+Math.random()*H,
        s:10+Math.random()*18,vy:-0.5-Math.random()*0.8,
        vx:(Math.random()-0.5)*0.3,r:Math.random()*Math.PI,vr:(Math.random()-0.5)*0.02,
        a:0.12+Math.random()*0.15,h:340+Math.random()*60
    });
}
for(let i=0;i<30;i++){
    G.sparkles.push({x:Math.random()*W,y:Math.random()*H,life:Math.random()*100,
        max:60+Math.random()*60,s:1+Math.random()*3,vx:0,vy:-0.2-Math.random()*0.3});
}

function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

function drawHeart(ctx,x,y,s,fill){
    ctx.save();ctx.translate(x,y);
    ctx.fillStyle=fill||'#ff6b9d';
    ctx.beginPath();
    ctx.moveTo(0,s/4);
    ctx.bezierCurveTo(0,0,-s/2,0,-s/2,s/4);
    ctx.bezierCurveTo(-s/2,s/2,0,s*0.7,0,s*0.9);
    ctx.bezierCurveTo(0,s*0.7,s/2,s/2,s/2,s/4);
    ctx.bezierCurveTo(s/2,0,0,0,0,s/4);
    ctx.fill();
    ctx.restore();
}

function drawBtn(ctx,x,y,w,h,text,name,color,textColor,fontSize,disabled){
    G.btnRects[name]={x:x,y:y,w:w,h:h,disabled:disabled};
    ctx.fillStyle=disabled?'rgba(150,150,150,0.4)':(color||'#ff6b9d');
    roundRect(ctx,x,y,w,h,12);ctx.fill();
    ctx.strokeStyle=disabled?'rgba(255,255,255,0.2)':'rgba(255,255,255,0.6)';
    ctx.lineWidth=2;roundRect(ctx,x,y,w,h,12);ctx.stroke();
    ctx.fillStyle=disabled?'#bbb':(textColor||'#fff');
    ctx.font='bold '+(fontSize||16)+'px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(text,x+w/2,y+h/2);ctx.textBaseline='alphabetic';
}
function hitBtn(p,name){
    const r=G.btnRects[name];
    return r && !r.disabled && p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;
}
function getPos(e){
    const rect=canvas.getBoundingClientRect();
    const t=e.touches?e.touches[0]:e;
    return{x:(t.clientX-rect.left)/scale,y:(t.clientY-rect.top)/scale};
}

function updateHearts(){
    for(const h of G.hearts){
        h.y+=h.vy;h.x+=h.vx;h.r+=h.vr;
        if(h.y+h.s<0){h.y=H+h.s;h.x=Math.random()*W}
    }
    for(let i=G.sparkles.length-1;i>=0;i--){
        const s=G.sparkles[i];s.life++;s.y+=s.vy;
        if(s.life>s.max||s.y<0){s.life=0;s.y=H;s.x=Math.random()*W}
    }
}
function drawHearts(ctx){
    for(const h of G.hearts){
        ctx.save();ctx.translate(h.x,h.y);ctx.rotate(h.r);ctx.globalAlpha=h.a;
        drawHeart(ctx,0,0,h.s,`hsl(${h.h},75%,70%)`);
        ctx.restore();
    }
    for(const s of G.sparkles){
        const a=s.life/s.max;
        ctx.globalAlpha=a*(1-a)*4;
        ctx.fillStyle='#fff';
        ctx.fillRect(s.x-s.s/2,s.y,s.s,s.s);
    }
    ctx.globalAlpha=1;
}

function spawnParticles(x,y,color,count){
    for(let i=0;i<(count||15);i++){
        G.particles.push({x:x,y:y,vx:(Math.random()-0.5)*10,vy:(Math.random()-0.5)*10-3,
            life:50,maxLife:50,size:3+Math.random()*4,color:color});
    }
}
function updateParticles(){
    for(let i=G.particles.length-1;i>=0;i--){
        const p=G.particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.25;p.life--;
        if(p.life<=0)G.particles.splice(i,1);
    }
}
function drawParticles(ctx){
    for(const p of G.particles){
        ctx.globalAlpha=p.life/p.maxLife;
        ctx.fillStyle=p.color;
        ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
}
function addFloat(x,y,text,color){
    G.floatMsgs.push({x:x,y:y,text:text,color:color||'#fff',life:50,vy:-1.2});
}
function updateFloat(){
    for(let i=G.floatMsgs.length-1;i>=0;i--){
        const f=G.floatMsgs[i];f.y+=f.vy;f.life--;
        if(f.life<=0)G.floatMsgs.splice(i,1);
    }
}
function drawFloat(ctx){
    for(const f of G.floatMsgs){
        ctx.globalAlpha=f.life/50;
        ctx.fillStyle=f.color;
        ctx.font='bold 18px "Microsoft YaHei"';
        ctx.textAlign='center';ctx.fillText(f.text,f.x,f.y);
    }
    ctx.globalAlpha=1;ctx.textAlign='left';
}

window.addEventListener('keydown',function(e){
    G.keys=G.keys||{};G.keys[e.key.toLowerCase()]=true;
    if(e.key==='Escape'){if(G.state===STATE_PLAYING)togglePause()}
    initAudio();
});
window.addEventListener('keyup',function(e){if(G.keys)G.keys[e.key.toLowerCase()]=false});

function handlePointerDown(e){
    initAudio();
    const p=getPos(e);
    if(G.state===STATE_MENU){
        if(hitBtn(p,'start')){startGame();return}
        if(hitBtn(p,'q5')){G.total=5;sfxBtn();return}
        if(hitBtn(p,'q10')){G.total=10;sfxBtn();return}
        if(hitBtn(p,'q20')){G.total=20;sfxBtn();return}
    } else if(G.state===STATE_OVER){
        if(hitBtn(p,'restart')){startGame();return}
        if(hitBtn(p,'menu')){G.state=STATE_MENU;return}
    } else if(G.state===STATE_PLAYING&&!G.paused){
        if(hitBtn(p,'pause')){togglePause();return}
        if(G.phase===0||G.phase===1){
            const opts=G.current.opts;
            for(let i=0;i<opts.length;i++){
                if(hitBtn(p,'opt'+i)){selectOpt(i);return}
            }
            if(hitBtn(p,'confirm')){confirmSelection();return}
        } else if(G.phase===2){
            if(hitBtn(p,'nextQ')){nextQuestion();return}
        }
    }
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let qPool=[];
function pickQuestion(){
    if(qPool.length<5)qPool=shuffle([...QUESTIONS]);
    G.current=qPool.pop();
}

function startGame(){
    initAudio();
    G.state=STATE_PLAYING;
    G.p1Score=0;G.p2Score=0;G.matchScore=0;
    G.matches=0;G.partials=0;G.misses=0;
    G.qIdx=0;G.curPlayer=1;G.matchAnim=0;
    G.p1Selections=[];G.p2Selections=[];
    qPool=shuffle([...QUESTIONS]);
    nextQuestion();
    sfxWin();spawnParticles(W/2,H/2,'#ff6b9d',30);
}
function endGame(){
    G.state=STATE_OVER;
    if(G.matchScore>G.highScore){G.highScore=G.matchScore;Storage.save('tacit_high',G.highScore)}
    sfxWin();
}
function togglePause(){G.paused=!G.paused;sfxBtn()}

function nextQuestion(){
    G.qIdx++;
    if(G.qIdx>G.total){endGame();return}
    pickQuestion();
    G.phase=0;G.curPlayer=1;
    G.p1Selections=[];G.p2Selections=[];
    G.resultP1=null;G.resultP2=null;
    G.timeLeft=G.selectTime*60;
    sfxBtn();
}

function selectOpt(i){
    const cur=G.curPlayer===1?G.p1Selections:G.p2Selections;
    const idx=cur.indexOf(i);
    if(G.current.type==="单选"){
        if(idx>=0){cur.splice(idx,1)}
        else{cur.length=0;cur.push(i)}
    } else {
        if(idx>=0){cur.splice(idx,1)}
        else if(cur.length<4)cur.push(i);
        else{addFloat(W/2,130,'最多选4个哦','#fff');sfxMiss();return}
    }
    sfxBtn();
}

function confirmSelection(){
    const cur=G.curPlayer===1?G.p1Selections:G.p2Selections;
    if(cur.length===0){addFloat(W/2,130,'至少选择一个！','#ff6b9d');sfxMiss();return}
    if(G.curPlayer===1){
        G.resultP1=[...cur];
        G.curPlayer=2;G.phase=1;
        G.timeLeft=G.selectTime*60;
        sfxBtn();
        addFloat(W/2,120,'👤 轮到 '+G.p2Name+' 选择！','#4ecdc4');
    } else {
        G.resultP2=[...cur];
        G.phase=2;G.matchAnim=1;
        calcMatch();
    }
}

function calcMatch(){
    const a=G.resultP1,b=G.resultP2;
    let common=0;
    for(const ai of a){if(b.includes(ai))common++}
    const maxLen=Math.max(a.length,b.length,1);
    const ratio=common/maxLen;
    if(ratio>=1){
        G.matches++;G.p1Score+=100;G.p2Score+=100;G.matchScore+=100;
        sfxMatch();addFloat(W/2,350,'💯 完美默契！+100','#ffd700');
        spawnParticles(W/2,350,'#ffd700',35);
    } else if(ratio>=0.5){
        G.partials++;G.p1Score+=60;G.p2Score+=60;G.matchScore+=60;
        sfxMatch();addFloat(W/2,350,'💕 不错！+60 共同选择 '+common+' 个','#ff6b9d');
        spawnParticles(W/2,350,'#ff6b9d',20);
    } else if(common>0){
        G.partials++;G.p1Score+=30;G.p2Score+=30;G.matchScore+=30;
        addFloat(W/2,350,'🤝 有点默契 +30','#a18cd1');
        spawnParticles(W/2,350,'#a18cd1',12);
    } else {
        G.misses++;
        sfxMiss();addFloat(W/2,350,'💔 完全不同 各自安好','#888');
    }
}

function update(){
    updateHearts();updateParticles();updateFloat();
    if(G.state!==STATE_PLAYING||G.paused)return;
    if((G.phase===0||G.phase===1)&&G.timeLeft>0){
        G.timeLeft--;
        if(G.timeLeft<=0){
            const cur=G.curPlayer===1?G.p1Selections:G.p2Selections;
            if(cur.length===0)cur.push(Math.floor(Math.random()*G.current.opts.length));
            confirmSelection();
        }
        if(G.timeLeft===300||G.timeLeft===180||G.timeLeft===60)sfxTick();
    }
    if(G.matchAnim>0){G.matchAnim+=0.04;if(G.matchAnim>2)G.matchAnim=0}
}

        const inP1=G.resultP1&&G.resultP1.includes(i);

function hitBtn2(p,name){
    const r=G.btnRects[name];if(!r||r.disabled)return false;
    return p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;
}
function handlePointerDown2(e){
    const p=typeof getPos==='function'?getPos(e):{x:0,y:0};
    const st=G.state;
    if(st===STATE_MENU){
        if(hitBtn2(p,'openSettings')){G.state=STATE_SETTINGS;return}
        if(hitBtn2(p,'openAch')){G.state=STATE_ACHIEVEMENTS;return}
        if(hitBtn2(p,'openStats')){G.state=STATE_STATS;return}
        if(hitBtn2(p,'openHelp')){G.state=STATE_HELP;return}
    } else if(st===STATE_SETTINGS||st===STATE_ACHIEVEMENTS||st===STATE_HELP||st===STATE_STATS){
        if(hitBtn2(p,'closeSub')||hitBtn2(p,'backMain')){G.state=STATE_MENU;return}
        if(st===STATE_SETTINGS){
            if(hitBtn2(p,'set_soundOn')){SETTINGS.soundOn=!SETTINGS.soundOn;saveSettings();return}
            if(hitBtn2(p,'set_vibOn')){SETTINGS.vibOn=!SETTINGS.vibOn;saveSettings();return}
            if(hitBtn2(p,'set_showTimer')){SETTINGS.showTimer=!SETTINGS.showTimer;saveSettings();return}
            if(hitBtn2(p,'resetData')){
                if(confirm('确定清除所有存档、统计和成就吗？无法恢复！')){
                    for(const k of ['_g','_c','_w','_bc','_h','_bs','_unlock'])Storage.remove(SK+k);
                    STAT.totalGames=0;STAT.totalCorrect=0;STAT.totalWrong=0;STAT.bestCombo=0;
                    STAT.totalHintUsed=0;STAT.bestScore=0;STAT.unlocked=[];
                    for(const a of ACHIEVEMENTS)a.unlocked=false;if(G)G.highScore=0;saveStat();
                }
                return;
            }
            for(let i=0;i<THEMES.length;i++){
                if(hitBtn2(p,'theme_'+i)){SETTINGS.theme=i;saveSettings();applyTheme();return}
            }
        }
    }
    return origPointerDown(e);
}

        case STATE_MENU:drawMenuEx(ctx);break;
        default:origDraw();
    }
}
window.cancelAnimationFrame(window.__raf||0);
(function loop2(){window.__raf=requestAnimationFrame(loop2);if(typeof update==='function')update();drawEx()})();

// ==================== LV/EXP 等级系统 ====================
const LV_XP_TABLE=[0,50,120,220,360,550,800,1150,1600,2200,3000,4000,5500,7500,10000,14000,20000];
const LV_KEY='match_lv_v1';
let LV={level:parseInt(Storage.load(LV_KEY+'_l','1')),xp:parseInt(Storage.load(LV_KEY+'_x','0'))};
function saveLv(){Storage.save(LV_KEY+'_l',LV.level);Storage.save(LV_KEY+'_x',LV.xp);}
function addXp(amt){
    LV.xp+=amt;
    while(LV.level<LV_XP_TABLE.length-1 && LV.xp>=LV_XP_TABLE[LV.level]){
        LV.xp-=LV_XP_TABLE[LV.level];LV.level++;
        if(typeof addFloat==='function')addFloat(W/2,H/2,'升级！Lv.'+LV.level,'#ffd700');
        if(typeof spawnParticles==='function')spawnParticles(W/2,H/2,'#ffd700',60);
    }
    saveLv();
}
function getLvProgress(){
    const cur=LV_XP_TABLE[Math.min(LV.level,LV_XP_TABLE.length-1)]||1;
    return Math.min(1,LV.xp/cur);
}
function drawLevelBadge(ctx,x,y,size){
    const rad=size/2;
    ctx.save();ctx.translate(x,y);
    const g=ctx.createRadialGradient(0,0,2,0,0,rad);
    g.addColorStop(0,'#fff176');g.addColorStop(0.6,'#ffd700');g.addColorStop(1,'#ff8f00');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,rad,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#b26a00';ctx.lineWidth=size/18;ctx.stroke();
    ctx.fillStyle='#5d2f00';ctx.font='bold '+Math.floor(rad*0.9)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(String(LV.level),0,2);
    ctx.restore();
}

// ==================== 本地排行榜 ====================
const LB_KEY='match_lb_v1';
function loadLeaderboard(){try{return JSON.parse(Storage.load(LB_KEY,'[]'))||[]}catch(e){return []}}
function saveLeaderboard(lb){Storage.save(LB_KEY,JSON.stringify(lb))}
function addToLeaderboard(score,name){
    const lb=loadLeaderboard();
    lb.push({score,name:name||'玩家',date:new Date().toLocaleDateString()});
    lb.sort((a,b)=>b.score-a.score);
    saveLeaderboard(lb.slice(0,10));
}
function drawLeaderboard(ctx,lb,x,y,w,h,accent){
    if(!lb)lb=loadLeaderboard();
    ctx.save();
    ctx.fillStyle='rgba(255,255,255,0.95)';
    if(typeof roundRect==='function'){roundRect(ctx,x,y,w,h,14);ctx.fill();}
    ctx.strokeStyle=accent;ctx.lineWidth=3;
    if(typeof roundRect==='function'){roundRect(ctx,x,y,w,h,14);ctx.stroke();}
    ctx.fillStyle=accent;ctx.font='bold 16px "Microsoft YaHei"';ctx.textAlign='center';
    ctx.fillText('🏆 排行榜 TOP 10',x+w/2,y+24);
    for(let i=0;i<Math.min(10,lb.length);i++){
        const yy=y+48+i*26;
        const medals=['🥇','🥈','🥉'];
        const pre=i<3?medals[i]:('  '+(i+1)+' ');
        ctx.font='13px "Microsoft YaHei"';ctx.textAlign='left';ctx.fillStyle='#333';
        ctx.fillText(pre,x+14,yy);
        ctx.fillStyle=i<3?'#c62828':'#333';ctx.font='bold 13px Arial';ctx.textAlign='right';
        ctx.fillText(String(lb[i].score),x+w-70,yy);
        ctx.fillStyle='#888';ctx.font='11px Arial';ctx.textAlign='right';
        ctx.fillText(lb[i].date||'',x+w-14,yy);
    }
    if(lb.length===0){ctx.fillStyle='#999';ctx.font='13px "Microsoft YaHei"';ctx.textAlign='center';ctx.fillText('暂无记录，快去挑战吧！',x+w/2,y+h/2);}
    ctx.restore();
}

// ==================== 每日挑战系统 ====================
const DAILY_KEY='match_daily_v1';
function getDailySeed(){
    const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
}
function getDailyStatus(){
    const today=getDailySeed();
    const prev=parseInt(Storage.load(DAILY_KEY+'_d','0'));
    const best=parseInt(Storage.load(DAILY_KEY+'_b','0'));
    const done=prev===today;
    return {today,best:done?best:0,done};
}
function setDailyDone(score){
    const s=getDailyStatus();
    if(s.today!==parseInt(Storage.load(DAILY_KEY+'_d','0')) || score>s.best){
        Storage.save(DAILY_KEY+'_d',String(s.today));
        Storage.save(DAILY_KEY+'_b',String(score));
    }
}
function seededRand(seed){let t=seed+0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296}

// ==================== 更多成就钩子 ====================
function checkSpeedAchieve(t){if(t&&t<10)unlockAchieve('speed')}
function checkPartyAchieve(players){if(players&&players>=5)unlockAchieve('party1')}
function checkTryhardAchieve(){
    const KEY='match_streak_v1';
    const today=new Date().toDateString();
    const rec=JSON.parse(Storage.load(KEY,'{"last":"","days":0}'));
    if(rec.last!==today){
        const y=new Date(Date.now()-86400000).toDateString();
        if(rec.last===y)rec.days++;else rec.days=1;
        rec.last=today;Storage.save(KEY,JSON.stringify(rec));
    }
    if(rec.days>=3)unlockAchieve('tryhard');
}

// ==================== 更丰富的动画粒子系统 ====================
const TRAILS=[];
function addTrail(x,y,color){TRAILS.push({x,y,color,life:1})}
function updateTrails(){for(let i=TRAILS.length-1;i>=0;i--){const t=TRAILS[i];t.life-=0.03;t.y+=0.6;if(t.life<=0)TRAILS.splice(i,1)}}
function drawTrails(ctx){
    for(const t of TRAILS){ctx.globalAlpha=t.life*0.7;ctx.fillStyle=t.color;ctx.beginPath();ctx.arc(t.x,t.y,4*t.life+1,0,Math.PI*2);ctx.fill()}
    ctx.globalAlpha=1;
}

// ==================== 更多菜单内容 ====================
const _oldDrawMenuEx=typeof drawMenuEx==='function'?drawMenuEx:(typeof drawMenu==='function'?drawMenu:function(){});
function drawMenuExtended2(ctx){
    _oldDrawMenuEx(ctx);
    // 等级徽章
    drawLevelBadge(ctx,42,108,42);
    ctx.fillStyle='#fff';ctx.font='bold 12px "Microsoft YaHei"';ctx.textAlign='left';
    ctx.fillText('Lv.'+LV.level,70,102);
    // 经验条
    ctx.fillStyle='rgba(0,0,0,0.25)';
    if(typeof roundRect==='function')roundRect(ctx,70,110,130,10,5);ctx.fill();
    const pg=getLvProgress();
    ctx.fillStyle='#ffd700';
    if(typeof roundRect==='function')roundRect(ctx,70,110,130*pg,10,5);ctx.fill();
    // 每日挑战
    const ds=getDailyStatus();
    if(typeof drawBtn==='function'){
        drawBtn(ctx,W-140,90,125,38,ds.done?('✓ 今日最佳:'+ds.best):'🌟 每日挑战','dailyBtn',ds.done?'#bdbdbd':'#ff9800','#fff',13);
    }
    // 排行榜按钮
    if(typeof drawBtn==='function'){
        drawBtn(ctx,W-140,136,125,34,'🏆 排行榜','lbBtn','rgba(255,255,255,0.8)','#333',13);
    }
    checkTryhardAchieve();
    updateTrails();
    drawTrails(ctx);
}
// 排行榜模态状态
const STATE_LEADERBOARD=105;
const STATE_DAILY=106;
function drawLeaderboardPage(ctx){
    drawBackground(ctx);drawSubPageBackdrop(ctx,'🏆 本地排行榜 TOP 10');
    drawLeaderboard(ctx,null,35,155,W-70,H-290,THEMES[SETTINGS.theme%THEMES.length].accent);
    if(typeof drawBtn==='function')drawBtn(ctx,W/2-70,H-120,140,42,'返回菜单','backMain','#9c27b0','#fff',16);
}
function drawDailyChallengePage(ctx){
    drawBackground(ctx);drawSubPageBackdrop(ctx,'🌟 每日挑战');
    const ds=getDailyStatus();
    const y=170;
    ctx.fillStyle='#333';ctx.textAlign='center';
    ctx.font='bold 20px "Microsoft YaHei"';ctx.fillText('挑战日期：'+String(ds.today).slice(0,4)+'/'+String(ds.today).slice(4,6)+'/'+String(ds.today).slice(6,8),W/2,y);
    ctx.font='bold 16px "Microsoft YaHei"';ctx.fillStyle=ds.done?'#4caf50':'#ff5722';
    ctx.fillText(ds.done?'✓ 今日已完成，最佳：'+ds.best:'今日挑战进行中！完成后奖励双倍经验！',W/2,y+40);
    ctx.font='14px "Microsoft YaHei"';ctx.fillStyle='#666';
    ctx.fillText('每日0点自动刷新，使用当日种子题目，记录每日最佳',W/2,y+75);
    ctx.fillText('奖励：完成每日挑战额外奖励500 XP',W/2,y+100);
    ctx.fillText('历史最佳排行榜可在主菜单查看',W/2,y+125);
    // 双倍加成说明
    ctx.fillStyle='rgba(255,152,0,0.08)';
    if(typeof roundRect==='function'){roundRect(ctx,50,y+155,W-100,80,12);ctx.fill();
    ctx.strokeStyle='rgba(255,152,0,0.4)';ctx.lineWidth=2;roundRect(ctx,50,y+155,W-100,80,12);ctx.stroke();}
    ctx.fillStyle='#e65100';ctx.font='bold 15px "Microsoft YaHei"';
    ctx.fillText('🎁 完成今日挑战 = 500 XP额外奖励',W/2,y+188);
    ctx.font='13px "Microsoft YaHei"';ctx.fillText('直接返回主菜单，使用正常开始按钮即可完成当日挑战',W/2,y+212);
    if(typeof drawBtn==='function')drawBtn(ctx,W/2-70,H-120,140,42,'返回菜单','backMain','#9c27b0','#fff',16);
    ctx.textAlign='left';
}
const _origDrawEx2=typeof drawEx==='function'?drawEx:(typeof draw==='function'?draw:function(){});
function drawEx2(){
    switch(G.state){
        case STATE_LEADERBOARD:drawLeaderboardPage(ctx);break;
        case STATE_DAILY:drawDailyChallengePage(ctx);break;
        case STATE_MENU:drawMenuExtended2(ctx);break;
        default:_origDrawEx2();
    }
}
// 点击钩子扩展
const _origPD2=typeof handlePointerDown2==='function'?handlePointerDown2:(typeof handlePointerDown==='function'?handlePointerDown:function(){});
function handlePointerDown3(e){
    const p=typeof getPos==='function'?getPos(e):{x:0,y:0};
    const st=G.state;
    if(st===STATE_MENU){
        if(hitBtn2(p,'lbBtn')){G.state=STATE_LEADERBOARD;return}
        if(hitBtn2(p,'dailyBtn')){G.state=STATE_DAILY;return}
    } else if(st===STATE_LEADERBOARD||st===STATE_DAILY){
        if(hitBtn2(p,'closeSub')||hitBtn2(p,'backMain')){G.state=STATE_MENU;return}
    }
    return _origPD2(e);
}
if(typeof canvas!=='undefined'){
    canvas.addEventListener('mousedown',handlePointerDown3);
    canvas.addEventListener('touchstart',function(e){e.preventDefault();handlePointerDown3(e)},{passive:false});
}
window.cancelAnimationFrame(window.__raf3||0);
(function loop3(){window.__raf3=requestAnimationFrame(loop3);if(typeof update==='function')update();drawEx2()})();

// 自动保存排行榜（在结束时）
const _origUAAG=typeof updateAchievementsAfterGame==='function'?updateAchievementsAfterGame:function(){};
if(typeof window!=='undefined'){
    window['match_postGame']=function(score){
        _origUAAG();
        addToLeaderboard(score,'玩家'+LV.level);
        addXp(50+Math.floor(score/20));
        setDailyDone(score);
    }
}

applyTheme();
})();
</script>

      var pw = parent.clientWidth || window.innerWidth;

      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';

        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
