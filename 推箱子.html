<body>

<script>
(function(){
'use strict';

// ============ 常量定义 ============
const TILE_SIZE = 50;
const WALL = '#';
const FLOOR = ' ';
const BOX = '$';
const GOAL = '.';
const BOX_ON_GOAL = '*';
const PLAYER = '@';
const PLAYER_ON_GOAL = '+';

// ============ 颜色定义 ============
const COLORS = {
    bg: '#1a0a2e',
    wall: '#4a3a6a',
    wallTop: '#6a5a8a',
    floor: '#2a1a4a',
    floorLight: '#3a2a5a',
    goal: '#ff6b6b',
    goalGlow: 'rgba(255,107,107,0.3)',
    box: '#f39c12',
    boxTop: '#f1c40f',
    boxShadow: '#d35400',
    boxOnGoal: '#27ae60',
    boxOnGoalTop: '#2ecc71',
    player: '#3498db',
    playerTop: '#74b9ff',
    playerEye: '#fff',
    text: '#fff',
    textShadow: '#000',
    ui: 'rgba(0,0,0,0.7)',
    uiBorder: '#5a4a7a',
    button: '#6a5a8a',
    buttonHover: '#8a7aaa'
};

// ============ 关卡数据 ============
// 符号: #墙壁 $箱子 .目标 @玩家 +玩家在目标上 *箱子在目标上 空格地板
const LEVELS = [
    // 第1关 - 入门 (1箱1目标)
    {
        name: "初识",
        map: [
            "####",
            "# .#",
            "#  #",
            "#$ #",
            "#@ #",
            "####"
        ]
    },
    // 第2关 - 简单 (2箱2目标)
    {
        name: "起步",
        map: [
            "#####",
            "#  .#",
            "# #.#",
            "# $ #",
            "#$@ #",
            "#####"
        ]
    },
    // 第3关 - 双推 (2箱2目标)
    {
        name: "双推",
        map: [
            "######",
            "#    #",
            "# #. #",
            "# $. #",
            "# $@ #",
            "#    #",
            "######"
        ]
    },
    // 第4关 - 三箱 (3箱3目标)
    {
        name: "三角",
        map: [
            "  ####",
            "###  #",
            "# $  #",
            "#.#$ #",
            "#.#@ #",
            "#.#$ #",
            "#    #",
            "######"
        ]
    },
    // 第5关 - 迷你迷宫 (3箱3目标)
    {
        name: "迷径",
        map: [
            "######",
            "#  . #",
            "# #. #",
            "#  . #",
            "#$#  #",
            "#  $ #",
            "#@ $ #",
            "######"
        ]
    },
    // 第6关 - 紧凑 (3箱3目标)
    {
        name: "紧凑",
        map: [
            "#####",
            "#.  #",
            "#.# #",
            "#.# #",
            "#$  #",
            "#$ $#",
            "#@  #",
            "#####"
        ]
    },
    // 第7关 - 转折 (2箱2目标)
    {
        name: "转折",
        map: [
            "####",
            "#  #",
            "#$ #",
            "#.@#",
            "#. #",
            "#$ #",
            "#@ #",
            "####"
        ]
    },
    // 第8关 - 螺旋 (3箱3目标)
    {
        name: "螺旋",
        map: [
            "######",
            "#    #",
            "# ## #",
            "# $. #",
            "#.$  #",
            "# @$.#",
            "# ## #",
            "#    #",
            "######"
        ]
    },
    // 第9关 - 挑战 (4箱4目标)
    {
        name: "挑战",
        map: [
            "#######",
            "#  .  #",
            "#  #  #",
            "#.$ $ #",
            "#  @  #",
            "#.$ $ #",
            "#  #  #",
            "#  .  #",
            "#######"
        ]
    },
    // 第10关 - 终极 (4箱4目标)
    {
        name: "大师",
        map: [
            "######",
            "#    #",
            "# ## #",
            "#.$..#",
            "# $$ #",
            "# @$.#",
            "# ## #",
            "#    #",
            "######"
        ]
    }
];

// ============ 游戏状态 ============
var canvas, ctx;
var G = {
    state: 'menu', // menu, playing, paused, win
    level: 0,
    map: [], // 当前地图状态
    player: { x: 0, y: 0 },
    moves: 0,
    pushes: 0,
    timer: 0,
    timerInterval: null,
    history: [], // 撤销历史
    touchStart: null,
    animating: false,
    bestScores: {} // localStorage最高分
};

// ============ 音效系统 ============
var audioCtx = null;
function getAudioCtx() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    return audioCtx;
}

function playSound(freq, duration, type) {
    try {
        var ctx = getAudioCtx();
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + duration);
    } catch(e) {}
}

function playMoveSound() { playSound(300, 0.1, 'sine'); }
function playPushSound() { playSound(200, 0.15, 'square'); }
function playGoalSound() { playSound(600, 0.2, 'sine'); }
function playWinSound() {
    playSound(523, 0.15, 'sine');
    setTimeout(function(){ playSound(659, 0.15, 'sine'); }, 150);
    setTimeout(function(){ playSound(784, 0.15, 'sine'); }, 300);
    setTimeout(function(){ playSound(1047, 0.3, 'sine'); }, 450);
}
function playUndoSound() { playSound(400, 0.1, 'triangle'); }

// ============ 初始化 ============
function init() {
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');
    resizeCanvas();
    loadBestScores();
    updateHighScoreDisplay();
    setupEvents();
    requestAnimationFrame(gameLoop);
}

function resizeCanvas() {
    var size = Math.min(window.innerWidth, window.innerHeight);
    canvas.width = size;
    canvas.height = size;
}

// ============ 关卡加载 ============
function parseLevel(levelIdx) {
    var level = LEVELS[levelIdx];
    var map = [];
    var maxWidth = 0;
    for (var r = 0; r < level.map.length; r++) {
        if (level.map[r].length > maxWidth) maxWidth = level.map[r].length;
    }
    for (var r = 0; r < level.map.length; r++) {
        var row = [];
        for (var c = 0; c < maxWidth; c++) {
            var ch = c < level.map[r].length ? level.map[r][c] : ' ';
            row.push(ch);
        }
        map.push(row);
    }
    return map;
}

function startGame(level) {
    G.level = level - 1;
    G.state = 'playing';
    G.map = parseLevel(G.level);
    G.moves = 0;
    G.pushes = 0;
    G.timer = 0;
    G.history = [];
    G.animating = false;

    // 找到玩家位置
    for (var r = 0; r < G.map.length; r++) {
        for (var c = 0; c < G.map[r].length; c++) {
            if (G.map[r][c] === PLAYER || G.map[r][c] === PLAYER_ON_GOAL) {
                G.player.x = c;
                G.player.y = r;
                break;
            }
        }
    }

    // 启动计时器
    if (G.timerInterval) clearInterval(G.timerInterval);
    G.timerInterval = setInterval(function() {
        if (G.state === 'playing') G.timer++;
    }, 1000);

    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('pauseBtn').style.display = 'block';
    document.getElementById('pauseScreen').style.display = 'none';
}

function restartLevel() {
    startGame(G.level + 1);
}

function backToMenu() {
    G.state = 'menu';
    if (G.timerInterval) clearInterval(G.timerInterval);
    document.getElementById('startScreen').style.display = 'flex';
    document.getElementById('pauseBtn').style.display = 'none';
    document.getElementById('pauseScreen').style.display = 'none';
    updateHighScoreDisplay();
}

function resumeGame() {
    G.state = 'playing';
    document.getElementById('pauseScreen').style.display = 'none';
}

// ============ 游戏逻辑 ============
function saveState() {
    var snapshot = {
        map: G.map.map(function(row) { return row.slice(); }),
        player: { x: G.player.x, y: G.player.y },
        moves: G.moves,
        pushes: G.pushes
    };
    G.history.push(snapshot);
    if (G.history.length > 50) G.history.shift();
}

function undo() {
    if (G.history.length === 0) return;
    var prev = G.history.pop();
    G.map = prev.map;
    G.player = prev.player;
    G.moves = prev.moves;
    G.pushes = prev.pushes;
    playUndoSound();
}

function tryMove(dx, dy) {
    if (G.state !== 'playing' || G.animating) return;

    var px = G.player.x;
    var py = G.player.y;
    var nx = px + dx;
    var ny = py + dy;

    // 边界检查
    if (ny < 0 || ny >= G.map.length || nx < 0 || nx >= G.map[0].length) return;
    if (G.map[ny][nx] === WALL) return;

    // 检查是否推箱子
    if (G.map[ny][nx] === BOX || G.map[ny][nx] === BOX_ON_GOAL) {
        var bx = nx + dx;
        var by = ny + dy;
        if (by < 0 || by >= G.map.length || bx < 0 || bx >= G.map[0].length) return;
        if (G.map[by][bx] === WALL || G.map[by][bx] === BOX || G.map[by][bx] === BOX_ON_GOAL) return;

        // 保存状态用于撤销
        saveState();

        // 移动箱子
        var wasGoal = G.map[ny][nx] === BOX_ON_GOAL;
        var boxToGoal = G.map[by][bx] === GOAL;

        G.map[ny][nx] = wasGoal ? GOAL : FLOOR;
        G.map[by][bx] = boxToGoal ? BOX_ON_GOAL : BOX;

        // 移动玩家
        var playerWasGoal = G.map[py][px] === PLAYER_ON_GOAL;
        G.map[py][px] = playerWasGoal ? GOAL : FLOOR;
        G.map[ny][nx] = (G.map[ny][nx] === GOAL) ? PLAYER_ON_GOAL : PLAYER;

        G.player.x = nx;
        G.player.y = ny;
        G.moves++;
        G.pushes++;

        if (boxToGoal) {
            playGoalSound();
        } else {
            playPushSound();
        }

        // 检查是否胜利
        checkWin();
    } else if (G.map[ny][nx] === FLOOR || G.map[ny][nx] === GOAL) {
        // 普通移动
        saveState();

        var playerWasGoal = G.map[py][px] === PLAYER_ON_GOAL;
        var moveToGoal = G.map[ny][nx] === GOAL;

        G.map[py][px] = playerWasGoal ? GOAL : FLOOR;
        G.map[ny][nx] = moveToGoal ? PLAYER_ON_GOAL : PLAYER;

        G.player.x = nx;
        G.player.y = ny;
        G.moves++;

        playMoveSound();
    }
}

function checkWin() {
    for (var r = 0; r < G.map.length; r++) {
        for (var c = 0; c < G.map[r].length; c++) {
            if (G.map[r][c] === GOAL || G.map[r][c] === PLAYER_ON_GOAL) {
                return; // 还有未完成的目标
            }
        }
    }

    // 胜利!
    G.state = 'win';
    if (G.timerInterval) clearInterval(G.timerInterval);
    playWinSound();

    // 保存最高分
    var score = calculateScore();
    var key = 'sokoban_level_' + (G.level + 1);
    var best = G.bestScores[key] || 0;
    if (score > best) {
        G.bestScores[key] = score;
        saveBestScores();
    }
}

function calculateScore() {
    var baseScore = 1000;
    var movePenalty = G.moves * 2;
    var pushPenalty = G.pushes * 5;
    var timePenalty = G.timer;
    return Math.max(0, baseScore - movePenalty - pushPenalty - timePenalty);
}

// ============ 存档系统 ============
function loadBestScores() {
    try {
        var saved = localStorage.getItem('sokoban_best_scores');
        if (saved) G.bestScores = JSON.parse(saved);
    } catch(e) {}
}

function saveBestScores() {
    try {
        localStorage.setItem('sokoban_best_scores', JSON.stringify(G.bestScores));
    } catch(e) {}
}

function updateHighScoreDisplay() {
    var el = document.getElementById('highScore');
    var total = 0;
    for (var i = 1; i <= 10; i++) {
        total += G.bestScores['sokoban_level_' + i] || 0;
    }
    el.textContent = total > 0 ? '总分: ' + total : '';
}

// ============ 渲染 ============
function render() {
    var w = canvas.width;
    var h = canvas.height;

    // 清空画布
    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(0, 0, w, h);

    if (G.state === 'menu') return;

    // 计算地图显示区域
    var mapRows = G.map.length;
    var mapCols = G.map[0].length;
    var maxDim = Math.max(mapRows, mapCols);
    var tileSize = Math.floor(Math.min(w, h - 100) / (maxDim + 1));
    var offsetX = Math.floor((w - mapCols * tileSize) / 2);
    var offsetY = Math.floor((h - mapRows * tileSize) / 2) + 30;

    // 绘制地图
    for (var r = 0; r < mapRows; r++) {
        for (var c = 0; c < mapCols; c++) {
            var x = offsetX + c * tileSize;
            var y = offsetY + r * tileSize;
            var cell = G.map[r][c];

            // 背景
            if (cell === WALL) {
                // 墙壁 - 3D效果
                ctx.fillStyle = COLORS.wall;
                ctx.fillRect(x, y, tileSize, tileSize);
                ctx.fillStyle = COLORS.wallTop;
                ctx.fillRect(x, y, tileSize, tileSize * 0.7);
                ctx.strokeStyle = '#3a2a5a';
                ctx.lineWidth = 1;
                ctx.strokeRect(x, y, tileSize, tileSize);
            } else if (cell !== ' ') {
                // 地板
                ctx.fillStyle = (r + c) % 2 === 0 ? COLORS.floor : COLORS.floorLight;
                ctx.fillRect(x, y, tileSize, tileSize);
            }

            // 目标点
            if (cell === GOAL || cell === PLAYER_ON_GOAL || cell === BOX_ON_GOAL) {
                // 发光效果
                ctx.fillStyle = COLORS.goalGlow;
                ctx.beginPath();
                ctx.arc(x + tileSize/2, y + tileSize/2, tileSize * 0.4, 0, Math.PI * 2);
                ctx.fill();

                // 菱形标记
                ctx.fillStyle = COLORS.goal;
                ctx.beginPath();
                ctx.moveTo(x + tileSize/2, y + tileSize * 0.2);
                ctx.lineTo(x + tileSize * 0.8, y + tileSize/2);
                ctx.lineTo(x + tileSize/2, y + tileSize * 0.8);
                ctx.lineTo(x + tileSize * 0.2, y + tileSize/2);
                ctx.closePath();
                ctx.fill();
            }

            // 箱子
            if (cell === BOX || cell === BOX_ON_GOAL) {
                var isOnGoal = cell === BOX_ON_GOAL;
                var padding = tileSize * 0.1;
                var bx = x + padding;
                var by = y + padding;
                var bs = tileSize - padding * 2;

                // 箱子阴影
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fillRect(bx + 2, by + 2, bs, bs);

                // 箱子主体
                ctx.fillStyle = isOnGoal ? COLORS.boxOnGoal : COLORS.box;
                ctx.fillRect(bx, by, bs, bs);

                // 箱子顶部高光
                ctx.fillStyle = isOnGoal ? COLORS.boxOnGoalTop : COLORS.boxTop;
                ctx.fillRect(bx, by, bs, bs * 0.4);

                // 箱子边框
                ctx.strokeStyle = isOnGoal ? '#1e8449' : COLORS.boxShadow;
                ctx.lineWidth = 2;
                ctx.strokeRect(bx, by, bs, bs);

                // 箱子十字装饰
                ctx.strokeStyle = isOnGoal ? 'rgba(255,255,255,0.3)' : 'rgba(255,255,255,0.5)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(bx + bs * 0.3, by + bs * 0.3);
                ctx.lineTo(bx + bs * 0.7, by + bs * 0.7);
                ctx.moveTo(bx + bs * 0.7, by + bs * 0.3);
                ctx.lineTo(bx + bs * 0.3, by + bs * 0.7);
                ctx.stroke();
            }

            // 玩家
            if (cell === PLAYER || cell === PLAYER_ON_GOAL) {
                var cx = x + tileSize / 2;
                var cy = y + tileSize / 2;
                var radius = tileSize * 0.35;

                // 玩家阴影
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.arc(cx + 2, cy + 2, radius, 0, Math.PI * 2);
                ctx.fill();

                // 玩家身体
                ctx.fillStyle = COLORS.player;
                ctx.beginPath();
                ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                ctx.fill();

                // 玩家高光
                ctx.fillStyle = COLORS.playerTop;
                ctx.beginPath();
                ctx.arc(cx - radius * 0.2, cy - radius * 0.2, radius * 0.6, 0, Math.PI * 2);
                ctx.fill();

                // 玩家眼睛
                ctx.fillStyle = COLORS.playerEye;
                ctx.beginPath();
                ctx.arc(cx - radius * 0.25, cy - radius * 0.1, radius * 0.15, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(cx + radius * 0.25, cy - radius * 0.1, radius * 0.15, 0, Math.PI * 2);
                ctx.fill();

                // 玩家边框
                ctx.strokeStyle = '#2980b9';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                ctx.stroke();
            }
        }
    }

    // 绘制UI
    renderUI(w, h);

    // 胜利界面
    if (G.state === 'win') {
        renderWinScreen(w, h);
    }
}

function renderUI(w, h) {
    // 顶部信息栏
    ctx.fillStyle = COLORS.ui;
    ctx.fillRect(0, 0, w, 60);

    ctx.fillStyle = COLORS.text;
    ctx.font = 'bold 16px "Segoe UI", sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';

    // 关卡信息
    ctx.fillText('第' + (G.level + 1) + '关: ' + LEVELS[G.level].name, 15, 20);

    // 步数
    ctx.fillText('步数: ' + G.moves, 15, 45);

    // 推数
    ctx.fillText('推箱: ' + G.pushes, 120, 45);

    // 时间
    var min = Math.floor(G.timer / 60);
    var sec = G.timer % 60;
    ctx.fillText('时间: ' + (min < 10 ? '0' : '') + min + ':' + (sec < 10 ? '0' : '') + sec, 220, 20);

    // 操作提示
    ctx.textAlign = 'right';
    ctx.font = '12px "Segoe UI", sans-serif';
    ctx.fillStyle = '#aaa';
    ctx.fillText('方向键/WASD移动 | Z撤销 | R重玩', w - 15, 20);
    ctx.fillText('滑动/点击控制 | P暂停', w - 15, 40);
}

function renderWinScreen(w, h) {
    // 半透明遮罩
    ctx.fillStyle = 'rgba(0,0,0,0.8)';
    ctx.fillRect(0, 0, w, h);

    // 胜利框
    var bw = Math.min(350, w * 0.85);
    var bh = 280;
    var bx = (w - bw) / 2;
    var by = (h - bh) / 2;

    // 背景
    ctx.fillStyle = '#2a1a4a';
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = COLORS.uiBorder;
    ctx.lineWidth = 3;
    ctx.strokeRect(bx, by, bw, bh);

    // 标题
    ctx.fillStyle = '#ff9f43';
    ctx.font = 'bold 36px "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('过关!', w/2, by + 50);

    // 统计
    ctx.fillStyle = '#fff';
    ctx.font = '16px "Segoe UI", sans-serif';
    ctx.fillText('步数: ' + G.moves + '  |  推箱: ' + G.pushes, w/2, by + 100);

    var min = Math.floor(G.timer / 60);
    var sec = G.timer % 60;
    ctx.fillText('用时: ' + (min < 10 ? '0' : '') + min + ':' + (sec < 10 ? '0' : '') + sec, w/2, by + 130);

    var score = calculateScore();
    ctx.fillStyle = '#ff9f43';
    ctx.font = 'bold 24px "Segoe UI", sans-serif';
    ctx.fillText('得分: ' + score, w/2, by + 170);

    // 按钮
    var btnW = 120;
    var btnH = 40;

    // 下一关按钮
    if (G.level < 9) {
        ctx.fillStyle = '#27ae60';
        ctx.fillRect(w/2 - btnW - 10, by + bh - 60, btnW, btnH);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 16px "Segoe UI", sans-serif';
        ctx.fillText('下一关', w/2 - btnW/2 - 10, by + bh - 40);
    }

    // 重玩按钮
    ctx.fillStyle = '#3498db';
    ctx.fillRect(w/2 + 10, by + bh - 60, btnW, btnH);
    ctx.fillStyle = '#fff';
    ctx.fillText('重玩', w/2 + btnW/2 + 10, by + bh - 40);

    // 返回按钮
    ctx.fillStyle = '#666';
    ctx.fillRect(w/2 - btnW/2, by + bh - 110, btnW, btnH - 5);
    ctx.fillStyle = '#fff';
    ctx.font = '14px "Segoe UI", sans-serif';
    ctx.fillText('返回菜单', w/2, by + bh - 93);
}

// ============ 事件处理 ============
function setupEvents() {
    // 键盘
    document.addEventListener('keydown', function(e) {
        if (G.state === 'playing') {
            switch(e.key) {
                case 'ArrowUp': case 'w': case 'W':
                    tryMove(0, -1); e.preventDefault(); break;
                case 'ArrowDown': case 's': case 'S':
                    tryMove(0, 1); e.preventDefault(); break;
                case 'ArrowLeft': case 'a': case 'A':
                    tryMove(-1, 0); e.preventDefault(); break;
                case 'ArrowRight': case 'd': case 'D':
                    tryMove(1, 0); e.preventDefault(); break;
                case 'z': case 'Z':
                    undo(); e.preventDefault(); break;
                case 'r': case 'R':
                    restartLevel(); e.preventDefault(); break;
                case 'p': case 'P':
                    G.state = 'paused';
                    document.getElementById('pauseScreen').style.display = 'flex';
                    e.preventDefault(); break;
            }
        } else if (G.state === 'paused') {
            if (e.key === 'p' || e.key === 'P') {
                resumeGame();
                e.preventDefault();
            }
        } else if (G.state === 'win') {
            if (e.key === 'Enter' || e.key === ' ') {
                if (G.level < 9) {
                    startGame(G.level + 2);
                } else {
                    backToMenu();
                }
                e.preventDefault();
            }
        }
    });

    // 暂停按钮
    document.getElementById('pauseBtn').addEventListener('click', function() {
        if (G.state === 'playing') {
            G.state = 'paused';
            document.getElementById('pauseScreen').style.display = 'flex';
        }
    });

    // 触摸/鼠标
    var touchStartX = 0, touchStartY = 0;
    var mouseDown = false;

    canvas.addEventListener('touchstart', function(e) {
        if (G.state !== 'playing') return;
        e.preventDefault();
        var touch = e.touches[0];
        touchStartX = touch.clientX;
        touchStartY = touch.clientY;
    }, { passive: false });

    canvas.addEventListener('touchend', function(e) {
        if (G.state !== 'playing') return;
        e.preventDefault();
        var touch = e.changedTouches[0];
        var dx = touch.clientX - touchStartX;
        var dy = touch.clientY - touchStartY;
        var dist = Math.sqrt(dx * dx + dy * dy);

        if (dist > 20) {
            if (Math.abs(dx) > Math.abs(dy)) {
                tryMove(dx > 0 ? 1 : -1, 0);
            } else {
                tryMove(0, dy > 0 ? 1 : -1);
            }
        }
    }, { passive: false });

    canvas.addEventListener('mousedown', function(e) {
        if (G.state !== 'playing') return;
        touchStartX = e.clientX;
        touchStartY = e.clientY;
        mouseDown = true;
    });

    canvas.addEventListener('mouseup', function(e) {
        if (G.state !== 'playing' || !mouseDown) return;
        mouseDown = false;
        var dx = e.clientX - touchStartX;
        var dy = e.clientY - touchStartY;
        var dist = Math.sqrt(dx * dx + dy * dy);

        if (dist > 20) {
            if (Math.abs(dx) > Math.abs(dy)) {
                tryMove(dx > 0 ? 1 : -1, 0);
            } else {
                tryMove(0, dy > 0 ? 1 : -1);
            }
        }
    });

    canvas.addEventListener('click', function(e) {
        if (G.state === 'win') {
            var rect = canvas.getBoundingClientRect();
            var x = (e.clientX - rect.left) * (canvas.width / rect.width);
            var y = (e.clientY - rect.top) * (canvas.height / rect.height);
            var w = canvas.width;
            var h = canvas.height;
            var bw = Math.min(350, w * 0.85);
            var bh = 280;
            var bx = (w - bw) / 2;
            var by = (h - bh) / 2;
            var btnW = 120;
            var btnH = 40;

            // 下一关按钮
            if (G.level < 9) {
                if (x >= w/2 - btnW - 10 && x <= w/2 - 10 && y >= by + bh - 60 && y <= by + bh - 20) {
                    startGame(G.level + 2);
                }
            }
            // 重玩按钮
            if (x >= w/2 + 10 && x <= w/2 + btnW + 10 && y >= by + bh - 60 && y <= by + bh - 20) {
                restartLevel();
            }
            // 返回按钮
            if (x >= w/2 - btnW/2 && x <= w/2 + btnW/2 && y >= by + bh - 110 && y <= by + bh - 75) {
                backToMenu();
            }
        }
    });

    // 窗口大小变化
    window.addEventListener('resize', resizeCanvas);
}

// ============ 游戏循环 ============
function gameLoop() {
    render();
    requestAnimationFrame(gameLoop);
}

// ============ 启动 ============
window.startGame = startGame;
window.resumeGame = resumeGame;
window.restartLevel = restartLevel;
window.backToMenu = backToMenu;
init();

})();


// ===== 游戏工坊统一广告系统 =====
const GameMonetize = {
	adsterra: { enabled: !/localhost|127\.0\.0\.1/.test(location.hostname) },
	sponsor: { enabled: true, wechatQR: '', alipayQR: '' },
	interstitial: { enabled: true, cooldownMs: 180000, gameCount: 2 },
	_lastInterTime: 0, _deathCount: 0,
	_gameOverDetected: false,
	init() {
		const banner = document.getElementById('adBanner');
		if (banner && this.adsterra.enabled) {
			const s1 = document.createElement('script');
			s1.src = 'https://pl29544740.effectivecpmnetwork.com/de/26/0e/de260e17b6a348e3489772a87b1cedf1.js';
			s1.async = true;
			banner.appendChild(s1);
		}
		const spBtn = document.getElementById('sponsorBtn');
		const spPanel = document.getElementById('sponsorPanel');
		const spClose = document.getElementById('sponsorClose');
		if (spBtn && spPanel && spClose && this.sponsor.enabled) {
			spBtn.onclick = () => { spPanel.style.display = 'flex'; spPanel.style.pointerEvents = 'auto'; };
			spClose.onclick = () => { spPanel.style.display = 'none'; spPanel.style.pointerEvents = 'none'; };
			spPanel.onclick = (e) => { if (e.target === spPanel) { spPanel.style.display = 'none'; spPanel.style.pointerEvents = 'none'; } };
		} else if (spBtn) { spBtn.style.display = 'none'; }
		const skipBtn = document.getElementById('skipInterstitial');
		const interstitial = document.getElementById('interstitialAd');
		if (skipBtn && interstitial) {
			skipBtn.onclick = () => {
				interstitial.style.display = 'none'; interstitial.style.pointerEvents = 'none';
				if (this._reviveCallback) { const cb = this._reviveCallback; this._reviveCallback = null; cb(); }
			};
		}
		// 自动检测游戏结束状态
		this._startGameOverWatcher();
	},
	_startGameOverWatcher() {
		// 检测#restartBtn或包含"重新开始"/"再来一局"的按钮变为可见
		const checkGameOver = () => {
			if (this._gameOverDetected) return;
			// 方法1: 检测#restartBtn可见
			const restartBtn = document.getElementById('restartBtn');
			if (restartBtn && restartBtn.offsetParent !== null && getComputedStyle(restartBtn).display !== 'none') {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
			// 方法2: 检测#gameOverScreen可见
			const goScreen = document.getElementById('gameOverScreen');
			if (goScreen && getComputedStyle(goScreen).display !== 'none') {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
			// 方法3: 检测screen-gameover可见
			const goScreen2 = document.getElementById('screen-gameover');
			if (goScreen2 && !goScreen2.classList.contains('hidden')) {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
		};
		// 每500ms检查一次
		this._goInterval = setInterval(() => {
			checkGameOver();
			// 如果检测到了，等2秒后重置标志，允许下次检测
			if (this._gameOverDetected) {
				setTimeout(() => { this._gameOverDetected = false; }, 2000);
			}
		}, 500);
	},
	requestRevive(callback) {
		this._reviveCallback = callback || null;
		const el = document.getElementById('interstitialAd');
		if (!el) { if (callback) callback(); return; }
		const s2 = document.createElement('script');
		s2.src = 'https://pl29544742.effectivecpmnetwork.com/be/a9/6d/bea96d779c0ee07c2b15613852dd3e70.js';
		s2.async = true;
		document.getElementById('interstitialAdSlot').innerHTML = '';
		document.getElementById('interstitialAdSlot').appendChild(s2);
		el.style.display = 'flex'; el.style.pointerEvents = 'auto';

		setTimeout(() => { const slot = document.getElementById('interstitialAdSlot'); if (slot && slot.innerHTML.includes('加载中')) { slot.innerHTML = '<div style=color:#aaa;font:13px Microsoft YaHei,sans-serif>广告暂时无法加载<br>点击下方按钮继续</div>'; } }, 3000);
		const skipBtn = document.getElementById('skipInterstitial');
		if (skipBtn) {
			skipBtn.textContent = '5 秒后可跳过'; skipBtn.disabled = true;
			let cd = 5;
			const timer = setInterval(() => {
				cd--;
				if (cd <= 0) { clearInterval(timer); skipBtn.textContent = '跳过广告 ▶'; skipBtn.disabled = false; }
				else { skipBtn.textContent = cd + ' 秒后可跳过'; }
			}, 1000);
		}
	},
	onGameOver() {
		this._deathCount++;
		if (!this.interstitial.enabled) return;
		if (this._deathCount < this.interstitial.gameCount) return;
		if (Date.now() - this._lastInterTime < this.interstitial.cooldownMs) return;
		this._lastInterTime = Date.now(); this._deathCount = 0;
		this.requestRevive(null);
	},
};
GameMonetize.init();
</script>
