// ==================== 音效系统 ====================
const AudioManager = {
    ctx: null,
    initialized: false,

    init() {
        if (this.initialized) return;
        try {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            this.initialized = true;
        } catch (e) {
            console.log('Audio not supported');
        }
    },

    play(type) {
        if (!this.initialized) this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        switch(type) {
            case 'correct':
                osc.frequency.setValueAtTime(523, now);
                osc.frequency.setValueAtTime(659, now + 0.1);
                osc.frequency.setValueAtTime(784, now + 0.2);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
                break;
            case 'wrong':
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.setValueAtTime(150, now + 0.1);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
                break;
            case 'click':
                osc.frequency.setValueAtTime(800, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
                break;
            case 'levelup':
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(554, now + 0.15);
                osc.frequency.setValueAtTime(659, now + 0.3);
                osc.frequency.setValueAtTime(880, now + 0.45);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                osc.start(now);
                osc.stop(now + 0.6);
                break;
            case 'achievement':
                osc.frequency.setValueAtTime(523, now);
                osc.frequency.setValueAtTime(659, now + 0.1);
                osc.frequency.setValueAtTime(784, now + 0.2);
                osc.frequency.setValueAtTime(1047, now + 0.3);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
                break;
        }
    }
};

// ==================== 初始化 ====================
function init() {
    G.canvas = document.getElementById('cv');
    G.ctx = G.canvas.getContext('2d');
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    setupInput();
    loadHighScore();
    loadStats();
    resetGame();
    requestAnimationFrame(gameLoop);
}

function resizeCanvas() {
    G.W = window.innerWidth;
    G.H = window.innerHeight;
    G.canvas.width = G.W;
    G.canvas.height = G.H;
}

function setupInput() {
    // 键盘事件
    document.addEventListener('keydown', (e) => {
        if (G.state === 'playing' && G.inputActive) {
            if (e.key === 'Backspace') {
                G.inputText = G.inputText.slice(0, -1);
            } else if (e.key === 'Enter') {
                checkAnswer();
            } else if (e.key.length === 1 && G.inputText.length < 10) {
                G.inputText += e.key;
            }
        } else if (G.state === 'menu') {
            if (e.key === 'Enter' || e.key === ' ') {
                startGame();
            }
        } else if (G.state === 'gameover') {
            if (e.key === 'Enter' || e.key === ' ') {
                resetGame();
            }
        } else if (G.state === 'result') {
            if (e.key === 'Enter' || e.key === ' ') {
                nextRiddle();
            }
        }
    });

    // 鼠标/触摸事件
    G.canvas.addEventListener('mousedown', handleClick);
    G.canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        G.mouseX = touch.clientX;
        G.mouseY = touch.clientY;
        handleClick();
    });

    G.canvas.addEventListener('mousemove', (e) => {
        G.mouseX = e.clientX;
        G.mouseY = e.clientY;
    });
}

function handleClick() {
    G.clicked = true;
    const mx = G.mouseX, my = G.mouseY;

    if (G.state === 'menu') {
        // 开始按钮
        const bx = G.W / 2, by = G.H * 0.6;
        if (isInRect(mx, my, bx - 100, by - 30, 200, 60)) {
            G.showCategorySelect = true;
        }
        // 分类选择
        if (G.showCategorySelect) {
            for (let i = 0; i < G.categories.length; i++) {
                const cx = G.W / 2, cy = G.H * 0.7 + i * 45;
                if (isInRect(mx, my, cx - 80, cy - 18, 160, 36)) {
                    G.selectedCategory = G.categories[i];
                    G.showCategorySelect = false;
                    startGame();
                    return;
                }
            }
        }
        // 难度选择
        for (let i = 1; i <= 3; i++) {
            const dx = G.W / 2 + (i - 2) * 80, dy = G.H * 0.45;
            if (isInCircle(mx, my, dx, dy, 25)) {
                G.difficulty = i;
                AudioManager.play('click');
            }
        }
        // 成就按钮
        if (isInRect(mx, my, G.W / 2 - 170, G.H * 0.67 - 20, 100, 40)) {
            G.state = 'achievements';
            AudioManager.play('click');
        }
        // 统计按钮
        if (isInRect(mx, my, G.W / 2 + 70, G.H * 0.67 - 20, 100, 40)) {
            G.state = 'stats';
            AudioManager.play('click');
        }
    } else if (G.state === 'playing') {
        // 输入框点击
        const inputBoxY = G.H * 0.75;
        if (isInRect(mx, my, G.W / 2 - 120, inputBoxY - 25, 240, 50)) {
            G.inputActive = true;
        }
        // 提示按钮
        if (isInRect(mx, my, G.W / 2 + 140, inputBoxY - 20, 80, 40)) {
            showHint();
        }
        // 跳过按钮
        if (isInRect(mx, my, G.W / 2 - 220, inputBoxY - 20, 80, 40)) {
            skipRiddle();
        }
        // 键盘按钮
        const kbY = G.H * 0.85;
        const keys = '的一是了不在有我他这个中大来上个国';
        const keys2 = '到说时要就出会也你对生能子那得于着下';
        const keyW = 35, keyH = 35;
        const startX = G.W / 2 - (keys.length * keyW) / 2;
        for (let i = 0; i < keys.length; i++) {
            if (isInRect(mx, my, startX + i * keyW, kbY, keyW, keyH)) {
                if (G.inputText.length < 10) G.inputText += keys[i];
            }
        }
        const startX2 = G.W / 2 - (keys2.length * keyW) / 2;
        for (let i = 0; i < keys2.length; i++) {
            if (isInRect(mx, my, startX2 + i * keyW, kbY + 40, keyW, keyH)) {
                if (G.inputText.length < 10) G.inputText += keys2[i];
            }
        }
        // 删除按钮
        if (isInRect(mx, my, G.W / 2 + 200, kbY, 50, 35)) {
            G.inputText = G.inputText.slice(0, -1);
        }
        // 确认按钮
        if (isInRect(mx, my, G.W / 2 - 25, kbY + 80, 50, 35)) {
            checkAnswer();
        }
        // 暂停按钮（右上角）
        if (isInRect(mx, my, G.W - 50, 10, 40, 40)) {
            G.paused = true;
            stopTimer();
            AudioManager.play('click');
        }
    } else if (G.state === 'playing' && G.paused) {
        // 暂停状态下的点击处理
        // 继续游戏按钮
        if (isInRect(mx, my, G.W / 2 - 100, G.H * 0.5 - 30, 200, 60)) {
            G.paused = false;
            startTimer();
            AudioManager.play('click');
        }
        // 返回主菜单按钮
        if (isInRect(mx, my, G.W / 2 - 100, G.H * 0.6 - 30, 200, 60)) {
            G.paused = false;
            resetGame();
            AudioManager.play('click');
        }
    } else if (G.state === 'result') {
        if (G.resultTimer <= 0) {
            nextRiddle();
        }
    } else if (G.state === 'achievements') {
        // 返回按钮
        if (isInRect(mx, my, G.W / 2 - 80, G.H * 0.9 - 25, 160, 50)) {
            G.state = 'menu';
            AudioManager.play('click');
        }
    } else if (G.state === 'stats') {
        // 返回按钮
        if (isInRect(mx, my, G.W / 2 - 80, G.H * 0.85 - 25, 160, 50)) {
            G.state = 'menu';
            AudioManager.play('click');
        }
    } else if (G.state === 'gameover') {
        const bx = G.W / 2, by = G.H * 0.7;
        if (isInRect(mx, my, bx - 100, by - 30, 200, 60)) {
            resetGame();
        }
    }
}

function isInRect(x, y, rx, ry, rw, rh) {
    return x >= rx && x <= rx + rw && y >= ry && y <= ry + rh;
}

function isInCircle(x, y, cx, cy, r) {
    return (x - cx) ** 2 + (y - cy) ** 2 <= r * r;
}

function loadHighScore() {
    try {
        G.highScore = parseInt(localStorage.getItem('riddleHighScore')) || 0;
    } catch (e) {
        G.highScore = 0;
    }
}

function saveHighScore() {
    try {
        localStorage.setItem('riddleHighScore', G.highScore.toString());
    } catch (e) {}
}

function loadStats() {
    try {
        const saved = localStorage.getItem('riddleStats');
        if (saved) {
            G.stats = JSON.parse(saved);
        }
        const achievements = localStorage.getItem('riddleAchievements');
        if (achievements) {
            G.unlockedAchievements = JSON.parse(achievements);
        }
    } catch (e) {}
}

function saveStats() {
    try {
        localStorage.setItem('riddleStats', JSON.stringify(G.stats));
        localStorage.setItem('riddleAchievements', JSON.stringify(G.unlockedAchievements));
    } catch (e) {}
}

function checkAchievements() {
    ACHIEVEMENTS.forEach(ach => {
        if (!G.unlockedAchievements.includes(ach.id) && ach.condition(G)) {
            G.unlockedAchievements.push(ach.id);
            G.achievementPopup = ach;
            G.achievementPopupTimer = 180;
            AudioManager.play('achievement');
            saveStats();
        }
    });
}

function resetGame() {
    G.state = 'menu';
    G.score = 0;
    G.combo = 0;
    G.maxCombo = 0;
    G.lives = 3;
    G.totalAnswered = 0;
    G.correctAnswers = 0;
    G.level = 1;
    G.riddlesInLevel = 0;
    G.levelComplete = false;
    G.inputText = '';
    G.inputActive = false;
    G.hintUsed = false;
    G.hintVisible = false;
    G.resultTimer = 0;
    G.resultShown = false;
    G.particles = [];
    G.animations = [];
    G.usedRiddles = [];
    G.perfectLevel = false;
    G.noHintStreak = 0;
    G.fastAnswer = false;
    G.paused = false;
    stopTimer();
}

function startGame() {
    G.state = 'playing';
    G.score = 0;
    G.combo = 0;
    G.maxCombo = 0;
    G.lives = 3;
    G.totalAnswered = 0;
    G.correctAnswers = 0;
    G.level = 1;
    G.riddlesInLevel = 0;
    G.levelComplete = false;
    G.inputText = '';
    G.inputActive = true;
    G.hintUsed = false;
    G.hintVisible = false;
    G.usedRiddles = [];
    G.perfectLevel = true;
    G.noHintStreak = 0;
    G.fastAnswer = false;
    G.riddleOrder = generateRiddleOrder();
    G.stats.totalGames++;
    saveStats();
    AudioManager.play('click');
    nextRiddle();
}

function generateRiddleOrder() {
    let available = RIDDLES.filter(r => {
        if (G.selectedCategory !== 'all' && r.category !== G.selectedCategory) return false;
        return true;
    });

    if (G.difficulty === 1) {
        available = available.filter(r => r.difficulty <= 1);
    } else if (G.difficulty === 2) {
        available = available.filter(r => r.difficulty <= 2);
    }

    // 洗牌
    for (let i = available.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [available[i], available[j]] = [available[j], available[i]];
    }
    return available;
}

function nextRiddle() {
    G.riddlesInLevel++;
    if (G.riddlesInLevel > G.riddlesPerLevel) {
        G.level++;
        G.riddlesInLevel = 1;
        G.levelComplete = true;
        G.perfectLevel = true;
        AudioManager.play('levelup');

        // 更新统计
        if (G.level > G.stats.bestLevel) G.stats.bestLevel = G.level;
        checkAchievements();
    }

    if (G.riddleOrder.length === 0 || G.usedRiddles.length >= G.riddleOrder.length) {
        G.riddleOrder = generateRiddleOrder();
        G.usedRiddles = [];
    }

    // 找一个未使用的谜题
    let riddle = null;
    for (let r of G.riddleOrder) {
        if (!G.usedRiddles.includes(r.id)) {
            riddle = r;
            break;
        }
    }

    if (!riddle) {
        riddle = G.riddleOrder[0];
    }

    G.currentRiddle = riddle;
    G.usedRiddles.push(riddle.id);
    G.inputText = '';
    G.inputActive = true;
    G.hintUsed = false;
    G.hintVisible = false;
    G.resultShown = false;
    G.state = 'playing';
    G.fadeAlpha = 1;
    G.fadeDirection = -0.02;
    G.answerStartTime = Date.now();

    // 启动计时器
    G.timeLeft = 30 + (G.difficulty === 1 ? 10 : G.difficulty === 2 ? 5 : 0);
    startTimer();
}

function startTimer() {
    stopTimer();
    G.timerActive = true;
    G.timer = setInterval(() => {
        if (G.state === 'playing') {
            G.timeLeft--;
            if (G.timeLeft <= 0) {
                timeUp();
            }
        }
    }, 1000);
}

function stopTimer() {
    if (G.timer) {
        clearInterval(G.timer);
        G.timer = null;
    }
    G.timerActive = false;
}

function timeUp() {
    stopTimer();
    G.lives--;
    G.combo = 0;
    showResult(false, '时间到!');
    if (G.lives <= 0) {
        gameOver();
    }
}

function checkAnswer() {
    if (!G.inputActive || G.inputText.length === 0) return;

    stopTimer();
    const userAnswer = G.inputText.trim();
    const correctAnswer = G.currentRiddle.answer;

    const isCorrect = userAnswer === correctAnswer ||
                     userAnswer.includes(correctAnswer) ||
                     correctAnswer.includes(userAnswer);

    // 计算答题时间
    const answerTime = (Date.now() - G.answerStartTime) / 1000;
    G.fastAnswer = answerTime < 5;

    if (isCorrect) {
        G.correctAnswers++;
        G.combo++;
        G.maxCombo = Math.max(G.maxCombo, G.combo);
        G.noHintStreak++;
        const baseScore = G.currentRiddle.difficulty * 100;
        const comboBonus = Math.min(G.combo * 50, 500);
        const timeBonus = Math.floor(G.timeLeft * 5);
        const hintPenalty = G.hintUsed ? 50 : 0;
        const totalScore = baseScore + comboBonus + timeBonus - hintPenalty;
        G.score += Math.max(totalScore, 10);
        addParticles(G.W / 2, G.H / 2, 20, CONFIG.COLORS.gold);
        showResult(true, `+${totalScore}分`);
        AudioManager.play('correct');

        // 更新统计
        G.stats.totalCorrect++;
        G.stats.totalAnswered++;
        if (G.maxCombo > G.stats.bestCombo) G.stats.bestCombo = G.maxCombo;

        // 检查成就
        checkAchievements();
    } else {
        G.lives--;
        G.combo = 0;
        G.noHintStreak = 0;
        G.perfectLevel = false;
        showResult(false, `答案是: ${correctAnswer}`);
        AudioManager.play('wrong');

        // 更新统计
        G.stats.totalAnswered++;

        if (G.lives <= 0) {
            gameOver();
        }
    }

    G.totalAnswered++;
    G.inputActive = false;
    saveStats();
}

function showResult(correct, message) {
    G.state = 'result';
    G.resultShown = true;
    G.resultTimer = 120; // 2秒
    G.resultCorrect = correct;
    G.resultMessage = message;
}

function showHint() {
    if (!G.hintUsed && G.currentRiddle) {
        G.hintUsed = true;
        G.hintVisible = true;
        G.score = Math.max(0, G.score - 30);
    }
}

function skipRiddle() {
    stopTimer();
    G.combo = 0;
    G.noHintStreak = 0;
    G.perfectLevel = false;
    G.lives--;
    G.totalAnswered++;
    G.stats.totalAnswered++;
    showResult(false, `答案是: ${G.currentRiddle.answer}`);
    AudioManager.play('wrong');
    if (G.lives <= 0) {
        gameOver();
    }
}

function gameOver() {
    stopTimer();
    G.state = 'gameover';
    if (G.score > G.highScore) {
        G.highScore = G.score;
        saveHighScore();
    }
    // 更新统计
    if (G.level > G.stats.bestLevel) G.stats.bestLevel = G.level;
    if (G.maxCombo > G.stats.bestCombo) G.stats.bestCombo = G.maxCombo;
    saveStats();
    checkAchievements();
}

function addParticles(x, y, count, color) {
    for (let i = 0; i < count; i++) {
        G.particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8,
            life: 60 + Math.random() * 40,
            maxLife: 100,
            size: 3 + Math.random() * 4,
            color: color
        });
    }
}

function updateParticles() {
    for (let i = G.particles.length - 1; i >= 0; i--) {
        const p = G.particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.1;
        p.life--;
        if (p.life <= 0) {
            G.particles.splice(i, 1);
        }
    }
}

// ==================== 渲染 ====================
function gameLoop(timestamp) {
    G.deltaTime = (timestamp - G.lastTime) / 16.67;
    G.lastTime = timestamp;
    G.frameCount++;

    update();
    render();
    requestAnimationFrame(gameLoop);
}

function update() {
    updateParticles();

    if (G.state === 'result') {
        G.resultTimer--;
        if (G.resultTimer <= 0 && G.lives > 0) {
            // 自动下一题
        }
    }

    // 成就弹窗计时
    if (G.achievementPopupTimer > 0) {
        G.achievementPopupTimer--;
        if (G.achievementPopupTimer <= 0) {
            G.achievementPopup = null;
        }
    }

    // 屏幕过渡
    if (G.screenTransition > 0) {
        G.screenTransition -= 0.05;
        if (G.screenTransition <= 0 && G.transitionTarget) {
            G.state = G.transitionTarget;
            G.transitionTarget = null;
        }
    }

    if (G.fadeDirection !== 0) {
        G.fadeAlpha += G.fadeDirection;
        if (G.fadeAlpha <= 0) {
            G.fadeAlpha = 0;
            G.fadeDirection = 0;
        }
    }
}

function render() {
    const ctx = G.ctx;
    const w = G.W, h = G.H;

    // 渐变背景
    const gradient = ctx.createLinearGradient(0, 0, w, h);
    gradient.addColorStop(0, CONFIG.COLORS.bg1);
    gradient.addColorStop(0.5, CONFIG.COLORS.bg2);
    gradient.addColorStop(1, CONFIG.COLORS.bg3);
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, w, h);

    // 装饰粒子
    drawDecorParticles(ctx, w, h);

    if (G.state === 'menu') {
        drawMenu(ctx, w, h);
    } else if (G.state === 'playing') {
        drawGame(ctx, w, h);
    } else if (G.state === 'result') {
        drawGame(ctx, w, h);
        drawResult(ctx, w, h);
    } else if (G.state === 'achievements') {
        drawAchievements(ctx, w, h);
    } else if (G.state === 'stats') {
        drawStats(ctx, w, h);
    } else if (G.state === 'gameover') {
        drawGameOver(ctx, w, h);
    }

    // 暂停界面覆盖
    drawPauseOverlay(ctx, w, h);

    // 成就弹窗
    drawAchievementPopup(ctx, w, h);

    // 绘制粒子特效
    drawParticles(ctx);
}

function drawDecorParticles(ctx, w, h) {
    const time = G.frameCount * 0.01;
    ctx.save();
    for (let i = 0; i < 30; i++) {
        const x = (w * 0.1 + i * w * 0.03 + Math.sin(time + i) * 20) % w;
        const y = (h * 0.1 + i * h * 0.02 + Math.cos(time + i * 0.7) * 15) % h;
        const size = 2 + Math.sin(time + i) * 1;
        const alpha = 0.3 + Math.sin(time + i) * 0.2;
        ctx.beginPath();
        ctx.arc(x, y, size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 215, 0, ${alpha})`;
        ctx.fill();
    }
    ctx.restore();
}

function drawMenu(ctx, w, h) {
    // 标题
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // 灯笼装饰
    drawLantern(ctx, w * 0.2, h * 0.25, 40);
    drawLantern(ctx, w * 0.8, h * 0.25, 40);
    drawLantern(ctx, w * 0.15, h * 0.45, 30);
    drawLantern(ctx, w * 0.85, h * 0.45, 30);

    // 主标题
    ctx.font = 'bold 64px "Microsoft YaHei", sans-serif';
    ctx.fillStyle = CONFIG.COLORS.gold;
    ctx.shadowColor = '#000';
    ctx.shadowBlur = 10;
    ctx.fillText('猜灯谜', w / 2, h * 0.2);

    ctx.font = CONFIG.FONT.subtitle;
    ctx.fillStyle = CONFIG.COLORS.lightGold;
    ctx.shadowBlur = 5;
    ctx.fillText('元宵佳节 猜谜赏灯', w / 2, h * 0.3);

    // 难度选择
    ctx.font = CONFIG.FONT.normal;
    ctx.fillStyle = CONFIG.COLORS.white;
    ctx.fillText('选择难度:', w / 2, h * 0.42);

    const difficulties = ['简单', '普通', '困难'];
    const diffColors = [CONFIG.COLORS.green, CONFIG.COLORS.gold, CONFIG.COLORS.red];
    for (let i = 1; i <= 3; i++) {
        const dx = w / 2 + (i - 2) * 80;
        const dy = h * 0.45;
        ctx.beginPath();
        ctx.arc(dx, dy, 25, 0, Math.PI * 2);
        ctx.fillStyle = G.difficulty === i ? diffColors[i - 1] : 'rgba(255,255,255,0.2)';
        ctx.fill();
        ctx.strokeStyle = diffColors[i - 1];
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = G.difficulty === i ? '#000' : '#fff';
        ctx.font = CONFIG.FONT.small;
        ctx.fillText(difficulties[i - 1], dx, dy);
    }

    // 开始按钮
    const btnY = h * 0.58;
    drawButton(ctx, w / 2, btnY, 200, 60, '开始游戏', CONFIG.COLORS.orange);

    // 分类选择
    if (G.showCategorySelect) {
        drawCategorySelect(ctx, w, h);
    }

    // 成就和统计按钮
    drawButton(ctx, w / 2 - 120, h * 0.67, 100, 40, '成就', CONFIG.COLORS.purple);
    drawButton(ctx, w / 2 + 120, h * 0.67, 100, 40, '统计', CONFIG.COLORS.cyan);

    // 最高分
    ctx.font = CONFIG.FONT.normal;
    ctx.fillStyle = CONFIG.COLORS.gold;
    ctx.fillText(`最高分: ${G.highScore}`, w / 2, h * 0.76);

    // 成就进度
    ctx.font = CONFIG.FONT.small;
    ctx.fillStyle = CONFIG.COLORS.lightGold;
    ctx.fillText(`成就: ${G.unlockedAchievements.length}/${ACHIEVEMENTS.length}`, w / 2, h * 0.81);

    // 操作说明
    ctx.font = CONFIG.FONT.small;
    ctx.fillStyle = CONFIG.COLORS.gray;
    ctx.fillText('键盘输入答案 或 点击下方键盘', w / 2, h * 0.85);
    ctx.fillText('按Enter确认 点击提示获取帮助', w / 2, h * 0.89);

    ctx.restore();
}

function drawCategorySelect(ctx, w, h) {
    ctx.save();

function drawAchievements(ctx, w, h) {

    ctx.fillStyle = CONFIG.COLORS.gold;

        const unlocked = G.unlockedAchievements.includes(ach.id);

        ctx.fillStyle = unlocked ? 'rgba(255, 215, 0, 0.2)' : 'rgba(255, 255, 255, 0.1)';

        ctx.fill();
        ctx.strokeStyle = unlocked ? CONFIG.COLORS.gold : 'rgba(255, 255, 255, 0.3)';

        roundRect(ctx, x - 100, y - 35, 200, 70, 10);
        ctx.stroke();

        ctx.font = '32px sans-serif';
        ctx.fillStyle = unlocked ? CONFIG.COLORS.gold : CONFIG.COLORS.darkGray;
        ctx.fillText(ach.icon, x - 60, y);

        ctx.fillStyle = unlocked ? CONFIG.COLORS.white : CONFIG.COLORS.gray;

        ctx.font = CONFIG.FONT.small;
        ctx.fillStyle = unlocked ? CONFIG.COLORS.lightGold : CONFIG.COLORS.darkGray;

    // 返回按钮

function drawStats(ctx, w, h) {

        { label: '最高连击', value: G.stats.bestCombo + 'x', icon: '🔥' },

function drawAchievementPopup(ctx, w, h) {
    if (!G.achievementPopup || G.achievementPopupTimer <= 0) return;

    const ach = G.achievementPopup;
    const alpha = Math.min(1, G.achievementPopupTimer / 30);
    const yOffset = (1 - alpha) * 50;

    ctx.save();
    ctx.globalAlpha = alpha;

    // 弹窗背景
    ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
    roundRect(ctx, w / 2 - 150, 60 + yOffset, 300, 80, 15);
    ctx.fill();
    ctx.strokeStyle = CONFIG.COLORS.gold;
    ctx.lineWidth = 2;
    roundRect(ctx, w / 2 - 150, 60 + yOffset, 300, 80, 15);
    ctx.stroke();

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // 成就解锁标题
    ctx.font = CONFIG.FONT.small;
    ctx.fillStyle = CONFIG.COLORS.gold;
    ctx.fillText('🎉 成就解锁 🎉', w / 2, 80 + yOffset);

    // 图标和名称
    ctx.font = '24px sans-serif';
    ctx.fillText(ach.icon + ' ' + ach.name, w / 2, 110 + yOffset);

    ctx.restore();
}

function drawLantern(ctx, x, y, size) {
    const time = G.frameCount * 0.03;
    const sway = Math.sin(time) * 5;

    ctx.save();
    ctx.translate(x + sway, y);

    // 灯笼主体
    ctx.beginPath();
    ctx.ellipse(0, 0, size * 0.7, size, 0, 0, Math.PI * 2);
    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, size);
    grad.addColorStop(0, '#FF6B35');
    grad.addColorStop(0.7, '#FF0000');
    grad.addColorStop(1, '#8B0000');
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = '#FFD700';
    ctx.lineWidth = 2;
    ctx.stroke();

    // 灯笼顶部
    ctx.fillStyle = '#FFD700';
    ctx.fillRect(-size * 0.4, -size - 5, size * 0.8, 5);

    // 灯笼底部
    ctx.fillRect(-size * 0.3, size, size * 0.6, 3);

    // 灯笼穗子
    ctx.strokeStyle = '#FFD700';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, size + 3);
    ctx.lineTo(0, size + 20);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-3, size + 20);
    ctx.lineTo(3, size + 20);
    ctx.stroke();

    // 灯笼光芒
    ctx.globalAlpha = 0.3 + Math.sin(time * 2) * 0.1;
    ctx.beginPath();
    ctx.arc(0, 0, size * 1.2, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 200, 0, 0.2)';
    ctx.fill();

    ctx.restore();
}

function drawGame(ctx, w, h) {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // 顶部信息栏
    drawGameHeader(ctx, w, h);

    // 灯谜显示区
    drawRiddleArea(ctx, w, h);

    // 输入区域
    drawInputArea(ctx, w, h);

    // 虚拟键盘
    drawVirtualKeyboard(ctx, w, h);

    ctx.restore();
}

function drawGameHeader(ctx, w, h) {
    const headerH = 60;

    // 背景
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, w, headerH);

    // 分数
    ctx.font = CONFIG.FONT.normal;
    ctx.fillStyle = CONFIG.COLORS.gold;
    ctx.textAlign = 'left';
    ctx.fillText(`分数: ${G.score}`, 20, headerH / 2);

    // 连击
    if (G.combo > 1) {
        ctx.fillStyle = CONFIG.COLORS.orange;
        ctx.fillText(`连击: ${G.combo}x`, 120, headerH / 2);
    }

    // 关卡
    ctx.fillStyle = CONFIG.COLORS.cyan;
    ctx.textAlign = 'center';
    ctx.fillText(`第${G.level}关`, w / 2, headerH / 2);

    // 剩余题目
    ctx.fillStyle = CONFIG.COLORS.white;
    ctx.fillText(`第${G.riddlesInLevel}/${G.riddlesPerLevel}题`, w / 2 + 80, headerH / 2);

    // 生命值
    ctx.textAlign = 'right';
    for (let i = 0; i < 3; i++) {
        const hx = w - 30 - i * 30;
        ctx.fillStyle = i < G.lives ? CONFIG.COLORS.red : CONFIG.COLORS.darkGray;
        ctx.font = '24px sans-serif';
        ctx.fillText('♥', hx, headerH / 2);
    }

    // 计时器
    const timerColor = G.timeLeft > 10 ? CONFIG.COLORS.green :
                      G.timeLeft > 5 ? CONFIG.COLORS.orange : CONFIG.COLORS.red;
    ctx.fillStyle = timerColor;
    ctx.font = CONFIG.FONT.subtitle;
    ctx.fillText(`⏱ ${G.timeLeft}s`, w - 120, headerH / 2);

    // 暂停按钮
    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
    roundRect(ctx, w - 50, 10, 40, 40, 8);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
    ctx.lineWidth = 2;
    roundRect(ctx, w - 50, 10, 40, 40, 8);
    ctx.stroke();

    // 暂停图标（两个竖条）
    ctx.fillStyle = '#fff';
    ctx.fillRect(w - 40, 20, 6, 20);
    ctx.fillRect(w - 30, 20, 6, 20);
}

function drawRiddleArea(ctx, w, h) {
    if (!G.currentRiddle) return;

    const areaY = h * 0.15;
    const areaH = h * 0.45;

    // 灯谜卡片背景
    ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
    roundRect(ctx, w * 0.1, areaY, w * 0.8, areaH, 20);
    ctx.fill();
    ctx.strokeStyle = CONFIG.COLORS.gold;
    ctx.lineWidth = 2;
    roundRect(ctx, w * 0.1, areaY, w * 0.8, areaH, 20);
    ctx.stroke();

    // 类别标签
    ctx.font = CONFIG.FONT.small;
    ctx.fillStyle = CONFIG.COLORS.cyan;
    ctx.textAlign = 'center';
    ctx.fillText(`【${G.currentRiddle.category}】`, w / 2, areaY + 30);

    // 难度标签
    const diffStars = '★'.repeat(G.currentRiddle.difficulty) + '☆'.repeat(3 - G.currentRiddle.difficulty);
    ctx.fillStyle = CONFIG.COLORS.gold;
    ctx.fillText(diffStars, w / 2, areaY + 55);

    // 灯谜内容
    ctx.font = CONFIG.FONT.hint;
    ctx.fillStyle = CONFIG.COLORS.white;
    const riddleText = G.currentRiddle.riddle;

    // 自动换行
    const maxWidth = w * 0.7;
    const lines = wrapText(ctx, riddleText, maxWidth);
    const lineHeight = 35;
    const startY = areaY + 100 + (areaH - 100 - lines.length * lineHeight) / 2;

    lines.forEach((line, i) => {
        ctx.fillText(line, w / 2, startY + i * lineHeight);
    });

    // 提示显示
    if (G.hintVisible) {
        ctx.font = CONFIG.FONT.normal;
        ctx.fillStyle = CONFIG.COLORS.lightGold;
        ctx.fillText(`💡 提示: ${G.currentRiddle.hint}`, w / 2, areaY + areaH - 40);
    }

    // 灯笼装饰
    drawLantern(ctx, w * 0.12, areaY + areaH / 2, 25);
    drawLantern(ctx, w * 0.88, areaY + areaH / 2, 25);
}

function drawInputArea(ctx, w, h) {
    const inputY = h * 0.75;

    // 输入框
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    roundRect(ctx, w / 2 - 120, inputY - 25, 240, 50, 10);
    ctx.fill();
    ctx.strokeStyle = G.inputActive ? CONFIG.COLORS.gold : CONFIG.COLORS.gray;
    ctx.lineWidth = 2;
    roundRect(ctx, w / 2 - 120, inputY - 25, 240, 50, 10);
    ctx.stroke();

    // 输入文字
    ctx.font = CONFIG.FONT.subtitle;
    ctx.fillStyle = CONFIG.COLORS.white;
    ctx.textAlign = 'center';
    ctx.fillText(G.inputText || '输入答案', w / 2, inputY);

    // 光标闪烁
    if (G.inputActive && G.frameCount % 60 < 30) {
        const textWidth = ctx.measureText(G.inputText).width;
        ctx.fillStyle = CONFIG.COLORS.gold;
        ctx.fillRect(w / 2 + textWidth / 2 + 2, inputY - 15, 2, 30);
    }

    // 提示按钮
    drawButton(ctx, w / 2 + 180, inputY, 80, 40, G.hintUsed ? '已提示' : '提示',
        G.hintUsed ? CONFIG.COLORS.gray : CONFIG.COLORS.purple);

    // 跳过按钮
    drawButton(ctx, w / 2 - 180, inputY, 80, 40, '跳过', CONFIG.COLORS.red);
}

function drawVirtualKeyboard(ctx, w, h) {
    const kbY = h * 0.85;
    const keys = '的一是了不在有我他这个中大来上个国';
    const keys2 = '到说时要就出会也你对生能子那得于着下';
    const keyW = 35, keyH = 35;

    // 第一行
    const startX = w / 2 - (keys.length * keyW) / 2;
    for (let i = 0; i < keys.length; i++) {
        const kx = startX + i * keyW;
        const ky = kbY;

        ctx.fillStyle = 'rgba(255,255,255,0.1)';
        roundRect(ctx, kx, ky, keyW - 2, keyH - 2, 5);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 1;
        roundRect(ctx, kx, ky, keyW - 2, keyH - 2, 5);
        ctx.stroke();

        ctx.font = CONFIG.FONT.small;
        ctx.fillStyle = CONFIG.COLORS.white;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(keys[i], kx + keyW / 2 - 1, ky + keyH / 2 - 1);
    }

    // 第二行
    const startX2 = w / 2 - (keys2.length * keyW) / 2;
    for (let i = 0; i < keys2.length; i++) {
        const kx = startX2 + i * keyW;
        const ky = kbY + 40;

        ctx.fillStyle = 'rgba(255,255,255,0.1)';
        roundRect(ctx, kx, ky, keyW - 2, keyH - 2, 5);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 1;
        roundRect(ctx, kx, ky, keyW - 2, keyH - 2, 5);
        ctx.stroke();

        ctx.font = CONFIG.FONT.small;
        ctx.fillStyle = CONFIG.COLORS.white;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(keys2[i], kx + keyW / 2 - 1, ky + keyH / 2 - 1);
    }

    // 删除按钮
    drawButton(ctx, w / 2 + 220, kbY + 17, 50, 35, '←', CONFIG.COLORS.red);

    // 确认按钮
    drawButton(ctx, w / 2, kbY + 97, 60, 35, '确定', CONFIG.COLORS.green);
}

function drawResult(ctx, w, h) {
    // 半透明遮罩
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, w, h);

    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const resultY = h * 0.4;

    // 结果图标
    ctx.font = '80px sans-serif';
    if (G.resultCorrect) {
        ctx.fillStyle = CONFIG.COLORS.green;
        ctx.fillText('✓', w / 2, resultY - 60);
    } else {
        ctx.fillStyle = CONFIG.COLORS.red;
        ctx.fillText('✗', w / 2, resultY - 60);
    }

    // 结果消息
    ctx.font = CONFIG.FONT.large;
    ctx.fillStyle = G.resultCorrect ? CONFIG.COLORS.green : CONFIG.COLORS.red;
    ctx.fillText(G.resultMessage, w / 2, resultY);

    // 正确答案显示（如果答错）
    if (!G.resultCorrect && G.currentRiddle) {
        ctx.font = CONFIG.FONT.normal;
        ctx.fillStyle = CONFIG.COLORS.white;
        ctx.fillText(`正确答案: ${G.currentRiddle.answer}`, w / 2, resultY + 50);
    }

    // 下一题提示
    if (G.resultTimer <= 0) {
        ctx.font = CONFIG.FONT.small;
        ctx.fillStyle = CONFIG.COLORS.gray;
        ctx.fillText('点击任意位置继续', w / 2, resultY + 100);
    }

    ctx.restore();
}

function drawGameOver(ctx, w, h) {
    // 背景
    const gradient = ctx.createLinearGradient(0, 0, w, h);
    gradient.addColorStop(0, '#1a0a2e');
    gradient.addColorStop(1, '#0a1a3e');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, w, h);

    drawDecorParticles(ctx, w, h);

    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // 游戏结束标题
    ctx.font = 'bold 56px "Microsoft YaHei", sans-serif';
    ctx.fillStyle = CONFIG.COLORS.red;
    ctx.shadowColor = '#000';
    ctx.shadowBlur = 10;
    ctx.fillText('游戏结束', w / 2, h * 0.25);

    // 统计信息
    ctx.font = CONFIG.FONT.subtitle;
    ctx.fillStyle = CONFIG.COLORS.white;
    ctx.fillText(`最终得分: ${G.score}`, w / 2, h * 0.4);

    ctx.font = CONFIG.FONT.normal;
    ctx.fillStyle = CONFIG.COLORS.lightGold;
    ctx.fillText(`答对: ${G.correctAnswers}/${G.totalAnswered}`, w / 2, h * 0.48);
    ctx.fillText(`最高连击: ${G.maxCombo}x`, w / 2, h * 0.53);
    ctx.fillText(`到达关卡: ${G.level}`, w / 2, h * 0.58);

    // 最高分
    if (G.score >= G.highScore) {
        ctx.font = CONFIG.FONT.subtitle;
        ctx.fillStyle = CONFIG.COLORS.gold;
        ctx.fillText('🎉 新纪录! 🎉', w / 2, h * 0.65);
    } else {
        ctx.fillStyle = CONFIG.COLORS.gray;
        ctx.fillText(`最高分: ${G.highScore}`, w / 2, h * 0.65);
    }

    // 重新开始按钮
    drawButton(ctx, w / 2, h * 0.75, 200, 60, '再来一局', CONFIG.COLORS.orange);

    ctx.restore();
}

function drawButton(ctx, x, y, w, h, text, color) {
    ctx.save();

    // 按钮背景
    ctx.fillStyle = color;
    roundRect(ctx, x - w / 2, y - h / 2, w, h, h / 4);
    ctx.fill();

    // 按钮边框
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 2;
    roundRect(ctx, x - w / 2, y - h / 2, w, h, h / 4);
    ctx.stroke();

    // 按钮文字
    ctx.font = CONFIG.FONT.normal;
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x, y);

    ctx.restore();
}

function drawParticles(ctx) {
    ctx.save();
    for (const p of G.particles) {
        const alpha = p.life / p.maxLife;
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
    }
    ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

function wrapText(ctx, text, maxWidth) {
    const lines = [];
    let currentLine = '';

    for (let i = 0; i < text.length; i++) {
        const testLine = currentLine + text[i];
        const metrics = ctx.measureText(testLine);

        if (metrics.width > maxWidth && currentLine.length > 0) {
            lines.push(currentLine);
            currentLine = text[i];
        } else {
            currentLine = testLine;
        }
    }

    if (currentLine.length > 0) {
        lines.push(currentLine);
    }

    return lines;
}

// ==================== 暂停界面 ====================
function drawPauseOverlay(ctx, w, h) {
    if (!G.paused) return;

    ctx.save();
    // 半透明遮罩
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(0, 0, w, h);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // 暂停标题
    ctx.font = 'bold 56px "Microsoft YaHei", sans-serif';
    ctx.fillStyle = CONFIG.COLORS.gold;
    ctx.shadowColor = '#000';
    ctx.shadowBlur = 10;
    ctx.fillText('游戏暂停', w / 2, h * 0.35);

    // 继续按钮
    drawButton(ctx, w / 2, h * 0.5, 200, 60, '继续游戏', CONFIG.COLORS.green);

    // 返回主菜单按钮
    drawButton(ctx, w / 2, h * 0.6, 200, 60, '返回主菜单', CONFIG.COLORS.gray);

    ctx.restore();
}
