<!DOCTYPE html>

<title>滑板特技</title>
<style>

<body>
<canvas id="c"></canvas>
<button id="pauseBtn" onclick="togglePause()">❚❚</button>
<script>
/* ============================================================
   滑板特技 - Skateboard Stunt
   单文件HTML Canvas游戏
   操作：键盘(↑跳跃/空格特技/←→平衡) + 鼠标/触屏(点击跳跃,上划特技)
   ============================================================ */
"use strict";

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 960, H = 540;
let scaleX = 1, scaleY = 1;

function resize() {
    canvas.width = W; canvas.height = H;
    const s = Math.min(innerWidth / W, innerHeight / H);
    canvas.style.width = (W * s) + 'px';
    canvas.style.height = (H * s) + 'px';
    canvas.style.left = ((innerWidth - W * s) / 2) + 'px';
    canvas.style.top = ((innerHeight - H * s) / 2) + 'px';
    scaleX = W * s; scaleY = H * s;
}
resize();
addEventListener('resize', resize);

/* ---- 音效系统 ---- */
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function ensureAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }

function playTone(freq, dur, type, vol) {
    ensureAudio();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || 'square';
    o.frequency.value = freq;
    g.gain.value = vol || 0.12;
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
}

function sfxJump() { playTone(520, 0.15, 'sine', 0.15); }
function sfxTrick() { playTone(780, 0.08, 'square', 0.1); setTimeout(() => playTone(980, 0.1, 'square', 0.1), 60); }
function sfxLand() { playTone(200, 0.12, 'triangle', 0.15); }
function sfxCombo() { playTone(1047, 0.06, 'square', 0.12); setTimeout(() => playTone(1319, 0.06, 'square', 0.12), 50); setTimeout(() => playTone(1568, 0.1, 'square', 0.12), 100); }
function sfxCrash() { playTone(120, 0.3, 'sawtooth', 0.15); }
function sfxClick() { playTone(600, 0.05, 'sine', 0.08); }
function sfxGameOver() { playTone(400, 0.15, 'square', 0.1); setTimeout(() => playTone(300, 0.15, 'square', 0.1), 150); setTimeout(() => playTone(200, 0.3, 'square', 0.1), 300); }

/* ---- 常量 ---- */
const GROUND_Y = 400;
const GRAVITY = 0.6;
const JUMP_FORCE = -13;
const PLAYER_W = 30, PLAYER_H = 50;
const OBSTACLE_TYPES = [
    { w: 30, h: 40, color: '#e74c3c', points: 10 },
    { w: 50, h: 25, color: '#e67e22', points: 15 },
    { w: 20, h: 60, color: '#9b59b6', points: 20 },
    { w: 60, h: 35, color: '#1abc9c', points: 25 },
];
const RAMP_TYPES = [
    { w: 80, h: 30, color: '#f39c12' },
    { w: 120, h: 50, color: '#d35400' },
];
const TRICK_NAMES = ['Kickflip', 'Heelflip', '360 Flip', 'Impossible', 'Varial', 'Tre Flip', 'Bigspin', '540'];
const TRICK_SCORES = [100, 120, 150, 180, 140, 200, 220, 300];

/* ---- 游戏状态 ---- */
let STATE = 'menu'; // menu, play, pause, over
let score = 0, highScore = 0, combo = 0, comboTimer = 0, maxCombo = 0;
let distance = 0, speed = 4, baseSpeed = 4;
let shakeTimer = 0, shakeMag = 0;
let lastTime = 0;

// Player
let player = {};
function resetPlayer() {
    player = {
        x: 150, y: GROUND_Y - PLAYER_H, vy: 0,
        grounded: true, angle: 0, targetAngle: 0,
        tricking: false, trickTimer: 0, trickIdx: -1,
        crashed: false, crashTimer: 0,
        airTime: 0, jumpPressed: false
    };
}

// World
let obstacles = [], ramps = [], particles = [], trickTexts = [], bgObjects = [];
let frameCount = 0, difficultyTimer = 0;

function init() {
    score = 0; combo = 0; comboTimer = 0; maxCombo = 0;
    distance = 0; speed = baseSpeed;
    shakeTimer = 0;
    obstacles = []; ramps = []; particles = []; trickTexts = [];
    bgObjects = [];
    for (let i = 0; i < 8; i++) bgObjects.push({ x: Math.random() * W, type: Math.floor(Math.random() * 3), speed: 0.3 + Math.random() * 0.5 });
    resetPlayer();
    frameCount = 0; difficultyTimer = 0;
}

/* ---- localStorage ---- */
function loadHigh() { highScore = parseInt(localStorage.getItem('skate_high') || '0'); }
function saveHigh() { if (score > highScore) { highScore = score; localStorage.setItem('skate_high', highScore); } }
loadHigh();

/* ---- 输入 ---- */
const keys = {};
let touchStartY = 0, touchStartX = 0, touching = false;

addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'ArrowDown') e.preventDefault();
    if (STATE === 'menu' && (e.code === 'Enter' || e.code === 'Space')) { startGame(); sfxClick(); }
    if (STATE === 'over' && (e.code === 'Enter' || e.code === 'Space')) { STATE = 'menu'; sfxClick(); }
    if (STATE === 'play' && e.code === 'KeyP') togglePause();
    if (STATE === 'pause' && e.code === 'KeyP') togglePause();
    if (STATE === 'play' && e.code === 'Space' && player.grounded && !player.crashed) doTrick();
});
addEventListener('keyup', e => { keys[e.code] = false; });

canvas.addEventListener('mousedown', e => {
    if (STATE === 'menu') { startGame(); sfxClick(); return; }
    if (STATE === 'over') { STATE = 'menu'; sfxClick(); return; }
    if (STATE === 'play') jump();
});
canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.touches[0];
    touchStartY = t.clientY; touchStartX = t.clientX; touching = true;
    if (STATE === 'menu') { startGame(); sfxClick(); return; }
    if (STATE === 'over') { STATE = 'menu'; sfxClick(); return; }
}, { passive: false });
canvas.addEventListener('touchend', e => {
    e.preventDefault();
    if (STATE === 'play' && touching) {
        const t = e.changedTouches[0];
        const dy = touchStartY - t.clientY;
        if (dy > 40) doTrick(); // 上划特技
        else jump();
    }
    touching = false;
}, { passive: false });

function jump() {
    if (STATE !== 'play' || player.crashed) return;
    if (player.grounded) {
        player.vy = JUMP_FORCE;
        player.grounded = false;
        sfxJump();
    }
}

function doTrick() {
    if (STATE !== 'play' || player.crashed || player.grounded) return;
    if (player.tricking) return;
    player.tricking = true;
    player.trickTimer = 30;
    player.trickIdx = Math.floor(Math.random() * TRICK_NAMES.length);
    player.targetAngle = player.angle + Math.PI * 2;
    sfxTrick();
}

function togglePause() {
    if (STATE === 'play') { STATE = 'pause'; document.getElementById('pauseBtn').textContent = '▶'; }
    else if (STATE === 'pause') { STATE = 'play'; document.getElementById('pauseBtn').textContent = '❚❚'; lastTime = performance.now(); }
}

function startGame() {
    init();
    STATE = 'play';
    document.getElementById('pauseBtn').style.display = 'block';
    document.getElementById('pauseBtn').textContent = '❚❚';
    lastTime = performance.now();
}

/* ---- 生成障碍物 ---- */
function spawnObstacle() {
    const t = OBSTACLE_TYPES[Math.floor(Math.random() * OBSTACLE_TYPES.length)];
    obstacles.push({ x: W + 50, y: GROUND_Y - t.h, w: t.w, h: t.h, color: t.color, points: t.points, passed: false });
}

function spawnRamp() {
    const t = RAMP_TYPES[Math.floor(Math.random() * RAMP_TYPES.length)];
    ramps.push({ x: W + 50, y: GROUND_Y - t.h, w: t.w, h: t.h, color: t.color });
}

/* ---- 粒子 ---- */
function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x, y, vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.8) * 5,
            life: 30 + Math.random() * 20, maxLife: 50, color, size: 2 + Math.random() * 3
        });
    }
}

function addTrickText(text, x, y, color) {
    trickTexts.push({ text, x, y, vy: -2, life: 60, color: color || '#ff0' });
}

/* ---- 碰撞检测 ---- */
function aabb(ax, ay, aw, ah, bx, by, bw, bh) {
    return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

/* ---- 更新 ---- */
function update(dt) {
    if (STATE !== 'play') return;
    frameCount++;
    difficultyTimer++;

    // 难度递增
    if (difficultyTimer % 600 === 0 && speed < 12) {
        speed += 0.3;
        baseSpeed = speed;
    }

    distance += speed * dt * 60;
    score += Math.floor(speed * dt * 60 * 0.5);

    // 生成
    if (frameCount % Math.max(60, 120 - Math.floor(difficultyTimer / 300) * 5) === 0) spawnObstacle();
    if (frameCount % Math.max(90, 180 - Math.floor(difficultyTimer / 400) * 5) === 0) spawnRamp();

    // 玩家物理
    if (!player.grounded) {
        player.vy += GRAVITY;
        player.y += player.vy;
        player.airTime += dt;

        // 特技动画
        if (player.tricking) {
            player.trickTimer--;
            player.angle += (player.targetAngle - player.angle) * 0.15;
            if (player.trickTimer <= 0) {
                player.tricking = false;
                // 成功完成特技
                const pts = TRICK_SCORES[player.trickIdx];
                score += pts * (1 + combo * 0.5);
                combo++;
                comboTimer = 120;
                if (combo > maxCombo) maxCombo = combo;
                if (combo >= 3) sfxCombo();
                addTrickText(TRICK_NAMES[player.trickIdx] + ' +' + Math.floor(pts * (1 + combo * 0.5)), player.x, player.y - 30, combo >= 3 ? '#ff6b6b' : '#ffd700');
                spawnParticles(player.x + PLAYER_W / 2, player.y + PLAYER_H, '#ffd700', 8);
            }
        } else {
            // 平衡调整
            if (keys['ArrowLeft']) player.angle -= 0.08;
            if (keys['ArrowRight']) player.angle += 0.08;
        }

        // 落地
        if (player.y >= GROUND_Y - PLAYER_H) {
            player.y = GROUND_Y - PLAYER_H;
            player.vy = 0;
            player.grounded = true;
            player.airTime = 0;
            // 角度归正（如果角度偏差太大则摔倒）
            const normAngle = ((player.angle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
            if (normAngle > 0.5 && normAngle < Math.PI * 2 - 0.5 && player.angle !== 0) {
                // 不完美的落地
                if (Math.abs(Math.sin(normAngle)) > 0.3) {
                    crash();
                    return;
                }
            }
            player.angle = 0;
            player.targetAngle = 0;
            if (!player.crashed) sfxLand();
        }
    } else {
        // 地面
        player.y = GROUND_Y - PLAYER_H;
        // 检查斜坡
        for (let r of ramps) {
            if (player.x + PLAYER_W > r.x && player.x < r.x + r.w) {
                // 在斜坡上自动起跳
                if (player.grounded && player.x + PLAYER_W > r.x + r.w * 0.3 && player.x < r.x + r.w * 0.7) {
                    player.vy = JUMP_FORCE * 0.8;
                    player.grounded = false;
                    sfxJump();
                }
            }
        }
    }

    // 连击计时
    if (comboTimer > 0) {
        comboTimer--;
        if (comboTimer <= 0) combo = 0;
    }

    // 障碍物移动
    for (let i = obstacles.length - 1; i >= 0; i--) {
        obstacles[i].x -= speed;
        if (!obstacles[i].passed && obstacles[i].x + obstacles[i].w < player.x) {
            obstacles[i].passed = true;
            score += obstacles[i].points;
        }
        if (obstacles[i].x < -100) obstacles.splice(i, 1);
    }

    // 斜坡移动
    for (let i = ramps.length - 1; i >= 0; i--) {
        ramps[i].x -= speed;
        if (ramps[i].x < -150) ramps.splice(i, 1);
    }

    // 碰撞检测
    if (!player.crashed) {
        const px = player.x + 5, py = player.y + 5, pw = PLAYER_W - 10, ph = PLAYER_H - 10;
        for (let o of obstacles) {
            if (aabb(px, py, pw, ph, o.x, o.y, o.w, o.h)) {
                crash();
                return;
            }
        }
    }

    // 粒子
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // 特技文字
    for (let i = trickTexts.length - 1; i >= 0; i--) {
        trickTexts[i].y += trickTexts[i].vy;
        trickTexts[i].life--;
        if (trickTexts[i].life <= 0) trickTexts.splice(i, 1);
    }

    // 背景物体
    for (let b of bgObjects) {
        b.x -= speed * b.speed;
        if (b.x < -60) { b.x = W + 60; b.type = Math.floor(Math.random() * 3); }
    }

    // 震屏
    if (shakeTimer > 0) shakeTimer--;

    // 坠落恢复
    if (player.crashed) {
        player.crashTimer--;
        if (player.crashTimer <= 0) {
            player.crashed = false;
            resetPlayer();
        }
    }
}

function crash() {
    if (player.crashed) return;
    player.crashed = true;
    player.crashTimer = 90;
    combo = 0; comboTimer = 0;
    shakeTimer = 15; shakeMag = 8;
    sfxCrash();
    spawnParticles(player.x + PLAYER_W / 2, player.y + PLAYER_H / 2, '#e74c3c', 15);
    // 游戏结束判定：速度过快摔倒直接结束
    if (speed > 7 || Math.random() < 0.3 + speed * 0.05) {
        STATE = 'over';
        document.getElementById('pauseBtn').style.display = 'none';
        saveHigh();
        sfxGameOver();
    }
}

/* ---- 绘制 ---- */
function drawBg() {
    // 天空渐变
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0f0c29');
    grad.addColorStop(0.5, '#302b63');
    grad.addColorStop(1, '#24243e');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // 远景建筑
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    for (let b of bgObjects) {
        if (b.type === 0) { ctx.fillRect(b.x, 200, 30, GROUND_Y - 200); ctx.fillRect(b.x - 5, 195, 40, 10); }
        else if (b.type === 1) { ctx.fillRect(b.x, 250, 50, GROUND_Y - 250); }
        else { ctx.fillRect(b.x, 180, 20, GROUND_Y - 180); ctx.fillRect(b.x + 25, 210, 25, GROUND_Y - 210); }
    }

    // 星星
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    for (let i = 0; i < 30; i++) {
        const sx = (i * 137.5 + frameCount * 0.1) % W;
        const sy = (i * 97.3) % 180;
        ctx.fillRect(sx, sy, 2, 2);
    }
}

function drawGround() {
    // 地面
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
    // 地面纹理线
    ctx.strokeStyle = '#34495e';
    ctx.lineWidth = 1;
    for (let i = 0; i < W + 40; i += 40) {
        const gx = ((i - (distance * 3) % 40) + 40) % (W + 40) - 20;
        ctx.beginPath(); ctx.moveTo(gx, GROUND_Y); ctx.lineTo(gx + 15, GROUND_Y + 8); ctx.stroke();
    }
    // 地面高亮线
    ctx.strokeStyle = '#4a6fa5';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, GROUND_Y); ctx.lineTo(W, GROUND_Y); ctx.stroke();
}

function drawPlayer() {
    if (player.crashed && player.crashTimer < 60) return; // 闪烁效果
    ctx.save();
    ctx.translate(player.x + PLAYER_W / 2, player.y + PLAYER_H / 2);
    ctx.rotate(player.angle);

    // 滑板
    ctx.fillStyle = '#8B4513';
    ctx.fillRect(-18, 12, 36, 5);
    ctx.fillStyle = '#D2691E';
    ctx.fillRect(-16, 13, 32, 3);
    // 轮子
    ctx.fillStyle = '#333';
    ctx.beginPath(); ctx.arc(-12, 19, 4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(12, 19, 4, 0, Math.PI * 2); ctx.fill();

    // 身体
    ctx.fillStyle = '#3498db';
    ctx.fillRect(-8, -18, 16, 24);
    // 头
    ctx.fillStyle = '#f1c40f';
    ctx.beginPath(); ctx.arc(0, -24, 9, 0, Math.PI * 2); ctx.fill();
    // 帽子
    ctx.fillStyle = '#e74c3c';
    ctx.fillRect(-10, -32, 20, 5);
    // 手臂
    ctx.strokeStyle = '#3498db';
    ctx.lineWidth = 3;
    if (player.tricking) {
        // 特技姿势
        ctx.beginPath(); ctx.moveTo(-8, -10); ctx.lineTo(-18, -20); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(8, -10); ctx.lineTo(18, -20); ctx.stroke();
    } else {
        ctx.beginPath(); ctx.moveTo(-8, -10); ctx.lineTo(-14, 2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(8, -10); ctx.lineTo(14, 2); ctx.stroke();
    }
    // 腿
    ctx.strokeStyle = '#2c3e50';
    ctx.beginPath(); ctx.moveTo(-5, 6); ctx.lineTo(-8, 12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(5, 6); ctx.lineTo(8, 12); ctx.stroke();

    ctx.restore();

    // 特技特效
    if (player.tricking) {
        ctx.strokeStyle = `rgba(255,215,0,${0.3 + Math.sin(frameCount * 0.3) * 0.2})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(player.x + PLAYER_W / 2, player.y + PLAYER_H / 2, 30 + Math.sin(frameCount * 0.2) * 5, 0, Math.PI * 2);
        ctx.stroke();
    }
}

function drawObstacles() {
    for (let o of obstacles) {
        // 阴影
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.fillRect(o.x + 3, o.y + 3, o.w, o.h);
        // 主体
        ctx.fillStyle = o.color;
        ctx.fillRect(o.x, o.y, o.w, o.h);
        // 高光
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(o.x, o.y, o.w, 4);
        // 警告标记
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('!', o.x + o.w / 2, o.y - 5);
    }
}

function drawRamps() {
    for (let r of ramps) {
        ctx.fillStyle = r.color;
        ctx.beginPath();
        ctx.moveTo(r.x, GROUND_Y);
        ctx.lineTo(r.x + r.w / 2, r.y);
        ctx.lineTo(r.x + r.w, GROUND_Y);
        ctx.closePath();
        ctx.fill();
        // 高光
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(r.x + 5, GROUND_Y - 3);
        ctx.lineTo(r.x + r.w / 2, r.y + 3);
        ctx.stroke();
    }
}

function drawParticles() {
    for (let p of particles) {
        const alpha = p.life / p.maxLife;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
}

function drawTrickTexts() {
    for (let t of trickTexts) {
        const alpha = t.life / 60;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = t.color;
        ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(t.text, t.x + PLAYER_W / 2, t.y);
    }
    ctx.globalAlpha = 1;
}

function drawHUD() {
    // 分数
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 24px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('分数: ' + score, 15, 35);

    // 速度
    ctx.font = '14px sans-serif';
    ctx.fillStyle = '#aaa';
    ctx.fillText('速度: ' + speed.toFixed(1), 15, 55);

    // 连击
    if (combo > 0) {
        ctx.fillStyle = combo >= 5 ? '#ff6b6b' : combo >= 3 ? '#ffd700' : '#fff';
        ctx.font = 'bold ' + (20 + combo * 2) + 'px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(combo + ' COMBO!', W / 2, 60);
        // 连击条
        const barW = 120, barH = 6;
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(W / 2 - barW / 2, 68, barW, barH);
        ctx.fillStyle = '#ffd700';
        ctx.fillRect(W / 2 - barW / 2, 68, barW * (comboTimer / 120), barH);
    }

    // 最高分
    ctx.fillStyle = '#aaa';
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('最高: ' + highScore, W - 15, 35);
}

function drawMenu() {
    drawBg();
    drawGround();

    // 标题
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 52px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('滑板特技', W / 2, 160);

    // 副标题
    ctx.font = '20px sans-serif';
    ctx.fillStyle = '#aaa';
    ctx.fillText('Skateboard Stunt', W / 2, 195);

    // 滑板图标
    ctx.save();
    ctx.translate(W / 2, 260);
    ctx.rotate(Math.sin(frameCount * 0.03) * 0.15);
    ctx.fillStyle = '#8B4513';
    ctx.fillRect(-30, 0, 60, 8);
    ctx.fillStyle = '#333';
    ctx.beginPath(); ctx.arc(-20, 12, 6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(20, 12, 6, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // 开始提示
    const alpha = 0.5 + Math.sin(frameCount * 0.06) * 0.5;
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.font = '18px sans-serif';
    ctx.fillText('点击 / 按 Enter 开始', W / 2, 340);

    // 操作说明
    ctx.fillStyle = '#888';
    ctx.font = '14px sans-serif';
    ctx.fillText('↑ / 点击 = 跳跃  |  空格 / 上划 = 特技  |  ← → = 平衡  |  P = 暂停', W / 2, 420);

    // 最高分
    if (highScore > 0) {
        ctx.fillStyle = '#ffd700';
        ctx.font = '16px sans-serif';
        ctx.fillText('最高分: ' + highScore, W / 2, 460);
    }
}

function drawPause() {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 40px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('暂停', W / 2, H / 2 - 20);
    ctx.font = '18px sans-serif';
    ctx.fillStyle = '#aaa';
    ctx.fillText('按 P 或点击继续', W / 2, H / 2 + 20);
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#e74c3c';
    ctx.font = 'bold 44px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('游戏结束', W / 2, 160);

    ctx.fillStyle = '#fff';
    ctx.font = '24px sans-serif';
    ctx.fillText('分数: ' + score, W / 2, 220);
    ctx.fillText('最高连击: ' + maxCombo, W / 2, 260);
    ctx.fillText('速度: ' + speed.toFixed(1), W / 2, 300);

    if (score >= highScore) {
        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 20px sans-serif';
        ctx.fillText('新纪录!', W / 2, 340);
    }

    const alpha = 0.5 + Math.sin(frameCount * 0.06) * 0.5;
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.font = '18px sans-serif';
    ctx.fillText('点击 / 按 Enter 返回', W / 2, 400);
}

function render() {
    ctx.save();

    // 震屏
    if (shakeTimer > 0) {
        const sx = (Math.random() - 0.5) * shakeMag;
        const sy = (Math.random() - 0.5) * shakeMag;
        ctx.translate(sx, sy);
    }

    if (STATE === 'menu') {
        drawMenu();
    } else {
        drawBg();
        drawGround();
        drawRamps();
        drawObstacles();
        drawPlayer();
        drawParticles();
        drawTrickTexts();
        drawHUD();
        if (STATE === 'pause') drawPause();
        if (STATE === 'over') drawGameOver();
    }

    ctx.restore();
}

/* ---- 主循环 ---- */
function loop(ts) {
    requestAnimationFrame(loop);
    if (STATE === 'pause') { render(); return; }
    const dt = Math.min((ts - lastTime) / 1000, 0.05);
    lastTime = ts;

    if (STATE === 'menu' || STATE === 'over') frameCount++;

    update(dt);
    render();
}

requestAnimationFrame(ts => { lastTime = ts; loop(ts); });


// ===== 游戏工坊统一广告系统 =====
const GameMonetize = {
	adsterra: { enabled: !/localhost|127\.0\.0\.1/.test(location.hostname) },
	sponsor: { enabled: true, wechatQR: '', alipayQR: '' },
	interstitial: { enabled: true, cooldownMs: 180000, gameCount: 2 },
	_lastInterTime: 0, _deathCount: 0,
	_gameOverDetected: false,
	init() {
		const banner = document.getElementById('adBanner');
		if (banner && this.adsterra.enabled) {
			const s1 = document.createElement('script');
			s1.src = 'https://pl29544740.effectivecpmnetwork.com/de/26/0e/de260e17b6a348e3489772a87b1cedf1.js';
			s1.async = true;
			banner.appendChild(s1);
		}
		const spBtn = document.getElementById('sponsorBtn');
		const spPanel = document.getElementById('sponsorPanel');
		const spClose = document.getElementById('sponsorClose');
		if (spBtn && spPanel && spClose && this.sponsor.enabled) {
			spBtn.onclick = () => { spPanel.style.display = 'flex'; spPanel.style.pointerEvents = 'auto'; };
			spClose.onclick = () => { spPanel.style.display = 'none'; spPanel.style.pointerEvents = 'none'; };
			spPanel.onclick = (e) => { if (e.target === spPanel) { spPanel.style.display = 'none'; spPanel.style.pointerEvents = 'none'; } };
		} else if (spBtn) { spBtn.style.display = 'none'; }
		const skipBtn = document.getElementById('skipInterstitial');
		const interstitial = document.getElementById('interstitialAd');
		if (skipBtn && interstitial) {
			skipBtn.onclick = () => {
				interstitial.style.display = 'none'; interstitial.style.pointerEvents = 'none';
				if (this._reviveCallback) { const cb = this._reviveCallback; this._reviveCallback = null; cb(); }
			};
		}
		// 自动检测游戏结束状态
		this._startGameOverWatcher();
	},
	_startGameOverWatcher() {
		// 检测#restartBtn或包含"重新开始"/"再来一局"的按钮变为可见
		const checkGameOver = () => {
			if (this._gameOverDetected) return;
			// 方法1: 检测#restartBtn可见
			const restartBtn = document.getElementById('restartBtn');
			if (restartBtn && restartBtn.offsetParent !== null && getComputedStyle(restartBtn).display !== 'none') {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
			// 方法2: 检测#gameOverScreen可见
			const goScreen = document.getElementById('gameOverScreen');
			if (goScreen && getComputedStyle(goScreen).display !== 'none') {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
			// 方法3: 检测screen-gameover可见
			const goScreen2 = document.getElementById('screen-gameover');
			if (goScreen2 && !goScreen2.classList.contains('hidden')) {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
		};
		// 每500ms检查一次
		this._goInterval = setInterval(() => {
			checkGameOver();
			// 如果检测到了，等2秒后重置标志，允许下次检测
			if (this._gameOverDetected) {
				setTimeout(() => { this._gameOverDetected = false; }, 2000);
			}
		}, 500);
	},
	requestRevive(callback) {
		this._reviveCallback = callback || null;
		const el = document.getElementById('interstitialAd');
		if (!el) { if (callback) callback(); return; }
		const s2 = document.createElement('script');
		s2.src = 'https://pl29544742.effectivecpmnetwork.com/be/a9/6d/bea96d779c0ee07c2b15613852dd3e70.js';
		s2.async = true;
		document.getElementById('interstitialAdSlot').innerHTML = '';
		document.getElementById('interstitialAdSlot').appendChild(s2);
		el.style.display = 'flex'; el.style.pointerEvents = 'auto';

		setTimeout(() => { const slot = document.getElementById('interstitialAdSlot'); if (slot && slot.innerHTML.includes('加载中')) { slot.innerHTML = '<div style=color:#aaa;font:13px Microsoft YaHei,sans-serif>广告暂时无法加载<br>点击下方按钮继续</div>'; } }, 3000);
		const skipBtn = document.getElementById('skipInterstitial');
		if (skipBtn) {
			skipBtn.textContent = '5 秒后可跳过'; skipBtn.disabled = true;
			let cd = 5;
			const timer = setInterval(() => {
				cd--;
				if (cd <= 0) { clearInterval(timer); skipBtn.textContent = '跳过广告 ▶'; skipBtn.disabled = false; }
				else { skipBtn.textContent = cd + ' 秒后可跳过'; }
			}, 1000);
		}
	},
	onGameOver() {
		this._deathCount++;
		if (!this.interstitial.enabled) return;
		if (this._deathCount < this.interstitial.gameCount) return;
		if (Date.now() - this._lastInterTime < this.interstitial.cooldownMs) return;
		this._lastInterTime = Date.now(); this._deathCount = 0;
		this.requestRevive(null);
	},
};
GameMonetize.init();
</script>
