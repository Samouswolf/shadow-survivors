<canvas id="c"></canvas>

<script>
if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;

<script src="../game_core.js"></script>
<script>
(function(){
"use strict";

const W=480,H=800;
const GAME_TIME=120;
const GRID_SIZE=10;
const GRID_OFFSET_X=40;
const GRID_OFFSET_Y=110;
const CELL_W=40;
const CELL_H=40;

const BUILDINGS=[
    {id:0,name:'住宅',cost:100,color:'#4fc3f7',icon:'🏠',desc:'人口+5'},
    {id:1,name:'商业',cost:150,color:'#ffb74d',icon:'🏪',desc:'税收+3/s'},

    {id:4,name:'道路',cost:10,color:'#616161',icon:'🛣️',desc:'连接建筑生效'},
    {id:5,name:'警局',cost:150,color:'#64b5f6',icon:'🚓',desc:'+8%幸福+安全'},
    {id:6,name:'消防',cost:150,color:'#e57373',icon:'🚒',desc:'+8%幸福+安全'},
    {id:7,name:'医院',cost:250,color:'#f06292',icon:'🏥',desc:'+12%幸福+健康'},
    {id:8,name:'学校',cost:220,color:'#ba68c8',icon:'🏫',desc:'+10%幸福+人口+3'}

const WEATHER_TYPES=[
    {id:0,name:'☀️ 晴天',color:'#ffeb3b',incomeMod:1.0,hapMod:1.05,desc:'收入正常,幸福略升'},
    {id:1,name:'⛅ 多云',color:'#90a4ae',incomeMod:1.0,hapMod:1.0,desc:'普通天气,无影响'},
    {id:2,name:'🌧️ 雨天',color:'#42a5f5',incomeMod:0.85,hapMod:0.9,desc:'收入-15%,幸福-10%'},
    {id:3,name:'⛈️ 风暴',color:'#5c6bc0',incomeMod:0.5,hapMod:0.65,desc:'收入-50%,幸福-35%,有损失风险'}
];

const EVENTS=[
    {id:'festival',name:'🎉 城市节日',desc:'商业+200金,幸福+10%',prob:0.08,eff:g=>{g.money+=200;g.eventHapBonus+=10;toast('🎉 节日庆典!商业+200💰',180);sfxWin()}},
    {id:'policy',name:'📋 新政补贴',desc:'发放城市补贴+300金',prob:0.06,eff:g=>{g.money+=300;toast('📋 新政补贴到账+300💰',180);sfxCoin()}},
    {id:'epidemic',name:'🤒 流感季节',desc:'无医院幸福-20%,有医院免疫',prob:0.05,eff:g=>{if(countBuilding(7)>0){toast('🏥 有医院,流感被控制住了!',180);sfxWin()}else{g.eventHapBonus-=20;toast('🤒 流感爆发!幸福-20%',240);sfxError()}}},
    {id:'fire',name:'🔥 火灾警报',desc:'无消防随机拆1建筑,有消防无损失',prob:0.05,eff:g=>{if(countBuilding(6)>0){toast('🚒 消防队迅速扑灭火灾!',180);sfxWin()}else{for(let tries=0;tries<20;tries++){const r=Math.floor(Math.random()*GRID_SIZE),c=Math.floor(Math.random()*GRID_SIZE);if(g.grid[r][c]!==null&&g.grid[r][c]!==4){const lost=BUILDINGS[g.grid[r][c]];g.grid[r][c]=null;toast('🔥 火灾烧毁了'+lost.name+'!',240);sfxError();g.fireLosses++;break}}}}},
    {id:'crime',name:'🕵️ 犯罪潮',desc:'无警局幸福-15%,税收被偷-100',prob:0.05,eff:g=>{if(countBuilding(5)>0){toast('🚓 警局强力镇压犯罪!',180);sfxWin()}else{g.eventHapBonus-=15;g.money=Math.max(0,g.money-100);toast('🕵️ 犯罪飙升!幸福-15%,被偷100💰',240);sfxError()}}},
    {id:'vip',name:'🤵 VIP来访',desc:'幸福>70奖励+500,否则-100',prob:0.04,eff:g=>{if(calculateHappiness()>=70){g.money+=500;toast('🤵 VIP高度赞扬!+500💰',240);sfxWin()}else{g.money=Math.max(0,g.money-100);toast('🤵 VIP不满城市面貌-100💰',240);sfxError()}}},
    {id:'donation',name:'💝 慈善捐赠',desc:'收到匿名捐款+150金',prob:0.07,eff:g=>{g.money+=150;toast('💝 善心人士捐赠+150💰',180);sfxCoin()}},
    {id:'blackout',name:'⚡ 大停电',desc:'工业收入归零持续10秒',prob:0.04,eff:g=>{g.blackoutTimer=600;toast('⚡ 大停电!工业停产10秒!',240);sfxError()}},
    {id:'boom',name:'💥 经济繁荣',desc:'所有建筑产出翻倍10秒',prob:0.04,eff:g=>{g.boomTimer=600;toast('💥 经济繁荣!收入翻倍10秒!',240);sfxWin()}}
];

const ACHIEVEMENTS=[
    {id:'first_house',name:'第一块砖',desc:'建造第一栋住宅',check:g=>countBuilding(0)>=1},
    {id:'road_master',name:'道路工程师',desc:'建造15条道路',check:g=>countBuilding(4)>=15},
    {id:'park_city',name:'花园城市',desc:'建造5座公园',check:g=>countBuilding(3)>=5},
    {id:'safe_city',name:'安全城市',desc:'同时拥有警局和消防',check:g=>countBuilding(5)>=1&&countBuilding(6)>=1},
    {id:'rich',name:'财大气粗',desc:'金币突破3000',check:g=>g.money>=3000},
    {id:'happy_city',name:'幸福之都',desc:'幸福度≥85%',check:g=>calculateHappiness()>=85},
    {id:'big_city',name:'大城市',desc:'人口≥100',check:g=>calculatePopulation()>=100},
    {id:'full_house',name:'地尽其用',desc:'填满60个格子',check:g=>{let n=0;for(let r=0;r<GRID_SIZE;r++)for(let c=0;c<GRID_SIZE;c++)if(g.grid[r][c]!==null)n++;return n>=60}}
];

const PHASE_GOALS=[
    {time:20,conds:['住宅>=3','幸福度>=50'],text:'建造3住宅 + 幸福度≥50%',reward:500},
    {time:40,conds:['商业>=2','人口>=20'],text:'建造2商业 + 人口≥20',reward:500},
    {time:60,conds:['道路>=8','工业>=1'],text:'建造8道路 + 1工业',reward:500},
    {time:80,conds:['警局+消防>=1','幸福度>=60'],text:'建警局/消防 + 幸福≥60%',reward:500},
    {time:100,conds:['公园>=2','人口>=50'],text:'建造2公园 + 人口≥50',reward:500},
    {time:120,conds:['最终评分'],text:'时间到，结算综合评分',reward:0}
];

let audioCtx=null;
function initAudio(){
    if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
}
function playTone(freq,dur,type,vol){
    if(!audioCtx)return;
    try{
        const o=audioCtx.createOscillator();
        const g=audioCtx.createGain();
        o.type=type||'square';
        o.frequency.value=freq;
        g.gain.value=vol||0.15;
        g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
        o.connect(g);g.connect(audioCtx.destination);
        o.start();o.stop(audioCtx.currentTime+dur);
    }catch(e){}
}
function sfxBuild(){playTone(392,0.08,'sine',0.15);setTimeout(()=>playTone(523,0.1,'sine',0.15),80)}
function sfxCoin(){playTone(660,0.06,'square',0.12);setTimeout(()=>playTone(880,0.1,'square',0.1),60)}
function sfxError(){playTone(150,0.2,'sawtooth',0.15)}
function sfxWin(){playTone(523,0.1,'sine',0.2);setTimeout(()=>playTone(659,0.1,'sine',0.2),100);setTimeout(()=>playTone(784,0.2,'sine',0.2),200)}
function sfxBuzzer(){playTone(150,0.4,'sawtooth',0.2)}
function sfxBtn(){playTone(600,0.06,'sine',0.1)}
function sfxDemolish(){playTone(200,0.12,'sawtooth',0.15);setTimeout(()=>playTone(140,0.18,'sawtooth',0.13),100)}
function sfxAchieve(){playTone(659,0.08,'sine',0.18);setTimeout(()=>playTone(784,0.08,'sine',0.18),90);setTimeout(()=>playTone(988,0.18,'sine',0.2),180)}
function sfxWeather(){playTone(300,0.15,'sine',0.12);setTimeout(()=>playTone(250,0.2,'sine',0.1),120)}

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let scale=1;
function resize(){
    const vw=innerWidth,vh=innerHeight;
    scale=Math.min(vw/W,vh/H);
    canvas.width=W*scale;canvas.height=H*scale;
    canvas.style.width=W*scale+'px';canvas.style.height=H*scale+'px';
    canvas.getContext('2d').setTransform(scale,0,0,scale,0,0);
}
window.addEventListener('resize',resize);resize();

function getPos(e){
    const r=canvas.getBoundingClientRect();
    const t=e.touches?e.touches[0]:e;
    return{x:(t.clientX-r.left)/scale,y:(t.clientY-r.top)/scale};
}

const G={
    state:STATE_MENU,
    score:0,
    high:0,
    money:1500,
    timeLeft:GAME_TIME*60,
    grid:[],
    selectedTool:-1,
    cursorX:0,
    cursorY:0,
    history:[],
    btnRects:{},
    phaseIndex:0,
    phaseMessage:'',
    phaseMessageTimer:0,
    phaseResults:[],
    tickAcc:0,
    coinAnim:[],
    selectedCell:null,
    lastPlaced:null,
    keys:{},
    pointerDrag:false,
    weather:0,
    weatherTimer:0,
    weatherCooldown:0,
    eventHapBonus:0,
    blackoutTimer:0,
    boomTimer:0,
    achievementsUnlocked:{},
    achievementQueue:[],
    achAnimTimer:0,
    currentAchievement:null,
    fireLosses:0,
    showStats:false,
    showAchievements:false,
    showBuildingInfo:false,
    demoMode:false,
    demolishMode:false,
    totalBuilt:0,
    toasts:[],
    totalIncomeEarned:0,
    buildingLevels:[]
};

G.high=parseInt(Storage.load('chengshiguihuashi_highscore','0'));

function countBuilding(id){
    let n=0;
    for(let r=0;r<GRID_SIZE;r++)for(let c=0;c<GRID_SIZE;c++)if(G.grid[r][c]===id)n++;
    return n;
}

function totalCells(){
    let n=0;
    for(let r=0;r<GRID_SIZE;r++)for(let c=0;c<GRID_SIZE;c++)if(G.grid[r][c]!==null)n++;
    return n;
}

function isConnected(r,c){
    if(G.grid[r][c]===null)return true;
    if(G.grid[r][c]===4)return true;
    const visited={};
    const q=[[r,c]];
    while(q.length){
        const [y,x]=q.shift();
        const k=y+','+x;
        if(visited[k])continue;visited[k]=1;
        if(G.grid[y][x]===4)return true;
        [[-1,0],[1,0],[0,-1],[0,1]].forEach(([dy,dx])=>{
            const ny=y+dy,nx=x+dx;
            if(ny>=0&&ny<GRID_SIZE&&nx>=0&&nx<GRID_SIZE&&G.grid[ny][nx]!==null&&!visited[ny+','+nx])q.push([ny,nx]);
        });
    }
    return false;
}

function calcConnectedRate(){
    let total=0,conn=0;
    for(let r=0;r<GRID_SIZE;r++)for(let c=0;c<GRID_SIZE;c++){
        if(G.grid[r][c]!==null&&G.grid[r][c]!==4){total++;if(isConnected(r,c))conn++}
    }
    return total>0?Math.round(conn/total*100):100;
}

function calculateHappiness(){
    let h=50;
    let hasPark=0,police=0,fire=0,ind=0,hospital=0,school=0;
    for(let r=0;r<GRID_SIZE;r++){
        for(let c=0;c<GRID_SIZE;c++){
            const b=G.grid[r][c];
            if(b===3){
                hasPark++;
                for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
                    const nr=r+dr,nc=c+dc;
                    if(nr>=0&&nr<GRID_SIZE&&nc>=0&&nc<GRID_SIZE&&(dr||dc)&&G.grid[nr][nc]!==null&&G.grid[nr][nc]!==4){
                        h+=0.5;
                    }
                }
            }
            if(b===5)police++;
            if(b===6)fire++;
            if(b===2)ind++;
            if(b===7)hospital++;
            if(b===8)school++;
        }
    }
    h+=police*5+fire*5+hospital*6+school*5;
    h-=ind*5;
    const resH=hasPark>0?10:0;
    h+=resH;
    const connectedBuildings=[];
    for(let r=0;r<GRID_SIZE;r++)for(let c=0;c<GRID_SIZE;c++){
        if(G.grid[r][c]!==null&&G.grid[r][c]!==4&&isConnected(r,c))connectedBuildings.push(1);
    }
    if(connectedBuildings.length===0)h=Math.max(0,h-20);
    h+=G.eventHapBonus;
    h*=WEATHER_TYPES[G.weather].hapMod;
    return Math.max(0,Math.min(100,Math.round(h)));
}

function calculateIncome(){
    let inc=0;
    for(let r=0;r<GRID_SIZE;r++){
        for(let c=0;c<GRID_SIZE;c++){
            const b=G.grid[r][c];
            if(!isConnected(r,c))continue;
            if(b===1)inc+=3;
            if(b===2){inc+=G.blackoutTimer>0?0:10}
        }
    }
    inc*=WEATHER_TYPES[G.weather].incomeMod;
    if(G.boomTimer>0)inc*=2;
    return Math.round(inc);
}

function calculatePopulation(){
    let n=0;
    for(let r=0;r<GRID_SIZE;r++)for(let c=0;c<GRID_SIZE;c++){
        if(G.grid[r][c]===0&&isConnected(r,c))n+=5;
        if(G.grid[r][c]===8&&isConnected(r,c))n+=3;
    }
    return n;
}

function checkPhase(phaseIdx){
    const goal=PHASE_GOALS[phaseIdx];
    if(!goal)return true;
    if(phaseIdx>=PHASE_GOALS.length-1)return true;
    let ok=true;
    goal.conds.forEach(cond=>{
        if(cond.includes('>=')){
            const [key,valStr]=cond.split('>=');
            const val=parseInt(valStr);
            if(key==='住宅'){ok=ok&&countBuilding(0)>=val}
            else if(key==='商业'){ok=ok&&countBuilding(1)>=val}
            else if(key==='工业'){ok=ok&&countBuilding(2)>=val}
            else if(key==='公园'){ok=ok&&countBuilding(3)>=val}
            else if(key==='道路'){ok=ok&&countBuilding(4)>=val}
            else if(key==='警局+消防'){ok=ok&&(countBuilding(5)+countBuilding(6))>=val}
            else if(key==='人口'){ok=ok&&calculatePopulation()>=val}
            else if(key==='幸福度'){ok=ok&&calculateHappiness()>=val}
        }
    });
    return ok;
}

function unlockAchievement(id){
    if(G.achievementsUnlocked[id])return;
    const ach=ACHIEVEMENTS.find(a=>a.id===id);
    if(!ach)return;
    G.achievementsUnlocked[id]=true;
    G.currentAchievement=ach;
    G.achAnimTimer=180;
    G.money+=80;
    sfxAchieve();
    toast('🏆 成就: '+ach.name+' +80💰',240);
}

function checkAchievements(){
    ACHIEVEMENTS.forEach(a=>{
        if(!G.achievementsUnlocked[a.id]&&a.check(G))unlockAchievement(a.id);
    });
}

function toast(text,life){
    G.toasts.push({text:text,life:life||180,maxLife:life||180,y:0});
}

function initState(){
    G.state=STATE_PLAYING;
    G.score=0;
    G.money=1500;
    G.timeLeft=GAME_TIME*60;
    G.selectedTool=-1;
    G.cursorX=0;
    G.cursorY=0;
    G.phaseIndex=0;
    G.phaseMessage='';
    G.phaseMessageTimer=0;
    G.phaseResults=[];
    G.tickAcc=0;
    G.coinAnim=[];
    G.selectedCell=null;
    G.lastPlaced=null;
    G.history=[];
    G.grid=[];
    for(let r=0;r<GRID_SIZE;r++){
        G.grid[r]=[];
        for(let c=0;c<GRID_SIZE;c++)G.grid[r][c]=null;
    }
    G.weather=0;
    G.weatherTimer=0;
    G.weatherCooldown=300;
    G.eventHapBonus=0;
    G.blackoutTimer=0;
    G.boomTimer=0;
    G.achievementsUnlocked={};
    G.achievementQueue=[];
    G.achAnimTimer=0;
    G.currentAchievement=null;
    G.fireLosses=0;
    G.showStats=false;
    G.demoMode=false;
    G.demolishMode=false;
    G.totalBuilt=0;
    G.toasts=[];
    G.phaseMessage='第1阶段: '+PHASE_GOALS[0].text;
    G.phaseMessageTimer=180;
    toast('🏙️ 开始建设你的城市！点击工具栏选建筑',240);
}

function startGame(){
    initAudio();
    initState();
    sfxBtn();
}

function endGame(){
    G.state=STATE_OVER;
    const pop=calculatePopulation();
    const hap=calculateHappiness();
    const achCount=Object.keys(G.achievementsUnlocked).length;
    G.score=pop*hap*10+G.money+achCount*200;
    if(G.score>G.high){
        G.high=G.score;
        Storage.save('chengshiguihuashi_highscore',G.high);
    }
    sfxBuzzer();
}

function togglePause(){
    if(G.state===STATE_PLAYING)G.state=STATE_PAUSE;
    else if(G.state===STATE_PAUSE)G.state=STATE_PLAYING;
    sfxBtn();
}

function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
}

function drawBtn(ctx,x,y,w,h,text,name,color,txtColor){
    G.btnRects[name]={x:x,y:y,w:w,h:h};
    ctx.fillStyle=color||'#ff6b35';
    ctx.strokeStyle='#fff';
    ctx.lineWidth=2;
    roundRect(ctx,x,y,w,h,8);
    ctx.fill();ctx.stroke();
    ctx.fillStyle=txtColor||'#fff';
    ctx.font='bold 14px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(text,x+w/2,y+h/2);
    ctx.textBaseline='alphabetic';ctx.textAlign='left';
}

function hitBtn(p,name){
    const r=G.btnRects[name];
    return r&&p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;
}

function cellAt(p){
    const x=p.x-GRID_OFFSET_X,y=p.y-GRID_OFFSET_Y;
    const c=Math.floor(x/CELL_W),r=Math.floor(y/CELL_H);
    if(r>=0&&r<GRID_SIZE&&c>=0&&c<GRID_SIZE&&x>=0&&x<CELL_W*GRID_SIZE&&y>=0&&y<CELL_H*GRID_SIZE)return{r,c};
    return null;
}

function tryBuild(r,c,toolIdx){
    const b=BUILDINGS[toolIdx];
    if(!b)return;
    if(G.grid[r][c]!==null){sfxError();toast('该格已有建筑',90);return}
    if(G.money<b.cost){sfxError();G.phaseMessage='金币不足！';G.phaseMessageTimer=60;return}
    G.history.push({r,c,prev:null,toolIdx,cost:b.cost});
    if(G.history.length>20)G.history.shift();
    G.grid[r][c]=toolIdx;
    G.money-=b.cost;
    G.coinAnim.push({r,c,text:'-'+b.cost,life:40,y:0});
    G.totalBuilt++;
    sfxBuild();
    checkAchievements();
}

function demolishAt(r,c){
    if(G.grid[r][c]===null){sfxError();return}
    const b=BUILDINGS[G.grid[r][c]];
    const refund=Math.floor(b.cost*0.5);
    G.history.push({r,c,prev:G.grid[r][c],toolIdx:-1,cost:-refund});
    if(G.history.length>20)G.history.shift();
    G.grid[r][c]=null;
    G.money+=refund;
    G.coinAnim.push({r,c,text:'+'+refund,life:40,y:0});
    sfxDemolish();
    toast('🔨 拆除'+b.name+',回收50%:+'+refund+'💰',150);
}

function undoLast(){
    if(G.history.length===0){sfxError();toast('没有可撤销操作',90);return}
    const last=G.history.pop();
    G.grid[last.r][last.c]=last.prev;
    G.money+=last.cost;
    G.coinAnim.push({r:last.r,c:last.c,text:'+'+last.cost,life:40,y:0});
    sfxCoin();
}

function buildFromKeyboard(){
    if(G.selectedTool<0||G.selectedTool>=BUILDINGS.length)return;
    tryBuild(G.cursorY,G.cursorX,G.selectedTool);
}

function changeWeather(){
    if(G.weatherTimer>0)G.weatherTimer--;
    if(G.weatherTimer<=0){
        G.weatherCooldown--;
        if(G.weatherCooldown<=0&&G.tickAcc%60===0&&Math.random()<0.06){
            const newW=Math.floor(Math.random()*WEATHER_TYPES.length);
            if(newW!==G.weather){
                G.weather=newW;
                G.weatherTimer=360+Math.floor(Math.random()*360);
                G.weatherCooldown=240;
                sfxWeather();
                toast(WEATHER_TYPES[newW].name+' '+WEATHER_TYPES[newW].desc,240);
            }
        }
    }
}

function tryTriggerEvent(){
    if(G.tickAcc%180!==0)return;
    if(Math.random()>0.22)return;
    const available=EVENTS.filter(e=>Math.random()<e.prob*3);
    if(available.length===0)return;
    const ev=available[Math.floor(Math.random()*available.length)];
    ev.eff(G);
}

function update(){
    if(G.state!==STATE_PLAYING)return;
    G.timeLeft--;
    G.tickAcc++;
    if(G.phaseMessageTimer>0)G.phaseMessageTimer--;
    if(G.blackoutTimer>0)G.blackoutTimer--;
    if(G.boomTimer>0)G.boomTimer--;
    if(G.achAnimTimer>0)G.achAnimTimer--;
    if(G.eventHapBonus!==0&&G.tickAcc%480===0){
        if(G.eventHapBonus>0)G.eventHapBonus=Math.max(0,G.eventHapBonus-1);
        else G.eventHapBonus=Math.min(0,G.eventHapBonus+1);
    }
    changeWeather();
    tryTriggerEvent();
    if(G.tickAcc%60===0){
        const inc=calculateIncome();
        if(inc>0){
            G.money+=inc;
            if(Math.random()<0.5)G.coinAnim.push({r:Math.floor(Math.random()*GRID_SIZE),c:Math.floor(Math.random()*GRID_SIZE),text:'+'+inc,life:30,y:0});
        }
        checkAchievements();
    }
    const elapsed=GAME_TIME-Math.ceil(G.timeLeft/60);
    while(G.phaseIndex<PHASE_GOALS.length&&elapsed>=PHASE_GOALS[G.phaseIndex].time){
        if(G.phaseIndex<PHASE_GOALS.length-1){
            const ok=checkPhase(G.phaseIndex);
            const goal=PHASE_GOALS[G.phaseIndex];
            if(ok){
                G.money+=goal.reward;
                G.phaseMessage='🎯 '+goal.text+' 达成! +'+goal.reward;
                G.phaseResults.push({idx:G.phaseIndex,ok:true});
                sfxWin();
            }else{
                G.money-=100;
                G.phaseMessage='❌ '+goal.text+' 未达成! -100';
                G.phaseResults.push({idx:G.phaseIndex,ok:false});
                sfxError();
            }
            G.phaseMessageTimer=180;
        }
        G.phaseIndex++;
        if(G.phaseIndex<PHASE_GOALS.length-1){
            setTimeout(()=>{
                G.phaseMessage='下一阶段: '+PHASE_GOALS[G.phaseIndex].text;
                G.phaseMessageTimer=180;
            },1500);
        }
    }
    for(let i=G.coinAnim.length-1;i>=0;i--){
        G.coinAnim[i].y++;
        G.coinAnim[i].life--;
        if(G.coinAnim[i].life<=0)G.coinAnim.splice(i,1);
    }
    for(let i=G.toasts.length-1;i>=0;i--){
        G.toasts[i].life--;
        G.toasts[i].y+=(G.toasts.length-1-i)*0.3;
        if(G.toasts[i].life<=0)G.toasts.splice(i,1);
    }
    if(G.keys['arrowleft']&&G.cursorX>0&&G.tickAcc%6===0){G.cursorX--}
    if(G.keys['arrowright']&&G.cursorX<GRID_SIZE-1&&G.tickAcc%6===0){G.cursorX++}
    if(G.keys['arrowup']&&G.cursorY>0&&G.tickAcc%6===0){G.cursorY--}
    if(G.keys['arrowdown']&&G.cursorY<GRID_SIZE-1&&G.tickAcc%6===0){G.cursorY++}
    if(G.timeLeft<=0){endGame();return}
}

function drawWeatherOverlay(){
    const w=WEATHER_TYPES[G.weather];
    if(G.weather===2){
        ctx.strokeStyle='rgba(180,220,255,0.6)';
        ctx.lineWidth=1;
        for(let i=0;i<40;i++){
            const rx=(Date.now()/3+i*137)%(W+50)-25;
            const ry=(Date.now()/2+i*89)%H;
            ctx.beginPath();ctx.moveTo(rx,ry);ctx.lineTo(rx-3,ry+12);ctx.stroke();
        }
    }else if(G.weather===3){
        ctx.fillStyle='rgba(30,30,80,0.25)';
        ctx.fillRect(0,0,W,H);
        ctx.strokeStyle='rgba(200,220,255,0.7)';
        ctx.lineWidth=1.5;
        for(let i=0;i<80;i++){
            const rx=(Date.now()/1.5+i*97)%(W+60)-30;
            const ry=(Date.now()/1.2+i*61)%H;
            ctx.beginPath();ctx.moveTo(rx,ry);ctx.lineTo(rx-4,ry+16);ctx.stroke();
        }
        if(G.tickAcc%90<5){
            ctx.fillStyle='rgba(255,255,200,0.15)';
            ctx.fillRect(0,0,W,H);
        }
    }
}

function drawGrid(){
    ctx.fillStyle='#1a2a1a';
    ctx.fillRect(GRID_OFFSET_X-5,GRID_OFFSET_Y-5,CELL_W*GRID_SIZE+10,CELL_H*GRID_SIZE+10);
    for(let r=0;r<GRID_SIZE;r++){
        for(let c=0;c<GRID_SIZE;c++){
            const x=GRID_OFFSET_X+c*CELL_W,y=GRID_OFFSET_Y+r*CELL_H;
            const even=(r+c)%2===0;
            ctx.fillStyle=even?'#2d5a2d':'#264d26';
            if(G.boomTimer>0)ctx.fillStyle=even?'#3d5a1d':'#364d16';
            if(G.blackoutTimer>0)ctx.fillStyle=even?'#1a2a2a':'#142020';
            ctx.fillRect(x,y,CELL_W-1,CELL_H-1);
            const b=G.grid[r][c];
            if(b!==null){
                const conn=isConnected(r,c);
                ctx.fillStyle=BUILDINGS[b].color;
                if(!conn&&b!==4)ctx.fillStyle='#555';
                ctx.fillRect(x+3,y+3,CELL_W-7,CELL_H-7);
                ctx.strokeStyle=conn?'#fff':'#888';
                ctx.lineWidth=1;
                ctx.strokeRect(x+3,y+3,CELL_W-7,CELL_H-7);
                ctx.font='18px sans-serif';
                ctx.textAlign='center';ctx.textBaseline='middle';
                ctx.fillStyle='#fff';
                if(G.blackoutTimer>0&&(b===1||b===2)){
                    ctx.globalAlpha=0.5;
                }
                ctx.fillText(BUILDINGS[b].icon,x+CELL_W/2,y+CELL_H/2);
                ctx.globalAlpha=1;
                ctx.textBaseline='alphabetic';ctx.textAlign='left';
            }
        }
    }
    if(G.selectedTool>=0&&!G.demolishMode){
        const x=GRID_OFFSET_X+G.cursorX*CELL_W,y=GRID_OFFSET_Y+G.cursorY*CELL_H;
        ctx.strokeStyle='#ffeb3b';
        ctx.lineWidth=3;
        ctx.setLineDash([4,4]);
        ctx.strokeRect(x+1,y+1,CELL_W-3,CELL_H-3);
        ctx.setLineDash([]);
        const b=BUILDINGS[G.selectedTool];
        ctx.fillStyle='rgba(255,235,59,0.18)';
        ctx.fillRect(x+2,y+2,CELL_W-5,CELL_W-5);
        ctx.globalAlpha=0.7;
        ctx.font='20px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillStyle='#fff';
        ctx.fillText(b.icon,x+CELL_W/2,y+CELL_H/2);
        ctx.globalAlpha=1;ctx.textBaseline='alphabetic';ctx.textAlign='left';
    }else if(G.demolishMode){
        const x=GRID_OFFSET_X+G.cursorX*CELL_W,y=GRID_OFFSET_Y+G.cursorY*CELL_H;
        ctx.strokeStyle='#f44336';
        ctx.lineWidth=3;
        ctx.setLineDash([6,3]);
        ctx.strokeRect(x+1,y+1,CELL_W-3,CELL_H-3);
        ctx.setLineDash([]);
        ctx.fillStyle='rgba(244,67,54,0.2)';
        ctx.fillRect(x+2,y+2,CELL_W-5,CELL_W-5);
        ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillStyle='#fff';ctx.fillText('✖',x+CELL_W/2,y+CELL_H/2);
        ctx.textBaseline='alphabetic';ctx.textAlign='left';
    }else{
        const x=GRID_OFFSET_X+G.cursorX*CELL_W,y=GRID_OFFSET_Y+G.cursorY*CELL_H;
        ctx.strokeStyle='rgba(255,255,255,0.5)';
        ctx.lineWidth=2;
        ctx.strokeRect(x+1,y+1,CELL_W-3,CELL_H-3);
    }
    if(G.selectedCell){
        const x=GRID_OFFSET_X+G.selectedCell.c*CELL_W,y=GRID_OFFSET_Y+G.selectedCell.r*CELL_H;
        ctx.strokeStyle='#ff4081';
        ctx.lineWidth=2;
        ctx.strokeRect(x,y,CELL_W-1,CELL_H-1);
    }
    G.coinAnim.forEach(ca=>{
        const x=GRID_OFFSET_X+ca.c*CELL_W+CELL_W/2;
        const y=GRID_OFFSET_Y+ca.r*CELL_H-ca.y;
        ctx.globalAlpha=ca.life/40;
        ctx.fillStyle=ca.text.startsWith('+')?'#8bc34a':'#ef5350';
        ctx.font='bold 14px "Microsoft YaHei"';
        ctx.textAlign='center';
        ctx.fillText(ca.text,x,y);
        ctx.textAlign='left';
    });
    ctx.globalAlpha=1;
    drawWeatherOverlay();
}

        ctx.strokeStyle=selected?'#fff':'#555';
        ctx.lineWidth=selected?3:1;
        roundRect(ctx,x,y,86,46,6);
        ctx.fill();ctx.stroke();
        ctx.font='15px sans-serif';
        ctx.fillStyle='#fff';
        ctx.textAlign='left';
        ctx.fillText(b.icon,x+6,y+20);
        ctx.font='bold 10.5px "Microsoft YaHei"';
        ctx.fillText(b.name,x+26,y+17);
        ctx.fillStyle=canAfford?'#ffd54f':'#888';
        ctx.fillText('💰'+b.cost,x+26,y+32);
        ctx.font='8.5px "Microsoft YaHei"';
        ctx.fillStyle='#b0bec5';
        ctx.fillText(b.desc,x+26,y+44);
        ctx.textAlign='left';
    });
    drawBtn(ctx,8,row3Y,60,34,'↩ Z','undo','#607d8b');
    drawBtn(ctx,72,row3Y,60,34,'🔨 V','demolish',G.demolishMode?'#c62828':'#8d6e63');
    drawBtn(ctx,136,row3Y,60,34,'⏸ Esc','pause','#795548');
    drawBtn(ctx,200,row3Y,60,34,'📊 Tab','stats','#00695c');
    drawBtn(ctx,264,row3Y,60,34,'🏆 7','achBtn','#689f38');
    drawBtn(ctx,328,row3Y,60,34,'ℹ️ 8','infoBtn','#f57c00');
    drawBtn(ctx,392,row3Y,80,34,'❌ 清除','deselect','#455a64');
    if(G.selectedTool>=0&&!G.demolishMode){
        const b=BUILDINGS[G.selectedTool];
        ctx.fillStyle='#fff';
        ctx.font='11.5px "Microsoft YaHei"';
        ctx.textAlign='left';
        ctx.fillText('已选: '+b.icon+' '+b.name+' '+b.desc+'  |1-9切换|Enter建造',8,row3Y+52);
        ctx.textAlign='left';
    }else if(G.demolishMode){

        ctx.fillText('🔨 拆除模式：点击建筑拆除,回收50%花费 | 再按V退出',8,row3Y+52);
        ctx.textAlign='left';
    }
}

        const tw=Math.min(W-40,ctx.measureText(t.text).width+40);
        roundRect(ctx,W/2-tw/2,y,tw,26,8);ctx.fill();

}

function drawAchievementPopup(){
    if(!G.currentAchievement||G.achAnimTimer<=0)return;
    const a=G.currentAchievement;

function draw(){
    if(G.state===STATE_MENU){drawMenu();return}
    const bg=ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#0d1b2a');bg.addColorStop(1,'#1b2838');
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    if(G.state===STATE_PLAYING){
        drawHUD();
        drawGrid();
        drawToolbar();
        drawAchievementPopup();
        drawBuildingInfo();
        if(G.showStats)drawStatsPanel();
        if(G.showAchievements)drawAchievementsPanel();
    }else if(G.state===STATE_PAUSE){
        drawHUD();drawGrid();drawToolbar();
        if(G.showStats)drawStatsPanel();
        if(G.showAchievements)drawAchievementsPanel();
        drawPause();
    }else if(G.state===STATE_OVER){
        drawHUD();drawGrid();
        drawOver();
    }
}

function onPointerDown(p){
    initAudio();
    if(G.state===STATE_MENU){
        if(hitBtn(p,'start')){startGame();return}
    }else if(G.state===STATE_PAUSE){
        if(hitBtn(p,'resume')){G.state=STATE_PLAYING;sfxBtn();return}
        if(hitBtn(p,'menu')){G.state=STATE_MENU;sfxBtn();return}
        if(hitBtn(p,'statsBtn2')){G.showStats=!G.showStats;sfxBtn();return}
    }else if(G.state===STATE_OVER){
        if(hitBtn(p,'restart')){startGame();return}
        if(hitBtn(p,'menu')){G.state=STATE_MENU;sfxBtn();return}
    }
    if(G.state!==STATE_PLAYING)return;
    if(G.showAchievements){
        if(hitBtn(p,'closeAch')){G.showAchievements=false;sfxBtn();return}
        return;
    }
    if(hitBtn(p,'closeInfo')){G.showBuildingInfo=false;sfxBtn();return}
    if(hitBtn(p,'achBtn')||hitBtn(p,'closeAch')){G.showAchievements=!G.showAchievements;sfxBtn();return}
    if(hitBtn(p,'infoBtn')){G.showBuildingInfo=!G.showBuildingInfo;sfxBtn();return}
    if(hitBtn(p,'undo')){undoLast();return}
    if(hitBtn(p,'pause')){togglePause();return}
    if(hitBtn(p,'deselect')){G.selectedTool=-1;G.demolishMode=false;sfxBtn();return}
    if(hitBtn(p,'demolish')){G.demolishMode=!G.demolishMode;if(G.demolishMode)G.selectedTool=-1;sfxBtn();return}
    if(hitBtn(p,'stats')||hitBtn(p,'closeStats')){G.showStats=!G.showStats;sfxBtn();return}
    for(let i=0;i<BUILDINGS.length;i++){
        if(hitBtn(p,'tool'+i)){G.selectedTool=i;G.demolishMode=false;sfxBtn();return}
    }
    const cell=cellAt(p);
    if(cell){
        G.cursorX=cell.c;G.cursorY=cell.r;
        G.selectedCell=cell;
        if(G.demolishMode){demolishAt(cell.r,cell.c)}
        else if(G.selectedTool>=0){tryBuild(cell.r,cell.c,G.selectedTool)}
        else if(G.showBuildingInfo){sfxBtn()}
    }
}
function onPointerMove(p){
    if(G.state!==STATE_PLAYING)return;
    const cell=cellAt(p);
    if(cell){G.cursorX=cell.c;G.cursorY=cell.r}
}
function onPointerUp(p){
}

window.addEventListener('keydown',function(e){
    const k=e.key.toLowerCase();
    G.keys[k]=true;
    initAudio();
    if(e.key===' '){e.preventDefault();if(G.state===STATE_MENU||G.state===STATE_OVER){startGame();return}}
    if(e.key==='Escape'){
        if(G.showAchievements){G.showAchievements=false;sfxBtn();return}
        if(G.showBuildingInfo){G.showBuildingInfo=false;sfxBtn();return}
        if(G.state===STATE_PLAYING||G.state===STATE_PAUSE)togglePause();return
    }
    if(e.key==='Tab'){e.preventDefault();if(G.state===STATE_PLAYING||G.state===STATE_PAUSE){G.showStats=!G.showStats;sfxBtn()}return}
    if(G.state!==STATE_PLAYING)return;
    if(G.showAchievements||G.showStats)return;
    if(e.key>='1'&&e.key<='9'){const idx=parseInt(e.key)-1;if(idx<BUILDINGS.length){G.selectedTool=idx;G.demolishMode=false;sfxBtn()}}
    if(k==='7'){G.showAchievements=!G.showAchievements;sfxBtn();return}
    if(k==='8'){G.showBuildingInfo=!G.showBuildingInfo;sfxBtn();return}
    if(k==='enter'){buildFromKeyboard()}
    if(k==='z'){undoLast()}
    if(k==='x'){G.selectedTool=-1;G.demolishMode=false}
    if(k==='v'){G.demolishMode=!G.demolishMode;if(G.demolishMode)G.selectedTool=-1;sfxBtn()}
    if(k==='c'){
        if(G.selectedCell){
            const r=G.selectedCell.r,c=G.selectedCell.c;
            demolishAt(r,c);
        }
    }
});
window.addEventListener('keyup',function(e){G.keys[e.key.toLowerCase()]=false});

canvas.addEventListener('mousedown',e=>onPointerDown(getPos(e)));
canvas.addEventListener('mousemove',e=>onPointerMove(getPos(e)));
canvas.addEventListener('mouseup',e=>onPointerUp(getPos(e)));
canvas.addEventListener('touchstart',function(e){e.preventDefault();onPointerDown(getPos(e))},{passive:false});
canvas.addEventListener('touchmove',function(e){e.preventDefault();onPointerMove(getPos(e))},{passive:false});
canvas.addEventListener('touchend',function(e){e.preventDefault();onPointerUp(getPos(e))},{passive:false});

function loop(){
    update();
    draw();
}
setInterval(loop,16);

const _sbtn=document.getElementById('start-game-btn');
_sbtn.addEventListener('click',function(){initAudio();startGame();this.style.display='none';});

})();

<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
