<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>医院经理</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a1929;font-family:"Microsoft YaHei",sans-serif;display:flex;justify-content:center;min-height:100vh;overflow:auto;padding:10px 0;}
#wrap{width:100%;max-width:980px;}
#game{background:#132744;border:2px solid #1e4976;border-radius:12px;padding:10px;}
#hud{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-bottom:8px;}
.cd{background:#0d2137;border:1px solid #1e4976;border-radius:7px;padding:6px;text-align:center;}
.cd .lb{font-size:10px;color:#90caf9;}
.cd .vl{font-size:17px;font-weight:bold;margin-top:1px;}
.mo .vl{color:#ffd54f;}
.pa .vl{color:#81c784;}
.re .vl{color:#ba68c8;}
.st .vl{color:#f48fb1;}
.cu .vl{color:#4fc3f7;}
.dy .vl{color:#ffb74d;}
#cv{display:block;border:2px solid #1e4976;border-radius:8px;max-width:100%;height:auto;background:#08101d;margin:0 auto;}
#tabs{display:flex;gap:4px;margin:8px 0;flex-wrap:wrap;}
.tb{padding:6px 12px;background:#0d2137;border:1px solid #1e4976;border-radius:6px;color:#90caf9;cursor:pointer;font-size:12px;}
.tb.on{background:#1976d2;color:#fff;border-color:#4fc3f7;}
#shop{background:#0d2137;border:1px solid #1e4976;border-radius:8px;padding:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;}
.it{background:#132744;border:1px solid #2c5282;border-radius:6px;padding:7px;text-align:center;cursor:pointer;transition:0.15s;user-select:none;}
.it:hover:not(.no){background:#1e4976;transform:translateY(-1px);}
.it.sel{border-color:#ffd54f;background:#1a3356;box-shadow:0 0 8px rgba(255,213,79,0.3);}
.it.no{opacity:0.4;cursor:not-allowed;}
.it .ic{font-size:22px;}
.it .nm{font-size:11px;color:#e3f2fd;margin:2px 0;}
.it .pr{font-size:10px;color:#ffd54f;}
.it .ex{font-size:9px;color:#90caf9;}
#bt{display:grid;grid-template-columns:1.2fr 1fr;gap:8px;margin-top:8px;}
.pn{background:#0d2137;border:1px solid #1e4976;border-radius:8px;padding:9px;color:#e3f2fd;font-size:12px;line-height:1.7;}
.pn .hd{color:#4fc3f7;font-weight:bold;font-size:13px;margin-bottom:5px;padding-bottom:4px;border-bottom:1px solid #1e4976;}
.lg{max-height:95px;overflow-y:auto;background:#050d18;border-radius:5px;padding:5px;font-size:11px;}
.lg div{padding:2px 0;border-bottom:1px dashed #1e4976;color:#90caf9;}
.bn{background:linear-gradient(180deg,#1976d2,#0d47a1);color:#fff;border:1px solid #42a5f5;padding:7px 13px;border-radius:6px;cursor:pointer;font-size:12px;margin:2px;}
.bn:hover{filter:brightness(1.15);}
.bn:active{transform:scale(0.97);}
.bn.ok{background:linear-gradient(180deg,#43a047,#1b5e20);}
.bn.dn{background:linear-gradient(180deg,#e53935,#b71c1c);}
.bn.gd{background:linear-gradient(180deg,#f9a825,#f57f17);}
#ss,#sp,#se{position:fixed;inset:0;background:rgba(5,13,24,0.97);z-index:2000;display:flex;flex-direction:column;align-items:center;justify-content:center;}
#ss h1{font-size:50px;color:#4fc3f7;text-shadow:0 0 20px rgba(79,195,247,0.5),2px 2px 0 #0d47a1;margin-bottom:10px;letter-spacing:3px;}
#ss .sb{color:#90caf9;font-size:17px;margin-bottom:28px;}
#start-game-btn{background:linear-gradient(180deg,#1976d2,#0d47a1);color:#fff;font-size:22px;padding:15px 65px;border:2px solid #4fc3f7;border-radius:12px;cursor:pointer;font-weight:bold;letter-spacing:2px;box-shadow:0 6px 20px rgba(25,118,210,0.4);}
#start-game-btn:hover{transform:scale(1.05);filter:brightness(1.1);}
.gd{margin-top:28px;color:#78909c;font-size:13px;max-width:460px;text-align:center;line-height:1.9;padding:14px;border:1px solid #1e4976;border-radius:10px;background:rgba(13,33,55,0.5);}
.hsb{margin-top:18px;padding:9px 22px;border:1px solid #ffd54f;border-radius:8px;color:#ffd54f;background:rgba(255,213,79,0.06);}
#sp h2,#se h2{font-size:33px;color:#4fc3f7;margin-bottom:24px;}
.lgb{padding:11px 40px;margin:6px;font-size:16px;border:none;border-radius:8px;cursor:pointer;color:#fff;font-weight:bold;}
.sst{color:#e3f2fd;font-size:16px;line-height:2.1;background:rgba(13,33,55,0.6);padding:20px 30px;border-radius:11px;border:1px solid #2c5282;margin:18px 0;}
/* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */
/* [BATCH-FIX:ad-components-css] */
.sponsor-btn{position:fixed;top:44px;right:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:3px 9px;border-radius:10px;font:11px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.sponsor-panel.show{display:flex}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.interstitial-ad.show{display:flex}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* [/BATCH-FIX:ad-components-css] */
</style>
</head>

• 【人员】雇佣医生、护士提升治疗能力<br>

<script>
if(typeof STATE_MENU==='undefined')var STATE_MENU=0;
if(typeof STATE_PLAYING==='undefined')var STATE_PLAYING=1;
if(typeof STATE_OVER==='undefined')var STATE_OVER=2;
if(typeof STATE_PAUSE==='undefined')var STATE_PAUSE=3;
</script>
<script src="../game_core.js"></script>
<script>
(function(){var S=window.Storage;if(!S||typeof S.load!=='function'){S={load:function(k,d){try{return JSON.parse(localStorage.getItem(k))}catch(e){return d}},save:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};window.Storage=S;}})();
var cv=document.getElementById('cv'),cx=cv.getContext('2d'),W=cv.width,H=cv.height;
var st=STATE_MENU,G,cat=0,sel=null,tm=null,pts=[],onD=false,dp=0;
function rs(){var m=Math.min(window.innerWidth-30,980);if(W>m){cv.style.width=m+'px';cv.style.height=(H*m/W)+'px';}}
rs();window.addEventListener('resize',rs);

var STF=[
  {id:'doc1',n:'实习医生',ic:'👨‍⚕️',cost:800,sl:50,spd:1,qu:0.8,un:0,dept:'全科'},
  {id:'doc2',n:'主治医师',ic:'👩‍⚕️',cost:2000,sl:120,spd:2,qu:1.0,un:5,dept:'全科'},
  {id:'doc3',n:'专家医师',ic:'🧑‍⚕️',cost:5000,sl:250,spd:3,qu:1.3,un:15,dept:'专科'},
  {id:'nur1',n:'护士',ic:'👩‍⚕️',cost:500,sl:35,spd:1,qu:0.6,un:0,dept:'护理'},
  {id:'nur2',n:'护士长',ic:'👩‍✈️',cost:1500,sl:80,spd:2,qu:0.9,un:8,dept:'护理'},
  {id:'rec',n:'前台',ic:'💁',cost:400,sl:25,spd:0,qu:0,un:0,dept:'行政',cap:5},
  {id:'phm',n:'药剂师',ic:'🧑‍🔬',cost:1200,sl:70,spd:0,qu:0,un:6,dept:'药房',drug:1},
  {id:'cln',n:'清洁工',ic:'🧹',cost:300,sl:20,spd:0,qu:0,un:0,dept:'后勤',hp:1}
];
var FCL=[
  {id:'bed',n:'普通病床',ic:'🛏️',cost:600,cap:1,un:0,eff:1},
  {id:'bed2',n:'VIP病床',ic:'🛋️',cost:2000,cap:1,un:8,eff:3,inc:2},
  {id:'or',n:'手术室',ic:'🏥',cost:8000,cap:1,un:12,eff:2,spc:1},
  {id:'lab',n:'化验室',ic:'🔬',cost:4000,cap:1,un:10,qu:0.2},
  {id:'rx',n:'药房',ic:'💊',cost:2500,cap:1,un:4,drg:100},
  {id:'er',n:'急诊室',ic:'🚑',cost:6000,cap:3,un:15,eff:1.5,inc:1.5},
  {id:'mr',n:'核磁共振',ic:'📷',cost:15000,cap:1,un:25,inc:3,eff:2},
  {id:'cnt',n:'食堂',ic:'🍱',cost:3000,cap:0,un:10,hp:5,inc:0.1}
];
var MEDS=[
  {id:'p1',n:'感冒药',ic:'💊',cost:20,qty:50,use:1,un:0,dis:'感冒'},
  {id:'p2',n:'止痛药',ic:'💉',cost:30,qty:30,use:1,un:0,dis:'头痛'},
  {id:'p3',n:'抗生素',ic:'💊',cost:60,qty:20,use:1,un:4,dis:'感染'},
  {id:'p4',n:'心脏药',ic:'❤️',cost:100,qty:15,use:2,un:10,dis:'心脏病'},
  {id:'p5',n:'消炎药',ic:'💊',cost:50,qty:25,use:1,un:3,dis:'发炎'},
  {id:'p6',n:'输液包',ic:'🧪',cost:80,qty:20,use:2,un:6,dis:'重症'},
  {id:'p7',n:'手术包',ic:'🔪',cost:500,qty:10,use:5,un:15,dis:'手术'}
];
var TECH=[
  {id:'t1',n:'电子病历',ic:'📋',cost:3000,eff:0.2,un:5,one:1},
  {id:'t2',n:'远程会诊',ic:'📺',cost:5000,eff:0.3,un:10,one:1},
  {id:'t3',n:'AI诊断',ic:'🤖',cost:15000,eff:0.5,qu:0.2,un:20,one:1},
  {id:'t4',n:'基因疗法',ic:'🧬',cost:30000,eff:0.8,qu:0.5,un:35,one:1},
  {id:'t5',n:'医疗培训',ic:'🎓',cost:2000,qu:0.1,un:3,one:1}
];
var ALL=[STF,FCL,MEDS,TECH];

var DISEASES=[
  {n:'感冒',ic:'🤒',sev:1,dr:'p1',fee:50,time:3,fr:30},
  {n:'头痛',ic:'😣',sev:1,dr:'p2',fee:60,time:2,fr:20},
  {n:'骨折',ic:'🦴',sev:2,dr:'p2',fee:300,time:6,fr:12},
  {n:'感染',ic:'🦠',sev:2,dr:'p3',fee:180,time:5,fr:15},
  {n:'发炎',ic:'🫁',sev:2,dr:'p5',fee:150,time:4,fr:14},
  {n:'心脏病',ic:'❤️‍🩹',sev:3,dr:'p4',fee:800,time:8,fr:6,need:1},
  {n:'重症',ic:'🏥',sev:3,dr:'p6',fee:600,time:7,fr:8,need:1},
  {n:'手术',ic:'⚕️',sev:4,dr:'p7',fee:3000,time:12,fr:5,need:2}
];

function newG(){
  G={m:5000,d:1,cured:0,rep:10,total:0,beds:10,staff:{},fcl:{},med:{},tech:{},
    dayI:0,dayC:0,spd:1,qu:1,incM:1,capR:5,eff:0};
  G.staff.doc1=1;G.staff.nur1=2;G.staff.rec=1;G.fcl.bed=10;
  G.med={p1:30,p2:20,p3:0,p4:0,p5:10,p6:0,p7:0};
  calc();upd();rnd();lg('🏥 医院开业大吉！');
}
function calc(){
  G.beds=0;G.rep=0;G.spd=0;G.qu=0;G.incM=1;G.capR=5;G.drgCap=0;G.salary=0;G.hp=0;G.spc=0;
  var docs=0,nrs=0;
  for(var k in G.staff){for(var i=0;i<STF.length;i++){if(STF[i].id===k){var s=STF[i];
    var n=G.staff[k];G.salary+=s.sl*n;
    if(s.spd)G.spd+=s.spd*n;if(s.qu)G.qu+=s.qu*n;
    if(s.cap)G.capR+=s.cap*n;if(s.drg)G.drgCap+=s.drg*n;if(s.hp)G.hp+=s.hp*n;
    if(s.dept==='全科'||s.dept==='专科')docs+=n;if(s.dept==='护理')nrs+=n;
  }}}
  for(k in G.fcl){for(i=0;i<FCL.length;i++){if(FCL[i].id===k){var f=FCL[i],n2=G.fcl[k];
    G.beds+=f.cap*n2;if(f.inc)G.incM+=f.inc*0.1*n2;if(f.eff)G.spd+=f.eff*n2;if(f.qu)G.qu+=f.qu*n2;
    if(f.drg)G.drgCap+=f.drg*n2;if(f.hp)G.hp+=f.hp*n2;if(f.spc)G.spc+=f.spc*n2;
  }}}
  for(k in G.tech){for(i=0;i<TECH.length;i++){if(TECH[i].id===k&&G.tech[k]){var t=TECH[i];
    if(t.eff)G.spd*=(1+t.eff);if(t.qu)G.qu*=(1+t.qu);
  }}}
  G.stCnt=docs+'/'+nrs;
  var baseRep=Math.min(50,G.beds*0.3+docs*3+nrs*1.5);
  G.rep=Math.floor(baseRep+G.qu*5+G.hp*2);
  G.rep=Math.max(10,Math.min(100,G.rep));
}
function upd(){
  document.getElementById('vmo').textContent='$'+G.m;
  document.getElementById('vpa').textContent=G.cured;
  document.getElementById('vre').textContent=G.rep;
  document.getElementById('vst').textContent=G.stCnt||'0/0';
  document.getElementById('vcu').textContent=G.beds;
  document.getElementById('vdy').textContent=G.d;
  var med2=[],st2=[],f2=[];
  for(var k in G.med)if(G.med[k]>0){for(var i=0;i<MEDS.length;i++)if(MEDS[i].id===k)med2.push(MEDS[i].ic+G.med[k]);}
  for(k in G.staff)for(i=0;i<STF.length;i++)if(STF[i].id===k&&G.staff[k])st2.push(STF[i].ic+G.staff[k]);
  for(k in G.fcl)for(i=0;i<FCL.length;i++)if(FCL[i].id===k&&G.fcl[k])f2.push(FCL[i].ic+G.fcl[k]);
  document.getElementById('inf').innerHTML='日薪支出: <b style="color:#ef5350">$'+G.salary+'</b> | 医疗速度: <b>'+G.spd.toFixed(1)+'x</b> | 质量: <b>'+G.qu.toFixed(1)+'x</b><br>'
    +'员工: '+st2.join(' ')+'<br>'
    +'设施: '+f2.join(' ')+'<br>'
    +'药品: '+med2.join(' ');
}
function lg(m){var el=document.getElementById('lg');var d=document.createElement('div');d.textContent='[D'+G.d+'] '+m;el.insertBefore(d,el.firstChild);while(el.children.length>15)el.removeChild(el.lastChild);}
function rnd(){
  var el=document.getElementById('shop');el.innerHTML='';var lst=ALL[cat];
  for(var i=0;i<lst.length;i++)(function(it){
    var d=document.createElement('div');var lk=it.un&&G.rep<it.un;
    var oneD=it.one&&G.tech[it.id];var di=false;
    if(cat===2)di=false;else di=(lk||oneD);
    d.className='it'+(sel===it.id?' sel':'')+(di?' no':'');
    var pr='';
    if(cat===0){var c=G.staff[it.id]||0;pr='$'+it.cost+'(雇) 日$'+it.sl+' [x'+c+']';}
    else if(cat===1){c=G.fcl[it.id]||0;pr='$'+it.cost+' [x'+c+']';}
    else if(cat===2){pr='$'+it.cost+'/'+it.qty+'份';}
    else{pr='$'+it.cost+(oneD?' (已研究)':'');}
    d.innerHTML='<div class="ic">'+it.ic+'</div><div class="nm">'+it.n+'</div><div class="pr">'+pr+'</div>'+
      (it.un?'<div class="ex">⭐'+it.un+'解锁</div>':'');
    d.onclick=function(){
      if(lk){GameCore.hints.show('需要声誉⭐'+it.un);return;}
      if(oneD){GameCore.hints.show('已研究');return;}
      if(G.m<it.cost){GameCore.hints.show('资金不足！');return;}
      if(cat===0){G.m-=it.cost;G.staff[it.id]=(G.staff[it.id]||0)+1;lg('👤 雇佣 '+it.ic+it.n+' -$'+it.cost);}
      else if(cat===1){G.m-=it.cost;G.fcl[it.id]=(G.fcl[it.id]||0)+1;lg('🏗️ 购买 '+it.ic+it.n+' -$'+it.cost);}
      else if(cat===2){G.m-=it.cost;G.med[it.id]=(G.med[it.id]||0)+it.qty;lg('💊 采购 '+it.ic+it.n+' +'+it.qty+' -$'+it.cost);}
      else{G.m-=it.cost;G.tech[it.id]=1;lg('🔬 研究完成: '+it.ic+it.n+' -$'+it.cost);}
      calc();upd();rnd();
    };el.appendChild(d);
  })(lst[i]);
}
document.querySelectorAll('.tb').forEach(function(t){t.onclick=function(){
  document.querySelectorAll('.tb').forEach(function(x){x.classList.remove('on');});
  t.classList.add('on');cat=parseInt(t.dataset.c);sel=null;rnd();};});
function pickDisease(){
  var tf=0,av=[];for(var i=0;i<DISEASES.length;i++){tf+=DISEASES[i].fr;av.push(tf);}
  var r=Math.random()*tf;for(i=0;i<av.length;i++)if(r<av[i])return DISEASES[i];
  return DISEASES[0];
}
function startD(){
  if(st!==STATE_PLAYING||onD)return;
  onD=true;dp=0;pts=[];G.dayI=0;G.dayC=0;
  var nPts=Math.min(G.capR*3,3+Math.floor(G.rep/8)+Math.floor(Math.random()*5));
  var spawned=0,spdMax=G.spd||1;
  var int1=setInterval(function(){
    if(st!==STATE_PLAYING||!onD){clearInterval(int1);return;}
    if(spawned>=nPts){clearInterval(int1);return;}
    if(pts.filter(function(p){return!p.done&&!p.left;}).length>=G.beds)return;
    var dis=pickDisease();
    if(dis.need===2&&G.spc<1){dis=DISEASES[2];}
    if(dis.need===1&&G.spc<1&&Math.random()<0.5){dis=DISEASES[0];}
    var fee=Math.floor(dis.fee*G.incM*(0.8+G.qu*0.2));
    var p={dis:dis,x:-30,y:90+Math.random()*(H-170),tx:100+Math.random()*180,ty:90+Math.random()*(H-170),
      fee:fee,prog:0,spd:spdMax,done:false,left:false,arv:false,med:false,ang:0,boost:0};
    pts.push(p);spawned++;
  },700);
  upd();
}
function draw(){
  cx.fillStyle='#08101d';cx.fillRect(0,0,W,H);
  cx.fillStyle='#0d2137';cx.fillRect(0,0,W,80);
  cx.fillStyle='#1565c0';cx.fillRect(0,75,W,5);
  cx.font='13px sans-serif';cx.fillStyle='#4fc3f7';cx.textAlign='left';
  cx.fillText('🏥 前台 / 分诊台  |  病床: '+pts.filter(function(p){return p.arv&&!p.done&&!p.left;}).length+'/'+G.beds,12,45);
  cx.fillStyle='#90caf9';cx.font='11px sans-serif';
  cx.fillText('💰 今日收入: $'+G.dayI+' | 治愈: '+G.dayC,12,22);
  cx.textAlign='right';cx.fillText(onD?('⏱️ 营业中 '+Math.floor(dp)+'%'):'🌙 休息中',W-15,45);
  cx.strokeStyle='#1a3356';cx.lineWidth=1;
  for(var y=100;y<H-20;y+=65){cx.beginPath();cx.moveTo(30,y);cx.lineTo(W-30,y);cx.stroke();}
  for(var x=60;x<W-30;x+=110){cx.beginPath();cx.moveTo(x,85);cx.lineTo(x,H-20);cx.stroke();}
  for(var i=0;i<Math.min(G.beds,50);i++){
    var rr=Math.floor(i/8),cc=i%8;var bx=80+cc*110,by=115+rr*65;
    cx.font='20px sans-serif';cx.textAlign='center';cx.globalAlpha=0.35;
    cx.fillText('🛏️',bx,by);cx.globalAlpha=1;
  }
  var oc={};
  for(var i=0;i<pts.length;i++){var p=pts[i];if(!p.left&&p.arv&&!p.done){
    for(var rr=0;rr<8;rr++)for(var cc=0;cc<8;cc++){var k=rr+'-'+cc;
      if(!oc[k]){oc[k]=1;p.slot={r:rr,c:cc};p.tx=80+cc*110;p.ty=115+rr*65;break;}
    }
  }}
  for(i=0;i<pts.length;i++){
    var p2=pts[i];if(p2.left)continue;
    if(!p2.arv){p2.x+=(p2.tx-p2.x)*0.05;p2.y+=(p2.ty-p2.y)*0.05;
      if(Math.abs(p2.x-p2.tx)<3&&Math.abs(p2.y-p2.ty)<3)p2.arv=true;
    }
    cx.font='26px sans-serif';cx.textAlign='center';
    var md=p2.done?'😀':(p2.med?'🤕':p2.dis.ic);
    cx.fillText(md,p2.x,p2.y);
    cx.font='13px sans-serif';cx.fillStyle='#fff';
    cx.fillText(p2.dis.ic,p2.x,p2.y-26);
    cx.font='11px sans-serif';cx.fillStyle='$'+p2.fee;
    var col=p2.done?'#81c784':'#4fc3f7';cx.fillStyle=col;
    cx.fillText('$'+p2.fee,p2.x,p2.y+18);
    if(p2.arv&&!p2.done&&!p2.left){
      cx.fillStyle='#1a237e';cx.fillRect(p2.x-18,p2.y+22,36,4);
      cx.fillStyle=p2.med?'#66bb6a':'#42a5f5';cx.fillRect(p2.x-18,p2.y+22,36*p2.prog,4);
    }
    if(p2.arv&&!p2.left){
      var have=G.med[p2.dis.dr]>=p2.dis.use;
      if(!p2.med&&have&&G.spd>0){G.med[p2.dis.dr]-=p2.dis.use;p2.med=true;}
      else if(!p2.med&&!have){p2.ang++;if(p2.ang>400){p2.left=true;G.rep=Math.max(10,G.rep-2);
        lg('😠 '+p2.dis.n+'无药，病人愤怒离开！(声誉-2)');}}
      else if(p2.med&&!p2.done){
        var s2=p2.spd+p2.boost;p2.prog+=0.004*s2/p2.dis.time*10;
        if(p2.prog>=1){
          p2.done=true;var ok=Math.random()<(0.7+G.qu*0.05);
          var gain=p2.fee+(ok?Math.floor(p2.fee*0.3):0);
          G.m+=gain;G.dayI+=gain;G.total+=gain;G.cured++;G.dayC++;
          if(ok)G.rep=Math.min(100,G.rep+1);
          lg((ok?'✅':'🆗')+' 治愈 '+p2.dis.ic+p2.dis.n+' +$'+gain+(ok?' (加赏$'+Math.floor(p2.fee*0.3)+')':''));
          setTimeout(function(pp){return function(){pp.left=true;};}(p2),600);
          upd();
        }
      }
    }
  }
  if(onD){dp+=0.25;
    if(dp>=100&&pts.every(function(p){return p.left||p.done;}))endD();
    if(dp>=140)endD();
  }
}
function endD(){
  if(!onD)return;onD=false;
  G.m-=G.salary;lg('💼 发放薪水 -$'+G.salary);
  var ren=Math.floor(G.beds*10+G.total*0.005);G.m-=ren;lg('🏢 租金水电 -$'+ren);
  var w=0;for(var k in G.med){var l=Math.floor(G.med[k]*0.03);w+=l;G.med[k]=Math.max(0,G.med[k]-l);}
  if(w>0)lg('💊 药品过期损耗 约'+w+'份');
  G.d++;
  Storage.save('hosp_hs',Math.max(Storage.load('hosp_hs',0),G.total));
  if(G.d>=60&&G.rep>=80){endG(true,'医疗大亨');return;}
  if(G.m<-5000){endG(false,'资金破产');return;}
  if(G.d>=100){endG(true,'终身成就');return;}
  pts=[];calc();upd();rnd();
}
function endG(w,t){
  st=STATE_OVER;
  Storage.save('hosp_hs',Math.max(Storage.load('hosp_hs',0),G.total));
  document.getElementById('et').textContent=w?'🎊 '+t:'💔 '+t;
  document.getElementById('es').innerHTML='经营天数: <b>'+G.d+'</b><br>累计收入: <b style="color:#ffd54f">$'+G.total+'</b><br>'
    +'总治愈数: <b>'+G.cured+'</b><br>最终声誉: <b>⭐'+G.rep+'</b>';
  document.getElementById('se').style.display='flex';
}
cv.addEventListener('click',function(e){
  if(!onD||st!==STATE_PLAYING)return;
  var rc=cv.getBoundingClientRect(),sx=cv.width/rc.width,sy=cv.height/rc.height;
  var mx=(e.clientX-rc.left)*sx,my=(e.clientY-rc.top)*sy;
  for(var i=pts.length-1;i>=0;i--){var p=pts[i];if(p.left||p.done||!p.arv)continue;
    if(Math.abs(mx-p.x)<28&&Math.abs(my-p.y)<30){p.boost+=0.5;setTimeout(function(pp){pp.boost-=0.5;},2000,p);
    GameCore.hints.show('⚡ 加速治疗！');break;}
  }
});
document.addEventListener('keydown',function(e){
  if(e.key===' '){e.preventDefault();startD();}
  else if(e.key==='p'||e.key==='P')ps();
});
document.getElementById('btnDay').onclick=startD;
document.getElementById('btnP').onclick=ps;
document.getElementById('btnRe').onclick=ps;
document.getElementById('btnRe2').onclick=function(){location.reload();};
document.getElementById('btnRs').onclick=function(){if(confirm('重新开始？'))location.reload();};
document.getElementById('btnAg').onclick=function(){location.reload();};
document.getElementById('btnSv').onclick=function(){Storage.save('hosp_save',G);GameCore.hints.show('已保存！');};
function ps(){
  if(st===STATE_PLAYING){st=STATE_PAUSE;document.getElementById('sp').style.display='flex';}
  else if(st===STATE_PAUSE){st=STATE_PLAYING;document.getElementById('sp').style.display='none';}
}
function str(){
  var sv=Storage.load('hosp_save',null);
  if(sv&&confirm('读取存档？'))G=sv;else newG();
  document.getElementById('ss').style.display='none';st=STATE_PLAYING;
  if(tm)clearInterval(tm);tm=setInterval(draw,30);
  calc();upd();rnd();
}
document.getElementById('start-game-btn').addEventListener('click',str);
document.getElementById('hs').textContent=Storage.load('hosp_hs',0);
GameCore.init({highScore:'hospital'});
</script>

<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
