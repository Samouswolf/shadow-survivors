<html lang="zh-CN">
<head>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0d3b66;font-family:"Microsoft YaHei",sans-serif;min-height:100vh;overflow:auto;padding:10px 0;}
#wrap{width:100%;max-width:960px;margin:0 auto;}
#gm{background:#14487a;border:2px solid #2a6fad;border-radius:12px;padding:10px;}
.hd{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:8px;}
.cd{background:#0a2540;border:1px solid #2a6fad;border-radius:7px;padding:7px;text-align:center;}
.cd .l{font-size:10px;color:#90caf9;}
.cd .v{font-size:17px;font-weight:bold;margin-top:2px;}
.mo .v{color:#ffd54f;}
.st .v{color:#a5d6a7;}
.te .v{color:#f06292;}
.sc .v{color:#ce93d8;}
.gp .v{color:#81d4fa;}
.dy .v{color:#fff176;}
#cv{display:block;border:2px solid #2a6fad;border-radius:8px;max-width:100%;height:auto;background:#051525;margin:0 auto;}
#tb{display:flex;gap:4px;margin:8px 0;flex-wrap:wrap;}
.tg{padding:6px 12px;background:#0a2540;border:1px solid #2a6fad;border-radius:6px;color:#90caf9;cursor:pointer;font-size:12px;}
.tg.on{background:#1976d2;color:#fff;border-color:#64b5f6;}
#sh{background:#0a2540;border:1px solid #2a6fad;border-radius:8px;padding:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:6px;}
.it{background:#14487a;border:1px solid #2a6fad;border-radius:6px;padding:7px;text-align:center;cursor:pointer;transition:0.15s;}
.it:hover:not(.no){background:#1976d2;transform:translateY(-1px);}
.it.sl{border-color:#ffd54f;background:#0d47a1;box-shadow:0 0 8px rgba(255,213,79,0.35);}
.it.no{opacity:0.4;cursor:not-allowed;}
.it .ic{font-size:23px;}
.it .nm{font-size:11px;color:#e3f2fd;margin:2px 0;}
.it .pr{font-size:10px;color:#ffd54f;}
.it .xt{font-size:9px;color:#90caf9;}
#bm{display:grid;grid-template-columns:1.2fr 1fr;gap:8px;margin-top:8px;}
.pn{background:#0a2540;border:1px solid #2a6fad;border-radius:8px;padding:9px;color:#e3f2fd;font-size:12px;line-height:1.7;}
.pn .hh{color:#64b5f6;font-weight:bold;font-size:13px;margin-bottom:5px;padding-bottom:4px;border-bottom:1px solid #2a6fad;}
.lg{max-height:100px;overflow-y:auto;background:#030d18;border-radius:5px;padding:5px;font-size:11px;}
.lg div{padding:2px 0;border-bottom:1px dashed #2a6fad;color:#90caf9;}
.bt{background:linear-gradient(180deg,#1976d2,#0d47a1);color:#fff;border:1px solid #42a5f5;padding:7px 13px;border-radius:6px;cursor:pointer;font-size:12px;margin:2px;}
.bt:hover{filter:brightness(1.15);}
.bt:active{transform:scale(0.97);}
.bt.g{background:linear-gradient(180deg,#43a047,#1b5e20);}
.bt.r{background:linear-gradient(180deg,#d32f2f,#b71c1c);}
.bt.y{background:linear-gradient(180deg,#f9a825,#f57f17);}
#ss,#sp,#se{position:fixed;inset:0;background:rgba(3,13,24,0.97);z-index:2000;display:flex;flex-direction:column;align-items:center;justify-content:center;}
#ss h1{font-size:48px;color:#64b5f6;text-shadow:0 0 20px rgba(100,181,246,0.5),3px 3px 0 #0d47a1;margin-bottom:10px;letter-spacing:3px;}
#ss .sb{color:#90caf9;font-size:17px;margin-bottom:28px;}
#start-game-btn{background:linear-gradient(180deg,#2196f3,#1565c0);color:#fff;font-size:22px;padding:15px 65px;border:2px solid #64b5f6;border-radius:12px;cursor:pointer;font-weight:bold;letter-spacing:2px;box-shadow:0 6px 20px rgba(33,150,243,0.45);}
#start-game-btn:hover{transform:scale(1.05);filter:brightness(1.1);}
.gd{margin-top:28px;color:#78909c;font-size:13px;max-width:450px;text-align:center;line-height:1.9;padding:14px;border:1px solid #2a6fad;border-radius:10px;background:rgba(10,37,64,0.5);}
.hsb{margin-top:18px;padding:10px 24px;border:1px solid #ffd54f;border-radius:8px;color:#ffd54f;background:rgba(255,213,79,0.07);}
#sp h2,#se h2{font-size:33px;color:#64b5f6;margin-bottom:24px;}
.lgb{padding:11px 42px;margin:6px;font-size:16px;border:none;border-radius:8px;cursor:pointer;color:#fff;font-weight:bold;}
.sst{color:#e3f2fd;font-size:16px;line-height:2.1;background:rgba(10,37,64,0.6);padding:20px 30px;border-radius:11px;border:1px solid #2a6fad;margin:18px 0;}
/* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */
/* [BATCH-FIX:ad-components-css] */
.sponsor-btn{position:fixed;bottom:8px;left:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:2px 6px;border-radius:10px;font:10px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.sponsor-panel.show{display:flex}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.interstitial-ad.show{display:flex}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* [/BATCH-FIX:ad-components-css] */

/* [AD-FIX:responsive] */
@media (max-width:768px){.ad-banner-container{display:none!important}.sponsor-btn{transform:scale(.8);opacity:.6}}
/* [/AD-FIX:responsive] */
</style>
</head>

<div id="ss">
<h1>🏫 学校校长</h1>
<div class="sb">建设校园 · 培养人才 · 争创百年名校</div>

• 【建筑】建造教室、宿舍、实验室等增加容量<br>

<script>
if(typeof STATE_MENU==='undefined')var STATE_MENU=0;
if(typeof STATE_PLAYING==='undefined')var STATE_PLAYING=1;
if(typeof STATE_OVER==='undefined')var STATE_OVER=2;
if(typeof STATE_PAUSE==='undefined')var STATE_PAUSE=3;
</script>
<script src="../game_core.js"></script>
<script>
(function(){var S=window.Storage;if(!S||typeof S.load!=='function'){S={load:function(k,d){try{return JSON.parse(localStorage.getItem(k))}catch(e){return d}},save:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};window.Storage=S;}})();
var cv=document.getElementById('cv'),cx=cv.getContext('2d'),W=cv.width,H=cv.height;
var st=STATE_MENU,G,cat=0,sel=null,tm=null,stu=[],onD=false,dp=0;
function rs(){var m=Math.min(window.innerWidth-30,960);if(W>m){cv.style.width=m+'px';cv.style.height=(H*m/W)+'px';}}
rs();window.addEventListener('resize',rs);

var BLD=[
  {id:'c1',n:'普通教室',ic:'🏫',cost:800,cap:30,un:0,tch:1,sc:1,ty:'class'},
  {id:'c2',n:'多媒体教室',ic:'🖥️',cost:2000,cap:40,un:5,tch:1,sc:3,ty:'class'},
  {id:'c3',n:'实验室',ic:'🔬',cost:4000,cap:25,un:10,tch:1,sc:6,ty:'class'},
  {id:'c4',n:'音乐教室',ic:'🎹',cost:2500,cap:20,un:6,tch:1,sc:3,gp:3,ty:'art'},
  {id:'c5',n:'美术室',ic:'🎨',cost:2500,cap:20,un:6,tch:1,sc:3,gp:3,ty:'art'},
  {id:'d1',n:'学生宿舍',ic:'🛏️',cost:1500,cap:40,un:0,ty:'dorm',gp:2},
  {id:'d2',n:'教师公寓',ic:'🏠',cost:2000,cap:0,un:4,ty:'staff',tchQ:0.5},
  {id:'l1',n:'图书馆',ic:'📚',cost:5000,cap:0,un:8,sc:8,gp:5,ty:'lib'},
  {id:'g1',n:'体育馆',ic:'🏀',cost:3500,cap:0,un:7,sc:3,gp:8,ty:'gym'},
  {id:'c6',n:'计算机房',ic:'💻',cost:6000,cap:30,un:12,tch:1,sc:10,ty:'tech'},
  {id:'p1',n:'操场',ic:'🏃',cost:1000,cap:0,un:2,gp:5,ty:'play'},
  {id:'f1',n:'食堂',ic:'🍱',cost:2000,cap:0,un:3,gp:8,ty:'food'}
];
var HR=[
  {id:'t1',n:'语文老师',ic:'📖',cost:1000,sl:60,un:0,sj:'ch',sc:1,Q:1},
  {id:'t2',n:'数学老师',ic:'📐',cost:1000,sl:60,un:0,sj:'ma',sc:1,Q:1},
  {id:'t3',n:'英语老师',ic:'🔤',cost:1200,sl:70,un:1,sj:'en',sc:1,Q:1},
  {id:'t4',n:'物理老师',ic:'⚛️',cost:1500,sl:90,un:4,sj:'ph',sc:2,Q:1},
  {id:'t5',n:'化学老师',ic:'🧪',cost:1500,sl:90,un:4,sj:'ch',sc:2,Q:1},
  {id:'t6',n:'音乐老师',ic:'🎵',cost:1200,sl:70,un:3,sj:'mu',sc:1,Q:1,gp:2},
  {id:'t7',n:'美术老师',ic:'🖼️',cost:1200,sl:70,un:3,sj:'ar',sc:1,Q:1,gp:2},
  {id:'t8',n:'体育老师',ic:'⚽',cost:1000,sl:60,un:2,sj:'pe',sc:0,Q:1,gp:5},
  {id:'t9',n:'特级教师',ic:'🎓',cost:5000,sl:250,un:15,sj:'xx',sc:5,Q:2,gp:3},
  {id:'a1',n:'校医',ic:'👩‍⚕️',cost:1500,sl:80,un:6,sj:'xx',sc:0,Q:0,hp:10},
  {id:'a2',n:'后勤',ic:'🧹',cost:500,sl:30,un:0,sj:'xx',sc:0,Q:0,gp:3}
];
var CR=[
  {id:'k1',n:'语文强化',ic:'📖',cost:500,sc:5,un:0,one:1,sj:'ch'},
  {id:'k2',n:'奥数培训',ic:'🧮',cost:800,sc:8,un:3,one:1,sj:'ma'},
  {id:'k3',n:'英语口语',ic:'🌍',cost:600,sc:6,un:2,one:1,sj:'en'},
  {id:'k4',n:'科学实验',ic:'🔬',cost:1200,sc:12,un:8,one:1},
  {id:'k5',n:'艺术培养',ic:'🎭',cost:700,gp:10,un:5,one:1},
  {id:'k6',n:'体育训练',ic:'🏆',cost:600,gp:8,sc:2,un:4,one:1},
  {id:'k7',n:'编程启蒙',ic:'💻',cost:1500,sc:15,un:12,one:1}
];
var UPG=[
  {id:'u1',n:'智慧校园',ic:'📶',cost:5000,un:10,one:1,sc:10,gp:5},
  {id:'u2',n:'校园绿化',ic:'🌳',cost:2000,un:3,one:1,gp:10},
  {id:'u3',n:'安全系统',ic:'🛡️',cost:3000,un:6,one:1,gp:5,sc:2},
  {id:'u4',n:'名校合作',ic:'🤝',cost:15000,un:20,one:1,sc:30,gp:10},
  {id:'u5',n:'奖学金',ic:'🏅',cost:8000,un:15,one:1,sc:15,gp:8}
];
var ALL=[BLD,HR,CR,UPG];
var SJS={ch:'语文',ma:'数学',en:'英语',ph:'物理',ch2:'化学',mu:'音乐',ar:'美术',pe:'体育',xx:'综合'};
var SN=['小明','小红','小刚','小丽','小强','小芳','小军','小燕','小龙','小梅','小华','小杰','小丹','小亮','小琳','小涛','小雪','小峰','小萍','小龙','小伟','小美','小浩','小静','小建','小敏','小磊','小娟','小军','小辉'];

function newG(){
  G={m:5000,d:1,stu:0,teach:0,sc:60,gp:70,total:0,totCap:0,
    bld:{},hr:{},cr:{},upg:{},
    sjCap:{},sl:0,
    dayN:0,dayG:0,grid:[],tMod:1,Qmod:1,foodCap:0,libCap:0};
  G.GR=8;G.GC=14;G.CW=(W-40)/G.GC;G.CH=(H-80)/G.GR;
  for(var r=0;r<G.GR;r++){G.grid[r]=[];for(var c=0;c<G.GC;c++)G.grid[r][c]=null;}
  placeB(3,3,'c1');placeB(3,5,'c1');placeB(3,7,'d1');placeB(5,4,'p1');
  G.hr={t1:2,t2:2};
  G.m=5000;
  calc();upd();rnd();lg('🎓 开学啦！欢迎来到新学校！');
}
function placeB(r,c,id){if(G.grid[r][c])return;G.grid[r][c]=id;G.bld[id]=(G.bld[id]||0)+1;}
function calc(){
  G.totCap=0;G.teach=0;G.sl=0;G.scB=0;G.gpB=0;G.tMod=1;G.foodCap=0;G.libCap=0;G.staffCap=0;
  for(var k in G.bld){for(var i=0;i<BLD.length;i++){if(BLD[i].id===k){var b=BLD[i],n=G.bld[k];
    G.totCap+=b.cap?b.cap*n:0;G.teach+=b.tch?b.tch*n:0;
    G.scB+=b.sc?b.sc*n:0;G.gpB+=b.gp?b.gp*n:0;
    if(b.ty==='dorm'&&b.id==='d2')G.staffCap+=n;
    if(b.ty==='food')G.foodCap+=n;
    if(b.ty==='lib')G.libCap+=n;
  }}}
  var teN=0;
  for(k in G.hr){for(i=0;i<HR.length;i++){if(HR[i].id===k){var t=HR[i],n2=G.hr[k];
    G.sl+=t.sl*n2;if(t.sj!=='xx')teN+=n2;
    G.scB+=(t.sc||0)*n2*(t.Q||1);G.gpB+=(t.gp||0)*n2;
  }}}
  G.teach=Math.max(G.teach,teN);
  for(k in G.cr){for(i=0;i<CR.length;i++){if(CR[i].id===k&&G.cr[k]){var cc=CR[i];G.scB+=cc.sc||0;G.gpB+=cc.gp||0;}}
  for(k in G.upg){for(i=0;i<UPG.length;i++){if(UPG[i].id===k&&G.upg[k]){var u=UPG[i];G.scB+=u.sc||0;G.gpB+=u.gp||0;}}
  G.scCap=60+G.scB;
  G.gpCap=70+G.gpB;
  G.sc=Math.min(100,G.scCap);
  G.gp=Math.min(100,G.gpCap);
  if(G.libCap>0)G.tMod*=1.1;
}
function upd(){
  document.getElementById('vmo').textContent='$'+G.m;
  document.getElementById('vst').textContent=stu.length+'/'+G.totCap;
  var teN=0;for(var k in G.hr)teN+=G.hr[k];
  document.getElementById('vte').textContent=teN;
  var avg=100;if(stu.length>0){var tt=0;for(var i=0;i<stu.length;i++)tt+=stu[i].sc;avg=Math.floor(tt/stu.length);}
  document.getElementById('vsc').textContent=avg;
  document.getElementById('vgp').textContent=G.gp;
  document.getElementById('vdy').textContent=G.d;
  var b1=[],t1=[],c1=[];
  for(k in G.bld)for(i=0;i<BLD.length;i++)if(BLD[i].id===k)b1.push(BLD[i].ic+G.bld[k]);
  for(k in G.hr)for(i=0;i<HR.length;i++)if(HR[i].id===k)t1.push(HR[i].ic+G.hr[k]);
  for(k in G.cr)for(i=0;i<CR.length;i++)if(CR[i].id===k&&G.cr[k])c1.push(CR[i].ic);
  document.getElementById('if').innerHTML='教室容量: <b>'+G.totCap+'</b> 人 | 教师: <b>'+teN+'</b> 人<br>'
    +'工资支出: <b style="color:#ef5350">$'+G.sl+'</b>/学期 | 教师系数: '+G.teach+'<br>'
    +'建筑: '+b1.join(' ')+'<br>教师: '+t1.join(' ');
}
function lg(m){var el=document.getElementById('lg');var d=document.createElement('div');d.textContent='[T'+G.d+'] '+m;el.insertBefore(d,el.firstChild);while(el.children.length>15)el.removeChild(el.lastChild);}
function rnd(){
  var el=document.getElementById('sh');el.innerHTML='';var lst=ALL[cat];
  for(var i=0;i<lst.length;i++)(function(it){
    var d=document.createElement('div');var lk=it.un&&G.sc<it.un;
    var oneD=(it.one&&((cat===2&&G.cr[it.id])||(cat===3&&G.upg[it.id])));
    var no=lk||oneD;
    d.className='it'+(sel===it.id?' sl':'')+(no?' no':'');
    var pr='';
    if(cat===0){var c=G.bld[it.id]||0;pr='$'+it.cost+(it.cap?' 容量'+it.cap:'')+' [x'+c+']';}
    else if(cat===1){c=G.hr[it.id]||0;pr='$'+it.cost+' 薪$'+it.sl+' [x'+c+']';}
    else{pr='$'+it.cost+(oneD?' (已开设/研究)':'');}
    d.innerHTML='<div class="ic">'+it.ic+'</div><div class="nm">'+it.n+'</div><div class="pr">'+pr+'</div>'
      +(it.un?'<div class="xt">成绩'+it.un+'解锁</div>':'');
    d.onclick=function(){
      if(lk){GameCore.hints.show('需要成绩≥'+it.un);return;}
      if(oneD){GameCore.hints.show('已完成');return;}
      if(G.m<it.cost){GameCore.hints.show('经费不足！');return;}
      if(cat===0){sel=sel===it.id?null:it.id;}
      else if(cat===1){G.m-=it.cost;G.hr[it.id]=(G.hr[it.id]||0)+1;lg('👩‍🏫 聘请 '+it.ic+it.n+' -$'+it.cost);}
      else if(cat===2){G.m-=it.cost;G.cr[it.id]=1;lg('📖 开设 '+it.ic+it.n+' -$'+it.cost);}
      else{G.m-=it.cost;G.upg[it.id]=1;lg('🎁 完成 '+it.ic+it.n+' -$'+it.cost);}
      calc();upd();rnd();
    };el.appendChild(d);
  })(lst[i]);
}
document.querySelectorAll('.tg').forEach(function(t){t.onclick=function(){
  document.querySelectorAll('.tg').forEach(function(x){x.classList.remove('on');});
  t.classList.add('on');cat=parseInt(t.dataset.c);sel=null;rnd();};});
function newSt(){
  if(stu.length>=G.totCap)return null;
  var s={n:SN[Math.floor(Math.random()*SN.length)],
    sc:50+Math.floor(Math.random()*30),
    hap:60+Math.floor(Math.random()*30),
    ic:['👦','👧'][Math.floor(Math.random()*2)],
    x:-30,y:80+Math.random()*(H-180),tx:80+Math.random()*(W-200),ty:100+Math.random()*(H-200),
    in:false,left:false,gd:false,gr:0};
  return s;
}
function startD(){
  if(st!==STATE_PLAYING||onD)return;
  onD=true;dp=0;G.dayN=0;G.dayG=0;
  var ns=Math.min(G.totCap-stu.length,Math.floor(5+G.sc*0.1+Math.random()*10));
  var sp=0,it1=setInterval(function(){
    if(st!==STATE_PLAYING||!onD){clearInterval(it1);return;}
    if(sp>=ns){clearInterval(it1);return;}
    var ss=newSt();if(!ss)return;stu.push(ss);sp++;G.dayN++;
    lg('🎒 新同学入学: '+ss.ic+ss.n);
  },500);
  upd();
}
function draw(){
  cx.fillStyle='#051525';cx.fillRect(0,0,W,H);
  cx.fillStyle='#0a2540';cx.fillRect(0,0,W,60);
  cx.fillStyle='#1976d2';cx.fillRect(0,55,W,5);
  cx.font='bold 14px sans-serif';cx.fillStyle='#64b5f6';cx.textAlign='left';
  cx.fillText('🏫 光明学校  |  学生 '+stu.length+'/'+G.totCap+'  |  平均成绩 '+Math.round(G.sc)+'分',12,38);
  cx.font='11px sans-serif';cx.fillStyle='#90caf9';cx.textAlign='right';
  cx.fillText(onD?('📖 上课中 '+Math.floor(dp)+'%'):'🌙 假期',W-15,38);
  cx.strokeStyle='rgba(42,111,173,0.35)';cx.lineWidth=1;
  for(var r=0;r<=G.GR;r++){cx.beginPath();cx.moveTo(20,65+r*G.CH);cx.lineTo(W-20,65+r*G.CH);cx.stroke();}
  for(var c=0;c<=G.GC;c++){cx.beginPath();cx.moveTo(20+c*G.CW,65);cx.lineTo(20+c*G.CW,H-15);cx.stroke();}
  for(r=0;r<G.GR;r++)for(c=0;c<G.GC;c++){
    var id=G.grid[r][c];if(!id)continue;
    for(var i=0;i<BLD.length;i++)if(BLD[i].id===id){var bd=BLD[i];break;}
    var x=20+c*G.CW,y=65+r*G.CH;
    var col=['#1565c0','#1976d2','#1e88e5','#42a5f5','#00897b','#6d4c41','#558b2f','#f9a825','#e65100','#6a1b9a','#ad1457','#7b1fa2'];
    cx.fillStyle=col[(r*3+c)%col.length];cx.fillRect(x+3,y+3,G.CW-6,G.CH-6);
    cx.strokeStyle='#bbdefb';cx.strokeRect(x+3,y+3,G.CW-6,G.CH-6);
    cx.font=Math.min(G.CW*0.45,G.CH*0.5)+'px sans-serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillStyle='#fff';
    cx.fillText(bd.ic,x+G.CW/2,y+G.CH/2);
  }
  if(sel&&st===STATE_PLAYING&&hv){
    var x=20+hv.c*G.CW,y=65+hv.r*G.CH;
    cx.strokeStyle=G.grid[hv.r][hv.c]?'#ef5350':'#ffd54f';cx.lineWidth=3;cx.setLineDash([5,4]);
    cx.strokeRect(x+1,y+1,G.CW-2,G.CH-2);cx.setLineDash([]);
  }
  for(var i=0;i<stu.length;i++){
    var s=stu[i];if(s.left)continue;
    if(!s.in){s.x+=(s.tx-s.x)*0.04;s.y+=(s.ty-s.y)*0.04;if(Math.abs(s.x-s.tx)<2&&Math.abs(s.ty-s.y)<2)s.in=true;}
    else{s.x+=Math.sin(Date.now()*0.0015+i)*0.25;s.y+=Math.cos(Date.now()*0.0011+i*1.3)*0.2;}
    cx.font='22px sans-serif';cx.textAlign='center';cx.fillStyle='#fff';
    cx.fillText(s.ic,s.x,s.y);
    cx.font='9px sans-serif';cx.fillStyle='#fff176';cx.fillText(s.sc+'分',s.x,s.y+13);
  }
  if(onD){dp+=0.15;
    for(i=0;i<stu.length;i++){var s2=stu[i];if(s2.left)continue;
      var ratio=G.teach>0?Math.min(1.5,stu.length/Math.max(1,G.teach)/20):0.1;
      s2.sc=Math.min(100,s2.sc+0.05*G.tMod*G.sc*0.01*(2-ratio));
      s2.hap=Math.min(100,s2.hap+0.03*G.gp*0.01);
      if(G.foodCap===0&&Math.random()<0.0005)s2.hap=Math.max(0,s2.hap-5);
    }
    if(dp>=100)endD();
    if(dp>=130)endD();
  }
}
function endD(){
  if(!onD)return;onD=false;
  G.m-=G.sl;if(G.sl>0)lg('💼 发放工资 -$'+G.sl);
  var up=Math.floor(stu.length*8);G.m-=up;if(up>0)lg('🧹 学校运营 -$'+up);
  var tur=0;for(var i=stu.length-1;i>=0;i--){
    var s=stu[i];if(s.sc<40||s.hap<40){if(Math.random()<0.3){tur++;stu.splice(i,1);G.dayG++;}}}
  if(tur>0)lg('⚠️ '+tur+'名同学转学了(成绩/满意度低)');
  var fe=stu.length*100;G.m+=fe;G.total+=fe;if(fe>0)lg('💰 收取学费 +$'+fe);
  var don=Math.floor(G.sc*15+Math.random()*G.sc*20);
  if(don>0&&G.sc>=70){G.m+=don;G.total+=don;lg('🎁 校友捐助 +$'+don);}
  G.d++;
  Storage.save('sch_hs',Math.max(Storage.load('sch_hs',0),G.sc*1000+G.total));
  if(G.d>=12&&G.sc>=85&&stu.length>=100){endG(true,'省重点名校');return;}
  if(G.m<-3000){endG(false,'经费破产');return;}
  if(G.d>=20){endG(true,'桃李满天下');return;}
  calc();upd();rnd();
}
function endG(w,t){
  st=STATE_OVER;Storage.save('sch_hs',Math.max(Storage.load('sch_hs',0),G.sc*1000+G.total));
  document.getElementById('et').textContent=w?'🎓 '+t:'💔 '+t;
  var avg=100;if(stu.length>0){var tt=0;for(var i=0;i<stu.length;i++)tt+=stu[i].sc;avg=Math.floor(tt/stu.length);}
  document.getElementById('es').innerHTML='办学学期: <b>'+G.d+'</b><br>总收入: <b style="color:#ffd54f">$'+G.total+'</b><br>'
    +'在校学生: <b>'+stu.length+'</b>人<br>平均成绩: <b>'+avg+'分</b>';
  document.getElementById('se').style.display='flex';
}
var hv=null;
function getCell(e){
  var rc=cv.getBoundingClientRect();var sx=cv.width/rc.width,sy=cv.height/rc.height;
  var x=(e.clientX-rc.left)*sx-20,y=(e.clientY-rc.top)*sy-65;
  var c=Math.floor(x/G.CW),r=Math.floor(y/G.CH);
  if(r<0||r>=G.GR||c<0||c>=G.GC)return null;return{r:r,c:c};
}
cv.addEventListener('mousemove',function(e){hv=getCell(e);});
cv.addEventListener('click',function(e){
  if(st!==STATE_PLAYING)return;var cl=getCell(e);if(!cl)return;
  if(sel&&cat===0){
    if(G.grid[cl.r][cl.c]){GameCore.hints.show('此处已使用');return;}
    for(var i=0;i<BLD.length;i++)if(BLD[i].id===sel)var bd=BLD[i];
    if(G.m<bd.cost){GameCore.hints.show('经费不足');return;}
    G.m-=bd.cost;placeB(cl.r,cl.c,sel);lg('🏗️ 建造 '+bd.ic+bd.n+' -$'+bd.cost);sel=null;calc();upd();rnd();
  }else if(G.grid[cl.r][cl.c]){
    var id2=G.grid[cl.r][cl.c];
    if(confirm('拆除？(返还50%)')){
      for(i=0;i<BLD.length;i++)if(BLD[i].id===id2)bd=BLD[i];
      G.grid[cl.r][cl.c]=null;G.bld[id2]--;G.m+=Math.floor(bd.cost*0.5);
      lg('♻️ 拆除 '+bd.n+' +$'+Math.floor(bd.cost*0.5));calc();upd();
    }
  }
});
cv.addEventListener('touchstart',function(e){if(e.touches[0]){var t=e.touches[0];hv=getCell(t);}},{passive:true});
document.addEventListener('keydown',function(e){
  if(e.key===' '){e.preventDefault();startD();}
  else if(e.key==='p'||e.key==='P')ps();
});
document.getElementById('btnDay').onclick=startD;
document.getElementById('btnP').onclick=ps;document.getElementById('btnRe').onclick=ps;
document.getElementById('btnRe2').onclick=function(){location.reload();};
document.getElementById('btnRs').onclick=function(){if(confirm('重新办学？'))location.reload();};
document.getElementById('btnAg').onclick=function(){location.reload();};
document.getElementById('btnSv').onclick=function(){Storage.save('sch_save',G);GameCore.hints.show('已存档！');};
function ps(){
  if(st===STATE_PLAYING){st=STATE_PAUSE;document.getElementById('sp').style.display='flex';}
  else if(st===STATE_PAUSE){st=STATE_PLAYING;document.getElementById('sp').style.display='none';}
}
function str(){
  var sv=Storage.load('sch_save',null);if(sv&&confirm('读取存档？')){G=sv;G.GR=8;G.GC=14;G.CW=(W-40)/G.GC;G.CH=(H-80)/G.GR;stu=[];}
  else newG();
  document.getElementById('ss').style.display='none';st=STATE_PLAYING;
  if(tm)clearInterval(tm);tm=setInterval(draw,33);
  calc();upd();rnd();
}
document.getElementById('start-game-btn').addEventListener('click',str);
document.getElementById('hs').textContent=Storage.load('sch_hs',0);
GameCore.init({highScore:'school'});
</script>

  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {

  };
