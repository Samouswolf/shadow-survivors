<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>咖啡店主</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#3e2723;font-family:"Microsoft YaHei",sans-serif;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;overflow:auto;padding:10px 0;}
#wrap{width:100%;max-width:960px;}
#game{background:#4e342e;border:3px solid #6d4c41;border-radius:12px;padding:12px;box-shadow:0 0 25px rgba(0,0,0,0.5);}
.hud{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px;}
.card{background:#5d4037;border:1px solid #8d6e63;border-radius:8px;padding:8px;text-align:center;}
.card .t{font-size:11px;color:#d7ccc8;}
.card .v{font-size:19px;font-weight:bold;margin-top:2px;}
.money .v{color:#ffd54f;}
.cust .v{color:#81d4fa;}
.rating .v{color:#a5d6a7;}
.stock .v{color:#ffcc80;}
.day .v{color:#b39ddb;}
#cafe{position:relative;background:#fff3e0;border:2px solid #a1887f;border-radius:10px;overflow:hidden;}
#cafe canvas{display:block;max-width:100%;height:auto;}
#shop{margin-top:10px;background:#5d4037;border:1px solid #8d6e63;border-radius:10px;padding:10px;}
.tabs{display:flex;gap:5px;margin-bottom:8px;flex-wrap:wrap;}
.tab{padding:6px 14px;background:#4e342e;border:1px solid #6d4c41;border-radius:6px;color:#d7ccc8;cursor:pointer;font-size:13px;}
.tab.active{background:#8d6e63;color:#fff3e0;border-color:#ffd54f;}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;}
.item{background:#4e342e;border:1px solid #6d4c41;border-radius:6px;padding:8px;text-align:center;cursor:pointer;transition:0.15s;}
.item:hover:not(.disabled){background:#6d4c41;transform:translateY(-1px);}
.item.selected{border-color:#ffd54f;box-shadow:0 0 8px rgba(255,213,79,0.4);background:#6d4c41;}
.item.disabled{opacity:0.45;cursor:not-allowed;}
.item .ic{font-size:24px;}
.item .nm{font-size:12px;color:#fff3e0;margin:3px 0;}
.item .pr{font-size:11px;color:#ffd54f;}
.item .dt{font-size:10px;color:#bcaaa4;margin-top:2px;}
#bottom{display:grid;grid-template-columns:1.2fr 1fr;gap:8px;margin-top:10px;}
.panel{background:#5d4037;border:1px solid #8d6e63;border-radius:10px;padding:10px;color:#d7ccc8;font-size:13px;line-height:1.7;}
.panel .hd{color:#ffd54f;font-weight:bold;font-size:14px;margin-bottom:6px;padding-bottom:5px;border-bottom:1px solid #6d4c41;}
.log{max-height:100px;overflow-y:auto;background:#3e2723;border-radius:6px;padding:5px;font-size:12px;}
.log div{padding:2px 0;border-bottom:1px dashed #5d4037;}
.bigbtns{margin-top:8px;}
.btn{background:linear-gradient(180deg,#8d6e63,#5d4037);color:#fff3e0;border:1px solid #a1887f;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:13px;margin:3px;}
.btn:hover{filter:brightness(1.15);}
.btn:active{transform:scale(0.97);}
.btn-primary{background:linear-gradient(180deg,#ff8f00,#e65100);}
.btn-green{background:linear-gradient(180deg,#43a047,#1b5e20);}
.btn-red{background:linear-gradient(180deg,#e53935,#b71c1c);}
#scr,#spa,#soe{position:fixed;inset:0;background:rgba(46,21,16,0.96);z-index:2000;display:flex;flex-direction:column;align-items:center;justify-content:center;}
#scr h1{font-size:52px;color:#ffd54f;text-shadow:3px 3px 0 #4e342e,0 0 15px rgba(255,213,79,0.4);margin-bottom:10px;letter-spacing:3px;}
#scr .st{color:#d7ccc8;font-size:17px;margin-bottom:30px;}
#start-game-btn{background:linear-gradient(180deg,#ff8f00,#e65100);color:#fff;font-size:23px;padding:15px 65px;border:2px solid #ffd54f;border-radius:12px;cursor:pointer;font-weight:bold;letter-spacing:2px;box-shadow:0 6px 20px rgba(255,143,0,0.4);}
#start-game-btn:hover{transform:scale(1.06);filter:brightness(1.1);}
.guide{margin-top:30px;color:#a1887f;font-size:13px;max-width:450px;text-align:center;line-height:1.9;padding:15px;border:1px solid #6d4c41;border-radius:10px;background:rgba(93,64,55,0.4);}
.hsbox{margin-top:20px;padding:10px 24px;border:1px solid #ffd54f;border-radius:8px;color:#ffd54f;background:rgba(255,213,79,0.08);}
#spa h2,#soe h2{font-size:34px;color:#ffd54f;margin-bottom:25px;}
.lgbtn{padding:12px 42px;margin:7px;font-size:17px;border:none;border-radius:8px;cursor:pointer;color:#fff;font-weight:bold;}
.sts{color:#d7ccc8;font-size:17px;line-height:2.2;background:rgba(93,64,55,0.5);padding:22px 35px;border-radius:12px;border:1px solid #8d6e63;margin:20px 0;}
/* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */
/* [BATCH-FIX:ad-components-css] */
.sponsor-btn{position:fixed;bottom:8px;left:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:2px 6px;border-radius:10px;font:10px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.sponsor-panel.show{display:flex}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.interstitial-ad.show{display:flex}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* [/BATCH-FIX:ad-components-css] */

/* [AD-FIX:responsive] */
@media (max-width:768px){.ad-banner-container{display:none!important}.sponsor-btn{transform:scale(.8);opacity:.6}}
/* [/AD-FIX:responsive] */
</style>
</head>
<body>
<div id="wrap">
<div id="game">
  <div class="hud">
    <div class="card money"><div class="t">💰 资金</div><div class="v" id="vm">$2000</div></div>
    <div class="card cust"><div class="t">👥 今日顾客</div><div class="v" id="vc">0</div></div>
    <div class="card rating"><div class="t">⭐ 评分</div><div class="v" id="vr">3.0</div></div>
    <div class="card stock"><div class="t">📦 库存</div><div class="v" id="vs">0</div></div>
    <div class="card day"><div class="t">📅 第几天</div><div class="v" id="vd">1</div></div>
  </div>
  <div id="cafe"><canvas id="cv" width="900" height="420"></canvas></div>
  <div id="shop">
    <div class="tabs">
      <div class="tab active" data-c="0">☕ 饮品</div>
      <div class="tab" data-c="1">🍰 点心</div>
      <div class="tab" data-c="2">🪑 装饰</div>
      <div class="tab" data-c="3">📦 采购</div>
    </div>
    <div class="cats" id="cats"></div>
  </div>
  <div id="bottom">
    <div class="panel">
      <div class="hd">☕ 咖啡店信息</div>
      <div id="inf">准备开店！点击采购原料和菜单。</div>
      <div class="bigbtns">
        <button class="btn btn-primary" id="btnDay">🌅 开始一天 (空格)</button>
        <button class="btn" id="btnP">⏸ 暂停(P)</button>
        <button class="btn btn-green" id="btnSv">💾 保存</button>
        <button class="btn btn-red" id="btnRs">🔄 重开</button>
      </div>
    </div>
    <div class="panel">
      <div class="hd">📰 经营日志</div>
      <div class="log" id="log"></div>
    </div>
  </div>
</div>
</div>

<div id="scr">
  <h1>☕ 咖啡店主</h1>
  <div class="st">研磨时光 · 冲泡幸福 · 经营梦想</div>
  <div class="hsbox">历史最高营业额: <span id="hs">0</span></div>
  <button id="start-game-btn">开始经营</button>
  <div class="guide">
    <b>玩法说明：</b><br>
    • 【采购】购买咖啡豆、牛奶等原料<br>
    • 【饮品/点心】研发产品加入菜单<br>
    • 【装饰】升级桌椅、装饰提升评分<br>
    • 空格=开始下一天，P=暂停，点击服务顾客
  </div>
</div>

<div id="spa" style="display:none">
  <h2>⏸ 游戏暂停</h2>
  <button class="lgbtn" style="background:#43a047" id="btnRe">继续经营</button>
  <button class="lgbtn" style="background:#6d4c41" id="btnRe2">重新开始</button>
</div>

<div id="soe" style="display:none">
  <h2 id="et">🎉 经营成功！</h2>
  <div class="sts" id="es"></div>
  <button class="lgbtn" style="background:#ff8f00" id="btnAg">再来一次</button>
</div>

<script>
if(typeof STATE_MENU==='undefined')var STATE_MENU=0;
if(typeof STATE_PLAYING==='undefined')var STATE_PLAYING=1;
if(typeof STATE_OVER==='undefined')var STATE_OVER=2;
if(typeof STATE_PAUSE==='undefined')var STATE_PAUSE=3;
</script>
<script src="../game_core.js"></script>
<script>
(function(){var S=window.Storage;if(!S||typeof S.load!=='function'){S={load:function(k,d){try{return JSON.parse(localStorage.getItem(k))}catch(e){return d}},save:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};window.Storage=S;}})();
var cv=document.getElementById('cv'),cx=cv.getContext('2d'),W=cv.width,H=cv.height;
var st=STATE_MENU,G,cat=0,sel=null,tm=null,custs=[],dayOn=false,dayP=0;
function rs(){var m=Math.min(window.innerWidth-30,960);if(W>m){cv.style.width=m+'px';cv.style.height=(H*m/W)+'px';}}
rs();window.addEventListener('resize',rs);
var DRINKS=[
  {id:'amer',n:'美式',ic:'☕',cost:5,p:18,bean:2,milk:0,sugar:1,rt:3,un:0},
  {id:'late',n:'拿铁',ic:'🥛',cost:8,p:25,bean:2,milk:2,sugar:1,rt:4,un:0},
  {id:'capp',n:'卡布奇诺',ic:'☕',cost:9,p:28,bean:2,milk:1,sugar:1,rt:4,un:2},
  {id:'moch',n:'摩卡',ic:'🍫',cost:12,p:35,bean:2,milk:2,sugar:2,choc:1,rt:5,un:5},
  {id:'esp',n:'浓缩',ic:'☕',cost:4,p:15,bean:3,milk:0,sugar:0,rt:2,un:0},
  {id:'ice',n:'冰美式',ic:'🧊',cost:6,p:22,bean:2,milk:0,sugar:1,ice:2,rt:3,un:3},
  {id:'car',n:'焦糖玛奇朵',ic:'🍯',cost:14,p:40,bean:2,milk:2,sugar:2,car:1,rt:6,un:8}
];
var SNACKS=[
  {id:'cro',n:'牛角包',ic:'🥐',cost:6,p:18,flr:2,but:1,rt:3,un:0},
  {id:'cak',n:'芝士蛋糕',ic:'🍰',cost:12,p:35,flr:2,milk:1,egg:2,rt:5,un:3},
  {id:'cok',n:'曲奇',ic:'🍪',cost:4,p:12,flr:2,sugar:1,but:1,rt:2,un:0},
  {id:'muf',n:'马芬',ic:'🧁',cost:7,p:20,flr:2,milk:1,egg:1,rt:3,un:2},
  {id:'sand',n:'三明治',ic:'🥪',cost:10,p:28,flr:2,veg:1,ham:1,rt:4,un:5},
  {id:'don',n:'甜甜圈',ic:'🍩',cost:5,p:16,flr:2,sugar:2,rt:3,un:1}
];
var DECOR=[
  {id:'tbl',n:'木桌',ic:'🪑',cost:300,cap:2,rt:0,scr:0.2,un:0},
  {id:'sof',n:'沙发座',ic:'🛋️',cost:600,cap:3,rt:0,scr:0.4,un:5},
  {id:'pln',n:'绿植',ic:'🪴',cost:150,cap:0,rt:0,scr:0.3,un:0},
  {id:'art',n:'挂画',ic:'🖼️',cost:250,cap:0,rt:0,scr:0.3,un:3},
  {id:'mus',n:'音响',ic:'🎵',cost:800,cap:0,rt:0,scr:0.5,un:8},
  {id:'bar',n:'升级吧台',ic:'🆙',cost:1500,cap:0,rt:-1,scr:0.8,un:12}
];
var STOCK=[
  {id:'bean',n:'咖啡豆',ic:'☕',cost:50,qty:50,un:0},
  {id:'milk',n:'牛奶',ic:'🥛',cost:30,qty:30,un:0},
  {id:'sugar',n:'糖',ic:'🍬',cost:20,qty:50,un:0},
  {id:'flr',n:'面粉',ic:'🌾',cost:25,qty:40,un:0},
  {id:'egg',n:'鸡蛋',ic:'🥚',cost:25,qty:30,un:0},
  {id:'but',n:'黄油',ic:'🧈',cost:35,qty:20,un:2},
  {id:'choc',n:'巧克力',ic:'🍫',cost:45,qty:20,un:4},
  {id:'veg',n:'蔬菜',ic:'🥬',cost:30,qty:25,un:4},
  {id:'ham',n:'火腿',ic:'🥓',cost:50,qty:20,un:4},
  {id:'car',n:'焦糖',ic:'🍯',cost:40,qty:20,un:7},
  {id:'ice',n:'冰块',ic:'🧊',cost:15,qty:40,un:2}
];
var ALL=[DRINKS,SNACKS,DECOR,STOCK];
function newG(){
  G={m:2000,d:1,cust:0,tot:0,rev:0,scr:3.0,cap:4,tserve:5,
    mat:{bean:100,milk:60,sugar:60,flr:60,egg:40,but:20,choc:0,veg:0,ham:0,car:0,ice:0},
    menu:{},decos:{},dayE:0,dayC:0,wait:0};
  for(var i=0;i<DRINKS.length;i++)if(DRINKS[i].un===0)G.menu[DRINKS[i].id]={on:false};
  G.menu.amer.on=true;G.menu.esp.on=true;
  for(var i=0;i<SNACKS.length;i++)if(SNACKS[i].un===0)G.menu[SNACKS[i].id]={on:false};
  G.menu.cok.on=true;
  G.decos.tbl=2;G.cap=4+2*2;
  upd();rendCats();lg('欢迎来到你的咖啡店！');
}
function upd(){
  var s=0,cc=0;
  for(var k in G.decos){for(var i=0;i<DECOR.length;i++){if(DECOR[i].id===k){s+=DECOR[i].scr*G.decos[k];cc+=DECOR[i].cap*G.decos[k];}}}
  G.scr=Math.min(5,3+s);G.cap=4+cc;
  var tsv=5;
  for(k in G.decos){for(var i=0;i<DECOR.length;i++){if(DECOR[i].id===k){tsv+=DECOR[i].rt*G.decos[k];}}}
  G.tserve=Math.max(2,tsv);
  var stk=0;for(k in G.mat)stk+=G.mat[k];
  document.getElementById('vm').textContent='$'+G.m;
  document.getElementById('vc').textContent=G.dayC+'/'+G.cust;
  document.getElementById('vr').textContent=G.scr.toFixed(1);
  document.getElementById('vs').textContent=stk;
  document.getElementById('vd').textContent=G.d;
  var mn=document.getElementById('inf');
  var ml=[];for(k in G.menu)if(G.menu[k].on){for(var t=0;t<2;t++){var lst=ALL[t];for(var i=0;i<lst.length;i++)if(lst[i].id===k)ml.push(lst[i].ic+lst[i].n);}}
  mn.innerHTML='座位: <b>'+G.cap+'</b> | 服务速度: <b>'+G.tserve+'s</b><br>'
    +'菜单('+ml.length+'): '+ml.join(', ')+'<br>'
    +'原料: 豆'+G.mat.bean+' 奶'+G.mat.milk+' 糖'+G.mat.sugar+' 面'+G.mat.flr;
}
function lg(m){var el=document.getElementById('log');var d=document.createElement('div');d.textContent='[D'+G.d+'] '+m;el.insertBefore(d,el.firstChild);while(el.children.length>15)el.removeChild(el.lastChild);}
function rendCats(){
  var el=document.getElementById('cats');el.innerHTML='';var lst=ALL[cat];
  for(var i=0;i<lst.length;i++)(function(it){
    var d=document.createElement('div');var lk=(it.un&&G.scr.toFixed(1)*10<it.un*10);
    d.className='item'+(sel===it.id?' selected':'')+(lk?' disabled':'');
    var pr='';
    if(cat===0||cat===1){var on=G.menu[it.id]&&G.menu[it.id].on;pr=(on?'✅ ':'')+'售价$'+it.p+' 成本$'+it.cost;}
    else if(cat===2){pr='$'+it.cost+' (x'+(G.decos[it.id]||0)+')';}
    else{pr='$'+it.cost+'/'+it.qty+'份';}
    var extra='';if(it.un)extra='<div class="dt">⭐'+(it.un/10).toFixed(1)+'解锁</div>';
    d.innerHTML='<div class="ic">'+it.ic+'</div><div class="nm">'+it.n+'</div><div class="pr">'+pr+'</div>'+extra;
    d.title=it.n;
    d.onclick=function(){
      if(lk){GameCore.hints.show('需要评分: ⭐'+(it.un/10).toFixed(1));return;}
      if(cat===0||cat===1){
        if(!G.menu[it.id])G.menu[it.id]={on:false};
        G.menu[it.id].on=!G.menu[it.id].on;
        lg((G.menu[it.id].on?'✅ 上架: ':'❌ 下架: ')+it.ic+it.n);
      }else if(cat===2){
        if(G.m<it.cost){GameCore.hints.show('资金不足！');return;}
        G.m-=it.cost;G.decos[it.id]=(G.decos[it.id]||0)+1;
        lg('🎨 购买 '+it.ic+it.n+' -$'+it.cost);
      }else{
        if(G.m<it.cost){GameCore.hints.show('资金不足！');return;}
        G.m-=it.cost;G.mat[it.id]=(G.mat[it.id]||0)+it.qty;
        lg('📦 采购 '+it.ic+it.n+' +'+it.qty+' -$'+it.cost);
      }
      upd();rendCats();
    };el.appendChild(d);
  })(lst[i]);
}
document.querySelectorAll('.tab').forEach(function(t){t.onclick=function(){
  document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});
  t.classList.add('active');cat=parseInt(t.dataset.c);sel=null;rendCats();};});
function menuAvail(){
  var res=[];
  for(var k in G.menu)if(G.menu[k].on){
    for(var t=0;t<2;t++){var lst=ALL[t];for(var i=0;i<lst.length;i++)if(lst[i].id===k)res.push(lst[i]);}
  }return res;
}
function canMake(it){
  var need=['bean','milk','sugar','flr','egg','but','choc','veg','ham','car','ice'];
  for(var i=0;i<need.length;i++){if(it[need[i]]&&G.mat[need[i]]<it[need[i]])return false;}
  return true;
}
function useMat(it){
  var need=['bean','milk','sugar','flr','egg','but','choc','veg','ham','car','ice'];
  for(var i=0;i<need.length;i++){if(it[need[i]])G.mat[need[i]]-=it[need[i]];}
}
function startDay(){
  if(st!==STATE_PLAYING||dayOn)return;
  dayOn=true;dayP=0;custs=[];G.dayE=0;G.dayC=0;
  var base=5+Math.floor(G.scr*3);
  var nCust=base+Math.floor(Math.random()*5);
  G.cust=nCust;
  var spawned=0,spawnInt=setInterval(function(){
    if(st!==STATE_PLAYING||!dayOn){clearInterval(spawnInt);return;}
    if(spawned>=nCust){clearInterval(spawnInt);return;}
    var opts=menuAvail();if(opts.length===0){lg('⚠️ 菜单为空！');return;}
    var c={x:-40,y:100+Math.random()*(H-180),tx:80+Math.random()*200,ord:opts[Math.floor(Math.random()*opts.length)],
      made:false,left:false,prog:0,pats:Math.random()<0.3};
    custs.push(c);spawned++;
  },800);
  upd();
}
function draw(){
  cx.fillStyle='#fff3e0';cx.fillRect(0,0,W,H);
  cx.fillStyle='#d7ccc8';cx.fillRect(0,0,W,70);
  cx.fillStyle='#8d6e63';cx.fillRect(0,65,W,5);
  cx.font='14px sans-serif';cx.fillStyle='#4e342e';cx.textAlign='left';
  cx.fillText('☕ 吧台',10,42);
  for(var i=0;i<10;i++){cx.strokeStyle='#bcaaa4';cx.beginPath();cx.moveTo(70+i*70,75);cx.lineTo(70+i*70,H-30);cx.stroke();}
  for(var k in G.decos){for(var i=0;i<DECOR.length;i++){if(DECOR[i].id===k){
    for(var j=0;j<G.decos[k];j++){
      var x=90+(j*100)%(W-200),y=120+Math.floor(j*100/(W-200))*90+80;
      cx.font='30px sans-serif';cx.textAlign='center';cx.fillText(DECOR[i].ic,x,y);
    }
  }}}
  for(var i=0;i<custs.length;i++){
    var c=custs[i];
    if(c.left)continue;
    cx.font='28px sans-serif';cx.textAlign='center';
    cx.fillStyle=c.pats?'#ef5350':'#4e342e';
    cx.fillText(c.made?'😋':'🧑',c.x,c.y);
    cx.font='20px sans-serif';
    cx.fillText(c.ord.ic,c.x,c.y-28);
    if(c.made){cx.fillStyle='#a5d6a7';cx.fillRect(c.x-15,c.y+12,30,4);}
    else if(c.serve){cx.fillStyle='#64b5f6';cx.fillRect(c.x-15,c.y+12,c.prog*30,4);}
  }
  cx.fillStyle='#5d4037';cx.font='bold 15px sans-serif';cx.textAlign='right';
  cx.fillText((dayOn?('⏱️ 营业中 '+Math.floor(dayP)+'%'):'🌙 休息中'),W-15,42);
  cx.textAlign='left';cx.fillText('💰 今日收入: $'+G.dayE+' | 顾客: '+G.dayC+'/'+G.cust,10,20);
  if(dayOn){dayP+=0.3;if(dayP>=100&&custs.every(function(c){return c.left||c.made;})){endDay();}}
  for(var i=0;i<custs.length;i++){
    var c=custs[i];if(c.left)continue;
    if(!c.arrived){c.x+=(c.tx-c.x)*0.05;if(Math.abs(c.x-c.tx)<2)c.arrived=true;}
    else if(!c.serve){
      if(canMake(c.ord)){
        c.serve=true;c.sp=Date.now();useMat(c.ord);
      }else{
        c.wt=(c.wt||0)+1;
        if(c.wt>300){c.left=true;G.scr=Math.max(1,G.scr-0.1);lg('😠 '+c.ord.n+'缺货，顾客愤怒离开');}
      }
    }else if(!c.made){
      c.prog=Math.min(1,(Date.now()-c.sp)/(G.tserve*1000));
      if(c.prog>=1){
        c.made=true;var tip=c.pats?Math.floor(c.ord.p*0.3):0;
        var gain=c.ord.p+tip;G.m+=gain;G.dayE+=gain;G.tot+=gain;G.dayC++;
        if(c.pats)G.scr=Math.min(5,G.scr+0.05);else G.scr=Math.min(5,G.scr+0.02);
        lg('💰 '+c.ord.ic+c.ord.n+' +$'+gain+(tip?'(含小费$'+tip+')':''));
        setTimeout(function(cc){return function(){cc.left=true;};}(c),800);
        upd();
      }
    }
  }
}
function endDay(){
  if(!dayOn)return;dayOn=false;
  var ren=Math.floor(G.tot*0.1);G.m-=ren;
  var waste=0;for(var k in G.mat){var w=Math.floor(G.mat[k]*0.05);waste+=w;G.mat[k]=Math.max(0,G.mat[k]-w);}
  lg('🌙 打烊！收入$'+G.dayE+' 租金$'+ren+' 损耗约'+waste+'份');
  G.d++;G.rev+=G.dayE;
  Storage.save('cafe_hs',Math.max(Storage.load('cafe_hs',0),G.rev));
  if(G.d>=30&&G.scr>=4.5){endGame(true,'五星咖啡店！');return;}
  if(G.m<0){endGame(false,'资金断裂');return;}
  if(G.d>=60){endGame(true,'经营大师！');return;}
  custs=[];G.cust=0;G.dayC=0;upd();rendCats();
}
function endGame(w,t){
  st=STATE_OVER;
  Storage.save('cafe_hs',Math.max(Storage.load('cafe_hs',0),G.rev));
  document.getElementById('et').textContent=w?'🎉 '+t:'💸 '+t;
  document.getElementById('es').innerHTML='经营天数: <b>'+G.d+'</b><br>累计营业额: <b style="color:#ffd54f">$'+G.rev+'</b><br>最终评分: <b>⭐'+G.scr.toFixed(1)+'</b><br>总服务顾客: <b>'+G.tot+'</b>';
  document.getElementById('soe').style.display='flex';
}
cv.addEventListener('click',function(e){
  if(!dayOn||st!==STATE_PLAYING)return;
  var rc=cv.getBoundingClientRect(),sx=cv.width/rc.width,sy=cv.height/rc.height;
  var mx=(e.clientX-rc.left)*sx,my=(e.clientY-rc.top)*sy;
  for(var i=custs.length-1;i>=0;i--){
    var c=custs[i];if(c.left||c.made||!c.arrived)continue;
    if(Math.abs(mx-c.x)<25&&Math.abs(my-c.y)<30){
      if(!c.serve&&canMake(c.ord)){c.serve=true;c.sp=Date.now()-500;useMat(c.ord);GameCore.hints.show('📝 开始制作 '+c.ord.n);}
      else if(!canMake(c.ord))GameCore.hints.show('❌ 原料不足');
      break;
    }
  }
});
document.addEventListener('keydown',function(e){
  if(e.key===' '){e.preventDefault();startDay();}
  else if(e.key==='p'||e.key==='P')ps();
  else if(e.key>='1'&&e.key<='9'){
    var lst=ALL[cat],idx=parseInt(e.key)-1;
    if(idx<lst.length){var it=lst[idx];if(!(it.un&&G.scr.toFixed(1)*10<it.un*10)){sel=it.id;rendCats();}}
  }
});
document.getElementById('btnDay').onclick=startDay;
document.getElementById('btnP').onclick=ps;
document.getElementById('btnRe').onclick=ps;
document.getElementById('btnRe2').onclick=function(){location.reload();};
document.getElementById('btnRs').onclick=function(){if(confirm('重新经营？'))location.reload();};
document.getElementById('btnAg').onclick=function(){location.reload();};
document.getElementById('btnSv').onclick=function(){Storage.save('cafe_save',G);GameCore.hints.show('已存档！');};
function ps(){
  if(st===STATE_PLAYING){st=STATE_PAUSE;document.getElementById('spa').style.display='flex';}
  else if(st===STATE_PAUSE){st=STATE_PLAYING;document.getElementById('spa').style.display='none';}
}
function start(){
  var sv=Storage.load('cafe_save',null);
  if(sv&&confirm('发现存档，读取？'))G=sv;else newG();
  document.getElementById('scr').style.display='none';
  st=STATE_PLAYING;
  if(tm)clearInterval(tm);
  tm=setInterval(draw,30);
  upd();rendCats();
}
document.getElementById('start-game-btn').addEventListener('click',start);
document.getElementById('hs').textContent='$'+Storage.load('cafe_hs',0);
GameCore.init({highScore:'cafe'});
</script>

<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>

    _timerIds.push({type: 'timeout', id: id});

  };
  window.setInterval = function(fn, delay) {
