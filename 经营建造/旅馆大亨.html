<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅馆大亨</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#1b0033;font-family:"Microsoft YaHei",sans-serif;min-height:100vh;overflow:auto;padding:10px 0;}
#wrap{width:100%;max-width:960px;margin:0 auto;}
#gm{background:#2d1b4e;border:2px solid #6a1b9a;border-radius:12px;padding:10px;}
.hd{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:8px;}
.cd{background:#1a0f2e;border:1px solid #4a148c;border-radius:7px;padding:7px;text-align:center;}
.cd .l{font-size:10px;color:#ce93d8;}
.cd .v{font-size:17px;font-weight:bold;margin-top:2px;}
.mo .v{color:#ffd54f;}
.rt .v{color:#81c784;}
.sc .v{color:#ba68c8;}
.gd .v{color:#f06292;}
.dy .v{color:#4fc3f7;}
.gt .v{color:#fff176;}
#cv{display:block;border:2px solid #6a1b9a;border-radius:8px;max-width:100%;height:auto;background:#0f0520;margin:0 auto;}
#tb{display:flex;gap:4px;margin:8px 0;flex-wrap:wrap;}
.tg{padding:6px 13px;background:#1a0f2e;border:1px solid #4a148c;border-radius:6px;color:#ce93d8;cursor:pointer;font-size:12px;}
.tg.on{background:#7b1fa2;color:#fff;border-color:#e1bee7;}
#sh{background:#1a0f2e;border:1px solid #4a148c;border-radius:8px;padding:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:6px;}
.it{background:#2d1b4e;border:1px solid #6a1b9a;border-radius:6px;padding:7px;text-align:center;cursor:pointer;transition:0.15s;}
.it:hover:not(.no){background:#4a148c;transform:translateY(-1px);}
.it.sl{border-color:#ffd54f;background:#4527a0;box-shadow:0 0 8px rgba(255,213,79,0.35);}
.it.no{opacity:0.4;cursor:not-allowed;}
.it .ic{font-size:23px;}
.it .nm{font-size:11px;color:#f3e5f5;margin:2px 0;}
.it .pr{font-size:10px;color:#ffd54f;}
.it .xt{font-size:9px;color:#ce93d8;}
#bm{display:grid;grid-template-columns:1.2fr 1fr;gap:8px;margin-top:8px;}
.pn{background:#1a0f2e;border:1px solid #4a148c;border-radius:8px;padding:9px;color:#e1bee7;font-size:12px;line-height:1.7;}
.pn .hh{color:#f06292;font-weight:bold;font-size:13px;margin-bottom:5px;padding-bottom:4px;border-bottom:1px solid #4a148c;}
.lg{max-height:100px;overflow-y:auto;background:#0a0514;border-radius:5px;padding:5px;font-size:11px;}
.lg div{padding:2px 0;border-bottom:1px dashed #4a148c;color:#ce93d8;}
.bt{background:linear-gradient(180deg,#7b1fa2,#4a148c);color:#fff;border:1px solid #ab47bc;padding:7px 13px;border-radius:6px;cursor:pointer;font-size:12px;margin:2px;}
.bt:hover{filter:brightness(1.15);}
.bt:active{transform:scale(0.97);}
.bt.g{background:linear-gradient(180deg,#388e3c,#1b5e20);}
.bt.r{background:linear-gradient(180deg,#d32f2f,#b71c1c);}
.bt.y{background:linear-gradient(180deg,#f57c00,#e65100);}
#ss,#sp,#se{position:fixed;inset:0;background:rgba(10,5,20,0.97);z-index:2000;display:flex;flex-direction:column;align-items:center;justify-content:center;}
#ss h1{font-size:50px;color:#e040fb;text-shadow:0 0 20px rgba(224,64,251,0.5),3px 3px 0 #4a148c;margin-bottom:10px;letter-spacing:3px;}
#ss .sb{color:#ce93d8;font-size:17px;margin-bottom:28px;}
#start-game-btn{background:linear-gradient(180deg,#ab47bc,#6a1b9a);color:#fff;font-size:23px;padding:15px 65px;border:2px solid #e040fb;border-radius:12px;cursor:pointer;font-weight:bold;letter-spacing:2px;box-shadow:0 6px 20px rgba(171,71,188,0.45);}
#start-game-btn:hover{transform:scale(1.05);filter:brightness(1.1);}
.gd{margin-top:28px;color:#9575cd;font-size:13px;max-width:450px;text-align:center;line-height:1.9;padding:14px;border:1px solid #6a1b9a;border-radius:10px;background:rgba(45,27,78,0.5);}
.hsb{margin-top:18px;padding:10px 24px;border:1px solid #ffd54f;border-radius:8px;color:#ffd54f;background:rgba(255,213,79,0.07);}
#sp h2,#se h2{font-size:33px;color:#e040fb;margin-bottom:24px;}
.lgb{padding:11px 42px;margin:6px;font-size:16px;border:none;border-radius:8px;cursor:pointer;color:#fff;font-weight:bold;}
.sst{color:#e1bee7;font-size:16px;line-height:2.1;background:rgba(45,27,78,0.6);padding:20px 30px;border-radius:11px;border:1px solid #6a1b9a;margin:18px 0;}
/* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */
/* [BATCH-FIX:ad-components-css] */
.sponsor-btn{position:fixed;bottom:8px;left:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:2px 6px;border-radius:10px;font:10px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.sponsor-panel.show{display:flex}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.interstitial-ad.show{display:flex}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* [/BATCH-FIX:ad-components-css] */

/* [AD-FIX:responsive] */
@media (max-width:768px){.ad-banner-container{display:none!important}.sponsor-btn{transform:scale(.8);opacity:.6}}
/* [/AD-FIX:responsive] */
</style>
</head>
<body>
<div id="wrap">
<div id="gm">
<div class="hd">
<div class="cd mo"><div class="l">💰 资金</div><div class="v" id="vmo">$3000</div></div>
<div class="cd rt"><div class="l">🛌 入住率</div><div class="v" id="vrt">0%</div></div>
<div class="cd sc"><div class="l">⭐ 评分</div><div class="v" id="vsc">2.0</div></div>
<div class="cd gd"><div class="l">👥 客人</div><div class="v" id="vgd">0</div></div>
<div class="cd dy"><div class="l">📅 天数</div><div class="v" id="vdy">1</div></div>
<div class="cd gt"><div class="l">💰 总收入</div><div class="v" id="vgt">$0</div></div>

<canvas id="cv" width="920" height="460"></canvas>
<div id="tb">
<div class="tg on" data-c="0">🛌 客房</div>

</div>
<div id="sh"></div>
<div id="bm">
<div class="pn">
<div class="hh">🏨 旅馆信息</div>
<div id="if">欢迎光临！请先建造客房。</div>
<div style="margin-top:6px">
<button class="bt g" id="btnDay">🌅 接待客人 (空格)</button>
<button class="bt" id="btnP">⏸ 暂停(P)</button>
<button class="bt y" id="btnSv">💾 保存</button>
<button class="bt r" id="btnRs">🔄 重开</button>
</div>
</div>
<div class="pn">
<div class="hh">📰 经营日志</div>
<div class="lg" id="lg"></div>
</div>
</div>
</div>
</div>

<div id="ss">
<h1>🏨 旅馆大亨</h1>
<div class="sb">打造梦想旅馆 · 接待八方宾客 · 成就酒店帝国</div>
<div class="hsb">历史最高营收: <span id="hs">0</span></div>
<button id="start-game-btn">开始经营</button>
<div class="gd">
<b>游戏玩法：</b><br>
• 【客房】建造各种等级的房间增加收入<br>
• 【设施】健身房、泳池等提升评分<br>
• 【餐饮】餐厅、酒吧增加额外消费<br>
• 空格=开始下一天，P=暂停，点击客房快速打扫
</div>
</div>

<div id="sp" style="display:none">
<h2>⏸ 暂停中</h2>
<button class="lgb" style="background:#388e3c" id="btnRe">继续经营</button>
<button class="lgb" style="background:#546e7a" id="btnRe2">重新开始</button>
</div>

<div id="se" style="display:none">
<h2 id="et">🏆 五星酒店！</h2>
<div class="sst" id="es"></div>
<button class="lgb" style="background:#ab47bc" id="btnAg">再来一次</button>
</div>

<script>
if(typeof STATE_MENU==='undefined')var STATE_MENU=0;
if(typeof STATE_PLAYING==='undefined')var STATE_PLAYING=1;
if(typeof STATE_OVER==='undefined')var STATE_OVER=2;
if(typeof STATE_PAUSE==='undefined')var STATE_PAUSE=3;
</script>
<script src="../game_core.js"></script>
<script>
(function(){var S=window.Storage;if(!S||typeof S.load!=='function'){S={load:function(k,d){try{return JSON.parse(localStorage.getItem(k))}catch(e){return d}},save:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};window.Storage=S;}})();
var cv=document.getElementById('cv'),cx=cv.getContext('2d'),W=cv.width,H=cv.height;
var st=STATE_MENU,G,cat=0,sel=null,tm=null,gst=[],onD=false,dp=0;
function rs(){var m=Math.min(window.innerWidth-30,960);if(W>m){cv.style.width=m+'px';cv.style.height=(H*m/W)+'px';}}
rs();window.addEventListener('resize',rs);

var ROOMS=[
  {id:'r1',n:'普通间',ic:'🛏️',cost:500,price:80,sc:0.1,cap:2,un:0,sz:1},
  {id:'r2',n:'标准间',ic:'🏨',cost:1000,price:150,sc:0.2,cap:2,un:2,sz:1},
  {id:'r3',n:'豪华间',ic:'🛋️',cost:2500,price:350,sc:0.5,cap:2,un:5,sz:1},
  {id:'r4',n:'套房',ic:'🏠',cost:5000,price:680,sc:1.0,cap:4,un:10,sz:2},
  {id:'r5',n:'总统套房',ic:'👑',cost:15000,price:2000,sc:2.0,cap:6,un:20,sz:2},
  {id:'r6',n:'家庭房',ic:'👨‍👩‍👧',cost:1500,price:230,sc:0.3,cap:4,un:4,sz:1}
];
var FCL=[
  {id:'f1',n:'停车场',ic:'🅿️',cost:800,sc:0.2,un:0,cap:10,inc:0.1},
  {id:'f2',n:'健身房',ic:'🏋️',cost:2000,sc:0.5,un:3,inc:0.3},
  {id:'f3',n:'游泳池',ic:'🏊',cost:4000,sc:0.8,un:6,inc:0.5},
  {id:'f4',n:'SPA中心',ic:'💆',cost:6000,sc:1.0,un:10,inc:1.0},
  {id:'f5',n:'商务中心',ic:'💼',cost:2500,sc:0.4,un:5,inc:0.4},
  {id:'f6',n:'儿童乐园',ic:'🎠',cost:3000,sc:0.5,un:6,inc:0.4},
  {id:'f7',n:'赌场',ic:'🎰',cost:20000,sc:1.5,un:18,inc:5.0},
  {id:'f8',n:'花园',ic:'🌺',cost:1500,sc:0.4,un:2,inc:0}
];
var FDB=[
  {id:'d1',n:'自助早餐',ic:'🥐',cost:1500,sc:0.5,un:0,inc:0.5,fee:30},
  {id:'d2',n:'中餐厅',ic:'🍜',cost:3500,sc:0.6,un:4,inc:1.5,fee:80},
  {id:'d3',n:'西餐厅',ic:'🍝',cost:5000,sc:0.8,un:7,inc:2.5,fee:150},
  {id:'d4',n:'酒吧',ic:'🍸',cost:3000,sc:0.6,un:5,inc:2.0,fee:60},
  {id:'d5',n:'咖啡厅',ic:'☕',cost:1800,sc:0.3,un:2,inc:0.8,fee:25},
  {id:'d6',n:'日料店',ic:'🍣',cost:6000,sc:1.0,un:12,inc:3.0,fee:200}
];
var UPG=[
  {id:'u1',n:'员工培训',ic:'📚',cost:1500,sc:0.5,un:3,one:1,eff:0.2},
  {id:'u2',n:'免费WiFi',ic:'📶',cost:800,sc:0.3,un:0,one:1,eff:0},
  {id:'u3',n:'智能门锁',ic:'🔐',cost:2500,sc:0.4,un:5,one:1,eff:0.1},
  {id:'u4',n:'豪华装修',ic:'✨',cost:8000,sc:1.5,un:10,one:1,eff:0.3},
  {id:'u5',n:'管家服务',ic:'🎩',cost:12000,sc:2.0,un:15,one:1,eff:0.5,inc:1},
  {id:'u6',n:'直升机坪',ic:'🚁',cost:50000,sc:5.0,un:30,one:1,eff:1.0,inc:5}
];
var ALL=[ROOMS,FCL,FDB,UPG];

var GUESTS=[
  {t:'背包客',ic:'🎒',p:0.8,len:2,tip:0.05,fd:0.1,roomMin:0,roomMax:2},
  {t:'情侣',ic:'💑',p:1.2,len:3,tip:0.1,fd:0.5,roomMin:1,roomMax:4},
  {t:'家庭',ic:'👨‍👩‍👧',p:1.0,len:4,tip:0.08,fd:0.8,roomMin:2,roomMax:5},
  {t:'商人',ic:'💼',p:1.5,len:2,tip:0.2,fd:0.6,roomMin:1,roomMax:5},
  {t:'旅行团',ic:'🚌',p:0.9,len:5,tip:0.05,fd:1.0,roomMin:0,roomMax:3},
  {t:'富豪',ic:'💰',p:3.0,len:7,tip:0.5,fd:2.0,roomMin:3,roomMax:5},
  {t:'网红',ic:'📸',p:2.0,len:3,tip:0.3,fd:1.2,roomMin:2,roomMax:5,scB:1}
];

function newG(){
  G={m:3000,d:1,g:0,tot:0,rooms:{},fcls:{},fd:{},upg:{},totalCap:0,totalSc:2.0,
    dayI:0,dayC:0,eff:1,incB:0,totalRooms:0,fCap:0,
    grid:[]};
  G.GR=8,G.GC=14;G.CW=(W-40)/G.GC;G.CH=(H-80)/G.GR;
  for(var r=0;r<G.GR;r++){G.grid[r]=[];for(var c=0;c<G.GC;c++)G.grid[r][c]=null;}
  placeItem(3,2,'r1');placeItem(3,4,'r1');placeItem(3,6,'r2');
  G.m=3000;
  calc();upd();rnd();lg('🏨 欢迎入住！');
}
function placeItem(r,c,id){
  if(G.grid[r]&&G.grid[r][c])return;
  for(var t=0;t<3;t++){var lst=ALL[t];for(var i=0;i<lst.length;i++)if(lst[i].id===id){var it=lst[i];break;}}
  if(!it)return;var sz=it.sz||1;
  if(sz>1&&(c+sz-1>=G.GC||G.grid[r][c+1]))return;
  G.grid[r][c]=id;if(sz>1)G.grid[r][c+1]=id+'_2';
  if(t===0)G.rooms[id]=(G.rooms[id]||0)+1;
  if(t===1)G.fcls[id]=(G.fcls[id]||0)+1;
  if(t===2)G.fd[id]=(G.fd[id]||0)+1;
}
function calc(){
  G.totalCap=0;G.totalSc=2.0;G.incB=0;G.totalRooms=0;G.fCap=0;
  var allR={},allF={},allD={};
  for(var k in G.rooms)allR[k]=G.rooms[k];
  for(k in G.fcls)allF[k]=G.fcls[k];
  for(k in G.fd)allD[k]=G.fd[k];
  for(k in allR){for(i=0;i<ROOMS.length;i++){if(ROOMS[i].id===k){var rm=ROOMS[i];
    G.totalRooms+=allR[k];G.totalCap+=rm.cap*allR[k];G.totalSc+=rm.sc*allR[k];}}}
  for(k in allF){for(i=0;i<FCL.length;i++){if(FCL[i].id===k){var fc=FCL[i];
    G.totalSc+=fc.sc*allF[k];G.incB+=fc.inc*allF[k];G.fCap+=fc.cap?fc.cap*allF[k]:0;}}}
  for(k in allD){for(i=0;i<FDB.length;i++){if(FDB[i].id===k){var db=FDB[i];
    G.totalSc+=db.sc*allD[k];G.incB+=db.inc*allD[k];}}}
  for(k in G.upg){for(i=0;i<UPG.length;i++){if(UPG[i].id===k&&G.upg[k]){var ug=UPG[i];
    G.totalSc+=ug.sc;G.incB+=ug.inc||0;G.eff*=(1+(ug.eff||0));}}}
  G.totalSc=Math.min(5.0,G.totalSc);
}
function upd(){
  var rate=G.totalRooms?(gst.filter(function(x){return x.inH;}).length/G.totalRooms*100):0;
  document.getElementById('vmo').textContent='$'+G.m;
  document.getElementById('vrt').textContent=Math.floor(rate)+'%';
  document.getElementById('vsc').textContent=G.totalSc.toFixed(1);
  document.getElementById('vgd').textContent=G.g;
  document.getElementById('vdy').textContent=G.d;
  document.getElementById('vgt').textContent='$'+G.tot;
  var rm1=[],fc1=[],fd1=[];
  for(var k in G.rooms)for(var i=0;i<ROOMS.length;i++)if(ROOMS[i].id===k)rm1.push(ROOMS[i].ic+G.rooms[k]);
  for(k in G.fcls)for(i=0;i<FCL.length;i++)if(FCL[i].id===k)fc1.push(FCL[i].ic+G.fcls[k]);
  for(k in G.fd)for(i=0;i<FDB.length;i++)if(FDB[i].id===k)fd1.push(FDB[i].ic+G.fd[k]);
  document.getElementById('if').innerHTML='总房间: <b>'+G.totalRooms+'</b> | 可入住: <b>'+G.totalCap+'</b>人 | 效率: <b>'+G.eff.toFixed(2)+'x</b><br>'
    +'客房: '+rm1.join(' ')+'<br>设施: '+fc1.join(' ')+'<br>餐饮: '+fd1.join(' ');
}
function lg(m){var el=document.getElementById('lg');var d=document.createElement('div');d.textContent='[D'+G.d+'] '+m;el.insertBefore(d,el.firstChild);while(el.children.length>15)el.removeChild(el.lastChild);}
function rnd(){
  var el=document.getElementById('sh');el.innerHTML='';var lst=ALL[cat];
  for(var i=0;i<lst.length;i++)(function(it){
    var d=document.createElement('div');var lk=it.un&&G.totalSc.toFixed(1)*10<it.un*10;
    var oneD=it.one&&G.upg[it.id];var no=lk||oneD;
    d.className='it'+(sel===it.id?' sl':'')+(no?' no':'');
    var pr='';
    if(cat===0){var c=G.rooms[it.id]||0;pr='$'+it.cost+' 收$'+it.price+' [x'+c+']';}
    else if(cat===1){c=G.fcls[it.id]||0;pr='$'+it.cost+' [x'+c+']';}
    else if(cat===2){c=G.fd[it.id]||0;pr='$'+it.cost+' [x'+c+']';}
    else{pr='$'+it.cost+(oneD?' (完成)':'');}
    d.innerHTML='<div class="ic">'+it.ic+'</div><div class="nm">'+it.n+'</div><div class="pr">'+pr+'</div>'
      +(it.un?'<div class="xt">⭐'+(it.un/10).toFixed(1)+'解锁</div>':'');
    d.onclick=function(){
      if(lk){GameCore.hints.show('需要评分 ⭐'+(it.un/10).toFixed(1));return;}
      if(oneD){GameCore.hints.show('已完成');return;}
      if(G.m<it.cost){GameCore.hints.show('资金不足！');return;}
      if(cat===3){G.m-=it.cost;G.upg[it.id]=1;lg('🎁 升级: '+it.ic+it.n+' -$'+it.cost);}
      else{sel=sel===it.id?null:it.id;}
      calc();upd();rnd();
    };el.appendChild(d);
  })(lst[i]);
}
document.querySelectorAll('.tg').forEach(function(t){t.onclick=function(){
  document.querySelectorAll('.tg').forEach(function(x){x.classList.remove('on');});
  t.classList.add('on');cat=parseInt(t.dataset.c);sel=null;rnd();};});
function startD(){
  if(st!==STATE_PLAYING||onD)return;
  onD=true;dp=0;gst=[];G.dayI=0;G.dayC=0;
  var allRm=[];for(var k in G.rooms){for(var i=0;i<ROOMS.length;i++){if(ROOMS[i].id===k){
    for(var j=0;j<G.rooms[k];j++)allRm.push({rid:k,rm:ROOMS[i],used:false,dirty:false});
  }}}
  var nG=Math.min(allRm.length,Math.floor(G.totalSc*3+G.fCap*0.2+Math.random()*5));
  var sp=0,it2=setInterval(function(){
    if(st!==STATE_PLAYING||!onD){clearInterval(it2);return;}
    if(sp>=nG){clearInterval(it2);return;}
    var g=GUESTS[Math.floor(Math.random()*GUESTS.length)];
    var avR=allRm.filter(function(r){return!r.used&&!r.dirty&&r.rm.roomMin===undefined||(r.rm.sc*10>=g.roomMin&&r.rm.sc*10<=g.roomMax);});
    if(avR.length===0)avR=allRm.filter(function(r){return!r.used&&!r.dirty;});
    if(avR.length===0)return;
    var pick=avR[Math.floor(Math.random()*avR.length)];pick.used=true;
    var len=g.len+Math.floor(Math.random()*2);
    var fee=Math.floor(pick.rm.price*len*g.p*(1+G.incB*0.05));
    var fdfee=0;for(var k in G.fd)for(var i=0;i<FDB.length;i++)if(FDB[i].id===k){fdfee+=FDB[i].fee*g.fd*G.fd[k]*0.3;}
    fee+=Math.floor(fdfee);
    var gt={t:g,ic:g.ic,fee:fee,len:len,tip:g.tip,stay:0,
      x:-40,y:80+Math.random()*(H-160),tx:80+Math.random()*(W-240),ty:100+Math.random()*(H-200),
      inH:false,scB:g.scB||0,room:pick,ang:0};
    gst.push(gt);sp++;
  },500);
  upd();
}
function draw(){
  cx.fillStyle='#0f0520';cx.fillRect(0,0,W,H);
  cx.fillStyle='#1a0f2e';cx.fillRect(0,0,W,60);
  cx.fillStyle='#6a1b9a';cx.fillRect(0,55,W,5);
  cx.font='bold 14px sans-serif';cx.fillStyle='#f06292';cx.textAlign='left';
  cx.fillText('🏨 大酒店  |  评分: ⭐'+G.totalSc.toFixed(1)+'  |  房间: '+G.totalRooms,12,38);
  cx.font='11px sans-serif';cx.fillStyle='#ce93d8';cx.textAlign='right';
  cx.fillText(onD?('⏱️ '+Math.floor(dp)+'%'):'🌙 休息',W-15,38);
  cx.strokeStyle='rgba(106,27,154,0.35)';cx.lineWidth=1;
  for(var r=0;r<=G.GR;r++){cx.beginPath();cx.moveTo(20,65+r*G.CH);cx.lineTo(W-20,65+r*G.CH);cx.stroke();}
  for(var c=0;c<=G.GC;c++){cx.beginPath();cx.moveTo(20+c*G.CW,65);cx.lineTo(20+c*G.CW,H-15);cx.stroke();}
  for(r=0;r<G.GR;r++)for(c=0;c<G.GC;c++){
    var id=G.grid[r][c];if(!id||id.endsWith('_2'))continue;
    for(var t=0;t<3;t++){var lst=ALL[t];for(var i=0;i<lst.length;i++){if(lst[i].id===id){var it=lst[i];break;}}}
    if(!it)continue;
    var x=20+c*G.CW,y=65+r*G.CH,sz=(it.sz||1);
    var cols=['#7b1fa2','#ab47bc','#ec407a','#26c6da','#ffa726','#66bb6a','#ef5350','#5c6bc0'];
    cx.fillStyle=cols[(r*3+c+t)%cols.length];
    cx.fillRect(x+3,y+3,G.CW*sz-6,G.CH-6);
    cx.strokeStyle='#e1bee7';cx.strokeRect(x+3,y+3,G.CW*sz-6,G.CH-6);
    cx.font=Math.min(G.CW*0.45,G.CH*0.5)+'px sans-serif';cx.textAlign='center';cx.textBaseline='middle';
    cx.fillStyle='#fff';cx.fillText(it.ic,x+G.CW*sz/2,y+G.CH/2);
    if(it.cap){cx.font='9px sans-serif';cx.fillStyle='#fff176';cx.textAlign='right';cx.fillText(it.cap+'人',x+G.CW*sz-5,y+G.CH-6);}
  }
  if(sel&&st===STATE_PLAYING&&hv){
    var x=20+hv.c*G.CW,y=65+hv.r*G.CH;
    cx.strokeStyle=G.grid[hv.r][hv.c]?'#ef5350':'#ffd54f';cx.lineWidth=3;cx.setLineDash([5,4]);
    cx.strokeRect(x+1,y+1,G.CW-2,G.CH-2);cx.setLineDash([]);
  }
  for(var i=0;i<gst.length;i++){
    var g2=gst[i];if(g2.left)continue;
    if(!g2.inH){g2.x+=(g2.tx-g2.x)*0.05;g2.y+=(g2.ty-g2.y)*0.05;
      if(Math.abs(g2.x-g2.tx)<2&&Math.abs(g2.y-g2.ty)<2){g2.inH=true;g2.enter=Date.now();}}
    cx.font='24px sans-serif';cx.textAlign='center';cx.fillStyle='#fff';
    cx.fillText(g2.ic,g2.x,g2.y);
    cx.font='10px sans-serif';cx.fillStyle='#fff176';cx.fillText('$'+g2.fee,g2.x,g2.y+14);
    if(g2.inH&&!g2.done){
      g2.stay+=0.005*G.eff;
      if(g2.stay>=g2.len){g2.done=true;
        var tip=Math.floor(g2.fee*g2.tip);
        var gain=g2.fee+tip;
        G.m+=gain;G.dayI+=gain;G.tot+=gain;G.g++;G.dayC++;
        if(g2.scB)G.totalSc=Math.min(5,G.totalSc+0.02);
        if(g2.room)g2.room.dirty=true,g2.room.used=false;
        lg('👋 '+g2.t+'退房 +$'+gain+(tip?'(小费$'+tip+')':''));
        setTimeout(function(gg){return function(){gg.left=true;};}(g2),500);
        upd();
      }else{
        cx.fillStyle='rgba(0,0,0,0.5)';cx.fillRect(g2.x-15,g2.y-22,30,3);
        cx.fillStyle='#66bb6a';cx.fillRect(g2.x-15,g2.y-22,30*(g2.stay/g2.len),3);
      }
    }
  }
  if(onD){dp+=0.2;
    if(dp>=100&&gst.every(function(x){return x.left||x.done;}))endD();
    if(dp>=130)endD();
  }
}
function endD(){
  if(!onD)return;onD=false;
  var up=Math.floor(G.totalRooms*15+G.m*0.002);G.m-=up;lg('🛠️ 维护工资 -$'+up);
  var cl=Math.floor(G.totalRooms*8);G.m-=cl;lg('🧹 清洁支出 -$'+cl);
  G.d++;
  Storage.save('htl_hs',Math.max(Storage.load('htl_hs',0),G.tot));
  if(G.d>=60&&G.totalSc>=4.5){endG(true,'五星酒店传奇');return;}
  if(G.m<-3000){endG(false,'资金链断裂');return;}
  if(G.d>=100){endG(true,'百年老店');return;}
  gst=[];calc();upd();rnd();
}
function endG(w,t){
  st=STATE_OVER;Storage.save('htl_hs',Math.max(Storage.load('htl_hs',0),G.tot));
  document.getElementById('et').textContent=w?'🏆 '+t:'💸 '+t;
  document.getElementById('es').innerHTML='经营天数: <b>'+G.d+'</b><br>总营收: <b style="color:#ffd54f">$'+G.tot+'</b><br>'
    +'服务客人: <b>'+G.g+'</b>人<br>最终评分: <b>⭐'+G.totalSc.toFixed(1)+'</b>';
  document.getElementById('se').style.display='flex';
}
var hv=null;
function getCell(e){
  var rc=cv.getBoundingClientRect();var sx=cv.width/rc.width,sy=cv.height/rc.height;
  var x=(e.clientX-rc.left)*sx-20,y=(e.clientY-rc.top)*sy-65;
  var c=Math.floor(x/G.CW),r=Math.floor(y/G.CH);
  if(r<0||r>=G.GR||c<0||c>=G.GC)return null;return{r:r,c:c};
}
cv.addEventListener('mousemove',function(e){hv=getCell(e);});
cv.addEventListener('click',function(e){
  if(st!==STATE_PLAYING)return;var cl=getCell(e);if(!cl)return;
  if(sel&&cat<3){
    if(G.grid[cl.r][cl.c]){GameCore.hints.show('此处已占用');return;}
    for(var t=0;t<3;t++){var lst=ALL[t];for(var i=0;i<lst.length;i++){if(lst[i].id===sel){var it=lst[i];break;}}}
    if(G.m<it.cost){GameCore.hints.show('资金不足');return;}
    G.m-=it.cost;placeItem(cl.r,cl.c,sel);
    lg('🔨 建造 '+it.ic+it.n+' -$'+it.cost);sel=null;calc();upd();rnd();
  }else if(G.grid[cl.r][cl.c]){
    var id2=G.grid[cl.r][cl.c];if(id2.endsWith('_2'))return;
    if(confirm('拆除？(返还50%)')){
      for(t=0;t<3;t++){lst=ALL[t];for(i=0;i<lst.length;i++){if(lst[i].id===id2){it=lst[i];break;}}}
      var sz=it.sz||1;G.grid[cl.r][cl.c]=null;
      if(sz>1&&G.grid[cl.r][cl.c+1])G.grid[cl.r][cl.c+1]=null;
      if(t===0)G.rooms[id2]--;if(t===1)G.fcls[id2]--;if(t===2)G.fd[id2]--;
      G.m+=Math.floor(it.cost*0.5);lg('♻️ 拆除 '+it.n+' 返还$'+Math.floor(it.cost*0.5));
      calc();upd();
    }
  }
});
cv.addEventListener('touchstart',function(e){if(e.touches[0]){var t=e.touches[0];hv={clientX:t.clientX,clientY:t.clientY};hv=getCell(t);}},{passive:true});
document.addEventListener('keydown',function(e){
  if(e.key===' '){e.preventDefault();startD();}
  else if(e.key==='p'||e.key==='P')ps();
});
document.getElementById('btnDay').onclick=startD;
document.getElementById('btnP').onclick=ps;document.getElementById('btnRe').onclick=ps;
document.getElementById('btnRe2').onclick=function(){location.reload();};
document.getElementById('btnRs').onclick=function(){if(confirm('重新开始？'))location.reload();};
document.getElementById('btnAg').onclick=function(){location.reload();};
document.getElementById('btnSv').onclick=function(){Storage.save('htl_save',G);GameCore.hints.show('已保存！');};
function ps(){
  if(st===STATE_PLAYING){st=STATE_PAUSE;document.getElementById('sp').style.display='flex';}
  else if(st===STATE_PAUSE){st=STATE_PLAYING;document.getElementById('sp').style.display='none';}
}
function str(){
  var sv=Storage.load('htl_save',null);if(sv&&confirm('读取存档？')){G=sv;G.GR=8;G.GC=14;G.CW=(W-40)/G.GC;G.CH=(H-80)/G.GR;}
  else newG();
  document.getElementById('ss').style.display='none';st=STATE_PLAYING;
  if(tm)clearInterval(tm);tm=setInterval(draw,32);
  calc();upd();rnd();
}
document.getElementById('start-game-btn').addEventListener('click',str);
document.getElementById('hs').textContent='$'+Storage.load('htl_hs',0);
GameCore.init({highScore:'hotel'});
</script>

  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
