.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}

<body>

<button id="start-game-btn" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:20px 40px;font-size:20px;background:#ff6b35;color:white;border:none;border-radius:12px;cursor:pointer;z-index:999;font-weight:bold;display:none;">开始游戏</button>

<canvas id="c"></canvas>

<script>
if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
</script>
<script src="../game_core.js"></script>
<script>
(function(){
"use strict";

const W=480,H=800;
const GAME_TIME=90;
const BERTH_COUNT=3;
const CRANE_COUNT=4;
const CONTAINER_TYPES=[
    {name:'红箱',color:'#ef5350',dark:'#c62828'},
    {name:'蓝箱',color:'#42a5f5',dark:'#1565c0'},
    {name:'绿箱',color:'#66bb6a',dark:'#2e7d32'}
];
const SHIP_VARIANTS=[
    {name:'集装箱船',icon:'🚢',speedMul:1.0,cargoMul:1.0,bonus:1.0},
    {name:'散货船',icon:'⛴️',speedMul:0.85,cargoMul:1.4,bonus:1.2},
    {name:'油轮',icon:'🛳️',speedMul:0.7,cargoMul:0.7,bonus:1.6},
    {name:'快艇货轮',icon:'🚤',speedMul:1.4,cargoMul:0.6,bonus:0.9}
];

const BERTH_X=[110,240,370];
const BERTH_Y=290;
const BERTH_W=90;
const BERTH_H=130;
const QUEUE_START_X=-80;
const QUEUE_Y=180;
const QUEUE_GAP=75;
const WAREHOUSE_X=165;
const WAREHOUSE_Y=500;
const WAREHOUSE_W=150;
const WAREHOUSE_H=120;

const EVENTS=[
    {id:'tide',name:'🌊 大潮',desc:'装卸速度+30%,持续8秒',prob:0.08,eff:g=>{g.tideTimer=480;toast('🌊 大潮来临!装卸+30% 8s',200);sfxWin()}},
    {id:'machinery',name:'⚙️ 机械故障',desc:'随机1台起重机停工6秒',prob:0.06,eff:g=>{const idx=Math.floor(Math.random()*CRANE_COUNT);g.craneBroken[idx]=360;toast('⚙️ '+(idx+1)+'号起重机故障!6s',240);sfxError()}},
    {id:'bonus',name:'🎁 奖金日',desc:'完成船只奖励翻倍,持续10秒',prob:0.05,eff:g=>{g.bonusTimer=600;toast('🎁 奖金日!船只奖励×2 10s',240);sfxCoin()}},
    {id:'strike',name:'✊ 罢工',desc:'所有作业速度减半,持续5秒',prob:0.04,eff:g=>{g.strikeTimer=300;toast('✊ 工人罢工!效率-50% 5s',240);sfxError()}},
    {id:'inspection',name:'🛂 海关检查',desc:'仓库容量临时-20,5秒',prob:0.05,eff:g=>{g.inspectTimer=300;toast('🛂 海关抽查!仓容-20 5s',240);sfxError()}},
    {id:'vip_ship',name:'🤵 VIP船',desc:'下艘入港船完成后+300分',prob:0.05,eff:g=>{g.vipNext=true;toast('🤵 VIP船即将到港!完成+300',240);sfxCoin()}},
    {id:'donation',name:'💰 港务拨款',desc:'立即获得+200分',prob:0.08,eff:g=>{g.score+=200;toast('💰 港务拨款:+200分',180);sfxCoin()}},
    {id:'rush_hour',name:'🚨 高峰模式',desc:'10秒内来船速度翻倍',prob:0.05,eff:g=>{g.rushTimer=600;toast('🚨 高峰模式:船流×2 10s',240);sfxShipIn()}}
];

const UPGRADES=[
    {id:'wh1',name:'扩容仓库+20',cost:300,desc:'仓库容量上限+20',apply:g=>{g.warehouse.max+=20}},
    {id:'cr1',name:'起重机+1',cost:500,desc:'增加1台流动起重机(视觉)',apply:g=>{g.craneBonus+=1}},
    {id:'sp1',name:'泊位升级×3',cost:400,desc:'3个泊位装卸速度+25%',apply:g=>{g.berthSpeedMul*=1.25}},
    {id:'q1',name:'队列扩容',cost:250,desc:'拥堵阈值+2(7艘才开始扣)',apply:g=>{g.congestionThresh+=2}}
];

const ACHIEVEMENTS=[
    {id:'first',name:'首航告捷',desc:'完成首艘货船',check:g=>g.shipsCompleted>=1},
    {id:'ten',name:'十船码头',desc:'累计完成10艘',check:g=>g.shipsCompleted>=10},
    {id:'boxes100',name:'百箱吞吐',desc:'累计装卸100箱',check:g=>g.totalBoxes>=100},
    {id:'noStorm',name:'风雨无阻',desc:'风暴中完成3艘船',check:g=>g.stormCompleted>=3},
    {id:'noCong',name:'畅通无阻',desc:'单局拥堵扣分<100',check:g=>g.congestionPenalty<100},
    {id:'rich',name:'金牌港务',desc:'得分≥3000',check:g=>g.score>=3000},
    {id:'up',name:'港口扩建',desc:'购买任意1项升级',check:g=>Object.keys(g.upgradesDone).length>=1}
];

let audioCtx=null;
function initAudio(){
    if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
}
function playTone(freq,dur,type,vol){
    if(!audioCtx)return;
    try{
        const o=audioCtx.createOscillator();
        const g=audioCtx.createGain();
        o.type=type||'square';
        o.frequency.value=freq;
        g.gain.value=vol||0.15;
        g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
        o.connect(g);g.connect(audioCtx.destination);
        o.start();o.stop(audioCtx.currentTime+dur);
    }catch(e){}
}
function sfxShipIn(){playTone(180,0.2,'sine',0.18)}
function sfxCrane(){playTone(280,0.06,'square',0.1);setTimeout(()=>playTone(320,0.05,'square',0.08),60)}
function sfxDone(){playTone(523,0.1,'sine',0.2);setTimeout(()=>playTone(659,0.1,'sine',0.2),100);setTimeout(()=>playTone(784,0.2,'sine',0.2),200)}
function sfxStorm(){playTone(100,0.5,'sawtooth',0.18)}
function sfxBuzzer(){playTone(130,0.4,'sawtooth',0.2)}
function sfxBtn(){playTone(600,0.06,'sine',0.1)}
function sfxError(){playTone(150,0.2,'sawtooth',0.15)}
function sfxCoin(){playTone(700,0.06,'square',0.12);setTimeout(()=>playTone(900,0.1,'square',0.1),50)}
function sfxUpgrade(){playTone(440,0.08,'sine',0.16);setTimeout(()=>playTone(660,0.08,'sine',0.16),80);setTimeout(()=>playTone(880,0.15,'sine',0.18),160)}
function sfxAchieve(){playTone(659,0.08,'sine',0.18);setTimeout(()=>playTone(784,0.08,'sine',0.18),90);setTimeout(()=>playTone(988,0.18,'sine',0.2),180)}
function sfxEvent(){playTone(392,0.08,'triangle',0.14);setTimeout(()=>playTone(523,0.12,'triangle',0.14),90)}

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let scale=1;
function resize(){
    const vw=innerWidth,vh=innerHeight;
    scale=Math.min(vw/W,vh/H);
    canvas.width=W*scale;canvas.height=H*scale;
    canvas.style.width=W*scale+'px';canvas.style.height=H*scale+'px';
    canvas.getContext('2d').setTransform(scale,0,0,scale,0,0);
}
window.addEventListener('resize',resize);resize();

function getPos(e){
    const r=canvas.getBoundingClientRect();
    const t=e.touches?e.touches[0]:e;
    return{x:(t.clientX-r.left)/scale,y:(t.clientY-r.top)/scale};
}

const G={
    state:STATE_MENU,
    score:0,
    high:0,
    timeLeft:GAME_TIME*60,
    queue:[],
    berths:[null,null,null],
    berthTimers:[0,0,0],
    cranes:[],
    warehouse:{red:0,blue:0,green:0,max:80},
    selectedShip:null,
    selectedBerth:-1,
    mode:'assign',
    btnRects:{},
    shipsCompleted:0,
    totalBoxes:0,
    tickAcc:0,
    stormTimer:0,
    stormActive:false,
    stormCooldown:0,
    reinforceBtn:true,
    toaster:[],
    boxesAnim:[],
    particles:[],
    keys:{},
    spawnTimer:0,
    congestionPenalty:0,
    stormCompleted:0,
    upgradesDone:{},
    berthSpeedMul:1.0,
    craneBonus:0,
    congestionThresh:4,
    vipNext:false,
    achievementsUnlocked:{},
    currentAchievement:null,
    achAnimTimer:0,
    tideTimer:0,
    bonusTimer:0,
    inspectTimer:0,
    strikeTimer:0,
    rushTimer:0,
    craneBroken:[0,0,0,0],
    showStats:false,
    showUpgrade:false,
    eventScore:0
};

G.high=parseInt(Storage.load('gk_highscore','0'));

function toast(text,life){
    G.toaster.push({text:text,life:life||180,maxLife:life||180,y:0});
}

function makeShip(){
    const type=Math.floor(Math.random()*3);
    const variant=Math.floor(Math.random()*SHIP_VARIANTS.length);
    const sv=SHIP_VARIANTS[variant];
    const baseAmt=3+Math.floor(Math.random()*8);
    const amt=Math.max(2,Math.round(baseAmt*sv.cargoMul));
    const vip=G.vipNext;
    if(G.vipNext)G.vipNext=false;
    return{
        id:Math.random().toString(36).slice(2,9),
        cargoType:type,
        cargoTotal:amt,
        cargoDone:0,
        x:QUEUE_START_X,
        y:0,
        queueIdx:0,
        status:'queue',
        berthedAt:-1,
        workTimer:0,
        leaveT:0,
        assigned:false,
        color:['#8d6e63','#6d4c41','#5d4037','#795548','#6d4c41'][Math.floor(Math.random()*5)],
        shipName:['远洋号','海鸥号','蓝鲸号','奋进号','胜利号','和平号','长城号','神舟号','东方号','珍珠号'][Math.floor(Math.random()*10)],
        variant:variant,
        speedMul:sv.speedMul,
        bonusMul:sv.bonus,
        isVip:vip,
        waitTimer:0,
        craneT:0
    };
}

function initCranes(){
    G.cranes=[];
    const craneX=[110,185,295,370];
    for(let i=0;i<CRANE_COUNT;i++){
        G.cranes.push({
            idx:i,
            x:craneX[i],
            baseY:BERTH_Y-10,
            armAngle:0,
            targetBerth:-1,
            busy:false,
            box:null,
            anim:0,
            workT:0,
            returnX:craneX[i]
        });
    }
}

function initState(){
    G.state=STATE_PLAYING;
    G.score=0;
    G.timeLeft=GAME_TIME*60;
    G.queue=[];
    G.berths=[null,null,null];
    G.berthTimers=[0,0,0];
    G.warehouse={red:20,blue:20,green:20,max:80};
    G.selectedShip=null;
    G.selectedBerth=-1;
    G.mode='assign';
    G.shipsCompleted=0;
    G.totalBoxes=0;
    G.tickAcc=0;
    G.stormTimer=0;
    G.stormActive=false;
    G.stormCooldown=600;
    G.reinforceBtn=true;
    G.toaster=[];
    G.boxesAnim=[];
    G.particles=[];
    G.spawnTimer=120;
    G.congestionPenalty=0;
    G.stormCompleted=0;
    G.upgradesDone={};
    G.berthSpeedMul=1.0;
    G.craneBonus=0;
    G.congestionThresh=4;
    G.vipNext=false;
    G.achievementsUnlocked={};
    G.currentAchievement=null;
    G.achAnimTimer=0;
    G.tideTimer=0;G.bonusTimer=0;G.inspectTimer=0;G.strikeTimer=0;G.rushTimer=0;
    G.craneBroken=[0,0,0,0];
    G.showStats=false;G.showUpgrade=false;G.eventScore=0;
    initCranes();
    for(let i=0;i<2;i++){
        const s=makeShip();
        s.queueIdx=G.queue.length;
        G.queue.push(s);
    }
    toast('⚓ 欢迎来到港口!点候船→点泊位→装卸货',300);
}

function startGame(){
    initAudio();
    initState();
    sfxBtn();
}

function endGame(){
    G.state=STATE_OVER;
    const achCount=Object.keys(G.achievementsUnlocked).length;
    G.score+=achCount*150;
    if(G.score>G.high){
        G.high=G.score;
        Storage.save('gk_highscore',G.high);
    }
    sfxBuzzer();
}

function togglePause(){
    if(G.state===STATE_PLAYING)G.state=STATE_PAUSE;
    else if(G.state===STATE_PAUSE)G.state=STATE_PLAYING;
    sfxBtn();
}

function unlockAchievement(id){
    if(G.achievementsUnlocked[id])return;
    const ach=ACHIEVEMENTS.find(a=>a.id===id);
    if(!ach)return;
    G.achievementsUnlocked[id]=true;
    G.currentAchievement=ach;
    G.achAnimTimer=180;
    G.score+=100;
    sfxAchieve();
    toast('🏆 成就: '+ach.name+' +100分',240);
}

function checkAchievements(){
    ACHIEVEMENTS.forEach(a=>{
        if(!G.achievementsUnlocked[a.id]&&a.check(G))unlockAchievement(a.id);
    });
}

function tryBuyUpgrade(idx){
    const up=UPGRADES[idx];
    if(G.upgradesDone[up.id]){sfxError();toast('⚠️ 已购买该升级',120);return false}
    if(G.score<up.cost){sfxError();toast('💸 分数不足!需要'+up.cost,150);return false}
    G.score-=up.cost;
    G.upgradesDone[up.id]=true;
    up.apply(G);
    sfxUpgrade();
    toast('⬆️ 升级成功: '+up.name,200);
    return true;
}

function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
}

function drawBtn(ctx,x,y,w,h,text,name,color,txtColor){
    G.btnRects[name]={x:x,y:y,w:w,h:h};
    ctx.fillStyle=color||'#ff6b35';
    ctx.strokeStyle='#fff';
    ctx.lineWidth=2;
    roundRect(ctx,x,y,w,h,8);
    ctx.fill();ctx.stroke();
    ctx.fillStyle=txtColor||'#fff';
    ctx.font='bold 14px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(text,x+w/2,y+h/2);
    ctx.textBaseline='alphabetic';ctx.textAlign='left';
}

function hitBtn(p,name){
    const r=G.btnRects[name];
    return r&&p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;
}

function shipRect(s){
    if(s.status==='queue'){
        return{x:s.x,y:QUEUE_Y+s.queueIdx*QUEUE_GAP,w:90,h:52};
    }else if(s.status==='berthing'||s.status==='working'||s.status==='leaving'){
        const bx=BERTH_X[s.berthedAt];
        return{x:bx-BERTH_W/2+5,y:BERTH_Y+20,w:BERTH_W-10,h:60};
    }
    return{x:0,y:0,w:0,h:0};
}

function pointInShip(p,s){
    const r=shipRect(s);
    return p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;
}

function berthAt(p){
    for(let i=0;i<BERTH_COUNT;i++){
        const bx=BERTH_X[i]-BERTH_W/2;
        if(p.x>=bx&&p.x<=bx+BERTH_W&&p.y>=BERTH_Y&&p.y<=BERTH_Y+BERTH_H)return i;
    }
    return -1;
}

function effWarehouseMax(){
    return G.inspectTimer>0?G.warehouse.max-20:G.warehouse.max;
}

function assignShipToBerth(ship,berthIdx){
    if(G.berths[berthIdx]){sfxError();toast('该泊位有船!',100);return false}
    ship.status='berthing';
    ship.berthedAt=berthIdx;
    ship.workTimer=0;
    G.berths[berthIdx]=ship;
    G.queue=G.queue.filter(s=>s.id!==ship.id);
    G.queue.forEach((s,i)=>s.queueIdx=i);
    G.selectedShip=null;
    sfxShipIn();
    toast((ship.isVip?'🤵VIP ':'')+ship.shipName+' 驶入'+(berthIdx+1)+'号泊位',150);
    return true;
}

function addBoxAnim(fromX,fromY,toX,toY,typeIdx){
    G.boxesAnim.push({fx:fromX,fy:fromY,tx:toX,ty:toY,x:fromX,y:fromY,t:0,life:40,type:typeIdx});
}

function addParticles(x,y,color,n){
    for(let i=0;i<n;i++){
        G.particles.push({
            x:x,y:y,
            vx:(Math.random()-0.5)*4,
            vy:(Math.random()-0.5)*4-1,
            life:20+Math.random()*20,
            maxLife:30,
            color:color,
            size:1+Math.random()*2
        });
    }
}

function tryUnload(ship,berthIdx){
    const key=['red','blue','green'][ship.cargoType];
    const max=effWarehouseMax();
    if(ship.cargoDone<ship.cargoTotal){
        if(G.warehouse[key]<max){
            G.warehouse[key]++;
            ship.cargoDone++;
            G.totalBoxes++;
            let s=10;
            if(G.bonusTimer>0)s*=1.5;
            G.score+=Math.round(s);
            G.eventScore+=Math.round(s);
            sfxCrane();
            addBoxAnim(BERTH_X[berthIdx],BERTH_Y+60,WAREHOUSE_X+WAREHOUSE_W/2,WAREHOUSE_Y+30,ship.cargoType);
        }else{
            toast('仓库已满!等待出货',120);
        }
    }
    if(ship.cargoDone>=ship.cargoTotal){
        finishShip(ship,berthIdx);
    }
}

function tryLoad(ship,berthIdx){
    const key=['red','blue','green'][ship.cargoType];
    if(G.warehouse[key]>0&&ship.cargoDone<ship.cargoTotal){
        G.warehouse[key]--;
        ship.cargoDone++;
        G.totalBoxes++;
        let s=10;
        if(G.bonusTimer>0)s*=1.5;
        G.score+=Math.round(s);
        G.eventScore+=Math.round(s);
        sfxCrane();
        addBoxAnim(WAREHOUSE_X+WAREHOUSE_W/2,WAREHOUSE_Y+30,BERTH_X[berthIdx],BERTH_Y+60,ship.cargoType);
    }else if(G.warehouse[key]<=0&&ship.cargoDone<ship.cargoTotal){
        toast(CONTAINER_TYPES[ship.cargoType].name+'不足!',120);
    }
    if(ship.cargoDone>=ship.cargoTotal){
        finishShip(ship,berthIdx);
    }
}

function finishShip(ship,berthIdx){
    const remainSec=Math.ceil(G.timeLeft/60);
    let bonus=remainSec*2;
    bonus=Math.round(bonus*ship.bonusMul);
    if(G.bonusTimer>0)bonus*=2;
    if(ship.isVip)bonus+=300;
    G.score+=bonus;
    G.shipsCompleted++;
    if(G.stormActive)G.stormCompleted++;
    ship.status='leaving';
    ship.leaveT=0;
    G.berths[berthIdx]=null;
    sfxDone();
    toast((ship.isVip?'🤵VIP ':'')+ship.shipName+'完成!+'+bonus+(ship.isVip?'(VIP+300)':'时间奖励'),180);
    checkAchievements();
}

function triggerStorm(){
    G.stormActive=true;
    G.stormTimer=300;
    G.reinforceBtn=true;
    sfxStorm();
    toast('⛈️ 风暴来袭!点加固减停工',240);
}

function tryTriggerEvent(){
    if(G.tickAcc%210!==0)return;
    if(Math.random()>0.25)return;
    const pool=EVENTS.filter(e=>Math.random()<Math.max(0.1,e.prob*3.5));
    if(pool.length===0)return;
    const ev=pool[Math.floor(Math.random()*pool.length)];
    ev.eff(G);
    sfxEvent();
}

function update(){
    if(G.state!==STATE_PLAYING)return;
    G.timeLeft--;
    G.tickAcc++;
    G.spawnTimer--;
    if(G.achAnimTimer>0)G.achAnimTimer--;
    if(G.tideTimer>0)G.tideTimer--;
    if(G.bonusTimer>0)G.bonusTimer--;
    if(G.inspectTimer>0)G.inspectTimer--;
    if(G.strikeTimer>0)G.strikeTimer--;
    if(G.rushTimer>0)G.rushTimer--;
    for(let i=0;i<CRANE_COUNT;i++)if(G.craneBroken[i]>0)G.craneBroken[i]--;
    let sp=180+Math.floor(Math.random()*180);
    if(G.rushTimer>0)sp=Math.floor(sp/2);
    if(G.spawnTimer<=0){
        G.spawnTimer=sp;
        if(G.queue.length<10){
            const s=makeShip();
            s.queueIdx=G.queue.length;
            G.queue.push(s);
            sfxShipIn();
        }
    }
    if(G.queue.length>G.congestionThresh){
        const extra=G.queue.length-G.congestionThresh;
        if(G.tickAcc%60===0){
            const loss=50*extra;
            G.score=Math.max(0,G.score-loss);
            G.congestionPenalty+=loss;
            if(extra>=2)toast('⚠️ 拥堵!-'+loss+'分',90);
        }
    }
    if(!G.stormActive){
        G.stormCooldown--;
        if(G.stormCooldown<=0&&G.tickAcc%60===0&&Math.random()<0.02){
            triggerStorm();
            G.stormCooldown=900;
        }
    }else{
        G.stormTimer--;
        if(G.stormTimer<=0){
            G.stormActive=false;
            toast('🌞 风暴结束，恢复作业',150);
        }
    }
    tryTriggerEvent();
    G.queue.forEach(s=>{s.waitTimer++});
    G.queue.forEach((s,i)=>{
        const targetX=60;
        s.x+=(targetX+s.queueIdx*0-s.x)*0.04;
        if(s.x<20)s.x+=0.5;
    });
    for(let i=0;i<BERTH_COUNT;i++){
        const s=G.berths[i];
        if(!s)continue;
        if(s.status==='berthing'){
            s.workTimer++;
            const need=Math.round(45/s.speedMul);
            if(s.workTimer>=need){
                s.status='working';
                s.workTimer=0;
            }
        }else if(s.status==='working'){
            s.workTimer++;
            let baseInterval=120;
            baseInterval/=G.berthSpeedMul;
            if(G.tideTimer>0)baseInterval*=0.7;
            if(G.strikeTimer>0)baseInterval*=2;
            if(G.stormActive)baseInterval=0;
            if(!G.stormActive&&s.workTimer>=Math.round(baseInterval)){
                s.workTimer=0;
                const availCranes=G.cranes.filter(c=>!c.busy&&G.craneBroken[c.idx]<=0);
                if(availCranes.length>0){
                    const c=availCranes[0];
                    c.busy=true;
                    c.targetBerth=i;
                    c.workT=0;
                    c.box=s.cargoType;
                }
            }
        }else if(s.status==='leaving'){
            s.leaveT++;
            const bx=BERTH_X[i];
            const t=s.leaveT/60;
            s.x=bx-BERTH_W/2+5+t*400;
            if(s.leaveT>=80){
                G.berths[i]=null;
            }
        }
    }
    G.cranes.forEach(c=>{
        c.anim=(c.anim+0.03)%(Math.PI*2);
        if(G.craneBroken[c.idx]>0)return;
        if(c.busy&&c.targetBerth>=0){
            c.workT++;
            const total=90;
            if(c.workT<30){
                const t=c.workT/30;
                c.armAngle=(BERTH_X[c.targetBerth]-c.returnX)*t*0.015;
            }else if(c.workT<60){
                if(c.workT===30){
                    const s=G.berths[c.targetBerth];
                    if(s&&s.status==='working'){
                        if(Math.random()<0.5)tryUnload(s,c.targetBerth);
                        else tryLoad(s,c.targetBerth);
                    }
                }
            }else if(c.workT<total){
                const t=(c.workT-60)/30;
                c.armAngle=(BERTH_X[c.targetBerth]-c.returnX)*(1-t)*0.015;
            }else{
                c.busy=false;
                c.armAngle=0;
                c.targetBerth=-1;
                c.box=null;
            }
        }
    });
    for(let i=G.boxesAnim.length-1;i>=0;i--){
        const b=G.boxesAnim[i];
        b.t++;
        const tt=b.t/b.life;
        b.x=b.fx+(b.tx-b.fx)*tt;
        b.y=b.fy+(b.ty-b.fy)*tt-Math.sin(tt*Math.PI)*40;
        b.life--;
        if(b.life<=0){
            addParticles(b.tx,b.ty,CONTAINER_TYPES[b.type].color,6);
            G.boxesAnim.splice(i,1);
        }
    }
    for(let i=G.particles.length-1;i>=0;i--){
        const p=G.particles[i];
        p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;
        p.life--;
        if(p.life<=0)G.particles.splice(i,1);
    }
    for(let i=G.toaster.length-1;i>=0;i--){
        G.toaster[i].life--;
        G.toaster[i].y+=(G.toaster.length-1-i)*0.3;
        if(G.toaster[i].life<=0)G.toaster.splice(i,1);
    }
    if(G.selectedBerth>=0&&G.mode==='work'){
        if(!G.berths[G.selectedBerth]){G.selectedBerth=-1;G.mode='assign'}
    }
    checkAchievements();
    if(G.timeLeft<=0){endGame();return}
}

function drawSeaAndSky(){
    const sky=ctx.createLinearGradient(0,0,0,220);
    sky.addColorStop(0,'#1565c0');sky.addColorStop(1,'#42a5f5');
    ctx.fillStyle=sky;ctx.fillRect(0,0,W,220);
    if(G.stormActive){
        ctx.fillStyle='rgba(30,30,50,0.45)';
        ctx.fillRect(0,0,W,220);
    }
    const sunX=80,sunY=50;
    ctx.fillStyle=G.stormActive?'#555':'#ffeb3b';
    ctx.beginPath();ctx.arc(sunX,sunY,22,0,Math.PI*2);ctx.fill();
    if(!G.stormActive){
        ctx.fillStyle='rgba(255,255,255,0.85)';
        const cloudX=(Date.now()/80)%(W+120)-60;
        drawCloud(cloudX,80);drawCloud(cloudX-180,120);
    }else{
        ctx.fillStyle='rgba(60,60,80,0.7)';
        for(let i=0;i<5;i++){
            drawCloud(i*130-40,30+i*15);
            drawCloud(i*130+20,80+i*10);
        }
        for(let i=0;i<30;i++){
            const lx=(Date.now()/3+i*157)%W;
            const ly=(Date.now()/2+i*83)%220;
            ctx.fillStyle='rgba(180,200,255,0.7)';
            ctx.fillRect(lx,ly,1.5,6);
        }
    }
    const sea=ctx.createLinearGradient(0,220,0,BERTH_Y+BERTH_H+40);
    sea.addColorStop(0,'#1976d2');sea.addColorStop(0.5,'#0d47a1');sea.addColorStop(1,'#0a3069');
    ctx.fillStyle=sea;ctx.fillRect(0,220,W,BERTH_Y+BERTH_H+40-220);
    ctx.strokeStyle='rgba(255,255,255,0.22)';
    ctx.lineWidth=1;
    for(let i=0;i<14;i++){
        const yy=230+i*18;
        const off=(Date.now()/30+i*23)%40;
        ctx.beginPath();
        for(let x=-40;x<W+40;x+=20){
            ctx.moveTo(x+off,yy+Math.sin((x+Date.now()/25)/25)*3);
            ctx.lineTo(x+10+off,yy+Math.sin((x+Date.now()/25+10)/25)*3);
        }
        ctx.stroke();
    }
    if(G.stormActive){
        ctx.strokeStyle='rgba(200,220,255,0.5)';
        ctx.lineWidth=2;
        for(let i=0;i<3;i++){
            const yy=280+i*50+(Date.now()/50)%40;
            ctx.beginPath();
            for(let x=0;x<W;x+=10){
                ctx.lineTo(x,yy+Math.sin((x+Date.now()/8)/10)*8);
            }
            ctx.stroke();
        }
    }
}

function drawCloud(x,y){
    ctx.beginPath();
    ctx.arc(x,y,18,0,Math.PI*2);
    ctx.arc(x+22,y-6,22,0,Math.PI*2);
    ctx.arc(x+48,y,18,0,Math.PI*2);
    ctx.arc(x+26,y+10,20,0,Math.PI*2);
    ctx.fill();
}

function drawBerth(i){
    const x=BERTH_X[i]-BERTH_W/2;
    const y=BERTH_Y;
    const occupied=!!G.berths[i];
    const selected=G.selectedBerth===i;
    ctx.fillStyle=occupied?'#37474f':'#455a64';
    roundRect(ctx,x,y,BERTH_W,BERTH_H,6);ctx.fill();
    ctx.strokeStyle=selected?'#ffeb3b':'#78909c';
    ctx.lineWidth=selected?4:2;
    ctx.stroke();
    ctx.fillStyle='#546e7a';
    for(let px=0;px<BERTH_W;px+=12){
        ctx.fillRect(x+px,y-6,8,6);
    }
    ctx.fillStyle='#37474f';
    ctx.fillRect(x-4,y,4,BERTH_H);
    ctx.fillStyle=occupied?'#ef5350':'#66bb6a';
    roundRect(ctx,x+8,y+8,18,18,4);ctx.fill();
    ctx.fillStyle='#fff';
    ctx.font='bold 12px Arial';
    ctx.textAlign='center';
    ctx.fillText((occupied?'X':(i+1)),x+17,y+22);
    ctx.fillStyle='#fff';
    ctx.font='bold 14px "Microsoft YaHei"';
    ctx.fillText(i+1+'号泊位',x+BERTH_W/2,y+BERTH_H-10);
    ctx.textAlign='left';
    if(G.stormActive){
        ctx.fillStyle='rgba(255,0,0,0.25)';
        ctx.fillRect(x,y,BERTH_W,BERTH_H);
        ctx.fillStyle='#ffeb3b';
        ctx.font='bold 12px "Microsoft YaHei"';
        ctx.textAlign='center';
        ctx.fillText('⛈停工',x+BERTH_W/2,y+BERTH_H/2);
        ctx.textAlign='left';
    }
}

function drawShip(s){
    const r=shipRect(s);
    if(s.status==='leaving'&&r.x>W+20)return;
    ctx.save();
    ctx.translate(r.x+r.w/2,r.y+r.h/2);
    ctx.shadowColor='rgba(0,0,0,0.4)';
    ctx.shadowBlur=8;ctx.shadowOffsetY=4;
    ctx.fillStyle=s.color;
    roundRect(ctx,-r.w/2,-r.h/2+8,r.w,r.h-16,8);ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#37474f';
    ctx.beginPath();
    ctx.moveTo(-r.w/2,r.h/2-16);
    ctx.lineTo(r.w/2-6,r.h/2-16);
    ctx.lineTo(r.w/2,r.h/2);
    ctx.lineTo(-r.w/2,r.h/2);
    ctx.closePath();ctx.fill();
    ctx.fillStyle='#e0e0e0';
    roundRect(ctx,-r.w/2+6,-r.h/2-8,r.w*0.45,18,4);ctx.fill();
    ctx.fillStyle='#b71c1c';
    ctx.fillRect(-r.w/2+10,-r.h/2-20,6,14);
    ctx.fillStyle=s.isVip?'#ff4081':'#ffeb3b';
    ctx.beginPath();ctx.moveTo(-r.w/2+16,-r.h/2-20);
    ctx.lineTo(-r.w/2+(s.isVip?34:28),-r.h/2-16);ctx.lineTo(-r.w/2+16,-r.h/2-12);
    ctx.closePath();ctx.fill();
    if(s.isVip){
        ctx.fillStyle='#ffd700';
        ctx.font='12px sans-serif';
        ctx.textAlign='center';
        ctx.fillText('VIP',0,-r.h/2-24);
        ctx.textAlign='left';
    }
    const ct=CONTAINER_TYPES[s.cargoType];
    const boxW=14,boxH=11;
    const done=s.cargoDone,total=s.cargoTotal;
    const cols=4;
    for(let i=0;i<total;i++){
        const col=i%cols,row=Math.floor(i/cols);
        const bx=-r.w/2+r.w*0.58+col*(boxW+2);
        const by=r.h/2-20-row*(boxH+2);
        const unloaded=i<done;
        if(!unloaded){
            ctx.fillStyle=ct.color;
            roundRect(ctx,bx,by-boxH,boxW,boxH,2);ctx.fill();
            ctx.strokeStyle=ct.dark;ctx.lineWidth=1;ctx.stroke();
        }else{
            ctx.strokeStyle=ct.dark;
            ctx.globalAlpha=0.3;
            roundRect(ctx,bx,by-boxH,boxW,boxH,2);ctx.stroke();
            ctx.globalAlpha=1;
        }
    }
    const selected=G.selectedShip&&G.selectedShip.id===s.id;
    if(selected){
        ctx.strokeStyle='#ffeb3b';ctx.lineWidth=3;
        ctx.setLineDash([5,5]);
        roundRect(ctx,-r.w/2-4,-r.h/2-12,r.w+8,r.h+16,10);ctx.stroke();
        ctx.setLineDash([]);
    }
    if(s.status==='working'){
        const ratio=done/total;
        const bx=-r.w/2,by=-r.h/2-22;
        ctx.fillStyle='rgba(0,0,0,0.6)';
        roundRect(ctx,bx,by,r.w,7,3);ctx.fill();
        ctx.fillStyle=ratio>=1?'#66bb6a':'#ffb300';
        roundRect(ctx,bx,by,r.w*ratio,7,3);ctx.fill();
    }
    ctx.restore();
    ctx.save();
    ctx.translate(r.x+r.w/2,r.y);
    ctx.fillStyle='rgba(0,0,0,0.7)';
    roundRect(ctx,-45,-r.h/2-38,90,16,5);ctx.fill();
    ctx.fillStyle='#fff';
    ctx.font='bold 10px "Microsoft YaHei"';
    ctx.textAlign='center';
    const sv=SHIP_VARIANTS[s.variant];
    ctx.fillText(sv.icon+s.shipName,0,-r.h/2-26);
    ctx.textAlign='left';
    ctx.restore();
}

function drawBoxesAndParticles(){
    G.boxesAnim.forEach(b=>{
        const ct=CONTAINER_TYPES[b.type];
        ctx.fillStyle=ct.color;
        roundRect(ctx,b.x-9,b.y-6,18,12,2);ctx.fill();
        ctx.strokeStyle=ct.dark;ctx.lineWidth=1;ctx.stroke();
        ctx.globalAlpha=b.life/40*0.3;
        ctx.fillStyle=ct.color;
        ctx.beginPath();ctx.arc(b.x,b.y,14,0,Math.PI*2);ctx.fill();
        ctx.globalAlpha=1;
    });
    G.particles.forEach(p=>{
        ctx.globalAlpha=p.life/p.maxLife;

        ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
    });
    ctx.globalAlpha=1;

function draw(){
    if(G.state===STATE_MENU){drawMenu();return}
    const bg=ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#0d1b2a');bg.addColorStop(1,'#1b2838');
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    if(G.state===STATE_PLAYING){
        drawHUD();
        drawScene();
        drawBottomUI();
        drawToasts();
        drawAchievementPopup();
        if(G.showStats)drawStatsPanel();
        if(G.showUpgrade)drawUpgradePanel();
    }else if(G.state===STATE_PAUSE){
        drawHUD();drawScene();drawBottomUI();
        if(G.showStats)drawStatsPanel();
        drawPause();
    }else if(G.state===STATE_OVER){
        drawHUD();drawScene();
        drawOver();
    }
}

function onPointerDown(p){
    initAudio();
    if(G.state===STATE_MENU){
        if(hitBtn(p,'start')){startGame();return}
    }else if(G.state===STATE_PAUSE){
        if(hitBtn(p,'resume')){G.state=STATE_PLAYING;sfxBtn();return}
        if(hitBtn(p,'menu')){G.state=STATE_MENU;sfxBtn();return}
        if(hitBtn(p,'statsBtn2')){G.showStats=!G.showStats;sfxBtn();return}
    }else if(G.state===STATE_OVER){
        if(hitBtn(p,'restart')){startGame();return}
        if(hitBtn(p,'menu')){G.state=STATE_MENU;sfxBtn();return}
    }
    if(G.state!==STATE_PLAYING)return;
    if(hitBtn(p,'pause')){togglePause();return}
    if(hitBtn(p,'btnStats')||hitBtn(p,'closeStats')){G.showStats=!G.showStats;G.showUpgrade=false;sfxBtn();return}
    if(hitBtn(p,'btnUpgrade')||hitBtn(p,'closeUpgrade')){G.showUpgrade=!G.showUpgrade;G.showStats=false;sfxBtn();return}
    for(let i=0;i<UPGRADES.length;i++){
        if(hitBtn(p,'up'+i)){tryBuyUpgrade(i);return}
    }
    if(hitBtn(p,'reinforce')){
        if(G.stormActive&&G.reinforceBtn){
            G.stormTimer=Math.min(G.stormTimer,120);
            G.reinforceBtn=false;
            G.score=Math.max(0,G.score-20);
            sfxBuzzer();
            toast('🛡 加固完成,停工缩短!-20分',180);
        }
        return;
    }
    for(let i=0;i<3;i++){
        if(hitBtn(p,'berth'+i)){
            if(G.selectedShip){
                assignShipToBerth(G.selectedShip,i);
            }else{
                G.selectedBerth=i;
                sfxBtn();
            }
            return;
        }
    }
    if(hitBtn(p,'btnAssign')){
        G.mode='assign';sfxBtn();return;
    }
    if(hitBtn(p,'btnUnload')){
        let did=false;
        for(let i=0;i<3;i++){
            const s=G.berths[i];
            if(s&&s.status==='working'){
                tryUnload(s,i);
                did=true;
                G.selectedBerth=i;
            }
        }
        if(!did){sfxError();toast('没有正在作业的船只',120)}
        return;
    }
    if(hitBtn(p,'btnLoad')){
        let did=false;
        for(let i=0;i<3;i++){
            const s=G.berths[i];
            if(s&&s.status==='working'){
                tryLoad(s,i);
                did=true;
                G.selectedBerth=i;
            }
        }
        if(!did){sfxError();toast('没有正在作业的船只',120)}
        return;
    }
    for(const s of G.queue){
        if(pointInShip(p,s)){G.selectedShip=s;sfxBtn();return}
    }
    const bi=berthAt(p);
    if(bi>=0){
        if(G.selectedShip){
            assignShipToBerth(G.selectedShip,bi);
        }else{
            G.selectedBerth=bi;sfxBtn();
        }
        return;
    }
    for(let i=0;i<3;i++){
        const s=G.berths[i];
        if(s&&pointInShip(p,s)){
            G.selectedBerth=i;
            G.selectedShip=s;
            sfxBtn();
            return;
        }
    }
}
function onPointerMove(p){if(G.state!==STATE_PLAYING)return}
function onPointerUp(p){}

window.addEventListener('keydown',function(e){
    const k=e.key.toLowerCase();
    G.keys[k]=true;
    initAudio();
    if(e.key===' '){e.preventDefault();if(G.state===STATE_MENU||G.state===STATE_OVER){startGame();return}}
    if(e.key==='Escape'){if(G.state===STATE_PLAYING||G.state===STATE_PAUSE)togglePause();return}
    if(e.key==='Tab'){e.preventDefault();if(G.state===STATE_PLAYING||G.state===STATE_PAUSE){G.showStats=!G.showStats;G.showUpgrade=false;sfxBtn()}return}
    if(G.state!==STATE_PLAYING)return;
    if(e.key==='1'){
        if(G.selectedShip)assignShipToBerth(G.selectedShip,0);
        else G.selectedBerth=0;
    }
    if(e.key==='2'){
        if(G.selectedShip)assignShipToBerth(G.selectedShip,1);
        else G.selectedBerth=1;
    }
    if(e.key==='3'){
        if(G.selectedShip)assignShipToBerth(G.selectedShip,2);
        else G.selectedBerth=2;
    }
    if(k==='u'){
        let did=false;
        for(let i=0;i<3;i++){
            const s=G.berths[i];
            if(s&&s.status==='working'){tryUnload(s,i);did=true;G.selectedBerth=i}
        }
        if(!did){sfxError();toast('无作业船只',90)}
    }
    if(k==='l'){
        let did=false;
        for(let i=0;i<3;i++){
            const s=G.berths[i];
            if(s&&s.status==='working'){tryLoad(s,i);did=true;G.selectedBerth=i}
        }
        if(!did){sfxError();toast('无作业船只',90)}
    }
    if(k==='tab'){e.preventDefault()}
    if(k==='+'){G.showUpgrade=!G.showUpgrade;G.showStats=false;sfxBtn()}
    if(k==='-'){G.showStats=!G.showStats;G.showUpgrade=false;sfxBtn()}
    if(k==='tab'){e.preventDefault()}
    if(k==='r'&&G.stormActive&&G.reinforceBtn){
        G.stormTimer=Math.min(G.stormTimer,120);
        G.reinforceBtn=false;G.score=Math.max(0,G.score-20);
        toast('🛡 加固完成 -20分',150);
    }
});
window.addEventListener('keyup',function(e){G.keys[e.key.toLowerCase()]=false});

canvas.addEventListener('mousedown',e=>onPointerDown(getPos(e)));
canvas.addEventListener('mousemove',e=>onPointerMove(getPos(e)));
canvas.addEventListener('mouseup',e=>onPointerUp(getPos(e)));
canvas.addEventListener('touchstart',function(e){e.preventDefault();onPointerDown(getPos(e))},{passive:false});
canvas.addEventListener('touchmove',function(e){e.preventDefault();onPointerMove(getPos(e))},{passive:false});
canvas.addEventListener('touchend',function(e){e.preventDefault();onPointerUp(getPos(e))},{passive:false});

function loop(){update();draw();}
setInterval(loop,16);

const _sbtn=document.getElementById('start-game-btn');
_sbtn.addEventListener('click',function(){initAudio();startGame();this.style.display='none';});

})();
</script>

    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();

<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
