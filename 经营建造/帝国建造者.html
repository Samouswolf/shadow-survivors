<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>帝国建造者</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a0f08; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: auto; font-family: "Microsoft YaHei", "SimHei", sans-serif; }
#wrap { width: 100%; max-width: 980px; padding: 8px; }
canvas { border: 3px solid #5c3a21; border-radius: 10px; cursor: pointer; max-width: 100%; height: auto; background: #3d2817; display: block; margin: 0 auto; box-shadow: 0 0 30px rgba(139,90,43,0.3); }
#topBar { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 8px; }
.stat { background: linear-gradient(180deg, #4a3520, #2d1f12); border: 1px solid #6b4423; border-radius: 8px; padding: 8px; text-align: center; }
.stat .label { font-size: 11px; color: #c9a57b; }
.stat .value { font-size: 18px; font-weight: bold; color: #ffd700; text-shadow: 0 0 4px rgba(255,215,0,0.3); }
.stat.gold .value { color: #ffd700; }
.stat.food .value { color: #8bc34a; }
.stat.pop .value { color: #64b5f6; }
.stat.sold .value { color: #ef5350; }
.stat.tech .value { color: #ba68c8; }
.stat.happy .value { color: #ffb74d; }
#buildBar { background: #2d1f12; border: 1px solid #5c3a21; border-radius: 10px; padding: 8px; margin: 8px 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(90px,1fr); gap: 6px; }
.bitem { background: #3d2817; border: 1px solid #6b4423; border-radius: 6px; padding: 6px; text-align: center; cursor: pointer; transition: all 0.15s; user-select: none; }
.bitem:hover:not(.locked):not(.disabled) { background: #5c3a21; transform: translateY(-1px); border-color: #c9a57b; }
.bitem.selected { border-color: #ffd700; background: #4a3520; box-shadow: 0 0 10px rgba(255,215,0,0.3); }
.bitem.locked { opacity: 0.4; cursor: not-allowed; }
.bitem.disabled { opacity: 0.5; cursor: not-allowed; }
.bitem .bicon { font-size: 22px; }
.bitem .bname { font-size: 11px; color: #e8d5b7; margin-top: 2px; }
.bitem .bcost { font-size: 10px; color: #ffd700; margin-top: 1px; }
#bottomBar { background: #2d1f12; border: 1px solid #5c3a21; border-radius: 10px; padding: 10px; margin-top: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
#infoPanel { color: #c9a57b; font-size: 13px; line-height: 1.7; }
#infoPanel .hdr { color: #ffd700; font-weight: bold; font-size: 14px; border-bottom: 1px solid #5c3a21; padding-bottom: 4px; margin-bottom: 4px; }
#eventLog { max-height: 90px; overflow-y: auto; background: #1a0f08; border-radius: 6px; padding: 6px; font-size: 12px; color: #c9a57b; }
#eventLog div { padding: 2px 0; border-bottom: 1px dashed #3d2817; }
.btn { background: linear-gradient(180deg, #795548, #4e342e); color: #ffecb3; border: 1px solid #8d6e63; padding: 7px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; margin: 2px; transition: 0.15s; }
.btn:hover { filter: brightness(1.15); }
.btn:active { transform: scale(0.97); }
.btn-primary { background: linear-gradient(180deg, #d4a017, #a07910); color: #fff; }
.btn-danger { background: linear-gradient(180deg, #c62828, #8e0000); }
.btn-save { background: linear-gradient(180deg, #2e7d32, #1b5e20); }
#screenStart, #screenPause, #screenEnd { position: fixed; inset: 0; background: rgba(26,15,8,0.97); z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#screenStart h1 { font-size: 52px; color: #ffd700; text-shadow: 0 0 20px rgba(255,215,0,0.4), 2px 2px 0 #5c3a21; margin-bottom: 12px; letter-spacing: 4px; }
#screenStart .sub { color: #c9a57b; font-size: 17px; margin-bottom: 35px; }
#start-game-btn { background: linear-gradient(180deg, #d4a017, #a07910); color: #fff; font-size: 24px; padding: 16px 70px; border: 2px solid #ffd700; border-radius: 12px; cursor: pointer; font-weight: bold; letter-spacing: 2px; box-shadow: 0 6px 20px rgba(255,215,0,0.3); transition: 0.2s; }
#start-game-btn:hover { transform: scale(1.05); filter: brightness(1.1); }
.tipbox { margin-top: 30px; color: #8d6e63; font-size: 13px; max-width: 450px; text-align: center; line-height: 1.9; padding: 15px; background: rgba(92,58,33,0.3); border: 1px solid #5c3a21; border-radius: 10px; }
.hs { margin-top: 20px; color: #ffd700; font-size: 16px; padding: 10px 25px; border: 1px solid #ffd700; border-radius: 8px; background: rgba(255,215,0,0.08); }
#screenPause h2, #screenEnd h2 { font-size: 36px; color: #ffd700; margin-bottom: 25px; }
.bigbtn { padding: 12px 45px; margin: 7px; font-size: 17px; border: none; border-radius: 8px; cursor: pointer; color: #fff; font-weight: bold; }
.tabs { display: flex; gap: 4px; margin-bottom: 6px; }
.tab { flex: 1; padding: 5px; text-align: center; font-size: 12px; background: #3d2817; border: 1px solid #5c3a21; border-radius: 5px; color: #c9a57b; cursor: pointer; }
.tab.active { background: #5c3a21; color: #ffd700; border-color: #ffd700; }
/* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */
/* [BATCH-FIX:ad-components-css] */
.sponsor-btn{position:fixed;bottom:8px;left:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:2px 6px;border-radius:10px;font:10px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.sponsor-panel.show{display:flex}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.interstitial-ad.show{display:flex}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* [/BATCH-FIX:ad-components-css] */

/* [AD-FIX:responsive] */
@media (max-width:768px){.ad-banner-container{display:none!important}.sponsor-btn{transform:scale(.8);opacity:.6}}
/* [/AD-FIX:responsive] */
</style>
</head>
<body>
<div id="wrap">
  <div id="topBar">
    <div class="stat gold"><div class="label">💰 金币</div><div class="value" id="vGold">1000</div></div>
    <div class="stat food"><div class="label">🌾 粮食</div><div class="value" id="vFood">500</div></div>
    <div class="stat pop"><div class="label">👥 人口</div><div class="value" id="vPop">50</div></div>
    <div class="stat sold"><div class="label">⚔️ 军队</div><div class="value" id="vSold">0</div></div>
    <div class="stat tech"><div class="label">🔬 科技</div><div class="value" id="vTech">0</div></div>
    <div class="stat happy"><div class="label">😊 民心</div><div class="value" id="vHappy">70</div></div>
  </div>
  <canvas id="cv" width="900" height="500"></canvas>
  <div class="tabs">
    <div class="tab active" data-tab="0">🏘️ 建筑</div>
    <div class="tab" data-tab="1">🏛️ 军事</div>
    <div class="tab" data-tab="2">🔬 科技</div>
  </div>
  <div id="buildBar"></div>
  <div id="bottomBar">
    <div id="infoPanel">
      <div class="hdr">📜 帝国信息</div>
      <div id="infoText">点击建筑按钮，然后在地图上放置。</div>
      <div style="margin-top:8px">
        <button class="btn btn-primary" id="btnTurn">下一回合 (空格)</button>
        <button class="btn" id="btnPause">⏸ 暂停(P)</button>
        <button class="btn btn-save" id="btnSave">💾 保存</button>
        <button class="btn btn-danger" id="btnReset">🔄 重开</button>
      </div>
    </div>
    <div>
      <div class="hdr" style="color:#ffd700;font-weight:bold;font-size:14px;border-bottom:1px solid #5c3a21;padding-bottom:4px;margin-bottom:4px">📰 事件日志</div>
      <div id="eventLog"></div>
    </div>
  </div>
</div>

<div id="screenStart">
  <h1>👑 帝国建造者</h1>
  <div class="sub">建造城市 · 发展科技 · 征服世界</div>
  <div class="hs">历史最高分数: <span id="hsVal">0</span></div>
  <button id="start-game-btn">开始游戏</button>
  <div class="tipbox">
    <b>游戏玩法：</b><br>
    • 选择建筑后在地图点击放置<br>
    • 每回合消耗粮食维护人口和军队<br>
    • 建造学校提升科技，解锁更高级建筑<br>
    • 空格=下一回合，P=暂停，数字键1-8快捷选择
  </div>
</div>

<div id="screenPause" style="display:none">
  <h2>⏸ 游戏暂停</h2>
  <button class="bigbtn" style="background:#2e7d32" id="btnResume">继续游戏</button>
  <button class="bigbtn" style="background:#795548" id="btnRestart">重新开始</button>
</div>

<div id="screenEnd" style="display:none">
  <h2 id="endTitle">🏆 帝国伟业！</h2>
  <div id="endStats" style="color:#c9a57b;font-size:17px;line-height:2.1;margin:25px 0;padding:20px;background:rgba(92,58,33,0.4);border-radius:12px;border:1px solid #6b4423"></div>
  <button class="bigbtn" style="background:#d4a017" id="btnAgain">再来一局</button>
</div>

<script>
if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
</script>
<script src="../game_core.js"></script>
<script>
(function(){
  var S=window.Storage;if(!S||typeof S.load!=='function'){S={load:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},save:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},remove:function(k){try{localStorage.removeItem(k)}catch(e){}}};window.Storage=S;}
})();

var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;
var GW = 15, GH = 10;
var CW, CH;

var state = STATE_MENU;
var G, selB = null, tab = 0;
var hov = null;
var tick = null;

function resize(){
  CW = (W-40)/GW; CH = (H-40)/GH;
  var mx = Math.min(window.innerWidth-30, 980);
  if(W>mx){cv.style.width=mx+'px';cv.style.height=(H*mx/W)+'px';}
}
resize();
window.addEventListener('resize', resize);

var BUILD_CAT = [[
  {id:'farm',name:'农田',icon:'🌾',cost:100,food:20,pop:0,gold:5,need:0,tech:0,desc:'生产粮食',unlock:0'},
  {id:'house',name:'民居',icon:'🏠',cost:150,food:0,pop:15,gold:3,need:0,tech:0,desc:'增加人口',unlock:0'},
  {id:'market',name:'市场',icon:'🏪',cost:200,food:0,pop:0,gold:25,need:0,tech:0,desc:'商业税收',unlock:0'},
  {id:'mine',name:'矿场',icon:'⛏️',cost:300,food:0,pop:0,gold:40,need:5,tech:0,desc:'挖掘金矿',unlock:0'},
  {id:'sch',name:'学堂',icon:'📚',cost:250,food:0,pop:0,gold:0,need:0,tech:3,desc:'研究科技',unlock:2},
  {id:'temp',name:'神庙',icon:'⛪',cost:350,food:0,pop:0,gold:10,need:0,tech:1,hap:10,desc:'提升民心',unlock:4},
  {id:'wall',name:'城墙',icon:'🧱',cost:180,food:0,pop:0,gold:0,need:0,tech:0,def:10,desc:'城市防御',unlock:0'},
  {id:'uni',name:'大学',icon:'🎓',cost:600,food:0,pop:0,gold:5,need:0,tech:8,hap:5,desc:'高级研究',unlock:12}
],[
  {id:'barr',name:'兵营',icon:'🏰',cost:250,food:-5,pop:0,gold:0,need:1,tech:0,sold:5,desc:'训练士兵',unlock:0},
  {id:'stable',name:'马厩',icon:'🐎',cost:400,food:-8,pop:0,gold:0,need:2,tech:0,sold:8,desc:'训练骑兵',unlock:4,atk:3},
  {id:'arch',name:'箭塔',icon:'🏹',cost:350,food:0,pop:0,gold:0,need:3,tech:0,def:15,atk:5,desc:'防御建筑',unlock:3},
  {id:'forge',name:'工坊',icon:'⚒️',cost:500,food:0,pop:0,gold:15,need:5,tech:2,sold:3,atk:2,desc:'武器升级',unlock:6},
  {id:'fort',name:'要塞',icon:'🏯',cost:800,food:-10,pop:0,gold:0,need:8,tech:0,def:30,sold:10,desc:'军事核心',unlock:10}
],[
  {id:'t_agr',name:'农业革新',icon:'🌱',cost:400,food:50,pop:0,gold:0,need:0,tech:0,desc:'永久+50粮食产量',techid:'agr',unlock:5,oneTime:true},
  {id:'t_com',name:'商业繁荣',icon:'💹',cost:500,food:0,pop:0,gold:50,need:0,tech:0,desc:'永久+50金币收入',techid:'com',unlock:7,oneTime:true},
  {id:'t_war',name:'军事训练',icon:'⚔️',cost:600,food:0,pop:0,gold:0,need:0,tech:0,desc:'军队战力+20%',techid:'war',unlock:9,oneTime:true},
  {id:'t_med',name:'医疗技术',icon:'💊',cost:450,food:0,pop:30,gold:0,need:0,tech:0,desc:'人口+30',techid:'med',unlock:8,oneTime:true},
  {id:'t_mag',name:'魔法研究',icon:'✨',cost:900,food:0,pop:0,gold:100,need:0,tech:15,desc:'终极科技',techid:'mag',unlock:18,oneTime:true}
]];

function newGame(){
  G={gold:1000,food:500,pop:50,sold:0,tech:0,hap:70,turn:1,score:0,def:0,atk:0,grid:[],buildings:[],
    counts:{},techs:{},catt:0};
  for(var r=0;r<GH;r++){G.grid[r]=[];for(var c=0;c<GW;c++)G.grid[r][c]=null;}
  for(var i=0;i<3;i++){placeB(4+i,4,'house');placeB(4+i,5,'farm');}
  placeB(7,4,'market');
  G.gold=1000;G.food=500;G.pop=50;
  calcStats();updUI();renderBuildBar();log('建立帝国！');
}

function placeB(r,c,id){
  for(var t=0;t<3;t++){var lst=BUILD_CAT[t];for(var i=0;i<lst.length;i++){if(lst[i].id===id){var bd=lst[i];break;}}
  if(!bd)return;
  if(G.grid[r][c])return;
  G.grid[r][c]=id;G.buildings.push({r:c?r,r:r,c:c,id:id,turn:G.turn});
  G.counts[id]=(G.counts[id]||0)+1;
}

function calcStats(){
  G.tf=0;G.tp=0;G.tg=0;G.tt=0;G.th=0;G.td=0;G.ta=0;G.ts=0;G.maint=0;
  var mult=1+((G.techs.war?0.2:0);
  for(var i=0;i<G.buildings.length;i++){
    var b=G.buildings[i];
    for(var t=0;t<3;t++){var lst=BUILD_CAT[t];for(var j=0;j<lst.length;j++){if(lst[j].id===b.id){var bd=lst[j];break;}}}
    if(!bd)continue;
    G.tf+=bd.food||0;G.tp+=bd.pop||0;G.tg+=bd.gold||0;G.tt+=bd.tech||0;G.th+=bd.hap||0;
    G.td+=bd.def||0;G.ta+=(bd.atk||0);G.ts+=(bd.sold||0);
    if(bd.food<0)G.maint-=bd.food;
  }
  if(G.techs.agr)G.tf+=50;
  if(G.techs.com)G.tg+=50;
  G.ta=Math.floor(G.ta*mult);
  G.ts=Math.floor(G.ts*mult);
  G.def=G.td;G.atk=G.ta;G.sold=G.ts;
}

function log(m){var el=document.getElementById('eventLog');var d=document.createElement('div');
  d.textContent='[回合'+G.turn+'] '+m;el.insertBefore(d,el.firstChild);
  while(el.children.length>15)el.removeChild(el.lastChild);}

function updUI(){
  document.getElementById('vGold').textContent=G.gold;
  document.getElementById('vFood').textContent=G.food;
  document.getElementById('vPop').textContent=G.pop;
  document.getElementById('vSold').textContent=G.sold;
  document.getElementById('vTech').textContent=G.tech;
  document.getElementById('vHappy').textContent=G.hap;
  var info=document.getElementById('infoText');
  info.innerHTML='回合: '+G.turn+'<br>'
    +'预计: 金币+'+G.tg+' / 粮食+'+G.tf+' / 科技+'+G.tt+'<br>'
    +'防御: '+G.def+' / 攻击: '+G.atk+'<br>'
    +'军队维护: '+G.maint+'粮食/回合';
}

function renderBuildBar(){
  var bar=document.getElementById('buildBar');bar.innerHTML='';
  var lst=BUILD_CAT[tab];
  for(var i=0;i<lst.length;i++){(function(b,idx){
    var d=document.createElement('div');var locked=(b.unlock&&G.tech<b.unlock);
    var techDone=b.oneTime&&G.techs[b.techid];
    var disa=locked||techDone||(b.need&&G.pop<b.need);
    d.className='bitem'+(selB===b.id?' selected':'')+(locked?' locked':'')+(disa&&!locked?' disabled':'');
    d.innerHTML='<div class="bicon">'+b.icon+'</div><div class="bname">'+b.name+'</div><div class="bcost">💰'+b.cost+(b.unlock?' 🔬'+b.unlock:'')+'</div>';
    d.title=b.desc+(b.need?'\n需要人口:'+b.need:'');
    d.onclick=function(){
      if(locked){GameCore.hints.show('需要科技: '+b.unlock);return;}
      if(techDone){GameCore.hints.show('已研究完成');return;}
      if(b.need&&G.pop<b.need){GameCore.hints.show('需要人口: '+b.need);return;}
      if(G.gold<b.cost){GameCore.hints.show('金币不足！');return;}
      if(b.oneTime){
        G.gold-=b.cost;G.techs[b.techid]=true;log('研究完成: '+b.name);calcStats();updUI();renderBuildBar();return;
      }
      selB=selB===b.id?null:b.id;renderBuildBar();
    };
    bar.appendChild(d);
  })(lst[i],i);}
}

document.querySelectorAll('.tab').forEach(function(t){t.onclick=function(){
  document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});
  t.classList.add('active');tab=parseInt(t.dataset.tab);selB=null;renderBuildBar();
});});

function nextTurn(){
  if(state!==STATE_PLAYING)return;
  G.turn++;
  calcStats();
  G.gold+=G.tg;G.food+=G.tf;G.tech+=G.tt;G.pop=Math.min(G.pop+Math.floor(G.tp/5),9999);
  var hapC=Math.max(0,100-G.hap)*0.01;
  G.pop=Math.max(1,Math.floor(G.pop*(1-hapC*0.1)));
  var foodNeed=Math.floor(G.pop*0.5)+G.maint;
  if(G.food<foodNeed){G.hap=Math.max(0,G.hap-8);G.pop=Math.max(1,Math.floor(G.pop*0.95));log('⚠️ 粮食不足！民心下降');G.food=0;}
  else{G.food-=foodNeed;if(G.hap<100)G.hap=Math.min(100,G.hap+1);}
  if(G.sold>G.pop*0.6){G.hap=Math.max(0,G.hap-3);}
  if(G.turn%5===0){
    var r=Math.random();
    if(r<0.2){var g=200+Math.floor(Math.random()*600);G.gold+=g;log('🎁 丰收年，税收+💰'+g);}
    else if(r<0.35){var f=100+Math.floor(Math.random()*300);G.food+=f;log('🌾 大丰收！粮食+'+f);}
    else if(r<0.5){G.hap=Math.min(100,G.hap+5);log('😊 节日庆典，民心+5');}
    else if(r<0.65){var atk=20+Math.floor(Math.random()*50);
      if(G.def>=atk){log('🛡️ 击退蛮族入侵！(攻:'+atk+' 防:'+G.def+')');}
      else{var loss=(atk-G.def);G.gold=Math.max(0,G.gold-loss*10);G.hap=Math.max(0,G.hap-10);log('💀 蛮族掠夺！损失💰'+(loss*10));}}}
  G.score=G.gold+G.food+G.pop*10+G.sold*5+G.tech*15+G.hap*3+G.turn*2;
  if(G.hap<=5){end(false,'民心尽失，帝国覆灭');return;}
  if(G.turn>=100&&G.score>=50000){end(true,'千古一帝！');return;}
  if(G.tech>=50&&G.pop>=500&&G.sold>=200){end(true,'盛世霸业！');return;}
  calcStats();updUI();}

function end(win,msg){
  state=STATE_OVER;
  Storage.save('empire_hs',Math.max(Storage.load('empire_hs',0),G.score));
  document.getElementById('endTitle').textContent=win?'🏆 '+msg:'💔 '+msg;
  var s=document.getElementById('endStats');
  s.innerHTML='存在回合: <b>'+G.turn+'</b><br>最终分数: <b style="color:#ffd700">'+G.score+'</b><br>'
    +'💰 金币: '+G.gold+'<br>🌾 粮食: '+G.food+'<br>👥 人口: '+G.pop+'<br>⚔️ 军队: '+G.sold+'<br>🔬 科技: '+G.tech+'<br>😊 民心: '+G.hap;
  document.getElementById('screenEnd').style.display='flex';
}

function draw(){
  ctx.fillStyle='#3d2817';ctx.fillRect(0,0,W,H);
  var grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#4a3520');grad.addColorStop(1,'#2d1f12');ctx.fillStyle=grad;ctx.fillRect(20,20,W-40,H-40);
  ctx.strokeStyle='rgba(107,68,35,0.4)';ctx.lineWidth=1;
  for(var r=0;r<=GH;r++){ctx.beginPath();ctx.moveTo(20,20+r*CH);ctx.lineTo(W-20,20+r*CH);ctx.stroke();}
  for(var c=0;c<=GW;c++){ctx.beginPath();ctx.moveTo(20+c*CW,20);ctx.lineTo(20+c*CW,H-20);ctx.stroke();}
  for(var r=0;r<GH;r++)for(var c=0;c<GW;c++){
    var id=G.grid[r][c];if(!id)continue;
    for(var t=0;t<3;t++){var lst=BUILD_CAT[t];for(var j=0;j<lst.length;j++){if(lst[j].id===id){var bd=lst[j];break;}}}
    var x=20+c*CW,y=20+r*CH;
    var col={farm:'#558b2f',house:'#8d6e63',market:'#f57c00',mine:'#616161',sch:'#5e35b1',temp:'#fbc02d',wall:'#757575',uni:'#283593',
      barr:'#b71c1c',stable:'#6d4c41',arch:'#455a64',forge:'#e65100',fort:'#4e342e'};
    ctx.fillStyle=col[id]||'#555';ctx.fillRect(x+3,y+3,CW-6,CH-6);
    ctx.strokeStyle='#c9a57b';ctx.lineWidth=1;ctx.strokeRect(x+3,y+3,CW-6,CH-6);
    ctx.font=Math.floor(CW*0.5)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='#fff';ctx.fillText(bd.icon,x+CW/2,y+CH/2);
  }
  if(selB&&state===STATE_PLAYING&&hov){
    var x=20+hov.c*CW,y=20+hov.r*CH;
    ctx.strokeStyle=G.grid[hov.r][hov.c]?'#ef5350':'#ffd700';
    ctx.lineWidth=3;ctx.setLineDash([6,4]);
    ctx.strokeRect(x+1,y+1,CW-2,CH-2);ctx.setLineDash([]);
  }
  ctx.fillStyle='#ffd700';ctx.font='bold 14px sans-serif';ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillText('👑 回合 '+G.turn+' | 建筑 '+G.buildings.length,24,24);
}

function getCell(e){
  var rc=cv.getBoundingClientRect();var sx=cv.width/rc.width,sy=cv.height/rc.height;
  var x=(e.clientX-rc.left)*sx,y=(e.clientY-rc.top)*sy;
  var c=Math.floor((x-20)/CW),r=Math.floor((y-20)/CH);
  if(r<0||r>=GH||c<0||c>=GW)return null;return{r:r,c:c};
}
cv.addEventListener('mousemove',function(e){hov=getCell(e);});
cv.addEventListener('click',function(e){
  if(state!==STATE_PLAYING)return;var cell=getCell(e);if(!cell)return;
  if(selB){
    if(G.grid[cell.r][cell.c]){GameCore.hints.show('此处已有建筑');return;}
    for(var t=0;t<3;t++){var lst=BUILD_CAT[t];for(var j=0;j<lst.length;j++){if(lst[j].id===selB){var bd=lst[j];break;}}}
    if(G.gold<bd.cost){GameCore.hints.show('金币不足');return;}
    G.gold-=bd.cost;placeB(cell.r,cell.c,selB);
    log('建造 '+bd.icon+bd.name+' -💰'+bd.cost);selB=null;calcStats();updUI();renderBuildBar();
  }else if(G.grid[cell.r][cell.c]){
    if(confirm('拆除 '+G.grid[cell.r][cell.c]+'？(返还50%)')){
      var id=G.grid[cell.r][cell.c];
      for(var t=0;t<3;t++){var lst=BUILD_CAT[t];for(var j=0;j<lst.length;j++){if(lst[j].id===id){var bd2=lst[j];break;}}}
      G.grid[cell.r][cell.c]=null;
      G.buildings=G.buildings.filter(function(b){return!(b.r===cell.r&&b.c===cell.c);});
      G.counts[id]--;G.gold+=Math.floor(bd2.cost*0.5);log('拆除建筑，返还💰'+Math.floor(bd2.cost*0.5));calcStats();updUI();
    }
  }
});

cv.addEventListener('touchstart',function(e){if(e.touches[0]){hov=getCell(e.touches[0]);}},{passive:true});
cv.addEventListener('touchend',function(e){
  if(e.changedTouches[0]){
    var t=e.changedTouches[0],rc=cv.getBoundingClientRect();var sx=cv.width/rc.width,sy=cv.height/rc.height;
    var x=(t.clientX-rc.left)*sx,y=(t.clientY-rc.top)*sy;
    var c=Math.floor((x-20)/CW),r=Math.floor((y-20)/CH);
    if(r>=0&&r<GH&&c>=0&&c<GW){
      var evt=new MouseEvent('click',{clientX:t.clientX,clientY:t.clientY});cv.dispatchEvent(evt);
    }
  }
},{passive:true});

document.addEventListener('keydown',function(e){
  if(e.key===' '){e.preventDefault();if(state===STATE_PLAYING)nextTurn();}
  else if(e.key==='p'||e.key==='P'){pause();}
  else if(e.key>='1'&&e.key<='9'){
    var idx=parseInt(e.key)-1,lst=BUILD_CAT[tab];
    if(idx<lst.length){var b=lst[idx];
      if(!(b.unlock&&G.tech<b.unlock)&&!(b.oneTime&&G.techs[b.techid])){selB=b.id;renderBuildBar();}}
  }
});

document.getElementById('btnTurn').onclick=nextTurn;
document.getElementById('btnPause').onclick=pause;
document.getElementById('btnResume').onclick=pause;
document.getElementById('btnRestart').onclick=function(){location.reload();};
document.getElementById('btnAgain').onclick=function(){location.reload();};
document.getElementById('btnReset').onclick=function(){if(confirm('重新开始？'))location.reload();};
document.getElementById('btnSave').onclick=function(){Storage.save('empire_save',G);GameCore.hints.show('存档已保存！');};

function pause(){
  if(state===STATE_PLAYING){state=STATE_PAUSE;document.getElementById('screenPause').style.display='flex';}
  else if(state===STATE_PAUSE){state=STATE_PLAYING;document.getElementById('screenPause').style.display='none';}
}

function start(){
  var sv=Storage.load('empire_save',null);
  if(sv&&confirm('发现存档，是否继续？')){G=sv;}else{newGame();}
  document.getElementById('screenStart').style.display='none';
  state=STATE_PLAYING;
  if(tick)clearInterval(tick);
  tick=setInterval(draw,40);
}

document.getElementById('start-game-btn').addEventListener('click',start);
document.getElementById('hsVal').textContent=Storage.load('empire_hs',0);
GameCore.init({highScore:'empire'});
</script>

<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();

}
</script>
