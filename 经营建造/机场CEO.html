<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>机场CEO</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0c1929; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: auto; font-family: "Microsoft YaHei", sans-serif; }
#gameContainer { width: 100%; max-width: 960px; padding: 10px; }
canvas { border: 2px solid #1e3a5f; border-radius: 8px; cursor: pointer; max-width: 100%; height: auto; background: #0d2137; }
#ui { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
.panel { background: #132744; border: 1px solid #1e3a5f; border-radius: 8px; padding: 10px; color: #e0e0e0; }
.panel h3 { font-size: 14px; color: #4fc3f7; margin-bottom: 6px; }
.panel .val { font-size: 20px; font-weight: bold; color: #ffd54f; }
.btn { background: linear-gradient(135deg, #1976d2, #2196f3); color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; margin: 2px; transition: 0.2s; }
.btn:hover { transform: scale(1.03); filter: brightness(1.1); }
.btn:active { transform: scale(0.98); }
.btn:disabled { background: #555; cursor: not-allowed; transform: none; }
.btn-gold { background: linear-gradient(135deg, #f57c00, #ff9800); }
.btn-green { background: linear-gradient(135deg, #388e3c, #66bb6a); }
.btn-red { background: linear-gradient(135deg, #c62828, #ef5350); }
#shopBar { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; padding: 10px; background: #132744; border-radius: 8px; border: 1px solid #1e3a5f; }
.shopItem { flex: 1; min-width: 120px; background: #1a3356; border: 1px solid #2c5282; border-radius: 6px; padding: 8px; text-align: center; cursor: pointer; transition: 0.2s; }
.shopItem:hover { background: #2c5282; transform: translateY(-2px); }
.shopItem.selected { border-color: #ffd54f; box-shadow: 0 0 8px rgba(255,213,79,0.5); }
.shopItem .icon { font-size: 24px; }
.shopItem .name { font-size: 12px; color: #e0e0e0; margin-top: 2px; }
.shopItem .cost { font-size: 11px; color: #ffd54f; margin-top: 2px; }
#msgLog { max-height: 80px; overflow-y: auto; font-size: 12px; padding: 6px; background: #0a1628; border-radius: 4px; margin-top: 6px; }
#msgLog div { padding: 2px 0; border-bottom: 1px solid #1a3356; color: #90caf9; }
#startScreen, #pauseScreen, #gameOverScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(12,25,41,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
#startScreen h1 { font-size: 48px; color: #4fc3f7; margin-bottom: 10px; text-shadow: 0 0 20px rgba(79,195,247,0.5); }
#startScreen .tag { color: #90caf9; margin-bottom: 30px; font-size: 16px; }
#start-game-btn { padding: 16px 60px; font-size: 22px; background: linear-gradient(135deg, #1976d2, #42a5f5); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 20px rgba(33,150,243,0.4); }
#start-game-btn:hover { transform: scale(1.05); }
#pauseScreen h2, #gameOverScreen h2 { color: #4fc3f7; margin-bottom: 20px; font-size: 32px; }
.small-btn { padding: 10px 30px; margin: 6px; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; color: white; }
#highScoreDisplay { margin-top: 20px; padding: 10px 20px; background: rgba(255,213,79,0.1); border: 1px solid #ffd54f; border-radius: 8px; color: #ffd54f; }
/* [BATCH-FIX:ad-components-css] */
.sponsor-btn{position:fixed;top:44px;right:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:3px 9px;border-radius:10px;font:11px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.sponsor-panel.show{display:flex}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.interstitial-ad.show{display:flex}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* [/BATCH-FIX:ad-components-css] */
</style>
</head>
<body>
<div id="gameContainer">
  <div id="ui">
    <div class="panel"><h3>💰 资金</h3><div class="val" id="moneyVal">$5000</div></div>
    <div class="panel"><h3>✈️ 航班</h3><div class="val" id="flightVal">0</div></div>
    <div class="panel"><h3>👥 乘客</h3><div class="val" id="passVal">0</div></div>
    <div class="panel"><h3>⭐ 声望</h3><div class="val" id="repVal">0</div></div>
  </div>
  <canvas id="gameCanvas" width="960" height="540"></canvas>
  <div id="shopBar"></div>
  <div class="panel" style="margin-top:10px">
    <h3>📋 事件日志</h3>
    <div id="msgLog"></div>
    <div style="margin-top:8px">
      <button class="btn btn-green" id="btnNextTurn">下一天 (空格)</button>
      <button class="btn" id="btnPause">暂停 (P)</button>
      <button class="btn btn-red" id="btnSave">💾 保存</button>
      <button class="btn btn-gold" id="btnLoad">📂 读取</button>
    </div>
  </div>
</div>

<div id="startScreen">
  <h1>✈️ 机场CEO</h1>
  <div class="tag">建造航站楼 · 调度航班 · 成为航空大亨</div>
  <div id="highScoreDisplay">最高分: <span id="hs">0</span></div>
  <br>
  <button id="start-game-btn">开始经营</button>
  <div style="color:#78909c;margin-top:30px;font-size:13px;max-width:400px;text-align:center;line-height:1.8">
    操作说明：点击下方建筑按钮后在地图上放置建筑<br>
    空格=下一天，P=暂停，鼠标点击选择/放置
  </div>
</div>

<div id="pauseScreen" style="display:none">
  <h2>⏸ 游戏暂停</h2>
  <button class="small-btn btn-green" id="btnResume">继续游戏</button>
  <button class="small-btn" id="btnRestart">重新开始</button>
</div>

<div id="gameOverScreen" style="display:none">
  <h2 id="goTitle">🎉 恭喜!</h2>
  <div id="goStats" style="color:#e0e0e0;font-size:18px;line-height:2;margin:20px"></div>
  <button class="small-btn btn-gold" id="btnPlayAgain">再来一局</button>
</div>

<script>
if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
</script>
<script src="../game_core.js"></script>
<script>
;(function(){
  var S = window.Storage;
  if (!S || typeof S.load !== 'function') {
    S = { load:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
           save:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
           remove:function(k){try{localStorage.removeItem(k)}catch(e){}} };
    window.Storage = S;
  }
})();

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

let gameState = STATE_MENU;
let G = {};
let selectedBuilding = null;
let animTimer = null;

function resizeCanvas() {
  const maxW = Math.min(window.innerWidth - 30, 960);
  if (W > maxW) {
    canvas.style.width = maxW + 'px';
    canvas.style.height = (H * maxW / W) + 'px';
  }
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function log(msg) {
  const el = document.getElementById('msgLog');
  const d = document.createElement('div');
  d.textContent = '[' + G.day + '天] ' + msg;
  el.insertBefore(d, el.firstChild);
  while (el.children.length > 20) el.removeChild(el.lastChild);
}

const BUILDINGS = [
  { id:'terminal', name:'航站楼', icon:'🏢', cost:2000, income:100, cap:50, desc:'基础航站楼' },
  { id:'runway',   name:'跑道',     icon:'🛣️', cost:3000, income:0,   cap:0,  desc:'允许大型飞机' },
  { id:'gate',     name:'登机口',   icon:'🚪', cost:800,  income:200, cap:100,desc:'增加航班量' },
  { id:'shop',     name:'免税店',   icon:'🛍️', cost:1200, income:150, cap:0,  desc:'乘客消费' },
  { id:'restaurant',name:'餐厅',    icon:'🍽️', cost:1000, income:120, cap:0,  desc:'餐饮收入' },
  { id:'hotel',    name:'机场酒店', icon:'🏨', cost:4000, income:300, cap:0,  desc:'高端住宿' },
  { id:'garage',   name:'维修库',   icon:'🔧', cost:1500, income:80,  cap:0,  desc:'减少延误' },
  { id:'parking',  name:'停车场',   icon:'🅿️', cost:600,  income:60,  cap:0,  desc:'停车收入' }
];

function initGame() {
  G = {
    money: 5000,
    day: 1,
    flights: 0,
    passengers: 0,
    reputation: 10,
    totalEarned: 0,
    grid: [],
    buildings: [],
    placedCount: { terminal:0, runway:0, gate:0, shop:0, restaurant:0, hotel:0, garage:0, parking:0 }
  };
  G.gridCols = 12;
  G.gridRows = 8;
  G.cellW = (W - 40) / G.gridCols;
  G.cellH = (H - 40) / G.gridRows;
  for (let r = 0; r < G.gridRows; r++) {
    G.grid[r] = [];
    for (let c = 0; c < G.gridCols; c++) G.grid[r][c] = null;
  }
  placeBuilding(2, 3, 'terminal');
  placeBuilding(2, 5, 'runway');
  G.money = 5000;
  updateUI();
  renderShopBar();
  log('欢迎来到你的机场！');
}

function placeBuilding(r, c, id) {
  const b = BUILDINGS.find(x => x.id === id);
  if (!b) return false;
  if (G.grid[r][c]) return false;
  G.grid[r][c] = id;
  G.buildings.push({ r, c, id, day: G.day });
  G.placedCount[id]++;
  return true;
}

function removeBuilding(r, c) {
  const id = G.grid[r][c];
  if (!id) return;
  G.grid[r][c] = null;
  G.buildings = G.buildings.filter(b => !(b.r === r && b.c === c));
  G.placedCount[id]--;
  const b = BUILDINGS.find(x => x.id === id);
  G.money += Math.floor(b.cost * 0.5);
}

function renderShopBar() {
  const bar = document.getElementById('shopBar');
  bar.innerHTML = '';
  BUILDINGS.forEach(b => {
    const d = document.createElement('div');
    d.className = 'shopItem' + (selectedBuilding === b.id ? ' selected' : '');
    d.innerHTML = '<div class="icon">' + b.icon + '</div><div class="name">' + b.name + '</div><div class="cost">$' + b.cost + '</div>';
    d.onclick = () => {
      if (G.money < b.cost) { GameCore.hints.show('资金不足！'); return; }
      selectedBuilding = selectedBuilding === b.id ? null : b.id;
      renderShopBar();
    };
    bar.appendChild(d);
  });
}

function nextDay() {
  if (gameState !== STATE_PLAYING) return;
  G.day++;
  let income = 0, expense = 0;
  G.buildings.forEach(b => {
    const def = BUILDINGS.find(x => x.id === b.id);
    if (def.income > 0) {
      const repBonus = 1 + G.reputation * 0.01;
      income += Math.floor(def.income * repBonus);
    }
  });
  const flightCount = Math.min(G.placedCount.gate * 3, G.placedCount.terminal * 2 + G.placedCount.runway * 5);
  const passengersToday = flightCount * (15 + Math.floor(G.reputation / 5));
  G.flights += flightCount;
  G.passengers += passengersToday;
  income += flightCount * 80;
  income += passengersToday * 5;
  expense = Math.floor(G.buildings.length * 15);
  if (G.placedCount.terminal === 0) { income = 0; G.reputation = Math.max(0, G.reputation - 1); log('没有航站楼！声望下降'); }
  if (G.placedCount.runway === 0 && flightCount > 0) { expense += flightCount * 30; }
  G.money += income - expense;
  G.totalEarned += income;
  const oldRep = G.reputation;
  if (passengersToday > 50) G.reputation += 1;
  if (passengersToday > 200) G.reputation += 1;
  if (expense > income && G.placedCount.garage === 0) G.reputation = Math.max(0, G.reputation - 1);
  if (G.day % 7 === 0) {
    const event = Math.random();
    if (event < 0.25) { const bonus = 500 + Math.floor(Math.random()*1500); G.money += bonus; log('🎁 政府补贴 +$' + bonus); }
    else if (event < 0.45) { const loss = 200 + Math.floor(Math.random()*800); G.money -= loss; log('⚠️ 设备维修 -$' + loss); }
    else if (event < 0.6) { G.reputation += 2; log('⭐ 乘客满意度提升！声望+2'); }
  }
  if (G.reputation !== oldRep && G.day % 3 !== 0) {}
  if (G.money < 0 && G.reputation < 5) { endGame(false); return; }
  if (G.day >= 365 && G.reputation >= 80) { endGame(true); return; }
  updateUI();
}

function endGame(win) {
  gameState = STATE_OVER;
  Storage.save('airport_highscore', Math.max(Storage.load('airport_highscore',0), G.totalEarned));
  document.getElementById('goTitle').textContent = win ? '🎉 恭喜通关！' : '💸 破产了...';
  const stats = document.getElementById('goStats');
  stats.innerHTML = '经营天数: ' + G.day + ' 天<br>总收入: $' + G.totalEarned + '<br>总航班: ' + G.flights + '<br>总乘客: ' + G.passengers + '<br>最终声望: ' + G.reputation;
  document.getElementById('gameOverScreen').style.display = 'flex';
}

function updateUI() {
  document.getElementById('moneyVal').textContent = '$' + G.money;
  document.getElementById('flightVal').textContent = G.flights;
  document.getElementById('passVal').textContent = G.passengers;
  document.getElementById('repVal').textContent = G.reputation;
}

function draw() {
  ctx.fillStyle = '#0d2137';
  ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = '#1a3356';
  ctx.lineWidth = 1;
  for (let r = 0; r <= G.gridRows; r++) {
    ctx.beginPath();
    ctx.moveTo(20, 20 + r * G.cellH);
    ctx.lineTo(W-20, 20 + r * G.cellH);
    ctx.stroke();
  }
  for (let c = 0; c <= G.gridCols; c++) {
    ctx.beginPath();
    ctx.moveTo(20 + c * G.cellW, 20);
    ctx.lineTo(20 + c * G.cellW, H-20);
    ctx.stroke();
  }
  for (let r = 0; r < G.gridRows; r++) {
    for (let c = 0; c < G.gridCols; c++) {
      const id = G.grid[r][c];
      if (id) {
        const b = BUILDINGS.find(x => x.id === id);
        const x = 20 + c * G.cellW;
        const y = 20 + r * G.cellH;
        const colors = { terminal:'#1976d2', runway:'#616161', gate:'#00897b', shop:'#f57c00', restaurant:'#c62828', hotel:'#6a1b9a', garage:'#455a64', parking:'#33691e' };
        ctx.fillStyle = colors[id] || '#424242';
        ctx.fillRect(x+2, y+2, G.cellW-4, G.cellH-4);
        ctx.strokeStyle = '#ffd54f';
        ctx.lineWidth = 1;
        ctx.strokeRect(x+2, y+2, G.cellW-4, G.cellH-4);
        ctx.font = Math.floor(G.cellW*0.5) + 'px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#fff';
        ctx.fillText(b.icon, x + G.cellW/2, y + G.cellH/2);
      }
    }
  }
  if (selectedBuilding && gameState === STATE_PLAYING) {
    ctx.strokeStyle = '#ffd54f';
    ctx.lineWidth = 2;
    ctx.setLineDash([5,5]);
    if (hoverCell) {
      const x = 20 + hoverCell.c * G.cellW;
      const y = 20 + hoverCell.r * G.cellH;
      ctx.strokeRect(x+1, y+1, G.cellW-2, G.cellH-2);
    }
    ctx.setLineDash([]);
  }
  ctx.fillStyle = '#90caf9';
  ctx.font = '14px sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText('第 ' + G.day + ' 天 | 建筑: ' + G.buildings.length, 24, 24);
  drawPlaneAnim();
}

let planeX = -80, planeY = 100;
function drawPlaneAnim() {
  ctx.save();
  ctx.font = '36px sans-serif';
  ctx.fillText('✈️', planeX, planeY);
  ctx.restore();
  planeX += 1.5;
  planeY = 100 + Math.sin(planeX * 0.01) * 15;
  if (planeX > W + 50) { planeX = -80; planeY = 80 + Math.random() * 120; }
}

let hoverCell = null;
function getCell(e) {
  const rect = canvas.getBoundingClientRect();
  const sx = canvas.width / rect.width;
  const sy = canvas.height / rect.height;
  const x = (e.clientX - rect.left) * sx;
  const y = (e.clientY - rect.top) * sy;
  const c = Math.floor((x - 20) / G.cellW);
  const r = Math.floor((y - 20) / G.cellH);
  if (r < 0 || r >= G.gridRows || c < 0 || c >= G.gridCols) return null;
  return { r, c };
}

canvas.addEventListener('mousemove', e => { hoverCell = getCell(e); });
canvas.addEventListener('click', e => {
  if (gameState !== STATE_PLAYING) return;
  const cell = getCell(e);
  if (!cell) return;
  if (selectedBuilding) {
    const b = BUILDINGS.find(x => x.id === selectedBuilding);
    if (G.grid[cell.r][cell.c]) { GameCore.hints.show('此处已有建筑'); return; }
    if (G.money < b.cost) { GameCore.hints.show('资金不足！'); return; }
    G.money -= b.cost;
    placeBuilding(cell.r, cell.c, selectedBuilding);
    log('建造 ' + b.icon + b.name + ' -$' + b.cost);
    selectedBuilding = null;
    renderShopBar();
    updateUI();
  } else if (G.grid[cell.r][cell.c]) {
    if (confirm('拆除 ' + BUILDINGS.find(x=>x.id===G.grid[cell.r][cell.c]).name + '？(返还50%)')) {
      removeBuilding(cell.r, cell.c);
      log('拆除建筑，返还资金');
      updateUI();
    }
  }
});

document.addEventListener('keydown', e => {
  if (e.key === ' ') { e.preventDefault(); if (gameState===STATE_PLAYING) nextDay(); }
  else if (e.key === 'p' || e.key === 'P') togglePause();
  else if (e.key === '1'||e.key==='2'||e.key==='3'||e.key==='4'||e.key==='5'||e.key==='6'||e.key==='7'||e.key==='8') {
    const idx = parseInt(e.key) - 1;
    if (idx < BUILDINGS.length) { selectedBuilding = BUILDINGS[idx].id; renderShopBar(); }
  }
});

document.getElementById('btnNextTurn').onclick = nextDay;
document.getElementById('btnPause').onclick = togglePause;
document.getElementById('btnResume').onclick = togglePause;
document.getElementById('btnRestart').onclick = () => { location.reload(); };
document.getElementById('btnPlayAgain').onclick = () => { location.reload(); };
document.getElementById('btnSave').onclick = () => {
  Storage.save('airport_save', G);
  GameCore.hints.show('已保存！');
};
document.getElementById('btnLoad').onclick = () => {
  const saved = Storage.load('airport_save', null);
  if (saved) { G = saved; updateUI(); renderShopBar(); GameCore.hints.show('已读取存档'); }
  else GameCore.hints.show('没有存档');
};

function togglePause() {
  if (gameState === STATE_PLAYING) { gameState = STATE_PAUSE; document.getElementById('pauseScreen').style.display = 'flex'; }
  else if (gameState === STATE_PAUSE) { gameState = STATE_PLAYING; document.getElementById('pauseScreen').style.display = 'none'; }
}

function startGame() {
  initGame();
  document.getElementById('startScreen').style.display = 'none';
  gameState = STATE_PLAYING;
  if (animTimer) clearInterval(animTimer);
  animTimer = setInterval(draw, 33);
}

document.getElementById('start-game-btn').addEventListener('click', () => { initAudio(); startGame(); });

document.getElementById('hs').textContent = Storage.load('airport_highscore', 0);

let audioCtx = null;
function initAudio() {
  if (!audioCtx) try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
}
function playTone(f, d, t='sine', v=0.15) {
  if (!audioCtx) return;
  try {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = t; o.frequency.value = f;
    g.gain.setValueAtTime(v, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + d);
  } catch(e) {}
}

GameCore.init({ highScore: 'airport' });
</script>

<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
