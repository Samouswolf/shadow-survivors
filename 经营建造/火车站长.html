.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}

.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}

<body>

<button id="start-game-btn" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:20px 40px;font-size:20px;background:#ff6b35;color:white;border:none;border-radius:12px;cursor:pointer;z-index:999;font-weight:bold;display:none;">开始游戏</button>

<canvas id="c"></canvas>

<script>
if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
</script>
<script src="../game_core.js"></script>
<script>
(function(){
"use strict";

const W=480,H=800;
const GAME_TIME=120;
const TRACK_COUNT=4;
const PLATFORM_COUNT=4;

const TRACK_START_X=80;
const TRACK_END_X=W-80;
const INBOUND_Y=80;
const OUTBOUND_Y=640;
const PLATFORM_TOP=220;
const PLATFORM_H=70;
const PLATFORM_GAP=90;
const SWITCH_Y=150;
const EXIT_SWITCH_Y=580;

const TRAIN_COLORS=['#e53935','#1e88e5','#43a047','#8e24aa','#f4511e','#00897b','#6d4c41','#fdd835'];
const TRAIN_NAMES=['G1和谐号','G2复兴号','G3先锋号','G4飞跃号','G5闪电号','G6腾飞号','G7奔腾号','G8超越号','G9奋进号','G10胜利号'];

const WEATHER_TYPES=[
    {id:0,name:'☀️ 晴天',color:'#ffeb3b',speedMod:1.0,scoreMod:1.0,desc:'速度正常,分数正常'},
    {id:1,name:'⛅ 多云',color:'#90a4ae',speedMod:1.0,scoreMod:1.0,desc:'普通天气,无影响'},
    {id:2,name:'🌧️ 雨天',color:'#42a5f5',speedMod:0.85,scoreMod:0.9,desc:'列车速度-15%,分数-10%'},
    {id:3,name:'🌫️ 大雾',color:'#b0bec5',speedMod:0.7,scoreMod:0.8,desc:'速度-30%,分数-20%,延迟风险'},
    {id:4,name:'❄️ 暴雪',color:'#e3f2fd',speedMod:0.55,scoreMod:0.65,desc:'速度-45%,分数-35%,极易晚点'}
];

const ACHIEVEMENTS=[
    {id:'first_train',name:'🚄 首发车',desc:'成功调度第1列列车',done:false,check:g=>g.successCount>=1},
    {id:'ten_ok',name:'✅ 十全十美',desc:'成功调度10列列车',done:false,check:g=>g.successCount>=10},
    {id:'perfect_5',name:'🎯 连中五元',desc:'连续5列无错进站',done:false,check:g=>g.noWrongStreak>=5},
    {id:'gold_medal',name:'🥇 金牌站长',desc:'准点率≥90%且≥5列',done:false,check:g=>(g.successCount+g.errorCount)>=5&&g.totalOnTime/g.successCount>=0.9},
    {id:'rich',name:'💰 富甲一方',desc:'累计金币≥1000',done:false,check:g=>g.money>=1000},
    {id:'hero',name:'🦸 救场英雄',desc:'使用加速10次',done:false,check:g=>g.boostCount>=10},
    {id:'all_clear',name:'🌟 零失误',desc:'游戏期间错误=0且成功≥3',done:false,check:g=>g.errorCount===0&&g.successCount>=3}
];

const PLATFORM_UPGRADES=[
    {id:'speed',name:'⚡ 加速装置',cost:400,desc:'该站台列车停靠时间-20%',applyOnce:true},
    {id:'comfort',name:'🛋️ 舒适座椅',cost:300,desc:'该站台分数+20%',applyOnce:true},
    {id:'vip',name:'🎖️ VIP通道',cost:600,desc:'该站台奖励金币+50%',applyOnce:true}
];

const EVENTS=[
    {id:'rush',name:'🌆 早高峰',dur:360,desc:'列车生成速度×2!',onStart:g=>{g.spawnMul=2},onEnd:g=>{g.spawnMul=1}},
    {id:'express',name:'🚅 特快车',dur:240,desc:'列车速度+40%但时间-30%',onStart:g=>{g.speedBonus=1.4;g.timeMul=0.7},onEnd:g=>{g.speedBonus=1;g.timeMul=1}},
    {id:'bonus',name:'🎁 幸运日',dur:300,desc:'所有得分×1.5!',onStart:g=>{g.scoreMul=1.5},onEnd:g=>{g.scoreMul=1}},
    {id:'slow',name:'🔧 线路维护',dur:300,desc:'所有列车速度-25%',onStart:g=>{g.speedBonus=0.75},onEnd:g=>{g.speedBonus=1}},
    {id:'vip_train',name:'🎩 VIP专列',dur:0,desc:'下趟列车分数×3!',onStart:g=>{g.nextVip=true},onEnd:g=>{}},
    {id:'donation',name:'🎊 市政奖励',dur:0,desc:'获得+200金币!',onStart:g=>{g.money+=200},onEnd:g=>{}}
];

let audioCtx=null;
function initAudio(){
    if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
}
function playTone(freq,dur,type,vol){
    if(!audioCtx)return;
    try{
        const o=audioCtx.createOscillator();
        const g=audioCtx.createGain();
        o.type=type||'square';
        o.frequency.value=freq;
        g.gain.value=vol||0.15;
        g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
        o.connect(g);g.connect(audioCtx.destination);
        o.start();o.stop(audioCtx.currentTime+dur);
    }catch(e){}
}
function sfxArrive(){playTone(300,0.08,'sine',0.2);setTimeout(()=>playTone(420,0.1,'sine',0.18),80)}
function sfxSwitch(){playTone(220,0.05,'square',0.12);setTimeout(()=>playTone(280,0.05,'square',0.1),40)}
function sfxSuccess(){playTone(523,0.1,'sine',0.2);setTimeout(()=>playTone(659,0.1,'sine',0.2),100);setTimeout(()=>playTone(784,0.2,'sine',0.2),200)}
function sfxError(){playTone(160,0.2,'sawtooth',0.18)}
function sfxBuzzer(){playTone(130,0.4,'sawtooth',0.2)}
function sfxBtn(){playTone(600,0.06,'sine',0.1)}
function sfxCoin(){playTone(720,0.06,'square',0.12);setTimeout(()=>playTone(900,0.1,'square',0.1),50)}
function sfxDepart(){playTone(360,0.1,'sine',0.18);setTimeout(()=>playTone(280,0.12,'sine',0.15),100);setTimeout(()=>playTone(200,0.16,'sine',0.14),220)}

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let scale=1;
function resize(){
    const vw=innerWidth,vh=innerHeight;
    scale=Math.min(vw/W,vh/H);
    canvas.width=W*scale;canvas.height=H*scale;
    canvas.style.width=W*scale+'px';canvas.style.height=H*scale+'px';
    canvas.getContext('2d').setTransform(scale,0,0,scale,0,0);
}
window.addEventListener('resize',resize);resize();

function getPos(e){
    const r=canvas.getBoundingClientRect();
    const t=e.touches?e.touches[0]:e;
    return{x:(t.clientX-r.left)/scale,y:(t.clientY-r.top)/scale};
}

const G={
    state:STATE_MENU,
    score:0,
    high:0,
    timeLeft:GAME_TIME*60,
    money:200,
    switches:[0,1,2,3],
    trains:[],
    platforms:[null,null,null,null],
    platformTimers:[0,0,0,0],
    platformTrainIds:[null,null,null,null],
    spawnTimer:0,
    tickAcc:0,
    btnRects:{},
    successCount:0,
    errorCount:0,
    lateCount:0,
    totalOnTime:0,
    toaster:[],
    scorePopups:[],
    keys:{},
    particles:[],
    selectedPlatform:-1,
    weather:0,
    weatherTimer:0,
    weatherCooldown:120,
    noWrongStreak:0,
    boostCount:0,
    upgradesDone:[{},{},{},{}],
    platformLevels:[0,0,0,0],
    satisfaction:100,
    activeEvents:[],
    spawnMul:1,
    speedBonus:1,
    scoreMul:1,
    timeMul:1,
    nextVip:false,
    eventCooldown:480,
    achieved:{},
    showStats:false,
    showUpgrades:false,
    totalPassengers:0,
    peakTimer:0,
    isPeak:false
};

G.high=parseInt(Storage.load('huochezhanzhang_highscore','0'));

function platformX(i){return TRACK_START_X+i*((TRACK_END_X-TRACK_START_X)/3);}
function platformY(i){return PLATFORM_TOP+i*PLATFORM_GAP;}

function makeTrain(){
    const target=Math.floor(Math.random()*4);
    const baseStop=(5+Math.floor(Math.random()*8))*60;
    const stopT=Math.floor(baseStop*(G.timeMul||1));
    const colIdx=Math.floor(Math.random()*TRAIN_COLORS.length);
    const nmIdx=Math.floor(Math.random()*TRAIN_NAMES.length);
    const isVip=G.nextVip;
    if(G.nextVip)G.nextVip=false;
    return{
        id:Math.random().toString(36).slice(2,9),
        targetPlatform:target,
        assignedTrack:-1,
        x:platformX(target),
        y:INBOUND_Y-60,
        targetY:0,
        status:'incoming',
        stopTime:stopT,
        stopTimer:0,
        color:isVip?'#ffd700':TRAIN_COLORS[colIdx],
        name:(isVip?'👑VIP-':'')+TRAIN_NAMES[nmIdx],
        passengers:80+Math.floor(Math.random()*120),
        dir:1,
        arrived:false,
        speed:(1.4+Math.random()*0.6)*WEATHER_TYPES[G.weather].speedMod*(G.speedBonus||1),
        boosted:false,
        wrongPlatform:false,
        onTimeScore:100,
        isVip:isVip,
        scoreMul:isVip?3:1
    };
}

function initState(){
    G.state=STATE_PLAYING;
    G.score=0;G.money=200;G.timeLeft=GAME_TIME*60;
    G.switches=[0,1,2,3];
    G.trains=[];
    G.platforms=[null,null,null,null];
    G.platformTimers=[0,0,0,0];
    G.platformTrainIds=[null,null,null,null];
    G.spawnTimer=60;
    G.tickAcc=0;
    G.successCount=0;G.errorCount=0;G.lateCount=0;G.totalOnTime=0;
    G.toaster=[];G.scorePopups=[];G.particles=[];
    G.selectedPlatform=-1;
    G.weather=0;G.weatherTimer=0;G.weatherCooldown=120;
    G.noWrongStreak=0;G.boostCount=0;
    G.upgradesDone=[{},{},{},{}];G.platformLevels=[0,0,0,0];
    G.satisfaction=100;G.activeEvents=[];
    G.spawnMul=1;G.speedBonus=1;G.scoreMul=1;G.timeMul=1;
    G.nextVip=false;G.eventCooldown=480;
    G.achieved={};G.showStats=false;G.showUpgrades=false;
    G.totalPassengers=0;G.peakTimer=0;G.isPeak=false;
    for(let i=0;i<1;i++)G.trains.push(makeTrain());
    ACHIEVEMENTS.forEach(a=>a.done=false);
    toast('🚉 欢迎值班！点击道岔按钮切换轨道分配列车',240);
}

function changeWeather(){
    if(G.weatherTimer>0)G.weatherTimer--;
    if(G.weatherTimer<=0){
        G.weatherCooldown--;
        if(G.weatherCooldown<=0&&G.tickAcc%60===0&&Math.random()<0.05){
            const nw=Math.floor(Math.random()*WEATHER_TYPES.length);
            if(nw!==G.weather){
                G.weather=nw;
                G.weatherTimer=300+Math.floor(Math.random()*300);
                G.weatherCooldown=200;
                G.trains.forEach(t=>{t.speed=t.speed/W_EFFECT(1).spd*WEATHER_TYPES[nw].speedMod});
                sfxWeather();
                toast('🌤️ 天气:'+WEATHER_TYPES[nw].name+' '+WEATHER_TYPES[nw].desc,240);
            }
        }
    }
}
function W_EFFECT(base){return{spd:WEATHER_TYPES[G.weather].speedMod,sc:WEATHER_TYPES[G.weather].scoreMod};}
function sfxWeather(){playTone(440,0.06,'sine',0.15);setTimeout(()=>playTone(330,0.08,'sine',0.12),70)}
function sfxUpgrade(){playTone(520,0.1,'square',0.15);setTimeout(()=>playTone(660,0.1,'square',0.14),90);setTimeout(()=>playTone(780,0.18,'square',0.13),190)}
function sfxAchieve(){playTone(600,0.1,'triangle',0.18);setTimeout(()=>playTone(800,0.1,'triangle',0.16),100);setTimeout(()=>playTone(1000,0.2,'triangle',0.15),210)}
function sfxEvent(){playTone(280,0.08,'sawtooth',0.14);setTimeout(()=>playTone(380,0.12,'sawtooth',0.13),80)}

function tryTriggerEvent(){
    G.eventCooldown--;
    if(G.eventCooldown>0)return;
    if(G.activeEvents.length>=2)return;
    if(G.tickAcc%30!==0)return;
    if(Math.random()<0.025){
        const ev=EVENTS[Math.floor(Math.random()*EVENTS.length)];
        startEvent(ev);
    }
}
function startEvent(ev){
    if(ev.dur>0){
        G.activeEvents.push({...ev,timeLeft:ev.dur});
    }
    ev.onStart(G);
    G.eventCooldown=420+Math.floor(Math.random()*300);
    sfxEvent();
    toast('📢 事件:'+ev.name+' - '+ev.desc,260);
    spawnParticles(W/2,110,'#ffd700',18);
}
function updateEvents(){
    for(let i=G.activeEvents.length-1;i>=0;i--){
        G.activeEvents[i].timeLeft--;
        if(G.activeEvents[i].timeLeft<=0){
            G.activeEvents[i].onEnd(G);
            toast('📢 结束:'+G.activeEvents[i].name,180);
            G.activeEvents.splice(i,1);
        }
    }
}

function tryBuyUpgrade(pIdx,upIdx){
    if(pIdx<0||pIdx>=4)return false;
    const up=PLATFORM_UPGRADES[upIdx];
    if(G.upgradesDone[pIdx][up.id]){sfxError();toast('⚠️ 该站台已安装'+up.name,150);return false}
    if(G.money<up.cost){sfxError();toast('💸 金币不足!需要'+up.cost,150);return false}
    G.money-=up.cost;
    G.upgradesDone[pIdx][up.id]=true;
    G.platformLevels[pIdx]++;
    sfxUpgrade();
    toast('⬆️ '+(pIdx+1)+'号站台升级: '+up.name,220);
    spawnParticles(platformX(pIdx),platformY(pIdx),'#8bc34a',16);
    return true;
}

function updateSatisfaction(){
    const target=100-(G.errorCount*4)-(G.lateCount*2);
    G.satisfaction+=(target-G.satisfaction)*0.02;
    G.satisfaction=Math.max(0,Math.min(100,G.satisfaction));
}

function checkAchievements(){
    ACHIEVEMENTS.forEach(a=>{
        if(!a.done&&a.check(G)){
            a.done=true;G.achieved[a.id]=true;
            sfxAchieve();
            toast('🏅 解锁成就: '+a.name+' - '+a.desc,280);
            spawnParticles(W/2,100,'#ffd700',25);
            G.score+=50;
        }
    });
}

function startGame(){
    initAudio();initState();sfxBtn();
}

function endGame(){
    G.state=STATE_OVER;
    if(G.score>G.high){
        G.high=G.score;
        Storage.save('huochezhanzhang_highscore',G.high);
    }
    sfxBuzzer();
}

function togglePause(){
    if(G.state===STATE_PLAYING)G.state=STATE_PAUSE;
    else if(G.state===STATE_PAUSE)G.state=STATE_PLAYING;
    sfxBtn();
}

function toast(text,life){
    G.toaster.push({text:text,life:life||180,maxLife:life||180,y:0});
}

function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
}

function drawBtn(ctx,x,y,w,h,text,name,color,txtColor){
    G.btnRects[name]={x:x,y:y,w:w,h:h};
    ctx.fillStyle=color||'#ff6b35';
    ctx.strokeStyle='#fff';ctx.lineWidth=2;
    roundRect(ctx,x,y,w,h,8);ctx.fill();ctx.stroke();
    ctx.fillStyle=txtColor||'#fff';
    ctx.font='bold 14px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(text,x+w/2,y+h/2);

function setSwitch(trackIdx,platformIdx){

}

function boostTrain(platformIdx){
    const trainId=G.platformTrainIds[platformIdx];
    const train=G.trains.find(t=>t.id===trainId);
    if(!train||train.status!=='stopped'){sfxError();return false}
    if(G.money<50){sfxError();toast('💸 金币不足！加速需50金币',120);return false}
    G.money-=50;
    G.boostCount++;
    train.boosted=true;
    train.stopTimer=Math.min(train.stopTimer,train.stopTime-Math.floor(train.stopTime*0.5));
    sfxCoin();
    toast('⚡ '+train.name+' 加速！-50💰,仅停50%时间',180);
    return true;
}

function trainSuccess(train,platformIdx){
    const stoppedFull=train.stopTimer>=train.stopTime;
    const ratio=stoppedFull?1:Math.max(0.5,train.stopTimer/train.stopTime);
    const onTime=stoppedFull?50:Math.floor(50*ratio);
    const base=100;
    let bonus=base+onTime;
    bonus=Math.floor(bonus*WEATHER_TYPES[G.weather].scoreMod);
    bonus=Math.floor(bonus*(G.scoreMul||1));
    bonus=Math.floor(bonus*(train.scoreMul||1));
    if(G.upgradesDone[platformIdx]['comfort'])bonus=Math.floor(bonus*1.2);
    let coinBonus=30;
    if(G.upgradesDone[platformIdx]['vip'])coinBonus=Math.floor(coinBonus*1.5);
    G.score+=bonus;
    G.successCount++;
    G.totalOnTime+=stoppedFull?1:0;
    G.noWrongStreak++;
    G.money+=coinBonus;
    G.totalPassengers+=train.passengers;
    G.scorePopups.push({x:platformX(platformIdx),y:platformY(platformIdx)-10,text:'+'+bonus,life:60,maxLife:60,color:stoppedFull?'#8bc34a':'#ffb300'});
    spawnParticles(platformX(platformIdx),platformY(platformIdx),stoppedFull?'#8bc34a':'#ffb300',12);
    sfxSuccess();
    toast('✅ '+train.name+' 准点出站 +'+bonus+'分 +'+coinBonus+'💰',180);
}

function trainWrong(train,platformIdx){
    G.score=Math.max(0,G.score-50);
    G.errorCount++;
    G.noWrongStreak=0;
    G.scorePopups.push({x:platformX(platformIdx),y:platformY(platformIdx),text:'-50',life:60,maxLife:60,color:'#ef5350'});
    spawnParticles(platformX(platformIdx),platformY(platformIdx),'#ef5350',10);
    sfxError();
    toast('❌ '+train.name+' 进错站台！旅客愤怒 -50分',240);
}

function trainLate(train,platformIdx){
    G.score=Math.max(0,G.score-30);
    G.lateCount++;
    train.wrongPlatform=true;
    G.scorePopups.push({x:platformX(platformIdx),y:platformY(platformIdx),text:'晚点-30',life:60,maxLife:60,color:'#ff9800'});
    spawnParticles(platformX(platformIdx),platformY(platformIdx),'#ff9800',8);
    sfxDepart();
    toast('⏰ '+train.name+' 出站晚点！-30分',180);
}

function trainAttemptDepart(train,platformIdx){
    const blocked=G.platforms.some((p,i)=>p!==null&&i!==platformIdx&&G.platforms[i]==='blocked-by-out');
    const frontX=platformX(platformIdx);
    const conflict=G.trains.some(t=>{
        if(t.id===train.id)return false;
        if(t.status!=='exiting')return false;
        return Math.abs(t.x-frontX)<50&&t.y>OUTBOUND_Y-80&&t.y<OUTBOUND_Y+20;
    });
    if(conflict){
        return false;
    }
    return true;
}

function update(){
    if(G.state!==STATE_PLAYING)return;
    G.timeLeft--;G.tickAcc++;
    changeWeather();
    tryTriggerEvent();
    updateEvents();
    updateSatisfaction();
    checkAchievements();
    G.spawnTimer--;
    const spawnInterval=Math.max(80,Math.floor((180+Math.floor(Math.random()*120))/(G.spawnMul||1)));
    if(G.spawnTimer<=0){
        G.spawnTimer=spawnInterval;
        if(G.trains.length<12)G.trains.push(makeTrain());
    }
    for(let i=G.trains.length-1;i>=0;i--){
        const t=G.trains[i];
        const targetX=platformX(t.targetPlatform);
        if(t.status==='incoming'){
            const desiredPlatform=G.switches[t.targetPlatform];
            if(t.assignedTrack<0){
                t.assignedTrack=t.targetPlatform;
            }
            t.x=targetX;
            t.y+=t.speed;
            const destY=platformY(desiredPlatform);
            if(t.y>=destY-10){
                t.y=destY;
                const correct=desiredPlatform===t.targetPlatform;
                if(!correct){
                    t.status='stopped';
                    t.stopTimer=0;
                    G.platforms[desiredPlatform]='occupied';
                    G.platformTrainIds[desiredPlatform]=t.id;
                    let st=t.stopTime;
                    if(G.upgradesDone[desiredPlatform]['speed'])st=Math.floor(st*0.8);
                    G.platformTimers[desiredPlatform]=st;
                    t.stopTime=st;
                    t.wrongPlatform=true;
                    sfxArrive();
                    trainWrong(t,desiredPlatform);
                }else{
                    t.status='stopped';
                    t.stopTimer=0;
                    G.platforms[desiredPlatform]='occupied';
                    G.platformTrainIds[desiredPlatform]=t.id;
                    let st=t.stopTime;
                    if(G.upgradesDone[desiredPlatform]['speed'])st=Math.floor(st*0.8);
                    G.platformTimers[desiredPlatform]=st;
                    t.stopTime=st;
                    sfxArrive();
                }
            }
        }else if(t.status==='stopped'){
            const pIdx=G.platformTrainIds.indexOf(t.id);
            t.stopTimer++;
            if(pIdx>=0)G.platformTimers[pIdx]=Math.max(0,t.stopTime-t.stopTimer);
            const needLeave=t.stopTimer>=t.stopTime;
            if(needLeave){
                if(trainAttemptDepart(t,pIdx)){
                    t.status='exiting';
                    t.targetY=OUTBOUND_Y+40;
                    G.platforms[pIdx]=null;
                    G.platformTrainIds[pIdx]=null;
                    G.platformTimers[pIdx]=0;
                    if(!t.wrongPlatform){
                        trainSuccess(t,pIdx);
                    }else{
                        G.trains.splice(i,1);
                        continue;
                    }
                }else{
                    if(t.stopTimer>t.stopTime+120){
                        trainLate(t,pIdx);
                        t.status='exiting';
                        t.targetY=OUTBOUND_Y+40;
                        G.platforms[pIdx]=null;
                        G.platformTrainIds[pIdx]=null;
                        G.platformTimers[pIdx]=0;
                    }
                }
            }
        }else if(t.status==='exiting'){
            t.y+=t.speed*1.2;
            if(t.y>H+40){
                G.trains.splice(i,1);
                continue;
            }
        }
    }
    for(let i=G.scorePopups.length-1;i>=0;i--){
        G.scorePopups[i].y-=0.8;G.scorePopups[i].life--;
        if(G.scorePopups[i].life<=0)G.scorePopups.splice(i,1);
    }
    for(let i=G.particles.length-1;i>=0;i--){
        const p=G.particles[i];
        p.x+=p.vx;p.y+=p.vy;p.vy+=0.2;
        p.life--;
        if(p.life<=0)G.particles.splice(i,1);
    }
    for(let i=G.toaster.length-1;i>=0;i--){
        G.toaster[i].life--;
        G.toaster[i].y+=(G.toaster.length-1-i)*0.3;
        if(G.toaster[i].life<=0)G.toaster.splice(i,1);
    }
    if(G.timeLeft<=0){endGame();return}
}

function draw(){
    if(G.state===STATE_MENU){drawMenu();return}
    const bg=ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#1a1a2e');bg.addColorStop(1,'#16213e');
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    if(G.state===STATE_PLAYING){
        drawStationBackdrop();drawWeatherBar();drawTracks();drawSwitches();drawPlatforms();
        for(const t of G.trains)drawTrain(t);
        drawEffects();
        drawHUD();drawBottomUI();
        drawUpgradePanel();drawStatsPanel();
    }else if(G.state===STATE_PAUSE){
        drawStationBackdrop();drawWeatherBar();drawTracks();drawSwitches();drawPlatforms();
        for(const t of G.trains)drawTrain(t);
        drawHUD();drawBottomUI();
        drawPause();
    }else if(G.state===STATE_OVER){
        drawStationBackdrop();drawTracks();drawSwitches();drawPlatforms();
        drawOver();
    }
}

function onPointerDown(p){
    initAudio();
    if(G.state===STATE_MENU){
        if(hitBtn(p,'start')){startGame();return}
    }else if(G.state===STATE_PAUSE){
        if(hitBtn(p,'resume')){G.state=STATE_PLAYING;sfxBtn();return}
        if(hitBtn(p,'menu')){G.state=STATE_MENU;sfxBtn();return}
    }else if(G.state===STATE_OVER){
        if(hitBtn(p,'restart')){startGame();return}
        if(hitBtn(p,'menu')){G.state=STATE_MENU;sfxBtn();return}
    }
    if(G.state!==STATE_PLAYING)return;
    if(G.showUpgrades){
        if(hitBtn(p,'closeUp')){G.showUpgrades=false;sfxBtn();return}
        for(let pIdx=0;pIdx<4;pIdx++){
            if(hitBtn(p,'pSel'+pIdx)){G.selectedPlatform=pIdx;sfxBtn();return}
            for(let u=0;u<PLATFORM_UPGRADES.length;u++){
                if(hitBtn(p,'up'+pIdx+'_'+u)){tryBuyUpgrade(pIdx,u);return}
            }
        }
        return;
    }
    if(G.showStats){
        if(hitBtn(p,'closeSt')){G.showStats=false;sfxBtn();return}
        return;
    }
    if(hitBtn(p,'openUp')){G.showUpgrades=true;sfxBtn();return}
    if(hitBtn(p,'openSt')){G.showStats=true;sfxBtn();return}
    if(hitBtn(p,'pause')){togglePause();return}
    if(hitBtn(p,'resetSw')){
        G.switches=[0,1,2,3];sfxSwitch();
        toast('🔀 道岔已重置为1→1,2→2,3→3,4→4',150);return;
    }
    for(let i=0;i<4;i++){
        if(hitBtn(p,'switchBtn'+i)){
            const cur=G.switches[i];
            const next=(cur+1)%4;
            setSwitch(i,next);return;
        }
        if(hitBtn(p,'switch'+i)){
            const cur=G.switches[i];
            setSwitch(i,(cur+1)%4);return;
        }
        if(hitBtn(p,'boost'+i)){
            G.selectedPlatform=i;boostTrain(i);return;
        }
    }
    for(let i=0;i<PLATFORM_COUNT;i++){
        const px=platformX(i)-55,py=platformY(i)-PLATFORM_H/2;
        if(p.x>=px&&p.x<=px+110&&p.y>=py&&p.y<=py+PLATFORM_H){
            G.selectedPlatform=i;sfxBtn();
            if(G.platforms[i]){
                boostTrain(i);
            }else{
                toast('选择了 '+ (i+1) +' 号站台',100);
            }
            return;
        }
    }
}

window.addEventListener('keydown',function(e){
    const k=e.key.toLowerCase();
    G.keys[k]=true;initAudio();
    if(e.key===' '){e.preventDefault();if(G.state===STATE_MENU||G.state===STATE_OVER){startGame();return}}
    if(e.key==='Escape'){
        if(G.showUpgrades){G.showUpgrades=false;sfxBtn();return}
        if(G.showStats){G.showStats=false;sfxBtn();return}
        if(G.state===STATE_PLAYING||G.state===STATE_PAUSE)togglePause();return
    }
    if(G.state!==STATE_PLAYING)return;
    if(G.showUpgrades||G.showStats)return;
    if(k==='5'){G.showUpgrades=!G.showUpgrades;sfxBtn();return}
    if(k==='6'){G.showStats=!G.showStats;sfxBtn();return}
    if(k==='q'){const c=G.switches[0];setSwitch(0,(c+1)%4)}
    if(k==='w'){const c=G.switches[1];setSwitch(1,(c+1)%4)}
    if(k==='e'){const c=G.switches[2];setSwitch(2,(c+1)%4)}
    if(k==='r'){const c=G.switches[3];setSwitch(3,(c+1)%4)}
    if(k==='a'){G.selectedPlatform=0;boostTrain(0)}
    if(k==='s'){G.selectedPlatform=1;boostTrain(1)}
    if(k==='d'){G.selectedPlatform=2;boostTrain(2)}
    if(k==='f'){G.selectedPlatform=3;boostTrain(3)}
    if(k==='1'||k==='2'||k==='3'||k==='4'){
        const idx=parseInt(k)-1;
        G.selectedPlatform=idx;
        const curTr=G.switches[idx];
        setSwitch(idx,(curTr+1)%4);
    }
    if(k==='z'){G.switches=[0,1,2,3];sfxSwitch();toast('道岔已重置',120)}
});
window.addEventListener('keyup',function(e){G.keys[e.key.toLowerCase()]=false});

        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {

<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
