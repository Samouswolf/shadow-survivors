<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宠物收容所</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#1b3a1b;font-family:"Microsoft YaHei",sans-serif;min-height:100vh;overflow:auto;padding:10px 0;}
#wrap{width:100%;max-width:960px;margin:0 auto;}
#gm{background:#2d4a2d;border:2px solid #4a7c59;border-radius:12px;padding:10px;}
.hd{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:8px;}
.cd{background:#1a331a;border:1px solid #4a7c59;border-radius:7px;padding:7px;text-align:center;}
.cd .l{font-size:10px;color:#a5d6a7;}
.cd .v{font-size:17px;font-weight:bold;margin-top:2px;}
.mo .v{color:#ffd54f;}
.pt .v{color:#81d4fa;}
.ad .v{color:#f06292;}
.hp .v{color:#ef9a9a;}
.dy .v{color:#fff176;}
.sc .v{color:#ce93d8;}
#cv{display:block;border:2px solid #4a7c59;border-radius:8px;max-width:100%;height:auto;background:#0f2010;margin:0 auto;}
#tb{display:flex;gap:4px;margin:8px 0;flex-wrap:wrap;}
.tg{padding:6px 12px;background:#1a331a;border:1px solid #4a7c59;border-radius:6px;color:#a5d6a7;cursor:pointer;font-size:12px;}
.tg.on{background:#4a7c59;color:#fff;border-color:#a5d6a7;}
#sh{background:#1a331a;border:1px solid #4a7c59;border-radius:8px;padding:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:6px;}
.it{background:#2d4a2d;border:1px solid #4a7c59;border-radius:6px;padding:7px;text-align:center;cursor:pointer;transition:0.15s;}
.it:hover:not(.no){background:#4a7c59;transform:translateY(-1px);}
.it.sl{border-color:#ffd54f;background:#33691e;box-shadow:0 0 8px rgba(255,213,79,0.35);}
.it.no{opacity:0.4;cursor:not-allowed;}
.it .ic{font-size:23px;}
.it .nm{font-size:11px;color:#e8f5e9;margin:2px 0;}
.it .pr{font-size:10px;color:#ffd54f;}
.it .xt{font-size:9px;color:#a5d6a7;}
#bm{display:grid;grid-template-columns:1.2fr 1fr;gap:8px;margin-top:8px;}
.pn{background:#1a331a;border:1px solid #4a7c59;border-radius:8px;padding:9px;color:#e8f5e9;font-size:12px;line-height:1.7;}
.pn .hh{color:#aed581;font-weight:bold;font-size:13px;margin-bottom:5px;padding-bottom:4px;border-bottom:1px solid #4a7c59;}
.lg{max-height:100px;overflow-y:auto;background:#0a1a0a;border-radius:5px;padding:5px;font-size:11px;}
.lg div{padding:2px 0;border-bottom:1px dashed #4a7c59;color:#a5d6a7;}
.bt{background:linear-gradient(180deg,#558b2f,#33691e);color:#fff;border:1px solid#aed581;padding:7px 13px;border-radius:6px;cursor:pointer;font-size:12px;margin:2px;}
.bt:hover{filter:brightness(1.15);}
.bt:active{transform:scale(0.97);}
.bt.g{background:linear-gradient(180deg,#00897b,#004d40);}
.bt.r{background:linear-gradient(180deg,#d32f2f,#b71c1c);}
.bt.y{background:linear-gradient(180deg,#f9a825,#f57f17);}
#ss,#sp,#se{position:fixed;inset:0;background:rgba(10,26,10,0.97);z-index:2000;display:flex;flex-direction:column;align-items:center;justify-content:center;}
#ss h1{font-size:48px;color:#aed581;text-shadow:0 0 20px rgba(174,213,129,0.5),3px 3px 0 #33691e;margin-bottom:10px;letter-spacing:2px;}
#ss .sb{color:#a5d6a7;font-size:17px;margin-bottom:28px;}
#start-game-btn{background:linear-gradient(180deg,#7cb342,#558b2f);color:#fff;font-size:22px;padding:15px 65px;border:2px solid #c5e1a5;border-radius:12px;cursor:pointer;font-weight:bold;letter-spacing:2px;box-shadow:0 6px 20px rgba(124,179,66,0.45);}
#start-game-btn:hover{transform:scale(1.05);filter:brightness(1.1);}
.gd{margin-top:28px;color:#81c784;font-size:13px;max-width:450px;text-align:center;line-height:1.9;padding:14px;border:1px solid #4a7c59;border-radius:10px;background:rgba(45,74,45,0.5);}
.hsb{margin-top:18px;padding:10px 24px;border:1px solid #ffd54f;border-radius:8px;color:#ffd54f;background:rgba(255,213,79,0.07);}
#sp h2,#se h2{font-size:33px;color:#aed581;margin-bottom:24px;}
.lgb{padding:11px 42px;margin:6px;font-size:16px;border:none;border-radius:8px;cursor:pointer;color:#fff;font-weight:bold;}
.sst{color:#e8f5e9;font-size:16px;line-height:2.1;background:rgba(45,74,45,0.6);padding:20px 30px;border-radius:11px;border:1px solid #4a7c59;margin:18px 0;}
/* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */
/* [BATCH-FIX:ad-components-css] */
.sponsor-btn{position:fixed;bottom:8px;left:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:2px 6px;border-radius:10px;font:10px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.sponsor-panel.show{display:flex}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.interstitial-ad.show{display:flex}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* [/BATCH-FIX:ad-components-css] */

/* [AD-FIX:responsive] */
@media (max-width:768px){.ad-banner-container{display:none!important}.sponsor-btn{transform:scale(.8);opacity:.6}}
/* [/AD-FIX:responsive] */
</style>
</head>

<div id="wrap">
<div id="gm">
<div class="hd">
<div class="cd mo"><div class="l">💰 资金</div><div class="v" id="vmo">$1500</div></div>
<div class="cd pt"><div class="l">🐾 宠物数</div><div class="v" id="vpt">0</div></div>

<button class="bt" id="btnP">⏸ 暂停(P)</button>
<button class="bt y" id="btnSv">💾 保存</button>
<button class="bt r" id="btnRs">🔄 重开</button>

</div>
<div class="pn">
<div class="hh">📰 爱心日志</div>
<div class="lg" id="lg"></div>
</div>
</div>
</div>
</div>

<div id="ss">
<h1>🐾 宠物收容所</h1>
<div class="sb">救助流浪动物 · 用爱温暖世界 · 成就领养传奇</div>
<div class="hsb">历史最高声望: <span id="hs">0</span></div>

<b>游戏玩法：</b><br>
• 【扩建】建造猫/狗舍、医疗室等增加容量<br>
• 【物资】购买粮食、药品维持宠物健康<br>
• 【雇佣】聘请志愿者、医生协助照顾<br>

</div>

<script>
if(typeof STATE_MENU==='undefined')var STATE_MENU=0;
if(typeof STATE_PLAYING==='undefined')var STATE_PLAYING=1;
if(typeof STATE_OVER==='undefined')var STATE_OVER=2;
if(typeof STATE_PAUSE==='undefined')var STATE_PAUSE=3;
</script>
<script src="../game_core.js"></script>
<script>
(function(){var S=window.Storage;if(!S||typeof S.load!=='function'){S={load:function(k,d){try{return JSON.parse(localStorage.getItem(k))}catch(e){return d}},save:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};window.Storage=S;}})();
var cv=document.getElementById('cv'),cx=cv.getContext('2d'),W=cv.width,H=cv.height;
var st=STATE_MENU,G,cat=0,sel=null,tm=null,pets=[],onD=false,dp=0;
function rs(){var m=Math.min(window.innerWidth-30,960);if(W>m){cv.style.width=m+'px';cv.style.height=(H*m/W)+'px';}}
rs();window.addEventListener('resize',rs);

var BLD=[
  {id:'k1',n:'猫舍',ic:'🐱',cost:400,cap:4,un:0,tp:'cat',hp:0.05},
  {id:'d1',n:'狗舍',ic:'🐶',cost:500,cap:4,un:0,tp:'dog',hp:0.05},
  {id:'r1',n:'兔舍',ic:'🐰',cost:350,cap:5,un:2,tp:'rab',hp:0.05},
  {id:'b1',n:'鸟舍',ic:'🐦',cost:300,cap:6,un:3,tp:'bird',hp:0.05},
  {id:'cl',n:'医疗室',ic:'🏥',cost:1500,cap:0,un:5,med:1,hp:0.15},
  {id:'pl',n:'游乐场',ic:'🎠',cost:1000,cap:0,un:4,hap:0.2},
  {id:'kt',n:'厨房',ic:'🍳',cost:800,cap:0,un:3,food:0.3},
  {id:'of',n:'接待厅',ic:'🏠',cost:1200,cap:0,un:6,adopt:0.3},
  {id:'gr',n:'花园',ic:'🌻',cost:600,cap:0,un:2,hap:0.1,sc:5}
];
var SUP=[
  {id:'f1',n:'猫粮',ic:'🥫',cost:80,qty:30,use:1,tp:'cat',un:0},
  {id:'f2',n:'狗粮',ic:'🦴',cost:100,qty:30,use:1,tp:'dog',un:0},
  {id:'f3',n:'兔粮',ic:'🥕',cost:60,qty:40,use:1,tp:'rab',un:2},
  {id:'f4',n:'鸟粮',ic:'🌾',cost:50,qty:50,use:1,tp:'bird',un:3},
  {id:'m1',n:'药品',ic:'💊',cost:150,qty:10,use:1,un:3,med:1},
  {id:'t1',n:'玩具',ic:'🎾',cost:100,qty:15,use:1,un:2,hap:1},
  {id:'b2',n:'毛毯',ic:'🧣',cost:60,qty:20,use:1,un:0,hp:0.05},
  {id:'c1',n:'清洁品',ic:'🧴',cost:70,qty:25,use:1,un:0,cln:1}
];
var HR=[
  {id:'v1',n:'志愿者',ic:'🧑',cost:500,sl:30,un:0,care:1},
  {id:'v2',n:'医生',ic:'👨‍⚕️',cost:2000,sl:120,un:8,med:2,care:2},
  {id:'v3',n:'美容师',ic:'💇',cost:1500,sl:90,un:6,hap:1,sc:1},
  {id:'v4',n:'领养顾问',ic:'💼',cost:1800,sl:100,un:7,adopt:1,sc:2}
];
var UPG=[
  {id:'u1',n:'空调系统',ic:'❄️',cost:2500,un:5,one:1,hp:0.1,hap:0.1},
  {id:'u2',n:'监控系统',ic:'📹',cost:1500,un:3,one:1,sc:5},
  {id:'u3',n:'网站宣传',ic:'🌐',cost:3000,un:6,one:1,adopt:0.5,sc:15},
  {id:'u4',n:'宠物训练',ic:'🎓',cost:4000,un:10,one:1,adopt:0.5,hap:0.2},
  {id:'u5',n:'赞助合作',ic:'🤝',cost:10000,un:15,one:1,m:500,sc:30}
];
var ALL=[BLD,SUP,HR,UPG];
var TYPES=[
  {k:'cat',n:'猫',ic:['🐱','😺','😻','🐈','🐈‍⬛']},
  {k:'dog',n:'狗',ic:['🐶','🐕','🐩','🦮','🐕‍🦺']},
  {k:'rab',n:'兔',ic:['🐰','🐇']},
  {k:'bird',n:'鸟',ic:['🐦','🐤','🐥','🦜','🐔']}
];

function newG(){
  G={m:1500,d:1,pets:0,adopt:0,sc:10,
    bld:{},sup:{v1:0},hr:{},upg:{},
    cap:{cat:4,dog:4,rab:0,bird:0},
    hp:100,hap:100,total:0,
    careT:1,medT:0,foodB:0,adB:0,
    don:0,dayD:0,dayA:0,grid:[]};
  G.GR=8;G.GC=14;G.CW=(W-40)/G.GC;G.CH=(H-80)/G.GR;
  for(var r=0;r<G.GR;r++){G.grid[r]=[];for(var c=0;c<G.GC;c++)G.grid[r][c]=null;}
  placeB(2,3,'k1');placeB(2,6,'d1');
  G.sup={f1:30,f2:30,f3:0,f4:0,m1:5,t1:10,b2:20,c1:20};
  G.m=1500;
  calc();upd();rnd();lg('🐾 欢迎来到爱心收容所！');
}
function placeB(r,c,id){
  if(G.grid[r][c])return;var bd=null;
  for(var i=0;i<BLD.length;i++)if(BLD[i].id===id)bd=BLD[i];
  if(!bd)return;
  G.grid[r][c]=id;G.bld[id]=(G.bld[id]||0)+1;
}
function calc(){
  G.cap={cat:0,dog:0,rab:0,bird:0};G.careT=0;G.medT=0;G.foodB=0;G.adB=0;G.sc=10;G.hp=0;G.hap=0;
  for(var k in G.bld){for(var i=0;i<BLD.length;i++){if(BLD[i].id===k){var b=BLD[i],n=G.bld[k];
    if(b.cap){G.cap[b.tp]+=b.cap*n;}
    if(b.hp)G.hp+=b.hp*n;if(b.hap)G.hap+=b.hap*n;if(b.food)G.foodB+=b.food*n;
    if(b.adopt)G.adB+=b.adopt*n;if(b.sc)G.sc+=b.sc*n;if(b.med)G.medT+=b.med*n;
  }}}
  var sl=0;
  for(k in G.hr){for(i=0;i<HR.length;i++){if(HR[i].id===k){var h=HR[i],n2=G.hr[k];
    sl+=h.sl*n2;if(h.care)G.careT+=h.care*n2;if(h.med)G.medT+=h.med*n2;
    if(h.hap)G.hap+=h.hap*0.1*n2;if(h.sc)G.sc+=h.sc*n2;if(h.adopt)G.adB+=h.adopt*0.2*n2;
  }}}
  G.salary=sl;
  for(k in G.upg){for(i=0;i<UPG.length;i++){if(UPG[i].id===k&&G.upg[k]){var u=UPG[i];
    if(u.hp)G.hp+=u.hp;if(u.hap)G.hap+=u.hap;if(u.sc)G.sc+=u.sc;if(u.adopt)G.adB+=u.adopt;
    if(u.m)G.monInc=(G.monInc||0)+u.m;
  }}}
  G.totCap=G.cap.cat+G.cap.dog+G.cap.rab+G.cap.bird;
  G.HPmod=Math.min(1.5,1+G.hp+G.careT*0.05+G.medT*0.08);
  G.HAPmod=Math.min(1.5,1+G.hap+G.careT*0.03);
  G.ADmod=1+G.adB;
}
function upd(){
  var avgHp=100,avgHa=100,tot=pets.length;
  if(tot>0){var h1=0,h2=0;for(var i=0;i<pets.length;i++){h1+=pets[i].hp;h2+=pets[i].hap;}avgHp=h1/tot;avgHa=h2/tot;}
  document.getElementById('vmo').textContent='$'+G.m;
  document.getElementById('vpt').textContent=pets.length+'/'+G.totCap;
  document.getElementById('vad').textContent=G.adopt;
  document.getElementById('vhp').textContent=Math.floor(avgHp)+'%';
  document.getElementById('vdy').textContent=G.d;
  document.getElementById('vsc').textContent=G.sc;
  var b1=[],s1=[],h1=[];
  for(var k in G.bld)for(var i=0;i<BLD.length;i++)if(BLD[i].id===k)b1.push(BLD[i].ic+G.bld[k]);
  for(k in G.hr)for(i=0;i<HR.length;i++)if(HR[i].id===k)h1.push(HR[i].ic+G.hr[k]);
  for(k in G.sup)if(G.sup[k]>0)for(var i=0;i<SUP.length;i++)if(SUP[i].id===k)s1.push(SUP[i].ic+G.sup[k]);
  document.getElementById('if').innerHTML='容量: 猫'+G.cap.cat+'/狗'+G.cap.dog+'/兔'+G.cap.rab+'/鸟'+G.cap.bird+'<br>'
    +'护理: '+G.careT+' 医疗: '+G.medT+' 日薪: $'+G.salary+'<br>'
    +'建筑: '+b1.join(' ')+' 员工: '+h1.join(' ');
}
function lg(m){var el=document.getElementById('lg');var d=document.createElement('div');d.textContent='[D'+G.d+'] '+m;el.insertBefore(d,el.firstChild);while(el.children.length>15)el.removeChild(el.lastChild);}
function rnd(){
  var el=document.getElementById('sh');el.innerHTML='';var lst=ALL[cat];
  for(var i=0;i<lst.length;i++)(function(it){
    var d=document.createElement('div');var lk=it.un&&G.sc<it.un;
    var oneD=it.one&&G.upg[it.id];var no=lk||oneD;
    d.className='it'+(sel===it.id?' sl':'')+(no?' no':'');
    var pr='';
    if(cat===0){var c=G.bld[it.id]||0;pr='$'+it.cost+(it.cap?' 容量'+it.cap:'')+' [x'+c+']';}
    else if(cat===1){pr='$'+it.cost+'/'+it.qty;}
    else if(cat===2){c=G.hr[it.id]||0;pr='$'+it.cost+' 日$'+it.sl+' [x'+c+']';}
    else{pr='$'+it.cost+(oneD?' (完成)':'');}
    d.innerHTML='<div class="ic">'+it.ic+'</div><div class="nm">'+it.n+'</div><div class="pr">'+pr+'</div>'
      +(it.un?'<div class="xt">⭐'+it.un+'解锁</div>':'');
    d.onclick=function(){
      if(lk){GameCore.hints.show('需要声望 ⭐'+it.un);return;}
      if(oneD){GameCore.hints.show('已完成');return;}
      if(G.m<it.cost){GameCore.hints.show('资金不足！');return;}
      if(cat===0){sel=sel===it.id?null:it.id;}
      else if(cat===1){G.m-=it.cost;G.sup[it.id]=(G.sup[it.id]||0)+it.qty;lg('📦 采购 '+it.ic+it.n+' +'+it.qty+' -$'+it.cost);}
      else if(cat===2){G.m-=it.cost;G.hr[it.id]=(G.hr[it.id]||0)+1;lg('👷 雇佣 '+it.ic+it.n+' -$'+it.cost);}
      else{G.m-=it.cost;G.upg[it.id]=1;lg('🎁 升级 '+it.ic+it.n+' -$'+it.cost);}
      calc();upd();rnd();
    };el.appendChild(d);
  })(lst[i]);
}
document.querySelectorAll('.tg').forEach(function(t){t.onclick=function(){
  document.querySelectorAll('.tg').forEach(function(x){x.classList.remove('on');});
  t.classList.add('on');cat=parseInt(t.dataset.c);sel=null;rnd();};});
function newPet(){
  var tps=[],tcap={cat:0,dog:0,rab:0,bird:0};
  for(var i=0;i<pets.length;i++)tcap[pets[i].tp]++;
  if(G.cap.cat>tcap.cat)tps.push('cat');
  if(G.cap.dog>tcap.dog)tps.push('dog');
  if(G.cap.rab>tcap.rab)tps.push('rab');
  if(G.cap.bird>tcap.bird)tps.push('bird');
  if(!tps.length)return null;
  var tp=tps[Math.floor(Math.random()*tps.length)];
  var td=TYPES.find(function(t){return t.k===tp;});
  var names=['小白','豆豆','花花','旺财','咪咪','毛毛','球球','乐乐','贝贝','多多','妮妮','乖乖','虎子','咪咪','宝宝','贝贝'];
  var p={tp:tp,n:names[Math.floor(Math.random()*names.length)],
    ic:td.ic[Math.floor(Math.random()*td.ic.length)],
    hp:70+Math.floor(Math.random()*25),hap:50+Math.floor(Math.random()*30),
    age:Math.floor(Math.random()*10),sc:0,
    x:-30,y:80+Math.random()*(H-180),tx:60+Math.random()*(W-180),ty:100+Math.random()*(H-200),
    in:false,ad:false,left:false,stay:0,boost:0};
  var sc=p.hp*0.5+p.hap*0.3+(50-p.age)*0.4;
  p.sc=Math.max(20,Math.min(100,Math.floor(sc)));
  return p;
}
function startD(){
  if(st!==STATE_PLAYING||onD)return;
  onD=true;dp=0;G.dayD=0;G.dayA=0;
  var nr=1+Math.floor(G.sc/15)+Math.floor(Math.random()*3);
  var sp=0,it1=setInterval(function(){
    if(st!==STATE_PLAYING||!onD){clearInterval(it1);return;}
    if(sp>=nr){clearInterval(it1);return;}
    var pt=newPet();if(!pt)return;
    pets.push(pt);sp++;G.dayD++;
    lg('🆘 救助了一只'+TYPES.find(function(x){return x.k===pt.tp;}).n+': '+pt.ic+pt.n);
  },900);
  var nar=Math.floor(G.adB*2)+Math.floor(Math.random()*3);
  var sp2=0,it2=setInterval(function(){
    if(st!==STATE_PLAYING||!onD){clearInterval(it2);return;}
    if(sp2>=nar){clearInterval(it2);return;}
    var av=pets.filter(function(p){return p.in&&!p.ad&&!p.left&&p.hp>70&&p.hap>60;});
    if(av.length===0)return;
    var pk=av[Math.floor(Math.random()*av.length)];
    pk.ad=true;var fee=Math.floor(50+pk.sc*2+G.sc);
    G.m+=fee;G.total+=fee;G.adopt++;G.dayA++;G.sc=Math.min(100,G.sc+2);
    lg('🏠 '+pk.ic+pk.n+' 被领养！+$'+fee+'(声望+2)');
    setTimeout(function(pp){pp.left=true;}(pk),1200);
    sp2++;upd();
  },2000);
  upd();
}
function draw(){
  cx.fillStyle='#0f2010';cx.fillRect(0,0,W,H);
  cx.fillStyle='#1a331a';cx.fillRect(0,0,W,60);
  cx.fillStyle='#4a7c59';cx.fillRect(0,55,W,5);
  cx.font='bold 14px sans-serif';cx.fillStyle='#aed581';cx.textAlign='left';
  cx.fillText('🐾 爱心收容所  |  容量 '+pets.length+'/'+G.totCap+'  |  声望 ⭐'+G.sc,12,38);
  cx.font='11px sans-serif';cx.fillStyle='#81c784';cx.textAlign='right';
  cx.fillText(onD?('⏱️ '+Math.floor(dp)+'%'):'🌙 休息',W-15,38);
  cx.strokeStyle='rgba(74,124,89,0.35)';cx.lineWidth=1;
  for(var r=0;r<=G.GR;r++){cx.beginPath();cx.moveTo(20,65+r*G.CH);cx.lineTo(W-20,65+r*G.CH);cx.stroke();}
  for(var c=0;c<=G.GC;c++){cx.beginPath();cx.moveTo(20+c*G.CW,65);cx.lineTo(20+c*G.CW,H-15);cx.stroke();}
  for(r=0;r<G.GR;r++)for(c=0;c<G.GC;c++){
    var id=G.grid[r][c];if(!id)continue;
    for(var i=0;i<BLD.length;i++)if(BLD[i].id===id){var bd=BLD[i];break;}
    var x=20+c*G.CW,y=65+r*G.CH;
    var col=['#558b2f','#33691e','#689f38','#8bc34a','#00897b','#f9a825','#e65100','#6d4c41','#ad1457'];
    cx.fillStyle=col[(r*3+c)%col.length];cx.fillRect(x+3,y+3,G.CW-6,G.CH-6);
    cx.strokeStyle='#c5e1a5';cx.strokeRect(x+3,y+3,G.CW-6,G.CH-6);
    cx.font=Math.min(G.CW*0.45,G.CH*0.5)+'px sans-serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillStyle='#fff';
    cx.fillText(bd.ic,x+G.CW/2,y+G.CH/2);
    if(bd.cap){cx.font='9px sans-serif';cx.fillStyle='#fff176';cx.textAlign='right';cx.fillText(bd.cap+'只',x+G.CW-5,y+G.CH-6);}
  }
  if(sel&&st===STATE_PLAYING&&hv){
    var x=20+hv.c*G.CW,y=65+hv.r*G.CH;
    cx.strokeStyle=G.grid[hv.r][hv.c]?'#ef5350':'#ffd54f';cx.lineWidth=3;cx.setLineDash([5,4]);
    cx.strokeRect(x+1,y+1,G.CW-2,G.CH-2);cx.setLineDash([]);
  }
  for(var i=0;i<pets.length;i++){
    var p=pets[i];if(p.left)continue;
    if(!p.in){p.x+=(p.tx-p.x)*0.04;p.y+=(p.ty-p.y)*0.04;
      if(Math.abs(p.x-p.tx)<2&&Math.abs(p.y-p.ty)<2)p.in=true;}
    else{p.x+=Math.sin(Date.now()*0.001+i)*0.3;p.y+=Math.cos(Date.now()*0.0013+i)*0.2;}
    cx.font='26px sans-serif';cx.textAlign='center';cx.fillStyle='#fff';
    cx.fillText(p.ic,p.x,p.y);
    cx.font='9px sans-serif';cx.fillStyle='#fff176';cx.fillText(p.n,p.x,p.y+14);
    var bw=26;cx.fillStyle='rgba(0,0,0,0.4)';cx.fillRect(p.x-bw/2,p.y-32,bw,3);
    cx.fillStyle=p.hp>70?'#66bb6a':p.hp>40?'#ffa726':'#ef5350';
    cx.fillRect(p.x-bw/2,p.y-32,bw*p.hp/100,3);
    cx.fillStyle='rgba(0,0,0,0.4)';cx.fillRect(p.x-bw/2,p.y-27,bw,2);
    cx.fillStyle='#ab47bc';cx.fillRect(p.x-bw/2,p.y-27,bw*p.hap/100,2);
  }
  if(onD){dp+=0.18;
    for(i=0;i<pets.length;i++){var p2=pets[i];if(p2.left)continue;
      p2.stay+=0.003;
      var t1=p2.tp;var fI='f1';for(var j=0;j<SUP.length;j++){if(SUP[j].tp===t1){fI=SUP[j].id;break;}}
      var fd=G.sup[fI]||0;
      if(fd>0){G.sup[fI]--;p2.hp=Math.min(100,p2.hp+0.1*G.HPmod+p2.boost);p2.hap=Math.min(100,p2.hap+0.05*G.HAPmod);}
      else{p2.hp=Math.max(0,p2.hp-0.2);p2.hap=Math.max(0,p2.hap-0.15);if(p2.hp<30&&!p2.warn){p2.warn=1;lg('⚠️ '+p2.ic+p2.n+' 饥饿！');}}
      if(p2.hp<25&&G.sup.m1>0){G.sup.m1--;p2.hp=Math.min(100,p2.hp+30);lg('💊 '+p2.ic+p2.n+' 接受治疗');}
      if(p2.hp<=0){lg('💔 '+p2.ic+p2.n+' 不幸离世 (声望-5)');G.sc=Math.max(0,G.sc-5);p2.left=true;}
    }
    if(dp>=100)endD();
    if(dp>=130)endD();
  }
}
function endD(){
  if(!onD)return;onD=false;
  G.m-=G.salary;if(G.salary>0)lg('💼 发放工资 -$'+G.salary);
  var up=Math.floor(pets.length*5);G.m-=up;if(up>0)lg('🧹 日常维护 -$'+up);
  if(G.monInc){G.m+=G.monInc;lg('🤝 赞助收入 +$'+G.monInc);}
  var don=Math.floor(G.sc*2+Math.random()*G.sc*5);
  if(don>0){G.m+=don;G.total+=don;lg('❤️ 爱心捐款 +$'+don);}
  G.d++;
  Storage.save('pet_hs',Math.max(Storage.load('pet_hs',0),G.sc*100+G.adopt*500+G.total));
  if(G.d>=60&&G.sc>=70&&G.adopt>=30){endG(true,'传奇救助者');return;}
  if(G.m<-1500){endG(false,'资金耗尽');return;}
  if(G.d>=90){endG(true,'终身成就奖');return;}
  pets=pets.filter(function(p){return!p.left;});
  calc();upd();rnd();
}
function endG(w,t){
  st=STATE_OVER;
  Storage.save('pet_hs',Math.max(Storage.load('pet_hs',0),G.sc*100+G.adopt*500+G.total));
  document.getElementById('et').textContent=w?'🎉 '+t:'💸 '+t;
  document.getElementById('es').innerHTML='经营天数: <b>'+G.d+'</b><br>总领养数: <b style="color:#f06292">'+G.adopt+'</b><br>'
    +'总收入: <b style="color:#ffd54f">$'+G.total+'</b><br>最终声望: <b>⭐'+G.sc+'</b>';
  document.getElementById('se').style.display='flex';
}
var hv=null;
function getCell(e){
  var rc=cv.getBoundingClientRect();var sx=cv.width/rc.width,sy=cv.height/rc.height;
  var x=(e.clientX-rc.left)*sx-20,y=(e.clientY-rc.top)*sy-65;
  var c=Math.floor(x/G.CW),r=Math.floor(y/G.CH);
  if(r<0||r>=G.GR||c<0||c>=G.GC)return null;return{r:r,c:c};
}
cv.addEventListener('mousemove',function(e){hv=getCell(e);});
cv.addEventListener('click',function(e){
  if(st!==STATE_PLAYING)return;var cl=getCell(e);if(!cl)return;
  var rc=cv.getBoundingClientRect();var sx=cv.width/rc.width,sy=cv.height/rc.height;
  var mx=(e.clientX-rc.left)*sx,my=(e.clientY-rc.top)*sy;
  for(var i=pets.length-1;i>=0;i--){var p=pets[i];if(p.left)continue;
    if(Math.abs(mx-p.x)<25&&Math.abs(my-p.y)<25){
      var tI=null;for(var j=0;j<SUP.length;j++)if(SUP[j].tp===p.tp)tI=SUP[j];
      if(tI&&(G.sup[tI.id]||0)>0){G.sup[tI.id]--;p.hp=Math.min(100,p.hp+10);p.hap=Math.min(100,p.hap+15);
        p.boost=0.5;setTimeout(function(pp){pp.boost=0;},2000,p);GameCore.hints.show('🍖 喂食 '+p.ic+p.n);}
      else GameCore.hints.show('没粮了！请采购');
      return;
    }
  }
  if(sel&&cat===0){
    if(G.grid[cl.r][cl.c]){GameCore.hints.show('此处已占用');return;}
    for(i=0;i<BLD.length;i++)if(BLD[i].id===sel)var bd=BLD[i];
    if(G.m<bd.cost){GameCore.hints.show('资金不足');return;}
    G.m-=bd.cost;placeB(cl.r,cl.c,sel);lg('🔨 建造 '+bd.ic+bd.n+' -$'+bd.cost);sel=null;calc();upd();rnd();
  }else if(G.grid[cl.r][cl.c]){
    var id2=G.grid[cl.r][cl.c];
    if(confirm('拆除？(返还50%)')){
      for(i=0;i<BLD.length;i++)if(BLD[i].id===id2)bd=BLD[i];
      G.grid[cl.r][cl.c]=null;G.bld[id2]--;G.m+=Math.floor(bd.cost*0.5);
      lg('♻️ 拆除 '+bd.n+' +$'+Math.floor(bd.cost*0.5));calc();upd();
    }
  }
});
cv.addEventListener('touchstart',function(e){if(e.touches[0]){var t=e.touches[0];hv=getCell(t);}},{passive:true});
document.addEventListener('keydown',function(e){
  if(e.key===' '){e.preventDefault();startD();}
  else if(e.key==='p'||e.key==='P')ps();
});
document.getElementById('btnDay').onclick=startD;
document.getElementById('btnP').onclick=ps;document.getElementById('btnRe').onclick=ps;
document.getElementById('btnRe2').onclick=function(){location.reload();};
document.getElementById('btnRs').onclick=function(){if(confirm('重新开始？'))location.reload();};
document.getElementById('btnAg').onclick=function(){location.reload();};
document.getElementById('btnSv').onclick=function(){Storage.save('pet_save',G);GameCore.hints.show('已保存！');};
function ps(){
  if(st===STATE_PLAYING){st=STATE_PAUSE;document.getElementById('sp').style.display='flex';}
  else if(st===STATE_PAUSE){st=STATE_PLAYING;document.getElementById('sp').style.display='none';}
}
function str(){
  var sv=Storage.load('pet_save',null);if(sv&&confirm('读取存档？')){G=sv;G.GR=8;G.GC=14;G.CW=(W-40)/G.GC;G.CH=(H-80)/G.GR;pets=[];}
  else newG();
  document.getElementById('ss').style.display='none';st=STATE_PLAYING;
  if(tm)clearInterval(tm);tm=setInterval(draw,33);
  calc();upd();rnd();
}
document.getElementById('start-game-btn').addEventListener('click',str);
document.getElementById('hs').textContent=Storage.load('pet_hs',0);
GameCore.init({highScore:'pets'});

  var _origSetInterval = window.setInterval;
