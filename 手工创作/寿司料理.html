<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>寿司料理</title>
<script src="../game_core.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#e8f5e9,#c8e6c9);min-height:100vh;font-family:"Microsoft YaHei","PingFang SC",sans-serif;overflow-x:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#app{max-width:900px;margin:0 auto;padding:10px}
header{text-align:center;padding:16px 8px}
header h1{font-size:28px;color:#2e7d32;text-shadow:2px 2px 0 #fff}
header .stats{display:flex;justify-content:center;gap:16px;margin-top:10px;flex-wrap:wrap}
header .stat{background:#fff;border:2px solid #81c784;border-radius:20px;padding:6px 14px;font-size:13px;color:#2e7d32;font-weight:bold}
#gameArea{position:relative;background:#f1f8e9;border:4px solid #aed581;border-radius:16px;min-height:500px;padding:12px;overflow:hidden}
#sushiCanvas{width:100%;height:420px;display:block;border-radius:12px;background:linear-gradient(180deg,#fffde7 0%,#f0f4c3 100%)}
.order-panel{position:absolute;top:12px;left:12px;background:rgba(255,255,255,0.95);border:2px solid #66bb6a;border-radius:12px;padding:10px;max-width:200px;font-size:12px;z-index:10}
.order-panel h3{color:#388e3c;margin-bottom:6px;font-size:14px;text-align:center}
.order-panel .order-item{padding:6px;margin:4px 0;background:#e8f5e9;border-radius:6px;color:#2e7d32}
.order-panel .order-item.active{background:#c8e6c9;border:1px solid #66bb6a}
.order-panel .timer{text-align:center;color:#e65100;font-weight:bold;margin-top:6px;font-size:14px}
.score-panel{position:absolute;top:12px;right:12px;background:rgba(255,255,255,0.95);border:2px solid #ffa726;border-radius:12px;padding:10px;font-size:12px;z-index:10;min-width:140px}
.score-panel h3{color:#ef6c00;margin-bottom:6px;font-size:14px;text-align:center}
.score-panel .row{display:flex;justify-content:space-between;padding:2px 0;color:#5d4037}
.score-panel .row b{color:#e65100}
.recipe-panel{position:absolute;bottom:12px;left:12px;background:rgba(255,255,255,0.9);border:2px solid #90a4ae;border-radius:12px;padding:8px;font-size:11px;z-index:10;max-width:200px}
.recipe-panel h4{color:#455a64;margin-bottom:4px;font-size:12px;text-align:center}
.recipe-item{padding:3px 5px;margin:2px 0;background:#eceff1;border-radius:4px;color:#37474f;cursor:pointer}
.recipe-item.locked{opacity:0.5;cursor:not-allowed;color:#999}
.recipe-item:hover:not(.locked){background:#cfd8dc}
.controls{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;justify-content:center}
.ing-btn{padding:8px 10px;background:linear-gradient(135deg,#a5d6a7,#81c784);border:none;border-radius:10px;font-size:12px;font-weight:bold;color:#1b5e20;cursor:pointer;box-shadow:0 3px 0 #4caf50;transition:all 0.15s;min-width:70px;font-family:inherit}
.ing-btn:hover{transform:translateY(-2px);box-shadow:0 5px 0 #4caf50}
.ing-btn:active{transform:translateY(1px);box-shadow:0 1px 0 #4caf50}
.ing-btn.disabled{opacity:0.5;pointer-events:none}
.action-btn{padding:8px 14px;background:linear-gradient(135deg,#ffb74d,#ff9800);border:none;border-radius:10px;font-size:13px;font-weight:bold;color:#fff;cursor:pointer;box-shadow:0 3px 0 #e65100;transition:all 0.15s;font-family:inherit}
.action-btn:hover{transform:translateY(-2px);box-shadow:0 5px 0 #e65100}
.action-btn:active{transform:translateY(1px);box-shadow:0 1px 0 #e65100}
.action-btn.serve{background:linear-gradient(135deg,#f06292,#ec407a);box-shadow:0 3px 0 #ad1457}
.action-btn.serve:hover{box-shadow:0 5px 0 #ad1457}
.action-btn.reset{background:linear-gradient(135deg,#90a4ae,#78909c);box-shadow:0 3px 0 #455a64}
.action-btn.reset:hover{box-shadow:0 5px 0 #455a64}
.toast{position:fixed;top:20%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);color:#fff;padding:12px 24px;border-radius:24px;font-size:15px;z-index:1000;pointer-events:none;animation:toastIn 0.3s ease}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-20px)}to{opacity:1;transform:translate(-50%,0)}}
.unlock-popup{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;z-index:500}
.unlock-popup.show{display:flex;animation:fadeIn 0.3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.unlock-card{background:linear-gradient(135deg,#f1f8e9,#dcedc8);border:4px solid #8bc34a;border-radius:20px;padding:30px;text-align:center;max-width:320px;animation:popIn 0.5s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes popIn{from{transform:scale(0)}to{transform:scale(1)}}
.unlock-card h2{color:#558b2f;margin-bottom:10px}
.unlock-card .emoji{font-size:64px;margin:16px 0}
.unlock-card p{color:#33691e;margin-bottom:16px;line-height:1.6}
.unlock-card button{padding:10px 28px;background:linear-gradient(135deg,#ffb74d,#ff9800);border:none;border-radius:20px;font-size:15px;font-weight:bold;color:#fff;cursor:pointer;font-family:inherit}
.start-screen{position:fixed;inset:0;background:linear-gradient(135deg,#e8f5e9,#c8e6c9);z-index:900;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.start-screen h1{font-size:42px;color:#2e7d32;text-shadow:3px 3px 0 #fff;margin-bottom:12px;text-align:center}
.start-screen .desc{color:#388e3c;font-size:16px;text-align:center;max-width:420px;line-height:1.8;margin-bottom:30px}
#start-game-btn{padding:16px 56px;background:linear-gradient(135deg,#66bb6a,#43a047);border:none;border-radius:30px;font-size:20px;font-weight:bold;color:#fff;cursor:pointer;box-shadow:0 6px 0 #1b5e20;transition:all 0.15s;font-family:inherit;letter-spacing:2px}
#start-game-btn:hover{transform:translateY(-3px);box-shadow:0 9px 0 #1b5e20}
#start-game-btn:active{transform:translateY(3px);box-shadow:0 0 0 #1b5e20}
.help-hint{color:#558b2f;font-size:13px;margin-top:24px;text-align:center;line-height:1.8}
.sushi-drop{position:absolute;font-size:32px;pointer-events:none;animation:dropIng 0.4s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes dropIng{from{transform:translateY(-60px) scale(0.3);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
.rolling-anim{animation:roll 0.2s ease-in-out infinite}
@keyframes roll{0%,100%{transform:rotate(0)}50%{transform:rotate(2deg)}}
.perfect-flash{animation:flash 0.3s ease-in-out 3}
@keyframes flash{0%,100%{filter:none}50%{filter:brightness(1.5) drop-shadow(0 0 20px #ffeb3b)}}
.game-over{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:800;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;color:#fff}
.game-over.show{display:flex}
.game-over h2{font-size:36px;color:#ff7043;margin:0}
.game-over .score-big{font-size:48px;color:#ffd54f;font-weight:bold}
.game-over button{padding:14px 40px;background:linear-gradient(135deg,#66bb6a,#43a047);border:none;border-radius:20px;font-size:16px;font-weight:bold;color:#fff;cursor:pointer;font-family:inherit}
@media(max-width:600px){
  header h1{font-size:22px}
  header .stat{font-size:11px;padding:4px 10px}
  .ing-btn{font-size:10px;padding:6px 8px;min-width:54px}
  .action-btn{font-size:11px;padding:6px 10px}
  .order-panel,.score-panel,.recipe-panel{font-size:10px;max-width:120px;padding:6px}
  .order-panel h3,.score-panel h3,.recipe-panel h4{font-size:11px}
  #sushiCanvas{height:300px}
  #gameArea{min-height:400px}
}
/* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */
/* [BATCH-FIX:ad-components-css] */
.sponsor-btn{position:fixed;bottom:8px;left:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:2px 6px;border-radius:10px;font:10px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.sponsor-panel.show{display:flex}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.interstitial-ad.show{display:flex}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* [/BATCH-FIX:ad-components-css] */

/* [AD-FIX:responsive] */
@media (max-width:768px){.ad-banner-container{display:none!important}.sponsor-btn{transform:scale(.8);opacity:.6}}
/* [/AD-FIX:responsive] */
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🍣 寿司料理 🍱</h1>
    <div class="stats">
      <div class="stat">💰 金币: <span id="coinVal">0</span></div>
      <div class="stat">⭐ 等级: <span id="levelVal">1</span></div>
      <div class="stat">🍱 完成: <span id="servedVal">0</span></div>
    </div>
  </header>
  <div id="gameArea">
    <canvas id="sushiCanvas"></canvas>
    <div class="order-panel">
      <h3>📋 当前订单</h3>
      <div id="orderList"></div>
      <div class="timer">⏱️ <span id="timerVal">60</span>s</div>
    </div>
    <div class="score-panel">
      <h3>🎯 进度</h3>
      <div class="row"><span>目标完成:</span><b><span id="targetVal">5</span></b></div>
      <div class="row"><span>已完成:</span><b><span id="doneVal">0</span></b></div>
      <div class="row"><span>连击:</span><b><span id="comboVal">0</span>x</b></div>
    </div>
    <div class="recipe-panel">
      <h4>📖 寿司图鉴</h4>
      <div id="recipeList"></div>
    </div>
  </div>
  <div class="controls" id="controls"></div>
</div>

<div class="start-screen" id="startScreen">
  <h1>🍣 寿司料理大师 🍱</h1>
  <div class="desc">
    欢迎来到寿司料理店！<br>
    根据顾客订单，按顺序选择食材制作寿司。<br>
    快速完成订单获得金币和连击奖励，解锁更多寿司种类！
  </div>
  <button id="start-game-btn">开始营业</button>
  <div class="help-hint">
    🖱️ 鼠标点击选择食材和操作<br>
    📱 触屏点击即可操作<br>
    ⌨️ 1-8选择食材，空格卷寿司，回车出餐，R重制
  </div>
</div>

<div class="unlock-popup" id="unlockPopup">
  <div class="unlock-card">
    <h2>🎉 解锁新寿司！</h2>
    <div class="emoji" id="unlockEmoji">🍣</div>
    <p id="unlockText">你解锁了新配方！</p>
    <button onclick="closeUnlock()">太棒了！</button>
  </div>
</div>

<div class="game-over" id="gameOver">
  <h2 id="overTitle">⏰ 时间到！</h2>
  <div>本局得分</div>
  <div class="score-big" id="finalScore">0</div>
  <div id="overMsg" style="color:#aaa;margin-bottom:10px"></div>
  <button onclick="restartGame()">🔄 再来一局</button>
</div>

<script>
if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
if (typeof STATE_ROLLING === 'undefined') var STATE_ROLLING = 2;
if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 3;

var gameState = STATE_MENU;
var canvas, ctx, cw, ch;
var makingList = [];
var currentOrder = null;
var orders = [];
var timeLeft = 60;
var roundTarget = 5;
var roundDone = 0;
var combo = 0;
var gameTimer = null;
var isRolling = false;

var SUSHI_RECIPES = [
  { id:'salmon_ni', name:'三文鱼握', emoji:'🍣', ingredients:['米饭','三文鱼'], price:15, unlockLv:1, exp:10 },
  { id:'tuna_ni', name:'金枪鱼握', emoji:'🐟', ingredients:['米饭','金枪鱼'], price:18, unlockLv:1, exp:12 },
  { id:'ebi_ni', name:'甜虾握', emoji:'🦐', ingredients:['米饭','甜虾'], price:20, unlockLv:2, exp:15 },
  { id:'tamago_ni', name:'玉子握', emoji:'🥚', ingredients:['米饭','玉子'], price:12, unlockLv:2, exp:10 },
  { id:'kappa_maki', name:'黄瓜卷', emoji:'🥒', ingredients:['海苔','米饭','黄瓜'], price:14, unlockLv:1, exp:12 },
  { id:'tekka_maki', name:'铁火卷', emoji:'🔥', ingredients:['海苔','米饭','金枪鱼'], price:20, unlockLv:3, exp:18 },
  { id:'california', name:'加州卷', emoji:'🥑', ingredients:['海苔','米饭','牛油果','蟹肉'], price:28, unlockLv:4, exp:25 },
  { id:'dragon', name:'龙卷', emoji:'🐉', ingredients:['海苔','米饭','鳗鱼','牛油果'], price:40, unlockLv:5, exp:35 },
  { id:'uni_ni', name:'海胆握', emoji:'🦔', ingredients:['米饭','海胆'], price:50, unlockLv:6, exp:40 },
  { id:'chirashi', name:'散寿司', emoji:'🍱', ingredients:['米饭','三文鱼','金枪鱼','甜虾','玉子'], price:55, unlockLv:7, exp:45 }
];

var INGREDIENTS = [
  { id:'rice', name:'米饭', emoji:'🍚' },
  { id:'nori', name:'海苔', emoji:'🟫' },
  { id:'salmon', name:'三文鱼', emoji:'🍣' },
  { id:'tuna', name:'金枪鱼', emoji:'🐟' },
  { id:'ebi', name:'甜虾', emoji:'🦐' },
  { id:'tamago', name:'玉子', emoji:'🥚' },
  { id:'cucumber', name:'黄瓜', emoji:'🥒' },
  { id:'avocado', name:'牛油果', emoji:'🥑' },
  { id:'crab', name:'蟹肉', emoji:'🦀' },
  { id:'eel', name:'鳗鱼', emoji:'🐍' },
  { id:'uni', name:'海胆', emoji:'🦔' }
];

var playerData = {
  coins: 0,
  level: 1,
  exp: 0,
  servedCount: 0,
  unlockedRecipes: ['salmon_ni','tuna_ni','kappa_maki'],
  highScore: 0
};

function loadSave(){
  var saved = Storage.load('sushi_master_save', null);
  if(saved) playerData = Object.assign(playerData, saved);
}
function saveGame(){ Storage.save('sushi_master_save', playerData); }

function expForLevel(lv){ return lv * 80; }
function checkLevelUp(){
  var leveled = false;
  while(playerData.exp >= expForLevel(playerData.level)){
    playerData.exp -= expForLevel(playerData.level);
    playerData.level++;
    leveled = true;
    checkUnlocks();
  }
  if(leveled) showToast('🎉 升级了！Lv.' + playerData.level);
  updateStats();
}
function checkUnlocks(){
  var newly = [];
  SUSHI_RECIPES.forEach(function(r){
    if(r.unlockLv <= playerData.level && playerData.unlockedRecipes.indexOf(r.id)<0){
      playerData.unlockedRecipes.push(r.id);
      newly.push(r);
    }
  });
  if(newly.length>0) setTimeout(function(){ showUnlock(newly[0]); }, 600);
  saveGame();
  renderRecipes();
}
function showUnlock(r){
  document.getElementById('unlockEmoji').textContent = r.emoji;
  document.getElementById('unlockText').textContent = '【' + r.name + '】售价 ' + r.price + '金币';
  document.getElementById('unlockPopup').classList.add('show');
}
function closeUnlock(){ document.getElementById('unlockPopup').classList.remove('show'); }

function showToast(msg){
  var t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 1800);
}

function updateStats(){
  document.getElementById('coinVal').textContent = playerData.coins;
  document.getElementById('levelVal').textContent = playerData.level + ' (' + playerData.exp + '/' + expForLevel(playerData.level) + ')';
  document.getElementById('servedVal').textContent = playerData.servedCount;
  document.getElementById('targetVal').textContent = roundTarget;
  document.getElementById('doneVal').textContent = roundDone;
  document.getElementById('comboVal').textContent = combo;
}

function renderRecipes(){
  var list = document.getElementById('recipeList');
  list.innerHTML = '';
  SUSHI_RECIPES.forEach(function(r){
    var un = playerData.unlockedRecipes.indexOf(r.id)>=0;
    var d = document.createElement('div');
    d.className = 'recipe-item' + (un?'':' locked');
    d.textContent = r.emoji + ' ' + r.name + (un?'':'🔒');
    list.appendChild(d);
  });
}

function renderControls(){
  var c = document.getElementById('controls');
  c.innerHTML = '';
  INGREDIENTS.forEach(function(ing, idx){
    var btn = document.createElement('button');
    btn.className = 'ing-btn';
    btn.textContent = ing.emoji + ing.name;
    btn.onclick = function(){ addIngredient(ing); };
    c.appendChild(btn);
  });
  var roll = document.createElement('button');
  roll.className = 'action-btn';
  roll.textContent = '🌀 卷制';
  roll.onclick = startRolling;
  c.appendChild(roll);
  var serve = document.createElement('button');
  serve.className = 'action-btn serve';
  serve.textContent = '🍽️ 出餐';
  serve.onclick = serveSushi;
  c.appendChild(serve);
  var reset = document.createElement('button');
  reset.className = 'action-btn reset';
  reset.textContent = '🔄 重做';
  reset.onclick = resetMaking;
  c.appendChild(reset);
}

function newOrder(){
  var available = SUSHI_RECIPES.filter(function(r){ return playerData.unlockedRecipes.indexOf(r.id)>=0; });
  var recipe = available[Math.floor(Math.random()*available.length)];
  var order = {
    id: Date.now() + Math.random(),
    recipe: recipe,
    timeLeft: 30 + recipe.ingredients.length * 5
  };
  return order;
}

function renderOrders(){
  var list = document.getElementById('orderList');
  list.innerHTML = '';
  if(orders.length === 0){
    list.innerHTML = '<div style="text-align:center;color:#888;padding:10px">等待顾客...</div>';
    return;
  }
  orders.forEach(function(o, idx){
    var div = document.createElement('div');
    div.className = 'order-item' + (idx===0 ? ' active' : '');
    div.innerHTML = '<b>' + o.recipe.emoji + ' ' + o.recipe.name + '</b><br>' +
      '<span style="color:#666">💰' + o.recipe.price + ' | ⏱️' + Math.ceil(o.timeLeft) + 's</span><br>' +
      '<span style="font-size:10px">' + o.recipe.ingredients.map(function(n){
        var ing = INGREDIENTS.find(function(x){return x.name===n;});
        return ing?ing.emoji:'?';
      }).join('') + '</span>';
    list.appendChild(div);
  });
}

function addOrder(){
  if(orders.length < 3) orders.push(newOrder());
  renderOrders();
}

function addIngredient(ing){
  if(gameState !== STATE_PLAYING) return;
  if(isRolling) return;
  if(orders.length === 0){ showToast('暂无订单！'); return; }
  if(makingList.length >= 8){ showToast('食材已满！'); return; }
  makingList.push(ing.name);
  spawnDropAnim(ing);
  drawScene();
}

function spawnDropAnim(ing){
  var rect = canvas.getBoundingClientRect();
  var el = document.createElement('div');
  el.className = 'sushi-drop';
  el.textContent = ing.emoji;
  el.style.left = (rect.left + rect.width*0.4 + Math.random()*rect.width*0.2) + 'px';
  el.style.top = (rect.top + rect.height*0.35) + 'px';
  document.body.appendChild(el);
  setTimeout(function(){ el.remove(); }, 1500);
}

function startRolling(){
  if(gameState !== STATE_PLAYING || makingList.length === 0) return;
  if(isRolling) return;
  isRolling = true;
  gameState = STATE_ROLLING;
  canvas.classList.add('rolling-anim');
  var cnt = 0;
  var t = setInterval(function(){
    cnt++;
    if(cnt >= 10){
      clearInterval(t);
      isRolling = false;
      canvas.classList.remove('rolling-anim');
      gameState = STATE_PLAYING;
      showToast('✨ 卷制完成！');
    }
  }, 70);
}

function matchSushi(){
  for(var i=0;i<SUSHI_RECIPES.length;i++){
    var r = SUSHI_RECIPES[i];
    if(r.ingredients.length !== makingList.length) continue;
    var ok = true;
    for(var j=0;j<r.ingredients.length;j++){
      if(r.ingredients[j] !== makingList[j]){ ok = false; break; }
    }
    if(ok) return r;
  }
  return null;
}

function serveSushi(){
  if(gameState !== STATE_PLAYING || makingList.length === 0) return;
  if(orders.length === 0){ showToast('没有订单！'); return; }
  var matched = matchSushi();
  var order = orders[0];
  if(matched && matched.id === order.recipe.id){
    combo++;
    var bonus = Math.min(combo, 10);
    var earned = matched.price + bonus * 2;
    playerData.coins += earned;
    playerData.exp += matched.exp + bonus;
    playerData.servedCount++;
    roundDone++;
    canvas.classList.add('perfect-flash');
    setTimeout(function(){ canvas.classList.remove('perfect-flash'); }, 1000);
    showToast('✅ 完美！+' + earned + '💰 (' + combo + '连击)');
    orders.shift();
  } else {
    combo = 0;
    showToast('❌ 错误！重做吧');
  }
  resetMaking();
  updateStats();
  renderOrders();
  checkLevelUp();
  if(roundDone >= roundTarget){ endRound(true); }
}

function resetMaking(){
  makingList = [];
  isRolling = false;
  gameState = STATE_PLAYING;
  canvas.classList.remove('rolling-anim');
  drawScene();
}

function endRound(won){
  gameState = STATE_OVER;
  if(gameTimer){ clearInterval(gameTimer); gameTimer = null; }
  var score = playerData.coins;
  if(score > playerData.highScore) playerData.highScore = score;
  saveGame();
  document.getElementById('finalScore').textContent = score + '💰';
  document.getElementById('overTitle').textContent = won ? '🎉 完成目标！' : '⏰ 时间到！';
  document.getElementById('overMsg').textContent = '最高记录: ' + playerData.highScore + ' | 已完成: ' + roundDone + '/' + roundTarget;
  document.getElementById('gameOver').classList.add('show');
}

function restartGame(){
  document.getElementById('gameOver').classList.remove('show');
  startNewRound();
}

function startNewRound(){
  orders = [];
  makingList = [];
  roundDone = 0;
  combo = 0;
  timeLeft = 60;
  roundTarget = 3 + playerData.level * 2;
  gameState = STATE_PLAYING;
  updateStats();
  addOrder();
  setTimeout(addOrder, 1000);
  setTimeout(addOrder, 2500);
  if(gameTimer) clearInterval(gameTimer);
  gameTimer = setInterval(function(){
    timeLeft -= 0.5;
    document.getElementById('timerVal').textContent = Math.ceil(timeLeft);
    var allExpired = true;
    orders.forEach(function(o){ o.timeLeft -= 0.5; if(o.timeLeft>0) allExpired = false; });
    orders = orders.filter(function(o){
      if(o.timeLeft <= 0){ combo = 0; showToast('😡 订单超时！'); return false; }
      return true;
    });
    renderOrders();
    if(orders.length < 3 && Math.random() < 0.04) addOrder();
    if(timeLeft <= 0) endRound(false);
    updateStats();
  }, 500);
}

function drawScene(){
  ctx.clearRect(0,0,cw,ch);
  // 寿司台背景
  ctx.fillStyle = '#8d6e63';
  ctx.fillRect(0, ch*0.75, cw, ch*0.25);
  ctx.fillStyle = '#a1887f';
  for(var i=0;i<8;i++){
    ctx.fillRect(i*cw/8 + 2, ch*0.76, cw/8-4, 4);
  }
  // 制作区 - 竹帘
  var matX = cw*0.25, matY = ch*0.25, matW = cw*0.5, matH = ch*0.4;
  ctx.fillStyle = '#ffcc80';
  ctx.fillRect(matX, matY, matW, matH);
  ctx.strokeStyle = '#ffb74d';
  ctx.lineWidth = 1;
  for(var y=0;y<20;y++){
    ctx.beginPath();
    ctx.moveTo(matX, matY + y*matH/20);
    ctx.lineTo(matX+matW, matY + y*matH/20);
    ctx.stroke();
  }
  ctx.strokeStyle = '#e65100';
  ctx.lineWidth = 4;
  ctx.strokeRect(matX, matY, matW, matH);
  // 已放食材
  for(var i=0;i<makingList.length;i++){
    var ingName = makingList[i];
    var ing = INGREDIENTS.find(function(x){return x.name===ingName;});
    var x = matX + 30 + (i%4) * (matW-60)/4;
    var y = matY + 30 + Math.floor(i/4) * (matH-60)/2;
    if(ing){
      ctx.font = '40px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(ing.emoji, x + (matW-60)/8, y + 30);
    }
  }
  // 成品盘
  var plateX = cw*0.82, plateY = ch*0.4, plateR = cw*0.1;
  ctx.beginPath();
  ctx.arc(plateX, plateY, plateR, 0, Math.PI*2);
  ctx.fillStyle = '#eceff1';
  ctx.fill();
  ctx.strokeStyle = '#90a4ae';
  ctx.lineWidth = 3;
  ctx.stroke();
  var made = matchSushi();
  if(made){
    ctx.font = '50px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(made.emoji, plateX, plateY + 15);
  }
  // 提示
  if(makingList.length>0){
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(cw*0.25, ch*0.05, cw*0.5, 36);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('制作中: ' + makingList.map(function(n){
      var ig = INGREDIENTS.find(function(x){return x.name===n;});
      return ig?ig.emoji:'?';
    }).join(' → '), cw/2, ch*0.05 + 24);
  }
}

function initCanvas(){
  canvas = document.getElementById('sushiCanvas');
  ctx = canvas.getContext('2d');
  function resize(){
    var r = canvas.getBoundingClientRect();
    canvas.width = r.width*(window.devicePixelRatio||1);
    canvas.height = r.height*(window.devicePixelRatio||1);
    cw = canvas.width; ch = canvas.height;
    ctx.scale(window.devicePixelRatio||1, window.devicePixelRatio||1);
    cw = r.width; ch = r.height;
    drawScene();
  }
  resize();
  window.addEventListener('resize', resize);
}

function handleKeyboard(e){
  if(gameState === STATE_MENU || gameState === STATE_OVER) return;
  var n = parseInt(e.key);
  if(n>=1 && n<=9 && INGREDIENTS[n-1]){
    addIngredient(INGREDIENTS[n-1]);
  } else if(e.key === ' '){
    e.preventDefault();
    startRolling();
  } else if(e.key === 'Enter'){
    serveSushi();
  } else if(e.key === 'r' || e.key === 'R'){
    resetMaking();
  }
}

function initGame(){
  loadSave();
  renderRecipes();
  renderControls();
  initCanvas();
  checkUnlocks();
  updateStats();
  document.addEventListener('keydown', handleKeyboard);
}

document.getElementById('start-game-btn').addEventListener('click', function(){
  document.getElementById('startScreen').style.display = 'none';
  gameState = STATE_PLAYING;
  initGame();
  startNewRound();
});

GameCore.init({ touch:false, loading:false });
</script>

<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>

  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);

})();

<script>
(function(){
  if (window.__batchPauseFix) return;
  window.__batchPauseFix = true;
  var _paused = false;
  var _overlay = document.createElement('div');
  _overlay.id = 'batchPauseOverlay';
  _overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:9999;display:none;align-items:center;justify-content:center;color:#fff;font:bold 32px sans-serif;cursor:pointer';
  _overlay.textContent = 'PAUSED (click to resume)';
  _overlay.addEventListener('click', function(){ togglePause(); });
  document.body.appendChild(_overlay);
  window.togglePause = function() {
    _paused = !_paused;
    _overlay.style.display = _paused ? 'flex' : 'none';
  };
  window.isPaused = function() { return _paused; };
  document.addEventListener('keydown', function(e) {
    if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
      e.preventDefault();
      togglePause();
    }
  });
  var _origRAF = window.requestAnimationFrame || function(cb){return setTimeout(cb,16)};
  window.requestAnimationFrame = function(cb) {
    return _origRAF.call(window, function(ts) {
      if (!_paused) cb(ts);
      else window.requestAnimationFrame(cb);
    });
  };
})();
</script>
