<canvas id="c"></canvas>

<script>
if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;

if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;

<script src="../game_core.js"></script>
<script>
(function(){
"use strict";

const W=480,H=800;
const GAME_TIME=60;

const CONES=[
    {id:0,name:'脆皮蛋筒',emoji:'🍦',color:'#d4a574'},
    {id:1,name:'纸杯',emoji:'🥤',color:'#ff9800'}
];

const FLAVORS=[
    {id:0,name:'草莓',color:'#ff6b8a',emoji:'🍓'},
    {id:1,name:'香草',color:'#fff8e1',emoji:'🌿'},
    {id:2,name:'巧克力',color:'#6d4c41',emoji:'🍫'},
    {id:3,name:'抹茶',color:'#8bc34a',emoji:'🍵'},
    {id:4,name:'芒果',color:'#ffc107',emoji:'🥭'},
    {id:5,name:'蓝莓',color:'#5c6bc0',emoji:'🫐'},
    {id:6,name:'酸奶',color:'#e1f5fe',emoji:'🥛'},
    {id:7,name:'榴莲',color:'#c0ca33',emoji:'🤎'}
];

const TOPPINGS=[
    {id:0,name:'巧克力酱',color:'#5d4037',emoji:'🍫'},
    {id:1,name:'糖屑',color:'#ff4081',emoji:'✨'},
    {id:2,name:'坚果',color:'#8d6e63',emoji:'🥜'},
    {id:3,name:'樱桃',color:'#d32f2f',emoji:'🍒'}
];

const CUSTOMER_NAMES=['小明','小红','阿花','大壮','小美','阿强','甜甜','乐乐','豆豆','糖糖','圆圆','星星'];
const CUSTOMER_EMOJIS=['👦','👧','👨','👩','🧑','👴','👵','🧒','👱','👸'];

let audioCtx=null;
function initAudio(){
    if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
}
function playTone(freq,dur,type,vol){
    if(!audioCtx)return;
    try{
        const o=audioCtx.createOscillator();
        const g=audioCtx.createGain();
        o.type=type||'sine';
        o.frequency.value=freq;
        g.gain.value=vol||0.15;
        g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
        o.connect(g);g.connect(audioCtx.destination);
        o.start();o.stop(audioCtx.currentTime+dur);
    }catch(e){}
}
function sfxClick(){playTone(660,0.05,'sine',0.1)}
function sfxScoop(){playTone(440,0.08,'triangle',0.12)}
function sfxCoin(){playTone(880,0.08,'sine',0.15);setTimeout(()=>playTone(1175,0.1,'sine',0.15),70)}
function sfxError(){playTone(200,0.18,'sawtooth',0.18)}
function sfxBell(){playTone(784,0.1,'sine',0.15);setTimeout(()=>playTone(988,0.1,'sine',0.15),90);setTimeout(()=>playTone(1319,0.2,'sine',0.15),190)}
function sfxBuzzer(){playTone(150,0.5,'sawtooth',0.2)}
function sfxCombo(){for(let i=0;i<3;i++)setTimeout(()=>playTone(523+i*175,0.1,'square',0.14),i*80)}

let particles=[];
function spawnParticles(x,y,color,count){
    if(!count)count=10;
    for(let i=0;i<count;i++){
        particles.push({
            x:x,y:y,
            vx:(Math.random()-0.5)*6,
            vy:(Math.random()-0.5)*6-2,
            life:25+Math.floor(Math.random()*20),
            maxLife:45,
            size:2+Math.random()*3,
            color:color
        });
    }
}
function updateParticles(){
    for(let i=particles.length-1;i>=0;i--){
        const p=particles[i];
        p.x+=p.vx;p.y+=p.vy;
        p.vy+=0.22;p.vx*=0.99;
        p.life--;
        if(p.life<=0)particles.splice(i,1);
    }
}
function drawParticles(ctx){
    for(const p of particles){
        ctx.globalAlpha=Math.max(0,p.life/p.maxLife);
        ctx.fillStyle=p.color;
        ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
}
let floatings=[];
function addFloating(x,y,text,color,big){
    floatings.push({x:x,y:y,text:text,color:color||'#ffd700',life:55,maxLife:55,big:big||false});
}
function updateFloatings(){
    for(let i=floatings.length-1;i>=0;i--){
        const f=floatings[i];
        f.y-=1.0;f.life--;
        if(f.life<=0)floatings.splice(i,1);
    }
}
function drawFloatings(ctx){
    for(const f of floatings){
        ctx.globalAlpha=Math.min(1,f.life/27);
        ctx.fillStyle=f.color;
        ctx.font='bold '+(f.big?28:18)+'px "Microsoft YaHei"';
        ctx.textAlign='center';
        ctx.fillText(f.text,f.x,f.y);
        ctx.textAlign='left';
    }
    ctx.globalAlpha=1;
}
const ICE_ACHIEVEMENTS=[
    {id:'first_sale',name:'开张大吉',desc:'卖出第一份冰淇淋',unlocked:false,icon:'🍦'},
    {id:'combo_5',name:'连五暴击',desc:'达成完美5连击',unlocked:false,icon:'🔥'},
    {id:'combo_10',name:'冰淇淋大师',desc:'达成完美10连击',unlocked:false,icon:'👑'},
    {id:'serve_10',name:'小本经营',desc:'单局服务10位顾客',unlocked:false,icon:'👥'},
    {id:'coin_500',name:'日进斗金',desc:'单局赚500金币',unlocked:false,icon:'💰'},
    {id:'no_leave',name:'宾至如归',desc:'单局无顾客离开',unlocked:false,icon:'😊'},
    {id:'perfect_80',name:'匠心手作',desc:'完美率达到80%',unlocked:false,icon:'💎'},
    {id:'vip_sale',name:'贵客临门',desc:'服务VIP顾客（随机概率）',unlocked:false,icon:'👑'}
];
let iceLeftCount=0;
let achievementPopups=[];
function unlockIceAch(id){
    const a=ICE_ACHIEVEMENTS.find(x=>x.id===id);
    if(!a||a.unlocked)return;
    a.unlocked=true;
    achievementPopups.push({a:a,life:150,y:-50});
    for(let i=0;i<18;i++)setTimeout(()=>playTone(650+i*60,0.06,'sine',0.12),i*40);
    spawnParticles(W/2,200,'#ffd700',25);
}
function updateIceAch(){
    for(let i=achievementPopups.length-1;i>=0;i--){
        const p=achievementPopups[i];
        p.life--;
        if(p.y<40)p.y+=1.2;
        if(p.life<30)p.y-=1.5;
        if(p.life<=0)achievementPopups.splice(i,1);
    }
}
function drawIceAch(ctx){
    for(const p of achievementPopups){
        ctx.save();
        ctx.translate(W/2,p.y);
        ctx.globalAlpha=Math.min(1,p.life/60);
        ctx.fillStyle='rgba(0,0,0,0.82)';
        roundRect(ctx,-140,-22,280,48,12);ctx.fill();
        ctx.strokeStyle='#e91e63';ctx.lineWidth=2;
        roundRect(ctx,-140,-22,280,48,12);ctx.stroke();
        ctx.font='26px Arial';ctx.textAlign='left';
        ctx.fillText(p.a.icon,-128,8);
        ctx.fillStyle='#ff80ab';
        ctx.font='bold 15px "Microsoft YaHei"';
        ctx.fillText('🏅 成就解锁: '+p.a.name,-92,-2);
        ctx.fillStyle='#ddd';
        ctx.font='12px "Microsoft YaHei"';
        ctx.fillText(p.a.desc,-92,14);
        ctx.restore();
    }
    ctx.globalAlpha=1;
}
let iceMilestones={vals:[100,250,500,800,1200,1800,2500],last:-1};
function checkIceMilestones(cur){
    for(let i=iceMilestones.last+1;i<iceMilestones.vals.length;i++){
        if(cur>=iceMilestones.vals[i]){
            iceMilestones.last=i;
            addFloating(W/2,135,'🎯 累计 '+iceMilestones.vals[i]+'金币!','#ffd700',true);
            spawnParticles(W/2,150,'#ffd700',20);
            break;
        }
    }
}
function shadeHex(hex,pct){
    const n=parseInt(hex.slice(1),16);
    let r=(n>>16)&0xff,g=(n>>8)&0xff,b=n&0xff;
    r=Math.max(0,Math.min(255,Math.floor(r*(1+pct))));
    g=Math.max(0,Math.min(255,Math.floor(g*(1+pct))));
    b=Math.max(0,Math.min(255,Math.floor(b*(1+pct))));
    return'#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
}

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let scale=1;
function resize(){
    const r=W/H;
    let cw=window.innerWidth,ch=window.innerHeight;
    if(cw/ch>r){ch=cw/r}else{cw=ch*r}
    canvas.width=cw;canvas.height=ch;
    scale=cw/W;
    ctx.setTransform(scale,0,0,scale,0,0);
}
window.addEventListener('resize',resize);
resize();

function Customer(){
    this.id=Math.random();
    this.name=CUSTOMER_NAMES[Math.floor(Math.random()*CUSTOMER_NAMES.length)];
    this.emoji=CUSTOMER_EMOJIS[Math.floor(Math.random()*CUSTOMER_EMOJIS.length)];
    this.waitTime=0;
    this.maxWait=900+Math.floor(Math.random()*300);
    this.order=this.makeOrder();
    this.mood=0;
    this.isVIP=Math.random()<0.1;
}
Customer.prototype.makeOrder=function(){
    const cone=Math.floor(Math.random()*2);
    const scoops=1+Math.floor(Math.random()*3);
    const flavors=[];
    for(let i=0;i<scoops;i++)flavors.push(Math.floor(Math.random()*FLAVORS.length));
    const topping=Math.random()<0.6?Math.floor(Math.random()*TOPPINGS.length):-1;
    let base=30+scoops*15+(topping>=0?10:0);
    if(this.isVIP)base=Math.floor(base*1.5);
    return{cone:cone,flavors:flavors,topping:topping,price:base};
};
Customer.prototype.getMoodText=function(){
    const r=this.waitTime/this.maxWait;
    if(r<0.4)return'😊';
    if(r<0.7)return'😐';
    if(r<0.9)return'😠';
    return'🤬';
};

function CurrentIce(){
    this.cone=-1;
    this.scoops=[];
    this.topping=-1;
}
CurrentIce.prototype.addScoop=function(f){
    if(this.scoops.length<3){this.scoops.push(f);return true}
    return false;
};
CurrentIce.prototype.reset=function(){
    this.cone=-1;this.scoops=[];this.topping=-1;
};
CurrentIce.prototype.complete=function(){
    return this.cone>=0&&this.scoops.length>0;
};
CurrentIce.prototype.compareTo=function(order){
    if(this.cone!==order.cone)return-1;
    if(this.scoops.length!==order.flavors.length)return-1;
    let wrong=0;
    for(let i=0;i<this.scoops.length;i++){
        if(this.scoops[i]!==order.flavors[i])wrong++;
    }
    if(this.topping!==order.topping)wrong++;
    return wrong;
};

const G={
    state:STATE_MENU,
    coins:0,
    highScore:0,
    timeLeft:GAME_TIME*60,
    customers:[],
    selectedCust:0,
    nextSpawn:0,
    current:new CurrentIce(),
    served:0,
    perfect:0,
    combo:0,
    maxCombo:0,
    btnRects:{},
    keys:{},
    paused:false,
    scorePopups:[],
    activeBtn:null
};

G.highScore=parseInt(Storage.load('icecream_high','0'));

function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
}

function drawBtn(ctx,x,y,w,h,text,name,color,active){
    G.btnRects[name]={x:x,y:y,w:w,h:h};
    ctx.fillStyle=color||'#e91e63';
    ctx.strokeStyle=active?'#ffd700':'#fff';
    ctx.lineWidth=active?3:2;
    roundRect(ctx,x,y,w,h,10);
    ctx.fill();ctx.stroke();
    ctx.fillStyle='#fff';
    ctx.font='bold 15px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(text,x+w/2,y+h/2);
    ctx.textBaseline='alphabetic';
}

function hitBtn(p,name){
    const r=G.btnRects[name];
    return r && p.x>=r.x && p.x<=r.x+r.w && p.y>=r.y && p.y<=r.y+r.h;
}

function getPos(e){
    const rect=canvas.getBoundingClientRect();
    const t=e.touches?e.touches[0]:e;
    return{x:(t.clientX-rect.left)/scale,y:(t.clientY-rect.top)/scale};
}

function getCustomerArea(i){
    const topY=115;
    const w=(W-40)/4-5;
    const h=140;
    const x=20+i*(w+5);
    return{x:x,y:topY,w:w,h:h};
}

function getConeBtns(){
    const y=H-580;
    return[{x:20,y:y,w:220,h:50},{x:240,y:y,w:220,h:50}];
}
function getFlavorBtns(){
    const y=H-515;
    const w=(W-40)/4-5;
    const rows=[];
    for(let r=0;r<2;r++){
        for(let c=0;c<4;c++){
            rows.push({x:20+c*(w+5),y:y+r*55,w:w,h:50});
        }
    }
    return rows;
}
function getToppingBtns(){
    const y=H-395;
    const w=(W-40)/4-5;
    const arr=[];
    for(let i=0;i<4;i++)arr.push({x:20+i*(w+5),y:y,w:w,h:50});
    return arr;
}
function getActionBtns(){
    return{
        serve:{x:20,y:H-325,w:220,h:55},
        clear:{x:240,y:H-325,w:220,h:55}
    };
}
function getPreviewArea(){
    return{x:W/2-70,y:H-290,w:140,h:200};
}

window.addEventListener('keydown',function(e){
    G.keys[e.key.toLowerCase()]=true;
    if(e.key===' '||e.key==='Enter'){
        e.preventDefault();
        if(G.state===STATE_MENU||G.state===STATE_OVER){startGame();return}
    }
    if(e.key==='Escape'){e.preventDefault();if(G.state===STATE_PLAYING)togglePause()}
    if(G.state===STATE_PLAYING&&!G.paused){
        if(e.key==='q'||e.key==='Q'){G.current.cone=0;sfxClick()}
        if(e.key==='w'||e.key==='W'){G.current.cone=1;sfxClick()}
        const fnum=parseInt(e.key);
        if(fnum>=1&&fnum<=8){G.current.addScoop(fnum-1);sfxScoop()}
        if(e.key==='z'||e.key==='Z'){G.current.topping=0;sfxClick()}
        if(e.key==='x'||e.key==='X'){G.current.topping=1;sfxClick()}
        if(e.key==='c'||e.key==='C'){G.current.topping=2;sfxClick()}
        if(e.key==='v'||e.key==='V'){G.current.topping=3;sfxClick()}
        if(e.key==='Backspace'){G.current.reset();sfxClick()}
        if(e.key==='Enter'){tryServe()}
        if(e.key==='Tab'){e.preventDefault();G.selectedCust=(G.selectedCust+1)%Math.max(1,G.customers.length)}
    }
    initAudio();
});
window.addEventListener('keyup',function(e){
    G.keys[e.key.toLowerCase()]=false;
});

function tryServe(){
    if(G.customers.length===0)return;
    const cust=G.customers[G.selectedCust];
    if(!cust||!G.current.complete()){sfxError();return}
    const cmp=G.current.compareTo(cust.order);
    let earn=0;
    if(cmp===0){
        G.combo++;
        G.maxCombo=Math.max(G.maxCombo,G.combo);
        G.perfect++;
        if(G.combo===5)unlockIceAch('combo_5');
        if(G.combo===10)unlockIceAch('combo_10');
        let bonus=1;
        if(G.combo>=3){bonus=1.5;sfxCombo()}
        earn=Math.floor(cust.order.price*bonus);
        if(cust.isVIP){earn*=2;unlockIceAch('vip_sale')}
        sfxCoin();
        G.scorePopups.push({x:W/2,y:H-350,text:(cust.isVIP?'VIP 完美!':'完美! ')+' +'+earn,color:cust.isVIP?'#9c27b0':'#4caf50',life:60});
        addFloating(W/2,H-360,'+'+earn,cust.isVIP?'#9c27b0':'#4caf50',cust.isVIP);
        spawnParticles(W/2,H-340,cust.isVIP?'#9c27b0':'#4caf50',15);
    }else if(cmp===1){
        G.combo=0;
        earn=Math.floor(cust.order.price*0.5);
        sfxCoin();
        G.scorePopups.push({x:W/2,y:H-350,text:'一般 +'+earn,color:'#ff9800',life:60});
        addFloating(W/2,H-360,'+'+earn,'#ff9800');
    }else{
        G.combo=0;
        earn=-20;
        sfxError();
        G.scorePopups.push({x:W/2,y:H-350,text:'错了! '+earn,color:'#f44336',life:60});
        addFloating(W/2,H-360,'-20','#f44336');
        spawnParticles(W/2,H-340,'#f44336',10);
    }
    G.coins+=earn;
    G.served++;
    if(G.served===1)unlockIceAch('first_sale');
    if(G.served===10)unlockIceAch('serve_10');
    if(G.coins>=500)unlockIceAch('coin_500');
    if(G.served>0&&G.perfect/G.served>=0.8)unlockIceAch('perfect_80');
    checkIceMilestones(G.coins);
    G.customers.splice(G.selectedCust,1);
    if(G.selectedCust>=G.customers.length)G.selectedCust=Math.max(0,G.customers.length-1);
    G.current.reset();
}

function handlePointerDown(e){
    initAudio();
    const p=getPos(e);
    if(G.state===STATE_MENU){
        if(hitBtn(p,'start')){startGame();return}
    }else if(G.state===STATE_PAUSE){
        if(hitBtn(p,'resume')){togglePause();return}
        if(hitBtn(p,'quit')){G.state=STATE_MENU;G.paused=false;sfxClick();return}
    }else if(G.state===STATE_OVER){
        if(hitBtn(p,'restart')){startGame();return}
        if(hitBtn(p,'menu')){G.state=STATE_MENU;sfxClick();return}
    }else if(G.state===STATE_PLAYING&&!G.paused){
        for(let i=0;i<G.customers.length;i++){
            const a=getCustomerArea(i);
            if(p.x>=a.x&&p.x<=a.x+a.w&&p.y>=a.y&&p.y<=a.y+a.h){G.selectedCust=i;sfxClick();return}
        }
        const cb=getConeBtns();
        for(let i=0;i<cb.length;i++){
            if(p.x>=cb[i].x&&p.x<=cb[i].x+cb[i].w&&p.y>=cb[i].y&&p.y<=cb[i].y+cb[i].h){G.current.cone=i;sfxClick();return}
        }
        const fb=getFlavorBtns();
        for(let i=0;i<fb.length;i++){
            if(p.x>=fb[i].x&&p.x<=fb[i].x+fb[i].w&&p.y>=fb[i].y&&p.y<=fb[i].y+fb[i].h){G.current.addScoop(i);sfxScoop();return}
        }
        const tb=getToppingBtns();
        for(let i=0;i<tb.length;i++){
            if(p.x>=tb[i].x&&p.x<=tb[i].x+tb[i].w&&p.y>=tb[i].y&&p.y<=tb[i].y+tb[i].h){G.current.topping=i;sfxClick();return}
        }
        const ab=getActionBtns();
        if(p.x>=ab.serve.x&&p.x<=ab.serve.x+ab.serve.w&&p.y>=ab.serve.y&&p.y<=ab.serve.y+ab.serve.h){tryServe();return}
        if(p.x>=ab.clear.x&&p.x<=ab.clear.x+ab.clear.w&&p.y>=ab.clear.y&&p.y<=ab.clear.y+ab.clear.h){G.current.reset();sfxClick();return}
    }
}

function startGame(){
    initAudio();
    G.state=STATE_PLAYING;
    G.coins=0;
    G.timeLeft=GAME_TIME*60;
    G.customers=[];
    G.selectedCust=0;
    G.nextSpawn=60;
    G.current=new CurrentIce();
    G.served=0;
    G.perfect=0;
    G.combo=0;
    G.maxCombo=0;
    G.scorePopups=[];
    G.paused=false;
    particles=[];floatings=[];achievementPopups=[];
    iceLeftCount=0;
    iceMilestones.last=-1;
    for(let i=0;i<ICE_ACHIEVEMENTS.length;i++)ICE_ACHIEVEMENTS[i].unlocked=false;
    sfxBell();
}

function endGame(){
    G.state=STATE_OVER;
    if(iceLeftCount===0)unlockIceAch('no_leave');
    if(G.coins>G.highScore){
        G.highScore=G.coins;
        Storage.save('icecream_high',G.highScore);
    }
    sfxBuzzer();
}

function togglePause(){
    G.paused=!G.paused;
    if(G.paused)G.state=STATE_PAUSE;
    else G.state=STATE_PLAYING;
    sfxClick();
}

function update(){
    if(G.state!==STATE_PLAYING||G.paused)return;
    G.timeLeft--;
    if(G.timeLeft<=0){endGame();return}
    G.nextSpawn--;
    if(G.nextSpawn<=0&&G.customers.length<4){
        G.customers.push(new Customer());
        G.nextSpawn=180+Math.floor(Math.random()*180);
        sfxBell();
    }
    for(let i=G.customers.length-1;i>=0;i--){
        const c=G.customers[i];
        c.waitTime++;
        if(c.waitTime>=c.maxWait){
            G.coins-=50;
            G.combo=0;
            iceLeftCount++;
            G.scorePopups.push({x:W/2,y:260,text:'顾客走了! -50',color:'#f44336',life:70});
            addFloating(W/2,270,'顾客走了! -50','#f44336');
            spawnParticles(W/2,260,'#f44336',18);
            G.customers.splice(i,1);
            if(G.selectedCust>=G.customers.length)G.selectedCust=Math.max(0,G.customers.length-1);
            sfxError();
        }
    }
    for(let i=G.scorePopups.length-1;i>=0;i--){
        const s=G.scorePopups[i];
        s.y-=1.2;s.life--;
        if(s.life<=0)G.scorePopups.splice(i,1);
    }
    updateParticles();updateFloatings();updateIceAch();
}

    ctx.fillRect(0,0,W,H);

        ctx.beginPath();ctx.arc(x,y,12+(i%3)*4,0,Math.PI*2);ctx.fill();
    }
}

function drawPreview(ctx){
    const a=getPreviewArea();
    ctx.fillStyle='rgba(255,255,255,0.7)';
    roundRect(ctx,a.x-5,a.y-5,a.w+10,a.h+10,12);ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.1)';
    roundRect(ctx,a.x-5,a.y-5,a.w+10,a.h+10,12);ctx.stroke();
    const cx=a.x+a.w/2,cy=a.y+a.h-15;
    if(G.current.cone<0){
        ctx.fillStyle='#aaa';
        ctx.font='13px "Microsoft YaHei"';
        ctx.textAlign='center';
        ctx.fillText('请先选择容器',cx,a.y+a.h/2);
        ctx.textAlign='left';
        return;
    }
    const cone=CONES[G.current.cone];
    const scoops=G.current.scoops;
    if(G.current.cone===0){
        ctx.fillStyle=cone.color;
        ctx.beginPath();
        ctx.moveTo(cx-30,cy-20);
        ctx.lineTo(cx+30,cy-20);
        ctx.lineTo(cx,cy+40);
        ctx.closePath();ctx.fill();
        ctx.strokeStyle='#8d6e63';ctx.lineWidth=1.5;ctx.stroke();
        ctx.strokeStyle='rgba(0,0,0,0.15)';
        for(let i=0;i<5;i++){
            const yy=cy-15+i*12;
            ctx.beginPath();
            ctx.moveTo(cx-28+i*3,yy);
            ctx.lineTo(cx+28-i*3,yy);
            ctx.stroke();
        }
    }else{
        ctx.fillStyle=cone.color;
        roundRect(ctx,cx-30,cy-20,60,60,6);ctx.fill();
        ctx.strokeStyle='#e65100';ctx.lineWidth=1.5;
        roundRect(ctx,cx-30,cy-20,60,60,6);ctx.stroke();
        ctx.fillStyle='#fff';
        ctx.fillRect(cx-30,cy-20,60,8);
    }
    const baseY=cy-30;
    for(let i=0;i<3;i++){
        if(i<scoops.length){
            const f=FLAVORS[scoops[i]];
            const sy=baseY-i*28;
            ctx.fillStyle=f.color;
            ctx.beginPath();ctx.arc(cx,sy,22,0,Math.PI*2);ctx.fill();
            ctx.strokeStyle='rgba(0,0,0,0.15)';ctx.lineWidth=1.5;ctx.stroke();
        }else{
            const sy=baseY-i*28;
            ctx.strokeStyle='rgba(0,0,0,0.1)';
            ctx.setLineDash([4,4]);ctx.lineWidth=1.5;
            ctx.beginPath();ctx.arc(cx,sy,22,0,Math.PI*2);ctx.stroke();
            ctx.setLineDash([]);
        }
    }
    if(G.current.topping>=0&&scoops.length>0){
        const t=TOPPINGS[G.current.topping];
        const ty=baseY-(scoops.length-1)*28;
        ctx.fillStyle=t.color;
        for(let i=0;i<8;i++){
            const ang=Math.PI*2*i/8;
            const rr=12+Math.random()*5;
            ctx.beginPath();
            ctx.arc(cx+Math.cos(ang)*rr,ty+Math.sin(ang)*rr-10,2.5,0,Math.PI*2);
            ctx.fill();
        }
    }
    ctx.fillStyle='#e91e63';
    ctx.font='bold 13px "Microsoft YaHei"';
    ctx.textAlign='center';
    ctx.fillText('当前作品',cx,a.y+12);
    ctx.textAlign='left';
}

    ctx.textAlign='center';
    ctx.fillText(isNew?'🏆 新纪录!':'收摊啦!',W/2,130);
    ctx.fillStyle='#fff';
    ctx.font='bold 22px "Microsoft YaHei"';
    ctx.fillText('今日收入',W/2,200);
    ctx.fillStyle='#ffd700';
    ctx.font='bold 78px Arial';
    ctx.fillText('💰'+G.coins,W/2,285);
    const perfectRate=G.served>0?Math.floor(G.perfect/G.served*100):0;
    let grade='C',gColor='#9e9e9e';
    if(G.coins>=800&&perfectRate>=70){grade='S';gColor='#ffd700'}
    else if(G.coins>=500&&perfectRate>=55){grade='A';gColor='#4caf50'}
    else if(G.coins>=300){grade='B';gColor='#2196f3'}
    ctx.font='bold 38px Arial';
    ctx.fillStyle=gColor;
    ctx.fillText('评级: '+grade,W/2,332);
    const unlockedNow=ICE_ACHIEVEMENTS.filter(a=>a.unlocked).length;
    if(unlockedNow>0){
        ctx.fillStyle='#ffeb3b';
        ctx.font='bold 15px "Microsoft YaHei"';
        ctx.fillText('🏅 本局解锁成就: '+unlockedNow+'/'+ICE_ACHIEVEMENTS.length,W/2,365);
    }
    ctx.fillStyle='#fce4ec';
    ctx.font='16px "Microsoft YaHei"';
    ctx.fillText('服务顾客: '+G.served+' 人   完美订单: '+G.perfect,W/2,400);
    ctx.fillText('最高连击: '+G.maxCombo+'   完美率: '+perfectRate+'%   离开: '+iceLeftCount,W/2,425);
    ctx.fillStyle='#ffd700';
    ctx.font='bold 20px "Microsoft YaHei"';
    ctx.fillText('历史最高: 💰'+G.highScore,W/2,468);
    const ua=ICE_ACHIEVEMENTS.filter(x=>x.unlocked);
    if(ua.length>0){
        ctx.fillStyle='rgba(0,0,0,0.3)';
        roundRect(ctx,20,495,W-40,52,8);ctx.fill();
        ctx.fillStyle='#ffd700';
        ctx.font='bold 12px "Microsoft YaHei"';
        ctx.textAlign='left';
        ctx.fillText('🏅 本局解锁:',30,515);
        for(let i=0;i<Math.min(4,ua.length);i++){
            ctx.font='16px Arial';
            ctx.fillStyle='#ffd700';
            ctx.fillText(ua[i].icon,30+i*112,537);
            ctx.font='bold 10px "Microsoft YaHei"';
            ctx.fillStyle='#fff';
            ctx.fillText(ua[i].name,52+i*112,537);
        }
        ctx.textAlign='center';
    }
    drawBtn(ctx,W/2-90,560,180,55,'再卖一天','restart','#e91e63');
    drawBtn(ctx,W/2-70,630,140,45,'返回菜单','menu','#ad1457');
    ctx.textAlign='left';
}

function draw(){
    switch(G.state){
        case STATE_MENU: drawMenu(ctx); break;
        case STATE_PLAYING: drawGame(ctx); break;
        case STATE_PAUSE: drawGame(ctx); break;
        case STATE_OVER: drawGameOver(ctx); break;
    }
}

let loopId;
function gameLoop(){
    loopId=requestAnimationFrame(gameLoop);
    update();
    draw();
}
gameLoop();

})();
</script>

<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>

<script>

  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
