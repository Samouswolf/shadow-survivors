<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>美甲工作室</title>
<script src="../game_core.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#fce4ec,#f8bbd9);min-height:100vh;font-family:"Microsoft YaHei","PingFang SC",sans-serif;overflow-x:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#app{max-width:900px;margin:0 auto;padding:10px}
header{text-align:center;padding:16px 8px}
header h1{font-size:28px;color:#c2185b;text-shadow:2px 2px 0 #fff}
header .stats{display:flex;justify-content:center;gap:16px;margin-top:10px;flex-wrap:wrap}
header .stat{background:#fff;border:2px solid #f48fb1;border-radius:20px;padding:6px 14px;font-size:13px;color:#c2185b;font-weight:bold}
#gameArea{position:relative;background:#fff0f5;border:4px solid #f48fb1;border-radius:16px;min-height:520px;padding:12px;overflow:hidden}
#nailCanvas{width:100%;height:460px;display:block;border-radius:12px;background:linear-gradient(180deg,#fff 0%,#fce4ec 100%);cursor:crosshair}
.tool-panel{position:absolute;top:12px;right:12px;background:rgba(255,255,255,0.95);border:2px solid #ec407a;border-radius:12px;padding:10px;max-width:160px;font-size:12px;z-index:10}
.tool-panel h3{color:#ad1457;margin-bottom:6px;font-size:14px;text-align:center}
.tool-btn{display:flex;align-items:center;gap:6px;padding:6px 8px;margin:3px 0;background:#fce4ec;border-radius:6px;color:#880e4f;cursor:pointer;transition:all 0.2s;border:1px solid transparent;font-size:12px}
.tool-btn:hover{background:#f8bbd0;border-color:#ec407a}
.tool-btn.active{background:#ec407a;color:#fff;border-color:#ad1457}
.challenge-panel{position:absolute;top:12px;left:12px;background:rgba(255,255,255,0.95);border:2px solid #ab47bc;border-radius:12px;padding:10px;max-width:200px;font-size:12px;z-index:10}
.challenge-panel h3{color:#6a1b9a;margin-bottom:6px;font-size:14px;text-align:center}
.challenge-card{padding:8px;margin:4px 0;background:#f3e5f5;border-radius:8px;color:#4a148c}
.challenge-card h4{font-size:13px;margin-bottom:4px;color:#6a1b9a}
.challenge-card .req{font-size:11px;color:#7b1fa2;line-height:1.6;margin:4px 0}
.challenge-card .reward{color:#e65100;font-weight:bold;text-align:right;margin-top:4px;font-size:12px}
.gallery-panel{position:absolute;bottom:12px;left:12px;background:rgba(255,255,255,0.9);border:2px solid #90a4ae;border-radius:12px;padding:8px;z-index:10;max-width:220px}
.gallery-panel h4{color:#455a64;font-size:12px;text-align:center;margin-bottom:4px}
.gallery-list{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.gallery-item{width:40px;height:40px;border-radius:8px;border:2px solid #cfd8ae;cursor:pointer;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:20px;background:#fafafa;transition:all 0.2s}
.gallery-item:hover{transform:scale(1.1);border-color:#455a64}
.controls{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;justify-content:center}
.color-btn{width:44px;height:44px;border-radius:50%;border:3px solid #fff;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,0.2);transition:all 0.15s}
.color-btn:hover{transform:translateY(-3px);box-shadow:0 6px 12px rgba(0,0,0,0.25)}
.color-btn.active{transform:scale(1.15);border-color:#333;box-shadow:0 0 0 3px #ec407a,0 4px 10px rgba(0,0,0,0.2)}
.sticker-btn{padding:6px 10px;background:#fff;border:2px solid #ce93d8;border-radius:10px;font-size:18px;cursor:pointer;transition:all 0.15s;box-shadow:0 2px 0 #ba68c8}
.sticker-btn:hover{transform:translateY(-2px);box-shadow:0 4px 0 #ba68c8;background:#f3e5f5}
.sticker-btn.active{background:#ce93d8;color:#fff;box-shadow:0 2px 0 #8e24aa}
.action-btn{padding:8px 16px;background:linear-gradient(135deg,#ec407a,#d81b60);border:none;border-radius:10px;font-size:13px;font-weight:bold;color:#fff;cursor:pointer;box-shadow:0 3px 0 #880e4f;transition:all 0.15s;font-family:inherit}
.action-btn:hover{transform:translateY(-2px);box-shadow:0 5px 0 #880e4f}
.action-btn:active{transform:translateY(1px);box-shadow:0 1px 0 #880e4f}
.action-btn.save{background:linear-gradient(135deg,#66bb6a,#43a047);box-shadow:0 3px 0 #1b5e20}
.action-btn.save:hover{box-shadow:0 5px 0 #1b5e20}
.action-btn.submit{background:linear-gradient(135deg,#ffa726,#fb8c00);box-shadow:0 3px 0 #e65100}
.action-btn.submit:hover{box-shadow:0 5px 0 #e65100}
.action-btn.clear{background:linear-gradient(135deg,#90a4ae,#546e7a);box-shadow:0 3px 0 #263238}
.action-btn.clear:hover{box-shadow:0 5px 0 #263238}
.brush-slider{display:flex;align-items:center;gap:8px;background:#fff;border-radius:20px;padding:4px 12px;border:2px solid #f48fb1}
.brush-slider label{font-size:12px;color:#ad1457;font-weight:bold}
.brush-slider input{width:80px;accent-color:#ec407a}
.toast{position:fixed;top:20%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);color:#fff;padding:12px 24px;border-radius:24px;font-size:15px;z-index:1000;pointer-events:none;animation:toastIn 0.3s ease}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-20px)}to{opacity:1;transform:translate(-50%,0)}}
.unlock-popup{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;z-index:500}
.unlock-popup.show{display:flex;animation:fadeIn 0.3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.unlock-card{background:linear-gradient(135deg,#fce4ec,#f8bbd0);border:4px solid #ec407a;border-radius:20px;padding:30px;text-align:center;max-width:320px;animation:popIn 0.5s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes popIn{from{transform:scale(0)}to{transform:scale(1)}}
.unlock-card h2{color:#ad1457;margin-bottom:10px}
.unlock-card .emoji{font-size:64px;margin:16px 0}
.unlock-card p{color:#880e4f;margin-bottom:16px;line-height:1.6}
.unlock-card button{padding:10px 28px;background:linear-gradient(135deg,#66bb6a,#43a047);border:none;border-radius:20px;font-size:15px;font-weight:bold;color:#fff;cursor:pointer;font-family:inherit}
.start-screen{position:fixed;inset:0;background:linear-gradient(135deg,#fce4ec,#f8bbd9);z-index:900;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.start-screen h1{font-size:42px;color:#c2185b;text-shadow:3px 3px 0 #fff;margin-bottom:12px;text-align:center}
.start-screen .desc{color:#880e4f;font-size:16px;text-align:center;max-width:420px;line-height:1.8;margin-bottom:30px}
#start-game-btn{padding:16px 56px;background:linear-gradient(135deg,#ec407a,#d81b60);border:none;border-radius:30px;font-size:20px;font-weight:bold;color:#fff;cursor:pointer;box-shadow:0 6px 0 #880e4f;transition:all 0.15s;font-family:inherit;letter-spacing:2px}
#start-game-btn:hover{transform:translateY(-3px);box-shadow:0 9px 0 #880e4f}
#start-game-btn:active{transform:translateY(3px);box-shadow:0 0 0 #880e4f}
.help-hint{color:#ad1457;font-size:13px;margin-top:24px;text-align:center;line-height:1.8}
.result-popup{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:none;align-items:center;justify-content:center;z-index:600;flex-direction:column;gap:16px}
.result-popup.show{display:flex;animation:fadeIn 0.3s}
.result-card{background:linear-gradient(135deg,#fff,#fce4ec);border:4px solid #ec407a;border-radius:20px;padding:24px;text-align:center;max-width:360px}
.result-card h2{color:#ad1457;margin-bottom:8px;font-size:26px}
.result-card .score{font-size:48px;font-weight:bold;color:#ffa726;margin:12px 0;text-shadow:2px 2px 0 #fff3e0}
.result-card .stars{font-size:36px;margin:8px 0}
.result-card button{padding:10px 28px;background:linear-gradient(135deg,#ec407a,#d81b60);border:none;border-radius:20px;font-size:15px;font-weight:bold;color:#fff;cursor:pointer;font-family:inherit;margin:4px}
.nail-select{position:absolute;bottom:12px;right:12px;background:rgba(255,255,255,0.95);border:2px solid #ec407a;border-radius:12px;padding:6px;z-index:10;display:flex;gap:4px}
.nail-slot{width:38px;height:48px;border-radius:50% 50% 40% 40%;border:2px solid #e0e0e0;background:#fafafa;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;font-size:10px;color:#999}
.nail-slot:hover{border-color:#ec407a;transform:translateY(-2px)}
.nail-slot.active{border-color:#ec407a;background:#fce4ec;box-shadow:0 0 10px rgba(236,64,122,0.4)}
@media(max-width:600px){
  header h1{font-size:22px}
  header .stat{font-size:11px;padding:4px 10px}
  .color-btn{width:34px;height:34px}
  .sticker-btn{font-size:14px;padding:4px 8px}
  .action-btn{font-size:11px;padding:6px 10px}
  .tool-panel,.challenge-panel{font-size:10px;max-width:130px;padding:6px}
  #nailCanvas{height:320px}
  .nail-slot{width:30px;height:38px}
}
/* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */
/* [BATCH-FIX:ad-components-css] */
.sponsor-btn{position:fixed;top:44px;right:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:3px 9px;border-radius:10px;font:11px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.sponsor-panel.show{display:flex}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.interstitial-ad.show{display:flex}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* [/BATCH-FIX:ad-components-css] */
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>💅 美甲工作室 💎</h1>
    <div class="stats">
      <div class="stat">💎 钻石: <span id="coinVal">0</span></div>
      <div class="stat">⭐ 等级: <span id="levelVal">1</span></div>
      <div class="stat">🎨 作品: <span id="worksVal">0</span></div>
    </div>
  </header>
  <div id="gameArea">
    <canvas id="nailCanvas"></canvas>
    <div class="tool-panel">
      <h3>🎨 工具</h3>
      <div id="toolList"></div>
    </div>
    <div class="challenge-panel">
      <h3>📋 挑战任务</h3>
      <div id="challengeList"></div>
    </div>
    <div class="gallery-panel">
      <h4>🖼️ 我的作品</h4>
      <div class="gallery-list" id="galleryList"></div>
    </div>
    <div class="nail-select" id="nailSelect"></div>
  </div>
  <div class="controls" id="controls"></div>
</div>

<div class="start-screen" id="startScreen">
  <h1>💅 美甲工作室 💎</h1>
  <div class="desc">
    欢迎来到美甲工作室！<br>
    选择颜色和图案，绘制独特的美甲设计。<br>
    完成挑战任务，解锁更多贴纸和工具！
  </div>
  <button id="start-game-btn">开始创作</button>
  <div class="help-hint">
    🖱️ 鼠标点击/拖动绘制<br>
    📱 触屏滑动绘画<br>
    ⌨️ 数字键1-9选颜色，C清除，S保存，空格提交
  </div>
</div>

<div class="unlock-popup" id="unlockPopup">
  <div class="unlock-card">
    <h2>🎉 解锁新内容！</h2>
    <div class="emoji" id="unlockEmoji">🎨</div>
    <p id="unlockText">解锁新贴纸！</p>
    <button onclick="closeUnlock()">太棒了！</button>
  </div>
</div>

<div class="result-popup" id="resultPopup">
  <div class="result-card">
    <h2 id="resultTitle">✨ 挑战完成！</h2>
    <div class="stars" id="resultStars">⭐⭐⭐</div>
    <div class="score" id="resultScore">+100</div>
    <div id="resultMsg" style="color:#880e4f;margin:8px 0;line-height:1.6"></div>
    <button onclick="closeResult()">继续创作</button>
    <button onclick="closeResult();newChallenge()">新挑战</button>
  </div>
</div>

<script>
if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
if (typeof STATE_DESIGN  === 'undefined') var STATE_DESIGN  = 1;
if (typeof STATE_SUBMIT  === 'undefined') var STATE_SUBMIT  = 2;
if (typeof STATE_RESULT  === 'undefined') var STATE_RESULT  = 3;

var gameState = STATE_MENU;
var canvas, ctx, cw, ch;
var currentTool = 'brush';
var currentColor = '#ec407a';
var currentSticker = null;
var brushSize = 6;
var currentNail = 0;
var nailStates = [];
var isDrawing = false;
var lastX = 0, lastY = 0;
var currentChallenge = null;

var COLORS = [
  { id:'pink', name:'樱花粉', color:'#ec407a', unlockLv:1 },
  { id:'red', name:'烈焰红', color:'#e53935', unlockLv:1 },
  { id:'purple', name:'梦幻紫', color:'#8e24aa', unlockLv:1 },
  { id:'blue', name:'天空蓝', color:'#1e88e5', unlockLv:1 },
  { id:'green', name:'薄荷绿', color:'#43a047', unlockLv:2 },
  { id:'yellow', name:'柠檬黄', color:'#fdd835', unlockLv:2 },
  { id:'orange', name:'活力橙', color:'#fb8c00', unlockLv:3 },
  { id:'black', name:'经典黑', color:'#212121', unlockLv:2 },
  { id:'white', name:'纯白', color:'#fafafa', unlockLv:1 },
  { id:'nude', name:'裸色', color:'#ffccbc', unlockLv:3 },
  { id:'gold', name:'金色', color:'#ffd700', unlockLv:4 },
  { id:'silver', name:'银色', color:'#c0c0c0', unlockLv:4 }
];

var STICKERS = [
  { id:'heart', name:'爱心', emoji:'❤️', unlockLv:1 },
  { id:'star', name:'星星', emoji:'⭐', unlockLv:1 },
  { id:'flower', name:'小花', emoji:'🌸', unlockLv:2 },
  { id:'diamond', name:'钻石', emoji:'💎', unlockLv:2 },
  { id:'crown', name:'皇冠', emoji:'👑', unlockLv:3 },
  { id:'butterfly', name:'蝴蝶', emoji:'🦋', unlockLv:3 },
  { id:'rainbow', name:'彩虹', emoji:'🌈', unlockLv:4 },
  { id:'moon', name:'月亮', emoji:'🌙', unlockLv:4 },
  { id:'unicorn', name:'独角兽', emoji:'🦄', unlockLv:5 },
  { id:'sparkle', name:'闪粉', emoji:'✨', unlockLv:5 }
];

var TOOLS = [
  { id:'brush', name:'画笔', icon:'✏️' },
  { id:'fill', name:'填充', icon:'🪣' },
  { id:'eraser', name:'橡皮', icon:'🧽' },
  { id:'sticker', name:'贴纸', icon:'🎀' },
  { id:'line', name:'线条', icon:'📏' },
  { id:'dot', name:'点钻', icon:'💠' }
];

var CHALLENGES = [
  { id:'c1', name:'粉色甜心', desc:'5个指甲都涂成粉色系，至少1个爱心贴纸', req:{colors:['#ec407a','#f48fb1','#f8bbd0'], minStickers:{'heart':1}}, reward:50, unlockLv:1 },
  { id:'c2', name:'星空美甲', desc:'深色底色+至少2个星星贴纸', req:{colors:['#212121','#1a237e','#4a148c'], minStickers:{'star':2}}, reward:80, unlockLv:2 },
  { id:'c3', name:'花园派对', desc:'包含花朵、蝴蝶贴纸，3种不同颜色', req:{minStickers:{'flower':1,'butterfly':1}, minColors:3}, reward:100, unlockLv:3 },
  { id:'c4', name:'黄金女王', desc:'金色/银色为主，包含皇冠贴纸', req:{colors:['#ffd700','#c0c0c0','#ffeb3b'], minStickers:{'crown':1}}, reward:120, unlockLv:4 },
  { id:'c5', name:'梦幻独角兽', desc:'包含独角兽+彩虹贴纸，梦幻色系', req:{minStickers:{'unicorn':1,'rainbow':1}}, reward:150, unlockLv:5 },
  { id:'c6', name:'闪钻奢华', desc:'5个指甲各有至少2个钻石贴纸', req:{minStickers:{'diamond':10}}, reward:200, unlockLv:5 }
];

var playerData = {
  coins: 0,
  level: 1,
  exp: 0,
  worksCount: 0,
  gallery: [],
  completedChallenges: [],
  unlockedColors: ['pink','red','purple','blue','white'],
  unlockedStickers: ['heart','star'],
  highScore: 0
};

function loadSave(){
  var s = Storage.load('nail_studio_save', null);
  if(s) playerData = Object.assign(playerData, s);
}
function saveGame(){ Storage.save('nail_studio_save', playerData); }

function expLv(lv){ return lv * 120; }
function checkLevelUp(){
  var up = false;
  while(playerData.exp >= expLv(playerData.level)){
    playerData.exp -= expLv(playerData.level);
    playerData.level++;
    up = true;
    checkUnlocks();
  }
  if(up) showToast('🎉 升级！Lv.' + playerData.level);
  updateStats();
}
function checkUnlocks(){
  var newly = {c:[], s:[]};
  COLORS.forEach(function(c){
    if(c.unlockLv <= playerData.level && playerData.unlockedColors.indexOf(c.id)<0){
      playerData.unlockedColors.push(c.id); newly.c.push(c);
    }
  });
  STICKERS.forEach(function(s){
    if(s.unlockLv <= playerData.level && playerData.unlockedStickers.indexOf(s.id)<0){
      playerData.unlockedStickers.push(s.id); newly.s.push(s);
    }
  });
  if(newly.c.length>0){
    setTimeout(function(){
      showUnlock(newly.c[0].color, '新颜色解锁！' + newly.c[0].name);
    }, 600);
  } else if(newly.s.length>0){
    setTimeout(function(){
      showUnlock(newly.s[0].emoji, '新贴纸解锁！' + newly.s[0].name);
    }, 600);
  }
  saveGame();
  renderControls();
}
function showUnlock(emoji, txt){
  document.getElementById('unlockEmoji').textContent = emoji.length>3 ? '🎨' : emoji;
  document.getElementById('unlockText').textContent = txt;
  document.getElementById('unlockPopup').classList.add('show');
}
function closeUnlock(){ document.getElementById('unlockPopup').classList.remove('show'); }
function closeResult(){ document.getElementById('resultPopup').classList.remove('show'); gameState = STATE_DESIGN; }

function showToast(msg){
  var t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 1800);
}

function updateStats(){
  document.getElementById('coinVal').textContent = playerData.coins;
  document.getElementById('levelVal').textContent = playerData.level + '(' + playerData.exp + '/' + expLv(playerData.level) + ')';
  document.getElementById('worksVal').textContent = playerData.worksCount;
}

function renderTools(){
  var list = document.getElementById('toolList');
  list.innerHTML = '';
  TOOLS.forEach(function(t){
    var d = document.createElement('div');
    d.className = 'tool-btn' + (currentTool===t.id?' active':'');
    d.innerHTML = '<span>' + t.icon + '</span>' + t.name;
    d.onclick = function(){ currentTool = t.id; currentSticker=null; renderTools(); };
    list.appendChild(d);
  });
}

function renderChallenges(){
  var list = document.getElementById('challengeList');
  list.innerHTML = '';
  var avail = CHALLENGES.filter(function(c){ return c.unlockLv<=playerData.level; });
  if(avail.length === 0){
    list.innerHTML = '<div style="color:#888;text-align:center">暂无挑战</div>';
    return;
  }
  if(!currentChallenge){
    currentChallenge = avail.find(function(c){ return playerData.completedChallenges.indexOf(c.id)<0; }) || avail[0];
  }
  if(currentChallenge){
    var done = playerData.completedChallenges.indexOf(currentChallenge.id)>=0;
    var d = document.createElement('div');
    d.className = 'challenge-card';
    d.innerHTML = '<h4>' + (done?'✅ ':'') + currentChallenge.name + '</h4>' +
      '<div class="req">' + currentChallenge.desc + '</div>' +
      '<div class="reward">💎 ' + currentChallenge.reward + '</div>';
    list.appendChild(d);
  }
}

function renderGallery(){
  var list = document.getElementById('galleryList');
  list.innerHTML = '';
  for(var i=0;i<8;i++){
    var g = document.createElement('div');
    g.className = 'gallery-item';
    if(playerData.gallery[i]){
      var colors = playerData.gallery[i].colors || ['#ec407a'];
      g.style.background = 'linear-gradient(135deg,' + colors.join(',') + ')';
      g.innerHTML = (playerData.gallery[i].stickers || ['⭐'])[0] || '';
      g.onclick = (function(idx){ return function(){ loadWork(idx); }; })(i);
    } else {
      g.innerHTML = '➕';
      g.style.color = '#bbb';
    }
    list.appendChild(g);
  }
}

function renderNailSelect(){
  var ns = document.getElementById('nailSelect');
  ns.innerHTML = '';
  for(var i=0;i<5;i++){
    var s = document.createElement('div');
    s.className = 'nail-slot' + (i===currentNail?' active':'');
    s.textContent = (i+1);
    s.onclick = (function(idx){ return function(){ selectNail(idx); }; })(i);
    ns.appendChild(s);
  }
}

function selectNail(idx){
  currentNail = idx;
  renderNailSelect();
  drawNails();
}

function renderControls(){
  var c = document.getElementById('controls');
  c.innerHTML = '';
  COLORS.forEach(function(col){
    var un = playerData.unlockedColors.indexOf(col.id)>=0;
    var btn = document.createElement('button');
    btn.className = 'color-btn' + (currentColor===col.color && currentTool!=='sticker'?' active':'');
    btn.style.background = un ? col.color : '#ccc';
    btn.style.opacity = un ? 1 : 0.4;
    btn.title = col.name + (un?'':'(等级' + col.unlockLv + '解锁)');
    if(un){
      btn.onclick = function(){ currentColor = col.color; currentTool='brush'; renderControls(); renderTools(); };
    }
    c.appendChild(btn);
  });
  STICKERS.forEach(function(s){
    var un = playerData.unlockedStickers.indexOf(s.id)>=0;
    var btn = document.createElement('button');
    btn.className = 'sticker-btn' + (currentSticker===s.id?' active':'');
    btn.textContent = s.emoji;
    btn.style.opacity = un ? 1 : 0.4;
    btn.title = s.name + (un?'':'(等级' + s.unlockLv + '解锁)');
    if(un){
      btn.onclick = function(){ currentSticker = s.id; currentTool='sticker'; renderControls(); renderTools(); };
    }
    c.appendChild(btn);
  });
  var bs = document.createElement('div');
  bs.className = 'brush-slider';
  bs.innerHTML = '<label>大小</label><input type="range" id="brushSize" min="2" max="20" value="'+brushSize+'">';
  c.appendChild(bs);
  setTimeout(function(){
    var inp = document.getElementById('brushSize');
    if(inp) inp.oninput = function(e){ brushSize = parseInt(e.target.value); };
  }, 10);
  var clear = document.createElement('button');
  clear.className = 'action-btn clear';
  clear.textContent = '🗑️ 清除';
  clear.onclick = clearCurrentNail;
  c.appendChild(clear);
  var save = document.createElement('button');
  save.className = 'action-btn save';
  save.textContent = '💾 保存';
  save.onclick = saveWork;
  c.appendChild(save);
  var submit = document.createElement('button');
  submit.className = 'action-btn submit';
  submit.textContent = '📤 提交挑战';
  submit.onclick = submitChallenge;
  c.appendChild(submit);
}

function initNailStates(){
  nailStates = [];
  for(var i=0;i<5;i++){
    nailStates.push({
      baseColor: null,
      lines: [],
      stickers: []
    });
  }
}

function getNailRect(idx){
  var totalW = cw * 0.8;
  var nailW = totalW / 5.8;
  var nailH = nailW * 1.5;
  var gap = nailW * 0.12;
  var startX = (cw - totalW) / 2;
  var x = startX + idx * (nailW + gap);
  var y = ch * 0.35;
  return { x:x, y:y, w:nailW, h:nailH };
}

function nailContains(nx, ny, px, py){
  var cx = nx.x + nx.w/2;
  var cy = nx.y + nx.h/2;
  var rx = nx.w/2 * 1.1;
  var ry = nx.h/2 * 1.05;
  return ((px-cx)*(px-cx))/(rx*rx) + ((py-cy)*(py-cy))/(ry*ry) <= 1;
}

function drawNails(){
  ctx.clearRect(0,0,cw,ch);
  // 手的轮廓
  ctx.fillStyle = '#ffe0bd';
  var handY = ch*0.55;
  ctx.beginPath();
  ctx.ellipse(cw*0.5, handY + ch*0.25, cw*0.45, ch*0.18, 0, 0, Math.PI*2);
  ctx.fill();
  for(var i=0;i<5;i++){
    var r = getNailRect(i);
    // 手指
    ctx.fillStyle = '#ffe0bd';
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(r.x - 4, r.y - r.h*0.8, r.w + 8, r.h*2.5, 20)
                   : ctx.rect(r.x-4, r.y-r.h*0.8, r.w+8, r.h*2.5);
    ctx.fill();
  }
  // 指甲
  for(var i=0;i<5;i++){
    var r = getNailRect(i);
    var ns = nailStates[i];
    ctx.save();
    ctx.beginPath();
    var cx = r.x + r.w/2;
    var cy = r.y + r.h/2;
    ctx.moveTo(cx - r.w/2, cy + r.h/3);
    ctx.quadraticCurveTo(cx - r.w/2, cy - r.h/2, cx, cy - r.h/2);
    ctx.quadraticCurveTo(cx + r.w/2, cy - r.h/2, cx + r.w/2, cy + r.h/3);
    ctx.lineTo(cx + r.w/2 - 2, cy + r.h/2);
    ctx.quadraticCurveTo(cx, cy + r.h/2 + 4, cx - r.w/2 + 2, cy + r.h/2);
    ctx.closePath();
    ctx.clip();
    // 底色
    if(ns.baseColor){
      ctx.fillStyle = ns.baseColor;
      ctx.fillRect(r.x-10, r.y-10, r.w+20, r.h+20);
    } else {
      ctx.fillStyle = '#fff9f5';
      ctx.fillRect(r.x-10, r.y-10, r.w+20, r.h+20);
    }
    // 绘制线条
    ns.lines.forEach(function(line){
      ctx.strokeStyle = line.color;
      ctx.lineWidth = line.size;
      ctx.lineCap = 'round';
      ctx.beginPath();
      if(line.type === 'dot'){
        ctx.fillStyle = line.color;
        ctx.arc(line.x1, line.y1, line.size/2, 0, Math.PI*2);
        ctx.fill();
      } else if(line.type === 'line'){
        ctx.moveTo(line.x1, line.y1);
        ctx.lineTo(line.x2, line.y2);
        ctx.stroke();
      } else {
        if(line.points && line.points.length>1){
          ctx.moveTo(line.points[0].x, line.points[0].y);
          for(var p=1;p<line.points.length;p++){
            ctx.lineTo(line.points[p].x, line.points[p].y);
          }
          ctx.stroke();
        }
      }
    });
    // 贴纸
    ns.stickers.forEach(function(st){
      var sk = STICKERS.find(function(x){return x.id===st.id;});
      if(sk){
        ctx.font = (r.w*0.35) + 'px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(sk.emoji, st.x, st.y);
      }
    });
    ctx.restore();
    // 指甲边框高光
    ctx.strokeStyle = i===currentNail ? '#ec407a' : 'rgba(255,255,255,0.6)';
    ctx.lineWidth = i===currentNail ? 4 : 2;
    ctx.beginPath();
    ctx.moveTo(cx - r.w/2, cy + r.h/3);
    ctx.quadraticCurveTo(cx - r.w/2, cy - r.h/2, cx, cy - r.h/2);
    ctx.quadraticCurveTo(cx + r.w/2, cy - r.h/2, cx + r.w/2, cy + r.h/3);
    ctx.lineTo(cx + r.w/2 - 2, cy + r.h/2);
    ctx.quadraticCurveTo(cx, cy + r.h/2 + 4, cx - r.w/2 + 2, cy + r.h/2);
    ctx.closePath();
    ctx.stroke();
  }
  // 当前指甲标签
  var cr = getNailRect(currentNail);
  ctx.fillStyle = 'rgba(236,64,122,0.9)';
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(cr.x + cr.w/2 - 28, cr.y - 32, 56, 24, 12) : ctx.rect(cr.x + cr.w/2 - 28, cr.y - 32, 56, 24);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 13px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('第' + (currentNail+1) + '指', cr.x + cr.w/2, cr.y - 15);
}

function clearCurrentNail(){
  nailStates[currentNail] = { baseColor:null, lines:[], stickers:[] };
  drawNails();
  showToast('已清除第' + (currentNail+1) + '指');
}

function saveWork(){
  var colors = [];
  var stickers = [];
  nailStates.forEach(function(ns){
    if(ns.baseColor) colors.push(ns.baseColor);
    ns.lines.forEach(function(l){ if(colors.indexOf(l.color)<0) colors.push(l.color); });
    ns.stickers.forEach(function(s){ stickers.push(s.id); });
  });
  if(colors.length===0 && stickers.length===0){ showToast('空白作品不能保存哦'); return; }
  playerData.gallery.unshift({ colors:colors.slice(0,4), stickers:stickers.slice(0,4), time:Date.now() });
  if(playerData.gallery.length>8) playerData.gallery = playerData.gallery.slice(0,8);
  playerData.worksCount++;
  playerData.exp += 10;
  saveGame();
  checkLevelUp();
  renderGallery();
  showToast('💾 作品已保存！+10经验');
}

function loadWork(idx){
  if(!playerData.gallery[idx]) return;
  initNailStates();
  var w = playerData.gallery[idx];
  if(w.colors && w.colors[0]){
    nailStates.forEach(function(ns){ ns.baseColor = w.colors[0]; });
  }
  drawNails();
  showToast('📂 已加载作品');
}

function newChallenge(){
  var avail = CHALLENGES.filter(function(c){ return c.unlockLv<=playerData.level && playerData.completedChallenges.indexOf(c.id)<0; });
  if(avail.length===0) avail = CHALLENGES.filter(function(c){ return c.unlockLv<=playerData.level; });
  if(avail.length>0){
    currentChallenge = avail[Math.floor(Math.random()*avail.length)];
    initNailStates();
    drawNails();
    renderChallenges();
    showToast('📋 新挑战：' + currentChallenge.name);
  } else {
    showToast('暂无可选挑战');
  }
}

function submitChallenge(){
  gameState = STATE_SUBMIT;
  if(!currentChallenge){ showToast('暂无挑战！'); gameState=STATE_DESIGN; return; }
  var req = currentChallenge.req;
  var stars = 3;
  var gotColors = new Set();
  var gotStickers = {};
  nailStates.forEach(function(ns){
    if(ns.baseColor) gotColors.add(ns.baseColor);
    ns.lines.forEach(function(l){ gotColors.add(l.color); });
    ns.stickers.forEach(function(s){ gotStickers[s.id] = (gotStickers[s.id]||0) + 1; });
  });
  // 检查颜色
  if(req.colors){
    var matchedColor = false;
    req.colors.forEach(function(c){ if(gotColors.has(c)) matchedColor = true; });
    if(!matchedColor) stars = Math.min(stars, 1);
  }
  if(req.minColors && gotColors.size < req.minColors) stars = Math.min(stars, 2);
  // 检查贴纸
  if(req.minStickers){
    Object.keys(req.minStickers).forEach(function(k){
      if((gotStickers[k]||0) < req.minStickers[k]) stars = Math.min(stars, 2);
    });
  }
  var allFilled = nailStates.every(function(ns){ return ns.baseColor || ns.lines.length>0 || ns.stickers.length>0; });
  if(!allFilled) stars = Math.min(stars, 2);
  var earn = Math.floor(currentChallenge.reward * stars / 3);
  playerData.coins += earn;
  playerData.exp += earn;
  if(stars === 3 && playerData.completedChallenges.indexOf(currentChallenge.id)<0){
    playerData.completedChallenges.push(currentChallenge.id);
  }
  saveGame();
  checkLevelUp();
  document.getElementById('resultTitle').textContent = stars===3 ? '✨ 完美通关！' : stars>=2 ? '👍 完成挑战！' : '💪 继续加油！';
  document.getElementById('resultStars').textContent = '⭐'.repeat(stars) + '☆'.repeat(3-stars);
  document.getElementById('resultScore').textContent = '+' + earn + ' 💎';
  document.getElementById('resultMsg').textContent = '挑战【' + currentChallenge.name + '】获得' + stars + '星评价！';
  document.getElementById('resultPopup').classList.add('show');
  gameState = STATE_RESULT;
}

function canvasPos(e){
  var rect = canvas.getBoundingClientRect();
  var cx, cy;
  if(e.touches && e.touches[0]){
    cx = e.touches[0].clientX - rect.left;
    cy = e.touches[0].clientY - rect.top;
  } else {
    cx = e.clientX - rect.left;
    cy = e.clientY - rect.top;
  }
  return { x:cx, y:cy };
}

function findNailAt(x,y){
  for(var i=0;i<5;i++){
    var r = getNailRect(i);
    if(nailContains(r, x, y)) return i;
  }
  return -1;
}

function startDraw(e){
  if(gameState !== STATE_DESIGN) return;
  var pos = canvasPos(e);
  var nidx = findNailAt(pos.x, pos.y);
  if(nidx < 0) return;
  currentNail = nidx;
  renderNailSelect();
  isDrawing = true;
  lastX = pos.x; lastY = pos.y;
  var ns = nailStates[nidx];
  if(currentTool === 'fill'){
    ns.baseColor = currentColor;
    drawNails();
    isDrawing = false;
  } else if(currentTool === 'sticker' && currentSticker){
    ns.stickers.push({ id: currentSticker, x: pos.x, y: pos.y });
    drawNails();
    isDrawing = false;
  } else if(currentTool === 'dot'){
    ns.lines.push({ type:'dot', color: currentTool==='eraser' ? '#fff9f5' : currentColor, size: brushSize*1.5, x1: pos.x, y1: pos.y });
    drawNails();
    isDrawing = false;
  } else if(currentTool === 'eraser'){
    ns.stickers = ns.stickers.filter(function(s){
      var dx = s.x - pos.x, dy = s.y - pos.y;
      return Math.sqrt(dx*dx+dy*dy) > brushSize*2;
    });
    ns.lines.push({ type:'line', color:'#fff9f5', size: brushSize*2, points:[{x:pos.x,y:pos.y}] });
    drawNails();
  } else {
    ns.lines.push({ type: currentTool, color: currentColor, size: brushSize, points:[{x:pos.x,y:pos.y}] });
  }
  e.preventDefault && e.preventDefault();
}

function moveDraw(e){
  if(!isDrawing || gameState!==STATE_DESIGN) return;
  var pos = canvasPos(e);
  var ns = nailStates[currentNail];
  if(currentTool==='brush' || currentTool==='eraser' || currentTool==='line'){
    var last = ns.lines[ns.lines.length-1];
    if(last && last.points){
      last.points.push({ x:pos.x, y:pos.y });
      drawNails();
    }
  }
  lastX = pos.x; lastY = pos.y;
  e.preventDefault && e.preventDefault();
}

function endDraw(){ isDrawing = false; }

function handleKeyboard(e){
  if(gameState===STATE_MENU) return;
  var n = parseInt(e.key);
  var avail = COLORS.filter(function(c){ return playerData.unlockedColors.indexOf(c.id)>=0; });
  if(n>=1 && n<=9 && avail[n-1]){
    currentColor = avail[n-1].color;
    currentTool = 'brush';
    renderControls();
    renderTools();
  } else if(e.key==='c'||e.key==='C'){
    clearCurrentNail();
  } else if(e.key==='s'||e.key==='S'){
    saveWork();
  } else if(e.key===' '){
    e.preventDefault();
    submitChallenge();
  } else if(e.key==='ArrowLeft'){
    currentNail = (currentNail + 4) % 5;
    renderNailSelect(); drawNails();
  } else if(e.key==='ArrowRight'){
    currentNail = (currentNail + 1) % 5;
    renderNailSelect(); drawNails();
  }
}

function initCanvas(){
  canvas = document.getElementById('nailCanvas');
  ctx = canvas.getContext('2d');
  function resize(){
    var r = canvas.getBoundingClientRect();
    canvas.width = r.width*(window.devicePixelRatio||1);
    canvas.height = r.height*(window.devicePixelRatio||1);
    cw = canvas.width; ch = canvas.height;
    ctx.scale(window.devicePixelRatio||1, window.devicePixelRatio||1);
    cw = r.width; ch = r.height;
    drawNails();
  }
  resize();
  window.addEventListener('resize', resize);
  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', moveDraw);
  canvas.addEventListener('mouseup', endDraw);
  canvas.addEventListener('mouseleave', endDraw);
  canvas.addEventListener('touchstart', startDraw, {passive:false});
  canvas.addEventListener('touchmove', moveDraw, {passive:false});
  canvas.addEventListener('touchend', endDraw);
}

function initGame(){
  loadSave();
  initNailStates();
  renderTools();
  renderChallenges();
  renderGallery();
  renderNailSelect();
  renderControls();
  initCanvas();
  updateStats();
  checkUnlocks();
  document.addEventListener('keydown', handleKeyboard);
}

document.getElementById('start-game-btn').addEventListener('click', function(){
  document.getElementById('startScreen').style.display = 'none';
  gameState = STATE_DESIGN;
  initGame();
});

GameCore.init({ touch:false, loading:false });
</script>

<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>

<script>
(function(){
  if (window.__batchPauseFix) return;
  window.__batchPauseFix = true;
  var _paused = false;
  var _overlay = document.createElement('div');
  _overlay.id = 'batchPauseOverlay';
  _overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:9999;display:none;align-items:center;justify-content:center;color:#fff;font:bold 32px sans-serif;cursor:pointer';
  _overlay.textContent = 'PAUSED (click to resume)';
  _overlay.addEventListener('click', function(){ togglePause(); });
  document.body.appendChild(_overlay);
  window.togglePause = function() {
    _paused = !_paused;
    _overlay.style.display = _paused ? 'flex' : 'none';
  };
  window.isPaused = function() { return _paused; };
  document.addEventListener('keydown', function(e) {
    if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
      e.preventDefault();
      togglePause();
    }
  });
  var _origRAF = window.requestAnimationFrame || function(cb){return setTimeout(cb,16)};
  window.requestAnimationFrame = function(cb) {
    return _origRAF.call(window, function(ts) {
      if (!_paused) cb(ts);
      else window.requestAnimationFrame(cb);
    });
  };
})();
</script>
