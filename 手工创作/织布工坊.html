let audioCtx=null;
function initAudio(){
    if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
}
function playTone(freq,dur,type,vol){
    if(!audioCtx)return;
    try{
        const o=audioCtx.createOscillator();
        const g=audioCtx.createGain();
        o.type=type||'sine';
        o.frequency.value=freq;
        g.gain.value=vol||0.15;
        g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
        o.connect(g);g.connect(audioCtx.destination);
        o.start();o.stop(audioCtx.currentTime+dur);
    }catch(e){}
}
function sfxPick(){playTone(523,0.08,'sine',0.12)}
function sfxWeave(){playTone(392,0.06,'triangle',0.1)}
function sfxError(){playTone(196,0.15,'sawtooth',0.15)}
function sfxScore(){playTone(659,0.1,'sine',0.18);setTimeout(()=>playTone(784,0.12,'sine',0.18),80);setTimeout(()=>playTone(988,0.18,'sine',0.18),180)}

function sfxBtn(){playTone(440,0.06,'sine',0.1)}

let usedHintThisLevel=false;
let weavesThisLevel=0;
let achievementPopups=[];
function unlockAchievement(id){
    const a=ACHIEVEMENTS.find(x=>x.id===id);
    if(!a||a.unlocked)return;
    a.unlocked=true;
    achievementPopups.push({a:a,life:150,y:-50});
    for(let i=0;i<20;i++)setTimeout(()=>playTone(700+i*60,0.06,'sine',0.12),i*40);
    spawnParticles(W/2,200,'#ffd700',30);
}
function updateAchievementPopups(){
    for(let i=achievementPopups.length-1;i>=0;i--){
        const p=achievementPopups[i];
        p.life--;
        if(p.y<40)p.y+=1.2;
        if(p.life<30)p.y-=1.5;
        if(p.life<=0)achievementPopups.splice(i,1);
    }
}
function drawAchievementPopups(ctx){
    for(const p of achievementPopups){
        ctx.save();
        ctx.translate(W/2,p.y);
        ctx.globalAlpha=Math.min(1,p.life/60);
        ctx.fillStyle='rgba(0,0,0,0.82)';
        roundRect(ctx,-140,-22,280,48,12);ctx.fill();
        ctx.strokeStyle='#ffd700';ctx.lineWidth=2;
        roundRect(ctx,-140,-22,280,48,12);ctx.stroke();
        ctx.font='26px Arial';ctx.textAlign='left';
        ctx.fillText(p.a.icon,-128,8);
        ctx.fillStyle='#ffd700';
        ctx.font='bold 15px "Microsoft YaHei"';
        ctx.fillText('🏅 成就解锁: '+p.a.name,-92,-2);
        ctx.fillStyle='#ddd';
        ctx.font='12px "Microsoft YaHei"';
        ctx.fillText(p.a.desc,-92,14);
        ctx.restore();
    }
    ctx.globalAlpha=1;
}
let threadLines=[];
function spawnThreadLine(fromX,fromY,toX,toY,color){
    threadLines.push({fx:fromX,fy:fromY,tx:toX,ty:toY,t:0,color:color,life:18});
}
function updateThreadLines(){
    for(let i=threadLines.length-1;i>=0;i--){
        const l=threadLines[i];
        l.t+=0.12;l.life--;
        if(l.t>=1||l.life<=0)threadLines.splice(i,1);
    }
}
function drawThreadLines(ctx){
    for(const l of threadLines){
        const t=l.t;
        const cx=l.fx+(l.tx-l.fx)*0.5;
        const cy=l.fy+(l.ty-l.fy)*0.5-30*(1-Math.abs(t-0.5)*2);
        ctx.globalAlpha=l.life/18;
        ctx.strokeStyle=l.color;ctx.lineWidth=3;
        ctx.beginPath();ctx.moveTo(l.fx,l.fy);
        ctx.quadraticCurveTo(cx,cy,l.tx,l.ty);ctx.stroke();
    }
    ctx.globalAlpha=1;
}
let milestoneTracker={milestones:[100,300,600,1000,1500,2200,3000],lastHit:-1};
function checkMilestones(curScore){
    for(let i=milestoneTracker.lastHit+1;i<milestoneTracker.milestones.length;i++){
        if(curScore>=milestoneTracker.milestones[i]){
            milestoneTracker.lastHit=i;
            addFloating(W/2,150,'🎯 里程碑 '+milestoneTracker.milestones[i]+'分!','#ffd700',true);
            spawnParticles(W/2,150,'#ffd700',25);
            break;
        }
    }
}
function spawnParticles(x,y,color,count){
    if(!count)count=12;
    for(let i=0;i<count;i++){
        particles.push({
            x:x,y:y,
            vx:(Math.random()-0.5)*7,
            vy:(Math.random()-0.5)*7-2,
            life:30+Math.floor(Math.random()*25),
            maxLife:55,
            size:2+Math.random()*3,
            color:color
        });
    }
}
function updateParticles(){
    for(let i=particles.length-1;i>=0;i--){
        const p=particles[i];
        p.x+=p.vx;p.y+=p.vy;
        p.vy+=0.22;
        p.vx*=0.99;
        p.life--;
        if(p.life<=0)particles.splice(i,1);
    }
}
function drawParticles(ctx){
    for(const p of particles){
        ctx.globalAlpha=Math.max(0,p.life/p.maxLife);
        ctx.fillStyle=p.color;
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
        ctx.fill();
    }
    ctx.globalAlpha=1;
}
let floatings=[];
function addFloating(x,y,text,color,big){
    floatings.push({x:x,y:y,text:text,color:color||'#ffd700',life:60,maxLife:60,big:big||false});
}
function updateFloatings(){
    for(let i=floatings.length-1;i>=0;i--){
        const f=floatings[i];
        f.y-=1.1;f.life--;
        if(f.life<=0)floatings.splice(i,1);
    }
}
function drawFloatings(ctx){
    for(const f of floatings){
        ctx.globalAlpha=Math.min(1,f.life/30);
        ctx.fillStyle=f.color;
        ctx.font='bold '+(f.big?32:18)+'px "Microsoft YaHei"';
        ctx.textAlign='center';
        ctx.fillText(f.text,f.x,f.y);
        ctx.textAlign='left';
    }
    ctx.globalAlpha=1;
}

function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
}

function drawBtn(ctx,x,y,w,h,text,name,color,active,big){
    G.btnRects[name]={x:x,y:y,w:w,h:h};
    ctx.fillStyle=color||'#d4a574';
    if(active){
        ctx.shadowBlur=15;ctx.shadowColor='#ffd700';
    }
    ctx.strokeStyle=active?'#ffd700':'#fff';
    ctx.lineWidth=active?3:2;
    roundRect(ctx,x,y,w,h,8);
    ctx.fill();ctx.stroke();
    ctx.shadowBlur=0;
    ctx.fillStyle='#fff';
    ctx.font='bold '+(big?20:17)+'px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(text,x+w/2,y+h/2);
    ctx.textBaseline='alphabetic';
}

function hitBtn(p,name){
    const r=G.btnRects[name];
    return r && p.x>=r.x && p.x<=r.x+r.w && p.y>=r.y && p.y<=r.y+r.h;
}

function getPos(e){
    const rect=canvas.getBoundingClientRect();
    const t=e.touches?e.touches[0]:e;
    return{x:(t.clientX-rect.left)/scale,y:(t.clientY-rect.top)/scale};
}

function getGridArea(){
    const s=G.gridSize;
    const cellSize=Math.min(300/s,40);
    const gw=cellSize*s;
    const gh=cellSize*s;
    const gx=(W-gw)/2+20;
    const gy=210;
    return{x:gx,y:gy,w:gw,h:gh,cell:cellSize};
}
function getColorSpoolArea(){return{x:15,y:210,w:55,h:390,itemH:65}}
function getPreviewArea(){
    const s=G.gridSize;
    const cell=Math.min(18,120/s);
    const pw=cell*s,ph=cell*s;
    return{x:W-pw-15,y:210,w:pw,h:ph,cell:cell};
}

window.addEventListener('keydown',function(e){
    G.keys[e.key.toLowerCase()]=true;
    if(e.key===' '||e.key==='Enter'){
        e.preventDefault();
        if(G.state===STATE_MENU||G.state===STATE_OVER){startGame();return}
        if(G.state===STATE_PLAYING&&!G.paused&&G.transition<=0){paintCell(G.cursorX,G.cursorY)}
    }
    if(e.key==='Escape'){
        e.preventDefault();
        if(G.state===STATE_PLAYING||G.paused)togglePause();
    }
    if(G.state===STATE_PLAYING&&!G.paused&&G.transition<=0){
        for(let i=1;i<=6;i++){
            if(e.key===String(i)){G.selectedColor=i-1;sfxPick();G.hintFlash=30;return}
        }
        if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'){G.cursorX=Math.max(0,G.cursorX-1)}
        if(e.key==='ArrowRight'||e.key==='d'||e.key==='D'){G.cursorX=Math.min(G.gridSize-1,G.cursorX+1)}
        if(e.key==='ArrowUp'||e.key==='w'||e.key==='W'){G.cursorY=Math.max(0,G.cursorY-1)}
        if(e.key==='ArrowDown'||e.key==='s'||e.key==='S'){G.cursorY=Math.min(G.gridSize-1,G.cursorY+1)}
        if(e.key==='h'||e.key==='H'){hintNextCell()}
    }
    initAudio();
});
window.addEventListener('keyup',function(e){
    G.keys[e.key.toLowerCase()]=false;
});

function hintNextCell(){
    if(G.hintFlash>0)return;
    usedHintThisLevel=true;
    for(let y=0;y<G.gridSize;y++){
        for(let x=0;x<G.gridSize;x++){
            const t=G.pattern.grid[y][x];
            if(t>=0&&G.playerGrid[y][x]!==t){
                G.hintFlash=90;
                G.cursorX=x;G.cursorY=y;
                addFloating(W/2,560,'💡 提示已标记','#29b6f6');
                sfxBtn();
                return;
            }
        }
    }
}

function getGridAt(p){
    const a=getGridArea();
    if(p.x<a.x||p.x>a.x+a.w||p.y<a.y||p.y>a.y+a.h)return null;
    const cx=Math.floor((p.x-a.x)/a.cell);
    const cy=Math.floor((p.y-a.y)/a.cell);
    if(cx<0||cx>=G.gridSize||cy<0||cy>=G.gridSize)return null;
    return{x:cx,y:cy};
}
function getColorAt(p){
    const a=getColorSpoolArea();
    if(p.x<a.x||p.x>a.x+a.w||p.y<a.y||p.y>a.y+a.h)return -1;
    const idx=Math.floor((p.y-a.y)/a.itemH);
    if(idx<0||idx>=6)return -1;
    return idx;
}

function paintCell(x,y){
    if(G.playerGrid[y][x]===G.selectedColor)return;
    const target=G.pattern.grid[y][x];
    const prev=G.playerGrid[y][x];
    const wasCorrect=prev===target;
    if(wasCorrect)G.correct--;
    G.playerGrid[y][x]=G.selectedColor;
    G.totalWeaves++;
    weavesThisLevel++;
    const a=getGridArea();
    const px=a.x+x*a.cell+a.cell/2;
    const py=a.y+y*a.cell+a.cell/2;
    const sp=getColorSpoolArea();
    const sx=sp.x+sp.w/2,sy=sp.y+G.selectedColor*sp.itemH+sp.itemH/2-8;
    const c=COLORS[G.selectedColor].hex;
    spawnThreadLine(sx,sy,px,py,c);
    if(weavesThisLevel===1)unlockAchievement('first_weave');
    if(G.selectedColor===target){
        G.correct++;
        G.totalCorrect++;
        G.combo++;
        G.maxCombo=Math.max(G.maxCombo,G.combo);
        if(G.combo===10)unlockAchievement('combo_10');
        if(G.combo===20)unlockAchievement('combo_20');
        const gain=5;
        G.score+=gain;
        G.levelScore+=gain;
        G.weaveFlash.push({x:x,y:y,life:25,color:c});
        spawnParticles(px,py,c,4);
        if(G.combo>0&&G.combo%5===0){
            addFloating(px,py-10,G.combo+'连击!','#ff9800',true);
            sfxCombo();
        }else{
            addFloating(px,py-4,'+'+gain,'#4caf50');
        }
        sfxWeave();
    }else{
        G.combo=0;
        G.errors++;
        G.score=Math.max(0,G.score-10);
        G.weaveFlash.push({x:x,y:y,life:35,color:'#ff5252'});
        spawnParticles(px,py,'#ff5252',6);
        addFloating(px,py-4,'-10','#f44336');
        sfxError();
    }
}

function handlePointerDown(e){
    initAudio();
    const p=getPos(e);
    if(G.state===STATE_MENU){
        if(hitBtn(p,'start')){startGame();return}
    }else if(G.state===STATE_PAUSE){
        if(hitBtn(p,'resume')){togglePause();return}
        if(hitBtn(p,'quit')){G.state=STATE_MENU;G.paused=false;sfxBtn();return}
    }else if(G.state===STATE_OVER){
        if(hitBtn(p,'restart')){startGame();return}
        if(hitBtn(p,'menu')){G.state=STATE_MENU;sfxBtn();return}
    }else if(G.state===STATE_PLAYING&&!G.paused&&G.transition<=0){
        const c=getColorAt(p);
        if(c>=0){G.selectedColor=c;sfxPick();G.hintFlash=25;return}
        const g=getGridAt(p);
        if(g){G.cursorX=g.x;G.cursorY=g.y;G.isPainting=true;paintCell(g.x,g.y)}
    }
}
function handlePointerMove(e){
    if(G.state!==STATE_PLAYING||G.paused||!G.isPainting||G.transition>0)return;
    const p=getPos(e);
    const g=getGridAt(p);
    if(g&&(G.lastCell===null||G.lastCell.x!==g.x||G.lastCell.y!==g.y)){
        G.cursorX=g.x;G.cursorY=g.y;
        paintCell(g.x,g.y);
        G.lastCell={x:g.x,y:g.y};
    }
}
function handlePointerUp(e){
    G.isPainting=false;G.lastCell=null;
}

canvas.addEventListener('mousedown',handlePointerDown);
canvas.addEventListener('mousemove',handlePointerMove);
canvas.addEventListener('mouseup',handlePointerUp);
canvas.addEventListener('mouseleave',handlePointerUp);
canvas.addEventListener('touchstart',function(e){e.preventDefault();handlePointerDown(e)},{passive:false});
canvas.addEventListener('touchmove',function(e){e.preventDefault();handlePointerMove(e)},{passive:false});
canvas.addEventListener('touchend',function(e){e.preventDefault();handlePointerUp(e)},{passive:false});

function startGame(){
    initAudio();
    G.state=STATE_PLAYING;
    G.level=0;
    G.totalScore=0;
    G.score=0;
    G.errors=0;
    G.paused=false;
    G.combo=0;G.maxCombo=0;
    G.totalWeaves=0;G.totalCorrect=0;
    particles=[];floatings=[];threadLines=[];achievementPopups=[];
    G.levelStars=[0,0,0];
    G.weaveFlash=[];
    milestoneTracker.lastHit=-1;
    for(let i=0;i<ACHIEVEMENTS.length;i++)ACHIEVEMENTS[i].unlocked=false;
    startLevel();
    sfxBtn();
}

function startLevel(){
    const lv=LEVELS[G.level];
    G.gridSize=lv.size;
    G.timeLeft=lv.time*60;
    const pats=PATTERNS[lv.size];
    G.pattern=pats[Math.floor(Math.random()*pats.length)];
    G.playerGrid=[];
    for(let y=0;y<lv.size;y++){
        G.playerGrid[y]=[];
        for(let x=0;x<lv.size;x++)G.playerGrid[y][x]=-1;
    }
    G.correct=0;
    G.errors=0;
    G.levelScore=0;
    G.selectedColor=0;
    G.cursorX=Math.floor(lv.size/2);
    G.cursorY=Math.floor(lv.size/2);
    G.isPainting=false;
    G.combo=0;G.weaveFlash=[];
    G.transition=90;
    G.transitionText=lv.name+' · '+G.pattern.name;
    weavesThisLevel=0;
    usedHintThisLevel=false;
    threadLines=[];
    sfxLevelUp();
}

function checkLevelComplete(){
    let total=0;
    for(let y=0;y<G.gridSize;y++){
        for(let x=0;x<G.gridSize;x++){
            if(G.pattern.grid[y][x]>=0)total++;
            if(G.pattern.grid[y][x]>=0&&G.playerGrid[y][x]!==G.pattern.grid[y][x])return false;
        }
    }
    return G.correct>=total;
}

function finishLevel(){
    const timeBonus=Math.ceil(G.timeLeft/60)*10;
    const errPenalty=G.errors*10;
    const comboBonus=G.maxCombo*2;
    const lvlScore=timeBonus+G.levelScore-errPenalty+comboBonus;
    const rewards=LEVELS[G.level].starsReward;
    let stars=0;
    if(lvlScore>=rewards[0])stars=1;
    if(lvlScore>=rewards[1])stars=2;
    if(lvlScore>=rewards[2])stars=3;
    G.levelStars[G.level]=stars;
    G.totalScore+=Math.max(0,lvlScore);
    G.score=G.totalScore;
    if(G.errors===0)unlockAchievement('no_error');
    if(!usedHintThisLevel)unlockAchievement('hint_hater');
    if(G.timeLeft/60>=40)unlockAchievement('speedster');
    if(weavesThisLevel>0&&G.totalWeaves>0&&G.totalCorrect===G.totalWeaves)unlockAchievement('perfectionist');
    addFloating(W/2,400,'时间奖励 +'+timeBonus,'#4caf50',true);
    setTimeout(()=>addFloating(W/2,440,stars>0?'⭐'.repeat(stars)+' 星!':'','#ffd700',true),250);
    if(stars>=3)sfxStar();
    sfxScore();
    spawnParticles(W/2,300,'#ffd700',40);
    G.level++;
    if(G.level>=LEVELS.length){
        setTimeout(function(){
            let totalStars=0;for(let i=0;i<3;i++)totalStars+=G.levelStars[i];
            if(totalStars===9)unlockAchievement('all_stars');
            endGame();
        },1200);
    }else{
        setTimeout(startLevel,1300);
    }
}

function endGame(){
    G.state=STATE_OVER;
    G.score=G.totalScore;
    if(G.score>G.highScore){
        G.highScore=G.score;
        Storage.save('weaver_high',G.highScore);
    }
    sfxBuzzer();
}

function togglePause(){
    G.paused=!G.paused;
    if(G.paused)G.state=STATE_PAUSE;
    else G.state=STATE_PLAYING;
    sfxBtn();
}

function update(){
    if(G.hintFlash>0)G.hintFlash--;
    for(let i=G.weaveFlash.length-1;i>=0;i--){G.weaveFlash[i].life--;if(G.weaveFlash[i].life<=0)G.weaveFlash.splice(i,1)}
    updateParticles();updateFloatings();updateThreadLines();updateAchievementPopups();
    if(G.transition>0){G.transition--;return}
    if(G.state!==STATE_PLAYING||G.paused)return;
    G.timeLeft--;
    checkMilestones(G.score);
    if(G.timeLeft<=0){
        if(G.level>=LEVELS.length-1){endGame();return}
        G.level++;startLevel();return;
    }
    if(checkLevelComplete())finishLevel();
}

function drawBg(ctx){
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#3e2723');g.addColorStop(1,'#1b0f0a');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(212,165,116,0.05)';
    for(let i=0;i<W;i+=20)ctx.fillRect(i,0,2,H);
    for(let i=0;i<H;i+=20){
        ctx.fillStyle=i%40===0?'rgba(121,85,72,0.05)':'rgba(121,85,72,0.02)';
        ctx.fillRect(0,i,W,2);
    }
    ctx.strokeStyle='rgba(255,215,0,0.03)';
    ctx.lineWidth=1;
    for(let i=-H;i<W+H;i+=60){
        ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i+H,H);ctx.stroke();
    }
}

function drawColorSpools(ctx){
    const a=getColorSpoolArea();
    ctx.fillStyle='rgba(255,255,255,0.04)';
    roundRect(ctx,a.x-6,a.y-6,a.w+12,a.h+12,10);ctx.fill();
    ctx.strokeStyle='rgba(212,165,116,0.25)';ctx.lineWidth=1;
    roundRect(ctx,a.x-6,a.y-6,a.w+12,a.h+12,10);ctx.stroke();
    for(let i=0;i<6;i++){
        const y=a.y+i*a.itemH;
        const sel=G.selectedColor===i;
        ctx.fillStyle=sel?'rgba(255,215,0,0.22)':'rgba(255,255,255,0.02)';
        roundRect(ctx,a.x,y,a.w,a.itemH-8,8);ctx.fill();
        if(sel){
            ctx.shadowBlur=12;ctx.shadowColor='#ffd700';
            ctx.strokeStyle='#ffd700';ctx.lineWidth=3;
            roundRect(ctx,a.x,y,a.w,a.itemH-8,8);ctx.stroke();
            ctx.shadowBlur=0;
        }
        const col=COLORS[i];
        const cx=a.x+a.w/2,cy=y+a.itemH/2-8;
        ctx.fillStyle=col.alt;
        ctx.beginPath();ctx.arc(cx+2,cy+3,17,0,Math.PI*2);ctx.fill();
        ctx.fillStyle=col.hex;
        ctx.beginPath();ctx.arc(cx,cy,17,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='#000';ctx.lineWidth=1.2;ctx.stroke();
        ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=1;
        ctx.beginPath();ctx.arc(cx-5,cy-5,5,0,Math.PI*1.7);ctx.stroke();
        ctx.fillStyle='#fff';
        ctx.font='bold 14px "Microsoft YaHei"';
        ctx.textAlign='center';
        ctx.fillText(col.name,cx,y+a.itemH-15);
        ctx.font='bold 11px Arial';
        ctx.fillStyle=sel?'#ffd700':'#aaa';
        ctx.fillText('['+(i+1)+']',cx,y+13);
    }
    ctx.textAlign='left';
}

function drawLoom(ctx){
    const a=getGridArea();
    ctx.fillStyle='#4e342e';
    roundRect(ctx,a.x-22,a.y-35,a.w+44,a.h+70,14);ctx.fill();
    ctx.strokeStyle='#2c1810';ctx.lineWidth=3;
    roundRect(ctx,a.x-22,a.y-35,a.w+44,a.h+70,14);ctx.stroke();
    ctx.fillStyle='#6d4c41';
    roundRect(ctx,a.x-16,a.y-28,a.w+32,14,5);ctx.fill();
    roundRect(ctx,a.x-16,a.y+a.h+14,a.w+32,14,5);ctx.fill();
    ctx.strokeStyle='#3e2723';ctx.lineWidth=1.5;
    roundRect(ctx,a.x-16,a.y-28,a.w+32,14,5);ctx.stroke();
    roundRect(ctx,a.x-16,a.y+a.h+14,a.w+32,14,5);ctx.stroke();
    for(let i=0;i<=G.gridSize;i++){
        const grad=ctx.createLinearGradient(a.x+i*a.cell,a.y-28,a.x+i*a.cell,a.y+a.h+20);
        grad.addColorStop(0,'#efebe9');grad.addColorStop(0.5,'#d7ccc8');grad.addColorStop(1,'#a1887f');
        ctx.strokeStyle=grad;ctx.lineWidth=1.8;
        ctx.beginPath();
        ctx.moveTo(a.x+i*a.cell,a.y-28);
        ctx.lineTo(a.x+i*a.cell,a.y+a.h+20);
        ctx.stroke();
    }
    for(let y=0;y<G.gridSize;y++){
        for(let x=0;x<G.gridSize;x++){
            const px=a.x+x*a.cell,py=a.y+y*a.cell;
            const c=G.playerGrid[y][x];
            if(c>=0){
                const cc=COLORS[c];
                ctx.fillStyle=cc.hex;
                ctx.fillRect(px+1,py+1,a.cell-2,a.cell-2);
                ctx.fillStyle='rgba(255,255,255,0.18)';
                ctx.fillRect(px+2,py+2,a.cell-4,Math.max(2,(a.cell-4)*0.3));
                ctx.fillStyle='rgba(0,0,0,0.12)';
                ctx.fillRect(px+2,py+a.cell-Math.max(3,(a.cell-4)*0.3),a.cell-4,Math.max(2,(a.cell-4)*0.25));
            }else{
                ctx.fillStyle='rgba(255,255,255,0.04)';
                ctx.fillRect(px+1,py+1,a.cell-2,a.cell-2);
            }
            ctx.strokeStyle='rgba(0,0,0,0.22)';ctx.lineWidth=1;
            ctx.strokeRect(px+0.5,py+0.5,a.cell-1,a.cell-1);
        }
    }
    for(const f of G.weaveFlash){
        const px=a.x+f.x*a.cell,py=a.y+f.y*a.cell;
        ctx.globalAlpha=f.life/35;
        ctx.strokeStyle=f.color;ctx.lineWidth=3;
        ctx.strokeRect(px+1,py+1,a.cell-2,a.cell-2);
        ctx.globalAlpha=1;
    }
    if(G.state===STATE_PLAYING&&!G.paused&&G.transition<=0){
        const cx=a.x+G.cursorX*a.cell,cy=a.y+G.cursorY*a.cell;
        const pulse=1+Math.sin(Date.now()/80)*0.08;
        ctx.save();
        ctx.translate(cx+a.cell/2,cy+a.cell/2);ctx.scale(pulse,pulse);
        ctx.strokeStyle='#ffd700';ctx.lineWidth=3;
        ctx.shadowBlur=8;ctx.shadowColor='#ffd700';
        ctx.strokeRect(-a.cell/2+1,-a.cell/2+1,a.cell-2,a.cell-2);
        ctx.shadowBlur=0;ctx.restore();
        if(G.hintFlash>0){
            ctx.strokeStyle='#29b6f6';ctx.lineWidth=4;
            ctx.globalAlpha=G.hintFlash/90;
            ctx.strokeRect(cx+1,cy+1,a.cell-2,a.cell-2);
            ctx.globalAlpha=1;
        }
    }
    ctx.fillStyle='#8d6e63';
    ctx.font='bold 14px "Microsoft YaHei"';
    ctx.textAlign='center';
    ctx.fillText('🧵 织布机 · 按 [H] 提示',a.x+a.w/2,a.y-12);
    ctx.textAlign='left';
}

function shadeHex(hex,pct){
    const n=parseInt(hex.slice(1),16);
    let r=(n>>16)&0xff,g=(n>>8)&0xff,b=n&0xff;
    r=Math.max(0,Math.min(255,Math.floor(r*(1+pct))));
    g=Math.max(0,Math.min(255,Math.floor(g*(1+pct))));
    b=Math.max(0,Math.min(255,Math.floor(b*(1+pct))));
    return'#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
}

function drawTransition(ctx){
    if(G.transition<=0)return;
    const r=G.transition/90;
    ctx.fillStyle='rgba(0,0,0,'+(0.7*Math.min(1,r*2))+')';
    ctx.fillRect(0,0,W,H);
    ctx.save();
    ctx.translate(W/2,H/2);
    const s=0.8+(1-r)*0.5;
    ctx.scale(s,s);
    ctx.globalAlpha=Math.min(1,r*2);
    ctx.fillStyle='#ffd700';
    ctx.font='bold 40px "Microsoft YaHei"';
    ctx.textAlign='center';
    ctx.fillText('✨ '+G.transitionText+' ✨',0,0);
    ctx.fillStyle='#d4a574';
    ctx.font='18px "Microsoft YaHei"';
    ctx.fillText('限时 '+LEVELS[G.level].time+' 秒 · 尺寸 '+G.gridSize+'×'+G.gridSize,0,40);
    ctx.restore();
    ctx.globalAlpha=1;
    ctx.textAlign='left';
}

function drawMenu(ctx){
    drawBg(ctx);
    ctx.fillStyle='rgba(0,0,0,0.35)';
    ctx.fillRect(0,0,W,H);
    const t=Date.now()/1000;
    for(let i=0;i<12;i++){
        const x=((i*83+t*15)%(W+100))-50;
        const y=100+(i*53)%500;
        ctx.globalAlpha=0.35;
        ctx.fillStyle=COLORS[i%6].hex;
        const sz=10+(i%3)*4;
        ctx.beginPath();ctx.arc(x,y,sz,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
    ctx.fillStyle='#d4a574';
    ctx.font='bold 54px "Microsoft YaHei"';
    ctx.textAlign='center';
    const tp=1+Math.sin(t*2)*0.03;
    ctx.save();ctx.translate(W/2,140);ctx.scale(tp,tp);
    ctx.fillText('🧵 织布工坊',0,0);
    ctx.restore();
    ctx.fillStyle='#a1887f';
    ctx.font='bold 22px Arial';
    ctx.fillText('WEAVER WORKSHOP',W/2,178);
    const demoY=255,cs=28;
    const demoColors=['#e74c3c','#f1c40f','#3498db','#27ae60','#ecf0f1','#2c3e50'];
    for(let i=0;i<6;i++){
        for(let k=0;k<4;k++){
            ctx.fillStyle=demoColors[(i+k)%6];
            ctx.fillRect(W/2-3*cs+i*cs,demoY+k*cs,cs-1,cs-1);
        }
    }
    ctx.strokeStyle='rgba(212,165,116,0.4)';ctx.lineWidth=2;
    ctx.strokeRect(W/2-3*cs-3,demoY-3,6*cs+5,4*cs+5);
    const unlockedCount=ACHIEVEMENTS.filter(a=>a.unlocked).length;
    ctx.fillStyle='#ffd700';
    ctx.font='bold 16px "Microsoft YaHei"';
    ctx.fillText('🏅 已解锁成就: '+unlockedCount+'/'+ACHIEVEMENTS.length,W/2,405);
    ctx.fillStyle='#ffd700';
    ctx.font='bold 20px "Microsoft YaHei"';
    ctx.fillText('🏆 最高分: '+G.highScore,W/2,445);
    drawBtn(ctx,W/2-110,475,220,64,'开始织造','start','#d4a574',false,true);
    const ax=20,ay=555,aw=W-40,ah=24;
    ctx.fillStyle='rgba(0,0,0,0.35)';
    roundRect(ctx,ax,ay-4,aw,ah*ACHIEVEMENTS.length+12,8);ctx.fill();
    for(let i=0;i<ACHIEVEMENTS.length;i++){
        const a=ACHIEVEMENTS[i];
        const ry=ay+i*ah;
        ctx.fillStyle=a.unlocked?'rgba(255,215,0,0.2)':'rgba(255,255,255,0.04)';
        roundRect(ctx,ax+3,ry,aw-6,ah-4,6);ctx.fill();
        ctx.font='16px Arial';ctx.textAlign='left';
        ctx.fillStyle=a.unlocked?'#ffd700':'#555';
        ctx.fillText(a.icon,ax+10,ry+16);
        ctx.font='bold 11px "Microsoft YaHei"';
        ctx.fillStyle=a.unlocked?'#fff':'#888';
        ctx.fillText(a.name,ax+32,ry+13);
        ctx.font='10px "Microsoft YaHei"';
        ctx.fillStyle=a.unlocked?'#d4a574':'#555';
        ctx.fillText(a.desc,ax+110,ry+13);
    }
    ctx.fillStyle='#d7ccc8';
    ctx.font='15px "Microsoft YaHei"';
    ctx.textAlign='center';
    ctx.fillText('🎯 3关挑战 · 完成订单图案获取三星评价',W/2,755);
    ctx.fillStyle='#a1887f';
    ctx.font='13px "Microsoft YaHei"';
    ctx.fillText('🖱️ 点击左侧线轴选色 → 点击织布格上色 拖动可连涂',W/2,778);
    ctx.textAlign='left';
}

function drawGame(ctx){
    drawBg(ctx);
    drawHUD(ctx);
    drawColorSpools(ctx);
    drawLoom(ctx);
    drawPreview(ctx);
    drawThreadLines(ctx);
    drawParticles(ctx);
    drawFloatings(ctx);
    drawAchievementPopups(ctx);
    drawTransition(ctx);
    if(G.state===STATE_PAUSE){
        ctx.fillStyle='rgba(0,0,0,0.78)';
        ctx.fillRect(0,0,W,H);
        ctx.fillStyle='#fff';
        ctx.font='bold 46px "Microsoft YaHei"';
        ctx.textAlign='center';
        ctx.fillText('⏸ 暂停中',W/2,H/2-120);
        ctx.fillStyle='#a1887f';
        ctx.font='16px "Microsoft YaHei"';
        ctx.fillText('按 ESC 或点击按钮继续',W/2,H/2-85);
        ctx.fillStyle='#d7ccc8';
        ctx.font='13px "Microsoft YaHei"';
        ctx.fillText('📊 当前状态',W/2,H/2-50);
        ctx.fillStyle='#fff';
        ctx.font='14px "Microsoft YaHei"';
        ctx.fillText('关卡: '+LEVELS[G.level].name+'  分数: '+G.score+'  剩余: '+Math.ceil(G.timeLeft/60)+'s',W/2,H/2-25);
        ctx.fillText('连击: '+G.combo+'  错误: '+G.errors+'  正确: '+G.correct,W/2,H/2-5);
        drawBtn(ctx,W/2-90,H/2+20,180,58,'▶ 继续织造','resume','#d4a574');
        drawBtn(ctx,W/2-75,H/2+100,150,48,'🏠 返回菜单','quit','#795548');
        ctx.fillStyle='#8d6e63';
        ctx.font='11px "Microsoft YaHei"';
        ctx.fillText('快捷键: 1-6选色 · H提示 · ↑↓←→移动 · Enter织 · Esc暂停',W/2,H/2+180);
        ctx.textAlign='left';
    }
}

function drawGameOver(ctx){
    drawBg(ctx);
    ctx.fillStyle='rgba(62,39,35,0.92)';
    ctx.fillRect(0,0,W,H);
    const isNew=G.score>=G.highScore&&G.score>0;
    ctx.fillStyle=isNew?'#ffd700':'#d4a574';
    ctx.font='bold 50px "Microsoft YaHei"';
    ctx.textAlign='center';
    const p=1+Math.sin(Date.now()/200)*0.04;
    ctx.save();ctx.translate(W/2,130);ctx.scale(p,p);
    ctx.fillText(isNew?'🏆 新纪录!':'织造结束',0,0);
    ctx.restore();
    ctx.fillStyle='#fff';
    ctx.font='bold 22px "Microsoft YaHei"';
    ctx.fillText('总得分',W/2,195);
    ctx.fillStyle='#ffd700';
    ctx.font='bold 78px Arial';
    ctx.fillText(G.score,W/2,275);
    let stars=0;for(let i=0;i<3;i++)stars+=G.levelStars[i];
    if(stars>0){
        ctx.fillStyle='#ffeb3b';
        ctx.font='bold 30px Arial';
        ctx.fillText('⭐'.repeat(stars)+' 总星数 '+stars+'/9',W/2,320);
    }
    const unlockedNow=ACHIEVEMENTS.filter(a=>a.unlocked).length;
    if(unlockedNow>0){
        ctx.fillStyle='#ff9800';
        ctx.font='bold 15px "Microsoft YaHei"';
        ctx.fillText('🏅 本局解锁成就: '+unlockedNow+'/'+ACHIEVEMENTS.length,W/2,352);
    }
    ctx.fillStyle='#d7ccc8';
    ctx.font='15px "Microsoft YaHei"';
    ctx.fillText('到达关卡: '+Math.min(G.level+1,LEVELS.length)+'/'+LEVELS.length
        +'   操作: '+G.totalWeaves+' 次   正确: '+G.totalCorrect,W/2,388);
    ctx.fillText('最多连击: '+G.maxCombo+'   总失误: '+G.errors
        +'   正确率: '+(G.totalWeaves>0?Math.floor(G.totalCorrect/G.totalWeaves*100):0)+'%',W/2,412);
    const accRate=G.totalWeaves>0?G.totalCorrect/G.totalWeaves:0;
    let grade='C',gradeColor='#9e9e9e';
    if(accRate>=0.95&&stars>=7){grade='S';gradeColor='#ffd700'}
    else if(accRate>=0.85&&stars>=5){grade='A';gradeColor='#4caf50'}
    else if(accRate>=0.7){grade='B';gradeColor='#2196f3'}
    ctx.font='bold 40px Arial';
    ctx.fillStyle=gradeColor;
    ctx.fillText('评级: '+grade,W/2,452);
    ctx.fillStyle='#ffd700';
    ctx.font='bold 20px "Microsoft YaHei"';
    ctx.fillText('🏆 历史最高: '+G.highScore,W/2,492);
    const ua=ACHIEVEMENTS.filter(x=>x.unlocked);
    if(ua.length>0){
        ctx.fillStyle='rgba(0,0,0,0.4)';
        roundRect(ctx,20,670,W-40,58,8);ctx.fill();
        ctx.fillStyle='#ffd700';
        ctx.font='bold 12px "Microsoft YaHei"';
        ctx.textAlign='left';
        ctx.fillText('🏅 本局解锁成就:',30,690);
        for(let i=0;i<Math.min(4,ua.length);i++){
            ctx.font='15px Arial';
            ctx.fillStyle='#ffd700';
            ctx.fillText(ua[i].icon,30+i*112,712);
            ctx.font='bold 10px "Microsoft YaHei"';
            ctx.fillStyle='#fff';
            ctx.fillText(ua[i].name,52+i*112,712);
        }
    }
    drawBtn(ctx,W/2-95,532,190,60,'再玩一次','restart','#d4a574',false,true);
    drawBtn(ctx,W/2-75,607,150,48,'返回菜单','menu','#795548');
    ctx.textAlign='left';
}

function draw(){
    ctx.clearRect(0,0,W,H);
    switch(G.state){
        case STATE_MENU: drawMenu(ctx); break;
        case STATE_PLAYING: drawGame(ctx); break;
        case STATE_PAUSE: drawGame(ctx); break;
        case STATE_OVER: drawGameOver(ctx); break;
    }
}

let loopId;
function gameLoop(){
    loopId=requestAnimationFrame(gameLoop);
    update();
    draw();
}
gameLoop();

})();
</script>

    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {

  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };

  });
})();
