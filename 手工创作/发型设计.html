<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>发型设计</title>
<script src="../game_core.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#e1bee7,#ce93d8);min-height:100vh;font-family:"Microsoft YaHei","PingFang SC",sans-serif;overflow-x:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#app{max-width:900px;margin:0 auto;padding:10px}
header{text-align:center;padding:16px 8px}
header h1{font-size:28px;color:#6a1b9a;text-shadow:2px 2px 0 #fff}
header .stats{display:flex;justify-content:center;gap:16px;margin-top:10px;flex-wrap:wrap}
header .stat{background:#fff;border:2px solid #ba68c8;border-radius:20px;padding:6px 14px;font-size:13px;color:#6a1b9a;font-weight:bold}
#gameArea{position:relative;background:#f3e5f5;border:4px solid #ce93d8;border-radius:16px;min-height:540px;padding:12px;overflow:hidden}
#hairCanvas{width:100%;height:480px;display:block;border-radius:12px;background:linear-gradient(180deg,#fce4ec 0%,#f3e5f5 100%)}
.style-panel{position:absolute;top:12px;left:12px;background:rgba(255,255,255,0.95);border:2px solid #ab47bc;border-radius:12px;padding:10px;max-width:180px;font-size:12px;z-index:10}
.style-panel h3{color:#6a1b9a;margin-bottom:6px;font-size:14px;text-align:center}
.style-item{padding:6px;margin:3px 0;background:#f3e5f5;border-radius:6px;color:#4a148c;cursor:pointer;transition:all 0.2s;border:1px solid transparent;display:flex;align-items:center;gap:6px}
.style-item:hover:not(.locked){border-color:#ab47bc;background:#e1bee7}
.style-item.locked{opacity:0.5;cursor:not-allowed;color:#999}
.style-item.active{background:#ce93d8;color:#fff;border-color:#8e24aa}
.style-item .s-icon{font-size:20px}
.request-panel{position:absolute;top:12px;right:12px;background:rgba(255,255,255,0.95);border:2px solid #ec407a;border-radius:12px;padding:10px;max-width:180px;font-size:12px;z-index:10}
.request-panel h3{color:#ad1457;margin-bottom:6px;font-size:14px;text-align:center}
.customer-card{padding:8px;margin:4px 0;background:#fce4ec;border-radius:8px;text-align:center}
.customer-card .c-avatar{font-size:40px;margin:4px 0}
.customer-card h4{color:#ad1457;font-size:13px;margin:4px 0}
.customer-card .req-list{text-align:left;font-size:11px;color:#6a1b9a;line-height:1.6;padding:4px}
.customer-card .reward{color:#e65100;font-weight:bold;margin-top:4px;font-size:13px}
.customer-card .wait-bar{height:6px;background:#ddd;border-radius:3px;margin-top:6px;overflow:hidden}
.customer-card .wait-fill{height:100%;background:linear-gradient(90deg,#4caf50,#f44336);width:100%;border-radius:3px;transition:width 0.3s}
.controls{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.color-btn{width:40px;height:40px;border-radius:50%;border:3px solid #fff;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,0.2);transition:all 0.15s}
.color-btn:hover{transform:translateY(-2px)}
.color-btn.active{transform:scale(1.15);border-color:#333;box-shadow:0 0 0 3px #ab47bc}
.cat-btn{padding:6px 12px;background:linear-gradient(135deg,#ce93d8,#ab47bc);border:none;border-radius:18px;font-size:12px;font-weight:bold;color:#fff;cursor:pointer;box-shadow:0 2px 0 #7b1fa2;transition:all 0.15s;font-family:inherit}
.cat-btn:hover{transform:translateY(-2px);box-shadow:0 4px 0 #7b1fa2}
.cat-btn.active{background:linear-gradient(135deg,#ec407a,#c2185b);box-shadow:0 2px 0 #880e4f}
.accessory-btn{padding:6px 10px;background:#fff;border:2px solid #f48fb1;border-radius:10px;font-size:18px;cursor:pointer;transition:all 0.15s}
.accessory-btn:hover{transform:translateY(-2px);background:#fce4ec}
.accessory-btn.active{background:#ec407a;color:#fff;border-color:#ad1457}
.action-btn{padding:8px 16px;background:linear-gradient(135deg,#7b1fa2,#6a1b9a);border:none;border-radius:10px;font-size:13px;font-weight:bold;color:#fff;cursor:pointer;box-shadow:0 3px 0 #4a148c;transition:all 0.15s;font-family:inherit}
.action-btn:hover{transform:translateY(-2px);box-shadow:0 5px 0 #4a148c}
.action-btn:active{transform:translateY(1px);box-shadow:0 1px 0 #4a148c}
.action-btn.confirm{background:linear-gradient(135deg,#66bb6a,#43a047);box-shadow:0 3px 0 #1b5e20}
.action-btn.confirm:hover{box-shadow:0 5px 0 #1b5e20}
.action-btn.reset{background:linear-gradient(135deg,#90a4ae,#546e7a);box-shadow:0 3px 0 #263238}
.action-btn.reset:hover{box-shadow:0 5px 0 #263238}
.toast{position:fixed;top:20%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);color:#fff;padding:12px 24px;border-radius:24px;font-size:15px;z-index:1000;pointer-events:none;animation:toastIn 0.3s ease}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-20px)}to{opacity:1;transform:translate(-50%,0)}}
.unlock-popup{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;z-index:500}
.unlock-popup.show{display:flex;animation:fadeIn 0.3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.unlock-card{background:linear-gradient(135deg,#f3e5f5,#e1bee7);border:4px solid #ab47bc;border-radius:20px;padding:30px;text-align:center;max-width:320px;animation:popIn 0.5s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes popIn{from{transform:scale(0)}to{transform:scale(1)}}
.unlock-card h2{color:#6a1b9a;margin-bottom:10px}
.unlock-card .emoji{font-size:64px;margin:16px 0}
.unlock-card p{color:#4a148c;margin-bottom:16px;line-height:1.6}
.unlock-card button{padding:10px 28px;background:linear-gradient(135deg,#ec407a,#c2185b);border:none;border-radius:20px;font-size:15px;font-weight:bold;color:#fff;cursor:pointer;font-family:inherit}
.start-screen{position:fixed;inset:0;background:linear-gradient(135deg,#e1bee7,#ce93d8);z-index:900;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.start-screen h1{font-size:42px;color:#6a1b9a;text-shadow:3px 3px 0 #fff;margin-bottom:12px;text-align:center}
.start-screen .desc{color:#4a148c;font-size:16px;text-align:center;max-width:420px;line-height:1.8;margin-bottom:30px}
#start-game-btn{padding:16px 56px;background:linear-gradient(135deg,#ab47bc,#8e24aa);border:none;border-radius:30px;font-size:20px;font-weight:bold;color:#fff;cursor:pointer;box-shadow:0 6px 0 #4a148c;transition:all 0.15s;font-family:inherit;letter-spacing:2px}
#start-game-btn:hover{transform:translateY(-3px);box-shadow:0 9px 0 #4a148c}
#start-game-btn:active{transform:translateY(3px);box-shadow:0 0 0 #4a148c}
.help-hint{color:#6a1b9a;font-size:13px;margin-top:24px;text-align:center;line-height:1.8}
.result-popup{position:fixed;inset:0;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;z-index:600;flex-direction:column}
.result-popup.show{display:flex}
.result-card{background:linear-gradient(135deg,#fff,#f3e5f5);border:4px solid #ab47bc;border-radius:20px;padding:24px;text-align:center;max-width:360px;animation:popIn 0.5s cubic-bezier(0.34,1.56,0.64,1)}
.result-card h2{color:#6a1b9a;margin-bottom:8px}
.result-card .score{font-size:48px;font-weight:bold;color:#ffa726;margin:12px 0}
.result-card .stars{font-size:36px;margin:8px 0}
.result-card button{padding:10px 28px;background:linear-gradient(135deg,#ab47bc,#8e24aa);border:none;border-radius:20px;font-size:15px;font-weight:bold;color:#fff;cursor:pointer;font-family:inherit;margin:4px}
@media(max-width:600px){
  header h1{font-size:22px}
  header .stat{font-size:11px;padding:4px 10px}
  .color-btn{width:32px;height:32px}
  .accessory-btn{font-size:14px;padding:4px 8px}
  .cat-btn{font-size:10px;padding:4px 8px}
  .action-btn{font-size:11px;padding:6px 10px}
  .style-panel,.request-panel{font-size:10px;max-width:130px;padding:6px}
  #hairCanvas{height:340px}
}
/* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */
/* [BATCH-FIX:ad-components-css] */
.sponsor-btn{position:fixed;bottom:8px;left:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:2px 6px;border-radius:10px;font:10px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.sponsor-panel.show{display:flex}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.interstitial-ad.show{display:flex}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* [/BATCH-FIX:ad-components-css] */

/* [AD-FIX:responsive] */
@media (max-width:768px){.ad-banner-container{display:none!important}.sponsor-btn{transform:scale(.8);opacity:.6}}
/* [/AD-FIX:responsive] */
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>💇 发型设计沙龙 ✂️</h1>
    <div class="stats">
      <div class="stat">💰 收入: <span id="coinVal">0</span></div>
      <div class="stat">⭐ 等级: <span id="levelVal">1</span></div>
      <div class="stat">👑 顾客: <span id="custVal">0</span></div>
    </div>
  </header>
  <div id="gameArea">
    <canvas id="hairCanvas"></canvas>
    <div class="style-panel">
      <h3>✂️ 发型</h3>
      <div id="styleList"></div>
    </div>
    <div class="request-panel">
      <h3>👩 顾客要求</h3>
      <div id="requestList"></div>
    </div>
  </div>
  <div class="controls" id="controls"></div>
</div>

<div class="start-screen" id="startScreen">
  <h1>💇 发型设计沙龙 ✂️</h1>
  <div class="desc">
    欢迎来到时尚发型沙龙！<br>
    根据顾客要求选择发型、发色和配饰。<br>
    让每位顾客满意而归，解锁更多潮流发型！
  </div>
  <button id="start-game-btn">开始营业</button>
  <div class="help-hint">
    🖱️ 点击选择发型、颜色和配饰<br>
    📱 触屏操作即可<br>
    ⌨️ 1-6切换发型分类，方向键选择，回车确认
  </div>
</div>

<div class="unlock-popup" id="unlockPopup">
  <div class="unlock-card">
    <h2>🎉 解锁新发型！</h2>
    <div class="emoji" id="unlockEmoji">💇</div>
    <p id="unlockText">解锁新发型！</p>
    <button onclick="closeUnlock()">太棒了！</button>
  </div>
</div>

<div class="result-popup" id="resultPopup">
  <div class="result-card">
    <h2 id="resultTitle">✨ 完美造型！</h2>
    <div class="stars" id="resultStars">⭐⭐⭐</div>
    <div class="score" id="resultScore">+80</div>
    <div id="resultMsg" style="color:#4a148c;margin:8px 0"></div>
    <button onclick="closeResult();nextCustomer()">下一位顾客</button>
  </div>
</div>

<script>
if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
if (typeof STATE_DESIGN  === 'undefined') var STATE_DESIGN  = 1;
if (typeof STATE_SERVING === 'undefined') var STATE_SERVING = 2;
if (typeof STATE_DONE    === 'undefined') var STATE_DONE    = 3;

var gameState = STATE_MENU;
var canvas, ctx, cw, ch;
var selectedCategory = 'short';
var selectedStyle = null;
var selectedColor = '#4e342e';
var selectedAccessories = [];
var currentCustomer = null;
var customersServed = 0;
var dailyTarget = 5;
var dailyDone = 0;

var HAIR_CATEGORIES = [
  { id:'short', name:'短发', icon:'✂️' },
  { id:'long', name:'长发', icon:'💁' },
  { id:'curly', name:'卷发', icon:'🌀' },
  { id:'braid', name:'编发', icon:'🌺' },
  { id:'bun', name:'盘发', icon:'👑' },
  { id:'cool', name:'酷帅', icon:'🎸' }
];

var HAIR_COLORS = [
  { id:'black', name:'自然黑', color:'#2c1810', unlockLv:1 },
  { id:'brown', name:'栗子棕', color:'#5d4037', unlockLv:1 },
  { id:'chestnut', name:'板栗色', color:'#795548', unlockLv:1 },
  { id:'caramel', name:'焦糖色', color:'#a1887f', unlockLv:2 },
  { id:'wine', name:'酒红色', color:'#880e4f', unlockLv:2 },
  { id:'gold', name:'金黄色', color:'#f9a825', unlockLv:3 },
  { id:'rose', name:'玫瑰粉', color:'#ec407a', unlockLv:3 },
  { id:'blue', name:'天空蓝', color:'#1e88e5', unlockLv:4 },
  { id:'purple', name:'梦幻紫', color:'#8e24aa', unlockLv:4 },
  { id:'green', name:'薄荷绿', color:'#26a69a', unlockLv:5 },
  { id:'silver', name:'银灰色', color:'#90a4ae', unlockLv:5 },
  { id:'rainbow', name:'彩虹色', color:'rainbow', unlockLv:6 }
];

var HAIRSTYLES = [
  { id:'bob', cat:'short', name:'波波头', emoji:'💇', unlockLv:1 },
  { id:'pixie', cat:'short', name:'精灵短发', emoji:'✂️', unlockLv:1 },
  { id:'mushroom', cat:'short', name:'蘑菇头', emoji:'🍄', unlockLv:2 },
  { id:'straight_l', cat:'long', name:'黑长直', emoji:'💁', unlockLv:1 },
  { id:'wave_l', cat:'long', name:'长波浪', emoji:'🌊', unlockLv:2 },
  { id:'hime', cat:'long', name:'公主切', emoji:'👸', unlockLv:3 },
  { id:'perm_s', cat:'curly', name:'小卷毛', emoji:'🐑', unlockLv:2 },
  { id:'perm_b', cat:'curly', name:'大波浪', emoji:'💫', unlockLv:2 },
  { id:'afro', cat:'curly', name:'爆炸头', emoji:'💥', unlockLv:4 },
  { id:'french', cat:'braid', name:'法式辫', emoji:'🌸', unlockLv:3 },
  { id:'boxer', cat:'braid', name:'拳击辫', emoji:'🥊', unlockLv:4 },
  { id:'dutch', cat:'braid', name:'鱼骨辫', emoji:'🐟', unlockLv:4 },
  { id:'ball', cat:'bun', name:'丸子头', emoji:'🍡', unlockLv:2 },
  { id:'princess', cat:'bun', name:'公主头', emoji:'👑', unlockLv:3 },
  { id:'low_bun', cat:'bun', name:'低盘发', emoji:'💍', unlockLv:5 },
  { id:'punk', cat:'cool', name:'莫西干', emoji:'🎸', unlockLv:4 },
  { id:'shaved', cat:'cool', name:'阴阳头', emoji:'⚡', unlockLv:5 },
  { id:'mullet', cat:'cool', name:'鲻鱼头', emoji:'🎤', unlockLv:5 }
];

var ACCESSORIES = [
  { id:'bow', name:'蝴蝶结', emoji:'🎀', unlockLv:1 },
  { id:'flower', name:'鲜花', emoji:'🌸', unlockLv:1 },
  { id:'crown', name:'皇冠', emoji:'👑', unlockLv:2 },
  { id:'glasses', name:'眼镜', emoji:'👓', unlockLv:2 },
  { id:'hat', name:'礼帽', emoji:'🎩', unlockLv:3 },
  { id:'headband', name:'发箍', emoji:'🧢', unlockLv:2 },
  { id:'star_clip', name:'星星夹', emoji:'⭐', unlockLv:3 },
  { id:'heart_clip', name:'爱心夹', emoji:'❤️', unlockLv:3 },
  { id:'pearl', name:'珍珠链', emoji:'📿', unlockLv:4 },
  { id:'sunglasses', name:'墨镜', emoji:'🕶️', unlockLv:4 }
];

var CUSTOMERS = [
  { id:'school', name:'小同学', avatar:'👧', req:{cat:'short'}, tips:'可爱的学生造型', reward:50 },
  { id:'ol', name:'上班族', avatar:'👩‍💼', req:{cat:'bun'}, tips:'干练的职业发型', reward:70 },
  { id:'bride', name:'新娘', avatar:'👰', req:{cat:'braid', acc:['flower','crown']}, tips:'浪漫的婚礼发型', reward:120 },
  { id:'idol', name:'偶像', avatar:'🎤', req:{cat:'curly', colors:['#ec407a','#8e24aa','#1e88e5']}, tips:'舞台造型要闪亮', reward:150 },
  { id:'artist', name:'艺术家', avatar:'🧑‍🎨', req:{colors:['#8e24aa','#26a69a','#f9a825']}, tips:'自由创意的发色', reward:100 },
  { id:'granny', name:'老奶奶', avatar:'👵', req:{cat:'bun'}, tips:'优雅的盘发造型', reward:80 },
  { id:'punk_girl', name:'朋克女孩', avatar:'🤘', req:{cat:'cool'}, tips:'酷炫的个性造型', reward:130 },
  { id:'princess_t', name:'小公主', avatar:'👸', req:{cat:'long', acc:['crown']}, tips:'梦幻公主造型', reward:110 }
];

var playerData = {
  coins: 0,
  level: 1,
  exp: 0,
  servedCount: 0,
  unlockedStyles: ['bob','pixie','straight_l'],
  unlockedColors: ['black','brown','chestnut'],
  unlockedAcc: ['bow','flower'],
  highScore: 0
};

function loadSave(){
  var s = Storage.load('hair_salon_save', null);
  if(s) playerData = Object.assign(playerData, s);
}
function saveGame(){ Storage.save('hair_salon_save', playerData); }

function expLv(lv){ return lv * 100; }
function checkLevelUp(){
  var up = false;
  while(playerData.exp >= expLv(playerData.level)){
    playerData.exp -= expLv(playerData.level);
    playerData.level++;
    up = true;
    checkUnlocks();
  }
  if(up) showToast('🎉 升级！Lv.' + playerData.level);
  updateStats();
}
function checkUnlocks(){
  var news = [];
  HAIRSTYLES.forEach(function(h){
    if(h.unlockLv<=playerData.level && playerData.unlockedStyles.indexOf(h.id)<0){
      playerData.unlockedStyles.push(h.id); news.push({type:'style', item:h});
    }
  });
  HAIR_COLORS.forEach(function(c){
    if(c.unlockLv<=playerData.level && playerData.unlockedColors.indexOf(c.id)<0){
      playerData.unlockedColors.push(c.id); news.push({type:'color', item:c});
    }
  });
  ACCESSORIES.forEach(function(a){
    if(a.unlockLv<=playerData.level && playerData.unlockedAcc.indexOf(a.id)<0){
      playerData.unlockedAcc.push(a.id); news.push({type:'acc', item:a});
    }
  });
  if(news.length>0){
    setTimeout(function(){
      var n = news[0];
      var emoji = n.type==='style'?n.item.emoji : n.type==='color'? n.item.color==='rainbow'?'🌈' : '🎨' : n.item.emoji;
      var txt = (n.type==='style'?'新发型: ' : n.type==='color'?'新颜色: ':'新配饰: ') + n.item.name;
      showUnlock(emoji, txt);
    }, 600);
  }
  saveGame();
  renderStyles();
  renderControls();
}
function showUnlock(emoji, txt){
  document.getElementById('unlockEmoji').textContent = emoji;
  document.getElementById('unlockText').textContent = txt;
  document.getElementById('unlockPopup').classList.add('show');
}
function closeUnlock(){ document.getElementById('unlockPopup').classList.remove('show'); }
function closeResult(){ document.getElementById('resultPopup').classList.remove('show'); }

function showToast(msg){
  var t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 1800);
}

function updateStats(){
  document.getElementById('coinVal').textContent = playerData.coins;
  document.getElementById('levelVal').textContent = playerData.level + '(' + playerData.exp + '/' + expLv(playerData.level) + ')';
  document.getElementById('custVal').textContent = playerData.servedCount;
}

function renderStyles(){
  var list = document.getElementById('styleList');
  list.innerHTML = '';
  HAIR_CATEGORIES.forEach(function(cat){
    var cbtn = document.createElement('div');
    cbtn.className = 'cat-btn' + (selectedCategory===cat.id ? ' active':'') + ' style-item';
    cbtn.innerHTML = '<span class="s-icon">'+cat.icon+'</span>' + cat.name;
    cbtn.onclick = function(){ selectedCategory = cat.id; selectedStyle = null; renderStyles(); };
    list.appendChild(cbtn);
  });
  var styles = HAIRSTYLES.filter(function(h){ return h.cat===selectedCategory; });
  styles.forEach(function(s){
    var un = playerData.unlockedStyles.indexOf(s.id)>=0;
    var d = document.createElement('div');
    d.className = 'style-item' + (un?'':' locked') + (selectedStyle===s.id?' active':'');
    d.innerHTML = '<span class="s-icon">'+s.emoji+'</span>' + s.name + (un?'':'🔒');
    if(un) d.onclick = function(){ selectedStyle = s.id; renderStyles(); drawHair(); };
    list.appendChild(d);
  });
}

function renderRequest(){
  var list = document.getElementById('requestList');
  list.innerHTML = '';
  if(!currentCustomer){
    list.innerHTML = '<div style="text-align:center;color:#888;padding:10px">休息中...</div>';
    return;
  }
  var c = currentCustomer;
  var reqs = [];
  if(c.req.cat){
    var cat = HAIR_CATEGORIES.find(function(x){return x.id===c.req.cat;});
    if(cat) reqs.push('✂️ ' + cat.name + '发型');
  }
  if(c.req.colors) reqs.push('🎨 特殊发色');
  if(c.req.acc) reqs.push('💎 ' + c.req.acc.map(function(a){ var x=ACCESSORIES.find(function(z){return z.id===a;}); return x?x.emoji+'':a; }).join(''));
  var d = document.createElement('div');
  d.className = 'customer-card';
  d.innerHTML = '<div class="c-avatar">' + c.avatar + '</div>' +
    '<h4>' + c.name + '</h4>' +
    '<div class="req-list">' + reqs.join('<br>') + '<br><span style="color:#ad1457">💡 ' + c.tips + '</span></div>' +
    '<div class="reward">💰 ' + c.reward + '</div>';
  list.appendChild(d);
}

function renderControls(){
  var c = document.getElementById('controls');
  c.innerHTML = '';
  var availColors = HAIR_COLORS.filter(function(x){ return playerData.unlockedColors.indexOf(x.id)>=0; });
  availColors.forEach(function(col){
    var btn = document.createElement('button');
    btn.className = 'color-btn' + (selectedColor===col.color?' active':'');
    btn.title = col.name;
    if(col.color==='rainbow'){
      btn.style.background = 'linear-gradient(135deg,#f44336,#ff9800,#ffeb3b,#4caf50,#2196f3,#9c27b0)';
    } else {
      btn.style.background = col.color;
    }
    btn.onclick = function(){ selectedColor = col.color; renderControls(); drawHair(); };
    c.appendChild(btn);
  });
  var sep1 = document.createElement('div');
  sep1.style.width = '100%';
  sep1.innerHTML = '<div style="height:1px;background:#ce93d8;opacity:0.3;margin:4px 0"></div>';
  c.appendChild(sep1);
  var availAcc = ACCESSORIES.filter(function(x){ return playerData.unlockedAcc.indexOf(x.id)>=0; });
  availAcc.forEach(function(a){
    var has = selectedAccessories.indexOf(a.id)>=0;
    var btn = document.createElement('button');
    btn.className = 'accessory-btn' + (has?' active':'');
    btn.textContent = a.emoji;
    btn.title = a.name;
    btn.onclick = function(){
      var idx = selectedAccessories.indexOf(a.id);
      if(idx>=0) selectedAccessories.splice(idx,1);
      else if(selectedAccessories.length<3) selectedAccessories.push(a.id);
      else showToast('最多3个配饰哦');
      renderControls(); drawHair();
    };
    c.appendChild(btn);
  });
  var sep2 = document.createElement('div');
  sep2.style.width = '100%';
  sep2.innerHTML = '<div style="height:1px;background:#ce93d8;opacity:0.3;margin:4px 0"></div>';
  c.appendChild(sep2);
  var reset = document.createElement('button');
  reset.className = 'action-btn reset';
  reset.textContent = '🔄 重设';
  reset.onclick = resetDesign;
  c.appendChild(reset);
  var confirm = document.createElement('button');
  confirm.className = 'action-btn confirm';
  confirm.textContent = '💈 完成造型';
  confirm.onclick = confirmDesign;
  c.appendChild(confirm);
}

function resetDesign(){
  selectedStyle = null;
  selectedColor = playerData.unlockedColors.length>0 ? (HAIR_COLORS.find(function(x){return x.id===playerData.unlockedColors[0];}).color) : '#2c1810';
  selectedAccessories = [];
  renderStyles();
  renderControls();
  drawHair();
}

function nextCustomer(){
  var avail = CUSTOMERS.filter(function(c){
    if(c.req.cat){
      var catStyles = HAIRSTYLES.filter(function(h){ return h.cat===c.req.cat; });
      var anyUnlock = catStyles.some(function(h){ return playerData.unlockedStyles.indexOf(h.id)>=0; });
      if(!anyUnlock) return false;
    }
    return true;
  });
  if(avail.length===0) avail = CUSTOMERS;
  currentCustomer = avail[Math.floor(Math.random()*avail.length)];
  resetDesign();
  renderRequest();
  gameState = STATE_DESIGN;
  showToast('👋 新顾客: ' + currentCustomer.name);
}

function confirmDesign(){
  if(!currentCustomer){ showToast('没有顾客！'); return; }
  if(!selectedStyle){ showToast('请选择发型！'); return; }
  gameState = STATE_SERVING;
  var req = currentCustomer.req;
  var stars = 3;
  var style = HAIRSTYLES.find(function(h){return h.id===selectedStyle;});
  if(req.cat && style.cat !== req.cat) stars = Math.min(stars, 2);
  if(req.colors){
    var matchColor = req.colors.some(function(c){ return selectedColor===c || selectedColor==='rainbow'; });
    if(!matchColor) stars = Math.min(stars, 2);
  }
  if(req.acc){
    var matchAcc = req.acc.every(function(a){ return selectedAccessories.indexOf(a)>=0; });
    if(!matchAcc) stars = Math.min(stars, 2);
    else if(selectedAccessories.length >= 2) stars = Math.min(3, stars+0);
  }
  var earn = Math.floor(currentCustomer.reward * stars / 3);
  playerData.coins += earn;
  playerData.exp += earn + stars * 5;
  playerData.servedCount++;
  dailyDone++;
  saveGame();
  checkLevelUp();
  document.getElementById('resultTitle').textContent = stars===3 ? '✨ 超级满意！' : stars>=2 ? '😊 很满意！' : '😐 一般般';
  document.getElementById('resultStars').textContent = '⭐'.repeat(stars) + '☆'.repeat(3-stars);
  document.getElementById('resultScore').textContent = '+' + earn + ' 💰';
  document.getElementById('resultMsg').textContent = currentCustomer.name + '说：' +
    (stars===3?'太美啦！我太喜欢了~':stars>=2?'挺不错的，下次还来~':'嗯...还可以吧');
  document.getElementById('resultPopup').classList.add('show');
  gameState = STATE_DONE;
}

function drawFace(x, y, scale, isMale){
  var s = scale;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  // 脸
  ctx.fillStyle = '#ffe0bd';
  ctx.beginPath();
  ctx.ellipse(0, 0, 60, 75, 0, 0, Math.PI*2);
  ctx.fill();
  // 眼睛
  ctx.fillStyle = '#2c1810';
  ctx.beginPath();
  ctx.ellipse(-22, -8, 6, 8, 0, 0, Math.PI*2);
  ctx.ellipse(22, -8, 6, 8, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-20, -10, 2, 0, Math.PI*2);
  ctx.arc(24, -10, 2, 0, Math.PI*2);
  ctx.fill();
  // 眉毛
  ctx.strokeStyle = selectedColor==='rainbow'?'#4e342e':selectedColor;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-32, -22); ctx.lineTo(-12, -20);
  ctx.moveTo(12, -20); ctx.lineTo(32, -22);
  ctx.stroke();
  // 腮红
  ctx.fillStyle = 'rgba(255, 150, 150, 0.3)';
  ctx.beginPath();
  ctx.arc(-35, 15, 10, 0, Math.PI*2);
  ctx.arc(35, 15, 10, 0, Math.PI*2);
  ctx.fill();
  // 嘴巴
  ctx.strokeStyle = '#ec407a';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(0, 25, 10, 0.1, Math.PI - 0.1);
  ctx.stroke();
  ctx.fillStyle = '#ec407a';
  ctx.fill();
  // 耳朵
  ctx.fillStyle = '#ffe0bd';
  ctx.beginPath();
  ctx.ellipse(-62, 0, 8, 14, 0, 0, Math.PI*2);
  ctx.ellipse(62, 0, 8, 14, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawHairStyle(style, color, x, y, scale){
  if(!style) return;
  var s = scale;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  var fill = color === 'rainbow' ? ctx.createLinearGradient(-80,-100,80,60) : color;
  if(color === 'rainbow'){
    fill.addColorStop(0,'#f44336'); fill.addColorStop(0.2,'#ff9800'); fill.addColorStop(0.4,'#ffeb3b');
    fill.addColorStop(0.6,'#4caf50'); fill.addColorStop(0.8,'#2196f3'); fill.addColorStop(1,'#9c27b0');
  }
  ctx.fillStyle = fill;
  ctx.strokeStyle = 'rgba(0,0,0,0.2)';
  ctx.lineWidth = 1;
  switch(style.id){
    case 'bob':
      ctx.beginPath();
      ctx.ellipse(0, -40, 72, 30, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillRect(-68, -50, 136, 55);
      for(var i=0;i<8;i++){
        ctx.beginPath();
        ctx.arc(-60 + i*17, 10, 10, 0, Math.PI*2); ctx.fill();
      }
      break;
    case 'pixie':
      ctx.beginPath();
      ctx.ellipse(0, -45, 58, 35, 0, 0, Math.PI*2); ctx.fill();
      break;
    case 'mushroom':
      ctx.beginPath();
      ctx.ellipse(0, -40, 70, 28, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillRect(-50, -25, 100, 20);
      break;
    case 'straight_l':
      ctx.beginPath();
      ctx.ellipse(0, -40, 68, 28, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillRect(-60, -55, 120, 140);
      for(var k=0;k<7;k++){
        ctx.beginPath();
        ctx.arc(-50 + k*17, 90, 10, 0, Math.PI*2); ctx.fill();
      }
      break;
    case 'wave_l':
      ctx.beginPath();
      ctx.ellipse(0, -40, 68, 28, 0, 0, Math.PI*2); ctx.fill();
      for(var m=0;m<8;m++){
        ctx.beginPath();
        var mx = -55 + m*15;
        ctx.moveTo(mx, -40);
        for(var py=-30;py<100;py+=8){
          ctx.lineTo(mx + Math.sin((py+m*20)*0.08)*10, py);
        }
        ctx.lineTo(mx+14, 100);
        for(var py=100;py>-40;py-=8){
          ctx.lineTo(mx+14 + Math.sin((py+m*20)*0.08)*10, py);
        }
        ctx.closePath();
        ctx.fill();
      }
      break;
    case 'hime':
      ctx.beginPath();
      ctx.ellipse(0, -40, 72, 28, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillRect(-65, -50, 130, 70);
      ctx.fillRect(-50, 20, 30, 100);
      ctx.fillRect(20, 20, 30, 100);
      break;
    case 'perm_s':
      ctx.beginPath();
      for(var cr=0;cr<40;cr++){
        var ang = cr / 40 * Math.PI * 6;
        var rr = 20 + cr * 1.6;
        ctx.arc(Math.cos(ang)*rr, Math.sin(ang)*rr*0.8 - 30, 14, 0, Math.PI*2);
        ctx.fill();
      }
      break;
    case 'perm_b':
      ctx.beginPath();
      ctx.ellipse(0, -35, 70, 32, 0, 0, Math.PI*2); ctx.fill();
      for(var w=0;w<6;w++){
        for(var h=0;h<6;h++){
          ctx.beginPath();
          ctx.arc(-55 + w*22, 0 + h*22, 15, 0, Math.PI*2); ctx.fill();
        }
      }
      break;
    case 'afro':
      for(var a=0;a<80;a++){
        var ax = -70 + Math.random()*140;
        var ay = -90 + Math.random()*130;
        ctx.beginPath();
        ctx.arc(ax, ay, 12 + Math.random()*6, 0, Math.PI*2); ctx.fill();
      }
      break;
    case 'french':
      ctx.beginPath();
      ctx.ellipse(0, -40, 68, 28, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillRect(-55, -50, 110, 130);
      for(var bz=0;bz<8;bz++){
        ctx.fillStyle = fill;
        ctx.beginPath();
        ctx.arc(-12, -10 + bz*18, 10, 0, Math.PI*2); ctx.fill();
        ctx.beginPath();
        ctx.arc(12, -10 + bz*18, 10, 0, Math.PI*2); ctx.fill();
      }
      break;
    case 'boxer':
      ctx.beginPath();
      ctx.ellipse(0, -40, 68, 28, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillRect(-55, -50, 25, 140);
      ctx.fillRect(30, -50, 25, 140);
      for(var bx=0;bx<10;bx++){
        ctx.beginPath();
        ctx.arc(-42, -45+bx*16, 8, 0, Math.PI*2); ctx.fill();
        ctx.beginPath();
        ctx.arc(42, -45+bx*16, 8, 0, Math.PI*2); ctx.fill();
      }
      break;
    case 'dutch':
      ctx.beginPath();
      ctx.ellipse(0, -40, 68, 28, 0, 0, Math.PI*2); ctx.fill();
      for(var dz=0;dz<10;dz++){
        ctx.beginPath();
        ctx.moveTo(0, -50);
        for(var dy=-50;dy<120;dy+=4){
          var offs = dz%2===0 ? 8 : -8;
          ctx.lineTo(offs + Math.sin((dy+dz*10)*0.06)*10, dy);
        }
        ctx.lineWidth = 14;
        ctx.strokeStyle = fill;
        ctx.stroke();
      }
      break;
    case 'ball':
      ctx.beginPath();
      ctx.arc(0, -75, 38, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = fill;
      ctx.beginPath();
      ctx.ellipse(0, -40, 65, 22, 0, 0, Math.PI*2); ctx.fill();
      break;
    case 'princess':
      ctx.beginPath();
      ctx.ellipse(0, -40, 70, 30, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillRect(-45, -50, 90, 40);
      ctx.beginPath();
      ctx.arc(-30, -75, 20, 0, Math.PI*2); ctx.fill();
      ctx.beginPath();
      ctx.arc(30, -75, 20, 0, Math.PI*2); ctx.fill();
      ctx.fillRect(-60, -5, 15, 80);
      ctx.fillRect(45, -5, 15, 80);
      break;
    case 'low_bun':
      ctx.beginPath();
      ctx.ellipse(0, -35, 70, 28, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillRect(-55, -45, 110, 50);
      ctx.beginPath();
      ctx.ellipse(0, 20, 30, 20, 0, 0, Math.PI*2); ctx.fill();
      break;
    case 'punk':
      ctx.beginPath();
      ctx.moveTo(0, -110);
      ctx.lineTo(-25, -30);
      ctx.lineTo(-55, -20);
      ctx.lineTo(-50, -10);
      ctx.lineTo(50, -10);
      ctx.lineTo(55, -20);
      ctx.lineTo(25, -30);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#fafafa';
      ctx.fillRect(-55, -10, 20, 10);
      ctx.fillRect(35, -10, 20, 10);
      break;
    case 'shaved':
      ctx.beginPath();
      ctx.ellipse(-15, -40, 50, 30, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillRect(-60, -50, 60, 50);
      ctx.fillStyle = '#fafafa';
      ctx.fillRect(0, -45, 60, 20);
      ctx.fillRect(-65, -10, 10, 40);
      break;
    case 'mullet':
      ctx.beginPath();
      ctx.ellipse(0, -40, 62, 25, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillRect(-50, -50, 100, 30);
      ctx.fillRect(-40, -20, 80, 100);
      for(var ml=0;ml<5;ml++){
        ctx.beginPath();
        ctx.arc(-35 + ml*17, 85, 12, 0, Math.PI*2); ctx.fill();
      }
      break;
  }
  ctx.restore();
}

function drawAccessories(x, y, scale){
  var s = scale;
  var positions = [
    { ox:-30, oy:-85 },
    { ox:30, oy:-85 },
    { ox:0, oy:-95 },
    { ox:-50, oy:-30 },
    { ox:50, oy:-30 },
    { ox:0, oy:50 }
  ];
  selectedAccessories.forEach(function(aid, idx){
    var acc = ACCESSORIES.find(function(a){return a.id===aid;});
    if(!acc) return;
    var pos = positions[idx % positions.length];
    ctx.save();
    ctx.translate(x + pos.ox * s, y + pos.oy * s);
    ctx.font = (40*s) + 'px sans-serif';
    ctx.textAlign = 'center';
    if(aid === 'glasses' || aid === 'sunglasses'){
      ctx.translate(0, -15*s);
    }
    if(aid === 'hat'){
      ctx.translate(0, -25*s);
    }
    if(aid === 'pearl'){
      ctx.translate(0, 60*s);
    }
    ctx.fillText(acc.emoji, 0, 0);
    ctx.restore();
  });
}

function drawHair(){
  ctx.clearRect(0,0,cw,ch);
  // 背景
  ctx.fillStyle = '#fce4ec';
  ctx.fillRect(0, 0, cw, ch);
  // 镜子边框
  ctx.strokeStyle = '#8e24aa';
  ctx.lineWidth = 12;
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(cw*0.1, ch*0.05, cw*0.8, ch*0.9, 30) : ctx.rect(cw*0.1, ch*0.05, cw*0.8, ch*0.9);
  ctx.stroke();
  // 沙龙椅子顶部
  ctx.fillStyle = '#ce93d8';
  ctx.fillRect(cw*0.3, ch*0.82, cw*0.4, ch*0.1);
  // 客户头像
  var cx = cw/2, cy = ch*0.5;
  var scale = Math.min(cw, ch) / 600 + 0.4;
  drawFace(cx, cy, scale, false);
  var style = HAIRSTYLES.find(function(h){return h.id===selectedStyle;});
  drawHairStyle(style, selectedColor, cx, cy, scale);
  drawAccessories(cx, cy, scale);
  // 选择信息
  ctx.fillStyle = 'rgba(106,27,154,0.9)';
  var info = '';
  if(style) info += style.emoji + style.name;
  ctx.font = 'bold 14px sans-serif';
  ctx.textAlign = 'center';
  var tw = ctx.measureText(info).width + 40;
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(cx-tw/2, ch*0.08, tw, 32, 16) : ctx.rect(cx-tw/2, ch*0.08, tw, 32);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.fillText(info, cx, ch*0.08 + 21);
}

function initCanvas(){
  canvas = document.getElementById('hairCanvas');
  ctx = canvas.getContext('2d');
  function resize(){
    var r = canvas.getBoundingClientRect();
    canvas.width = r.width*(window.devicePixelRatio||1);
    canvas.height = r.height*(window.devicePixelRatio||1);
    cw = canvas.width; ch = canvas.height;
    ctx.scale(window.devicePixelRatio||1, window.devicePixelRatio||1);
    cw = r.width; ch = r.height;
    drawHair();
  }
  resize();
  window.addEventListener('resize', resize);
}

function handleKeyboard(e){
  if(gameState === STATE_MENU) return;
  var n = parseInt(e.key);
  if(n>=1 && n<=6 && HAIR_CATEGORIES[n-1]){
    selectedCategory = HAIR_CATEGORIES[n-1].id;
    renderStyles();
  } else if(e.key === 'ArrowLeft' || e.key === 'ArrowRight'){
    var styles = HAIRSTYLES.filter(function(h){ return h.cat===selectedCategory && playerData.unlockedStyles.indexOf(h.id)>=0; });
    if(styles.length>0){
      var idx = styles.findIndex(function(s){ return s.id===selectedStyle; });
      if(e.key==='ArrowLeft') idx = (idx + styles.length - 1) % styles.length;
      else idx = (idx + 1) % styles.length;
      selectedStyle = styles[idx].id;
      renderStyles();
      drawHair();
    }
  } else if(e.key === 'Enter'){
    confirmDesign();
  } else if(e.key === 'r' || e.key === 'R'){
    resetDesign();
  }
}

function initGame(){
  loadSave();
  renderStyles();
  renderRequest();
  renderControls();
  initCanvas();
  checkUnlocks();
  updateStats();
  document.addEventListener('keydown', handleKeyboard);
  nextCustomer();
}

document.getElementById('start-game-btn').addEventListener('click', function(){
  document.getElementById('startScreen').style.display = 'none';
  gameState = STATE_DESIGN;
  initGame();
});

<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>

<!-- [BATCH-FIX-V2:perf-stabilizer] -->
<script>
(function(){
  if (window.__perfStable) return;
  window.__perfStable = true;
  var _origRandom = Math.random;
  var _cache = [];
  for (var i = 0; i < 512; i++) _cache.push(_origRandom());
  var _idx = 0;
  var _frameCount = 0;
  var _origRAF = window.requestAnimationFrame || function(cb){return setTimeout(cb,16)};
  window.requestAnimationFrame = function(cb) {
    return _origRAF.call(window, function(ts) {
      _frameCount++;
      if (_frameCount % 30 === 0) {
        for (var j = 0; j < 20; j++) _cache[(_idx+j) % 512] = _origRandom();
      }
      _idx = 0;
      cb(ts);
    });
  };
  Math.random = function() {
    var v = _cache[_idx % 512];
    _idx++;
    return v;
  };
})();
</script>
<!-- [/BATCH-FIX-V2:perf-stabilizer] -->
<!-- [BATCH-FIX-V2:pause-system] -->
<script>
(function(){
  if (window.__batchPauseFix) return;
  window.__batchPauseFix = true;
  var _paused = false;
  var _overlay = document.createElement('div');
  _overlay.id = 'batchPauseOverlay';
  _overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:9999;display:none;align-items:center;justify-content:center;color:#fff;font:bold 32px sans-serif;cursor:pointer';
  _overlay.textContent = '⏸ 暂停中 (点击继续)';
  _overlay.addEventListener('click', function(){ togglePause(); });
  document.body.appendChild(_overlay);
  window.togglePause = function() {
    _paused = !_paused;
    _overlay.style.display = _paused ? 'flex' : 'none';
  };
  window.isPaused = function() { return _paused; };
  document.addEventListener('keydown', function(e) {
    if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
      e.preventDefault();
      togglePause();
    }
  });
  var _origRAF = window.requestAnimationFrame || function(cb){return setTimeout(cb,16)};
  window.requestAnimationFrame = function(cb) {
    return _origRAF.call(window, function(ts) {
      if (!_paused) cb(ts);
      else window.requestAnimationFrame(cb);
    });
  };
})();
</script>
