<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>汉堡制作工坊</title>
<script src="../game_core.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#ffe0b2,#ffcc80);min-height:100vh;font-family:"Microsoft YaHei","PingFang SC",sans-serif;overflow-x:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#app{max-width:900px;margin:0 auto;padding:10px}
header{text-align:center;padding:16px 8px}
header h1{font-size:28px;color:#e65100;text-shadow:2px 2px 0 #fff3e0}
header .stats{display:flex;justify-content:center;gap:16px;margin-top:10px;flex-wrap:wrap}
header .stat{background:#fff;border:2px solid #ffb74d;border-radius:20px;padding:6px 14px;font-size:13px;color:#e65100;font-weight:bold}
#gameArea{position:relative;background:#fff8e1;border:4px solid #ffb74d;border-radius:16px;min-height:520px;padding:12px;overflow:hidden}
#burgerCanvas{width:100%;height:440px;display:block;border-radius:12px;background:linear-gradient(180deg,#fffde7 0%,#ffecb3 100%)}
.menu-panel{position:absolute;top:12px;right:12px;background:rgba(255,255,255,0.95);border:2px solid #ff7043;border-radius:12px;padding:10px;max-width:200px;font-size:12px;z-index:10}
.menu-panel h3{color:#d84315;margin-bottom:6px;font-size:14px;text-align:center}
.menu-item{padding:6px;margin:4px 0;background:#fff3e0;border-radius:6px;color:#bf360c;cursor:pointer;transition:all 0.2s;border:1px solid transparent}
.menu-item:hover:not(.locked){border-color:#ff7043;transform:translateX(-2px)}
.menu-item.locked{opacity:0.5;cursor:not-allowed;color:#999}
.menu-item.active{background:#ffe0b2;border-color:#ff7043}
.order-area{position:absolute;top:12px;left:12px;background:rgba(255,255,255,0.95);border:2px solid #66bb6a;border-radius:12px;padding:10px;max-width:200px;font-size:12px;z-index:10}
.order-area h3{color:#2e7d32;margin-bottom:6px;font-size:14px;text-align:center}
.order-card{padding:8px;margin:4px 0;background:#e8f5e9;border-radius:8px;color:#1b5e20}
.order-card h4{font-size:13px;margin-bottom:4px}
.order-card .ings{font-size:10px;color:#388e3c;margin:4px 0}
.order-card .price{color:#e65100;font-weight:bold;text-align:right;margin-top:4px}
.order-card .tbar{height:6px;background:#ddd;border-radius:3px;margin-top:4px;overflow:hidden}
.order-card .tfill{height:100%;background:linear-gradient(90deg,#66bb6a,#ef5350);width:100%;border-radius:3px;transition:width 0.3s}
.controls{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;justify-content:center}
.ing-btn{padding:8px 10px;background:linear-gradient(135deg,#ffcc80,#ffa726);border:none;border-radius:10px;font-size:12px;font-weight:bold;color:#bf360c;cursor:pointer;box-shadow:0 3px 0 #f57c00;transition:all 0.15s;min-width:70px;font-family:inherit}
.ing-btn:hover{transform:translateY(-2px);box-shadow:0 5px 0 #f57c00}
.ing-btn:active{transform:translateY(1px);box-shadow:0 1px 0 #f57c00}
.action-btn{padding:8px 14px;background:linear-gradient(135deg,#66bb6a,#43a047);border:none;border-radius:10px;font-size:13px;font-weight:bold;color:#fff;cursor:pointer;box-shadow:0 3px 0 #2e7d32;transition:all 0.15s;font-family:inherit}
.action-btn:hover{transform:translateY(-2px);box-shadow:0 5px 0 #2e7d32}
.action-btn:active{transform:translateY(1px);box-shadow:0 1px 0 #2e7d32}
.action-btn.serve{background:linear-gradient(135deg,#ab47bc,#8e24aa);box-shadow:0 3px 0 #6a1b9a}
.action-btn.serve:hover{box-shadow:0 5px 0 #6a1b9a}
.action-btn.trash{background:linear-gradient(135deg,#ef5350,#e53935);box-shadow:0 3px 0 #c62828}
.action-btn.trash:hover{box-shadow:0 5px 0 #c62828}
.toast{position:fixed;top:20%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);color:#fff;padding:12px 24px;border-radius:24px;font-size:15px;z-index:1000;pointer-events:none;animation:toastIn 0.3s ease}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-20px)}to{opacity:1;transform:translate(-50%,0)}}
.unlock-popup{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;z-index:500}
.unlock-popup.show{display:flex;animation:fadeIn 0.3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.unlock-card{background:linear-gradient(135deg,#fff8e1,#ffecb3);border:4px solid #ffa726;border-radius:20px;padding:30px;text-align:center;max-width:320px;animation:popIn 0.5s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes popIn{from{transform:scale(0)}to{transform:scale(1)}}
.unlock-card h2{color:#ef6c00;margin-bottom:10px}
.unlock-card .emoji{font-size:64px;margin:16px 0}
.unlock-card p{color:#e65100;margin-bottom:16px;line-height:1.6}
.unlock-card button{padding:10px 28px;background:linear-gradient(135deg,#66bb6a,#43a047);border:none;border-radius:20px;font-size:15px;font-weight:bold;color:#fff;cursor:pointer;font-family:inherit}
.start-screen{position:fixed;inset:0;background:linear-gradient(135deg,#ffe0b2,#ffcc80);z-index:900;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.start-screen h1{font-size:42px;color:#e65100;text-shadow:3px 3px 0 #fff3e0;margin-bottom:12px;text-align:center}
.start-screen .desc{color:#bf360c;font-size:16px;text-align:center;max-width:420px;line-height:1.8;margin-bottom:30px}
#start-game-btn{padding:16px 56px;background:linear-gradient(135deg,#ff7043,#f4511e);border:none;border-radius:30px;font-size:20px;font-weight:bold;color:#fff;cursor:pointer;box-shadow:0 6px 0 #bf360c;transition:all 0.15s;font-family:inherit;letter-spacing:2px}
#start-game-btn:hover{transform:translateY(-3px);box-shadow:0 9px 0 #bf360c}
#start-game-btn:active{transform:translateY(3px);box-shadow:0 0 0 #bf360c}
.help-hint{color:#e65100;font-size:13px;margin-top:24px;text-align:center;line-height:1.8}
.layer-drop{position:absolute;font-size:28px;pointer-events:none;animation:dropIn 0.4s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes dropIn{from{transform:translateY(-80px) scale(0.3);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
.grill-sizzle{animation:sizzle 0.15s ease-in-out infinite}
@keyframes sizzle{0%,100%{transform:translate(0,0)}25%{transform:translate(-1px,1px)}50%{transform:translate(1px,-1px)}75%{transform:translate(-1px,-1px)}}
.game-over{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:800;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;color:#fff}
.game-over.show{display:flex}
.game-over h2{font-size:36px;margin:0}
.game-over .score-big{font-size:48px;color:#ffd54f;font-weight:bold}
.game-over button{padding:14px 40px;background:linear-gradient(135deg,#66bb6a,#43a047);border:none;border-radius:20px;font-size:16px;font-weight:bold;color:#fff;cursor:pointer;font-family:inherit}
@media(max-width:600px){
  header h1{font-size:22px}
  header .stat{font-size:11px;padding:4px 10px}
  .ing-btn{font-size:10px;padding:6px 8px;min-width:54px}
  .action-btn{font-size:11px;padding:6px 10px}
  .menu-panel,.order-area{font-size:10px;max-width:130px;padding:6px}
  #burgerCanvas{height:320px}
}
/* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */
/* [BATCH-FIX:ad-components-css] */
.sponsor-btn{position:fixed;bottom:8px;left:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:2px 6px;border-radius:10px;font:10px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.sponsor-panel.show{display:flex}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.interstitial-ad.show{display:flex}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* [/BATCH-FIX:ad-components-css] */

/* [AD-FIX:responsive] */
@media (max-width:768px){.ad-banner-container{display:none!important}.sponsor-btn{transform:scale(.8);opacity:.6}}
/* [/AD-FIX:responsive] */
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🍔 汉堡制作工坊 🍟</h1>
    <div class="stats">
      <div class="stat">💰 营业额: <span id="coinVal">0</span></div>
      <div class="stat">⭐ 等级: <span id="levelVal">1</span></div>
      <div class="stat">🍔 售出: <span id="soldVal">0</span></div>
      <div class="stat">🔥 连击: <span id="comboVal">0</span>x</div>
    </div>
  </header>
  <div id="gameArea">
    <canvas id="burgerCanvas"></canvas>
    <div class="menu-panel">
      <h3>📖 菜单图鉴</h3>
      <div id="menuList"></div>
    </div>
    <div class="order-area">
      <h3>📋 顾客订单</h3>
      <div id="orderList"></div>
    </div>
  </div>
  <div class="controls" id="controls"></div>
</div>

<div class="start-screen" id="startScreen">
  <h1>🍔 汉堡制作工坊 🍟</h1>
  <div class="desc">
    制作美味汉堡，满足每一位顾客！<br>
    按照订单要求，从下到上叠加食材。<br>
    快速出餐获得连击奖励，解锁更多汉堡种类！
  </div>
  <button id="start-game-btn">开始营业</button>
  <div class="help-hint">
    🖱️ 点击食材叠加，点击出餐完成订单<br>
    📱 触屏操作即可<br>
    ⌨️ 1-8选食材，回车出餐，R重做
  </div>
</div>

<div class="unlock-popup" id="unlockPopup">
  <div class="unlock-card">
    <h2>🎉 解锁新菜品！</h2>
    <div class="emoji" id="unlockEmoji">🍔</div>
    <p id="unlockText">解锁新汉堡配方！</p>
    <button onclick="closeUnlock()">太棒了！</button>
  </div>
</div>

<div class="game-over" id="gameOver">
  <h2 id="overTitle">🎯 挑战完成！</h2>
  <div>本局营业额</div>
  <div class="score-big" id="finalScore">0</div>
  <div id="overMsg" style="color:#aaa"></div>
  <button onclick="restartGame()">🔄 再来一局</button>
</div>

<script>
if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
if (typeof STATE_GRILL   === 'undefined') var STATE_GRILL   = 2;
if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 3;

var gameState = STATE_MENU;
var canvas, ctx, cw, ch;
var burgerLayers = [];
var orders = [];
var gameTimer = null;
var roundTime = 90;
var timeLeft = 90;
var roundTarget = 6;
var roundDone = 0;
var combo = 0;
var isGrilling = false;

var BURGERS = [
  { id:'classic', name:'经典汉堡', emoji:'🍔', layers:['底层面包','牛肉饼','生菜','番茄','芝士','上面面包'], price:20, exp:15, unlockLv:1 },
  { id:'cheese', name:'芝士汉堡', emoji:'🧀', layers:['底层面包','牛肉饼','芝士','芝士','洋葱','上面面包'], price:25, exp:18, unlockLv:1 },
  { id:'bacon', name:'培根堡', emoji:'🥓', layers:['底层面包','牛肉饼','培根','生菜','芝士','上面面包'], price:30, exp:22, unlockLv:2 },
  { id:'fish', name:'鱼排堡', emoji:'🐟', layers:['底层面包','鱼排','生菜','塔塔酱','上面面包'], price:28, exp:20, unlockLv:2 },
  { id:'chicken', name:'鸡肉堡', emoji:'🍗', layers:['底层面包','鸡肉饼','生菜','番茄','蛋黄酱','上面面包'], price:26, exp:18, unlockLv:3 },
  { id:'veggie', name:'蔬菜堡', emoji:'🥗', layers:['底层面包','蔬菜饼','生菜','番茄','黄瓜','牛油果','上面面包'], price:24, exp:22, unlockLv:3 },
  { id:'double', name:'双层牛肉堡', emoji:'🍔', layers:['底层面包','牛肉饼','芝士','牛肉饼','培根','生菜','芝士','上面面包'], price:45, exp:35, unlockLv:4 },
  { id:'spicy', name:'香辣鸡腿堡', emoji:'🌶️', layers:['底层面包','辣鸡排','生菜','番茄','辣酱','上面面包'], price:32, exp:25, unlockLv:4 },
  { id:'bbq', name:'BBQ烤肋堡', emoji:'🍖', layers:['底层面包','烤肋排','培根','洋葱','BBQ酱','上面面包'], price:50, exp:40, unlockLv:5 },
  { id:'mega', name:'超级巨无霸', emoji:'👑', layers:['底层面包','牛肉饼','芝士','培根','牛肉饼','生菜','番茄','洋葱','芝士','上面面包'], price:80, exp:60, unlockLv:6 }
];

var INGREDIENTS = [
  { id:'bun_bot', name:'底层面包', emoji:'🍞', color:'#d4a574' },
  { id:'bun_top', name:'上面面包', emoji:'🍞', color:'#d4a574' },
  { id:'beef', name:'牛肉饼', emoji:'🥩', color:'#8b4513' },
  { id:'chicken_p', name:'鸡肉饼', emoji:'🍗', color:'#daa520' },
  { id:'fish', name:'鱼排', emoji:'🐟', color:'#f5deb3' },
  { id:'veggie', name:'蔬菜饼', emoji:'🥦', color:'#6b8e23' },
  { id:'spicy_chk', name:'辣鸡排', emoji:'🌶️', color:'#dc143c' },
  { id:'ribs', name:'烤肋排', emoji:'🍖', color:'#8b0000' },
  { id:'cheese', name:'芝士', emoji:'🧀', color:'#ffd700' },
  { id:'bacon', name:'培根', emoji:'🥓', color:'#b22222' },
  { id:'lettuce', name:'生菜', emoji:'🥬', color:'#32cd32' },
  { id:'tomato', name:'番茄', emoji:'🍅', color:'#ff6347' },
  { id:'onion', name:'洋葱', emoji:'🧅', color:'#e6e6fa' },
  { id:'cucumber', name:'黄瓜', emoji:'🥒', color:'#98fb98' },
  { id:'avocado', name:'牛油果', emoji:'🥑', color:'#9acd32' },
  { id:'tartar', name:'塔塔酱', emoji:'🥛', color:'#fffacd' },
  { id:'mayo', name:'蛋黄酱', emoji:'🥛', color:'#fff8dc' },
  { id:'spicy_s', name:'辣酱', emoji:'🌶️', color:'#ff4500' },
  { id:'bbq_s', name:'BBQ酱', emoji:'🍯', color:'#8b4513' }
];

var playerData = {
  coins: 0,
  level: 1,
  exp: 0,
  soldCount: 0,
  highScore: 0,
  unlocked: ['classic','cheese']
};

function loadSave(){
  var s = Storage.load('burger_workshop_save', null);
  if(s) playerData = Object.assign(playerData, s);
}
function saveGame(){ Storage.save('burger_workshop_save', playerData); }

function expLv(lv){ return lv * 100; }
function checkLevelUp(){
  var up = false;
  while(playerData.exp >= expLv(playerData.level)){
    playerData.exp -= expLv(playerData.level);
    playerData.level++;
    up = true;
    checkUnlocks();
  }
  if(up) showToast('🎉 升级 Lv.' + playerData.level);
  updateStats();
}
function checkUnlocks(){
  var news = [];
  BURGERS.forEach(function(b){
    if(b.unlockLv <= playerData.level && playerData.unlocked.indexOf(b.id)<0){
      playerData.unlocked.push(b.id);
      news.push(b);
    }
  });
  if(news.length>0) setTimeout(function(){ showUnlock(news[0]); }, 500);
  saveGame();
  renderMenu();
}
function showUnlock(b){
  document.getElementById('unlockEmoji').textContent = b.emoji;
  document.getElementById('unlockText').textContent = '【' + b.name + '】售价' + b.price + '💰';
  document.getElementById('unlockPopup').classList.add('show');
}
function closeUnlock(){ document.getElementById('unlockPopup').classList.remove('show'); }

function showToast(msg){
  var t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 1800);
}

function updateStats(){
  document.getElementById('coinVal').textContent = playerData.coins;
  document.getElementById('levelVal').textContent = playerData.level + '(' + playerData.exp + '/' + expLv(playerData.level) + ')';
  document.getElementById('soldVal').textContent = playerData.soldCount;
  document.getElementById('comboVal').textContent = combo;
}

function renderMenu(){
  var list = document.getElementById('menuList');
  list.innerHTML = '';
  BURGERS.forEach(function(b){
    var un = playerData.unlocked.indexOf(b.id)>=0;
    var d = document.createElement('div');
    d.className = 'menu-item' + (un?'':' locked');
    d.innerHTML = b.emoji + ' ' + b.name + ' <span style="color:#e65100">💰' + b.price + '</span>' + (un?'':'🔒');
    list.appendChild(d);
  });
}

function renderControls(){
  var c = document.getElementById('controls');
  c.innerHTML = '';
  INGREDIENTS.forEach(function(ing){
    var btn = document.createElement('button');
    btn.className = 'ing-btn';
    btn.textContent = ing.emoji + ing.name;
    btn.onclick = function(){ addLayer(ing); };
    c.appendChild(btn);
  });
  var g = document.createElement('button');
  g.className = 'action-btn';
  g.textContent = '🔥 烤一下';
  g.onclick = grillBurger;
  c.appendChild(g);
  var s = document.createElement('button');
  s.className = 'action-btn serve';
  s.textContent = '🍽️ 出餐';
  s.onclick = serveBurger;
  c.appendChild(s);
  var r = document.createElement('button');
  r.className = 'action-btn trash';
  r.textContent = '🗑️ 重做';
  r.onclick = resetBurger;
  c.appendChild(r);
}

function genOrder(){
  var avail = BURGERS.filter(function(b){ return playerData.unlocked.indexOf(b.id)>=0; });
  var b = avail[Math.floor(Math.random()*avail.length)];
  return { id:Date.now()+Math.random(), burger:b, timeLeft: 25 + b.layers.length*4, maxTime:25 + b.layers.length*4 };
}
function addOrder(){
  if(orders.length < 3){ orders.push(genOrder()); renderOrders(); }
}

function renderOrders(){
  var list = document.getElementById('orderList');
  list.innerHTML = '';
  if(orders.length===0){ list.innerHTML='<div style="text-align:center;color:#888;padding:8px">等待顾客...</div>'; return; }
  orders.forEach(function(o, idx){
    var d = document.createElement('div');
    d.className = 'order-card';
    var pct = (o.timeLeft / o.maxTime) * 100;
    d.innerHTML = '<h4>' + o.burger.emoji + ' ' + o.burger.name + '</h4>' +
      '<div class="ings">需要: ' + o.burger.layers.join('+') + '</div>' +
      '<div class="tbar"><div class="tfill" style="width:'+pct+'%"></div></div>' +
      '<div class="price">💰' + o.burger.price + '</div>';
    list.appendChild(d);
  });
}

function addLayer(ing){
  if(gameState!==STATE_PLAYING) return;
  if(isGrilling) return;
  if(orders.length===0){ showToast('暂无订单！'); return; }
  if(burgerLayers.length>=12){ showToast('汉堡太高啦！'); return; }
  burgerLayers.push(ing.name);
  spawnDrop(ing);
  drawScene();
}

function spawnDrop(ing){
  var r = canvas.getBoundingClientRect();
  var el = document.createElement('div');
  el.className = 'layer-drop';
  el.textContent = ing.emoji;
  el.style.left = (r.left + r.width*0.4 + Math.random()*r.width*0.2) + 'px';
  el.style.top = (r.top + r.height*0.2) + 'px';
  document.body.appendChild(el);
  setTimeout(function(){ el.remove(); }, 1200);
}

function grillBurger(){
  if(gameState!==STATE_PLAYING || burgerLayers.length===0) return;
  if(isGrilling) return;
  isGrilling = true;
  gameState = STATE_GRILL;
  canvas.classList.add('grill-sizzle');
  var cnt = 0;
  var t = setInterval(function(){
    cnt++;
    if(cnt>=12){
      clearInterval(t);
      isGrilling = false;
      canvas.classList.remove('grill-sizzle');
      gameState = STATE_PLAYING;
      showToast('🔥 烤制完成！');
    }
  }, 60);
}

function matchOrder(){
  for(var i=0;i<orders.length;i++){
    var b = orders[i].burger;
    if(b.layers.length !== burgerLayers.length) continue;
    var ok = true;
    for(var j=0;j<b.layers.length;j++){
      if(b.layers[j] !== burgerLayers[j]){ ok=false; break; }
    }
    if(ok) return i;
  }
  return -1;
}

function serveBurger(){
  if(gameState!==STATE_PLAYING || burgerLayers.length===0) return;
  if(orders.length===0){ showToast('没有订单！'); return; }
  var idx = matchOrder();
  if(idx>=0){
    var o = orders[idx];
    combo++;
    var bonus = Math.min(combo, 10) * 2;
    var earn = o.burger.price + bonus;
    playerData.coins += earn;
    playerData.exp += o.burger.exp + Math.floor(bonus/2);
    playerData.soldCount++;
    roundDone++;
    showToast('✅ 完美！+' + earn + '💰 (' + combo + '连击)');
    orders.splice(idx, 1);
  } else {
    combo = 0;
    showToast('❌ 做错了！');
  }
  resetBurger();
  updateStats();
  renderOrders();
  checkLevelUp();
  if(roundDone >= roundTarget) endGame(true);
}

function resetBurger(){
  burgerLayers = [];
  isGrilling = false;
  gameState = STATE_PLAYING;
  canvas.classList.remove('grill-sizzle');
  drawScene();
}

function endGame(won){
  gameState = STATE_OVER;
  if(gameTimer){ clearInterval(gameTimer); gameTimer=null; }
  if(playerData.coins > playerData.highScore) playerData.highScore = playerData.coins;
  saveGame();
  document.getElementById('overTitle').textContent = won ? '🏆 目标达成！' : '⏰ 营业时间结束';
  document.getElementById('finalScore').textContent = playerData.coins + '💰';
  document.getElementById('overMsg').textContent = '完成: ' + roundDone + '/' + roundTarget + ' | 最高: ' + playerData.highScore;
  document.getElementById('gameOver').classList.add('show');
}

function restartGame(){
  document.getElementById('gameOver').classList.remove('show');
  startRound();
}

function startRound(){
  orders = [];
  burgerLayers = [];
  roundDone = 0;
  combo = 0;
  roundTarget = 4 + playerData.level * 2;
  timeLeft = 90;
  gameState = STATE_PLAYING;
  updateStats();
  addOrder();
  setTimeout(addOrder, 1200);
  setTimeout(addOrder, 2800);
  if(gameTimer) clearInterval(gameTimer);
  gameTimer = setInterval(function(){
    timeLeft -= 0.5;
    var allGone = true;
    orders.forEach(function(o){
      o.timeLeft -= 0.5;
      if(o.timeLeft > 0) allGone = false;
    });
    orders = orders.filter(function(o){
      if(o.timeLeft <= 0){ combo = 0; showToast('😠 顾客走了！'); return false; }
      return true;
    });
    renderOrders();
    if(orders.length < 3 && Math.random() < 0.035) addOrder();
    if(timeLeft <= 0) endGame(false);
  }, 500);
}

function drawScene(){
  ctx.clearRect(0,0,cw,ch);
  // 操作台
  ctx.fillStyle = '#795548';
  ctx.fillRect(0, ch*0.85, cw, ch*0.15);
  ctx.fillStyle = '#8d6e63';
  ctx.fillRect(0, ch*0.85, cw, 6);
  // 烤架
  var gx = cw*0.08, gy = ch*0.15, gw = cw*0.22, gh = ch*0.5;
  ctx.fillStyle = '#424242';
  ctx.fillRect(gx, gy, gw, gh);
  ctx.fillStyle = isGrilling ? '#ff5722' : '#212121';
  ctx.fillRect(gx+6, gy+6, gw-12, gh-40);
  for(var i=0;i<6;i++){
    ctx.fillStyle = '#616161';
    ctx.fillRect(gx+8, gy+10+i*(gh-55)/5, gw-16, 3);
  }
  // 汉堡区
  var bx = cw*0.5, by = ch*0.82;
  var layerH = 22;
  var totalH = burgerLayers.length * layerH;
  // 盘子
  ctx.fillStyle = '#eceff1';
  ctx.beginPath();
  ctx.ellipse(bx, by+10, cw*0.18, 15, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#90a4ae';
  ctx.lineWidth = 3;
  ctx.stroke();
  // 绘制汉堡各层（从底向上）
  for(var i = burgerLayers.length - 1; i >= 0; i--){
    var lname = burgerLayers[i];
    var ing = INGREDIENTS.find(function(x){return x.name===lname;});
    if(!ing) continue;
    var y = by - (burgerLayers.length - 1 - i) * layerH;
    var isBun = lname.indexOf('面包') >= 0;
    var w = isBun ? cw*0.14 : cw*0.12;
    var h = isBun && lname.indexOf('上')>=0 ? 28 : layerH-4;
    ctx.fillStyle = ing.color || '#ccc';
    if(isBun && lname.indexOf('上')>=0){
      ctx.beginPath();
      ctx.ellipse(bx, y - h/2 + 4, w, h/2+6, 0, Math.PI, 0);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(bx-w*0.3, y-h/2-2, 2, 0, Math.PI*2);
      ctx.arc(bx+w*0.2, y-h/2-4, 2, 0, Math.PI*2);
      ctx.arc(bx+w*0.4, y-h/2, 1.5, 0, Math.PI*2);
      ctx.fill();
    } else if(isBun){
      ctx.fillRect(bx-w, y-h+2, w*2, h);
      ctx.beginPath();
      ctx.ellipse(bx, y-h+2, w, 6, 0, 0, Math.PI*2);
      ctx.fill();
    } else if(lname.indexOf('生菜')>=0){
      ctx.fillStyle = '#4caf50';
      for(var k=-3;k<=3;k++){
        ctx.beginPath();
        ctx.ellipse(bx + k*w*0.25, y - h/2, w*0.22, h/2, 0, 0, Math.PI*2);
        ctx.fill();
      }
    } else {
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(bx-w, y-h, w*2, h, 4) : ctx.rect(bx-w, y-h, w*2, h);
      ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,0.1)';
      ctx.fillRect(bx-w, y-4, w*2, 2);
    }
  }
  // 成品匹配预览
  if(burgerLayers.length>0){
    var midx = matchOrder();
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(cw*0.4, ch*0.06, cw*0.55, 38);
    ctx.fillStyle = midx>=0 ? '#4caf50' : '#fff';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText((midx>=0?'✅ ':'') + '当前: ' + burgerLayers.join(' > '), cw*0.42, ch*0.06 + 24);
  }
  // 时间
  ctx.fillStyle = timeLeft<20 ? '#f44336' : '#333';
  ctx.font = 'bold 28px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('⏱️ ' + Math.ceil(timeLeft) + 's', cw*0.5, 34);
}

function initCanvas(){
  canvas = document.getElementById('burgerCanvas');
  ctx = canvas.getContext('2d');
  function resize(){
    var r = canvas.getBoundingClientRect();
    canvas.width = r.width*(window.devicePixelRatio||1);
    canvas.height = r.height*(window.devicePixelRatio||1);
    cw = canvas.width; ch = canvas.height;
    ctx.scale(window.devicePixelRatio||1, window.devicePixelRatio||1);
    cw = r.width; ch = r.height;
    drawScene();
  }
  resize();
  window.addEventListener('resize', resize);
}

function handleKeyboard(e){
  if(gameState===STATE_MENU||gameState===STATE_OVER) return;
  var n = parseInt(e.key);
  if(n>=1 && n<=9 && INGREDIENTS[n-1]){
    addLayer(INGREDIENTS[n-1]);
  } else if(e.key==='Enter'){
    serveBurger();
  } else if(e.key===' '){
    e.preventDefault();
    grillBurger();
  } else if(e.key==='r'||e.key==='R'){
    resetBurger();
  }
}

function initGame(){
  loadSave();
  renderMenu();
  renderControls();
  initCanvas();
  checkUnlocks();
  updateStats();
  document.addEventListener('keydown', handleKeyboard);
}

document.getElementById('start-game-btn').addEventListener('click', function(){
  document.getElementById('startScreen').style.display = 'none';
  gameState = STATE_PLAYING;
  initGame();
  startRound();
});

GameCore.init({ touch:false, loading:false });
</script>

  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);

<script>
(function(){
  if (window.__batchPauseFix) return;
  window.__batchPauseFix = true;
  var _paused = false;
  var _overlay = document.createElement('div');
  _overlay.id = 'batchPauseOverlay';
  _overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:9999;display:none;align-items:center;justify-content:center;color:#fff;font:bold 32px sans-serif;cursor:pointer';
  _overlay.textContent = 'PAUSED (click to resume)';
  _overlay.addEventListener('click', function(){ togglePause(); });
  document.body.appendChild(_overlay);
  window.togglePause = function() {
    _paused = !_paused;
    _overlay.style.display = _paused ? 'flex' : 'none';
  };
  window.isPaused = function() { return _paused; };
  document.addEventListener('keydown', function(e) {
    if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
      e.preventDefault();
      togglePause();
    }
  });
  var _origRAF = window.requestAnimationFrame || function(cb){return setTimeout(cb,16)};
  window.requestAnimationFrame = function(cb) {
    return _origRAF.call(window, function(ts) {
      if (!_paused) cb(ts);
      else window.requestAnimationFrame(cb);
    });
  };
})();
</script>
