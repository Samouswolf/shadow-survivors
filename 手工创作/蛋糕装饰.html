.sponsor-panel .qr-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px;text-align:center;min-width:140px}

<canvas id="c"></canvas>

<script>
if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
</script>
<script src="../game_core.js"></script>
<script>
(function(){
"use strict";

const W=480,H=800;

const SHAPES=[
    {id:0,name:'圆形',draw:drawRoundCake},
    {id:1,name:'方形',draw:drawSquareCake},

const CREAM_COLORS=[

const FRUITS=[

    {id:2,name:'蝴蝶结',color:'#e91e63',emoji:'🎀'},
    {id:3,name:'花朵',color:'#ff80ab',emoji:'🌸'},
    {id:4,name:'星星',color:'#ffc107',emoji:'⭐'},

const TOPPINGS=[
    {id:0,name:'糖粉',color:'rgba(255,255,255,0.7)',emoji:'❄️'},

const LEVELS=[

    {name:'Lv2 进阶',shape:1,layers:2,time:80,maxDecor:10},

const CAKE_NAMES=['小明','小红','阿花','大壮','小美','乐乐','甜甜','豆豆','糖糖','圆圆','星星','月月'];

let audioCtx=null;
function initAudio(){
    if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
}
function playTone(freq,dur,type,vol){
    if(!audioCtx)return;
    try{
        const o=audioCtx.createOscillator();
        const g=audioCtx.createGain();
        o.type=type||'sine';
        o.frequency.value=freq;
        g.gain.value=vol||0.15;
        g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
        o.connect(g);g.connect(audioCtx.destination);
        o.start();o.stop(audioCtx.currentTime+dur);
    }catch(e){}
}
function sfxPlace(){playTone(523,0.08,'sine',0.12)}
function sfxSelect(){playTone(659,0.06,'triangle',0.1)}
function sfxScore(){playTone(659,0.1,'sine',0.18);setTimeout(()=>playTone(784,0.12,'sine',0.18),80);setTimeout(()=>playTone(988,0.18,'sine',0.18),180)}
function sfxError(){playTone(196,0.15,'sawtooth',0.15)}
function sfxBuzzer(){playTone(150,0.4,'sawtooth',0.2)}
function sfxBtn(){playTone(440,0.06,'sine',0.1)}
function sfxBirthday(){for(let i=0;i<5;i++)setTimeout(()=>playTone(523+i*100,0.15,'sine',0.12),i*110)}

let particles=[];
function spawnParticles(x,y,color,count){
    if(!count)count=10;
    for(let i=0;i<count;i++){
        particles.push({x:x,y:y,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6-2,
            life:25+Math.floor(Math.random()*20),maxLife:45,size:2+Math.random()*3,color:color});
    }
}
function updateParticles(){
    for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.22;p.vx*=0.99;p.life--;if(p.life<=0)particles.splice(i,1)}
}
function drawParticles(ctx){
    for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.maxLife);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()}
    ctx.globalAlpha=1;
}
let floatings=[];
function addFloating(x,y,text,color,big){floatings.push({x:x,y:y,text:text,color:color||'#ffd700',life:55,maxLife:55,big:big||false})}
function updateFloatings(){for(let i=floatings.length-1;i>=0;i--){const f=floatings[i];f.y-=1.0;f.life--;if(f.life<=0)floatings.splice(i,1)}}
function drawFloatings(ctx){
    for(const f of floatings){ctx.globalAlpha=Math.min(1,f.life/27);ctx.fillStyle=f.color;
        ctx.font='bold '+(f.big?28:18)+'px "Microsoft YaHei"';ctx.textAlign='center';ctx.fillText(f.text,f.x,f.y)}
    ctx.globalAlpha=1;ctx.textAlign='left';
}
const CAKE_ACH=[
    {id:'first_cake',name:'处女作',desc:'完成第一个蛋糕',unlocked:false,icon:'🎂'},
    {id:'perfect_100',name:'完美复刻',desc:'相似度100%',unlocked:false,icon:'💯'},
    {id:'no_reset',name:'一气呵成',desc:'一关不重置通关',unlocked:false,icon:'💪'},
    {id:'all_3_layers',name:'层层叠叠',desc:'完成3层蛋糕',unlocked:false,icon:'🏗️'},
    {id:'decor_full',name:'琳琅满目',desc:'用完装饰上限',unlocked:false,icon:'✨'},
    {id:'score_250',name:'蛋糕大师',desc:'总分250+',unlocked:false,icon:'👨‍🍳'},
    {id:'heart_shape',name:'甜心糕点师',desc:'完成爱心形蛋糕',unlocked:false,icon:'💖'},
    {id:'text_match',name:'祝福满满',desc:'名字完全匹配',unlocked:false,icon:'📝'}
];
let cakeResetThisLevel=false;
let cakeAchPopups=[];
function unlockCakeAch(id){
    const a=CAKE_ACH.find(x=>x.id===id);if(!a||a.unlocked)return;
    a.unlocked=true;cakeAchPopups.push({a:a,life:150,y:-50});
    for(let i=0;i<18;i++)setTimeout(()=>playTone(650+i*60,0.06,'sine',0.12),i*40);
    spawnParticles(W/2,200,'#ffd700',25);
}
function updateCakeAch(){
    for(let i=cakeAchPopups.length-1;i>=0;i--){const p=cakeAchPopups[i];p.life--;if(p.y<40)p.y+=1.2;if(p.life<30)p.y-=1.5;if(p.life<=0)cakeAchPopups.splice(i,1)}
}
function drawCakeAch(ctx){
    for(const p of cakeAchPopups){
        ctx.save();ctx.translate(W/2,p.y);ctx.globalAlpha=Math.min(1,p.life/60);
        ctx.fillStyle='rgba(0,0,0,0.82)';roundRect(ctx,-140,-22,280,48,12);ctx.fill();
        ctx.strokeStyle='#ff9800';ctx.lineWidth=2;roundRect(ctx,-140,-22,280,48,12);ctx.stroke();
        ctx.font='26px Arial';ctx.textAlign='left';ctx.fillStyle='#ff9800';ctx.fillText(p.a.icon,-128,8);
        ctx.fillStyle='#ffb74d';ctx.font='bold 15px "Microsoft YaHei"';ctx.fillText('🏅 成就解锁: '+p.a.name,-92,-2);
        ctx.fillStyle='#ddd';ctx.font='12px "Microsoft YaHei"';ctx.fillText(p.a.desc,-92,14);
        ctx.restore();
    }ctx.globalAlpha=1;ctx.textAlign='left';
}
let cakeMS={vals:[50,120,220,350,500,700],last:-1};
function checkCakeMS(cur){
    for(let i=cakeMS.last+1;i<cakeMS.vals.length;i++){
        if(cur>=cakeMS.vals[i]){cakeMS.last=i;addFloating(W/2,150,'🎯 里程碑 '+cakeMS.vals[i]+'分!','#ffd700',true);spawnParticles(W/2,150,'#ffd700',20);break}
    }
}
function shadeHex2(hex,pct){
    const n=parseInt(hex.slice(1),16);let r=(n>>16)&0xff,g=(n>>8)&0xff,b=n&0xff;
    r=Math.max(0,Math.min(255,Math.floor(r*(1+pct))));g=Math.max(0,Math.min(255,Math.floor(g*(1+pct))));b=Math.max(0,Math.min(255,Math.floor(b*(1+pct))));
    return'#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
}

function drawRoundCake(ctx,cx,cy,r,layer,color,totalLayers){
    const layerH=28;
    const offY=(totalLayers-1-layer)*layerH*0.9;
    ctx.fillStyle=color;
    ctx.beginPath();
    ctx.ellipse(cx,cy-offY,r,8,0,0,Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx-r,cy-offY);
    ctx.lineTo(cx-r,cy-offY+layerH);
    ctx.ellipse(cx,cy-offY+layerH,r,8,0,Math.PI,0,true);
    ctx.lineTo(cx+r,cy-offY);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.1)';ctx.lineWidth=1;
    ctx.stroke();
    ctx.fillStyle=shade(color,-0.08);
    ctx.beginPath();
    ctx.ellipse(cx,cy-offY,r,8,0,0,Math.PI,true);
    ctx.fill();
}
function drawSquareCake(ctx,cx,cy,r,layer,color,totalLayers){
    const layerH=28;
    const w=r*1.8;
    const offY=(totalLayers-1-layer)*layerH*0.9;
    ctx.fillStyle=color;
    ctx.fillRect(cx-w/2,cy-offY,w,layerH);
    ctx.beginPath();
    ctx.moveTo(cx-w/2,cy-offY);
    ctx.lineTo(cx-w/2+6,cy-offY-6);
    ctx.lineTo(cx+w/2+6,cy-offY-6);
    ctx.lineTo(cx+w/2,cy-offY);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx+w/2,cy-offY);
    ctx.lineTo(cx+w/2+6,cy-offY-6);
    ctx.lineTo(cx+w/2+6,cy-offY+layerH-6);
    ctx.lineTo(cx+w/2,cy-offY+layerH);
    ctx.closePath();
    ctx.fillStyle=shade(color,-0.12);
    ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.1)';ctx.lineWidth=1;
    ctx.strokeRect(cx-w/2,cy-offY,w,layerH);
}
function drawHeartCake(ctx,cx,cy,r,layer,color,totalLayers){
    const layerH=28;
    const offY=(totalLayers-1-layer)*layerH*0.9;
    ctx.fillStyle=color;
    ctx.save();
    ctx.translate(cx,cy-offY+layerH/2);
    ctx.beginPath();
    const s=r*0.07;
    ctx.moveTo(0,-r*0.4);
    ctx.bezierCurveTo(-r*0.9,-r*1.2,-r*1.5,r*0.2,0,r*0.9);
    ctx.bezierCurveTo(r*1.5,r*0.2,r*0.9,-r*1.2,0,-r*0.4);
    ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.1)';ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle=shade(color,-0.08);
    ctx.beginPath();
    ctx.moveTo(0,-r*0.4);
    ctx.bezierCurveTo(-r*0.9,-r*1.2,-r*1.5,r*0.2,0,r*0.9);
    ctx.bezierCurveTo(r*0.3,r*0.3,r*0.1,-r*0.3,0,-r*0.4);
    ctx.fill();
    ctx.restore();
}

function shade(hex,pct){
    const n=parseInt(hex.slice(1),16);
    let r=(n>>16)&0xff,g=(n>>8)&0xff,b=n&0xff;
    r=Math.max(0,Math.min(255,Math.floor(r*(1+pct))));
    g=Math.max(0,Math.min(255,Math.floor(g*(1+pct))));
    b=Math.max(0,Math.min(255,Math.floor(b*(1+pct))));
    return'#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
}

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let scale=1;
function resize(){
    const r=W/H;
    let cw=window.innerWidth,ch=window.innerHeight;
    if(cw/ch>r){ch=cw/r}else{cw=ch*r}
    canvas.width=cw;canvas.height=ch;
    scale=cw/W;
    ctx.setTransform(scale,0,0,scale,0,0);
}
window.addEventListener('resize',resize);
resize();

function generateOrder(level){
    const lv=LEVELS[level];
    const cream=Math.floor(Math.random()*CREAM_COLORS.length);
    const fruits=[];
    const nFruits=Math.min(2+level,Math.floor(Math.random()*3)+1+level);
    for(let i=0;i<nFruits;i++)fruits.push(Math.floor(Math.random()*FRUITS.length));
    const plugins=[];
    const nPlug=Math.min(3,Math.floor(Math.random()*(level+2)));
    for(let i=0;i<nPlug;i++)plugins.push(Math.floor(Math.random()*PLUGINS.length));
    const top=Math.random()<0.7?Math.floor(Math.random()*TOPPINGS.length):-1;
    const textIdx=Math.floor(Math.random()*CAKE_NAMES.length);
    return{
        shape:lv.shape,
        layers:lv.layers,
        cream:cream,
        fruits:fruits,
        plugins:plugins,
        topping:top,
        text:CAKE_NAMES[textIdx],
        name:lv.name
    };
}

function CakeState(){
    this.shape=-1;
    this.layers=0;
    this.cream=-1;
    this.decorations=[];
    this.text='';
    this.topping=-1;
}
CakeState.prototype.reset=function(){
    this.shape=-1;this.layers=0;this.cream=-1;this.decorations=[];this.text='';this.topping=-1;
};
CakeState.prototype.addDecor=function(type,id,x,y){
    if(this.decorations.length>=LEVELS[G.level].maxDecor)return false;
    this.decorations.push({type:type,id:id,x:x,y:y});
    return true;
};

const G={
    state:STATE_MENU,
    score:0,
    highScore:0,
    level:0,
    totalScore:0,
    timeLeft:0,
    order:null,
    cake:new CakeState(),
    activeCategory:0,
    selectedItem:-1,
    btnRects:{},
    keys:{},
    paused:false,
    scorePopups:[],
    phase:0,
    cursorX:W/2,
    cursorY:450,
    dragging:false,
    dragType:-1,
    dragId:-1
};

G.highScore=parseInt(Storage.load('cake_high','0'));

function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
}

function drawBtn(ctx,x,y,w,h,text,name,color,active,sub){
    G.btnRects[name]={x:x,y:y,w:w,h:h};
    ctx.fillStyle=color||'#ff9800';
    ctx.strokeStyle=active?'#ffd700':'#fff';
    ctx.lineWidth=active?3:2;
    roundRect(ctx,x,y,w,h,8);
    ctx.fill();ctx.stroke();
    ctx.fillStyle='#fff';
    ctx.font='bold '+(sub?12:15)+'px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(text,x+w/2,y+h/2);
    ctx.textBaseline='alphabetic';
}

function hitBtn(p,name){
    const r=G.btnRects[name];
    return r && p.x>=r.x && p.x<=r.x+r.w && p.y>=r.y && p.y<=r.y+r.h;
}

function getPos(e){
    const rect=canvas.getBoundingClientRect();
    const t=e.touches?e.touches[0]:e;
    return{x:(t.clientX-rect.left)/scale,y:(t.clientY-rect.top)/scale};
}

function getCakeArea(){return{cx:W/2,cy:450,r:85}}
function getCatsArea(){return{x:10,y:565,w:W-20,h:48}}
function getItemsArea(){return{x:10,y:618,w:W-20,h:50}}
function getActionsArea(){return{x:10,y:675,w:W-20,h:50}}

window.addEventListener('keydown',function(e){
    G.keys[e.key.toLowerCase()]=true;
    if(e.key===' '||e.key==='Enter'){
        e.preventDefault();
        if(G.state===STATE_MENU||G.state===STATE_OVER){startGame();return}
    }
    if(e.key==='Escape'){e.preventDefault();if(G.state===STATE_PLAYING)togglePause()}
    if(G.state===STATE_PLAYING&&!G.paused){
        if(e.key>='1'&&e.key<='4'){G.activeCategory=parseInt(e.key)-1;G.selectedItem=-1;sfxSelect()}
        const n=parseInt(e.key);
        if(n>=1&&n<=6){
            if(G.activeCategory===0){G.cake.cream=n-1;sfxSelect()}
        }
        if(e.key.toLowerCase()==='s'){submitCake()}
        if(e.key.toLowerCase()==='r'){G.cake.reset();cakeResetThisLevel=true;sfxSelect()}
        if(e.key==='ArrowLeft')G.cursorX=Math.max(100,G.cursorX-8);
        if(e.key==='ArrowRight')G.cursorX=Math.min(W-100,G.cursorX+8);
        if(e.key==='ArrowUp')G.cursorY=Math.max(300,G.cursorY-8);
        if(e.key==='ArrowDown')G.cursorY=Math.min(550,G.cursorY+8);
        if(e.key.toLowerCase()==='p'&&G.selectedItem>=0){
            let list=getCatList();
            if(G.selectedItem<list.length){
                placeDecor(G.cursorX,G.cursorY,G.activeCategory,G.selectedItem);
            }
        }
    }
    initAudio();
});
window.addEventListener('keyup',function(e){
    G.keys[e.key.toLowerCase()]=false;
});

function getCatList(){
    switch(G.activeCategory){
        case 0:return CREAM_COLORS;
        case 1:return FRUITS;
        case 2:return PLUGINS;
        case 3:return TOPPINGS;
    }
    return [];
}

function placeDecor(cx,cy,cat,idx){
    if(G.cake.shape<0||G.cake.cream<0){sfxError();return}
    const ca=getCakeArea();
    const dx=cx-ca.cx,dy=cy-ca.cy;
    if(Math.hypot(dx,dy)>ca.r*1.5){sfxError();return}
    if(cat===0){G.cake.cream=idx;sfxPlace();return}
    if(cat===3){G.cake.topping=idx;sfxPlace();return}
    if(G.cake.addDecor(cat,idx,cx-ca.cx,cy-ca.cy+LEVELS[G.level].layers*10)){
        sfxPlace();
        spawnParticles(cx,cy,shadeHex2('#ffeb3b',-0.1),6);
        if(G.cake.decorations.length>=LEVELS[G.level].maxDecor)unlockCakeAch('decor_full');
    }
    else sfxError();
}

function submitCake(){
    if(G.cake.shape<0||G.cake.cream<0){sfxError();return}
    let score=0;
    const o=G.order,c=G.cake;
    if(c.shape===o.shape)score+=15;else score-=5;
    if(c.cream===o.cream)score+=15;else score-=5;
    const targetFruits=o.fruits.slice().sort();
    const haveFruits=c.decorations.filter(d=>d.type===1).map(d=>d.id).sort();
    let fMatch=0;
    for(const f of targetFruits){const i=haveFruits.indexOf(f);if(i>=0){fMatch++;haveFruits.splice(i,1)}}
    score+=Math.min(25,Math.floor(fMatch/Math.max(1,targetFruits.length)*25));
    const targetPlug=o.plugins.slice().sort();
    const havePlug=c.decorations.filter(d=>d.type===2).map(d=>d.id).sort();
    let pMatch=0;
    for(const f of targetPlug){const i=havePlug.indexOf(f);if(i>=0){pMatch++;havePlug.splice(i,1)}}
    score+=Math.min(25,Math.floor(pMatch/Math.max(1,targetPlug.length)*25));
    if(c.topping===o.topping)score+=10;else if(o.topping>=0&&c.topping<0)score-=3;
    const textMatch=c.text===o.text;
    if(textMatch){score+=10;unlockCakeAch('text_match')}else score-=3;
    const timeBonus=Math.max(0,Math.ceil(G.timeLeft/60));
    score+=timeBonus;
    const pct=Math.max(0,Math.min(100,score));
    let finalScore;
    if(pct>=95)finalScore=100+timeBonus*2;
    else if(pct>=85)finalScore=75+timeBonus;
    else if(pct>=70)finalScore=50+Math.floor(timeBonus/2);
    else if(pct>=50)finalScore=30;
    else finalScore=15;
    if(pct>=95)unlockCakeAch('perfect_100');
    if(!cakeResetThisLevel)unlockCakeAch('no_reset');
    if(o.layers>=3)unlockCakeAch('all_3_layers');
    if(o.shape===2)unlockCakeAch('heart_shape');
    if(G.level===0)unlockCakeAch('first_cake');
    G.score=finalScore;
    G.totalScore+=finalScore;
    if(G.totalScore>=250)unlockCakeAch('score_250');
    checkCakeMS(G.totalScore);
    G.scorePopups.push({x:W/2,y:400,text:pct>=95?'完美! '+pct+'%  +'+finalScore:pct>=85?'不错 '+pct+'%  +'+finalScore:pct>=70?'及格 '+pct+'%  +'+finalScore:'加油 '+pct+'%  +'+finalScore,color:pct>=85?'#4caf50':pct>=50?'#ff9800':'#f44336',life:90});
    addFloating(W/2,380,'+'+finalScore,pct>=85?'#4caf50':pct>=50?'#ff9800':'#f44336',finalScore>=75);
    spawnParticles(W/2,400,pct>=85?'#4caf50':'#ff9800',pct>=95?35:15);
    sfxScore();
    G.level++;
    if(G.level>=LEVELS.length)setTimeout(endGame,1500);
    else setTimeout(startLevel,1500);
}

function handlePointerDown(e){
    initAudio();
    const p=getPos(e);
    if(G.state===STATE_MENU){
        if(hitBtn(p,'start')){startGame();return}
    }else if(G.state===STATE_PAUSE){
        if(hitBtn(p,'resume')){togglePause();return}
        if(hitBtn(p,'quit')){G.state=STATE_MENU;G.paused=false;sfxBtn();return}
    }else if(G.state===STATE_OVER){
        if(hitBtn(p,'restart')){startGame();return}
        if(hitBtn(p,'menu')){G.state=STATE_MENU;sfxBtn();return}
    }else if(G.state===STATE_PLAYING&&!G.paused){
        const cats=getCatsArea();
        const catW=(cats.w-15)/4;
        for(let i=0;i<4;i++){
            if(p.x>=cats.x+i*(catW+5)&&p.x<=cats.x+(i+1)*catW+i*5&&p.y>=cats.y&&p.y<=cats.y+cats.h){
                G.activeCategory=i;G.selectedItem=-1;sfxSelect();return;
            }
        }
        const items=getItemsArea();
        const list=getCatList();
        const itemW=(items.w-(list.length-1)*4)/list.length;
        for(let i=0;i<list.length;i++){
            if(p.x>=items.x+i*(itemW+4)&&p.x<=items.x+(i+1)*itemW+i*4&&p.y>=items.y&&p.y<=items.y+items.h){
                if(G.activeCategory===0){
                    if(G.cake.shape>=0){G.cake.cream=i;sfxPlace();return}
                }
                G.selectedItem=i;sfxSelect();return;
            }
        }
        const acts=getActionsArea();
        const aW=(acts.w-5)/2;
        if(p.x>=acts.x&&p.x<=acts.x+aW&&p.y>=acts.y&&p.y<=acts.y+acts.h){submitCake();return}
        if(p.x>=acts.x+aW+5&&p.x<=acts.x+2*aW+5&&p.y>=acts.y&&p.y<=acts.y+acts.h){G.cake.reset();cakeResetThisLevel=true;sfxSelect();return}
        const ca=getCakeArea();
        if(Math.hypot(p.x-ca.cx,p.y-ca.cy)<=ca.r*1.6){
            if(G.selectedItem>=0){
                const list=getCatList();
                if(G.selectedItem<list.length){
                    placeDecor(p.x,p.y,G.activeCategory,G.selectedItem);
                    G.dragging=true;G.dragType=G.activeCategory;G.dragId=G.selectedItem;
                }
            }
        }
    }
}
function handlePointerMove(e){
    if(!G.dragging||G.state!==STATE_PLAYING||G.paused)return;
    const p=getPos(e);
    G.cursorX=p.x;G.cursorY=p.y;
}
function handlePointerUp(e){
    if(G.dragging){
        const p=getPos(e);
        const ca=getCakeArea();
        if(Math.hypot(p.x-ca.cx,p.y-ca.cy)<=ca.r*1.6){
            placeDecor(p.x,p.y,G.dragType,G.dragId);
        }
    }
    G.dragging=false;
}

canvas.addEventListener('mousedown',handlePointerDown);
canvas.addEventListener('mousemove',handlePointerMove);
canvas.addEventListener('mouseup',handlePointerUp);
canvas.addEventListener('mouseleave',handlePointerUp);
canvas.addEventListener('touchstart',function(e){e.preventDefault();handlePointerDown(e)},{passive:false});
canvas.addEventListener('touchmove',function(e){e.preventDefault();handlePointerMove(e)},{passive:false});
canvas.addEventListener('touchend',function(e){e.preventDefault();handlePointerUp(e)},{passive:false});

function startGame(){
    initAudio();
    G.state=STATE_PLAYING;
    G.level=0;
    G.totalScore=0;
    G.score=0;
    G.scorePopups=[];
    G.paused=false;
    particles=[];floatings=[];cakeAchPopups=[];cakeMS.last=-1;
    for(const a of CAKE_ACH)a.unlocked=false;
    sfxBirthday();
    startLevel();
}

function startLevel(){
    G.order=generateOrder(G.level);
    const lv=LEVELS[G.level];
    G.cake=new CakeState();
    G.cake.shape=lv.shape;
    G.cake.layers=lv.layers;
    G.timeLeft=lv.time*60;
    G.activeCategory=0;
    G.selectedItem=-1;
    G.scorePopups=[];
    cakeResetThisLevel=false;
}

function endGame(){
    G.state=STATE_OVER;
    G.score=G.totalScore;
    if(G.score>G.highScore){
        G.highScore=G.score;
        Storage.save('cake_high',G.highScore);
    }
    sfxBuzzer();
}

function togglePause(){
    G.paused=!G.paused;
    if(G.paused)G.state=STATE_PAUSE;
    else G.state=STATE_PLAYING;
    sfxBtn();
}

function update(){
    if(G.state!==STATE_PLAYING||G.paused)return;
    G.timeLeft--;
    if(G.timeLeft<=0){submitCake()}
    for(let i=G.scorePopups.length-1;i>=0;i--){
        const s=G.scorePopups[i];
        s.y-=1;s.life--;
        if(s.life<=0)G.scorePopups.splice(i,1);
    }
    updateParticles();updateFloatings();updateCakeAch();
}

function drawBg(ctx){
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#fff3e0');
    g.addColorStop(0.5,'#ffe0b2');
    g.addColorStop(1,'#ffcc80');
    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(255,255,255,0.5)';
    for(let i=0;i<12;i++){
        const x=(i*97+Date.now()*0.008)%W;
        const y=(i*63)%(H*0.5);
        ctx.font=(14+i%3*6)+'px Arial';
        ctx.fillText(['🎈','🎂','🎉','🎊','✨'][i%5],x,y);
    }
}

function drawHUD(ctx){
    ctx.fillStyle='rgba(0,0,0,0.55)';
    roundRect(ctx,10,10,W-20,85,12);ctx.fill();
    ctx.fillStyle='#fff';
    ctx.font='bold 13px "Microsoft YaHei"';
    ctx.textAlign='left';
    ctx.fillText('得分',25,33);
    ctx.font='bold 26px "Microsoft YaHei"';
    ctx.fillStyle='#ffd700';
    ctx.fillText(G.totalScore,25,60);
    const secs=Math.ceil(G.timeLeft/60);
    ctx.textAlign='center';
    ctx.fillStyle=secs<=10?'#ff4444':'#fff';
    ctx.font='bold 32px Arial';
    ctx.fillText('⏱'+secs+'s',W/2,50);
    ctx.font='12px "Microsoft YaHei"';
    ctx.fillStyle='#ffcc80';
    ctx.fillText(LEVELS[G.level].name+' · 装饰'+G.cake.decorations.length+'/'+LEVELS[G.level].maxDecor,W/2,78);
    ctx.textAlign='right';
    ctx.fillStyle='#ff9800';
    ctx.font='bold 13px "Microsoft YaHei"';
    ctx.fillText('最高分',W-25,33);
    ctx.font='bold 19px "Microsoft YaHei"';
    ctx.fillStyle='#ffd700';
    ctx.fillText(G.highScore,W-25,57);
    ctx.textAlign='left';
}

function drawOrder(ctx){
    const o=G.order;
    const x=10,y=105,w=W-20,h=60;
    ctx.fillStyle='rgba(255,152,0,0.15)';
    roundRect(ctx,x,y,w,h,10);ctx.fill();
    ctx.strokeStyle='rgba(255,152,0,0.5)';ctx.lineWidth=2;
    roundRect(ctx,x,y,w,h,10);ctx.stroke();
    ctx.fillStyle='#e65100';
    ctx.font='bold 13px "Microsoft YaHei"';
    ctx.fillText('📋 订单: '+SHAPES[o.shape].name+' '+o.layers+'层 · '+CREAM_COLORS[o.cream].name+'奶油',x+10,y+20);
    let txt='装饰: ';
    for(const f of o.fruits)txt+=FRUITS[f].emoji;
    for(const p of o.plugins)txt+=PLUGINS[p].emoji;
    if(o.topping>=0)txt+=' '+TOPPINGS[o.topping].emoji;
    txt+='  📝"Happy Birthday '+o.text+'"';
    ctx.fillStyle='#5d4037';
    ctx.font='12px "Microsoft YaHei"';
    ctx.fillText(txt,x+10,y+40);
    ctx.font='11px "Microsoft YaHei"';
    ctx.fillStyle='#8d6e63';
    ctx.fillText('(选奶油→拖放装饰→最后提交评分)',x+10,y+56);
}

function drawCakeBase(ctx){
    const ca=getCakeArea();
    ctx.fillStyle='rgba(139,115,85,0.6)';
    ctx.beginPath();
    ctx.ellipse(ca.cx,ca.cy+ca.r*0.95,ca.r*1.2,12,0,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='#fafafa';
    ctx.beginPath();
    ctx.ellipse(ca.cx,ca.cy+ca.r*0.85,ca.r*1.05,10,0,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.08)';ctx.stroke();
}

function drawFullCake(ctx,cx,cy,r,shape,layers,cream,decors,topping){
    const creamCol=cream>=0?CREAM_COLORS[cream].color:'#f5f5f5';
    if(shape>=0){
        for(let l=0;l<layers;l++){
            SHAPES[shape].draw(ctx,cx,cy,r,l,creamCol,layers);
        }
    }else{
        ctx.fillStyle='#e0e0e0';
        ctx.beginPath();ctx.arc(cx,cy,r*0.6,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#999';ctx.font='12px "Microsoft YaHei"';ctx.textAlign='center';
        ctx.fillText('请选择奶油',cx,cy+4);ctx.textAlign='left';
    }
    if(topping>=0){
        const t=TOPPINGS[topping];
        ctx.fillStyle=t.color;
        for(let i=0;i<25;i++){
            const ang=Math.random()*Math.PI*2;
            const rr=Math.random()*r*0.8;
            const tx=cx+Math.cos(ang)*rr;
            const ty=cy-(layers-1)*25+Math.sin(ang)*rr*0.4;
            ctx.beginPath();ctx.arc(tx,ty,topping===1?3:2,0,Math.PI*2);ctx.fill();
        }
    }
    for(const d of decors){
        let color='#e91e63',emoji='✨',size=14;
        if(d.type===1){const f=FRUITS[d.id];color=f.color;emoji=f.emoji;size=18}
        else if(d.type===2){const p=PLUGINS[d.id];color=p.color;emoji=p.emoji;size=20}
        ctx.font=size+'px Arial';
        ctx.textAlign='center';
        ctx.fillText(emoji,cx+d.x,cy+d.y);
        ctx.textAlign='left';
    }
}

function drawCake(ctx){
    const ca=getCakeArea();
    drawCakeBase(ctx);
    drawFullCake(ctx,ca.cx,ca.cy,ca.r,G.cake.shape,G.cake.layers,G.cake.cream,G.cake.decorations,G.cake.topping);
    if(G.cake.text){
        ctx.fillStyle='#c62828';
        ctx.font='bold 14px "Microsoft YaHei"';
        ctx.textAlign='center';
        ctx.fillText(G.cake.text,ca.cx,ca.cy-LEVELS[G.level].layers*24-5);
        ctx.textAlign='left';
    }
    ctx.fillStyle='#ff9800';
    ctx.font='bold 13px "Microsoft YaHei"';
    ctx.textAlign='center';
    ctx.fillText('🎂 你的蛋糕',ca.cx,ca.cy+ca.r+30);
    ctx.textAlign='left';
    if(G.state===STATE_PLAYING&&!G.paused){
        ctx.strokeStyle=G.selectedItem>=0?'#ffd700':'rgba(255,152,0,0.5)';
        ctx.lineWidth=G.selectedItem>=0?2:1;
        ctx.setLineDash([5,5]);
        ctx.beginPath();ctx.arc(ca.cx,ca.cy,ca.r*1.5,0,Math.PI*2);ctx.stroke();
        ctx.setLineDash([]);
    }
}

function drawPanel(ctx){
    const cats=['🧁 奶油','🍓 水果','🎀 插件','✨ 顶料'];
    const ca=getCatsArea();
    const cw=(ca.w-15)/4;
    for(let i=0;i<4;i++){
        drawBtn(ctx,ca.x+i*(cw+5),ca.y,cw,ca.h,cats[i],'cat'+i,
            G.activeCategory===i?'#ff9800':'#ffb74d',G.activeCategory===i,false);
    }
    const items=getItemsArea();
    const list=getCatList();
    const iw=(items.w-(list.length-1)*4)/list.length;
    for(let i=0;i<list.length;i++){
        const it=list[i];
        const col=it.color;
        const active=G.selectedItem===i||(G.activeCategory===0&&G.cake.cream===i)||(G.activeCategory===3&&G.cake.topping===i);
        drawBtn(ctx,items.x+i*(iw+4),items.y,iw,items.h,(it.emoji||'')+it.name,'item'+i,
            active?shade(col,-0.2):col,active,true);
    }
    const aa=getActionsArea();
    const aw=(aa.w-5)/2;
    drawBtn(ctx,aa.x,aa.y,aw,aa.h,'✅ 提交评分 (S)','submit','#4caf50',false);
    drawBtn(ctx,aa.x+aw+5,aa.y,aw,aa.h,'🔄 重置 (R)','reset','#757575',false);
}

function drawPopups(ctx){
    for(const s of G.scorePopups){
        ctx.globalAlpha=Math.min(1,s.life/45);
        ctx.fillStyle=s.color;
        ctx.font='bold 24px "Microsoft YaHei"';
        ctx.textAlign='center';
        ctx.fillText(s.text,s.x,s.y);
        ctx.textAlign='left';
    }
    ctx.globalAlpha=1;
}

function drawMenu(ctx){
    drawBg(ctx);
    ctx.fillStyle='rgba(255,255,255,0.25)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#e65100';
    ctx.font='bold 50px "Microsoft YaHei"';
    ctx.textAlign='center';
    ctx.fillText('🎂 蛋糕装饰',W/2,140);
    ctx.fillStyle='#ff9800';
    ctx.font='22px Arial';
    ctx.fillText('CAKE DECORATOR',W/2,175);
    const cx=W/2,cy=320;
    drawFullCake(ctx,cx,cy,80,0,3,1,
        [{type:1,id:0,x:-35,y:-30},{type:1,id:2,x:20,y:-35},{type:2,id:0,x:0,y:-70},{type:1,id:1,x:40,y:-10}],
        2);
    ctx.font='14px Arial';ctx.fillStyle='#c62828';ctx.textAlign='center';
    ctx.fillText('Happy Birthday',cx,cy-100);
    ctx.fillStyle='#ffd700';
    ctx.font='bold 19px "Microsoft YaHei"';
    ctx.fillText('最高分: '+G.highScore,W/2,440);
    drawBtn(ctx,W/2-100,480,200,60,'开始装饰','start','#ff9800');
    ctx.fillStyle='#5d4037';
    ctx.font='15px "Microsoft YaHei"';
    ctx.fillText('3关挑战 · 按订单装饰蛋糕获取高分',W/2,570);
    ctx.fillStyle='#8d6e63';
    ctx.font='13px "Microsoft YaHei"';
    ctx.fillText('🖱️ 左侧选分类→选物品→拖放到蛋糕上',W/2,610);
    ctx.fillText('📱 触屏点击选→点蛋糕放置 · ⌨️ 1-4分类 P放置',W/2,635);
    ctx.fillText('⏱ Lv1圆1层90s · Lv2方2层80s · Lv3爱心3层70s',W/2,660);
    ctx.fillText('95%+完美=100+分 85%+=75分 相似度低=低分',W/2,685);
    ctx.textAlign='left';
}

function drawGame(ctx){
    drawBg(ctx);
    drawHUD(ctx);
    drawOrder(ctx);
    drawCake(ctx);
    drawPanel(ctx);
    drawPopups(ctx);
    if(G.state===STATE_PAUSE){
        ctx.fillStyle='rgba(0,0,0,0.72)';
        ctx.fillRect(0,0,W,H);
        ctx.fillStyle='#fff';
        ctx.font='bold 44px "Microsoft YaHei"';
        ctx.textAlign='center';
        ctx.fillText('⏸ 暂停',W/2,H/2-60);
        drawBtn(ctx,W/2-85,H/2,170,55,'继续','resume','#ff9800');
        drawBtn(ctx,W/2-70,H/2+75,140,45,'退出','quit','#795548');
        ctx.textAlign='left';
    }
}

function drawGameOver(ctx){
    drawBg(ctx);
    ctx.fillStyle='rgba(230,81,0,0.85)';
    ctx.fillRect(0,0,W,H);
    const isNew=G.score>=G.highScore&&G.score>0;
    ctx.fillStyle=isNew?'#ffd700':'#fff';
    ctx.font='bold 48px "Microsoft YaHei"';
    ctx.textAlign='center';
    ctx.fillText(isNew?'🏆 新纪录!':'装饰完成',W/2,150);
    ctx.fillStyle='#fff3e0';
    ctx.font='bold 22px "Microsoft YaHei"';
    ctx.fillText('总得分',W/2,225);
    ctx.fillStyle='#ffd700';
    ctx.font='bold 78px Arial';
    ctx.fillText(G.score,W/2,315);
    ctx.fillStyle='#ffe0b2';
    ctx.font='17px "Microsoft YaHei"';
    ctx.fillText('通关: '+Math.min(G.level,LEVELS.length)+'/'+LEVELS.length+' 关',W/2,370);
    ctx.fillStyle='#ffd700';
    ctx.font='bold 20px "Microsoft YaHei"';
    ctx.fillText('历史最高: '+G.highScore,W/2,415);
    drawBtn(ctx,W/2-90,470,180,55,'再玩一次','restart','#ff9800');
    drawBtn(ctx,W/2-70,540,140,45,'返回菜单','menu','#e65100');
    ctx.textAlign='left';
}

function draw(){
    switch(G.state){
        case STATE_MENU: drawMenu(ctx); break;
        case STATE_PLAYING: drawGame(ctx); break;
        case STATE_PAUSE: drawGame(ctx); break;
        case STATE_OVER: drawGameOver(ctx); break;
    }
}

let loopId;
function gameLoop(){
    loopId=requestAnimationFrame(gameLoop);
    update();
    draw();
}
gameLoop();

})();
</script>

<!-- [BATCH-FIX:responsive-js] -->
<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>
<!-- [/BATCH-FIX:responsive-js] -->
<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
