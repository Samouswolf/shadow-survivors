<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>烘焙小厨房</title>
<script src="../game_core.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#fff5e6,#ffe4c4);min-height:100vh;font-family:"Microsoft YaHei","PingFang SC",sans-serif;overflow-x:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#app{max-width:900px;margin:0 auto;padding:10px}
header{text-align:center;padding:16px 8px}
header h1{font-size:28px;color:#8b4513;text-shadow:2px 2px 0 #fff3e0}
header .stats{display:flex;justify-content:center;gap:16px;margin-top:10px;flex-wrap:wrap}
header .stat{background:#fff;border:2px solid #deb887;border-radius:20px;padding:6px 14px;font-size:13px;color:#8b4513;font-weight:bold}
#gameArea{position:relative;background:#fff8dc;border:4px solid #deb887;border-radius:16px;min-height:480px;padding:12px;overflow:hidden}
#kitchenCanvas{width:100%;height:400px;display:block;border-radius:12px;background:linear-gradient(180deg,#fffaf0 0%,#ffe4b5 100%)}
.recipe-panel{position:absolute;top:12px;right:12px;background:rgba(255,255,255,0.95);border:2px solid #daa520;border-radius:12px;padding:10px;max-width:180px;font-size:12px;z-index:10}
.recipe-panel h3{color:#b8860b;margin-bottom:6px;font-size:14px;text-align:center}
.recipe-panel .recipe-item{padding:4px 6px;margin:3px 0;background:#fff8dc;border-radius:6px;color:#8b4513;cursor:pointer;transition:all 0.2s;border:1px solid transparent}
.recipe-panel .recipe-item:hover{border-color:#daa520;transform:translateX(-2px)}
.recipe-panel .recipe-item.locked{opacity:0.5;cursor:not-allowed;color:#999}
.recipe-panel .recipe-item.active{background:#fff3cd;border-color:#daa520}
.controls{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.ingredient-btn{padding:10px 14px;background:linear-gradient(135deg,#ffd700,#ffb347);border:none;border-radius:12px;font-size:13px;font-weight:bold;color:#8b4513;cursor:pointer;box-shadow:0 3px 0 #cd853f;transition:all 0.15s;min-width:80px;font-family:inherit}
.ingredient-btn:hover{transform:translateY(-2px);box-shadow:0 5px 0 #cd853f}
.ingredient-btn:active{transform:translateY(1px);box-shadow:0 1px 0 #cd853f}
.ingredient-btn.selected{background:linear-gradient(135deg,#ff6b6b,#ee5a5a);color:#fff;box-shadow:0 3px 0 #b22222}
.action-btn{padding:10px 18px;background:linear-gradient(135deg,#4caf50,#45a049);border:none;border-radius:12px;font-size:14px;font-weight:bold;color:#fff;cursor:pointer;box-shadow:0 3px 0 #2e7d32;transition:all 0.15s;font-family:inherit}
.action-btn:hover{transform:translateY(-2px);box-shadow:0 5px 0 #2e7d32}
.action-btn:active{transform:translateY(1px);box-shadow:0 1px 0 #2e7d32}
.action-btn.reset{background:linear-gradient(135deg,#ff9800,#f57c00);box-shadow:0 3px 0 #e65100}
.action-btn.reset:hover{box-shadow:0 5px 0 #e65100}
.bowl-area{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:220px;height:220px;pointer-events:none}
.progress-bar{width:100%;height:16px;background:#eee;border-radius:8px;margin-top:10px;overflow:hidden;display:none}
.progress-bar.active{display:block}
.progress-fill{height:100%;background:linear-gradient(90deg,#4caf50,#8bc34a);width:0%;transition:width 0.3s;border-radius:8px}
.toast{position:fixed;top:20%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);color:#fff;padding:12px 24px;border-radius:24px;font-size:15px;z-index:1000;pointer-events:none;animation:toastIn 0.3s ease}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-20px)}to{opacity:1;transform:translate(-50%,0)}}
.unlock-popup{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;z-index:500}
.unlock-popup.show{display:flex;animation:fadeIn 0.3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.unlock-card{background:linear-gradient(135deg,#fff8dc,#ffe4b5);border:4px solid #daa520;border-radius:20px;padding:30px;text-align:center;max-width:320px;animation:popIn 0.5s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes popIn{from{transform:scale(0)}to{transform:scale(1)}}
.unlock-card h2{color:#b8860b;margin-bottom:10px}
.unlock-card .recipe-emoji{font-size:64px;margin:16px 0}
.unlock-card p{color:#8b4513;margin-bottom:16px;line-height:1.6}
.unlock-card button{padding:10px 28px;background:linear-gradient(135deg,#ffd700,#ffb347);border:none;border-radius:20px;font-size:15px;font-weight:bold;color:#8b4513;cursor:pointer;font-family:inherit}
.start-screen{position:fixed;inset:0;background:linear-gradient(135deg,#fff5e6,#ffe4c4);z-index:900;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.start-screen h1{font-size:42px;color:#8b4513;text-shadow:3px 3px 0 #fff3e0;margin-bottom:12px;text-align:center}
.start-screen .desc{color:#a0522d;font-size:16px;text-align:center;max-width:400px;line-height:1.8;margin-bottom:30px}
#start-game-btn{padding:16px 56px;background:linear-gradient(135deg,#ff6b6b,#ee5a5a);border:none;border-radius:30px;font-size:20px;font-weight:bold;color:#fff;cursor:pointer;box-shadow:0 6px 0 #b22222;transition:all 0.15s;font-family:inherit;letter-spacing:2px}
#start-game-btn:hover{transform:translateY(-3px);box-shadow:0 9px 0 #b22222}
#start-game-btn:active{transform:translateY(3px);box-shadow:0 0 0 #b22222}
.help-hint{color:#cd853f;font-size:13px;margin-top:24px;text-align:center;line-height:1.8}
.bowl-ingredient{position:absolute;font-size:28px;pointer-events:none;animation:dropIn 0.4s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes dropIn{from{transform:translateY(-80px) scale(0.3);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
.mix-anim{animation:shake 0.15s ease-in-out infinite}
@keyframes shake{0%,100%{transform:translate(-50%,-50%) rotate(0)}25%{transform:translate(-50%,-50%) rotate(-3deg)}75%{transform:translate(-50%,-50%) rotate(3deg)}}
.bake-glow{box-shadow:0 0 40px rgba(255,150,50,0.6);animation:glow 0.5s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 0 20px rgba(255,150,50,0.4)}to{box-shadow:0 0 50px rgba(255,200,50,0.8)}}
@media(max-width:600px){
  header h1{font-size:22px}
  header .stat{font-size:11px;padding:4px 10px}
  .ingredient-btn{font-size:11px;padding:8px 10px;min-width:60px}
  .action-btn{font-size:12px;padding:8px 14px}
  .recipe-panel{max-width:140px;font-size:11px;padding:6px}
  .recipe-panel h3{font-size:12px}
  #kitchenCanvas{height:300px}
  #gameArea{min-height:400px}
  .bowl-area{width:160px;height:160px}
}
/* [BATCH-FIX:ad-components-css] */
.sponsor-btn{position:fixed;bottom:8px;left:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:2px 6px;border-radius:10px;font:10px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.sponsor-panel.show{display:flex}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.interstitial-ad.show{display:flex}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* [/BATCH-FIX:ad-components-css] */

/* [AD-FIX:responsive] */
@media (max-width:768px){.ad-banner-container{display:none!important}.sponsor-btn{transform:scale(.8);opacity:.6}}
/* [/AD-FIX:responsive] */
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🍪 烘焙小厨房 🍰</h1>
    <div class="stats">
      <div class="stat">⭐ 经验: <span id="expVal">0</span></div>
      <div class="stat">🏆 等级: <span id="levelVal">1</span></div>
      <div class="stat">🍰 作品: <span id="bakedVal">0</span></div>
    </div>
  </header>
  <div id="gameArea">
    <canvas id="kitchenCanvas"></canvas>
    <div class="recipe-panel">
      <h3>📖 配方书</h3>
      <div id="recipeList"></div>
    </div>
    <div class="bowl-area" id="bowlArea"></div>
    <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
  </div>
  <div class="controls" id="controls"></div>
</div>

<div class="start-screen" id="startScreen">
  <h1>🍪 烘焙小厨房 🍰</h1>
  <div class="desc">
    欢迎来到温馨的烘焙小厨房！<br>
    选择配方，按顺序加入食材，搅拌后放入烤箱烘烤。<br>
    解锁更多美味配方，成为顶级烘焙大师！
  </div>
  <button id="start-game-btn">开始烘焙</button>
  <div class="help-hint">
    🖱️ 鼠标点击选择食材和操作<br>
    📱 触屏点击即可操作<br>
    ⌨️ 数字键1-8选择食材，空格搅拌，回车烘烤
  </div>
</div>

<div class="unlock-popup" id="unlockPopup">
  <div class="unlock-card">
    <h2>🎉 解锁新配方！</h2>
    <div class="recipe-emoji" id="unlockEmoji">🎂</div>
    <p id="unlockText">你解锁了新配方！</p>
    <button onclick="closeUnlock()">太棒了！</button>
  </div>
</div>

<script>
if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
if (typeof STATE_BAKING  === 'undefined') var STATE_BAKING  = 2;
if (typeof STATE_DONE    === 'undefined') var STATE_DONE    = 3;

var gameState = STATE_MENU;
var currentRecipe = null;
var addedIngredients = [];
var isMixing = false;
var bakingProgress = 0;
var mixTimer = null;
var bakeTimer = null;
var canvas, ctx, cw, ch;

var RECIPES = [
  { id:'cookie', name:'黄油曲奇', emoji:'🍪', ingredients:['黄油','面粉','糖','鸡蛋'], steps:['mix','bake'], exp:20, unlockLv:1 },
  { id:'cake', name:'香草蛋糕', emoji:'🎂', ingredients:['面粉','糖','鸡蛋','牛奶','黄油'], steps:['mix','bake'], exp:35, unlockLv:1 },
  { id:'bread', name:'吐司面包', emoji:'🍞', ingredients:['面粉','酵母','牛奶','糖','黄油'], steps:['mix','bake'], exp:40, unlockLv:2 },
  { id:'donut', name:'甜甜圈', emoji:'🍩', ingredients:['面粉','糖','鸡蛋','牛奶','黄油','酵母'], steps:['mix','bake'], exp:50, unlockLv:3 },
  { id:'muffin', name:'蓝莓麦芬', emoji:'🧁', ingredients:['面粉','糖','鸡蛋','牛奶','黄油','蓝莓'], steps:['mix','bake'], exp:55, unlockLv:4 },
  { id:'croissant', name:'牛角包', emoji:'🥐', ingredients:['面粉','黄油','酵母','牛奶','糖'], steps:['mix','bake'], exp:70, unlockLv:5 },
  { id:'pudding', name:'焦糖布丁', emoji:'🍮', ingredients:['鸡蛋','牛奶','糖'], steps:['mix','bake'], exp:45, unlockLv:3 },
  { id:'tart', name:'水果挞', emoji:'🥧', ingredients:['面粉','黄油','糖','鸡蛋','水果'], steps:['mix','bake'], exp:80, unlockLv:6 }
];

var INGREDIENTS = [
  { id:'flour', name:'面粉', emoji:'🌾' },
  { id:'sugar', name:'糖', emoji:'🍬' },
  { id:'butter', name:'黄油', emoji:'🧈' },
  { id:'egg', name:'鸡蛋', emoji:'🥚' },
  { id:'milk', name:'牛奶', emoji:'🥛' },
  { id:'yeast', name:'酵母', emoji:'🍄' },
  { id:'blueberry', name:'蓝莓', emoji:'🫐' },
  { id:'fruit', name:'水果', emoji:'🍓' }
];

var playerData = {
  exp: 0,
  level: 1,
  bakedCount: 0,
  unlockedRecipes: ['cookie','cake']
};

function loadSave(){
  var saved = Storage.load('bake_kitchen_save', null);
  if(saved){ playerData = Object.assign(playerData, saved); }
}
function saveGame(){ Storage.save('bake_kitchen_save', playerData); }

function expForLevel(lv){ return lv * 100; }
function checkLevelUp(){
  while(playerData.exp >= expForLevel(playerData.level)){
    playerData.exp -= expForLevel(playerData.level);
    playerData.level++;
    checkUnlockRecipes();
    showToast('🎉 升级了！当前等级: ' + playerData.level);
  }
  updateStats();
}
function checkUnlockRecipes(){
  var unlocked = [];
  RECIPES.forEach(function(r){
    if(r.unlockLv <= playerData.level && playerData.unlockedRecipes.indexOf(r.id)<0){
      playerData.unlockedRecipes.push(r.id);
      unlocked.push(r);
    }
  });
  if(unlocked.length>0){
    setTimeout(function(){ showUnlock(unlocked[0]); }, 500);
  }
  saveGame();
}
function showUnlock(recipe){
  document.getElementById('unlockEmoji').textContent = recipe.emoji;
  document.getElementById('unlockText').textContent = '【' + recipe.name + '】已加入配方书！';
  document.getElementById('unlockPopup').classList.add('show');
  renderRecipeList();
}
function closeUnlock(){ document.getElementById('unlockPopup').classList.remove('show'); }

function showToast(msg){
  var t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 2000);
}

function updateStats(){
  document.getElementById('expVal').textContent = playerData.exp + '/' + expForLevel(playerData.level);
  document.getElementById('levelVal').textContent = playerData.level;
  document.getElementById('bakedVal').textContent = playerData.bakedCount;
}

function renderRecipeList(){
  var list = document.getElementById('recipeList');
  list.innerHTML = '';
  RECIPES.forEach(function(r){
    var isUnlocked = playerData.unlockedRecipes.indexOf(r.id) >= 0;
    var div = document.createElement('div');
    div.className = 'recipe-item' + (isUnlocked?'':' locked') + (currentRecipe && currentRecipe.id===r.id?' active':'');
    div.innerHTML = r.emoji + ' ' + r.name + (isUnlocked?'':' 🔒');
    if(isUnlocked){
      div.onclick = function(){ selectRecipe(r); };
    }
    list.appendChild(div);
  });
}

function renderControls(){
  var c = document.getElementById('controls');
  c.innerHTML = '';
  INGREDIENTS.forEach(function(ing, idx){
    var btn = document.createElement('button');
    btn.className = 'ingredient-btn';
    btn.id = 'ing_' + ing.id;
    btn.textContent = ing.emoji + ' ' + ing.name;
    btn.onclick = function(){ addIngredient(ing); };
    c.appendChild(btn);
  });
  var mixBtn = document.createElement('button');
  mixBtn.className = 'action-btn';
  mixBtn.textContent = '🥄 搅拌';
  mixBtn.onclick = startMixing;
  c.appendChild(mixBtn);
  var bakeBtn = document.createElement('button');
  bakeBtn.className = 'action-btn';
  bakeBtn.textContent = '🔥 烘烤';
  bakeBtn.onclick = startBaking;
  c.appendChild(bakeBtn);
  var resetBtn = document.createElement('button');
  resetBtn.className = 'action-btn reset';
  resetBtn.textContent = '🔄 重新开始';
  resetBtn.onclick = resetBowl;
  c.appendChild(resetBtn);
}

function selectRecipe(recipe){
  currentRecipe = recipe;
  resetBowl();
  renderRecipeList();
  showToast('已选择: ' + recipe.emoji + ' ' + recipe.name);
}

function addIngredient(ing){
  if(gameState !== STATE_PLAYING) return;
  if(!currentRecipe){ showToast('请先选择配方！'); return; }
  if(isMixing || bakingProgress>0) return;
  if(addedIngredients.length >= currentRecipe.ingredients.length){
    showToast('食材已加满，可以搅拌了！');
    return;
  }
  var expected = currentRecipe.ingredients[addedIngredients.length];
  if(ing.name !== expected){
    showToast('❌ 顺序错误！下一个需要: ' + expected);
    resetBowl();
    return;
  }
  addedIngredients.push(ing.name);
  spawnIngredientAnim(ing);
  drawKitchen();
}

function spawnIngredientAnim(ing){
  var bowl = document.getElementById('bowlArea');
  var el = document.createElement('div');
  el.className = 'bowl-ingredient';
  el.textContent = ing.emoji;
  var angle = Math.random() * Math.PI * 2;
  var dist = 30 + Math.random() * 40;
  el.style.left = (50 + Math.cos(angle)*dist*0.5) + '%';
  el.style.top = (50 + Math.sin(angle)*dist*0.5) + '%';
  bowl.appendChild(el);
  setTimeout(function(){ el.remove(); }, 2000);
}

function startMixing(){
  if(gameState !== STATE_PLAYING || !currentRecipe) return;
  if(isMixing || bakingProgress>0) return;
  if(addedIngredients.length < currentRecipe.ingredients.length){
    showToast('还没加完所有食材哦！');
    return;
  }
  isMixing = true;
  gameState = STATE_BAKING;
  document.getElementById('bowlArea').classList.add('mix-anim');
  var count = 0;
  mixTimer = setInterval(function(){
    count++;
    if(count >= 15){
      clearInterval(mixTimer);
      mixTimer = null;
      isMixing = false;
      document.getElementById('bowlArea').classList.remove('mix-anim');
      gameState = STATE_PLAYING;
      showToast('✨ 搅拌完成！可以烘烤啦');
      drawKitchen();
    }
  }, 80);
}

function startBaking(){
  if(gameState !== STATE_PLAYING || !currentRecipe) return;
  if(bakingProgress>0 || isMixing) return;
  if(addedIngredients.length < currentRecipe.ingredients.length){
    showToast('请先加完食材并搅拌！');
    return;
  }
  gameState = STATE_BAKING;
  bakingProgress = 0;
  var pb = document.getElementById('progressBar');
  var pf = document.getElementById('progressFill');
  pb.classList.add('active');
  document.getElementById('kitchenCanvas').classList.add('bake-glow');
  bakeTimer = setInterval(function(){
    bakingProgress += 4;
    pf.style.width = bakingProgress + '%';
    if(bakingProgress >= 100){
      clearInterval(bakeTimer);
      bakeTimer = null;
      finishBaking();
    }
  }, 80);
}

function finishBaking(){
  gameState = STATE_DONE;
  document.getElementById('kitchenCanvas').classList.remove('bake-glow');
  document.getElementById('progressBar').classList.remove('active');
  document.getElementById('progressFill').style.width = '0%';
  playerData.exp += currentRecipe.exp;
  playerData.bakedCount++;
  checkLevelUp();
  drawKitchen(true);
  showToast(currentRecipe.emoji + ' 烘焙成功！+' + currentRecipe.exp + '经验');
  setTimeout(function(){
    resetBowl();
  }, 2000);
}

function resetBowl(){
  addedIngredients = [];
  bakingProgress = 0;
  isMixing = false;
  if(mixTimer){ clearInterval(mixTimer); mixTimer = null; }
  if(bakeTimer){ clearInterval(bakeTimer); bakeTimer = null; }
  gameState = STATE_PLAYING;
  document.getElementById('bowlArea').classList.remove('mix-anim');
  document.getElementById('kitchenCanvas').classList.remove('bake-glow');
  document.getElementById('progressBar').classList.remove('active');
  document.getElementById('progressFill').style.width = '0%';
  var bowl = document.getElementById('bowlArea');
  bowl.innerHTML = '';
  drawKitchen();
}

function drawKitchen(showCake){
  ctx.clearRect(0,0,cw,ch);
  // 烤箱背景
  ctx.fillStyle = '#8b4513';
  ctx.fillRect(cw*0.05, ch*0.1, cw*0.4, ch*0.8);
  ctx.fillStyle = '#4a2c10';
  ctx.fillRect(cw*0.08, ch*0.15, cw*0.34, ch*0.5);
  ctx.fillStyle = bakingProgress>0 ? '#ff7b29' : '#2a1810';
  ctx.fillRect(cw*0.1, ch*0.17, cw*0.3, ch*0.46);
  // 烤箱门把
  ctx.fillStyle = '#c0c0c0';
  ctx.fillRect(cw*0.08, ch*0.67, cw*0.34, 8);
  // 碗
  var bowlX = cw*0.68, bowlY = ch*0.52;
  var bowlR = Math.min(cw,ch)*0.22;
  ctx.beginPath();
  ctx.arc(bowlX, bowlY, bowlR, 0, Math.PI);
  ctx.fillStyle = '#e0e0e0';
  ctx.fill();
  ctx.strokeStyle = '#999';
  ctx.lineWidth = 3;
  ctx.stroke();
  // 碗内面糊
  if(addedIngredients.length>0 || showCake){
    ctx.beginPath();
    ctx.ellipse(bowlX, bowlY-2, bowlR*0.85, bowlR*0.25, 0, 0, Math.PI*2);
    var p = addedIngredients.length / (currentRecipe?currentRecipe.ingredients.length:1);
    if(showCake || bakingProgress>=100){
      ctx.fillStyle = '#d4a574';
    } else if(isMixing){
      ctx.fillStyle = '#c8a882';
    } else {
      ctx.fillStyle = p > 0.7 ? '#e8d5b7' : p > 0.3 ? '#f5e6d3' : '#faf3e8';
    }
    ctx.fill();
  }
  // 成品显示
  if(showCake && currentRecipe){
    ctx.font = 'bold 64px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(currentRecipe.emoji, bowlX, bowlY + 10);
  }
  // 配方进度
  if(currentRecipe){
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(cw*0.52, ch*0.08, cw*0.44, 40);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(currentRecipe.emoji + ' ' + currentRecipe.name + ':', cw*0.54, ch*0.26);
    ctx.font = '13px sans-serif';
    for(var i=0;i<currentRecipe.ingredients.length;i++){
      var done = i < addedIngredients.length;
      ctx.fillStyle = done ? '#4caf50' : '#ccc';
      var x = cw*0.54 + i*55;
      var y = ch*0.08 + 26;
      var ing = INGREDIENTS.find(function(ig){ return ig.name===currentRecipe.ingredients[i]; });
      ctx.font = '20px sans-serif';
      ctx.fillText(ing ? ing.emoji : '?', x, y);
      if(done){
        ctx.strokeStyle = '#4caf50';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x-2, y-14);
        ctx.lineTo(x+18, y+4);
        ctx.stroke();
      }
    }
  }
}

function initCanvas(){
  canvas = document.getElementById('kitchenCanvas');
  ctx = canvas.getContext('2d');
  function resizeCanvas(){
    var rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * (window.devicePixelRatio||1);
    canvas.height = rect.height * (window.devicePixelRatio||1);
    cw = canvas.width;
    ch = canvas.height;
    ctx.scale(window.devicePixelRatio||1, window.devicePixelRatio||1);
    cw = rect.width; ch = rect.height;
    drawKitchen();
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
}

function handleKeyboard(e){
  if(gameState !== STATE_PLAYING && gameState !== STATE_BAKING) return;
  var num = parseInt(e.key);
  if(num>=1 && num<=8 && INGREDIENTS[num-1]){
    addIngredient(INGREDIENTS[num-1]);
  } else if(e.key === ' '){
    e.preventDefault();
    startMixing();
  } else if(e.key === 'Enter'){
    startBaking();
  } else if(e.key === 'r' || e.key === 'R'){
    resetBowl();
  }
}

function initGame(){
  loadSave();
  updateStats();
  renderRecipeList();
  renderControls();
  initCanvas();
  checkUnlockRecipes();
  document.addEventListener('keydown', handleKeyboard);
}

document.getElementById('start-game-btn').addEventListener('click', function(){
  document.getElementById('startScreen').style.display = 'none';
  gameState = STATE_PLAYING;
  initGame();
  if(RECIPES.length>0) selectRecipe(RECIPES[0]);
});

GameCore.init({ touch:false, loading:false });
</script>

<script>
(function(){
  if (window.__batchFixTouch) return;

  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>

<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>

<script>
(function(){
  if (window.__batchPauseFix) return;
  window.__batchPauseFix = true;
  var _paused = false;
  var _overlay = document.createElement('div');
  _overlay.id = 'batchPauseOverlay';
  _overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:9999;display:none;align-items:center;justify-content:center;color:#fff;font:bold 32px sans-serif;cursor:pointer';
  _overlay.textContent = 'PAUSED (click to resume)';
  _overlay.addEventListener('click', function(){ togglePause(); });
  document.body.appendChild(_overlay);
  window.togglePause = function() {
    _paused = !_paused;
    _overlay.style.display = _paused ? 'flex' : 'none';
  };
  window.isPaused = function() { return _paused; };
  document.addEventListener('keydown', function(e) {
    if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
      e.preventDefault();
      togglePause();
    }
  });
  var _origRAF = window.requestAnimationFrame || function(cb){return setTimeout(cb,16)};
  window.requestAnimationFrame = function(cb) {
    return _origRAF.call(window, function(ts) {
      if (!_paused) cb(ts);
      else window.requestAnimationFrame(cb);
    });
  };
})();
</script>
