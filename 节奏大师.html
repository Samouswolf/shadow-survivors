</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const DW = 480;
const DH = 800;

function roundRectFill(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.lineTo(x + w - r, y);
  c.arcTo(x + w, y, x + w, y + r, r);
  c.lineTo(x + w, y + h - r);
  c.arcTo(x + w, y + h, x + w - r, y + h, r);
  c.lineTo(x + r, y + h);
  c.arcTo(x, y + h, x, y + h - r, r);
  c.lineTo(x, y + r);
  c.arcTo(x, y, x + r, y, r);
  c.closePath();
  c.fill();
}

function resizeCanvas() {
  const ratio = Math.min(window.innerWidth / DW, window.innerHeight / DH);
  canvas.width = DW;
  canvas.height = DH;
  canvas.style.width = DW * ratio + 'px';
  canvas.style.height = DH * ratio + 'px';
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const COLORS = {
  bg: '#0a0a1a',
  trackBg: '#141428',
  trackLine: '#2a2a55',
  noteColors: ['#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4'],
  slideColor: '#ffaa00',
  doubleColor: '#ff69b4',
  longColor: '#aa88ff',
  perfect: '#ffd700',
  good: '#4ecdc4',
  miss: '#ff4444',
  combo: '#ffaa00',
  text: '#ffffff'
};

const STATE = { MENU: 0, SONG_SELECT: 1, PLAYING: 2, RESULTS: 3 };
const DIFFICULTY = ['Easy', 'Normal', 'Hard'];
const DIFF_COLORS = ['#4ecdc4', '#ffd700', '#ff6b6b'];

const TRACK_COUNT = 4;
const TRACK_WIDTH = 80;
const TRACK_GAP = 10;
const TRACK_TOTAL = TRACK_WIDTH * TRACK_COUNT + TRACK_GAP * (TRACK_COUNT - 1);
const TRACK_X = (DW - TRACK_TOTAL) / 2;
const JUDGE_Y = DH - 130;
const NOTE_SPEED = 380;
const SPAWN_Y = -60;

const JUDGE = {
  PERFECT: { name: 'Perfect', score: 100, color: COLORS.perfect, ms: 45 },
  GOOD: { name: 'Good', score: 50, color: COLORS.good, ms: 100 },
  MISS: { name: 'Miss', score: 0, color: COLORS.miss, ms: Infinity }
};

const SONGS = [
  { name: '电子节拍', artist: 'Synth Wave', bpm: 120, icon: '⚡', easy: 100, normal: 200, hard: 300, color: '#ff6b6b' },
  { name: '摇滚节奏', artist: 'Rock Power', bpm: 140, icon: '🔥', easy: 120, normal: 240, hard: 360, color: '#4ecdc4' },
  { name: '古典旋律', artist: 'Classic Dreams', bpm: 100, icon: '🎵', easy: 80, normal: 160, hard: 240, color: '#45b7d1' }
];

const KEY_MAP = { d: 0, f: 1, j: 2, k: 3 };
const KEY_LABELS = ['D', 'F', 'J', 'K'];

class RhythmGame {
  constructor() {
    this.state = STATE.MENU;
    this.selectedSong = 0;
    this.selectedDiff = 1;
    this.now = 0;

    this.score = 0;
    this.combo = 0;
    this.maxCombo = 0;
    this.multiplier = 1;
    this.chart = [];
    this.active = [];
    this.effects = [];
    this.trackFlash = [0, 0, 0, 0];
    this.keys = [false, false, false, false];
    this.songTime = 0;
    this.songDuration = 0;
    this.chartIdx = 0;
    this.chartLen = 0;
    this.perfects = 0;
    this.goods = 0;
    this.misses = 0;
    this.bgPulse = 0;
    this.pulseAcc = 0;

    this.touchMap = {};
    this.storage = this.loadStorage();
    this.audioCtx = null;
    this.bgmGain = null;
    this.bgmNodes = [];
    this.nextBeatTime = 0;
    this.beatCount = 0;

    this.bindInput();
    this.ensureAudio();
  }

  ensureAudio() {
    if (this.audioCtx) {
      if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
      return;
    }
    try {
      this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      this.bgmGain = this.audioCtx.createGain();
      this.bgmGain.gain.value = 0.25;
      this.bgmGain.connect(this.audioCtx.destination);
    } catch(e) {}
  }

  loadStorage() {
    try {
      const d = localStorage.getItem('rhythmMaster');
      return d ? JSON.parse(d) : {};
    } catch(e) { return {}; }
  }

  saveStorage() {
    try { localStorage.setItem('rhythmMaster', JSON.stringify(this.storage)); } catch(e) {}
  }

  saveKey(si, di) { return `s${si}_d${di}`; }

  updateHigh() {
    const k = this.saveKey(this.selectedSong, this.selectedDiff);
    const cur = this.storage[k];
    if (!cur || cur.score < this.score) {
      this.storage[k] = { score: this.score, combo: this.maxCombo, grade: this.getGrade() };
      this.saveStorage();
    }
  }

  getHigh() {
    return this.storage[this.saveKey(this.selectedSong, this.selectedDiff)] || { score: 0, combo: 0, grade: '-' };
  }

  bindInput() {
    document.addEventListener('keydown', (e) => {
      this.ensureAudio();
      if (e.repeat) return;
      if (this.state === STATE.PLAYING) {
        const t = KEY_MAP[e.key.toLowerCase()];
        if (t !== undefined && !this.keys[t]) {
          this.keys[t] = true;
          this.judgePress(t);
        }
      } else if (this.state === STATE.MENU) {
        this.state = STATE.SONG_SELECT;
      }
    });

    document.addEventListener('keyup', (e) => {
      if (this.state === STATE.PLAYING) {
        const t = KEY_MAP[e.key.toLowerCase()];
        if (t !== undefined) {
          this.keys[t] = false;
          this.releaseLong(t);
        }
      }
    });

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      this.ensureAudio();
      const rect = canvas.getBoundingClientRect();
      for (const touch of e.changedTouches) {
        const x = (touch.clientX - rect.left) / rect.width * DW;
        const y = (touch.clientY - rect.top) / rect.height * DH;
        this.handleTouch(x, y, touch.identifier);
      }
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
      e.preventDefault();
      for (const touch of e.changedTouches) {
        const tid = touch.identifier;
        for (let i = 0; i < TRACK_COUNT; i++) {
          if (this.touchMap[i] === tid) {
            this.keys[i] = false;
            this.releaseLong(i);
            delete this.touchMap[i];
          }
        }
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      for (const touch of e.changedTouches) {
        const x = (touch.clientX - rect.left) / rect.width * DW;
        const track = this.xToTrack(x);
        for (let i = 0; i < TRACK_COUNT; i++) {
          if (this.touchMap[i] === touch.identifier && i !== track) {
            this.keys[i] = false;
            this.releaseLong(i);
            delete this.touchMap[i];
            if (track >= 0 && track < TRACK_COUNT && !this.keys[track]) {
              this.keys[track] = true;
              this.touchMap[track] = touch.identifier;
              this.judgeSlide(track);
            }
          }
        }
      }
    }, { passive: false });

    canvas.addEventListener('click', (e) => {
      this.ensureAudio();
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width * DW;
      const y = (e.clientY - rect.top) / rect.height * DH;
      this.handleClick(x, y);
    });
  }

  xToTrack(x) {
    return Math.floor((x - TRACK_X) / (TRACK_WIDTH + TRACK_GAP));
  }

  trackToX(t) {
    return TRACK_X + t * (TRACK_WIDTH + TRACK_GAP) + TRACK_WIDTH / 2;
  }

  handleClick(x, y) {
    if (this.state === STATE.MENU) {
      this.state = STATE.SONG_SELECT;
      return;
    }
    if (this.state === STATE.SONG_SELECT) {
      for (let i = 0; i < 3; i++) {
        if (x > 30 && x < 450 && y > 100 + i * 130 && y < 215 + i * 130) this.selectedSong = i;
      }
      for (let i = 0; i < 3; i++) {
        if (x > 70 + i * 130 && x < 180 + i * 130 && y > 525 && y < 575) this.selectedDiff = i;
      }
      if (x > 120 && x < 360 && y > 610 && y < 675) this.startGame();
      if (x > 10 && x < 80 && y > 10 && y < 50) this.state = STATE.MENU;
      return;
    }
    if (this.state === STATE.RESULTS) {
      if (x > 120 && x < 360 && y > 530 && y < 600) this.state = STATE.SONG_SELECT;
      if (x > 120 && x < 360 && y > 620 && y < 690) this.startGame();
      return;
    }
  }

  handleTouch(x, y, tid) {
    if (this.state === STATE.MENU) { this.handleClick(x, y); return; }
    if (this.state === STATE.SONG_SELECT) { this.handleClick(x, y); return; }
    if (this.state === STATE.RESULTS) { this.handleClick(x, y); return; }
    if (this.state === STATE.PLAYING) {
      const t = this.xToTrack(x);
      if (t >= 0 && t < TRACK_COUNT) {
        this.keys[t] = true;
        this.touchMap[t] = tid;
        this.judgePress(t);
      }
    }
  }

  judgePress(track) {
    this.trackFlash[track] = 1;
    let best = null;
    let bestDiff = Infinity;
    for (const n of this.active) {
      if (n.track !== track || n.hit || n.missed) continue;
      const diff = Math.abs(this.songTime - n.time);
      if (diff < bestDiff) { bestDiff = diff; best = n; }
    }
    if (!best) return;
    if (best.type === 'double') {
      if (!this.keys[best.partner]) return;
      let partnerNote = null;
      for (const pn of this.active) {
        if (pn.track === best.partner && pn.time === best.time && pn.type === 'double' && !pn.hit && !pn.missed) {
          partnerNote = pn;
          break;
        }
      }
      const jdg = bestDiff <= JUDGE.PERFECT.ms ? JUDGE.PERFECT : JUDGE.GOOD;
      this.hitNote(best, jdg);
      if (partnerNote) this.hitNote(partnerNote, jdg);
      return;
    }
    if (best.type === 'long') {
      best.holding = true;
      best.holdStart = this.songTime;
      this.hitNote(best, bestDiff <= JUDGE.PERFECT.ms ? JUDGE.PERFECT : JUDGE.GOOD);
      return;
    }
    if (bestDiff <= JUDGE.PERFECT.ms) {
      this.hitNote(best, JUDGE.PERFECT);
    } else if (bestDiff <= JUDGE.GOOD.ms) {
      this.hitNote(best, JUDGE.GOOD);
    }
  }

  judgeSlide(targetTrack) {
    this.trackFlash[targetTrack] = 1;
    let best = null;
    let bestDiff = Infinity;
    for (const n of this.active) {
      if (n.track !== targetTrack || n.hit || n.missed || n.type !== 'slide') continue;
      const diff = Math.abs(this.songTime - n.time);
      if (diff < bestDiff) { bestDiff = diff; best = n; }
    }
    if (best && bestDiff <= JUDGE.GOOD.ms) {
      this.hitNote(best, bestDiff <= JUDGE.PERFECT.ms ? JUDGE.PERFECT : JUDGE.GOOD);
    }
  }

  releaseLong(track) {
    for (const n of this.active) {
      if (n.track === track && n.type === 'long' && n.holding) {
        n.holding = false;
        const heldMs = this.songTime - n.holdStart;
        const totalMs = n.duration || 1;
        const ratio = Math.min(1, heldMs / totalMs);
        const bonus = Math.floor(ratio * 50 * this.multiplier);
        this.score += bonus;
        if (ratio >= 0.8) {
          this.effects.push({ text: '+' + bonus, color: COLORS.perfect, x: this.trackToX(track), y: JUDGE_Y - 60, alpha: 1, scale: 1.2 });
        }
        break;
      }
    }
  }

  hitNote(note, judge) {
    note.hit = true;
    const baseScore = note.type === 'double' ? judge.score * 2 : judge.score;
    this.score += Math.floor(baseScore * this.multiplier);
    this.combo++;
    if (this.combo > this.maxCombo) this.maxCombo = this.combo;
    this.multiplier = Math.min(10, 1 + Math.floor(this.combo / 10));
    if (judge === JUDGE.PERFECT) this.perfects++;
    else this.goods++;

    const x = this.trackToX(note.track);
    this.effects.push({ text: judge.name, color: judge.color, x: x, y: JUDGE_Y - 30, alpha: 1, scale: 1.6 });

    if (this.audioCtx) {
      const freqs = [523.25, 659.25, 783.99, 1046.50];
      const osc = this.audioCtx.createOscillator();
      const g = this.audioCtx.createGain();
      osc.connect(g); g.connect(this.audioCtx.destination);
      osc.type = judge === JUDGE.PERFECT ? 'sine' : 'triangle';
      osc.frequency.value = freqs[note.track];
      g.gain.value = judge === JUDGE.PERFECT ? 0.35 : 0.2;
      osc.start();
      g.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.12);
      osc.stop(this.audioCtx.currentTime + 0.13);
    }
  }

  missNote(note) {
    if (note.missed) return;
    note.missed = true;
    note.holding = false;
    this.combo = 0;
    this.multiplier = 1;
    this.misses++;
    const x = this.trackToX(note.track);
    this.effects.push({ text: 'Miss', color: COLORS.miss, x: x, y: JUDGE_Y - 30, alpha: 1, scale: 1.4 });
    if (this.audioCtx) {
      const osc = this.audioCtx.createOscillator();
      const g = this.audioCtx.createGain();
      osc.connect(g); g.connect(this.audioCtx.destination);
      osc.type = 'sawtooth';
      osc.frequency.value = 120;
      g.gain.value = 0.1;
      osc.start();
      g.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.2);
      osc.stop(this.audioCtx.currentTime + 0.21);
    }
  }

  startGame() {
    this.state = STATE.PLAYING;
    this.score = 0;
    this.combo = 0;
    this.maxCombo = 0;
    this.multiplier = 1;
    this.chart = [];
    this.active = [];
    this.effects = [];
    this.trackFlash = [0, 0, 0, 0];
    this.keys = [false, false, false, false];
    this.songTime = 0;
    this.chartIdx = 0;
    this.perfects = 0;
    this.goods = 0;
    this.misses = 0;
    this.bgPulse = 0;
    this.pulseAcc = 0;
    this.touchMap = {};
    this.nextBeatTime = this.audioCtx ? this.audioCtx.currentTime + 0.1 : 0;
    this.beatCount = 0;
    this.generateChart();
    this.chartLen = this.chart.length;
    this.songDuration = this.chartLen > 0 ? this.chart[this.chartLen - 1].time + 3000 : 10000;
  }

  generateChart() {
    const song = SONGS[this.selectedSong];
    const diffKey = ['easy', 'normal', 'hard'][this.selectedDiff];
    const count = song[diffKey];
    const beat = 60000 / song.bpm;
    this.chart = [];
    let time = 1500;
    let lastTrack = -1;

    for (let i = 0; i < count; i++) {
      const roll = Math.random();
      let type = 'normal';
      if (roll < 0.08) type = 'long';
      else if (roll < 0.14) type = 'slide';
      else if (roll < 0.18) type = 'double';

      if (type === 'double') {
        const t1 = Math.floor(Math.random() * TRACK_COUNT);
        let t2 = (t1 + 1 + Math.floor(Math.random() * (TRACK_COUNT - 1))) % TRACK_COUNT;
        this.chart.push({ time, track: t1, type: 'double', partner: t2, duration: 0, hit: false, missed: false, holding: false, holdStart: 0 });
        this.chart.push({ time, track: t2, type: 'double', partner: t1, duration: 0, hit: false, missed: false, holding: false, holdStart: 0 });
      } else {
        let track;
        if (this.selectedDiff >= 2) {
          track = Math.floor(Math.random() * TRACK_COUNT);
          if (track === lastTrack && Math.random() < 0.5) track = (track + 1 + Math.floor(Math.random() * 3)) % TRACK_COUNT;
        } else {
          track = Math.floor(Math.random() * TRACK_COUNT);
        }
        lastTrack = track;
        const dur = type === 'long' ? beat * (1.5 + Math.random()) : 0;
        this.chart.push({ time, track, type, duration: dur, hit: false, missed: false, holding: false, holdStart: 0 });
      }

      const gapMult = this.selectedDiff === 0 ? 1.2 : this.selectedDiff === 1 ? 0.9 : 0.65;
      time += beat * (gapMult + Math.random() * 0.4);
    }
    this.chart.sort((a, b) => a.time - b.time);
  }

  scheduleBeat() {
    if (!this.audioCtx || !this.bgmGain) return;
    const song = SONGS[this.selectedSong];
    const beatDur = 60 / song.bpm;
    while (this.nextBeatTime < this.audioCtx.currentTime + 0.2) {
      const isDown = this.beatCount % 4 === 0;
      const t = this.nextBeatTime;

      const osc = this.audioCtx.createOscillator();
      const g = this.audioCtx.createGain();
      osc.connect(g); g.connect(this.bgmGain);
      osc.type = 'sine';
      osc.frequency.value = isDown ? 75 : 55;
      g.gain.setValueAtTime(isDown ? 0.4 : 0.2, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
      osc.start(t);
      osc.stop(t + 0.13);

      if (this.beatCount % 2 === 1) {
        const bufLen = Math.floor(this.audioCtx.sampleRate * 0.03);
        const buf = this.audioCtx.createBuffer(1, bufLen, this.audioCtx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < bufLen; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufLen, 4);
        const src = this.audioCtx.createBufferSource();
        const hg = this.audioCtx.createGain();
        src.buffer = buf;
        src.connect(hg); hg.connect(this.bgmGain);
        hg.gain.value = 0.35;
        src.start(t);
      }

      this.nextBeatTime += beatDur;
      this.beatCount++;
    }
  }

  update(dt) {
    if (this.state !== STATE.PLAYING) return;
    this.songTime += dt * 1000;

    const song = SONGS[this.selectedSong];
    const beatMs = 60000 / song.bpm;
    this.pulseAcc += dt * 1000;
    if (this.pulseAcc >= beatMs) {
      this.pulseAcc -= beatMs;
      this.bgPulse = 1;
    }
    this.bgPulse *= 0.88;

    if (this.audioCtx && this.audioCtx.state === 'running') {
      this.scheduleBeat();
    }

    const travelTime = (JUDGE_Y - SPAWN_Y) / NOTE_SPEED * 1000;
    while (this.chartIdx < this.chart.length) {
      const note = this.chart[this.chartIdx];
      if (note.time - travelTime <= this.songTime) {
        this.active.push(note);
        this.chartIdx++;
      } else break;
    }

    for (let i = this.active.length - 1; i >= 0; i--) {
      const n = this.active[i];
      n.y = SPAWN_Y + (this.songTime - (n.time - travelTime)) / 1000 * NOTE_SPEED;

      if (!n.hit && !n.missed && n.y > JUDGE_Y + 60) {
        this.missNote(n);
      }

      if (n.y > DH + 80 || (n.hit && !n.holding)) {
        this.active.splice(i, 1);
      }
    }

    for (let i = this.effects.length - 1; i >= 0; i--) {
      const ef = this.effects[i];
      ef.y -= dt * 120;
      ef.alpha -= dt * 1.8;
      ef.scale = Math.max(1, ef.scale - dt * 4);
      if (ef.alpha <= 0) this.effects.splice(i, 1);
    }

    for (let i = 0; i < TRACK_COUNT; i++) {
      this.trackFlash[i] = Math.max(0, this.trackFlash[i] - dt * 5);
    }

    if (this.songTime >= this.songDuration) this.finishGame();
  }

  finishGame() {
    for (const n of this.active) {
      if (n.holding) {
        this.releaseLong(n.track);
      }
      if (!n.hit && !n.missed) this.missNote(n);
    }
    this.state = STATE.RESULTS;
    this.updateHigh();
  }

  getGrade() {
    const total = this.perfects + this.goods + this.misses;
    if (total === 0) return 'D';
    const acc = (this.perfects * 100 + this.goods * 50) / (total * 100);
    if (acc >= 0.95) return 'S';
    if (acc >= 0.85) return 'A';
    if (acc >= 0.70) return 'B';
    if (acc >= 0.50) return 'C';
    return 'D';
  }

  render() {
    ctx.clearRect(0, 0, DW, DH);
    switch (this.state) {
      case STATE.MENU: this.renderMenu(); break;
      case STATE.SONG_SELECT: this.renderSongSelect(); break;
      case STATE.PLAYING: this.renderGame(); break;
      case STATE.RESULTS: this.renderResults(); break;
    }
  }

  renderMenu() {
    const t = this.now / 1000;
    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(0, 0, DW, DH);

    for (let i = 0; i < 12; i++) {
      ctx.strokeStyle = '#222244';
      ctx.lineWidth = 1;
      const yy = ((i * 70 + t * 30) % (DH + 70)) - 35;
      ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(DW, yy); ctx.stroke();
    }

    for (let i = 0; i < 10; i++) {
      const cx = 60 + (i % 5) * 90;
      const cy = 260 + Math.sin(t * 1.5 + i * 1.2) * 40;
      const sz = 12 + Math.sin(t * 2.5 + i) * 6;
      ctx.fillStyle = COLORS.noteColors[i % 4];
      ctx.globalAlpha = 0.25 + Math.sin(t + i * 0.8) * 0.15;
      ctx.beginPath(); ctx.arc(cx, cy, sz, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }

    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 56px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('节奏大师', DW / 2, 160);
    ctx.fillStyle = '#777';
    ctx.font = '18px Arial';
    ctx.fillText('Rhythm Master', DW / 2, 195);

    ctx.fillStyle = '#4444aa';
    roundRectFill(ctx, 120, 380, 240, 80, 12);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 30px Arial';
    ctx.fillText('开始游戏', DW / 2, 430);

    ctx.fillStyle = '#555';
    ctx.font = '15px Arial';
    ctx.fillText('键盘: D / F / J / K', DW / 2, 510);
    ctx.fillText('移动端: 触摸四个轨道', DW / 2, 535);

    ctx.fillStyle = '#333';
    ctx.font = '13px Arial';
    ctx.fillText('点击任意位置开始', DW / 2, 580);
  }

  renderSongSelect() {
    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(0, 0, DW, DH);

    ctx.fillStyle = '#333366';
    roundRectFill(ctx, 10, 10, 70, 40, 6);
    ctx.fillStyle = '#fff';
    ctx.font = '16px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('返回', 45, 35);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 32px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('选择曲目', DW / 2, 70);

    for (let i = 0; i < SONGS.length; i++) {
      const s = SONGS[i];
      const y = 100 + i * 130;
      const sel = i === this.selectedSong;

      ctx.fillStyle = sel ? '#2a2a5a' : '#1a1a35';
      ctx.strokeStyle = sel ? s.color : '#333355';
      ctx.lineWidth = sel ? 3 : 1;
      roundRectFill(ctx, 30, y, DW - 60, 115, 10);
      ctx.stroke();

      ctx.fillStyle = s.color;
      ctx.font = 'bold 26px Arial';
      ctx.textAlign = 'left';
      ctx.fillText(s.name, 60, y + 38);

      ctx.fillStyle = '#777';
      ctx.font = '14px Arial';
      ctx.fillText(s.artist, 60, y + 60);
      ctx.fillText(`BPM ${s.bpm}`, 60, y + 80);

      const dKey = ['easy', 'normal', 'hard'][this.selectedDiff];
      ctx.fillStyle = '#999';
      ctx.font = '14px Arial';
      ctx.textAlign = 'right';
      ctx.fillText(`${s[dKey]} 音符`, DW - 50, y + 80);

      ctx.fillStyle = s.color;
      ctx.font = 'bold 36px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(s.icon, DW - 70, y + 55);
    }

    ctx.fillStyle = '#ddd';
    ctx.font = 'bold 22px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('难度', DW / 2, 510);

    for (let i = 0; i < 3; i++) {
      const x = 70 + i * 130;
      const sel = i === this.selectedDiff;
      ctx.fillStyle = sel ? DIFF_COLORS[i] : '#1a1a35';
      ctx.strokeStyle = DIFF_COLORS[i];
      ctx.lineWidth = sel ? 3 : 1;
      roundRectFill(ctx, x, 525, 110, 50, 8);
      ctx.stroke();
      ctx.fillStyle = sel ? '#000' : '#fff';
      ctx.font = 'bold 18px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(DIFFICULTY[i], x + 55, 556);
    }

    ctx.fillStyle = '#4444aa';
    roundRectFill(ctx, 120, 610, 240, 65, 10);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 26px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('开始', DW / 2, 650);

    const h = this.getHigh();
    if (h.score > 0) {
      ctx.fillStyle = '#ffd700';
      ctx.font = '13px Arial';
      ctx.fillText(`最高分: ${h.score}  最高Combo: ${h.combo}  评级: ${h.grade}`, DW / 2, 710);
    }
  }

  renderGame() {
    const r = Math.floor(10 + this.bgPulse * 25);
    const g = Math.floor(10 + this.bgPulse * 15);
    const b = Math.floor(26 + this.bgPulse * 35);
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fillRect(0, 0, DW, DH);

    const endX = TRACK_X + TRACK_TOTAL;

    for (let i = 0; i < TRACK_COUNT; i++) {
      const x = TRACK_X + i * (TRACK_WIDTH + TRACK_GAP);
      ctx.fillStyle = COLORS.trackBg;
      ctx.fillRect(x, 0, TRACK_WIDTH, DH);

      if (this.trackFlash[i] > 0.05) {
        ctx.fillStyle = COLORS.noteColors[i];
        ctx.globalAlpha = this.trackFlash[i] * 0.4;
        ctx.fillRect(x, 0, TRACK_WIDTH, DH);
        ctx.globalAlpha = 1;
      }

      if (this.keys[i]) {
        const grad = ctx.createLinearGradient(x, JUDGE_Y - 60, x, JUDGE_Y + 30);
        grad.addColorStop(0, 'rgba(255,255,255,0)');
        grad.addColorStop(0.5, COLORS.noteColors[i] + '80');
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(x, JUDGE_Y - 60, TRACK_WIDTH, 90);
      }
    }

    ctx.strokeStyle = COLORS.trackLine;
    ctx.lineWidth = 1;
    for (let i = 0; i <= TRACK_COUNT; i++) {
      const x = TRACK_X + i * (TRACK_WIDTH + TRACK_GAP);
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, DH); ctx.stroke();
    }

    const glow = 0.5 + Math.sin(this.now / 200) * 0.3;
    ctx.strokeStyle = `rgba(255,255,255,${glow})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(TRACK_X, JUDGE_Y); ctx.lineTo(endX, JUDGE_Y); ctx.stroke();

    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    ctx.fillRect(TRACK_X, JUDGE_Y - 45, TRACK_TOTAL, 90);

    for (const n of this.active) {
      if (n.hit && n.type !== 'long') continue;
      if (n.missed && n.y > JUDGE_Y + 50) continue;

      const nx = this.trackToX(n.track);
      const color = n.type === 'slide' ? COLORS.slideColor :
                    n.type === 'double' ? COLORS.doubleColor :
                    n.type === 'long' ? COLORS.longColor :
                    COLORS.noteColors[n.track];

      if (n.type === 'long' && n.duration > 0) {
        const tailLen = n.duration / 1000 * NOTE_SPEED;
        const tailTop = n.y - tailLen;
        ctx.fillStyle = color;
        ctx.globalAlpha = n.holding ? 0.6 : 0.35;
        roundRectFill(ctx, nx - 12, tailTop, 24, tailLen, 6);
        ctx.globalAlpha = 1;
      }

      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath(); ctx.arc(nx + 2, n.y + 2, 20, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(nx, n.y, 20, 0, Math.PI * 2); ctx.fill();

      if (n.type === 'slide') {
        ctx.fillStyle = '#fff';
        ctx.globalAlpha = 0.7;
        ctx.font = 'bold 16px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('→', nx, n.y + 5);
        ctx.globalAlpha = 1;
      } else if (n.type === 'double') {
        ctx.fillStyle = '#fff';
        ctx.globalAlpha = 0.6;
        ctx.font = 'bold 14px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('2', nx, n.y + 5);
        ctx.globalAlpha = 1;
      } else {
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.beginPath(); ctx.arc(nx - 6, n.y - 6, 8, 0, Math.PI * 2); ctx.fill();
      }
    }

    for (const ef of this.effects) {
      ctx.fillStyle = ef.color;
      ctx.globalAlpha = Math.max(0, ef.alpha);
      ctx.font = `bold ${Math.floor(22 * ef.scale)}px Arial`;
      ctx.textAlign = 'center';
      ctx.fillText(ef.text, ef.x, ef.y);
      ctx.globalAlpha = 1;
    }

    this.renderHUD();

    for (let i = 0; i < TRACK_COUNT; i++) {
      const x = this.trackToX(i);
      ctx.fillStyle = this.keys[i] ? '#fff' : '#555';
      ctx.font = 'bold 22px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(KEY_LABELS[i], x, JUDGE_Y + 45);
    }
  }

  renderHUD() {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 24px Arial';
    ctx.textAlign = 'left';
    ctx.fillText(`${this.score}`, 15, 35);

    ctx.fillStyle = '#888';
    ctx.font = '14px Arial';
    ctx.fillText(DIFFICULTY[this.selectedDiff], 15, 55);

    if (this.combo > 0) {
      const cs = 1 + Math.min(this.combo / 100, 0.6);
      const cSize = Math.floor(52 * cs);
      ctx.fillStyle = COLORS.combo;
      ctx.font = `bold ${cSize}px Arial`;
      ctx.textAlign = 'center';
      ctx.fillText(`${this.combo}`, DW / 2, DH / 2 - 60);
      ctx.fillStyle = '#ddd';
      ctx.font = 'bold 18px Arial';
      ctx.fillText('COMBO', DW / 2, DH / 2 - 35);
      if (this.multiplier > 1) {
        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 20px Arial';
        ctx.fillText(`${this.multiplier}x`, DW / 2, DH / 2 - 12);
      }
    }

    const prog = Math.max(0, Math.min(1, this.songTime / this.songDuration));
    ctx.fillStyle = '#222244';
    roundRectFill(ctx, 15, DH - 25, DW - 30, 8, 4);
    ctx.fillStyle = '#5555cc';
    roundRectFill(ctx, 15, DH - 25, (DW - 30) * prog, 8, 4);
  }

  renderResults() {
    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(0, 0, DW, DH);

    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 42px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('演奏结束', DW / 2, 60);

    const grade = this.getGrade();
    const gc = { S: '#ffd700', A: '#4ecdc4', B: '#45b7d1', C: '#96ceb4', D: '#ff6b6b' };
    ctx.fillStyle = gc[grade];
    ctx.font = 'bold 130px Arial';
    ctx.fillText(grade, DW / 2, 220);

    const stats = [
      ['最终得分', this.score],
      ['最高Combo', this.maxCombo],
      ['Perfect', this.perfects],
      ['Good', this.goods],
      ['Miss', this.misses]
    ];

    stats.forEach(([label, val], i) => {
      const sy = 290 + i * 36;
      ctx.fillStyle = '#888';
      ctx.font = '17px Arial';
      ctx.textAlign = 'right';
      ctx.fillText(label + ':', DW / 2 - 15, sy);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 20px Arial';
      ctx.textAlign = 'left';
      ctx.fillText(String(val), DW / 2 + 15, sy);
    });

    const total = this.perfects + this.goods + this.misses;
    if (total > 0) {
      const acc = ((this.perfects * 100 + this.goods * 50) / (total * 100) * 100).toFixed(1);
      ctx.fillStyle = '#aaa';
      ctx.font = '15px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(`准确率: ${acc}%`, DW / 2, 490);
    }

    const h = this.getHigh();
    ctx.fillStyle = '#ffd700';
    ctx.font = '14px Arial';
    ctx.fillText(`历史最高: ${h.score} | 评级: ${h.grade}`, DW / 2, 515);

    ctx.fillStyle = '#4444aa';
    roundRectFill(ctx, 120, 540, 240, 60, 10);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 22px Arial';
    ctx.fillText('返回选曲', DW / 2, 578);

    ctx.fillStyle = '#336633';
    roundRectFill(ctx, 120, 620, 240, 60, 10);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 22px Arial';
    ctx.fillText('重新开始', DW / 2, 658);
  }

  run() {
    let last = performance.now();
    const loop = (t) => {
      const dt = Math.min((t - last) / 1000, 0.05);
      last = t;
      this.now = t;
      this.update(dt);
      this.render();
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
}

const game = new RhythmGame();
game.run();
