<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>火柴人格斗</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#0a0a12;display:flex;justify-content:center;align-items:center;overflow:hidden;font-family:'Microsoft YaHei',Arial,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;max-width:100vw;max-height:100vh}
#touch-controls{position:absolute;bottom:0;left:0;width:100%;height:45%;display:none;pointer-events:none;z-index:10}
.touch-panel{position:absolute;bottom:8px;display:grid;grid-template-columns:repeat(2,1fr);gap:6px;pointer-events:none}
.touch-panel.p1{left:8px}
.touch-panel.p2{right:8px}
.tbtn{pointer-events:auto;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:bold;color:rgba(255,255,255,0.85);border-radius:10px;min-width:54px;min-height:54px;-webkit-tap-highlight-color:transparent}
.tbtn:active{transform:scale(0.9)}
.tbtn.dir{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2)}
.tbtn.atk{border:1px solid rgba(255,255,255,0.15)}
.tbtn.punch{background:rgba(255,200,50,0.25)}
.tbtn.kick{background:rgba(50,200,255,0.25)}
.tbtn.block{background:rgba(100,255,100,0.2)}
.tbtn.special{background:rgba(255,50,50,0.3)}
</style>
</head>
<body>
<canvas id="gc"></canvas>
<div id="touch-controls">
  <div class="touch-panel p1">
    <div class="tbtn dir" data-player="1" data-action="left">&larr;</div>
    <div class="tbtn dir" data-player="1" data-action="right">&rarr;</div>
    <div class="tbtn block" data-player="1" data-action="block">挡</div>
    <div class="tbtn punch" data-player="1" data-action="punch">拳</div>
    <div class="tbtn kick" data-player="1" data-action="kick">踢</div>
    <div class="tbtn special" data-player="1" data-action="special">必</div>
  </div>
  <div class="touch-panel p2">
    <div class="tbtn dir" data-player="2" data-action="left">&larr;</div>
    <div class="tbtn dir" data-player="2" data-action="right">&rarr;</div>
    <div class="tbtn block" data-player="2" data-action="block">挡</div>
    <div class="tbtn punch" data-player="2" data-action="punch">拳</div>
    <div class="tbtn kick" data-player="2" data-action="kick">踢</div>
    <div class="tbtn special" data-player="2" data-action="special">必</div>
  </div>
</div>
<script>
(function(){
'use strict';

const c=document.getElementById('gc'),ctx=c.getContext('2d');
const W=800,H=500;
c.width=W;c.height=H;
function resize(){const r=W/H;let w=window.innerWidth-20,h=window.innerHeight-20;if(w/h>r){c.style.width=(h*r)+'px';c.style.height=h+'px';}else{c.style.width=w+'px';c.style.height=(w/r)+'px';}}
window.addEventListener('resize',resize);resize();

// ---- Input ----
const keys={};
window.addEventListener('keydown',e=>{keys[e.code]=true;e.preventDefault();});
window.addEventListener('keyup',e=>{keys[e.code]=false;});

// ---- Touch Controls ----
const touchKeyMap={
  '1':{left:'KeyA',right:'KeyD',punch:'KeyF',kick:'KeyG',block:'KeyS',special:'KeyH'},
  '2':{left:'ArrowLeft',right:'ArrowRight',punch:'KeyJ',kick:'KeyK',block:'ArrowDown',special:'KeyL'}
};
const isTouchDevice='ontouchstart'in window||navigator.maxTouchPoints>0;
if(isTouchDevice){
  document.getElementById('touch-controls').style.display='block';
  const activeTouches=new Map();
  function handleTouch(e,down){
    e.preventDefault();
    if(down&&(gameState==='title')){startFight();return;}
    if(down&&(gameState==='ko')){initGame();return;}
    for(let i=0;i<e.changedTouches.length;i++){
      const t=e.changedTouches[i];
      if(down){
        const el=document.elementFromPoint(t.clientX,t.clientY);
        if(!el||!el.dataset.action)continue;
        const player=el.dataset.player;
        const action=el.dataset.action;
        const code=touchKeyMap[player][action];
        if(code){keys[code]=true;activeTouches.set(t.identifier,{code,el});}
      }else{
        const info=activeTouches.get(t.identifier);
        if(info){keys[info.code]=false;activeTouches.delete(t.identifier);}
      }
    }
  }
  const tc=document.getElementById('touch-controls');
  tc.addEventListener('touchstart',e=>handleTouch(e,true),{passive:false});
  tc.addEventListener('touchend',e=>handleTouch(e,false),{passive:false});
  tc.addEventListener('touchcancel',e=>handleTouch(e,false),{passive:false});
  window.addEventListener('touchend',e=>{
    for(let i=0;i<e.changedTouches.length;i++){
      const info=activeTouches.get(e.changedTouches[i].identifier);
      if(info){keys[info.code]=false;activeTouches.delete(e.changedTouches[i].identifier);}
    }
  },{passive:false});
  window.addEventListener('touchcancel',e=>{
    for(let i=0;i<e.changedTouches.length;i++){
      const info=activeTouches.get(e.changedTouches[i].identifier);
      if(info){keys[info.code]=false;activeTouches.delete(e.changedTouches[i].identifier);}
    }
  },{passive:false});
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){
      activeTouches.forEach(info=>{keys[info.code]=false;});
      activeTouches.clear();
    }
  });
}

// ---- Fighter System ----
const GROUND_Y=420;
const FIGHTERS={
  boxer:{name:'拳击手',color:'#e84040',speed:3.5,hp:120,
    moves:{
      punch:{damage:12,range:50,startup:5,active:8,recovery:8,cooldown:20},
      kick:{damage:8,range:45,startup:8,active:6,recovery:12,cooldown:25},
      special:{damage:25,range:55,startup:12,active:6,recovery:18,cooldown:50}
    },
    draw:function(ctx,x,y,facing,state){
      const f=facing;
      // Stick figure body
      ctx.strokeStyle=this.color;ctx.lineWidth=3;
      // Head
      ctx.beginPath();ctx.arc(x,y-30,12,0,Math.PI*2);ctx.stroke();
      // Body
      ctx.beginPath();ctx.moveTo(x,y-18);ctx.lineTo(x,y+15);ctx.stroke();
      // Arms
      if(state.attackType==='punch'){
        const punchExtend=state.attackTimer<6?state.attackTimer*8:48-state.attackTimer*6;
        ctx.beginPath();ctx.moveTo(x,y-8);ctx.lineTo(x+f*(25+punchExtend),y-8+Math.sin(state.attackTimer)*5);ctx.stroke();
        // Fist glow
        ctx.fillStyle='#ff0';ctx.beginPath();ctx.arc(x+f*(25+punchExtend),y-8+Math.sin(state.attackTimer)*5,6,0,Math.PI*2);ctx.fill();
      }else if(state.attackType==='kick'){
        const ke=state.attackTimer<6?state.attackTimer*10:60-state.attackTimer*8;
        ctx.beginPath();ctx.moveTo(x,y+10);ctx.lineTo(x+f*(15+ke),y+10);ctx.stroke();
      }else if(state.attackType==='special'){
        const se=state.attackTimer*12;
        ctx.beginPath();ctx.moveTo(x,y-8);ctx.lineTo(x+f*(30+se),y-8-Math.sin(state.attackTimer)*10);ctx.lineTo(x+f*(30+se),y+5-Math.sin(state.attackTimer)*10);ctx.stroke();
        ctx.fillStyle='rgba(255,200,0,0.3)';ctx.beginPath();ctx.arc(x+f*(30+se),y-2,se*0.5,0,Math.PI*2);ctx.fill();
      }else{
        // Normal arms
        ctx.beginPath();ctx.moveTo(x,y-8);ctx.lineTo(x-f*18,y+2);ctx.stroke();
        ctx.beginPath();ctx.moveTo(x,y-8);ctx.lineTo(x+f*18,y+2);ctx.stroke();
      }
      // Legs
      const walkCycle=state.attackType?0:Math.sin(state.walkAnim)*8;
      ctx.beginPath();ctx.moveTo(x,y+15);ctx.lineTo(x-12+walkCycle,y+40);ctx.stroke();
      ctx.beginPath();ctx.moveTo(x,y+15);ctx.lineTo(x+12-walkCycle,y+40);ctx.stroke();
      // Block shield
      if(state.blocking){
        ctx.strokeStyle='rgba(100,200,255,0.5)';ctx.lineWidth=4;
        ctx.beginPath();ctx.arc(x+f*20,y-8,30,-Math.PI*0.8*f+Math.PI/2,-Math.PI*0.2*f+Math.PI/2);ctx.stroke();
      }
    }
  },
  ninja:{name:'忍者',color:'#4080e8',speed:4.5,hp:100,
    moves:{
      punch:{damage:8,range:42,startup:4,active:6,recovery:6,cooldown:15},
      kick:{damage:14,range:55,startup:6,active:8,recovery:10,cooldown:22},
      special:{damage:20,range:65,startup:8,active:8,recovery:14,cooldown:45}
    },
    draw:function(ctx,x,y,facing,state){
      const f=facing;
      ctx.strokeStyle=this.color;ctx.lineWidth=2.5;
      // Head
      ctx.beginPath();ctx.arc(x,y-30,10,0,Math.PI*2);ctx.stroke();
      // Ninja headband
      ctx.strokeStyle='#222';ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(x,y-30,10,-Math.PI*0.8,Math.PI*0.8);ctx.stroke();
      // Body
      ctx.beginPath();ctx.moveTo(x-8,y-15);ctx.lineTo(x+8,y-15);ctx.lineTo(x+6,y+15);ctx.lineTo(x-6,y+15);ctx.closePath();ctx.stroke();
      // Arms
      if(state.attackType==='punch'){
        const pe=state.attackTimer*9;
        ctx.beginPath();ctx.moveTo(x,y-8);ctx.lineTo(x+f*(20+pe),y-6);ctx.stroke();
        ctx.fillStyle='#ff0';ctx.beginPath();ctx.arc(x+f*(20+pe),y-6,4,0,Math.PI*2);ctx.fill();
      }else if(state.attackType==='kick'){
        const ke=state.attackTimer*12;
        ctx.beginPath();ctx.moveTo(x,y+8);ctx.lineTo(x+f*(12+ke),y+8+Math.sin(state.attackTimer)*12);ctx.stroke();
        // Leg sweep effect
        ctx.fillStyle='rgba(100,200,255,0.2)';ctx.beginPath();ctx.arc(x+f*(12+ke),y+8+Math.sin(state.attackTimer)*12,8,0,Math.PI*2);ctx.fill();
      }else if(state.attackType==='special'){
        const se=state.attackTimer*15;
        ctx.beginPath();ctx.moveTo(x,y-8);ctx.lineTo(x+f*20,y-15-se);ctx.lineTo(x+f*(20+se),y-5);ctx.stroke();
        // Shuriken effect
        ctx.fillStyle='#888';ctx.beginPath();ctx.arc(x+f*(20+se),y-5,5+state.attackTimer,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='#666';ctx.lineWidth=1;
        for(let i=0;i<4;i++){const a=i*Math.PI/2+state.attackTimer*0.5;ctx.beginPath();ctx.moveTo(x+f*(20+se)+Math.cos(a)*3,y-5+Math.sin(a)*3);ctx.lineTo(x+f*(20+se)+Math.cos(a)*12,y-5+Math.sin(a)*12);ctx.stroke();}
      }else{
        ctx.beginPath();ctx.moveTo(x,y-8);ctx.lineTo(x-f*20,y+4);ctx.stroke();
        ctx.beginPath();ctx.moveTo(x,y-8);ctx.lineTo(x+f*20,y+4);ctx.stroke();
      }
      // Legs
      const wc=state.attackType?0:Math.sin(state.walkAnim)*10;
      ctx.beginPath();ctx.moveTo(x,y+15);ctx.lineTo(x-10+wc,y+40);ctx.stroke();
      ctx.beginPath();ctx.moveTo(x,y+15);ctx.lineTo(x+10-wc,y+40);ctx.stroke();
      // Block
      if(state.blocking){
        ctx.strokeStyle='rgba(100,200,255,0.4)';ctx.lineWidth=3;
        ctx.beginPath();ctx.arc(x+f*22,y-8,28,-Math.PI*0.7*f+Math.PI/2,-Math.PI*0.3*f+Math.PI/2);ctx.stroke();
      }
    }
  }
};

function createFighter(type,pNum,keys){
  const f=FIGHTERS[type];
  return{
    type,pNum,name:f.name,color:f.color,speed:f.speed,hp:f.hp,maxHp:f.hp,
    x:pNum===1?100:W-100,y:GROUND_Y,
    facing:pNum===1?1:-1,
    state:'idle', // idle, walking, attacking, hit, blocking, ko
    attackType:null,attackTimer:0,attackCooldown:0,
    hitTimer:0,blockTimer:0,koTimer:0,walkAnim:0,
    blocking:false,moves:f.moves,draw:f.draw,
    keys,combo:0,comboTimer:0,roundsWon:0,
    canAct:true
  };
}

// ---- Game State ----
let p1,p2,gameState,round,message,msgTimer,winner,comboText;
const MAX_ROUNDS=3;

function initGame(){
  gameState='title';round=1;message='';msgTimer=0;winner=null;comboText=null;
}

function startFight(){
  p1=createFighter('boxer',1,{
    left:'KeyA',right:'KeyD',punch:'KeyF',kick:'KeyG',block:'KeyS',special:'KeyH'
  });
  p2=createFighter('ninja',2,{
    left:'ArrowLeft',right:'ArrowRight',punch:'KeyJ',kick:'KeyK',block:'ArrowDown',special:'KeyL'
  });
  gameState='fight';message='FIGHT!';msgTimer=60;winner=null;
}

function resetRound(){
  p1.x=100;p1.y=GROUND_Y;p1.hp=p1.maxHp;p1.facing=1;
  p1.state='idle';p1.attackType=null;p1.attackTimer=0;p1.attackCooldown=0;
  p1.hitTimer=0;p1.koTimer=0;p1.blocking=false;p1.canAct=true;
  p2.x=W-100;p2.y=GROUND_Y;p2.hp=p2.maxHp;p2.facing=-1;
  p2.state='idle';p2.attackType=null;p2.attackTimer=0;p2.attackCooldown=0;
  p2.hitTimer=0;p2.koTimer=0;p2.blocking=false;p2.canAct=true;
  message='Round '+round+' - FIGHT!';msgTimer=60;
}

// ---- Combat Logic ----
function handleFighterInput(p,opponent){
  if(p.koTimer>0||p.hitTimer>0){p.blocking=false;return;}
  if(p.attackCooldown>0)p.attackCooldown--;
  if(p.attackTimer>0){p.attackTimer--;return;}

  // Attack finished, reset state
  if(p.attackType){
    p.attackType=null;
    p.state='idle';
  }

  const k=p.keys;
  let dx=0;
  if(keys[k.left])dx=-1;
  if(keys[k.right])dx=1;
  p.blocking=!!keys[k.block];

  if(p.attackCooldown<=0&&p.attackTimer<=0){
    if(keys[k.punch]){startAttack(p,'punch');return;}
    if(keys[k.kick]){startAttack(p,'kick');return;}
    if(keys[k.special]){startAttack(p,'special');return;}
  }

  if(p.blocking)dx*=0.3;
  p.x+=dx*p.speed;
  if(dx!==0){p.facing=dx;p.walkAnim+=0.15;if(p.walkAnim>6.28)p.walkAnim=0;}
  else p.walkAnim*=0.9;
  // Clamp
  if(p.x<30)p.x=30;if(p.x>W-30)p.x=W-30;
  // Face opponent
  if(Math.abs(p.x-opponent.x)>5)p.facing=p.x<opponent.x?1:-1;
}

function startAttack(p,type){
  p.attackType=type;p.attackTimer=p.moves[type].startup+p.moves[type].active+p.moves[type].recovery;
  p.attackCooldown=p.moves[type].cooldown;
  p.state='attacking';
}

function checkHits(attacker,defender){
  const a=attacker,b=defender;
  if(!a.attackType||a.attackTimer<=0)return false;
  const move=a.moves[a.attackType];
  const elapsed=a.attackTimer;
  const total=move.startup+move.active+move.recovery;
  const phase=total-elapsed;

  // Active frames check
  if(phase<move.startup||phase>=move.startup+move.active)return false;
  if(b.hitTimer>0||b.koTimer>0)return false;

  // Range check
  const dist=Math.abs(a.x-b.x);
  if(dist>move.range)return false;

  // Facing check
  if((a.x<b.x&&a.facing<0)||(a.x>b.x&&a.facing>0))return false;

  // HIT!
  let damage=move.damage;
  if(b.blocking){
    damage=Math.floor(damage*0.15);
    b.hitTimer=8;
    b.x+=a.facing*20;
    addEffect(b.x,b.y-20,'block',12);
  }else{
    b.hitTimer=18;
    b.x+=a.facing*35;
    // Combo
    a.comboTimer=60;
    a.combo++;
    // Show combo
    if(a.combo>=2)comboText={x:a.x,y:a.y-60,text:a.combo+'连击!',timer:40};

    // Screen shake
    addEffect(b.x,b.y-20,'hit',15);
    addEffect(b.x+Math.random()*40-20,b.y-20+Math.random()*40-20,'spark',10);
    addEffect(b.x+Math.random()*40-20,b.y-20+Math.random()*40-20,'spark',10);
  }
  b.hp-=damage;
  if(b.hp<0)b.hp=0;
  if(b.hp<=0){
    b.state='ko';b.koTimer=120;
    a.roundsWon++;
    gameState='roundEnd';
    message=a.name+' 获胜!';
    msgTimer=180;
    if(a.roundsWon>=2){winner=a;gameState='ko';message=a.name+' 赢得比赛!';msgTimer=999;}
    else{round++;setTimeout(()=>{if(gameState!=='ko')resetRound();},2000);}
  }
  return true;
}

function updateComboText(){
  if(!comboText)return;
  comboText.timer--;comboText.y-=1;
  if(comboText.timer<=0)comboText=null;
}

// ---- Effects ----
let effects=[];
function addEffect(x,y,type,life){
  effects.push({x,y,type,life,maxLife:life,vx:Math.random()*4-2,vy:Math.random()*4-4});
}
function updateEffects(){
  for(let i=effects.length-1;i>=0;i--){
    const e=effects[i];e.life--;
    if(e.type==='spark'){e.x+=e.vx;e.y+=e.vy;e.vy+=0.2;}
    if(e.life<=0)effects.splice(i,1);
  }
}
function drawEffects(){
  for(const e of effects){
    const alpha=e.life/e.maxLife;
    if(e.type==='hit'){
      ctx.fillStyle=`rgba(255,200,50,${alpha*0.3})`;
      ctx.beginPath();ctx.arc(e.x,e.y,20*(1-alpha*0.5),0,Math.PI*2);ctx.fill();
    }else if(e.type==='spark'){
      ctx.fillStyle=`rgba(255,${150+Math.floor(Math.random()*100)},50,${alpha})`;
      const s=3+Math.random()*5;
      ctx.fillRect(e.x-s/2,e.y-s/2,s,s);
    }else if(e.type==='block'){
      ctx.strokeStyle=`rgba(100,200,255,${alpha*0.5})`;
      ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(e.x,e.y,25*(1-alpha*0.5),0,Math.PI*2);ctx.stroke();
    }
  }
}

// ---- Drawing ----
function drawBackground(){
  // Gradient sky
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#1a1a2e');grad.addColorStop(0.6,'#16213e');grad.addColorStop(1,'#0f3460');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  // Ground
  ctx.fillStyle='#2a2a3a';
  ctx.fillRect(0,GROUND_Y+5,W,H-GROUND_Y-5);
  ctx.strokeStyle='#4a4a6a';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,GROUND_Y);ctx.lineTo(W,GROUND_Y);ctx.stroke();
  // Arena markings
  ctx.fillStyle='rgba(255,255,255,0.03)';
  ctx.fillRect(W/2-1,GROUND_Y,2,H-GROUND_Y-5);
}

function drawFighter(p){
  if(p.koTimer>0&&p.koTimer%6<3)return; // blink
  if(p.hitTimer>0){
    // Flash white on hit
    ctx.save();
    ctx.globalCompositeOperation='source-atop';
    ctx.fillStyle=`rgba(255,255,255,${p.hitTimer/18*0.5})`;
  }
  p.draw(ctx,p.x,p.y,p.facing,p);
  if(p.hitTimer>0)ctx.restore();
  // HP bar overhead
  const bw=80,bh=8,bx=p.x-40,by=p.y-55;
  ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(bx-1,by-1,bw+2,bh+2);
  ctx.fillStyle='#333';ctx.fillRect(bx,by,bw,bh);
  const hpRatio=p.hp/p.maxHp;
  ctx.fillStyle=hpRatio>0.5?'#44cc44':hpRatio>0.25?'#cccc44':'#cc4444';
  ctx.fillRect(bx,by,bw*hpRatio,bh);
  // Name
  ctx.fillStyle='#fff';ctx.font='bold 10px Arial';ctx.textAlign='center';ctx.fillText(p.name,p.x,by-5);
}

function drawHUD(){
  // Round indicator
  ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(W/2-60,5,120,28);
  ctx.fillStyle='#ffd700';ctx.font='bold 16px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('Round '+round+'/'+MAX_ROUNDS,W/2,19);
  // Score
  ctx.font='bold 14px Arial';
  ctx.textAlign='left';ctx.fillStyle=p1.color;
  ctx.fillText(p1.name+' ['+p1.roundsWon+']',20,50);
  ctx.textAlign='right';ctx.fillStyle=p2.color;
  ctx.fillText('['+p2.roundsWon+'] '+p2.name,W-20,50);

  // Message
  if(msgTimer>0||message){
    msgTimer--;
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(W/2-120,180,240,40);
    ctx.fillStyle='#ffd700';ctx.font='bold 24px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(message,W/2,200);
  }
}

function drawComboText(){
  if(!comboText)return;
  ctx.fillStyle=`rgba(255,200,50,${comboText.timer/40})`;
  ctx.font='bold 22px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(comboText.text,comboText.x,comboText.y);
}

function drawTitle(){
  ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#e84040';ctx.font='bold 60px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('🥊 火柴人格斗',W/2,120);
  ctx.fillStyle='#888';
  ctx.font='16px "Microsoft YaHei",Arial';
  ctx.fillText('P1: A/D 移动 · F拳 · G踢 · S格挡 · H必杀',W/2,220);
  ctx.fillText('P2: ←→ 移动 · J拳 · K踢 · ↓格挡 · L必杀',W/2,250);
  if(isTouchDevice){
    ctx.fillStyle='#aaa';ctx.font='14px Arial';
    ctx.fillText('触屏：底部虚拟按键操作',W/2,280);
  }
  ctx.fillStyle='#aaa';ctx.font='14px Arial';
  ctx.fillText('三局两胜 · 拳击手 vs 忍者',W/2,310);
  ctx.fillStyle='#ffd700';ctx.font='bold 22px Arial';
  ctx.fillText('按 空格/Enter 或 点击 开始',W/2,380);

  // Demo fighters
  const t=Date.now()/500;
  const dx1=Math.sin(t)*30,dx2=Math.sin(t+Math.PI)*30;
  FIGHTERS.boxer.draw(ctx,300+dx1,420,1,{attacking:null,attackTimer:0,walkAnim:0,blocking:false});
  FIGHTERS.ninja.draw(ctx,500+dx2,420,-1,{attacking:null,attackTimer:0,walkAnim:0,blocking:false});
}

function drawKO(){
  ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#ff4444';ctx.font='bold 72px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('K.O.!',W/2,180);
  if(winner){
    ctx.fillStyle='#ffd700';ctx.font='bold 36px Arial';
    ctx.fillText('🏆 '+winner.name+' 获胜!',W/2,260);
    ctx.fillStyle='#aaa';ctx.font='18px Arial';
    ctx.fillText('按 空格/点击 重新开始',W/2,340);
  }
}

// ---- Game Loop ----
function update(){
  if(gameState==='fight'){
    updateEffects();updateComboText();
    handleFighterInput(p1,p2);handleFighterInput(p2,p1);
    checkHits(p1,p2);checkHits(p2,p1);
    // Decrease timers
    if(p1.hitTimer>0)p1.hitTimer--;
    if(p2.hitTimer>0)p2.hitTimer--;
    if(p1.koTimer>0)p1.koTimer--;
    if(p2.koTimer>0)p2.koTimer--;
    // Combo decay
    if(p1.comboTimer>0)p1.comboTimer--;else p1.combo=0;
    if(p2.comboTimer>0)p2.comboTimer--;else p2.combo=0;
  }
}

function draw(){
  if(gameState==='title'){drawTitle();return;}
  if(gameState==='ko'){drawBackground();drawFighter(p1);drawFighter(p2);drawHUD();drawKO();return;}
  drawBackground();
  drawFighter(p1);drawFighter(p2);
  drawEffects();
  drawHUD();
  drawComboText();
}

function loop(){update();draw();requestAnimationFrame(loop);}

// ---- User Input ----
c.addEventListener('click',()=>{
  if(gameState==='title'){startFight();return;}
  if(gameState==='ko'){initGame();return;}
});
window.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='Enter'){
    if(gameState==='title'){e.preventDefault();startFight();}
    else if(gameState==='ko'){e.preventDefault();initGame();}
  }
});

// ---- Start ----
initGame();
loop();
})();
</script>

</html>
