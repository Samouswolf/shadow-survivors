            G.canvas = document.getElementById('gameCanvas');
            G.ctx = G.canvas.getContext('2d');

            // 加载最高分
            G.highScore = parseInt(localStorage.getItem('idiom_highScore') || '0');
            G.levelScores = JSON.parse(localStorage.getItem('idiom_levelScores') || '[]');
            G.levelsCompleted = parseInt(localStorage.getItem('idiom_levelsCompleted') || '0');

            // 初始化背景粒子
            for (let i = 0; i < CONFIG.PARTICLE_COUNT; i++) {
                G.bgParticles.push({
                    x: Math.random() * CONFIG.DESIGN_WIDTH,
                    y: Math.random() * CONFIG.DESIGN_HEIGHT,
                    size: Math.random() * 3 + 1,
                    speedX: (Math.random() - 0.5) * 2,
                    speedY: (Math.random() - 0.5) * 2,
                    opacity: Math.random() * 0.5 + 0.3
                });
            }

            // 事件绑定
            setupEventListeners();

            // 响应式调整
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            // 开始游戏循环
            G.lastTime = performance.now();
            gameLoop(G.lastTime);
        }

        // ==================== 响应式画布 ====================
        function resizeCanvas() {
            const ratio = CONFIG.DESIGN_WIDTH / CONFIG.DESIGN_HEIGHT;
            let w = window.innerWidth;
            let h = window.innerHeight;

            if (w / h > ratio) {
                G.height = h;
                G.width = h * ratio;
            } else {
                G.width = w;
                G.height = w / ratio;
            }

            G.canvas.width = G.width;
            G.canvas.height = G.height;
            G.scale = G.width / CONFIG.DESIGN_WIDTH;
        }

        // ==================== 事件监听 ====================
        function setupEventListeners() {
            // 鼠标事件
            G.canvas.addEventListener('click', handleClick);
            G.canvas.addEventListener('mousemove', handleMouseMove);

            // 触摸事件
            G.canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
            G.canvas.addEventListener('touchend', handleTouchEnd, { passive: false });

            // 键盘事件
            document.addEventListener('keydown', handleKeyDown);
        }

        function getCanvasPos(clientX, clientY) {
            const rect = G.canvas.getBoundingClientRect();
            return {
                x: (clientX - rect.left) / G.scale,
                y: (clientY - rect.top) / G.scale
            };
        }

        let lastTouchTime = 0;
        function handleClick(e) {
            // 防止移动端touchstart后重复触发click
            if (Date.now() - lastTouchTime < 300) return;
            const pos = getCanvasPos(e.clientX, e.clientY);
            handleInput(pos.x, pos.y);
        }

        function handleMouseMove(e) {
            const pos = getCanvasPos(e.clientX, e.clientY);
            G.buttonHover = getButtonAt(pos.x, pos.y);
        }

        function handleTouchStart(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const pos = getCanvasPos(touch.clientX, touch.clientY);
            G.touchStartX = pos.x;
            G.touchStartY = pos.y;
        }

        function handleTouchEnd(e) {
            e.preventDefault();
            lastTouchTime = Date.now();
            const touch = e.changedTouches[0];
            const pos = getCanvasPos(touch.clientX, touch.clientY);

            // 判断是否为点击（非滑动）
            const dx = pos.x - G.touchStartX;
            const dy = pos.y - G.touchStartY;
            if (Math.abs(dx) < 20 && Math.abs(dy) < 20) {
                handleInput(pos.x, pos.y);
            }
        }

        function handleKeyDown(e) {
            if (G.state === 'menu') {
                if (e.key === 'Enter' || e.key === ' ') {
                    G.state = 'levelSelect';
                }
            } else if (G.state === 'levelSelect') {
                if (e.key === 'Escape') {
                    G.state = 'menu';
                }
            } else if (G.state === 'playing') {
                if (e.key === 'Escape') {
                    G.state = 'levelSelect';
                } else if (e.key === 'h' || e.key === 'H') {
                    useHint();
                } else if (e.key === 's' || e.key === 'S') {
                    skipLevel();
                }
            } else if (G.state === 'result' || G.state === 'gameComplete') {
                if (e.key === 'Enter' || e.key === ' ') {
                    G.state = 'levelSelect';
                }
            }
        }

        function handleInput(x, y) {
            if (G.state === 'menu') {
                // 开始按钮
                if (isInRect(x, y, 300, 350, 200, 60)) {
                    G.state = 'levelSelect';
                }
            } else if (G.state === 'levelSelect') {
                // 返回按钮
                if (isInRect(x, y, 20, 20, 80, 40)) {
                    G.state = 'menu';
                    return;
                }

                // 关卡按钮
                const startX = 80;
                const startY = 100;
                const btnW = 120;
                const btnH = 60;
                const gap = 15;
                const cols = 5;

                for (let i = 0; i < CONFIG.TOTAL_LEVELS; i++) {
                    const col = i % cols;
                    const row = Math.floor(i / cols);
                    const bx = startX + col * (btnW + gap);
                    const by = startY + row * (btnH + gap);

                    if (isInRect(x, y, bx, by, btnW, btnH)) {
                        if (i <= G.levelsCompleted) {
                            G.currentLevel = i;
                            startLevel();
                        }
                        return;
                    }
                }
            } else if (G.state === 'playing') {
                // 返回按钮
                if (isInRect(x, y, 20, 20, 80, 40)) {
                    G.state = 'levelSelect';
                    clearInterval(G.timer);
                    return;
                }

                // 提示按钮
                if (isInRect(x, y, 550, 20, 100, 40)) {
                    useHint();
                    return;
                }

                // 跳过按钮
                if (isInRect(x, y, 670, 20, 100, 40)) {
                    skipLevel();
                    return;
                }

                // 选择字符
                const charSize = 60;
                const charGap = 15;
                const availStartX = (CONFIG.DESIGN_WIDTH - (charSize * G.availableChars.length + charGap * (G.availableChars.length - 1))) / 2;
                const startY = 450;

                for (let i = 0; i < G.availableChars.length; i++) {
                    const cx = availStartX + i * (charSize + charGap);
                    const cy = startY;

                    if (isInRect(x, y, cx, cy, charSize, charSize)) {
                        selectChar(i);
                        return;
                    }
                }

                // 取消选择字符
                const ansStartX = (CONFIG.DESIGN_WIDTH - (charSize * 4 + charGap * 3)) / 2;
                const ansStartY = 350;

                for (let i = 0; i < G.selectedChars.length; i++) {
                    const cx = ansStartX + i * (charSize + charGap);
                    const cy = ansStartY;

                    if (isInRect(x, y, cx, cy, charSize, charSize)) {
                        deselectChar(i);
                        return;
                    }
                }
            } else if (G.state === 'result') {
                // 下一关按钮
                if (isInRect(x, y, 300, 450, 200, 60)) {
                    nextLevel();
                }
            } else if (G.state === 'gameComplete') {
                // 返回菜单按钮
                if (isInRect(x, y, 300, 450, 200, 60)) {
                    G.state = 'menu';
                }
            }
        }

        // ==================== 游戏逻辑 ====================
        function startLevel() {
            G.state = 'playing';
            G.score = 0;
            G.timeLeft = 60;
            G.selectedChars = [];
            G.showHint = false;
            G.hintMessage = '';
            G.combo = 0;

            const level = LEVELS[G.currentLevel];
            G.correctAnswer = level.answer;

            // 生成可选字符（包含正确答案+随机干扰）
            let chars = level.answer.split('');
            const allChars = '的一是不了人我在有他这为之大来以个中上们到说国和地也子时道出会三要于下得可你年生';
            while (chars.length < 8) {
                const randomChar = allChars[Math.floor(Math.random() * allChars.length)];
                if (!chars.includes(randomChar)) {
                    chars.push(randomChar);
                }
            }

            // 打乱顺序
            G.availableChars = shuffleArray(chars);

            // 开始计时
            clearInterval(G.timer);
            G.timer = setInterval(() => {
                G.timeLeft--;
                if (G.timeLeft <= 0) {
                    clearInterval(G.timer);
                    handleTimeUp();
                }
            }, 1000);
        }

        function selectChar(index) {
            if (G.selectedChars.length >= 4) return;

            const char = G.availableChars[index];
            G.selectedChars.push({
                char: char,
                index: index
            });

            // 移除已选字符
            G.availableChars.splice(index, 1);

            // 检查是否完成
            if (G.selectedChars.length === 4) {
                checkAnswer();
            }
        }

        function deselectChar(index) {
            if (G.selectedChars.length === 0) return;

            const item = G.selectedChars[index];
            G.availableChars.push(item.char);
            G.selectedChars.splice(index, 1);
        }

        function checkAnswer() {
            const answer = G.selectedChars.map(item => item.char).join('');

            if (answer === G.correctAnswer) {
                // 正确
                G.combo++;
                if (G.combo > G.maxCombo) G.maxCombo = G.combo;

                const timeBonus = G.timeLeft * CONFIG.TIME_BONUS;
                const comboBonus = G.combo * 10;
                G.score = CONFIG.CORRECT_SCORE + timeBonus + comboBonus;

                if (G.timeLeft >= 45) {
                    G.score += CONFIG.PERFECT_BONUS;
                    G.perfectLevels++;
                }

                G.totalScore += G.score;
                G.levelsCompleted = Math.max(G.levelsCompleted, G.currentLevel + 1);
                G.levelScores[G.currentLevel] = Math.max(G.levelScores[G.currentLevel] || 0, G.score);

                // 更新最高分
                if (G.totalScore > G.highScore) {
                    G.highScore = G.totalScore;
                    localStorage.setItem('idiom_highScore', G.highScore.toString());
                }
                localStorage.setItem('idiom_levelsCompleted', G.levelsCompleted.toString());
                localStorage.setItem('idiom_levelScores', JSON.stringify(G.levelScores));

                // 生成庆祝粒子
                createCelebrationParticles();

                clearInterval(G.timer);
                G.state = 'result';
            } else {
                // 错误
                G.combo = 0;
                shakeScreen();

                // 重置选择
                setTimeout(() => {
                    G.selectedChars.forEach(item => {
                        G.availableChars.push(item.char);
                    });
                    G.selectedChars = [];
                }, 500);
            }
        }

        function handleTimeUp() {
            G.combo = 0;
            G.state = 'result';
            G.score = 0;
        }

        function nextLevel() {
            if (G.currentLevel >= CONFIG.TOTAL_LEVELS - 1) {
                G.state = 'gameComplete';
            } else {
                G.currentLevel++;
                startLevel();
            }
        }

        function useHint() {
            if (G.selectedChars.length >= 4) return;
            // 找一个答案中还没被选中的字，自动填入
            const answer = G.correctAnswer;
            const selected = G.selectedChars.map(s => s.char);
            for (let i = 0; i < answer.length; i++) {
                if (!selected.includes(answer[i])) {
                    const idx = G.availableChars.indexOf(answer[i]);
                    if (idx >= 0) {
                        selectChar(idx);
                        G.score = Math.max(0, G.score - CONFIG.HINT_COST);
                        return;
                    }
                }
            }
        }

        function skipLevel() {
            G.score = Math.max(0, G.score - CONFIG.SKIP_COST);
            clearInterval(G.timer);

            if (G.currentLevel >= CONFIG.TOTAL_LEVELS - 1) {
                G.state = 'gameComplete';
            } else {
                G.currentLevel++;
                startLevel();
            }
        }

        // ==================== 辅助函数 ====================
        function isInRect(x, y, rx, ry, rw, rh) {
            return x >= rx && x <= rx + rw && y >= ry && y <= ry + rh;
        }

        function getButtonAt(x, y) {
            if (G.state === 'menu') {
                if (isInRect(x, y, 300, 350, 200, 60)) return 0;
            } else if (G.state === 'playing') {
                if (isInRect(x, y, 550, 20, 100, 40)) return 1;
                if (isInRect(x, y, 670, 20, 100, 40)) return 2;
            }
            return -1;
        }

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        let shakeTime = 0;
        function shakeScreen() {
            shakeTime = 20;
        }

        function createCelebrationParticles() {
            for (let i = 0; i < 30; i++) {
                G.particles.push({
                    x: CONFIG.DESIGN_WIDTH / 2,
                    y: CONFIG.DESIGN_HEIGHT / 2,
                    vx: (Math.random() - 0.5) * 15,
                    vy: (Math.random() - 0.5) * 15,
                    life: 60,
                    color: `hsl(${Math.random() * 360}, 100%, 60%)`,
                    size: Math.random() * 8 + 4
                });
            }
        }

        // ==================== 渲染函数 ====================
        function render() {
            const ctx = G.ctx;

            // 应用震动效果
            if (shakeTime > 0) {
                shakeTime--;
                ctx.save();
                ctx.translate(
                    (Math.random() - 0.5) * 10,
                    (Math.random() - 0.5) * 10
                );
            }

            // 清空画布
            ctx.clearRect(0, 0, G.width, G.height);

            // 缩放
            ctx.save();
            ctx.scale(G.scale, G.scale);

            // 渲染背景
            renderBackground(ctx);

            // 根据状态渲染
            switch (G.state) {
                case 'menu':
                    renderMenu(ctx);
                    break;
                case 'levelSelect':
                    renderLevelSelect(ctx);
                    break;
                case 'playing':
                    renderPlaying(ctx);
                    break;
                case 'result':
                    renderResult(ctx);
                    break;
                case 'gameComplete':
                    renderGameComplete(ctx);
                    break;
            }

            // 渲染粒子
            renderParticles(ctx);

            ctx.restore();

            if (shakeTime > 0) {
                ctx.restore();
            }
        }

        function renderBackground(ctx) {
            // 渐变背景
            const gradient = ctx.createLinearGradient(0, 0, CONFIG.DESIGN_WIDTH, CONFIG.DESIGN_HEIGHT);
            gradient.addColorStop(0, '#1a0533');
            gradient.addColorStop(0.5, '#2d1b69');
            gradient.addColorStop(1, '#0f0c29');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, CONFIG.DESIGN_WIDTH, CONFIG.DESIGN_HEIGHT);

            // 渲染背景粒子
            ctx.globalAlpha = 0.3;
            G.bgParticles.forEach(p => {
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }

        function renderMenu(ctx) {
            // 标题
            ctx.fillStyle = '#ffd700';
            ctx.font = 'bold 64px "Microsoft YaHei"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // 标题阴影
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillText('看图猜成语', CONFIG.DESIGN_WIDTH / 2 + 3, 183);

            ctx.fillStyle = '#ffd700';
            ctx.fillText('看图猜成语', CONFIG.DESIGN_WIDTH / 2, 180);

            // 副标题
            ctx.font = '24px "Microsoft YaHei"';
            ctx.fillStyle = '#b8b8d4';
            ctx.fillText('用Emoji猜成语，挑战你的智慧！', CONFIG.DESIGN_WIDTH / 2, 240);

            // 开始按钮
            const btnX = 300;
            const btnY = 350;
            const btnW = 200;
            const btnH = 60;

            // 按钮悬停效果
            if (G.buttonHover === 0) {
                ctx.fillStyle = '#4a90d9';
            } else {
                ctx.fillStyle = '#3a7bd5';
            }
            ctx.beginPath();
            ctx.roundRect(btnX, btnY, btnW, btnH, 10);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 28px "Microsoft YaHei"';
            ctx.fillText('开始游戏', CONFIG.DESIGN_WIDTH / 2, btnY + btnH / 2);

            // 最高分
            ctx.font = '20px "Microsoft YaHei"';
            ctx.fillStyle = '#8888aa';
            ctx.fillText(`最高分: ${G.highScore}`, CONFIG.DESIGN_WIDTH / 2, 450);

            // 操作提示
            ctx.font = '16px "Microsoft YaHei"';
            ctx.fillStyle = '#666688';
            ctx.fillText('点击/触摸按钮开始', CONFIG.DESIGN_WIDTH / 2, 500);
            ctx.fillText('按 Enter 或 空格键 开始', CONFIG.DESIGN_WIDTH / 2, 525);
        }

        function renderLevelSelect(ctx) {
            // 标题
            ctx.fillStyle = '#ffd700';
            ctx.font = 'bold 36px "Microsoft YaHei"';
            ctx.textAlign = 'center';
            ctx.fillText('选择关卡', CONFIG.DESIGN_WIDTH / 2, 50);

            // 返回按钮
            ctx.fillStyle = '#555577';
            ctx.beginPath();
            ctx.roundRect(20, 20, 80, 40, 8);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.font = '18px "Microsoft YaHei"';
            ctx.fillText('返回', 60, 40);

            // 关卡按钮
            const startX = 80;
            const startY = 100;
            const btnW = 120;
            const btnH = 60;
            const gap = 15;
            const cols = 5;

            for (let i = 0; i < CONFIG.TOTAL_LEVELS; i++) {
                const col = i % cols;
                const row = Math.floor(i / cols);
                const x = startX + col * (btnW + gap);
                const y = startY + row * (btnH + gap);

                // 关卡状态
                let bgColor, textColor;
                if (i < G.levelsCompleted) {
                    bgColor = '#27ae60'; // 已完成
                    textColor = '#ffffff';
                } else if (i === G.levelsCompleted) {
                    bgColor = '#3498db'; // 当前可玩
                    textColor = '#ffffff';
                } else {
                    bgColor = '#555577'; // 未解锁
                    textColor = '#888888';
                }

                ctx.fillStyle = bgColor;
                ctx.beginPath();
                ctx.roundRect(x, y, btnW, btnH, 8);
                ctx.fill();

                // 关卡号
                ctx.fillStyle = textColor;
                ctx.font = 'bold 24px "Microsoft YaHei"';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(`${i + 1}`, x + btnW / 2, y + btnH / 2 - 8);

                // 星级
                if (i < G.levelsCompleted) {
                    const score = G.levelScores[i] || 0;
                    const stars = score >= 200 ? 3 : score >= 150 ? 2 : 1;
                    ctx.font = '14px "Microsoft YaHei"';
                    ctx.fillText('★'.repeat(stars), x + btnW / 2, y + btnH / 2 + 15);
                }
            }

            // 底部信息
            ctx.fillStyle = '#8888aa';
            ctx.font = '16px "Microsoft YaHei"';
            ctx.textAlign = 'center';
            ctx.fillText(`已完成: ${G.levelsCompleted}/${CONFIG.TOTAL_LEVELS}`, CONFIG.DESIGN_WIDTH / 2, 560);
            ctx.fillText('按 Esc 返回菜单', CONFIG.DESIGN_WIDTH / 2, 580);
        }

        function renderPlaying(ctx) {
            const level = LEVELS[G.currentLevel];

            // 顶部栏
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(0, 0, CONFIG.DESIGN_WIDTH, 70);

            // 返回按钮
            ctx.fillStyle = '#555577';
            ctx.beginPath();
            ctx.roundRect(20, 20, 80, 30, 5);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.font = '14px "Microsoft YaHei"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('返回', 60, 35);

            // 关卡信息
            ctx.fillStyle = '#ffd700';
            ctx.font = 'bold 20px "Microsoft YaHei"';
            ctx.fillText(`第 ${G.currentLevel + 1} 关`, CONFIG.DESIGN_WIDTH / 2, 25);

            // 难度
            ctx.font = '14px "Microsoft YaHei"';
            ctx.fillStyle = '#ff9966';
            ctx.fillText('★'.repeat(level.difficulty), CONFIG.DESIGN_WIDTH / 2, 50);

            // 计时器
            ctx.fillStyle = G.timeLeft <= 10 ? '#ff4444' : '#ffffff';
            ctx.font = 'bold 24px "Microsoft YaHei"';
            ctx.textAlign = 'right';
            ctx.fillText(`${G.timeLeft}s`, 250, 35);

            // 分数
            ctx.fillStyle = '#66ff66';
            ctx.fillText(`${G.totalScore}分`, 400, 35);

            // 提示按钮
            ctx.fillStyle = G.buttonHover === 1 ? '#e67e22' : '#d35400';
            ctx.beginPath();
            ctx.roundRect(550, 20, 100, 30, 5);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.font = '14px "Microsoft YaHei"';
            ctx.textAlign = 'center';
            ctx.fillText('提示(H)', 600, 35);

            // 跳过按钮
            ctx.fillStyle = G.buttonHover === 2 ? '#e74c3c' : '#c0392b';
            ctx.beginPath();
            ctx.roundRect(670, 20, 100, 30, 5);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.fillText('跳过(S)', 720, 35);

            // Emoji展示区域
            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.beginPath();
            ctx.roundRect(150, 100, 500, 200, 20);
            ctx.fill();

            ctx.strokeStyle = 'rgba(255, 215, 0, 0.3)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(150, 100, 500, 200, 20);
            ctx.stroke();

            // 渲染Emoji
            ctx.font = '80px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            const emojiStartX = 250;
            const emojiGap = 100;
            const emojiY = 200;

            for (let i = 0; i < level.emojis.length; i++) {
                // Emoji背景圆
                ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
                ctx.beginPath();
                ctx.arc(emojiStartX + i * emojiGap, emojiY, 45, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.fillText(level.emojis[i], emojiStartX + i * emojiGap, emojiY);
            }

            // 提示文字 — 始终显示
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.beginPath();
            ctx.roundRect(200, 130, 400, 50, 10);
            ctx.fill();

            ctx.fillStyle = '#ffd700';
            ctx.font = '20px "Microsoft YaHei"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(level.hint, CONFIG.DESIGN_WIDTH / 2, 155);

            // 答案区域
            ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.beginPath();
            ctx.roundRect(150, 330, 500, 80, 10);
            ctx.fill();

            ctx.fillStyle = '#8888aa';
            ctx.font = '16px "Microsoft YaHei"';
            ctx.textAlign = 'center';
            ctx.fillText('选择答案：', CONFIG.DESIGN_WIDTH / 2, 340);

            const charSize = 60;
            const charGap = 15;
            const ansStartX = (CONFIG.DESIGN_WIDTH - (charSize * 4 + charGap * 3)) / 2;
            const ansStartY = 350;

            // 答案格子
            for (let i = 0; i < 4; i++) {
                const cx = ansStartX + i * (charSize + charGap);
                const cy = ansStartY;

                ctx.strokeStyle = 'rgba(255, 215, 0, 0.5)';
                ctx.lineWidth = 2;
                ctx.strokeRect(cx, cy, charSize, charSize);

                if (i < G.selectedChars.length) {
                    ctx.fillStyle = '#3a7bd5';
                    ctx.fillRect(cx, cy, charSize, charSize);

                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 32px "Microsoft YaHei"';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(G.selectedChars[i].char, cx + charSize / 2, cy + charSize / 2);
                }
            }

            // 可选字符区域
            ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.beginPath();
            ctx.roundRect(150, 430, 500, 80, 10);
            ctx.fill();

            const availStartX = (CONFIG.DESIGN_WIDTH - (charSize * G.availableChars.length + charGap * (G.availableChars.length - 1))) / 2;
            const startY = 450;

            for (let i = 0; i < G.availableChars.length; i++) {
                const cx = availStartX + i * (charSize + charGap);
                const cy = startY;

                ctx.fillStyle = '#555577';
                ctx.beginPath();
                ctx.roundRect(cx, cy, charSize, charSize, 8);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 32px "Microsoft YaHei"';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(G.availableChars[i], cx + charSize / 2, cy + charSize / 2);
            }

            // 操作提示
            ctx.fillStyle = '#666688';
            ctx.font = '14px "Microsoft YaHei"';
            ctx.fillText('点击字符选择，点击已选字符取消', CONFIG.DESIGN_WIDTH / 2, 550);
        }

        function renderResult(ctx) {
            // 半透明遮罩
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, CONFIG.DESIGN_WIDTH, CONFIG.DESIGN_HEIGHT);

            // 结果卡片
            ctx.fillStyle = 'rgba(30, 30, 60, 0.95)';
            ctx.beginPath();
            ctx.roundRect(200, 100, 400, 400, 20);
            ctx.fill();

            ctx.strokeStyle = 'rgba(255, 215, 0, 0.5)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.roundRect(200, 100, 400, 400, 20);
            ctx.stroke();

            if (G.score > 0) {
                // 成功
                ctx.fillStyle = '#ffd700';
                ctx.font = 'bold 48px "Microsoft YaHei"';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('恭喜过关！', CONFIG.DESIGN_WIDTH / 2, 170);

                ctx.fillStyle = '#ffffff';
                ctx.font = '24px "Microsoft YaHei"';
                ctx.fillText(`答案: ${G.correctAnswer}`, CONFIG.DESIGN_WIDTH / 2, 230);

                ctx.fillStyle = '#66ff66';
                ctx.font = 'bold 36px "Microsoft YaHei"';
                ctx.fillText(`+${G.score}分`, CONFIG.DESIGN_WIDTH / 2, 290);

                // 详细分数
                ctx.fillStyle = '#b8b8d4';
                ctx.font = '18px "Microsoft YaHei"';
                ctx.fillText(`基础分: ${CONFIG.CORRECT_SCORE}`, CONFIG.DESIGN_WIDTH / 2, 330);
                ctx.fillText(`时间奖励: ${G.timeLeft * CONFIG.TIME_BONUS}`, CONFIG.DESIGN_WIDTH / 2, 355);
                ctx.fillText(`连击奖励: ${G.combo * 10}`, CONFIG.DESIGN_WIDTH / 2, 380);

                if (G.timeLeft >= 45) {
                    ctx.fillStyle = '#ffd700';
                    ctx.fillText('完美通关 +50', CONFIG.DESIGN_WIDTH / 2, 405);
                }
            } else {
                // 失败（时间用完）
                ctx.fillStyle = '#ff4444';
                ctx.font = 'bold 48px "Microsoft YaHei"';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('时间到！', CONFIG.DESIGN_WIDTH / 2, 170);

                ctx.fillStyle = '#ffffff';
                ctx.font = '24px "Microsoft YaHei"';
                ctx.fillText(`答案: ${G.correctAnswer}`, CONFIG.DESIGN_WIDTH / 2, 230);
            }

            // 下一关按钮
            ctx.fillStyle = '#3a7bd5';
            ctx.beginPath();
            ctx.roundRect(300, 450, 200, 60, 10);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 24px "Microsoft YaHei"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('下一关', CONFIG.DESIGN_WIDTH / 2, 480);
        }

        function renderGameComplete(ctx) {
            // 半透明遮罩
            ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
            ctx.fillRect(0, 0, CONFIG.DESIGN_WIDTH, CONFIG.DESIGN_HEIGHT);

            // 完成卡片
            ctx.fillStyle = 'rgba(30, 30, 60, 0.95)';
            ctx.beginPath();
            ctx.roundRect(150, 80, 500, 440, 20);
            ctx.fill();

            ctx.strokeStyle = '#ffd700';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.roundRect(150, 80, 500, 440, 20);
            ctx.stroke();

            ctx.fillStyle = '#ffd700';
            ctx.font = 'bold 48px "Microsoft YaHei"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('全部通关！', CONFIG.DESIGN_WIDTH / 2, 150);

            ctx.fillStyle = '#ffffff';
            ctx.font = '28px "Microsoft YaHei"';
            ctx.fillText('恭喜你完成了所有关卡！', CONFIG.DESIGN_WIDTH / 2, 210);

            // 统计信息
            ctx.fillStyle = '#b8b8d4';
            ctx.font = '22px "Microsoft YaHei"';
            ctx.fillText(`总分: ${G.totalScore}`, CONFIG.DESIGN_WIDTH / 2, 270);
            ctx.fillText(`最高分: ${G.highScore}`, CONFIG.DESIGN_WIDTH / 2, 300);
            ctx.fillText(`最大连击: ${G.maxCombo}`, CONFIG.DESIGN_WIDTH / 2, 330);
            ctx.fillText(`完美通关: ${G.perfectLevels}`, CONFIG.DESIGN_WIDTH / 2, 360);

            // 返回菜单按钮
            ctx.fillStyle = '#3a7bd5';
            ctx.beginPath();
            ctx.roundRect(300, 450, 200, 60, 10);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 24px "Microsoft YaHei"';
            ctx.fillText('返回菜单', CONFIG.DESIGN_WIDTH / 2, 480);
        }

        function renderParticles(ctx) {
            G.particles = G.particles.filter(p => p.life > 0);

            G.particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.2; // 重力
                p.life--;

                ctx.globalAlpha = p.life / 60;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * (p.life / 60), 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }

        // ==================== 更新函数 ====================
        function update() {
            // 更新背景粒子
            G.bgParticles.forEach(p => {
                p.x += p.speedX;
                p.y += p.speedY;

                if (p.x < 0) p.x = CONFIG.DESIGN_WIDTH;
                if (p.x > CONFIG.DESIGN_WIDTH) p.x = 0;
                if (p.y < 0) p.y = CONFIG.DESIGN_HEIGHT;
                if (p.y > CONFIG.DESIGN_HEIGHT) p.y = 0;
            });
        }

        // ==================== 游戏循环 ====================
        function gameLoop(timestamp) {
            G.deltaTime = timestamp - G.lastTime;
            G.lastTime = timestamp;

            update();
            render();

            G.animationFrame = requestAnimationFrame(gameLoop);
        }

        // ==================== 启动游戏 ====================
        window.onload = init;
