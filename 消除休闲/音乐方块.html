<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>音乐方块</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; color: #fff; overflow: hidden; }
        
        .game-container { width: 100%; flex: 1; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: #fff; }
        .stats { display: flex; gap: 20px; font-size: 14px; }
        
        .main-area { flex: 1; background: rgba(0,0,0,0.5); border-radius: 15px; overflow: hidden; position: relative; }
        
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 5px; padding: 10px; height: 100%; }
        
        .cell { background: rgba(255,255,255,0.1); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 32px; cursor: pointer; }
        .cell.active { background: #4ecdc4; }
        .cell.hit { background: #ff6b6b; }
        
        .score-display { position: absolute; top: 10px; left: 10px; font-size: 24px; font-weight: bold; color: #ffd700; }
        
        .combo-display { position: absolute; top: 10px; right: 10px; font-size: 20px; color: #4ecdc4; }
        
        .actions { display: flex; gap: 10px; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; }
        
        .action-btn { flex: 1; padding: 15px; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; background: rgba(255,255,255,0.2); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="title">🎹 音乐方块</div>
            <div class="stats">
                <span>⏱️ 时间: <span id="time">60</span></span>
                <span>⭐ 完美: <span id="perfect">0</span></span>
            </div>
        </div>
        
        <div class="main-area">
            <div class="score-display" id="score">0</div>
            <div class="combo-display" id="comboText">COMBO: 0</div>
            
            <div class="grid" id="grid">
                <div class="cell" data-row="0" data-col="0">1</div>
                <div class="cell" data-row="0" data-col="1">2</div>
                <div class="cell" data-row="0" data-col="2">3</div>
                <div class="cell" data-row="0" data-col="3">4</div>
                <div class="cell" data-row="1" data-col="0">Q</div>
                <div class="cell" data-row="1" data-col="1">W</div>
                <div class="cell" data-row="1" data-col="2">E</div>
                <div class="cell" data-row="1" data-col="3">R</div>
                <div class="cell" data-row="2" data-col="0">A</div>
                <div class="cell" data-row="2" data-col="1">S</div>
                <div class="cell" data-row="2" data-col="2">D</div>
                <div class="cell" data-row="2" data-col="3">F</div>
                <div class="cell" data-row="3" data-col="0">Z</div>
                <div class="cell" data-row="3" data-col="1">X</div>
                <div class="cell" data-row="3" data-col="2">C</div>
                <div class="cell" data-row="3" data-col="3">V</div>
            </div>
        </div>
        
        <div class="actions">
            <button class="action-btn" onclick="startGame()">🎮 开始</button>
        </div>
    </div>
    
    <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>

    <script src="game_core.js"></script>
    <script>
        const GAME_NAME = '音乐方块';
        GameCore.init({ highScore: GAME_NAME });
        
        let score = 0;
        let combo = 0;
        let perfect = 0;
        let timeLeft = 60;
        let gameRunning = false;
        let activeCells = [];
        let pattern = [];
        
        const notes = ['1', '2', '3', '4', 'Q', 'W', 'E', 'R', 'A', 'S', 'D', 'F', 'Z', 'X', 'C', 'V'];
        
        function initGame() {
            updateUI();
            setupCells();
        }
        
        function setupCells() {
            document.querySelectorAll('.cell').forEach(cell => {
                cell.addEventListener('click', () => {
                    if (!gameRunning) return;
                    const row = parseInt(cell.dataset.row);
                    const col = parseInt(cell.dataset.col);
                    hitCell(row, col);
                });
            });
        }
        
        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('time').textContent = timeLeft;
            document.getElementById('perfect').textContent = perfect;
            document.getElementById('comboText').textContent = `COMBO: ${combo}`;
            
            GameCore.highScore.set(GAME_NAME, score);
        }
        
        function startGame() {
            if (gameRunning) return;
            
            gameRunning = true;
            score = 0;
            combo = 0;
            perfect = 0;
            timeLeft = 60;
            
            updateUI();
            startTimer();
            startPattern();
        }
        
        function startTimer() {
            const timer = setInterval(() => {
                timeLeft--;
                updateUI();
                
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    gameOver();
                }
            }, 1000);
        }
        
        function startPattern() {
            if (!gameRunning) return;
            
            const patternLength = Math.min(3 + Math.floor((60 - timeLeft) / 10), 8);
            pattern = [];
            
            for (let i = 0; i < patternLength; i++) {
                pattern.push(Math.floor(Math.random() * 16));
            }
            
            showPattern();
        }
        
        function showPattern() {
            let index = 0;
            
            const showNext = () => {
                if (index >= pattern.length) {
                    activateCells();
                    return;
                }
                
                const cellIndex = pattern[index];
                const cell = document.querySelectorAll('.cell')[cellIndex];
                cell.classList.add('active');
                
                setTimeout(() => {
                    cell.classList.remove('active');
                    index++;
                    showNext();
                }, 400);
            };
            
            showNext();
        }
        
        function activateCells() {
            activeCells = [...pattern];
            
            pattern.forEach(cellIndex => {
                const cell = document.querySelectorAll('.cell')[cellIndex];
                cell.classList.add('active');
            });
        }
        
        function hitCell(row, col) {
            const cellIndex = row * 4 + col;
            const cell = document.querySelectorAll('.cell')[cellIndex];
            
            if (activeCells.includes(cellIndex)) {
                cell.classList.remove('active');
                cell.classList.add('hit');
                
                activeCells = activeCells.filter(i => i !== cellIndex);
                
                score += 100 * (combo + 1);
                combo++;
                perfect++;
                
                setTimeout(() => cell.classList.remove('hit'), 200);
                
                if (activeCells.length === 0) {
                    setTimeout(() => {
                        if (gameRunning) startPattern();
                    }, 500);
                }
                
                updateUI();
            } else {
                combo = 0;
                GameCore.hints.show('WRONG!');
                updateUI();
            }
        }
        
        function gameOver() {
            gameRunning = false;
            document.querySelectorAll('.cell').forEach(cell => cell.classList.remove('active'));
            GameCore.hints.show(`游戏结束！最终得分: ${score}`);
        }
        
        document.addEventListener('keydown', (e) => {
            if (!gameRunning) return;
            
            const keyMap = {
                '1': 0, '2': 1, '3': 2, '4': 3,
                'q': 4, 'w': 5, 'e': 6, 'r': 7,
                'a': 8, 's': 9, 'd': 10, 'f': 11,
                'z': 12, 'x': 13, 'c': 14, 'v': 15
            };
            
            const cellIndex = keyMap[e.key.toLowerCase()];
            if (cellIndex !== undefined) {
                const row = Math.floor(cellIndex / 4);
                const col = cellIndex % 4;
                hitCell(row, col);
            }
        });
        
        initGame();
        GameCore.touch.enableAllButtons();
    </script>
</body>
</html>
