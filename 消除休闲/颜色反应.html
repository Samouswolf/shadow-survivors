<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>颜色反应</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; color: #fff; }
        
        .game-container { width: 100%; flex: 1; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: #ffd700; }
        .score { font-size: 20px; color: #4ecdc4; }
        
        .game-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        
        .target-box { width: 200px; height: 200px; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 36px; margin-bottom: 30px; }
        
        .options-area { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .color-btn { width: 100px; height: 100px; border-radius: 15px; border: none; cursor: pointer; font-size: 24px; }
        
        .feedback { font-size: 24px; font-weight: bold; margin-top: 20px; opacity: 0; }
        .feedback.show { animation: feedbackAnim 0.5s; }
        
        @keyframes feedbackAnim {
            0% { opacity: 0; transform: translateY(20px); }
            50% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-20px); }
        }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="title">🎨 颜色反应</div>
            <div class="score">得分: <span id="score">0</span></div>
        </div>
        
        <div class="game-area">
            <div class="target-box" id="targetBox">🎯</div>
            <div class="options-area" id="optionsArea"></div>
            <div class="feedback" id="feedback"></div>
        </div>
    </div>
    
    <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <script>
        const GAME_NAME = '颜色反应';
        GameCore.init({ highScore: GAME_NAME });
        
        const colors = [
            { name: '红色', color: '#ff6b6b', emoji: '🔴' },
            { name: '蓝色', color: '#667eea', emoji: '🔵' },
            { name: '绿色', color: '#48c78e', emoji: '🟢' },
            { name: '黄色', color: '#ffd700', emoji: '🟡' },
            { name: '紫色', color: '#f093fb', emoji: '🟣' },
            { name: '橙色', color: '#ffa502', emoji: '🟠' }
        ];
        
        let score = 0;
        let currentColor = null;
        
        function initGame() {
            const highScore = GameCore.highScore.get(GAME_NAME);
            document.getElementById('score').textContent = highScore || '0';
            score = 0;
            nextRound();
        }
        
        function nextRound() {
            currentColor = colors[Math.floor(Math.random() * colors.length)];
            
            const targetBox = document.getElementById('targetBox');
            targetBox.style.background = currentColor.color;
            targetBox.textContent = currentColor.emoji;
            
            const options = [...colors].sort(() => Math.random() - 0.5).slice(0, 4);
            
            const optionsArea = document.getElementById('optionsArea');
            optionsArea.innerHTML = '';
            
            options.forEach(color => {
                const btn = document.createElement('button');
                btn.className = 'color-btn';
                btn.style.background = color.color;
                btn.textContent = color.name;
                btn.onclick = () => checkAnswer(color);
                
                optionsArea.appendChild(btn);
            });
        }
        
        function checkAnswer(selected) {
            const feedback = document.getElementById('feedback');
            
            if (selected.name === currentColor.name) {
                score++;
                document.getElementById('score').textContent = score;
                feedback.textContent = '✅ 正确！';
                feedback.style.color = '#48c78e';
                
                if (score % 10 === 0) {
                    GameCore.hints.show(`${score}分！继续！`);
                }
            } else {
                feedback.textContent = '❌ 错误！';
                feedback.style.color = '#ff6b6b';
                
                GameCore.highScore.set(GAME_NAME, score);
                GameCore.hints.show(`游戏结束！得分: ${score}`);
                
                setTimeout(() => {
                    score = 0;
                    document.getElementById('score').textContent = score;
                    nextRound();
                }, 1000);
                
                return;
            }
            
            feedback.classList.remove('show');
            void feedback.offsetWidth;
            feedback.classList.add('show');
            
            setTimeout(() => {
                nextRound();
            }, 500);
        }
        
        initGame();
        GameCore.touch.enableAllButtons();
    </script>
</body>
</html>
