<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    overflow: hidden;
    background: #1a1a2e;
    font-family: 'Microsoft YaHei', sans-serif;
    touch-action: none;
}
canvas { display: block; }

/* [BUGFIX startgame-v2] 开始按钮强制可见+广告关闭可点击 */
.sponsor-close,#sponsorClose,.skip-btn,#skipInterstitial{pointer-events:auto!important;}
</style>

<style>
/* 游戏工坊广告系统 */
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);height:90px;max-height:90px;overflow:hidden;contain:layout style paint;pointer-events:none!important}.ad-banner-container,.ad-banner-container *{pointer-events:none!important}.ad-banner-container iframe{max-height:90px;pointer-events:none!important}
.ad-banner-container iframe{max-width:100%}
.ad-label{position:absolute;top:1px;right:6px;font:9px "Microsoft YaHei",sans-serif;color:rgba(255,255,255,.35)}
.sponsor-btn{position:fixed;bottom:8px;left:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:2px 6px;border-radius:10px;font:10px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .qr-row{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.sponsor-panel .qr-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px;text-align:center;min-width:140px}
.sponsor-panel .qr-card .qr-icon{font-size:48px;margin-bottom:6px}
.sponsor-panel .qr-card .qr-label{color:#ccc;font:13px "Microsoft YaHei",sans-serif}
.sponsor-panel .qr-card .qr-hint{color:#888;font:11px "Microsoft YaHei",sans-serif;margin-top:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.interstitial-ad .ad-content{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;text-align:center;min-width:280px;max-width:400px}
.interstitial-ad .ad-content p{color:#aaa;font:14px "Microsoft YaHei",sans-serif;margin-bottom:12px}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}

/* [AD-FIX:responsive] */
@media (max-width:768px){.ad-banner-container{display:none!important}.sponsor-btn{transform:scale(.8);opacity:.6}}
/* [/AD-FIX:responsive] */
</style>

// ===== 游戏状态 =====
var canvas, ctx;
var gameState = 'menu'; // menu, playing, result
var G = {
    pattern: null,
    userGrid: [],
    targetGrid: [],
    selectedColor: 0,
    tool: 'brush', // brush, eraser, fill
    timeLeft: CONFIG.TIME_LIMIT,
    score: 0,
    highScore: 0,
    particles: [],
    animFrame: 0,
    gridOffsetX: 0,
    gridOffsetY: 0,
    isDrawing: false,
    completion: 0,
    colorUsed: new Set(),
    perfectCells: 0,
    totalCells: 0
};

// ===== 初始化 =====
function init() {
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    loadHighScore();
    setupEvents();
    requestAnimationFrame(gameLoop);
}

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    calculateLayout();
}

function calculateLayout() {
    var size = Math.min(canvas.width, canvas.height);
    CONFIG.CANVAS_SIZE = size * 0.7;
    CONFIG.CELL_SIZE = CONFIG.CANVAS_SIZE / CONFIG.GRID_SIZE;
    G.gridOffsetX = (canvas.width - CONFIG.CANVAS_SIZE) / 2;
    G.gridOffsetY = (canvas.height - CONFIG.CANVAS_SIZE) / 2 + 30;
}

function loadHighScore() {
    var saved = localStorage.getItem('paintBoard_highScore');
    G.highScore = saved ? parseInt(saved) : 0;
}

function saveHighScore() {
    if (G.score > G.highScore) {
        G.highScore = G.score;
        localStorage.setItem('paintBoard_highScore', G.highScore);
    }
}

// ===== 事件处理 =====
function setupEvents() {
    // 鼠标事件
    canvas.addEventListener('mousedown', function(e) {
        handleInput(e.clientX, e.clientY, 'down');
    });
    canvas.addEventListener('mousemove', function(e) {
        handleInput(e.clientX, e.clientY, 'move');
    });
    canvas.addEventListener('mouseup', function() {
        G.isDrawing = false;
    });

    // 触屏事件
    canvas.addEventListener('touchstart', function(e) {
        e.preventDefault();
        var touch = e.touches[0];
        handleInput(touch.clientX, touch.clientY, 'down');
    });
    canvas.addEventListener('touchmove', function(e) {
        e.preventDefault();
        var touch = e.touches[0];
        handleInput(touch.clientX, touch.clientY, 'move');
    });
    canvas.addEventListener('touchend', function() {
        G.isDrawing = false;
    });

    // 键盘事件
    document.addEventListener('keydown', function(e) {
        handleKeyboard(e.key);
    });
}

function handleInput(x, y, type) {
    if (gameState === 'menu') {
        if (type === 'down') handleMenuClick(x, y);
        return;
    }
    if (gameState === 'result') {
        if (type === 'down') handleResultClick(x, y);
        return;
    }
    if (gameState !== 'playing') return;

    if (type === 'down') {
        G.isDrawing = true;
        // 检查工具栏
        if (handleToolbarClick(x, y)) return;
        // 检查颜色选择
        if (handleColorClick(x, y)) return;
    }

    if (G.isDrawing) {
        paintCell(x, y);
    }
}

function handleMenuClick(x, y) {
    var btnX = canvas.width / 2 - 100;
    var btnY = canvas.height / 2 + 50;
    var btnW = 200;
    var btnH = 50;

    // 检查图案选择
    var startX = canvas.width / 2 - 200;
    var startY = canvas.height / 2 - 80;
    for (var i = 0; i < PATTERNS.length; i++) {
        var px = startX + (i % 6) * 70;
        var py = startY + Math.floor(i / 6) * 70;
        if (x >= px && x <= px + 60 && y >= py && y <= py + 60) {
            G.pattern = i;
            return;
        }
    }

    // 检查开始按钮
    if (x >= btnX && x <= btnX + btnW && y >= btnY && y <= btnY + btnH) {
        startGame();
    }
}

function handleResultClick(x, y) {
    var btnX = canvas.width / 2 - 100;
    var btnY = canvas.height / 2 + 80;
    var btnW = 200;
    var btnH = 50;

    if (x >= btnX && x <= btnX + btnW && y >= btnY && y <= btnY + btnH) {
        gameState = 'menu';
    }
}

function handleToolbarClick(x, y) {
    var toolbarY = 10;
    var toolSize = 40;
    var tools = ['brush', 'eraser', 'fill'];
    var toolIcons = ['🖌️', '🧹', '🪣'];

    for (var i = 0; i < tools.length; i++) {
        var tx = 10 + i * 50;
        if (x >= tx && x <= tx + toolSize && y >= toolbarY && y <= toolbarY + toolSize) {
            G.tool = tools[i];
            return true;
        }
    }
    return false;
}

function handleColorClick(x, y) {
    var colorY = canvas.height - 60;
    var colorSize = 30;

    for (var i = 0; i < CONFIG.COLORS.length; i++) {
        var cx = 10 + i * 35;
        if (x >= cx && x <= cx + colorSize && y >= colorY && y <= colorY + colorSize) {
            G.selectedColor = i;
            return true;
        }
    }
    return false;
}

function paintCell(x, y) {
    var gridX = Math.floor((x - G.gridOffsetX) / CONFIG.CELL_SIZE);
    var gridY = Math.floor((y - G.gridOffsetY) / CONFIG.CELL_SIZE);

    if (gridX < 0 || gridX >= CONFIG.GRID_SIZE || gridY < 0 || gridY >= CONFIG.GRID_SIZE) return;

    if (G.tool === 'brush') {
        if (G.userGrid[gridY][gridX] !== G.selectedColor) {
            G.userGrid[gridY][gridX] = G.selectedColor;
            G.colorUsed.add(G.selectedColor);
            addPaintParticles(x, y, CONFIG.COLORS[G.selectedColor]);
        }
    } else if (G.tool === 'eraser') {
        G.userGrid[gridY][gridX] = -1;
    } else if (G.tool === 'fill') {
        floodFill(gridX, gridY, G.userGrid[gridY][gridX], G.selectedColor);
    }
}

function floodFill(x, y, oldColor, newColor) {
    if (x < 0 || x >= CONFIG.GRID_SIZE || y < 0 || y >= CONFIG.GRID_SIZE) return;
    if (G.userGrid[y][x] !== oldColor || oldColor === newColor) return;

    G.userGrid[y][x] = newColor;
    G.colorUsed.add(newColor);

    floodFill(x + 1, y, oldColor, newColor);
    floodFill(x - 1, y, oldColor, newColor);
    floodFill(x, y + 1, oldColor, newColor);
    floodFill(x, y - 1, oldColor, newColor);
}

function handleKeyboard(key) {
    if (gameState !== 'playing') return;

    // 数字键1-9选择颜色
    if (key >= '1' && key <= '9') {
        G.selectedColor = parseInt(key) - 1;
        return;
    }

    // 工具切换
    if (key === 'b' || key === 'B') G.tool = 'brush';
    if (key === 'e' || key === 'E') G.tool = 'eraser';
    if (key === 'f' || key === 'F') G.tool = 'fill';
}

// ===== 游戏逻辑 =====
function startGame() {
    if (G.pattern === null) G.pattern = 0;

    gameState = 'playing';
    G.timeLeft = CONFIG.TIME_LIMIT;
    G.score = 0;
    G.completion = 0;
    G.perfectCells = 0;
    G.totalCells = 0;
    G.colorUsed.clear();

    // 初始化网格
    G.userGrid = [];
    G.targetGrid = [];

    for (var y = 0; y < CONFIG.GRID_SIZE; y++) {
        G.userGrid[y] = [];
        G.targetGrid[y] = [];
        for (var x = 0; x < CONFIG.GRID_SIZE; x++) {
            G.userGrid[y][x] = -1;
            if (PATTERNS[G.pattern].grid) {
                G.targetGrid[y][x] = PATTERNS[G.pattern].grid[y][x];
                if (G.targetGrid[y][x] === 1) G.totalCells++;
            } else {
                G.targetGrid[y][x] = -1;
            }
        }
    }

    // 如果是自由创作，totalCells为总格子数
    if (!PATTERNS[G.pattern].grid) {
        G.totalCells = CONFIG.GRID_SIZE * CONFIG.GRID_SIZE;
    }
}

function updateGame(dt) {
    if (gameState !== 'playing') return;

    G.timeLeft -= dt;
    if (G.timeLeft <= 0) {
        G.timeLeft = 0;
        endGame();
        return;
    }

    // 计算完成度
    calculateCompletion();

    // 检查是否完成
    if (G.completion >= 100 && PATTERNS[G.pattern].grid) {
        endGame();
    }
}

function calculateCompletion() {
    if (!PATTERNS[G.pattern].grid) {
        // 自由创作：计算已填充格子比例
        var filled = 0;
        for (var y = 0; y < CONFIG.GRID_SIZE; y++) {
            for (var x = 0; x < CONFIG.GRID_SIZE; x++) {
                if (G.userGrid[y][x] >= 0) filled++;
            }
        }
        G.completion = Math.floor((filled / G.totalCells) * 100);
        return;
    }

    // 预设图案：计算匹配度
    G.perfectCells = 0;
    for (var y = 0; y < CONFIG.GRID_SIZE; y++) {
        for (var x = 0; x < CONFIG.GRID_SIZE; x++) {
            if (G.targetGrid[y][x] === 1 && G.userGrid[y][x] >= 0) {
                G.perfectCells++;
            }
        }
    }
    G.completion = Math.floor((G.perfectCells / G.totalCells) * 100);
}

function endGame() {
    gameState = 'result';

    // 计算分数
    var baseScore = G.completion * 10;
    var timeBonus = Math.floor(G.timeLeft * 5);
    var colorBonus = G.colorUsed.size * 20;
    G.score = baseScore + timeBonus + colorBonus;

    saveHighScore();
    createCelebrationParticles();
}

// ===== 粒子系统 =====
function addPaintParticles(x, y, color) {
    for (var i = 0; i < 5; i++) {
        G.particles.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 4,
            vy: (Math.random() - 0.5) * 4,
            life: 1,
            decay: 0.02 + Math.random() * 0.02,
            size: 3 + Math.random() * 4,
            color: color
        });
    }
}

function createCelebrationParticles() {
    for (var i = 0; i < CONFIG.PARTICLE_COUNT; i++) {
        G.particles.push({
            x: Math.random() * canvas.width,
            y: -20,
            vx: (Math.random() - 0.5) * 6,
            vy: 2 + Math.random() * 4,
            life: 1,
            decay: 0.005 + Math.random() * 0.01,
            size: 5 + Math.random() * 8,
            color: CONFIG.COLORS[Math.floor(Math.random() * CONFIG.COLORS.length)]
        });
    }
}

function updateParticles(dt) {
    for (var i = G.particles.length - 1; i >= 0; i--) {
        var p = G.particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;

        if (p.life <= 0) {
            G.particles.splice(i, 1);
        }
    }
}

function drawParticles() {
    for (var i = 0; i < G.particles.length; i++) {
        var p = G.particles[i];
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

// ===== 渲染函数 =====
function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawBackground();

    if (gameState === 'menu') {
        drawMenu();
    } else if (gameState === 'playing') {
        drawGame();
        drawUI();
    } else if (gameState === 'result') {
        drawResult();
    }

    drawParticles();
}

function drawBackground() {
    var gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
    gradient.addColorStop(0, '#1a1a2e');
    gradient.addColorStop(0.5, '#16213e');
    gradient.addColorStop(1, '#0f3460');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function drawMenu() {
    // 标题
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 48px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.fillText('涂色画板', canvas.width / 2, canvas.height / 2 - 150);

    ctx.fillStyle = '#FFFFFF';
    ctx.font = '20px "Microsoft YaHei"';
    ctx.fillText('选择图案，开始涂色创作！', canvas.width / 2, canvas.height / 2 - 100);

    // 图案选择
    var startX = canvas.width / 2 - 200;
    var startY = canvas.height / 2 - 80;

    for (var i = 0; i < PATTERNS.length; i++) {
        var px = startX + (i % 6) * 70;
        var py = startY + Math.floor(i / 6) * 70;

        // 选中框
        if (G.pattern === i) {
            ctx.strokeStyle = '#FFD700';
            ctx.lineWidth = 3;
            ctx.strokeRect(px - 2, py - 2, 64, 64);
        }

        // 按钮背景
        ctx.fillStyle = G.pattern === i ? '#3a3a5a' : '#2a2a4a';
        ctx.fillRect(px, py, 60, 60);

        // 图案emoji
        ctx.font = '30px Arial';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText(PATTERNS[i].emoji, px + 30, py + 40);
    }

    // 开始按钮
    var btnX = canvas.width / 2 - 100;
    var btnY = canvas.height / 2 + 50;

    var btnGradient = ctx.createLinearGradient(btnX, btnY, btnX + 200, btnY + 50);
    btnGradient.addColorStop(0, '#4ECDC4');
    btnGradient.addColorStop(1, '#45B7D1');
    ctx.fillStyle = btnGradient;
    roundRect(ctx, btnX, btnY, 200, 50, 25);
    ctx.fill();

    ctx.fillStyle = '#FFFFFF';
    ctx.font = 'bold 24px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.fillText('开始涂色', canvas.width / 2, btnY + 33);

    // 高分
    ctx.fillStyle = '#AAAAAA';
    ctx.font = '16px "Microsoft YaHei"';
    ctx.fillText('最高分: ' + G.highScore, canvas.width / 2, btnY + 80);
}

function drawGame() {
    // 绘制网格背景
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(G.gridOffsetX, G.gridOffsetY, CONFIG.CANVAS_SIZE, CONFIG.CANVAS_SIZE);

    // 绘制网格线
    ctx.strokeStyle = '#E0E0E0';
    ctx.lineWidth = 1;
    for (var i = 0; i <= CONFIG.GRID_SIZE; i++) {
        ctx.beginPath();
        ctx.moveTo(G.gridOffsetX + i * CONFIG.CELL_SIZE, G.gridOffsetY);
        ctx.lineTo(G.gridOffsetX + i * CONFIG.CELL_SIZE, G.gridOffsetY + CONFIG.CANVAS_SIZE);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(G.gridOffsetX, G.gridOffsetY + i * CONFIG.CELL_SIZE);
        ctx.lineTo(G.gridOffsetX + CONFIG.CANVAS_SIZE, G.gridOffsetY + i * CONFIG.CELL_SIZE);
        ctx.stroke();
    }

    // 绘制目标图案（如果是预设图案）
    if (PATTERNS[G.pattern].grid) {
        ctx.globalAlpha = 0.2;
        for (var y = 0; y < CONFIG.GRID_SIZE; y++) {
            for (var x = 0; x < CONFIG.GRID_SIZE; x++) {
                if (G.targetGrid[y][x] === 1) {
                    ctx.fillStyle = '#CCCCCC';
                    ctx.fillRect(
                        G.gridOffsetX + x * CONFIG.CELL_SIZE + 1,
                        G.gridOffsetY + y * CONFIG.CELL_SIZE + 1,
                        CONFIG.CELL_SIZE - 2,
                        CONFIG.CELL_SIZE - 2
                    );
                }
            }
        }
        ctx.globalAlpha = 1;
    }

    // 绘制用户涂色
    for (var y = 0; y < CONFIG.GRID_SIZE; y++) {
        for (var x = 0; x < CONFIG.GRID_SIZE; x++) {
            if (G.userGrid[y][x] >= 0) {
                ctx.fillStyle = CONFIG.COLORS[G.userGrid[y][x]];
                ctx.fillRect(
                    G.gridOffsetX + x * CONFIG.CELL_SIZE + 1,
                    G.gridOffsetY + y * CONFIG.CELL_SIZE + 1,
                    CONFIG.CELL_SIZE - 2,
                    CONFIG.CELL_SIZE - 2
                );
            }
        }
    }
}

function drawUI() {
    // 工具栏
    var toolSize = 40;
    var tools = ['brush', 'eraser', 'fill'];
    var toolIcons = ['🖌️', '🧹', '🪣'];
    var toolNames = ['画笔', '橡皮', '填充'];

    for (var i = 0; i < tools.length; i++) {
        var tx = 10 + i * 50;
        var ty = 10;

        ctx.fillStyle = G.tool === tools[i] ? '#4ECDC4' : '#3a3a5a';
        ctx.fillRect(tx, ty, toolSize, toolSize);

        ctx.font = '20px Arial';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText(toolIcons[i], tx + toolSize / 2, ty + 28);
    }

    // 颜色调色板
    var colorY = canvas.height - 60;
    var colorSize = 30;

    for (var i = 0; i < CONFIG.COLORS.length; i++) {
        var cx = 10 + i * 35;
        ctx.fillStyle = CONFIG.COLORS[i];
        ctx.fillRect(cx, colorY, colorSize, colorSize);

        if (G.selectedColor === i) {
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 3;
            ctx.strokeRect(cx - 1, colorY - 1, colorSize + 2, colorSize + 2);
        }
    }

    // 时间和分数
    ctx.fillStyle = '#FFFFFF';
    ctx.font = 'bold 20px "Microsoft YaHei"';
    ctx.textAlign = 'right';
    ctx.fillText('时间: ' + Math.ceil(G.timeLeft) + 's', canvas.width - 20, 30);
    ctx.fillText('完成: ' + G.completion + '%', canvas.width - 20, 55);

    // 最高分
    ctx.fillStyle = '#FFD700';
    ctx.font = '16px "Microsoft YaHei"';
    ctx.fillText('最高分: ' + G.highScore, canvas.width - 20, 80);
}

function drawResult() {
    // 背景遮罩
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 结果框
    var boxW = 350;
    var boxH = 300;
    var boxX = (canvas.width - boxW) / 2;
    var boxY = (canvas.height - boxH) / 2;

    ctx.fillStyle = '#2a2a4a';
    roundRect(ctx, boxX, boxY, boxW, boxH, 20);
    ctx.fill();

    ctx.strokeStyle = '#4ECDC4';
    ctx.lineWidth = 3;
    roundRect(ctx, boxX, boxY, boxW, boxH, 20);
    ctx.stroke();

    // 标题
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 32px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.fillText('涂色完成！', canvas.width / 2, boxY + 50);

    // 统计
    ctx.fillStyle = '#FFFFFF';
    ctx.font = '20px "Microsoft YaHei"';
    ctx.fillText('完成度: ' + G.completion + '%', canvas.width / 2, boxY + 100);
    ctx.fillText('使用颜色: ' + G.colorUsed.size + '种', canvas.width / 2, boxY + 130);
    ctx.fillText('得分: ' + G.score, canvas.width / 2, boxY + 160);

    if (G.score >= G.highScore) {
        ctx.fillStyle = '#FFD700';
        ctx.font = 'bold 24px "Microsoft YaHei"';
        ctx.fillText('新纪录！', canvas.width / 2, boxY + 200);
    }

    // 返回按钮
    var btnX = canvas.width / 2 - 100;
    var btnY = boxY + 230;

    var btnGradient = ctx.createLinearGradient(btnX, btnY, btnX + 200, btnY + 50);
    btnGradient.addColorStop(0, '#4ECDC4');
    btnGradient.addColorStop(1, '#45B7D1');
    ctx.fillStyle = btnGradient;
    roundRect(ctx, btnX, btnY, 200, 50, 25);
    ctx.fill();

    ctx.fillStyle = '#FFFFFF';
    ctx.font = 'bold 24px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.fillText('返回菜单', canvas.width / 2, btnY + 33);
}

// ===== 工具函数 =====
function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

// ===== 游戏循环 =====
var lastTime = 0;
function gameLoop(timestamp) {
    var dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;

    if (dt > 0.1) dt = 0.1; // 防止跳帧

    updateGame(dt);
    updateParticles(dt);
    render();

    G.animFrame++;
    requestAnimationFrame(gameLoop);
}

<script>

  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
