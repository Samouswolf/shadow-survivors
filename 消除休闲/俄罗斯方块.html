<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>俄罗斯方块</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; color: #fff; overflow: hidden; }
        
        .game-container { width: 100%; flex: 1; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: #fff; }
        .stats { display: flex; gap: 20px; font-size: 14px; }
        
        .main-area { flex: 1; display: flex; gap: 15px; }
        
        .game-board { flex: 1; background: rgba(0,0,0,0.5); border-radius: 15px; padding: 10px; display: flex; align-items: center; justify-content: center; }
        
        .board { display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(20, 1fr); gap: 1px; background: #333; padding: 2px; border-radius: 5px; }
        
        .cell { background: rgba(255,255,255,0.1); }
        .cell.filled { background: #4ecdc4; }
        
        .info-panel { width: 120px; background: rgba(255,255,255,0.1); border-radius: 15px; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        
        .next-piece { width: 80px; height: 80px; background: rgba(0,0,0,0.5); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
        
        .actions { display: flex; gap: 10px; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; }
        
        .action-btn { flex: 1; padding: 15px; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; background: rgba(255,255,255,0.2); color: #fff; }
        
        .control-buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }
    /* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */
/* [BATCH-FIX:ad-components-css] */
.sponsor-btn{position:fixed;bottom:8px;left:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:2px 6px;border-radius:10px;font:10px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}

.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}

/* [AD-FIX:responsive] */
@media (max-width:768px){.ad-banner-container{display:none!important}.sponsor-btn{transform:scale(.8);opacity:.6}}

</style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="title">🧱 俄罗斯方块</div>
            <div class="stats">
                <span>⭐ 分数: <span id="score">0</span></span>
                <span>📊 等级: <span id="level">1</span></span>
            </div>
        </div>
        
        <div class="main-area">
            <div class="game-board">
                <div class="board" id="board"></div>
            </div>
            
            <div class="info-panel">
                <div>下一个:</div>
                <div class="next-piece" id="nextPiece"></div>
                <div>分数: <span id="score2">0</span></div>
                <div>消行: <span id="lines">0</span></div>
            </div>
        </div>
        
        <div class="actions">
            <div class="control-buttons">
                <div></div>
                <button class="action-btn" onclick="moveUp()">⬆️</button>
                <div></div>
                <button class="action-btn" onclick="moveLeft()">⬅️</button>
                <button class="action-btn" onclick="moveDown()">⬇️</button>
                <button class="action-btn" onclick="moveRight()">➡️</button>
                <button class="action-btn" onclick="rotate()">🔄</button>
                <button class="action-btn" onclick="drop()">⬇️⬇️</button>
                <button class="action-btn" onclick="startGame()">🎮</button>
            </div>
        </div>
    </div>
    
    

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <script>
        const GAME_NAME = '俄罗斯方块';
        GameCore.init({ highScore: GAME_NAME });
        
        const BOARD_WIDTH = 10;
        const BOARD_HEIGHT = 20;
        
        let board = [];
        let currentPiece = null;
        let currentPosition = { x: 0, y: 0 };
        let nextPiece = null;
        let score = 0;
        let lines = 0;
        let level = 1;
        let gameRunning = false;
        let gameLoop = null;
        
        const pieces = [
            { shape: [[1, 1, 1, 1]], color: '#ff6b6b' },
            { shape: [[1, 1], [1, 1]], color: '#4ecdc4' },
            { shape: [[0, 1, 0], [1, 1, 1]], color: '#ffe66d' },
            { shape: [[1, 1, 0], [0, 1, 1]], color: '#95e1d3' },
            { shape: [[0, 1, 1], [1, 1, 0]], color: '#f38181' },
            { shape: [[1, 0, 0], [1, 1, 1]], color: '#aa96da' },
            { shape: [[0, 0, 1], [1, 1, 1]], color: '#fcbad3' }
        ];
        
        function initGame() {
            createBoard();
        }
        
        function createBoard() {
            board = Array(BOARD_HEIGHT).fill(null).map(() => Array(BOARD_WIDTH).fill(0));
            renderBoard();
        }
        
        function renderBoard() {
            const boardElement = document.getElementById('board');
            boardElement.innerHTML = '';
            
            board.forEach(row => {
                row.forEach(cell => {
                    const cellElement = document.createElement('div');
                    cellElement.className = 'cell';
                    if (cell !== 0) {
                        cellElement.classList.add('filled');
                        cellElement.style.background = cell;
                    }
                    boardElement.appendChild(cellElement);
                });
            });
        }
        
        function startGame() {
            if (gameRunning) return;
            
            gameRunning = true;
            score = 0;
            lines = 0;
            level = 1;
            createBoard();
            spawnPiece();
            updateLoop();
            updateUI();
        }
        
        function spawnPiece() {
            currentPiece = nextPiece || pieces[Math.floor(Math.random() * pieces.length)];
            nextPiece = pieces[Math.floor(Math.random() * pieces.length)];
            
            currentPosition = {
                x: Math.floor((BOARD_WIDTH - currentPiece.shape[0].length) / 2),
                y: 0
            };
            
            if (!isValidPosition(currentPiece.shape, currentPosition)) {
                gameOver();
                return;
            }
            
            renderNextPiece();
        }
        
        function renderNextPiece() {
            const nextPieceElement = document.getElementById('nextPiece');
            nextPieceElement.innerHTML = '';
            
            nextPiece.shape.forEach(row => {
                row.forEach(cell => {
                    const cellElement = document.createElement('div');
                    cellElement.className = 'cell';
                    if (cell !== 0) {
                        cellElement.classList.add('filled');
                        cellElement.style.background = nextPiece.color;
                    }
                    nextPieceElement.appendChild(cellElement);
                });
            });
        }
        
        function isValidPosition(shape, position) {
            for (let y = 0; y < shape.length; y++) {
                for (let x = 0; x < shape[y].length; x++) {
                    if (shape[y][x] !== 0) {
                        const newX = position.x + x;
                        const newY = position.y + y;
                        
                        if (newX < 0 || newX >= BOARD_WIDTH || newY >= BOARD_HEIGHT) {
                            return false;
                        }
                        
                        if (newY >= 0 && board[newY][newX] !== 0) {
                            return false;
                        }
                    }
                }
            }
            return true;
        }
        
        function mergePiece() {
            for (let y = 0; y < currentPiece.shape.length; y++) {
                for (let x = 0; x < currentPiece.shape[y].length; x++) {
                    if (currentPiece.shape[y][x] !== 0) {
                        const boardY = currentPosition.y + y;
                        const boardX = currentPosition.x + x;
                        
                        if (boardY >= 0) {
                            board[boardY][boardX] = currentPiece.color;
                        }
                    }
                }
            }
            
            clearLines();
            spawnPiece();
            renderBoard();
        }
        
        function clearLines() {
            let cleared = 0;
            
            for (let y = BOARD_HEIGHT - 1; y >= 0; y--) {
                if (board[y].every(cell => cell !== 0)) {
                    board.splice(y, 1);
                    board.unshift(Array(BOARD_WIDTH).fill(0));
                    cleared++;
                    y++;
                }
            }
            
            if (cleared > 0) {
                lines += cleared;
                score += cleared * 100 * level;
                
                if (lines >= level * 10) {
                    level++;
                }
                
                updateUI();
            }
        }
        
        function moveDown() {
            if (!gameRunning) return;
            
            const newPosition = { ...currentPosition, y: currentPosition.y + 1 };
            
            if (isValidPosition(currentPiece.shape, newPosition)) {
                currentPosition = newPosition;
                renderBoard();
            } else {
                mergePiece();
            }
        }
        
        function moveLeft() {
            if (!gameRunning) return;
            
            const newPosition = { ...currentPosition, x: currentPosition.x - 1 };
            
            if (isValidPosition(currentPiece.shape, newPosition)) {
                currentPosition = newPosition;
                renderBoard();
            }
        }
        
        function moveRight() {
            if (!gameRunning) return;
            
            const newPosition = { ...currentPosition, x: currentPosition.x + 1 };
            
            if (isValidPosition(currentPiece.shape, newPosition)) {
                currentPosition = newPosition;
                renderBoard();
            }
        }
        
        function moveUp() {
            if (!gameRunning) return;
            
            const newPosition = { ...currentPosition, y: currentPosition.y - 1 };
            
            if (isValidPosition(currentPiece.shape, newPosition)) {
                currentPosition = newPosition;
                renderBoard();
            }
        }
        
        function rotate() {
            if (!gameRunning) return;
            
            const rotated = [];
            const shape = currentPiece.shape;
            
            for (let x = 0; x < shape[0].length; x++) {
                const newRow = [];
                for (let y = shape.length - 1; y >= 0; y--) {
                    newRow.push(shape[y][x]);
                }
                rotated.push(newRow);
            }
            
            if (isValidPosition(rotated, currentPosition)) {
                currentPiece.shape = rotated;
                renderBoard();
            }
        }
        
        function drop() {
            if (!gameRunning) return;
            
            while (isValidPosition(currentPiece.shape, { ...currentPosition, y: currentPosition.y + 1 })) {
                currentPosition.y++;
            }
            
            mergePiece();
        }
        
        function updateLoop() {
            if (!gameRunning) return;
            
            clearInterval(gameLoop);
            gameLoop = setInterval(() => {
                moveDown();
            }, Math.max(100, 1000 - level * 100));
        }
        
        function gameOver() {
            gameRunning = false;
            clearInterval(gameLoop);
            GameCore.hints.show(`游戏结束！最终得分: ${score}`);
            GameCore.highScore.set(GAME_NAME, score);
        }
        
        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('score2').textContent = score;
            document.getElementById('level').textContent = level;
            document.getElementById('lines').textContent = lines;
        }
        
        document.addEventListener('keydown', (e) => {
            const keyMap = {
                'ArrowUp': moveUp,
                'ArrowDown': moveDown,
                'ArrowLeft': moveLeft,
                'ArrowRight': moveRight,
                'z': rotate,
                'Z': rotate,
                ' ': drop
            };
            
            if (keyMap[e.key]) {
                keyMap[e.key]();
                e.preventDefault();
            }
        });
        
        initGame();
        GameCore.touch.enableAllButtons();
    </script>

<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>
<!-- [/BATCH-FIX:responsive-js] -->
<!-- [BATCH-FIX:touch-support] -->
<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>
<!-- [/BATCH-FIX:touch-support] -->

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
