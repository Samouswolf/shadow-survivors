<body>

<script>
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
const W=300,H=500;
cv.width=W;cv.height=H;

function resizeCanvas(){
    const maxW=window.innerWidth-20;
    if(W>maxW){
        cv.style.width=maxW+'px';
        cv.style.height=(H*maxW/W)+'px';
    }else{
        cv.style.width='';
        cv.style.height='';
    }
}
window.addEventListener('resize',resizeCanvas);
resizeCanvas();

// 方块形状 (SRS标准)
const SHAPES={
    I:{blocks:[[0,0],[1,0],[2,0],[3,0]],color:'#00f0f0'},
    O:{blocks:[[0,0],[1,0],[0,1],[1,1]],color:'#f0f000'},
    T:{blocks:[[0,0],[1,0],[2,0],[1,1]],color:'#a000f0'},
    S:{blocks:[[1,0],[2,0],[0,1],[1,1]],color:'#00f000'},
    Z:{blocks:[[0,0],[1,0],[1,1],[2,1]],color:'#f00000'},
    J:{blocks:[[0,0],[0,1],[1,1],[2,1]],color:'#0000f0'},
    L:{blocks:[[2,0],[0,1],[1,1],[2,1]],color:'#f0a000'}
};

const SHAPE_KEYS=['I','O','T','S','Z','J','L'];
const COLS=10;
const ROWS=20;
const CELL=25;
const GRID_X=25;
const GRID_Y=25;

// 游戏状态
let G={
    state:'menu',
    score:0,
    level:1,
    lines:0,
    grid:[],
    current:null,
    next:null,
    dropTimer:0,
    dropInterval:60,
    gameOver:false
};

let paused=false;

// 创建空网格
function createGrid(){
    const grid=[];
    for(let r=0;r<ROWS;r++){
        grid[r]=[];
        for(let c=0;c<COLS;c++){
            grid[r][c]=null;
        }
    }
    return grid;
}

// 生成随机方块
function randomPiece(){
    const key=SHAPE_KEYS[Math.floor(Math.random()*SHAPE_KEYS.length)];
    const shape=SHAPES[key];
    return{
        key:key,
        blocks:shape.blocks.map(b=>[...b]),
        color:shape.color,
        x:3,
        y:0
    };
}

// 检查碰撞
function checkCollision(piece,dx,dy){
    for(const[bx,by] of piece.blocks){
        const nx=piece.x+bx+dx;
        const ny=piece.y+by+dy;

        if(nx<0||nx>=COLS||ny>=ROWS)return true;
        if(ny>=0&&G.grid[ny][nx])return true;
    }
    return false;
}

// 旋转方块
function rotatePiece(piece){
    if(piece.key==='O')return; // O不旋转

    const newBlocks=[];
    for(const[bx,by] of piece.blocks){
        newBlocks.push([-by,bx]);
    }

    // 归一化坐标
    let minX=Math.min(...newBlocks.map(b=>b[0]));
    let minY=Math.min(...newBlocks.map(b=>b[1]));

    const normalized=newBlocks.map(b=>[b[0]-minX,b[1]-minY]);

    // 检查旋转后是否碰撞
    const oldBlocks=piece.blocks;
    piece.blocks=normalized;

    if(checkCollision(piece,0,0)){
        // 尝试墙踢
        const kicks=[-1,1,-2,2];
        let kicked=false;
        for(const kick of kicks){
            if(!checkCollision(piece,kick,0)){
                piece.x+=kick;
                kicked=true;
                break;
            }
        }
        if(!kicked){
            piece.blocks=oldBlocks; // 恢复
        }
    }
}

// 锁定方块到网格
function lockPiece(){
    for(const[bx,by] of G.current.blocks){
        const gx=G.current.x+bx;
        const gy=G.current.y+by;

        if(gy<0){
            G.gameOver=true;
            return;
        }

        G.grid[gy][gx]=G.current.color;
    }

    // 检查消行
    clearLines();

    // 生成新方块
    G.current=G.next;
    G.next=randomPiece();
    G.dropTimer=0;

    // 检查游戏结束
    if(checkCollision(G.current,0,0)){
        sfxLose();setHighScore(G.score);G.gameOver=true;
    }
}

// 消行
function clearLines(){
    let linesCleared=0;

    for(let r=ROWS-1;r>=0;r--){
        let full=true;
        for(let c=0;c<COLS;c++){
            if(!G.grid[r][c]){
                full=false;
                break;
            }
        }

        if(full){
            linesCleared++;
            // 删除该行
            G.grid.splice(r,1);
            // 添加新空行
            G.grid.unshift(Array(COLS).fill(null));
            r++; // 重新检查当前行
        }
    }

    if(linesCleared>0){
        // 计分
        const points=[0,100,300,500,800];
        sfxScore();G.score+=points[linesCleared]*G.level;
        G.lines+=linesCleared;

        // 升级
        G.level=Math.floor(G.lines/10)+1;
        G.dropInterval=Math.max(10,60-G.level*5);
    }
}

// 初始化游戏
function initGame(){
    G.state='playing';
    G.score=0;
    G.level=1;
    G.lines=0;
    G.grid=createGrid();
    G.current=randomPiece();
    G.next=randomPiece();
    G.dropTimer=0;
    G.dropInterval=60;
    G.gameOver=false;

    document.getElementById('startScreen').style.display='none';
    document.getElementById('pauseBtn').style.display='block';
}

// 更新游戏
function update(){
    if(G.state!=='playing'||paused)return;

    if(G.gameOver){
        G.state='over';
        return;
    }

    // 自动下落
    G.dropTimer++;
    if(G.dropTimer>=G.dropInterval){
        G.dropTimer=0;

        if(!checkCollision(G.current,0,1)){
            G.current.y++;
        }else{
            lockPiece();
        }
    }
}

// 绘制方块
function drawBlock(x,y,color,ghost=false){
    if(ghost){
        ctx.fillStyle='rgba(255,255,255,0.1)';
        ctx.fillRect(GRID_X+x*CELL,GRID_Y+y*CELL,CELL-1,CELL-1);
        ctx.strokeStyle='rgba(255,255,255,0.2)';
        ctx.lineWidth=1;
        ctx.strokeRect(GRID_X+x*CELL,GRID_Y+y*CELL,CELL-1,CELL-1);
    }else{
        ctx.fillStyle=color;
        ctx.fillRect(GRID_X+x*CELL,GRID_Y+y*CELL,CELL-1,CELL-1);

        // 高光
        ctx.fillStyle='rgba(255,255,255,0.2)';
        ctx.fillRect(GRID_X+x*CELL,GRID_Y+y*CELL,CELL-1,3);
        ctx.fillRect(GRID_X+x*CELL,GRID_Y+y*CELL,3,CELL-1);

        // 阴影
        ctx.fillStyle='rgba(0,0,0,0.2)';
        ctx.fillRect(GRID_X+x*CELL+CELL-3,GRID_Y+y*CELL,3,CELL-1);
        ctx.fillRect(GRID_X+x*CELL,GRID_Y+y*CELL+CELL-1,CELL-1,3);
    }
}

// 绘制游戏
function render(){
    ctx.fillStyle='#0a0a1a';
    ctx.fillRect(0,0,W,H);

    const hasGrid = Array.isArray(G.grid) && G.grid.length === ROWS;

    // 网格背景
    ctx.fillStyle='rgba(255,255,255,0.03)';
    for(let r=0;r<ROWS;r++){
        for(let c=0;c<COLS;c++){
            ctx.fillRect(GRID_X+c*CELL,GRID_Y+r*CELL,CELL-1,CELL-1);
        }
    }

    // 网格边框
    ctx.strokeStyle='rgba(255,255,255,0.1)';
    ctx.lineWidth=2;
    ctx.strokeRect(GRID_X,GRID_Y,COLS*CELL,ROWS*CELL);

    // 绘制已锁定方块
    if(hasGrid){
        for(let r=0;r<ROWS;r++){
            for(let c=0;c<COLS;c++){
                if(G.grid[r] && G.grid[r][c]){
                    drawBlock(c,r,G.grid[r][c]);
                }
            }
        }
    }

    // 绘制幽灵方块（落点预测）
    if(hasGrid && G.current){
        let ghostY=0;
        while(!checkCollision(G.current,0,ghostY+1)){
            ghostY++;
        }

        for(const[bx,by] of G.current.blocks){
            drawBlock(G.current.x+bx,G.current.y+by+ghostY,null,true);
        }
    }

    // 绘制当前方块
    if(hasGrid && G.current){
        for(const[bx,by] of G.current.blocks){
            drawBlock(G.current.x+bx,G.current.y+by,G.current.color);
        }
    }

    // 右侧信息面板
    const panelX=GRID_X+COLS*CELL+20;

    // 下一个方块
    ctx.fillStyle='#888';
    ctx.font='14px Microsoft YaHei';
    ctx.textAlign='left';
    ctx.fillText('下一个:',panelX,GRID_Y+20);

    if(G.next){
        const previewX=panelX+10;
        const previewY=GRID_Y+40;
        for(const[bx,by] of G.next.blocks){
            ctx.fillStyle=G.next.color;
            ctx.fillRect(previewX+bx*18,previewY+by*18,17,17);
            ctx.strokeStyle='rgba(255,255,255,0.2)';
            ctx.lineWidth=1;
            ctx.strokeRect(previewX+bx*18,previewY+by*18,17,17);
        }
    }

    // 分数
    ctx.fillStyle='#fff';
    ctx.font='bold 16px Microsoft YaHei';
    ctx.fillText('得分',panelX,GRID_Y+140);
    ctx.fillStyle='#00d4ff';
    ctx.font='bold 20px Microsoft YaHei';
    ctx.fillText(G.score,panelX,GRID_Y+165);

    // 等级
    ctx.fillStyle='#fff';
    ctx.font='bold 16px Microsoft YaHei';
    ctx.fillText('等级',panelX,GRID_Y+200);
    ctx.fillStyle='#ffaa00';
    ctx.font='bold 20px Microsoft YaHei';
    ctx.fillText(G.level,panelX,GRID_Y+225);

    // 行数
    ctx.fillStyle='#fff';
    ctx.font='bold 16px Microsoft YaHei';
    ctx.fillText('行数',panelX,GRID_Y+260);
    ctx.fillStyle='#44ff44';
    ctx.font='bold 20px Microsoft YaHei';
    ctx.fillText(G.lines,panelX,GRID_Y+285);

    // 操作说明
    ctx.fillStyle='#666';
    ctx.font='12px Microsoft YaHei';
    ctx.fillText('← → 移动',panelX,GRID_Y+340);
    ctx.fillText('↑ 旋转',panelX,GRID_Y+360);
    ctx.fillText('↓ 加速',panelX,GRID_Y+380);
    ctx.fillText('空格 硬降',panelX,GRID_Y+400);

    // 游戏结束
    if(G.state==='over'){
        ctx.fillStyle='rgba(0,0,0,0.7)';
        ctx.fillRect(0,0,W,H);

        ctx.fillStyle='#00d4ff';
        ctx.font='bold 36px Microsoft YaHei';
        ctx.textAlign='center';
        ctx.fillText('游戏结束!',W/2,H/2-60);

        ctx.fillStyle='#fff';
        ctx.font='20px Microsoft YaHei';
        ctx.fillText('得分: '+G.score,W/2,H/2-10);
        ctx.fillText('等级: '+G.level,W/2,H/2+20);
        ctx.fillText('行数: '+G.lines,W/2,H/2+50);

        ctx.fillStyle='#88ccff';
        ctx.font='18px Microsoft YaHei';
        ctx.fillText('点击重新开始',W/2,H/2+100);
    }
}

// 主循环
function gameLoop(){
    update();
    render();
    requestAnimationFrame(gameLoop);
}

// 硬降（直接落到底）
function hardDrop(){
    while(!checkCollision(G.current,0,1)){
        G.current.y++;
    }
    lockPiece();
}

// 事件绑定
document.addEventListener('keydown',(e)=>{
    if(G.state!=='playing'||paused)return;

    switch(e.key){
        case 'ArrowLeft':
            if(!checkCollision(G.current,-1,0)){
                G.current.x--;
            }
            break;
        case 'ArrowRight':
            if(!checkCollision(G.current,1,0)){
                G.current.x++;
            }
            break;
        case 'ArrowDown':
            if(!checkCollision(G.current,0,1)){
                G.current.y++;
            }
            break;
        case 'ArrowUp':
            rotatePiece(G.current);
            break;
        case ' ':
            hardDrop();
            break;
        case 'Escape':
            if(!paused){
                paused=true;
                document.getElementById('pauseScreen').style.display='flex';
            }
            break;
    }
});

// 触屏控制
let touchStartX=0,touchStartY=0,touchStartTime=0;

cv.addEventListener('touchstart',(e)=>{
    e.preventDefault();
    if(G.state==='over'){
        initGame();
        return;
    }
    if(G.state!=='playing')return;

    const touch=e.touches[0];
    touchStartX=touch.clientX;
    touchStartY=touch.clientY;
    touchStartTime=Date.now();
},{passive:false});

cv.addEventListener('touchend',(e)=>{
    e.preventDefault();
    if(G.state!=='playing'||paused)return;

    const touch=e.changedTouches[0];
    const dx=touch.clientX-touchStartX;
    const dy=touch.clientY-touchStartY;
    const dt=Date.now()-touchStartTime;

    const absDx=Math.abs(dx);
    const absDy=Math.abs(dy);

    if(absDx<10&&absDy<10&&dt<200){
        // 点击 - 旋转
        rotatePiece(G.current);
    }else if(absDx>absDy){
        // 水平滑动
        if(dx>30&&!checkCollision(G.current,1,0)){
            G.current.x++;
        }else if(dx<-30&&!checkCollision(G.current,-1,0)){
            G.current.x--;
        }
    }else{
        // 垂直滑动
        if(dy>50){
            hardDrop();
        }else if(dy>20&&!checkCollision(G.current,0,1)){
            G.current.y++;
        }
    }
},{passive:false});

// 触屏按钮
const btnStyle='position:fixed;bottom:100px;width:50px;height:50px;font-size:24px;background:rgba(255,255,255,0.2);color:#fff;border:1px solid rgba(255,255,255,0.3);border-radius:10px;z-index:10;display:none';

const btnLeft=document.createElement('button');
btnLeft.textContent='←';
btnLeft.style.cssText=btnStyle+'left:10px;';
btnLeft.onclick=()=>{
    if(G.state==='playing'&&!paused&&!checkCollision(G.current,-1,0)){
        G.current.x--;
    }
};
document.body.appendChild(btnLeft);

const btnRight=document.createElement('button');
btnRight.textContent='→';
btnRight.style.cssText=btnStyle+'left:70px;';
btnRight.onclick=()=>{
    if(G.state==='playing'&&!paused&&!checkCollision(G.current,1,0)){
        G.current.x++;
    }
};
document.body.appendChild(btnRight);

const btnRotate=document.createElement('button');
btnRotate.textContent='↑';
btnRotate.style.cssText=btnStyle+'right:70px;';
btnRotate.onclick=()=>{
    if(G.state==='playing'&&!paused){
        rotatePiece(G.current);
    }
};
document.body.appendChild(btnRotate);

const btnDrop=document.createElement('button');
btnDrop.textContent='⤓';
btnDrop.style.cssText=btnStyle+'right:10px;';
btnDrop.onclick=()=>{
    if(G.state==='playing'&&!paused){
        hardDrop();
    }
};
document.body.appendChild(btnDrop);

// 显示/隐藏按钮
function updateButtons(){
    const show=G.state==='playing';
    btnLeft.style.display=show?'block':'none';
    btnRight.style.display=show?'block':'none';
    btnRotate.style.display=show?'block':'none';
    btnDrop.style.display=show?'block':'none';
}

// 开始按钮
document.getElementById('startBtn').onclick=()=>{
    initGame();
    updateButtons();
};

// ===== 音效系统 =====
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }
function playTone(freq, dur, type='sine', vol=0.3) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}
function sfxClick() { initAudio(); playTone(800, 0.05, 'sine', 0.2); }
function sfxScore() { initAudio(); playTone(523, 0.1); playTone(659, 0.1); }
function sfxWin()   { initAudio(); playTone(523, 0.15); setTimeout(()=>playTone(659, 0.15), 100); setTimeout(()=>playTone(784, 0.2), 200); }
function sfxLose()  { initAudio(); playTone(300, 0.2, 'sawtooth', 0.2); setTimeout(()=>playTone(200, 0.3, 'sawtooth', 0.2), 150); }

const HIGH_SCORE_KEY = 'tetris';
function getHighScore() { return parseInt(localStorage.getItem(HIGH_SCORE_KEY) || '0'); }
function setHighScore(score) {
  const high = getHighScore();
  if (score > high) { localStorage.setItem(HIGH_SCORE_KEY, score); return true; }
  return false;
}
