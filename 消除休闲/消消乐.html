<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>消消乐</title>
    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 420px;
            width: 100%;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            border-radius: 12px;
        }
        .stat {
            text-align: center;
            color: white;
        }
        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
        }
        .game-board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
            background: #2d3748;
            padding: 8px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .cell {
            aspect-ratio: 1;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            user-select: none;
        }
        .cell:hover {
            transform: scale(1.05);
        }
        .cell.selected {
            box-shadow: 0 0 0 3px #ffd700, 0 0 15px rgba(255, 215, 0, 0.5);
            transform: scale(1.1);
        }
        .cell.matched {
            animation: pop 0.3s ease-out forwards;
        }
        @keyframes pop {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); }
            100% { transform: scale(0); opacity: 0; }
        }
        .cell.falling {
            animation: fall 0.3s ease-out;
        }
        @keyframes fall {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .color-0 { background: linear-gradient(135deg, #ff6b6b, #ee5a5a); }
        .color-1 { background: linear-gradient(135deg, #4ecdc4, #44a08d); }
        .color-2 { background: linear-gradient(135deg, #ffd93d, #f9a825); }
        .color-3 { background: linear-gradient(135deg, #6c5ce7, #a29bfe); }
        .color-4 { background: linear-gradient(135deg, #fd79a8, #e84393); }
        .color-5 { background: linear-gradient(135deg, #00b894, #00cec9); }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 20px 40px;
            border-radius: 15px;
            font-size: 20px;
            display: none;
            z-index: 100;
            text-align: center;
        }
        .message.show { display: block; }
        .combo-text {
            position: fixed;
            font-size: 32px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            animation: comboAnim 1s ease-out forwards;
            z-index: 200;
        }
        @keyframes comboAnim {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }
        .ad-banner {
            width: 100%;
            height: 60px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">分数</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">移动</div>
                <div class="stat-value" id="moves">30</div>
            </div>
            <div class="stat">
                <div class="stat-label">目标</div>
                <div class="stat-value" id="target">1000</div>
            </div>
        </div>

        <div class="game-board" id="board"></div>

        <div class="controls">
            <button class="btn btn-primary" id="btnReset">🔄 重新开始</button>
        </div>

        <div class="message" id="message"></div>

        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    <script>
        const BOARD_SIZE = 8;
        const COLORS = ['🔴', '🟢', '🟡', '🟣', '🩷', '🟦'];
        const COLOR_CLASSES = ['color-0', 'color-1', 'color-2', 'color-3', 'color-4', 'color-5'];

        let board = [];
        let selectedCell = null;
        let score = 0;
        let moves = 30;
        let targetScore = 1000;
        let isAnimating = false;

        function initGame() {
            board = [];
            for (let row = 0; row < BOARD_SIZE; row++) {
                board[row] = [];
                for (let col = 0; col < BOARD_SIZE; col++) {
                    board[row][col] = getRandomColor(row, col);
                }
            }
            // 确保初始状态没有匹配
            while (findMatches().length > 0) {
                for (let row = 0; row < BOARD_SIZE; row++) {
                    for (let col = 0; col < BOARD_SIZE; col++) {
                        board[row][col] = getRandomColor(row, col);
                    }
                }
            }
            score = 0;
            moves = 30;
            selectedCell = null;
            isAnimating = false;
            renderBoard();
            updateUI();
        }

        function getRandomColor(row, col) {
            let color;
            do {
                color = Math.floor(Math.random() * COLORS.length);
            } while (wouldMatch(row, col, color));
            return color;
        }

        function wouldMatch(row, col, color) {
            // 检查水平方向
            if (col >= 2 && board[row][col - 1] === color && board[row][col - 2] === color) {
                return true;
            }
            // 检查垂直方向
            if (row >= 2 && board[row - 1] && board[row - 1][col] === color &&
                board[row - 2] && board[row - 2][col] === color) {
                return true;
            }
            return false;
        }

        function renderBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';

            for (let row = 0; row < BOARD_SIZE; row++) {
                for (let col = 0; col < BOARD_SIZE; col++) {
                    const cell = document.createElement('div');
                    cell.className = `cell ${COLOR_CLASSES[board[row][col]]}`;
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    cell.textContent = COLORS[board[row][col]];

                    if (selectedCell && selectedCell.row === row && selectedCell.col === col) {
                        cell.classList.add('selected');
                    }

                    cell.addEventListener('click', () => handleCellClick(row, col));
                    boardEl.appendChild(cell);
                }
            }
        }

        function handleCellClick(row, col) {
            if (isAnimating || moves <= 0) return;

            if (!selectedCell) {
                selectedCell = { row, col };
                renderBoard();
            } else {
                const dx = Math.abs(selectedCell.col - col);
                const dy = Math.abs(selectedCell.row - row);

                if ((dx === 1 && dy === 0) || (dx === 0 && dy === 1)) {
                    swapCells(selectedCell.row, selectedCell.col, row, col);
                } else {
                    selectedCell = { row, col };
                    renderBoard();
                }
            }
        }

        async function swapCells(row1, col1, row2, col2) {
            isAnimating = true;

            // 交换
            const temp = board[row1][col1];
            board[row1][col1] = board[row2][col2];
            board[row2][col2] = temp;

            renderBoard();

            const matches = findMatches();
            if (matches.length > 0) {
                moves--;
                updateUI();
                await processMatches();
            } else {
                // 交换回来
                board[row2][col2] = board[row1][col1];
                board[row1][col1] = temp;
                renderBoard();
            }

            selectedCell = null;
            isAnimating = false;

            if (moves <= 0) {
                endGame();
            }
        }

        function findMatches() {
            const matches = new Set();

            // 检查水平匹配
            for (let row = 0; row < BOARD_SIZE; row++) {
                for (let col = 0; col < BOARD_SIZE - 2; col++) {
                    if (board[row][col] === board[row][col + 1] &&
                        board[row][col] === board[row][col + 2]) {
                        matches.add(`${row},${col}`);
                        matches.add(`${row},${col + 1}`);
                        matches.add(`${row},${col + 2}`);
                    }
                }
            }

            // 检查垂直匹配
            for (let row = 0; row < BOARD_SIZE - 2; row++) {
                for (let col = 0; col < BOARD_SIZE; col++) {
                    if (board[row][col] === board[row + 1][col] &&
                        board[row][col] === board[row + 2][col]) {
                        matches.add(`${row},${col}`);
                        matches.add(`${row + 1},${col}`);
                        matches.add(`${row + 2},${col}`);
                    }
                }
            }

            return Array.from(matches).map(pos => {
                const [row, col] = pos.split(',').map(Number);
                return { row, col };
            });
        }

        async function processMatches() {
            let combo = 0;
            let matches = findMatches();

            while (matches.length > 0) {
                combo++;

                // 显示消除动画
                matches.forEach(({ row, col }) => {
                    const index = row * BOARD_SIZE + col;
                    const cells = document.querySelectorAll('.cell');
                    if (cells[index]) {
                        cells[index].classList.add('matched');
                    }
                });

                // 计算分数
                const points = matches.length * 10 * combo;
                score += points;

                if (combo > 1) {
                    showCombo(combo, points);
                }

                await sleep(300);

                // 移除匹配的方块
                matches.forEach(({ row, col }) => {
                    board[row][col] = -1;
                });

                // 下落填充
                await dropAndFill();

                updateUI();
                matches = findMatches();
            }
        }

        async function dropAndFill() {
            // 下落
            for (let col = 0; col < BOARD_SIZE; col++) {
                let emptyRow = BOARD_SIZE - 1;
                for (let row = BOARD_SIZE - 1; row >= 0; row--) {
                    if (board[row][col] !== -1) {
                        board[emptyRow][col] = board[row][col];
                        if (emptyRow !== row) {
                            board[row][col] = -1;
                        }
                        emptyRow--;
                    }
                }
                // 填充新方块
                for (let row = emptyRow; row >= 0; row--) {
                    board[row][col] = Math.floor(Math.random() * COLORS.length);
                }
            }

            renderBoard();

            // 添加下落动画
            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => cell.classList.add('falling'));

            await sleep(300);

            cells.forEach(cell => cell.classList.remove('falling'));
        }

        function showCombo(combo, points) {
            const comboText = document.createElement('div');
            comboText.className = 'combo-text';
            comboText.textContent = `${combo}连击! +${points}`;
            comboText.style.left = '50%';
            comboText.style.top = '50%';
            comboText.style.transform = 'translate(-50%, -50%)';
            document.body.appendChild(comboText);

            setTimeout(() => comboText.remove(), 1000);
        }

        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('moves').textContent = moves;
            document.getElementById('target').textContent = targetScore;
        }

        function endGame() {
            if (score >= targetScore) {
                showMessage('🎉 恭喜过关！\n得分: ' + score);
                GameCore.highScore.set('match3_game', score);
            } else {
                showMessage('游戏结束\n得分: ' + score);
            }
        }

        function showMessage(msg) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 3000);
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        document.getElementById('btnReset').addEventListener('click', initGame);

        // 初始化
        GameCore.init({ highScore: 'match3_game' });
        initGame();
    </script>
</body>
</html>
