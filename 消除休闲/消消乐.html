            border-radius: 12px;
            margin-bottom: 15px;
        }
        .cell {
            aspect-ratio: 1;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            user-select: none;
        }
        .cell:hover {
            transform: scale(1.05);
        }
        .cell.selected {
            box-shadow: 0 0 0 3px #ffd700, 0 0 15px rgba(255, 215, 0, 0.5);
            transform: scale(1.1);

        .cell.matched {
            animation: pop 0.3s ease-out forwards;
        }
        @keyframes pop {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); }
            100% { transform: scale(0); opacity: 0; }
        }
        .cell.falling {
            animation: fall 0.3s ease-out;
        }
        @keyframes fall {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

<body>
    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">分数</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">移动</div>
                <div class="stat-value" id="moves">30</div>
            </div>
            <div class="stat">
                <div class="stat-label">目标</div>
                <div class="stat-value" id="target">1000</div>
            </div>
        </div>

        <div class="game-board" id="board"></div>

        <div class="controls">
            <button class="btn btn-primary" id="btnReset">🔄 重新开始</button>
        </div>

        <div class="message" id="message"></div>

        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    <script>
        const BOARD_SIZE = 8;
        const COLORS = ['🔴', '🟢', '🟡', '🟣', '🩷', '🟦'];
        const COLOR_CLASSES = ['color-0', 'color-1', 'color-2', 'color-3', 'color-4', 'color-5'];

        let board = [];
        let selectedCell = null;
        let score = 0;
        let moves = 30;
        let targetScore = 1000;
        let isAnimating = false;

        function initGame() {
            board = [];
            for (let row = 0; row < BOARD_SIZE; row++) {
                board[row] = [];
                for (let col = 0; col < BOARD_SIZE; col++) {
                    board[row][col] = getRandomColor(row, col);
                }
            }
            // 确保初始状态没有匹配
            while (findMatches().length > 0) {
                for (let row = 0; row < BOARD_SIZE; row++) {
                    for (let col = 0; col < BOARD_SIZE; col++) {
                        board[row][col] = getRandomColor(row, col);
                    }
                }
            }
            score = 0;
            moves = 30;
            selectedCell = null;
            isAnimating = false;
            renderBoard();
            updateUI();
        }

        function getRandomColor(row, col) {
            let color;
            do {
                color = Math.floor(Math.random() * COLORS.length);
            } while (wouldMatch(row, col, color));
            return color;
        }

        function wouldMatch(row, col, color) {
            // 检查水平方向
            if (col >= 2 && board[row][col - 1] === color && board[row][col - 2] === color) {
                return true;
            }
            // 检查垂直方向
            if (row >= 2 && board[row - 1] && board[row - 1][col] === color &&
                board[row - 2] && board[row - 2][col] === color) {
                return true;
            }
            return false;
        }

        function renderBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';

            for (let row = 0; row < BOARD_SIZE; row++) {
                for (let col = 0; col < BOARD_SIZE; col++) {
                    const cell = document.createElement('div');
                    cell.className = `cell ${COLOR_CLASSES[board[row][col]]}`;
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    cell.textContent = COLORS[board[row][col]];

                    if (selectedCell && selectedCell.row === row && selectedCell.col === col) {
                        cell.classList.add('selected');
                    }

                    cell.addEventListener('click', () => handleCellClick(row, col));
                    boardEl.appendChild(cell);
                }
            }
        }

        function handleCellClick(row, col) {
            if (isAnimating || moves <= 0) return;

            if (!selectedCell) {
                selectedCell = { row, col };
                renderBoard();
            } else {
                const dx = Math.abs(selectedCell.col - col);
                const dy = Math.abs(selectedCell.row - row);

                if ((dx === 1 && dy === 0) || (dx === 0 && dy === 1)) {
                    swapCells(selectedCell.row, selectedCell.col, row, col);
                } else {
                    selectedCell = { row, col };
                    renderBoard();
                }
            }
        }

        async function swapCells(row1, col1, row2, col2) {
            isAnimating = true;

            // 交换
            const temp = board[row1][col1];
            board[row1][col1] = board[row2][col2];
            board[row2][col2] = temp;

            renderBoard();

            const matches = findMatches();
            if (matches.length > 0) {
                moves--;
                updateUI();
                await processMatches();
            } else {
                // 交换回来
                board[row2][col2] = board[row1][col1];
                board[row1][col1] = temp;
                renderBoard();
            }

            selectedCell = null;
            isAnimating = false;

            if (moves <= 0) {
                endGame();
            }
        }

        function findMatches() {
            const matches = new Set();

            // 检查水平匹配
            for (let row = 0; row < BOARD_SIZE; row++) {
                for (let col = 0; col < BOARD_SIZE - 2; col++) {
                    if (board[row][col] === board[row][col + 1] &&
                        board[row][col] === board[row][col + 2]) {
                        matches.add(`${row},${col}`);
                        matches.add(`${row},${col + 1}`);
                        matches.add(`${row},${col + 2}`);
                    }
                }
            }

            // 检查垂直匹配
            for (let row = 0; row < BOARD_SIZE - 2; row++) {
                for (let col = 0; col < BOARD_SIZE; col++) {
                    if (board[row][col] === board[row + 1][col] &&
                        board[row][col] === board[row + 2][col]) {
                        matches.add(`${row},${col}`);
                        matches.add(`${row + 1},${col}`);
                        matches.add(`${row + 2},${col}`);
                    }
                }
            }

            return Array.from(matches).map(pos => {
                const [row, col] = pos.split(',').map(Number);
                return { row, col };
            });
        }

        async function processMatches() {
            let combo = 0;
            let matches = findMatches();

            while (matches.length > 0) {
                combo++;

                // 显示消除动画
                matches.forEach(({ row, col }) => {
                    const index = row * BOARD_SIZE + col;
                    const cells = document.querySelectorAll('.cell');
                    if (cells[index]) {
                        cells[index].classList.add('matched');
                    }
                });

                // 计算分数
                const points = matches.length * 10 * combo;
                score += points;

                if (combo > 1) {
                    showCombo(combo, points);
                }

                await sleep(300);

                // 移除匹配的方块
                matches.forEach(({ row, col }) => {
                    board[row][col] = -1;
                });

                // 下落填充
                await dropAndFill();

                updateUI();
                matches = findMatches();
            }
        }

        async function dropAndFill() {
            // 下落
            for (let col = 0; col < BOARD_SIZE; col++) {
                let emptyRow = BOARD_SIZE - 1;
                for (let row = BOARD_SIZE - 1; row >= 0; row--) {
                    if (board[row][col] !== -1) {
                        board[emptyRow][col] = board[row][col];
                        if (emptyRow !== row) {
                            board[row][col] = -1;
                        }
                        emptyRow--;
                    }
                }
                // 填充新方块
                for (let row = emptyRow; row >= 0; row--) {
                    board[row][col] = Math.floor(Math.random() * COLORS.length);
                }
            }

            renderBoard();

            // 添加下落动画
            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => cell.classList.add('falling'));

            await sleep(300);

            cells.forEach(cell => cell.classList.remove('falling'));
        }

        function showCombo(combo, points) {
            const comboText = document.createElement('div');
            comboText.className = 'combo-text';
            comboText.textContent = `${combo}连击! +${points}`;
            comboText.style.left = '50%';
            comboText.style.top = '50%';
            comboText.style.transform = 'translate(-50%, -50%)';
            document.body.appendChild(comboText);

            setTimeout(() => comboText.remove(), 1000);
        }

        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('moves').textContent = moves;
            document.getElementById('target').textContent = targetScore;
        }

        function endGame() {
            if (score >= targetScore) {
                showMessage('🎉 恭喜过关！\n得分: ' + score);
                GameCore.highScore.set('match3_game', score);
            } else {
                showMessage('游戏结束\n得分: ' + score);
            }
        }

        function showMessage(msg) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 3000);
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        document.getElementById('btnReset').addEventListener('click', initGame);

        // 初始化
        GameCore.init({ highScore: 'match3_game' });
        initGame();
    </script>

<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>

<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>

<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
