<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>谜题方块</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; color: #fff; }
        
        .game-container { width: 100%; flex: 1; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: #ffd700; }
        .level { font-size: 14px; opacity: 0.7; }
        
        .board-area { flex: 1; display: flex; justify-content: center; align-items: center; }
        .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 15px; }
        .tile { width: 80px; height: 80px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 36px; cursor: pointer; transition: transform 0.3s; }
        .tile.rotating { animation: rotateAnim 0.5s; }
        
        @keyframes rotateAnim {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(90deg); }
        }
        
        .tile.row0 { background: linear-gradient(135deg, #ff6b6b, #ffa502); }
        .tile.row1 { background: linear-gradient(135deg, #4ecdc4, #48c78e); }
        .tile.row2 { background: linear-gradient(135deg, #667eea, #764ba2); }
        
        .controls { display: flex; gap: 10px; justify-content: center; }
        .btn { padding: 12px 25px; border: none; border-radius: 15px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; }
        .btn-secondary { background: rgba(255,255,255,0.2); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="title">🔲 谜题方块</div>
            <div class="level">第 <span id="level">1</span> 关</div>
        </div>
        
        <div class="board-area">
            <div class="board" id="board"></div>
        </div>
        
        <div class="controls">
            <button class="btn btn-secondary" onclick="rotateRow(0)">⬆️ 旋转上排</button>
            <button class="btn btn-secondary" onclick="rotateRow(1)">➡️ 旋转中排</button>
            <button class="btn btn-secondary" onclick="rotateRow(2)">⬇️ 旋转下排</button>
        </div>
    </div>
    
    <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>

    <script src="game_core.js"></script>
    <script>
        const GAME_NAME = '谜题方块';
        GameCore.init({ highScore: GAME_NAME });
        
        const levels = [
            {
                tiles: ['🔴', '🔴', '🔴', '🟢', '🟢', '🟢', '🔵', '🔵', '🔵'],
                target: ['🔴', '🟢', '🔵', '🔴', '🟢', '🔵', '🔴', '🟢', '🔵']
            },
            {
                tiles: ['🔴', '🟢', '🔵', '🟢', '🔵', '🔴', '🔵', '🔴', '🟢'],
                target: ['🔴', '🔴', '🔴', '🟢', '🟢', '🟢', '🔵', '🔵', '🔵']
            },
            {
                tiles: ['🟡', '🔴', '🟢', '🔵', '🟡', '🔴', '🟢', '🔵', '🟡'],
                target: ['🟡', '🟡', '🟡', '🔴', '🔴', '🔴', '🟢', '🟢', '🟢']
            }
        ];
        
        let currentLevel = 0;
        let currentTiles = [];
        
        function initGame() {
            currentLevel = 0;
            loadLevel();
        }
        
        function loadLevel() {
            currentTiles = [...levels[currentLevel].tiles];
            document.getElementById('level').textContent = currentLevel + 1;
            renderBoard();
        }
        
        function renderBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '';
            
            currentTiles.forEach((tile, index) => {
                const el = document.createElement('div');
                el.className = `tile row${Math.floor(index / 3)}`;
                el.textContent = tile;
                el.id = 'tile-' + index;
                
                board.appendChild(el);
            });
        }
        
        function rotateRow(row) {
            const start = row * 3;
            const end = start + 3;
            
            const rowTiles = currentTiles.slice(start, end);
            
            rowTiles.unshift(rowTiles.pop());
            
            for (let i = 0; i < 3; i++) {
                currentTiles[start + i] = rowTiles[i];
            }
            
            renderBoard();
            checkWin();
        }
        
        function checkWin() {
            const target = levels[currentLevel].target;
            
            if (currentTiles.every((tile, index) => tile === target[index])) {
                GameCore.hints.show('🎉 恭喜通关！');
                GameCore.highScore.set(GAME_NAME, currentLevel + 1);
                
                currentLevel++;
                if (currentLevel >= levels.length) {
                    currentLevel = 0;
                    GameCore.hints.show('🎊 全部通关！');
                }
                
                setTimeout(() => {
                    loadLevel();
                }, 1000);
            }
        }
        
        initGame();
        GameCore.touch.enableAllButtons();
    </script>
</body>
</html>
