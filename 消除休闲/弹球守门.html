<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>弹球守门</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #283048 0%, #859398 100%); min-height: 100vh; overflow: hidden; }
        .game-container { width: 100%; height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 10px; }
        .stat { display: flex; flex-direction: column; align-items: center; color: #fff; }
        .stat-label { font-size: 12px; opacity: 0.8; }
        .stat-value { font-size: 24px; font-weight: bold; color: #ffd700; }
        
        .game-area { flex: 1; position: relative; background: rgba(0,0,0,0.3); border-radius: 15px; overflow: hidden; }
        #gameCanvas { width: 100%; height: 100%; display: block; }
        
        .gate-indicator { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); color: #fff; padding: 10px 20px; border-radius: 10px; font-size: 14px; }
        
        .controls { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
        .btn { padding: 12px 25px; border: none; border-radius: 25px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; }
        .btn-success { background: linear-gradient(135deg, #48c78e, #10b981); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 10px; font-size: 14px; }
    </style>
    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">波次</div>
                <div class="stat-value" id="wave">1</div>
            </div>
            <div class="stat">
                <div class="stat-label">得分</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">剩余球</div>
                <div class="stat-value" id="balls">5</div>
            </div>
        </div>
        
        <div class="game-area">
            <canvas id="gameCanvas"></canvas>
            <div class="gate-indicator" id="gateIndicator">球门: 守住弹球！</div>
        </div>
        
        <div class="controls">
            <button class="btn btn-success" id="btnStart">▶️ 开始</button>
            <button class="btn btn-primary" id="btnReset">🔄 重置</button>
        </div>
        
        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let score = 0;
        let wave = 1;
        let balls = 5;
        let highScore = 0;
        let gameRunning = false;
        
        let paddle = { x: 0, y: 0, width: 120, height: 20 };
        let ball = { x: 0, y: 0, vx: 0, vy: 0, radius: 15, active: false };
        let bricks = [];
        let particles = [];
        
        const GAME_NAME = '弹球守门';
        
        GameCore.init({ highScore: GAME_NAME });
        
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            
            paddle.x = canvas.width / 2 - paddle.width / 2;
            paddle.y = canvas.height - 50;
            
            initBall();
        }
        
        function initBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height - 100;
            ball.vx = (Math.random() - 0.5) * 6;
            ball.vy = -5 - wave * 0.5;
            ball.active = false;
        }
        
        function initBricks() {
            bricks = [];
            const rows = 3 + wave;
            const cols = 8;
            const brickWidth = (canvas.width - 40) / cols;
            const brickHeight = 25;
            
            for (let i = 0; i < rows; i++) {
                for (let j = 0; j < cols; j++) {
                    bricks.push({
                        x: 20 + j * brickWidth,
                        y: 50 + i * (brickHeight + 5),
                        width: brickWidth - 3,
                        height: brickHeight,
                        hp: 1 + Math.floor(i / 2),
                        color: `hsl(${i * 30 + 200}, 70%, 50%)`
                    });
                }
            }
        }
        
        function updateBall() {
            if (!ball.active) return;
            
            ball.x += ball.vx;
            ball.y += ball.vy;
            
            // 左右边界
            if (ball.x - ball.radius < 0) {
                ball.x = ball.radius;
                ball.vx *= -1;
            }
            if (ball.x + ball.radius > canvas.width) {
                ball.x = canvas.width - ball.radius;
                ball.vx *= -1;
            }
            
            // 顶部边界
            if (ball.y - ball.radius < 0) {
                ball.y = ball.radius;
                ball.vy *= -1;
            }
            
            // 底部（丢失球）
            if (ball.y + ball.radius > canvas.height) {
                balls--;
                updateStats();
                
                if (balls <= 0) {
                    gameRunning = false;
                    GameCore.hints.show('球用完了！游戏结束！\n得分: ' + score, 5000);
                } else {
                    initBall();
                }
            }
            
            // 挡板碰撞
            if (ball.y + ball.radius > paddle.y && 
                ball.y - ball.radius < paddle.y + paddle.height &&
                ball.x > paddle.x &&
                ball.x < paddle.x + paddle.width) {
                
                ball.y = paddle.y - ball.radius;
                
                // 根据击中位置改变角度
                const hitPos = (ball.x - paddle.x) / paddle.width;
                const angle = (hitPos - 0.5) * Math.PI * 0.7;
                const speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
                
                ball.vx = Math.sin(angle) * speed;
                ball.vy = -Math.abs(Math.cos(angle) * speed);
                
                // 粒子效果
                for (let i = 0; i < 5; i++) {
                    particles.push({
                        x: ball.x,
                        y: ball.y,
                        vx: (Math.random() - 0.5) * 4,
                        vy: -Math.random() * 4,
                        life: 1,
                        color: '#ffd700'
                    });
                }
            }
            
            // 砖块碰撞
            bricks.forEach(brick => {
                if (ball.x + ball.radius > brick.x &&
                    ball.x - ball.radius < brick.x + brick.width &&
                    ball.y + ball.radius > brick.y &&
                    ball.y - ball.radius < brick.y + brick.height) {
                    
                    brick.hp--;
                    
                    // 反弹方向
                    const overlapLeft = ball.x + ball.radius - brick.x;
                    const overlapRight = brick.x + brick.width - (ball.x - ball.radius);
                    const overlapTop = ball.y + ball.radius - brick.y;
                    const overlapBottom = brick.y + brick.height - (ball.y - ball.radius);
                    
                    const minOverlapX = Math.min(overlapLeft, overlapRight);
                    const minOverlapY = Math.min(overlapTop, overlapBottom);
                    
                    if (minOverlapX < minOverlapY) {
                        ball.vx *= -1;
                    } else {
                        ball.vy *= -1;
                    }
                    
                    // 粒子效果
                    for (let i = 0; i < 8; i++) {
                        particles.push({
                            x: ball.x,
                            y: ball.y,
                            vx: (Math.random() - 0.5) * 5,
                            vy: (Math.random() - 0.5) * 5,
                            life: 1,
                            color: brick.color
                        });
                    }
                }
            });
            
            // 移除破坏的砖块
            bricks = bricks.filter(b => b.hp > 0);
            
            // 检查波次完成
            if (bricks.length === 0) {
                wave++;
                score += wave * 500;
                balls = Math.min(balls + 2, 10);
                initBricks();
                initBall();
                updateStats();
            }
        }
        
        function updateParticles() {
            particles = particles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.2;
                p.life -= 0.03;
                return p.life > 0;
            });
        }
        
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 背景网格
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 40) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
            
            // 砖块
            bricks.forEach(brick => {
                ctx.fillStyle = brick.color;
                ctx.shadowColor = brick.color;
                ctx.shadowBlur = 5;
                ctx.fillRect(brick.x, brick.y, brick.width, brick.height);
                ctx.shadowBlur = 0;
                
                // 血量显示
                if (brick.hp > 1) {
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 12px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(brick.hp.toString(), brick.x + brick.width / 2, brick.y + brick.height / 2 + 4);
                }
            });
            
            // 挡板
            ctx.fillStyle = '#ffd700';
            ctx.shadowColor = '#ffd700';
            ctx.shadowBlur = 10;
            ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
            ctx.shadowBlur = 0;
            
            // 球
            ctx.fillStyle = '#fff';
            ctx.shadowColor = '#fff';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            // 粒子
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }
        
        function updateStats() {
            document.getElementById('wave').textContent = wave;
            document.getElementById('score').textContent = score;
            document.getElementById('balls').textContent = balls;
            
            if (GameCore.highScore.set(GAME_NAME, score)) {
                GameCore.hints.show('新纪录！分数: ' + score);
            }
        }
        
        function gameLoop() {
            draw();
            
            if (gameRunning) {
                updateBall();
            }
            
            updateParticles();
            updateStats();
            requestAnimationFrame(gameLoop);
        }
        
        // 鼠标控制挡板
        canvas.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, x - paddle.width / 2));
        });
        
        // 触摸控制
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, x - paddle.width / 2));
            
            if (!ball.active) {
                ball.active = true;
            }
        }, { passive: false });
        
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, x - paddle.width / 2));
        }, { passive: false });
        
        canvas.addEventListener('click', () => {
            if (!ball.active) {
                ball.active = true;
            }
        });
        
        document.getElementById('btnStart').onclick = () => {
            if (!gameRunning) {
                gameRunning = true;
                ball.active = true;
            }
        };
        
        document.getElementById('btnReset').onclick = () => {
            score = 0;
            wave = 1;
            balls = 5;
            gameRunning = false;
            initBricks();
            initBall();
            updateStats();
        };
        
        // 初始化
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        initBricks();
        gameLoop();
    </script>
</body>
</html>
