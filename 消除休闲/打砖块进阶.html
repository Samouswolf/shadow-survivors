<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>打砖块进阶</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(180deg, #0f0f23 0%, #1a1a2e 100%); min-height: 100vh; overflow: hidden; }
#game-container { position: relative; width: 100%; height: 100vh; }
#game-canvas { display: block; width: 100%; height: 100%; }
#game-ui { position: absolute; top: 20px; left: 20px; color: #fff; font-size: 20px; font-weight: bold; z-index: 10; }
#game-ui span { color: #3b82f6; }
#game-over { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 20; flex-direction: column; align-items: center; justify-content: center; }
#game-over h2 { font-size: 48px; color: #f5576c; margin-bottom: 20px; }
#game-over p { font-size: 24px; color: #fff; margin-bottom: 30px; }
#game-over .btn { padding: 15px 40px; font-size: 20px; background: #3b82f6; color: #fff; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
#start-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#start-screen h1 { font-size: 48px; color: #3b82f6; margin-bottom: 20px; text-shadow: 0 0 20px rgba(59,130,246,0.5); }
#start-screen p { color: #aaa; margin-bottom: 40px; font-size: 16px; }
#start-screen .btn { padding: 18px 50px; font-size: 22px; background: linear-gradient(145deg, #3b82f6, #2563eb); color: #fff; border: none; border-radius: 15px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 20px rgba(59,130,246,0.4); }
.ad-banner-container { position: absolute; bottom: 0; left: 0; width: 100%; padding: 10px; z-index: 10; }
.sponsor-btn { position: fixed; top: 20px; right: 20px; width: 50px; height: 50px; background: rgba(255,165,0,0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; z-index: 100; box-shadow: 0 4px 15px rgba(255,165,0,0.4); }
.sponsor-panel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 200; align-items: center; justify-content: center; }
.sponsor-panel.show { display: flex; }
.sponsor-content { background: #fff; padding: 30px; border-radius: 20px; text-align: center; max-width: 90%; }
.sponsor-content h3 { margin-bottom: 20px; color: #333; }
.sponsor-close { position: absolute; top: 20px; right: 20px; width: 40px; height: 40px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; }

#loading-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a2e; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#loading-screen .loading-icon { width: 60px; height: 60px; border: 4px solid #6366f1; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#loading-screen p { color: #6366f1; margin-top: 20px; font-size: 18px; }
.interstitial-ad { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 999; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
.interstitial-ad .ad-content { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; text-align: center; min-width: 280px; max-width: 400px; }
.interstitial-ad .ad-content p { color: #aaa; font-size: 14px; margin-bottom: 12px; }
.interstitial-ad .skip-btn { padding: 8px 28px; background: rgba(255,215,0,0.15); border: 1px solid rgba(255,215,0,0.3); border-radius: 20px; color: #ffd700; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.2s; }
.interstitial-ad .skip-btn:hover { background: rgba(255,215,0,0.25); }

</style>
</head>
<body>
<div id="start-screen">
  <h1>🧱 打砖块进阶</h1>
  <p>拖动挡板反弹小球<br>击碎所有砖块，获得高分！</p>
  <button class="btn" onclick="startGame()">开始游戏</button>
</div>

<div id="game-container">
  <canvas id="game-canvas"></canvas>
  <div id="game-ui">
    分数: <span id="score">0</span> | 生命: <span id="lives">3</span> | 最高: <span id="high-score">0</span>
  </div>
  
  <div id="game-over">
    <h2>💥 游戏结束</h2>
    <p>最终得分: <span id="final-score">0</span></p>
    <button class="btn" onclick="restartGame()">再来一次</button>
  </div>
  
  <div class="ad-banner-container">
    <div style="background:#f0f0f0;height:90px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#666;font-size:14px;">广告位</div>
  </div>
</div>

<div class="sponsor-btn" onclick="showSponsor()">☕</div>
<div class="sponsor-panel" id="sponsor-panel" onclick="hideSponsor()">
  <div class="sponsor-content" onclick="event.stopPropagation()">
    <h3>支持开发者</h3>
    <p>感谢您的支持！</p>
    <div style="color:#666;font-size:14px;margin-top:10px;">微信赞赏码</div>
  </div>
  <div class="sponsor-close" onclick="hideSponsor()">×</div>
</div>


<div id="loading-screen">
  <div class="loading-icon"></div>
  <p>加载中...</p>
</div>

<div class="interstitial-ad" id="interstitialAd">
  <div class="ad-content">
    <p>赞助商广告</p>
    <div id="interstitialAdSlot" style="min-height:250px;display:flex;align-items:center;justify-content:center;color:#888;font-size:13px;">广告加载中...</div>
  </div>
  <button class="skip-btn" id="skipInterstitial" onclick="closeInterstitial()">跳过广告</button>
</div>


  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script>

// ==================== 游戏说明 ====================
// 操作说明: 使用键盘方向键或触屏控制
// 游戏目标: 获得最高分数
// 存档系统: 自动保存最高分到本地
// ==================== 模块说明 ====================
// 1. 游戏初始化模块 - 初始化Canvas和游戏状态
// 2. 游戏逻辑模块 - 处理玩家移动、碰撞检测
// 3. 渲染模块 - 绘制游戏画面和UI
// 4. 音效模块 - 播放游戏音效
// 5. 存档模块 - 管理最高分记录
// ==================== 配置参数 ====================
const GAME_NAME = '打砖块进阶';

class GameCore {
  static init(options) {
    if (options.highScore) {
      this.highScoreKey = options.highScore;
    }
  }
  
  static getHighScore() {
    return parseInt(localStorage.getItem(this.highScoreKey)) || 0;
  }
  
  static setHighScore(value) {
    const current = this.getHighScore();
    if (value > current) {
      localStorage.setItem(this.highScoreKey, value);
      return true;
    }
    return false;
  }
}

GameCore.init({ highScore: GAME_NAME });

const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const highScoreEl = document.getElementById('high-score');
const finalScoreEl = document.getElementById('final-score');

let gameRunning = false;
let score = 0;
let lives = 3;
let bricks = [];
let particles = [];
let combo = 0;

const ball = {
  x: 0,
  y: 0,
  radius: 10,
  velocityX: 4,
  velocityY: -4,
  color: '#3b82f6'
};

const paddle = {
  x: 0,
  y: 0,
  width: 100,
  height: 15,
  color: '#3b82f6'
};

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  
  paddle.x = canvas.width / 2;
  paddle.y = canvas.height - 60;
  
  ball.x = canvas.width / 2;
  ball.y = canvas.height - 80;
}

resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function startGame() {
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('game-over').style.display = 'none';
  gameRunning = true;
  score = 0;
  lives = 3;
  combo = 0;
  bricks = [];
  particles = [];
  
  ball.x = canvas.width / 2;
  ball.y = canvas.height - 80;
  ball.velocityX = 4 * (Math.random() > 0.5 ? 1 : -1);
  ball.velocityY = -4;
  
  paddle.x = canvas.width / 2;
  
  initBricks();
  
  scoreEl.textContent = '0';
  livesEl.textContent = '3';
  highScoreEl.textContent = GameCore.getHighScore();
  
  gameLoop();
}

function restartGame() {
  startGame();
}

function showSponsor() {
  document.getElementById('sponsor-panel').classList.add('show');
}

function hideSponsor() {
  document.getElementById('sponsor-panel').classList.remove('show');
}

function initBricks() {
  const rows = 5;
  const cols = 10;
  const brickWidth = (canvas.width - 60) / cols;
  const brickHeight = 25;
  const padding = 5;
  
  const colors = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#3b82f6'];
  
  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < cols; col++) {
      bricks.push({
        x: col * brickWidth + 30,
        y: row * (brickHeight + padding) + 60,
        width: brickWidth - padding,
        height: brickHeight,
        color: colors[row],
        hits: row < 2 ? 2 : 1,
        maxHits: row < 2 ? 2 : 1,
        visible: true
      });
    }
  }
}

function createParticles(x, y, color) {
  for (let i = 0; i < 6; i++) {
    particles.push({
      x: x,
      y: y,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 0.5) * 6,
      size: Math.random() * 4 + 2,
      color: color,
      life: 1
    });
  }
}

function update() {
  if (!gameRunning) return;
  
  ball.x += ball.velocityX;
  ball.y += ball.velocityY;
  
  if (ball.x - ball.radius < 0 || ball.x + ball.radius > canvas.width) {
    ball.velocityX *= -1;
  }
  
  if (ball.y - ball.radius < 0) {
    ball.velocityY *= -1;
  }
  
  if (ball.y + ball.radius > canvas.height) {
    lives--;
    livesEl.textContent = lives;
    combo = 0;
    
    if (lives <= 0) {
      gameOver();
    } else {
      ball.x = canvas.width / 2;
      ball.y = canvas.height - 80;
      ball.velocityX = 4 * (Math.random() > 0.5 ? 1 : -1);
      ball.velocityY = -4;
    }
  }
  
  if (ball.y + ball.radius > paddle.y &&
      ball.y - ball.radius < paddle.y + paddle.height &&
      ball.x > paddle.x - paddle.width / 2 &&
      ball.x < paddle.x + paddle.width / 2) {
    const hitPos = (ball.x - paddle.x) / (paddle.width / 2);
    ball.velocityX = hitPos * 6;
    ball.velocityY = -Math.abs(ball.velocityY);
    combo++;
    createParticles(ball.x, ball.y, '#3b82f6');
  }
  
  bricks.forEach(brick => {
    if (!brick.visible) return;
    
    if (ball.x + ball.radius > brick.x &&
        ball.x - ball.radius < brick.x + brick.width &&
        ball.y + ball.radius > brick.y &&
        ball.y - ball.radius < brick.y + brick.height) {
      brick.hits--;
      
      if (brick.hits <= 0) {
        brick.visible = false;
        const points = (5 - brick.maxHits) * 10 + 10;
        score += points * (combo + 1);
        scoreEl.textContent = score;
        createParticles(brick.x + brick.width / 2, brick.y + brick.height / 2, brick.color);
      } else {
        brick.color = '#9ca3af';
        score += 5;
        scoreEl.textContent = score;
      }
      
      ball.velocityY *= -1;
    }
  });
  
  const visibleBricks = bricks.filter(b => b.visible);
  if (visibleBricks.length === 0) {
    score += 500;
    scoreEl.textContent = score;
    initBricks();
    ball.velocityX *= 1.1;
    ball.velocityY *= 1.1;
  }
  
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.03;
  });
  
  particles = particles.filter(p => p.life > 0);
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  ctx.fillStyle = '#0f0f23';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  ctx.fillStyle = '#1a1a2e';
  for (let i = 0; i < 40; i++) {
    const x = (i * 53 + Date.now() * 0.01) % canvas.width;
    const y = (i * 37 + Date.now() * 0.02) % canvas.height;
    ctx.fillRect(x, y, 2, 2);
  }
  
  bricks.forEach(brick => {
    if (!brick.visible) return;
    
    ctx.fillStyle = brick.color;
    ctx.fillRect(brick.x, brick.y, brick.width, brick.height);
    
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillRect(brick.x, brick.y, brick.width, 3);
    
    if (brick.hits > 0 && brick.hits < brick.maxHits) {
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 12px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(brick.hits.toString(), brick.x + brick.width / 2, brick.y + brick.height / 2);
    }
  });
  
  const paddleGradient = ctx.createLinearGradient(paddle.x - paddle.width / 2, paddle.y, paddle.x + paddle.width / 2, paddle.y);
  paddleGradient.addColorStop(0, '#60a5fa');
  paddleGradient.addColorStop(0.5, '#3b82f6');
  paddleGradient.addColorStop(1, '#60a5fa');
  ctx.fillStyle = paddleGradient;
  ctx.beginPath();
  ctx.roundRect(paddle.x - paddle.width / 2, paddle.y, paddle.width, paddle.height, 8);
  ctx.fill();
  
  ctx.fillStyle = ball.color;
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.fillStyle = '#60a5fa';
  ctx.beginPath();
  ctx.arc(ball.x - 3, ball.y - 3, ball.radius / 3, 0, Math.PI * 2);
  ctx.fill();
  
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });
  
  ctx.globalAlpha = 1;
  
  if (combo > 1) {
    ctx.fillStyle = '#fbbf24';
    ctx.font = 'bold 20px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(`${combo}x COMBO!`, canvas.width / 2, canvas.height / 2);
  }
}

function gameLoop() {
  if (!gameRunning) return;
  
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

function gameOver() {
  gameRunning = false;
  finalScoreEl.textContent = score;
  
  if (GameCore.setHighScore(score)) {
    highScoreEl.textContent = score;
  }
  
  document.getElementById('game-over').style.display = 'flex';
}

canvas.addEventListener('mousemove', (e) => {
  if (gameRunning) {
    paddle.x = e.clientX;
  }
});

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (gameRunning) {
    paddle.x = e.touches[0].clientX;
  }
});

document.addEventListener('keydown', (e) => {
  if (!gameRunning) return;
  
  if (e.code === 'ArrowLeft') {
    paddle.x -= 30;
  } else if (e.code === 'ArrowRight') {
    paddle.x += 30;
  }
  
  paddle.x = Math.max(paddle.width / 2, Math.min(canvas.width - paddle.width / 2, paddle.x));
});

// ==================== 错误处理 ====================
function closeInterstitial() {
  try {
    var el = document.getElementById('interstitialAd');
    if (el) el.style.display = 'none';
  } catch (error) {
    console.error('关闭广告失败:', error);
  }
}

// ==================== 音效支持 ====================
var audioCtx = null;
function initAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch (error) {
    console.warn('音频初始化失败:', error);
  }
}
function playSound(freq, dur, type, vol) {
  try {
    if (!audioCtx) return;
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = type || 'square';
    o.frequency.value = freq;
    g.gain.value = vol || 0.15;
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime + dur);
  } catch (error) {
    console.warn('音效播放失败:', error);
  }
}

// ==================== 页面加载处理 ====================
window.addEventListener('load', function() {
  try {
    var loadingScreen = document.getElementById('loading-screen');
    if (loadingScreen) {
      setTimeout(function() {
        loadingScreen.style.display = 'none';
      }, 1500);
    }
  } catch (error) {
    console.error('加载界面处理失败:', error);
  }
});

</script>
</body>
</html>
