<script>
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
const W=400,H=600;
cv.width=W;cv.height=H;

// 响应式缩放
function resizeCanvas(){
    const maxW=window.innerWidth-20;
    if(W>maxW){
        cv.style.width=maxW+'px';
        cv.style.height=(H*maxW/W)+'px';
    }else{
        cv.style.width='';
        cv.style.height='';
    }
}
window.addEventListener('resize',resizeCanvas);
resizeCanvas();

// 游戏状态
let G={
    state:'menu', // menu,playing,paused,over
    score:0,
    time:60,
    combo:0,
    maxCombo:0,
    lastTime:0,
    fruits:[],
    bombs:[],
    slashes:[],
    particles:[],
    spawnTimer:0,
    spawnInterval:60
};

// 水果类型
const FRUITS=[
    {name:'苹果',color:'#ff4444',emoji:'🍎',size:30,score:10},
    {name:'香蕉',color:'#ffdd44',emoji:'🍌',size:28,score:15},
    {name:'橙子',color:'#ff8844',emoji:'🍊',size:32,score:10},
    {name:'西瓜',color:'#44bb44',emoji:'🍉',size:40,score:20},
    {name:'葡萄',color:'#8844cc',emoji:'🍇',size:25,score:12},
    {name:'草莓',color:'#ff4466',emoji:'🍓',size:22,score:15},
    {name:'菠萝',color:'#ddaa00',emoji:'🍍',size:35,score:25}
];

// 暂停状态
let paused=false;

// 触摸/鼠标状态
let isDrawing=false;
let lastX=0,lastY=0;
let slashPoints=[];

// 初始化游戏
function initGame(){
    G.state='playing';
    G.score=0;
    G.time=60;
    G.combo=0;
    G.maxCombo=0;
    G.fruits=[];
    G.bombs=[];
    G.slashes=[];
    G.particles=[];
    G.spawnTimer=0;
    G.lastTime=Date.now();

    document.getElementById('startScreen').style.display='none';
    document.getElementById('pauseBtn').style.display='block';
}

// 生成水果/炸弹
function spawnItem(){
    const x=Math.random()*(W-80)+40;
    const speed=-(Math.random()*4+6); // 向上抛
    const vx=(Math.random()-0.5)*3;

    if(Math.random()<0.15){ // 15%概率炸弹
        G.bombs.push({
            x:x,
            y:H+20,
            vx:vx,
            vy:speed,
            size:35,
            emoji:'💣',
            rotation:0,
            rotSpeed:(Math.random()-0.5)*0.1
        });
    }else{
        const type=Math.floor(Math.random()*FRUITS.length);
        const fruit=FRUITS[type];
        G.fruits.push({
            x:x,
            y:H+20,
            vx:vx,
            vy:speed,
            size:fruit.size,
            type:type,
            emoji:fruit.emoji,
            color:fruit.color,
            rotation:0,
            rotSpeed:(Math.random()-0.5)*0.1,
            sliced:false,
            sliceTimer:0
        });
    }
}

// 创建粒子效果
function createParticles(x,y,color,count){
    for(let i=0;i<count;i++){
        G.particles.push({
            x:x,
            y:y,
            vx:(Math.random()-0.5)*8,
            vy:(Math.random()-0.5)*8,
            size:Math.random()*6+2,
            color:color,
            life:30+Math.random()*20
        });
    }
}

// 检测切割
function checkSlash(x,y){
    // 检查水果
    for(let i=G.fruits.length-1;i>=0;i--){
        const f=G.fruits[i];
        if(f.sliced)continue;

        const dx=x-f.x;
        const dy=y-f.y;
        const dist=Math.sqrt(dx*dx+dy*dy);

        if(dist<f.size+15){
            // 切中水果
            f.sliced=true;
            f.sliceTimer=20;

            const fruit=FRUITS[f.type];
            G.combo++;
            if(G.combo>G.maxCombo)G.maxCombo=G.combo;

            // 连击加分
            const comboBonus=Math.min(G.combo,10);
            sfxScore();G.score+=fruit.score*comboBonus;

            createParticles(f.x,f.y,fruit.color,10);

            // 显示得分文字
            G.slashes.push({
                x:f.x,
                y:f.y,
                text:'+'+fruit.score*comboBonus,
                color:'#ffff00',
                life:40,
                vy:-2
            });

            if(G.combo>=3){
                G.slashes.push({
                    x:f.x,
                    y:f.y-25,
                    text:G.combo+'连击！',
                    color:'#ff6b9d',
                    life:40,
                    vy:-2
                });
            }
        }
    }

    // 检查炸弹
    for(let i=G.bombs.length-1;i>=0;i--){
        const b=G.bombs[i];
        const dx=x-b.x;
        const dy=y-b.y;
        const dist=Math.sqrt(dx*dx+dy*dy);

        if(dist<b.size+15){
            // 碰到炸弹
            G.score=Math.max(0,G.score-50);
            G.combo=0;
            createParticles(b.x,b.y,'#ff0000',15);
            G.bombs.splice(i,1);

            G.slashes.push({
                x:b.x,
                y:b.y,
                text:'-50',
                color:'#ff4444',
                life:40,
                vy:-2
            });
        }
    }
}

// 更新游戏
function update(){
    if(G.state!=='playing'||paused)return;

    const now=Date.now();
    const dt=(now-G.lastTime)/1000;
    G.lastTime=now;

    // 更新时间
    G.time-=dt;
    if(G.time<=0){
        G.time=0;
        sfxLose();setHighScore(G.score);G.state='over';
        return;
    }

    // 生成物品
    G.spawnTimer++;
    if(G.spawnTimer>=G.spawnInterval){
        G.spawnTimer=0;
        spawnItem();
        // 随着时间加快生成
        G.spawnInterval=Math.max(30,60-G.time*0.5);
    }

    // 更新水果
    for(let i=G.fruits.length-1;i>=0;i--){
        const f=G.fruits[i];
        f.x+=f.vx;
        f.vy+=0.15; // 重力
        f.y+=f.vy;
        f.rotation+=f.rotSpeed;

        if(f.sliced){
            f.sliceTimer--;
            if(f.sliceTimer<=0){
                G.fruits.splice(i,1);
            }
        }else if(f.y>H+50){
            G.fruits.splice(i,1);
            // 漏掉水果断连击
            G.combo=0;
        }
    }

    // 更新炸弹
    for(let i=G.bombs.length-1;i>=0;i--){
        const b=G.bombs[i];
        b.x+=b.vx;
        b.vy+=0.15;
        b.y+=b.vy;
        b.rotation+=b.rotSpeed;

        if(b.y>H+50){
            G.bombs.splice(i,1);
        }
    }

    // 更新粒子
    for(let i=G.particles.length-1;i>=0;i--){
        const p=G.particles[i];
        p.x+=p.vx;
        p.y+=p.vy;
        p.vy+=0.1;
        p.life--;
        if(p.life<=0){
            G.particles.splice(i,1);
        }
    }

    // 更新文字
    for(let i=G.slashes.length-1;i>=0;i--){
        const s=G.slashes[i];
        s.y+=s.vy;
        s.life--;
        if(s.life<=0){
            G.slashes.splice(i,1);
        }
    }
}

// 绘制游戏
function render(){
    ctx.fillStyle='#1a0a2e';
    ctx.fillRect(0,0,W,H);

    // 绘制背景网格
    ctx.strokeStyle='rgba(100,50,150,0.1)';
    ctx.lineWidth=1;
    for(let x=0;x<W;x+=40){
        ctx.beginPath();
        ctx.moveTo(x,0);
        ctx.lineTo(x,H);
        ctx.stroke();
    }
    for(let y=0;y<H;y+=40){
        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(W,y);
        ctx.stroke();
    }

    // 绘制水果
    for(const f of G.fruits){
        ctx.save();
        ctx.translate(f.x,f.y);
        ctx.rotate(f.rotation);

        if(f.sliced){
            // 切割效果：分成两半
            ctx.globalAlpha=f.sliceTimer/20;
            // 左半
            ctx.beginPath();
            ctx.arc(-f.size*0.3,0,f.size,0,Math.PI,true);
            ctx.fillStyle=f.color;
            ctx.fill();
            // 右半
            ctx.beginPath();
            ctx.arc(f.size*0.3,0,f.size,Math.PI,Math.PI*2,true);
            ctx.fillStyle=f.color;
            ctx.fill();
        }else{
            // 绘制完整水果
            ctx.beginPath();
            ctx.arc(0,0,f.size,0,Math.PI*2);
            ctx.fillStyle=f.color;
            ctx.fill();
            ctx.strokeStyle='rgba(255,255,255,0.3)';
            ctx.lineWidth=2;
            ctx.stroke();
        }

        ctx.restore();

        // 绘制emoji
        if(!f.sliced){
            ctx.font=f.size*1.2+'px serif';
            ctx.textAlign='center';
            ctx.textBaseline='middle';
            ctx.fillText(f.emoji,f.x,f.y);
        }
    }

    // 绘制炸弹
    for(const b of G.bombs){
        ctx.save();
        ctx.translate(b.x,b.y);
        ctx.rotate(b.rotation);

        // 炸弹外壳
        ctx.beginPath();
        ctx.arc(0,0,b.size,0,Math.PI*2);
        ctx.fillStyle='#333';
        ctx.fill();
        ctx.strokeStyle='#666';
        ctx.lineWidth=2;
        ctx.stroke();

        // 引线
        ctx.beginPath();
        ctx.moveTo(0,-b.size);
        ctx.quadraticCurveTo(10,-b.size-15,5,-b.size-25);
        ctx.strokeStyle='#888';
        ctx.lineWidth=2;
        ctx.stroke();

        // 火花
        if(Math.random()>0.5){
            ctx.fillStyle='#ff8800';
            ctx.beginPath();
            ctx.arc(5,-b.size-25,4,0,Math.PI*2);
            ctx.fill();
        }

        ctx.restore();

        // 绘制炸弹emoji
        ctx.font=b.size*1.2+'px serif';
        ctx.textAlign='center';
        ctx.textBaseline='middle';
        ctx.fillText(b.emoji,b.x,b.y);
    }

    // 绘制粒子
    for(const p of G.particles){
        ctx.globalAlpha=p.life/50;
        ctx.fillStyle=p.color;
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
        ctx.fill();
    }
    ctx.globalAlpha=1;

    // 绘制得分文字
    for(const s of G.slashes){
        ctx.globalAlpha=s.life/40;
        ctx.font='bold 20px Microsoft YaHei';
        ctx.fillStyle=s.color;
        ctx.textAlign='center';
        ctx.fillText(s.text,s.x,s.y);
    }
    ctx.globalAlpha=1;

    // 绘制切割轨迹
    if(slashPoints.length>1){
        ctx.strokeStyle='rgba(255,255,255,0.6)';
        ctx.lineWidth=3;
        ctx.lineCap='round';
        ctx.beginPath();
        ctx.moveTo(slashPoints[0].x,slashPoints[0].y);
        for(let i=1;i<slashPoints.length;i++){
            ctx.lineTo(slashPoints[i].x,slashPoints[i].y);
        }
        ctx.stroke();
    }

    // 绘制HUD
    ctx.fillStyle='#fff';
    ctx.font='bold 18px Microsoft YaHei';
    ctx.textAlign='left';
    ctx.fillText('得分: '+G.score,10,30);

    ctx.textAlign='center';
    ctx.fillText(Math.ceil(G.time)+'秒',W/2,30);

    if(G.combo>=2){
        ctx.textAlign='right';
        ctx.fillStyle='#ff6b9d';
        ctx.fillText(G.combo+'连击!',W-10,30);
    }

    // 游戏结束
    if(G.state==='over'){
        ctx.fillStyle='rgba(0,0,0,0.7)';
        ctx.fillRect(0,0,W,H);

        ctx.fillStyle='#ff6b9d';
        ctx.font='bold 36px Microsoft YaHei';
        ctx.textAlign='center';
        ctx.fillText('游戏结束!',W/2,H/2-60);

        ctx.fillStyle='#fff';
        ctx.font='24px Microsoft YaHei';
        ctx.fillText('最终得分: '+G.score,W/2,H/2);
        ctx.fillText('最大连击: '+G.maxCombo,W/2,H/2+40);

        ctx.fillStyle='#ff8e53';
        ctx.font='18px Microsoft YaHei';
        ctx.fillText('点击重新开始',W/2,H/2+100);
    }
}

// 主循环
function gameLoop(){
    update();
    render();
    requestAnimationFrame(gameLoop);
}

// 获取坐标
function getPos(e){
    const rect=cv.getBoundingClientRect();
    let clientX,clientY;
    if(e.touches){
        clientX=e.touches[0].clientX;
        clientY=e.touches[0].clientY;
    }else{
        clientX=e.clientX;
        clientY=e.clientY;
    }
    return{
        x:(clientX-rect.left)*(W/rect.width),
        y:(clientY-rect.top)*(H/rect.height)
    };
}

// 开始绘制
function startSlash(x,y){
    if(G.state!=='playing')return;
    isDrawing=true;
    lastX=x;
    lastY=y;
    slashPoints=[{x,y}];
}

// 绘制中
function moveSlash(x,y){
    if(!isDrawing)return;

    // 检测切割
    checkSlash(x,y);

    slashPoints.push({x,y});
    if(slashPoints.length>10){
        slashPoints.shift();
    }

    lastX=x;
    lastY=y;
}

// 结束绘制
function endSlash(){
    isDrawing=false;
    slashPoints=[];
}

// 事件绑定
cv.addEventListener('mousedown',(e)=>{
    const pos=getPos(e);
    if(G.state==='over'){
        initGame();
        return;
    }

// ===== 音效系统 =====
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }
function playTone(freq, dur, type='sine', vol=0.3) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}
function sfxClick() { initAudio(); playTone(800, 0.05, 'sine', 0.2); }
function sfxScore() { initAudio(); playTone(523, 0.1); playTone(659, 0.1); }
function sfxWin()   { initAudio(); playTone(523, 0.15); setTimeout(()=>playTone(659, 0.15), 100); setTimeout(()=>playTone(784, 0.2), 200); }
function sfxLose()  { initAudio(); playTone(300, 0.2, 'sawtooth', 0.2); setTimeout(()=>playTone(200, 0.3, 'sawtooth', 0.2), 150); }
