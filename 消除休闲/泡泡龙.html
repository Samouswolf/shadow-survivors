<script>
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
const W=400,H=600;
cv.width=W;cv.height=H;

function resizeCanvas(){
    const maxW=window.innerWidth-20;
    if(W>maxW){
        cv.style.width=maxW+'px';
        cv.style.height=(H*maxW/W)+'px';
    }else{
        cv.style.width='';
        cv.style.height='';
    }
}
window.addEventListener('resize',resizeCanvas);
resizeCanvas();

// 泡泡颜色
const COLORS=['#ff4444','#4488ff','#44cc44','#ffaa00','#cc44cc'];
const BUBBLE_R=18;

// 游戏状态
let G={
    state:'menu',
    score:0,
    grid:[], // 网格泡泡
    shooter:{x:W/2,y:H-50,color:0,nextColor:1},
    moving:null, // 发射中的泡泡
    aimAngle:-Math.PI/2,
    particles:[],
    shakeTimer:0,
    dropRows:0 // 已下降行数
};

let paused=false;

// 初始化网格
function initGrid(){
    G.grid=[];
    const cols=Math.floor(W/(BUBBLE_R*2));

    // 初始5行
    for(let row=0;row<5;row++){
        G.grid[row]=[];
        const offset=(row%2===1)?BUBBLE_R:0;
        for(let col=0;col<cols;col++){
            if(Math.random()<0.8){
                G.grid[row][col]={
                    color:Math.floor(Math.random()*COLORS.length),
                    x:col*BUBBLE_R*2+BUBBLE_R+offset,
                    y:row*BUBBLE_R*1.7+BUBBLE_R+30,
                    alive:true
                };
            }else{
                G.grid[row][col]=null;
            }
        }
    }
}

// 初始化游戏
function initGame(){
    G.state='playing';
    G.score=0;
    G.moving=null;
    G.particles=[];
    G.shakeTimer=0;
    G.dropRows=0;

    initGrid();

    G.shooter.x=W/2;
    G.shooter.y=H-50;
    G.shooter.color=Math.floor(Math.random()*COLORS.length);
    G.shooter.nextColor=Math.floor(Math.random()*COLORS.length);

    document.getElementById('startScreen').style.display='none';
    document.getElementById('pauseBtn').style.display='block';
}

// 获取网格位置
function getGridPos(row,col){
    const offset=(row%2===1)?BUBBLE_R:0;
    return{
        x:col*BUBBLE_R*2+BUBBLE_R+offset,
        y:row*BUBBLE_R*1.7+BUBBLE_R+30
    };
}

// 查找最近网格位置
function findNearestGridPos(x,y){
    const row=Math.round((y-BUBBLE_R-30)/(BUBBLE_R*1.7));
    const offset=(row%2===1)?BUBBLE_R:0;
    const col=Math.round((x-BUBBLE_R-offset)/(BUBBLE_R*2));
    return{row:Math.max(0,row),col:Math.max(0,Math.min(col,Math.floor(W/(BUBBLE_R*2))-1))};
}

// 检查碰撞
function checkCollision(x,y){
    // 边界
    if(x<BUBBLE_R||x>W-BUBBLE_R)return true;

    // 网格泡泡
    for(let row=0;row<G.grid.length;row++){
        if(!G.grid[row])continue;
        for(let col=0;col<G.grid[row].length;col++){
            const b=G.grid[row][col];
            if(!b||!b.alive)continue;

            const dx=x-b.x;
            const dy=y-b.y;
            const dist=Math.sqrt(dx*dx+dy*dy);

            if(dist<BUBBLE_R*1.8)return true;
        }
    }

    return false;
}

// 查找相连的同色泡泡
function findConnected(row,col,color){
    const visited=new Set();
    const connected=[];

    function dfs(r,c){
        const key=r+','+c;
        if(visited.has(key))return;
        visited.add(key);

        if(r<0||r>=G.grid.length)return;
        if(!G.grid[r]||!G.grid[r][c])return;
        if(!G.grid[r][c].alive)return;
        if(G.grid[r][c].color!==color)return;

        connected.push({row:r,col:c});

        // 相邻位置
        const isOdd=(r%2===1);
        const neighbors=[
            [r-1,isOdd?c:c-1],[r-1,isOdd?c+1:c],
            [r,c-1],[r,c+1],
            [r+1,isOdd?c:c-1],[r+1,isOdd?c+1:c]
        ];

        for(const[nr,nc] of neighbors){
            dfs(nr,nc);
        }
    }

    dfs(row,col);
    return connected;
}

// 查找悬空泡泡
function findFloating(){
    const visited=new Set();
    const connected=new Set();

    // 从顶部开始BFS
    function bfs(r,c){
        const key=r+','+c;
        if(visited.has(key))return;
        visited.add(key);

        if(r<0||r>=G.grid.length)return;
        if(!G.grid[r]||!G.grid[r][c])return;
        if(!G.grid[r][c].alive)return;

        connected.add(key);

        const isOdd=(r%2===1);
        const neighbors=[
            [r-1,isOdd?c:c-1],[r-1,isOdd?c+1:c],
            [r,c-1],[r,c+1],
            [r+1,isOdd?c:c-1],[r+1,isOdd?c+1:c]
        ];

        for(const[nr,nc] of neighbors){
            bfs(nr,nc);
        }
    }

    // 从第一行开始
    if(G.grid[0]){
        for(let col=0;col<G.grid[0].length;col++){
            if(G.grid[0][col]&&G.grid[0][col].alive){
                bfs(0,col);
            }
        }
    }

    // 找出悬空的
    const floating=[];
    for(let row=0;row<G.grid.length;row++){
        if(!G.grid[row])continue;
        for(let col=0;col<G.grid[row].length;col++){
            const b=G.grid[row][col];
            if(b&&b.alive&&!connected.has(row+','+col)){
                floating.push({row,col});
            }
        }
    }

    return floating;
}

// 创建粒子
function createParticles(x,y,color,count){
    for(let i=0;i<count;i++){
        G.particles.push({
            x:x,
            y:y,
            vx:(Math.random()-0.5)*6,
            vy:(Math.random()-0.5)*6,
            size:Math.random()*8+3,
            color:color,
            life:20+Math.random()*20
        });
    }
}

// 发射泡泡
function shootBubble(){
    if(G.moving)return;

    const speed=12;
    G.moving={
        x:G.shooter.x,
        y:G.shooter.y,
        vx:Math.cos(G.aimAngle)*speed,
        vy:Math.sin(G.aimAngle)*speed,
        color:G.shooter.color
    };

    G.shooter.color=G.shooter.nextColor;
    G.shooter.nextColor=Math.floor(Math.random()*COLORS.length);
}

// 更新游戏
function update(){
    if(G.state!=='playing'||paused)return;

    // 更新发射中的泡泡
    if(G.moving){
        const b=G.moving;
        b.x+=b.vx;
        b.y+=b.vy;

        // 左右反弹
        if(b.x<BUBBLE_R){
            b.x=BUBBLE_R;
            b.vx=-b.vx;
        }
        if(b.x>W-BUBBLE_R){
            b.x=W-BUBBLE_R;
            b.vx=-b.vx;
        }

        // 顶部
        if(b.y<BUBBLE_R+30){
            b.y=BUBBLE_R+30;
            snapBubble(b);
            return;
        }

        // 碰撞检测
        if(checkCollision(b.x,b.y)){
            snapBubble(b);
        }
    }

    // 更新粒子
    for(let i=G.particles.length-1;i>=0;i--){
        const p=G.particles[i];
        p.x+=p.vx;
        p.y+=p.vy;
        p.vy+=0.1;
        p.life--;
        if(p.life<=0){
            G.particles.splice(i,1);
        }
    }

    // 震动
    if(G.shakeTimer>0)G.shakeTimer--;
}

// 固定泡泡到网格
function snapBubble(b){
    const pos=findNearestGridPos(b.x,b.y);

    // 确保行存在
    while(G.grid.length<=pos.row){
        G.grid.push([]);
    }

    // 确保列存在
    const cols=Math.floor(W/(BUBBLE_R*2));
    while(G.grid[pos.row].length<cols){
        G.grid[pos.row].push(null);
    }

    // 放置泡泡
    const gridPos=getGridPos(pos.row,pos.col);
    G.grid[pos.row][pos.col]={
        color:b.color,
        x:gridPos.x,
        y:gridPos.y,
        alive:true
    };

    G.moving=null;

    // 检查消除
    const connected=findConnected(pos.row,pos.col,b.color);

    if(connected.length>=3){
        // 消除
        for(const c of connected){
            const bubble=G.grid[c.row][c.col];
            if(bubble){
                createParticles(bubble.x,bubble.y,COLORS[bubble.color],8);
                G.grid[c.row][c.col]=null;
            }
        }

        sfxScore();G.score+=connected.length*10;

        // 检查悬空
        const floating=findFloating();
        if(floating.length>0){
            G.score+=floating.length*20;
            for(const f of floating){
                const bubble=G.grid[f.row][f.col];
                if(bubble){
                    createParticles(bubble.x,bubble.y,COLORS[bubble.color],5);
                    G.grid[f.row][f.col]=null;
                }
            }
            G.shakeTimer=10;
        }
    }

    // 检查游戏结束
    checkGameOver();
}

// 检查游戏结束
function checkGameOver(){
    // 检查是否有泡泡到达底部
    for(let row=0;row<G.grid.length;row++){
        if(!G.grid[row])continue;
        for(let col=0;col<G.grid[row].length;col++){
            const b=G.grid[row][col];
            if(b&&b.alive&&b.y>H-100){
                G.state='over';
                return;
            }
        }
    }

    // 检查是否全部消除
    let hasBubble=false;
    for(let row=0;row<G.grid.length;row++){
        if(!G.grid[row])continue;
        for(let col=0;col<G.grid[row].length;col++){
            if(G.grid[row][col]&&G.grid[row][col].alive){
                hasBubble=true;
                break;
            }
        }
        if(hasBubble)break;
    }

    if(!hasBubble){
        // 全部消除，添加新行
        G.dropRows+=2;
        initGrid();
    }
}

// 绘制游戏
function render(){
    ctx.fillStyle='#0a1628';
    ctx.fillRect(0,0,W,H);

    // 绘制网格背景
    ctx.strokeStyle='rgba(50,100,150,0.1)';
    ctx.lineWidth=1;
    for(let x=0;x<W;x+=BUBBLE_R*2){
        ctx.beginPath();
        ctx.moveTo(x,0);
        ctx.lineTo(x,H);
        ctx.stroke();
    }

    // 震动偏移
    let shakeX=0,shakeY=0;
    if(G.shakeTimer>0){
        shakeX=(Math.random()-0.5)*4;
        shakeY=(Math.random()-0.5)*4;
    }

    ctx.save();
    ctx.translate(shakeX,shakeY);

    // 绘制网格泡泡
    for(let row=0;row<G.grid.length;row++){
        if(!G.grid[row])continue;
        for(let col=0;col<G.grid[row].length;col++){
            const b=G.grid[row][col];
            if(!b||!b.alive)continue;

            // 泡泡主体
            ctx.beginPath();
            ctx.arc(b.x,b.y,BUBBLE_R,0,Math.PI*2);
            ctx.fillStyle=COLORS[b.color];
            ctx.fill();

            // 高光
            ctx.beginPath();
            ctx.arc(b.x-5,b.y-5,BUBBLE_R*0.4,0,Math.PI*2);
            ctx.fillStyle='rgba(255,255,255,0.3)';
            ctx.fill();

            // 边框
            ctx.beginPath();
            ctx.arc(b.x,b.y,BUBBLE_R,0,Math.PI*2);
            ctx.strokeStyle='rgba(255,255,255,0.2)';
            ctx.lineWidth=1;
            ctx.stroke();
        }
    }

    // 绘制发射中的泡泡
    if(G.moving){
        const b=G.moving;
        ctx.beginPath();
        ctx.arc(b.x,b.y,BUBBLE_R,0,Math.PI*2);
        ctx.fillStyle=COLORS[b.color];
        ctx.fill();

        ctx.beginPath();
        ctx.arc(b.x-5,b.y-5,BUBBLE_R*0.4,0,Math.PI*2);
        ctx.fillStyle='rgba(255,255,255,0.3)';
        ctx.fill();
    }

    // 绘制粒子
    for(const p of G.particles){
        ctx.globalAlpha=p.life/40;
        ctx.fillStyle=p.color;
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
        ctx.fill();
    }
    ctx.globalAlpha=1;

    ctx.restore();

    // 绘制发射器
    ctx.save();
    ctx.translate(G.shooter.x,G.shooter.y);

    // 发射器底座
    ctx.beginPath();
    ctx.arc(0,0,30,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,0.1)';
    ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.3)';
    ctx.lineWidth=2;
    ctx.stroke();

    // 当前泡泡
    ctx.beginPath();
    ctx.arc(0,0,BUBBLE_R,0,Math.PI*2);
    ctx.fillStyle=COLORS[G.shooter.color];
    ctx.fill();

    // 瞄准线
    ctx.strokeStyle='rgba(255,255,255,0.3)';
    ctx.lineWidth=2;
    ctx.setLineDash([5,5]);
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.lineTo(Math.cos(G.aimAngle)*100,Math.sin(G.aimAngle)*100);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.restore();

    // 下一个泡泡
    ctx.fillStyle='#888';
    ctx.font='12px Microsoft YaHei';
    ctx.textAlign='center';
    ctx.fillText('下一个',G.shooter.x+60,G.shooter.y-20);

    ctx.beginPath();
    ctx.arc(G.shooter.x+60,G.shooter.y,BUBBLE_R*0.8,0,Math.PI*2);
    ctx.fillStyle=COLORS[G.shooter.nextColor];
    ctx.fill();

    // HUD
    ctx.fillStyle='#fff';
    ctx.font='bold 20px Microsoft YaHei';
    ctx.textAlign='left';
    ctx.fillText('得分: '+G.score,10,25);

    // 游戏结束
    if(G.state==='over'){
        ctx.fillStyle='rgba(0,0,0,0.7)';
        ctx.fillRect(0,0,W,H);

        ctx.fillStyle='#4ecdc4';
        ctx.font='bold 36px Microsoft YaHei';
        ctx.textAlign='center';
        ctx.fillText('游戏结束!',W/2,H/2-40);

        ctx.fillStyle='#fff';
        ctx.font='24px Microsoft YaHei';
        ctx.fillText('setHighScore(G.score);最终得分: '+G.score+(getHighScore()>0?'  最高:'+getHighScore():''),W/2,H/2+10);

        ctx.fillStyle='#88ccff';
        ctx.font='18px Microsoft YaHei';
        ctx.fillText('点击重新开始',W/2,H/2+60);
    }
}

// 主循环
function gameLoop(){
    update();
    render();
    requestAnimationFrame(gameLoop);
}

// 获取坐标
function getPos(e){
    const rect=cv.getBoundingClientRect();
    let clientX,clientY;
    if(e.touches){
        clientX=e.touches[0].clientX;
        clientY=e.touches[0].clientY;
    }else{
        clientX=e.clientX;
        clientY=e.clientY;
    }
    return{
        x:(clientX-rect.left)*(W/rect.width),
        y:(clientY-rect.top)*(H/rect.height)
    };
}

// 更新瞄准
function updateAim(x,y){
    const dx=x-G.shooter.x;
    const dy=y-G.shooter.y;
    let angle=Math.atan2(dy,dx);

    // 限制角度
    if(angle>-0.1)angle=-0.1;
    if(angle<-Math.PI+0.1)angle=-Math.PI+0.1;

    G.aimAngle=angle;
}

// 事件绑定
cv.addEventListener('mousedown',(e)=>{
    const pos=getPos(e);
    if(G.state==='over'){
        initGame();
        return;
    }
    if(G.state==='playing'){
        updateAim(pos.x,pos.y);
        shootBubble();
    }
});
cv.addEventListener('mousemove',(e)=>{
    const pos=getPos(e);
    if(G.state==='playing'){
        updateAim(pos.x,pos.y);
    }
});

cv.addEventListener('touchstart',(e)=>{
    e.preventDefault();
    const pos=getPos(e);
    if(G.state==='over'){
        initGame();
        return;
    }
    if(G.state==='playing'){
        updateAim(pos.x,pos.y);
        shootBubble();
    }
},{passive:false});
cv.addEventListener('touchmove',(e)=>{
    e.preventDefault();
    const pos=getPos(e);
    if(G.state==='playing'){
        updateAim(pos.x,pos.y);
    }
},{passive:false});

// ===== 音效系统 =====
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }
function playTone(freq, dur, type='sine', vol=0.3) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}
function sfxClick() { initAudio(); playTone(800, 0.05, 'sine', 0.2); }
function sfxScore() { initAudio(); playTone(523, 0.1); playTone(659, 0.1); }
function sfxWin()   { initAudio(); playTone(523, 0.15); setTimeout(()=>playTone(659, 0.15), 100); setTimeout(()=>playTone(784, 0.2), 200); }
function sfxLose()  { initAudio(); playTone(300, 0.2, 'sawtooth', 0.2); setTimeout(()=>playTone(200, 0.3, 'sawtooth', 0.2), 150); }


// ===== 最高分系统 =====
const HIGH_SCORE_KEY = 'bubble_shooter';
function getHighScore() { return parseInt(localStorage.getItem(HIGH_SCORE_KEY) || '0'); }
function setHighScore(score) {
  const high = getHighScore();
  if (score > high) { localStorage.setItem(HIGH_SCORE_KEY, score); return true; }
  return false;
}
