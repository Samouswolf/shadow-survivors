<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>农场物语</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
canvas { image-rendering: pixelated; border: 2px solid #4a7c59; cursor: pointer; max-width: 100%; height: auto; }
</style>
<style>/* 游戏工坊广告系统 */
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);height:90px;max-height:90px;overflow:hidden;contain:layout style paint;pointer-events:none!important}.ad-banner-container,.ad-banner-container *{pointer-events:none!important}.ad-banner-container iframe{max-height:90px;pointer-events:none!important}
.ad-banner-container iframe{max-width:100%}

.sponsor-btn{position:fixed;top:44px;right:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:3px 9px;border-radius:10px;font:11px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}

.sponsor-panel .qr-card .qr-icon{font-size:48px;margin-bottom:6px}

.interstitial-ad .ad-content{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;text-align:center;min-width:280px;max-width:400px}
.interstitial-ad .ad-content p{color:#aaa;font:14px "Microsoft YaHei",sans-serif;margin-bottom:12px}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}

</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="startScreen" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#0a1a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000">
  <h1 style="font-size:48px;color:#7cfc00;margin-bottom:20px">🌾 农场物语</h1>
  <p style="color:#88cc88;margin-bottom:40px">种植收获 · 经营农场 · 季节轮回</p>
  <button id="startBtn" style="padding:15px 60px;font-size:20px;background:linear-gradient(135deg,#2d5a1e,#4a7c59);color:#fff;border:none;border-radius:12px;cursor:pointer">开始游戏</button>
</div>
<button id="pauseBtn" style="position:fixed;top:10px;right:10px;width:44px;height:44px;font-size:20px;background:rgba(0,0,0,0.5);color:#fff;border:1px solid rgba(255,255,255,0.3);border-radius:8px;z-index:100;display:none">⏸</button>
<div id="pauseScreen" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);flex-direction:column;align-items:center;justify-content:center;z-index:999">
  <h2 style="color:#fff;margin-bottom:30px">游戏暂停</h2>
  <button id="resumeBtn" style="padding:12px 40px;font-size:18px;background:#4a7c59;color:#fff;border:none;border-radius:8px;margin-bottom:15px">继续游戏</button>
  <button id="restartBtn" style="padding:12px 40px;font-size:18px;background:#666;color:#fff;border:none;border-radius:8px">重新开始</button>
</div>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = 800, H = 600;
canvas.width = W;
canvas.height = H;

function resizeCanvas() {
    const maxW = window.innerWidth - 20;
    if (W > maxW) {
        canvas.style.width = maxW + 'px';
        canvas.style.height = (H * maxW / W) + 'px';
    } else {
        canvas.style.width = '';
        canvas.style.height = '';
    }
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

let paused = false;
let gameStarted = false;
let gameOver = false;

// roundRect polyfill
if (!ctx.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        if (typeof r === 'number') r = [r, r, r, r];
        this.moveTo(x + r[0], y);
        this.lineTo(x + w - r[1], y);
        this.arcTo(x + w, y, x + w, y + r[1], r[1]);
        this.lineTo(x + w, y + h - r[2]);
        this.arcTo(x + w, y + h, x + w - r[2], y + h, r[2]);
        this.lineTo(x + r[3], y + h);
        this.arcTo(x, y + h, x, y + h - r[3], r[3]);
        this.lineTo(x, y + r[0]);
        this.arcTo(x, y, x + r[0], y, r[0]);
        this.closePath();
    };
}

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playTone(freq, duration, type = 'sine', vol = 0.3) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}
function sfxPlant() { playTone(400, 0.15); setTimeout(() => playTone(500, 0.1), 100); }
function sfxWater() { playTone(800, 0.2, 'sine', 0.2); setTimeout(() => playTone(600, 0.15, 'sine', 0.2), 100); }
function sfxHarvest() { playTone(600, 0.1); setTimeout(() => playTone(800, 0.1), 80); setTimeout(() => playTone(1000, 0.15), 160); }
function sfxSell() { playTone(1200, 0.1, 'square', 0.15); setTimeout(() => playTone(1600, 0.15, 'square', 0.15), 80); }
function sfxUpgrade() { playTone(400, 0.1); setTimeout(() => playTone(600, 0.1), 100); setTimeout(() => playTone(800, 0.1), 200); setTimeout(() => playTone(1000, 0.2), 300); }
function sfxSeason() { playTone(300, 0.3, 'triangle', 0.2); setTimeout(() => playTone(500, 0.3, 'triangle', 0.2), 200); }

// Save/Load
const SAVE_KEY = 'farm_story_save';
function saveGame() {
    const data = {
        coins: G.coins,
        day: G.day,
        season: G.season,
        plots: G.plots,
        tools: G.tools,
        inventory: G.inventory,
        totalEarned: G.totalEarned,
        highScore: G.highScore
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
}
function loadGame() {
    try {
        const data = JSON.parse(localStorage.getItem(SAVE_KEY));
        if (data) {
            G.coins = data.coins || 50;
            G.day = data.day || 1;
            G.season = data.season || 0;
            G.plots = data.plots || [];
            G.tools = data.tools || { watering: 1, hoe: 1 };
            G.inventory = data.inventory || {};
            G.totalEarned = data.totalEarned || 0;
            G.highScore = data.highScore || 0;
            return true;
        }
    } catch (e) {}
    return false;
}

// Game constants
const SEASONS = ['春', '夏', '秋', '冬'];
const SEASON_COLORS = ['#90ee90', '#228b22', '#daa520', '#b0c4de'];
const SEASON_DAYS = 28;

const CROPS = [
    { name: '萝卜', emoji: '🥕', growTime: 4, value: 15, cost: 5, season: 0, color: '#ff6b35' },
    { name: '白菜', emoji: '🥬', growTime: 5, value: 20, cost: 8, season: 0, color: '#90ee90' },
    { name: '番茄', emoji: '🍅', growTime: 6, value: 30, cost: 12, season: 1, color: '#ff4444' },
    { name: '西瓜', emoji: '🍉', growTime: 8, value: 50, cost: 20, season: 1, color: '#2e8b57' },
    { name: '南瓜', emoji: '🎃', growTime: 7, value: 40, cost: 15, season: 2, color: '#ff8c00' },
    { name: '玉米', emoji: '🌽', growTime: 6, value: 35, cost: 10, season: 2, color: '#ffd700' },
    { name: '草莓', emoji: '🍓', growTime: 5, value: 45, cost: 18, season: 0, color: '#ff1493' },
    { name: '葡萄', emoji: '🍇', growTime: 9, value: 60, cost: 25, season: 2, color: '#8b008b' }
];

const TOOL_UPGRADES = {
    watering: { name: '水壶', costs: [0, 100, 300, 800], speeds: [1, 1.5, 2, 3] },
    hoe: { name: '锄头', costs: [0, 80, 250, 600], speeds: [1, 1.3, 1.6, 2] }
};

const GRID_COLS = 6;
const GRID_ROWS = 4;
const PLOT_SIZE = 80;
const GRID_X = 120;
const GRID_Y = 100;

// Game state
let G = {};

function initGame() {
    G = {
        coins: 50,
        day: 1,
        season: 0,
        seasonDay: 1,
        plots: [],
        tools: { watering: 1, hoe: 1 },
        inventory: {},
        totalEarned: 0,
        highScore: 0,
        selectedCrop: 0,
        selectedTool: 'hoe',
        timeAccum: 0,
        dayDuration: 10,
        particles: [],
        notifications: [],
        screenShake: 0
    };
    for (let r = 0; r < GRID_ROWS; r++) {
        for (let c = 0; c < GRID_COLS; c++) {
            G.plots.push({
                x: GRID_X + c * PLOT_SIZE,
                y: GRID_Y + r * PLOT_SIZE,
                state: 'empty',
                crop: null,
                growth: 0,
                watered: false,
                waterLevel: 0
            });
        }
    }
    // Load saved high score
    try {
        const saved = JSON.parse(localStorage.getItem(SAVE_KEY));
        if (saved && saved.highScore) G.highScore = saved.highScore;
    } catch (e) {}
}

// Particle system
function addParticle(x, y, color, count = 5) {
    for (let i = 0; i < count; i++) {
        G.particles.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 4,
            vy: -Math.random() * 3 - 1,
            life: 30 + Math.random() * 20,
            color: color,
            size: 2 + Math.random() * 3
        });
    }
}

function addNotification(text, x, y) {
    G.notifications.push({
        text: text,
        x: x,
        y: y,
        life: 60,
        vy: -1
    });
}

// Input handling
let mouseX = 0, mouseY = 0;
let mouseDown = false;
let touchActive = false;

function getCanvasPos(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return {
        x: (clientX - rect.left) * (W / rect.width),
        y: (clientY - rect.top) * (H / rect.height)
    };
}

canvas.addEventListener('mousemove', (e) => {
    const pos = getCanvasPos(e.clientX, e.clientY);
    mouseX = pos.x;
    mouseY = pos.y;
});

canvas.addEventListener('mousedown', (e) => {
    mouseDown = true;
    handleClick(mouseX, mouseY);
});

canvas.addEventListener('mouseup', () => { mouseDown = false; });

canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    touchActive = true;
    const pos = getCanvasPos(e.touches[0].clientX, e.touches[0].clientY);
    mouseX = pos.x;
    mouseY = pos.y;
    handleClick(mouseX, mouseY);
});

canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const pos = getCanvasPos(e.touches[0].clientX, e.touches[0].clientY);
    mouseX = pos.x;
    mouseY = pos.y;
});

canvas.addEventListener('touchend', () => { touchActive = false; });

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
        togglePause();
    }
    if (e.key === '1') G.selectedTool = 'hoe';
    if (e.key === '2') G.selectedTool = 'watering';
    if (e.key === '3') G.selectedTool = 'harvest';
    if (e.key >= 'q' && e.key <= 't') {
        const idx = e.key.charCodeAt(0) - 'q'.charCodeAt(0);
        if (idx < CROPS.length) G.selectedCrop = idx;
    }
});

function handleClick(x, y) {
    if (!gameStarted || paused || gameOver) return;
    initAudio();

    // Check toolbar clicks
    if (y >= 500 && y < 540) {
        if (x >= 20 && x < 120) { G.selectedTool = 'hoe'; return; }
        if (x >= 130 && x < 230) { G.selectedTool = 'watering'; return; }
        if (x >= 240 && x < 340) { G.selectedTool = 'harvest'; return; }
    }

    // Check crop selection
    if (y >= 540 && y < 600) {
        const cropIdx = Math.floor((x - 20) / 90);
        if (cropIdx >= 0 && cropIdx < CROPS.length) {
            G.selectedCrop = cropIdx;
            return;
        }
    }

    // Check shop/upgrade buttons
    if (x >= 650 && x < 780) {
        if (y >= 100 && y < 140) {
            // Upgrade watering can
            const nextLv = G.tools.watering + 1;
            if (nextLv <= 4 && G.coins >= TOOL_UPGRADES.watering.costs[nextLv - 1]) {
                G.coins -= TOOL_UPGRADES.watering.costs[nextLv - 1];
                G.tools.watering = nextLv;
                sfxUpgrade();
                addNotification('水壶升级!', 650, 100);
            }
            return;
        }
        if (y >= 150 && y < 190) {
            // Upgrade hoe
            const nextLv = G.tools.hoe + 1;
            if (nextLv <= 4 && G.coins >= TOOL_UPGRADES.hoe.costs[nextLv - 1]) {
                G.coins -= TOOL_UPGRADES.hoe.costs[nextLv - 1];
                G.tools.hoe = nextLv;
                sfxUpgrade();
                addNotification('锄头升级!', 650, 150);
            }
            return;
        }
    }

    // Check plot clicks
    for (const plot of G.plots) {
        if (x >= plot.x && x < plot.x + PLOT_SIZE && y >= plot.y && y < plot.y + PLOT_SIZE) {
            handlePlotAction(plot);
            return;
        }
    }
}

function handlePlotAction(plot) {
    if (G.selectedTool === 'hoe' && plot.state === 'empty') {
        const crop = CROPS[G.selectedCrop];
        if (crop.season !== G.season) {
            addNotification('季节不对!', plot.x, plot.y);
            return;
        }
        if (G.coins < crop.cost) {
            addNotification('金币不足!', plot.x, plot.y);
            return;
        }
        G.coins -= crop.cost;
        plot.state = 'planted';
        plot.crop = crop;
        plot.growth = 0;
        plot.watered = false;
        plot.waterLevel = 0;
        sfxPlant();
        addParticle(plot.x + PLOT_SIZE / 2, plot.y + PLOT_SIZE / 2, '#8b4513');
        addNotification('-' + crop.cost + '🪙', plot.x, plot.y);
    } else if (G.selectedTool === 'watering' && plot.state === 'planted') {
        if (!plot.watered) {
            plot.watered = true;
            plot.waterLevel = TOOL_UPGRADES.watering.speeds[G.tools.watering - 1];
            sfxWater();
            addParticle(plot.x + PLOT_SIZE / 2, plot.y + PLOT_SIZE / 2, '#4169e1', 8);
        }
    } else if (G.selectedTool === 'harvest' && plot.state === 'ready') {
        const value = Math.floor(plot.crop.value * (1 + G.tools.hoe * 0.1));
        G.coins += value;
        G.totalEarned += value;
        plot.state = 'empty';
        plot.crop = null;
        plot.growth = 0;
        sfxHarvest();
        addParticle(plot.x + PLOT_SIZE / 2, plot.y + PLOT_SIZE / 2, '#ffd700', 10);
        addNotification('+' + value + '🪙', plot.x, plot.y);
    }
}

function togglePause() {
    if (!gameStarted) return;
    paused = !paused;
    document.getElementById('pauseScreen').style.display = paused ? 'flex' : 'none';
}

// Game loop
function update(dt) {
    if (paused || !gameStarted || gameOver) return;

    G.timeAccum += dt;
    if (G.timeAccum >= G.dayDuration) {
        G.timeAccum -= G.dayDuration;
        advanceDay();
    }

    // Update crops
    for (const plot of G.plots) {
        if (plot.state === 'planted' && plot.crop) {
            if (plot.watered) {
                const growSpeed = TOOL_UPGRADES.watering.speeds[G.tools.watering - 1];
                plot.growth += (1 / plot.crop.growTime) * growSpeed * dt / G.dayDuration;
                plot.waterLevel -= dt / G.dayDuration;
                if (plot.waterLevel <= 0) {
                    plot.watered = false;
                    plot.waterLevel = 0;
                }
            }
            if (plot.growth >= 1) {
                plot.state = 'ready';
                plot.growth = 1;
                addParticle(plot.x + PLOT_SIZE / 2, plot.y + PLOT_SIZE / 2, '#ffd700', 3);
            }
        }
    }

    // Update particles
    G.particles = G.particles.filter(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        return p.life > 0;
    });

    // Update notifications
    G.notifications = G.notifications.filter(n => {
        n.y += n.vy;
        n.life--;
        return n.life > 0;
    });

    // Screen shake decay
    if (G.screenShake > 0) G.screenShake *= 0.9;
}

function advanceDay() {
    G.day++;
    G.seasonDay++;

    // Wither unwatered crops slightly
    for (const plot of G.plots) {
        if (plot.state === 'planted' && !plot.watered) {
            plot.growth = Math.max(0, plot.growth - 0.05);
        }
    }

    if (G.seasonDay > SEASON_DAYS) {
        G.seasonDay = 1;
        G.season = (G.season + 1) % 4;
        sfxSeason();
        addNotification('季节变更: ' + SEASONS[G.season] + '!', W / 2, H / 2);

        // Wither crops from wrong season
        for (const plot of G.plots) {
            if (plot.state === 'planted' && plot.crop && plot.crop.season !== G.season) {
                plot.state = 'empty';
                plot.crop = null;
                plot.growth = 0;
                addParticle(plot.x + PLOT_SIZE / 2, plot.y + PLOT_SIZE / 2, '#8b0000', 8);
            }
        }
    }

    // Auto-save
    saveGame();
}

function render() {
    ctx.save();

    // Screen shake
    if (G.screenShake > 0.5) {
        ctx.translate(
            (Math.random() - 0.5) * G.screenShake,
            (Math.random() - 0.5) * G.screenShake
        );
    }

    // Background
    const bgColor = SEASON_COLORS[G.season] || '#90ee90';
    ctx.fillStyle = bgColor;
    ctx.fillRect(0, 0, W, H);

    // Grid background pattern
    ctx.strokeStyle = 'rgba(0,0,0,0.1)';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
    }
    for (let y = 0; y < H; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
    }

    // Draw plots
    for (const plot of G.plots) {
        drawPlot(plot);
    }

    // Draw toolbar
    drawToolbar();

    // Draw crop selection
    drawCropSelection();

    // Draw shop
    drawShop();

    // Draw HUD
    drawHUD();

    // Draw particles
    for (const p of G.particles) {
        ctx.globalAlpha = p.life / 50;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Draw notifications
    for (const n of G.notifications) {
        ctx.globalAlpha = n.life / 60;
        ctx.fillStyle = '#fff';
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 3;
        ctx.font = 'bold 16px Arial';
        ctx.textAlign = 'center';
        ctx.strokeText(n.text, n.x, n.y);
        ctx.fillText(n.text, n.x, n.y);
    }
    ctx.globalAlpha = 1;

    ctx.restore();

    // Game over overlay
    if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 48px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('游戏结束', W / 2, H / 2 - 50);
        ctx.fillStyle = '#fff';
        ctx.font = '24px Arial';
        ctx.fillText('总收入: ' + G.totalEarned + '🪙', W / 2, H / 2);
        ctx.fillText('最高记录: ' + G.highScore + '🪙', W / 2, H / 2 + 40);
        ctx.font = '18px Arial';
        ctx.fillText('点击重新开始', W / 2, H / 2 + 80);
    }
}

function drawPlot(plot) {
    const x = plot.x, y = plot.y, s = PLOT_SIZE;

    // Plot background
    ctx.fillStyle = plot.state === 'empty' ? '#8b7355' : '#6b5b3a';
    ctx.strokeStyle = '#5a4a2a';
    ctx.lineWidth = 2;
    ctx.fillRect(x + 2, y + 2, s - 4, s - 4);
    ctx.strokeRect(x + 2, y + 2, s - 4, s - 4);

    // Water indicator
    if (plot.watered) {
        ctx.fillStyle = 'rgba(65,105,225,0.3)';
        ctx.fillRect(x + 2, y + 2, s - 4, s - 4);
    }

    if (plot.state === 'planted' && plot.crop) {
        // Draw growth stages
        const stage = Math.floor(plot.growth * 3);
        const centerX = x + s / 2;
        const centerY = y + s / 2;

        if (stage === 0) {
            // Seed
            ctx.fillStyle = '#8b4513';
            ctx.beginPath();
            ctx.arc(centerX, centerY + 10, 4, 0, Math.PI * 2);
            ctx.fill();
        } else if (stage === 1) {
            // Sprout
            ctx.fillStyle = '#228b22';
            ctx.fillRect(centerX - 2, centerY - 5, 4, 15);
            ctx.beginPath();
            ctx.arc(centerX - 6, centerY - 5, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(centerX + 6, centerY - 8, 5, 0, Math.PI * 2);
            ctx.fill();
        } else {
            // Growing
            ctx.fillStyle = '#228b22';
            ctx.fillRect(centerX - 3, centerY - 15, 6, 25);
            ctx.fillStyle = '#32cd32';
            ctx.beginPath();
            ctx.arc(centerX - 10, centerY - 15, 7, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(centerX + 10, centerY - 18, 7, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(centerX, centerY - 22, 7, 0, Math.PI * 2);
            ctx.fill();
        }

        // Growth bar
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(x + 5, y + s - 12, s - 10, 6);
        ctx.fillStyle = '#32cd32';
        ctx.fillRect(x + 5, y + s - 12, (s - 10) * plot.growth, 6);
    } else if (plot.state === 'ready' && plot.crop) {
        // Mature crop with emoji
        ctx.font = '40px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(plot.crop.emoji, x + s / 2, y + s / 2);

        // Sparkle effect
        const sparkle = Math.sin(Date.now() / 200) * 0.3 + 0.7;
        ctx.globalAlpha = sparkle;
        ctx.fillStyle = '#ffd700';
        ctx.font = '16px Arial';
        ctx.fillText('✨', x + s - 15, y + 15);
        ctx.globalAlpha = 1;
    }

    // Hover effect
    if (mouseX >= x && mouseX < x + s && mouseY >= y && mouseY < y + s) {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.strokeRect(x, y, s, s);
    }
}

function drawToolbar() {
    const y = 500;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(10, y, 330, 40);

    const tools = [
        { id: 'hoe', name: '锄头[1]', icon: '🪓' },
        { id: 'watering', name: '水壶[2]', icon: '🪣' },
        { id: 'harvest', name: '收割[3]', icon: '🧺' }
    ];

    tools.forEach((tool, i) => {
        const tx = 20 + i * 110;
        ctx.fillStyle = G.selectedTool === tool.id ? '#4a7c59' : '#333';
        ctx.fillRect(tx, y + 5, 100, 30);
        ctx.strokeStyle = G.selectedTool === tool.id ? '#7cfc00' : '#666';
        ctx.lineWidth = 2;
        ctx.strokeRect(tx, y + 5, 100, 30);
        ctx.fillStyle = '#fff';
        ctx.font = '14px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(tool.icon + ' ' + tool.name, tx + 50, y + 20);
    });
}

function drawCropSelection() {
    const y = 540;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(10, y, 550, 55);

    const seasonCrops = CROPS.filter(c => c.season === G.season);
    seasonCrops.forEach((crop, i) => {
        const cx = 20 + i * 90;
        ctx.fillStyle = G.selectedCrop === CROPS.indexOf(crop) ? '#4a7c59' : '#333';
        ctx.fillRect(cx, y + 5, 80, 45);
        ctx.strokeStyle = G.selectedCrop === CROPS.indexOf(crop) ? '#7cfc00' : '#666';
        ctx.lineWidth = 2;
        ctx.strokeRect(cx, y + 5, 80, 45);
        ctx.fillStyle = '#fff';
        ctx.font = '12px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(crop.emoji + crop.name, cx + 40, y + 18);
        ctx.fillStyle = '#ffd700';
        ctx.fillText(crop.cost + '🪙', cx + 40, y + 38);
    });
}

function drawShop() {
    const x = 650;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(x - 10, 90, 150, 110);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('升级工坊', x + 65, 108);

    // Watering can upgrade
    const wLv = G.tools.watering;
    const wCost = wLv < 4 ? TOOL_UPGRADES.watering.costs[wLv] : 0;
    ctx.fillStyle = G.coins >= wCost && wLv < 4 ? '#4a7c59' : '#555';
    ctx.fillRect(x, 115, 130, 30);
    ctx.fillStyle = '#fff';
    ctx.font = '12px Arial';
    ctx.fillText('🪣 Lv' + wLv + (wLv < 4 ? ' →' + (wLv + 1) + ' ' + wCost + '🪙' : ' MAX'), x + 65, 130);

    // Hoe upgrade
    const hLv = G.tools.hoe;
    const hCost = hLv < 4 ? TOOL_UPGRADES.hoe.costs[hLv] : 0;
    ctx.fillStyle = G.coins >= hCost && hLv < 4 ? '#4a7c59' : '#555';
    ctx.fillRect(x, 150, 130, 30);
    ctx.fillStyle = '#fff';
    ctx.fillText('🪓 Lv' + hLv + (hLv < 4 ? ' →' + (hLv + 1) + ' ' + hCost + '🪙' : ' MAX'), x + 65, 165);
}

function drawHUD() {
    // Top bar
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, 45);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px Arial';
    ctx.textAlign = 'left';
    ctx.fillText('🪙 ' + G.coins, 20, 28);
    ctx.fillText('📅 第' + G.day + '天', 150, 28);
    ctx.fillText('🌿 ' + SEASONS[G.season] + ' (第' + G.seasonDay + '天)', 300, 28);
    ctx.fillText('💰 总收入: ' + G.totalEarned, 500, 28);

    // Season progress bar
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(300, 38, 150, 4);
    ctx.fillStyle = SEASON_COLORS[G.season];
    ctx.fillRect(300, 38, 150 * (G.seasonDay / SEASON_DAYS), 4);

    // Day progress bar
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(150, 38, 100, 4);
    ctx.fillStyle = '#ffd700';
    ctx.fillRect(150, 38, 100 * (G.timeAccum / G.dayDuration), 4);

    // Mini instructions
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = '11px Arial';
    ctx.textAlign = 'right';
    ctx.fillText('[1/2/3]切换工具  [Q-T]选择作物  [P]暂停', W - 20, 28);
}

// Game loop
let lastTime = 0;
function gameLoop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;

    if (!paused && gameStarted) {
        update(dt);
    }
    render();
    requestAnimationFrame(gameLoop);
}

// UI event handlers
document.getElementById('startBtn').addEventListener('click', () => {
    initAudio();
    if (loadGame()) {
        // Loaded saved game
    } else {
        initGame();
    }
    gameStarted = true;
    gameOver = false;
    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('pauseBtn').style.display = 'block';
});

document.getElementById('pauseBtn').addEventListener('click', togglePause);
document.getElementById('resumeBtn').addEventListener('click', togglePause);
document.getElementById('restartBtn').addEventListener('click', () => {
    initGame();
    paused = false;
    gameOver = false;
    document.getElementById('pauseScreen').style.display = 'none';
    saveGame();
});

canvas.addEventListener('click', () => {
    if (gameOver) {
        initGame();
        gameOver = false;
        saveGame();
    }
});

// Start
initGame();
requestAnimationFrame(gameLoop);


// ===== 游戏工坊统一广告系统 =====
const GameMonetize = {
	adsterra: { enabled: !/localhost|127\.0\.0\.1/.test(location.hostname) },
	sponsor: { enabled: true, wechatQR: '', alipayQR: '' },
	interstitial: { enabled: true, cooldownMs: 180000, gameCount: 2 },
	_lastInterTime: 0, _deathCount: 0,
	_gameOverDetected: false,
	init() {
		const banner = document.getElementById('adBanner');
		if (banner && this.adsterra.enabled) {
			const s1 = document.createElement('script');
			s1.src = 'https://pl29544740.effectivecpmnetwork.com/de/26/0e/de260e17b6a348e3489772a87b1cedf1.js';
			s1.async = true;
			banner.appendChild(s1);
		}
		const spBtn = document.getElementById('sponsorBtn');
		const spPanel = document.getElementById('sponsorPanel');
		const spClose = document.getElementById('sponsorClose');
		if (spBtn && spPanel && spClose && this.sponsor.enabled) {
			spBtn.onclick = () => { spPanel.style.display = 'flex'; spPanel.style.pointerEvents = 'auto'; };
			spClose.onclick = () => { spPanel.style.display = 'none'; spPanel.style.pointerEvents = 'none'; };
			spPanel.onclick = (e) => { if (e.target === spPanel) { spPanel.style.display = 'none'; spPanel.style.pointerEvents = 'none'; } };
		} else if (spBtn) { spBtn.style.display = 'none'; }
		const skipBtn = document.getElementById('skipInterstitial');
		const interstitial = document.getElementById('interstitialAd');
		if (skipBtn && interstitial) {
			skipBtn.onclick = () => {
				interstitial.style.display = 'none'; interstitial.style.pointerEvents = 'none';
				if (this._reviveCallback) { const cb = this._reviveCallback; this._reviveCallback = null; cb(); }
			};
		}
		// 自动检测游戏结束状态
		this._startGameOverWatcher();
	},
	_startGameOverWatcher() {
		// 检测#restartBtn或包含"重新开始"/"再来一局"的按钮变为可见
		const checkGameOver = () => {
			if (this._gameOverDetected) return;
			// 方法1: 检测#restartBtn可见
			const restartBtn = document.getElementById('restartBtn');
			if (restartBtn && restartBtn.offsetParent !== null && getComputedStyle(restartBtn).display !== 'none') {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
			// 方法2: 检测#gameOverScreen可见
			const goScreen = document.getElementById('gameOverScreen');
			if (goScreen && getComputedStyle(goScreen).display !== 'none') {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
			// 方法3: 检测screen-gameover可见
			const goScreen2 = document.getElementById('screen-gameover');
			if (goScreen2 && !goScreen2.classList.contains('hidden')) {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
		};
		// 每500ms检查一次
		this._goInterval = setInterval(() => {
			checkGameOver();
			// 如果检测到了，等2秒后重置标志，允许下次检测
			if (this._gameOverDetected) {
				setTimeout(() => { this._gameOverDetected = false; }, 2000);
			}
		}, 500);
	},
	requestRevive(callback) {
		this._reviveCallback = callback || null;
		const el = document.getElementById('interstitialAd');
		if (!el) { if (callback) callback(); return; }
		const s2 = document.createElement('script');
		s2.src = 'https://pl29544742.effectivecpmnetwork.com/be/a9/6d/bea96d779c0ee07c2b15613852dd3e70.js';
		s2.async = true;
		document.getElementById('interstitialAdSlot').innerHTML = '';
		document.getElementById('interstitialAdSlot').appendChild(s2);
		el.style.display = 'flex'; el.style.pointerEvents = 'auto';

		setTimeout(() => { const slot = document.getElementById('interstitialAdSlot'); if (slot && slot.innerHTML.includes('加载中')) { slot.innerHTML = '<div style=color:#aaa;font:13px Microsoft YaHei,sans-serif>广告暂时无法加载<br>点击下方按钮继续</div>'; } }, 3000);
		const skipBtn = document.getElementById('skipInterstitial');
		if (skipBtn) {
			skipBtn.textContent = '5 秒后可跳过'; skipBtn.disabled = true;
			let cd = 5;
			const timer = setInterval(() => {
				cd--;
				if (cd <= 0) { clearInterval(timer); skipBtn.textContent = '跳过广告 ▶'; skipBtn.disabled = false; }
				else { skipBtn.textContent = cd + ' 秒后可跳过'; }
			}, 1000);
		}
	},
	onGameOver() {
		this._deathCount++;
		if (!this.interstitial.enabled) return;
		if (this._deathCount < this.interstitial.gameCount) return;
		if (Date.now() - this._lastInterTime < this.interstitial.cooldownMs) return;
		this._lastInterTime = Date.now(); this._deathCount = 0;
		this.requestRevive(null);
	},
};
GameMonetize.init();
</script>
