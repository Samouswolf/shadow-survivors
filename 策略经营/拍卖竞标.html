<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>拍卖竞标</title>
    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px;
            background: linear-gradient(135deg, #f39c12, #e67e22);
            border-radius: 12px;
        }
        .stat {
            text-align: center;
            color: white;
        }
        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }
        .stat-value {
            font-size: 20px;
            font-weight: bold;
        }
        .auction-item {
            padding: 20px;
            background: #ffeaa7;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 15px;
        }
        .item-icon {
            font-size: 60px;
            margin-bottom: 10px;
        }
        .item-name {
            font-size: 18px;
            color: #2d3436;
            font-weight: bold;
        }
        .item-value {
            font-size: 14px;
            color: #636e72;
        }
        .current-bid {
            padding: 15px;
            background: #dfe6e9;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
        }
        .bid-label {
            font-size: 14px;
            color: #636e72;
        }
        .bid-value {
            font-size: 32px;
            color: #e67e22;
            font-weight: bold;
        }
        .bid-input-area {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
        }
        .bid-input {
            width: 150px;
            padding: 10px;
            border: 2px solid #f39c12;
            border-radius: 10px;
            font-size: 18px;
            text-align: center;
        }
        .quick-bids {
            display: flex;
            gap: 5px;
            justify-content: center;
            margin-bottom: 15px;
        }
        .quick-btn {
            padding: 8px 15px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            background: #ffeaa7;
            color: #2d3436;
            transition: all 0.2s;
        }
        .quick-btn:hover {
            background: #f39c12;
            color: white;
        }
        .bidders {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
        }
        .bidder {
            padding: 10px;
            background: #dfe6e9;
            border-radius: 10px;
            text-align: center;
        }
        .bidder-avatar {
            font-size: 24px;
        }
        .bidder-bid {
            font-size: 12px;
            color: #636e72;
        }
        .bidder.winning {
            background: #ffeaa7;
            border: 2px solid #f39c12;
        }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: white;
        }
        .btn-secondary {
            background: linear-gradient(135deg, #dfe6e9, #b2bec3);
            color: #2d3436;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .timer {
            text-align: center;
            font-size: 24px;
            color: #e67e22;
            margin-bottom: 10px;
        }
        .message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 20px 40px;
            border-radius: 15px;
            font-size: 18px;
            display: none;
            z-index: 100;
            text-align: center;
        }
        .message.show { display: block; }
        .collection {
            display: flex;
            gap: 5px;
            justify-content: center;
            margin-top: 10px;
            padding: 10px;
            background: #dfe6e9;
            border-radius: 10px;
        }
        .collection-item {
            font-size: 24px;
        }
        .ad-banner {
            width: 100%;
            height: 60px;
            background: linear-gradient(135deg, #f39c12, #e67e22);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">金币</div>
                <div class="stat-value" id="coins">500</div>
            </div>
            <div class="stat">
                <div class="stat-label">拍卖品</div>
                <div class="stat-value" id="itemNum">1/5</div>
            </div>
            <div class="stat">
                <div class="stat-label">收藏</div>
                <div class="stat-value" id="collectionCount">0</div>
            </div>
        </div>

        <div class="timer" id="timer">⏱️ 30秒</div>

        <div class="auction-item" id="auctionItem"></div>

        <div class="current-bid">
            <div class="bid-label">当前最高出价</div>
            <div class="bid-value" id="currentBid">0</div>
        </div>

        <div class="bidders" id="bidders"></div>

        <div class="quick-bids">
            <button class="quick-btn" onclick="quickBid(10)">+10</button>
            <button class="quick-btn" onclick="quickBid(20)">+20</button>
            <button class="quick-btn" onclick="quickBid(50)">+50</button>
            <button class="quick-btn" onclick="quickBid(100)">+100</button>
        </div>

        <div class="bid-input-area">
            <input type="number" class="bid-input" id="bidInput" placeholder="出价金额">
            <button class="btn btn-primary" id="btnBid">出价</button>
        </div>

        <div class="controls">
            <button class="btn btn-secondary" id="btnPass">跳过</button>
            <button class="btn btn-primary" id="btnReset">🔄 新拍卖</button>
        </div>

        <div class="collection" id="collection"></div>

        <div class="message" id="message"></div>

        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    <script>
        const ITEMS = [
            { icon: '🎨', name: '名画', basePrice: 100 },
            { icon: '💎', name: '钻石', basePrice: 150 },
            { icon: '🏆', name: '奖杯', basePrice: 80 },
            { icon: '📚', name: '古籍', basePrice: 120 },
            { icon: '🎵', name: '乐器', basePrice: 90 }
        ];

        const BIDDERS = [
            { name: '富豪A', avatar: '🧔' },
            { name: '富豪B', avatar: '👨' },
            { name: '富豪C', avatar: '👩' }
        ];

        let coins = 500;
        let currentItem = null;
        let currentBid = 0;
        let winningBidder = 'player';
        let itemNum = 1;
        let collection = [];
        let timer = 30;
        let timerInterval = null;
        let aiBidders = [];

        function startAuction() {
            currentItem = ITEMS[Math.floor(Math.random() * ITEMS.length)];
            currentBid = currentItem.basePrice;
            winningBidder = 'player';
            aiBidders = BIDDERS.map(b => ({
                ...b,
                bid: 0,
                budget: 200 + Math.floor(Math.random() * 300)
            }));

            timer = 30;
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 1000);

            renderAuctionItem();
            renderBidders();
            updateUI();
        }

        function renderAuctionItem() {
            const el = document.getElementById('auctionItem');
            el.innerHTML = `
                <div class="item-icon">${currentItem.icon}</div>
                <div class="item-name">${currentItem.name}</div>
                <div class="item-value">起拍价: ${currentItem.basePrice}金币</div>
            `;
        }

        function renderBidders() {
            const el = document.getElementById('bidders');
            el.innerHTML = '';

            // 添加玩家
            const playerEl = document.createElement('div');
            playerEl.className = 'bidder' + (winningBidder === 'player' ? ' winning' : '');
            playerEl.innerHTML = `
                <div class="bidder-avatar">🧙</div>
                <div class="bidder-bid">你: ${winningBidder === 'player' ? currentBid : '...'}</div>
            `;
            el.appendChild(playerEl);

            // 添加AI竞标者
            aiBidders.forEach(bidder => {
                const bEl = document.createElement('div');
                bEl.className = 'bidder' + (winningBidder === bidder.name ? ' winning' : '');
                bEl.innerHTML = `
                    <div class="bidder-avatar">${bidder.avatar}</div>
                    <div class="bidder-bid">${bidder.name}: ${bidder.bid}</div>
                `;
                el.appendChild(bEl);
            });
        }

        function updateTimer() {
            timer--;
            document.getElementById('timer').textContent = '⏱️ ' + timer + '秒';

            // AI随机出价
            if (Math.random() < 0.3) {
                aiBid();
            }

            if (timer <= 0) {
                endAuction();
            }
        }

        function aiBid() {
            const activeBidder = aiBidders[Math.floor(Math.random() * aiBidders.length)];
            if (activeBidder.budget > currentBid + 10) {
                const newBid = currentBid + 10 + Math.floor(Math.random() * 20);
                if (newBid <= activeBidder.budget) {
                    activeBidder.bid = newBid;
                    currentBid = newBid;
                    winningBidder = activeBidder.name;
                    renderBidders();
                    document.getElementById('currentBid').textContent = currentBid;
                }
            }
        }

        function playerBid(amount) {
            if (amount <= currentBid) {
                showMessage('出价必须高于当前价格！');
                return;
            }
            if (amount > coins) {
                showMessage('金币不足！');
                return;
            }

            currentBid = amount;
            winningBidder = 'player';
            renderBidders();
            document.getElementById('currentBid').textContent = currentBid;
        }

        function quickBid(add) {
            const newBid = currentBid + add;
            playerBid(newBid);
        }

        function endAuction() {
            clearInterval(timerInterval);

            if (winningBidder === 'player') {
                coins -= currentBid;
                collection.push(currentItem);
                showMessage('🎉 你赢得了拍卖！\n花费: ' + currentBid + '金币');
            } else {
                showMessage(`${winningBidder}赢得了拍卖！`);
            }

            itemNum++;
            if (itemNum > 5) {
                endGame();
            } else {
                setTimeout(startAuction, 2000);
            }

            updateUI();
            renderCollection();
        }

        function renderCollection() {
            const el = document.getElementById('collection');
            el.innerHTML = '';

            if (collection.length === 0) {
                el.innerHTML = '<span style="color: #636e72;">暂无收藏</span>';
            } else {
                collection.forEach(item => {
                    const iEl = document.createElement('div');
                    iEl.className = 'collection-item';
                    iEl.textContent = item.icon;
                    el.appendChild(iEl);
                });
            }
        }

        function passAuction() {
            clearInterval(timerInterval);
            showMessage('跳过此拍卖品');
            itemNum++;
            if (itemNum > 5) {
                endGame();
            } else {
                setTimeout(startAuction, 1000);
            }
        }

        function endGame() {
            const totalValue = collection.reduce((sum, item) => sum + item.basePrice * 2, 0);
            showMessage(`拍卖结束！\n收藏价值: ${totalValue}\n剩余金币: ${coins}`);
            GameCore.highScore.set('auction_game', coins + totalValue);
        }

        function updateUI() {
            document.getElementById('coins').textContent = coins;
            document.getElementById('itemNum').textContent = itemNum + '/5';
            document.getElementById('collectionCount').textContent = collection.length;
            document.getElementById('currentBid').textContent = currentBid;
        }

        function showMessage(msg) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 2000);
        }

        document.getElementById('btnBid').addEventListener('click', () => {
            const amount = parseInt(document.getElementById('bidInput').value);
            if (amount) playerBid(amount);
        });

        document.getElementById('btnPass').addEventListener('click', passAuction);
        document.getElementById('btnReset').addEventListener('click', () => {
            coins = 500;
            itemNum = 1;
            collection = [];
            startAuction();
        });

        // 初始化
        GameCore.init({ highScore: 'auction_game' });
        startAuction();
    </script>
</body>
</html>
