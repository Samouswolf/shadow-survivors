<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">金币</div>
                <div class="stat-value" id="coins">500</div>
            </div>
            <div class="stat">
                <div class="stat-label">拍卖品</div>
                <div class="stat-value" id="itemNum">1/5</div>
            </div>
            <div class="stat">
                <div class="stat-label">收藏</div>
                <div class="stat-value" id="collectionCount">0</div>
            </div>
        </div>

        <div class="timer" id="timer">⏱️ 30秒</div>

        <div class="auction-item" id="auctionItem"></div>

        <div class="current-bid">
            <div class="bid-label">当前最高出价</div>
            <div class="bid-value" id="currentBid">0</div>
        </div>

        <div class="bidders" id="bidders"></div>

        <div class="quick-bids">
            <button class="quick-btn" onclick="quickBid(10)">+10</button>
            <button class="quick-btn" onclick="quickBid(20)">+20</button>
            <button class="quick-btn" onclick="quickBid(50)">+50</button>
            <button class="quick-btn" onclick="quickBid(100)">+100</button>
        </div>

        <div class="bid-input-area">
            <input type="number" class="bid-input" id="bidInput" placeholder="出价金额">
            <button class="btn btn-primary" id="btnBid">出价</button>
        </div>

        <div class="controls">
            <button class="btn btn-secondary" id="btnPass">跳过</button>
            <button class="btn btn-primary" id="btnReset">🔄 新拍卖</button>
        </div>

        <div class="collection" id="collection"></div>

        <div class="message" id="message"></div>

        
    </div>

    <script>
        const ITEMS = [
            { icon: '🎨', name: '名画', basePrice: 100 },
            { icon: '💎', name: '钻石', basePrice: 150 },
            { icon: '🏆', name: '奖杯', basePrice: 80 },
            { icon: '📚', name: '古籍', basePrice: 120 },
            { icon: '🎵', name: '乐器', basePrice: 90 }
        ];

        const BIDDERS = [
            { name: '富豪A', avatar: '🧔' },
            { name: '富豪B', avatar: '👨' },
            { name: '富豪C', avatar: '👩' }
        ];

        let coins = 500;
        let currentItem = null;
        let currentBid = 0;
        let winningBidder = 'player';
        let itemNum = 1;
        let collection = [];
        let timer = 30;
        let timerInterval = null;
        let aiBidders = [];

        function startAuction() {
            currentItem = ITEMS[Math.floor(Math.random() * ITEMS.length)];
            currentBid = currentItem.basePrice;
            winningBidder = 'player';
            aiBidders = BIDDERS.map(b => ({
                ...b,
                bid: 0,
                budget: 200 + Math.floor(Math.random() * 300)
            }));

            timer = 30;
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 1000);

            renderAuctionItem();
            renderBidders();
            updateUI();
        }

        function renderAuctionItem() {
            const el = document.getElementById('auctionItem');
            el.innerHTML = `
                <div class="item-icon">${currentItem.icon}</div>
                <div class="item-name">${currentItem.name}</div>
                <div class="item-value">起拍价: ${currentItem.basePrice}金币</div>
            `;
        }

        function renderBidders() {
            const el = document.getElementById('bidders');
            el.innerHTML = '';

            // 添加玩家
            const playerEl = document.createElement('div');
            playerEl.className = 'bidder' + (winningBidder === 'player' ? ' winning' : '');
            playerEl.innerHTML = `
                <div class="bidder-avatar">🧙</div>
                <div class="bidder-bid">你: ${winningBidder === 'player' ? currentBid : '...'}</div>
            `;
            el.appendChild(playerEl);

            // 添加AI竞标者
            aiBidders.forEach(bidder => {
                const bEl = document.createElement('div');
                bEl.className = 'bidder' + (winningBidder === bidder.name ? ' winning' : '');
                bEl.innerHTML = `
                    <div class="bidder-avatar">${bidder.avatar}</div>
                    <div class="bidder-bid">${bidder.name}: ${bidder.bid}</div>
                `;
                el.appendChild(bEl);
            });
        }

        function updateTimer() {
            timer--;
            document.getElementById('timer').textContent = '⏱️ ' + timer + '秒';

            // AI随机出价
            if (Math.random() < 0.3) {
                aiBid();
            }

            if (timer <= 0) {
                endAuction();
            }
        }

        function aiBid() {
            const activeBidder = aiBidders[Math.floor(Math.random() * aiBidders.length)];
            if (activeBidder.budget > currentBid + 10) {
                const newBid = currentBid + 10 + Math.floor(Math.random() * 20);
                if (newBid <= activeBidder.budget) {
                    activeBidder.bid = newBid;
                    currentBid = newBid;
                    winningBidder = activeBidder.name;
                    renderBidders();
                    document.getElementById('currentBid').textContent = currentBid;
                }
            }
        }

        function playerBid(amount) {
            if (amount <= currentBid) {
                showMessage('出价必须高于当前价格！');
                return;
            }
            if (amount > coins) {
                showMessage('金币不足！');
                return;
            }

            currentBid = amount;
            winningBidder = 'player';
            renderBidders();
            document.getElementById('currentBid').textContent = currentBid;
        }

        function quickBid(add) {
            const newBid = currentBid + add;
            playerBid(newBid);
        }

        function endAuction() {
            clearInterval(timerInterval);

            if (winningBidder === 'player') {
                coins -= currentBid;
                collection.push(currentItem);
                showMessage('🎉 你赢得了拍卖！\n花费: ' + currentBid + '金币');
            } else {
                showMessage(`${winningBidder}赢得了拍卖！`);
            }

            itemNum++;
            if (itemNum > 5) {
                endGame();
            } else {
                setTimeout(startAuction, 2000);
            }

            updateUI();
            renderCollection();
        }

        function renderCollection() {
            const el = document.getElementById('collection');
            el.innerHTML = '';

            if (collection.length === 0) {
                el.innerHTML = '<span style="color: #636e72;">暂无收藏</span>';
            } else {
                collection.forEach(item => {
                    const iEl = document.createElement('div');
                    iEl.className = 'collection-item';
                    iEl.textContent = item.icon;
                    el.appendChild(iEl);
                });
            }
        }

        function passAuction() {
            clearInterval(timerInterval);
            showMessage('跳过此拍卖品');
            itemNum++;
            if (itemNum > 5) {
                endGame();
            } else {
                setTimeout(startAuction, 1000);
            }
        }

        function endGame() {
            const totalValue = collection.reduce((sum, item) => sum + item.basePrice * 2, 0);
            showMessage(`拍卖结束！\n收藏价值: ${totalValue}\n剩余金币: ${coins}`);
            GameCore.highScore.set('auction_game', coins + totalValue);
        }

        function updateUI() {
            document.getElementById('coins').textContent = coins;
            document.getElementById('itemNum').textContent = itemNum + '/5';
            document.getElementById('collectionCount').textContent = collection.length;
            document.getElementById('currentBid').textContent = currentBid;
        }

        function showMessage(msg) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 2000);
        }

        document.getElementById('btnBid').addEventListener('click', () => {
            const amount = parseInt(document.getElementById('bidInput').value);
            if (amount) playerBid(amount);
        });

        document.getElementById('btnPass').addEventListener('click', passAuction);
        document.getElementById('btnReset').addEventListener('click', () => {
            coins = 500;
            itemNum = 1;
            collection = [];
            startAuction();
        });

        // 初始化
        GameCore.init({ highScore: 'auction_game' });
        startAuction();
    </script>

<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>
<!-- [/BATCH-FIX:responsive-js] -->
<!-- [BATCH-FIX:touch-support] -->
<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>
<!-- [/BATCH-FIX:touch-support] -->

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
