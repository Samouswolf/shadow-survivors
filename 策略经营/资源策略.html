<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>资源策略 - 游戏工坊</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #166534 0%, #15803d 50%, #16a34a 100%); min-height: 100vh; }
#game-container { max-width: 600px; margin: 0 auto; padding: 20px; }
#game-ui { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; color: #fff; }
#game-ui h1 { font-size: 24px; color: #86efac; }
#resources { display: flex; gap: 15px; }
.resource-item { background: rgba(0,0,0,0.3); padding: 8px 15px; border-radius: 20px; display: flex; align-items: center; gap: 5px; }
.resource-item span { font-weight: bold; }
#grid-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
.building-cell { aspect-ratio: 1; background: rgba(255,255,255,0.05); border-radius: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; border: 2px solid rgba(255,255,255,0.1); }
.building-cell:hover { background: rgba(255,255,255,0.1); }
.building-cell.selected { border-color: #fbbf24; }
.building-cell .emoji { font-size: 36px; margin-bottom: 5px; }
.building-cell .name { font-size: 12px; color: #fff; text-align: center; }
.building-cell .level { font-size: 10px; color: #aaa; }
#action-panel { background: rgba(0,0,0,0.3); border-radius: 15px; padding: 20px; }
#action-panel h3 { color: #fff; margin-bottom: 15px; }
#action-panel p { color: #aaa; font-size: 14px; margin-bottom: 15px; }
#action-buttons { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.action-btn { padding: 12px; font-size: 14px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: all 0.2s; }
.action-btn.upgrade { background: linear-gradient(145deg, #fbbf24, #f59e0b); color: #1a1a2e; }
.action-btn.collect { background: linear-gradient(145deg, #4ade80, #22c55e); color: #fff; }
.action-btn.build { background: linear-gradient(145deg, #3b82f6, #2563eb); color: #fff; }
.action-btn.sell { background: linear-gradient(145deg, #f87171, #ef4444); color: #fff; }
.action-btn:disabled { opacity: 0.5; cursor: not-allowed; }
#game-over { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; flex-direction: column; align-items: center; justify-content: center; }
#game-over h2 { font-size: 48px; color: #4ade80; margin-bottom: 20px; }
#game-over p { font-size: 24px; color: #fff; margin-bottom: 30px; }
#game-over .btn { padding: 15px 40px; font-size: 20px; background: #22c55e; color: #fff; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
#start-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 90; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#start-screen h1 { font-size: 48px; color: #86efac; margin-bottom: 20px; text-shadow: 0 0 20px rgba(134,239,172,0.5); }
#start-screen p { color: #aaa; margin-bottom: 40px; font-size: 16px; text-align: center; max-width: 400px; }
#start-screen .btn { padding: 18px 50px; font-size: 22px; background: linear-gradient(145deg, #86efac, #22c55e); color: #fff; border: none; border-radius: 15px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 20px rgba(134,239,172,0.4); }
.ad-banner-container { margin-top: 20px; }
.sponsor-btn { position: fixed; top: 20px; right: 20px; width: 50px; height: 50px; background: rgba(255,165,0,0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; z-index: 100; }
.sponsor-panel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 200; align-items: center; justify-content: center; }
.sponsor-panel.show { display: flex; }
.sponsor-content { background: #fff; padding: 30px; border-radius: 20px; text-align: center; }
.sponsor-close { position: absolute; top: 20px; right: 20px; width: 40px; height: 40px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; }
#loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #166534; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#loading-screen .loading-icon { width: 60px; height: 60px; border: 4px solid #86efac; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#loading-screen p { color: #86efac; margin-top: 20px; font-size: 18px; }
.interstitial-ad { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
.interstitial-ad .ad-content { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; text-align: center; min-width: 280px; max-width: 400px; }
.interstitial-ad .skip-btn { padding: 8px 28px; background: rgba(255,215,0,0.15); border: 1px solid rgba(255,215,0,0.3); border-radius: 20px; color: #ffd700; font-weight: bold; font-size: 15px; cursor: pointer; }
</style>
</head>
<body>
<div id="loading-screen">
  <div class="loading-icon"></div>
  <p>加载中...</p>
</div>

<div class="sponsor-btn" onclick="showSponsor()">☕</div>
<div class="sponsor-panel" id="sponsor-panel" onclick="hideSponsor()">
  <div class="sponsor-content" onclick="event.stopPropagation()">
    <h3>支持开发者</h3>
    <p>感谢您的支持！</p>
  </div>
  <div class="sponsor-close" onclick="hideSponsor()">×</div>
</div>

<div class="interstitial-ad" id="interstitialAd">
  <div class="ad-content">
    <p>📢 赞助商广告</p>
    <div style="min-height:250px;display:flex;align-items:center;justify-content:center;color:#888;font-size:13px;">广告加载中...</div>
  </div>
  <button class="skip-btn" onclick="closeInterstitial()">跳过广告 ▶</button>
</div>

<div id="start-screen">
  <h1>🏰 资源策略</h1>
  <p>操作说明：点击格子建造建筑<br>升级建筑提高产量<br>收集资源扩大领地<br>目标：建立强大的帝国！</p>
  <button class="btn" onclick="startGame()">开始建设</button>
</div>

<div id="game-container">
  <div id="game-ui">
    <h1>🏰 资源策略</h1>
    <div id="resources">
      <div class="resource-item">💰 <span id="gold">100</span></div>
      <div class="resource-item">🌾 <span id="food">50</span></div>
      <div class="resource-item">⚒️ <span id="iron">20</span></div>
    </div>
  </div>
  
  <div id="grid-container"></div>
  
  <div id="action-panel">
    <h3 id="selected-name">选择建筑</h3>
    <p id="selected-desc">点击地图上的格子选择建筑进行操作</p>
    <div id="action-buttons">
      <button class="action-btn upgrade" onclick="upgradeBuilding()" id="btn-upgrade">⬆️ 升级</button>
      <button class="action-btn collect" onclick="collectResource()" id="btn-collect">📥 收集</button>
      <button class="action-btn build" onclick="buildBuilding()" id="btn-build">🏗️ 建造</button>
      <button class="action-btn sell" onclick="sellBuilding()" id="btn-sell">💰 出售</button>
    </div>
  </div>
</div>

<div id="game-over">
  <h2>🏆 胜利！</h2>
  <p>你的帝国已繁荣昌盛！</p>
  <button class="btn" onclick="restartGame()">重新开始</button>
</div>


  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script>
// ==================== 游戏说明 ====================
// 操作说明: 点击格子建造建筑，升级建筑提高产量，收集资源
// 游戏目标: 积累足够资源建立强大帝国
// 存档系统: 自动保存最高金币到本地
// ==================== 模块说明 ====================
// 1. 游戏初始化模块 - 初始化地图和资源
// 2. 建筑逻辑模块 - 处理建造、升级、收集、出售
// 3. 渲染模块 - 更新地图和资源显示
// 4. 音效模块 - 播放游戏音效
// 5. 存档模块 - 管理最高分记录

const GAME_NAME = '资源策略';

class GameCore {
  static init(options) {
    if (options && options.highScore) {
      this.highScoreKey = options.highScore;
    }
  }
  
  static getHighScore() {
    try {
      return parseInt(localStorage.getItem(this.highScoreKey)) || 0;
    } catch (error) {
      console.warn('读取最高分失败:', error);
      return 0;
    }
  }
  
  static setHighScore(value) {
    try {
      const current = this.getHighScore();
      if (value > current) {
        localStorage.setItem(this.highScoreKey, value.toString());
        return true;
      }
      return false;
    } catch (error) {
      console.warn('保存最高分失败:', error);
      return false;
    }
  }
}

GameCore.init({ highScore: GAME_NAME });

const BUILDINGS = {
  farm: { name: '农场', emoji: '🌾', desc: '生产粮食', cost: { gold: 50 }, produce: { food: 5 }, upgradeCost: { gold: 30 } },
  mine: { name: '矿场', emoji: '⛏️', desc: '生产铁矿', cost: { gold: 80 }, produce: { iron: 3 }, upgradeCost: { gold: 50 } },
  market: { name: '市场', emoji: '🏪', desc: '交易资源', cost: { gold: 100 }, produce: { gold: 10 }, upgradeCost: { gold: 60 } },
  castle: { name: '城堡', emoji: '🏰', desc: '提升声望', cost: { gold: 200, iron: 50 }, produce: {}, upgradeCost: { gold: 100 } },
  sawmill: { name: '锯木厂', emoji: '🪓', desc: '生产木材', cost: { gold: 60 }, produce: { iron: 2 }, upgradeCost: { gold: 40 } },
  warehouse: { name: '仓库', emoji: '🏠', desc: '储存资源', cost: { gold: 70 }, produce: {}, upgradeCost: { gold: 45 } },
};

let resources = { gold: 100, food: 50, iron: 20 };
let grid = [];
let selectedCell = null;
let maxGold = 0;

function initGrid() {
  grid = Array(16).fill(null).map((_, i) => ({
    id: i,
    type: null,
    level: 0,
    stored: 0,
  }));
}

function renderGrid() {
  const container = document.getElementById('grid-container');
  container.innerHTML = '';
  
  grid.forEach((cell, index) => {
    const cellEl = document.createElement('div');
    cellEl.className = 'building-cell';
    if (selectedCell === index) cellEl.classList.add('selected');
    
    if (cell.type) {
      const building = BUILDINGS[cell.type];
      cellEl.innerHTML = `
        <div class="emoji">${building.emoji}</div>
        <div class="name">${building.name}</div>
        <div class="level">Lv.${cell.level}</div>
      `;
    } else {
      cellEl.innerHTML = `
        <div class="emoji" style="opacity:0.3;">⬜</div>
        <div class="name">空地</div>
      `;
    }
    
    cellEl.onclick = () => selectCell(index);
    container.appendChild(cellEl);
  });
}

function selectCell(index) {
  selectedCell = index;
  const cell = grid[index];
  
  if (cell.type) {
    const building = BUILDINGS[cell.type];
    document.getElementById('selected-name').textContent = building.emoji + ' ' + building.name;
    document.getElementById('selected-desc').textContent = building.desc + ' | 等级: ' + cell.level + ' | 产量: ' + JSON.stringify(building.produce);
    
    document.getElementById('btn-upgrade').disabled = false;
    document.getElementById('btn-collect').disabled = !Object.keys(building.produce).length;
    document.getElementById('btn-build').disabled = true;
    document.getElementById('btn-sell').disabled = false;
  } else {
    document.getElementById('selected-name').textContent = '空地';
    document.getElementById('selected-desc').textContent = '点击建造按钮选择建筑类型';
    
    document.getElementById('btn-upgrade').disabled = true;
    document.getElementById('btn-collect').disabled = true;
    document.getElementById('btn-build').disabled = false;
    document.getElementById('btn-sell').disabled = true;
  }
  
  renderGrid();
}

function buildBuilding() {
  const types = Object.keys(BUILDINGS);
  const type = types[Math.floor(Math.random() * types.length)];
  const building = BUILDINGS[type];
  
  if (!canAfford(building.cost)) {
    alert('资源不足！');
    return;
  }
  
  spendResources(building.cost);
  grid[selectedCell].type = type;
  grid[selectedCell].level = 1;
  grid[selectedCell].stored = 0;
  
  playSound(330, 0.2, 'sine');
  updateResources();
  selectCell(selectedCell);
}

function upgradeBuilding() {
  const cell = grid[selectedCell];
  const building = BUILDINGS[cell.type];
  
  const cost = { ...building.upgradeCost };
  Object.keys(cost).forEach(k => cost[k] *= cell.level);
  
  if (!canAfford(cost)) {
    alert('资源不足！');
    return;
  }
  
  spendResources(cost);
  cell.level++;
  
  playSound(440, 0.2, 'square');
  updateResources();
  selectCell(selectedCell);
}

function collectResource() {
  const cell = grid[selectedCell];
  const building = BUILDINGS[cell.type];
  
  Object.keys(building.produce).forEach(res => {
    const amount = building.produce[res] * cell.level;
    resources[res] = (resources[res] || 0) + amount;
  });
  
  playSound(523, 0.1, 'sine');
  updateResources();
  
  if (resources.gold >= 1000) {
    gameOver();
  }
}

function sellBuilding() {
  const cell = grid[selectedCell];
  const building = BUILDINGS[cell.type];
  
  const refund = {};
  Object.keys(building.cost).forEach(res => {
    refund[res] = Math.floor(building.cost[res] * 0.5 * cell.level);
  });
  
  Object.keys(refund).forEach(res => {
    resources[res] = (resources[res] || 0) + refund[res];
  });
  
  grid[selectedCell].type = null;
  grid[selectedCell].level = 0;
  
  playSound(220, 0.15, 'sawtooth');
  updateResources();
  selectCell(selectedCell);
}

function canAfford(cost) {
  return Object.keys(cost).every(res => (resources[res] || 0) >= cost[res]);
}

function spendResources(cost) {
  Object.keys(cost).forEach(res => {
    resources[res] -= cost[res];
  });
}

function updateResources() {
  document.getElementById('gold').textContent = resources.gold;
  document.getElementById('food').textContent = resources.food;
  document.getElementById('iron').textContent = resources.iron;
  
  if (resources.gold > maxGold) {
    maxGold = resources.gold;
  }
}

function gameOver() {
  GameCore.setHighScore(maxGold);
  document.getElementById('game-over').style.display = 'flex';
}

function startGame() {
  try {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('game-over').style.display = 'none';
    
    resources = { gold: 100, food: 50, iron: 20 };
    initGrid();
    selectedCell = null;
    maxGold = 0;
    
    updateResources();
    renderGrid();
    
    document.getElementById('selected-name').textContent = '选择建筑';
    document.getElementById('selected-desc').textContent = '点击地图上的格子选择建筑进行操作';
  } catch (error) {
    console.error('开始游戏失败:', error);
    alert('游戏启动失败，请重试');
  }
}

function restartGame() {
  startGame();
}

function showSponsor() {
  try {
    document.getElementById('sponsor-panel').classList.add('show');
  } catch (error) {
    console.error('显示赞助面板失败:', error);
  }
}

function hideSponsor() {
  try {
    document.getElementById('sponsor-panel').classList.remove('show');
  } catch (error) {
    console.error('隐藏赞助面板失败:', error);
  }
}

function closeInterstitial() {
  try {
    document.getElementById('interstitialAd').style.display = 'none';
  } catch (error) {
    console.error('关闭广告失败:', error);
  }
}

let audioCtx = null;
function initAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch (error) {
    console.warn('音频初始化失败:', error);
  }
}
function playSound(freq, dur, type, vol) {
  try {
    if (!audioCtx) return;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || 'square';
    o.frequency.value = freq;
    g.gain.value = vol || 0.15;
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime + dur);
  } catch (error) {
    console.warn('音效播放失败:', error);
  }
}

window.addEventListener('load', () => {
  try {
    setTimeout(() => {
      document.getElementById('loading-screen').style.display = 'none';
    }, 1500);
  } catch (error) {
    console.error('初始化失败:', error);
  }
});
</script>
</body>
</html>
