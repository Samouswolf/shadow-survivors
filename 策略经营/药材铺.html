<canvas id="cv"></canvas>

  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义

<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W,H,gameState='menu',score=0,coins=50,day=1,highScore=+localStorage.getItem('herb_hi')||0;
let inventory={},recipes=[],currentOrder=null,orderTimer=0;
let message='',msgTimer=0,particles=[],customersServed=0;

function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight}
addEventListener('resize',resize);resize();

// 药材数据
const HERBS={
    '人参':{color:'#d4a574',price:10,desc:'补气养血'},
    '枸杞':{color:'#e74c3c',price:5,desc:'明目养肝'},
    '当归':{color:'#8b6914',price:8,desc:'补血活血'},
    '黄芪':{color:'#f0c040',price:7,desc:'益气固表'},
    '甘草':{color:'#a0a060',price:3,desc:'调和诸药'},
    '金银花':{color:'#ffd700',price:6,desc:'清热解毒'},
    '菊花':{color:'#fff44f',price:4,desc:'清肝明目'},
    '陈皮':{color:'#ff8c00',price:3,desc:'理气健脾'},
    '茯苓':{color:'#d2b48c',price:6,desc:'利水渗湿'},
    '白术':{color:'#deb887',price:5,desc:'健脾益气'},
    '川芎':{color:'#b8860b',price:7,desc:'活血行气'},
    '熟地':{color:'#4a3728',price:9,desc:'滋阴补血'},
};

// 药方（3种药材的组合）
const RECIPES=[
    {name:'补气汤',herbs:['人参','黄芪','甘草'],reward:35,desc:'补气养血'},
    {name:'明目茶',herbs:['枸杞','菊花','甘草'],reward:22,desc:'清肝明目'},
    {name:'活血散',herbs:['当归','川芎','陈皮'],reward:30,desc:'活血化瘀'},
    {name:'清热饮',herbs:['金银花','菊花','甘草'],reward:20,desc:'清热解毒'},
    {name:'健脾方',herbs:['白术','茯苓','陈皮'],reward:25,desc:'健脾和胃'},
    {name:'养血膏',herbs:['当归','熟地','枸杞'],reward:38,desc:'滋阴养血'},
    {name:'固表散',herbs:['黄芪','白术','防风'],reward:28,desc:'益气固表'},
    {name:'理气丸',herbs:['陈皮','茯苓','甘草'],reward:18,desc:'理气健脾'},
    {name:'回春丹',herbs:['人参','当归','熟地'],reward:50,desc:'大补元气'},
    {name:'安神茶',herbs:['茯苓','甘草','菊花'],reward:15,desc:'宁心安神'},
];

const HERB_NAMES=Object.keys(HERBS);
const CUSTOMER_NAMES=['张大娘','李大爷','王婶子','赵老伯','孙婆婆','周大哥','吴小妹','郑先生','冯大夫','陈掌柜'];

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

function generateOrder(){
    const recipe=RECIPES[Math.floor(Math.random()*RECIPES.length)];
    const customer=CUSTOMER_NAMES[Math.floor(Math.random()*CUSTOMER_NAMES.length)];
    return{recipe,customer,timer:600+day*60,patience:100};
}

function canMakeRecipe(recipe){
    return recipe.herbs.every(h=>(inventory[h]||0)>0);
}

function makeRecipe(recipe){
    if(!canMakeRecipe(recipe))return false;
    recipe.herbs.forEach(h=>{inventory[h]--});
    coins+=recipe.reward;score+=recipe.reward;customersServed++;
    if(score>highScore){highScore=score;localStorage.setItem('herb_hi',highScore)}
    spawnP(W/2,H/2,20,'#ffd700');
    message=`✅ 完成"${recipe.name}" +${recipe.reward}金币`;msgTimer=90;
    return true;
}

function buyHerb(name){
    const price=HERBS[name].price;
    if(coins<price){message='金币不足！';msgTimer=60;return}
    coins-=price;inventory[name]=(inventory[name]||0)+1;
    message=`购买了${name}`;msgTimer=60;
    spawnP(W/2,H/2,5,HERBS[name].color);
}

function drawBg(){
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#2d1b1b');g.addColorStop(0.5,'#1a0a0a');g.addColorStop(1,'#2d1b1b');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
function drawText(t,x,y,s,c,a){ctx.fillStyle=c||'#fff';ctx.font=`bold ${s}px 'Microsoft YaHei',sans-serif`;ctx.textAlign=a||'center';ctx.textBaseline='middle';ctx.fillText(t,x,y)}

class Particle{
    constructor(x,y,c){this.x=x;this.y=y;this.vx=(Math.random()-0.5)*3;this.vy=(Math.random()-0.5)*3;this.life=1;this.color=c;this.size=Math.random()*3+2}
    update(){this.x+=this.vx;this.y+=this.vy;this.life-=0.02;this.vy+=0.03}
    draw(){ctx.globalAlpha=this.life;ctx.fillStyle=this.color;ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}
}
function spawnP(x,y,n,c){for(let i=0;i<n;i++)particles.push(new Particle(x,y,c))}

function drawMenu(){
    drawBg();
    drawText('药 材 铺',W/2,H*0.2,Math.min(W*0.09,48),'#d4a574');
    drawText('采药·配药·经营',W/2,H*0.32,Math.min(W*0.035,18),'#8b6914');
    const bw=Math.min(W*0.4,200),bh=50,bx=W/2-bw/2,by=H*0.48;
    ctx.fillStyle='#8b6914';ctx.beginPath();ctx.roundRect(bx,by,bw,bh,12);ctx.fill();
    drawText('开业',W/2,by+bh/2,20,'#fff');
    drawText(`最高分: ${highScore}`,W/2,H*0.62,16,'#8b6914');
    drawText('12种药材 | 10种药方 | 经营养生',W/2,H*0.72,14,'#5a3a1a');
}

function drawGame(){
    drawBg();
    // 顶部状态栏
    drawText('药材铺',W/2,25,20,'#d4a574');
    drawText(`💰${coins}  ⭐${score}  📅第${day}天  👥${customersServed}人`,W/2,50,13,'#8b6914');
    // 当前订单
    if(currentOrder){
        const oy=70;
        ctx.fillStyle='rgba(139,105,20,0.2)';ctx.beginPath();ctx.roundRect(W*0.05,oy,W*0.9,80,12);ctx.fill();
        drawText(`${currentOrder.customer}需要：${currentOrder.recipe.name}`,W/2,oy+20,15,'#d4a574');
        drawText(`配方：${currentOrder.recipe.herbs.join('+')}  奖励：${currentOrder.recipe.reward}💰`,W/2,oy+42,13,'#8b6914');
        // 耐心条
        const pw=W*0.7,px=W/2-pw/2,py=oy+60;
        ctx.fillStyle='rgba(255,255,255,0.1)';ctx.fillRect(px,py,pw,8);
        ctx.fillStyle=currentOrder.patience>30?'#4caf50':'#f44336';ctx.fillRect(px,py,pw*currentOrder.patience/100,8);
        // 配药按钮
        if(canMakeRecipe(currentOrder.recipe)){
            const btnX=W/2-60,btnY=oy+75;
            ctx.fillStyle='#4caf50';ctx.beginPath();ctx.roundRect(btnX,btnY,120,30,8);ctx.fill();
            drawText('配药',W/2,btnY+15,14,'#fff');
        }
    }else{
        drawText('等待病人...',W/2,95,14,'#5a3a1a');
    }
    // 药材背包
    const invY=170,invCols=Math.min(6,Math.floor(W/80));
    drawText('药柜',W/2,invY-15,14,'#8b6914');
    HERB_NAMES.forEach((name,i)=>{
        const col=i%invCols,row=Math.floor(i/invCols);
        const cellW=Math.min(70,(W-40)/invCols);
        const x=20+col*cellW,y=invY+row*65;
        const cnt=inventory[name]||0;
        ctx.fillStyle='rgba(139,105,20,0.1)';ctx.beginPath();ctx.roundRect(x,y,cellW-6,58,8);ctx.fill();
        ctx.strokeStyle=cnt>0?'#d4a574':'#3a2a1a';ctx.lineWidth=1;
        ctx.beginPath();ctx.roundRect(x,y,cellW-6,58,8);ctx.stroke();
        drawText(name,x+cellW/2-3,y+18,11,cnt>0?'#d4a574':'#5a3a1a');
        drawText(`×${cnt}`,x+cellW/2-3,y+38,12,cnt>0?'#fff':'#5a3a1a');
    });
    // 药铺（购买药材）
    const shopY=H*0.62;
    drawText('药市（点击购买）',W/2,shopY-15,14,'#8b6914');
    const shopCols=Math.min(4,Math.floor(W/100));
    HERB_NAMES.slice(0,8).forEach((name,i)=>{
        const col=i%shopCols,row=Math.floor(i/shopCols);
        const cellW=Math.min(90,(W-40)/shopCols);
        const x=20+col*cellW,y=shopY+row*55;
        const herb=HERBS[name];
        ctx.fillStyle='rgba(255,255,255,0.05)';ctx.beginPath();ctx.roundRect(x,y,cellW-6,48,8);ctx.fill();
        drawText(`${name} ${herb.price}💰`,x+cellW/2-3,y+18,10,coins>=herb.price?'#d4a574':'#5a3a1a');
        drawText(herb.desc,x+cellW/2-3,y+35,9,'#5a3a1a');
    });
    // 药方列表
    const rx=W*0.05,ry=H*0.85;
    drawText('常用药方:',rx,ry,11,'#8b6914','left');
    RECIPES.slice(0,5).forEach((r,i)=>{
        drawText(`${r.name}:${r.herbs.join('+')}`,rx,ry+18+i*14,9,'#5a3a1a','left');
    });
    if(msgTimer>0){drawText(message,W/2,H-15,12,'#ffd700');msgTimer--}
}

function drawEnd(){
    drawBg();
    drawText('药 材 铺',W/2,H*0.2,Math.min(W*0.08,40),'#d4a574');
    drawText(`最终得分: ${score}`,W/2,H*0.35,24,'#fff');
    drawText(`💰${coins}  👥${customersServed}人  📅${day}天`,W/2,H*0.45,16,'#8b6914');
    const bw=Math.min(W*0.4,200),bh=50,bx=W/2-bw/2,by=H*0.58;
    ctx.fillStyle='#8b6914';ctx.beginPath();ctx.roundRect(bx,by,bw,bh,12);ctx.fill();
    drawText('重新开业',W/2,by+bh/2,20,'#fff');
}

function startGame(){
    gameState='playing';score=0;coins=50;day=1;inventory={'甘草':2,'枸杞':1};customersServed=0;
    currentOrder=generateOrder();
}

addEventListener('click',e=>{
    const x=e.clientX,y=e.clientY;
    if(gameState==='menu'){
        const bw=Math.min(W*0.4,200),bh=50,bx=W/2-bw/2,by=H*0.48;
        if(x>=bx&&x<=bx+bw&&y>=by&&y<=by+bh)startGame();
    }else if(gameState==='playing'){
        // 配药按钮
        if(currentOrder&&canMakeRecipe(currentOrder.recipe)){
            const btnX=W/2-60,btnY=170;
            if(x>=btnX&&x<=btnX+120&&y>=btnY&&y<=btnY+30){
                makeRecipe(currentOrder.recipe);
                currentOrder=null;
                setTimeout(()=>{currentOrder=generateOrder()},1500);
            }
        }
        // 购买药材
        const shopY=H*0.62,shopCols=Math.min(4,Math.floor(W/100));
        HERB_NAMES.slice(0,8).forEach((name,i)=>{
            const col=i%shopCols,row=Math.floor(i/shopCols);
            const cellW=Math.min(90,(W-40)/shopCols);
            const sx=20+col*cellW,sy=shopY+row*55;
            if(x>=sx&&x<=sx+cellW-6&&y>=sy&&y<=sy+48)buyHerb(name);
        });
    }else if(gameState==='gameover'){
        const bw=Math.min(W*0.4,200),bh=50,bx=W/2-bw/2,by=H*0.58;
        if(x>=bx&&x<=bx+bw&&y>=by&&y<=by+bh)startGame();
    }
});

let frameCount=0;
function loop(){
    frameCount++;
    if(gameState==='playing'&&currentOrder){
        currentOrder.patience-=0.05;
        if(currentOrder.patience<=0){
            message=`❌ ${currentOrder.customer}等不及走了！`;msgTimer=90;
            currentOrder=null;
            setTimeout(()=>{currentOrder=generateOrder()},2000);
        }
    }
    if(gameState==='playing'&&frameCount%1800===0){day++}
    if(gameState==='menu')drawMenu();
    else if(gameState==='playing')drawGame();
    else drawEnd();
    particles.forEach(p=>{p.update();p.draw()});particles=particles.filter(p=>p.life>0);
    requestAnimationFrame(loop);
}
loop();

// 广告系统
(function(){
var sb=document.getElementById('sponsorBtn'),sp=document.getElementById('sponsorPanel'),sc=document.getElementById('sponsorClose');
if(sb&&sp){sb.onclick=function(){sp.style.display='flex'};if(sc)sc.onclick=function(){sp.style.display='none'}}
// 插屏广告（游戏结束时显示）
var ia=document.getElementById('interstitialAd'),si=document.getElementById('skipInterstitial');
if(ia&&si){si.onclick=function(){ia.style.display='none'}}
window.showInterstitialAd=function(){if(ia)ia.style.display='flex'};
})();

        // 音效支持
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq = 440, duration = 0.1) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }
        </script>

<script>
(function(){
  if (window.__touchBridgeInstalled) return;
  window.__touchBridgeInstalled = true;
  function dispatchMouseLike(type, touch) {
    var target = document.elementFromPoint(touch.clientX, touch.clientY) || document.querySelector('canvas');
    if (!target) return;
    target.dispatchEvent(new MouseEvent(type, {
      bubbles: true,
      cancelable: true,
      clientX: touch.clientX,
      clientY: touch.clientY,
      screenX: touch.screenX,
      screenY: touch.screenY,
      button: 0
    }));
  }
  document.addEventListener('touchstart', function(e) {
    if (!e.touches || !e.touches.length) return;
    e.preventDefault();
    dispatchMouseLike('mousedown', e.touches[0]);
    dispatchMouseLike('click', e.touches[0]);
  }, { passive: false });
  document.addEventListener('touchmove', function(e) {
    if (!e.touches || !e.touches.length) return;
    e.preventDefault();
    dispatchMouseLike('mousemove', e.touches[0]);
  }, { passive: false });
  document.addEventListener('touchend', function(e) {
    var touch = e.changedTouches && e.changedTouches[0];
    if (!touch) return;
    e.preventDefault();
    dispatchMouseLike('mouseup', touch);
  }, { passive: false });
})();

        // 音效支持
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq = 440, duration = 0.1) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }
        
        // 键盘支持
        document.addEventListener("keydown", function(e) {
            if(e.key == " " || e.keyCode == 32) {
                e.preventDefault();
            }
        });
        
        // 错误处理
        try {
        } catch(e) {
            console.error("游戏错误:", e);
        }
        </script>
