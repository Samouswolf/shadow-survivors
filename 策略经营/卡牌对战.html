<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>卡牌对战</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; overflow: hidden; }
        .game-container { width: 100%; height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 10px; }
        .stat { display: flex; flex-direction: column; align-items: center; color: #fff; }
        .stat-label { font-size: 12px; opacity: 0.8; }
        .stat-value { font-size: 24px; font-weight: bold; }
        
        .battlefield { flex: 1; display: flex; flex-direction: column; padding: 15px; }
        .enemy-area { flex: 1; background: rgba(255,0,0,0.1); border-radius: 15px; margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 10px; padding: 15px; align-content: center; }
        .player-area { flex: 1; background: rgba(0,255,0,0.1); border-radius: 15px; display: flex; flex-wrap: wrap; gap: 10px; padding: 15px; align-content: center; }
        
        .card { width: 70px; height: 100px; background: linear-gradient(135deg, #4a5568, #2d3748); border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; border: 2px solid #718096; transition: all 0.3s; }
        .card:hover { transform: translateY(-5px); border-color: #ffd700; }
        .card.selected { border-color: #4ecdc4; box-shadow: 0 0 15px rgba(78, 205, 196, 0.5); }
        .card.enemy { background: linear-gradient(135deg, #742a2a, #4a1a1a); }
        .card-icon { font-size: 28px; }
        .card-name { font-size: 10px; color: #fff; text-align: center; }
        .card-stats { font-size: 10px; color: #ccc; }
        
        .energy-bar { display: flex; gap: 5px; margin-bottom: 10px; }
        .energy { width: 30px; height: 30px; background: #3b82f6; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: bold; }
        
        .actions { display: flex; gap: 10px; justify-content: center; }
        .btn { padding: 12px 30px; border: none; border-radius: 25px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #4ecdc4, #44a08d); color: #fff; }
        .btn-danger { background: linear-gradient(135deg, #ff6b6b, #ee5a5a); color: #fff; }
        
        .message { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); color: #fff; padding: 20px 40px; border-radius: 15px; font-size: 20px; display: none; z-index: 100; }
        .message.show { display: block; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 10px; font-size: 14px; }
    /* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */
/* [BATCH-FIX:ad-components-css] */
.sponsor-btn{position:fixed;bottom:8px;left:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:2px 6px;border-radius:10px;font:10px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.sponsor-panel.show{display:flex}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.interstitial-ad.show{display:flex}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* [/BATCH-FIX:ad-components-css] */

/* [AD-FIX:responsive] */
@media (max-width:768px){.ad-banner-container{display:none!important}.sponsor-btn{transform:scale(.8);opacity:.6}}
/* [/AD-FIX:responsive] */
</style>
</head>
<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">我方HP</div>
                <div class="stat-value" id="playerHp">30</div>
            </div>
            <div class="stat">
                <div class="stat-label">敌方HP</div>
                <div class="stat-value" id="enemyHp">30</div>
            </div>
            <div class="stat">
                <div class="stat-label">回合</div>
                <div class="stat-value" id="turn">1</div>
            </div>
        </div>
        
        <div class="energy-bar" id="playerEnergy"></div>
        
        <div class="battlefield">
            <div class="enemy-area" id="enemyCards"></div>
            <div class="player-area" id="playerCards"></div>
        </div>
        
        <div class="actions">
            <button class="btn btn-primary" id="btnPlay">🎮 出牌</button>
            <button class="btn btn-danger" id="btnEnd">⏭️ 结束回合</button>
        </div>
        
        <div class="message" id="message"></div>
        
        
    </div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script>
        const ALL_CARDS = [
            { id: 'c1', emoji: '⚔️', name: '战士', cost: 1, attack: 3, hp: 2 },
            { id: 'c2', emoji: '🏹', name: '弓箭手', cost: 2, attack: 4, hp: 2 },
            { id: 'c3', emoji: '🧙', name: '法师', cost: 3, attack: 5, hp: 3 },
            { id: 'c4', emoji: '🛡️', name: '守卫', cost: 2, attack: 1, hp: 5 },
            { id: 'c5', emoji: '🐉', name: '巨龙', cost: 5, attack: 6, hp: 6 },
            { id: 'c6', emoji: '💀', name: '骷髅', cost: 1, attack: 2, hp: 1 },
            { id: 'c7', emoji: '🦇', name: '蝙蝠', cost: 1, attack: 1, hp: 2 },
            { id: 'c8', emoji: '👹', name: '巨魔', cost: 4, attack: 4, hp: 5 },
            { id: 'c9', emoji: '✨', name: '精灵', cost: 3, attack: 3, hp: 4 },
            { id: 'c10', emoji: '🔮', name: '巫师', cost: 4, attack: 5, hp: 4 }
        ];
        
        let playerHp = 30;
        let enemyHp = 30;
        let turn = 1;
        let energy = 3;
        let maxEnergy = 3;
        
        let playerHand = [];
        let enemyHand = [];
        let selectedCard = null;
        
        function drawCards(count = 3) {
            for (let i = 0; i < count; i++) {
                const randomCard = { ...ALL_CARDS[Math.floor(Math.random() * ALL_CARDS.length)] };
                playerHand.push({ ...randomCard, uid: 'p' + Date.now() + i });
            }
        }
        
        function drawEnemyCards(count = 3) {
            for (let i = 0; i < count; i++) {
                const randomCard = { ...ALL_CARDS[Math.floor(Math.random() * ALL_CARDS.length)] };
                enemyHand.push({ ...randomCard, uid: 'e' + Date.now() + i });
            }
        }
        
        function renderCards() {
            const enemyArea = document.getElementById('enemyCards');
            const playerArea = document.getElementById('playerCards');
            
            enemyArea.innerHTML = '';
            enemyHand.forEach(card => {
                const el = document.createElement('div');
                el.className = 'card enemy';
                el.innerHTML = `
                    <div class="card-icon">${card.emoji}</div>
                    <div class="card-name">${card.name}</div>
                    <div class="card-stats">⚔️${card.attack} ❤️${card.hp}</div>
                `;
                enemyArea.appendChild(el);
            });
            
            playerArea.innerHTML = '';
            playerHand.forEach(card => {
                const el = document.createElement('div');
                el.className = `card ${selectedCard === card.uid ? 'selected' : ''}`;
                el.innerHTML = `
                    <div style="font-size: 12px; color: #3b82f6; position: absolute; top: 5px; left: 5px;">${card.cost}</div>
                    <div class="card-icon">${card.emoji}</div>
                    <div class="card-name">${card.name}</div>
                    <div class="card-stats">⚔️${card.attack} ❤️${card.hp}</div>
                `;
                el.onclick = () => selectCard(card.uid);
                playerArea.appendChild(el);
            });
        }
        
        function renderEnergy() {
            const bar = document.getElementById('playerEnergy');
            bar.innerHTML = '';
            for (let i = 0; i < maxEnergy; i++) {
                const el = document.createElement('div');
                el.className = 'energy';
                el.style.background = i < energy ? '#3b82f6' : '#4a5568';
                el.textContent = i < energy ? '⚡' : '';
                bar.appendChild(el);
            }
        }
        
        function selectCard(uid) {
            selectedCard = selectedCard === uid ? null : uid;
            renderCards();
        }
        
        function playCard() {
            if (!selectedCard) {
                showMessage('请选择一张卡牌！');
                return;
            }
            
            const card = playerHand.find(c => c.uid === selectedCard);
            if (!card) return;
            
            if (card.cost > energy) {
                showMessage('能量不足！');
                return;
            }
            
            energy -= card.cost;
            playerHand = playerHand.filter(c => c.uid !== selectedCard);
            
            enemyHp -= card.attack;
            
            renderCards();
            renderEnergy();
            updateStats();
            
            showMessage(`打出${card.name}，造成${card.attack}点伤害！`);
            selectedCard = null;
            
            if (enemyHp <= 0) {
                showMessage('胜利！');
                setTimeout(() => resetGame(), 2000);
            }
        }
        
        function enemyTurn() {
            showMessage('敌方回合...');
            
            setTimeout(() => {
                const playable = enemyHand.filter(c => c.cost <= maxEnergy);
                if (playable.length > 0) {
                    const card = playable[Math.floor(Math.random() * playable.length)];
                    enemyHp -= card.attack;
                    enemyHand = enemyHand.filter(c => c.uid !== card.uid);
                    
                    showMessage(`敌方打出${card.name}，造成${card.attack}点伤害！`);
                }
                
                turn++;
                maxEnergy = Math.min(10, maxEnergy + 1);
                energy = maxEnergy;
                
                drawCards(2);
                drawEnemyCards(2);
                
                renderCards();
                renderEnergy();
                updateStats();
                
                if (enemyHp <= 0) {
                    showMessage('胜利！');
                    setTimeout(() => resetGame(), 2000);
                }
            }, 1500);
        }
        
        function updateStats() {
            document.getElementById('playerHp').textContent = playerHp;
            document.getElementById('enemyHp').textContent = enemyHp;
            document.getElementById('turn').textContent = turn;
        }
        
        function resetGame() {
            playerHp = 30;
            enemyHp = 30;
            turn = 1;
            energy = 3;
            maxEnergy = 3;
            playerHand = [];
            enemyHand = [];
            selectedCard = null;
            
            drawCards(4);
            drawEnemyCards(4);
            
            renderCards();
            renderEnergy();
            updateStats();
        }
        
        function showMessage(msg) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 2000);
        }
        
        document.getElementById('btnPlay').addEventListener('click', playCard);
        document.getElementById('btnEnd').addEventListener('click', enemyTurn);
        
        resetGame();
    </script>
<!-- [BATCH-FIX:responsive-js] -->
<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>
<!-- [/BATCH-FIX:responsive-js] -->
<!-- [BATCH-FIX:touch-support] -->
<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>
<!-- [/BATCH-FIX:touch-support] -->

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
