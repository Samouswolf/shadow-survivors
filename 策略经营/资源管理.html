<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资源管理</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden}
canvas{image-rendering:pixelated;border:2px solid #4a9eff;cursor:pointer;max-width:100%;height:auto}
</style>
<style>/* 游戏工坊广告系统 */
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);height:90px;max-height:90px;overflow:hidden;contain:layout style paint;pointer-events:none!important}.ad-banner-container,.ad-banner-container *{pointer-events:none!important}.ad-banner-container iframe{max-height:90px;pointer-events:none!important}
.ad-banner-container iframe{max-width:100%}
.ad-label{position:absolute;top:1px;right:6px;font:9px "Microsoft YaHei",sans-serif;color:rgba(255,255,255,.35)}
.sponsor-btn{position:fixed;top:44px;right:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:3px 9px;border-radius:10px;font:11px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .qr-row{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.sponsor-panel .qr-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px;text-align:center;min-width:140px}
.sponsor-panel .qr-card .qr-icon{font-size:48px;margin-bottom:6px}
.sponsor-panel .qr-card .qr-label{color:#ccc;font:13px "Microsoft YaHei",sans-serif}
.sponsor-panel .qr-card .qr-hint{color:#888;font:11px "Microsoft YaHei",sans-serif;margin-top:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.interstitial-ad .ad-content{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;text-align:center;min-width:280px;max-width:400px}
.interstitial-ad .ad-content p{color:#aaa;font:14px "Microsoft YaHei",sans-serif;margin-bottom:12px}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
</style>

  <!-- [BUGFIX ad-pointer-v1] 广告关闭按钮指针事件补偿 -->
  <style>
    /* GameMonetize赞助面板关闭按钮 */
    .sponsor-close, #sponsorClose { pointer-events: auto !important; }
    /* GameMonetize插屏跳过按钮 */
    .skip-btn, #skipInterstitial { pointer-events: auto !important; }
  </style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="startScreen" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#0a0a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000">
  <h1 style="font-size:48px;color:#4a9eff;margin-bottom:10px">资源管理</h1>
  <p style="color:#8af;margin-bottom:5px">收集资源 · 建造设施 · 平衡发展</p>
  <p id="highScoreText" style="color:#666;margin-bottom:30px"></p>
  <button id="startBtn" style="padding:15px 60px;font-size:20px;background:linear-gradient(135deg,#2196F3,#4a9eff);color:#fff;border:none;border-radius:12px;cursor:pointer;margin-bottom:15px">开始游戏</button>
  <div style="color:#556;margin-top:20px;font-size:13px;text-align:center;line-height:1.8">
    <div>WASD/方向键:移动 | 空格:采集/建造</div>
    <div>1-5:选择设施 | P/ESC:暂停 | 鼠标/触屏可点击</div>
  </div>
</div>
<button id="pauseBtn" style="position:fixed;top:10px;right:10px;width:44px;height:44px;font-size:20px;background:rgba(0,0,0,0.5);color:#fff;border:1px solid rgba(255,255,255,0.3);border-radius:8px;z-index:100;display:none">||</button>
<div id="pauseScreen" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);flex-direction:column;align-items:center;justify-content:center;z-index:999">
  <h2 style="color:#fff;margin-bottom:30px">游戏暂停</h2>
  <button id="resumeBtn" style="padding:12px 40px;font-size:18px;background:#4a9eff;color:#fff;border:none;border-radius:8px;margin-bottom:15px">继续游戏</button>
  <button id="restartBtn2" style="padding:12px 40px;font-size:18px;background:#666;color:#fff;border:none;border-radius:8px">重新开始</button>
</div>

  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script>
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
const W=800,H=600;
canvas.width=W;canvas.height=H;

function resizeCanvas(){
    const mw=window.innerWidth-20;
    if(W>mw){canvas.style.width=mw+'px';canvas.style.height=(H*mw/W)+'px'}
    else{canvas.style.width='';canvas.style.height=''}
}
window.addEventListener('resize',resizeCanvas);
resizeCanvas();

// roundRect polyfill
if(!ctx.roundRect){
    CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
        if(typeof r==='number')r=[r,r,r,r];
        this.moveTo(x+r[0],y);this.lineTo(x+w-r[1],y);
        this.arcTo(x+w,y,x+w,y+r[1],r[1]);this.lineTo(x+w,y+h-r[2]);
        this.arcTo(x+w,y+h,x+w-r[2],y+h,r[2]);this.lineTo(x+r[3],y+h);
        this.arcTo(x,y+h,x,y+h-r[3],r[3]);this.lineTo(x,y+r[0]);
        this.arcTo(x,y,x+r[0],y,r[0]);this.closePath()
    };
}

// === Audio ===
let audioCtx=null;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
function playTone(f,d,t='sine',v=0.3){
    if(!audioCtx)return;
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d);
    o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)
}
function sfxCollect(){playTone(800,0.1);setTimeout(()=>playTone(1000,0.08),60)}
function sfxBuild(){playTone(400,0.15);setTimeout(()=>playTone(600,0.12),100);setTimeout(()=>playTone(800,0.1),200)}
function sfxUpgrade(){playTone(500,0.1);setTimeout(()=>playTone(700,0.1),100);setTimeout(()=>playTone(900,0.1),200);setTimeout(()=>playTone(1100,0.15),300)}
function sfxError(){playTone(200,0.2,'sawtooth',0.2)}
function sfxGoal(){playTone(600,0.15);setTimeout(()=>playTone(800,0.15),150);setTimeout(()=>playTone(1000,0.15),300);setTimeout(()=>playTone(1200,0.2),450)}
function sfxClick(){playTone(600,0.05,'square',0.15)}

// === Constants ===
const TILE=40;
const COLS=20,ROWS=15;
const WORLD_W=COLS*TILE,WORLD_H=ROWS*TILE;

const RESOURCE_TYPES=[
    {name:'木材',color:'#8B5E3C',icon:'T',respawn:300},
    {name:'石头',color:'#888',icon:'S',respawn:450},
    {name:'铁矿',color:'#c44',icon:'F',respawn:600},
    {name:'金矿',color:'#fc0',icon:'G',respawn:900},
    {name:'宝石',color:'#f0f',icon:'B',respawn:1200}
];

const BUILDINGS=[
    {name:'木屋',cost:{wood:5},income:1,desc:'每秒+1木材',effect:'wood',rate:1,color:'#a67c52'},
    {name:'石窑',cost:{wood:3,stone:5},income:1,desc:'每秒+1石头',effect:'stone',rate:1,color:'#999'},
    {name:'铁匠铺',cost:{wood:5,stone:5,iron:3},income:1,desc:'每秒+1铁矿',effect:'iron',rate:1,color:'#c55'},
    {name:'金矿场',cost:{wood:8,stone:8,iron:5},income:1,desc:'每秒+1金矿',effect:'gold',rate:1,color:'#fc0'},
    {name:'宝石坊',cost:{wood:10,stone:10,iron:8,gold:5},income:1,desc:'每秒+1宝石',effect:'gem',rate:1,color:'#f0f'}
];

const GOAL_SCORE=5000;

// Trading system
const TRADES=[
    {give:{wood:10},get:{stone:3},name:'木换石'},
    {give:{stone:8},get:{iron:3},name:'石换铁'},
    {give:{iron:5},get:{gold:2},name:'铁换金'},
    {give:{gold:3},get:{gem:1},name:'金换宝'},
    {give:{wood:20,stone:10},get:{gold:5},name:'综合交易'}
];

// Achievements
const ACHIEVEMENTS=[
    {id:'first_collect',name:'初学者',desc:'收集第一个资源',check:()=>G.totalCollected>=1},
    {id:'collector_50',name:'收集达人',desc:'收集50个资源',check:()=>G.totalCollected>=50},
    {id:'collector_200',name:'收集大师',desc:'收集200个资源',check:()=>G.totalCollected>=200},
    {id:'first_build',name:'建造者',desc:'建造第一个设施',check:()=>G.totalBuilt>=1},
    {id:'builder_10',name:'建筑师',desc:'建造10个设施',check:()=>G.totalBuilt>=10},
    {id:'score_1000',name:'千分达成',desc:'分数达到1000',check:()=>G.score>=1000},
    {id:'score_3000',name:'三千分',desc:'分数达到3000',check:()=>G.score>=3000},
    {id:'all_resources',name:'资源大亨',desc:'所有资源各拥有20以上',check:()=>Object.values(G.inv).every(v=>v>=20)},
    {id:'win',name:'胜利者',desc:'达成目标分数',check:()=>G.score>=GOAL_SCORE},
    {id:'speed_win',name:'闪电战',desc:'3分钟内达成目标',check:()=>G.score>=GOAL_SCORE&&G.tick<10800}
];

// Day/Night cycle
const DAY_LENGTH=3600; // ticks per full cycle

// Weather types
const WEATHER_TYPES=[
    {name:'晴天',color:'rgba(255,255,200,0.05)',resBonus:0},
    {name:'雨天',color:'rgba(100,100,255,0.1)',resBonus:0.3},
    {name:'风暴',color:'rgba(100,50,50,0.15)',resBonus:-0.2},
    {name:'彩虹',color:'rgba(255,200,255,0.08)',resBonus:0.5}
];

// === Game State ===
let G={resources:[],buildings:[],particles:[],floatTexts:[],inv:{wood:0,stone:0,iron:0,gold:0,gem:0},keys:{},unlockedAchievements:[],notifications:[]};
function resetGame(){
    G={
        state:'menu', // menu,play,pause,over
        tick:0,
        score:0,
        highScore:parseInt(localStorage.getItem('resource_mgr_hs'))||0,
        // Player
        px:WORLD_W/2,py:WORLD_H/2,ps:3,pdir:0,
        // Resources on map [x,y,type,alive,respawnTimer]
        resources:[],
        // Buildings placed [x,y,type,level]
        buildings:[],
        // Inventory
        inv:{wood:0,stone:0,iron:0,gold:0,gem:0},
        // Selected building index (-1=none)
        selectedBuild:-1,
        // Camera
        camX:0,camY:0,
        // Input
        keys:{},
        // Particles
        particles:[],
        // Floating texts
        floatTexts:[],
        // Timer for resource generation
        genTimer:0,
        // Achievement
        totalCollected:0,
        totalBuilt:0,
        unlockedAchievements:[],
        achievementPopup:null,
        achievementPopupTimer:0,
        // UI
        showBuildMenu:false,
        showInventory:false,
        showTrades:false,
        showAchievements:false,
        lastTime:0,
        dt:0,
        paused:false,
        // Day/Night
        dayTime:0,
        // Weather
        weather:0,
        weatherTimer:0,
        weatherDuration:600,
        // Trade cooldown
        tradeCooldown:0,
        // Mini-map
        showMiniMap:true,
        // Stats
        totalTrades:0,
        maxScore:0,
        // Combo system for collecting
        comboCount:0,
        comboTimer:0,
        // Tutorial
        tutorialStep:0,
        tutorialDone:false,
        // Notifications
        notifications:[]
    };
    spawnResources();
    G.weather=Math.floor(Math.random()*WEATHER_TYPES.length);
    G.weatherDuration=600+Math.random()*600;
}

function spawnResources(){
    G.resources=[];
    for(let i=0;i<60;i++){
        let type=Math.floor(Math.random()*5);
        // More common resources spawn more
        if(type>=3&&Math.random()>0.4)type=Math.floor(Math.random()*3);
        let x,y,valid;
        do{
            valid=true;
            x=Math.floor(Math.random()*COLS)*TILE+TILE/2;
            y=Math.floor(Math.random()*ROWS)*TILE+TILE/2;
            // Don't spawn on center (player start)
            if(Math.abs(x-WORLD_W/2)<80&&Math.abs(y-WORLD_H/2)<80)valid=false;
            // Don't overlap
            for(let r of G.resources){
                if(Math.abs(r.x-x)<TILE&&Math.abs(r.y-y)<TILE){valid=false;break}
            }
        }while(!valid);
        G.resources.push({x,y,type,alive:true,respawn:0});
    }
}

// === Input ===
const keys={};
window.addEventListener('keydown',e=>{
    keys[e.key]=true;
    if(G.state==='play'&&(e.key==='p'||e.key==='P'||e.key==='Escape')){
        togglePause();e.preventDefault()
    }
    if(G.state==='play'&&e.key>='1'&&e.key<='5'){
        let idx=parseInt(e.key)-1;
        G.selectedBuild=G.selectedBuild===idx?-1:idx;
        sfxClick();e.preventDefault()
    }
    if(G.state==='play'&&e.key===' '){
        doAction();e.preventDefault()
    }
    if(G.state==='play'&&(e.key==='t'||e.key==='T')){
        G.showTrades=!G.showTrades;sfxClick();e.preventDefault()
    }
    if(G.state==='play'&&(e.key==='m'||e.key==='M')){
        G.showMiniMap=!G.showMiniMap;sfxClick();e.preventDefault()
    }
    // Number keys 6-0 for trades
    if(G.state==='play'&&G.showTrades&&e.key>='6'&&e.key<='0'){
        const tIdx=parseInt(e.key)-6;
        if(tIdx>=0&&tIdx<TRADES.length){doTrade(tIdx);e.preventDefault()}
    }
});
window.addEventListener('keyup',e=>{keys[e.key]=false});

// Mouse/Touch
let mouseX=0,mouseY=0;
canvas.addEventListener('mousemove',e=>{
    const r=canvas.getBoundingClientRect();
    mouseX=(e.clientX-r.left)*W/r.width;
    mouseY=(e.clientY-r.top)*H/r.height;
});
canvas.addEventListener('click',e=>{
    initAudio();
    const r=canvas.getBoundingClientRect();
    const cx=(e.clientX-r.left)*W/r.width;
    const cy=(e.clientY-r.top)*H/r.height;
    handleClick(cx,cy);
});
canvas.addEventListener('touchstart',e=>{
    initAudio();
    const r=canvas.getBoundingClientRect();
    const t=e.touches[0];
    const cx=(t.clientX-r.left)*W/r.width;
    const cy=(t.clientY-r.top)*H/r.height;
    handleClick(cx,cy);
    e.preventDefault();
},{passive:false});

function handleClick(cx,cy){
    if(G.state!=='play')return;
    // Check build menu buttons
    if(G.showBuildMenu){
        for(let i=0;i<BUILDINGS.length;i++){
            const bx=10,by=H-260+i*48;
            if(cx>=bx&&cx<=bx+180&&cy>=by&&cy<=by+44){
                G.selectedBuild=G.selectedBuild===i?-1:i;
                sfxClick();return;
            }
        }
    }
    // Click on world = move player there / interact
    const wx=cx+G.camX,wy=cy+G.camY;
    // Check if near resource -> collect
    for(let r of (G.resources||[])){
        if(!r.alive)continue;
        const dx=r.x-wx,dy=r.y-wy;
        if(Math.abs(dx)<TILE&&Math.abs(dy)<TILE){
            // Move player toward it
            const pdx=r.x-G.px,pdy=r.y-G.py;
            if(Math.sqrt(pdx*pdx+pdy*pdy)<TILE*2){
                collectResource(r);return;
            }
        }
    }
    // Check if clicking on existing building (upgrade)
    for(let bl of (G.buildings||[])){
        if(Math.abs(bl.x-wx)<TILE/2&&Math.abs(bl.y-wy)<TILE/2){
            upgradeBuilding(bl);return;
        }
    }
    // Check if placing building
    if(G.selectedBuild>=0){
        const bx=Math.floor(wx/TILE)*TILE+TILE/2;
        const by=Math.floor(wy/TILE)*TILE+TILE/2;
        placeBuilding(bx,by);return;
    }
    // Check trade panel clicks
    if(G.showTrades){
        const tpx=220,tpy=H-270;
        for(let i=0;i<TRADES.length;i++){
            const ty=tpy+35+i*42;
            if(cx>=tpx+5&&cx<=tpx+235&&cy>=ty&&cy<=ty+38){
                doTrade(i);return;
            }
        }
    }
}

// === Game Logic ===
function doAction(){
    if(G.state!=='play')return;
    // Try collect nearest resource
    let nearest=null,nd=Infinity;
    for(let r of (G.resources||[])){
        if(!r.alive)continue;
        const d=Math.sqrt((r.x-G.px)**2+(r.y-G.py)**2);
        if(d<nd){nd=d;nearest=r}
    }
    if(nearest&&nd<TILE*2.5){
        collectResource(nearest);return;
    }
    // Try place building
    if(G.selectedBuild>=0){
        const bx=Math.floor(G.px/TILE)*TILE+TILE/2;
        const by=Math.floor(G.py/TILE)*TILE+TILE/2;
        placeBuilding(bx,by);
    }
}

function collectResource(r){
    if(!r.alive)return;
    const res=RESOURCE_TYPES[r.type];
    if(!res)return;
    const key=['wood','stone','iron','gold','gem'][r.type];
    // Combo system
    G.comboCount++;
    G.comboTimer=120; // 2 second combo window
    const comboMult=Math.min(5,1+Math.floor(G.comboCount/5)*0.5);
    const amount=Math.ceil(1*comboMult);
    G.inv[key]+=amount;
    G.score+=Math.floor(10*(r.type+1)*comboMult);
    G.totalCollected++;
    r.alive=false;
    r.respawn=res.respawn;
    sfxCollect();
    const comboText=G.comboCount>1?' (x'+G.comboCount+')':'';
    addFloatText(r.x,r.y-10,'+'+amount+' '+res.name+comboText,res.color);
    addParticle(r.x,r.y,res.color,8+G.comboCount);
}

function placeBuilding(bx,by){
    const b=BUILDINGS[G.selectedBuild];
    if(!b)return;
    // Check cost
    for(let k in b.cost){
        if((G.inv[k]||0)<b.cost[k]){sfxError();addFloatText(G.px,G.px-30,'资源不足!','#f44');return}
    }
    // Check overlap
    for(let bl of (G.buildings||[])){
        if(bl.x===bx&&bl.y===by){sfxError();return}
    }
    // Check on resource
    for(let r of (G.resources||[])){
        if(r.alive&&Math.abs(r.x-bx)<TILE&&Math.abs(r.y-by)<TILE){sfxError();return}
    }
    // Pay cost
    for(let k in b.cost)G.inv[k]-=b.cost[k];
    G.buildings.push({x:bx,y:by,type:G.selectedBuild,level:1,prodTimer:0});
    G.totalBuilt++;
    G.score+=50*(G.selectedBuild+1);
    sfxBuild();
    addFloatText(bx,by-20,b.name+' 建造完成!','#4f4');
    addParticle(bx,by,'#4f4',12);
}

function upgradeBuilding(bl){
    const b=BUILDINGS[bl.type];
    if(!b||bl.level>=3)return;
    const mult=bl.level*2;
    const cost={};
    for(let k in b.cost)cost[k]=b.cost[k]*mult;
    for(let k in cost){
        if((G.inv[k]||0)<cost[k]){sfxError();addFloatText(G.px,G.py-30,'升级资源不足!','#f44');return}
    }
    for(let k in cost)G.inv[k]-=cost[k];
    bl.level++;
    bl.prodTimer=0;
    G.score+=100*bl.level;
    sfxUpgrade();
    addFloatText(bl.x,bl.y-20,'升级到 Lv'+bl.level+'!','#ff0');
    addParticle(bl.x,bl.y,'#ff0',15);
    addNotification('升级完成: '+b.name+' Lv'+bl.level,'#ff0');
}

function doTrade(idx){
    if(G.tradeCooldown>0||idx>=TRADES.length)return;
    const trade=TRADES[idx];
    // Check give
    for(let k in trade.give){
        if((G.inv[k]||0)<trade.give[k]){sfxError();addNotification('交易失败: 资源不足','#f44');return}
    }
    // Execute trade
    for(let k in trade.give)G.inv[k]-=trade.give[k];
    for(let k in trade.get)G.inv[k]=(G.inv[k]||0)+trade.get[k];
    G.tradeCooldown=60;
    G.totalTrades++;
    G.score+=20;
    sfxCollect();
    addNotification('交易成功: '+trade.name,'#4f4');
    addFloatText(G.px,G.py-40,'交易完成!','#4f4');
}

function addNotification(text,color='#fff'){
    if(!G.notifications)G.notifications=[];
    G.notifications.push({text,color,life:180,maxLife:180});
    if(G.notifications.length>5)G.notifications.shift();
}

function checkAchievements(){
    if(!G.unlockedAchievements)G.unlockedAchievements=[];
    for(let a of ACHIEVEMENTS){
        if(G.unlockedAchievements.includes(a.id))continue;
        if(a.check()){
            G.unlockedAchievements.push(a.id);
            G.score+=200;
            G.achievementPopup=a;
            G.achievementPopupTimer=180;
            sfxGoal();
            addNotification('成就解锁: '+a.name,'#fc0');
        }
    }
}

// === Particles ===
function addParticle(x,y,color,count){
    if(!G.particles)G.particles=[];
    for(let i=0;i<count;i++){
        const angle=Math.random()*Math.PI*2;
        const spd=1+Math.random()*3;
        G.particles.push({x,y,vx:Math.cos(angle)*spd,vy:Math.sin(angle)*spd,
            life:30+Math.random()*20,maxLife:50,color,size:2+Math.random()*3})
    }
}
function addFloatText(x,y,text,color){
    if(!G.floatTexts)G.floatTexts=[];
    G.floatTexts.push({x,y,text,color,life:60,maxLife:60});
}

// === Update ===
function update(dt){
    if(G.state!=='play')return;
    G.tick++;

    // Player movement
    let dx=0,dy=0;
    if(keys['w']||keys['W']||keys['ArrowUp'])dy=-1;
    if(keys['s']||keys['S']||keys['ArrowDown'])dy=1;
    if(keys['a']||keys['A']||keys['ArrowLeft'])dx=-1;
    if(keys['d']||keys['D']||keys['ArrowRight'])dx=1;
    if(dx||dy){
        const len=Math.sqrt(dx*dx+dy*dy);
        G.px+=dx/len*G.ps;G.py+=dy/len*G.ps;
        G.px=Math.max(10,Math.min(WORLD_W-10,G.px));
        G.py=Math.max(10,Math.min(WORLD_H-10,G.py));
        G.pdir=Math.atan2(dy,dx);
    }

    // Camera
    G.camX=G.px-W/2;G.camY=G.py-H/2;
    G.camX=Math.max(0,Math.min(WORLD_W-W,G.camX));
    G.camY=Math.max(0,Math.min(WORLD_H-H,G.camY));

    // Day/Night cycle
    G.dayTime=(G.dayTime+1)%DAY_LENGTH;

    // Weather system
    G.weatherTimer++;
    if(G.weatherTimer>=G.weatherDuration){
        G.weatherTimer=0;
        G.weather=Math.floor(Math.random()*WEATHER_TYPES.length);
        G.weatherDuration=600+Math.random()*600;
        const wt=WEATHER_TYPES[G.weather];
        if(wt)addNotification('天气变化: '+wt.name,wt.color);
    }

    // Combo timer
    if(G.comboTimer>0){
        G.comboTimer--;
        if(G.comboTimer<=0)G.comboCount=0;
    }

    // Trade cooldown
    if(G.tradeCooldown>0)G.tradeCooldown--;

    // Resource respawn (affected by weather)
    const weatherBonus=(WEATHER_TYPES[G.weather]||WEATHER_TYPES[0]).resBonus;
    if(G.resources){
        for(let r of G.resources){
            if(!r.alive){
                const speedMod=weatherBonus>=0?1+weatherBonus:1/(1+Math.abs(weatherBonus));
                r.respawn-=speedMod;
                if(r.respawn<=0)r.alive=true;
            }
        }
    }

    // Building production
    if(G.buildings){
        for(let bl of G.buildings){
            bl.prodTimer++;
            const rate=Math.max(30,120-bl.level*30);
            if(bl.prodTimer>=rate){
                bl.prodTimer=0;
                const bld=BUILDINGS[bl.type];
                if(!bld)continue;
                const key=bld.effect;
                const prodAmount=bl.level;
                G.inv[key]=(G.inv[key]||0)+prodAmount;
                G.score+=prodAmount*5;
                const resIdx=['wood','stone','iron','gold','gem'].indexOf(key);
                if(resIdx>=0&&RESOURCE_TYPES[resIdx]){
                    addFloatText(bl.x,bl.y-15,'+'+prodAmount+' '+RESOURCE_TYPES[resIdx].name,RESOURCE_TYPES[resIdx].color);
                }
            }
        }
    }

    // Passive score from total resources
    if(G.tick%60===0){
        const totalRes=Object.values(G.inv).reduce((a,b)=>a+b,0);
        G.score+=Math.floor(totalRes/10);
    }

    // Check achievements
    if(G.tick%30===0)checkAchievements();

    // Particles
    if(G.particles){
        for(let i=G.particles.length-1;i>=0;i--){
            const p=G.particles[i];
            p.x+=p.vx;p.y+=p.vy;p.vy+=0.05;p.life--;
            if(p.life<=0)G.particles.splice(i,1);
        }
    }

    // Float texts
    if(G.floatTexts){
        for(let i=G.floatTexts.length-1;i>=0;i--){
            G.floatTexts[i].y-=0.5;G.floatTexts[i].life--;
            if(G.floatTexts[i].life<=0)G.floatTexts.splice(i,1);
        }
    }

    // Score goal check
    if(G.score>=GOAL_SCORE){
        gameOver(true);
    }

    // Passive score from total resources
    if(G.tick%60===0){
        const totalRes=Object.values(G.inv).reduce((a,b)=>a+b,0);
        G.score+=Math.floor(totalRes/10);
    }

    // Tutorial progression
    if(!G.tutorialDone){
        if(G.tutorialStep===0&&(keys['w']||keys['a']||keys['s']||keys['d']||keys['ArrowUp']||keys['ArrowDown']||keys['ArrowLeft']||keys['ArrowRight'])){
            G.tutorialStep=1;addNotification('提示: 靠近资源按空格采集','#4af');
        }
        if(G.tutorialStep===1&&G.totalCollected>=1){G.tutorialStep=2;addNotification('提示: 按1-5选择设施','#4af')}
        if(G.tutorialStep===2&&G.totalBuilt>=1){G.tutorialStep=3;addNotification('提示: 按T打开交易市场','#4af')}
        if(G.tutorialStep===3&&G.totalTrades>=1){G.tutorialStep=4;addNotification('提示: 达到5000分获胜!','#4af')}
        if(G.tutorialStep===4&&G.score>=500){G.tutorialDone=true;addNotification('教程完成! 祝你好运!','#4f4')}
    }

    // Notifications update
    if(G.notifications){
        for(let i=G.notifications.length-1;i>=0;i--){
            G.notifications[i].life--;
            if(G.notifications[i].life<=0)G.notifications.splice(i,1);
        }
    }

    // Achievement popup timer
    if(G.achievementPopupTimer>0)G.achievementPopupTimer--;
}

function gameOver(won){
    G.state='over';
    if(G.score>G.highScore){
        G.highScore=G.score;
        localStorage.setItem('resource_mgr_hs',G.highScore);
    }
    if(won)sfxGoal();
}

function togglePause(){
    if(G.state==='play'){G.state='pause';G.paused=true;document.getElementById('pauseScreen').style.display='flex'}
    else if(G.state==='pause'){G.state='play';G.paused=false;document.getElementById('pauseScreen').style.display='none'}
}

// === Render ===
function render(){
    ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,W,H);

    if(G.state==='menu')return renderMenu();
    if(G.state==='over')return renderOver();

    ctx.save();
    ctx.translate(-G.camX,-G.camY);

    // Ground
    for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++){
        const x=c*TILE,y=r*TILE;
        ctx.fillStyle=(c+r)%2===0?'#2a2a3e':'#252538';
        ctx.fillRect(x,y,TILE,TILE);
    }

    // Grid lines
    ctx.strokeStyle='rgba(255,255,255,0.03)';ctx.lineWidth=1;
    for(let c=0;c<=COLS;c++){ctx.beginPath();ctx.moveTo(c*TILE,0);ctx.lineTo(c*TILE,WORLD_H);ctx.stroke()}
    for(let r=0;r<=ROWS;r++){ctx.beginPath();ctx.moveTo(0,r*TILE);ctx.lineTo(WORLD_W,r*TILE);ctx.stroke()}

    // Resources
    for(let r of (G.resources||[])){
        if(!r.alive)continue;
        const res=RESOURCE_TYPES[r.type];
        if(!res)continue;
        const pulse=1+Math.sin(G.tick*0.05+r.x)*0.1;
        // Glow
        ctx.globalAlpha=0.2;
        ctx.fillStyle=res.color;
        ctx.beginPath();ctx.arc(r.x,r.y,TILE*0.5*pulse,0,Math.PI*2);ctx.fill();
        ctx.globalAlpha=1;
        // Body
        ctx.fillStyle=res.color;
        ctx.beginPath();ctx.arc(r.x,r.y,TILE*0.3,0,Math.PI*2);ctx.fill();
        // Icon
        ctx.fillStyle='#fff';ctx.font='bold 14px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(res.icon,r.x,r.y);
    }

    // Buildings
    for(let bl of (G.buildings||[])){
        const b=BUILDINGS[bl.type];
        if(!b)continue;
        ctx.fillStyle=b.color;
        ctx.fillRect(bl.x-TILE/2+2,bl.y-TILE/2+2,TILE-4,TILE-4);
        // Level indicator
        ctx.fillStyle='#fff';ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText('Lv'+bl.level,bl.x,bl.y+TILE/2-8);
        // Building name
        ctx.font='9px monospace';ctx.fillText(b.name,bl.x,bl.y-2);
        // Production indicator
        const rate=Math.max(30,120-bl.level*30);
        const pct=bl.prodTimer/rate;
        ctx.fillStyle='rgba(0,255,0,0.5)';ctx.fillRect(bl.x-TILE/2+2,bl.y+TILE/2-4,(TILE-4)*pct,2);
    }

    // Player
    const px=G.px,py=G.py;
    // Shadow
    ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(px,py+12,10,5,0,0,Math.PI*2);ctx.fill();
    // Body
    ctx.fillStyle='#4a9eff';ctx.beginPath();ctx.arc(px,py-4,12,0,Math.PI*2);ctx.fill();
    // Eyes
    const ex=Math.cos(G.pdir)*4,ey=Math.sin(G.pdir)*4;
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(px+ex-3,py-6+ey,3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(px+ex+3,py-6+ey,3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#111';ctx.beginPath();ctx.arc(px+ex-2,py-6+ey,1.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(px+ex+4,py-6+ey,1.5,0,Math.PI*2);ctx.fill();

    // Selection indicator for build mode
    if(G.selectedBuild>=0){
        const sx=Math.floor(G.px/TILE)*TILE+TILE/2;
        const sy=Math.floor(G.py/TILE)*TILE+TILE/2;
        ctx.strokeStyle='rgba(74,158,255,0.6)';ctx.lineWidth=2;ctx.setLineDash([5,5]);
        ctx.strokeRect(sx-TILE/2,sy-TILE/2,TILE,TILE);
        ctx.setLineDash([]);
        ctx.globalAlpha=0.3;ctx.fillStyle=BUILDINGS[G.selectedBuild].color;
        ctx.fillRect(sx-TILE/2+2,sy-TILE/2+2,TILE-4,TILE-4);
        ctx.globalAlpha=1;
    }

    // Particles
    for(let p of (G.particles||[])){
        ctx.globalAlpha=p.life/p.maxLife;ctx.fillStyle=p.color;
        ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
    }
    ctx.globalAlpha=1;

    // Float texts
    for(let ft of (G.floatTexts||[])){
        ctx.globalAlpha=ft.life/ft.maxLife;
        ctx.fillStyle=ft.color;ctx.font='bold 12px monospace';ctx.textAlign='center';
        ctx.fillText(ft.text,ft.x,ft.y);
    }
    ctx.globalAlpha=1;

    // Day/Night overlay
    const dayPct=G.dayTime/DAY_LENGTH;
    const nightAlpha=dayPct<0.25?0:dayPct<0.5?(dayPct-0.25)*4*0.3:dayPct<0.75?0.3:(1-(dayPct-0.75)*4)*0.3;
    if(nightAlpha>0){
        ctx.fillStyle='rgba(0,0,40,'+nightAlpha+')';
        ctx.fillRect(G.camX,G.camY,W,H);
    }

    // Weather overlay
    const wOverlay=WEATHER_TYPES[G.weather];
    if(wOverlay){
        ctx.fillStyle=wOverlay.color;
        ctx.fillRect(G.camX,G.camY,W,H);
    }

    ctx.restore();

    // Tutorial overlay
    if(!G.tutorialDone)renderTutorial();

    // === HUD ===
    // Resource bar
    ctx.fillStyle='rgba(0,0,0,0.7)';
    ctx.beginPath();ctx.roundRect(5,5,500,36,8);ctx.fill();
    const resNames=['wood','stone','iron','gold','gem'];
    const resIcons=['T','S','F','G','B'];
    const resColors=['#8B5E3C','#888','#c44','#fc0','#f0f'];
    for(let i=0;i<5;i++){
        const rx=15+i*98;
        ctx.fillStyle=resColors[i];ctx.font='bold 14px monospace';ctx.textAlign='left';
        ctx.fillText(resIcons[i],rx,28);
        ctx.fillStyle='#fff';ctx.font='13px monospace';
        ctx.fillText(G.inv[resNames[i]]||0,rx+18,28);
    }

    // Score
    ctx.fillStyle='rgba(0,0,0,0.7)';
    ctx.beginPath();ctx.roundRect(W-200,5,195,36,8);ctx.fill();
    ctx.fillStyle='#4a9eff';ctx.font='bold 16px monospace';ctx.textAlign='right';
    ctx.fillText('分数: '+G.score+' / '+GOAL_SCORE,W-15,28);

    // Build menu
    renderBuildMenu();

    // Selected building info
    if(G.selectedBuild>=0){
        const b=BUILDINGS[G.selectedBuild];
        ctx.fillStyle='rgba(0,0,0,0.8)';
        ctx.beginPath();ctx.roundRect(W/2-120,H-50,240,40,8);ctx.fill();
        ctx.fillStyle='#4a9eff';ctx.font='bold 14px monospace';ctx.textAlign='center';
        ctx.fillText('建造: '+b.name+' [空格/点击放置]',W/2,H-26);
    }

    // Combo display
    if(G.comboCount>1){
        ctx.fillStyle='rgba(255,200,0,0.9)';ctx.font='bold 20px monospace';ctx.textAlign='center';
        ctx.fillText('连击 x'+G.comboCount,W/2,70);
    }

    // Weather indicator
    const wf=WEATHER_TYPES[G.weather];
    if(wf){
        ctx.fillStyle='rgba(0,0,0,0.6)';
        ctx.beginPath();ctx.roundRect(W/2-60,46,120,24,6);ctx.fill();
        ctx.fillStyle='#aaa';ctx.font='12px monospace';ctx.textAlign='center';
        ctx.fillText(wf.name+' '+(wf.resBonus>0?'+':'')+Math.round(wf.resBonus*100)+'%资源',W/2,63);
    }

    // Day/Night indicator
    const dayPhase=G.dayTime/DAY_LENGTH;
    const phaseName=dayPhase<0.25?'清晨':dayPhase<0.5?'白天':dayPhase<0.75?'傍晚':'夜晚';
    ctx.fillStyle='rgba(0,0,0,0.6)';
    ctx.beginPath();ctx.roundRect(W-120,46,115,24,6);ctx.fill();
    ctx.fillStyle=dayPhase<0.5?'#fc0':'#448';ctx.font='12px monospace';ctx.textAlign='right';
    ctx.fillText(phaseName,W-12,63);

    // Mini-map
    if(G.showMiniMap)renderMiniMap();

    // Notifications
    for(let i=0;i<(G.notifications?G.notifications.length:0);i++){
        const n=G.notifications[i];
        const alpha=Math.min(1,n.life/30);
        ctx.globalAlpha=alpha;
        ctx.fillStyle='rgba(0,0,0,0.7)';
        ctx.beginPath();ctx.roundRect(W/2-130,80+i*28,260,24,6);ctx.fill();
        ctx.fillStyle=n.color;ctx.font='12px monospace';ctx.textAlign='center';
        ctx.fillText(n.text,W/2,96+i*28);
    }
    ctx.globalAlpha=1;

    // Achievement popup
    if(G.achievementPopupTimer>0){
        const a=G.achievementPopup;
        const alpha=Math.min(1,G.achievementPopupTimer/30);
        const yOff=G.achievementPopupTimer>150?(180-G.achievementPopupTimer)*3:0;
        ctx.globalAlpha=alpha;
        ctx.fillStyle='rgba(0,0,0,0.85)';
        ctx.beginPath();ctx.roundRect(W/2-140,140+yOff,280,60,10);ctx.fill();
        ctx.strokeStyle='#fc0';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(W/2-140,140+yOff,280,60,10);ctx.stroke();
        ctx.fillStyle='#fc0';ctx.font='bold 14px monospace';ctx.textAlign='center';
        ctx.fillText('成就解锁!',W/2,162+yOff);
        ctx.fillStyle='#fff';ctx.font='13px monospace';
        ctx.fillText(a.name+' - '+a.desc,W/2,185+yOff);
        ctx.globalAlpha=1;
    }

    // Inventory panel toggle hint
    ctx.fillStyle='rgba(0,0,0,0.5)';
    ctx.beginPath();ctx.roundRect(W-90,H-30,85,25,6);ctx.fill();
    ctx.fillStyle='#888';ctx.font='11px monospace';ctx.textAlign='center';
    ctx.fillText('[I]背包 [T]交易 [M]地图',W-48,H-13);

    // Trade panel
    if(G.showTrades)renderTradePanel();

    // Pause overlay
    if(G.state==='pause'){
        ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,W,H);
        ctx.fillStyle='#fff';ctx.font='bold 36px monospace';ctx.textAlign='center';
        ctx.fillText('暂停',W/2,H/2);
        ctx.font='16px monospace';
        ctx.fillText('按 P/ESC 继续',W/2,H/2+40);
    }
}

function renderMiniMap(){
    const mmW=120,mmH=90;
    const mmX=W-mmW-10,mmY=H-mmH-40;
    ctx.fillStyle='rgba(0,0,0,0.7)';
    ctx.beginPath();ctx.roundRect(mmX-2,mmY-2,mmW+4,mmH+4,6);ctx.fill();
    // Scale
    const sx=mmW/WORLD_W,sy=mmH/WORLD_H;
    // Resources on minimap
    for(let r of (G.resources||[])){
        if(!r.alive)continue;
        const rt=RESOURCE_TYPES[r.type];
        if(!rt)continue;
        ctx.fillStyle=rt.color;
        ctx.fillRect(mmX+r.x*sx-1,mmY+r.y*sy-1,2,2);
    }
    // Buildings on minimap
    for(let bl of (G.buildings||[])){
        const bt=BUILDINGS[bl.type];
        if(!bt)continue;
        ctx.fillStyle=bt.color;
        ctx.fillRect(mmX+bl.x*sx-2,mmY+bl.y*sy-2,4,4);
    }
    // Player on minimap
    ctx.fillStyle='#4a9eff';
    ctx.fillRect(mmX+G.px*sx-2,mmY+G.py*sy-2,5,5);
    // Camera view rect
    ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=1;
    ctx.strokeRect(mmX+G.camX*sx,mmY+G.camY*sy,W*sx,H*sy);
}

function renderTradePanel(){
    const px=220,py=H-270;
    ctx.fillStyle='rgba(0,0,0,0.85)';
    ctx.beginPath();ctx.roundRect(px,py,240,250,8);ctx.fill();
    ctx.strokeStyle='#4a9eff';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(px,py,240,250,8);ctx.stroke();

    ctx.fillStyle='#4a9eff';ctx.font='bold 14px monospace';ctx.textAlign='left';
    ctx.fillText('交易市场 [T关闭]',px+10,py+20);

    if(G.tradeCooldown>0){
        ctx.fillStyle='#f88';ctx.font='11px monospace';
        ctx.fillText('冷却: '+Math.ceil(G.tradeCooldown/60)+'秒',px+150,py+20);
    }

    for(let i=0;i<TRADES.length;i++){
        const t=TRADES[i];
        const ty=py+35+i*42;
        const canTrade=G.tradeCooldown<=0;

        ctx.fillStyle=canTrade?'rgba(255,255,255,0.05)':'rgba(100,100,100,0.1)';
        ctx.beginPath();ctx.roundRect(px+5,ty,230,38,4);ctx.fill();

        // Give
        ctx.fillStyle='#f88';ctx.font='11px monospace';ctx.textAlign='left';
        let giveStr='给: ';
        const costKeys=['wood','stone','iron','gold','gem'];
        const costIcons=['T','S','F','G','B'];
        for(let k in t.give)giveStr+=costIcons[costKeys.indexOf(k)]+t.give[k]+' ';
        ctx.fillText(giveStr,px+10,ty+15);

        // Get
        ctx.fillStyle='#4f4';ctx.font='11px monospace';
        let getStr='得: ';
        for(let k in t.get)getStr+=costIcons[costKeys.indexOf(k)]+t.get[k]+' ';
        ctx.fillText(getStr,px+10,ty+30);

        // Can afford check
        let canAfford=canTrade;
        for(let k in t.give){if((G.inv[k]||0)<t.give[k])canAfford=false}
        ctx.fillStyle=canAfford?'#4f4':'#f44';ctx.font='10px monospace';ctx.textAlign='right';
        ctx.fillText(canAfford?'可交易':'不足',px+228,ty+22);
    }
}

function renderBuildMenu(){
    const menuX=10,menuY=H-270;
    ctx.fillStyle='rgba(0,0,0,0.8)';
    ctx.beginPath();ctx.roundRect(menuX,menuY,200,260,8);ctx.fill();

    ctx.fillStyle='#4a9eff';ctx.font='bold 14px monospace';ctx.textAlign='left';
    ctx.fillText('建造设施 [1-5]',menuX+10,menuY+20);

    for(let i=0;i<BUILDINGS.length;i++){
        const b=BUILDINGS[i];
        const by=menuY+35+i*44;
        const selected=G.selectedBuild===i;
        // Background
        ctx.fillStyle=selected?'rgba(74,158,255,0.3)':'rgba(255,255,255,0.05)';
        ctx.beginPath();ctx.roundRect(menuX+5,by,190,40,6);ctx.fill();
        // Border
        if(selected){ctx.strokeStyle='#4a9eff';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(menuX+5,by,190,40,6);ctx.stroke()}
        // Hotkey
        ctx.fillStyle='#4a9eff';ctx.font='bold 12px monospace';ctx.textAlign='left';
        ctx.fillText('['+(i+1)+']',menuX+12,by+16);
        // Name
        ctx.fillStyle='#fff';ctx.font='12px monospace';
        ctx.fillText(b.name,menuX+38,by+16);
        // Cost
        let costStr='';
        const costKeys=['wood','stone','iron','gold','gem'];
        const costIcons=['T','S','F','G','B'];
        for(let k in b.cost){costStr+=costIcons[costKeys.indexOf(k)]+b.cost[k]+' '}
        ctx.fillStyle='#aaa';ctx.font='10px monospace';
        ctx.fillText(costStr,menuX+38,by+32);
        // Afford indicator
        let canAfford=true;
        for(let k in b.cost){if((G.inv[k]||0)<b.cost[k])canAfford=false}
        ctx.fillStyle=canAfford?'#4f4':'#f44';
        ctx.fillText(canAfford?'可建造':'不足',menuX+155,by+24);
    }
}

function renderMenu(){
    // Background animated
    const t=Date.now()*0.001;
    for(let i=0;i<40;i++){
        const x=W/2+Math.cos(t+i*0.5)*200*(0.5+i/40);
        const y=H/2+Math.sin(t*0.7+i*0.3)*150*(0.5+i/40);
        ctx.globalAlpha=0.08;ctx.fillStyle=RESOURCE_TYPES[i%5].color;
        ctx.beginPath();ctx.arc(x,y,20+i%10,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;

    // Floating resource icons
    for(let i=0;i<10;i++){
        const fx=(W/2-200)+i*45+Math.sin(t*0.5+i)*20;
        const fy=H/2+100+Math.cos(t*0.3+i*0.7)*30;
        ctx.globalAlpha=0.3;ctx.fillStyle=RESOURCE_TYPES[i%5].color;
        ctx.beginPath();ctx.arc(fx,fy,8,0,Math.PI*2);ctx.fill();
        ctx.globalAlpha=0.6;ctx.fillStyle='#fff';ctx.font='bold 10px monospace';ctx.textAlign='center';
        ctx.fillText(RESOURCE_TYPES[i%5].icon,fx,fy+3);
    }
    ctx.globalAlpha=1;

    // Game features description
    ctx.fillStyle='rgba(0,0,0,0.5)';
    ctx.beginPath();ctx.roundRect(W/2-180,H/2+60,360,120,10);ctx.fill();
    ctx.fillStyle='#8af';ctx.font='13px monospace';ctx.textAlign='center';
    const features=['收集5种资源: 木材/石头/铁矿/金矿/宝石','建造5种设施自动产出资源','天气系统影响资源刷新速度','交易市场交换多余资源','连击系统加速收集效率'];
    for(let i=0;i<features.length;i++){
        ctx.fillStyle='#aaa';ctx.fillText(features[i],W/2,H/2+85+i*20);
    }
}

function renderOver(){
    ctx.fillStyle='rgba(0,0,0,0.85)';ctx.fillRect(0,0,W,H);
    const won=G.score>=GOAL_SCORE;

    // Animated border
    const pulse=0.5+Math.sin(Date.now()*0.003)*0.3;
    ctx.strokeStyle=won?'rgba(74,158,255,'+pulse+')':'rgba(255,68,68,'+pulse+')';
    ctx.lineWidth=3;
    ctx.beginPath();ctx.roundRect(W/2-200,H/2-140,400,320,12);ctx.stroke();

    ctx.fillStyle=won?'#4a9eff':'#f44';ctx.font='bold 40px monospace';ctx.textAlign='center';
    ctx.fillText(won?'目标达成!':'游戏结束',W/2,H/2-100);

    // Stats
    const stats=[
        ['最终分数',G.score+' / '+GOAL_SCORE,'#fff'],
        ['收集资源',G.totalCollected+'个','#8af'],
        ['建造设施',G.totalBuilt+'个','#4f4'],
        ['完成交易',G.totalTrades+'次','#fc0'],
        ['最高连击','x'+Math.max(1,G.comboCount),'#f0f'],
        ['成就解锁',(G.unlockedAchievements?G.unlockedAchievements.length:0)+'/'+ACHIEVEMENTS.length,'#ff0']
    ];
    for(let i=0;i<stats.length;i++){
        ctx.fillStyle='#888';ctx.font='14px monospace';
        ctx.fillText(stats[i][0]+':',W/2-60,H/2-55+i*28);
        ctx.fillStyle=stats[i][2];ctx.font='bold 14px monospace';
        ctx.fillText(stats[i][1],W/2+60,H/2-55+i*28);
    }

    // High score
    ctx.fillStyle='#fc0';ctx.font='bold 18px monospace';
    ctx.fillText('最高分: '+G.highScore,W/2,H/2+120);

    // New record
    if(G.score>=G.highScore&&G.score>0){
        ctx.fillStyle='#f44';ctx.font='bold 16px monospace';
        const blink=Math.sin(Date.now()*0.005)>0;
        if(blink)ctx.fillText('新纪录!',W/2,H/2+145);
    }

    // Restart hint
    ctx.fillStyle='#666';ctx.font='14px monospace';
    ctx.fillText('点击任意处重新开始',W/2,H/2+175);
}

// Tutorial system
function renderTutorial(){
    if(G.tutorialDone||G.tutorialStep>=5)return;
    const tips=[
        '使用 WASD 或方向键移动角色',
        '靠近资源按 空格键 采集',
        '按 1-5 选择设施，空格键放置',
        '按 T 打开交易市场',
        '收集资源达到 '+GOAL_SCORE+' 分即可获胜!'
    ];
    ctx.fillStyle='rgba(0,0,0,0.8)';
    ctx.beginPath();ctx.roundRect(W/2-160,100,320,50,8);ctx.fill();
    ctx.strokeStyle='#4a9eff';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(W/2-160,100,320,50,8);ctx.stroke();
    ctx.fillStyle='#4a9eff';ctx.font='bold 12px monospace';ctx.textAlign='center';
    ctx.fillText('提示 ('+(G.tutorialStep+1)+'/5)',W/2,120);
    ctx.fillStyle='#fff';ctx.font='12px monospace';
    ctx.fillText(tips[G.tutorialStep],W/2,140);
}

document.getElementById('highScoreText').textContent=
    (parseInt(localStorage.getItem('resource_mgr_hs'))||0)>0?

// === Main Loop ===
let lastTime=0;
function gameLoop(ts){
    const dt=Math.min(ts-lastTime,33);
    lastTime=ts;
    update(dt);
    render();
    requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);

const GameMonetize = {
	adsterra: { enabled: !/localhost|127\.0\.0\.1/.test(location.hostname) },
	sponsor: { enabled: true, wechatQR: '', alipayQR: '' },
	interstitial: { enabled: true, cooldownMs: 180000, gameCount: 2 },
	_lastInterTime: 0, _deathCount: 0,
	_gameOverDetected: false,
	init() {
		const banner = document.getElementById('adBanner');
		if (banner && this.adsterra.enabled) {
			const s1 = document.createElement('script');
			s1.src = 'https://pl29544740.effectivecpmnetwork.com/de/26/0e/de260e17b6a348e3489772a87b1cedf1.js';
			s1.async = true;
			banner.appendChild(s1);
		}
		const spBtn = document.getElementById('sponsorBtn');
		const spPanel = document.getElementById('sponsorPanel');
		const spClose = document.getElementById('sponsorClose');
		if (spBtn && spPanel && spClose && this.sponsor.enabled) {
			spBtn.onclick = () => { spPanel.style.display = 'flex'; spPanel.style.pointerEvents = 'auto'; };
			spClose.onclick = () => { spPanel.style.display = 'none'; spPanel.style.pointerEvents = 'none'; };
			spPanel.onclick = (e) => { if (e.target === spPanel) { spPanel.style.display = 'none'; spPanel.style.pointerEvents = 'none'; } };
		} else if (spBtn) { spBtn.style.display = 'none'; }
		const skipBtn = document.getElementById('skipInterstitial');
		const interstitial = document.getElementById('interstitialAd');
		if (skipBtn && interstitial) {
			skipBtn.onclick = () => {
				interstitial.style.display = 'none'; interstitial.style.pointerEvents = 'none';
				if (this._reviveCallback) { const cb = this._reviveCallback; this._reviveCallback = null; cb(); }
			};
		}
		// 自动检测游戏结束状态
		this._startGameOverWatcher();
	},
	_startGameOverWatcher() {
		// 检测#restartBtn或包含"重新开始"/"再来一局"的按钮变为可见
		const checkGameOver = () => {
			if (this._gameOverDetected) return;
			// 方法1: 检测#restartBtn可见
			const restartBtn = document.getElementById('restartBtn');
			if (restartBtn && restartBtn.offsetParent !== null && getComputedStyle(restartBtn).display !== 'none') {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
			// 方法2: 检测#gameOverScreen可见
			const goScreen = document.getElementById('gameOverScreen');
			if (goScreen && getComputedStyle(goScreen).display !== 'none') {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
			// 方法3: 检测screen-gameover可见
			const goScreen2 = document.getElementById('screen-gameover');
			if (goScreen2 && !goScreen2.classList.contains('hidden')) {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
		};
		// 每500ms检查一次
		this._goInterval = setInterval(() => {
			checkGameOver();
			// 如果检测到了，等2秒后重置标志，允许下次检测
			if (this._gameOverDetected) {
				setTimeout(() => { this._gameOverDetected = false; }, 2000);
			}
		}, 500);
	},
	requestRevive(callback) {
		this._reviveCallback = callback || null;
		const el = document.getElementById('interstitialAd');
		if (!el) { if (callback) callback(); return; }
		const s2 = document.createElement('script');
		s2.src = 'https://pl29544742.effectivecpmnetwork.com/be/a9/6d/bea96d779c0ee07c2b15613852dd3e70.js';
		s2.async = true;
		document.getElementById('interstitialAdSlot').innerHTML = '';
		document.getElementById('interstitialAdSlot').appendChild(s2);
		el.style.display = 'flex'; el.style.pointerEvents = 'auto';

		setTimeout(() => { const slot = document.getElementById('interstitialAdSlot'); if (slot && slot.innerHTML.includes('加载中')) { slot.innerHTML = '<div style=color:#aaa;font:13px Microsoft YaHei,sans-serif>广告暂时无法加载<br>点击下方按钮继续</div>'; } }, 3000);
		const skipBtn = document.getElementById('skipInterstitial');
		if (skipBtn) {
			skipBtn.textContent = '5 秒后可跳过'; skipBtn.disabled = true;
			let cd = 5;
			const timer = setInterval(() => {
				cd--;
				if (cd <= 0) { clearInterval(timer); skipBtn.textContent = '跳过广告 ▶'; skipBtn.disabled = false; }
				else { skipBtn.textContent = cd + ' 秒后可跳过'; }
			}, 1000);
		}
	},
	onGameOver() {
		this._deathCount++;
		if (!this.interstitial.enabled) return;
		if (this._deathCount < this.interstitial.gameCount) return;
		if (Date.now() - this._lastInterTime < this.interstitial.cooldownMs) return;
		this._lastInterTime = Date.now(); this._deathCount = 0;
		this.requestRevive(null);
	},
};
GameMonetize.init();
