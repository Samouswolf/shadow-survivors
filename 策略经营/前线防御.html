<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>前线防御</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; color: #fff; overflow: hidden; }
        
        .game-container { width: 100%; flex: 1; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: #fff; }
        .stats { display: flex; gap: 20px; font-size: 14px; }
        
        .canvas-area { flex: 1; background: rgba(0,0,0,0.5); border-radius: 15px; overflow: hidden; position: relative; }
        canvas { width: 100%; height: 100%; }
        
        .defenses { display: flex; gap: 10px; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; }
        
        .defense-btn { padding: 10px 20px; border: none; border-radius: 10px; font-size: 14px; cursor: pointer; background: rgba(255,255,255,0.2); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }
    /* [BATCH-FIX:ad-components-css] */
.sponsor-btn{position:fixed;bottom:8px;left:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:2px 6px;border-radius:10px;font:10px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.sponsor-panel.show{display:flex}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.interstitial-ad.show{display:flex}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* [/BATCH-FIX:ad-components-css] */

/* [AD-FIX:responsive] */
@media (max-width:768px){.ad-banner-container{display:none!important}.sponsor-btn{transform:scale(.8);opacity:.6}}
/* [/AD-FIX:responsive] */
</style>
</head>
<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="title">⚔️ 前线防御</div>
            <div class="stats">
                <span>💰 资金: <span id="money">300</span></span>
                <span>🛡️ 防线: <span id="defense">100</span></span>
                <span>⚔️ 击杀: <span id="kills">0</span></span>
            </div>
        </div>
        
        <div class="canvas-area">
            <canvas id="gameCanvas"></canvas>
        </div>
        
        <div class="defenses">
            <button class="defense-btn" onclick="buildTurret()">🔫 炮塔 (80)</button>
            <button class="defense-btn" onclick="buildMortar()">💥 迫击炮 (120)</button>
            <button class="defense-btn" onclick="buildBarrier()">🛡️ 屏障 (60)</button>
            <button class="defense-btn" onclick="callAirStrike()">✈️ 空袭 (300)</button>
        </div>
    </div>
    
    

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="../game_core.js"></script>
    <script>
        const GAME_NAME = '前线防御';
        GameCore.init({ highScore: GAME_NAME });
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let gameRunning = true;
        let money = 300;
        let defense = 100;
        let kills = 0;
        let turrets = [];
        let mortars = [];
        let barriers = [];
        let enemies = [];
        let projectiles = [];
        
        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        
        function initGame() {
            resizeCanvas();
            gameRunning = true;
            money = 300;
            defense = 100;
            kills = 0;
            turrets = [];
            mortars = [];
            barriers = [];
            enemies = [];
            projectiles = [];
            updateUI();
            gameLoop();
            
            startEnemyInvasion();
        }
        
        function updateUI() {
            document.getElementById('money').textContent = money;
            document.getElementById('defense').textContent = defense;
            document.getElementById('kills').textContent = kills;
            
            GameCore.highScore.set(GAME_NAME, kills);
        }
        
        function startEnemyInvasion() {
            if (!gameRunning) return;
            
            const difficulty = 2 + Math.floor(kills / 50);
            
            for (let i = 0; i < difficulty; i++) {
                setTimeout(() => {
                    enemies.push({
                        x: canvas.width,
                        y: canvas.height / 2 + (Math.random() - 0.5) * 150,
                        hp: 40 + Math.floor(kills / 20) * 15,
                        speed: 1.5 + Math.floor(kills / 30) * 0.3,
                        type: Math.random() > 0.8 ? 'tank' : (Math.random() > 0.9 ? 'scout' : 'infantry')
                    });
                }, i * 300);
            }
            
            setTimeout(startEnemyInvasion, difficulty * 300 + 6000);
        }
        
        function buildTurret() {
            if (money >= 80) {
                money -= 80;
                turrets.push({
                    x: canvas.width * 0.25 + turrets.length * 90,
                    y: canvas.height * 0.7,
                    damage: 30,
                    range: 120,
                    lastShot: 0
                });
                updateUI();
                GameCore.hints.show('🔫 建造炮塔！');
            } else {
                GameCore.hints.show('资金不足！');
            }
        }
        
        function buildMortar() {
            if (money >= 120) {
                money -= 120;
                mortars.push({
                    x: canvas.width * 0.4 + mortars.length * 110,
                    y: canvas.height * 0.6,
                    damage: 60,
                    range: 200,
                    lastShot: 0,
                    splashRadius: 50
                });
                updateUI();
                GameCore.hints.show('💥 建造迫击炮！');
            } else {
                GameCore.hints.show('资金不足！');
            }
        }
        
        function buildBarrier() {
            if (money >= 60) {
                money -= 60;
                barriers.push({
                    x: canvas.width * 0.5 + barriers.length * 70,
                    y: canvas.height * 0.75,
                    hp: 150
                });
                updateUI();
                GameCore.hints.show('🛡️ 建造屏障！');
            } else {
                GameCore.hints.show('资金不足！');
            }
        }
        
        function callAirStrike() {
            if (money >= 300) {
                money -= 300;
                enemies.forEach(enemy => {
                    enemy.hp -= 150;
                    if (enemy.hp <= 0) {
                        kills++;
                        money += 30;
                    }
                });
                enemies = enemies.filter(e => e.hp > 0);
                updateUI();
                GameCore.hints.show('✈️ 空袭成功！');
            } else {
                GameCore.hints.show('资金不足！');
            }
        }
        
        function update() {
            if (!gameRunning) return;
            
            enemies.forEach(enemy => {
                enemy.x -= enemy.speed * (enemy.type === 'scout' ? 2 : 1);
                
                if (enemy.x < 40) {
                    defense -= enemy.type === 'tank' ? 20 : (enemy.type === 'scout' ? 5 : 10);
                    updateUI();
                    enemy.x = canvas.width + 100;
                    
                    if (defense <= 0) {
                        gameOver();
                    }
                }
            });
            
            enemies = enemies.filter(e => e.x < canvas.width + 50);
            
            barriers.forEach(barrier => {
                enemies.forEach(enemy => {
                    const dx = enemy.x - barrier.x;
                    const dy = enemy.y - barrier.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < 25) {
                        barrier.hp -= enemy.type === 'tank' ? 2 : 1;
                        
                        if (barrier.hp <= 0) {
                            barrier.x = -100;
                            money += 30;
                            updateUI();
                        }
                    }
                });
            });
            
            barriers = barriers.filter(b => b.x >= 0);
            
            turrets.forEach(turret => {
                if (Date.now() - turret.lastShot > 400) {
                    let closestEnemy = null;
                    let closestDist = Infinity;
                    
                    enemies.forEach(enemy => {
                        const dx = enemy.x - turret.x;
                        const dy = enemy.y - turret.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        
                        if (dist < turret.range && dist < closestDist) {
                            closestDist = dist;
                            closestEnemy = enemy;
                        }
                    });
                    
                    if (closestEnemy) {
                        projectiles.push({
                            x: turret.x,
                            y: turret.y,
                            target: closestEnemy,
                            damage: turret.damage,
                            speed: 12,
                            color: '#f39c12'
                        });
                        turret.lastShot = Date.now();
                    }
                }
            });
            
            mortars.forEach(mortar => {
                if (Date.now() - mortar.lastShot > 2500) {
                    let closestEnemy = null;
                    let closestDist = Infinity;
                    
                    enemies.forEach(enemy => {
                        const dx = enemy.x - mortar.x;
                        const dy = enemy.y - mortar.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        
                        if (dist < mortar.range && dist < closestDist) {
                            closestDist = dist;
                            closestEnemy = enemy;
                        }
                    });
                    
                    if (closestEnemy) {
                        projectiles.push({
                            x: mortar.x,
                            y: mortar.y,
                            target: closestEnemy,
                            damage: mortar.damage,
                            speed: 6,
                            color: '#e74c3c',
                            splash: mortar.splashRadius,
                            isMortar: true
                        });
                        mortar.lastShot = Date.now();
                    }
                }
            });
            
            projectiles.forEach(proj => {
                const dx = proj.target.x - proj.x;
                const dy = proj.target.y - proj.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < 10) {
                    if (proj.isMortar && proj.splash) {
                        enemies.forEach(enemy => {
                            const edx = enemy.x - proj.target.x;
                            const edy = enemy.y - proj.target.y;
                            const eDist = Math.sqrt(edx * edx + edy * edy);
                            
                            if (eDist < proj.splash) {
                                enemy.hp -= proj.damage * (1 - eDist / proj.splash);
                                if (enemy.hp <= 0) {
                                    kills++;
                                    money += enemy.type === 'tank' ? 30 : 15;
                                }
                            }
                        });
                    } else {
                        proj.target.hp -= proj.damage;
                        if (proj.target.hp <= 0) {
                            kills++;
                            money += proj.target.type === 'tank' ? 30 : 15;
                        }
                    }
                    proj.x = -100;
                } else {
                    proj.x += (dx / dist) * proj.speed;
                    proj.y += (dy / dist) * proj.speed;
                }
            });
            
            projectiles = projectiles.filter(p => p.x >= 0);
            enemies = enemies.filter(e => e.hp > 0);
        }
        
        function render() {
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(0, canvas.height - 30, canvas.width, 30);
            
            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(30, canvas.height / 2 - 25, 20, 50);
            
            ctx.fillStyle = '#fff';
            ctx.font = '14px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(defense, 40, canvas.height / 2 + 8);
            
            turrets.forEach(turret => {
                ctx.fillStyle = '#34495e';
                ctx.fillRect(turret.x - 15, turret.y - 10, 30, 20);
                
                ctx.fillStyle = '#f39c12';
                ctx.fillRect(turret.x + 10, turret.y - 8, 15, 16);
                
                ctx.fillStyle = '#fff';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('🔫', turret.x, turret.y + 20);
                
                ctx.strokeStyle = 'rgba(243, 156, 18, 0.3)';
                ctx.beginPath();
                ctx.arc(turret.x, turret.y, turret.range, 0, Math.PI * 2);
                ctx.stroke();
            });
            
            mortars.forEach(mortar => {
                ctx.fillStyle = '#7f8c8d';
                ctx.beginPath();
                ctx.arc(mortar.x, mortar.y, 20, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#2c3e50';
                ctx.fillRect(mortar.x - 25, mortar.y - 5, 50, 10);
                
                ctx.fillStyle = '#fff';
                ctx.font = '14px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('💥', mortar.x, mortar.y + 25);
                
                ctx.strokeStyle = 'rgba(231, 76, 60, 0.3)';
                ctx.beginPath();
                ctx.arc(mortar.x, mortar.y, mortar.range, 0, Math.PI * 2);
                ctx.stroke();
            });
            
            barriers.forEach(barrier => {
                ctx.fillStyle = '#3498db';
                ctx.fillRect(barrier.x - 15, barrier.y - 20, 30, 40);
                
                ctx.fillStyle = '#2980b9';
                ctx.fillRect(barrier.x - 12, barrier.y - 15, 24, 5);
                ctx.fillRect(barrier.x - 12, barrier.y, 24, 5);
                ctx.fillRect(barrier.x - 12, barrier.y + 15, 24, 5);
                
                ctx.fillStyle = '#fff';
                ctx.font = '10px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(barrier.hp, barrier.x, barrier.y + 25);
            });
            
            enemies.forEach(enemy => {
                let color = '#ff6b6b';
                let size = 12;
                
                if (enemy.type === 'tank') {
                    color = '#95a5a6';
                    size = 20;
                } else if (enemy.type === 'scout') {
                    color = '#f39c12';
                    size = 10;
                }
                
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(enemy.x, enemy.y, size, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#fff';
                ctx.font = '10px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(enemy.hp, enemy.x, enemy.y + 4);
                
                if (enemy.type === 'tank') {
                    ctx.fillStyle = '#fff';
                    ctx.font = '12px Arial';
                    ctx.fillText('🛡️', enemy.x, enemy.y - 18);
                }
            });
            
            projectiles.forEach(proj => {
                ctx.fillStyle = proj.color;
                ctx.beginPath();
                ctx.arc(proj.x, proj.y, proj.isMortar ? 8 : 4, 0, Math.PI * 2);
                ctx.fill();
            });
        }
        
        function gameLoop() {
            update();
            render();
            
            if (gameRunning) {
                requestAnimationFrame(gameLoop);
            }
        }
        
        function gameOver() {
            gameRunning = false;
            GameCore.hints.show('💀 防线失守！');
            
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#fff';
            ctx.font = '30px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('游戏结束', canvas.width / 2, canvas.height / 2);
        }
        
        initGame();
        GameCore.touch.enableAllButtons();
    </script>
<!-- [BATCH-FIX:touch-support] -->
<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>
<!-- [/BATCH-FIX:touch-support] -->

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
