<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>面包房</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a0a2e;font-family:'Microsoft YaHei',sans-serif}
canvas{display:block;touch-action:none}
</style>

<style>
/* 游戏工坊广告系统 */
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);height:90px;max-height:90px;overflow:hidden;contain:layout style paint;pointer-events:none!important}.ad-banner-container,.ad-banner-container *{pointer-events:none!important}.ad-banner-container iframe{max-height:90px;pointer-events:none!important}
.ad-banner-container iframe{max-width:100%}
.ad-label{position:absolute;top:1px;right:6px;font:9px "Microsoft YaHei",sans-serif;color:rgba(255,255,255,.35)}
.sponsor-btn{position:fixed;top:44px;right:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:3px 9px;border-radius:10px;font:11px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .qr-row{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.sponsor-panel .qr-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px;text-align:center;min-width:140px}
.sponsor-panel .qr-card .qr-icon{font-size:48px;margin-bottom:6px}
.sponsor-panel .qr-card .qr-label{color:#ccc;font:13px "Microsoft YaHei",sans-serif}
.sponsor-panel .qr-card .qr-hint{color:#888;font:11px "Microsoft YaHei",sans-serif;margin-top:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.interstitial-ad .ad-content{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;text-align:center;min-width:280px;max-width:400px}
.interstitial-ad .ad-content p{color:#aaa;font:14px "Microsoft YaHei",sans-serif;margin-bottom:12px}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
(function(){
'use strict';
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
let W,H,SF=1;

function resize(){
    W=cv.width=window.innerWidth;
    H=cv.height=window.innerHeight;
    SF=Math.min(W/1200,H/800);
}
resize();
window.addEventListener('resize',resize);

// === GAME STATE ===
let STATE='menu'; // menu, playing, gameover
let money=0, day=1, timeLeft=120, score=0, bestScore=0;
let combo=0, maxCombo=0, customersServed=0, totalEarned=0;
let selectedRecipe=-1, bakingQueue=[], currentBake=null;
let customers=[], customerTimer=0;
let particles=[], floatingTexts=[];
let lastTime=0, animFrame=0;
let pendingTip=null;

// Load best
try{bestScore=parseInt(localStorage.getItem('bakery_best'))||0}catch(e){}

// === BREAD RECIPES ===
const RECIPES=[
    {name:'白面包',cost:5,sell:12,time:5,unlock:0,color:'#f5deb3',desc:'基础白面包',icon:'🍞',difficulty:1},
    {name:'全麦面包',cost:8,sell:20,time:8,unlock:0,color:'#d2a679',desc:'健康全麦',icon:'🌾',difficulty:1},
    {name:'法式长棍',cost:12,sell:32,time:12,unlock:30,color:'#e8c872',desc:'经典法棍',icon:'🥖',difficulty:2},
    {name:'牛角面包',cost:15,sell:40,time:15,unlock:80,color:'#f0c040',desc:'酥脆可口',icon:'🥐',difficulty:2},
    {name:'巧克力面包',cost:20,sell:55,time:18,unlock:150,color:'#8b4513',desc:'甜蜜诱惑',icon:'🍫',difficulty:3},
    {name:'彩虹蛋糕',cost:30,sell:80,time:25,unlock:300,color:'#ff69b4',desc:'豪华蛋糕',icon:'🎂',difficulty:3}
];

// === CUSTOMER TYPES ===
const CUST_TYPES=[
    {name:'小学生',patience:20,tip:1.0,icon:'👦',wantRange:[0,1]},
    {name:'上班族',patience:15,tip:1.2,icon:'👔',wantRange:[0,3]},
    {name:'老奶奶',patience:30,tip:0.8,icon:'👵',wantRange:[0,2]},
    {name:'美食家',patience:12,tip:2.0,icon:'👨‍🍳',wantRange:[2,5]},
    {name:'网红',patience:10,tip:1.5,icon:'🤳',wantRange:[1,4]},
    {name:'外国游客',patience:18,tip:2.5,icon:'🧑‍🦱',wantRange:[3,5]}
];

// === UPGRADES ===
let upgrades={speed:1,quality:1,capacity:1};
const UPGRADE_COST={speed:[50,120,250],quality:[60,150,300],capacity:[40,100,200]};

// === GAME STATE ===
let G={};

function initGame(){
    money=20; day=1; timeLeft=120; score=0; combo=0; maxCombo=0;
    customersServed=0; totalEarned=0;
    selectedRecipe=-1; bakingQueue=[]; currentBake=null;
    customers=[]; customerTimer=0;
    particles=[]; floatingTexts=[];
    upgrades={speed:1,quality:1,capacity:1};
    pendingTip=null;
    G={
        dayTimer:0,
        customerSpawnRate:5,
        dayCustomers:0,
        dayMaxCustomers:8
    };
    STATE='playing';
}

// === PARTICLES ===
function addParticle(x,y,color,count){
    for(let i=0;i<count;i++){
        particles.push({
            x:x,y:y,
            vx:(Math.random()-0.5)*4,
            vy:(Math.random()-0.5)*4-2,
            life:30+Math.random()*30,
            maxLife:60,
            color:color,
            size:2+Math.random()*3
        });
    }
}

function addFloatingText(x,y,text,color){
    floatingTexts.push({x,y,text,color,life:60,maxLife:60,vy:-1.5});
}

// === CUSTOMER GENERATION ===
function spawnCustomer(){
    if(customers.length>=5)return;
    let typeIdx=Math.floor(Math.random()*CUST_TYPES.length);
    let type=CUST_TYPES[typeIdx];
    let wantIdx=type.wantRange[0]+Math.floor(Math.random()*(type.wantRange[1]-type.wantRange[0]+1));
    wantIdx=Math.min(wantIdx,RECIPES.length-1);
    // Check unlock
    if(RECIPES[wantIdx].unlock>score){
        wantIdx=0;
        for(let i=RECIPES.length-1;i>=0;i--){
            if(RECIPES[i].unlock<=score){wantIdx=i;break;}
        }
    }
    customers.push({
        type:typeIdx,
        want:wantIdx,
        patience:type.patience*100,
        maxPatience:type.patience*100,
        x:W/SF,
        targetX:80+customers.length*200,
        y:0,
        served:false,
        leaveTimer:0
    });
}

// === BAKING ===
function startBake(recipeIdx){
    if(bakingQueue.length>=upgrades.capacity+1)return;
    let r=RECIPES[recipeIdx];
    if(money<r.cost)return;
    money-=r.cost;
    let bakeTime=r.time*(3-upgrades.speed*0.3);
    bakingQueue.push({recipe:recipeIdx,time:bakeTime*60,maxTime:bakeTime*60});
}

function collectBake(idx){
    if(idx<0||idx>=bakingQueue.length)return;
    let b=bakingQueue[idx];
    if(b.time>0)return;
    // Try serve to customer wanting this
    let served=false;
    for(let i=0;i<customers.length;i++){
        let c=customers[i];
        if(!c.served&&c.want===b.recipe){
            serveCustomer(i,b.recipe);
            served=true;
            break;
        }
    }
    if(!served){
        // Add to inventory (simplified: just sell for base price)
        let r=RECIPES[b.recipe];
        let earn=Math.floor(r.sell*(1+upgrades.quality*0.15));
        money+=earn;
        score+=earn;
        totalEarned+=earn;
        addFloatingText(200,300,'+'+earn,'#ffd700');
        addParticle(200,300,'#ffd700',5);
    }
    bakingQueue.splice(idx,1);
}

function serveCustomer(idx,recipeIdx){
    let c=customers[idx];
    let r=RECIPES[recipeIdx];
    let tipMult=CUST_TYPES[c.type].tip;
    let patienceRatio=c.patience/c.maxPatience;
    let tip=Math.floor(r.sell*0.3*tipMult*(patienceRatio+0.5));
    let earn=r.sell+tip;
    let qualBonus=Math.floor(earn*upgrades.quality*0.1);
    earn+=qualBonus;
    money+=earn;
    score+=earn;
    totalEarned+=earn;
    customersServed++;
    combo++;
    maxCombo=Math.max(maxCombo,combo);

    let cx=(c.targetX+80)*SF;
    let cy=280*SF;
    addFloatingText(cx,cy,'+'+earn,'#00ff88');
    if(tip>0)addFloatingText(cx,cy-30,'小费+'+tip,'#ffd700');
    addParticle(cx,cy,'#00ff88',8);

    c.served=true;
    c.leaveTimer=30;
    pendingTip={text:'满意!',x:cx,y:cy-60,life:40};
}

// === MAIN LOOP ===
function gameLoop(ts){
    let dt=Math.min((ts-lastTime)/16.67,3);
    lastTime=ts;
    animFrame++;

    update(dt);
    render();
    requestAnimationFrame(gameLoop);
}

function update(dt){
    if(STATE!=='playing')return;

    // Day timer
    timeLeft-=dt/60;
    if(timeLeft<=0){
        endDay();
        return;
    }

    // Customer spawning
    customerTimer+=dt;
    let spawnRate=G.customerSpawnRate*60*(1-day*0.05);
    spawnRate=Math.max(spawnRate,90);
    if(customerTimer>=spawnRate&&customers.length<5){
        spawnCustomer();
        customerTimer=0;
    }

    // Update customers
    for(let i=customers.length-1;i>=0;i--){
        let c=customers[i];
        if(c.served){
            c.leaveTimer-=dt;
            if(c.leaveTimer<=0){
                customers.splice(i,1);
                // Reindex positions
                for(let j=0;j<customers.length;j++){
                    customers[j].targetX=80+j*200;
                }
            }
            continue;
        }
        // Move in
        if(c.x>c.targetX){
            c.x-=3*dt;
            if(c.x<c.targetX)c.x=c.targetX;
        }
        // Patience
        c.patience-=dt*(1+day*0.1);
        if(c.patience<=0){
            // Customer leaves angry
            combo=0;
            let cx=(c.targetX+80)*SF;
            addFloatingText(cx,280*SF,'生气离开!','#ff4444');
            addParticle(cx,280*SF,'#ff4444',6);
            customers.splice(i,1);
            for(let j=0;j<customers.length;j++){
                customers[j].targetX=80+j*200;
            }
            score=Math.max(0,score-5);
        }
    }

    // Update baking queue
    for(let i=0;i<bakingQueue.length;i++){
        let b=bakingQueue[i];
        if(b.time>0){
            b.time-=dt*upgrades.speed;
            if(b.time<=0){
                b.time=0;
                let bx=300+i*120;
                addParticle(bx*SF,520*SF,'#ffaa00',4);
            }
        }
    }

    // Update particles
    for(let i=particles.length-1;i>=0;i--){
        let p=particles[i];
        p.x+=p.vx;
        p.y+=p.vy;
        p.vy+=0.1;
        p.life-=dt;
        if(p.life<=0)particles.splice(i,1);
    }

    // Update floating texts
    for(let i=floatingTexts.length-1;i>=0;i--){
        let f=floatingTexts[i];
        f.y+=f.vy;
        f.life-=dt;
        if(f.life<=0)floatingTexts.splice(i,1);
    }

    // Pending tip
    if(pendingTip){
        pendingTip.life-=dt;
        pendingTip.y-=0.5;
        if(pendingTip.life<=0)pendingTip=null;
    }
}

function endDay(){
    day++;
    timeLeft=120+day*10;
    G.dayCustomers=0;
    G.customerSpawnRate=Math.max(3,5-day*0.3);
    // Bonus
    let bonus=day*10;
    money+=bonus;
    addFloatingText(W/2/SF,H/2/SF,'第'+day+'天! 奖励+'+bonus,'#00ffff');
}

// === RENDER ===
function render(){
    ctx.save();
    ctx.scale(SF,SF);
    let sw=W/SF, sh=H/SF;

    if(STATE==='menu'){
        renderMenu(sw,sh);
    }else if(STATE==='playing'){
        renderGame(sw,sh);
    }else if(STATE==='gameover'){
        renderGameOver(sw,sh);
    }

    ctx.restore();
}

function drawGradientBg(sw,sh,c1,c2,c3){
    let g=ctx.createLinearGradient(0,0,0,sh);
    g.addColorStop(0,c1);
    g.addColorStop(0.5,c2);
    g.addColorStop(1,c3);
    ctx.fillStyle=g;
    ctx.fillRect(0,0,sw,sh);
}

function renderMenu(sw,sh){
    drawGradientBg(sw,sh,'#2d1b4e','#1a0a2e','#0d0520');

    // Floating bread particles
    let t=animFrame*0.02;
    for(let i=0;i<12;i++){
        let px=(sw*0.1+i*sw*0.08+Math.sin(t+i)*30)%sw;
        let py=(sh*0.1+(i*47)%sh*0.7+Math.cos(t*0.7+i*2)*20)%sh;
        ctx.globalAlpha=0.3+Math.sin(t+i)*0.2;
        ctx.font='24px serif';
        ctx.fillText(['🍞','🥖','🥐','🎂','🍫','🌾'][i%6],px,py);
    }
    ctx.globalAlpha=1;

    // Title
    ctx.textAlign='center';
    ctx.font='bold 72px "Microsoft YaHei",sans-serif';
    ctx.fillStyle='#ffcc00';
    ctx.shadowColor='#ff6600';
    ctx.shadowBlur=20;
    ctx.fillText('面包房',sw/2,sh*0.25);
    ctx.shadowBlur=0;

    ctx.font='20px "Microsoft YaHei",sans-serif';
    ctx.fillStyle='#dda0dd';
    ctx.fillText('烘焙美味 · 服务顾客 · 扩展配方',sw/2,sh*0.33);

    // Start button
    let bx=sw/2-120, by=sh*0.45, bw=240, bh=60;
    let hover=isMouseIn(bx,by,bw,bh);
    ctx.fillStyle=hover?'#ff8800':'#ff6600';
    ctx.shadowColor='#ff4400';
    ctx.shadowBlur=hover?20:10;
    roundRect(bx,by,bw,bh,15);
    ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#fff';
    ctx.font='bold 28px "Microsoft YaHei",sans-serif';
    ctx.fillText('开始营业',sw/2,by+40);

    // Best score
    if(bestScore>0){
        ctx.font='18px "Microsoft YaHei",sans-serif';
        ctx.fillStyle='#aaa';
        ctx.fillText('最高分: '+bestScore,sw/2,sh*0.6);
    }

    // Instructions
    ctx.font='15px "Microsoft YaHei",sans-serif';
    ctx.fillStyle='#888';
    let tips=['点击面包配方开始烘焙','烘焙完成后点击取出','及时服务顾客获得小费','升级配方提高收益'];
    for(let i=0;i<tips.length;i++){
        ctx.fillText(tips[i],sw/2,sh*0.68+i*25);
    }

    // Version
    ctx.font='12px "Microsoft YaHei",sans-serif';
    ctx.fillStyle='#555';
    ctx.fillText('v1.0 | Canvas + JS',sw/2,sh-20);
}

function renderGame(sw,sh){
    // Background
    drawGradientBg(sw,sh,'#3d2b1f','#2a1a0e','#1a0f05');

    // Shop background
    ctx.fillStyle='rgba(60,40,20,0.6)';
    roundRect(20,10,sw-40,sh-20,10);
    ctx.fill();

    // Top bar
    renderTopBar(sw);

    // Customer area
    renderCustomers(sw);

    // Baking area
    renderBakingArea(sw,sh);

    // Recipe panel
    renderRecipePanel(sw,sh);

    // Upgrade panel
    renderUpgradePanel(sw,sh);

    // Particles
    renderParticles();
    renderFloatingTexts();

    // Pending tip
    if(pendingTip){
        ctx.globalAlpha=pendingTip.life/40;
        ctx.font='bold 18px "Microsoft YaHei",sans-serif';
        ctx.fillStyle='#00ff88';
        ctx.textAlign='center';
        ctx.fillText(pendingTip.text,pendingTip.x/SF,pendingTip.y/SF);
        ctx.globalAlpha=1;
    }

    // Day/time indicator
    ctx.fillStyle='rgba(0,0,0,0.5)';
    roundRect(sw-180,15,165,50,8);
    ctx.fill();
    ctx.font='bold 16px "Microsoft YaHei",sans-serif';
    ctx.textAlign='right';
    ctx.fillStyle='#ffcc00';
    ctx.fillText('第 '+day+' 天',sw-30,38);
    ctx.fillStyle=timeLeft<20?'#ff4444':'#88ff88';
    ctx.fillText('剩余 '+Math.ceil(timeLeft)+' 秒',sw-30,58);
}

function renderTopBar(sw){
    ctx.fillStyle='rgba(0,0,0,0.4)';
    roundRect(30,15,300,50,8);
    ctx.fill();

    ctx.font='bold 20px "Microsoft YaHei",sans-serif';
    ctx.textAlign='left';
    ctx.fillStyle='#ffd700';
    ctx.fillText('💰 '+money,50,40);

    ctx.fillStyle='#88ff88';
    ctx.fillText('⭐ '+score,160,40);

    ctx.fillStyle='#ff88ff';
    ctx.fillText('🔥 '+combo,250,40);
}

function renderCustomers(sw){
    let custY=80, custH=180;
    ctx.fillStyle='rgba(50,30,15,0.5)';
    roundRect(30,custY,sw-60,custH,8);
    ctx.fill();

    ctx.font='14px "Microsoft YaHei",sans-serif';
    ctx.textAlign='left';
    ctx.fillStyle='#aaa';
    ctx.fillText('顾客队列 ('+customers.length+'/5)',45,custY+20);

    for(let i=0;i<customers.length;i++){
        let c=customers[i];
        let cx=c.targetX+40;
        let cy=custY+40;

        // Customer card
        let cardW=170, cardH=130;
        let patRatio=c.patience/c.maxPatience;
        let cardColor=c.served?'rgba(0,100,0,0.4)':patRatio>0.5?'rgba(40,30,20,0.7)':'rgba(100,30,20,0.5)';
        ctx.fillStyle=cardColor;
        roundRect(cx-20,cy-10,cardW,cardH,8);
        ctx.fill();

        if(c.served){
            ctx.font='14px "Microsoft YaHei",sans-serif';
            ctx.textAlign='center';
            ctx.fillStyle='#88ff88';
            ctx.fillText('已服务 ✓',cx+cardW/2-20,cy+50);
            continue;
        }

        // Icon
        ctx.font='32px serif';
        ctx.textAlign='center';
        ctx.fillText(CUST_TYPES[c.type].icon,cx+cardW/2-20,cy+25);

        // Name
        ctx.font='12px "Microsoft YaHei",sans-serif';
        ctx.fillStyle='#ddd';
        ctx.fillText(CUST_TYPES[c.type].name,cx+cardW/2-20,cy+45);

        // Want
        ctx.font='12px "Microsoft YaHei",sans-serif';
        ctx.fillStyle='#ffcc00';
        ctx.fillText('想要: '+RECIPES[c.want].icon+RECIPES[c.want].name,cx+cardW/2-20,cy+65);

        // Patience bar
        let barW=cardW-30, barH=8;
        let barX=cx-10, barY=cy+80;
        ctx.fillStyle='rgba(0,0,0,0.5)';
        roundRect(barX,barY,barW,barH,4);
        ctx.fill();
        let pColor=patRatio>0.5?'#44ff44':patRatio>0.2?'#ffaa00':'#ff4444';
        ctx.fillStyle=pColor;
        if(patRatio>0)roundRect(barX,barY,barW*patRatio,barH,4);
        ctx.fill();

        // Serve button (if has bread ready)
        let hasReady=false;
        for(let j=0;j<bakingQueue.length;j++){
            if(bakingQueue[j].recipe===c.want&&bakingQueue[j].time<=0){
                hasReady=true;break;
            }
        }
        if(hasReady){
            let btnX=cx+10, btnY=cy+95, btnW=cardW-40, btnH=22;
            ctx.fillStyle='#44aa44';
            roundRect(btnX,btnY,btnW,btnH,5);
            ctx.fill();
            ctx.fillStyle='#fff';
            ctx.font='bold 12px "Microsoft YaHei",sans-serif';
            ctx.fillText('送达',cx+cardW/2-10,btnY+16);
        }
    }
}

function renderBakingArea(sw,sh){
    let bakeY=280;
    let bakeH=180;
    ctx.fillStyle='rgba(80,50,20,0.4)';
    roundRect(30,bakeY,sw-60,bakeH,8);
    ctx.fill();

    ctx.font='14px "Microsoft YaHei",sans-serif';
    ctx.textAlign='left';
    ctx.fillStyle='#dda0dd';
    ctx.fillText('烘焙区 (容量: '+bakingQueue.length+'/'+(upgrades.capacity+1)+')',45,bakeY+20);

    let startX=50;
    for(let i=0;i<bakingQueue.length;i++){
        let b=bakingQueue[i];
        let bx=startX+i*120;
        let by=bakeY+35;
        let bw=110, bh=130;

        let r=RECIPES[b.recipe];
        let progress=b.time>0?1-b.time/b.maxTime:1;

        // Card bg
        let cardBg=b.time<=0?'rgba(0,150,0,0.4)':'rgba(60,40,20,0.6)';
        ctx.fillStyle=cardBg;
        roundRect(bx,by,bw,bh,8);
        ctx.fill();

        // Bread icon
        ctx.font='36px serif';
        ctx.textAlign='center';
        ctx.fillText(r.icon,bx+bw/2,by+40);

        // Name
        ctx.font='12px "Microsoft YaHei",sans-serif';
        ctx.fillStyle='#ddd';
        ctx.fillText(r.name,bx+bw/2,by+60);

        // Progress bar
        let barX=bx+10, barY=by+70, barW=bw-20, barH=10;
        ctx.fillStyle='rgba(0,0,0,0.4)';
        roundRect(barX,barY,barW,barH,5);
        ctx.fill();
        ctx.fillStyle=b.time<=0?'#44ff44':'#ffaa00';
        if(progress>0)roundRect(barX,barY,barW*progress,barH,5);
        ctx.fill();

        // Status text
        ctx.font='bold 11px "Microsoft YaHei",sans-serif';
        ctx.textAlign='center';
        if(b.time<=0){
            ctx.fillStyle='#44ff44';
            ctx.fillText('完成! 点击取出',bx+bw/2,by+100);
        }else{
            ctx.fillStyle='#ffcc00';
            ctx.fillText('烘焙中 '+Math.ceil(b.time/60)+'s',bx+bw/2,by+100);
        }

        // Price info
        ctx.font='10px "Microsoft YaHei",sans-serif';
        ctx.fillStyle='#aaa';
        ctx.fillText('售价: '+r.sell+'💰',bx+bw/2,by+118);
    }

    if(bakingQueue.length===0){
        ctx.font='16px "Microsoft YaHei",sans-serif';
        ctx.textAlign='center';
        ctx.fillStyle='#888';
        ctx.fillText('点击下方配方开始烘焙 ↓',sw/2,bakeY+100);
    }
}

function renderRecipePanel(sw,sh){
    let panelY=480;
    let panelH=140;
    ctx.fillStyle='rgba(40,25,60,0.5)';
    roundRect(30,panelY,sw-60,panelH,8);
    ctx.fill();

    ctx.font='14px "Microsoft YaHei",sans-serif';
    ctx.textAlign='left';
    ctx.fillStyle='#88ccff';
    ctx.fillText('面包配方',45,panelY+20);

    let startX=40;
    let cardW=Math.min(170,(sw-100)/RECIPES.length);
    for(let i=0;i<RECIPES.length;i++){
        let r=RECIPES[i];
        let bx=startX+i*(cardW+8);
        let by=panelY+30;
        let bh=100;

        let unlocked=score>=r.unlock;
        let canAfford=money>=r.cost;
        let canBake=unlocked&&canAfford&&bakingQueue.length<upgrades.capacity+1;

        // Card
        ctx.fillStyle=canBake?'rgba(60,40,80,0.7)':unlocked?'rgba(40,30,50,0.5)':'rgba(30,20,30,0.6)';
        roundRect(bx,by,cardW-4,bh,6);
        ctx.fill();

        if(!unlocked){
            ctx.globalAlpha=0.4;
        }

        // Icon
        ctx.font='28px serif';
        ctx.textAlign='center';
        ctx.fillText(r.icon,bx+cardW/2-2,by+30);

        // Name
        ctx.font='bold 11px "Microsoft YaHei",sans-serif';
        ctx.fillStyle='#fff';
        ctx.fillText(r.name,bx+cardW/2-2,by+48);

        // Cost / Sell
        ctx.font='10px "Microsoft YaHei",sans-serif';
        ctx.fillStyle=canAfford?'#ffcc00':'#ff6666';
        ctx.fillText('成本:'+r.cost,bx+cardW/2-2,by+63);
        ctx.fillStyle='#88ff88';
        ctx.fillText('售价:'+r.sell,bx+cardW/2-2,by+76);

        // Time
        ctx.fillStyle='#aaa';
        ctx.fillText(r.time+'秒',bx+cardW/2-2,by+89);

        if(!unlocked){
            ctx.globalAlpha=1;
            ctx.font='9px "Microsoft YaHei",sans-serif';
            ctx.fillStyle='#ff8888';
            ctx.fillText('⭐'+r.unlock+'解锁',bx+cardW/2-2,by+bh-5);
        }

        ctx.globalAlpha=1;
    }
}

function renderUpgradePanel(sw,sh){
    let panelY=640;
    let panelH=80;
    ctx.fillStyle='rgba(30,20,50,0.5)';
    roundRect(30,panelY,sw-60,panelH,8);
    ctx.fill();

    ctx.font='14px "Microsoft YaHei",sans-serif';
    ctx.textAlign='left';
    ctx.fillStyle='#ffaa88';
    ctx.fillText('升级工坊',45,panelY+20);

    let items=[
        {key:'speed',name:'烘焙速度',icon:'⚡',desc:'Lv'},
        {key:'quality',name:'面包品质',icon:'✨',desc:'Lv'},
        {key:'capacity',name:'烘焙容量',icon:'📦',desc:'Lv'}
    ];

    let startX=50;
    let cardW=Math.min(200,(sw-120)/3);
    for(let i=0;i<items.length;i++){
        let item=items[i];
        let bx=startX+i*(cardW+15);
        let by=panelY+30;
        let bh=40;
        let lv=upgrades[item.key];
        let maxLv=UPGRADE_COST[item.key].length;
        let isMax=lv>maxLv;
        let cost=isMax?-1:UPGRADE_COST[item.key][lv-1];
        let canUpgrade=!isMax&&money>=cost;

        ctx.fillStyle=canUpgrade?'rgba(80,60,30,0.6)':'rgba(40,30,20,0.4)';
        roundRect(bx,by,cardW-5,bh,6);
        ctx.fill();

        ctx.font='11px "Microsoft YaHei",sans-serif';
        ctx.textAlign='left';
        ctx.fillStyle='#ddd';
        ctx.fillText(item.icon+' '+item.name+' '+item.desc+lv+(isMax?'(MAX)':''),bx+8,by+18);

        if(!isMax){
            ctx.fillStyle=canUpgrade?'#ffcc00':'#888';
            ctx.fillText('升级: '+cost+'💰',bx+8,by+33);
        }else{
            ctx.fillStyle='#88ff88';
            ctx.fillText('已满级',bx+8,by+33);
        }
    }
}

function renderParticles(){
    for(let p of particles){
        ctx.globalAlpha=p.life/p.maxLife;
        ctx.fillStyle=p.color;
        ctx.beginPath();
        ctx.arc(p.x/SF,p.y/SF,p.size,0,Math.PI*2);
        ctx.fill();
    }
    ctx.globalAlpha=1;
}

function renderFloatingTexts(){
    ctx.textAlign='center';
    for(let f of floatingTexts){
        ctx.globalAlpha=f.life/f.maxLife;
        ctx.font='bold 16px "Microsoft YaHei",sans-serif';
        ctx.fillStyle=f.color;
        ctx.fillText(f.text,f.x/SF,f.y/SF);
    }
    ctx.globalAlpha=1;
}

function renderGameOver(sw,sh){
    drawGradientBg(sw,sh,'#1a0a2e','#2d1b4e','#0d0520');

    ctx.textAlign='center';
    ctx.font='bold 48px "Microsoft YaHei",sans-serif';
    ctx.fillStyle='#ffcc00';
    ctx.shadowColor='#ff6600';
    ctx.shadowBlur=15;
    ctx.fillText('营业结束',sw/2,sh*0.2);
    ctx.shadowBlur=0;

    ctx.font='24px "Microsoft YaHei",sans-serif';
    ctx.fillStyle='#fff';
    ctx.fillText('经营了 '+day+' 天',sw/2,sh*0.32);

    ctx.font='20px "Microsoft YaHei",sans-serif';
    ctx.fillStyle='#88ff88';
    ctx.fillText('总得分: '+score,sw/2,sh*0.4);
    ctx.fillStyle='#ffd700';
    ctx.fillText('总收入: '+totalEarned,sw/2,sh*0.46);
    ctx.fillStyle='#ff88ff';
    ctx.fillText('服务顾客: '+customersServed,sw/2,sh*0.52);
    ctx.fillStyle='#88ccff';
    ctx.fillText('最高连击: '+maxCombo,sw/2,sh*0.58);

    if(score>=bestScore){
        ctx.font='bold 22px "Microsoft YaHei",sans-serif';
        ctx.fillStyle='#ff4444';
        ctx.fillText('新纪录!',sw/2,sh*0.66);
    }

    // Restart button
    let bx=sw/2-100, by=sh*0.72, bw=200, bh=50;
    let hover=isMouseIn(bx,by,bw,bh);
    ctx.fillStyle=hover?'#ff8800':'#ff6600';
    ctx.shadowColor='#ff4400';
    ctx.shadowBlur=hover?15:8;
    roundRect(bx,by,bw,bh,12);
    ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#fff';
    ctx.font='bold 22px "Microsoft YaHei",sans-serif';
    ctx.fillText('再来一次',sw/2,by+34);

    // Menu button
    let mx=sw/2-80, my=sh*0.82, mw=160, mh=40;
    let mhover=isMouseIn(mx,my,mw,mh);
    ctx.fillStyle=mhover?'rgba(100,100,100,0.6)':'rgba(80,80,80,0.4)';
    roundRect(mx,my,mw,mh,10);
    ctx.fill();
    ctx.fillStyle='#ccc';
    ctx.font='18px "Microsoft YaHei",sans-serif';
    ctx.fillText('返回菜单',sw/2,my+27);
}

// === UTILS ===
function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
}

let mouseX=0,mouseY=0;
function isMouseIn(x,y,w,h){
    return mouseX>=x&&mouseX<=x+w&&mouseY>=y&&mouseY<=y+h;
}

// === INPUT ===
function handleClick(cx,cy){
    mouseX=cx/SF; mouseY=cy/SF;
    let sw=W/SF, sh=H/SF;

    if(STATE==='menu'){
        let bx=sw/2-120, by=sh*0.45, bw=240, bh=60;
        if(isMouseIn(bx,by,bw,bh)){
            initGame();
        }
    }else if(STATE==='playing'){
        // Check recipe clicks
        let panelY=480;
        let cardW=Math.min(170,(sw-100)/RECIPES.length);
        for(let i=0;i<RECIPES.length;i++){
            let r=RECIPES[i];
            let bx=40+i*(cardW+8);
            let by=panelY+30;
            let bh=100;
            if(isMouseIn(bx,by,cardW-4,bh)&&score>=r.unlock&&money>=r.cost&&bakingQueue.length<upgrades.capacity+1){
                startBake(i);
                addParticle(bx+cardW/2,by+50,'#ffaa00',5);
                return;
            }
        }

        // Check baking queue clicks
        let bakeY=280;
        for(let i=0;i<bakingQueue.length;i++){
            let b=bakingQueue[i];
            let bx=50+i*120;
            let by=bakeY+35;
            if(isMouseIn(bx,by,110,130)&&b.time<=0){
                collectBake(i);
                return;
            }
        }

        // Check customer serve buttons
        let custY=80;
        for(let i=0;i<customers.length;i++){
            let c=customers[i];
            if(c.served)continue;
            let cx2=c.targetX+40;
            let cy2=custY+40;
            let cardW2=170;
            let btnX=cx2+10, btnY=cy2+95, btnW=cardW2-40, btnH=22;
            if(isMouseIn(btnX,btnY,btnW,btnH)){
                // Find matching ready bread
                for(let j=0;j<bakingQueue.length;j++){
                    if(bakingQueue[j].recipe===c.want&&bakingQueue[j].time<=0){
                        serveCustomer(i,bakingQueue[j].recipe);
                        bakingQueue.splice(j,1);
                        return;
                    }
                }
            }
        }

        // Check upgrade clicks
        let upY=640;
        let upCardW=Math.min(200,(sw-120)/3);
        let items=['speed','quality','capacity'];
        for(let i=0;i<3;i++){
            let bx=50+i*(upCardW+15);
            let by=upY+30;
            if(isMouseIn(bx,by,upCardW-5,40)){
                let key=items[i];
                let lv=upgrades[key];
                let maxLv=UPGRADE_COST[key].length;
                if(lv<=maxLv){
                    let cost=UPGRADE_COST[key][lv-1];
                    if(money>=cost){
                        money-=cost;
                        upgrades[key]++;
                        addParticle(bx+upCardW/2,by+20,'#88ffff',6);
                        addFloatingText(bx+upCardW/2,by,'升级!','#00ffff');
                    }
                }
                return;
            }
        }
    }else if(STATE==='gameover'){
        let bx=sw/2-100, by=sh*0.72, bw=200, bh=50;
        if(isMouseIn(bx,by,bw,bh)){
            if(score>bestScore){
                bestScore=score;
                try{localStorage.setItem('bakery_best',bestScore)}catch(e){}
            }
            initGame();
        }
        let mx=sw/2-80, my=sh*0.82, mw=160, mh=40;
        if(isMouseIn(mx,my,mw,mh)){
            if(score>bestScore){
                bestScore=score;
                try{localStorage.setItem('bakery_best',bestScore)}catch(e){}
            }
            STATE='menu';
        }
    }
}

// Mouse
cv.addEventListener('mousemove',e=>{
    mouseX=e.clientX/SF; mouseY=e.clientY/SF;
});
cv.addEventListener('click',e=>{
    handleClick(e.clientX,e.clientY);
});

// Touch
cv.addEventListener('touchstart',e=>{
    e.preventDefault();
    let t=e.touches[0];
    handleClick(t.clientX,t.clientY);
},{passive:false});
cv.addEventListener('touchmove',e=>{
    e.preventDefault();
    let t=e.touches[0];
    mouseX=t.clientX/SF; mouseY=t.clientY/SF;
},{passive:false});

// Keyboard
document.addEventListener('keydown',e=>{
    if(STATE==='menu'&&e.key==='Enter'){
        initGame();
    }else if(STATE==='gameover'&&e.key==='Enter'){
        if(score>bestScore){
            bestScore=score;
            try{localStorage.setItem('bakery_best',bestScore)}catch(e){}
        }
        initGame();
    }else if(STATE==='playing'){
        // Number keys 1-6 for recipes
        let n=parseInt(e.key);
        if(n>=1&&n<=6){
            let idx=n-1;
            if(idx<RECIPES.length&&score>=RECIPES[idx].unlock&&money>=RECIPES[idx].cost&&bakingQueue.length<upgrades.capacity+1){
                startBake(idx);
            }
        }
        // Space to collect first ready bake
        if(e.key===' '){
            for(let i=0;i<bakingQueue.length;i++){
                if(bakingQueue[i].time<=0){
                    collectBake(i);
                    break;
                }
            }
        }
        // Q/W/E for upgrades
        if(e.key==='q'||e.key==='Q'){
            tryUpgrade('speed');
        }
        if(e.key==='w'||e.key==='W'){
            tryUpgrade('quality');
        }
        if(e.key==='e'||e.key==='E'){
            tryUpgrade('capacity');
        }
    }
});

function tryUpgrade(key){
    let lv=upgrades[key];
    let maxLv=UPGRADE_COST[key].length;
    if(lv<=maxLv){
        let cost=UPGRADE_COST[key][lv-1];
        if(money>=cost){
            money-=cost;
            upgrades[key]++;
            addFloatingText(W/SF/2,H/SF/2,'升级!','#00ffff');
        }
    }
}

// === START ===
requestAnimationFrame(gameLoop);

})();
