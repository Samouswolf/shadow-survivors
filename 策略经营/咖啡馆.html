<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>咖啡馆</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;overflow:hidden;display:flex;justify-content:center;align-items:center;height:100vh;font-family:'Microsoft YaHei',sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;max-width:100%;max-height:100%}

/* [BUGFIX startgame-v2] 开始按钮强制可见+广告关闭可点击 */
.sponsor-close,#sponsorClose,.skip-btn,#skipInterstitial{pointer-events:auto!important;}
</style>

<style>
/* 游戏工坊广告系统 */
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);height:90px;max-height:90px;overflow:hidden;contain:layout style paint;pointer-events:none!important}.ad-banner-container,.ad-banner-container *{pointer-events:none!important}.ad-banner-container iframe{max-height:90px;pointer-events:none!important}
.ad-banner-container iframe{max-width:100%}
.ad-label{position:absolute;top:1px;right:6px;font:9px "Microsoft YaHei",sans-serif;color:rgba(255,255,255,.35)}
.sponsor-btn{position:fixed;bottom:8px;left:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:2px 6px;border-radius:10px;font:10px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .qr-row{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.sponsor-panel .qr-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px;text-align:center;min-width:140px}
.sponsor-panel .qr-card .qr-icon{font-size:48px;margin-bottom:6px}
.sponsor-panel .qr-card .qr-label{color:#ccc;font:13px "Microsoft YaHei",sans-serif}
.sponsor-panel .qr-card .qr-hint{color:#888;font:11px "Microsoft YaHei",sans-serif;margin-top:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.interstitial-ad .ad-content{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;text-align:center;min-width:280px;max-width:400px}
.interstitial-ad .ad-content p{color:#aaa;font:14px "Microsoft YaHei",sans-serif;margin-bottom:12px}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */

/* [AD-FIX:responsive] */
@media (max-width:768px){.ad-banner-container{display:none!important}.sponsor-btn{transform:scale(.8);opacity:.6}}
/* [/AD-FIX:responsive] */
</style>
</head>
<body>

    <button id="start-game-btn" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:20px 40px;font-size:20px;background:#f5576c;color:white;border:none;border-radius:12px;cursor:pointer;z-index:999;font-weight:bold;">开始游戏</button>

<canvas id="gameCanvas"></canvas>

  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script src="../game_core.js"></script>
<script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script>
// ===== 配置 =====
const CFG = {
    W:800, H:600,
    DAY_LEN:90,        // 一天秒数
    INTERMISSION:3,     // 天间间隔
    CUST_SPEED:1.5,
    BASE_PATIENCE:300,  // 基础耐心帧数
    MAX_STREAK:10,
    STREAK_BONUS:0.1,   // 每连击+10%
    BASE_SPAWN:120,     // 初始生成间隔帧
    MIN_SPAWN:35,
    COOK_TIME:[120,90,150,100,180,140], // 6种咖啡制作帧数
    UP_COST:[[0],[200,500,1000]],       // 通用升级 [当前无用,各等级]
    SEAT_COST:[0,150,350],
    SEAT_CNT:[4,6,8],
    WORKER_COST:[0,400,900],
    WORKER_CD:[0,180,120],             // 自动制作冷却帧
    SPEED_MULT:[1,0.85,0.70,0.55],
    TIP_MULT:[1,1.2,1.5,2.0],
    PATIENCE_MULT:[1,1.2,1.4,1.6],
};

// 咖啡配方
const RECIPES = [
    {name:'美式',      icon:'☕', color:'#8B4513', price:15, cost:3},
    {name:'拿铁',      icon:'🥛', color:'#D2B48C', price:22, cost:5},
    {name:'卡布奇诺',  icon:'🫧', color:'#F5DEB3', price:25, cost:6},
    {name:'摩卡',      icon:'🍫', color:'#654321', price:28, cost:7},
    {name:'焦糖玛奇朵',icon:'🍯', color:'#DAA520', price:30, cost:8},
    {name:'抹茶拿铁',  icon:'🍵', color:'#90EE90', price:26, cost:6},
];

// 顾客类型
const CUST_TYPES = [
    {name:'上班族',    emoji:'👔', pat:1.0, tip:1.0},
    {name:'学生',      emoji:'📚', pat:1.3, tip:0.8},
    {name:'商务人士',  emoji:'💼', pat:0.8, tip:1.5},
    {name:'情侣',      emoji:'💑', pat:1.5, tip:1.2},
    {name:'艺术家',    emoji:'🎨', pat:2.0, tip:0.6},
    {name:'老奶奶',    emoji:'👵', pat:0.6, tip:2.0},
];

const ORDER_TPL = [
    '来杯{0}','要一杯{0}','我想要{0}','给我{0}谢谢','一杯{0}打包带走'
];

// 座位位置（相对坐标）
const SEATS = [
    {x:.15,y:.45},{x:.15,y:.62},
    {x:.38,y:.45},{x:.38,y:.62},
    {x:.58,y:.45},{x:.58,y:.62},
    {x:.78,y:.45},{x:.78,y:.62},
];

// 商店项
const SHOP = [
    {name:'制作速度',desc:'所有咖啡制作速度提升',icon:'⚡',key:'speed',costs:[0,200,500,1000],max:3},
    {name:'小费提升',desc:'顾客给更多小费',      icon:'💰',key:'tips', costs:[0,200,500,1000],max:3},
    {name:'耐心提升',desc:'顾客等待更久',        icon:'⏳',key:'pat',  costs:[0,200,500,1000],max:3},
    {name:'座位扩充',desc:'增加可服务座位',      icon:'🪑',key:'seats',costs:[0,150,350],      max:2},
    {name:'雇佣咖啡师',desc:'自动制作咖啡',     icon:'👨‍🍳',key:'worker',costs:[0,400,900],    max:2},
];

// ===== 游戏状态 =====
var G = {};

function resetState() {
    G.state = 'menu';
    G.money = 50;
    G.totalEarned = 0;
    G.score = 0;
    G.day = 1;
    G.dayTimer = CFG.DAY_LEN;
    G.streak = 0;
    G.maxStreak = 0;
    G.combo = 0;
    G.comboTimer = 0;
    G.customers = [];
    G.activeOrder = null;      // 当前正在服务的顾客引用
    G.makingIdx = -1;          // 正在制作的咖啡索引
    G.makeProg = 0;            // 制作进度 0-1
    G.particles = [];
    G.floats = [];
    G.shopOpen = false;
    G.upgrade = {speed:1,tips:1,pat:1,seats:0,worker:0};
    G.workerTimer = 0;
    G.workerAuto = false;      // 咖啡师是否在自动制作
    G.spawnTimer = 60;         // 首个顾客稍延迟
    G.spawnRate = CFG.BASE_SPAWN;
    G.stats = {served:0,lost:0,total:0,maxCombo:0,dayEarn:0,dayTips:0,dayLost:0};
    G.highScore = parseInt(localStorage.getItem('cafe_hs')||'0');
}
resetState();

// ===== Canvas =====
const cv = document.getElementById('gameCanvas');
const cx = cv.getContext('2d');
let S = 1; // scale

function resize() {
    const r = CFG.W/CFG.H;
    let w = window.innerWidth, h = window.innerHeight;
    if (w/h > r) { h = h; w = h*r; } else { w = w; h = w/r; }
    cv.width = CFG.W; cv.height = CFG.H;
    cv.style.width = w+'px'; cv.style.height = h+'px';
    cv.style.marginLeft = ((window.innerWidth-w)/2)+'px';
    cv.style.marginTop  = ((window.innerHeight-h)/2)+'px';
    S = w/CFG.W;
}
resize();
window.addEventListener('resize', resize);

// ===== 音频 =====
const Audio = {
    ctx: null,
    init(){ if(!this.ctx) this.ctx = new (window.AudioContext||window.webkitAudioContext)(); },
    beep(f,dur,type){
        this.init(); if(!this.ctx) return;
        const o=this.ctx.createOscillator(), g=this.ctx.createGain();
        o.connect(g); g.connect(this.ctx.destination);
        o.type=type||'sine'; o.frequency.value=f;
        g.gain.value=0.12; g.gain.exponentialRampToValueAtTime(0.001,this.ctx.currentTime+dur);
        o.start(); o.stop(this.ctx.currentTime+dur);
    },
    click(){this.beep(800,0.08)},
    serve(){const t=this.ctx?this.ctx.currentTime:0;this.init();if(!this.ctx)return;
        [523,659,784].forEach((f,i)=>{const o=this.ctx.createOscillator(),g=this.ctx.createGain();
        o.connect(g);g.connect(this.ctx.destination);o.frequency.value=f;g.gain.value=0.1;
        g.gain.exponentialRampToValueAtTime(0.001,this.ctx.currentTime+0.3+i*0.01);
        o.start(this.ctx.currentTime+i*0.08);o.stop(this.ctx.currentTime+0.35+i*0.08);});
    },
    coin(){this.beep(1200,0.12);this.beep(1500,0.1)},
    fail(){this.beep(250,0.3,'sawtooth')},
    upgrade(){[523,659,784,1047].forEach((f,i)=>{setTimeout(()=>this.beep(f,0.12),i*80)})},
};

// ===== 粒子 & 浮字 =====
function spawnParticles(x,y,color,n){
    for(let i=0;i<(n||8);i++){
        const a=Math.PI*2/n*i, sp=1.5+Math.random()*2.5;
        G.particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,decay:0.02+Math.random()*0.015,
            sz:3+Math.random()*3,color});
    }
}
function addFloat(x,y,text,color,sz){
    G.floats.push({x,y,text,color:color||'#FFF',sz:sz||18,life:1,decay:0.018});
}
function updateParticles(){
    for(let i=G.particles.length-1;i>=0;i--){
        const p=G.particles[i];
        p.x+=p.vx; p.y+=p.vy; p.vy-=0.06; p.life-=p.decay;
        if(p.life<=0) G.particles.splice(i,1);
    }
    for(let i=G.floats.length-1;i>=0;i--){
        const f=G.floats[i]; f.y-=0.8; f.life-=f.decay;
        if(f.life<=0) G.floats.splice(i,1);
    }
}
function drawParticles(){
    G.particles.forEach(p=>{
        cx.globalAlpha=p.life;
        cx.fillStyle=p.color;
        cx.beginPath(); cx.arc(p.x,p.y,p.sz*p.life,0,Math.PI*2); cx.fill();
    });
    cx.globalAlpha=1;
    G.floats.forEach(f=>{
        cx.globalAlpha=f.life;
        cx.fillStyle=f.color;
        cx.font='bold '+f.sz+'px sans-serif';
        cx.textAlign='center';
        cx.fillText(f.text,f.x,f.y);
    });
    cx.globalAlpha=1;
}

// ===== 圆角矩形 =====
function rrect(x,y,w,h,r){
    cx.beginPath();
    cx.moveTo(x+r,y); cx.lineTo(x+w-r,y); cx.quadraticCurveTo(x+w,y,x+w,y+r);
    cx.lineTo(x+w,y+h-r); cx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    cx.lineTo(x+r,y+h); cx.quadraticCurveTo(x,y+h,x,y+h-r);
    cx.lineTo(x,y+r); cx.quadraticCurveTo(x,y,x+r,y);
    cx.closePath();
}

// ===== 按钮 =====
function drawBtn(x,y,w,h,text,c1,c2){
    const g=cx.createLinearGradient(x,y,x,y+h);
    g.addColorStop(0,c1); g.addColorStop(1,c2);
    cx.fillStyle=g; rrect(x,y,w,h,h/2); cx.fill();
    cx.strokeStyle='rgba(255,255,255,0.25)'; cx.lineWidth=2; rrect(x,y,w,h,h/2); cx.stroke();
    cx.fillStyle='#FFF'; cx.font='bold '+Math.min(20,h*0.45)+'px sans-serif';
    cx.textAlign='center'; cx.textBaseline='middle';
    cx.fillText(text,x+w/2,y+h/2);
    cx.textBaseline='alphabetic';
}
function inRect(px,py,x,y,w,h){return px>=x&&px<=x+w&&py>=y&&py<=y+h;}

// ===== 背景 =====
function drawBg(){
    const g=cx.createLinearGradient(0,0,0,CFG.H);
    g.addColorStop(0,'#2C1810'); g.addColorStop(0.4,'#4A2C17'); g.addColorStop(1,'#1A0F0A');
    cx.fillStyle=g; cx.fillRect(0,0,CFG.W,CFG.H);
    cx.globalAlpha=0.025; cx.font='140px serif'; cx.textAlign='center';
    cx.fillStyle='#FFF';
    cx.fillText('☕',CFG.W*0.15,CFG.H*0.35);
    cx.fillText('☕',CFG.W*0.85,CFG.H*0.7);
    cx.globalAlpha=1;
}

// ===== 顾客系统 =====
function spawnCustomer(){
    const sc=CFG.SEAT_CNT[G.upgrade.seats];
    const occ=G.customers.map(c=>c.si);
    const free=[];
    for(let i=0;i<sc;i++) if(!occ.includes(i)) free.push(i);
    if(!free.length) return;

    const si=free[Math.floor(Math.random()*free.length)];
    const seat=SEATS[si];
    const ct=CUST_TYPES[Math.floor(Math.random()*CUST_TYPES.length)];
    const ci=Math.floor(Math.random()*RECIPES.length);
    const tpl=ORDER_TPL[Math.floor(Math.random()*ORDER_TPL.length)];
    const maxP=CFG.BASE_PATIENCE*CFG.PATIENCE_MULT[G.upgrade.pat]*ct.pat;

    G.customers.push({
        si, x:-50, tx:seat.x*CFG.W, y:seat.y*CFG.H-40,
        ct, ci, order:tpl.replace('{0}',RECIPES[ci].name),
        patience:maxP, maxPat:maxP,
        state:'entering', servedTimer:0
    });
    G.stats.total++;
}

function updateCustomers(dt){
    for(let i=G.customers.length-1;i>=0;i--){
        const c=G.customers[i];
        if(c.state==='entering'){
            c.x+=(c.tx-c.x)*0.06;
            if(Math.abs(c.x-c.tx)<2){c.x=c.tx; c.state='waiting';}
        } else if(c.state==='waiting'){
            c.patience-=dt;
            if(c.patience<=0){
                c.state='leaving'; G.stats.lost++; G.stats.dayLost++;
                G.streak=0; G.combo=0;
                addFloat(c.x,c.y-30,'😤 太慢了！','#FF4444',16);
                Audio.fail();
            }
        } else if(c.state==='served'){
            c.servedTimer+=dt;
            if(c.servedTimer>80) c.state='leaving';
        } else if(c.state==='leaving'){
            c.x-=3;
            if(c.x<-60) G.customers.splice(i,1);
        }
    }
}

function drawCustomers(){
    G.customers.forEach(c=>{
        // 椅子
        cx.fillStyle='#6B4226';
        cx.beginPath(); cx.arc(c.x,c.y+42,14,0,Math.PI*2); cx.fill();

        // 身体
        cx.font='34px serif'; cx.textAlign='center';
        cx.fillText(c.ct.emoji, c.x, c.y+22);

        // 耐心条
        if(c.state==='waiting'){
            const bw=50,bh=6,bx=c.x-bw/2,by=c.y-32;
            const pct=Math.max(0,c.patience/c.maxPat);
            cx.fillStyle='#222'; cx.fillRect(bx,by,bw,bh);
            cx.fillStyle=pct>0.5?'#4CAF50':pct>0.25?'#FFC107':'#F44336';
            cx.fillRect(bx,by,bw*pct,bh);
            cx.strokeStyle='#000'; cx.lineWidth=1; cx.strokeRect(bx,by,bw,bh);
        }

        // 订单气泡
        if(c.state==='waiting'||c.state==='entering'){
            const bx=c.x, by=c.y-48;
            const rec=RECIPES[c.ci];
            cx.fillStyle='rgba(255,255,255,0.93)';
            rrect(bx-48,by-22,96,36,8); cx.fill();
            cx.strokeStyle=rec.color; cx.lineWidth=2; rrect(bx-48,by-22,96,36,8); cx.stroke();
            cx.fillStyle='#333'; cx.font='12px sans-serif'; cx.textAlign='center';
            cx.fillText(rec.icon+' '+rec.name, bx, by-1);
        }

        // 满意
        if(c.state==='served'){
            cx.font='22px serif'; cx.fillText('😊',c.x,c.y-8);
        }
    });
}

// ===== 制作系统 =====
function startMake(ci){
    if(G.activeOrder||G.makingIdx>=0) return;
    // 找最急的顾客
    const ws=G.customers.filter(c=>c.state==='waiting'&&c.ci===ci);
    if(!ws.length) return;
    ws.sort((a,b)=>a.patience-b.patience);
    G.activeOrder=ws[0];
    G.makingIdx=ci;
    G.makeProg=0;
    G.state='making';
}

function updateMaking(dt){
    if(G.state!=='making'||G.makingIdx<0) return;
    const sm=CFG.SPEED_MULT[G.upgrade.speed];
    const ct=CFG.COOK_TIME[G.makingIdx]*sm;
    G.makeProg+=dt/ct;
    if(G.makeProg>=1) doServe();
}

function doServe(){
    if(!G.activeOrder) return;
    const c=G.activeOrder, rec=RECIPES[G.makingIdx];
    const pratio=c.patience/c.maxPat;

    // 连击
    G.streak=Math.min(G.streak+1,CFG.MAX_STREAK);
    G.combo=G.streak;
    if(G.combo>G.stats.maxCombo) G.stats.maxCombo=G.combo;
    G.comboTimer=0;

    // 计算收入
    const streakMul=1+G.streak*CFG.STREAK_BONUS;
    let earn=Math.floor(rec.price*streakMul);
    let tip=Math.floor(rec.cost*CFG.TIP_MULT[G.upgrade.tips]*streakMul);
    if(pratio>0.5) tip=Math.floor(tip*1.5);

    const total=earn+tip;
    G.money+=total; G.totalEarned+=total; G.score+=total;
    G.stats.dayEarn+=earn; G.stats.dayTips+=tip; G.stats.served++;

    c.state='served'; c.servedTimer=0;
    spawnParticles(c.x,c.y-15,'#FFD700',8);
    addFloat(c.x,c.y-45,'+'+total+'💰','#FFD700',20);
    if(G.streak>=3) addFloat(c.x,c.y-75,G.streak+' 连击!','#FF6B6B',15);

    Audio.serve();
    if(tip>0) setTimeout(()=>Audio.coin(),150);

    G.activeOrder=null; G.makingIdx=-1; G.makeProg=0;
    G.state='playing'; G.workerAuto=false;
}

// ===== 咖啡师自动 =====
function updateWorker(dt){
    if(!G.upgrade.worker) return;
    G.workerTimer+=dt;
    const cd=CFG.WORKER_CD[G.upgrade.worker];
    if(G.workerTimer>=cd&&!G.activeOrder){
        G.workerTimer=0;
        const ws=G.customers.filter(c=>c.state==='waiting');
        if(ws.length){
            ws.sort((a,b)=>a.patience-b.patience);
            G.activeOrder=ws[0]; G.makingIdx=ws[0].ci; G.makeProg=0; G.workerAuto=true;
        }
    }
    if(G.workerAuto&&G.makingIdx>=0){
        const sm=CFG.SPEED_MULT[G.upgrade.speed];
        G.makeProg+=dt/(CFG.COOK_TIME[G.makingIdx]*sm);
        if(G.makeProg>=1) doServe();
    }
}

// ===== 主循环 =====
let lastT=0;
function loop(ts){
    const dt=Math.min((ts-lastT)/16.667,3);
    lastT=ts;
    update(dt);
    render();
    requestAnimationFrame(loop);
}

function update(dt){
    updateParticles();
    if(G.state==='menu'||G.state==='gameover') return;

    if(G.state==='intermission'){
        G.dayTimer-=dt;
        if(G.dayTimer<=0){
            G.day++; G.dayTimer=CFG.DAY_LEN; G.spawnRate=Math.max(CFG.MIN_SPAWN,CFG.BASE_SPAWN-G.day*7);
            G.spawnTimer=30; G.customers=[]; G.streak=0; G.combo=0;
            G.stats.dayEarn=0; G.stats.dayTips=0; G.stats.dayLost=0; G.stats.served=0; G.stats.lost=0; G.stats.total=0;
            G.state='playing';
        }
        return;
    }

    // 一天倒计时（秒）
    G.dayTimer-=dt/60;
    if(G.dayTimer<=0){
        // 一天结束
        if(G.day>=5||(G.day>=3&&G.stats.lost>G.stats.served)){
            G.state='gameover';
            if(G.score>G.highScore){G.highScore=G.score;localStorage.setItem('cafe_hs',G.score);}
        } else {
            G.state='intermission'; G.dayTimer=CFG.INTERMISSION;
        }
        return;
    }

    // 生成顾客
    G.spawnTimer+=dt;
    if(G.spawnTimer>=G.spawnRate){
        G.spawnTimer=0;
        spawnCustomer();
    }

    updateCustomers(dt/60);
    updateMaking(dt);
    updateWorker(dt);

    // 连击超时
    if(G.combo>0){
        G.comboTimer+=dt/60;
        if(G.comboTimer>8){G.combo=0;G.streak=0;}
    }
}

function getPos(e){
    const r=cv.getBoundingClientRect();
    const cx2=e.touches?e.touches[0].clientX:e.clientX;
    const cy2=e.touches?e.touches[0].clientY:e.clientY;
    return {x:(cx2-r.left)/S, y:(cy2-r.top)/S};
}

function onClick(e){
    e.preventDefault();
    const p=getPos(e);
    Audio.init(); Audio.click();

    if(G.state==='menu'){
        if(inRect(p.x,p.y,CFG.W/2-100,CFG.H*0.82,200,48)){startGame();return;}
        if(inRect(p.x,p.y,CFG.W/2-70,CFG.H*0.91,140,35)){
            alert('☕ 咖啡馆 - 操作说明\n\n'+
                '1. 点击下方咖啡图标为等待中的顾客制作\n'+
                '2. 越快完成顾客越满意，小费越多\n'+
                '3. 连续成功服务获得连击加成\n'+
                '4. 用金币升级制作速度、小费、座位等\n'+
                '5. 雇佣咖啡师可以自动制作咖啡\n\n'+
                '提示：注意顾客头顶的耐心条！');return;}
    }

    if(G.state==='gameover'){
        if(inRect(p.x,p.y,CFG.W/2-100,CFG.H*0.79,200,46)){startGame();return;}
        if(inRect(p.x,p.y,CFG.W/2-60,CFG.H*0.88,120,34)){resetState();return;}
    }

    if(G.state==='playing'||G.state==='making'){
        // 商店按钮
        if(inRect(p.x,p.y,CFG.W-95,48,85,32)){G.shopOpen=!G.shopOpen;return;}
        if(G.shopOpen){shopClick(p.x,p.y);return;}

        // 咖啡栏
        const by=CFG.H*0.82, ox=CFG.W*0.16;
        for(let i=0;i<6;i++){
            if(inRect(p.x,p.y,ox+i*88,by+16,80,44)){
                if(!G.activeOrder&&G.makingIdx<0) startMake(i);
                return;
            }
        }
    }
}

function shopClick(x,y){
    const sx=CFG.W/2-210,sy=CFG.H*0.08,sw=420;
    // 关闭
    const dx=x-(sx+sw-24), dy=y-(sy+24);
    if(dx*dx+dy*dy<=196){G.shopOpen=false;return;}

    for(let i=0;i<SHOP.length;i++){
        const it=SHOP[i], ix=sx+18, iy=sy+70+i*70, iw=sw-36, ih=60;
        if(!inRect(x,y,ix,iy,iw,ih)) continue;
        const lv=it.key==='speed'?G.upgrade.speed:it.key==='tips'?G.upgrade.tips:
                  it.key==='pat'?G.upgrade.pat:it.key==='seats'?G.upgrade.seats:G.upgrade.worker;
        if(lv>=it.max) return;
        const cost=it.costs[lv];
        if(G.money>=cost){
            G.money-=cost;
            if(it.key==='speed') G.upgrade.speed++;
            else if(it.key==='tips') G.upgrade.tips++;
            else if(it.key==='pat') G.upgrade.pat++;
            else if(it.key==='seats') G.upgrade.seats++;
            else G.upgrade.worker++;
            Audio.upgrade();
            spawnParticles(x,y,'#FFD700',10);
            addFloat(x,y-20,'升级成功!','#4CAF50',16);
        }
        return;
    }
}

function startGame(){
    resetState();
    G.state='playing';
    G.money=50; G.totalEarned=50; G.score=0;
    G.day=1; G.dayTimer=CFG.DAY_LEN;
}

cv.addEventListener('click',onClick);
cv.addEventListener('touchstart',function(e){e.preventDefault();onClick(e);},{passive:false});

document.addEventListener('keydown',function(e){
    if(G.state==='menu'&&e.key==='Enter') startGame();
    if(G.state==='gameover'&&e.key==='Enter') startGame();
    if(G.state==='gameover'&&e.key==='Escape') resetState();
    if((G.state==='playing'||G.state==='making')&&!G.shopOpen){
        const n=parseInt(e.key);
        if(n>=1&&n<=6&&!G.activeOrder&&G.makingIdx<0) startMake(n-1);
    }
    if(e.key==='Escape'&&G.shopOpen) G.shopOpen=false;
});
