<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>城市建设</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; color: #fff; }
        
        .game-container { width: 100%; flex: 1; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: #ffd700; }
        .stats { display: flex; gap: 20px; font-size: 14px; }
        
        .city-grid { flex: 1; display: flex; justify-content: center; align-items: center; margin-bottom: 15px; }
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 15px; }
        .cell { width: 50px; height: 50px; border-radius: 8px; background: rgba(255,255,255,0.1); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        
        .build-area { display: flex; gap: 10px; flex-wrap: wrap; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 15px; }
        .build-btn { padding: 10px 15px; border: none; border-radius: 10px; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .build-btn.selected { border: 2px solid #ffd700; }
        
        .build-btn.residential { background: linear-gradient(135deg, #4ecdc4, #48c78e); color: #fff; }
        .build-btn.commercial { background: linear-gradient(135deg, #ffa502, #ffd700); color: #fff; }
        .build-btn.industrial { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
        .build-btn.park { background: linear-gradient(135deg, #48c78e, #4ecdc4); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="title">🏙️ 城市建设</div>
            <div class="stats">
                <span>💰 资金: <span id="money">5000</span></span>
                <span>👥 人口: <span id="population">0</span></span>
                <span>🏗️ 建筑: <span id="buildings">0</span></span>
            </div>
        </div>
        
        <div class="city-grid">
            <div class="grid" id="cityGrid"></div>
        </div>
        
        <div class="build-area">
            <button class="build-btn residential" onclick="selectBuilding('residential')">🏠 住宅 (1000)</button>
            <button class="build-btn commercial" onclick="selectBuilding('commercial')">🏢 商业 (1500)</button>
            <button class="build-btn industrial" onclick="selectBuilding('industrial')">🏭 工业 (2000)</button>
            <button class="build-btn park" onclick="selectBuilding('park')">🌳 公园 (500)</button>
        </div>
    </div>
    
    <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>

    <script src="game_core.js"></script>
    <script>
        const GAME_NAME = '城市建设';
        GameCore.init({ highScore: GAME_NAME });
        
        const buildingTypes = {
            residential: { emoji: '🏠', cost: 1000, population: 10, name: '住宅' },
            commercial: { emoji: '🏢', cost: 1500, population: 5, name: '商业' },
            industrial: { emoji: '🏭', cost: 2000, population: 15, name: '工业' },
            park: { emoji: '🌳', cost: 500, population: 0, name: '公园' }
        };
        
        const gridSize = 5;
        let grid = [];
        let money = 5000;
        let population = 0;
        let buildings = 0;
        let selectedBuilding = null;
        
        function initGame() {
            grid = [];
            for (let i = 0; i < gridSize * gridSize; i++) {
                grid.push(null);
            }
            
            renderGrid();
            updateUI();
        }
        
        function updateUI() {
            document.getElementById('money').textContent = money;
            document.getElementById('population').textContent = population;
            document.getElementById('buildings').textContent = buildings;
            
            GameCore.highScore.set(GAME_NAME, population);
        }
        
        function renderGrid() {
            const gridEl = document.getElementById('cityGrid');
            gridEl.innerHTML = '';
            
            grid.forEach((cell, index) => {
                const el = document.createElement('div');
                el.className = 'cell';
                
                if (cell) {
                    el.textContent = buildingTypes[cell].emoji;
                    el.style.background = getBuildingColor(cell);
                }
                
                el.onclick = () => handleCellClick(index);
                gridEl.appendChild(el);
            });
        }
        
        function getBuildingColor(type) {
            const colors = {
                residential: 'linear-gradient(135deg, #4ecdc4, #48c78e)',
                commercial: 'linear-gradient(135deg, #ffa502, #ffd700)',
                industrial: 'linear-gradient(135deg, #667eea, #764ba2)',
                park: 'linear-gradient(135deg, #48c78e, #4ecdc4)'
            };
            return colors[type];
        }
        
        function selectBuilding(type) {
            selectedBuilding = type;
            
            document.querySelectorAll('.build-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
            
            event.currentTarget.classList.add('selected');
            
            GameCore.hints.show(`选择了 ${buildingTypes[type].name}`);
        }
        
        function handleCellClick(index) {
            if (!selectedBuilding) {
                GameCore.hints.show('请先选择要建造的建筑！');
                return;
            }
            
            const building = buildingTypes[selectedBuilding];
            
            if (grid[index]) {
                grid[index] = null;
                buildings--;
                population -= building.population;
                money += Math.floor(building.cost * 0.5);
                
                GameCore.hints.show(`拆除了 ${building.name}，回收 ${Math.floor(building.cost * 0.5)} 金币`);
            } else {
                if (money >= building.cost) {
                    grid[index] = selectedBuilding;
                    buildings++;
                    population += building.population;
                    money -= building.cost;
                    
                    GameCore.hints.show(`建造了 ${building.name}！`);
                } else {
                    GameCore.hints.show('资金不足！');
                    return;
                }
            }
            
            renderGrid();
            updateUI();
        }
        
        initGame();
        GameCore.touch.enableAllButtons();
    </script>
</body>
</html>
