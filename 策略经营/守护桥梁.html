<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>守护桥梁</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); min-height: 100vh; overflow: hidden; }
        .game-container { width: 100%; height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 10px; }
        .stat { display: flex; flex-direction: column; align-items: center; color: #fff; }
        .stat-label { font-size: 12px; opacity: 0.8; }
        .stat-value { font-size: 24px; font-weight: bold; color: #ffd700; }
        
        .game-area { flex: 1; position: relative; background: rgba(0,0,0,0.3); border-radius: 15px; overflow: hidden; }
        #gameCanvas { width: 100%; height: 100%; display: block; }
        
        .controls { display: flex; gap: 10px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
        .btn { padding: 12px 25px; border: none; border-radius: 25px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; }
        .btn-secondary { background: linear-gradient(135deg, #4facfe, #00f2fe); color: #fff; }
        
        .info-panel { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: #fff; padding: 10px; border-radius: 10px; font-size: 12px; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 10px; font-size: 14px; }
    </style>
    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">波次</div>
                <div class="stat-value" id="wave">1</div>
            </div>
            <div class="stat">
                <div class="stat-label">金币</div>
                <div class="stat-value" id="gold">200</div>
            </div>
            <div class="stat">
                <div class="stat-label">桥梁耐久</div>
                <div class="stat-value" id="durability">100</div>
            </div>
        </div>
        
        <div class="game-area">
            <canvas id="gameCanvas"></canvas>
            <div class="info-panel">
                <div>💰 点击放置维修工</div>
                <div>🔧 修复受损桥段</div>
                <div>⚔️ 敌人会攻击桥梁</div>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" id="btnStart">▶️ 开始</button>
            <button class="btn btn-secondary" id="btnRepair">🔧 紧急修复</button>
        </div>
        
        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let gold = 200;
        let durability = 100;
        let wave = 1;
        let gameRunning = false;
        
        let bridge = [];
        let workers = [];
        let enemies = [];
        let particles = [];
        
        const GAME_NAME = '守护桥梁';
        
        GameCore.init({ highScore: GAME_NAME });
        
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            initBridge();
        }
        
        function initBridge() {
            bridge = [];
            const segments = 15;
            const segmentWidth = canvas.width / segments;
            
            for (let i = 0; i < segments; i++) {
                bridge.push({
                    x: segmentWidth * i,
                    y: canvas.height / 2,
                    width: segmentWidth,
                    height: 20,
                    hp: 100,
                    maxHp: 100
                });
            }
        }
        
        class Worker {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.targetSegment = null;
                this.speed = 2;
                this.repairPower = 5;
            }
            
            update() {
                // 找最低血量的桥段
                if (!this.targetSegment || this.targetSegment.hp >= this.targetSegment.maxHp) {
                    this.targetSegment = bridge.reduce((min, seg) => 
                        seg.hp < min.hp ? seg : min, bridge[0]);
                }
                
                if (this.targetSegment) {
                    const dx = this.targetSegment.x + this.targetSegment.width / 2 - this.x;
                    const dy = this.targetSegment.y - 30 - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist > 5) {
                        this.x += (dx / dist) * this.speed;
                        this.y += (dy / dist) * this.speed;
                    } else {
                        // 修复
                        if (this.targetSegment.hp < this.targetSegment.maxHp) {
                            this.targetSegment.hp = Math.min(this.targetSegment.maxHp, 
                                this.targetSegment.hp + this.repairPower);
                            
                            // 修复粒子
                            particles.push({
                                x: this.x,
                                y: this.y + 20,
                                vx: (Math.random() - 0.5) * 2,
                                vy: -Math.random() * 2,
                                life: 1,
                                color: '#48c78e'
                            });
                        }
                    }
                }
            }
            
            draw() {
                // 工人
                ctx.fillStyle = '#ffd700';
                ctx.beginPath();
                ctx.arc(this.x, this.y, 12, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#333';
                ctx.font = 'bold 10px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('🔧', this.x, this.y + 4);
            }
        }
        
        class Enemy {
            constructor() {
                this.x = -30;
                this.y = canvas.height / 2 - 50;
                this.width = 30;
                this.height = 40;
                this.speed = 1 + wave * 0.1;
                this.attackPower = 10;
                this.lastAttack = 0;
                this.targetSegment = null;
            }
            
            update() {
                this.x += this.speed;
                
                // 找最近的桥段
                if (!this.targetSegment) {
                    this.targetSegment = bridge.find(seg => 
                        this.x + this.width > seg.x && this.x < seg.x + seg.width);
                }
                
                // 攻击桥段
                if (this.targetSegment && this.x + this.width > this.targetSegment.x) {
                    if (Date.now() - this.lastAttack > 1000) {
                        this.targetSegment.hp -= this.attackPower;
                        this.lastAttack = Date.now();
                        
                        // 攻击粒子
                        for (let i = 0; i < 5; i++) {
                            particles.push({
                                x: this.x + this.width,
                                y: this.targetSegment.y,
                                vx: Math.random() * 3,
                                vy: (Math.random() - 0.5) * 3,
                                life: 1,
                                color: '#f5576c'
                            });
                        }
                    }
                }
                
                // 到达终点
                if (this.x > canvas.width) {
                    return false;
                }
                
                return true;
            }
            
            draw() {
                ctx.fillStyle = '#f5576c';
                ctx.fillRect(this.x, this.y, this.width, this.height);
                
                // 眼睛
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(this.x + 10, this.y + 12, 5, 0, Math.PI * 2);
                ctx.arc(this.x + 22, this.y + 12, 5, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(this.x + 11, this.y + 12, 2, 0, Math.PI * 2);
                ctx.arc(this.x + 23, this.y + 12, 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function spawnWave() {
            const count = 3 + wave;
            
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    enemies.push(new Enemy());
                }, i * 2000);
            }
        }
        
        function updateParticles() {
            particles = particles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;
                return p.life > 0;
            });
        }
        
        function drawParticles() {
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }
        
        function drawBridge() {
            bridge.forEach(seg => {
                const ratio = seg.hp / seg.maxHp;
                
                // 桥段颜色根据血量变化
                const r = Math.floor(255 * (1 - ratio));
                const g = Math.floor(200 * ratio);
                ctx.fillStyle = `rgb(${r}, ${g}, 50)`;
                
                ctx.fillRect(seg.x, seg.y, seg.width, seg.height);
                
                // 损坏效果
                if (ratio < 0.5) {
                    ctx.fillStyle = 'rgba(0,0,0,0.3)';
                    ctx.fillRect(seg.x + 5, seg.y + 5, seg.width - 10, seg.height - 10);
                }
                
                // 血条
                ctx.fillStyle = '#333';
                ctx.fillRect(seg.x, seg.y - 10, seg.width, 5);
                ctx.fillStyle = ratio > 0.5 ? '#48c78e' : ratio > 0.25 ? '#ffd700' : '#f5576c';
                ctx.fillRect(seg.x, seg.y - 10, seg.width * ratio, 5);
            });
        }
        
        function drawWater() {
            ctx.fillStyle = 'rgba(0, 150, 255, 0.3)';
            ctx.fillRect(0, canvas.height / 2 + 20, canvas.width, canvas.height / 2);
            
            // 波浪
            ctx.strokeStyle = 'rgba(255,255,255,0.2)';
            ctx.lineWidth = 2;
            const time = Date.now() / 500;
            
            ctx.beginPath();
            for (let x = 0; x < canvas.width; x += 10) {
                const y = canvas.height / 2 + 40 + Math.sin(x / 50 + time) * 10;
                if (x === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }
        
        function updateStats() {
            document.getElementById('wave').textContent = wave;
            document.getElementById('gold').textContent = gold;
            
            const totalDurability = bridge.reduce((sum, seg) => sum + seg.hp, 0);
            const avgDurability = Math.round(totalDurability / bridge.length);
            document.getElementById('durability').textContent = avgDurability;
            
            if (GameCore.highScore.set(GAME_NAME, gold)) {
                GameCore.hints.show('新纪录！金币: ' + gold);
            }
            
            if (bridge.every(seg => seg.hp <= 0)) {
                gameRunning = false;
                GameCore.hints.show('桥梁倒塌！游戏结束！\n击败了 ' + (wave - 1) + ' 波敌人', 5000);
            }
        }
        
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            drawWater();
            drawBridge();
            
            if (gameRunning) {
                // 更新敌人
                enemies = enemies.filter(enemy => enemy.update());
                
                // 检查波次完成
                if (enemies.length === 0) {
                    wave++;
                    gold += 50;
                    updateStats();
                    setTimeout(() => {
                        if (gameRunning) spawnWave();
                    }, 3000);
                }
            }
            
            // 更新工人
            workers.forEach(worker => worker.update());
            
            // 绘制
            enemies.forEach(enemy => enemy.draw());
            workers.forEach(worker => worker.draw());
            
            updateParticles();
            drawParticles();
            
            updateStats();
            requestAnimationFrame(gameLoop);
        }
        
        // 点击放置工人
        canvas.addEventListener('click', e => {
            if (!gameRunning) return;
            
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            if (gold >= 50) {
                gold -= 50;
                workers.push(new Worker(x, y));
                updateStats();
            }
        });
        
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            if (!gameRunning) return;
            
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            
            if (gold >= 50) {
                gold -= 50;
                workers.push(new Worker(x, y));
                updateStats();
            }
        }, { passive: false });
        
        document.getElementById('btnStart').onclick = () => {
            if (!gameRunning) {
                gameRunning = true;
                spawnWave();
            }
        };
        
        document.getElementById('btnRepair').onclick = () => {
            if (gold >= 100) {
                gold -= 100;
                bridge.forEach(seg => {
                    seg.hp = seg.maxHp;
                });
                updateStats();
            }
        };
        
        // 初始化
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        gameLoop();
    </script>
</body>
</html>
