<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>


    <div class="game-guide" style="margin-bottom:15px;padding:10px;background:#fff3f3;border-radius:8px;border:1px solid #ffcccc;">
        <div style="font-weight:bold;color:#f5576c;margin-bottom:5px;">🎮 操作说明</div>
        <div style="font-size:14px;color:#666;">点击/触摸进行游戏，支持键盘操作</div>
    </div>

<canvas id="cv"></canvas>

  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script src="../game_core.js"></script>
<script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script>
(function(){
"use strict";

/* ===== Canvas Setup ===== */
var cv=document.getElementById("cv"),cx=cv.getContext("2d");
var W,H,SCALE=1;
function resize(){
    W=cv.width=window.innerWidth;
    H=cv.height=window.innerHeight;
    SCALE=Math.min(W/800,H/600);
}
resize();
window.addEventListener("resize",resize);

/* ===== Constants ===== */
var FPS=60;
var FOOD_TYPES=[
    {name:"煎饼果子",icon:"🥞",basePrice:8,cookTime:3,baseCost:3,color:"#f5a623",desc:"经典街头小吃"},
    {name:"臭豆腐",icon:"🧈",basePrice:12,cookTime:4,baseCost:5,color:"#8b6914",desc:"闻着臭吃着香"},
    {name:"糖葫芦",icon:"🍡",basePrice:10,cookTime:2,baseCost:4,color:"#e74c3c",desc:"酸甜可口"},
    {name:"烤冷面",icon:"🍜",basePrice:15,cookTime:5,baseCost:6,color:"#e67e22",desc:"东北特色美食"},
    {name:"奶茶",icon:"🧋",basePrice:18,cookTime:3,baseCost:7,color:"#d4a574",desc:"年轻人最爱"},
    {name:"炸鸡排",icon:"🍗",basePrice:20,cookTime:6,baseCost:8,color:"#f39c12",desc:"酥脆多汁"}
];

/* ===== Game State ===== */
var G={
    state:"menu", // menu, playing, paused, gameover
    money:100,
    day:1,
    maxDay:30,
    dayTime:0,
    dayDuration:60, // seconds per day
    customersServed:0,
    totalEarnings:0,
    score:0,
    bestScore:parseInt(localStorage.getItem("foodStreet_best")||"0"),
    // Stalls
    stalls:[],
    maxStalls:3,
    stallCost:200,
    // Customers
    customers:[],
    customerSpawnTimer:0,
    customerSpawnRate:3, // seconds
    customerQueue:[],
    maxQueue:5,
    // Upgrades
    upgradeLevels:{speed:1,quality:1,capacity:1},
    upgradeCosts:{speed:50,quality:80,capacity:60},
    // Particles
    particles:[],
    // Floating texts
    floatingTexts:[],
    // Cooking
    cookingSlots:[],
    // Stats
    dayCustomers:0,
    dayEarnings:0,
    dayTips:0,
    // UI
    selectedStall:-1,
    notification:"",
    notifyTimer:0,
    // Tutorial
    tutorialDone:false,
    tutorialStep:0,
    // Combo
    combo:0,
    comboTimer:0,
    maxCombo:0
};

/* ===== Stall Class ===== */
function Stall(x,y,typeIdx){
    this.x=x;
    this.y=y;
    this.typeIdx=typeIdx;
    this.level=1;
    this.cooking=false;
    this.cookProgress=0;
    this.cookTime=FOOD_TYPES[typeIdx].cookTime;
    this.queuedCustomers=[];
    this.earnings=0;
    this.served=0;
    this.maxQueue=3;
    this.prestige=0;
}

/* ===== Customer Class ===== */
function Customer(){
    this.x=-50;
    this.y=H*0.65+Math.random()*40;
    this.targetX=0;
    this.targetY=0;
    this.speed=1.5+Math.random()*1;
    this.patience=100;
    this.maxPatience=100;
    this.patienceDecay=0.3+Math.random()*0.2;
    this.wantedFood=Math.floor(Math.random()*FOOD_TYPES.length);
    this.state="walking"; // walking, waiting, eating, leaving
    this.served=false;
    this.tipMultiplier=1;
    this.size=20+Math.random()*8;
    this.happiness=50;
    this.waitTime=0;
    // Appearance
    this.bodyColor=["#ff6b6b","#4ecdc4","#45b7d1","#96ceb4","#ffeaa7","#dfe6e9","#fd79a8","#6c5ce7"][Math.floor(Math.random()*8)];
    this.hatType=Math.floor(Math.random()*4);
}

/* ===== Initialize Game ===== */
function initGame(){
    G.state="playing";
    G.money=100;
    G.day=1;
    G.dayTime=0;
    G.customersServed=0;
    G.totalEarnings=0;
    G.score=0;
    G.stalls=[];
    G.customers=[];
    G.customerQueue=[];
    G.particles=[];
    G.floatingTexts=[];
    G.cookingSlots=[];
    G.upgradeLevels={speed:1,quality:1,capacity:1};
    G.dayCustomers=0;
    G.dayEarnings=0;
    G.dayTips=0;
    G.selectedStall=-1;
    G.notification="";
    G.notifyTimer=0;
    G.combo=0;
    G.comboTimer=0;
    G.maxCombo=0;
    G.customerSpawnRate=3;
    // Start with 2 stalls
    G.stalls.push(new Stall(W*0.2,H*0.45,0));
    G.stalls.push(new Stall(W*0.5,H*0.45,1));
}

/* ===== Particles ===== */
function addParticle(x,y,color,count){
    for(var i=0;i<(count||5);i++){
        G.particles.push({
            x:x,y:y,
            vx:(Math.random()-0.5)*4,
            vy:-Math.random()*4-1,
            life:1,
            decay:0.02+Math.random()*0.02,
            size:3+Math.random()*4,
            color:color
        });
    }
}

function addFloatingText(x,y,text,color){
    G.floatingTexts.push({
        x:x,y:y,text:text,color:color,
        life:1,vy:-1.5
    });
}

/* ===== Customer Spawning ===== */
function spawnCustomer(){
    if(G.customerQueue.length>=G.maxQueue+G.upgradeLevels.capacity)return;
    var c=new Customer();
    var queueX=W*0.15+G.customerQueue.length*60;
    c.targetX=queueX;
    c.targetY=H*0.72;
    G.customerQueue.push(c);
}

/* ===== Serve Customer ===== */
function serveCustomer(stallIdx){
    var stall=G.stalls[stallIdx];
    if(!stall.cooking||stall.cookProgress<stall.cookTime)return;
    if(stall.queuedCustomers.length===0)return;
    var customer=stall.queuedCustomers.shift();
    var food=FOOD_TYPES[stall.typeIdx];
    var price=food.basePrice*stall.level;
    var qualityBonus=G.upgradeLevels.quality*0.2;
    var tip=Math.floor(price*0.2*(1+qualityBonus)*customer.tipMultiplier);
    var total=price+tip;
    G.money+=total;
    G.totalEarnings+=total;
    G.dayEarnings+=total;
    G.dayTips+=tip;
    G.customersServed++;
    G.dayCustomers++;
    G.combo++;
    G.comboTimer=3;
    if(G.combo>G.maxCombo)G.maxCombo=G.combo;
    var comboBonus=G.combo>=3?G.combo*2:0;
    if(comboBonus>0){
        G.money+=comboBonus;
        addFloatingText(stall.x,stall.y-30,"连击x"+G.combo+"! +"+comboBonus,"#ffd700");
    }
    G.score+=total+comboBonus;
    addFloatingText(stall.x,stall.y-10,"+"+total,"#4ecdc4");
    addParticle(stall.x,stall.y,food.color,8);
    customer.state="eating";
    customer.served=true;
    customer.happiness=100;
    // Update best score
    if(G.score>G.bestScore){
        G.bestScore=G.score;
        localStorage.setItem("foodStreet_best",G.bestScore.toString());
    }
}

/* ===== Day Management ===== */
function endDay(){
    G.day++;
    G.dayTime=0;
    G.dayCustomers=0;
    G.dayEarnings=0;
    G.dayTips=0;
    G.combo=0;
    // Increase difficulty
    G.customerSpawnRate=Math.max(1,3-(G.day-1)*0.08);
    G.maxQueue=Math.min(8,5+Math.floor(G.day/5));
    // Check game over
    if(G.day>G.maxDay){
        G.state="gameover";
        G.score+=G.money;
        if(G.score>G.bestScore){
            G.bestScore=G.score;
            localStorage.setItem("foodStreet_best",G.bestScore.toString());
        }
    }
    showNotification("第"+(G.day-1)+"天结束！今日收入："+G.dayEarnings+"金币");
}

/* ===== Notifications ===== */
function showNotification(text){
    G.notification=text;
    G.notifyTimer=3;
}

/* ===== Upgrade Functions ===== */
function buyUpgrade(type){
    var cost=G.upgradeCosts[type]*(G.upgradeLevels[type]);
    if(G.money>=cost&&G.upgradeLevels[type]<5){
        G.money-=cost;
        G.upgradeLevels[type]++;
        addFloatingText(W/2,H/2,type+"升级到Lv"+G.upgradeLevels[type]+"!","#4ecdc4");
        addParticle(W/2,H/2,"#4ecdc4",10);
    }
}

function buyStall(){
    if(G.money>=G.stallCost&&G.stalls.length<G.maxStalls){
        G.money-=G.stallCost;
        var positions=[
            {x:W*0.8,y:H*0.45},
            {x:W*0.35,y:H*0.5},
            {x:W*0.65,y:H*0.5}
        ];
        var pos=positions[G.stalls.length]||{x:W*0.5,y:H*0.5};
        var typeIdx=G.stalls.length%FOOD_TYPES.length;
        G.stalls.push(new Stall(pos.x,pos.y,typeIdx));
        G.stallCost=Math.floor(G.stallCost*1.5);
        addFloatingText(pos.x,pos.y-20,"新摊位开张！","#ffd700");
        addParticle(pos.x,pos.y,"#ffd700",12);
    }
}

/* ===== Input Handling ===== */
var mouseX=0,mouseY=0,touchActive=false;

function handleClick(x,y){
    if(G.state==="menu"){
        var btnX=W/2,btnY=H*0.65;
        if(Math.abs(x-btnX)<100*SCALE&&Math.abs(y-btnY)<30*SCALE){
            initGame();
        }
        return;
    }
    if(G.state==="gameover"){
        var btnX=W/2,btnY=H*0.7;
        if(Math.abs(x-btnX)<100*SCALE&&Math.abs(y-btnY)<30*SCALE){
            G.state="menu";
        }
        return;
    }
    if(G.state!=="playing")return;
    // Check stall clicks
    for(var i=0;i<G.stalls.length;i++){
        var s=G.stalls[i];
        var dist=Math.hypot(x-s.x,y-s.y);
        if(dist<40*SCALE){
            G.selectedStall=i;
            serveCustomer(i);
            return;
        }
    }
    // Check upgrade buttons
    var upgradeY=H*0.15;
    var upgradeX=W*0.82;
    if(x>upgradeX-50*SCALE&&x<upgradeX+50*SCALE){
        if(y>upgradeY-10*SCALE&&y<upgradeY+20*SCALE){
            buyUpgrade("speed");
            return;
        }
        if(y>upgradeY+30*SCALE&&y<upgradeY+60*SCALE){
            buyUpgrade("quality");
            return;
        }
        if(y>upgradeY+70*SCALE&&y<upgradeY+100*SCALE){
            buyUpgrade("capacity");
            return;
        }
    }
    // Check buy stall button
    var stallBtnY=H*0.9;
    var stallBtnX=W*0.82;
    if(x>stallBtnX-60*SCALE&&x<stallBtnX+60*SCALE&&y>stallBtnY-15*SCALE&&y<stallBtnY+15*SCALE){
        buyStall();
        return;
    }
    // Check pause button
    if(x>W-50*SCALE&&y<40*SCALE){
        G.state="paused";
        return;
    }
}

cv.addEventListener("mousedown",function(e){
    handleClick(e.clientX,e.clientY);
});
cv.addEventListener("touchstart",function(e){
    e.preventDefault();
    var t=e.touches[0];
    handleClick(t.clientX,t.clientY);
    touchActive=true;
});

/* ===== Keyboard ===== */
document.addEventListener("keydown",function(e){
    if(G.state==="menu"&&(e.key==="Enter"||e.key===" ")){
        initGame();
        return;
    }
    if(G.state==="gameover"&&(e.key==="Enter"||e.key===" ")){
        G.state="menu";
        return;
    }
    if(G.state==="paused"&&e.key==="Escape"){
        G.state="playing";
        return;
    }
    if(G.state==="playing"){
        if(e.key==="Escape"){
            G.state="paused";
            return;
        }
        // Number keys to select/serve stalls
        if(e.key>="1"&&e.key<="3"){
            var idx=parseInt(e.key)-1;
            if(idx<G.stalls.length){
                G.selectedStall=idx;
                serveCustomer(idx);
            }
        }
        // U for upgrade menu
        if(e.key==="u"||e.key==="U"){
            // Toggle upgrade display
        }
    }
    if(G.state==="paused"){
        if(e.key==="Escape"||e.key===" "){
            G.state="playing";
        }
    }
});

/* ===== Update ===== */
function update(dt){
    if(G.state!=="playing")return;
    // Day timer
    G.dayTime+=dt;
    if(G.dayTime>=G.dayDuration){
        endDay();
    }
    // Customer spawning
    G.customerSpawnTimer+=dt;
    if(G.customerSpawnTimer>=G.customerSpawnRate){
        G.customerSpawnTimer=0;
        spawnCustomer();
    }
    // Combo timer
    if(G.comboTimer>0){
        G.comboTimer-=dt;
        if(G.comboTimer<=0)G.combo=0;
    }
    // Notification timer
    if(G.notifyTimer>0){
        G.notifyTimer-=dt;
        if(G.notifyTimer<=0)G.notification="";
    }
    // Update customers in queue
    for(var i=G.customerQueue.length-1;i>=0;i--){
        var c=G.customerQueue[i];
        // Move to queue position
        var targetX=W*0.15+i*60*SCALE;
        var targetY=H*0.72;
        var dx=targetX-c.x,dy=targetY-c.y;
        var dist=Math.hypot(dx,dy);
        if(dist>2){
            c.x+=dx/dist*c.speed*60*dt;
            c.y+=dy/dist*c.speed*60*dt;
        }
        c.patience-=c.patienceDecay*dt*10;
        if(c.patience<=0){
            // Customer leaves angry
            G.customerQueue.splice(i,1);
            addFloatingText(c.x,c.y-20,"生气离开！","#e74c3c");
            G.combo=0;
            // Rearrange queue
            for(var j=i;j<G.customerQueue.length;j++){
                G.customerQueue[j].targetX=W*0.15+j*60*SCALE;
            }
        }
    }
    // Assign customers to stalls
    for(var si=0;si<G.stalls.length;si++){
        var stall=G.stalls[si];
        if(!stall.cooking&&stall.queuedCustomers.length<stall.maxQueue){
            // Find matching customer
            for(var ci=0;ci<G.customerQueue.length;ci++){
                var cust=G.customerQueue[ci];
                if(cust.wantedFood===stall.typeIdx&&cust.state==="walking"){
                    // Assign to stall
                    cust.state="waiting";
                    stall.queuedCustomers.push(cust);
                    G.customerQueue.splice(ci,1);
                    // Rearrange remaining queue
                    for(var j=ci;j<G.customerQueue.length;j++){
                        G.customerQueue[j].targetX=W*0.15+j*60*SCALE;
                    }
                    break;
                }
            }
        }
    }
    // Cooking progress
    for(var i=0;i<G.stalls.length;i++){
        var stall=G.stalls[i];
        if(stall.queuedCustomers.length>0&&!stall.cooking){
            stall.cooking=true;
            stall.cookProgress=0;
        }
        if(stall.cooking){
            stall.cookProgress+=dt*(1+G.upgradeLevels.speed*0.3);
            if(stall.cookProgress>=stall.cookTime){
                stall.cookProgress=stall.cookTime;
                // Ready to serve - auto serve after small delay
                serveCustomer(i);
                stall.cooking=false;
                stall.cookProgress=0;
            }
        }
    }
    // Update eating customers
    for(var i=G.customers.length-1;i>=0;i--){
        var c=G.customers[i];
        if(c.state==="eating"){
            c.waitTime+=dt;
            if(c.waitTime>1.5){
                c.state="leaving";
                c.targetX=W+50;
            }
        }
        if(c.state==="leaving"){
            c.x+=c.speed*60*dt;
            if(c.x>W+50){
                G.customers.splice(i,1);
            }
        }
    }
    // Update particles
    for(var i=G.particles.length-1;i>=0;i--){
        var p=G.particles[i];
        p.x+=p.vx;
        p.y+=p.vy;
        p.vy+=0.1;
        p.life-=p.decay;
        if(p.life<=0)G.particles.splice(i,1);
    }
    // Update floating texts
    for(var i=G.floatingTexts.length-1;i>=0;i--){
        var ft=G.floatingTexts[i];
        ft.y+=ft.vy;
        ft.life-=0.02;
        if(ft.life<=0)G.floatingTexts.splice(i,1);
    }
    // Auto assign customers that match stall type
    for(var i=G.customerQueue.length-1;i>=0;i--){
        var c=G.customerQueue[i];
        if(c.state!=="walking")continue;
        // Find a stall that matches this customer's wanted food
        for(var si=0;si<G.stalls.length;si++){
            var stall=G.stalls[si];
            if(stall.typeIdx===c.wantedFood&&stall.queuedCustomers.length<stall.maxQueue){
                c.state="waiting";
                c.targetX=stall.x;
                c.targetY=stall.y+30*SCALE;
                stall.queuedCustomers.push(c);
                G.customerQueue.splice(i,1);
                for(var j=i;j<G.customerQueue.length;j++){
                    G.customerQueue[j].targetX=W*0.15+j*60*SCALE;
                }
                break;
            }
        }
    }
}

/* ===== Draw Functions ===== */
function drawBackground(){
    // Sky gradient
    var skyGrd=cx.createLinearGradient(0,0,0,H*0.6);

        cx.arc(sx,sy,1+Math.sin(Date.now()/1000+i)*0.5,0,Math.PI*2);
        cx.fill();
    }

    cx.strokeStyle="#3a3a5c";
    cx.lineWidth=2;
    cx.setLineDash([20,15]);
    cx.beginPath();
    cx.moveTo(0,H*0.75);
    cx.lineTo(W,H*0.75);
    cx.stroke();
    cx.setLineDash([]);
    // Lanterns
    var lanternColors=["#e74c3c","#f39c12","#e74c3c"];
    for(var i=0;i<3;i++){
        var lx=W*0.2+i*W*0.3;
        var ly=H*0.15;
        // String
        cx.strokeStyle="#666";
        cx.lineWidth=1;
        cx.beginPath();
        cx.moveTo(lx,0);
        cx.lineTo(lx,ly);
        cx.stroke();
        // Lantern body
        cx.fillStyle=lanternColors[i];
        cx.beginPath();
        cx.ellipse(lx,ly+15,12,18,0,0,Math.PI*2);
        cx.fill();
        // Lantern light
        cx.fillStyle="rgba(255,200,100,0.3)";
        cx.beginPath();
        cx.arc(lx,ly+15,25,0,Math.PI*2);
        cx.fill();
        // Gold trim
        cx.strokeStyle="#ffd700";
        cx.lineWidth=1.5;
        cx.beginPath();
        cx.moveTo(lx-12,ly+5);
        cx.lineTo(lx+12,ly+5);
        cx.stroke();
        cx.beginPath();
        cx.moveTo(lx-12,ly+25);
        cx.lineTo(lx+12,ly+25);
        cx.stroke();
    }
}

function drawStall(stall,idx){
    var x=stall.x,y=stall.y;

    var s=SCALE;
    // Stall base
    cx.fillStyle="#8B4513";
    cx.fillRect(x-35*s,y-5*s,70*s,30*s);
    // Roof
    cx.fillStyle=food.color;
    cx.beginPath();
    cx.moveTo(x-40*s,y-5*s);
    cx.lineTo(x,y-25*s);
    cx.lineTo(x+40*s,y-5*s);
    cx.closePath();
    cx.fill();
    cx.strokeStyle="#ffd700";
    cx.lineWidth=1.5;
    cx.stroke();
    // Food icon
    cx.font=Math.floor(24*s)+"px serif";
    cx.textAlign="center";
    cx.fillText(food.icon,x,y+12*s);
    // Name
    cx.font=Math.floor(10*s)+"px sans-serif";
    cx.fillStyle="#fff";
    cx.fillText(food.name,x,y+28*s);
    // Level
    cx.font=Math.floor(9*s)+"px sans-serif";
    cx.fillStyle="#ffd700";
    cx.fillText("Lv"+stall.level,x,y-8*s);
    // Cooking progress bar
    if(stall.cooking){
        var bw=50*s,bh=6*s;
        var bx=x-bw/2,by=y+32*s;
        cx.fillStyle="#333";
        cx.fillRect(bx,by,bw,bh);
        var prog=stall.cookProgress/stall.cookTime;
        cx.fillStyle="#4ecdc4";
        cx.fillRect(bx,by,bw*prog,bh);
        cx.strokeStyle="#666";
        cx.lineWidth=1;
        cx.strokeRect(bx,by,bw,bh);

    if(stall.queuedCustomers.length>0){

function drawCustomer(c){
    var x=c.x,y=c.y;
    var s=SCALE;
    var sz=c.size*s;
    // Shadow
    cx.fillStyle="rgba(0,0,0,0.2)";
    cx.beginPath();
    cx.ellipse(x,y+sz*0.8,sz*0.5,sz*0.15,0,0,Math.PI*2);
    cx.fill();
    // Body
    cx.fillStyle=c.bodyColor;
    cx.beginPath();
    cx.arc(x,y,sz*0.4,0,Math.PI*2);
    cx.fill();
    // Face
    cx.fillStyle="#ffecd2";
    cx.beginPath();
    cx.arc(x,y-sz*0.15,sz*0.25,0,Math.PI*2);
    cx.fill();
    // Eyes
    cx.fillStyle="#333";
    cx.beginPath();
    cx.arc(x-sz*0.08,y-sz*0.18,sz*0.04,0,Math.PI*2);
    cx.fill();
    cx.beginPath();
    cx.arc(x+sz*0.08,y-sz*0.18,sz*0.04,0,Math.PI*2);
    cx.fill();
    // Hat
    if(c.hatType===0){
        cx.fillStyle="#e74c3c";
        cx.fillRect(x-sz*0.2,y-sz*0.45,sz*0.4,sz*0.1);
    }else if(c.hatType===1){
        cx.fillStyle="#3498db";
        cx.beginPath();
        cx.moveTo(x,y-sz*0.55);
        cx.lineTo(x-sz*0.15,y-sz*0.35);
        cx.lineTo(x+sz*0.15,y-sz*0.35);
        cx.closePath();
        cx.fill();
    }
    // Wanted food bubble
    if(c.state==="walking"||c.state==="waiting"){
        var bubbleX=x+sz*0.4;
        var bubbleY=y-sz*0.5;
        cx.fillStyle="rgba(255,255,255,0.9)";
        cx.beginPath();
        cx.arc(bubbleX,bubbleY,sz*0.2,0,Math.PI*2);
        cx.fill();
        cx.font=Math.floor(sz*0.25)+"px serif";
        cx.textAlign="center";
        cx.fillText(FOOD_TYPES[c.wantedFood].icon,bubbleX,bubbleY+sz*0.07);
    }
    // Patience bar
    if(c.state==="waiting"){
        var barW=sz*0.6;
        var barH=sz*0.08;
        var barX=x-barW/2;
        var barY=y+sz*0.5;
        cx.fillStyle="#333";
        cx.fillRect(barX,barY,barW,barH);
        var pct=c.patience/c.maxPatience;
        cx.fillStyle=pct>0.5?"#4ecdc4":pct>0.25?"#f39c12":"#e74c3c";
        cx.fillRect(barX,barY,barW*pct,barH);
    }
    // Happiness indicator when served
    if(c.state==="eating"){
        cx.font=Math.floor(sz*0.35)+"px serif";
        cx.textAlign="center";
        cx.fillText("😊",x,y-sz*0.55);
    }
}

function drawParticles(){

}

function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
}

/* ===== Main Render ===== */
function render(){
    cx.clearRect(0,0,W,H);
    if(G.state==="menu"){
        drawMenuScreen();
        return;
    }
    // Game view
    drawBackground();
    // Draw stalls
    for(var i=0;i<G.stalls.length;i++){
        drawStall(G.stalls[i],i);
    }
    // Draw customers
    for(var i=0;i<G.customers.length;i++){
        drawCustomer(G.customers[i]);
    }
    for(var i=0;i<G.customerQueue.length;i++){
        drawCustomer(G.customerQueue[i]);
    }
    // Draw particles & floating texts
    drawParticles();
    drawFloatingTexts();
    // Draw UI
    drawUI();
    // Draw overlays
    if(G.state==="paused")drawPauseScreen();
    if(G.state==="gameover")drawGameOverScreen();
}

/* ===== Game Loop ===== */
var lastTime=0;
function gameLoop(ts){
    var dt=Math.min((ts-lastTime)/1000,0.05);
    lastTime=ts;
    update(dt);
    render();
    requestAnimationFrame(gameLoop);
}

/* ===== Start ===== */
lastTime=performance.now();
requestAnimationFrame(gameLoop);

        c.height = pw * ratio;

  }

  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });

<script>
