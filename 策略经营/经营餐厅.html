<body>

    <div class="game-guide" style="margin-bottom:15px;padding:10px;background:#fff3f3;border-radius:8px;border:1px solid #ffcccc;">
        <div style="font-weight:bold;color:#f5576c;margin-bottom:5px;">🎮 操作说明</div>

<canvas id="gameCanvas"></canvas>
<div id="startScreen" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#0a0a12;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000">
  <h1 style="font-size:48px;color:#f8a;margin-bottom:20px">🍽️ 经营餐厅</h1>
  <p style="color:#888;margin-bottom:40px">接待顾客 · 制作菜品 · 升级装修 · 赚取金币</p>
  <button id="startBtn" style="padding:15px 60px;font-size:20px;background:linear-gradient(135deg,#c44,#f8a);color:#fff;border:none;border-radius:12px;cursor:pointer">开始游戏</button>
</div>

<div id="pauseScreen" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);flex-direction:column;align-items:center;justify-content:center;z-index:999">

  <button id="restartBtn" style="padding:12px 40px;font-size:18px;background:#666;color:#fff;border:none;border-radius:8px">重新开始</button>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = 800, H = 600;
canvas.width = W; canvas.height = H;

function resizeCanvas() {
    const maxW = window.innerWidth - 20;
    if (W > maxW) { canvas.style.width = maxW + 'px'; canvas.style.height = (H * maxW / W) + 'px'; }
    else { canvas.style.width = ''; canvas.style.height = ''; }
}
window.addEventListener('resize', resizeCanvas); resizeCanvas();

if (!ctx.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        r = Math.min(r, w / 2, h / 2);
        this.moveTo(x + r, y);
        this.arcTo(x + w, y, x + w, y + h, r);
        this.arcTo(x + w, y + h, x, y + h, r);
        this.arcTo(x, y + h, x, y, r);
        this.arcTo(x, y, x + w, y, r);
        this.closePath();
    };
}

// Audio
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(freq, dur, type) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
}

// Dish definitions
const DISHES = [
    { name: '汉堡', icon: '🍔', cookTime: 120, price: 15, cost: 3, unlockLevel: 0 },
    { name: '披萨', icon: '🍕', cookTime: 180, price: 25, cost: 5, unlockLevel: 0 },
    { name: '寿司', icon: '🍣', cookTime: 150, price: 30, cost: 8, unlockLevel: 2 },
    { name: '牛排', icon: '🥩', cookTime: 240, price: 50, cost: 12, unlockLevel: 4 },
    { name: '龙虾', icon: '🦞', cookTime: 300, price: 80, cost: 20, unlockLevel: 6 }
];

// Upgrades
const UPGRADES = [
    { name: '加速烤炉', desc: '烹饪速度+20%', cost: 100, apply: (g) => { g.cookSpeed *= 1.2; } },
    { name: '豪华装修', desc: '小费+30%', cost: 200, apply: (g) => { g.tipBonus *= 1.3; } },
    { name: '招财猫', desc: '顾客频率+25%', cost: 150, apply: (g) => { g.spawnRate *= 0.75; } },
    { name: '自动洗碗', desc: '空桌恢复速度+50%', cost: 250, apply: (g) => { g.cleanSpeed *= 1.5; } },
    { name: 'VIP包厢', desc: '解锁高级菜品', cost: 300, apply: (g) => { g.level += 2; } },
    { name: '连锁加盟', desc: '每秒收入+2', cost: 500, apply: (g) => { g.passiveIncome += 2; } }
];

// Table states: empty, waiting, eating, dirty
const TABLE_POSITIONS = [
    { x: 100, y: 200 }, { x: 300, y: 200 }, { x: 500, y: 200 }, { x: 700, y: 200 },
    { x: 100, y: 380 }, { x: 300, y: 380 }, { x: 500, y: 380 }, { x: 700, y: 380 }
];

let G = {};
function resetGame() {
    G = {
        state: 'menu',
        gold: 50, score: 0, day: 1, time: 0, maxTime: 1800, // 30s per day at 60fps
        level: 1, exp: 0, expToLevel: 100,
        tables: TABLE_POSITIONS.map((pos, i) => ({
            id: i, ...pos, state: 'empty', dish: null, timer: 0, customer: null, patience: 0
        })),
        customers: [], // waiting customers (no table)
        cooking: [], // {dish, timer, tableId}
        cookSlots: 2, maxCookSlots: 4,
        cookSpeed: 1, tipBonus: 1, spawnRate: 1, cleanSpeed: 1, passiveIncome: 0,
        upgradesBought: [],
        selectedTable: -1,
        highScore: parseInt(localStorage.getItem('restaurantHigh') || '0'),
        particles: [],
        dayEarnings: 0
    };
}
resetGame();

function addParticle(x, y, color, text) {
    G.particles.push({ x, y, vx: (Math.random()-0.5)*2, vy: -2 - Math.random()*2, life: 40, color, text });
}

// Spawn customer
function spawnCustomer() {
    const availableDishes = DISHES.filter((d, i) => d.unlockLevel < G.level);
    if (availableDishes.length === 0) return;
    const dish = availableDishes[Math.floor(Math.random() * availableDishes.length)];
    G.customers.push({
        dish, patience: 600 + Math.random() * 300, maxPatience: 600 + Math.random() * 300,
        x: 350 + Math.random() * 100, y: 100
    });
}

// Update
function update() {
    if (G.state !== 'playing') return;

    G.time++;
    if (G.time >= G.maxTime) {
        // End of day
        G.day++;
        G.time = 0;
        G.gold += G.dayEarnings;
        G.dayEarnings = 0;
        // Clear all tables
        G.tables.forEach(t => { t.state = 'empty'; t.dish = null; t.customer = null; });
        G.customers = [];
        G.cooking = [];
        if (G.day > 10) {
            G.state = 'gameover';
            G.score = G.gold;
            if (G.score > G.highScore) {
                G.highScore = G.score;
                localStorage.setItem('restaurantHigh', G.highScore);
            }
        }
    }

    // Passive income
    if (G.passiveIncome > 0 && G.time % 60 === 0) {
        G.gold += G.passiveIncome;
        G.dayEarnings += G.passiveIncome;
    }

    // Spawn customers
    if (Math.random() < 0.008 * G.spawnRate && G.customers.length < 5) {
        spawnCustomer();
    }

    // Customer patience
    for (let i = G.customers.length - 1; i >= 0; i--) {
        G.customers[i].patience--;
        if (G.customers[i].patience <= 0) {
            G.customers.splice(i, 1);
            playSound(200, 0.2, 'sawtooth');
        }
    }

    // Auto-assign customers to empty tables
    for (let i = G.customers.length - 1; i >= 0; i--) {
        const emptyTable = G.tables.find(t => t.state === 'empty');
        if (emptyTable) {
            const cust = G.customers.splice(i, 1)[0];
            emptyTable.state = 'waiting';
            emptyTable.dish = cust.dish;
            emptyTable.customer = cust;
            emptyTable.patience = cust.patience;
            emptyTable.maxPatience = cust.maxPatience;
        }
    }

    // Table patience (waiting for food)
    G.tables.forEach(t => {
        if (t.state === 'waiting') {
            t.patience--;
            if (t.patience <= 0) {
                t.state = 'empty';
                t.dish = null;
                t.customer = null;
                playSound(150, 0.3, 'sawtooth');
            }
        }
        if (t.state === 'eating') {
            t.timer--;
            if (t.timer <= 0) {
                const tip = Math.floor(t.dish.price * 0.3 * G.tipBonus * (t.patience / t.maxPatience));
                const earning = t.dish.price + tip;
                G.gold += earning;
                G.dayEarnings += earning;
                G.score += earning;
                G.exp += earning;
                addParticle(t.x + 40, t.y - 10, '#fa0', '+' + earning + '💰');
                playSound(600, 0.15, 'sine');
                if (G.exp >= G.expToLevel) {
                    G.exp -= G.expToLevel;
                    G.level++;
                    G.expToLevel = Math.floor(G.expToLevel * 1.5);
                    addParticle(W/2, H/2, '#f5f', '升级! Lv' + G.level);
                    playSound(800, 0.3, 'sine');
                }
                t.state = 'dirty';
                t.timer = Math.floor(120 / G.cleanSpeed);
            }
        }
        if (t.state === 'dirty') {
            t.timer--;
            if (t.timer <= 0) {
                t.state = 'empty';
                t.dish = null;
                t.customer = null;
            }
        }
    });

    // Cooking
    for (let i = G.cooking.length - 1; i >= 0; i--) {
        const c = G.cooking[i];
        c.timer -= G.cookSpeed;
        if (c.timer <= 0) {
            // Serve to table
            const table = G.tables.find(t => t.id === c.tableId && t.state === 'waiting');
            if (table) {
                table.state = 'eating';
                table.timer = 180; // eating time
                playSound(500, 0.1, 'triangle');
            }
            G.cooking.splice(i, 1);
        }
    }

    // Update particles
    for (let i = G.particles.length - 1; i >= 0; i--) {
        const p = G.particles[i];
        p.x += p.vx; p.y += p.vy; p.life--;
        if (p.life <= 0) G.particles.splice(i, 1);
    }
}

// Draw table
function drawTable(t) {
    const x = t.x, y = t.y, w = 80, h = 80;
    // Table base
    ctx.fillStyle = '#5a3a2a';
    ctx.beginPath(); ctx.roundRect(x, y, w, h, 8); ctx.fill();
    ctx.fillStyle = '#7a5a3a';
    ctx.beginPath(); ctx.roundRect(x+4, y+4, w-8, h-8, 6); ctx.fill();

    // State indicator
    if (t.state === 'empty') {
        ctx.fillStyle = '#4a4';
        ctx.font = '28px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('✓', x + w/2, y + h/2 + 10);
        ctx.fillStyle = '#4a4';
        ctx.font = '10px Arial';
        ctx.fillText('空桌', x + w/2, y + h - 8);
    } else if (t.state === 'waiting') {
        ctx.font = '32px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(t.dish.icon, x + w/2, y + h/2 + 5);
        // Patience bar
        const barW = w - 10;
        const pct = t.patience / t.maxPatience;
        ctx.fillStyle = '#300';
        ctx.fillRect(x + 5, y + h - 12, barW, 6);
        ctx.fillStyle = pct > 0.5 ? '#5a5' : pct > 0.25 ? '#fa5' : '#f55';
        ctx.fillRect(x + 5, y + h - 12, barW * pct, 6);
        ctx.fillStyle = '#fff';
        ctx.font = '9px Arial';
        ctx.fillText('等待中', x + w/2, y + h - 15);
    } else if (t.state === 'eating') {
        ctx.font = '28px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(t.dish.icon, x + w/2, y + h/2 + 5);
        ctx.fillStyle = '#5f5';
        ctx.font = '10px Arial';
        ctx.fillText('用餐中', x + w/2, y + h - 8);
    } else if (t.state === 'dirty') {
        ctx.fillStyle = '#a55';
        ctx.font = '24px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('🍽️', x + w/2, y + h/2 + 5);
        ctx.fillStyle = '#a55';
        ctx.font = '10px Arial';
        ctx.fillText('清理中', x + w/2, y + h - 8);
    }
}

// Draw cooking area
function drawCookingArea() {
    const areaX = 20, areaY = 480, areaW = W - 40, areaH = 100;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.roundRect(areaX, areaY, areaW, areaH, 10); ctx.fill();

    ctx.fillStyle = '#f8a';
    ctx.font = '14px Arial';
    ctx.textAlign = 'left';
    ctx.fillText('厨房 (' + G.cooking.length + '/' + G.cookSlots + ')', areaX + 10, areaY + 20);

    G.cooking.forEach((c, i) => {
        const cx = areaX + 20 + i * 140;
        const cy = areaY + 35;
        const pct = 1 - (c.timer / c.dish.cookTime);
        ctx.fillStyle = '#333';
        ctx.beginPath(); ctx.roundRect(cx, cy, 120, 50, 6); ctx.fill();
        ctx.fillStyle = '#f8a';
        ctx.beginPath(); ctx.roundRect(cx, cy, 120 * pct, 50, 6); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = '20px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(c.dish.icon, cx + 30, cy + 35);
        ctx.font = '11px Arial';
        ctx.fillText(c.dish.name, cx + 75, cy + 25);
        ctx.fillText(Math.floor(pct * 100) + '%', cx + 75, cy + 42);
    });

    // Empty slots
    for (let i = G.cooking.length; i < G.cookSlots; i++) {
        const cx = areaX + 20 + i * 140;
        const cy = areaY + 35;
        ctx.strokeStyle = '#444';
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        ctx.beginPath(); ctx.roundRect(cx, cy, 120, 50, 6); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = '#555';
        ctx.font = '11px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('空闲', cx + 60, cy + 30);
    }
}

// Draw waiting customers
function drawWaitingCustomers() {
    ctx.fillStyle = '#888';
    ctx.font = '12px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('排队顾客: ' + G.customers.length, W/2, 120);

    G.customers.forEach((c, i) => {
        const cx = 250 + i * 70;
        const cy = 135;
        ctx.font = '24px Arial';
        ctx.fillText('👤', cx, cy);
        ctx.font = '10px Arial';
        ctx.fillStyle = '#aaa';
        ctx.fillText(c.dish.icon, cx, cy + 18);
        // Patience
        const pct = c.patience / c.maxPatience;
        ctx.fillStyle = '#300';
        ctx.fillRect(cx - 15, cy + 22, 30, 3);
        ctx.fillStyle = pct > 0.5 ? '#5a5' : '#f55';
        ctx.fillRect(cx - 15, cy + 22, 30 * pct, 3);
    });
}

// Draw UI
function drawUI() {
    // Top bar
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, 40);
    ctx.fillStyle = '#fa0';
    ctx.font = '14px Arial';
    ctx.textAlign = 'left';
    ctx.fillText('💰 ' + G.gold, 15, 26);
    ctx.fillStyle = '#f8a';
    ctx.fillText('📊 Lv' + G.level + ' (' + G.exp + '/' + G.expToLevel + ')', 120, 26);
    ctx.fillStyle = '#5af';
    ctx.fillText('📅 第' + G.day + '天', 320, 26);
    // Time bar
    const timePct = G.time / G.maxTime;
    ctx.fillStyle = '#333';
    ctx.fillRect(430, 10, 200, 20);
    ctx.fillStyle = timePct > 0.8 ? '#f55' : '#5a5';
    ctx.fillRect(430, 10, 200 * timePct, 20);
    ctx.fillStyle = '#fff';
    ctx.font = '10px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('营业时间', 530, 24);
    ctx.fillStyle = '#888';
    ctx.font = '12px Arial';
    ctx.textAlign = 'right';
    ctx.fillText('🏆 ' + G.score + '  最高: ' + G.highScore, W - 15, 26);

    // Upgrade button
    ctx.fillStyle = '#c49bff';
    ctx.beginPath(); ctx.roundRect(W - 100, 50, 80, 30, 6); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '12px Arial'; ctx.textAlign = 'center';
    ctx.fillText('升级商店', W - 60, 70);
}

// Draw upgrade panel
function drawUpgradePanel() {
    if (G.selectedTable !== -2) return; // -2 = upgrade panel
    ctx.fillStyle = 'rgba(0,0,0,0.85)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#f8a';
    ctx.font = '24px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('升级商店', W/2, 50);

    UPGRADES.forEach((up, i) => {
        const ux = 50 + (i % 3) * 240;
        const uy = 80 + Math.floor(i / 3) * 130;
        const bought = G.upgradesBought.includes(i);
        ctx.fillStyle = bought ? '#2a3a2a' : '#1a1a2e';
        ctx.strokeStyle = bought ? '#4a4' : '#444';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.roundRect(ux, uy, 220, 110, 8); ctx.fill(); ctx.stroke();
        ctx.fillStyle = bought ? '#4a4' : '#f8a';
        ctx.font = '14px Arial';
        ctx.textAlign = 'left';
        ctx.fillText(up.name, ux + 10, uy + 25);
        ctx.fillStyle = '#aaa';
        ctx.font = '11px Arial';
        ctx.fillText(up.desc, ux + 10, uy + 45);
        if (!bought) {
            ctx.fillStyle = G.gold >= up.cost ? '#fa0' : '#f55';
            ctx.fillText('💰 ' + up.cost, ux + 10, uy + 65);
            ctx.fillStyle = G.gold >= up.cost ? '#4a9' : '#666';
            ctx.beginPath(); ctx.roundRect(ux + 10, uy + 75, 80, 25, 4); ctx.fill();
            ctx.fillStyle = '#fff'; ctx.font = '11px Arial'; ctx.textAlign = 'center';
            ctx.fillText('购买', ux + 50, uy + 92);
        } else {
            ctx.fillStyle = '#4a4';
            ctx.font = '12px Arial';
            ctx.fillText('已购买 ✓', ux + 10, uy + 70);
        }
    });

    // Close button
    ctx.fillStyle = '#a44';
    ctx.beginPath(); ctx.roundRect(W/2 - 40, H - 60, 80, 35, 6); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '14px Arial'; ctx.textAlign = 'center';
    ctx.fillText('关闭', W/2, H - 38);
}

// Game over screen
function drawEndScreen() {
    ctx.fillStyle = 'rgba(0,0,0,0.8)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#f8a';
    ctx.font = '48px Arial';
    ctx.fillText('营业结束!', W/2, H/2 - 60);
    ctx.fillStyle = '#fff';
    ctx.font = '20px Arial';
    ctx.fillText('总金币: ' + G.gold + '  得分: ' + G.score, W/2, H/2);
    ctx.fillText('最高分: ' + G.highScore, W/2, H/2 + 30);
    ctx.fillStyle = '#f8a';
    ctx.beginPath(); ctx.roundRect(W/2 - 80, H/2 + 50, 160, 45, 10); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '18px Arial';
    ctx.fillText('重新开始', W/2, H/2 + 78);
}

// Render
function render() {
    ctx.fillStyle = '#2a1a1a';
    ctx.fillRect(0, 0, W, H);

    // Restaurant background
    ctx.fillStyle = '#3a2a1a';
    ctx.fillRect(0, 80, W, 400);
    // Floor pattern
    ctx.fillStyle = 'rgba(255,255,255,0.02)';
    for (let x = 0; x < W; x += 40) {
        for (let y = 80; y < 480; y += 40) {
            if ((x/40 + y/40) % 2 === 0) ctx.fillRect(x, y, 40, 40);
        }
    }

    drawWaitingCustomers();
    G.tables.forEach(drawTable);
    drawCookingArea();
    drawUI();

    // Particles
    G.particles.forEach(p => {
        ctx.globalAlpha = p.life / 40;
        ctx.fillStyle = p.color;
        ctx.font = '14px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(p.text, p.x, p.y);
    });
    ctx.globalAlpha = 1;

    drawUpgradePanel();
    if (G.state === 'gameover') drawEndScreen();
}

// Input
function getCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width, scaleY = H / rect.height;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
}

function handleClick(e) {
    const pos = getCanvasPos(e);

    if (G.state === 'gameover') {
        if (pos.x > W/2-80 && pos.x < W/2+80 && pos.y > H/2+50 && pos.y < H/2+95) {
            resetGame();
            G.state = 'playing';
        }
        return;
    }

    if (G.state !== 'playing') return;

    // Upgrade panel
    if (G.selectedTable === -2) {
        UPGRADES.forEach((up, i) => {
            const ux = 50 + (i % 3) * 240;
            const uy = 80 + Math.floor(i / 3) * 130;
            if (pos.x >= ux+10 && pos.x <= ux+90 && pos.y >= uy+75 && pos.y <= uy+100) {
                if (!G.upgradesBought.includes(i) && G.gold >= up.cost) {
                    G.gold -= up.cost;
                    G.upgradesBought.push(i);
                    up.apply(G);
                    playSound(700, 0.2, 'sine');
                }
            }
        });
        // Close
        if (pos.x > W/2-40 && pos.x < W/2+40 && pos.y > H-60 && pos.y < H-25) {
            G.selectedTable = -1;
        }
        return;
    }

    // Upgrade shop button
    if (pos.x >= W - 100 && pos.x <= W - 20 && pos.y >= 50 && pos.y <= 80) {
        G.selectedTable = -2;
        return;
    }

    // Table click
    G.tables.forEach(t => {
        if (pos.x >= t.x && pos.x <= t.x + 80 && pos.y >= t.y && pos.y <= t.y + 80) {
            if (t.state === 'waiting' && G.cooking.length < G.cookSlots) {
                // Start cooking for this table
                const alreadyCooking = G.cooking.some(c => c.tableId === t.id);
                if (!alreadyCooking) {
                    G.cooking.push({ dish: t.dish, timer: t.dish.cookTime, tableId: t.id });
                    playSound(400, 0.08, 'triangle');
                }
            } else if (t.state === 'dirty') {
                t.timer = 0;
                t.state = 'empty';
                playSound(300, 0.05, 'sine');
            }
        }
    });

    // Cook slots click (to add more)
    if (pos.y >= 480 && pos.y <= 580 && G.cooking.length < G.cookSlots) {
        // Click on empty cooking slot - auto assign if table waiting
        const waitingTable = G.tables.find(t => t.state === 'waiting' && !G.cooking.some(c => c.tableId === t.id));
        if (waitingTable && G.cooking.length < G.cookSlots) {
            G.cooking.push({ dish: waitingTable.dish, timer: waitingTable.dish.cookTime, tableId: waitingTable.id });
            playSound(400, 0.08, 'triangle');
        }
    }
}

canvas.addEventListener('click', handleClick);
canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    if (e.changedTouches) handleClick({ clientX: e.changedTouches[0].clientX, clientY: e.changedTouches[0].clientY });
});

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        if (G.state === 'playing') {
            G.state = 'paused';
            document.getElementById('pauseScreen').style.display = 'flex';
        } else if (G.selectedTable === -2) {
            G.selectedTable = -1;
        }
    }
    // Number keys to quickly cook for waiting tables
    if (e.key >= '1' && e.key <= '8') {
        const idx = parseInt(e.key) - 1;
        const t = G.tables[idx];
        if (t && t.state === 'waiting' && G.cooking.length < G.cookSlots) {
            const alreadyCooking = G.cooking.some(c => c.tableId === t.id);
            if (!alreadyCooking) {
                G.cooking.push({ dish: t.dish, timer: t.dish.cookTime, tableId: t.id });
                playSound(400, 0.08, 'triangle');
            }
        }
    }
    if (e.key === 'u' || e.key === 'U') {
        G.selectedTable = G.selectedTable === -2 ? -1 : -2;
    }
});

// UI buttons
document.getElementById('startBtn').addEventListener('click', () => {
    audioCtx.resume();
    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('pauseBtn').style.display = 'block';
    resetGame();
    G.state = 'playing';
});
document.getElementById('pauseBtn').addEventListener('click', () => {
    if (G.state === 'playing') {
        G.state = 'paused';
        document.getElementById('pauseScreen').style.display = 'flex';
    }
});
document.getElementById('resumeBtn').addEventListener('click', () => {
    G.state = 'playing';
    document.getElementById('pauseScreen').style.display = 'none';
});
document.getElementById('restartBtn').addEventListener('click', () => {
    resetGame();
    G.state = 'playing';
    document.getElementById('pauseScreen').style.display = 'none';
});

let lastTime = 0;
function gameLoop(time) {
    const dt = time - lastTime;
    if (dt >= 16) { lastTime = time; update(); }
    render();
    requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);

	_startGameOverWatcher() {
		// 检测#restartBtn或包含"重新开始"/"再来一局"的按钮变为可见
		const checkGameOver = () => {
			if (this._gameOverDetected) return;
			// 方法1: 检测#restartBtn可见
			const restartBtn = document.getElementById('restartBtn');
			if (restartBtn && restartBtn.offsetParent !== null && getComputedStyle(restartBtn).display !== 'none') {
				this._gameOverDetected = true;
				this.onGameOver();

			}
			// 方法2: 检测#gameOverScreen可见

				this._gameOverDetected = true;

			// 方法3: 检测screen-gameover可见

		};
		// 每500ms检查一次
		this._goInterval = setInterval(() => {

			if (this._gameOverDetected) {

	},
	onGameOver() {
		this._deathCount++;
		if (!this.interstitial.enabled) return;
		if (this._deathCount < this.interstitial.gameCount) return;
		if (Date.now() - this._lastInterTime < this.interstitial.cooldownMs) return;
		this._lastInterTime = Date.now(); this._deathCount = 0;
		this.requestRevive(null);
	},
};
