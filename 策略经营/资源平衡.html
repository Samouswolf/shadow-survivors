<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>资源平衡</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; overflow: hidden; color: #fff; }
        .game-container { width: 100%; height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 10px; }
        .stat { display: flex; flex-direction: column; align-items: center; }
        .stat-label { font-size: 12px; opacity: 0.7; }
        .stat-value { font-size: 24px; font-weight: bold; color: #4ecdc4; }
        
        .game-area { flex: 1; position: relative; background: rgba(0,0,0,0.4); border-radius: 15px; overflow: hidden; }
        #gameCanvas { width: 100%; height: 100%; display: block; }
        
        .resource-panel { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 10px; display: flex; gap: 15px; }
        .resource { display: flex; align-items: center; gap: 5px; }
        
        .controls { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
        .btn { padding: 12px 25px; border: none; border-radius: 25px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 10px; font-size: 14px; }

<body>
    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">回合</div>
                <div class="stat-value" id="turn">1</div>
            </div>
            <div class="stat">
                <div class="stat-label">分数</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">最高</div>
                <div class="stat-value" id="highScore">0</div>
            </div>
        </div>
        
        <div class="game-area">
            <canvas id="gameCanvas"></canvas>
            <div class="resource-panel" id="resourcePanel">
                <div class="resource">💰 <span id="gold">100</span></div>
                <div class="resource">⚡ <span id="energy">50</span></div>
                <div class="resource">🌾 <span id="food">30</span></div>
                <div class="resource">🛡️ <span id="defense">20</span></div>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" id="btnStart">▶️ 开始游戏</button>
        </div>
        
        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const GAME_NAME = '资源平衡';
        GameCore.init({ highScore: GAME_NAME });
        
        let turn = 1;
        let score = 0;
        let gameRunning = false;
        
        let resources = {
            gold: 100,
            energy: 50,
            food: 30,
            defense: 20
        };
        
        let buildings = [];
        let events = [];
        
        const BUILDING_TYPES = [
            { name: '金矿', cost: { gold: 50 }, income: { gold: 20 }, color: '#ffd700' },
            { name: '电站', cost: { gold: 80 }, income: { energy: 30 }, color: '#00d2ff' },
            { name: '农场', cost: { gold: 60 }, income: { food: 25 }, color: '#48c78e' },
            { name: '堡垒', cost: { gold: 100 }, income: { defense: 15 }, color: '#4a5568' },
            { name: '市场', cost: { gold: 40 }, income: { gold: 10, energy: 10 }, color: '#ffa502' },
            { name: '工厂', cost: { gold: 90 }, income: { gold: 15, food: 10 }, color: '#f093fb' }
        ];
        
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            initGame();
        }
        
        function initGame() {
            turn = 1;
            score = 0;
            
            resources = {
                gold: 100,
                energy: 50,
                food: 30,
                defense: 20
            };
            
            buildings = [];
            events = [];
            
            for (let i = 0; i < 5; i++) {
                spawnEvent();
            }
            
            updateResourceDisplay();
        }
        
        function spawnEvent() {
            const eventTypes = [
                { name: '贸易', effect: { gold: 30, energy: -10 }, color: '#ffa502' },
                { name: '丰收', effect: { food: 40, energy: -15 }, color: '#48c78e' },
                { name: '危机', effect: { gold: -20, defense: -10 }, color: '#ff6b6b' },
                { name: '投资', effect: { gold: -50, energy: 50 }, color: '#00d2ff' },
                { name: '支援', effect: { food: 20, defense: 10 }, color: '#a855f7' }
            ];
            
            events.push({
                ...eventTypes[Math.floor(Math.random() * eventTypes.length)],
                x: Math.random() * (canvas.width - 100) + 50,
                y: Math.random() * (canvas.height - 200) + 100,
                width: 80,
                height: 50,
                processed: false
            });
        }
        
        function updateResources() {
            // 建筑产出
            buildings.forEach(building => {
                Object.keys(building.income).forEach(resource => {
                    resources[resource] += building.income[resource];
                });
            });
            
            // 资源平衡检查
            let balance = 0;
            Object.values(resources).forEach(v => {
                if (v < 0) balance -= Math.abs(v);
                else balance += v;
            });
            
            score += Math.floor(balance / 10);
            
            // 资源上限
            Object.keys(resources).forEach(resource => {
                resources[resource] = Math.max(0, Math.min(200, resources[resource]));
            });
            
            updateResourceDisplay();
        }
        
        function updateResourceDisplay() {
            document.getElementById('gold').textContent = resources.gold;
            document.getElementById('energy').textContent = resources.energy;
            document.getElementById('food').textContent = resources.food;
            document.getElementById('defense').textContent = resources.defense;
        }
        
        function buyBuilding(type) {
            const building = BUILDING_TYPES[type];
            
            // 检查资源
            for (const [resource, cost] of Object.entries(building.cost)) {
                if (resources[resource] < cost) {
                    GameCore.hints.show('资源不足！');
                    return;
                }
            }
            
            // 扣除资源
            for (const [resource, cost] of Object.entries(building.cost)) {
                resources[resource] -= cost;
            }
            
            // 添加建筑
            buildings.push({ ...building });
            score += 50;
            
            updateResourceDisplay();
        }
        
        function processEvent(event) {
            event.processed = true;
            
            for (const [resource, value] of Object.entries(event.effect)) {
                resources[resource] += value;
            }
            
            score += 30;
            updateResourceDisplay();
        }
        
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 资源平衡可视化
            const total = Object.values(resources).reduce((a, b) => a + b, 0);
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            let startAngle = 0;
            const colors = ['#ffd700', '#00d2ff', '#48c78e', '#4a5568'];
            Object.keys(resources).forEach((resource, i) => {
                const value = resources[resource];
                const angle = (value / 200) * Math.PI * 2;
                
                ctx.fillStyle = colors[i];
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, 100, startAngle, startAngle + angle);
                ctx.closePath();
                ctx.fill();
                
                startAngle += angle;
            });
            
            // 中心圆
            ctx.fillStyle = '#1a1a2e';
            ctx.beginPath();
            ctx.arc(centerX, centerY, 60, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#fff';
            ctx.font = '20px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('平衡度', centerX, centerY - 10);
            ctx.fillText(Math.round(total / 8) + '%', centerX, centerY + 20);
            
            // 事件
            events.forEach(event => {
                if (!event.processed) {
                    ctx.fillStyle = event.color;
                    ctx.fillRect(event.x, event.y, event.width, event.height);
                    
                    ctx.fillStyle = '#fff';
                    ctx.font = '12px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(event.name, event.x + event.width / 2, event.y + event.height / 2 + 4);
                }
            });
            
            // 建筑列表
            BUILDING_TYPES.forEach((building, i) => {
                const x = 10;
                const y = 80 + i * 45;
                
                ctx.fillStyle = building.color;
                ctx.fillRect(x, y, 80, 35);
                
                ctx.fillStyle = '#fff';
                ctx.font = '12px Arial';
                ctx.fillText(building.name, x + 40, y + 12);
                
                const costs = Object.entries(building.cost).map(([k, v]) => {
                    const icons = { gold: '💰', energy: '⚡', food: '🌾', defense: '🛡️' };
                    return icons[k] + v;
                }).join(' ');
                ctx.fillText(costs, x + 40, y + 27);
            });
        }
        
        function updateStats() {
            document.getElementById('turn').textContent = turn;
            document.getElementById('score').textContent = score;
            document.getElementById('highScore').textContent = GameCore.highScore.get(GAME_NAME);
            
            if (GameCore.highScore.set(GAME_NAME, score)) {
                GameCore.hints.show('新纪录！分数: ' + score);
            }
        }
        
        function gameLoop() {
            draw();
            
            if (gameRunning) {
                updateStats();
            }
            
            requestAnimationFrame(gameLoop);
        }
        
        canvas.addEventListener('click', e => {
            if (!gameRunning) return;
            
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            // 检查建筑点击
            BUILDING_TYPES.forEach((building, i) => {
                const bx = 10;
                const by = 80 + i * 45;
                
                if (x > bx && x < bx + 80 && y > by && y < by + 35) {
                    buyBuilding(i);
                }
            });
            
            // 检查事件点击
            events.forEach(event => {
                if (!event.processed) {
                    if (x > event.x && x < event.x + event.width &&
                        y > event.y && y < event.y + event.height) {
                        processEvent(event);
                    }
                }
            });
        });
        
        document.getElementById('btnStart').onclick = () => {
            gameRunning = true;
            initGame();
        };
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        gameLoop();
    </script>
<!-- [BATCH-FIX:touch-support] -->
<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>
<!-- [/BATCH-FIX:touch-support] -->

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
