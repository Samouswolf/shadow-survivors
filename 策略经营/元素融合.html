<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>元素融合</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; color: #fff; }
        
        .game-container { width: 100%; flex: 1; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: #ffd700; }
        .level { font-size: 14px; opacity: 0.7; }
        
        .game-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        
        .elements-area { display: flex; gap: 20px; margin-bottom: 30px; }
        .element-btn { width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 36px; cursor: pointer; transition: all 0.2s; }
        .element-btn.selected { transform: scale(1.2); box-shadow: 0 0 30px currentColor; }
        
        .element-btn.fire { background: linear-gradient(135deg, #ff6b6b, #ffa502); color: #ffa502; }
        .element-btn.water { background: linear-gradient(135deg, #667eea, #764ba2); color: #667eea; }
        .element-btn.earth { background: linear-gradient(135deg, #48c78e, #4ecdc4); color: #48c78e; }
        .element-btn.air { background: linear-gradient(135deg, #f093fb, #f5576c); color: #f093fb; }
        
        .fusion-area { width: 200px; height: 200px; border-radius: 50%; border: 3px dashed rgba(255,255,255,0.3); display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 20px; }
        .fusion-result { font-size: 60px; }
        .fusion-name { font-size: 18px; margin-top: 10px; }
        
        .recipe-area { width: 100%; max-width: 400px; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 15px; }
        .recipe-title { font-size: 14px; opacity: 0.7; margin-bottom: 10px; }
        .recipe-list { display: flex; flex-wrap: wrap; gap: 10px; }
        .recipe-tag { padding: 8px 15px; background: rgba(255,255,255,0.1); border-radius: 20px; font-size: 12px; }
        
        .controls { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
        .btn { padding: 12px 25px; border: none; border-radius: 15px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; }
        .btn-secondary { background: rgba(255,255,255,0.2); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="title">⚗️ 元素融合</div>
            <div class="level">发现: <span id="discovered">0</span>/10</div>
        </div>
        
        <div class="game-area">
            <div class="elements-area">
                <div class="element-btn fire" id="fire" onclick="selectElement('fire')">🔥</div>
                <div class="element-btn water" id="water" onclick="selectElement('water')">💧</div>
                <div class="element-btn earth" id="earth" onclick="selectElement('earth')">🌍</div>
                <div class="element-btn air" id="air" onclick="selectElement('air')">💨</div>
            </div>
            
            <div class="fusion-area" id="fusionArea">
                <div class="fusion-result" id="fusionResult">❓</div>
                <div class="fusion-name" id="fusionName">选择元素</div>
            </div>
            
            <div class="recipe-area">
                <div class="recipe-title">已发现配方:</div>
                <div class="recipe-list" id="recipeList"></div>
            </div>
            
            <div class="controls">
                <button class="btn btn-secondary" onclick="resetSelection()">🔄 重置</button>
                <button class="btn btn-primary" onclick="fuse()">✨ 融合</button>
            </div>
        </div>
    </div>
    
    <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>

    <script src="game_core.js"></script>
    <script>
        const GAME_NAME = '元素融合';
        GameCore.init({ highScore: GAME_NAME });
        
        const elements = {
            fire: { emoji: '🔥', name: '火' },
            water: { emoji: '💧', name: '水' },
            earth: { emoji: '🌍', name: '土' },
            air: { emoji: '💨', name: '风' }
        };
        
        const recipes = {
            'fire+water': { emoji: '💨', name: '蒸汽' },
            'fire+earth': { emoji: '🪨', name: '岩浆' },
            'fire+air': { emoji: '💫', name: '火焰' },
            'water+earth': { emoji: '🌱', name: '泥土' },
            'water+air': { emoji: '🌈', name: '彩虹' },
            'earth+air': { emoji: '🌀', name: '沙尘暴' },
            'fire+fire': { emoji: '☀️', name: '太阳' },
            'water+water': { emoji: '🌊', name: '海洋' },
            'earth+earth': { emoji: '🏔️', name: '山脉' },
            'air+air': { emoji: '☁️', name: '云朵' }
        };
        
        let selected = [];
        let discovered = [];
        
        function initGame() {
            selected = [];
            discovered = [];
            updateUI();
            updateFusionArea();
        }
        
        function updateUI() {
            document.getElementById('discovered').textContent = discovered.length;
            
            const list = document.getElementById('recipeList');
            list.innerHTML = '';
            
            discovered.forEach(recipe => {
                const tag = document.createElement('div');
                tag.className = 'recipe-tag';
                tag.textContent = `${recipe.input1} + ${recipe.input2} = ${recipe.result}`;
                list.appendChild(tag);
            });
        }
        
        function selectElement(element) {
            if (selected.length >= 2) {
                selected = [];
            }
            
            selected.push(element);
            
            document.querySelectorAll('.element-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
            
            document.getElementById(element).classList.add('selected');
            
            updateFusionArea();
        }
        
        function updateFusionArea() {
            const result = document.getElementById('fusionResult');
            const name = document.getElementById('fusionName');
            
            if (selected.length === 0) {
                result.textContent = '❓';
                name.textContent = '选择元素';
            } else if (selected.length === 1) {
                result.textContent = elements[selected[0]].emoji;
                name.textContent = elements[selected[0]].name;
            } else {
                result.textContent = '⚗️';
                name.textContent = '准备融合';
            }
        }
        
        function fuse() {
            if (selected.length !== 2) {
                GameCore.hints.show('请选择两个元素！');
                return;
            }
            
            const key1 = selected[0] + '+' + selected[1];
            const key2 = selected[1] + '+' + selected[0];
            
            const recipe = recipes[key1] || recipes[key2];
            
            if (recipe) {
                const result = document.getElementById('fusionResult');
                const name = document.getElementById('fusionName');
                
                result.textContent = recipe.emoji;
                name.textContent = recipe.name;
                
                const existing = discovered.find(d => 
                    (d.input1 === selected[0] && d.input2 === selected[1]) ||
                    (d.input1 === selected[1] && d.input2 === selected[0])
                );
                
                if (!existing) {
                    discovered.push({
                        input1: elements[selected[0]].emoji,
                        input2: elements[selected[1]].emoji,
                        result: recipe.emoji + ' ' + recipe.name
                    });
                    
                    GameCore.hints.show(`🎉 发现新元素: ${recipe.name}`);
                    updateUI();
                }
                
                GameCore.highScore.set(GAME_NAME, discovered.length);
            } else {
                GameCore.hints.show('❌ 无法融合！');
                
                const result = document.getElementById('fusionResult');
                const name = document.getElementById('fusionName');
                
                result.textContent = '💥';
                name.textContent = '融合失败';
                
                setTimeout(() => {
                    updateFusionArea();
                }, 1000);
            }
            
            setTimeout(() => {
                resetSelection();
            }, 2000);
        }
        
        function resetSelection() {
            selected = [];
            
            document.querySelectorAll('.element-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
            
            updateFusionArea();
        }
        
        initGame();
        GameCore.touch.enableAllButtons();
    </script>
</body>
</html>
