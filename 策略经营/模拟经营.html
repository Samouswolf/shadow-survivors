<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>模拟经营</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; color: #fff; }
        
        .game-container { width: 100%; flex: 1; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: #ffd700; }
        .stats { display: flex; gap: 20px; font-size: 14px; }
        
        .shop-area { flex: 1; display: flex; flex-direction: column; gap: 15px; }
        
        .product-card { padding: 20px; background: rgba(255,255,255,0.1); border-radius: 15px; display: flex; justify-content: space-between; align-items: center; }
        .product-info { display: flex; align-items: center; gap: 15px; }
        .product-icon { width: 50px; height: 50px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .product-details h3 { font-size: 18px; }
        .product-details p { font-size: 12px; opacity: 0.7; }
        
        .buy-btn { padding: 10px 20px; border: none; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; background: linear-gradient(135deg, #48c78e, #4ecdc4); color: #fff; }
        
        .inventory-area { padding: 20px; background: rgba(255,255,255,0.05); border-radius: 15px; }
        .inventory-title { font-size: 14px; opacity: 0.7; margin-bottom: 10px; }
        .inventory-items { display: flex; flex-wrap: wrap; gap: 10px; }
        .inventory-item { padding: 10px 15px; background: rgba(255,255,255,0.1); border-radius: 10px; font-size: 14px; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="title">🏪 模拟经营</div>
            <div class="stats">
                <span>💰 金币: <span id="money">1000</span></span>
                <span>⭐ 声望: <span id="reputation">10</span></span>
            </div>
        </div>
        
        <div class="shop-area">
            <div class="product-card">
                <div class="product-info">
                    <div class="product-icon" style="background: #ff6b6b;">🍎</div>
                    <div class="product-details">
                        <h3>苹果</h3>
                        <p>售价: 10金币 | 利润: 5金币</p>
                    </div>
                </div>
                <button class="buy-btn" onclick="buyProduct('apple', 50)">购买 (50金币)</button>
            </div>
            
            <div class="product-card">
                <div class="product-info">
                    <div class="product-icon" style="background: #ffa502;">🍊</div>
                    <div class="product-details">
                        <h3>橙子</h3>
                        <p>售价: 15金币 | 利润: 8金币</p>
                    </div>
                </div>
                <button class="buy-btn" onclick="buyProduct('orange', 80)">购买 (80金币)</button>
            </div>
            
            <div class="product-card">
                <div class="product-info">
                    <div class="product-icon" style="background: #48c78e;">🍇</div>
                    <div class="product-details">
                        <h3>葡萄</h3>
                        <p>售价: 20金币 | 利润: 12金币</p>
                    </div>
                </div>
                <button class="buy-btn" onclick="buyProduct('grape', 100)">购买 (100金币)</button>
            </div>
            
            <div class="product-card">
                <div class="product-info">
                    <div class="product-icon" style="background: #f093fb;">🍓</div>
                    <div class="product-details">
                        <h3>草莓</h3>
                        <p>售价: 25金币 | 利润: 15金币</p>
                    </div>
                </div>
                <button class="buy-btn" onclick="buyProduct('strawberry', 120)">购买 (120金币)</button>
            </div>
        </div>
        
        <div class="inventory-area">
            <div class="inventory-title">库存:</div>
            <div class="inventory-items" id="inventory"></div>
            <button class="buy-btn" style="margin-top: 15px; width: 100%;" onclick="sellAll()">💰 出售全部</button>
        </div>
    </div>
    
    <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <script>
        const GAME_NAME = '模拟经营';
        GameCore.init({ highScore: GAME_NAME });
        
        const products = {
            apple: { emoji: '🍎', name: '苹果', cost: 50, sellPrice: 60, profit: 10 },
            orange: { emoji: '🍊', name: '橙子', cost: 80, sellPrice: 95, profit: 15 },
            grape: { emoji: '🍇', name: '葡萄', cost: 100, sellPrice: 120, profit: 20 },
            strawberry: { emoji: '🍓', name: '草莓', cost: 120, sellPrice: 150, profit: 30 }
        };
        
        let money = 1000;
        let reputation = 10;
        let inventory = {
            apple: 0,
            orange: 0,
            grape: 0,
            strawberry: 0
        };
        
        function initGame() {
            const highScore = GameCore.highScore.get(GAME_NAME);
            money = highScore || 1000;
            updateUI();
        }
        
        function updateUI() {
            document.getElementById('money').textContent = money;
            document.getElementById('reputation').textContent = reputation;
            
            const invEl = document.getElementById('inventory');
            invEl.innerHTML = '';
            
            Object.keys(inventory).forEach(key => {
                if (inventory[key] > 0) {
                    const item = document.createElement('div');
                    item.className = 'inventory-item';
                    item.textContent = `${products[key].emoji} ${products[key].name} x${inventory[key]}`;
                    invEl.appendChild(item);
                }
            });
            
            if (Object.values(inventory).every(v => v === 0)) {
                invEl.innerHTML = '<span style="opacity: 0.5;">库存为空</span>';
            }
        }
        
        function buyProduct(productKey, cost) {
            if (money >= cost) {
                money -= cost;
                inventory[productKey]++;
                updateUI();
                GameCore.hints.show(`购买了 ${products[productKey].name}`);
            } else {
                GameCore.hints.show('金币不足！');
            }
        }
        
        function sellAll() {
            let totalProfit = 0;
            
            Object.keys(inventory).forEach(key => {
                if (inventory[key] > 0) {
                    totalProfit += inventory[key] * products[key].profit;
                    inventory[key] = 0;
                }
            });
            
            money += totalProfit;
            
            if (totalProfit > 0) {
                reputation += Math.floor(totalProfit / 100);
                GameCore.hints.show(`出售成功！获得 ${totalProfit} 金币`);
            } else {
                GameCore.hints.show('库存为空！');
            }
            
            GameCore.highScore.set(GAME_NAME, money);
            updateUI();
        }
        
        initGame();
        GameCore.touch.enableAllButtons();
    </script>
</body>
</html>
