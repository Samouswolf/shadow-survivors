<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>战棋游戏 - 游戏工坊</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%); min-height: 100vh; }
#game-container { max-width: 600px; margin: 0 auto; padding: 20px; }
#game-ui { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; color: #fff; }
#game-ui h1 { font-size: 24px; color: #f87171; }
#turn-info { font-size: 16px; color: #fbbf24; }
#grid-container { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin-bottom: 20px; }
.cell { aspect-ratio: 1; background: rgba(255,255,255,0.05); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; transition: all 0.2s; border: 2px solid transparent; }
.cell:hover { background: rgba(255,255,255,0.1); }
.cell.selected { border-color: #4ade80; box-shadow: 0 0 10px rgba(74,222,128,0.5); }
.cell.moveable { border-color: #3b82f6; background: rgba(59,130,246,0.2); }
.cell.attackable { border-color: #ef4444; background: rgba(239,68,68,0.2); }
.cell.player-unit { background: rgba(74,222,128,0.2); }
.cell.enemy-unit { background: rgba(248,113,113,0.2); }
#unit-info { background: rgba(0,0,0,0.3); border-radius: 15px; padding: 20px; }
#unit-info h3 { color: #fff; margin-bottom: 10px; }
#unit-info p { color: #aaa; font-size: 14px; margin-bottom: 5px; }
#action-buttons { display: flex; gap: 10px; margin-top: 15px; }
.action-btn { padding: 12px 20px; font-size: 14px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: all 0.2s; }
.action-btn.move { background: linear-gradient(145deg, #3b82f6, #2563eb); color: #fff; }
.action-btn.attack { background: linear-gradient(145deg, #ef4444, #dc2626); color: #fff; }
.action-btn.end-turn { background: linear-gradient(145deg, #6b7280, #4b5563); color: #fff; }
.action-btn:disabled { opacity: 0.5; cursor: not-allowed; }
#game-over { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; flex-direction: column; align-items: center; justify-content: center; }
#game-over h2 { font-size: 48px; margin-bottom: 20px; }
#game-over p { font-size: 24px; color: #fff; margin-bottom: 30px; }
#game-over .btn { padding: 15px 40px; font-size: 20px; background: #6366f1; color: #fff; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
#start-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 90; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#start-screen h1 { font-size: 48px; color: #f87171; margin-bottom: 20px; text-shadow: 0 0 20px rgba(248,113,113,0.5); }
#start-screen p { color: #aaa; margin-bottom: 40px; font-size: 16px; text-align: center; max-width: 400px; }
#start-screen .btn { padding: 18px 50px; font-size: 22px; background: linear-gradient(145deg, #f87171, #ef4444); color: #fff; border: none; border-radius: 15px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 20px rgba(248,113,113,0.4); }
.ad-banner-container { margin-top: 20px; }
.sponsor-btn { position: fixed; top: 20px; right: 20px; width: 50px; height: 50px; background: rgba(255,165,0,0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; z-index: 100; }
.sponsor-panel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 200; align-items: center; justify-content: center; }
.sponsor-panel.show { display: flex; }
.sponsor-content { background: #fff; padding: 30px; border-radius: 20px; text-align: center; }
.sponsor-close { position: absolute; top: 20px; right: 20px; width: 40px; height: 40px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; }
#loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#loading-screen .loading-icon { width: 60px; height: 60px; border: 4px solid #f87171; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#loading-screen p { color: #f87171; margin-top: 20px; font-size: 18px; }
.interstitial-ad { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
.interstitial-ad .ad-content { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; text-align: center; min-width: 280px; max-width: 400px; }
.interstitial-ad .skip-btn { padding: 8px 28px; background: rgba(255,215,0,0.15); border: 1px solid rgba(255,215,0,0.3); border-radius: 20px; color: #ffd700; font-weight: bold; font-size: 15px; cursor: pointer; }
/* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}

  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script src="../game_core.js"></script>
<script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;

    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script>
// ==================== 游戏说明 ====================
// 操作说明: 点击己方单位选中，点击蓝色格子移动，红色格子攻击
// 游戏目标: 消灭所有敌人获得胜利
// 存档系统: 自动保存胜利次数到本地
// ==================== 模块说明 ====================
// 1. 游戏初始化模块 - 初始化地图和单位
// 2. 战斗逻辑模块 - 处理移动和攻击
// 3. 渲染模块 - 更新地图显示
// 4. 音效模块 - 播放战斗音效
// 5. 存档模块 - 管理胜利记录

const GAME_NAME = '战棋游戏';

class GameCore {
  static init(options) {
    if (options && options.highScore) {
      this.highScoreKey = options.highScore;
    }
  }
  
  static getHighScore() {
    try {
      return parseInt(localStorage.getItem(this.highScoreKey)) || 0;
    } catch (error) {
      console.warn('读取最高分失败:', error);
      return 0;
    }
  }
  
  static setHighScore(value) {
    try {
      const current = this.getHighScore();
      if (value > current) {
        localStorage.setItem(this.highScoreKey, value.toString());
        return true;
      }
      return false;
    } catch (error) {
      console.warn('保存最高分失败:', error);
      return false;
    }
  }
}

GameCore.init({ highScore: GAME_NAME });

const UNITS = {
  warrior: { emoji: '⚔️', name: '战士', hp: 80, attack: 20, defense: 10, moveRange: 2, attackRange: 1 },
  archer: { emoji: '🏹', name: '弓箭手', hp: 60, attack: 25, defense: 5, moveRange: 3, attackRange: 2 },
  mage: { emoji: '🧙', name: '法师', hp: 50, attack: 35, defense: 3, moveRange: 2, attackRange: 2 },
};

let grid = [];
let units = [];
let selectedUnit = null;
let currentMode = 'select';
let isPlayerTurn = true;
let victories = 0;

function initGame() {
  grid = Array(36).fill(null);
  
  units = [
    { id: 1, type: 'warrior', team: 'player', hp: 80, maxHp: 80, pos: 0 },
    { id: 2, type: 'archer', team: 'player', hp: 60, maxHp: 60, pos: 1 },
    { id: 3, type: 'warrior', team: 'enemy', hp: 70, maxHp: 70, pos: 34 },
    { id: 4, type: 'archer', team: 'enemy', hp: 50, maxHp: 50, pos: 35 },
  ];
}

function renderGrid() {
  const container = document.getElementById('grid-container');
  container.innerHTML = '';
  
  grid.forEach((_, index) => {
    const cell = document.createElement('div');
    cell.className = 'cell';
    
    const unit = units.find(u => u.pos === index);
    if (unit) {
      cell.classList.add(unit.team === 'player' ? 'player-unit' : 'enemy-unit');
      cell.innerHTML = `<div style="font-size:24px;">${UNITS[unit.type].emoji}</div>`;
    }
    
    if (selectedUnit && selectedUnit.pos === index) {
      cell.classList.add('selected');
    }
    
    if (currentMode === 'move' && selectedUnit) {
      if (canMove(selectedUnit, index)) {
        cell.classList.add('moveable');
      }
    }
    
    if (currentMode === 'attack' && selectedUnit) {
      if (canAttack(selectedUnit, index)) {
        cell.classList.add('attackable');
      }
    }
    
    cell.onclick = () => handleCellClick(index);
    container.appendChild(cell);
  });
}

function handleCellClick(index) {
  if (!isPlayerTurn) return;
  
  const unitAtPos = units.find(u => u.pos === index);
  
  if (currentMode === 'select') {
    if (unitAtPos && unitAtPos.team === 'player') {
      selectedUnit = unitAtPos;
      updateUnitInfo();
    }
  } else if (currentMode === 'move') {
    if (canMove(selectedUnit, index)) {
      moveUnit(selectedUnit, index);
      currentMode = 'select';
    }
  } else if (currentMode === 'attack') {
    if (canAttack(selectedUnit, index)) {
      attackUnit(selectedUnit, unitAtPos);
      currentMode = 'select';
      checkGameOver();
    }
  }
  
  renderGrid();
}

function canMove(unit, targetPos) {
  const row = Math.floor(unit.pos / 6);
  const col = unit.pos % 6;
  const targetRow = Math.floor(targetPos / 6);
  const targetCol = targetPos % 6;
  const distance = Math.abs(row - targetRow) + Math.abs(col - targetCol);
  
  return distance <= UNITS[unit.type].moveRange && !units.find(u => u.pos === targetPos);
}

function canAttack(unit, targetPos) {
  const row = Math.floor(unit.pos / 6);
  const col = unit.pos % 6;
  const targetRow = Math.floor(targetPos / 6);
  const targetCol = targetPos % 6;
  const distance = Math.abs(row - targetRow) + Math.abs(col - targetCol);
  
  const targetUnit = units.find(u => u.pos === targetPos);
  return distance <= UNITS[unit.type].attackRange && targetUnit && targetUnit.team !== unit.team;
}

function moveUnit(unit, pos) {
  unit.pos = pos;
  playSound(220, 0.1, 'sine');
}

function attackUnit(attacker, defender) {
  const damage = Math.max(1, UNITS[attacker.type].attack - UNITS[defender.type].defense);
  defender.hp = Math.max(0, defender.hp - damage);
  playSound(440, 0.15, 'square');
  
  if (defender.hp <= 0) {
    units = units.filter(u => u.id !== defender.id);
    playSound(660, 0.2, 'sawtooth');
  }
}

function toggleMoveMode() {
  if (!selectedUnit) return;
  currentMode = currentMode === 'move' ? 'select' : 'move';
  updateUnitInfo();
  renderGrid();
}

function toggleAttackMode() {
  if (!selectedUnit) return;
  currentMode = currentMode === 'attack' ? 'select' : 'attack';
  updateUnitInfo();
  renderGrid();
}

function endTurn() {
  isPlayerTurn = false;
  currentMode = 'select';
  selectedUnit = null;
  document.getElementById('turn-info').textContent = '敌人回合';
  
  setTimeout(enemyTurn, 1000);
}

function enemyTurn() {
  const enemies = units.filter(u => u.team === 'enemy');
  const players = units.filter(u => u.team === 'player');
  
  enemies.forEach(enemy => {
    const target = players.find(p => canAttack(enemy, p.pos));
    if (target) {
      attackUnit(enemy, target);
    }
  });
  
  isPlayerTurn = true;
  document.getElementById('turn-info').textContent = '玩家回合';
  updateUnitInfo();
  renderGrid();
  
  checkGameOver();
}

function checkGameOver() {
  const playerUnits = units.filter(u => u.team === 'player');
  const enemyUnits = units.filter(u => u.team === 'enemy');
  
  if (enemyUnits.length === 0) {
    victories++;
    GameCore.setHighScore(victories);
    document.getElementById('result-title').textContent = '🎉 胜利！';
    document.getElementById('result-title').style.color = '#4ade80';
    document.getElementById('result-message').textContent = `你消灭了所有敌人！胜利次数: ${victories}`;
    document.getElementById('game-over').style.display = 'flex';
  } else if (playerUnits.length === 0) {
    document.getElementById('result-title').textContent = '💀 失败';
    document.getElementById('result-title').style.color = '#f5576c';
    document.getElementById('result-message').textContent = '你的队伍全军覆没...';
    document.getElementById('game-over').style.display = 'flex';
  }
}

function updateUnitInfo() {
  if (selectedUnit) {
    const unitData = UNITS[selectedUnit.type];
    document.getElementById('unit-name').textContent = unitData.emoji + ' ' + unitData.name;
    document.getElementById('unit-stats').textContent = `生命: ${selectedUnit.hp}/${selectedUnit.maxHp} | 攻击: ${unitData.attack} | 防御: ${unitData.defense}`;
  } else {
    document.getElementById('unit-name').textContent = '选择单位';
    document.getElementById('unit-stats').textContent = '点击地图上的单位查看详情';
  }
}

function startGame() {
  try {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('game-over').style.display = 'none';
    
    initGame();
    selectedUnit = null;
    currentMode = 'select';
    isPlayerTurn = true;
    
    document.getElementById('turn-info').textContent = '玩家回合';
    updateUnitInfo();
    renderGrid();
  } catch (error) {
    console.error('开始游戏失败:', error);
    alert('游戏启动失败，请重试');
  }
}

function restartGame() {
  startGame();
}

function showSponsor() {
  try {
    document.getElementById('sponsor-panel').classList.add('show');
  } catch (error) {
    console.error('显示赞助面板失败:', error);
  }
}

function hideSponsor() {
  try {
    document.getElementById('sponsor-panel').classList.remove('show');
  } catch (error) {
    console.error('隐藏赞助面板失败:', error);
  }
}

function closeInterstitial() {
  try {
    document.getElementById('interstitialAd').style.display = 'none';
  } catch (error) {
    console.error('关闭广告失败:', error);
  }
}

let audioCtx = null;
function initAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch (error) {
    console.warn('音频初始化失败:', error);
  }
}
function playSound(freq, dur, type, vol) {
  try {
    if (!audioCtx) return;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || 'square';
    o.frequency.value = freq;
    g.gain.value = vol || 0.15;
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime + dur);
  } catch (error) {
    console.warn('音效播放失败:', error);
  }
}

window.addEventListener('load', () => {
  try {
    setTimeout(() => {
      document.getElementById('loading-screen').style.display = 'none';
    }, 1500);
  } catch (error) {
    console.error('初始化失败:', error);
  }
});
</script>

<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>

<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>

  <p style="color:#ccc;font:14px 'Microsoft YaHei',sans-serif">您的支持是我们持续开发的动力</p>
  <button class="sponsor-close" onclick="document.getElementById('batchSponsorPanel').classList.remove('show')">关闭</button>

    <p style="color:#ccc;font:16px 'Microsoft YaHei',sans-serif;margin-bottom:16px">广告加载中...</p>

  </div>

<!-- [BATCH-FIX:ad-components-js] -->
<script>
(function(){
  if (window.__batchFixAds) return;
  window.__batchFixAds = true;
  window.addEventListener('load', function() {
    var btn = document.getElementById('batchSponsorBtn');
    if (btn) btn.style.display = '';
  });
})();
</script>
<!-- [/BATCH-FIX:ad-components-js] -->
<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
</body>
