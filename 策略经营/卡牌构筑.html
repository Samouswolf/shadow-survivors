<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>卡牌构筑</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; overflow: hidden; color: #fff; }
        .game-container { width: 100%; height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 10px; }
        .stat { display: flex; flex-direction: column; align-items: center; }
        .stat-label { font-size: 12px; opacity: 0.7; }
        .stat-value { font-size: 24px; font-weight: bold; color: #a855f7; }
        
        .game-area { flex: 1; position: relative; background: rgba(0,0,0,0.4); border-radius: 15px; overflow: hidden; }
        #gameCanvas { width: 100%; height: 100%; display: block; }
        
        .deck-indicator { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 10px; font-size: 16px; }
        
        .controls { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
        .btn { padding: 12px 25px; border: none; border-radius: 25px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">回合</div>
                <div class="stat-value" id="turn">1</div>
            </div>
            <div class="stat">
                <div class="stat-label">分数</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">最高</div>
                <div class="stat-value" id="highScore">0</div>
            </div>
        </div>
        
        <div class="game-area">
            <canvas id="gameCanvas"></canvas>
            <div class="deck-indicator" id="deckIndicator">🃏 卡组: 0/10</div>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" id="btnStart">▶️ 开始游戏</button>
        </div>
        
        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const GAME_NAME = '卡牌构筑';
        GameCore.init({ highScore: GAME_NAME });
        
        let turn = 1;
        let score = 0;
        let gameRunning = false;
        
        let deck = [];
        let hand = [];
        let availableCards = [];
        
        const CARD_TYPES = [
            { name: '攻击', emoji: '⚔️', cost: 1, effect: { attack: 3 }, color: '#ff6b6b' },
            { name: '防御', emoji: '🛡️', cost: 1, effect: { defense: 3 }, color: '#4ecdc4' },
            { name: '法力', emoji: '🔮', cost: 0, effect: { mana: 2 }, color: '#a855f7' },
            { name: '治疗', emoji: '💚', cost: 2, effect: { health: 5 }, color: '#48c78e' },
            { name: '连击', emoji: '⚡', cost: 3, effect: { attack: 5, defense: 2 }, color: '#ffa502' },
            { name: '抽牌', emoji: '📚', cost: 2, effect: { draw: 2 }, color: '#00d2ff' },
            { name: '暴击', emoji: '💥', cost: 4, effect: { attack: 8 }, color: '#f5576c' },
            { name: '护盾', emoji: '🌟', cost: 3, effect: { defense: 5, health: 3 }, color: '#ffd700' }
        ];
        
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            initGame();
        }
        
        function initGame() {
            turn = 1;
            score = 0;
            deck = [];
            hand = [];
            
            refreshAvailableCards();
            drawHand();
        }
        
        function refreshAvailableCards() {
            availableCards = [];
            for (let i = 0; i < 5; i++) {
                const card = { ...CARD_TYPES[Math.floor(Math.random() * CARD_TYPES.length)] };
                card.id = Date.now() + i;
                availableCards.push(card);
            }
        }
        
        function drawHand() {
            hand = [];
            for (let i = 0; i < 4; i++) {
                const card = { ...CARD_TYPES[Math.floor(Math.random() * CARD_TYPES.length)] };
                card.id = Date.now() + i;
                hand.push(card);
            }
        }
        
        function addToDeck(card) {
            if (deck.length >= 10) {
                GameCore.hints.show('卡组已满！');
                return;
            }
            
            deck.push(card);
            score += 20;
            
            // 从手牌移除
            hand = hand.filter(c => c.id !== card.id);
            
            // 从可用卡牌移除
            availableCards = availableCards.filter(c => c.id !== card.id);
            
            // 补充手牌
            if (availableCards.length > 0) {
                const newCard = { ...availableCards[0] };
                newCard.id = Date.now();
                hand.push(newCard);
                availableCards.shift();
            }
            
            updateStats();
            
            if (deck.length >= 10) {
                finishDeck();
            }
        }
        
        function finishDeck() {
            score += turn * 100;
            turn++;
            
            // 计算卡组强度
            let power = 0;
            deck.forEach(card => {
                Object.values(card.effect).forEach(v => power += v);
            });
            score += power;
            
            GameCore.hints.show(`卡组完成！强度: ${power}`, 3000);
            
            deck = [];
            refreshAvailableCards();
            drawHand();
        }
        
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 已构筑卡组区域
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(10, 10, canvas.width - 20, 80);
            
            ctx.fillStyle = '#fff';
            ctx.font = '14px Arial';
            ctx.fillText('已构筑卡组', 20, 35);
            
            deck.forEach((card, i) => {
                const x = 20 + i * 50;
                ctx.fillStyle = card.color;
                ctx.beginPath();
                ctx.arc(x, 60, 20, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#fff';
                ctx.font = '16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(card.emoji, x, 65);
            });
            
            // 可用卡牌区域
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(10, 100, canvas.width - 20, 100);
            
            ctx.fillStyle = '#fff';
            ctx.font = '14px Arial';
            ctx.fillText('可用卡牌', 20, 125);
            
            availableCards.forEach((card, i) => {
                const x = 20 + i * 100;
                const y = 140;
                
                ctx.fillStyle = card.color;
                ctx.fillRect(x, y, 80, 50);
                
                ctx.fillStyle = '#fff';
                ctx.font = '16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(card.emoji, x + 40, y + 20);
                ctx.font = '10px Arial';
                ctx.fillText(card.name + ' ' + card.cost, x + 40, y + 38);
            });
            
            // 手牌区域
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(10, canvas.height - 120, canvas.width - 20, 100);
            
            ctx.fillStyle = '#fff';
            ctx.font = '14px Arial';
            ctx.fillText('手牌', 20, canvas.height - 95);
            
            hand.forEach((card, i) => {
                const x = 20 + i * 100;
                const y = canvas.height - 75;
                
                ctx.fillStyle = card.color;
                ctx.fillRect(x, y, 80, 50);
                
                ctx.fillStyle = '#fff';
                ctx.font = '16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(card.emoji, x + 40, y + 20);
                ctx.font = '10px Arial';
                ctx.fillText(card.name + ' ' + card.cost, x + 40, y + 38);
            });
        }
        
        function updateStats() {
            document.getElementById('turn').textContent = turn;
            document.getElementById('score').textContent = score;
            document.getElementById('highScore').textContent = GameCore.highScore.get(GAME_NAME);
            document.getElementById('deckIndicator').textContent = `🃏 卡组: ${deck.length}/10`;
            
            if (GameCore.highScore.set(GAME_NAME, score)) {
                GameCore.hints.show('新纪录！分数: ' + score);
            }
        }
        
        function gameLoop() {
            draw();
            
            if (gameRunning) {
                updateStats();
            }
            
            requestAnimationFrame(gameLoop);
        }
        
        canvas.addEventListener('click', e => {
            if (!gameRunning) return;
            
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            // 检查可用卡牌点击
            availableCards.forEach((card, i) => {
                const cx = 20 + i * 100;
                const cy = 140;
                
                if (x > cx && x < cx + 80 && y > cy && y < cy + 50) {
                    addToDeck(card);
                }
            });
            
            // 检查手牌点击
            hand.forEach((card, i) => {
                const cx = 20 + i * 100;
                const cy = canvas.height - 75;
                
                if (x > cx && x < cx + 80 && y > cy && y < cy + 50) {
                    addToDeck(card);
                }
            });
        });
        
        document.getElementById('btnStart').onclick = () => {
            gameRunning = true;
            initGame();
        };
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        gameLoop();
    </script>
</body>
</html>
