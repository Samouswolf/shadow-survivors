<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>战争策略</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; overflow: hidden; color: #fff; }
        .game-container { width: 100%; height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 10px; }
        .stat { display: flex; flex-direction: column; align-items: center; }
        .stat-label { font-size: 12px; opacity: 0.7; }
        .stat-value { font-size: 24px; font-weight: bold; color: #ff6b6b; }
        
        .game-area { flex: 1; position: relative; background: rgba(0,0,0,0.4); border-radius: 15px; overflow: hidden; }
        #gameCanvas { width: 100%; height: 100%; display: block; }
        
        .army-indicator { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 10px; font-size: 16px; }
        
        .controls { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
        .btn { padding: 12px 25px; border: none; border-radius: 25px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">回合</div>
                <div class="stat-value" id="turn">1</div>
            </div>
            <div class="stat">
                <div class="stat-label">分数</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">最高</div>
                <div class="stat-value" id="highScore">0</div>
            </div>
        </div>
        
        <div class="game-area">
            <canvas id="gameCanvas"></canvas>
            <div class="army-indicator" id="armyIndicator">⚔️ 兵力: 100</div>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" id="btnStart">▶️ 开始游戏</button>
        </div>
        
        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const GAME_NAME = '战争策略';
        GameCore.init({ highScore: GAME_NAME });
        
        let turn = 1;
        let score = 0;
        let gameRunning = false;
        
        let army = 100;
        let territories = [];
        let enemies = [];
        
        const UNIT_TYPES = [
            { name: '步兵', cost: 10, attack: 5, defense: 3, emoji: '👨‍✈️' },
            { name: '骑兵', cost: 20, attack: 8, defense: 2, emoji: '🐴' },
            { name: '弓箭手', cost: 15, attack: 6, defense: 1, emoji: '🏹' },
            { name: '重装兵', cost: 30, attack: 4, defense: 6, emoji: '🛡️' },
            { name: '法师', cost: 25, attack: 10, defense: 0, emoji: '🧙' }
        ];
        
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            initGame();
        }
        
        function initGame() {
            turn = 1;
            score = 0;
            army = 100;
            
            territories = [];
            enemies = [];
            
            for (let i = 0; i < 5; i++) {
                territories.push({
                    x: 50 + i * 150,
                    y: 100,
                    width: 80,
                    height: 80,
                    owned: i === 0,
                    color: i === 0 ? '#48c78e' : '#666'
                });
                
                if (i > 0) {
                    enemies.push({
                        x: 50 + i * 150 + 40,
                        y: 200,
                        army: 30 + i * 20,
                        unit: UNIT_TYPES[i % UNIT_TYPES.length]
                    });
                }
            }
        }
        
        function attackTerritory(index) {
            if (territories[index].owned) return;
            
            const enemy = enemies[index - 1];
            if (!enemy) return;
            
            // 战斗计算
            const playerPower = army;
            const enemyPower = enemy.army;
            
            if (playerPower > enemyPower) {
                army -= Math.floor(enemyPower / 2);
                territories[index].owned = true;
                territories[index].color = '#48c78e';
                
                score += 100;
                GameCore.hints.show('占领成功！', 2000);
                
                enemies[index - 1] = null;
                
                if (territories.every(t => t.owned)) {
                    turn++;
                    score += turn * 500;
                    initGame();
                }
            } else {
                army -= Math.floor(playerPower / 2);
                score -= 50;
                GameCore.hints.show('进攻失败！', 2000);
            }
            
            updateStats();
        }
        
        function recruitUnit(type) {
            const unit = UNIT_TYPES[type];
            if (army >= unit.cost) {
                army -= unit.cost;
                score += unit.attack + unit.defense;
                updateStats();
            } else {
                GameCore.hints.show('兵力不足！');
            }
        }
        
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 地图
            territories.forEach((territory, i) => {
                ctx.fillStyle = territory.color;
                ctx.fillRect(territory.x, territory.y, territory.width, territory.height);
                
                ctx.fillStyle = '#fff';
                ctx.font = '14px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('领土 ' + (i + 1), territory.x + territory.width / 2, territory.y + territory.height / 2);
                
                if (territory.owned) {
                    ctx.fillStyle = '#ffd700';
                    ctx.font = '20px Arial';
                    ctx.fillText('🏰', territory.x + territory.width / 2, territory.y + territory.height / 2 + 25);
                }
            });
            
            // 敌人
            enemies.forEach((enemy, i) => {
                if (!enemy) return;
                
                ctx.fillStyle = '#ff6b6b';
                ctx.beginPath();
                ctx.arc(enemy.x, enemy.y, 30, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#fff';
                ctx.font = '16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(enemy.unit.emoji, enemy.x, enemy.y - 5);
                ctx.font = '10px Arial';
                ctx.fillText(enemy.army + '兵', enemy.x, enemy.y + 15);
            });
            
            // 单位招募
            UNIT_TYPES.forEach((unit, i) => {
                const x = 10;
                const y = canvas.height - 100 + i * 40;
                
                ctx.fillStyle = '#4a5568';
                ctx.fillRect(x, y, 100, 35);
                
                ctx.fillStyle = '#fff';
                ctx.font = '14px Arial';
                ctx.fillText(unit.emoji + ' ' + unit.name, x + 15, y + 25);
                ctx.font = '12px Arial';
                ctx.fillStyle = '#ffd700';
                ctx.fillText('花费:' + unit.cost, x + 70, y + 25);
            });
        }
        
        function updateStats() {
            document.getElementById('turn').textContent = turn;
            document.getElementById('score').textContent = score;
            document.getElementById('highScore').textContent = GameCore.highScore.get(GAME_NAME);
            document.getElementById('armyIndicator').textContent = `⚔️ 兵力: ${army}`;
            
            if (army <= 0) {
                gameRunning = false;
                GameCore.hints.show('兵力耗尽！游戏结束！', 5000);
            }
            
            if (GameCore.highScore.set(GAME_NAME, score)) {
                GameCore.hints.show('新纪录！分数: ' + score);
            }
        }
        
        function gameLoop() {
            draw();
            
            if (gameRunning) {
                updateStats();
            }
            
            requestAnimationFrame(gameLoop);
        }
        
        canvas.addEventListener('click', e => {
            if (!gameRunning) return;
            
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            // 检查领土点击
            territories.forEach((territory, i) => {
                if (x > territory.x && x < territory.x + territory.width &&
                    y > territory.y && y < territory.y + territory.height) {
                    attackTerritory(i);
                }
            });
            
            // 检查单位招募
            UNIT_TYPES.forEach((unit, i) => {
                const ux = 10;
                const uy = canvas.height - 100 + i * 40;
                
                if (x > ux && x < ux + 100 && y > uy && y < uy + 35) {
                    recruitUnit(i);
                }
            });
        });
        
        document.getElementById('btnStart').onclick = () => {
            gameRunning = true;
            initGame();
        };
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        gameLoop();
    </script>
</body>
</html>
