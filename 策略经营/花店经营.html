<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>花店经营</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a0a2e;font-family:'Microsoft YaHei',sans-serif}
canvas{display:block;touch-action:none}

/* [BUGFIX startgame-v2] 开始按钮强制可见+广告关闭可点击 */
#start-game-btn{display:block!important;}
.sponsor-close,#sponsorClose,.skip-btn,#skipInterstitial{pointer-events:auto!important;}
</style>

<style>
/* 游戏工坊广告系统 */
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);height:90px;max-height:90px;overflow:hidden;contain:layout style paint;pointer-events:none!important}.ad-banner-container,.ad-banner-container *{pointer-events:none!important}.ad-banner-container iframe{max-height:90px;pointer-events:none!important}
.ad-banner-container iframe{max-width:100%}
.ad-label{position:absolute;top:1px;right:6px;font:9px "Microsoft YaHei",sans-serif;color:rgba(255,255,255,.35)}
.sponsor-btn{position:fixed;top:44px;right:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:3px 9px;border-radius:10px;font:11px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .qr-row{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.sponsor-panel .qr-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px;text-align:center;min-width:140px}
.sponsor-panel .qr-card .qr-icon{font-size:48px;margin-bottom:6px}
.sponsor-panel .qr-card .qr-label{color:#ccc;font:13px "Microsoft YaHei",sans-serif}
.sponsor-panel .qr-card .qr-hint{color:#888;font:11px "Microsoft YaHei",sans-serif;margin-top:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.interstitial-ad .ad-content{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;text-align:center;min-width:280px;max-width:400px}
.interstitial-ad .ad-content p{color:#aaa;font:14px "Microsoft YaHei",sans-serif;margin-bottom:12px}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
</style>
</head>
<body>

    <button id="start-game-btn" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:20px 40px;font-size:20px;background:#f5576c;color:white;border:none;border-radius:12px;cursor:pointer;z-index:999;font-weight:bold;display:none;">开始游戏</button>

<canvas id="C"></canvas>

  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script src="../game_core.js"></script>
<script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script>
const canvas=document.getElementById('C');
const ctx=canvas.getContext('2d');

function resizeCanvas(){
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize',resizeCanvas);

// 花卉数据
const FLOWERS=[
    {name:'茉莉',emoji:'🌿',growTime:8,seedCost:10,sellBase:25,color:'#e8f5e9',desc:'清香淡雅'},
    {name:'牡丹',emoji:'🌸',growTime:15,seedCost:30,sellBase:80,color:'#fce4ec',desc:'富贵花开'},
    {name:'兰花',emoji:'🪻',growTime:20,seedCost:50,sellBase:150,color:'#e8eaf6',desc:'幽兰独芳'},
    {name:'金菊',emoji:'🌻',growTime:12,seedCost:20,sellBase:55,color:'#fff9c4',desc:'秋菊傲霜'},
    {name:'寒梅',emoji:'🌺',growTime:25,seedCost:80,sellBase:250,color:'#ffebee',desc:'梅开五福'}
];

// 顾客数据
const CUSTOMERS=[
    {name:'书生',budget:[20,80],prefer:0,emoji:'🧑‍🎓',dialog:'素雅之花甚好'},
    {name:'夫人',budget:[50,200],prefer:1,emoji:'👩',dialog:'牡丹乃花中之王'},
    {name:'隐士',budget:[100,300],prefer:2,emoji:'🧓',dialog:'兰为四君子之首'},
    {name:'农夫',budget:[15,60],prefer:3,emoji:'👨‍🌾',dialog:'菊花泡茶清热解毒'},
    {name:'诗人',budget:[80,300],prefer:4,emoji:'📜',dialog:'墙角数枝梅凌寒独自开'},
    {name:'商人',budget:[30,150],prefer:-1,emoji:'💼',dialog:'有好花尽管拿来'},
    {name:'小姐',budget:[40,180],prefer:1,emoji:'👸',dialog:'要最美的花儿'},
    {name:'大夫',budget:[60,200],prefer:3,emoji:'👨‍⚕️',dialog:'菊花入药良品'}
];

// 诗集
const POEMS=[
    '采菊东篱下，悠然见南山',
    '牡丹花开动京城',
    '梅须逊雪三分白，雪却输梅一段香',
    '兰生幽谷无人识，客种东轩遗我香',
    '不是花中偏爱菊，此花开尽更无花',
    '唯有牡丹真国色，花开时节动京城',
    '零落成泥碾作尘，只有香如故',
    '幽兰在山谷，本自无人识'
];

// 店铺升级
const SHOP_LEVELS=[
    {name:'路边小摊',slots:3,price:0,desc:'简陋的花摊'},
    {name:'花坊',slots:5,price:300,desc:'初具规模'},
    {name:'花阁',slots:8,price:800,desc:'雅致花阁'},
    {name:'花庄',slots:12,price:2000,desc:'名门花庄'},
    {name:'花仙居',slots:16,price:5000,desc:'仙居福地'}
];

// 游戏状态
var G={
    state:'menu', // menu,playing,paused,gameover
    money:100,
    day:1,
    totalDays:30,
    score:0,
    reputation:50,
    highScore:parseInt(localStorage.getItem('flowerShop_highScore')||'0'),
    shopLevel:0,
    plots:[],
    inventory:[],
    customers:[],
    currentCustomer:null,
    selectedFlower:-1,
    selectedPlot:-1,
    particleEffects:[],
    floatingTexts:[],
    time:0,
    dayTimer:0,
    dayDuration:15, // 每天15秒
    customerTimer:0,
    customerInterval:6, // 每6秒来客
    customerQueue:[],
    maxQueue:3,
    animFrame:0,
    tutorial:0, // 教程步骤
    showTutorial:true,
    combo:0,
    comboTimer:0,
    totalSold:0,
    totalEarned:0,
    toolMode:'plant' // plant,water,harvest,sell
};

// 初始化地块
function initPlots(){
    G.plots=[];
    var slots=SHOP_LEVELS[G.shopLevel].slots;
    for(var i=0;i<slots;i++){
        G.plots.push({flower:-1,growth:0,watered:false,stage:'empty'}); // empty,growing,ready
    }
}

// 重置游戏
function resetGame(){
    G.state='playing';
    G.money=100;
    G.day=1;
    G.score=0;
    G.reputation=50;
    G.shopLevel=0;
    G.inventory=[];
    G.customers=[];
    G.currentCustomer=null;
    G.selectedFlower=-1;
    G.selectedPlot=-1;
    G.particleEffects=[];
    G.floatingTexts=[];
    G.time=0;
    G.dayTimer=0;
    G.customerTimer=0;
    G.customerQueue=[];
    G.tutorial=0;
    G.showTutorial=true;
    G.combo=0;
    G.comboTimer=0;
    G.totalSold=0;
    G.totalEarned=0;
    G.toolMode='plant';
    initPlots();
}

// 粒子系统
function addParticles(x,y,count,color,spread){
    for(var i=0;i<count;i++){
        var angle=Math.random()*Math.PI*2;
        var speed=Math.random()*spread+1;
        G.particleEffects.push({
            x:x,y:y,
            vx:Math.cos(angle)*speed,
            vy:Math.sin(angle)*speed-1,
            life:1,
            decay:0.015+Math.random()*0.02,
            size:2+Math.random()*3,
            color:color
        });
    }
}

// 浮动文字
function addFloatingText(x,y,text,color){
    G.floatingTexts.push({x:x,y:y,text:text,color:color,life:1,vy:-1.5});
}

// 绘制渐变背景
function drawBg(){
    var grad=ctx.createLinearGradient(0,0,0,canvas.height);
    if(G.state==='menu'){
        grad.addColorStop(0,'#2d1b69');
        grad.addColorStop(0.5,'#44318d');
        grad.addColorStop(1,'#1a0a2e');
    } else if(G.state==='gameover'){
        grad.addColorStop(0,'#1a0a2e');
        grad.addColorStop(1,'#2d1b69');
    } else {
        grad.addColorStop(0,'#87ceeb');
        grad.addColorStop(0.4,'#b0e0e6');
        grad.addColorStop(0.7,'#98d1a8');
        grad.addColorStop(1,'#6b8e6b');
    }
    ctx.fillStyle=grad;
    ctx.fillRect(0,0,canvas.width,canvas.height);
}

// 绘制星星（菜单/结束背景）
function drawStars(){
    if(G.state!=='menu'&&G.state!=='gameover') return;
    for(var i=0;i<50;i++){
        var sx=((i*137+G.time*0.3)%canvas.width);
        var sy=((i*97+G.time*0.1)%canvas.height);
        ctx.fillStyle='rgba(255,255,255,'+(0.3+Math.sin(G.time*0.05+i)*0.3)+')';
        ctx.beginPath();
        ctx.arc(sx,sy,1+Math.sin(G.time*0.03+i)*0.5,0,Math.PI*2);
        ctx.fill();
    }
}

// 绘制菜单
function drawMenu(){
    drawBg();
    drawStars();

    // 标题
    ctx.save();
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    var cx=canvas.width/2;
    var cy=canvas.height*0.25;

    // 标题光晕
    ctx.shadowColor='#ff69b4';
    ctx.shadowBlur=30;
    ctx.font='bold '+(canvas.width<600?'36px':'56px')+' "Microsoft YaHei",sans-serif';
    ctx.fillStyle='#ffecf0';
    ctx.fillText('花 店 经 营',cx,cy);
    ctx.shadowBlur=0;

    ctx.font=(canvas.width<600?'14px':'18px')+' "Microsoft YaHei",sans-serif';
    ctx.fillStyle='#d4a0c0';
    ctx.fillText('种花 · 卖花 · 经营你的花坊',cx,cy+50);

    // 飘落花瓣
    for(var i=0;i<8;i++){
        var px=((i*173+G.time*0.5)%canvas.width);
        var py=((i*131+G.time*0.8)%canvas.height);
        var petals=['🌸','🌺','🌿','💮','🌷'];
        ctx.font='20px serif';
        ctx.fillText(petals[i%5],px,py);
    }

    // 开始按钮
    var btnW=Math.min(250,canvas.width*0.5);
    var btnH=55;
    var btnX=cx-btnW/2;
    var btnY=canvas.height*0.5;

    var grad=ctx.createLinearGradient(btnX,btnY,btnX+btnW,btnY+btnH);
    grad.addColorStop(0,'#ff69b4');
    grad.addColorStop(1,'#ff1493');
    ctx.fillStyle=grad;
    ctx.beginPath();
    ctx.roundRect(btnX,btnY,btnW,btnH,25);
    ctx.fill();
    ctx.shadowColor='#ff69b4';
    ctx.shadowBlur=15;
    ctx.strokeStyle='rgba(255,255,255,0.5)';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.roundRect(btnX,btnY,btnW,btnH,25);
    ctx.stroke();
    ctx.shadowBlur=0;
    ctx.fillStyle='#fff';
    ctx.font='bold '+(canvas.width<600?'18px':'22px')+' "Microsoft YaHei",sans-serif';
    ctx.fillText('开始经营',cx,btnY+btnH/2);

    // 说明按钮
    var helpY=btnY+80;
    var helpW=Math.min(200,canvas.width*0.4);
    ctx.fillStyle='rgba(255,255,255,0.1)';
    ctx.beginPath();
    ctx.roundRect(cx-helpW/2,helpY,helpW,45,20);
    ctx.fill();
    ctx.fillStyle='#d4a0c0';
    ctx.font=(canvas.width<600?'14px':'16px')+' "Microsoft YaHei",sans-serif';
    ctx.fillText('操作说明',cx,helpY+22);

    // 最高分
    if(G.highScore>0){
        ctx.fillStyle='#ffd700';
        ctx.font=(canvas.width<600?'14px':'16px')+' "Microsoft YaHei",sans-serif';
        ctx.fillText('最高分: '+G.highScore,cx,canvas.height*0.75);
    }

    // 古诗
    ctx.fillStyle='rgba(255,255,255,0.4)';
    ctx.font=(canvas.width<600?'12px':'14px')+' "Microsoft YaHei",sans-serif';
    var poem=POEMS[Math.floor(G.time*0.01)%POEMS.length];
    ctx.fillText(poem,cx,canvas.height*0.88);

    ctx.restore();
}

// 绘制操作说明弹窗
var showHelp=false;
function drawHelpPopup(){
    if(!showHelp) return;
    ctx.fillStyle='rgba(0,0,0,0.7)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    var pw=Math.min(400,canvas.width*0.85);
    var ph=380;
    var px=canvas.width/2-pw/2;
    var py=canvas.height/2-ph/2;
    ctx.fillStyle='#2d1b69';
    ctx.strokeStyle='#ff69b4';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.roundRect(px,py,pw,ph,15);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle='#ffecf0';
    ctx.textAlign='center';
    ctx.font='bold 20px "Microsoft YaHei",sans-serif';
    ctx.fillText('操作说明',canvas.width/2,py+30);
    ctx.font='14px "Microsoft YaHei",sans-serif';
    ctx.textAlign='left';
    var lines=[
        '🌱 种花：选择花卉，点击空地种植',
        '💧 浇水：点击已种植的花浇水加速',
        '✂️ 收获：花朵成熟后点击收获',
        '💰 卖花：有顾客时，选择花束出售',
        '⬆️ 升级：攒够金币升级店铺',
        '📅 30天经营挑战，目标：最高评分',
        '',
        '🖱️ 鼠标/触屏点击操作',
        '⌨️ 数字键1-5选花，Q/E切换工具'
    ];
    for(var i=0;i<lines.length;i++){
        ctx.fillText(lines[i],px+20,py+65+i*28);
    }
    ctx.textAlign='center';
    ctx.fillStyle='#ff69b4';
    ctx.fillText('点击任意处关闭',canvas.width/2,py+ph-20);
}

// 绘制地块
function drawPlots(){
    var cols=Math.min(4,Math.ceil(Math.sqrt(G.plots.length)));
    var rows=Math.ceil(G.plots.length/cols);
    var plotSize=Math.min(canvas.width*0.2,80);
    var gap=10;
    var startX=canvas.width/2-(cols*(plotSize+gap)-gap)/2;
    var startY=160;

    for(var i=0;i<G.plots.length;i++){
        var row=Math.floor(i/cols);
        var col=i%cols;
        var x=startX+col*(plotSize+gap);
        var y=startY+row*(plotSize+gap);
        var p=G.plots[i];

        // 地块背景
        ctx.fillStyle=p.flower>=0?(p.watered?'#8d6e63':'#a1887f'):'#d7ccc8';
        ctx.strokeStyle=G.selectedPlot===i?'#ff69b4':'#8d6e63';
        ctx.lineWidth=G.selectedPlot===i?3:1;
        ctx.beginPath();
        ctx.roundRect(x,y,plotSize,plotSize,8);
        ctx.fill();
        ctx.stroke();

        // 花朵
        if(p.flower>=0){
            var fl=FLOWERS[p.flower];
            var progress=p.growth/fl.growTime;
            var stage=p.stage;
            ctx.font=(plotSize*0.4)+'px serif';
            ctx.textAlign='center';
            ctx.textBaseline='middle';
            if(stage==='growing'){
                // 生长动画
                var scale=0.5+progress*0.5;
                ctx.save();
                ctx.translate(x+plotSize/2,y+plotSize/2);
                ctx.scale(scale,scale);
                ctx.fillText(fl.emoji,0,0);
                ctx.restore();
                // 进度条
                ctx.fillStyle='rgba(0,0,0,0.3)';
                ctx.fillRect(x+5,y+plotSize-8,plotSize-10,4);
                ctx.fillStyle='#4caf50';
                ctx.fillRect(x+5,y+plotSize-8,(plotSize-10)*progress,4);
                if(p.watered){
                    ctx.fillStyle='rgba(33,150,243,0.3)';
                    ctx.fillRect(x+5,y+plotSize-8,(plotSize-10)*progress,4);
                }
            } else if(stage==='ready'){
                // 成熟闪烁
                var glow=0.5+Math.sin(G.time*0.1)*0.3;
                ctx.save();
                ctx.globalAlpha=glow;
                ctx.fillStyle='#ffd700';
                ctx.beginPath();
                ctx.arc(x+plotSize/2,y+plotSize/2,plotSize*0.35,0,Math.PI*2);
                ctx.fill();
                ctx.restore();
                ctx.fillText(fl.emoji,x+plotSize/2,y+plotSize/2);
                // 收获提示
                ctx.fillStyle='#ff69b4';
                ctx.font='10px "Microsoft YaHei",sans-serif';
                ctx.fillText('收获',x+plotSize/2,y+plotSize-5);
            }
        } else {
            // 空地
            ctx.fillStyle='rgba(0,0,0,0.1)';
            ctx.font=(plotSize*0.3)+'px serif';
            ctx.textAlign='center';
            ctx.textBaseline='middle';
            ctx.fillText('+',x+plotSize/2,y+plotSize/2);
        }

        // 存储位置用于点击检测
        if(!G.plotPositions) G.plotPositions=[];
        G.plotPositions[i]={x:x,y:y,w:plotSize,h:plotSize};
    }
}

// 绘制花卉选择面板
function drawFlowerPanel(){
    var panelY=canvas.height-180;
    var panelH=170;
    ctx.fillStyle='rgba(30,15,60,0.85)';
    ctx.fillRect(0,panelY,canvas.width,panelH);
    ctx.strokeStyle='rgba(255,105,180,0.5)';
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(0,panelY);
    ctx.lineTo(canvas.width,panelY);
    ctx.stroke();

    ctx.textAlign='center';
    ctx.textBaseline='middle';

    // 工具模式
    var tools=['种植','浇水','收获'];
    var toolEmoji=['🌱','💧','✂️'];
    var toolMode=G.toolMode==='sell'?'sell':G.toolMode;
    var toolIndex=['plant','water','harvest'].indexOf(toolMode);

    for(var i=0;i<3;i++){
        var tx=canvas.width/2-100+i*80;
        var ty=panelY+15;
        var isActive=toolIndex===i;
        ctx.fillStyle=isActive?'#ff69b4':'rgba(255,255,255,0.1)';
        ctx.beginPath();
        ctx.roundRect(tx,ty,65,35,10);
        ctx.fill();
        ctx.fillStyle=isActive?'#fff':'#aaa';
        ctx.font='12px "Microsoft YaHei",sans-serif';
        ctx.fillText(toolEmoji[i]+' '+tools[i],tx+32,ty+17);
    }

    // 花卉选择
    var cardW=Math.min(canvas.width/5-8,75);
    var cardH=90;
    var startX=(canvas.width-FLOWERS.length*(cardW+6))/2;

    for(var i=0;i<FLOWERS.length;i++){
        var fl=FLOWERS[i];
        var cx=startX+i*(cardW+6);
        var cy=panelY+58;
        var isSelected=G.selectedFlower===i;
        var canAfford=G.money>=fl.seedCost;

        ctx.fillStyle=isSelected?'rgba(255,105,180,0.3)':canAfford?'rgba(255,255,255,0.08)':'rgba(100,100,100,0.2)';
        ctx.strokeStyle=isSelected?'#ff69b4':'rgba(255,255,255,0.2)';
        ctx.lineWidth=isSelected?2:1;
        ctx.beginPath();
        ctx.roundRect(cx,cy,cardW,cardH,10);
        ctx.fill();
        ctx.stroke();

        ctx.font='24px serif';
        ctx.fillText(fl.emoji,cx+cardW/2,cy+22);
        ctx.fillStyle=canAfford?'#fff':'#666';
        ctx.font='11px "Microsoft YaHei",sans-serif';
        ctx.fillText(fl.name,cx+cardW/2,cy+48);
        ctx.fillStyle=canAfford?'#ffd700':'#666';

// 游戏逻辑更新
function updateGame(dt){
    if(G.state!=='playing') return;
    G.time++;

    // 天数计时
    G.dayTimer+=dt;
    if(G.dayTimer>=G.dayDuration){
        G.dayTimer=0;
        G.day++;
        // 每天结算
        G.reputation=Math.max(0,Math.min(100,G.reputation-2));
        if(G.day>G.totalDays){
            endGame();
            return;
        }
    }

    // 顾客生成
    G.customerTimer+=dt;
    if(G.customerTimer>=G.customerInterval&&G.customerQueue.length<G.maxQueue){
        G.customerTimer=0;
        spawnCustomer();
    }

    // 花朵生长
    for(var i=0;i<G.plots.length;i++){
        var p=G.plots[i];
        if(p.flower>=0&&p.stage==='growing'){
            var speed=dt;
            if(p.watered) speed*=1.8;
            p.growth+=speed;
            if(p.growth>=FLOWERS[p.flower].growTime){
                p.stage='ready';
                p.growth=FLOWERS[p.flower].growTime;
            }
        }
    }

    // 粒子更新
    for(var i=G.particleEffects.length-1;i>=0;i--){
        var p=G.particleEffects[i];
        p.x+=p.vx;
        p.y+=p.vy;
        p.vy+=0.03;
        p.life-=p.decay;
        if(p.life<=0) G.particleEffects.splice(i,1);
    }

    // 浮动文字更新
    for(var i=G.floatingTexts.length-1;i>=0;i--){
        var ft=G.floatingTexts[i];
        ft.y+=ft.vy;
        ft.life-=0.02;
        if(ft.life<=0) G.floatingTexts.splice(i,1);
    }

    // 连击衰减
    if(G.comboTimer>0){
        G.comboTimer-=dt;
        if(G.comboTimer<=0) G.combo=0;
    }
}

// 生成顾客
function spawnCustomer(){
    var c= CUSTOMERS[Math.floor(Math.random()*CUSTOMERS.length)];
    var budgetRange=c.budget[1]-c.budget[0];
    var budget=c.budget[0]+Math.floor(Math.random()*budgetRange);
    // 根据天数调整预算
    budget=Math.floor(budget*(1+G.day*0.03));
    var newC={
        name:c.name,
        emoji:c.emoji,
        dialog:c.dialog,
        prefer:c.prefer,
        budget:[Math.floor(budget*0.7),budget],
        timer:20 // 20秒后离开
    };
    G.customerQueue.push(newC);
}

// 出售花卉
function sellToCustomer(customer,inventoryIndex){
    var item=G.inventory[inventoryIndex];
    if(!item) return;
    var fl=FLOWERS[item.flower];
    var price=fl.sellBase;

    // 偏好加成
    if(customer.prefer===item.flower) price=Math.floor(price*1.5);

    // 连击加成
    G.combo++;
    G.comboTimer=8;
    if(G.combo>1) price=Math.floor(price*(1+G.combo*0.1));

    // 评价加成
    price=Math.floor(price*(0.8+G.reputation*0.004));

    // 预算限制
    price=Math.min(price,customer.budget[1]);

    G.money+=price;
    G.score+=Math.floor(price*0.5)+G.combo*5;
    G.reputation=Math.min(100,G.reputation+3);
    G.totalSold++;
    G.totalEarned+=price;
    G.inventory.splice(inventoryIndex,1);

    // 特效
    var cx=canvas.width/2;
    var cy=120;
    addParticles(cx,cy,15,'#ffd700',4);
    addFloatingText(cx,cy,'+'+price+'文','#ffd700');
    if(G.combo>1) addFloatingText(cx,cy-25,G.combo+'连击!','#ff69b4');

    // 移除顾客
    var idx=G.customerQueue.indexOf(customer);
    if(idx>=0) G.customerQueue.splice(idx,1);
    G.currentCustomer=null;
}

// 结束游戏
function endGame(){
    G.state='gameover';
    if(G.score>G.highScore){
        G.highScore=G.score;
        localStorage.setItem('flowerShop_highScore',G.highScore.toString());
    }
}

// 种花
function plantFlower(plotIndex,flowerIndex){
    if(plotIndex<0||plotIndex>=G.plots.length) return;
    var p=G.plots[plotIndex];
    if(p.flower>=0) return;
    var fl=FLOWERS[flowerIndex];
    if(G.money<fl.seedCost) return;

    G.money-=fl.seedCost;
    p.flower=flowerIndex;
    p.growth=0;
    p.watered=false;
    p.stage='growing';
    addParticles(G.plotPositions[plotIndex].x+40,G.plotPositions[plotIndex].y+40,8,'#4caf50',2);
    G.tutorial=Math.max(G.tutorial,1);
}

// 浇水
function waterPlot(plotIndex){
    if(plotIndex<0||plotIndex>=G.plots.length) return;
    var p=G.plots[plotIndex];
    if(p.flower<0||p.stage!=='growing'||p.watered) return;
    p.watered=true;
    addParticles(G.plotPositions[plotIndex].x+40,G.plotPositions[plotIndex].y+40,10,'#2196f3',2);
}

// 收获
function harvestPlot(plotIndex){
    if(plotIndex<0||plotIndex>=G.plots.length) return;
    var p=G.plots[plotIndex];
    if(p.flower<0||p.stage!=='ready') return;

    G.inventory.push({flower:p.flower});
    p.flower=-1;
    p.growth=0;
    p.watered=false;
    p.stage='empty';
    addParticles(G.plotPositions[plotIndex].x+40,G.plotPositions[plotIndex].y+40,12,'#ff69b4',3);
    addFloatingText(G.plotPositions[plotIndex].x+40,G.plotPositions[plotIndex].y,'收获!','#4caf50');
    G.tutorial=Math.max(G.tutorial,2);
}

// 升级店铺
function upgradeShop(){
    if(G.shopLevel>=SHOP_LEVELS.length-1) return;
    var next=SHOP_LEVELS[G.shopLevel+1];
    if(G.money<next.price) return;
    G.money-=next.price;
    G.shopLevel++;
    G.score+=100;
    addFloatingText(canvas.width/2,canvas.height/2,'升级! '+next.name,'#ffd700');
    addParticles(canvas.width/2,canvas.height/2,25,'#ffd700',5);
    // 增加地块
    var oldLen=G.plots.length;
    for(var i=oldLen;i<next.slots;i++){
        G.plots.push({flower:-1,growth:0,watered:false,stage:'empty'});
    }
}

// 检测点击
function isInRect(x,y,rect){
    return x>=rect.x&&x<=rect.x+rect.w&&y>=rect.y&&y<=rect.y+rect.h;
}

function handleInput(x,y){
    // 教程
    if(G.showTutorial&&G.tutorial<4){
        G.tutorial++;
        if(G.tutorial>=4) G.showTutorial=false;
        return;
    }

    // 菜单
    if(G.state==='menu'){
        if(showHelp){
            showHelp=false;
            return;
        }
        var cx=canvas.width/2;
        var btnW=Math.min(250,canvas.width*0.5);
        var btnH=55;
        var btnX=cx-btnW/2;
        var btnY=canvas.height*0.5;
        if(isInRect(x,y,{x:btnX,y:btnY,w:btnW,h:btnH})){
            resetGame();
            return;
        }
        var helpW=Math.min(200,canvas.width*0.4);
        if(isInRect(x,y,{x:cx-helpW/2,y:btnY+80,w:helpW,h:45})){
            showHelp=true;
            return;
        }
        return;
    }

    // 游戏结束
    if(G.state==='gameover'){
        if(G.restartBtnPos&&isInRect(x,y,G.restartBtnPos)){
            resetGame();
            return;
        }
        if(G.menuBtnPos&&isInRect(x,y,G.menuBtnPos)){
            G.state='menu';
            return;
        }
        return;
    }

    // 暂停
    if(G.state==='paused'){
        if(G.resumeBtnPos&&isInRect(x,y,G.resumeBtnPos)){
            G.state='playing';
            return;
        }
        if(G.pauseMenuBtnPos&&isInRect(x,y,G.pauseMenuBtnPos)){
            G.state='menu';
            return;
        }
        return;
    }

    // 升级按钮
    if(G.shopLevel<SHOP_LEVELS.length-1){
        var nextLv=SHOP_LEVELS[G.shopLevel+1];
        if(isInRect(x,y,{x:canvas.width-110,y:33,w:100,h:18})){
            upgradeShop();
            return;
        }
    }

    // 顾客交互
    if(G.currentCustomer){
        if(G.sellBtnPos&&isInRect(x,y,G.sellBtnPos)){
            // 出售最佳匹配
            if(G.inventory.length>0){
                var bestIdx=0;
                var bestScore=-1;
                for(var i=0;i<G.inventory.length;i++){
                    var sc=FLOWERS[G.inventory[i].flower].sellBase;
                    if(G.currentCustomer.prefer===G.inventory[i].flower) sc*=2;
                    if(sc>bestScore){bestScore=sc;bestIdx=i;}
                }
                sellToCustomer(G.currentCustomer,bestIdx);
                G.tutorial=Math.max(G.tutorial,3);
            }
            return;
        }
        if(G.skipBtnPos&&isInRect(x,y,G.skipBtnPos)){
            var idx=G.customerQueue.indexOf(G.currentCustomer);
            if(idx>=0) G.customerQueue.splice(idx,1);
            G.currentCustomer=null;
            G.reputation=Math.max(0,G.reputation-3);
            return;
        }
    }

    // 点击顾客队列
    if(G.customerPositions){
        for(var i=0;i<G.customerPositions.length;i++){
            if(isInRect(x,y,G.customerPositions[i])){
                G.currentCustomer=G.customerQueue[i];
                return;
            }
        }
    }

    // 工具切换
    var panelY=canvas.height-180;
    for(var i=0;i<3;i++){
        var tx=canvas.width/2-100+i*80;
        if(isInRect(x,y,{x:tx,y:panelY+15,w:65,h:35})){
            G.toolMode=['plant','water','harvest'][i];
            return;
        }
    }

    // 花卉选择
    if(G.flowerPositions){
        for(var i=0;i<G.flowerPositions.length;i++){
            if(isInRect(x,y,G.flowerPositions[i])){
                G.selectedFlower=i;
                G.toolMode='plant';
                return;
            }
        }
    }

    // 地块操作
    if(G.plotPositions){
        for(var i=0;i<G.plotPositions.length;i++){
            if(isInRect(x,y,G.plotPositions[i])){
                var p=G.plots[i];
                if(G.toolMode==='plant'&&G.selectedFlower>=0){
                    plantFlower(i,G.selectedFlower);
                } else if(G.toolMode==='water'){
                    waterPlot(i);
                } else if(G.toolMode==='harvest'){
                    harvestPlot(i);
                } else if(p.flower>=0&&p.stage==='ready'){
                    harvestPlot(i);
                } else if(p.flower>=0&&p.stage==='growing'){
                    waterPlot(i);
                } else if(G.selectedFlower>=0){
                    plantFlower(i,G.selectedFlower);
                }
                return;
            }
        }
    }
}

// 事件监听
function getPos(e){
    var rect=canvas.getBoundingClientRect();
    if(e.touches){
        return {x:e.touches[0].clientX-rect.left,y:e.touches[0].clientY-rect.top};
    }
    return {x:e.clientX-rect.left,y:e.clientY-rect.top};
}

canvas.addEventListener('click',function(e){
    var p=getPos(e);
    handleInput(p.x,p.y);
});

// 键盘
document.addEventListener('keydown',function(e){
    if(G.state==='menu'){
        if(e.key==='Enter'||e.key===' '){
            resetGame();
            return;
        }
    }
    if(G.state==='playing'){
        if(e.key>='1'&&e.key<='5'){
            G.selectedFlower=parseInt(e.key)-1;
            G.toolMode='plant';
        }
        if(e.key==='q'||e.key==='Q'){
            var modes=['plant','water','harvest'];
            var idx=modes.indexOf(G.toolMode);
            G.toolMode=modes[(idx+2)%3];
        }
        if(e.key==='e'||e.key==='E'){
            var modes=['plant','water','harvest'];
            var idx=modes.indexOf(G.toolMode);
            G.toolMode=modes[(idx+1)%3];
        }
        if(e.key==='Escape'||e.key==='p'||e.key==='P'){
            G.state='paused';
        }
        if(e.key==='u'||e.key==='U') upgradeShop();
    }
    if(G.state==='paused'){
        if(e.key==='Escape'||e.key==='p'||e.key==='P'||e.key===' '){
            G.state='playing';
        }
    }
    if(G.state==='gameover'){
        if(e.key==='Enter'||e.key===' ') resetGame();
    }
});

// 主循环
var lastTime=performance.now();
function gameLoop(){
    var now=performance.now();
    var dt=(now-lastTime)/1000;
    lastTime=now;
    if(dt>0.1) dt=0.1;

    updateGame(dt);

    ctx.clearRect(0,0,canvas.width,canvas.height);

    if(G.state==='menu'){
        drawMenu();
        drawHelpPopup();
    } else if(G.state==='gameover'){
        drawGameOver();
    } else {
        drawBg();
        drawStatusBar();
        drawPlots();
        drawFlowerPanel();
        drawCustomer();
        drawInventory();

        // 粒子
        for(var i=0;i<G.particleEffects.length;i++){
            var p=G.particleEffects[i];
            ctx.globalAlpha=p.life;
            ctx.fillStyle=p.color;
            ctx.beginPath();
            ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
            ctx.fill();
        }
        ctx.globalAlpha=1;

        // 浮动文字
        for(var i=0;i<G.floatingTexts.length;i++){
            var ft=G.floatingTexts[i];
            ctx.globalAlpha=ft.life;
            ctx.fillStyle=ft.color;
            ctx.font='bold 16px "Microsoft YaHei",sans-serif';
            ctx.textAlign='center';
            ctx.fillText(ft.text,ft.x,ft.y);
        }
        ctx.globalAlpha=1;

        // 连击显示
        if(G.combo>1){
            ctx.fillStyle='#ff69b4';
            ctx.font='bold 24px "Microsoft YaHei",sans-serif';
            ctx.textAlign='center';
            ctx.fillText(G.combo+'连击!',canvas.width/2,canvas.height-200);
        }

        // 暂停按钮
        ctx.fillStyle='rgba(255,255,255,0.2)';
        ctx.beginPath();
        ctx.roundRect(canvas.width-45,60,35,35,8);
        ctx.fill();
        ctx.fillStyle='#fff';
        ctx.font='16px "Microsoft YaHei",sans-serif';
        ctx.textAlign='center';
        ctx.fillText('⏸',canvas.width-27,78);
        G.pauseBtnArea={x:canvas.width-45,y:60,w:35,h:35};

        if(G.state==='paused'){
            drawPauseOverlay();
        }

        drawTutorial();
    }

    requestAnimationFrame(gameLoop);
}

// 暂停按钮点击
canvas.addEventListener('click',function(e){
    var p=getPos(e);
    if(G.state==='playing'&&G.pauseBtnArea&&isInRect(p.x,p.y,G.pauseBtnArea)){
        G.state='paused';
    }
});

gameLoop();

<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
