<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>城市建造</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; overflow: hidden; }
        .game-container { width: 100%; height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 10px; }
        .resource { display: flex; align-items: center; gap: 5px; color: #fff; font-size: 14px; }
        .resource span { font-weight: bold; }
        
        .city-map { flex: 1; background: rgba(34,193,195,0.2); border-radius: 15px; position: relative; overflow: hidden; border: 2px solid rgba(255,255,255,0.2); }
        .grid-cell { position: absolute; width: 50px; height: 50px; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; }
        .grid-cell:hover { background: rgba(255,255,255,0.1); }
        .grid-cell.has-building { cursor: default; }
        
        .building { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .residential { background: linear-gradient(135deg, #4ecdc4, #44a08d); }
        .commercial { background: linear-gradient(135deg, #667eea, #764ba2); }
        .industrial { background: linear-gradient(135deg, #f093fb, #f5576c); }
        .park { background: linear-gradient(135deg, #43e97b, #38f9d7); }
        .road { background: #555; }
        
        .panel { width: 100%; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-top: 10px; }
        .build-menu { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .build-item { padding: 10px 15px; background: rgba(255,255,255,0.1); border-radius: 10px; color: #fff; cursor: pointer; transition: all 0.3s; text-align: center; }
        .build-item:hover { background: rgba(255,255,255,0.2); }
        .build-item.selected { background: #4ecdc4; }
        .build-price { font-size: 12px; opacity: 0.8; }
        
        .stats { display: flex; justify-content: space-around; margin-top: 15px; color: #fff; font-size: 14px; }
        
        .message { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); color: #fff; padding: 20px 40px; border-radius: 15px; font-size: 20px; display: none; z-index: 100; }
        .message.show { display: block; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="resource">💰 <span id="money">5000</span></div>
            <div class="resource">🏠 <span id="population">0</span></div>
            <div class="resource">💼 <span id="jobs">0</span></div>
            <div class="resource">🌳 <span id="happiness">100</span></div>
        </div>
        
        <div class="city-map" id="cityMap"></div>
        
        <div class="panel">
            <div class="build-menu">
                <div class="build-item" data-type="residential">🏠 住宅<br><span class="build-price">💰 100</span></div>
                <div class="build-item" data-type="commercial">🏪 商业<br><span class="build-price">💰 200</span></div>
                <div class="build-item" data-type="industrial">🏭 工业<br><span class="build-price">💰 300</span></div>
                <div class="build-item" data-type="park">🌳 公园<br><span class="build-price">💰 150</span></div>
                <div class="build-item" data-type="road">🛣️ 道路<br><span class="build-price">💰 50</span></div>
            </div>
            <div class="stats">
                <div>税收: <span id="taxIncome">0</span>/秒</div>
                <div>失业率: <span id="unemployment">0</span>%</div>
                <div>污染: <span id="pollution">0</span>%</div>
            </div>
        </div>
        
        <div class="message" id="message"></div>
        
        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script>
        const GRID_SIZE = 10;
        const CELL_SIZE = 50;
        
        const BUILDINGS = {
            residential: { emoji: '🏠', name: '住宅', cost: 100, population: 50, jobs: 0, income: 10, pollution: 5 },
            commercial: { emoji: '🏪', name: '商业', cost: 200, population: 0, jobs: 30, income: 50, pollution: 10 },
            industrial: { emoji: '🏭', name: '工业', cost: 300, population: 0, jobs: 50, income: 100, pollution: 30 },
            park: { emoji: '🌳', name: '公园', cost: 150, population: 0, jobs: 5, income: 0, pollution: -10 },
            road: { emoji: '🛣️', name: '道路', cost: 50, population: 0, jobs: 0, income: 0, pollution: 0 }
        };
        
        let cityGrid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(null));
        let selectedBuilding = null;
        let money = 5000;
        let population = 0;
        let jobs = 0;
        let happiness = 100;
        let pollution = 0;
        
        const cityMap = document.getElementById('cityMap');
        const messageEl = document.getElementById('message');
        
        function renderGrid() {
            cityMap.innerHTML = '';
            cityMap.appendChild(messageEl);
            
            for (let row = 0; row < GRID_SIZE; row++) {
                for (let col = 0; col < GRID_SIZE; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    cell.style.left = col * CELL_SIZE + 'px';
                    cell.style.top = row * CELL_SIZE + 'px';
                    
                    if (cityGrid[row][col]) {
                        cell.classList.add('has-building');
                        const building = BUILDINGS[cityGrid[row][col]];
                        const inner = document.createElement('div');
                        inner.className = `building ${cityGrid[row][col]}`;
                        inner.innerHTML = building.emoji;
                        cell.appendChild(inner);
                    } else {
                        cell.onclick = () => build(row, col);
                    }
                    
                    cityMap.appendChild(cell);
                }
            }
        }
        
        function selectBuilding(type) {
            selectedBuilding = type;
            document.querySelectorAll('.build-item').forEach(el => el.classList.remove('selected'));
            document.querySelector(`[data-type="${type}"]`).classList.add('selected');
        }
        
        function build(row, col) {
            if (!selectedBuilding) {
                showMessage('请先选择要建造的建筑！');
                return;
            }
            
            const building = BUILDINGS[selectedBuilding];
            if (money < building.cost) {
                showMessage('资金不足！');
                return;
            }
            
            cityGrid[row][col] = selectedBuilding;
            money -= building.cost;
            
            population += building.population;
            jobs += building.jobs;
            pollution = Math.max(0, Math.min(100, pollution + building.pollution));
            
            updateStats();
            renderGrid();
            showMessage(`建造了${building.name}！`);
        }
        
        function updateStats() {
            document.getElementById('money').textContent = money;
            document.getElementById('population').textContent = population;
            document.getElementById('jobs').textContent = jobs;
            
            const unemployed = Math.max(0, population - jobs);
            const unemploymentRate = population > 0 ? Math.round((unemployed / population) * 100) : 0;
            document.getElementById('unemployment').textContent = unemploymentRate;
            
            happiness = Math.max(0, Math.min(100, 100 - pollution - unemploymentRate));
            document.getElementById('happiness').textContent = happiness;
            
            const taxIncome = Math.floor(population * 0.5 + jobs * 2);
            document.getElementById('taxIncome').textContent = taxIncome;
            document.getElementById('pollution').textContent = pollution;
        }
        
        function showMessage(msg) {
            messageEl.textContent = msg;
            messageEl.classList.add('show');
            setTimeout(() => {
                messageEl.classList.remove('show');
            }, 2000);
        }
        
        document.querySelectorAll('.build-item').forEach(el => {
            el.addEventListener('click', () => selectBuilding(el.dataset.type));
        });
        
        setInterval(() => {
            const taxIncome = Math.floor(population * 0.5 + jobs * 2);
            money += taxIncome;
            updateStats();
        }, 1000);
        
        renderGrid();
        updateStats();
    </script>
</body>
</html>
