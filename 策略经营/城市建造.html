<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>城市建造</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; overflow: hidden; }
        .game-container { width: 100%; height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 10px; }
        .resource { display: flex; align-items: center; gap: 5px; color: #fff; font-size: 14px; }
        .resource span { font-weight: bold; }
        
        .city-map { flex: 1; background: rgba(34,193,195,0.2); border-radius: 15px; position: relative; overflow: hidden; border: 2px solid rgba(255,255,255,0.2); }
        .grid-cell { position: absolute; width: 50px; height: 50px; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; }
        .grid-cell:hover { background: rgba(255,255,255,0.1); }
        .grid-cell.has-building { cursor: default; }
        
        .building { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .residential { background: linear-gradient(135deg, #4ecdc4, #44a08d); }
        .commercial { background: linear-gradient(135deg, #667eea, #764ba2); }
        .industrial { background: linear-gradient(135deg, #f093fb, #f5576c); }
        .park { background: linear-gradient(135deg, #43e97b, #38f9d7); }
        .road { background: #555; }
        
        .panel { width: 100%; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-top: 10px; }
        .build-menu { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .build-item { padding: 10px 15px; background: rgba(255,255,255,0.1); border-radius: 10px; color: #fff; cursor: pointer; transition: all 0.3s; text-align: center; }
        .build-item:hover { background: rgba(255,255,255,0.2); }
        .build-item.selected { background: #4ecdc4; }
        .build-price { font-size: 12px; opacity: 0.8; }
        
        .stats { display: flex; justify-content: space-around; margin-top: 15px; color: #fff; font-size: 14px; }
        
        .message { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); color: #fff; padding: 20px 40px; border-radius: 15px; font-size: 20px; display: none; z-index: 100; }
        .message.show { display: block; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 10px; font-size: 14px; }
    /* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */
/* [BATCH-FIX:ad-components-css] */
.sponsor-btn{position:fixed;bottom:8px;left:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:2px 6px;border-radius:10px;font:10px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.sponsor-panel.show{display:flex}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.interstitial-ad.show{display:flex}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* [/BATCH-FIX:ad-components-css] */

/* [AD-FIX:responsive] */
@media (max-width:768px){.ad-banner-container{display:none!important}.sponsor-btn{transform:scale(.8);opacity:.6}}
/* [/AD-FIX:responsive] */
</style>
</head>
<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="resource">💰 <span id="money">5000</span></div>
            <div class="resource">🏠 <span id="population">0</span></div>
            <div class="resource">💼 <span id="jobs">0</span></div>
            <div class="resource">🌳 <span id="happiness">100</span></div>
        </div>
        
        <div class="city-map" id="cityMap"></div>
        
        <div class="panel">
            <div class="build-menu">
                <div class="build-item" data-type="residential">🏠 住宅<br><span class="build-price">💰 100</span></div>
                <div class="build-item" data-type="commercial">🏪 商业<br><span class="build-price">💰 200</span></div>
                <div class="build-item" data-type="industrial">🏭 工业<br><span class="build-price">💰 300</span></div>
                <div class="build-item" data-type="park">🌳 公园<br><span class="build-price">💰 150</span></div>
                <div class="build-item" data-type="road">🛣️ 道路<br><span class="build-price">💰 50</span></div>
            </div>
            <div class="stats">
                <div>税收: <span id="taxIncome">0</span>/秒</div>
                <div>失业率: <span id="unemployment">0</span>%</div>
                <div>污染: <span id="pollution">0</span>%</div>
            </div>
        </div>
        
        <div class="message" id="message"></div>
        
        
    </div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script>
        const GRID_SIZE = 10;
        const CELL_SIZE = 50;
        
        const BUILDINGS = {
            residential: { emoji: '🏠', name: '住宅', cost: 100, population: 50, jobs: 0, income: 10, pollution: 5 },
            commercial: { emoji: '🏪', name: '商业', cost: 200, population: 0, jobs: 30, income: 50, pollution: 10 },
            industrial: { emoji: '🏭', name: '工业', cost: 300, population: 0, jobs: 50, income: 100, pollution: 30 },
            park: { emoji: '🌳', name: '公园', cost: 150, population: 0, jobs: 5, income: 0, pollution: -10 },
            road: { emoji: '🛣️', name: '道路', cost: 50, population: 0, jobs: 0, income: 0, pollution: 0 }
        };
        
        let cityGrid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(null));
        let selectedBuilding = null;
        let money = 5000;
        let population = 0;
        let jobs = 0;
        let happiness = 100;
        let pollution = 0;
        
        const cityMap = document.getElementById('cityMap');
        const messageEl = document.getElementById('message');
        
        function renderGrid() {
            cityMap.innerHTML = '';
            cityMap.appendChild(messageEl);
            
            for (let row = 0; row < GRID_SIZE; row++) {
                for (let col = 0; col < GRID_SIZE; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    cell.style.left = col * CELL_SIZE + 'px';
                    cell.style.top = row * CELL_SIZE + 'px';
                    
                    if (cityGrid[row][col]) {
                        cell.classList.add('has-building');
                        const building = BUILDINGS[cityGrid[row][col]];
                        const inner = document.createElement('div');
                        inner.className = `building ${cityGrid[row][col]}`;
                        inner.innerHTML = building.emoji;
                        cell.appendChild(inner);
                    } else {
                        cell.onclick = () => build(row, col);
                    }
                    
                    cityMap.appendChild(cell);
                }
            }
        }
        
        function selectBuilding(type) {
            selectedBuilding = type;
            document.querySelectorAll('.build-item').forEach(el => el.classList.remove('selected'));
            document.querySelector(`[data-type="${type}"]`).classList.add('selected');
        }
        
        function build(row, col) {
            if (!selectedBuilding) {
                showMessage('请先选择要建造的建筑！');
                return;
            }
            
            const building = BUILDINGS[selectedBuilding];
            if (money < building.cost) {
                showMessage('资金不足！');
                return;
            }
            
            cityGrid[row][col] = selectedBuilding;
            money -= building.cost;
            
            population += building.population;
            jobs += building.jobs;
            pollution = Math.max(0, Math.min(100, pollution + building.pollution));
            
            updateStats();
            renderGrid();
            showMessage(`建造了${building.name}！`);
        }
        
        function updateStats() {
            document.getElementById('money').textContent = money;
            document.getElementById('population').textContent = population;
            document.getElementById('jobs').textContent = jobs;
            
            const unemployed = Math.max(0, population - jobs);
            const unemploymentRate = population > 0 ? Math.round((unemployed / population) * 100) : 0;
            document.getElementById('unemployment').textContent = unemploymentRate;
            
            happiness = Math.max(0, Math.min(100, 100 - pollution - unemploymentRate));
            document.getElementById('happiness').textContent = happiness;
            
            const taxIncome = Math.floor(population * 0.5 + jobs * 2);
            document.getElementById('taxIncome').textContent = taxIncome;
            document.getElementById('pollution').textContent = pollution;
        }
        
        function showMessage(msg) {
            messageEl.textContent = msg;
            messageEl.classList.add('show');
            setTimeout(() => {
                messageEl.classList.remove('show');
            }, 2000);
        }
        
        document.querySelectorAll('.build-item').forEach(el => {
            el.addEventListener('click', () => selectBuilding(el.dataset.type));
        });
        
        setInterval(() => {
            const taxIncome = Math.floor(population * 0.5 + jobs * 2);
            money += taxIncome;
            updateStats();
        }, 1000);
        
        renderGrid();
        updateStats();
    </script>
<!-- [BATCH-FIX:responsive-js] -->
<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>
<!-- [/BATCH-FIX:responsive-js] -->
<!-- [BATCH-FIX:touch-support] -->
<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>
<!-- [/BATCH-FIX:touch-support] -->

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
