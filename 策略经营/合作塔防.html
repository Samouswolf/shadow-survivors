<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>合作塔防</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; color: #fff; }
        
        .game-container { width: 100%; flex: 1; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: #ffd700; }
        .stats { display: flex; gap: 20px; }
        .stat { display: flex; align-items: center; gap: 5px; font-size: 14px; }
        
        .map-area { flex: 1; background: rgba(0,0,0,0.3); border-radius: 15px; position: relative; margin-bottom: 15px; overflow: hidden; }
        .path { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(90deg, rgba(100,100,100,0.3) 50%, transparent 50%); }
        .enemy { position: absolute; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; transition: left 0.5s; }
        .tower { position: absolute; width: 50px; height: 50px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 28px; cursor: pointer; }
        
        .build-area { display: flex; gap: 10px; overflow-x: auto; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 15px; margin-bottom: 15px; }
        .tower-card { padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; cursor: pointer; min-width: 100px; text-align: center; }
        .tower-card.selected { border: 2px solid #ffd700; }
        
        .team-area { display: flex; gap: 10px; justify-content: center; }
        .team-btn { padding: 12px 20px; border: none; border-radius: 15px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .team-btn.attack { background: linear-gradient(135deg, #ff6b6b, #ffa502); color: #fff; }
        .team-btn.defend { background: linear-gradient(135deg, #48c78e, #4ecdc4); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }
    /* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */
/* [BATCH-FIX:ad-components-css] */
.sponsor-btn{position:fixed;top:44px;right:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:3px 9px;border-radius:10px;font:11px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.sponsor-panel.show{display:flex}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.interstitial-ad.show{display:flex}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* [/BATCH-FIX:ad-components-css] */
</style>
</head>
<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="title">🏰 合作塔防</div>
            <div class="stats">
                <div class="stat">❤️ <span id="hp">100</span></div>
                <div class="stat">💰 <span id="gold">200</span></div>
                <div class="stat">👥 <span id="wave">第1波</span></div>
            </div>
        </div>
        
        <div class="map-area" id="mapArea">
            <div class="path"></div>
        </div>
        
        <div class="build-area">
            <div class="tower-card" onclick="selectTower('archer')">🏹 弓箭塔</div>
            <div class="tower-card" onclick="selectTower('cannon')">💣 炮塔</div>
            <div class="tower-card" onclick="selectTower('magic')">🔮 魔法塔</div>
        </div>
        
        <div class="team-area">
            <button class="team-btn attack" onclick="teamAttack()">⚔️ 全体攻击</button>
            <button class="team-btn defend" onclick="teamDefend()">🛡️ 全体防御</button>
        </div>
    </div>
    
    <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <script>
        const GAME_NAME = '合作塔防';
        GameCore.init({ highScore: GAME_NAME });
        
        const towers = {
            archer: { emoji: '🏹', damage: 10, cost: 50, color: '#4ecdc4' },
            cannon: { emoji: '💣', damage: 30, cost: 100, color: '#ff6b6b' },
            magic: { emoji: '🔮', damage: 20, cost: 75, color: '#f093fb' }
        };
        
        let hp = 100;
        let gold = 200;
        let wave = 1;
        let selectedTower = null;
        let placedTowers = [];
        let enemies = [];
        let gameLoop = null;
        
        function initGame() {
            hp = 100;
            gold = 200;
            wave = 1;
            placedTowers = [];
            enemies = [];
            
            updateUI();
            startWave();
        }
        
        function updateUI() {
            document.getElementById('hp').textContent = hp;
            document.getElementById('gold').textContent = gold;
            document.getElementById('wave').textContent = `第${wave}波`;
        }
        
        function selectTower(type) {
            selectedTower = type;
            
            document.querySelectorAll('.tower-card').forEach(card => {
                card.classList.remove('selected');
            });
            
            event.currentTarget.classList.add('selected');
            
            GameCore.hints.show(`选择了 ${towers[type].emoji} ${towers[type].damage}伤害`);
        }
        
        function placeTower(x, y) {
            if (!selectedTower) {
                GameCore.hints.show('请先选择要建造的塔！');
                return;
            }
            
            const tower = towers[selectedTower];
            
            if (gold < tower.cost) {
                GameCore.hints.show('金币不足！');
                return;
            }
            
            gold -= tower.cost;
            
            const newTower = {
                id: Date.now(),
                type: selectedTower,
                x: x,
                y: y,
                damage: tower.damage
            };
            
            placedTowers.push(newTower);
            renderTower(newTower);
            updateUI();
        }
        
        function renderTower(tower) {
            const el = document.createElement('div');
            el.className = 'tower';
            el.style.left = tower.x + 'px';
            el.style.top = tower.y + 'px';
            el.style.background = towers[tower.type].color;
            el.textContent = towers[tower.type].emoji;
            el.id = 'tower-' + tower.id;
            
            document.getElementById('mapArea').appendChild(el);
        }
        
        function startWave() {
            const enemyCount = wave * 3;
            
            for (let i = 0; i < enemyCount; i++) {
                setTimeout(() => {
                    spawnEnemy();
                }, i * 1000);
            }
            
            GameCore.hints.show(`⚔️ 第${wave}波敌人来袭！`);
        }
        
        function spawnEnemy() {
            const enemy = {
                id: Date.now() + Math.random(),
                hp: 20 + wave * 5,
                x: -50,
                y: 100
            };
            
            enemies.push(enemy);
            renderEnemy(enemy);
        }
        
        function renderEnemy(enemy) {
            const el = document.createElement('div');
            el.className = 'enemy';
            el.style.left = enemy.x + 'px';
            el.style.top = enemy.y + 'px';
            el.style.background = '#ff6b6b';
            el.textContent = '👹';
            el.id = 'enemy-' + enemy.id;
            
            document.getElementById('mapArea').appendChild(el);
        }
        
        function gameUpdate() {
            enemies.forEach((enemy, index) => {
                enemy.x += 1;
                
                const el = document.getElementById('enemy-' + enemy.id);
                if (el) {
                    el.style.left = enemy.x + 'px';
                }
                
                if (enemy.x > window.innerWidth) {
                    hp -= 10;
                    updateUI();
                    
                    if (el) el.remove();
                    enemies.splice(index, 1);
                    
                    if (hp <= 0) {
                        gameOver();
                    }
                }
                
                placedTowers.forEach(tower => {
                    if (Math.abs(enemy.x - tower.x) < 60 && Math.abs(enemy.y - tower.y) < 30) {
                        enemy.hp -= tower.damage;
                        
                        if (enemy.hp <= 0) {
                            gold += 10;
                            updateUI();
                            
                            if (el) el.remove();
                            enemies.splice(index, 1);
                        }
                    }
                });
            });
            
            if (enemies.length === 0) {
                wave++;
                GameCore.hints.show(`🎉 第${wave - 1}波完成！准备第${wave}波`);
                setTimeout(() => {
                    startWave();
                }, 3000);
            }
        }
        
        function teamAttack() {
            enemies.forEach(enemy => {
                enemy.hp -= 15;
                
                if (enemy.hp <= 0) {
                    gold += 10;
                    updateUI();
                    
                    const el = document.getElementById('enemy-' + enemy.id);
                    if (el) el.remove();
                }
            });
            
            enemies = enemies.filter(e => e.hp > 0);
            GameCore.hints.show('⚔️ 全体攻击！对所有敌人造成15点伤害');
        }
        
        function teamDefend() {
            hp = Math.min(100, hp + 20);
            updateUI();
            GameCore.hints.show('🛡️ 全体防御！恢复20点生命值');
        }
        
        function gameOver() {
            clearInterval(gameLoop);
            GameCore.hints.show('💀 游戏结束！');
            GameCore.highScore.set(GAME_NAME, wave);
        }
        
        document.getElementById('mapArea').addEventListener('click', (e) => {
            const rect = e.currentTarget.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            placeTower(x, y);
        });
        
        gameLoop = setInterval(gameUpdate, 50);
        initGame();
        GameCore.touch.enableAllButtons();
    </script>
<!-- [BATCH-FIX:responsive-js] -->
<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>
<!-- [/BATCH-FIX:responsive-js] -->
<!-- [BATCH-FIX:touch-support] -->
<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>
<!-- [/BATCH-FIX:touch-support] -->

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
