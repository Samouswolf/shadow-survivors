<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>城堡守卫</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #2d1b4e 0%, #4a2c7a 50%, #6b3fa0 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; color: #fff; overflow: hidden; }
        
        .game-container { width: 100%; flex: 1; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: #fff; }
        .stats { display: flex; gap: 20px; font-size: 14px; }
        
        .canvas-area { flex: 1; background: rgba(0,0,0,0.5); border-radius: 15px; overflow: hidden; position: relative; }
        canvas { width: 100%; height: 100%; }
        
        .controls { display: flex; gap: 10px; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; }
        
        .control-btn { padding: 10px 20px; border: none; border-radius: 10px; font-size: 14px; cursor: pointer; background: rgba(255,255,255,0.2); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }
    /* [BATCH-FIX:ad-components-css] */
.sponsor-btn{position:fixed;bottom:8px;left:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:2px 6px;border-radius:10px;font:10px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.sponsor-panel.show{display:flex}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.interstitial-ad.show{display:flex}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* [/BATCH-FIX:ad-components-css] */

/* [AD-FIX:responsive] */
@media (max-width:768px){.ad-banner-container{display:none!important}.sponsor-btn{transform:scale(.8);opacity:.6}}
/* [/AD-FIX:responsive] */
</style>
</head>
<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="title">🏰 城堡守卫</div>
            <div class="stats">
                <span>💰 金币: <span id="gold">150</span></span>
                <span>🏰 城堡: <span id="castleHp">100</span></span>
                <span>⚔️ 敌人: <span id="enemies">0</span></span>
            </div>
        </div>
        
        <div class="canvas-area">
            <canvas id="gameCanvas"></canvas>
        </div>
        
        <div class="controls">
            <button class="control-btn" onclick="buildWall()">🧱 城墙 (30)</button>
            <button class="control-btn" onclick="buildArcher()">🏹 弓箭手 (50)</button>
            <button class="control-btn" onclick="buildCannon()">💣 大炮 (100)</button>
            <button class="control-btn" onclick="upgradeCastle()">⬆️ 升级城堡 (80)</button>
        </div>
    </div>
    
    

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="../game_core.js"></script>
    <script>
        const GAME_NAME = '城堡守卫';
        GameCore.init({ highScore: GAME_NAME });
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let gameRunning = true;
        let gold = 150;
        let castleHp = 100;
        let walls = [];
        let archers = [];
        let cannons = [];
        let enemies = [];
        let projectiles = [];
        
        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        
        function initGame() {
            resizeCanvas();
            gameRunning = true;
            gold = 150;
            castleHp = 100;
            walls = [];
            archers = [];
            cannons = [];
            enemies = [];
            projectiles = [];
            updateUI();
            gameLoop();
            
            spawnEnemy();
        }
        
        function updateUI() {
            document.getElementById('gold').textContent = gold;
            document.getElementById('castleHp').textContent = castleHp;
            document.getElementById('enemies').textContent = enemies.length;
            
            GameCore.highScore.set(GAME_NAME, gold);
        }
        
        function spawnEnemy() {
            if (!gameRunning) return;
            
            enemies.push({
                x: canvas.width,
                y: canvas.height / 2 + (Math.random() - 0.5) * 100,
                hp: 30 + Math.floor(gold / 50) * 10,
                speed: 1 + Math.floor(gold / 100) * 0.3,
                type: Math.random() > 0.7 ? 'tank' : 'normal'
            });
            
            setTimeout(spawnEnemy, 2000 - Math.min(gold / 50, 1500));
        }
        
        function buildWall() {
            if (gold >= 30) {
                gold -= 30;
                walls.push({
                    x: canvas.width / 2 + (Math.random() - 0.5) * 200,
                    y: canvas.height / 2 + (Math.random() - 0.5) * 100,
                    hp: 100
                });
                updateUI();
                GameCore.hints.show('🧱 建造城墙！');
            } else {
                GameCore.hints.show('金币不足！');
            }
        }
        
        function buildArcher() {
            if (gold >= 50) {
                gold -= 50;
                archers.push({
                    x: canvas.width * 0.3,
                    y: canvas.height / 2 + (archers.length - 1) * 50,
                    range: 150,
                    damage: 15,
                    lastShot: 0
                });
                updateUI();
                GameCore.hints.show('🏹 招募弓箭手！');
            } else {
                GameCore.hints.show('金币不足！');
            }
        }
        
        function buildCannon() {
            if (gold >= 100) {
                gold -= 100;
                cannons.push({
                    x: canvas.width * 0.2,
                    y: canvas.height / 2 + (cannons.length - 1) * 80,
                    range: 200,
                    damage: 50,
                    lastShot: 0
                });
                updateUI();
                GameCore.hints.show('💣 建造大炮！');
            } else {
                GameCore.hints.show('金币不足！');
            }
        }
        
        function upgradeCastle() {
            if (gold >= 80) {
                gold -= 80;
                castleHp += 50;
                updateUI();
                GameCore.hints.show('🏰 城堡升级！');
            } else {
                GameCore.hints.show('金币不足！');
            }
        }
        
        function update() {
            if (!gameRunning) return;
            
            enemies.forEach(enemy => {
                enemy.x -= enemy.speed;
                
                if (enemy.x < 50) {
                    castleHp -= enemy.type === 'tank' ? 20 : 10;
                    updateUI();
                    enemy.x = canvas.width + 100;
                    
                    if (castleHp <= 0) {
                        gameOver();
                    }
                }
            });
            
            enemies = enemies.filter(e => e.x < canvas.width + 50);
            
            walls.forEach(wall => {
                enemies.forEach(enemy => {
                    const dx = enemy.x - wall.x;
                    const dy = enemy.y - wall.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < 30) {
                        wall.hp -= 1;
                        enemy.speed *= 0.9;
                        
                        if (wall.hp <= 0) {
                            wall.x = -100;
                            gold += 15;
                            updateUI();
                        }
                    }
                });
            });
            
            walls = walls.filter(w => w.x >= 0);
            
            archers.forEach(archer => {
                if (Date.now() - archer.lastShot > 500) {
                    let closestEnemy = null;
                    let closestDist = Infinity;
                    
                    enemies.forEach(enemy => {
                        const dx = enemy.x - archer.x;
                        const dy = enemy.y - archer.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        
                        if (dist < archer.range && dist < closestDist) {
                            closestDist = dist;
                            closestEnemy = enemy;
                        }
                    });
                    
                    if (closestEnemy) {
                        projectiles.push({
                            x: archer.x,
                            y: archer.y,
                            target: closestEnemy,
                            damage: archer.damage,
                            speed: 10,
                            color: '#4ecdc4',
                            type: 'arrow'
                        });
                        archer.lastShot = Date.now();
                    }
                }
            });
            
            cannons.forEach(cannon => {
                if (Date.now() - cannon.lastShot > 2000) {
                    let closestEnemy = null;
                    let closestDist = Infinity;
                    
                    enemies.forEach(enemy => {
                        const dx = enemy.x - cannon.x;
                        const dy = enemy.y - cannon.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        
                        if (dist < cannon.range && dist < closestDist) {
                            closestDist = dist;
                            closestEnemy = enemy;
                        }
                    });
                    
                    if (closestEnemy) {
                        projectiles.push({
                            x: cannon.x,
                            y: cannon.y,
                            target: closestEnemy,
                            damage: cannon.damage,
                            speed: 5,
                            color: '#ff6b6b',
                            type: 'cannon'
                        });
                        cannon.lastShot = Date.now();
                    }
                }
            });
            
            projectiles.forEach(proj => {
                const dx = proj.target.x - proj.x;
                const dy = proj.target.y - proj.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < 15) {
                    proj.target.hp -= proj.damage;
                    
                    if (proj.target.hp <= 0) {
                        gold += proj.target.type === 'tank' ? 30 : 15;
                        updateUI();
                        proj.target.x = canvas.width + 100;
                    }
                    
                    proj.x = -100;
                } else {
                    proj.x += (dx / dist) * proj.speed;
                    proj.y += (dy / dist) * proj.speed;
                }
            });
            
            projectiles = projectiles.filter(p => p.x >= 0);
        }
        
        function render() {
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#4a7c23';
            ctx.fillRect(0, canvas.height - 60, canvas.width, 60);
            
            ctx.fillStyle = '#8b4513';
            ctx.fillRect(20, canvas.height / 2 - 50, 40, 100);
            
            ctx.fillStyle = '#ffd700';
            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2 - 60);
            ctx.lineTo(60, canvas.height / 2 - 60);
            ctx.lineTo(30, canvas.height / 2 - 80);
            ctx.closePath();
            ctx.fill();
            
            ctx.fillStyle = '#fff';
            ctx.font = '14px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(castleHp, 30, canvas.height / 2 + 10);
            
            walls.forEach(wall => {
                ctx.fillStyle = '#666';
                ctx.fillRect(wall.x - 15, wall.y - 15, 30, 30);
                
                ctx.fillStyle = '#48c78e';
                ctx.fillRect(wall.x - 12, wall.y - 12, 24 * (wall.hp / 100), 6);
            });
            
            archers.forEach(archer => {
                ctx.fillStyle = '#4ecdc4';
                ctx.beginPath();
                ctx.arc(archer.x, archer.y, 20, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#fff';
                ctx.font = '16px Arial';
                ctx.fillText('🏹', archer.x, archer.y + 6);
            });
            
            cannons.forEach(cannon => {
                ctx.fillStyle = '#ff6b6b';
                ctx.fillRect(cannon.x - 25, cannon.y - 15, 50, 30);
                
                ctx.fillStyle = '#444';
                ctx.fillRect(cannon.x + 20, cannon.y - 10, 15, 20);
                
                ctx.fillStyle = '#fff';
                ctx.font = '16px Arial';
                ctx.fillText('💣', cannon.x, cannon.y + 6);
            });
            
            enemies.forEach(enemy => {
                ctx.fillStyle = enemy.type === 'tank' ? '#ff8c42' : '#ff6b6b';
                ctx.beginPath();
                ctx.arc(enemy.x, enemy.y, enemy.type === 'tank' ? 20 : 15, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#fff';
                ctx.font = '10px Arial';
                ctx.fillText(enemy.hp, enemy.x, enemy.y + 4);
            });
            
            projectiles.forEach(proj => {
                ctx.fillStyle = proj.color;
                ctx.beginPath();
                ctx.arc(proj.x, proj.y, proj.type === 'cannon' ? 8 : 4, 0, Math.PI * 2);
                ctx.fill();
            });
        }
        
        function gameLoop() {
            update();
            render();
            
            if (gameRunning) {
                requestAnimationFrame(gameLoop);
            }
        }
        
        function gameOver() {
            gameRunning = false;
            GameCore.hints.show('💀 城堡被摧毁！');
            
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#fff';
            ctx.font = '30px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('游戏结束', canvas.width / 2, canvas.height / 2);
        }
        
        initGame();
        GameCore.touch.enableAllButtons();
    </script>
<!-- [BATCH-FIX:touch-support] -->
<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>
<!-- [/BATCH-FIX:touch-support] -->

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
</body>
