<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>卡牌塔防</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); min-height: 100vh; overflow: hidden; }
        .game-container { width: 100%; height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 10px; }
        .stat { display: flex; flex-direction: column; align-items: center; color: #fff; }
        .stat-label { font-size: 10px; opacity: 0.7; }
        .stat-value { font-size: 18px; font-weight: bold; }
        .stat-value.life { color: #ef4444; }
        .stat-value.gold { color: #fbbf24; }
        .stat-value.wave { color: #4ade80; }
        
        .game-area { flex: 1; display: flex; flex-direction: column; gap: 8px; }
        .row { flex: 1; display: flex; gap: 8px; }
        .cell { flex: 1; background: rgba(74,85,104,0.3); border-radius: 8px; position: relative; overflow: hidden; }
        .cell.path { background: rgba(148,163,184,0.2); }
        .cell.tower { background: rgba(59,130,246,0.3); border: 2px solid #3b82f6; }
        .cell.enemy { background: rgba(239,68,68,0.2); }
        
        .tower { position: absolute; inset: 5px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .tower-emoji { font-size: 24px; }
        .tower-level { font-size: 8px; color: #fff; }
        
        .enemy { position: absolute; width: 70%; height: 70%; background: rgba(239,68,68,0.8); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        
        .hand { padding: 10px; background: rgba(255,255,255,0.1); border-radius: 15px; display: flex; gap: 8px; overflow-x: auto; }
        .hand-card { min-width: 60px; height: 80px; background: linear-gradient(135deg, #4a5568, #2d3748); border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; border: 2px solid transparent; flex-shrink: 0; }
        .hand-card.selected { border-color: #4ecdc4; box-shadow: 0 0 10px rgba(78, 205, 196, 0.5); }
        .hand-card-icon { font-size: 24px; }
        .hand-card-name { font-size: 10px; color: #fff; text-align: center; }
        .hand-card-cost { font-size: 10px; color: #3b82f6; position: absolute; top: 5px; left: 5px; }
        
        .actions { display: flex; gap: 10px; margin-top: 10px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 15px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-wave { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; }
        .btn-draw { background: linear-gradient(135deg, #4ecdc4, #44a08d); color: #fff; }
        .btn-sell { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
        
        .message { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); color: #fff; padding: 20px 40px; border-radius: 15px; font-size: 20px; display: none; z-index: 100; }
        .message.show { display: block; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 10px; font-size: 14px; }
    /* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */

.sponsor-btn{position:fixed;bottom:8px;left:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:2px 6px;border-radius:10px;font:10px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}

.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}

.interstitial-ad.show{display:flex}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}

<body>
    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">生命</div>
                <div class="stat-value life" id="life">20</div>
            </div>
            <div class="stat">
                <div class="stat-label">金币</div>
                <div class="stat-value gold" id="gold">100</div>
            </div>
            <div class="stat">
                <div class="stat-label">波次</div>
                <div class="stat-value wave" id="wave">1</div>
            </div>
        </div>
        
        <div class="game-area" id="gameArea"></div>
        
        <div class="hand" id="hand"></div>
        
        <div class="actions">
            <button class="btn btn-wave" id="btnWave">🚀 开始波次</button>
            <button class="btn btn-draw" id="btnDraw">🎴 抽卡 (20💰)</button>
            <button class="btn btn-sell" id="btnSell">💰 出售选中</button>
        </div>
        
        <div class="message" id="message"></div>
        
        
    </div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script>
        const TOWER_CARDS = [
            { id: 'archer', emoji: '🏹', name: '箭塔', cost: 30, attack: 10, range: 2, speed: 1000, color: '#3b82f6' },
            { id: 'cannon', emoji: '💣', name: '炮塔', cost: 50, attack: 30, range: 1, speed: 2000, color: '#ef4444' },
            { id: 'magic', emoji: '🔮', name: '魔法塔', cost: 40, attack: 15, range: 2, speed: 1500, color: '#a855f7' },
            { id: 'ice', emoji: '❄️', name: '冰霜塔', cost: 45, attack: 8, range: 1.5, speed: 800, slow: true, color: '#06b6d4' },
            { id: 'lightning', emoji: '⚡', name: '雷电塔', cost: 60, attack: 40, range: 2.5, speed: 2500, color: '#eab308' },
            { id: 'fire', emoji: '🔥', name: '火焰塔', cost: 55, attack: 20, range: 1.5, speed: 1200, burn: true, color: '#f97316' }
        ];
        
        const ENEMY_TYPES = [
            { id: 'slime', emoji: '🟢', hp: 50, speed: 2, reward: 10, color: '#22c55e' },
            { id: 'goblin', emoji: '👺', hp: 80, speed: 3, reward: 15, color: '#16a34a' },
            { id: 'orc', emoji: '👹', hp: 150, speed: 1.5, reward: 25, color: '#15803d' },
            { id: 'demon', emoji: '😈', hp: 250, speed: 2, reward: 40, color: '#b91c1c' },
            { id: 'dragon', emoji: '🐉', hp: 500, speed: 1, reward: 100, color: '#991b1b' }
        ];
        
        const ROWS = 5;
        const COLS = 7;
        
        let grid = [];
        let path = [];
        let hand = [];
        let enemies = [];
        let towers = [];
        
        let life = 20;
        let gold = 100;
        let wave = 1;
        let selectedCard = null;
        let selectedTower = null;
        let isWaveActive = false;
        
        function initGrid() {
            grid = [];
            path = [];
            
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    let isPath = false;
                    if (r === 0 && c < 3) isPath = true;
                    else if (r === 0 && c === 3) isPath = true;
                    else if (r === 1 && c === 3) isPath = true;
                    else if (r === 2 && c === 3) isPath = true;
                    else if (r === 2 && c === 4) isPath = true;
                    else if (r === 2 && c === 5) isPath = true;
                    else if (r === 2 && c === 6) isPath = true;
                    else if (r === 3 && c === 3) isPath = true;
                    else if (r === 4 && c === 3) isPath = true;
                    else if (r === 4 && c < 3) isPath = true;
                    
                    grid.push({ row: r, col: c, isPath });
                    if (isPath) path.push({ row: r, col: c });
                }
            }
        }
        
        function loadData() {
            const saved = GameCore.storage.get('card_tower_defense', null);
            if (saved) {
                life = saved.life;
                gold = saved.gold;
                wave = saved.wave;
            } else {
                life = 20;
                gold = 100;
                wave = 1;
            }
            initGrid();
            drawInitialCards();
            updateUI();
        }
        
        function saveData() {
            GameCore.storage.set('card_tower_defense', { life, gold, wave });
        }
        
        function updateUI() {
            document.getElementById('life').textContent = life;
            document.getElementById('gold').textContent = gold;
            document.getElementById('wave').textContent = wave;
            renderGameArea();
            renderHand();
        }
        
        function renderGameArea() {
            const area = document.getElementById('gameArea');
            area.innerHTML = '';
            
            for (let r = 0; r < ROWS; r++) {
                const row = document.createElement('div');
                row.className = 'row';
                
                for (let c = 0; c < COLS; c++) {
                    const cell = document.createElement('div');
                    const gridCell = grid[r * COLS + c];
                    cell.className = `cell ${gridCell.isPath ? 'path' : ''}`;
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    
                    const tower = towers.find(t => t.row === r && t.col === c);
                    if (tower) {
                        cell.classList.add('tower');
                        cell.innerHTML = `
                            <div class="tower">
                                <div class="tower-emoji">${tower.card.emoji}</div>
                                <div class="tower-level">Lv.${tower.level}</div>
                            </div>
                        `;
                        cell.onclick = () => selectTower(tower);
                    } else {
                        cell.onclick = () => placeTower(r, c);
                    }
                    
                    row.appendChild(cell);
                }
                
                area.appendChild(row);
            }
            
            renderEnemies();
        }
        
        function renderEnemies() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => {
                const enemyEl = cell.querySelector('.enemy');
                if (enemyEl) enemyEl.remove();
            });
            
            enemies.forEach(enemy => {
                const cell = document.querySelector(`.cell[data-row="${Math.floor(enemy.y)}"][data-col="${Math.floor(enemy.x)}"]`);
                if (cell) {
                    const el = document.createElement('div');
                    el.className = 'enemy';
                    el.textContent = enemy.type.emoji;
                    el.style.background = enemy.type.color;
                    cell.appendChild(el);
                }
            });
        }
        
        function renderHand() {
            const handEl = document.getElementById('hand');
            handEl.innerHTML = '';
            
            hand.forEach((card, index) => {
                const el = document.createElement('div');
                el.className = `hand-card ${selectedCard === index ? 'selected' : ''}`;
                el.innerHTML = `
                    <div class="hand-card-cost">💰${card.cost}</div>
                    <div class="hand-card-icon">${card.emoji}</div>
                    <div class="hand-card-name">${card.name}</div>
                `;
                el.onclick = () => selectCard(index);
                handEl.appendChild(el);
            });
        }
        
        function drawInitialCards() {
            hand = [];
            for (let i = 0; i < 5; i++) {
                drawCard();
            }
        }
        
        function drawCard() {
            const randomCard = { ...TOWER_CARDS[Math.floor(Math.random() * TOWER_CARDS.length)] };
            hand.push(randomCard);
        }
        
        function selectCard(index) {
            selectedCard = selectedCard === index ? null : index;
            selectedTower = null;
            renderHand();
        }
        
        function placeTower(row, col) {
            if (selectedCard === null) {
                showMessage('请先选择一张卡牌！');
                return;
            }
            
            const card = hand[selectedCard];
            if (card.cost > gold) {
                showMessage('金币不足！');
                return;
            }
            
            const gridCell = grid[row * COLS + col];
            if (gridCell.isPath) {
                showMessage('不能放在路径上！');
                return;
            }
            
            const existingTower = towers.find(t => t.row === row && t.col === col);
            if (existingTower) {
                showMessage('该位置已有塔！');
                return;
            }
            
            gold -= card.cost;
            towers.push({ row, col, card, level: 1, lastAttack: 0 });
            hand.splice(selectedCard, 1);
            selectedCard = null;
            
            updateUI();
            saveData();
        }
        
        function selectTower(tower) {
            selectedTower = selectedTower === tower ? null : tower;
            selectedCard = null;
            renderGameArea();
            renderHand();
        }
        
        function sellTower() {
            if (!selectedTower) {
                showMessage('请先选中一座塔！');
                return;
            }
            
            const refund = Math.floor(selectedTower.card.cost * 0.6);
            gold += refund;
            towers = towers.filter(t => t !== selectedTower);
            selectedTower = null;
            
            showMessage(`💰 获得 ${refund} 金币`);
            updateUI();
            saveData();
        }
        
        function startWave() {
            if (isWaveActive) return;
            isWaveActive = true;
            
            const enemyCount = 5 + wave * 2;
            let spawned = 0;
            
            const spawnInterval = setInterval(() => {
                if (spawned >= enemyCount) {
                    clearInterval(spawnInterval);
                    return;
                }
                
                const typeIndex = Math.min(Math.floor(Math.random() * (1 + wave)), ENEMY_TYPES.length - 1);
                enemies.push({
                    type: ENEMY_TYPES[typeIndex],
                    x: 0,
                    y: 0,
                    hp: ENEMY_TYPES[typeIndex].hp * (1 + wave * 0.1),
                    maxHp: ENEMY_TYPES[typeIndex].hp * (1 + wave * 0.1),
                    pathIndex: 0
                });
                
                spawned++;
            }, 1000);
            
            gameLoop();
        }
        
        function gameLoop() {
            if (!isWaveActive && enemies.length === 0) return;
            
            enemies.forEach(enemy => {
                if (enemy.pathIndex >= path.length) {
                    life--;
                    enemies = enemies.filter(e => e !== enemy);
                    if (life <= 0) {
                        showMessage('游戏结束！');
                        setTimeout(() => resetGame(), 2000);
                    }
                    return;
                }
                
                const target = path[enemy.pathIndex];
                const dx = target.col - enemy.x;
                const dy = target.row - enemy.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < 0.1) {
                    enemy.pathIndex++;
                } else {
                    enemy.x += (dx / dist) * enemy.type.speed * 0.01;
                    enemy.y += (dy / dist) * enemy.type.speed * 0.01;
                }
            });
            
            towers.forEach(tower => {
                const now = Date.now();
                if (now - tower.lastAttack < tower.card.speed) return;
                
                let target = null;
                let minDist = tower.card.range + 1;
                
                enemies.forEach(enemy => {
                    const dist = Math.sqrt(Math.pow(enemy.x - tower.col, 2) + Math.pow(enemy.y - tower.row, 2));
                    if (dist <= tower.card.range && dist < minDist) {
                        minDist = dist;
                        target = enemy;
                    }
                });
                
                if (target) {
                    tower.lastAttack = now;
                    target.hp -= tower.card.attack * tower.level;
                    
                    if (target.hp <= 0) {
                        gold += target.type.reward;
                        enemies = enemies.filter(e => e !== target);
                    }
                }
            });
            
            renderEnemies();
            
            if (enemies.length === 0 && !isWaveActive) {
                wave++;
                showMessage(`🎉 第 ${wave - 1} 波完成！`);
                drawCard();
                updateUI();
                saveData();
            }
            
            if (enemies.length > 0 || isWaveActive) {
                requestAnimationFrame(gameLoop);
            }
        }
        
        function resetGame() {
            life = 20;
            gold = 100;
            wave = 1;
            enemies = [];
            towers = [];
            isWaveActive = false;
            selectedCard = null;
            selectedTower = null;
            initGrid();
            drawInitialCards();
            updateUI();
            saveData();
        }
        
        function showMessage(msg) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 2000);
        }
        
        document.getElementById('btnWave').addEventListener('click', () => {
            startWave();
            isWaveActive = false;
        });
        document.getElementById('btnDraw').addEventListener('click', () => {
            if (gold < 20) {
                showMessage('金币不足！需要20金币');
                return;
            }
            gold -= 20;
            drawCard();
            updateUI();
            saveData();
        });
        document.getElementById('btnSell').addEventListener('click', sellTower);
        
        GameCore.init({ highScore: 'card_tower_defense' });
        loadData();
    </script>

<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>

<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>

<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
