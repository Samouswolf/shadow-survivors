<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>卡牌收集</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #2d1f47 100%); min-height: 100vh; }
        .game-container { padding: 15px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .coin-display { display: flex; align-items: center; gap: 5px; color: #ffd700; font-size: 18px; font-weight: bold; }
        .collection-count { color: #4ecdc4; font-size: 16px; }
        
        .banner { background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 15px; padding: 20px; text-align: center; color: #fff; margin-bottom: 15px; }
        .banner h1 { font-size: 24px; margin-bottom: 10px; }
        .banner p { opacity: 0.9; }
        
        .actions { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn { flex: 1; padding: 15px; border: none; border-radius: 15px; font-size: 16px; font-weight: bold; cursor: pointer; transition: transform 0.2s; }
        .btn-pack { background: linear-gradient(135deg, #ff6b6b, #ee5a5a); color: #fff; }
        .btn-collection { background: linear-gradient(135deg, #4ecdc4, #44a08d); color: #fff; }
        .btn:active { transform: scale(0.95); }
        
        .pack-opening { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; flex-direction: column; align-items: center; justify-content: center; }
        .pack-opening.show { display: flex; }
        .pack-card { width: 100px; height: 140px; background: linear-gradient(135deg, #4a5568, #2d3748); border-radius: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 10px; animation: cardReveal 0.5s ease; }
        .pack-card.legendary { border: 3px solid #ffd700; }
        .pack-card.epic { border: 3px solid #a855f7; }
        .pack-card.rare { border: 3px solid #3b82f6; }
        .pack-card.common { border: 3px solid #9ca3af; }
        .pack-icon { font-size: 36px; }
        .pack-name { font-size: 12px; color: #fff; margin-top: 5px; text-align: center; }
        .pack-rarity { font-size: 10px; margin-top: 3px; }
        
        .collection-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 10px; }
        .card-item { aspect-ratio: 2/3; background: rgba(74,85,104,0.5); border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px solid transparent; }
        .card-item.collected.legendary { border-color: #ffd700; background: rgba(255,215,0,0.1); }
        .card-item.collected.epic { border-color: #a855f7; background: rgba(168,85,247,0.1); }
        .card-item.collected.rare { border-color: #3b82f6; background: rgba(59,130,246,0.1); }
        .card-item.collected.common { border-color: #9ca3af; background: rgba(156,163,175,0.1); }
        .card-item.not-collected { opacity: 0.3; filter: grayscale(1); }
        .card-emoji { font-size: 24px; }
        
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
        .modal.show { display: flex; }
        .modal-content { background: linear-gradient(135deg, #2d3748, #1a202c); border-radius: 20px; padding: 30px; text-align: center; max-width: 320px; color: #fff; }
        .modal-emoji { font-size: 64px; margin-bottom: 15px; }
        .modal-name { font-size: 24px; margin-bottom: 10px; }
        .modal-rarity { font-size: 14px; opacity: 0.8; margin-bottom: 15px; }
        .modal-desc { font-size: 14px; opacity: 0.9; line-height: 1.5; margin-bottom: 20px; }
        .modal-close { padding: 10px 30px; background: #4ecdc4; border: none; border-radius: 20px; color: #fff; font-weight: bold; cursor: pointer; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }
        
        @keyframes cardReveal {
            from { transform: translateY(-50px) scale(0); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }
    /* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}

/* [BATCH-FIX:ad-components-css] */
.sponsor-btn{position:fixed;bottom:8px;left:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:2px 6px;border-radius:10px;font:10px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.sponsor-panel.show{display:flex}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.interstitial-ad.show{display:flex}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}

/* [AD-FIX:responsive] */
@media (max-width:768px){.ad-banner-container{display:none!important}.sponsor-btn{transform:scale(.8);opacity:.6}}

</style>

<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="coin-display">💰 <span id="coins">100</span></div>
            <div class="collection-count">📚 <span id="collected">0</span>/<span id="total">30</span></div>
        </div>
        
        <div class="banner">

        <div class="pack-opening" id="packOpening">
            <h2 style="color: #ffd700; margin-bottom: 20px; font-size: 24px;">开卡包！</h2>
            <div id="packCards"></div>
            <button class="btn btn-collection" id="btnClosePack" style="margin-top: 20px;">继续</button>
        </div>
        
        <div class="collection-grid" id="collectionGrid"></div>
        
        <div class="modal" id="cardModal">
            <div class="modal-content">
                <div class="modal-emoji" id="modalEmoji"></div>
                <div class="modal-name" id="modalName"></div>
                <div class="modal-rarity" id="modalRarity"></div>

    </div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;

    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script>
        const ALL_CARDS = [
            { id: 'c1', emoji: '⚔️', name: '战士', rarity: 'common', desc: '勇敢的战士，手持利剑冲锋陷阵' },
            { id: 'c2', emoji: '🏹', name: '弓箭手', rarity: 'common', desc: '远程攻击专家，百步穿杨' },
            { id: 'c3', emoji: '🛡️', name: '守卫', rarity: 'common', desc: '身披重甲，守护同伴' },
            { id: 'c4', emoji: '💀', name: '骷髅兵', rarity: 'common', desc: '不死军团的士兵' },
            { id: 'c5', emoji: '🦇', name: '蝙蝠', rarity: 'common', desc: '夜晚的飞行生物' },
            { id: 'c6', emoji: '🐺', name: '狼人', rarity: 'common', desc: '月圆之夜化身狼形' },
            { id: 'c7', emoji: '🧟', name: '僵尸', rarity: 'common', desc: '不死生物，缓慢但坚韧' },
            { id: 'c8', emoji: '👻', name: '幽灵', rarity: 'rare', desc: '漂浮的灵魂，穿透一切' },
            { id: 'c9', emoji: '🧙', name: '法师', rarity: 'rare', desc: '精通元素魔法的智者' },
            { id: 'c10', emoji: '✨', name: '精灵', rarity: 'rare', desc: '森林的守护者，敏捷灵动' },
            { id: 'c11', emoji: '🧝', name: '矮人', rarity: 'rare', desc: '擅长锻造的地底种族' },
            { id: 'c12', emoji: '🦅', name: '猎鹰', rarity: 'rare', desc: '高空侦察的猛禽' },
            { id: 'c13', emoji: '🐲', name: '幼龙', rarity: 'rare', desc: '龙族幼崽，已能喷火' },
            { id: 'c14', emoji: '🧜', name: '人鱼', rarity: 'epic', desc: '海洋的精灵，歌声动人' },
            { id: 'c15', emoji: '👹', name: '巨魔', rarity: 'epic', desc: '巨大的怪物，力大无穷' },
            { id: 'c16', emoji: '🔮', name: '巫师', rarity: 'epic', desc: '掌握黑暗魔法的神秘人物' },
            { id: 'c17', emoji: '🦄', name: '独角兽', rarity: 'epic', desc: '纯洁的圣兽，带来好运' },
            { id: 'c18', emoji: '🦁', name: '狮子', rarity: 'epic', desc: '百兽之王，威严无比' },
            { id: 'c19', emoji: '🐯', name: '白虎', rarity: 'epic', desc: '传说中的神兽，速度极快' },
            { id: 'c20', emoji: '🐉', name: '巨龙', rarity: 'legendary', desc: '远古巨龙，喷火吐息' },
            { id: 'c21', emoji: '👑', name: '国王', rarity: 'legendary', desc: '统治王国的君主' },
            { id: 'c22', emoji: '💎', name: '宝石精灵', rarity: 'legendary', desc: '由魔法宝石诞生的生命' },
            { id: 'c23', emoji: '🌟', name: '星灵', rarity: 'legendary', desc: '来自星空的神秘存在' },
            { id: 'c24', emoji: '🔥', name: '炎魔', rarity: 'legendary', desc: '地狱之火的化身' },
            { id: 'c25', emoji: '❄️', name: '冰霜巨人', rarity: 'legendary', desc: '极北之地的守护者' },
            { id: 'c26', emoji: '⚡', name: '雷神', rarity: 'legendary', desc: '掌控雷电的神明' },
            { id: 'c27', emoji: '🌊', name: '海神', rarity: 'legendary', desc: '海洋的统治者' },
            { id: 'c28', emoji: '🌳', name: '世界树', rarity: 'legendary', desc: '连接三界的神圣之树' },
            { id: 'c29', emoji: '☠️', name: '死神', rarity: 'legendary', desc: '收割灵魂的存在' },
            { id: 'c30', emoji: '👼', name: '天使', rarity: 'legendary', desc: '天堂的使者，圣洁光辉' }
        ];
        
        const RARITY_COLORS = {
            common: '#9ca3af',
            rare: '#3b82f6',
            epic: '#a855f7',
            legendary: '#ffd700'
        };
        
        const RARITY_NAMES = {
            common: '普通',
            rare: '稀有',
            epic: '史诗',
            legendary: '传说'
        };
        
        let coins = 100;
        let collectedCards = [];
        
        function loadData() {
            coins = GameCore.storage.get('card_collection_coins', 100);
            collectedCards = GameCore.storage.get('card_collection_collected', []);
            updateUI();
        }
        
        function saveData() {
            GameCore.storage.set('card_collection_coins', coins);
            GameCore.storage.set('card_collection_collected', collectedCards);
        }
        
        function updateUI() {
            document.getElementById('coins').textContent = coins;
            document.getElementById('collected').textContent = collectedCards.length;
            document.getElementById('total').textContent = ALL_CARDS.length;
            renderCollection();
        }
        
        function renderCollection() {
            const grid = document.getElementById('collectionGrid');
            grid.innerHTML = '';
            
            ALL_CARDS.forEach(card => {
                const isCollected = collectedCards.includes(card.id);
                const el = document.createElement('div');
                el.className = `card-item ${isCollected ? 'collected ' + card.rarity : 'not-collected'}`;
                el.innerHTML = `<div class="card-emoji">${isCollected ? card.emoji : '❓'}</div>`;
                
                if (isCollected) {
                    el.onclick = () => showCardDetail(card);
                }
                
                grid.appendChild(el);
            });
        }
        
        function openPack() {
            if (coins < 50) {
                GameCore.hints.show('金币不足！需要50金币开卡包');
                return;
            }
            
            coins -= 50;
            saveData();
            updateUI();
            
            const packOpening = document.getElementById('packOpening');
            const packCards = document.getElementById('packCards');
            packOpening.classList.add('show');
            packCards.innerHTML = '';
            
            const newCards = [];
            for (let i = 0; i < 5; i++) {
                const card = drawCard();
                newCards.push(card);
            }
            
            newCards.forEach((card, index) => {
                setTimeout(() => {
                    const el = document.createElement('div');
                    el.className = `pack-card ${card.rarity}`;
                    el.innerHTML = `
                        <div class="pack-icon">${card.emoji}</div>
                        <div class="pack-name">${card.name}</div>
                        <div class="pack-rarity" style="color: ${RARITY_COLORS[card.rarity]}">${RARITY_NAMES[card.rarity]}</div>
                    `;
                    packCards.appendChild(el);
                    
                    if (!collectedCards.includes(card.id)) {
                        collectedCards.push(card.id);
                        saveData();
                        GameCore.hints.show(`🎉 获得新卡牌：${card.name}！`, 2000);
                    }
                }, index * 300);
            });
        }
        
        function drawCard() {
            const rand = Math.random();
            let rarity;
            
            if (rand < 0.05) rarity = 'legendary';
            else if (rand < 0.15) rarity = 'epic';
            else if (rand < 0.35) rarity = 'rare';
            else rarity = 'common';
            
            const pool = ALL_CARDS.filter(c => c.rarity === rarity);
            return pool[Math.floor(Math.random() * pool.length)];
        }
        
        function showCardDetail(card) {
            document.getElementById('modalEmoji').textContent = card.emoji;
            document.getElementById('modalName').textContent = card.name;
            document.getElementById('modalRarity').textContent = RARITY_NAMES[card.rarity];
            document.getElementById('modalRarity').style.color = RARITY_COLORS[card.rarity];
            document.getElementById('modalDesc').textContent = card.desc;
            document.getElementById('cardModal').classList.add('show');
        }
        
        document.getElementById('btnOpenPack').addEventListener('click', openPack);
        document.getElementById('btnClosePack').addEventListener('click', () => {
            document.getElementById('packOpening').classList.remove('show');
            updateUI();
        });
        document.getElementById('btnCloseModal').addEventListener('click', () => {
            document.getElementById('cardModal').classList.remove('show');
        });
        
        GameCore.init({ highScore: 'card_collection' });
        loadData();
    </script>

<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>
<!-- [/BATCH-FIX:responsive-js] -->
<!-- [BATCH-FIX:touch-support] -->
<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>
<!-- [/BATCH-FIX:touch-support] -->

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
