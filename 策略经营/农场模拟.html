<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>农场模拟</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #2d5a27 0%, #56ab2f 50%, #a8e063 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; color: #fff; }
        
        .game-container { width: 100%; flex: 1; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.2); border-radius: 15px; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: #fff; }
        .stats { display: flex; gap: 20px; font-size: 14px; }
        
        .farm-grid { flex: 1; display: flex; justify-content: center; align-items: center; margin-bottom: 15px; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; }
        .plot { width: 70px; height: 70px; border-radius: 10px; background: linear-gradient(135deg, #8b4513, #a0522d); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 32px; }
        .plot.planted { background: linear-gradient(135deg, #4a7c23, #6b8e23); }
        
        .shop-area { display: flex; gap: 10px; flex-wrap: wrap; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; }
        .shop-btn { padding: 10px 15px; border: none; border-radius: 10px; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .shop-btn.selected { border: 2px solid #ffd700; }
        
        .shop-btn.wheat { background: linear-gradient(135deg, #daa520, #ffd700); color: #fff; }
        .shop-btn.carrot { background: linear-gradient(135deg, #ff6b35, #ff8c42); color: #fff; }
        .shop-btn.corn { background: linear-gradient(135deg, #8b8b00, #b8b800); color: #fff; }
        .shop-btn.potato { background: linear-gradient(135deg, #a0522d, #cd853f); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="title">🌾 农场模拟</div>
            <div class="stats">
                <span>💰 金币: <span id="money">500</span></span>
                <span>🌱 收成: <span id="harvest">0</span></span>
            </div>
        </div>
        
        <div class="farm-grid">
            <div class="grid" id="farmGrid"></div>
        </div>
        
        <div class="shop-area">
            <button class="shop-btn wheat" onclick="selectSeed('wheat')">🌾 小麦 (20)</button>
            <button class="shop-btn carrot" onclick="selectSeed('carrot')">🥕 胡萝卜 (30)</button>
            <button class="shop-btn corn" onclick="selectSeed('corn')">🌽 玉米 (40)</button>
            <button class="shop-btn potato" onclick="selectSeed('potato')">🥔 土豆 (25)</button>
        </div>
    </div>
    
    <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>

    <script src="game_core.js"></script>
    <script>
        const GAME_NAME = '农场模拟';
        GameCore.init({ highScore: GAME_NAME });
        
        const seeds = {
            wheat: { emoji: '🌾', cost: 20, reward: 50, growTime: 3000, name: '小麦' },
            carrot: { emoji: '🥕', cost: 30, reward: 70, growTime: 4000, name: '胡萝卜' },
            corn: { emoji: '🌽', cost: 40, reward: 90, growTime: 5000, name: '玉米' },
            potato: { emoji: '🥔', cost: 25, reward: 60, growTime: 3500, name: '土豆' }
        };
        
        const gridSize = 4;
        let plots = [];
        let money = 500;
        let harvest = 0;
        let selectedSeed = null;
        
        function initGame() {
            plots = [];
            for (let i = 0; i < gridSize * gridSize; i++) {
                plots.push({ type: null, growing: false, timer: null });
            }
            
            renderGrid();
            updateUI();
        }
        
        function updateUI() {
            document.getElementById('money').textContent = money;
            document.getElementById('harvest').textContent = harvest;
            
            GameCore.highScore.set(GAME_NAME, harvest);
        }
        
        function renderGrid() {
            const gridEl = document.getElementById('farmGrid');
            gridEl.innerHTML = '';
            
            plots.forEach((plot, index) => {
                const el = document.createElement('div');
                el.className = 'plot';
                
                if (plot.type) {
                    el.classList.add('planted');
                    el.textContent = seeds[plot.type].emoji;
                }
                
                el.onclick = () => handlePlotClick(index);
                gridEl.appendChild(el);
            });
        }
        
        function selectSeed(type) {
            selectedSeed = type;
            
            document.querySelectorAll('.shop-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
            
            event.currentTarget.classList.add('selected');
            
            GameCore.hints.show(`选择了 ${seeds[type].name}`);
        }
        
        function handlePlotClick(index) {
            const plot = plots[index];
            
            if (plot.type) {
                money += seeds[plot.type].reward;
                harvest++;
                plots[index] = { type: null, growing: false, timer: null };
                
                GameCore.hints.show(`收获了 ${seeds[plot.type].name}，获得 ${seeds[plot.type].reward} 金币！`);
            } else {
                if (!selectedSeed) {
                    GameCore.hints.show('请先选择种子！');
                    return;
                }
                
                const seed = seeds[selectedSeed];
                
                if (money >= seed.cost) {
                    money -= seed.cost;
                    plots[index] = { type: selectedSeed, growing: true, timer: null };
                    
                    GameCore.hints.show(`种下了 ${seed.name}，等待生长...`);
                } else {
                    GameCore.hints.show('金币不足！');
                    return;
                }
            }
            
            renderGrid();
            updateUI();
        }
        
        initGame();
        GameCore.touch.enableAllButtons();
    </script>
</body>
</html>
