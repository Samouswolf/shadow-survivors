<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>夜市摆摊</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a12;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden}
canvas{image-rendering:auto;border:2px solid #ff6b35;cursor:pointer;max-width:100%;height:auto}

/* [BUGFIX startgame-v2] 开始按钮强制可见+广告关闭可点击 */
.sponsor-close,#sponsorClose,.skip-btn,#skipInterstitial{pointer-events:auto!important;}
</style>

<style>
/* 游戏工坊广告系统 */
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);height:90px;max-height:90px;overflow:hidden;contain:layout style paint;pointer-events:none!important}.ad-banner-container,.ad-banner-container *{pointer-events:none!important}.ad-banner-container iframe{max-height:90px;pointer-events:none!important}
.ad-banner-container iframe{max-width:100%}
.ad-label{position:absolute;top:1px;right:6px;font:9px "Microsoft YaHei",sans-serif;color:rgba(255,255,255,.35)}
.sponsor-btn{position:fixed;bottom:8px;left:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:2px 6px;border-radius:10px;font:10px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .qr-row{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.sponsor-panel .qr-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px;text-align:center;min-width:140px}
.sponsor-panel .qr-card .qr-icon{font-size:48px;margin-bottom:6px}
.sponsor-panel .qr-card .qr-label{color:#ccc;font:13px "Microsoft YaHei",sans-serif}
.sponsor-panel .qr-card .qr-hint{color:#888;font:11px "Microsoft YaHei",sans-serif;margin-top:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.interstitial-ad .ad-content{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;text-align:center;min-width:280px;max-width:400px}
.interstitial-ad .ad-content p{color:#aaa;font:14px "Microsoft YaHei",sans-serif;margin-bottom:12px}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}

/* [AD-FIX:responsive] */
@media (max-width:768px){.ad-banner-container{display:none!important}.sponsor-btn{transform:scale(.8);opacity:.6}}
/* [/AD-FIX:responsive] */
</style>
</head>
<body>

    <button id="start-game-btn" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:20px 40px;font-size:20px;background:#f5576c;color:white;border:none;border-radius:12px;cursor:pointer;z-index:999;font-weight:bold;">开始游戏</button>


    <div class="game-guide" style="margin-bottom:15px;padding:10px;background:#fff3f3;border-radius:8px;border:1px solid #ffcccc;">
        <div style="font-weight:bold;color:#f5576c;margin-bottom:5px;">🎮 操作说明</div>
        <div style="font-size:14px;color:#666;">点击/触摸进行游戏，支持键盘操作</div>
    </div>

<canvas id="gameCanvas"></canvas>
<div id="startScreen" style="position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#0a0a2e,#1a0a2e,#2a0a1e);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000">
  <h1 style="font-size:48px;color:#ff6b35;margin-bottom:10px;text-shadow:0 0 30px rgba(255,107,53,0.5)">🏮 夜市摆摊</h1>
  <p style="color:#aaa;margin-bottom:30px;font-size:16px">经营摊位 · 讨价还价 · 应对随机事件</p>
  <button id="startBtn" style="padding:15px 60px;font-size:20px;background:linear-gradient(135deg,#ff6b35,#ff9a56);color:#fff;border:none;border-radius:12px;cursor:pointer;box-shadow:0 4px 15px rgba(255,107,53,0.4)">开始摆摊</button>
  <p style="color:#666;margin-top:20px;font-size:12px">鼠标/触屏点击操作</p>
</div>
<button id="pauseBtn" style="position:fixed;top:10px;right:10px;width:44px;height:44px;font-size:20px;background:rgba(0,0,0,0.5);color:#fff;border:1px solid rgba(255,255,255,0.3);border-radius:8px;z-index:100;display:none">⏸</button>
<div id="pauseScreen" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);flex-direction:column;align-items:center;justify-content:center;z-index:999">
  <h2 style="color:#fff;margin-bottom:30px">游戏暂停</h2>
  <button id="resumeBtn" style="padding:12px 40px;font-size:18px;background:#ff6b35;color:#fff;border:none;border-radius:8px;margin-bottom:15px">继续摆摊</button>
  <button id="restartBtn" style="padding:12px 40px;font-size:18px;background:#666;color:#fff;border:none;border-radius:8px">重新开始</button>
</div>
<script>
/* [STORAGE-POLYFILL v1] */
;(function(){
  var G = (typeof window !== 'undefined') ? window : (typeof globalThis !== 'undefined' ? globalThis : this);
  // 浏览器已有 Storage 构造函数，需确保其带 load/save/remove 静态方法
  var S = G.Storage;
  var needAttach = (typeof S === 'undefined' || typeof S.load !== 'function' || typeof S.save !== 'function');
  if (!needAttach) return;
  if (typeof S === 'undefined') { S = function(){}; G.Storage = S; }
  function parseSafe(s, d){
    if (s === null || s === undefined) return d;
    try { return JSON.parse(s); } catch(e) { try { return s; } catch(e2){ return d; } }
  }
  S.load = function(k, d){ try { return parseSafe(localStorage.getItem(k), d); } catch(e){ return d; } };
  S.save = function(k, v){ try { localStorage.setItem(k, typeof v==='string'?v:JSON.stringify(v)); } catch(e){} };
  S.remove = function(k){ try { localStorage.removeItem(k); } catch(e){} };
})();

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = 800, H = 600;
canvas.width = W;
canvas.height = H;

// 响应式canvas缩放
function resizeCanvas() {
    const maxW = window.innerWidth - 20;
    const maxH = window.innerHeight - 20;
    const scale = Math.min(maxW / W, maxH / H, 1);
    canvas.style.width = (W * scale) + 'px';
    canvas.style.height = (H * scale) + 'px';
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// roundRect polyfill
if (!ctx.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        if (typeof r === 'number') r = [r, r, r, r];
        this.moveTo(x + r[0], y);
        this.lineTo(x + w - r[1], y);
        this.arcTo(x + w, y, x + w, y + r[1], r[1]);
        this.lineTo(x + w, y + h - r[2]);
        this.arcTo(x + w, y + h, x + w - r[2], y + h, r[2]);
        this.lineTo(x + r[3], y + h);
        this.arcTo(x, y + h, x, y + h - r[3], r[3]);
        this.lineTo(x, y + r[0]);
        this.arcTo(x, y, x + r[0], y, r[0]);
        this.closePath();
    };
}

// Audio context
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playTone(freq, duration, type = 'sine', vol = 0.2) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}
function sfxCoin() { playTone(1200, 0.1, 'square', 0.15); setTimeout(() => playTone(1600, 0.15, 'square', 0.15), 80); }
function sfxBargain() { playTone(400, 0.1); setTimeout(() => playTone(500, 0.1), 100); }
function sfxFail() { playTone(200, 0.3, 'sawtooth', 0.2); }
function sfxEvent() { playTone(600, 0.1); setTimeout(() => playTone(800, 0.15), 100); setTimeout(() => playTone(600, 0.1), 200); }

// 商品数据
const PRODUCTS = [
    { id: 'stinky_tofu', name: '臭豆腐', emoji: '🧈', cost: 8, basePrice: 15, desc: '闻着臭吃着香', color: '#8B7355' },
    { id: 'skewer', name: '烤串', emoji: '🍢', cost: 5, basePrice: 10, desc: '孜然飘香', color: '#CD853F' },
    { id: 'bubble_tea', name: '奶茶', emoji: '🧋', cost: 6, basePrice: 12, desc: '甜蜜滋味', color: '#DEB887' },
    { id: 'tanghulu', name: '糖葫芦', emoji: '🍡', cost: 4, basePrice: 8, desc: '酸甜可口', color: '#FF6347' },
    { id: 'fried_noodle', name: '炒面', emoji: '🍜', cost: 7, basePrice: 14, desc: '锅气十足', color: '#DAA520' }
];

// 顾客类型
const CUSTOMER_TYPES = [
    { name: '学生', emoji: '👨‍🎓', budget: 0.7, patience: 1.2, tip: 0.8 },
    { name: '上班族', emoji: '👨‍💼', budget: 1.0, patience: 0.8, tip: 1.0 },
    { name: '情侣', emoji: '💑', budget: 1.3, patience: 1.0, tip: 1.2 },
    { name: '大妈', emoji: '👩', budget: 0.6, patience: 1.5, tip: 0.7 },
    { name: '游客', emoji: '🧳', budget: 1.5, patience: 0.6, tip: 1.5 },
    { name: '老饕', emoji: '👨‍🍳', budget: 1.2, patience: 1.0, tip: 1.3 },
    { name: '小朋友', emoji: '👦', budget: 0.5, patience: 0.5, tip: 0.6 }
];

// 随机事件
const EVENTS = [
    { name: '城管巡查', emoji: '👮', desc: '城管来了！被迫收摊', effect: 'fine', value: 30, duration: 5000 },
    { name: '网红探店', emoji: '📹', desc: '网红来直播，生意火爆！', effect: 'boost', value: 2.0, duration: 8000 },
    { name: '下雨了', emoji: '🌧️', desc: '下雨天顾客减少', effect: 'slow', value: 0.3, duration: 6000 },
    { name: '美食节', emoji: '🎪', desc: '美食节开幕，人气爆棚！', effect: 'boost', value: 1.5, duration: 10000 },
    { name: '停电了', emoji: '💡', desc: '停电！无法营业', effect: 'stop', value: 0, duration: 4000 },
    { name: '食材涨价', emoji: '📈', desc: '食材成本上升', effect: 'cost_up', value: 1.5, duration: 8000 },
    { name: '明星光临', emoji: '⭐', desc: '明星来吃，口碑大涨！', effect: 'fame', value: 50, duration: 0 },
    { name: '竞争对手', emoji: '🏪', desc: '旁边开了同款摊位', effect: 'compete', value: 0.7, duration: 10000 }
];

// 讨价还价对话
const BARGAIN_PHRASES = {
    customer: [
        '老板，便宜点呗~',
        '这么贵啊，能少点不？',
        '隔壁才卖XX呢...',
        '我常来的，给个优惠呗',
        '就剩这么点了，便宜卖吧',
        '学生价有吗？',
        '买两个能打折不？'
    ],
    player_accept: ['行吧，就这个价', '好好好，卖你了', '算我今天亏本', '下次再来啊'],
    player_reject: ['不好意思，最低价了', '这个真的不赚钱', '进货就这个价了', '童叟无欺啊'],
    customer_leave: ['太贵了，算了', '我去别家看看', '那下次吧', '真的不能再少吗...'],
    customer_buy: ['成交！', '谢谢老板', '味道不错！', '下次还来']
};

// 游戏状态
let G = {
    state: 'menu', // menu, playing, paused, gameover
    money: 100,
    day: 1,
    time: 0, // 0-100, 代表营业时间
    dayDuration: 60000, // 一天60秒
    dayTimer: 0,
    reputation: 50, // 声望 0-100
    totalEarned: 0,
    totalCustomers: 0,
    customersServed: 0,
    bestDay: 0,
    inventory: [3, 3, 3, 3, 3], // 每种商品库存
    inventoryMax: 10,
    selectedProduct: -1,
    customer: null, // 当前顾客
    customerTimer: 0,
    customerInterval: 3000, // 顾客到来间隔
    lastCustomerTime: 0,
    event: null,
    eventTimer: 0,
    eventCooldown: 0,
    bargainState: null, // 讨价还价状态
    bargainRound: 0,
    currentPrice: 0,
    particles: [],
    floatingTexts: [],
    stars: [], // 背景星星
    lanterns: [], // 灯笼
    bestScore: parseInt(localStorage.getItem('night_market_best') || '0'),
    combo: 0,
    comboTimer: 0,
    costMultiplier: 1,
    priceMultiplier: 1,
    customerMultiplier: 1,
    fameBonus: 0,
    isPaused: false
};

// 初始化星星
function initStars() {
    G.stars = [];
    for (let i = 0; i < 50; i++) {
        G.stars.push({
            x: Math.random() * W,
            y: Math.random() * H * 0.4,
            size: Math.random() * 2 + 0.5,
            twinkle: Math.random() * Math.PI * 2,
            speed: Math.random() * 0.02 + 0.01
        });
    }
}

// 初始化灯笼
function initLanterns() {
    G.lanterns = [];
    for (let i = 0; i < 8; i++) {
        G.lanterns.push({
            x: 50 + i * 100,
            y: 30 + Math.random() * 20,
            swing: Math.random() * Math.PI * 2,
            speed: Math.random() * 0.03 + 0.02,
            size: 20 + Math.random() * 10
        });
    }
}

// 粒子系统
function addParticle(x, y, color, count = 5) {
    for (let i = 0; i < count; i++) {
        G.particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 4,
            vy: (Math.random() - 0.5) * 4 - 2,
            life: 1,
            decay: Math.random() * 0.03 + 0.02,
            size: Math.random() * 4 + 2,
            color
        });
    }
}

function addFloatingText(x, y, text, color = '#FFD700') {
    G.floatingTexts.push({
        x, y, text, color,
        vy: -1.5,
        life: 1,
        decay: 0.02
    });
}

// 生成顾客
function spawnCustomer() {
    const type = CUSTOMER_TYPES[Math.floor(Math.random() * CUSTOMER_TYPES.length)];
    const productIdx = Math.floor(Math.random() * PRODUCTS.length);
    const product = PRODUCTS[productIdx];

    // 检查库存
    if (G.inventory[productIdx] <= 0) {
        // 尝试其他商品
        let found = false;
        for (let i = 0; i < PRODUCTS.length; i++) {
            if (G.inventory[i] > 0) {
                found = true;
                break;
            }
        }
        if (!found) return; // 全部售罄
    }

    G.customer = {
        type,
        wantedProduct: productIdx,
        maxPrice: Math.floor(product.basePrice * type.budget * G.priceMultiplier),
        patience: type.patience * 100,
        currentPatience: type.patience * 100,
        x: W + 50,
        targetX: W / 2,
        y: 280,
        state: 'entering', // entering, waiting, bargaining, leaving, buying
        animTimer: 0
    };
    G.customerTimer = 0;
}

// 讨价还价开始
function startBargain() {
    if (!G.customer || G.customer.state !== 'waiting') return;

    const product = PRODUCTS[G.customer.wantedProduct];
    const basePrice = Math.floor(product.basePrice * G.priceMultiplier);
    const customerPhrase = BARGAIN_PHRASES.customer[Math.floor(Math.random() * BARGAIN_PHRASES.customer.length)];

    G.bargainState = {
        basePrice,
        currentOffer: Math.floor(basePrice * (0.5 + Math.random() * 0.3)),
        round: 0,
        maxRounds: 3,
        customerPhrase,
        playerOptions: [
            { text: '接受报价', action: 'accept' },
            { text: '还价 ' + Math.floor(basePrice * 0.9) + '元', action: 'counter', price: Math.floor(basePrice * 0.9) },
            { text: '坚持原价 ' + basePrice + '元', action: 'insist', price: basePrice }
        ]
    };
    G.customer.state = 'bargaining';
    sfxBargain();
}

// 处理讨价还价
function handleBargain(action, price) {
    if (!G.bargainState || !G.customer) return;

    const basePrice = G.bargainState.basePrice;

    if (action === 'accept') {
        // 接受顾客报价
        completeSale(G.bargainState.currentOffer);
        addFloatingText(G.customer.x, G.customer.y - 30, BARGAIN_PHRASES.customer_buy[Math.floor(Math.random() * BARGAIN_PHRASES.customer_buy.length)], '#4CAF50');
    } else if (action === 'counter') {
        G.bargainState.round++;
        if (G.bargainState.round >= G.bargainState.maxRounds) {
            // 顾客失去耐心
            if (Math.random() < 0.5) {
                completeSale(G.bargainState.currentOffer);
                addFloatingText(G.customer.x, G.customer.y - 30, '好吧好吧...', '#FFA500');
            } else {
                G.customer.state = 'leaving';
                addFloatingText(G.customer.x, G.customer.y - 30, BARGAIN_PHRASES.customer_leave[Math.floor(Math.random() * BARGAIN_PHRASES.customer_leave.length)], '#FF5252');
                sfxFail();
            }
            G.bargainState = null;
        } else {
            // 顾客还价
            const diff = price - G.bargainState.currentOffer;
            G.bargainState.currentOffer += Math.floor(diff * (0.3 + Math.random() * 0.4));
            G.bargainState.customerPhrase = BARGAIN_PHRASES.customer[Math.floor(Math.random() * BARGAIN_PHRASES.customer.length)];

            // 更新选项
            const newPrice = Math.floor((price + G.bargainState.currentOffer) / 2);
            G.bargainState.playerOptions = [
                { text: '接受报价 ' + G.bargainState.currentOffer + '元', action: 'accept' },
                { text: '还价 ' + newPrice + '元', action: 'counter', price: newPrice },
                { text: '坚持 ' + price + '元', action: 'insist', price }
            ];
            sfxBargain();
        }
    } else if (action === 'insist') {
        G.bargainState.round++;
        if (price <= G.bargainState.currentOffer * 1.2) {
            // 顾客可能接受
            if (Math.random() < 0.4) {
                completeSale(price);
                addFloatingText(G.customer.x, G.customer.y - 30, BARGAIN_PHRASES.customer_buy[Math.floor(Math.random() * BARGAIN_PHRASES.customer_buy.length)], '#4CAF50');
                G.bargainState = null;
                return;
            }
        }

        if (G.bargainState.round >= G.bargainState.maxRounds) {
            G.customer.state = 'leaving';
            addFloatingText(G.customer.x, G.customer.y - 30, BARGAIN_PHRASES.customer_leave[Math.floor(Math.random() * BARGAIN_PHRASES.customer_leave.length)], '#FF5252');
            sfxFail();
            G.bargainState = null;
        } else {
            // 顾客最后出价
            G.bargainState.currentOffer = Math.floor(G.bargainState.currentOffer * 1.1);
            G.bargainState.playerOptions = [
                { text: '接受 ' + G.bargainState.currentOffer + '元', action: 'accept' },
                { text: '不卖了', action: 'reject' }
            ];
        }
    } else if (action === 'reject') {
        G.customer.state = 'leaving';
        addFloatingText(G.customer.x, G.customer.y - 30, BARGAIN_PHRASES.customer_leave[Math.floor(Math.random() * BARGAIN_PHRASES.customer_leave.length)], '#FF5252');
        sfxFail();
        G.bargainState = null;
    }
}

// 完成销售
function completeSale(price) {
    const productIdx = G.customer.wantedProduct;
    const product = PRODUCTS[productIdx];
    const profit = Math.floor(price - product.cost * G.costMultiplier);

    G.money += price;
    G.totalEarned += price;
    G.customersServed++;
    G.totalCustomers++;
    G.combo++;
    G.comboTimer = 120;

    // 声望提升
    const repGain = profit > 0 ? 2 : 1;
    G.reputation = Math.min(100, G.reputation + repGain);

    // 库存减少
    G.inventory[productIdx]--;

    // 粒子效果
    addParticle(G.customer.x, G.customer.y - 20, '#FFD700', 10);
    addFloatingText(G.customer.x - 30, G.customer.y - 50, '+' + price + '元', '#FFD700');
    if (profit > 0) {
        addFloatingText(G.customer.x + 20, G.customer.y - 70, '利润+' + profit, '#4CAF50');
    }

    sfxCoin();

    // 顾客离开
    G.customer.state = 'buying';
    setTimeout(() => {
        if (G.customer) G.customer.state = 'leaving';
    }, 500);
}

// 触发随机事件
function triggerEvent() {
    if (G.event || G.eventCooldown > 0) return;

    const event = EVENTS[Math.floor(Math.random() * EVENTS.length)];
    G.event = event;
    G.eventTimer = event.duration;
    G.eventCooldown = 15000; // 15秒冷却

    // 应用效果
    switch (event.effect) {
        case 'fine':
            G.money = Math.max(0, G.money - event.value);
            addFloatingText(W / 2, H / 2, '-' + event.value + '元罚款', '#FF5252');
            break;
        case 'boost':
            G.customerMultiplier = event.value;
            break;
        case 'slow':
            G.customerMultiplier = event.value;
            break;
        case 'stop':
            G.customerMultiplier = 0;
            break;
        case 'cost_up':
            G.costMultiplier = event.value;
            break;
        case 'fame':
            G.reputation = Math.min(100, G.reputation + event.value);
            G.fameBonus = event.value;
            addFloatingText(W / 2, H / 2, '声望+' + event.value, '#FFD700');
            break;
        case 'compete':
            G.priceMultiplier = event.value;
            break;
    }

    sfxEvent();
    addParticle(W / 2, 100, '#FF6B35', 15);
}

// 补货
function restock(productIdx) {
    const product = PRODUCTS[productIdx];
    const cost = Math.floor(product.cost * 2 * G.costMultiplier);
    if (G.money >= cost && G.inventory[productIdx] < G.inventoryMax) {
        G.money -= cost;
        G.inventory[productIdx] = Math.min(G.inventoryMax, G.inventory[productIdx] + 3);
        addFloatingText(100 + productIdx * 140, 450, '补货+3', '#4CAF50');
        sfxCoin();
    }
}

// 游戏初始化
function initGame() {
    G.state = 'playing';
    G.money = 100;
    G.day = 1;
    G.time = 0;
    G.dayTimer = 0;
    G.reputation = 50;
    G.totalEarned = 0;
    G.totalCustomers = 0;
    G.customersServed = 0;
    G.bestDay = 0;
    G.inventory = [3, 3, 3, 3, 3];
    G.selectedProduct = -1;
    G.customer = null;
    G.customerTimer = 0;
    G.lastCustomerTime = 0;
    G.event = null;
    G.eventTimer = 0;
    G.eventCooldown = 0;
    G.bargainState = null;
    G.particles = [];
    G.floatingTexts = [];
    G.combo = 0;
    G.comboTimer = 0;
    G.costMultiplier = 1;
    G.priceMultiplier = 1;
    G.customerMultiplier = 1;
    G.fameBonus = 0;

    initStars();
    initLanterns();
    document.getElementById('pauseBtn').style.display = 'block';
}

// 结束一天
function endDay() {
    const dayEarning = G.totalEarned;
    if (dayEarning > G.bestDay) G.bestDay = dayEarning;

    G.day++;
    G.time = 0;
    G.dayTimer = 0;
    G.customer = null;
    G.bargainState = null;
    G.event = null;
    G.eventTimer = 0;
    G.eventCooldown = 0;
    G.customerMultiplier = 1;
    G.costMultiplier = 1;
    G.priceMultiplier = 1;
    G.fameBonus = 0;

    // 游戏结束条件：连续亏损或经营30天
    if (G.money < 10 && G.day > 3) {
        gameOver('资金不足，摊位倒闭了！');
    } else if (G.day > 30) {
        gameOver('恭喜！经营了30天！');
    }

    addFloatingText(W / 2, H / 2, '第' + G.day + '天开始！', '#FFD700');
}

// 游戏结束
function gameOver(reason) {
    G.state = 'gameover';
    if (G.totalEarned > G.bestScore) {
        G.bestScore = G.totalEarned;
        localStorage.setItem('night_market_best', G.bestScore.toString());
    }
    document.getElementById('pauseBtn').style.display = 'none';
}

// 绘制背景
function drawBackground() {
    // 夜空渐变
    const gradient = ctx.createLinearGradient(0, 0, 0, H);
    gradient.addColorStop(0, '#0a0a2e');
    gradient.addColorStop(0.3, '#1a1a4e');
    gradient.addColorStop(0.6, '#2a1a3e');
    gradient.addColorStop(1, '#1a0a2e');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, W, H);

    // 星星
    G.stars.forEach(star => {
        star.twinkle += star.speed;
        const alpha = 0.3 + Math.sin(star.twinkle) * 0.3;
        ctx.fillStyle = `rgba(255, 255, 200, ${alpha})`;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        ctx.fill();
    });

    // 灯笼
    G.lanterns.forEach(lantern => {
        lantern.swing += lantern.speed;
        const swingX = Math.sin(lantern.swing) * 5;

        // 灯绳
        ctx.strokeStyle = '#8B4513';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(lantern.x, 0);
        ctx.lineTo(lantern.x + swingX, lantern.y);
        ctx.stroke();

        // 灯笼主体
        const lx = lantern.x + swingX;
        const ly = lantern.y;
        const s = lantern.size;

        ctx.fillStyle = '#FF4500';
        ctx.beginPath();
        ctx.ellipse(lx, ly, s * 0.7, s, 0, 0, Math.PI * 2);
        ctx.fill();

        // 灯笼高光
        ctx.fillStyle = 'rgba(255, 200, 100, 0.5)';
        ctx.beginPath();
        ctx.ellipse(lx - s * 0.2, ly - s * 0.2, s * 0.3, s * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();

        // 灯笼文字
        ctx.fillStyle = '#FFD700';
        ctx.font = `bold ${Math.floor(s * 0.6)}px "Microsoft YaHei"`;
        ctx.textAlign = 'center';
        ctx.fillText('市', lx, ly + s * 0.2);
    });

    // 地面
    ctx.fillStyle = '#2a1a0a';
    ctx.fillRect(0, H - 150, W, 150);

    // 地面纹理
    ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
    for (let i = 0; i < 20; i++) {
        ctx.fillRect(i * 40, H - 150, 20, 150);
    }
}

// 绘制摊位
function drawStall() {
    const stallX = 50;
    const stallY = 180;
    const stallW = W - 100;
    const stallH = 250;

    // 摊位架子
    ctx.fillStyle = '#8B4513';
    ctx.fillRect(stallX, stallY, stallW, stallH);

    // 摊位顶部遮阳棚
    ctx.fillStyle = '#CD5C5C';
    ctx.beginPath();
    ctx.moveTo(stallX - 20, stallY);
    ctx.lineTo(stallX + stallW + 20, stallY);
    ctx.lineTo(stallX + stallW + 10, stallY - 40);
    ctx.lineTo(stallX - 10, stallY - 40);
    ctx.closePath();
    ctx.fill();

    // 遮阳棚条纹
    ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
    for (let i = 0; i < stallW; i += 30) {
        ctx.fillRect(stallX + i, stallY - 40, 15, 40);
    }

    // 摊位台面
    ctx.fillStyle = '#A0522D';
    ctx.fillRect(stallX, stallY + 20, stallW, 20);

    // 商品展示
    PRODUCTS.forEach((product, i) => {
        const px = stallX + 20 + i * 140;
        const py = stallY + 60;

        // 商品背景
        ctx.fillStyle = G.inventory[i] > 0 ? product.color : '#555';
        ctx.globalAlpha = G.inventory[i] > 0 ? 1 : 0.5;
        ctx.beginPath();
        ctx.roundRect(px, py, 120, 140, 10);
        ctx.fill();
        ctx.globalAlpha = 1;

        // 选中高亮
        if (G.selectedProduct === i) {
            ctx.strokeStyle = '#FFD700';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.roundRect(px, py, 120, 140, 10);
            ctx.stroke();
        }

        // 商品emoji
        ctx.font = '40px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(product.emoji, px + 60, py + 50);

        // 商品名
        ctx.fillStyle = '#FFF';
        ctx.font = 'bold 16px "Microsoft YaHei"';
        ctx.fillText(product.name, px + 60, py + 80);

        // 价格
        ctx.fillStyle = '#FFD700';
        ctx.font = '14px "Microsoft YaHei"';
        ctx.fillText(product.basePrice + '元', px + 60, py + 100);

        // 库存
        ctx.fillStyle = G.inventory[i] > 0 ? '#4CAF50' : '#FF5252';
        ctx.font = 'bold 14px "Microsoft YaHei"';
        ctx.fillText('库存: ' + G.inventory[i], px + 60, py + 120);

        // 补货按钮
        if (G.inventory[i] < G.inventoryMax) {
            ctx.fillStyle = '#4CAF50';
            ctx.beginPath();
            ctx.roundRect(px + 20, py + 125, 80, 25, 5);
            ctx.fill();
            ctx.fillStyle = '#FFF';
            ctx.font = '12px "Microsoft YaHei"';
            ctx.fillText('补货', px + 60, py + 142);
        }
    });
}

// 绘制顾客
function drawCustomer() {
    if (!G.customer) return;

    const c = G.customer;

    // 顾客身体
    ctx.font = '60px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(c.type.emoji, c.x, c.y);

    // 顾客名字
    ctx.fillStyle = '#FFF';
    ctx.font = '14px "Microsoft YaHei"';
    ctx.fillText(c.type.name, c.x, c.y + 30);

    // 想要的商品
    ctx.font = '24px Arial';
    ctx.fillText(PRODUCTS[c.wantedProduct].emoji, c.x, c.y - 50);

    // 耐心条
    const patienceRatio = c.currentPatience / c.patience;
    const barWidth = 60;
    const barHeight = 8;
    const barX = c.x - barWidth / 2;
    const barY = c.y + 40;

    ctx.fillStyle = '#333';
    ctx.fillRect(barX, barY, barWidth, barHeight);

    const pColor = patienceRatio > 0.5 ? '#4CAF50' : patienceRatio > 0.25 ? '#FFA500' : '#FF5252';
    ctx.fillStyle = pColor;
    ctx.fillRect(barX, barY, barWidth * patienceRatio, barHeight);

    // 状态文字
    if (c.state === 'waiting') {
        ctx.fillStyle = '#FFD700';
        ctx.font = '12px "Microsoft YaHei"';
        ctx.fillText('点击查看', c.x, c.y + 60);
    }
}

// 更新游戏状态
function update(dt) {
    if (G.state !== 'playing' || G.isPaused) return;

    // 更新营业时间
    G.dayTimer += dt;
    G.time = Math.min(100, (G.dayTimer / G.dayDuration) * 100);

    if (G.time >= 100) {
        endDay();
        return;
    }

    // 连击计时
    if (G.comboTimer > 0) {
        G.comboTimer--;
        if (G.comboTimer <= 0) G.combo = 0;
    }

    // 事件冷却
    if (G.eventCooldown > 0) {
        G.eventCooldown -= dt;
    }

    // 更新事件
    if (G.event) {
        G.eventTimer -= dt;
        if (G.eventTimer <= 0) {
            // 恢复效果
            G.customerMultiplier = 1;
            G.costMultiplier = 1;
            G.priceMultiplier = 1;
            G.fameBonus = 0;
            G.event = null;
        }
    }

    // 随机事件触发
    if (!G.event && G.eventCooldown <= 0 && Math.random() < 0.0003) {
        triggerEvent();
    }

    // 顾客生成
    G.customerTimer += dt;
    const interval = G.customerInterval / G.customerMultiplier / (1 + G.reputation / 100);
    if (!G.customer && G.customerTimer >= interval) {
        spawnCustomer();
    }

    // 更新顾客
    if (G.customer) {
        const c = G.customer;

        if (c.state === 'entering') {
            c.x += (c.targetX - c.x) * 0.05;
            if (Math.abs(c.x - c.targetX) < 5) {
                c.state = 'waiting';
            }
        } else if (c.state === 'waiting') {
            // 耐心减少
            c.currentPatience -= dt * 0.01;
            if (c.currentPatience <= 0) {
                c.state = 'leaving';
                addFloatingText(c.x, c.y - 30, '太久了...', '#FF5252');
                G.combo = 0;
                sfxFail();
            }
        } else if (c.state === 'leaving') {
            c.x += 3;
            if (c.x > W + 50) {
                G.customer = null;
                G.bargainState = null;
            }
        } else if (c.state === 'buying') {
            c.animTimer += dt;
        }
    }

    // 更新粒子
    G.particles = G.particles.filter(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.1;
        p.life -= p.decay;
        return p.life > 0;
    });

    // 更新浮动文字
    G.floatingTexts = G.floatingTexts.filter(ft => {
        ft.y += ft.vy;
        ft.life -= ft.decay;
        return ft.life > 0;
    });
}

// 主渲染
function render() {
    ctx.clearRect(0, 0, W, H);

    drawBackground();
    drawStall();
    drawCustomer();
    drawBargainUI();
    drawUI();
    drawParticles();
    drawFloatingTexts();

    if (G.state === 'gameover') {
        drawGameOver();
    }
}

// 游戏循环
let lastTime = 0;
function gameLoop(timestamp) {
    const dt = timestamp - lastTime;
    lastTime = timestamp;

    update(dt);
    render();

    requestAnimationFrame(gameLoop);
}

// 点击处理
function handleClick(x, y) {
    if (G.state !== 'playing') return;

    // 检查讨价还价选项
    if (G.bargainState && G.customer && G.customer.state === 'bargaining') {
        const bs = G.bargainState;
        const panelX = W / 2 - 200;
        const panelY = H - 180;

        bs.playerOptions.forEach((opt, i) => {
            const btnX = panelX + 20;
            const btnY = panelY + 70 + i * 30;
            const btnW = 360;
            const btnH = 25;

            if (x >= btnX && x <= btnX + btnW && y >= btnY && y <= btnY + btnH) {
                handleBargain(opt.action, opt.price);
            }
        });
        return;
    }

    // 检查顾客点击
    if (G.customer && G.customer.state === 'waiting') {
        const cx = G.customer.x;
        const cy = G.customer.y;
        if (Math.abs(x - cx) < 40 && Math.abs(y - cy) < 40) {
            if (G.inventory[G.customer.wantedProduct] > 0) {
                startBargain();
            } else {
                addFloatingText(cx, cy - 30, '该商品已售罄！', '#FF5252');
            }
            return;
        }
    }

    // 检查商品点击（补货）
    const stallX = 50;
    const stallY = 180;
    PRODUCTS.forEach((product, i) => {
        const px = stallX + 20 + i * 140;
        const py = stallY + 60;

        // 补货按钮区域
        if (x >= px + 20 && x <= px + 100 && y >= py + 125 && y <= py + 150) {
            restock(i);
        }

        // 商品选择
        if (x >= px && x <= px + 120 && y >= py && y <= py + 120) {
            G.selectedProduct = i;
        }
    });
}

// 游戏结束界面点击
function handleGameOverClick(x, y) {
    // 再来一局按钮
    if (x >= W / 2 - 80 && x <= W / 2 + 80 && y >= H / 2 + 110 && y <= H / 2 + 160) {
        initGame();
    }
}

// 事件监听
canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width;
    const scaleY = H / rect.height;
    const x = (e.clientX - rect.left) * scaleX;
    const y = (e.clientY - rect.top) * scaleY;

    if (G.state === 'gameover') {
        handleGameOverClick(x, y);
    } else {
        handleClick(x, y);
    }
});

// 触屏支持
canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width;
    const scaleY = H / rect.height;
    const x = (touch.clientX - rect.left) * scaleX;
    const y = (touch.clientY - rect.top) * scaleY;

    if (G.state === 'gameover') {
        handleGameOverClick(x, y);
    } else {
        handleClick(x, y);
    }
}, { passive: false });

// 键盘支持
document.addEventListener('keydown', (e) => {
    if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
        if (G.state === 'playing') {
            G.isPaused = !G.isPaused;
            document.getElementById('pauseScreen').style.display = G.isPaused ? 'flex' : 'none';
        }
    }

    // 数字键1-5选择商品
    if (G.state === 'playing' && !G.isPaused) {
        const num = parseInt(e.key);
        if (num >= 1 && num <= 5) {
            G.selectedProduct = num - 1;
        }
        // R键补货选中的商品
        if (e.key === 'r' || e.key === 'R') {
            if (G.selectedProduct >= 0) {
                restock(G.selectedProduct);
            }
        }
    }
});

// 暂停按钮
document.getElementById('pauseBtn').addEventListener('click', () => {
    if (G.state === 'playing') {
        G.isPaused = !G.isPaused;
        document.getElementById('pauseScreen').style.display = G.isPaused ? 'flex' : 'none';
    }
});

document.getElementById('resumeBtn').addEventListener('click', () => {
    G.isPaused = false;
    document.getElementById('pauseScreen').style.display = 'none';
});

document.getElementById('restartBtn').addEventListener('click', () => {
    G.isPaused = false;
    document.getElementById('pauseScreen').style.display = 'none';
    initGame();
});

// 开始按钮
document.getElementById('startBtn').addEventListener('click', () => {
    initAudio();
    document.getElementById('startScreen').style.display = 'none';
    initGame();
    requestAnimationFrame(gameLoop);
});

// 初始渲染
initStars();
initLanterns();
function menuRender() {
    if (G.state === 'menu') {
        ctx.clearRect(0, 0, W, H);
        drawBackground();
        requestAnimationFrame(menuRender);
    }
}
menuRender();

<script>
(function(){

  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
