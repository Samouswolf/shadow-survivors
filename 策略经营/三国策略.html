<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>三国策略</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #2c3e50 0%, #1a252f 100%); min-height: 100vh; overflow: hidden; }
        .game-container { width: 100%; height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 10px; }
        .faction { display: flex; align-items: center; gap: 10px; }
        .faction-icon { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .faction.red { background: linear-gradient(135deg, #e74c3c, #c0392b); }
        .faction.blue { background: linear-gradient(135deg, #3498db, #2980b9); }
        .faction.green { background: linear-gradient(135deg, #2ecc71, #27ae60); }
        .faction-info { color: #fff; font-size: 14px; }
        
        .map-container { flex: 1; background: rgba(255,255,255,0.05); border-radius: 15px; position: relative; overflow: hidden; border: 2px solid rgba(255,255,255,0.2); }
        .city { position: absolute; width: 60px; height: 60px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s; }
        .city.red { background: linear-gradient(135deg, rgba(231,76,60,0.8), rgba(192,57,43,0.8)); border: 3px solid #e74c3c; }
        .city.blue { background: linear-gradient(135deg, rgba(52,152,219,0.8), rgba(41,128,185,0.8)); border: 3px solid #3498db; }
        .city.green { background: linear-gradient(135deg, rgba(46,204,113,0.8), rgba(39,174,96,0.8)); border: 3px solid #2ecc71; }
        .city.selected { transform: scale(1.2); box-shadow: 0 0 20px rgba(255,215,0,0.8); }
        
        .panel { width: 100%; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-top: 10px; }
        .city-info { color: #fff; display: none; }
        .city-info.show { display: block; }
        .info-row { display: flex; justify-content: space-between; margin: 5px 0; }
        .actions { display: flex; gap: 10px; margin-top: 10px; }
        .btn { padding: 10px 20px; border: none; border-radius: 20px; font-size: 14px; font-weight: bold; cursor: pointer; transition: all 0.3s; }
        .btn-primary { background: linear-gradient(135deg, #3498db, #2980b9); color: #fff; }
        .btn-danger { background: linear-gradient(135deg, #e74c3c, #c0392b); color: #fff; }
        .btn-success { background: linear-gradient(135deg, #2ecc71, #27ae60); color: #fff; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .message { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); color: #fff; padding: 20px 40px; border-radius: 15px; font-size: 20px; display: none; z-index: 100; }
        .message.show { display: block; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 10px; font-size: 14px; }
        
        .road { position: absolute; background: rgba(255,255,255,0.3); height: 3px; z-index: 0; }
    /* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */
/* [BATCH-FIX:ad-components-css] */
.sponsor-btn{position:fixed;top:44px;right:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:3px 9px;border-radius:10px;font:11px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.sponsor-panel.show{display:flex}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.interstitial-ad.show{display:flex}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}

</style>

<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="faction">
                <div class="faction-icon red">⚔️</div>
                <div class="faction-info">
                    <div>蜀国</div>
                    <div id="shuScore">3座城</div>
                </div>
            </div>
            <div class="faction">
                <div class="faction-icon blue">🛡️</div>
                <div class="faction-info">
                    <div>魏国</div>
                    <div id="weiScore">3座城</div>
                </div>
            </div>
            <div class="faction">
                <div class="faction-icon green">🏯</div>
                <div class="faction-info">
                    <div>吴国</div>
                    <div id="wuScore">3座城</div>
                </div>
            </div>
        </div>
        
        <div class="map-container" id="map">
            <div class="message" id="message"></div>
        </div>
        
        <div class="panel">
            <div class="city-info" id="cityInfo">
                <div class="info-row"><span>城市</span><span id="cityName">--</span></div>
                <div class="info-row"><span>所属</span><span id="cityFaction">--</span></div>
                <div class="info-row"><span>兵力</span><span id="cityTroops">--</span></div>

                    <button class="btn btn-success" id="btnRecruit">招募士兵</button>

                </div>
            </div>
            <div id="noCityMsg" style="color: #fff; text-align: center;">点击地图上的城市查看详情</div>
        </div>
        
        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script src="../game_core.js"></script>
<script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script>
        const GENERALS = {
            shu: ['刘备', '关羽', '张飞', '赵云', '诸葛亮'],
            wei: ['曹操', '夏侯惇', '夏侯渊', '张辽', '司马懿'],
            wu: ['孙权', '周瑜', '陆逊', '吕蒙', '甘宁']
        };
        
        const CITIES = [
            { id: 'chengdu', name: '成都', x: 80, y: 300, faction: 'shu', troops: 1000, food: 5000, general: '刘备' },
            { id: 'changan', name: '长安', x: 250, y: 150, faction: 'wei', troops: 800, food: 4000, general: '曹操' },
            { id: 'ye', name: '邺城', x: 400, y: 80, faction: 'wei', troops: 600, food: 3500, general: '张辽' },
            { id: 'jiangling', name: '江陵', x: 350, y: 250, faction: 'wu', troops: 700, food: 3800, general: '周瑜' },
            { id: 'wuchang', name: '武昌', x: 450, y: 320, faction: 'wu', troops: 500, food: 3000, general: '陆逊' },
            { id: 'xiangyang', name: '襄阳', x: 300, y: 200, faction: 'shu', troops: 900, food: 4500, general: '关羽' },
            { id: 'jizhou', name: '冀州', x: 480, y: 120, faction: 'wei', troops: 700, food: 3800, general: '夏侯惇' },
            { id: 'yizhou', name: '益州', x: 150, y: 350, faction: 'shu', troops: 600, food: 3200, general: '张飞' },
            { id: 'dongwu', name: '东吴', x: 520, y: 380, faction: 'wu', troops: 800, food: 4200, general: '孙权' }
        ];
        
        let selectedCity = null;
        let playerFaction = 'shu';
        let turn = 1;
        
        const map = document.getElementById('map');
        const messageEl = document.getElementById('message');
        const cityInfoEl = document.getElementById('cityInfo');
        const noCityMsg = document.getElementById('noCityMsg');
        
        function renderMap() {
            map.innerHTML = '';
            map.appendChild(messageEl);
            
            CITIES.forEach(city => {
                const el = document.createElement('div');
                el.className = `city ${city.faction} ${selectedCity === city.id ? 'selected' : ''}`;
                el.style.left = city.x + 'px';
                el.style.top = city.y + 'px';
                el.innerHTML = `<span style="font-size: 18px;">${getCityEmoji(city)}</span><span style="font-size: 10px; color: #fff;">${city.name}</span>`;
                el.onclick = () => selectCity(city.id);
                map.appendChild(el);
            });
            
            drawRoads();
            updateScores();
        }
        
        function getCityEmoji(city) {
            if (city.troops > 800) return '🏯';
            if (city.troops > 500) return '🏰';
            return '🏠';
        }
        
        function drawRoads() {
            const roads = [
                ['chengdu', 'yizhou'], ['chengdu', 'xiangyang'],
                ['xiangyang', 'changan'], ['xiangyang', 'jiangling'],
                ['changan', 'ye'], ['ye', 'jizhou'],
                ['jiangling', 'wuchang'], ['wuchang', 'dongwu'],
                ['jiangling', 'ye'], ['jizhou', 'dongwu']
            ];
            
            roads.forEach(road => {
                const city1 = CITIES.find(c => c.id === road[0]);
                const city2 = CITIES.find(c => c.id === road[1]);
                if (city1 && city2) {
                    const dx = city2.x - city1.x;
                    const dy = city2.y - city1.y;
                    const length = Math.sqrt(dx * dx + dy * dy);
                    const angle = Math.atan2(dy, dx) * 180 / Math.PI;
                    
                    const roadEl = document.createElement('div');
                    roadEl.className = 'road';
                    roadEl.style.left = city1.x + 30 + 'px';
                    roadEl.style.top = city1.y + 30 + 'px';
                    roadEl.style.width = length + 'px';
                    roadEl.style.transform = `rotate(${angle}deg)`;
                    map.appendChild(roadEl);
                }
            });
        }
        
        function selectCity(cityId) {
            selectedCity = cityId;
            renderMap();
            
            const city = CITIES.find(c => c.id === cityId);
            if (city) {
                cityInfoEl.classList.add('show');
                noCityMsg.style.display = 'none';
                
                document.getElementById('cityName').textContent = city.name;
                document.getElementById('cityFaction').textContent = getFactionName(city.faction);
                document.getElementById('cityTroops').textContent = city.troops;
                document.getElementById('cityFood').textContent = city.food;
                document.getElementById('cityGenerals').textContent = city.general;
                
                const isPlayerCity = city.faction === playerFaction;
                document.getElementById('btnRecruit').disabled = !isPlayerCity;
                document.getElementById('btnAttack').disabled = isPlayerCity;
                document.getElementById('btnSurrender').disabled = !isPlayerCity;
            }
        }
        
        function getFactionName(faction) {
            const names = { shu: '蜀国', wei: '魏国', wu: '吴国' };
            return names[faction] || faction;
        }
        
        function updateScores() {
            const shuCount = CITIES.filter(c => c.faction === 'shu').length;
            const weiCount = CITIES.filter(c => c.faction === 'wei').length;
            const wuCount = CITIES.filter(c => c.faction === 'wu').length;
            
            document.getElementById('shuScore').textContent = shuCount + '座城';
            document.getElementById('weiScore').textContent = weiCount + '座城';
            document.getElementById('wuScore').textContent = wuCount + '座城';
        }
        
        function showMessage(msg) {
            messageEl.textContent = msg;
            messageEl.classList.add('show');
            setTimeout(() => {
                messageEl.classList.remove('show');
            }, 2000);
        }
        
        function recruit() {
            if (!selectedCity) return;
            const city = CITIES.find(c => c.id === selectedCity);
            if (!city || city.faction !== playerFaction) return;
            
            const cost = 500;
            if (city.food >= cost) {
                city.food -= cost;
                city.troops += 200;
                showMessage('招募成功！兵力+200');
                selectCity(selectedCity);
            } else {
                showMessage('粮草不足！');
            }
        }
        
        function attack() {
            if (!selectedCity) return;
            const targetCity = CITIES.find(c => c.id === selectedCity);
            if (!targetCity || targetCity.faction === playerFaction) return;
            
            const playerCities = CITIES.filter(c => c.faction === playerFaction);
            const adjacentCity = playerCities.find(c => isAdjacent(c, targetCity));
            
            if (!adjacentCity) {
                showMessage('没有相邻的己方城市可以出兵！');
                return;
            }
            
            if (adjacentCity.troops < 300) {
                showMessage('相邻城市兵力不足300，无法进攻！');
                return;
            }
            
            const attackTroops = Math.floor(adjacentCity.troops * 0.5);
            const defendTroops = targetCity.troops;
            
            const attackPower = attackTroops * (1 + Math.random() * 0.3);
            const defendPower = defendTroops * (1 + Math.random() * 0.2);
            
            if (attackPower > defendPower) {
                adjacentCity.troops -= attackTroops;
                targetCity.faction = playerFaction;
                targetCity.troops = Math.floor(attackTroops * 0.5);
                targetCity.general = GENERALS[playerFaction][Math.floor(Math.random() * GENERALS[playerFaction].length)];
                showMessage(`占领${targetCity.name}！`);
                checkVictory();
            } else {
                adjacentCity.troops -= Math.floor(attackTroops * 0.3);
                targetCity.troops -= Math.floor(defendTroops * 0.2);
                showMessage(`进攻失败！损失惨重`);
            }
            
            renderMap();
            selectCity(null);
        }
        
        function isAdjacent(city1, city2) {
            const dx = Math.abs(city1.x - city2.x);
            const dy = Math.abs(city1.y - city2.y);
            return dx < 150 && dy < 150;
        }
        
        function surrender() {
            if (!selectedCity) return;
            const city = CITIES.find(c => c.id === selectedCity);
            if (!city || city.faction !== playerFaction) return;
            
            const enemyCities = CITIES.filter(c => c.faction !== playerFaction);
            const adjacentEnemy = enemyCities.find(c => isAdjacent(c, city));
            
            if (adjacentEnemy && adjacentEnemy.troops > city.troops) {
                city.faction = adjacentEnemy.faction;
                city.troops = Math.floor(city.troops * 0.5);
                showMessage(`${city.name}失守！`);
                checkDefeat();
                renderMap();
                selectCity(null);
            } else {
                showMessage('没有敌人威胁！');
            }
        }
        
        function checkVictory() {
            const playerCount = CITIES.filter(c => c.faction === playerFaction).length;
            if (playerCount >= 7) {
                showMessage('统一三国！胜利！');
                saveHighScore(playerCount);
            }
        }
        
        function checkDefeat() {
            const playerCount = CITIES.filter(c => c.faction === playerFaction).length;
            if (playerCount === 0) {
                showMessage('势力覆灭！失败！');
            }
        }
        
        function saveHighScore(cities) {
            const saved = localStorage.getItem('threeKingdoms_highScore');
            const highScore = saved ? parseInt(saved) : 0;
            if (cities > highScore) {
                localStorage.setItem('threeKingdoms_highScore', cities);
            }
        }
        
        document.getElementById('btnRecruit').addEventListener('click', recruit);
        document.getElementById('btnAttack').addEventListener('click', attack);
        document.getElementById('btnSurrender').addEventListener('click', surrender);
        
        renderMap();
    </script>
<!-- [BATCH-FIX:responsive-js] -->
<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>
<!-- [/BATCH-FIX:responsive-js] -->
<!-- [BATCH-FIX:touch-support] -->
<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>
<!-- [/BATCH-FIX:touch-support] -->

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
