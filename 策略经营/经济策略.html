    <title>经济策略</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; overflow: hidden; color: #fff; }
        .game-container { width: 100%; height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 10px; }
        .stat { display: flex; flex-direction: column; align-items: center; }
        .stat-label { font-size: 12px; opacity: 0.7; }
        .stat-value { font-size: 24px; font-weight: bold; color: #ffa502; }
        
        .game-area { flex: 1; position: relative; background: rgba(0,0,0,0.4); border-radius: 15px; overflow: hidden; }
        #gameCanvas { width: 100%; height: 100%; display: block; }
        
        .market-indicator { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 10px; font-size: 16px; }
        
        .controls { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
        .btn { padding: 12px 25px; border: none; border-radius: 25px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 10px; font-size: 14px; }

<body>
    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">资金</div>
                <div class="stat-value" id="money">1000</div>
            </div>
            <div class="stat">
                <div class="stat-label">分数</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">最高</div>
                <div class="stat-value" id="highScore">0</div>
            </div>
        </div>
        
        <div class="game-area">
            <canvas id="gameCanvas"></canvas>
            <div class="market-indicator" id="marketIndicator">📈 市场: 正常</div>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" id="btnStart">▶️ 开始游戏</button>
        </div>
        
        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const GAME_NAME = '经济策略';
        GameCore.init({ highScore: GAME_NAME });
        
        let money = 1000;
        let score = 0;
        let gameRunning = false;
        
        let stocks = [];
        let marketTrend = 0;
        
        const STOCK_TYPES = [
            { name: '科技', emoji: '📱', basePrice: 100, volatility: 20, color: '#00d2ff' },
            { name: '能源', emoji: '⚡', basePrice: 80, volatility: 15, color: '#ffa502' },
            { name: '医疗', emoji: '💊', basePrice: 90, volatility: 10, color: '#48c78e' },
            { name: '金融', emoji: '💰', basePrice: 120, volatility: 25, color: '#ffd700' },
            { name: '地产', emoji: '🏠', basePrice: 70, volatility: 12, color: '#4ecdc4' }
        ];
        
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            initGame();
        }
        
        function initGame() {
            money = 1000;
            score = 0;
            marketTrend = 0;
            
            stocks = STOCK_TYPES.map(type => ({
                ...type,
                price: type.basePrice,
                owned: 0,
                history: []
            }));
        }
        
        function updateMarket() {
            marketTrend += (Math.random() - 0.5) * 0.2;
            marketTrend = Math.max(-0.5, Math.min(0.5, marketTrend));
            
            stocks.forEach(stock => {
                const change = (Math.random() - 0.5 + marketTrend) * stock.volatility;
                stock.price = Math.max(10, stock.price + change);
                
                stock.history.push(stock.price);
                if (stock.history.length > 20) stock.history.shift();
            });
            
            // 更新市场状态
            const status = marketTrend > 0.2 ? '牛市 📈' : marketTrend < -0.2 ? '熊市 📉' : '正常';
            document.getElementById('marketIndicator').textContent = `📈 市场: ${status}`;
        }
        
        function buyStock(index) {
            const stock = stocks[index];
            if (money >= stock.price) {
                money -= stock.price;
                stock.owned++;
                score += 10;
                updateStats();
            } else {
                GameCore.hints.show('资金不足！');
            }
        }
        
        function sellStock(index) {
            const stock = stocks[index];
            if (stock.owned > 0) {
                money += stock.price;
                stock.owned--;
                score += Math.floor(stock.price / 10);
                updateStats();
            } else {
                GameCore.hints.show('没有持仓！');
            }
        }
        
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 股票列表
            stocks.forEach((stock, i) => {
                const x = 10;
                const y = 30 + i * 100;
                
                // 背景
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(x, y, canvas.width - 20, 80);
                
                // 股票信息
                ctx.fillStyle = stock.color;
                ctx.font = '20px Arial';
                ctx.fillText(stock.emoji + ' ' + stock.name, x + 15, y + 30);
                
                ctx.fillStyle = '#fff';
                ctx.font = '16px Arial';
                ctx.fillText('¥' + Math.round(stock.price), x + 15, y + 55);
                ctx.fillText('持仓: ' + stock.owned, x + 150, y + 55);
                
                // 价格走势图
                if (stock.history.length > 1) {
                    ctx.strokeStyle = stock.color;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    const chartWidth = 150;
                    const chartHeight = 40;
                    const minPrice = Math.min(...stock.history);
                    const maxPrice = Math.max(...stock.history);
                    const range = maxPrice - minPrice || 1;
                    
                    stock.history.forEach((price, j) => {
                        const px = x + canvas.width - 160 + j * (chartWidth / (stock.history.length - 1));
                        const py = y + 70 - ((price - minPrice) / range) * chartHeight;
                        if (j === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    });
                    ctx.stroke();
                }
                
                // 买卖按钮
                ctx.fillStyle = '#48c78e';
                ctx.fillRect(x + canvas.width - 80, y + 10, 70, 25);
                ctx.fillStyle = '#fff';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('买入', x + canvas.width - 45, y + 28);
                
                ctx.fillStyle = '#ff6b6b';
                ctx.fillRect(x + canvas.width - 80, y + 45, 70, 25);
                ctx.fillStyle = '#fff';
                ctx.fillText('卖出', x + canvas.width - 45, y + 63);
            });
        }
        
        function updateStats() {
            document.getElementById('money').textContent = '¥' + Math.round(money);
            document.getElementById('score').textContent = score;
            document.getElementById('highScore').textContent = GameCore.highScore.get(GAME_NAME);
            
            if (GameCore.highScore.set(GAME_NAME, score)) {
                GameCore.hints.show('新纪录！分数: ' + score);
            }
        }
        
        let gameInterval;
        
        function gameLoop() {
            draw();
            
            if (gameRunning) {
                updateStats();
            }
            
            requestAnimationFrame(gameLoop);
        }
        
        canvas.addEventListener('click', e => {
            if (!gameRunning) return;
            
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            stocks.forEach((stock, i) => {
                const sy = 30 + i * 100;
                
                // 买入按钮
                if (x > canvas.width - 80 && x < canvas.width - 10 &&
                    y > sy + 10 && y < sy + 35) {
                    buyStock(i);
                }
                
                // 卖出按钮
                if (x > canvas.width - 80 && x < canvas.width - 10 &&
                    y > sy + 45 && y < sy + 70) {
                    sellStock(i);
                }
            });
        });
        
        document.getElementById('btnStart').onclick = () => {
            gameRunning = true;
            initGame();
            
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(updateMarket, 1000);
        };
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        gameLoop();
    </script>
<!-- [BATCH-FIX:touch-support] -->
<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>
<!-- [/BATCH-FIX:touch-support] -->

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
