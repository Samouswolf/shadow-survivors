    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%); min-height: 100vh; overflow: hidden; }
        .game-container { width: 100%; height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 10px; }
        .stat { display: flex; flex-direction: column; align-items: center; color: #fff; }
        .stat-label { font-size: 12px; opacity: 0.8; }
        .stat-value { font-size: 24px; font-weight: bold; color: #ffd700; }
        
        .game-area { flex: 1; position: relative; background: rgba(0,0,0,0.4); border-radius: 15px; overflow: hidden; }
        #gameCanvas { width: 100%; height: 100%; display: block; }
        
        .laser-power { position: absolute; bottom: 10px; left: 10px; width: 200px; background: rgba(0,0,0,0.7); border-radius: 10px; padding: 10px; }
        .power-bar { width: 100%; height: 15px; background: rgba(255,255,255,0.2); border-radius: 7px; overflow: hidden; }
        .power-fill { height: 100%; background: linear-gradient(90deg, #a855f7, #ff00ff); transition: width 0.3s; }
        .power-text { color: #fff; font-size: 12px; margin-top: 5px; text-align: center; }
        
        .controls { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
        .btn { padding: 12px 25px; border: none; border-radius: 25px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; }
        .btn-success { background: linear-gradient(135deg, #48c78e, #10b981); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 10px; font-size: 14px; }

<body>
    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">波次</div>
                <div class="stat-value" id="wave">1</div>
            </div>
            <div class="stat">
                <div class="stat-label">分数</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">最高分</div>
                <div class="stat-value" id="highScore">0</div>
            </div>
        </div>
        
        <div class="game-area">
            <canvas id="gameCanvas"></canvas>
            
            <div class="laser-power">
                <div class="power-bar">
                    <div class="power-fill" id="powerFill"></div>
                </div>
                <div class="power-text" id="powerText">能量: 100%</div>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn btn-success" id="btnStart">▶️ 开始</button>
            <button class="btn btn-primary" id="btnPause">⏸️ 暂停</button>
        </div>
        
        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let score = 0;
        let wave = 1;
        let highScore = 0;
        let gameRunning = false;
        let power = 100;
        let laserAngle = 0;
        let laserLength = 0;
        
        let enemies = [];
        let particles = [];
        
        const GAME_NAME = '激光守塔';
        
        GameCore.init({ highScore: GAME_NAME });
        
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        
        class Enemy {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = -30;
                this.radius = 15 + Math.random() * 10;
                this.speed = 1 + wave * 0.15;
                this.hp = 20 + wave * 5;
                this.maxHp = this.hp;
                this.color = `hsl(${Math.random() * 60 + 330}, 70%, 50%)`;
            }
            
            update() {
                this.y += this.speed;
                return this.y < canvas.height + 50;
            }
            
            draw() {
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                
                // 血条
                ctx.fillStyle = '#333';
                ctx.fillRect(this.x - 20, this.y - this.radius - 15, 40, 5);
                ctx.fillStyle = '#48c78e';
                ctx.fillRect(this.x - 20, this.y - this.radius - 15, 40 * (this.hp / this.maxHp), 5);
            }
        }
        
        function shootLaser() {
            if (power <= 0) return;
            
            power -= 2;
            laserLength = canvas.width;
            
            // 激光起点（底部中央）
            const startX = canvas.width / 2;
            const startY = canvas.height;
            
            // 检查命中
            enemies.forEach(enemy => {
                const dx = enemy.x - startX;
                const dy = enemy.y - startY;
                const angle = Math.atan2(dy, dx);
                const diff = Math.abs(angle - laserAngle);
                
                if (diff < 0.15) {
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < laserLength) {
                        enemy.hp -= 30;
                        
                        // 爆炸粒子
                        for (let i = 0; i < 8; i++) {
                            particles.push({
                                x: enemy.x,
                                y: enemy.y,
                                vx: (Math.random() - 0.5) * 6,
                                vy: (Math.random() - 0.5) * 6,
                                life: 1,
                                color: enemy.color
                            });
                        }
                    }
                }
            });
            
            // 移除死亡敌人
            enemies = enemies.filter(e => {
                if (e.hp <= 0) {
                    score += 100;
                    return false;
                }
                return true;
            });
            
            updateStats();
        }
        
        function updateParticles() {
            particles = particles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.2;
                p.life -= 0.03;
                return p.life > 0;
            });
        }
        
        function drawLaser() {
            const startX = canvas.width / 2;
            const startY = canvas.height;
            
            // 激光光束
            const endX = startX + Math.cos(laserAngle) * laserLength;
            const endY = startY + Math.sin(laserAngle) * laserLength;
            
            // 外发光
            ctx.strokeStyle = '#ff00ff';
            ctx.shadowColor = '#ff00ff';
            ctx.shadowBlur = 30;
            ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(endX, endY);
            ctx.stroke();
            
            // 内芯
            ctx.strokeStyle = '#fff';
            ctx.shadowBlur = 0;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(endX, endY);
            ctx.stroke();
            
            // 底座
            ctx.fillStyle = '#a855f7';
            ctx.beginPath();
            ctx.arc(startX, startY, 25, 0, Math.PI * 2);
            ctx.fill();
            
            // 冷却
            laserLength *= 0.9;
        }
        
        function drawParticles() {
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }
        
        function drawBackground() {
            // 星空背景
            ctx.fillStyle = 'rgba(255,255,255,0.1)';
            for (let i = 0; i < 50; i++) {
                const x = (i * 73 + Date.now() / 100) % canvas.width;
                const y = (i * 97) % canvas.height;
                ctx.beginPath();
                ctx.arc(x, y, 1, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function spawnWave() {
            const count = 5 + wave * 3;
            
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    enemies.push(new Enemy());
                }, i * 800);
            }
        }
        
        function updateStats() {
            document.getElementById('wave').textContent = wave;
            document.getElementById('score').textContent = score;
            document.getElementById('highScore').textContent = GameCore.highScore.get(GAME_NAME);
            
            document.getElementById('powerFill').style.width = power + '%';
            document.getElementById('powerText').textContent = '能量: ' + Math.round(power) + '%';
            
            if (GameCore.highScore.set(GAME_NAME, score)) {
                GameCore.hints.show('新纪录！分数: ' + score);
            }
            
            if (power <= 0) {
                gameRunning = false;
                GameCore.hints.show('能量耗尽！游戏结束！\n分数: ' + score, 5000);
            }
        }
        
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            drawBackground();
            
            if (gameRunning) {
                // 恢复能量
                if (power < 100) power += 0.5;
                
                // 更新敌人
                enemies.forEach(e => e.update());
                
                // 检查波次完成
                if (enemies.length === 0) {
                    wave++;
                    score += wave * 500;
                    updateStats();
                    setTimeout(() => {
                        if (gameRunning) spawnWave();
                    }, 2000);
                }
            }
            
            // 绘制
            enemies.forEach(e => e.draw());
            
            if (gameRunning) {
                drawLaser();
            }
            
            updateParticles();
            drawParticles();
            
            updateStats();
            requestAnimationFrame(gameLoop);
        }
        
        // 鼠标/触摸控制激光角度
        function updateLaserAngle(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const dx = x - canvas.width / 2;
            const dy = y - canvas.height;
            
            laserAngle = Math.atan2(dy, dx);
        }
        
        canvas.addEventListener('mousemove', updateLaserAngle);
        
        canvas.addEventListener('mousedown', shootLaser);
        
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            const touch = e.touches[0];
            updateLaserAngle({ clientX: touch.clientX, clientY: touch.clientY });
            shootLaser();
        }, { passive: false });
        
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            const touch = e.touches[0];
            updateLaserAngle({ clientX: touch.clientX, clientY: touch.clientY });
        }, { passive: false });
        
        document.getElementById('btnStart').onclick = () => {
            if (!gameRunning) {
                gameRunning = true;
                score = 0;
                wave = 1;
                power = 100;
                enemies = [];
                spawnWave();
            }
        };
        
        document.getElementById('btnPause').onclick = () => {
            gameRunning = !gameRunning;
        };
        
        // 初始化
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        gameLoop();
    </script>

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
