<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>驿站客栈</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a0f00 0%, #2d1f10 50%, #1a1500 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Microsoft YaHei', 'SimHei', sans-serif;
        }
        canvas {
            max-width: 100%;
            max-height: 100vh;
            touch-action: none;
        }
    </style>

<style>
/* 游戏工坊广告系统 */
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);height:90px;max-height:90px;overflow:hidden;contain:layout style paint;pointer-events:none!important}.ad-banner-container,.ad-banner-container *{pointer-events:none!important}.ad-banner-container iframe{max-height:90px;pointer-events:none!important}
.ad-banner-container iframe{max-width:100%}
.ad-label{position:absolute;top:1px;right:6px;font:9px "Microsoft YaHei",sans-serif;color:rgba(255,255,255,.35)}
.sponsor-btn{position:fixed;top:44px;right:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:3px 9px;border-radius:10px;font:11px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .qr-row{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.sponsor-panel .qr-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px;text-align:center;min-width:140px}
.sponsor-panel .qr-card .qr-icon{font-size:48px;margin-bottom:6px}
.sponsor-panel .qr-card .qr-label{color:#ccc;font:13px "Microsoft YaHei",sans-serif}
.sponsor-panel .qr-card .qr-hint{color:#888;font:11px "Microsoft YaHei",sans-serif;margin-top:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.interstitial-ad .ad-content{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;text-align:center;min-width:280px;max-width:400px}
.interstitial-ad .ad-content p{color:#aaa;font:14px "Microsoft YaHei",sans-serif;margin-bottom:12px}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
</style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script src="../game_core.js"></script>
<script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script>
        // ==================== 游戏常量 ====================
        const CONFIG = {
            WIDTH: 800,
            HEIGHT: 600,
            FPS: 60,
            MAX_DAYS: 30,
            START_MONEY: 100,
            START_REPUTATION: 50,
            MAX_REPUTATION: 100,
            ROOM_COUNT: 6,
            ROOM_TYPES: [
                { name: '柴房', price: 0, comfort: 0, upgradeCost: 50, desc: '简陋柴房，勉强能睡' },
                { name: '通铺', price: 5, comfort: 1, upgradeCost: 80, desc: '多人通铺，热闹非凡' },
                { name: '单间', price: 15, comfort: 2, upgradeCost: 150, desc: '干净单间，安静舒适' },
                { name: '上房', price: 30, comfort: 3, upgradeCost: 300, desc: '上等客房，设施齐全' },
                { name: '天字房', price: 50, comfort: 4, upgradeCost: 600, desc: '天字号房，奢华享受' }
            ],
            FOOD_TYPES: [
                { name: '粗茶淡饭', cost: 2, price: 5, satisfaction: 1 },
                { name: '家常小菜', cost: 5, price: 12, satisfaction: 2 },
                { name: '招牌菜', cost: 10, price: 25, satisfaction: 3 },
                { name: '豪华宴席', cost: 20, price: 50, satisfaction: 5 }
            ],
            TRAVELER_TYPES: [
                { name: '行脚商人', money: [10, 30], patience: 3, icon: '行' },
                { name: '书生', money: [5, 20], patience: 4, icon: '书' },
                { name: '江湖侠客', money: [20, 50], patience: 2, icon: '侠' },
                { name: '达官贵人', money: [50, 100], patience: 2, icon: '贵' },
                { name: '普通旅人', money: [8, 25], patience: 3, icon: '旅' }
            ],
            EVENTS: [
                { name: '风调雨顺', desc: '今日生意兴隆，收入+20%', effect: 'income_up', value: 0.2 },
                { name: '暴雨来袭', desc: '暴雨导致客人减少', effect: 'guest_down', value: 0.5 },
                { name: '美食节', desc: '美食节活动，餐饮收入翻倍', effect: 'food_bonus', value: 2 },
                { name: '盗贼出没', desc: '盗贼偷走部分银两', effect: 'steal', value: 20 },
                { name: '官府检查', desc: '官府检查，需打点费用', effect: 'bribe', value: 30 },
                { name: '名人光临', desc: '名人光临，声望+15', effect: 'reputation_up', value: 15 },
                { name: '食材涨价', desc: '食材涨价，成本增加50%', effect: 'cost_up', value: 0.5 },
                { name: '瘟疫传闻', desc: '瘟疫传闻，客人减少30%', effect: 'guest_down', value: 0.3 }
            ]
        };

        // ==================== 游戏状态 ====================
        var G = {
            state: 'menu', // menu, playing, paused, gameOver, dayEnd, event
            canvas: null,
            ctx: null,
            scaleX: 1,
            scaleY: 1,
            money: CONFIG.START_MONEY,
            reputation: CONFIG.START_REPUTATION,
            day: 1,
            score: 0,
            highScore: parseInt(localStorage.getItem('inn_highScore')) || 0,
            rooms: [],
            travelers: [],
            waitingTravelers: [],
            selectedRoom: -1,
            selectedTraveler: -1,
            currentEvent: null,
            dayIncome: 0,
            dayExpenses: 0,
            totalGuests: 0,
            particles: [],
            floatingTexts: [],
            animFrame: 0,
            mouseX: 0,
            mouseY: 0,
            isDragging: false,
            dragTraveler: null,
            showTutorial: true,
            tutorialStep: 0,
            foodBonus: 1,
            incomeBonus: 1,
            costBonus: 1,
            lastTime: 0,
            deltaTime: 0
        };

        // ==================== 初始化函数 ====================
        function initGame() {
            G.canvas = document.getElementById('gameCanvas');
            G.ctx = G.canvas.getContext('2d');

            // 设置画布尺寸
            resizeCanvas();

            // 初始化房间
            G.rooms = [];
            for (var i = 0; i < CONFIG.ROOM_COUNT; i++) {
                G.rooms.push({
                    type: 0, // 房间类型索引
                    guest: null,
                    cleanliness: 100
                });
            }

            // 绑定事件
            bindEvents();

            // 开始游戏循环
            requestAnimationFrame(gameLoop);
        }

        function resizeCanvas() {
            var canvas = G.canvas;
            var ratio = CONFIG.WIDTH / CONFIG.HEIGHT;
            var windowRatio = window.innerWidth / window.innerHeight;

            if (windowRatio > ratio) {
                canvas.height = window.innerHeight;
                canvas.width = canvas.height * ratio;
            } else {
                canvas.width = window.innerWidth;
                canvas.height = canvas.width / ratio;
            }

            G.scaleX = CONFIG.WIDTH / canvas.width;
            G.scaleY = CONFIG.HEIGHT / canvas.height;
        }

        function resetGame() {
            G.money = CONFIG.START_MONEY;
            G.reputation = CONFIG.START_REPUTATION;
            G.day = 1;
            G.score = 0;
            G.rooms = [];
            G.travelers = [];
            G.waitingTravelers = [];
            G.selectedRoom = -1;
            G.selectedTraveler = -1;
            G.currentEvent = null;
            G.dayIncome = 0;
            G.dayExpenses = 0;
            G.totalGuests = 0;
            G.particles = [];
            G.floatingTexts = [];
            G.foodBonus = 1;
            G.incomeBonus = 1;
            G.costBonus = 1;
            G.showTutorial = true;
            G.tutorialStep = 0;

            for (var i = 0; i < CONFIG.ROOM_COUNT; i++) {
                G.rooms.push({
                    type: 0,
                    guest: null,
                    cleanliness: 100
                });
            }

            generateTravelers();
        }

        // ==================== 游戏逻辑 ====================
        function generateTravelers() {
            G.waitingTravelers = [];
            var count = 2 + Math.floor(G.reputation / 20);
            count = Math.min(count, 5);

            for (var i = 0; i < count; i++) {
                var typeIndex = Math.floor(Math.random() * CONFIG.TRAVELER_TYPES.length);
                var type = CONFIG.TRAVELER_TYPES[typeIndex];
                var money = type.money[0] + Math.floor(Math.random() * (type.money[1] - type.money[0]));

                G.waitingTravelers.push({
                    type: typeIndex,
                    name: type.name,
                    icon: type.icon,
                    money: money,
                    patience: type.patience,
                    satisfaction: 0,
                    stayDays: 1 + Math.floor(Math.random() * 3),
                    assigned: false
                });
            }
        }

        function assignTravelerToRoom(travelerIndex, roomIndex) {
            if (travelerIndex < 0 || travelerIndex >= G.waitingTravelers.length) return false;
            if (roomIndex < 0 || roomIndex >= G.rooms.length) return false;

            var room = G.rooms[roomIndex];
            var traveler = G.waitingTravelers[travelerIndex];

            if (room.guest !== null) return false;
            if (traveler.assigned) return false;

            // 分配客人
            room.guest = {
                ...traveler,
                daysLeft: traveler.stayDays,
                paid: false
            };
            traveler.assigned = true;

            // 收取房费
            var roomType = CONFIG.ROOM_TYPES[room.type];
            var income = Math.floor(roomType.price * G.incomeBonus);
            G.money += income;
            G.dayIncome += income;
            G.totalGuests++;

            // 增加声望
            G.reputation = Math.min(CONFIG.MAX_REPUTATION, G.reputation + roomType.comfort);

            // 添加浮动文字
            addFloatingText('+' + income + '文', getRoomX(roomIndex), getRoomY(roomIndex), '#4CAF50');

            // 添加粒子效果
            for (var i = 0; i < 5; i++) {
                addParticle(getRoomX(roomIndex), getRoomY(roomIndex), '#FFD700');
            }

            return true;
        }

        function serveFood(roomIndex, foodIndex) {
            if (roomIndex < 0 || roomIndex >= G.rooms.length) return false;
            if (foodIndex < 0 || foodIndex >= CONFIG.FOOD_TYPES.length) return false;

            var room = G.rooms[roomIndex];
            if (room.guest === null) return false;

            var food = CONFIG.FOOD_TYPES[foodIndex];
            var cost = Math.floor(food.cost * G.costBonus);

            if (G.money < cost) return false;

            // 扣除成本
            G.money -= cost;
            G.dayExpenses += cost;

            // 计算收入
            var income = Math.floor(food.price * G.foodBonus * G.incomeBonus);
            G.money += income;
            G.dayIncome += income;

            // 增加满意度
            room.guest.satisfaction += food.satisfaction;

            // 添加浮动文字
            addFloatingText('+' + income + '文', getRoomX(roomIndex), getRoomY(roomIndex) - 20, '#2196F3');

            return true;
        }

        function cleanRoom(roomIndex) {
            if (roomIndex < 0 || roomIndex >= G.rooms.length) return;

            var room = G.rooms[roomIndex];
            room.cleanliness = Math.min(100, room.cleanliness + 30);

            addFloatingText('清洁+30', getRoomX(roomIndex), getRoomY(roomIndex), '#9C27B0');
        }

        function upgradeRoom(roomIndex) {
            if (roomIndex < 0 || roomIndex >= G.rooms.length) return;

            var room = G.rooms[roomIndex];
            if (room.type >= CONFIG.ROOM_TYPES.length - 1) return;
            if (room.guest !== null) return;

            var nextType = CONFIG.ROOM_TYPES[room.type + 1];
            if (G.money < nextType.upgradeCost) return;

            G.money -= nextType.upgradeCost;
            G.dayExpenses += nextType.upgradeCost;
            room.type++;

            addFloatingText('升级成功!', getRoomX(roomIndex), getRoomY(roomIndex), '#FF9800');

            for (var i = 0; i < 8; i++) {
                addParticle(getRoomX(roomIndex), getRoomY(roomIndex), '#FF9800');
            }
        }

        function evictGuest(roomIndex) {
            if (roomIndex < 0 || roomIndex >= G.rooms.length) return;

            var room = G.rooms[roomIndex];
            if (room.guest === null) return;

            // 根据满意度计算小费
            var tip = 0;
            if (room.guest.satisfaction >= 10) {
                tip = Math.floor(room.guest.money * 0.2);
                G.money += tip;
                G.reputation = Math.min(CONFIG.MAX_REPUTATION, G.reputation + 5);
            }

            if (tip > 0) {
                addFloatingText('小费+' + tip + '文', getRoomX(roomIndex), getRoomY(roomIndex), '#E91E63');
            }

            room.guest = null;
        }

        function triggerRandomEvent() {
            if (Math.random() > 0.4) return null; // 40%概率触发事件

            var eventIndex = Math.floor(Math.random() * CONFIG.EVENTS.length);
            var event = CONFIG.EVENTS[eventIndex];

            // 应用事件效果
            switch (event.effect) {
                case 'income_up':
                    G.incomeBonus = 1 + event.value;
                    break;
                case 'guest_down':
                    var removeCount = Math.floor(G.waitingTravelers.length * event.value);
                    G.waitingTravelers.splice(0, removeCount);
                    break;
                case 'food_bonus':
                    G.foodBonus = event.value;
                    break;
                case 'steal':
                    G.money -= event.value;
                    G.dayExpenses += event.value;
                    break;
                case 'bribe':
                    G.money -= event.value;
                    G.dayExpenses += event.value;
                    break;
                case 'reputation_up':
                    G.reputation = Math.min(CONFIG.MAX_REPUTATION, G.reputation + event.value);
                    break;
                case 'cost_up':
                    G.costBonus = 1 + event.value;
                    break;
            }

            return event;
        }

        function endDay() {
            // 结算当日收入
            G.score += G.dayIncome;

            // 重置日统计
            G.dayIncome = 0;
            G.dayExpenses = 0;

            // 重置事件效果
            G.foodBonus = 1;
            G.incomeBonus = 1;
            G.costBonus = 1;

            // 减少客人停留天数
            for (var i = 0; i < G.rooms.length; i++) {
                var room = G.rooms[i];
                if (room.guest !== null) {
                    room.guest.daysLeft--;
                    if (room.guest.daysLeft <= 0) {
                        evictGuest(i);
                    }
                }
                // 房间自然脏
                room.cleanliness = Math.max(0, room.cleanliness - 10);
            }

            // 进入下一天
            G.day++;

            // 检查游戏结束
            if (G.day > CONFIG.MAX_DAYS) {
                gameOver();
                return;
            }

            // 生成新客人
            generateTravelers();

            // 触发随机事件
            G.currentEvent = triggerRandomEvent();
            if (G.currentEvent) {
                G.state = 'event';
            } else {
                G.state = 'dayEnd';
            }
        }

        function gameOver() {
            G.state = 'gameOver';

            // 更新最高分
            if (G.score > G.highScore) {
                G.highScore = G.score;
                localStorage.setItem('inn_highScore', G.highScore);
            }

            // 添加庆祝粒子
            for (var i = 0; i < 30; i++) {
                addParticle(
                    CONFIG.WIDTH / 2 + (Math.random() - 0.5) * 200,
                    CONFIG.HEIGHT / 2,
                    ['#FFD700', '#FF6B6B', '#4CAF50', '#2196F3'][Math.floor(Math.random() * 4)]
                );
            }
        }

        // ==================== 辅助函数 ====================
        function getRoomX(index) {
            var cols = 3;
            var startX = 50;
            var spacing = 250;
            return startX + (index % cols) * spacing;
        }

        function getRoomY(index) {
            var row = Math.floor(index / 3);
            return 180 + row * 180;
        }

        function addParticle(x, y, color) {
            G.particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 4,
                vy: (Math.random() - 0.5) * 4,
                life: 1,
                color: color,
                size: 3 + Math.random() * 3
            });
        }

        function addFloatingText(text, x, y, color) {
            G.floatingTexts.push({
                text: text,
                x: x,
                y: y,
                life: 1,
                color: color
            });
        }

        function isInRect(x, y, rx, ry, rw, rh) {
            return x >= rx && x <= rx + rw && y >= ry && y <= ry + rh;
        }

        function isInCircle(x, y, cx, cy, r) {
            var dx = x - cx;
            var dy = y - cy;
            return dx * dx + dy * dy <= r * r;
        }

        // ==================== 渲染函数 ====================
        function render() {
            var ctx = G.ctx;
            ctx.save();

            // 根据状态渲染
            switch (G.state) {
                case 'menu':
                    renderMenu();
                    break;
                case 'playing':
                    renderGame();
                    break;
                case 'paused':
                    renderGame();
                    renderPause();
                    break;
                case 'dayEnd':
                    renderGame();
                    renderDayEnd();
                    break;
                case 'event':
                    renderGame();
                    renderEvent();
                    break;
                case 'gameOver':
                    renderGameOver();
                    break;
            }

            ctx.restore();
        }

        function renderMenu() {
            var ctx = G.ctx;

            // 渐变背景
            var gradient = ctx.createLinearGradient(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);
            gradient.addColorStop(0, '#2d1f10');
            gradient.addColorStop(0.5, '#4a3520');
            gradient.addColorStop(1, '#1a1500');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);

            // 装饰性图案
            ctx.fillStyle = 'rgba(255, 215, 0, 0.05)';
            for (var i = 0; i < 20; i++) {
                var x = (i * 137.5 + G.animFrame * 0.2) % CONFIG.WIDTH;
                var y = (i * 89.3 + G.animFrame * 0.1) % CONFIG.HEIGHT;
                ctx.beginPath();
                ctx.arc(x, y, 30 + Math.sin(G.animFrame * 0.02 + i) * 10, 0, Math.PI * 2);
                ctx.fill();
            }

            // 标题
            ctx.fillStyle = '#FFD700';
            ctx.font = 'bold 64px "Microsoft YaHei"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 10;
            ctx.fillText('驿站客栈', CONFIG.WIDTH / 2, 180);
            ctx.shadowBlur = 0;

            // 副标题
            ctx.fillStyle = '#D4A574';
            ctx.font = '24px "Microsoft YaHei"';
            ctx.fillText('古代客栈经营模拟', CONFIG.WIDTH / 2, 240);

            // 描述
            ctx.fillStyle = '#B8956A';
            ctx.font = '16px "Microsoft YaHei"';
            ctx.fillText('接待旅客 · 升级房间 · 经营致富', CONFIG.WIDTH / 2, 280);

            // 开始按钮
            var btnX = CONFIG.WIDTH / 2 - 100;
            var btnY = 350;
            var btnW = 200;
            var btnH = 50;

            ctx.fillStyle = '#8B4513';
            ctx.fillRect(btnX, btnY, btnW, btnH);
            ctx.strokeStyle = '#FFD700';
            ctx.lineWidth = 2;
            ctx.strokeRect(btnX, btnY, btnW, btnH);

            ctx.fillStyle = '#FFD700';
            ctx.font = 'bold 24px "Microsoft YaHei"';
            ctx.fillText('开始经营', CONFIG.WIDTH / 2, btnY + btnH / 2);

            // 最高分
            if (G.highScore > 0) {
                ctx.fillStyle = '#B8956A';
                ctx.font = '16px "Microsoft YaHei"';
                ctx.fillText('最高分: ' + G.highScore, CONFIG.WIDTH / 2, 430);
            }

            // 操作提示
            ctx.fillStyle = '#8B7355';
            ctx.font = '14px "Microsoft YaHei"';
            ctx.fillText('点击或按任意键开始', CONFIG.WIDTH / 2, CONFIG.HEIGHT - 50);

            // 版本信息
            ctx.fillStyle = '#5C4A32';
            ctx.font = '12px "Microsoft YaHei"';
            ctx.fillText('v1.0 | Canvas + 原生JS', CONFIG.WIDTH / 2, CONFIG.HEIGHT - 20);
        }

        function renderGame() {
            var ctx = G.ctx;

            // 背景
            var gradient = ctx.createLinearGradient(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);
            gradient.addColorStop(0, '#3d2b1f');
            gradient.addColorStop(1, '#2d1f10');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);

            // 顶部状态栏
            renderStatusBar();

            // 房间区域
            renderRooms();

            // 等待区域
            renderWaitingArea();

            // 操作按钮
            renderActionButtons();

            // 粒子和浮动文字
            renderParticles();
            renderFloatingTexts();

            // 教程提示
            if (G.showTutorial) {
                renderTutorial();
            }
        }

        function renderStatusBar() {
            var ctx = G.ctx;

            // 状态栏背景
            ctx.fillStyle = 'rgba(0,0,0,0.7)';

        function renderParticles() {
            var ctx = G.ctx;

            for (var i = G.particles.length - 1; i >= 0; i--) {
                var p = G.particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;

                if (p.life <= 0) {
                    G.particles.splice(i, 1);
                    continue;
                }

                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        function renderFloatingTexts() {
            var ctx = G.ctx;

            for (var i = G.floatingTexts.length - 1; i >= 0; i--) {
                var ft = G.floatingTexts[i];
                ft.y -= 1;
                ft.life -= 0.02;

                if (ft.life <= 0) {
                    G.floatingTexts.splice(i, 1);
                    continue;
                }

                ctx.globalAlpha = ft.life;
                ctx.fillStyle = ft.color;
                ctx.font = 'bold 16px "Microsoft YaHei"';
                ctx.textAlign = 'center';
                ctx.fillText(ft.text, ft.x, ft.y);
            }
            ctx.globalAlpha = 1;
        }

        // ==================== 事件处理 ====================
        function bindEvents() {
            var canvas = G.canvas;

            // 鼠标事件
            canvas.addEventListener('mousedown', handleMouseDown);
            canvas.addEventListener('mousemove', handleMouseMove);
            canvas.addEventListener('mouseup', handleMouseUp);

            // 触摸事件
            canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
            canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
            canvas.addEventListener('touchend', handleTouchEnd, { passive: false });

            // 键盘事件
            document.addEventListener('keydown', handleKeyDown);

            // 窗口大小变化
            window.addEventListener('resize', resizeCanvas);
        }

        function getCanvasPos(clientX, clientY) {
            var rect = G.canvas.getBoundingClientRect();
            return {
                x: (clientX - rect.left) * G.scaleX,
                y: (clientY - rect.top) * G.scaleY
            };
        }

        function handleMouseDown(e) {
            var pos = getCanvasPos(e.clientX, e.clientY);
            handleClick(pos.x, pos.y);
        }

        function handleMouseMove(e) {
            var pos = getCanvasPos(e.clientX, e.clientY);
            G.mouseX = pos.x;
            G.mouseY = pos.y;
        }

        function handleMouseUp(e) {
            G.isDragging = false;
            G.dragTraveler = null;
        }

        function handleTouchStart(e) {
            e.preventDefault();
            var touch = e.touches[0];
            var pos = getCanvasPos(touch.clientX, touch.clientY);
            handleClick(pos.x, pos.y);
        }

        function handleTouchMove(e) {
            e.preventDefault();
            var touch = e.touches[0];
            var pos = getCanvasPos(touch.clientX, touch.clientY);
            G.mouseX = pos.x;
            G.mouseY = pos.y;
        }

        function handleTouchEnd(e) {
            e.preventDefault();
            G.isDragging = false;
            G.dragTraveler = null;
        }

        function handleKeyDown(e) {
            if (G.state === 'menu') {
                startGame();
            } else if (G.state === 'playing') {
                if (e.key === 'Escape' || e.key === 'p') {
                    G.state = 'paused';
                } else if (e.key === 'e' || e.key === 'E') {
                    endDay();
                }
            } else if (G.state === 'paused') {
                G.state = 'playing';
            }
        }

        function handleClick(x, y) {
            // 教程界面
            if (G.showTutorial) {
                G.showTutorial = false;
                G.state = 'playing';
                return;
            }

            // 菜单界面
            if (G.state === 'menu') {
                if (isInRect(x, y, CONFIG.WIDTH/2 - 100, 350, 200, 50)) {
                    startGame();
                }
                return;
            }

            // 游戏结束界面
            if (G.state === 'gameOver') {
                if (isInRect(x, y, CONFIG.WIDTH/2 - 80, 470, 160, 45)) {
                    resetGame();
                    G.state = 'playing';
                }
                return;
            }

            // 暂停界面
            if (G.state === 'paused') {
                G.state = 'playing';
                return;
            }

            // 日结束界面
            if (G.state === 'dayEnd') {
                G.state = 'playing';
                return;
            }

            // 事件界面
            if (G.state === 'event') {
                G.currentEvent = null;
                G.state = 'playing';
                return;
            }

            // 游戏界面

            // 检查暂停按钮
            if (isInRect(x, y, CONFIG.WIDTH - 80, 35, 60, 25)) {
                G.state = 'paused';
                return;
            }

            // 检查等待的旅客
            for (var i = 0; i < G.waitingTravelers.length; i++) {
                var traveler = G.waitingTravelers[i];
                if (traveler.assigned) continue;

                var tx = 100 + i * 140;
                var ty = 450;

                if (isInRect(x, y, tx - 40, ty - 30, 80, 60)) {
                    G.selectedTraveler = i;
                    return;
                }
            }

            // 检查房间
            for (var i = 0; i < G.rooms.length; i++) {
                var room = G.rooms[i];
                var rx = getRoomX(i);
                var ry = getRoomY(i);

                if (isInRect(x, y, rx - 110, ry - 75, 220, 150)) {
                    // 如果已选中旅客，尝试分配
                    if (G.selectedTraveler >= 0 && room.guest === null) {
                        assignTravelerToRoom(G.selectedTraveler, i);
                        G.selectedTraveler = -1;
                    } else {
                        G.selectedRoom = i;
                    }
                    return;
                }
            }

            // 检查操作按钮
            var btnY = 530;
            if (isInRect(x, y, 50, btnY, 100, 35)) {
                // 提供餐食
                if (G.selectedRoom >= 0) {
                    showFoodMenu(G.selectedRoom);
                }
                return;
            }
            if (isInRect(x, y, 200, btnY, 100, 35)) {
                // 打扫房间
                if (G.selectedRoom >= 0) {
                    cleanRoom(G.selectedRoom);
                }
                return;
            }
            if (isInRect(x, y, 350, btnY, 100, 35)) {
                // 升级房间
                if (G.selectedRoom >= 0) {
                    upgradeRoom(G.selectedRoom);
                }
                return;
            }
            if (isInRect(x, y, 500, btnY, 100, 35)) {
                // 请离客人
                if (G.selectedRoom >= 0) {
                    evictGuest(G.selectedRoom);
                }
                return;
            }
            if (isInRect(x, y, 650, btnY, 100, 35)) {
                // 结束今天
                endDay();
                return;
            }
        }

        function showFoodMenu(roomIndex) {
            var room = G.rooms[roomIndex];
            if (!room.guest) return;

            // 简单实现：提供默认餐食
            serveFood(roomIndex, 1); // 家常小菜
        }

        function startGame() {
            resetGame();
            G.state = 'playing';
            generateTravelers();
        }

        // ==================== 游戏循环 ====================
        function gameLoop(timestamp) {
            // 计算deltaTime
            if (!G.lastTime) G.lastTime = timestamp;
            G.deltaTime = (timestamp - G.lastTime) / 1000;
            G.lastTime = timestamp;

            // 限制deltaTime防止跳帧
            if (G.deltaTime > 0.1) G.deltaTime = 0.1;

            // 更新动画帧
            G.animFrame++;

            // 渲染
            render();

            // 继续循环
            requestAnimationFrame(gameLoop);
        }

        // ==================== 启动游戏 ====================
        window.onload = initGame;

        // 音效支持
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq = 440, duration = 0.1) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
