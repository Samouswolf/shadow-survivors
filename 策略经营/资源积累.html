<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>资源积累</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; overflow: hidden; }
        .game-container { width: 100%; height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        
        .header { display: flex; justify-content: space-around; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 10px; }
        .resource { display: flex; flex-direction: column; align-items: center; color: #fff; }
        .resource-icon { font-size: 28px; }
        .resource-value { font-size: 20px; font-weight: bold; }
        
        .main-area { flex: 1; display: flex; flex-direction: column; }
        .resource-bar { flex: 1; background: rgba(255,255,255,0.05); border-radius: 15px; margin-bottom: 10px; padding: 15px; overflow-y: auto; }
        
        .producer { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 12px; margin-bottom: 10px; }
        .producer-left { display: flex; align-items: center; gap: 15px; }
        .producer-icon { width: 50px; height: 50px; background: linear-gradient(135deg, #4ecdc4, #44a08d); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .producer-info { color: #fff; }
        .producer-name { font-size: 16px; font-weight: bold; }
        .producer-rate { font-size: 12px; opacity: 0.8; }
        
        .producer-right { text-align: right; }
        .producer-count { font-size: 20px; font-weight: bold; color: #4ecdc4; }
        .btn-upgrade { padding: 8px 16px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 15px; font-size: 12px; cursor: pointer; }
        .btn-upgrade:disabled { opacity: 0.5; }
        
        .panel { width: 100%; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-top: 10px; }
        .stats { display: flex; justify-content: space-around; color: #fff; font-size: 14px; }
        
        .message { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); color: #fff; padding: 20px 40px; border-radius: 15px; font-size: 20px; display: none; z-index: 100; }
        .message.show { display: block; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 10px; font-size: 14px; }
    /* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */
/* [BATCH-FIX:ad-components-css] */
.sponsor-btn{position:fixed;bottom:8px;left:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:2px 6px;border-radius:10px;font:10px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.sponsor-panel.show{display:flex}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.interstitial-ad.show{display:flex}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* [/BATCH-FIX:ad-components-css] */

/* [AD-FIX:responsive] */
@media (max-width:768px){.ad-banner-container{display:none!important}.sponsor-btn{transform:scale(.8);opacity:.6}}
/* [/AD-FIX:responsive] */
</style>
</head>
<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="resource">
                <div class="resource-icon">💰</div>
                <div class="resource-value" id="gold">0</div>
            </div>
            <div class="resource">
                <div class="resource-icon">💎</div>
                <div class="resource-value" id="gems">0</div>
            </div>
            <div class="resource">
                <div class="resource-icon">⚡</div>
                <div class="resource-value" id="energy">100</div>
            </div>
            <div class="resource">
                <div class="resource-icon">⭐</div>
                <div class="resource-value" id="prestige">0</div>
            </div>
        </div>
        
        <div class="main-area">
            <div class="resource-bar" id="goldBar">
                <h3 style="color: #fff; margin-bottom: 15px; font-size: 18px;">💰 金币生产</h3>
            </div>
            <div class="resource-bar" id="gemBar">
                <h3 style="color: #fff; margin-bottom: 15px; font-size: 18px;">💎 宝石生产</h3>
            </div>
        </div>
        
        <div class="panel">
            <div class="stats">
                <div>金币/秒: <span id="goldPerSec">0</span></div>
                <div>宝石/秒: <span id="gemPerSec">0</span></div>
                <div>总生产: <span id="totalProduced">0</span></div>
            </div>
        </div>
        
        <div class="message" id="message"></div>
        
        
    </div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script>
        const PRODUCERS = [
            { id: 'gold1', name: '金矿', emoji: '⛏️', type: 'gold', baseRate: 1, baseCost: 100 },
            { id: 'gold2', name: '农场', emoji: '🌾', type: 'gold', baseRate: 5, baseCost: 500 },
            { id: 'gold3', name: '工厂', emoji: '🏭', type: 'gold', baseRate: 20, baseCost: 2000 },
            { id: 'gold4', name: '银行', emoji: '🏦', type: 'gold', baseRate: 100, baseCost: 10000 },
            { id: 'gold5', name: '交易所', emoji: '💹', type: 'gold', baseRate: 500, baseCost: 50000 },
            
            { id: 'gem1', name: '宝石矿', emoji: '💠', type: 'gem', baseRate: 0.1, baseCost: 500 },
            { id: 'gem2', name: '水晶洞', emoji: '🕳️', type: 'gem', baseRate: 0.5, baseCost: 2500 },
            { id: 'gem3', name: '魔法泉', emoji: '✨', type: 'gem', baseRate: 2, baseCost: 10000 },
            { id: 'gem4', name: '炼金炉', emoji: '⚗️', type: 'gem', baseRate: 10, baseCost: 50000 },
            { id: 'gem5', name: '钻石矿', emoji: '💠', type: 'gem', baseRate: 50, baseCost: 250000 }
        ];
        
        let gold = 0;
        let gems = 0;
        let energy = 100;
        let prestige = 0;
        let totalProduced = 0;
        
        let counts = {};
        PRODUCERS.forEach(p => counts[p.id] = 0);
        
        const goldBar = document.getElementById('goldBar');
        const gemBar = document.getElementById('gemBar');
        const messageEl = document.getElementById('message');
        
        function renderProducers() {
            goldBar.innerHTML = '<h3 style="color: #fff; margin-bottom: 15px; font-size: 18px;">💰 金币生产</h3>';
            gemBar.innerHTML = '<h3 style="color: #fff; margin-bottom: 15px; font-size: 18px;">💎 宝石生产</h3>';
            
            PRODUCERS.forEach(p => {
                const el = document.createElement('div');
                el.className = 'producer';
                
                const rate = p.baseRate * counts[p.id];
                const cost = Math.floor(p.baseCost * Math.pow(1.5, counts[p.id]));
                
                el.innerHTML = `
                    <div class="producer-left">
                        <div class="producer-icon">${p.emoji}</div>
                        <div class="producer-info">
                            <div class="producer-name">${p.name}</div>
                            <div class="producer-rate">${rate.toFixed(1)}/${p.type === 'gold' ? '秒' : '10秒'}</div>
                        </div>
                    </div>
                    <div class="producer-right">
                        <div class="producer-count">x${counts[p.id]}</div>
                        <button class="btn-upgrade" onclick="upgrade('${p.id}')" ${getCurrency(p.type) < cost ? 'disabled' : ''}>
                            ${p.type === 'gold' ? '💰' : '💎'} ${cost}
                        </button>
                    </div>
                `;
                
                if (p.type === 'gold') {
                    goldBar.appendChild(el);
                } else {
                    gemBar.appendChild(el);
                }
            });
        }
        
        function getCurrency(type) {
            return type === 'gold' ? gold : gems;
        }
        
        function upgrade(id) {
            const p = PRODUCERS.find(x => x.id === id);
            const cost = Math.floor(p.baseCost * Math.pow(1.5, counts[id]));
            
            if (getCurrency(p.type) < cost) {
                showMessage('资源不足！');
                return;
            }
            
            if (p.type === 'gold') {
                gold -= cost;
            } else {
                gems -= cost;
            }
            
            counts[id]++;
            
            updateStats();
            renderProducers();
            showMessage(`升级了${p.name}！`);
        }
        
        function updateStats() {
            document.getElementById('gold').textContent = Math.floor(gold);
            document.getElementById('gems').textContent = gems.toFixed(1);
            document.getElementById('energy').textContent = Math.floor(energy);
            document.getElementById('prestige').textContent = prestige;
            
            let goldPerSec = 0;
            let gemPerSec = 0;
            
            PRODUCERS.forEach(p => {
                const rate = p.baseRate * counts[p.id];
                if (p.type === 'gold') {
                    goldPerSec += rate;
                } else {
                    gemPerSec += rate / 10;
                }
            });
            
            document.getElementById('goldPerSec').textContent = goldPerSec.toFixed(1);
            document.getElementById('gemPerSec').textContent = gemPerSec.toFixed(2);
            document.getElementById('totalProduced').textContent = Math.floor(totalProduced);
        }
        
        function showMessage(msg) {
            messageEl.textContent = msg;
            messageEl.classList.add('show');
            setTimeout(() => messageEl.classList.remove('show'), 2000);
        }
        
        setInterval(() => {
            let goldGain = 0;
            let gemGain = 0;
            
            PRODUCERS.forEach(p => {
                const rate = p.baseRate * counts[p.id];
                if (p.type === 'gold') {
                    goldGain += rate;
                } else {
                    gemGain += rate / 10;
                }
            });
            
            gold += goldGain;
            gems += gemGain;
            totalProduced += goldGain + gemGain * 10;
            
            if (energy < 100) {
                energy += 0.5;
            }
            
            if (gold >= 100000 && gems >= 100) {
                prestige++;
                gold -= 100000;
                gems -= 100;
                showMessage('获得声望！');
            }
            
            updateStats();
            renderProducers();
        }, 1000);
        
        updateStats();
        renderProducers();
    </script>
<!-- [BATCH-FIX:responsive-js] -->
<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>
<!-- [/BATCH-FIX:responsive-js] -->
<!-- [BATCH-FIX:touch-support] -->
<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>
<!-- [/BATCH-FIX:touch-support] -->

</div>

    <p style="color:#ccc;font:16px 'Microsoft YaHei',sans-serif;margin-bottom:16px">广告加载中...</p>

  </div>
</div>

    if (btn) btn.style.display = '';
  });

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
</body>
