<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>保龄球大师</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#2b2d42;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:"Microsoft YaHei",sans-serif}
canvas{display:block;margin:0 auto}
#start-game-btn{display:block!important;}
.sponsor-close,#sponsorClose,.skip-btn,#skipInterstitial{pointer-events:auto!important;}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);height:90px;max-height:90px;overflow:hidden;contain:layout style paint;pointer-events:none!important}.ad-banner-container,.ad-banner-container *{pointer-events:none!important}
.ad-label{position:absolute;top:1px;right:6px;font:9px "Microsoft YaHei",sans-serif;color:rgba(255,255,255,.35)}
.sponsor-btn{position:fixed;top:44px;right:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:3px 9px;border-radius:10px;font:11px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .qr-row{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.sponsor-panel .qr-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px;text-align:center;min-width:140px}
.sponsor-panel .qr-card .qr-icon{font-size:48px;margin-bottom:6px}
.sponsor-panel .qr-card .qr-label{color:#ccc;font:13px "Microsoft YaHei",sans-serif}
.sponsor-panel .qr-card .qr-hint{color:#888;font:11px "Microsoft YaHei",sans-serif;margin-top:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.interstitial-ad .ad-content{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;text-align:center;min-width:280px;max-width:400px}
.interstitial-ad .ad-content p{color:#aaa;font:14px "Microsoft YaHei",sans-serif;margin-bottom:12px}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */
</style>
</head>
<body>
<button id="start-game-btn" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:20px 40px;font-size:20px;background:#06d6a0;color:white;border:none;border-radius:12px;cursor:pointer;z-index:999;font-weight:bold;display:none;">开始游戏</button>
<canvas id="c"></canvas>
<script>
if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
</script>
<script src="../game_core.js"></script>
<script>
(function(){
"use strict";
const W=480,H=720;
const BALL_R=14;
const PIN_R=10;
const LANE_L=W/2-120,LANE_R=W/2+120;
const PIN_ROW_Y=140;
const FRICTION=0.985;
const FRICTION_SIDE=0.97;
const PIN_SPACING_X=28,PIN_SPACING_Y=24;
let audioCtx=null;
function initAudio(){if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();}
function playTone(freq,dur,type,vol){
    if(!audioCtx)return;try{
        const o=audioCtx.createOscillator(),g=audioCtx.createGain();
        o.type=type||'square';o.frequency.value=freq;
        g.gain.value=vol||0.15;g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
        o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur);
    }catch(e){}
}
function sfxRoll(){playTone(80,0.05,'sawtooth',0.06)}
function sfxStrike(){
    playTone(200,0.08,'square',0.18);setTimeout(()=>playTone(150,0.1,'sawtooth',0.2),60);
    setTimeout(()=>playTone(523,0.15,'sine',0.2),140);setTimeout(()=>playTone(659,0.15,'sine',0.2),240);
    setTimeout(()=>playTone(784,0.25,'sine',0.22),340);
}
function sfxHit(){playTone(180,0.06,'square',0.18)}
function sfxSpare(){playTone(440,0.1,'sine',0.2);setTimeout(()=>playTone(659,0.2,'sine',0.2),100)}
function sfxBump(){playTone(120,0.05,'sawtooth',0.12)}
function sfxBtn(){playTone(600,0.06,'sine',0.1)}
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let scale=1;
function resize(){const r=W/H;let cw=window.innerWidth,ch=window.innerHeight;if(cw/ch>r)ch=cw/r;else cw=ch*r;canvas.width=cw;canvas.height=ch;scale=cw/W;ctx.setTransform(scale,0,0,scale,0,0);}
window.addEventListener('resize',resize);resize();
function Pin(x,y,id){this.x=x;this.y=y;this.baseY=y;this.id=id;this.vx=0;this.vy=0;this.vr=0;this.r=0;this.standing=true;this.z=0;}
Pin.prototype.update=function(){
    if(!this.standing){
        this.vx*=FRICTION_SIDE;this.vy*=FRICTION_SIDE;this.vr*=0.95;
        this.x+=this.vx;this.y+=this.vy;this.r+=this.vr;
        this.z-=0.15;if(this.z<0)this.z=0;
        if(this.x<LANE_L+10){this.x=LANE_L+10;this.vx*=-0.4;sfxBump();}
        if(this.x>LANE_R-10){this.x=LANE_R-10;this.vx*=-0.4;sfxBump();}
    }
};
Pin.prototype.hit=function(vx,vy){
    if(!this.standing)return;
    const p=Math.hypot(vx,vy);
    if(p<1.2)return;
    this.standing=false;
    this.vx=vx*0.7+(Math.random()-0.5)*4;
    this.vy=vy*0.6+(Math.random()-0.5)*3;
    this.vr=(Math.random()-0.5)*0.5;
    this.z=0.5;
    sfxHit();
};
Pin.prototype.draw=function(ctx){
    if(!this.standing){
        ctx.save();ctx.translate(this.x,this.y+this.z*10);ctx.rotate(this.r);
        const col='#e9c46a';
        ctx.fillStyle=col;ctx.fillRect(-8,-6,16,18);
        ctx.beginPath();ctx.arc(0,-8,9,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#e76f51';ctx.fillRect(-7,0,14,3);ctx.fillRect(-7,8,14,3);
        ctx.strokeStyle='#8b5a2b';ctx.lineWidth=1;ctx.strokeRect(-8,-6,16,18);
        ctx.restore();
        return;
    }
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.beginPath();ctx.ellipse(this.x,this.y+12,PIN_R*0.9,PIN_R*0.25,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#e9c46a';
    ctx.beginPath();ctx.moveTo(this.x-8,this.y-20);ctx.quadraticCurveTo(this.x-12,this.y-5,this.x-7,this.y+12);
    ctx.lineTo(this.x+7,this.y+12);ctx.quadraticCurveTo(this.x+12,this.y-5,this.x+8,this.y-20);
    ctx.quadraticCurveTo(this.x,this.y-28,this.x-8,this.y-20);ctx.fill();
    ctx.strokeStyle='#b08968';ctx.lineWidth=1.2;ctx.stroke();
    ctx.fillStyle='#e76f51';
    ctx.fillRect(this.x-7,this.y-10,14,2);ctx.fillRect(this.x-7,this.y-2,14,2);ctx.fillRect(this.x-7,this.y+4,14,2);
    ctx.fillStyle='#f8f9fa';ctx.beginPath();ctx.arc(this.x,this.y-18,6,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#b08968';ctx.lineWidth=1;ctx.stroke();
};
function createPins(){
    const pins=[];const rows=[1,2,3,4];let id=0;
    const startX=W/2,startY=PIN_ROW_Y;
    for(let r=0;r<4;r++){
        const cnt=rows[r];
        const firstX=startX-(cnt-1)*PIN_SPACING_X/2;
        for(let c=0;c<cnt;c++){
            pins.push(new Pin(firstX+c*PIN_SPACING_X,startY-r*PIN_SPACING_Y,id++));
        }
    }
    return pins;
}
function Ball(){this.reset()}
Ball.prototype.reset=function(){
    this.x=W/2;this.y=H-90;this.vx=0;this.vy=0;this.rolling=false;this.spin=0;this.rot=0;
}
Ball.prototype.throw=function(vx,vy,spin){
    this.vx=vx;this.vy=-vy;this.spin=spin;this.rolling=true;
    sfxRoll();
}
Ball.prototype.update=function(pins){
    if(!this.rolling)return;
    this.vy*=FRICTION;this.vx+=(this.spin)*0.025;
    this.vx*=FRICTION_SIDE;
    if(this.y<PIN_ROW_Y-80){this.vy*=0.98;}
    this.x+=this.vx;this.y+=this.vy;
    this.rot+=this.vy*0.06+this.vx*0.05;
    if(Math.abs(this.vx)<0.1&&Math.abs(this.vy)<0.4){this.rolling=false;}
    if(this.x<LANE_L+BALL_R){this.x=LANE_L+BALL_R;this.vx*=-0.45;sfxBump();}
    if(this.x>LANE_R-BALL_R){this.x=LANE_R-BALL_R;this.vx*=-0.45;sfxBump();}
    for(const pin of pins){
        if(!pin.standing)continue;
        const d=Math.hypot(this.x-pin.x,this.y-pin.y);
        if(d<PIN_R+BALL_R){
            const ang=Math.atan2(pin.y-this.y,pin.x-this.x);
            const pv=Math.hypot(this.vx,this.vy)*1.1;
            pin.hit(Math.cos(ang)*pv+this.vx*0.5,Math.sin(ang)*pv+this.vy*0.4);
            this.vx*=0.85;this.vy*=0.85;
        }
    }
    if(this.y<60){this.y=60;this.vy=-this.vy*0.2;this.rolling=false;}
};
Ball.prototype.draw=function(ctx){
    const s=Math.max(0.5,1-this.y*0.0008);
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.beginPath();ctx.ellipse(this.x,this.y+BALL_R+4,BALL_R*1.1*s,BALL_R*0.35*s,0,0,Math.PI*2);ctx.fill();
    ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.rot);
    const grad=ctx.createRadialGradient(-4,-4,2,0,0,BALL_R+1);
    grad.addColorStop(0,'#4a4e69');grad.addColorStop(1,'#22223b');
    ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,BALL_R,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#06d6a0';ctx.beginPath();ctx.arc(-5,-6,3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ef476f';ctx.beginPath();ctx.arc(5,-3,2.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffd166';ctx.beginPath();ctx.arc(2,5,2.8,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#118ab2';ctx.beginPath();ctx.arc(-4,4,2.5,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#000';ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,0,BALL_R,0,Math.PI*2);ctx.stroke();
    ctx.restore();
};
const G={
    state:STATE_MENU,score:0,highScore:0,
    frame:1,roll:1,frameScores:[],total:[],
    pins:[],ball:null,
    keys:{},ptrX:W/2,ptrAim:0,ptrDown:false,ptrTap:0,aimX:W/2,power:0,powerDir:1,
    charging:false,spin:0,
    btnRects:{},paused:false,
    msg:'',msgLife:0,resultTimer:0,strikeAnim:0,spareAnim:0,splitFrame:false,savedScore:0,
    awaitingSecond:false
};
G.highScore=parseInt(Storage.load('bowling_high','0'));
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
function drawBtn(ctx,x,y,w,h,text,name,color){
    G.btnRects[name]={x,y,w,h};
    ctx.fillStyle=color||'#06d6a0';ctx.strokeStyle='#fff';ctx.lineWidth=2;
    roundRect(ctx,x,y,w,h,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold 18px "Microsoft YaHei"';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(text,x+w/2,y+h/2);ctx.textBaseline='alphabetic';
}
function hitBtn(p,name){const r=G.btnRects[name];return r&&p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;}
function getPos(e){const rect=canvas.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:(t.clientX-rect.left)/scale,y:(t.clientY-rect.top)/scale};}
window.addEventListener('keydown',function(e){
    G.keys[e.key.toLowerCase()]=true;
    if(e.key===' '){e.preventDefault();if(G.state===STATE_PLAYING&&!G.paused&&!G.ball.rolling){
        if(!G.charging){G.charging=true;G.power=0;G.powerDir=1;}
        else{doThrow();}
    }}
    if(e.key==='ArrowLeft'||e.key==='a'){if(!G.ball.rolling)G.aimX=Math.max(LANE_L+BALL_R+5,G.aimX-4);}
    if(e.key==='ArrowRight'||e.key==='d'){if(!G.ball.rolling)G.aimX=Math.min(LANE_R-BALL_R-5,G.aimX+4);}
    if(e.key==='q'||e.key==='Q'){if(!G.ball.rolling)G.spin=Math.max(-3,G.spin-0.4);}
    if(e.key==='e'||e.key==='E'){if(!G.ball.rolling)G.spin=Math.min(3,G.spin+0.4);}
    if(e.key==='Escape'){if(G.state===STATE_PLAYING)togglePause();}
    initAudio();
});
window.addEventListener('keyup',function(e){G.keys[e.key.toLowerCase()]=false;});
function handlePointerDown(e){
    initAudio();const p=getPos(e);G.ptrDown=true;G.ptrTap=Date.now();G.ptrAim=p.x;
    if(G.state===STATE_MENU){if(hitBtn(p,'start')){startGame();return;}}
    else if(G.state===STATE_OVER){if(hitBtn(p,'restart')){startGame();return;}if(hitBtn(p,'menu')){G.state=STATE_MENU;return;}}
    else if(G.state===STATE_PLAYING&&!G.paused&&!G.ball.rolling&&G.resultTimer<=0){
        if(p.y>H-250){G.aimX=Math.max(LANE_L+BALL_R+5,Math.min(LANE_R-BALL_R-5,p.x));G.charging=true;G.power=0;G.powerDir=1;}
    }
}
function handlePointerMove(e){
    if(G.ptrDown&&G.state===STATE_PLAYING){
        const p=getPos(e);
        if(!G.ball.rolling){
            if(p.y>H-250){G.aimX=Math.max(LANE_L+BALL_R+5,Math.min(LANE_R-BALL_R-5,p.x));
                const dy=H-150-p.y;G.power=Math.max(0,Math.min(100,dy*0.9));
                G.spin=(p.x-G.aimX)*0.05;G.spin=Math.max(-3,Math.min(3,G.spin));
            }
        }
    }
}
function handlePointerUp(e){
    if(!G.ptrDown)return;G.ptrDown=false;
    if(G.state===STATE_PLAYING&&!G.paused&&G.charging){doThrow();}
}
canvas.addEventListener('mousedown',handlePointerDown);canvas.addEventListener('mousemove',handlePointerMove);canvas.addEventListener('mouseup',handlePointerUp);
canvas.addEventListener('touchstart',function(e){e.preventDefault();handlePointerDown(e);},{passive:false});
canvas.addEventListener('touchmove',function(e){e.preventDefault();handlePointerMove(e);},{passive:false});
canvas.addEventListener('touchend',function(e){e.preventDefault();handlePointerUp(e);},{passive:false});
function doThrow(){
    if(G.ball.rolling)return;
    const p=Math.max(4,Math.min(15,G.power*0.14+4));
    G.ball.x=G.aimX;G.ball.throw(G.spin*0.4,p,G.spin);G.charging=false;
}
function startGame(){
    initAudio();G.state=STATE_PLAYING;
    G.score=0;G.frame=1;G.roll=1;G.frameScores=[];G.total=[];
    G.pins=createPins();G.ball=new Ball();
    G.charging=false;G.aimX=W/2;G.power=0;G.spin=0;G.paused=false;
    G.msg='';G.msgLife=0;G.resultTimer=0;G.strikeAnim=0;G.spareAnim=0;G.savedScore=0;G.awaitingSecond=false;
    for(let i=0;i<10;i++){G.frameScores.push([-1,-1]);G.total.push(-1);}
    sfxBtn();
}
function togglePause(){G.paused=!G.paused;sfxBtn();}
function countStanding(pins){let c=0;for(const p of pins)if(p.standing)c++;return c;}
function settleRoll(){
    const scored=10-countStanding(G.pins);
    const f=G.frame-1;
    if(G.roll===1){
        G.frameScores[f][0]=scored;
        if(scored===10){
            G.msg='STRIKE! 全中!';G.msgLife=120;G.strikeAnim=60;sfxStrike();
            G.savedScore=10;
            if(G.frame<10){nextFrame();}else{G.awaitingSecond=true;G.roll=2;G.pins=createPins();G.ball.reset();}
        }else{
            G.roll=2;G.awaitingSecond=true;G.resultTimer=50;
            if(scored===0){G.msg='Gutter! 洗沟';G.msgLife=50;}
            G.ball.reset();G.ball.x=G.aimX;
        }
    }else{
        G.frameScores[f][1]=scored;
        const total1=(G.frameScores[f][0]<0?0:G.frameScores[f][0]);
        const total2=(G.frameScores[f][1]<0?0:G.frameScores[f][1]);
        if(total1+total2===10&&total1<10){G.msg='SPARE! 补中!';G.msgLife=120;G.spareAnim=60;sfxSpare();}
        else if(scored===0&&G.frameScores[f][0]===0){G.msg='双洗沟 Open!';G.msgLife=50;}
        if(G.frame===10){
            if(total1===10||(total1+total2===10&&total1<10)){
                if(G.roll===2){
                    G.roll=3;G.pins=createPins();G.ball.reset();G.awaitingSecond=true;
                    if(total1===10){G.msg='奖励投掷!';G.msgLife=60;}
                }else{G.endGameFlag=true;calcTotals();}
            }else{G.endGameFlag=true;calcTotals();}
        }else{nextFrame();}
    }
}
function nextFrame(){
    G.frame++;G.roll=1;G.awaitingSecond=false;G.resultTimer=60;
    G.pins=createPins();G.ball.reset();G.ball.x=G.aimX;
    calcTotals();
}
function calcTotals(){
    let t=0;
    for(let f=0;f<10;f++){
        const a=G.frameScores[f][0],b=G.frameScores[f][1];
        if(a<0){G.total[f]=-1;break;}
        let add=a+(b<0?0:b);
        if(a===10){
            const n1=G.frameScores[f+1]?G.frameScores[f+1][0]:-1;
            let n2=-1;
            if(G.frameScores[f+1]&&G.frameScores[f+1][0]===10&&G.frameScores[f+2]){n2=G.frameScores[f+2][0];}
            else if(G.frameScores[f+1]){n2=G.frameScores[f+1][1];}
            if(f===9){
                if(G.frameScores[9][1]<0){G.total[f]=-1;continue;}
                const bonus=G.frameScores[9][2]||0;
                add=10+(G.frameScores[9][1]<0?0:G.frameScores[9][1])+bonus;
            }else if(n1>=0&&n2>=0){add=10+n1+n2;}else{G.total[f]=-1;continue;}
        }else if(a+(b<0?0:b)===10){
            const n1=G.frameScores[f+1]?G.frameScores[f+1][0]:-1;
            if(f===9){const bonus=G.frameScores[9][2]||0;add=10+bonus;}
            else if(n1>=0){add=10+n1;}else{G.total[f]=-1;continue;}
        }else if(b<0){G.total[f]=-1;continue;}
        t+=add;G.total[f]=t;
    }
    if(G.total[9]>0)G.score=G.total[9];
}
function endGame(){
    G.state=STATE_OVER;
    calcTotals();if(G.total[9]>0)G.score=G.total[9];
    if(G.score>G.highScore){G.highScore=G.score;Storage.save('bowling_high',G.highScore);}
}
function update(){
    if(G.state!==STATE_PLAYING||G.paused)return;
    if(G.msgLife>0)G.msgLife--;
    if(G.strikeAnim>0)G.strikeAnim--;if(G.spareAnim>0)G.spareAnim--;
    if(G.resultTimer>0){G.resultTimer--;
        if(G.resultTimer<=0&&!G.ball.rolling){
            if(G.endGameFlag){endGameFlagReset();endGame();return;}
        }
    }
    if(G.charging){G.power+=G.powerDir*1.2;if(G.power>=100)G.powerDir=-1;if(G.power<=0)G.powerDir=1;}
    if(G.ball.rolling){G.ball.update(G.pins);
        if(Date.now()%6<2)sfxRoll();
