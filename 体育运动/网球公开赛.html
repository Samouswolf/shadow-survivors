<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>网球公开赛</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1b4332;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:"Microsoft YaHei",sans-serif}
canvas{display:block;margin:0 auto}
#start-game-btn{display:block!important;}
.sponsor-close,#sponsorClose,.skip-btn,#skipInterstitial{pointer-events:auto!important;}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);height:90px;max-height:90px;overflow:hidden;contain:layout style paint;pointer-events:none!important}.ad-banner-container,.ad-banner-container *{pointer-events:none!important}.ad-banner-container iframe{max-height:90px;pointer-events:none!important}
.ad-label{position:absolute;top:1px;right:6px;font:9px "Microsoft YaHei",sans-serif;color:rgba(255,255,255,.35)}
.sponsor-btn{position:fixed;top:44px;right:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:3px 9px;border-radius:10px;font:11px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .qr-row{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.sponsor-panel .qr-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px;text-align:center;min-width:140px}
.sponsor-panel .qr-card .qr-icon{font-size:48px;margin-bottom:6px}
.sponsor-panel .qr-card .qr-label{color:#ccc;font:13px "Microsoft YaHei",sans-serif}
.sponsor-panel .qr-card .qr-hint{color:#888;font:11px "Microsoft YaHei",sans-serif;margin-top:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.interstitial-ad .ad-content{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;text-align:center;min-width:280px;max-width:400px}
.interstitial-ad .ad-content p{color:#aaa;font:14px "Microsoft YaHei",sans-serif;margin-bottom:12px}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */
</style>
</head>
<body>
<button id="start-game-btn" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:20px 40px;font-size:20px;background:#2d6a4f;color:white;border:none;border-radius:12px;cursor:pointer;z-index:999;font-weight:bold;display:none;">开始游戏</button>
<canvas id="c"></canvas>
<script>
if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
</script>
<script src="../game_core.js"></script>
<script>
(function(){
"use strict";
const W=480,H=720;
const NET_Y=H/2;
const COURT_L=50,COURT_R=W-50;
const GRAVITY=0.22;
const BOUNCE=0.78;
const BALL_R=7;
let audioCtx=null;
function initAudio(){if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();}
function playTone(freq,dur,type,vol){
    if(!audioCtx)return;try{
        const o=audioCtx.createOscillator(),g=audioCtx.createGain();
        o.type=type||'square';o.frequency.value=freq;
        g.gain.value=vol||0.15;g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
        o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur);
    }catch(e){}
}
function sfxHit(){playTone(350,0.06,'square',0.15)}
function sfxBounce(){playTone(180,0.04,'sine',0.08)}
function sfxScore(){playTone(523,0.1,'sine',0.2);setTimeout(()=>playTone(659,0.12,'sine',0.2),100);setTimeout(()=>playTone(784,0.2,'sine',0.2),220)}
function sfxMiss(){playTone(120,0.25,'sawtooth',0.18)}
function sfxBtn(){playTone(600,0.06,'sine',0.1)}
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let scale=1;
function resize(){const r=W/H;let cw=window.innerWidth,ch=window.innerHeight;if(cw/ch>r)ch=cw/r;else cw=ch*r;canvas.width=cw;canvas.height=ch;scale=cw/W;ctx.setTransform(scale,0,0,scale,0,0);}
window.addEventListener('resize',resize);resize();
function Ball(){this.reset()}
Ball.prototype.reset=function(){
    this.x=W/2;this.y=80;
    this.vx=(Math.random()-0.5)*3;this.vy=1;this.vz=5;
    this.z=0;this.bounced=false;this.side='ai';
    this.spin=(Math.random()-0.5)*0.08;
}
Ball.prototype.update=function(){
    this.vz-=GRAVITY;this.x+=this.vx;this.y+=this.vy;this.z+=this.vz;
    this.vx+=this.spin;
    if(this.z<=0){this.z=0;this.vz=-this.vz*BOUNCE;this.vx*=0.9;this.vy*=0.92;this.bounced=true;sfxBounce();if(Math.abs(this.vz)<0.6)this.vz=0;}
    if(this.x<COURT_L+BALL_R){this.x=COURT_L+BALL_R;this.vx*=-0.8}
    if(this.x>COURT_R-BALL_R){this.x=COURT_R-BALL_R;this.vx*=-0.8}
}
Ball.prototype.draw=function(ctx){
    const s=Math.max(0.4,1-this.z*0.006);
    ctx.fillStyle='rgba(0,0,0,0.35)';
    ctx.beginPath();ctx.ellipse(this.x,this.y+4,BALL_R*1.4*s,BALL_R*0.4*s,0,0,Math.PI*2);ctx.fill();
    const dy=this.y-this.z*1.2;
    ctx.fillStyle='#c9e265';
    ctx.beginPath();ctx.arc(this.x,dy,BALL_R,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#7a9e1e';ctx.lineWidth=1;ctx.stroke();
    ctx.strokeStyle='#7a9e1e';ctx.lineWidth=0.8;
    ctx.beginPath();ctx.moveTo(this.x-BALL_R*0.8,dy);ctx.quadraticCurveTo(this.x,dy-BALL_R*0.4,this.x+BALL_R*0.8,dy);ctx.stroke();
    ctx.beginPath();ctx.moveTo(this.x,dy-BALL_R*0.8);ctx.quadraticCurveTo(this.x+BALL_R*0.4,dy,this.x,dy+BALL_R*0.8);ctx.stroke();
}
function Player(){
    this.x=W/2;this.y=H-100;this.w=28;this.h=55;
    this.speed=0;this.swing=0;this.swingType=0;
}
Player.prototype.update=function(keys){
    let sp=4.2;
    if(keys['a']||keys['arrowleft'])this.x-=sp;
    if(keys['d']||keys['arrowright'])this.x+=sp;
    this.x=Math.max(COURT_L+15,Math.min(COURT_R-15,this.x));
    if(this.swing>0)this.swing--;
}
Player.prototype.hit=function(ball,type){
    if(Math.abs(ball.x-this.x)>55||ball.y<NET_Y||ball.z>35)return false;
    if(ball.y<this.y-20||ball.y>this.y+30)return false;
    const dir=-1;
    const pow=type===2?10:type===1?8:6.5;
    const ang=type===2?0.55:type===1?0.78:1.0;
    ball.vx=(ball.x-this.x)*0.06+(Math.random()-0.5)*1.2;
    ball.vy=dir*Math.sin(ang)*pow;
    ball.vz=Math.cos(ang)*pow*0.9+2;
    ball.spin=(Math.random()-0.5)*0.06;
    ball.bounced=false;ball.side='player';this.swing=type===2?18:12;this.swingType=type;sfxHit();return true;
}
Player.prototype.draw=function(ctx,isAI){
    const c1=isAI?'#e63946':'#4361ee',c2=isAI?'#b5179e':'#3a0ca3';
    ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(this.x,this.y+this.h/2+3,18,4.5,0,0,Math.PI*2);ctx.fill();
    ctx.save();ctx.translate(this.x,this.y);
    ctx.fillStyle=c1;ctx.fillRect(-this.w/2+4,-5,this.w-8,28);
    ctx.fillStyle=c2;ctx.fillRect(-this.w/2+4,-5,this.w-8,10);
    ctx.fillStyle='#ffdbac';ctx.beginPath();ctx.arc(0,-16,10,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=c2;ctx.fillRect(-11,-27,22,6);
    ctx.fillStyle='#222';ctx.fillRect(-10,23,8,25);ctx.fillRect(2,23,8,25);
    ctx.fillStyle='#fff';ctx.fillRect(-12,46,12,6);ctx.fillRect(0,46,12,6);
    const sw=this.swing>0?Math.sin((20-this.swing)/20*Math.PI):0;
    const racketColor=isAI?'#d00000':'#0077b6';
    ctx.save();ctx.translate(isAI?-14:14,2);ctx.rotate(isAI?-0.4-sw*1.2:0.4+sw*1.2);
    ctx.strokeStyle=racketColor;ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(10,0,13,17,0,0,Math.PI*2);ctx.stroke();
    ctx.strokeStyle='rgba(150,150,150,0.5)';ctx.lineWidth=0.6;
    for(let i=-10;i<=10;i+=3){ctx.beginPath();ctx.moveTo(10+i*0.55,-16+i*0.1);ctx.lineTo(10+i*0.55,16+i*0.1);ctx.stroke();ctx.beginPath();ctx.moveTo(-4,0+i*0.8);ctx.lineTo(24,0+i*0.8);ctx.stroke();}
    ctx.strokeStyle='#5a3a1a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-3,0);ctx.lineTo(6,0);ctx.stroke();
    ctx.restore();
    ctx.restore();
}
function AI(){
    this.x=W/2;this.y=110;this.w=28;this.h=55;this.swing=0;this.swingType=0;this.react=0;
}
AI.prototype.update=function(ball,diff){
    let sp=3.2+diff*0.6;
    if(ball.vy<0&&ball.y<NET_Y){
        const tx=ball.x+(Math.random()-0.5)*10;
        if(this.x<tx-4)this.x+=sp;else if(this.x>tx+4)this.x-=sp;
    }else{this.x+=(W/2-this.x)*0.05;}
    this.x=Math.max(COURT_L+15,Math.min(COURT_R-15,this.x));
    if(this.swing>0)this.swing--;
    if(this.react>0)this.react--;
}
AI.prototype.tryHit=function(ball,diff){
    if(this.react>0)return;
    if(Math.abs(ball.x-this.x)>50)return;
    if(ball.y<this.y-15||ball.y>this.y+30)return;
    if(ball.vy>0&&ball.y<NET_Y+20)return;
    if(Math.random()>(0.55+diff*0.18))return;
    const r=Math.random();
    const type=r<0.25?2:r<0.65?1:0;
    const pow=type===2?9.2:type===1?7.6:6.1;
    const ang=type===2?0.5:type===1?0.72:0.95;
    const targX=COURT_L+40+Math.random()*(COURT_R-COURT_L-80);
    ball.vx=(targX-ball.x)*0.05+(Math.random()-0.5);
    ball.vy=Math.sin(ang)*pow;
    ball.vz=Math.cos(ang)*pow*0.9+1.8;
    ball.spin=(Math.random()-0.5)*0.05;
    ball.bounced=false;ball.side='ai';this.swing=type===2?18:12;this.swingType=type;this.react=10+Math.floor(Math.random()*6);sfxHit();
}
AI.prototype.draw=Player.prototype.draw;
const G={
    state:STATE_MENU,score:0,highScore:0,
    pScore:0,aScore:0,gamesP:0,gamesA:0,set:1,
    ball:null,player:null,ai:null,
    keys:{},pointerX:0,pointerDown:false,pointerTap:0,
    btnRects:{},paused:false,
    diff:1,lastServer:'player',serverAnim:0,rally:0,msg:'',msgLife:0,
    winner:null
};
G.highScore=parseInt(Storage.load('tennis_high','0'));
function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}
function drawBtn(ctx,x,y,w,h,text,name,color){
    G.btnRects[name]={x,y,w,h};
    ctx.fillStyle=color||'#2d6a4f';ctx.strokeStyle='#fff';ctx.lineWidth=2;
    roundRect(ctx,x,y,w,h,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold 18px "Microsoft YaHei"';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(text,x+w/2,y+h/2);ctx.textBaseline='alphabetic';
}
function hitBtn(p,name){const r=G.btnRects[name];return r&&p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;}
function getPos(e){const rect=canvas.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:(t.clientX-rect.left)/scale,y:(t.clientY-rect.top)/scale};}
window.addEventListener('keydown',function(e){
    G.keys[e.key.toLowerCase()]=true;
    if(e.key===' '||e.key==='j'||e.key==='k'||e.key==='l'){e.preventDefault();if(G.state===STATE_PLAYING&&!G.paused){const t=e.key==='l'?2:e.key==='k'?1:0;G.player.hit(G.ball,t);}}
    if(e.key==='Escape'){if(G.state===STATE_PLAYING)togglePause();}
    initAudio();
});
window.addEventListener('keyup',function(e){G.keys[e.key.toLowerCase()]=false;});
function handlePointerDown(e){
    initAudio();const p=getPos(e);G.pointerX=p.x;G.pointerDown=true;G.pointerTap=Date.now();
    if(G.state===STATE_MENU){if(hitBtn(p,'start')){startGame();return;}}
    else if(G.state===STATE_OVER){if(hitBtn(p,'restart')){startGame();return;}if(hitBtn(p,'menu')){G.state=STATE_MENU;return;}}
    else if(G.state===STATE_PLAYING&&!G.paused){
        if(p.y<H/2+40)return;
        const player=G.player;player.x=Math.max(COURT_L+15,Math.min(COURT_R-15,p.x));
    }
}
function handlePointerMove(e){if(G.state===STATE_PLAYING&&G.pointerDown){const p=getPos(e);if(p.y>=H/2+40)G.player.x=Math.max(COURT_L+15,Math.min(COURT_R-15,p.x));}}
function handlePointerUp(e){
    if(!G.pointerDown)return;G.pointerDown=false;
    const dt=Date.now()-G.pointerTap;
    if(G.state===STATE_PLAYING&&!G.paused&&dt<250){
        const p=getPos(e);
        if(p.y>=H/2+40){const t=dt<80?0:dt<150?1:2;G.player.hit(G.ball,t);}
    }
}
canvas.addEventListener('mousedown',handlePointerDown);canvas.addEventListener('mousemove',handlePointerMove);canvas.addEventListener('mouseup',handlePointerUp);
canvas.addEventListener('touchstart',function(e){e.preventDefault();handlePointerDown(e);},{passive:false});
canvas.addEventListener('touchmove',function(e){e.preventDefault();handlePointerMove(e);},{passive:false});
canvas.addEventListener('touchend',function(e){e.preventDefault();handlePointerUp(e);},{passive:false});
function startGame(){
    initAudio();G.state=STATE_PLAYING;
    G.score=0;G.pScore=0;G.aScore=0;G.gamesP=0;G.gamesA=0;G.set=1;G.diff=1;G.rally=0;
    G.msg='';G.msgLife=0;G.winner=null;G.paused=false;
    G.player=new Player();G.ai=new AI();G.ball=new Ball();
    G.ball.x=W/2;G.ball.y=H-120;G.ball.vx=0;G.ball.vy=0;G.ball.vz=0;G.ball.z=20;G.ball.side='player';
    sfxBtn();
}
function togglePause(){G.paused=!G.paused;sfxBtn();}
function pointTo(who){
    if(who==='player'){G.pScore++;G.rally++;G.score+=10*G.rally;G.msg='得分 +'+(10*G.rally);}
    else{G.aScore++;G.rally=0;G.msg='对手得分';}
    G.msgLife=80;
    const pn=scoreName(G.pScore),an=scoreName(G.aScore);
    if((G.pScore>=4||G.aScore>=4)&&Math.abs(G.pScore-G.aScore)>=2){
        if(G.pScore>G.aScore){G.gamesP++;G.msg='你赢下这局!';}else{G.gamesA++;G.msg='对手赢下这局!';}
        G.pScore=0;G.aScore=0;G.msgLife=120;sfxScore();
        if(G.gamesP>=6||G.gamesA>=6){endGame();return;}
    }else{if(who==='player')sfxScore();else sfxMiss();}
    setTimeout(function(){if(G.state===STATE_PLAYING){G.ball.reset();G.ball.y=80;G.ball.vy=2;G.ball.side='ai';}},100);
}
function scoreName(s){const n=['0','15','30','40'];return s<4?n[s]:(s===4?'AD':'AD');}
function endGame(){
    G.state=STATE_OVER;G.winner=G.gamesP>G.gamesA?'player':'ai';
    G.score+=G.gamesP*100;
    if(G.score>G.highScore){G.highScore=G.score;Storage.save('tennis_high',G.highScore);}
}
function update(){
    if(G.state!==STATE_PLAYING||G.paused)return;
    if(G.msgLife>0)G.msgLife--;
    G.player.update(G.keys);G.ai.update(G.ball,G.diff);G.ball.update();
    if(G.ball.side==='ai'&&G.ball.vy>0){G.ai.tryHit(G.ball,G.diff);}
    if(G.ball.y>H+30){pointTo('ai');return;}
    if(G.ball.y<-30){pointTo('player');return;}
    if(G.ball.z<=0&&G.ball.bounced&&Math.abs(G.ball.vz)<0.5){
        if(G.ball.y>NET_Y){if(G.ball.side==='player')pointTo('ai');else pointTo('player');}
        else{if(G.ball.side==='ai')pointTo('player');else pointTo('ai');}
    }
    G.diff=1+Math.min(2,G.score/500);
}
function drawCourt(){
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#2d6a4f');g.addColorStop(0.5,'#40916c');g.addColorStop(1,'#2d6a4f');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(255,255,255,0.1)';
    for(let i=0;i<H;i+=28){if((i/28)%2===0)ctx.fillRect(COURT_L,i,COURT_R-COURT_L,14);}
    ctx.strokeStyle='#fff';ctx.lineWidth=3;
    ctx.strokeRect(COURT_L,40,COURT_R-COURT_L,H-80);
    ctx.strokeStyle='#e9ecef';ctx.lineWidth=2;
    ctx.strokeRect(COURT_L+28,40,(COURT_R-COURT_L)/2-28,H-80);
    ctx.strokeRect(COURT_L+(COURT_R-COURT_L)/2,40,(COURT_R-COURT_L)/2-28,H-80);
    ctx.setLineDash([6,6]);ctx.strokeStyle='rgba(255,255,255,0.5)';
    ctx.beginPath();ctx.moveTo(COURT_L,NET_Y);ctx.lineTo(COURT_R,NET_Y);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#222';ctx.fillRect(COURT_L-4,NET_Y-3,COURT_R-COURT_L+8,6);
    for(let x=COURT_L;x<=COURT_R;x+=10){
        ctx.fillStyle=x%20===0?'#eee':'#bbb';
        const ny=NET_Y-14-Math.sin((x-COURT_L)/8)*3;
        ctx.fillRect(x,ny,1,12);
    }
    ctx.strokeStyle='#000';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(COURT_L,NET_Y-14);ctx.lineTo(COURT_R,NET_Y-14);ctx.stroke();
    ctx.beginPath();ctx.moveTo(COURT_L,NET_Y+2);ctx.lineTo(COURT_R,NET_Y+2);ctx.stroke();
    ctx.fillStyle='#495057';
    const postH=22;
    ctx.fillRect(COURT_L-8,NET_Y-postH,8,postH+6);ctx.fillRect(COURT_R,NET_Y-postH,8,postH+6);
}
function drawHUD(){
    ctx.fillStyle='rgba(0,0,0,0.65)';roundRect(ctx,10,10,W-20,62,8);ctx.fill();
    ctx.fillStyle='#4cc9f0';ctx.font='bold 14px "Microsoft YaHei"';ctx.textAlign='left';ctx.fillText('选手',24,30);
    ctx.font='bold 22px "Microsoft YaHei"';ctx.fillStyle='#4361ee';ctx.fillText(scoreName(G.pScore)+' / '+G.gamesP,24,54);
    ctx.fillStyle='#f72585';ctx.font='bold 14px "Microsoft YaHei"';ctx.textAlign='right';ctx.fillText('对手',W-24,30);
    ctx.font='bold 22px "Microsoft YaHei"';ctx.fillStyle='#e63946';ctx.fillText(scoreName(G.aScore)+' / '+G.gamesA,W-24,54);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 14px "Microsoft YaHei"';
    ctx.fillText('第 '+G.set+' 盘',W/2,28);
    ctx.fillStyle='#ffd700';ctx.font='bold 18px "Microsoft YaHei"';
    ctx.fillText('分数: '+G.score,W/2,52);
    ctx.fillStyle='#aaa';ctx.font='12px "Microsoft YaHei"';ctx.fillText('最高:'+G.highScore,W/2,72);
    if(G.rally>=3){const b=Math.sin(Date.now()/80)*2;ctx.fillStyle='#ff6b35';ctx.font='bold 18px "Microsoft YaHei"';ctx.fillText(G.rally+' 连击!',W/2,92+b);}
    if(G.msgLife>0){
        ctx.globalAlpha=Math.min(1,G.msgLife/30);
        ctx.fillStyle='#ffd700';ctx.font='bold 28px "Microsoft YaHei"';
        const b=Math.sin((80-G.msgLife)/10)*4;
        ctx.fillText(G.msg,W/2,H/2-50+b);ctx.globalAlpha=1;
    }
    ctx.textAlign='left';
    if(G.player.swing<=0){
        ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='12px "Microsoft YaHei"';ctx.textAlign='center';
        ctx.fillText('← → 或拖拽移动   空格/J平击 K削球 L上旋',W/2,H-15);
        ctx.textAlign='left';
    }
}
function drawMenu(){
    const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#081c15');g.addColorStop(1,'#2d6a4f');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(255,255,255,0.04)';for(let i=0;i<H;i+=30)if((i/30)%2===0)ctx.fillRect(0,i,W,15);
    ctx.fillStyle='#52b788';ctx.font='bold 54px "Microsoft YaHei"';ctx.textAlign='center';
    ctx.fillText('网球公开赛',W/2,130);
    ctx.fillStyle='#ffd700';ctx.font='20px Arial';ctx.fillText('TENNIS OPEN',W/2,162);
    ctx.save();ctx.translate(W/2,300);const rot=Date.now()/500;
    const racketC='#d62828';
    ctx.save();ctx.translate(-85,0);ctx.rotate(-0.3+Math.sin(rot)*0.15);
    ctx.strokeStyle=racketC;ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(0,0,28,38,0,0,Math.PI*2);ctx.stroke();
    ctx.strokeStyle='rgba(200,200,200,0.5)';ctx.lineWidth=1;
    for(let i=-20;i<=20;i+=4){ctx.beginPath();ctx.moveTo(i*0.6,-36+i*0.1);ctx.lineTo(i*0.6,36+i*0.1);ctx.stroke();ctx.beginPath();ctx.moveTo(-27,i*0.9);ctx.lineTo(27,i*0.9);ctx.stroke();}
    ctx.strokeStyle='#6b4226';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-2,38);ctx.lineTo(12,75);ctx.stroke();ctx.restore();
    ctx.save();ctx.translate(85,0);ctx.rotate(0.3-Math.sin(rot)*0.15);
    ctx.strokeStyle='#0077b6';ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(0,0,28,38,0,0,Math.PI*2);ctx.stroke();
    ctx.strokeStyle='rgba(200,200,200,0.5)';ctx.lineWidth=1;
    for(let i=-20;i<=20;i+=4){ctx.beginPath();ctx.moveTo(i*0.6,-36+i*0.1);ctx.lineTo(i*0.6,36+i*0.1);ctx.stroke();ctx.beginPath();ctx.moveTo(-27,i*0.9);ctx.lineTo(27,i*0.9);ctx.stroke();}
    ctx.strokeStyle='#6b4226';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(2,38);ctx.lineTo(-12,75);ctx.stroke();ctx.restore();
    ctx.fillStyle='#c9e265';ctx.beginPath();ctx.arc(0,-5+Math.sin(rot*1.5)*5,8,0,Math.PI*2);ctx.fill();
    ctx.restore();
    ctx.fillStyle='#ffd700';ctx.font='bold 18px "Microsoft YaHei"';ctx.fillText('最高分: '+G.highScore,W/2,420);
    drawBtn(ctx,W/2-100,460,200,60,'开始比赛','start','#2d6a4f');
    ctx.fillStyle='#fff';ctx.font='15px "Microsoft YaHei"';ctx.fillText('🎾 挑战三局制网球赛  赢下每一盘!',W/2,555);
    ctx.fillStyle='#ddd';ctx.font='13px "Microsoft YaHei"';
    ctx.fillText('触屏: 拖拽移动  短按/长按击球',W/2,595);
    ctx.fillText('键盘: ←→移动  空格/J K L 三种击球',W/2,618);
    ctx.textAlign='left';
}
function drawGame(){
    drawCourt();
    G.ai.draw(ctx,true);G.player.draw(ctx,false);G.ball.draw(ctx);
    drawHUD();
    if(G.paused){ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='bold 40px "Microsoft YaHei"';ctx.textAlign='center';ctx.fillText('暂停',W/2,H/2-10);ctx.font='16px "Microsoft YaHei"';ctx.fillStyle='#aaa';ctx.fillText('按 ESC 继续',W/2,H/2+30);ctx.textAlign='left';}
}
function drawGameOver(){
    ctx.fillStyle='#081c15';ctx.fillRect(0,0,W,H);
    const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1b4332');g.addColorStop(1,'#081c15');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    const isNew=G.score>=G.highScore&&G.score>0;
    const win=G.winner==='player';
    ctx.fillStyle=win?'#ffd700':'#e63946';ctx.font='bold 50px "Microsoft YaHei"';ctx.textAlign='center';
    ctx.fillText(win?'冠军!':'败北',W/2,150);
    if(isNew&&win){ctx.fillStyle='#ff6b35';ctx.font='bold 22px "Microsoft YaHei"';ctx.fillText('🏆 新纪录!',W/2,190);}
    ctx.fillStyle='#fff';ctx.font='bold 20px "Microsoft YaHei"';ctx.fillText('总比分',W/2,245);
    ctx.font='bold 56px Arial';ctx.fillStyle='#4361ee';ctx.fillText(G.gamesP,W/2-60,310);
    ctx.fillStyle='#888';ctx.fillText(':',W/2,310);ctx.fillStyle='#e63946';ctx.fillText(G.gamesA,W/2+60,310);
    ctx.fillStyle='#ddd';ctx.font='16px "Microsoft YaHei"';ctx.fillText('盘数 (先胜6盘)',W/2,350);
    ctx.fillStyle='#ffd700';ctx.font='bold 28px "Microsoft YaHei"';ctx.fillText('得分: '+G.score,W/2,405);
    ctx.fillStyle='#ffd700';ctx.font='bold 16px "Microsoft YaHei"';ctx.fillText('最高分: '+G.highScore,W/2,440);
    drawBtn(ctx,W/2-90,485,180,55,'再来一局','restart','#2d6a4f');
    drawBtn(ctx,W/2-70,555,140,45,'返回菜单','menu','#0077b6');
    ctx.textAlign='left';
}
function draw(){
    switch(G.state){case STATE_MENU:drawMenu();break;case STATE_PLAYING:drawGame();break;case STATE_OVER:drawGameOver();break;case STATE_PAUSE:drawGame();break;}
}
function gameLoop(){requestAnimationFrame(gameLoop);update();draw();}
G.player=new Player();G.ai=new AI();G.ball=new Ball();gameLoop();
})();
</script>

  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>

    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {

  };
