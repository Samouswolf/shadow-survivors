<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>抽奖</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);font-family:'Microsoft YaHei',sans-serif}
#gameContainer{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
canvas{display:block;max-width:100%;max-height:calc(100vh - 150px)}
#startBtn{margin-top:20px;padding:12px 40px;font-size:18px;font-weight:bold;color:#fff;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);border:none;border-radius:25px;cursor:pointer;transition:all .3s;box-shadow:0 4px 15px rgba(102,126,234,.4)}
#startBtn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(102,126,234,.6)}
#startBtn:disabled{opacity:.5;cursor:not-allowed;transform:none}
#result{margin-top:15px;font-size:24px;font-weight:bold;color:#ffd700;text-shadow:0 0 10px rgba(255,215,0,.5);min-height:30px}
#score{position:absolute;top:10px;left:10px;font-size:16px;color:#fff;background:rgba(0,0,0,.3);padding:8px 15px;border-radius:20px}
#spins{position:absolute;top:10px;right:10px;font-size:16px;color:#fff;background:rgba(0,0,0,.3);padding:8px 15px;border-radius:20px}
</style>
<style>
/* 游戏工坊广告系统 */
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);height:90px;max-height:90px;overflow:hidden;contain:layout style paint;pointer-events:none!important}.ad-banner-container,.ad-banner-container *{pointer-events:none!important}.ad-banner-container iframe{max-height:90px;pointer-events:none!important}
.ad-banner-container iframe{max-width:100%}
.ad-label{position:absolute;top:1px;right:6px;font:9px "Microsoft YaHei",sans-serif;color:rgba(255,255,255,.35)}
.sponsor-btn{position:fixed;top:44px;right:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:3px 9px;border-radius:10px;font:11px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .qr-row{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.sponsor-panel .qr-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px;text-align:center;min-width:140px}
.sponsor-panel .qr-card .qr-icon{font-size:48px;margin-bottom:6px}
.sponsor-panel .qr-card .qr-label{color:#ccc;font:13px "Microsoft YaHei",sans-serif}
.sponsor-panel .qr-card .qr-hint{color:#888;font:11px "Microsoft YaHei",sans-serif;margin-top:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.interstitial-ad .ad-content{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;text-align:center;min-width:280px;max-width:400px}
.interstitial-ad .ad-content p{color:#aaa;font:14px "Microsoft YaHei",sans-serif;margin-bottom:12px}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
</style>
</head>
<body>
<div id="gameContainer">
<div id="score">积分: 0</div>
<div id="spins">剩余次数: 10</div>
<canvas id="wheel"></canvas>
<div id="result"></div>
<button id="startBtn">开始抽奖</button>
</div>

<!-- 广告系统 -->
<div class="ad-banner-container" id="adBanner"><div class="ad-label">广告</div><div id="adSlot" style="width:728px;max-width:100%;height:90px;display:flex;align-items:center;justify-content:center;color:#888;font:12px 'Microsoft YaHei',sans-serif">广告加载中...</div></div>
<button class="sponsor-btn" id="sponsorBtn">☕ 赞助</button>
<div class="sponsor-panel" id="sponsorPanel">
<h2>💛 支持开发者</h2>
<div style="color:#aaa;font:14px 'Microsoft YaHei',sans-serif;text-align:center;max-width:280px">如果你喜欢这个游戏，请开发者喝杯咖啡吧 ☕<br>每一份支持都是持续更新的动力！</div>
<div class="qr-row">
<div class="qr-card"><div class="qr-icon">💚</div><div class="qr-label">微信赞赏</div><div class="qr-hint">打开微信扫一扫</div></div>
<div class="qr-card"><div class="qr-icon">💙</div><div class="qr-label">支付宝支持</div><div class="qr-hint">打开支付宝扫一扫</div></div>
</div>
<button class="sponsor-close" id="sponsorClose">关闭</button>
</div>
<div class="interstitial-ad" id="interstitialAd">
<div class="ad-content">
<p>📢 赞助商广告</p>
<div id="interstitialAdSlot" style="min-height:250px;display:flex;align-items:center;justify-content:center;color:#888;font:13px 'Microsoft YaHei',sans-serif">广告加载中...</div>
</div>
<button class="skip-btn" id="skipInterstitial">跳过广告 ▶</button>
</div>

<script>
(function(){
// 游戏配置
const PRIZES = [
    { text: '100积分', value: 100, color: '#FF6B6B' },
    { text: '50积分', value: 50, color: '#4ECDC4' },
    { text: '200积分', value: 200, color: '#45B7D1' },
    { text: '谢谢参与', value: 0, color: '#96CEB4' },
    { text: '500积分', value: 500, color: '#FFEAA7' },
    { text: '20积分', value: 20, color: '#DDA0DD' },
    { text: '1000积分', value: 1000, color: '#FF6B9D' },
    { text: '10积分', value: 10, color: '#C7CEEA' }
];

const SEGMENT_COUNT = PRIZES.length;
const SEGMENT_ANGLE = (2 * Math.PI) / SEGMENT_COUNT;

// 游戏状态
let score = 0;
let spins = 10;
let isSpinning = false;
let currentAngle = 0;
let targetAngle = 0;
let spinSpeed = 0;

// Canvas设置
const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const startBtn = document.getElementById('startBtn');
const resultDiv = document.getElementById('result');
const scoreDiv = document.getElementById('score');
const spinsDiv = document.getElementById('spins');

// 响应式尺寸
function resize() {
    const size = Math.min(window.innerWidth - 40, window.innerHeight - 250, 400);
    canvas.width = size;
    canvas.height = size;
    drawWheel();
}

// 绘制转盘
function drawWheel() {
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const radius = Math.min(cx, cy) - 10;
    
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // 绘制外圈装饰
    ctx.beginPath();
    ctx.arc(cx, cy, radius + 8, 0, 2 * Math.PI);
    ctx.strokeStyle = '#FFD700';
    ctx.lineWidth = 4;
    ctx.stroke();
    
    // 绘制各段
    for (let i = 0; i < SEGMENT_COUNT; i++) {
        const startAngle = currentAngle + i * SEGMENT_ANGLE - Math.PI / 2;
        const endAngle = startAngle + SEGMENT_ANGLE;
        
        // 扇形
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, radius, startAngle, endAngle);
        ctx.closePath();
        ctx.fillStyle = PRIZES[i].color;
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
        
        // 文字
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(startAngle + SEGMENT_ANGLE / 2);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${Math.max(12, radius / 15)}px Microsoft YaHei`;
        ctx.shadowColor = 'rgba(0,0,0,0.5)';
        ctx.shadowBlur = 3;
        ctx.fillText(PRIZES[i].text, radius - 15, 5);
        ctx.restore();
    }
    
    // 中心圆
    ctx.beginPath();
    ctx.arc(cx, cy, radius * 0.15, 0, 2 * Math.PI);
    ctx.fillStyle = '#FFD700';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.stroke();
    
    // 指针
    ctx.beginPath();
    ctx.moveTo(cx, cy - radius - 5);
    ctx.lineTo(cx - 15, cy - radius - 30);
    ctx.lineTo(cx + 15, cy - radius - 30);
    ctx.closePath();
    ctx.fillStyle = '#FF4757';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
}

// 开始抽奖
function startSpin() {
    if (isSpinning || spins <= 0) return;
    
    isSpinning = true;
    spins--;
    spinsDiv.textContent = `剩余次数: ${spins}`;
    startBtn.disabled = true;
    resultDiv.textContent = '';
    
    // 随机选择结果
    const prizeIndex = Math.floor(Math.random() * SEGMENT_COUNT);
    
    // 计算目标角度（至少转5圈）
    const extraSpins = 5 + Math.random() * 3;
    targetAngle = currentAngle + extraSpins * 2 * Math.PI + prizeIndex * SEGMENT_ANGLE + SEGMENT_ANGLE / 2;
    
    // 初始速度
    spinSpeed = 0.3;
    
    animate();
}

// 动画循环
function animate() {
    if (!isSpinning) return;
    
    // 缓动减速
    const distance = targetAngle - currentAngle;
    
    if (distance > 0.01) {
        spinSpeed = Math.max(0.005, distance * 0.05);
        currentAngle += spinSpeed;
        drawWheel();
        requestAnimationFrame(animate);
    } else {
        // 停止
        currentAngle = targetAngle;
        isSpinning = false;
        startBtn.disabled = false;
        
        // 计算结果
        const normalizedAngle = ((currentAngle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
        const prizeIndex = Math.floor((2 * Math.PI - normalizedAngle + Math.PI / 2) / SEGMENT_ANGLE) % SEGMENT_COUNT;
        const prize = PRIZES[prizeIndex];
        
        score += prize.value;
        scoreDiv.textContent = `积分: ${score}`;
        
        if (prize.value > 0) {
            resultDiv.textContent = `🎉 恭喜获得 ${prize.text}！`;
        } else {
            resultDiv.textContent = '😅 谢谢参与，再接再厉！';
        }
        
        // 检查游戏结束
        if (spins <= 0) {
            setTimeout(() => {
                resultDiv.textContent = `游戏结束！总积分: ${score}`;
                showInterstitialAd();
            }, 1500);
        }
    }
}

// 事件监听
startBtn.addEventListener('click', startSpin);
window.addEventListener('resize', resize);

// 初始化
resize();
})();

// 广告系统
(function(){
var sb=document.getElementById('sponsorBtn'),sp=document.getElementById('sponsorPanel'),sc=document.getElementById('sponsorClose');
if(sb&&sp){sb.onclick=function(){sp.style.display='flex'};if(sc)sc.onclick=function(){sp.style.display='none'}}
var ia=document.getElementById('interstitialAd'),si=document.getElementById('skipInterstitial');
if(ia&&si){si.onclick=function(){ia.style.display='none'}}
window.showInterstitialAd=function(){if(ia)ia.style.display='flex'};
})();
</script>
</body>
</html>
