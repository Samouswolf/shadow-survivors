<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>细胞吞噬</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    overflow: hidden;
    font-family: 'Microsoft YaHei', Arial, sans-serif;
    color: #fff;
    user-select: none;
    -webkit-user-select: none;
}

canvas {
    display: block;
    background: #0a0a1a;
    image-rendering: pixelated;
}

#startScreen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 100;
}

#startScreen h1 {
    font-size: clamp(2rem, 5vw, 3.5rem);
    margin-bottom: 1rem;
    background: linear-gradient(90deg, #00d4ff, #7b2ff7, #ff2d95);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: 0 0 40px rgba(0, 212, 255, 0.3);
}

#startScreen .subtitle {
    font-size: clamp(1rem, 2.5vw, 1.2rem);
    color: #888;
    margin-bottom: 2rem;
}

#nicknameInput {
    width: min(280px, 80vw);
    padding: 12px 20px;
    font-size: clamp(1rem, 2vw, 1.1rem);
    background: rgba(255, 255, 255, 0.1);
    border: 2px solid rgba(255, 255, 255, 0.2);
    border-radius: 25px;
    color: #fff;
    outline: none;
    text-align: center;
    margin-bottom: 1.5rem;
    transition: all 0.3s ease;
}

#nicknameInput:focus {
    border-color: #00d4ff;
    box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
}

#nicknameInput::placeholder {
    color: rgba(255, 255, 255, 0.4);
}

.mode-btns {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 1rem;
}

.mode-btn {
    padding: clamp(14px, 2.5vh, 18px) clamp(30px, 8vw, 50px);
    font-size: clamp(1.1rem, 2.5vw, 1.3rem);
    border: none;
    border-radius: 30px;
    color: #fff;
    cursor: pointer;
    transition: all 0.3s ease;
    font-weight: bold;
    min-height: 48px;
}

.mode-btn.traditional {
    background: linear-gradient(90deg, #00d4ff, #0077b6);
}

.mode-btn.king {
    background: linear-gradient(90deg, #ffd700, #ff8c00);
}

.mode-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
}

.mode-btn.king:hover {
    box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
}

.mode-desc {
    font-size: clamp(0.8rem, 1.5vw, 0.9rem);
    color: #888;
    margin-top: 0.5rem;
    text-align: center;
    max-width: 400px;
    padding: 0 20px;
}

.stats-preview {
    margin-top: 2rem;
    font-size: clamp(0.8rem, 1.5vw, 0.9rem);
    color: #666;
}

.stats-preview span {
    margin: 0 10px;
}

#gameOverScreen, #winScreen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.85);
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 100;
    backdrop-filter: blur(5px);
}

#gameOverScreen h2, #winScreen h2 {
    font-size: clamp(1.8rem, 4vw, 2.5rem);
    margin-bottom: 1.5rem;
}

#gameOverScreen h2 { color: #ff4757; }
#winScreen h2 { color: #ffd700; }

.game-stats {
    background: rgba(255, 255, 255, 0.05);
    border-radius: 15px;
    padding: 25px 40px;
    margin-bottom: 2rem;
    min-width: min(300px, 90vw);
}

.game-stats .stat {
    display: flex;
    justify-content: space-between;
    margin: 12px 0;
    font-size: clamp(0.95rem, 2vw, 1.1rem);
}

.game-stats .stat .label {
    color: #888;
}

.game-stats .stat .value {
    font-weight: bold;
    color: #00d4ff;
}

.game-stats .stat .value.highlight {
    color: #ff2d95;
    font-size: 1.3rem;
}

.game-over-btns {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    justify-content: center;
}

#restartBtn, #retryBtn, #menuBtn {
    padding: clamp(10px, 2vh, 14px) clamp(25px, 6vw, 40px);
    font-size: clamp(1rem, 2vw, 1.2rem);
    border: none;
    border-radius: 25px;
    color: #fff;
    cursor: pointer;
    transition: all 0.3s ease;
    min-height: 48px;
}

#restartBtn { background: linear-gradient(90deg, #ff2d95, #7b2ff7); }
#retryBtn { background: linear-gradient(90deg, #00d4ff, #0077b6); }
#menuBtn { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); }

#restartBtn:hover, #retryBtn:hover, #menuBtn:hover {
    transform: scale(1.05);
}

#restartBtn:hover { box-shadow: 0 0 20px rgba(255, 45, 149, 0.5); }
#retryBtn:hover { box-shadow: 0 0 20px rgba(0, 212, 255, 0.5); }
#menuBtn:hover { background: rgba(255,255,255,0.25); }

#hud {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    padding: 10px 15px;
    display: none;
    justify-content: space-between;
    z-index: 50;
    pointer-events: none;
    flex-wrap: wrap;
    gap: 5px;
}

.hud-left, .hud-right {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.hud-item {
    background: rgba(0, 0, 0, 0.5);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: clamp(0.8rem, 1.8vw, 0.95rem);
    backdrop-filter: blur(5px);
    white-space: nowrap;
}

.hud-item .value {
    font-weight: bold;
    color: #00d4ff;
    margin-left: 3px;
}

.hud-item .value.warn {
    color: #ff4757;
}

/* Progress bar for king mode */
#hudProgress {
    display: none;
    align-items: center;
    gap: 6px;
    background: rgba(0, 0, 0, 0.5);
    padding: 4px 10px;
    border-radius: 20px;
    backdrop-filter: blur(5px);
    font-size: clamp(0.75rem, 1.6vw, 0.85rem);
}

#hudProgress .progress-bar {
    width: clamp(60px, 15vw, 100px);
    height: 10px;
    background: rgba(255,255,255,0.2);
    border-radius: 5px;
    overflow: hidden;
}

#hudProgress .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #ffd700, #ff8c00);
    border-radius: 5px;
    transition: width 0.3s ease;
}

/* Level transition overlay */
#levelTransition {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.8);
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 90;
}

#levelTransition .level-text {
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: bold;
    color: #00d4ff;
    margin-bottom: 0.5rem;
}

#levelTransition .level-sub {
    font-size: clamp(1rem, 2vw, 1.3rem);
    color: #aaa;
}
</style>

<body>

<canvas id="gameCanvas"></canvas>

<div id="startScreen">
    <h1>细胞吞噬</h1>
    <div class="subtitle">选择你的模式</div>
    <input type="text" id="nicknameInput" placeholder="输入你的昵称" maxlength="12">
    <div class="mode-btns">
        <button class="mode-btn traditional" id="btnTraditional">传统模式</button>
        <button class="mode-btn king" id="btnKing">王者模式</button>

    <div class="mode-desc" id="modeDesc">请选择游戏模式</div>
    <div class="stats-preview">
        <span>最高分: <span id="previewHighscore">0</span></span>
        <span>总吞噬: <span id="previewEatCount">0</span></span>

</div>

<div id="gameOverScreen">
    <h2 id="goTitle">游戏结束</h2>
    <div class="game-stats">
        <div class="stat">
            <span class="label">得分</span>
            <span class="value highlight" id="finalScore">0</span>
        </div>
        <div class="stat">
            <span class="label">最大体积</span>
            <span class="value" id="finalMaxSize">0</span>
        </div>
        <div class="stat">
            <span class="label">吞噬数量</span>
            <span class="value" id="finalEatCount">0</span>
        </div>
        <div class="stat" id="statLevel" style="display:none">
            <span class="label">到达关卡</span>
            <span class="value" id="finalLevel">1</span>
        </div>
        <div class="stat">
            <span class="label">存活时间</span>
            <span class="value" id="finalTime">0s</span>
        </div>
        <div class="stat">
            <span class="label">最高分</span>
            <span class="value" id="finalHighscore">0</span>
        </div>
    </div>
    <div class="game-over-btns">
        <button id="retryBtn" style="display:none">重试本关</button>
        <button id="restartBtn">再来一局</button>
        <button id="menuBtn2">返回菜单</button>
    </div>
</div>

<div id="winScreen">
    <h2>🏆 恭喜通关！</h2>
    <div class="game-stats">
        <div class="stat">
            <span class="label">得分</span>
            <span class="value highlight" id="winScore">0</span>
        </div>
        <div class="stat">
            <span class="label">最大体积</span>
            <span class="value" id="winMaxSize">0</span>
        </div>
        <div class="stat">
            <span class="label">总吞噬</span>
            <span class="value" id="winEatCount">0</span>
        </div>
        <div class="stat">
            <span class="label">存活时间</span>
            <span class="value" id="winTime">0s</span>
        </div>
    </div>
    <div class="game-over-btns">
        <button id="menuBtn">返回菜单</button>
    </div>
</div>

<div id="hud">
    <div class="hud-left">
        <div class="hud-item">分数: <span class="value" id="hudScore">0</span></div>
        <div class="hud-item">大小: <span class="value" id="hudSize">30</span></div>
    </div>
    <div class="hud-right">
        <div class="hud-item" id="hudLevel">第<span class="value" id="hudLevelNum">1</span>关</div>
        <div class="hud-item" id="hudTarget">目标: <span class="value" id="hudTargetText">0/8</span></div>
        <div class="hud-item" id="hudShrink">缩圈: <span class="value" id="hudShrinkTime">--</span></div>

</div>

<div id="levelTransition">
    <div class="level-text" id="lvlText"></div>
    <div class="level-sub" id="lvlSub"></div>
</div>

<div id="pauseBtn" style="position:fixed;top:8px;right:80px;z-index:20;width:44px;height:44px;background:rgba(0,0,0,0.6);border:2px solid rgba(255,255,255,0.4);border-radius:8px;color:#fff;font-size:20px;cursor:pointer;display:none;line-height:40px;text-align:center">||</div>
<div id="pauseScreen" style="position:fixed;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.85);z-index:15;color:#fff">
    <h2 style="font-size:40px;margin-bottom:20px;color:#4ecdc4">暂停</h2>

    <button style="padding:12px 40px;font-size:18px;background:linear-gradient(135deg,#666,#444);color:#fff;border:none;border-radius:30px;cursor:pointer;margin:8px" onclick="location.reload()">返回菜单</button>
</div>

<script>
// ============================================================
// 细胞吞噬 - Game 19 (Major Rework v2)
// ============================================================

const Canvas = document.getElementById('gameCanvas');
const ctx = Canvas.getContext('2d');

// 游戏配置
const CONFIG = {
    MAP_SIZE: 2000,
    FOOD_COUNT: 300,
    PLAYER_INIT_SIZE: 40,
    SPEED_BASE: 5,
    SPEED_DECAY: 0.005,
    VIEWPORT_PADDING: 100,
    MINIMAP_SIZE: 150,
    GRID_SIZE: 50,
    BORDER_WIDTH: 20,
    // 王者模式
    KING_TARGET_SIZE: 500,
    // 病毒
    VIRUS_SIZE: 25,
    VIRUS_RESPAWN_TIME: 10,
    VIRUS_FRAGMENT_COUNT: 7,
    VIRUS_FRAGMENT_SIZE: 6,
    VIRUS_DAMAGE_RATIO: 0.40,
    VIRUS_THRESHOLD: 60,
    // 缩圈伤害：每秒扣除当前体积的5%
    SHRINK_DAMAGE_RATE: 0.05,
    // Boss
    BOSS_SIZE: 200,
    BOSS_SPEED: 1.8,
    BOSS_FOOD_INTERVAL: 2,
    // 猎手AI
    HUNTER_SIZE_MIN: 80,
    HUNTER_SIZE_MAX: 150,
};

// 传统模式关卡配置
const LEVEL_DATA = [
    { targetEats: 8,  aiCount: 20, viruses: 0, shrinkDelay: 0,   shrinkSpeed: 0 },
    { targetEats: 10, aiCount: 25, viruses: 0, shrinkDelay: 0,   shrinkSpeed: 0 },
    { targetEats: 12, aiCount: 30, viruses: 0, shrinkDelay: 60,  shrinkSpeed: 0.3 },
    { targetEats: 14, aiCount: 30, viruses: 2, shrinkDelay: 45,  shrinkSpeed: 0.5 },
    { targetEats: 16, aiCount: 35, viruses: 3, shrinkDelay: 45,  shrinkSpeed: 0.5 },
    { targetEats: 18, aiCount: 35, viruses: 4, shrinkDelay: 30,  shrinkSpeed: 0.8 },
    { targetEats: 20, aiCount: 40, viruses: 5, shrinkDelay: 30,  shrinkSpeed: 0.8 },
    { targetEats: 22, aiCount: 40, viruses: 6, shrinkDelay: 30,  shrinkSpeed: 0.8 },
    { targetEats: 25, aiCount: 45, viruses: 7, shrinkDelay: 20,  shrinkSpeed: 1.2 },
    { targetEats: 0,  aiCount: 0,  viruses: 8, shrinkDelay: 20,  shrinkSpeed: 1.2, isBoss: true },
];

// AI 类型定义
const AI_TYPES = {
    SMALL:  { min: 5,  max: 12, color: () => randomHue(120, 180) },
    MEDIUM: { min: 12, max: 30, color: () => randomHue(30, 60) },
    LARGE:  { min: 30, max: 45, color: () => randomHue(0, 30) },
};

// 游戏状态
let gameState = 'menu'; // menu, playing, paused, gameover, win
let gameMode = null; // 'traditional' | 'king'
let canvasWidth, canvasHeight;
let camera = { x: 0, y: 0 };
let mouse = { x: 0, y: 0, worldX: 0, worldY: 0 };
let lastChosenMode = null; // track which mode button was last clicked for Enter key

// 游戏对象
let player = null;
let aiCells = [];
let foodItems = [];
let particles = [];
let viruses = [];
let boss = null;

// 传统模式
let currentLevel = 0;
let levelEatCount = 0;
let shrinkMargin = 0;
let shrinkActive = false;
let shrinkStartTime = 0;
let levelStartTime = 0;

// 王者模式
let hunterCount = 0;

// 统计数据
let stats = {
    score: 0,
    maxSize: 0,
    eatCount: 0,
    startTime: 0,
    totalEatCount: 0,
    highscore: 0,
    bestMaxSize: 0
};

// 音频系统
let audioCtx = null;

// ============================================================
// 初始化
// ============================================================

function init() {
    resizeCanvas();
    loadStats();
    updatePreviewStats();
    setupEventListeners();
    requestAnimationFrame(gameLoop);
}

function resizeCanvas() {
    canvasWidth = window.innerWidth;
    canvasHeight = window.innerHeight;
    Canvas.width = canvasWidth;
    Canvas.height = canvasHeight;
}

function loadStats() {
    try {
        const saved = localStorage.getItem('cellGame_stats');
        if (saved) {
            const data = JSON.parse(saved);
            stats.totalEatCount = data.totalEatCount || 0;
            stats.highscore = data.highscore || 0;
            stats.bestMaxSize = data.bestMaxSize || 0;
        }
    } catch (e) {}
}

function saveStats() {
    try {
        localStorage.setItem('cellGame_stats', JSON.stringify({
            totalEatCount: stats.totalEatCount,
            highscore: stats.highscore,
            bestMaxSize: stats.bestMaxSize
        }));
    } catch (e) {}
}

function updatePreviewStats() {
    document.getElementById('previewHighscore').textContent = stats.highscore;
    document.getElementById('previewEatCount').textContent = stats.totalEatCount;
}

// ============================================================
// 音频系统
// ============================================================

function initAudio() {
    if (audioCtx) return;
    try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch(e) {}
}

function playSound(type) {
    if (!audioCtx) return;

    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    switch (type) {
        case 'eat':
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
            osc.start(now);
            osc.stop(now + 0.15);
            break;
        case 'die':
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(100, now + 0.3);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
            osc.start(now);
            osc.stop(now + 0.4);
            break;
        case 'virus':
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.exponentialRampToValueAtTime(50, now + 0.25);
            gain.gain.setValueAtTime(0.18, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
            osc.start(now);
            osc.stop(now + 0.35);
            break;
        case 'levelup':
            osc.frequency.setValueAtTime(500, now);
            osc.frequency.exponentialRampToValueAtTime(1000, now + 0.15);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.frequency.setValueAtTime(800, now + 0.12);
            osc2.frequency.exponentialRampToValueAtTime(1400, now + 0.3);
            gain2.gain.setValueAtTime(0.1, now + 0.12);
            gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
            osc2.start(now + 0.12);
            osc2.stop(now + 0.35);
            break;
        case 'win':
            [523, 659, 784, 1047].forEach((freq, i) => {
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.connect(g);
                g.connect(audioCtx.destination);
                o.frequency.setValueAtTime(freq, now + i * 0.15);
                g.gain.setValueAtTime(0.15, now + i * 0.15);
                g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.15 + 0.3);
                o.start(now + i * 0.15);
                o.stop(now + i * 0.15 + 0.3);
            });
            break;
    }
}

// ============================================================
// 游戏对象创建
// ============================================================

function createCell(x, y, size, color, isPlayer) {
    return {
        x, y, size, color, isPlayer: !!isPlayer,
        vx: 0, vy: 0,
        eatAnimation: 0,
        pulsePhase: Math.random() * Math.PI * 2
    };
}

function createPlayer(name) {
    const x = CONFIG.MAP_SIZE / 2 + (Math.random() - 0.5) * 400;
    const y = CONFIG.MAP_SIZE / 2 + (Math.random() - 0.5) * 400;
    return createCell(x, y, CONFIG.PLAYER_INIT_SIZE, '#4a90d9', true);
}

function createAI(typeKey) {
    const config = AI_TYPES[typeKey];
    const size = config.min + Math.random() * (config.max - config.min);
    const margin = 100;
    const x = margin + Math.random() * (CONFIG.MAP_SIZE - margin * 2);
    const y = margin + Math.random() * (CONFIG.MAP_SIZE - margin * 2);
    const cell = createCell(x, y, size, config.color(), false);
    cell.aiType = typeKey;
    cell.targetX = x;
    cell.targetY = y;
    cell.changeTargetTime = Date.now() + Math.random() * 3000;
    return cell;
}

function createHunter() {
    const maxSize = player ? Math.min(CONFIG.HUNTER_SIZE_MAX, player.size * 0.85) : CONFIG.HUNTER_SIZE_MAX;
    const size = CONFIG.HUNTER_SIZE_MIN + Math.random() * (maxSize - CONFIG.HUNTER_SIZE_MIN);
    const margin = 150;
    const x = margin + Math.random() * (CONFIG.MAP_SIZE - margin * 2);
    const y = margin + Math.random() * (CONFIG.MAP_SIZE - margin * 2);
    const cell = createCell(x, y, size, '#ffd700', false);
    cell.isHunter = true;
    cell.targetX = x;
    cell.targetY = y;
    cell.changeTargetTime = 0;
    return cell;
}

function createBoss() {
    const x = CONFIG.MAP_SIZE / 2;
    const y = CONFIG.MAP_SIZE / 2;
    const cell = createCell(x, y, CONFIG.BOSS_SIZE, '#ff4757', false);
    cell.isBoss = true;
    cell.targetX = x;
    cell.targetY = y;
    cell.lastFoodTime = 0;
    return cell;
}

function createFood(x, y) {
    const margin = 50;
    return {
        x: x || (margin + Math.random() * (CONFIG.MAP_SIZE - margin * 2)),
        y: y || (margin + Math.random() * (CONFIG.MAP_SIZE - margin * 2)),
        size: 3 + Math.random() * 2,
        color: `hsl(${Math.random() * 360}, 70%, 60%)`,
        pulsePhase: Math.random() * Math.PI * 2,
        vx: 0, vy: 0
    };
}

function createVirus(x, y) {
    return {
        x: x || (200 + Math.random() * (CONFIG.MAP_SIZE - 400)),
        y: y || (200 + Math.random() * (CONFIG.MAP_SIZE - 400)),
        size: CONFIG.VIRUS_SIZE,
        active: true,
        respawnTime: 0,
        pulsePhase: Math.random() * Math.PI * 2
    };
}

function createParticle(x, y, color) {
    return {
        x, y,
        vx: (Math.random() - 0.5) * 4,
        vy: (Math.random() - 0.5) * 4,
        size: 2 + Math.random() * 3,
        color,
        alpha: 1,
        life: 0.5 + Math.random() * 0.3
    };
}

function togglePause() {
    if (gameState === 'playing') {
        gameState = 'paused';
        document.getElementById('pauseScreen').style.display = 'flex';
        document.getElementById('pauseBtn').innerHTML = '▶';
    } else if (gameState === 'paused') {
        gameState = 'playing';
        document.getElementById('pauseScreen').style.display = 'none';
        document.getElementById('pauseBtn').innerHTML = '||';
    }
}

// ============================================================
// 游戏开始/结束
// ============================================================

function startGame(mode) {
    initAudio();
    if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    gameMode = mode;

    stats.score = 0;
    stats.maxSize = CONFIG.PLAYER_INIT_SIZE;
    stats.eatCount = 0;
    stats.startTime = Date.now();

    player = createPlayer('玩家');
    aiCells = [];
    foodItems = [];
    particles = [];
    viruses = [];
    boss = null;
    hunterCount = 0;

    if (mode === 'traditional') {
        currentLevel = 0;
        levelEatCount = 0;
        levelStartTime = Date.now();
        setupLevel(currentLevel);
    } else {
        currentLevel = -1;
        setupKingMode();
    }

    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('gameOverScreen').style.display = 'none';
    document.getElementById('winScreen').style.display = 'none';
    document.getElementById('pauseScreen').style.display = 'none';
    document.getElementById('levelTransition').style.display = 'none';
    document.getElementById('pauseBtn').style.display = 'block';
    document.getElementById('hud').style.display = 'flex';

    setupHUD();
    gameState = 'playing';
}

function setupLevel(levelIdx) {
    const lvl = LEVEL_DATA[levelIdx];
    aiCells = [];
    viruses = [];
    boss = null;
    levelEatCount = 0;
    shrinkMargin = 0;
    shrinkActive = false;
    shrinkStartTime = 0;
    levelStartTime = Date.now();

    // AI
    if (lvl.isBoss) {
        boss = createBoss();
    } else {
        for (let i = 0; i < lvl.aiCount; i++) {
            const types = ['SMALL', 'MEDIUM', 'LARGE'];
            const type = types[Math.floor(Math.random() * types.length)];
            aiCells.push(createAI(type));
        }
    }

    // Viruses
    for (let i = 0; i < lvl.viruses; i++) {
        viruses.push(createVirus());
    }

    // Setup shrink
    if (lvl.shrinkDelay > 0 && lvl.shrinkSpeed > 0) {
        shrinkStartTime = Date.now() + lvl.shrinkDelay * 1000;
    }

    // Replenish food
    while (foodItems.length < CONFIG.FOOD_COUNT) {
        foodItems.push(createFood());
    }

    // Ensure player exists and is at a safe position
    if (!player) {
        player = createPlayer('玩家');
    } else {
        // Reset player size for new level but keep some momentum
        player.size = Math.max(CONFIG.PLAYER_INIT_SIZE, player.size * 0.6);
        player.x = Math.max(player.size, Math.min(CONFIG.MAP_SIZE - player.size, player.x));
        player.y = Math.max(player.size, Math.min(CONFIG.MAP_SIZE - player.size, player.y));
    }
}

function setupKingMode() {
    const aiCount = 30;
    for (let i = 0; i < aiCount; i++) {
        const types = ['SMALL', 'MEDIUM', 'LARGE'];
        const type = types[Math.floor(Math.random() * types.length)];
        aiCells.push(createAI(type));
    }
    while (foodItems.length < CONFIG.FOOD_COUNT) {
        foodItems.push(createFood());
    }
    hunterCount = 0;
}

function advanceLevel() {
    currentLevel++;
    if (currentLevel >= LEVEL_DATA.length) {
        triggerWin();
        return;
    }
    playSound('levelup');
    showLevelTransition(currentLevel + 1);
    setupLevel(currentLevel);
    setupHUD();
}

function showLevelTransition(levelNum) {
    const el = document.getElementById('levelTransition');
    const isBoss = LEVEL_DATA[currentLevel] && LEVEL_DATA[currentLevel].isBoss;
    document.getElementById('lvlText').textContent = isBoss ? 'Boss 关卡!' : `第 ${levelNum} 关`;
    document.getElementById('lvlSub').textContent = isBoss ? '吞噬Boss即可通关！' : `目标: 吞噬 ${LEVEL_DATA[currentLevel].targetEats} 个细胞`;
    el.style.display = 'flex';
    gameState = 'paused';
    setTimeout(() => {
        el.style.display = 'none';
        if (gameState === 'paused') gameState = 'playing';
    }, 2000);
}

function triggerWin() {
    gameState = 'win';
    playSound('win');

    if (stats.score > stats.highscore) stats.highscore = stats.score;
    if (stats.maxSize > stats.bestMaxSize) stats.bestMaxSize = stats.maxSize;
    stats.totalEatCount += stats.eatCount;
    saveStats();

    const elapsed = Math.floor((Date.now() - stats.startTime) / 1000);

    document.getElementById('winScore').textContent = stats.score;
    document.getElementById('winMaxSize').textContent = Math.floor(stats.maxSize);
    document.getElementById('winEatCount').textContent = stats.eatCount;
    document.getElementById('winTime').textContent = formatTime(elapsed);

    document.getElementById('winScreen').style.display = 'flex';
    document.getElementById('pauseBtn').style.display = 'none';
    document.getElementById('hud').style.display = 'none';
}

function gameOver(isTraditional) {
    gameState = 'gameover';
    playSound('die');

    if (stats.score > stats.highscore) stats.highscore = stats.score;
    if (stats.maxSize > stats.bestMaxSize) stats.bestMaxSize = stats.maxSize;
    stats.totalEatCount += stats.eatCount;
    saveStats();

    const elapsed = Math.floor((Date.now() - stats.startTime) / 1000);

    document.getElementById('goTitle').textContent = isTraditional ? '被吞噬了！' : '游戏结束';
    document.getElementById('finalScore').textContent = stats.score;
    document.getElementById('finalMaxSize').textContent = Math.floor(stats.maxSize);
    document.getElementById('finalEatCount').textContent = stats.eatCount;
    document.getElementById('finalTime').textContent = formatTime(elapsed);
    document.getElementById('finalHighscore').textContent = stats.highscore;

    if (isTraditional) {
        document.getElementById('finalLevel').textContent = currentLevel + 1;
        document.getElementById('statLevel').style.display = 'flex';
        document.getElementById('retryBtn').style.display = 'inline-block';
        document.getElementById('retryBtn').textContent = '重试第' + (currentLevel + 1) + '关';
    } else {
        document.getElementById('statLevel').style.display = 'none';
        document.getElementById('retryBtn').style.display = 'none';
    }

    document.getElementById('gameOverScreen').style.display = 'flex';
    document.getElementById('pauseBtn').style.display = 'none';
    document.getElementById('hud').style.display = 'none';
}

function formatTime(seconds) {
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    return m > 0 ? `${m}分${s}秒` : `${s}秒`;
}

function retryLevel() {
    document.getElementById('gameOverScreen').style.display = 'none';
    document.getElementById('pauseBtn').style.display = 'block';
    document.getElementById('hud').style.display = 'flex';

    stats.score = Math.max(0, stats.score - 50);
    stats.eatCount = Math.max(0, stats.eatCount - 2);
    stats.maxSize = CONFIG.PLAYER_INIT_SIZE;

    player = createPlayer('玩家');
    setupLevel(currentLevel);
    setupHUD();
    gameState = 'playing';
}

function returnToMenu() {
    gameState = 'menu';
    document.getElementById('gameOverScreen').style.display = 'none';
    document.getElementById('winScreen').style.display = 'none';
    document.getElementById('pauseBtn').style.display = 'none';
    document.getElementById('hud').style.display = 'none';
    document.getElementById('startScreen').style.display = 'flex';
    updatePreviewStats();
    player = null;
    aiCells = [];
    foodItems = [];
    particles = [];
    viruses = [];
    boss = null;
    GameMonetize.cleanup();
}

function setupHUD() {
    const isTraditional = gameMode === 'traditional';
    document.getElementById('hudLevel').style.display = isTraditional ? 'inline' : 'none';
    document.getElementById('hudTarget').style.display = isTraditional ? 'inline' : 'none';
    document.getElementById('hudShrink').style.display = isTraditional ? 'inline' : 'none';
    document.getElementById('hudHunters').style.display = isTraditional ? 'none' : 'inline';
    document.getElementById('hudProgress').style.display = isTraditional ? 'none' : 'flex';

    if (isTraditional) {
        const lvl = LEVEL_DATA[currentLevel];
        document.getElementById('hudLevelNum').textContent = currentLevel + 1;
        if (lvl.isBoss) {
            document.getElementById('hudTargetText').textContent = 'Boss';
        } else {
            document.getElementById('hudTargetText').textContent = levelEatCount + '/' + lvl.targetEats;
        }
    } else {
        document.getElementById('hudHunterCount').textContent = hunterCount;
    }
}

function updateMouseWorld() {
    mouse.worldX = mouse.x + camera.x - canvasWidth / 2;
    mouse.worldY = mouse.y + camera.y - canvasHeight / 2;
}

// ============================================================
// 游戏逻辑更新
// ============================================================

function update(deltaTime) {
    if (gameState !== 'playing') return;
    if (!player) return;

    updatePlayerMovement(deltaTime);
    updateAI(deltaTime);
    updateBoss(deltaTime);
    updateViruses(deltaTime);
    updateFood(deltaTime);
    updateShrinkZone(deltaTime);
    updateParticles(deltaTime);
    checkCollisions();
    updateCamera();
    updateHUD();
    checkPlayerDeath();
    updateKingModeHunters();
    checkLevelComplete();
}

function updatePlayerMovement(deltaTime) {
    if (!player) return;

    const dx = mouse.worldX - player.x;
    const dy = mouse.worldY - player.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    const speed = CONFIG.SPEED_BASE / (1 + player.size * CONFIG.SPEED_DECAY);

    if (dist > 5) {
        player.vx = (dx / dist) * speed;
        player.vy = (dy / dist) * speed;
    } else {
        player.vx *= 0.9;
        player.vy *= 0.9;
    }

    player.x += player.vx;
    player.y += player.vy;

    player.x = Math.max(player.size, Math.min(CONFIG.MAP_SIZE - player.size, player.x));
    player.y = Math.max(player.size, Math.min(CONFIG.MAP_SIZE - player.size, player.y));

    player.pulsePhase += deltaTime * 2;
    player.eatAnimation = Math.max(0, player.eatAnimation - deltaTime * 4);

    if (player.size > stats.maxSize) stats.maxSize = player.size;
}

function updateAI(deltaTime) {
    const now = Date.now();

    aiCells.forEach(ai => {
        const speed = CONFIG.SPEED_BASE / (1 + ai.size * CONFIG.SPEED_DECAY);

        if (now > ai.changeTargetTime) {
            ai.changeTargetTime = now + 800 + Math.random() * 1500;

            if (ai.isHunter) {
                // Hunter: always chase player
                if (player) {
                    ai.targetX = player.x;
                    ai.targetY = player.y;
                }
            } else if (gameMode === 'king' && player && player.size >= 400) {
                // King mode 400+: all AI become hostile, chase player if bigger
                if (ai.size > player.size * 0.9) {
                    ai.targetX = player.x;
                    ai.targetY = player.y;
                } else {
                    // Flee
                    const dx = ai.x - player.x;
                    const dy = ai.y - player.y;
                    const d = Math.sqrt(dx * dx + dy * dy) || 1;
                    ai.targetX = ai.x + (dx / d) * 300;
                    ai.targetY = ai.y + (dy / d) * 300;
                    ai.targetX = Math.max(50, Math.min(CONFIG.MAP_SIZE - 50, ai.targetX));
                    ai.targetY = Math.max(50, Math.min(CONFIG.MAP_SIZE - 50, ai.targetY));
                }
            } else {
                // Normal AI behavior
                switch (ai.aiType) {
                    case 'SMALL':
                        if (player && player.size > ai.size * 1.2 && distance(ai, player) < 200) {
                            const dx = ai.x - player.x;
                            const dy = ai.y - player.y;
                            const d = Math.sqrt(dx * dx + dy * dy) || 1;
                            ai.targetX = ai.x + (dx / d) * 250;
                            ai.targetY = ai.y + (dy / d) * 250;
                        } else {
                            ai.targetX = 100 + Math.random() * (CONFIG.MAP_SIZE - 200);
                            ai.targetY = 100 + Math.random() * (CONFIG.MAP_SIZE - 200);
                        }
                        break;

                    case 'MEDIUM':
                        const nearSmall = findNearestSmaller(ai);
                        const nearBig = findNearestBigger(ai);
                        if (nearBig && distance(ai, nearBig) < 250) {
                            const dx = ai.x - nearBig.x;
                            const dy = ai.y - nearBig.y;
                            const d = Math.sqrt(dx * dx + dy * dy) || 1;
                            ai.targetX = ai.x + (dx / d) * 250;
                            ai.targetY = ai.y + (dy / d) * 250;
                        } else if (nearSmall && distance(ai, nearSmall) < 350) {
                            ai.targetX = nearSmall.x;
                            ai.targetY = nearSmall.y;
                        } else {
                            ai.targetX = 100 + Math.random() * (CONFIG.MAP_SIZE - 200);
                            ai.targetY = 100 + Math.random() * (CONFIG.MAP_SIZE - 200);
                        }
                        break;

                    case 'LARGE':
                        const target = findNearestSmaller(ai) || (player && player.size < ai.size * 0.9 ? player : null);
                        if (target) {
                            ai.targetX = target.x;
                            ai.targetY = target.y;
                        } else {
                            ai.targetX = 100 + Math.random() * (CONFIG.MAP_SIZE - 200);
                            ai.targetY = 100 + Math.random() * (CONFIG.MAP_SIZE - 200);
                        }
                        break;
                }
            }

            ai.targetX = Math.max(ai.size, Math.min(CONFIG.MAP_SIZE - ai.size, ai.targetX));
            ai.targetY = Math.max(ai.size, Math.min(CONFIG.MAP_SIZE - ai.size, ai.targetY));
        }

        const dx = ai.targetX - ai.x;
        const dy = ai.targetY - ai.y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;

        const aiSpeed = ai.isHunter ? speed * 1.3 : speed * 0.8;
        ai.vx = (dx / dist) * aiSpeed;
        ai.vy = (dy / dist) * aiSpeed;

        ai.x += ai.vx;
        ai.y += ai.vy;

        ai.x = Math.max(ai.size, Math.min(CONFIG.MAP_SIZE - ai.size, ai.x));
        ai.y = Math.max(ai.size, Math.min(CONFIG.MAP_SIZE - ai.size, ai.y));

        ai.pulsePhase += deltaTime * 1.5;
        ai.eatAnimation = Math.max(0, ai.eatAnimation - deltaTime * 4);
    });
}

function updateBoss(deltaTime) {
    if (!boss) return;
    const now = Date.now();

    if (player) {
        const dx = player.x - boss.x;
        const dy = player.y - boss.y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        const speed = CONFIG.BOSS_SPEED;
        boss.vx = (dx / dist) * speed;
        boss.vy = (dy / dist) * speed;
        boss.x += boss.vx;
        boss.y += boss.vy;
        boss.x = Math.max(boss.size, Math.min(CONFIG.MAP_SIZE - boss.size, boss.x));
        boss.y = Math.max(boss.size, Math.min(CONFIG.MAP_SIZE - boss.size, boss.y));

        // Emit food to lure player
        if (now - boss.lastFoodTime > CONFIG.BOSS_FOOD_INTERVAL * 1000) {
            boss.lastFoodTime = now;
            const angle = Math.random() * Math.PI * 2;
            const dist2 = boss.size + 30 + Math.random() * 100;
            const fx = boss.x + Math.cos(angle) * dist2;
            const fy = boss.y + Math.sin(angle) * dist2;
            const food = createFood(fx, fy);
            food.size = 4 + Math.random() * 3;
            food.color = '#ff6b81';
            foodItems.push(food);
        }
    }
}

function updateViruses(deltaTime) {
    const now = Date.now();
    viruses.forEach(v => {
        if (!v.active && now > v.respawnTime) {
            v.active = true;
        }
        v.pulsePhase += deltaTime * 3;
    });
}

function updateFood(deltaTime) {
    foodItems.forEach(food => {
        food.pulsePhase += deltaTime * 3;
        if (food.vx) {
            food.x += food.vx;
            food.y += food.vy;
            food.vx *= 0.95;
            food.vy *= 0.95;
            if (Math.abs(food.vx) < 0.1) food.vx = 0;
            if (Math.abs(food.vy) < 0.1) food.vy = 0;
        }
        food.x = Math.max(food.size, Math.min(CONFIG.MAP_SIZE - food.size, food.x));
        food.y = Math.max(food.size, Math.min(CONFIG.MAP_SIZE - food.size, food.y));
    });

    while (foodItems.length < CONFIG.FOOD_COUNT) {
        foodItems.push(createFood());
    }
}

function updateShrinkZone(deltaTime) {
    if (gameMode !== 'traditional') return;
    if (!player) return;

    const lvl = LEVEL_DATA[currentLevel];
    if (!lvl || lvl.shrinkDelay <= 0 || lvl.shrinkSpeed <= 0) return;

    const now = Date.now();
    const elapsed = (now - levelStartTime) / 1000;

    if (elapsed >= lvl.shrinkDelay) {
        shrinkActive = true;
        const shrinkElapsed = elapsed - lvl.shrinkDelay;
        shrinkMargin = Math.min(CONFIG.MAP_SIZE / 2 - 50, shrinkElapsed * lvl.shrinkSpeed);

        // Damage player outside safe zone
        const safeLeft = shrinkMargin;
        const safeRight = CONFIG.MAP_SIZE - shrinkMargin;
        const safeTop = shrinkMargin;
        const safeBottom = CONFIG.MAP_SIZE - shrinkMargin;

        if (player.x < safeLeft || player.x > safeRight || player.y < safeTop || player.y > safeBottom) {
            player.size -= player.size * CONFIG.SHRINK_DAMAGE_RATE * deltaTime;
            if (player.size < 10) player.size = 10;
        }
    }
}

function updateParticles(deltaTime) {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= deltaTime;
        p.alpha = Math.max(0, p.life / 0.8);
        if (p.life <= 0) {
            particles.splice(i, 1);
        }
    }
}

function updateKingModeHunters() {
    if (gameMode !== 'king' || !player) return;

    const playerSize = player.size;
    let desiredHunters = 0;

    if (playerSize < 100) {
        desiredHunters = 0;
    } else if (playerSize < 300) {
        desiredHunters = 1;
    } else if (playerSize < 400) {
        desiredHunters = 3;
    } else {
        desiredHunters = 5;
    }

    // Spawn or remove hunters
    while (hunterCount < desiredHunters) {
        const hunter = createHunter();
        // Place away from player
        if (player) {
            const angle = Math.random() * Math.PI * 2;
            const dist = 300 + Math.random() * 400;
            hunter.x = player.x + Math.cos(angle) * dist;
            hunter.y = player.y + Math.sin(angle) * dist;
            hunter.x = Math.max(hunter.size, Math.min(CONFIG.MAP_SIZE - hunter.size, hunter.x));
            hunter.y = Math.max(hunter.size, Math.min(CONFIG.MAP_SIZE - hunter.size, hunter.y));
        }
        aiCells.push(hunter);
        hunterCount++;
    }

    while (hunterCount > desiredHunters) {
        // Remove excess hunters
        for (let i = aiCells.length - 1; i >= 0; i--) {
            if (aiCells[i].isHunter) {
                spawnParticles(aiCells[i].x, aiCells[i].y, aiCells[i].color, 8);
                aiCells.splice(i, 1);
                hunterCount--;
                break;
            }
        }
    }
}

// ============================================================
// 病毒爆炸
// ============================================================

function triggerVirus(virus, cell) {
    if (!virus.active) return;
    virus.active = false;
    virus.respawnTime = Date.now() + CONFIG.VIRUS_RESPAWN_TIME * 1000;
    playSound('virus');

    const fragCount = CONFIG.VIRUS_FRAGMENT_COUNT;
    for (let i = 0; i < fragCount; i++) {
        const angle = (Math.PI * 2 / fragCount) * i + Math.random() * 0.5;
        const dist = virus.size + 10 + Math.random() * 40;
        const frag = createFood(
            virus.x + Math.cos(angle) * dist,
            virus.y + Math.sin(angle) * dist
        );
        frag.size = CONFIG.VIRUS_FRAGMENT_SIZE + Math.random() * 3;
        frag.color = '#44bd64';
        frag.vx = Math.cos(angle) * (2 + Math.random() * 3);
        frag.vy = Math.sin(angle) * (2 + Math.random() * 3);
        foodItems.push(frag);
    }

    spawnParticles(virus.x, virus.y, '#44ff64', 12);
}

// ============================================================
// 碰撞检测
// ============================================================

function checkCollisions() {
    if (!player) return;

    // 玩家吃食物
    for (let i = foodItems.length - 1; i >= 0; i--) {
        const food = foodItems[i];
        if (distance(player, food) < player.size) {
            player.size = Math.sqrt(player.size * player.size + food.size * food.size);
            player.eatAnimation = 0.5;
            stats.score += Math.floor(food.size);
            foodItems.splice(i, 1);
            spawnParticles(food.x, food.y, food.color, 2);
        }
    }

    // 玩家撞病毒
    for (let i = viruses.length - 1; i >= 0; i--) {
        const v = viruses[i];
        if (v.active && distance(player, v) < player.size + v.size) {
            // Skip virus damage if player is temporarily invincible (e.g., just ate boss)
            if (player.invincibleUntil && Date.now() < player.invincibleUntil) continue;
            if (player.size > CONFIG.VIRUS_THRESHOLD) {
                const lostMass = player.size * CONFIG.VIRUS_DAMAGE_RATIO;
                player.size -= lostMass;
                triggerVirus(v, player);
                if (player.size < 15) player.size = 15;
            }
        }
    }

    // 玩家吃AI
    for (let i = aiCells.length - 1; i >= 0; i--) {
        const ai = aiCells[i];
        if (player.size > ai.size * 1.1 && distance(player, ai) < player.size - ai.size * 0.2) {
            player.size = Math.sqrt(player.size * player.size + ai.size * ai.size);
            player.eatAnimation = 0.8;
            stats.score += Math.floor(ai.size * 2);
            stats.eatCount++;
            if (ai.isHunter) hunterCount--;
            spawnParticles(ai.x, ai.y, ai.color, 8);
            playSound('eat');
            aiCells.splice(i, 1);

            if (gameMode === 'traditional') {
                levelEatCount++;
            }
        }
    }

    // 玩家吃Boss
    if (boss && player.size > boss.size * 1.1 && distance(player, boss) < player.size - boss.size * 0.2) {
        player.size = Math.sqrt(player.size * player.size + boss.size * boss.size);
        player.eatAnimation = 1;
        stats.score += Math.floor(boss.size * 5);
        stats.eatCount++;
        spawnParticles(boss.x, boss.y, boss.color, 30);
        playSound('eat');
        boss = null;
        // Boss defeated → win: give brief invincibility to prevent death during transition window
        player.invincibleUntil = Date.now() + 600;
        setTimeout(() => { if (gameState === 'playing' || gameState === 'paused') advanceLevel(); }, 500);
    }

    // AI吃食物
    aiCells.forEach(ai => {
        for (let i = foodItems.length - 1; i >= 0; i--) {
            const food = foodItems[i];
            if (distance(ai, food) < ai.size) {
                ai.size = Math.sqrt(ai.size * ai.size + food.size * food.size);
                ai.eatAnimation = 0.3;
                foodItems.splice(i, 1);
            }
        }
    });

    // AI撞病毒
    for (let i = aiCells.length - 1; i >= 0; i--) {
        const ai = aiCells[i];
        for (let j = viruses.length - 1; j >= 0; j--) {
            const v = viruses[j];
            if (v.active && distance(ai, v) < ai.size + v.size && ai.size > CONFIG.VIRUS_THRESHOLD) {
                // AI destroyed by virus
                if (ai.isHunter) hunterCount--;
                triggerVirus(v, ai);
                spawnParticles(ai.x, ai.y, ai.color, 8);
                aiCells.splice(i, 1);
                break;
            }
        }
    }

    // AI互相吃
    for (let i = 0; i < aiCells.length; i++) {
        for (let j = aiCells.length - 1; j > i; j--) {
            const a = aiCells[i];
            const b = aiCells[j];
            if (!a || !b) continue;
            if (a.size > b.size * 1.1 && distance(a, b) < a.size - b.size * 0.3) {
                a.size = Math.sqrt(a.size * a.size + b.size * b.size);
                a.eatAnimation = 0.5;
                if (b.isHunter) hunterCount--;
                spawnParticles(b.x, b.y, b.color, 5);
                aiCells.splice(j, 1);
                j++; // compensate: element slid from j+1 into j, recheck it
            } else if (b.size > a.size * 1.1 && distance(b, a) < b.size - a.size * 0.3) {
                b.size = Math.sqrt(a.size * a.size + b.size * b.size);
                b.eatAnimation = 0.5;
                if (a.isHunter) hunterCount--;
                spawnParticles(a.x, a.y, a.color, 5);
                aiCells.splice(i, 1);
                i--;
                break;
            }
        }
    }

    // AI吃玩家
    for (let i = aiCells.length - 1; i >= 0; i--) {
        const ai = aiCells[i];
        if (!player) break;
        if (player.invincibleUntil && Date.now() < player.invincibleUntil) continue;
        if (ai.size > player.size * 1.1 && distance(ai, player) < ai.size - player.size * 0.3) {
            ai.size = Math.sqrt(ai.size * ai.size + player.size * player.size);
            ai.eatAnimation = 0.8;
            spawnParticles(player.x, player.y, player.color, 12);
            playSound('die');
            player = null;
            break;
        }
    }

    // Boss吃玩家
    if (boss && player && !(player.invincibleUntil && Date.now() < player.invincibleUntil) && boss.size > player.size * 1.1 && distance(boss, player) < boss.size - player.size * 0.3) {
        boss.size = Math.sqrt(boss.size * boss.size + player.size * player.size);
        spawnParticles(player.x, player.y, player.color, 15);
        playSound('die');
        player = null;
    }
}

function checkPlayerDeath() {
    if (!player) {
        if (gameMode === 'traditional') {
            gameOver(true);
        } else {
            gameOver(false);
        }
    }
}

function checkLevelComplete() {
    // Check king mode win first (before early return for traditional-only logic)
    if (gameMode === 'king' && player && player.size >= CONFIG.KING_TARGET_SIZE) {
        triggerWin();
        return;
    }

    if (gameMode !== 'traditional') return;
    const lvl = LEVEL_DATA[currentLevel];
    if (!lvl) return;

    if (!lvl.isBoss && levelEatCount >= lvl.targetEats) {
        advanceLevel();
    }
}

function respawnAI() {
    if (gameMode === 'traditional') {
        const lvl = LEVEL_DATA[currentLevel];
        if (!lvl || lvl.isBoss) return;
        const targetCount = lvl.aiCount;
        while (aiCells.length < targetCount) {
            const types = ['SMALL', 'MEDIUM', 'LARGE'];
            const type = types[Math.floor(Math.random() * types.length)];
            const ai = createAI(type);
            if (player) {
                let tooClose = false;
                if (distance(ai, player) < player.size + 200) {
                    tooClose = true;
                }
                if (tooClose) {
                    const dx = ai.x - player.x;
                    const dy = ai.y - player.y;
                    const d = Math.sqrt(dx * dx + dy * dy) || 1;
                    ai.x = player.x + (dx / d) * (player.size + 300);
                    ai.y = player.y + (dy / d) * (player.size + 300);
                    ai.x = Math.max(ai.size, Math.min(CONFIG.MAP_SIZE - ai.size, ai.x));
                    ai.y = Math.max(ai.size, Math.min(CONFIG.MAP_SIZE - ai.size, ai.y));
                }
            }
            aiCells.push(ai);
        }
    } else {
        // King mode: maintain 30 non-hunter AI
        const baseCount = 30;
        while (aiCells.filter(a => !a.isHunter).length < baseCount) {
            const types = ['SMALL', 'MEDIUM', 'LARGE'];
            const type = types[Math.floor(Math.random() * types.length)];
            const ai = createAI(type);
            if (player) {
                let tooClose = false;
                if (distance(ai, player) < player.size + 200) tooClose = true;
                if (tooClose) {
                    const dx = ai.x - player.x;
                    const dy = ai.y - player.y;
                    const d = Math.sqrt(dx * dx + dy * dy) || 1;
                    ai.x = player.x + (dx / d) * (player.size + 300);
                    ai.y = player.y + (dy / d) * (player.size + 300);
                    ai.x = Math.max(ai.size, Math.min(CONFIG.MAP_SIZE - ai.size, ai.x));
                    ai.y = Math.max(ai.size, Math.min(CONFIG.MAP_SIZE - ai.size, ai.y));
                }
            }
            aiCells.push(ai);
        }
    }
}

// ============================================================
// 辅助函数
// ============================================================

function distance(a, b) {
    if (!a || !b) return Infinity;
    const dx = a.x - b.x;
    const dy = a.y - b.y;
    return Math.sqrt(dx * dx + dy * dy);
}

function findNearestSmaller(cell) {
    let nearest = null;
    let minDist = Infinity;

    aiCells.forEach(other => {
        if (other === cell || other.size >= cell.size * 0.9) return;
        const d = distance(cell, other);
        if (d < minDist) { minDist = d; nearest = other; }
    });

    if (player && player.size < cell.size * 0.9) {
        const d = distance(cell, player);
        if (d < minDist) { minDist = d; nearest = player; }
    }

    return nearest;
}

function findNearestBigger(cell) {
    let nearest = null;
    let minDist = Infinity;

    aiCells.forEach(other => {
        if (other === cell || other.size <= cell.size * 1.1) return;
        const d = distance(cell, other);
        if (d < minDist) { minDist = d; nearest = other; }
    });

    if (player && player.size > cell.size * 1.1) {
        const d = distance(cell, player);
        if (d < minDist) { minDist = d; nearest = player; }
    }

    if (boss && boss.size > cell.size * 1.1) {
        const d = distance(cell, boss);
        if (d < minDist) { minDist = d; nearest = boss; }
    }

    return nearest;
}

function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        particles.push(createParticle(x, y, color));
    }
}

function randomHue(min, max) {
    const h = min + Math.random() * (max - min);
    return `hsl(${h}, 70%, 55%)`;
}

// ============================================================
// 相机与HUD
// ============================================================

function updateCamera() {
    if (!player) return;
    camera.x = player.x;
    camera.y = player.y;
    updateMouseWorld();
}

function updateHUD() {
    if (!player) return;
    document.getElementById('hudScore').textContent = stats.score;
    document.getElementById('hudSize').textContent = Math.floor(player.size);

    if (gameMode === 'traditional') {
        const lvl = LEVEL_DATA[currentLevel];
        document.getElementById('hudLevelNum').textContent = currentLevel + 1;
        if (lvl.isBoss) {
            document.getElementById('hudTargetText').textContent = 'Boss';
        } else {
            document.getElementById('hudTargetText').textContent = levelEatCount + '/' + lvl.targetEats;
        }

        // Shrink countdown
        if (lvl.shrinkDelay > 0 && lvl.shrinkSpeed > 0) {
            const elapsed = (Date.now() - levelStartTime) / 1000;
            if (elapsed < lvl.shrinkDelay) {
                const remaining = Math.ceil(lvl.shrinkDelay - elapsed);
                document.getElementById('hudShrinkTime').textContent = remaining + 's';
                document.getElementById('hudShrinkTime').className = 'value';
            } else if (shrinkActive) {
                document.getElementById('hudShrinkTime').textContent = '缩圈中';
                document.getElementById('hudShrinkTime').className = 'value warn';
            }
        } else {
            document.getElementById('hudShrinkTime').textContent = '--';
            document.getElementById('hudShrinkTime').className = 'value';
        }
    } else {
        // King mode
        document.getElementById('hudHunterCount').textContent = hunterCount;
        const progress = Math.min(100, Math.floor(player.size / CONFIG.KING_TARGET_SIZE * 100));
        document.getElementById('progressFill').style.width = progress + '%';
        document.getElementById('progressText').textContent = Math.floor(player.size) + '/' + CONFIG.KING_TARGET_SIZE;
    }
}

// ============================================================
// 渲染
// ============================================================

function render() {
    ctx.clearRect(0, 0, canvasWidth, canvasHeight);

    ctx.save();
    ctx.translate(canvasWidth / 2 - camera.x, canvasHeight / 2 - camera.y);

    drawGrid();
    drawShrinkZone();
    drawBorder();
    drawFood();
    drawViruses();
    drawAICells();
    drawBoss();
    if (player) drawPlayerCell();
    drawParticles();

    ctx.restore();

    drawMinimap();
}

function drawGrid() {
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
    ctx.lineWidth = 1;

    const startX = Math.floor((camera.x - canvasWidth / 2) / CONFIG.GRID_SIZE) * CONFIG.GRID_SIZE;
    const startY = Math.floor((camera.y - canvasHeight / 2) / CONFIG.GRID_SIZE) * CONFIG.GRID_SIZE;
    const endX = camera.x + canvasWidth / 2;
    const endY = camera.y + canvasHeight / 2;

    for (let x = startX; x < endX; x += CONFIG.GRID_SIZE) {
        ctx.beginPath();
        ctx.moveTo(x, startY);
        ctx.lineTo(x, endY);
        ctx.stroke();
    }

    for (let y = startY; y < endY; y += CONFIG.GRID_SIZE) {
        ctx.beginPath();
        ctx.moveTo(startX, y);
        ctx.lineTo(endX, y);
        ctx.stroke();
    }
}

function drawShrinkZone() {
    if (gameMode !== 'traditional' || shrinkMargin <= 0) return;

    // Draw red overlay outside safe zone
    const margin = shrinkMargin;
    const safeL = margin;
    const safeR = CONFIG.MAP_SIZE - margin;
    const safeT = margin;
    const safeB = CONFIG.MAP_SIZE - margin;

    ctx.fillStyle = 'rgba(255, 0, 0, 0.15)';

    // Top strip
    ctx.fillRect(0, 0, CONFIG.MAP_SIZE, safeT);
    // Bottom strip
    ctx.fillRect(0, safeB, CONFIG.MAP_SIZE, CONFIG.MAP_SIZE - safeB);
    // Left strip (between top and bottom)
    ctx.fillRect(0, safeT, safeL, safeB - safeT);
    // Right strip
    ctx.fillRect(safeR, safeT, CONFIG.MAP_SIZE - safeR, safeB - safeT);

    // Safe zone border
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
    ctx.lineWidth = 3;
    ctx.setLineDash([10, 5]);
    ctx.strokeRect(safeL, safeT, safeR - safeL, safeB - safeT);
    ctx.setLineDash([]);
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(255, 100, 100, 0.8)';
    ctx.strokeRect(safeL, safeT, safeR - safeL, safeB - safeT);
}

function drawBorder() {
    ctx.strokeStyle = '#ff4757';
    ctx.lineWidth = CONFIG.BORDER_WIDTH;
    ctx.strokeRect(0, 0, CONFIG.MAP_SIZE, CONFIG.MAP_SIZE);

    const pulse = Math.sin(Date.now() / 500) * 0.3 + 0.7;
    ctx.strokeStyle = `rgba(255, 71, 87, ${pulse * 0.3})`;
    ctx.lineWidth = CONFIG.BORDER_WIDTH + 20;
    ctx.strokeRect(0, 0, CONFIG.MAP_SIZE, CONFIG.MAP_SIZE);
}

function drawCell(cell, isPlayer, isBoss) {
    const pulse = Math.sin(cell.pulsePhase) * 0.05 + 1;
    const drawSize = cell.size * pulse;
    const scale = 1 + cell.eatAnimation * 0.15;

    ctx.save();
    ctx.translate(cell.x, cell.y);
    ctx.scale(scale, scale);

    // Boss special effects
    if (isBoss) {
        // Spiky aura
        ctx.strokeStyle = 'rgba(255, 71, 87, 0.5)';
        ctx.lineWidth = 4;
        const spikes = 12;
        for (let i = 0; i < spikes; i++) {
            const angle = (Math.PI * 2 / spikes) * i + Date.now() / 2000;
            const innerR = drawSize * 1.1;
            const outerR = drawSize * 1.4;
            ctx.beginPath();
            ctx.moveTo(Math.cos(angle) * innerR, Math.sin(angle) * innerR);
            ctx.lineTo(Math.cos(angle) * outerR, Math.sin(angle) * outerR);
            ctx.stroke();
        }
    }

    // Glow
    const glowSize = drawSize * 1.3;
    const gradient = ctx.createRadialGradient(0, 0, drawSize * 0.8, 0, 0, glowSize);
    gradient.addColorStop(0, 'rgba(255, 255, 255, 0.1)');
    gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(0, 0, glowSize, 0, Math.PI * 2);
    ctx.fill();

    // Body
    const bodyGrad = ctx.createRadialGradient(-drawSize * 0.2, -drawSize * 0.2, drawSize * 0.1, 0, 0, drawSize);
    bodyGrad.addColorStop(0, adjustBrightness(cell.color, 30));
    bodyGrad.addColorStop(0.7, cell.color);
    bodyGrad.addColorStop(1, adjustBrightness(cell.color, -30));
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.arc(0, 0, drawSize, 0, Math.PI * 2);
    ctx.fill();

    // Border
    if (isBoss) {
        ctx.strokeStyle = 'rgba(255, 215, 0, 0.7)';
        ctx.lineWidth = 4;
    } else if (isPlayer) {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.lineWidth = 2;
    } else if (cell.isHunter) {
        ctx.strokeStyle = 'rgba(255, 215, 0, 0.6)';
        ctx.lineWidth = 2;
    } else {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.lineWidth = 1;
    }
    ctx.stroke();

    // Highlight
    ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
    ctx.beginPath();
    ctx.arc(-drawSize * 0.25, -drawSize * 0.25, drawSize * 0.35, 0, Math.PI * 2);
    ctx.fill();

    // Name/size label
    if (drawSize > 20) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.font = `bold ${Math.max(10, drawSize * 0.4)}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const label = isBoss ? 'BOSS' : (cell.isHunter ? '猎' : Math.floor(cell.size));
        ctx.fillText(label, 0, 0);
    }

    // Boss crown
    if (isBoss && drawSize > 30) {
        ctx.fillStyle = '#ffd700';
        ctx.font = `bold ${Math.max(14, drawSize * 0.35)}px Arial`;
        ctx.fillText('👑', 0, -drawSize * 0.7);
    }

    ctx.restore();
}

function drawPlayerCell() {
    if (player) drawCell(player, true, false);
}

function drawBoss() {
    if (boss) drawCell(boss, false, true);
}

function drawAICells() {
    aiCells.forEach(ai => drawCell(ai, false, false));
}

function drawViruses() {
    viruses.forEach(v => {
        if (!v.active) return;
        const pulse = Math.sin(v.pulsePhase) * 0.15 + 1;
        const drawSize = v.size * pulse;

        // Spiky virus
        ctx.save();
        ctx.translate(v.x, v.y);

        const spikes = 10;
        const innerR = drawSize * 0.6;
        const outerR = drawSize * 1.2;

        // Body
        const grad = ctx.createRadialGradient(0, 0, drawSize * 0.2, 0, 0, drawSize);
        grad.addColorStop(0, '#66ff88');
        grad.addColorStop(1, '#228833');
        ctx.fillStyle = grad;

        ctx.beginPath();
        for (let i = 0; i < spikes; i++) {
            const angle = (Math.PI * 2 / spikes) * i;
            const angle2 = (Math.PI * 2 / spikes) * (i + 0.5);
            ctx.lineTo(Math.cos(angle) * outerR, Math.sin(angle) * outerR);
            ctx.lineTo(Math.cos(angle2) * innerR, Math.sin(angle2) * innerR);
        }
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = 'rgba(100, 255, 150, 0.6)';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Center dot
        ctx.fillStyle = '#aaffcc';
        ctx.beginPath();
        ctx.arc(0, 0, drawSize * 0.3, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    });
}

function drawFood() {
    foodItems.forEach(food => {
        const pulse = Math.sin(food.pulsePhase) * 0.3 + 1;
        const drawSize = food.size * pulse;

        ctx.fillStyle = food.color;
        ctx.beginPath();
        ctx.arc(food.x, food.y, drawSize, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.beginPath();
        ctx.arc(food.x - drawSize * 0.2, food.y - drawSize * 0.2, drawSize * 0.4, 0, Math.PI * 2);
        ctx.fill();
    });
}

function drawParticles() {
    particles.forEach(p => {
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;
}

function drawMinimap() {
    const size = CONFIG.MINIMAP_SIZE;
    const padding = 15;
    const x = canvasWidth - size - padding;
    const y = canvasHeight - size - padding - 90; // Above ad banner

    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
    ctx.fillRect(x, y, size, size);

    ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
    ctx.lineWidth = 1;
    ctx.strokeRect(x, y, size, size);

    const scale = size / CONFIG.MAP_SIZE;

    // Shrink zone on minimap
    if (shrinkMargin > 0) {
        const m = shrinkMargin * scale;
        ctx.fillStyle = 'rgba(255, 0, 0, 0.3)';
        ctx.fillRect(x, y, size, m); // top
        ctx.fillRect(x, y + size - m, size, m); // bottom
        ctx.fillRect(x, y + m, m, size - m * 2); // left
        ctx.fillRect(x + size - m, y + m, m, size - m * 2); // right
    }

    // Food
    foodItems.forEach(food => {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.fillRect(x + food.x * scale, y + food.y * scale, 1, 1);
    });

    // Viruses
    viruses.forEach(v => {
        if (!v.active) return;
        ctx.fillStyle = '#44bd64';
        ctx.fillRect(x + v.x * scale - 2, y + v.y * scale - 2, 4, 4);
    });

    // AI
    aiCells.forEach(ai => {
        ctx.fillStyle = ai.isHunter ? '#ffd700' : ai.color;
        ctx.fillRect(x + ai.x * scale - 2, y + ai.y * scale - 2, 4, 4);
    });

    // Boss
    if (boss) {
        ctx.fillStyle = '#ff4757';
        ctx.fillRect(x + boss.x * scale - 4, y + boss.y * scale - 4, 8, 8);
    }

    // Player
    if (player) {
        ctx.fillStyle = '#fff';
        ctx.fillRect(x + player.x * scale - 3, y + player.y * scale - 3, 6, 6);
    }

    // Viewport frame
    const vx = x + (camera.x - canvasWidth / 2) * scale;
    const vy = y + (camera.y - canvasHeight / 2) * scale;
    const vw = canvasWidth * scale;
    const vh = canvasHeight * scale;
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
    ctx.strokeRect(vx, vy, vw, vh);
}

function adjustBrightness(color, amount) {
    if (color.startsWith('hsl')) {
        const match = color.match(/hsl\((\d+),\s*(\d+)%,\s*(\d+)%\)/);
        if (match) {
            const h = parseInt(match[1]);
            const s = parseInt(match[2]);
            const l = Math.max(0, Math.min(100, parseInt(match[3]) + amount));
            return `hsl(${h}, ${s}%, ${l}%)`;
        }
    }

    if (color.startsWith('#')) {
        let r = parseInt(color.slice(1, 3), 16);
        let g = parseInt(color.slice(3, 5), 16);
        let b = parseInt(color.slice(5, 7), 16);
        r = Math.max(0, Math.min(255, r + amount));
        g = Math.max(0, Math.min(255, g + amount));
        b = Math.max(0, Math.min(255, b + amount));
        return `rgb(${r}, ${g}, ${b})`;
    }

    return color;
}

// ============================================================
// 游戏循环
// ============================================================

let lastTime = 0;

function gameLoop(timestamp) {
    const deltaTime = Math.min(0.05, (timestamp - lastTime) / 1000);
    lastTime = timestamp;

    if (gameState === 'playing') {
        update(deltaTime);
        respawnAI();
        render();
    }

    requestAnimationFrame(gameLoop);
}

// ============================================================
// 启动
// ============================================================

init();

    _startGameOverWatcher() {
        const checkGameOver = () => {
            if (this._gameOverDetected) return;
            if (typeof gameState !== 'undefined' && gameState === 'menu') return;
            const restartBtn = document.getElementById('restartBtn');
            if (restartBtn && restartBtn.offsetParent !== null && getComputedStyle(restartBtn).display !== 'none') {
                this._gameOverDetected = true;
                this.onGameOver();
                return;
            }
            const goScreen = document.getElementById('gameOverScreen');
            if (goScreen && getComputedStyle(goScreen).display !== 'none') {
                this._gameOverDetected = true;
                this.onGameOver();
                return;
            }
            const goScreen2 = document.getElementById('screen-gameover');
            if (goScreen2 && !goScreen2.classList.contains('hidden')) {
                this._gameOverDetected = true;
                this.onGameOver();
                return;
            }
        };
        this._goInterval = setInterval(() => {
            checkGameOver();
            if (this._gameOverDetected) {
                setTimeout(() => { this._gameOverDetected = false; }, 2000);
            }
        }, 500);
    },
    requestRevive(callback) {
        this._reviveCallback = callback || null;

        if (!el) { if (callback) callback(); return; }
        const s2 = document.createElement('script');
        s2.src = 'https://pl29544742.effectivecpmnetwork.com/be/a9/6d/bea96d779c0ee07c2b15613852dd3e70.js';

        setTimeout(() => { const slot = document.getElementById('interstitialAdSlot'); if (slot && slot.innerHTML.includes('加载中')) { slot.innerHTML = '<div style=color:#aaa;font:13px Microsoft YaHei,sans-serif>广告暂时无法加载<br>点击下方按钮继续</div>'; } }, 3000);
        const skipBtn = document.getElementById('skipInterstitial');
        if (skipBtn) {
            skipBtn.textContent = '5 秒后可跳过'; skipBtn.disabled = true;

            const timer = setInterval(() => {
                cd--;
                if (cd <= 0) { clearInterval(timer); skipBtn.textContent = '跳过广告 ▶'; skipBtn.disabled = false; }
                else { skipBtn.textContent = cd + ' 秒后可跳过'; }
            }, 1000);
        }
    },
    onGameOver() {
        this._deathCount++;
        if (!this.interstitial.enabled) return;
        if (this._deathCount < this.interstitial.gameCount) return;
        if (Date.now() - this._lastInterTime < this.interstitial.cooldownMs) return;
        this._lastInterTime = Date.now(); this._deathCount = 0;
        this.requestRevive(null);
    },
    cleanup() {
        if (this._goInterval) { clearInterval(this._goInterval); this._goInterval = null; }
    },
};
