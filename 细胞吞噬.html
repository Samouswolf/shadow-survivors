<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>细胞吞噬</title>
<style>
* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}

body {
	background: #000;
	overflow: hidden;
	font-family: 'Microsoft YaHei', Arial, sans-serif;
	color: #fff;
	user-select: none;
	-webkit-user-select: none;
}

canvas {
	display: block;
	background: #0a0a1a;
	image-rendering: pixelated;
}

#startScreen {
	position: fixed;
	top: 0;
	left: 0;
	width: 100%;
	height: 100%;
	background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	z-index: 100;
}

#startScreen h1 {
	font-size: 3.5rem;
	margin-bottom: 1rem;
	background: linear-gradient(90deg, #00d4ff, #7b2ff7, #ff2d95);
	-webkit-background-clip: text;
	-webkit-text-fill-color: transparent;
	background-clip: text;
	text-shadow: 0 0 40px rgba(0, 212, 255, 0.3);
}

#startScreen .subtitle {
	font-size: 1.2rem;
	color: #888;
	margin-bottom: 2rem;
}

#nicknameInput {
	width: 280px;
	padding: 12px 20px;
	font-size: 1.1rem;
	background: rgba(255, 255, 255, 0.1);
	border: 2px solid rgba(255, 255, 255, 0.2);
	border-radius: 25px;
	color: #fff;
	outline: none;
	text-align: center;
	margin-bottom: 1.5rem;
	transition: all 0.3s ease;
}

#nicknameInput:focus {
	border-color: #00d4ff;
	box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
}

#nicknameInput::placeholder {
	color: rgba(255, 255, 255, 0.4);
}

#startBtn {
	padding: 14px 50px;
	font-size: 1.3rem;
	background: linear-gradient(90deg, #00d4ff, #7b2ff7);
	border: none;
	border-radius: 30px;
	color: #fff;
	cursor: pointer;
	transition: all 0.3s ease;
	font-weight: bold;
}

#startBtn:hover {
	transform: scale(1.05);
	box-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
}

.stats-preview {
	margin-top: 2rem;
	font-size: 0.9rem;
	color: #666;
}

.stats-preview span {
	margin: 0 10px;
}

#gameOverScreen {
	position: fixed;
	top: 0;
	left: 0;
	width: 100%;
	height: 100%;
	background: rgba(0, 0, 0, 0.85);
	display: none;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	z-index: 100;
	backdrop-filter: blur(5px);
}

#gameOverScreen h2 {
	font-size: 2.5rem;
	color: #ff4757;
	margin-bottom: 1.5rem;
}

.game-stats {
	background: rgba(255, 255, 255, 0.05);
	border-radius: 15px;
	padding: 25px 40px;
	margin-bottom: 2rem;
	min-width: 300px;
}

.game-stats .stat {
	display: flex;
	justify-content: space-between;
	margin: 12px 0;
	font-size: 1.1rem;
}

.game-stats .stat .label {
	color: #888;
}

.game-stats .stat .value {
	font-weight: bold;
	color: #00d4ff;
}

.game-stats .stat .value.highlight {
	color: #ff2d95;
	font-size: 1.3rem;
}

#restartBtn {
	padding: 12px 40px;
	font-size: 1.2rem;
	background: linear-gradient(90deg, #ff2d95, #7b2ff7);
	border: none;
	border-radius: 25px;
	color: #fff;
	cursor: pointer;
	transition: all 0.3s ease;
}

#restartBtn:hover {
	transform: scale(1.05);
}

#hud {
	position: fixed;
	top: 0;
	left: 0;
	width: 100%;
	padding: 15px 20px;
	display: none;
	justify-content: space-between;
	z-index: 50;
	pointer-events: none;
}

.hud-left, .hud-right {
	display: flex;
	gap: 20px;
}

.hud-item {
	background: rgba(0, 0, 0, 0.5);
	padding: 8px 15px;
	border-radius: 20px;
	font-size: 0.95rem;
	backdrop-filter: blur(5px);
}

.hud-item .value {
	font-weight: bold;
	color: #00d4ff;
	margin-left: 5px;
}

#mobileControls {
	position: fixed;
	bottom: 20px;
	right: 20px;
	display: none;
	z-index: 50;
}

.mobile-btn {
	width: 60px;
	height: 60px;
	border-radius: 50%;
	background: rgba(255, 255, 255, 0.15);
	border: 2px solid rgba(255, 255, 255, 0.3);
	display: flex;
	justify-content: center;
	align-items: center;
	font-size: 0.8rem;
	margin-left: 10px;
	float: right;
	backdrop-filter: blur(5px);
}

.mobile-btn:active {
	background: rgba(255, 255, 255, 0.3);
}
</style>

.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.interstitial-ad .ad-content{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;text-align:center;min-width:280px;max-width:400px}
.interstitial-ad .ad-content p{color:#aaa;font:14px "Microsoft YaHei",sans-serif;margin-bottom:12px}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="startScreen">
	<h1>细胞吞噬</h1>
	<div class="subtitle">Agar.io 风格大吃小</div>
	<input type="text" id="nicknameInput" placeholder="输入你的昵称" maxlength="12">
	<button id="startBtn">开始游戏</button>
	<div class="stats-preview">
		<span>最高分: <span id="previewHighscore">0</span></span>
		<span>总吞噬: <span id="previewEatCount">0</span></span>
	</div>
</div>

<div id="gameOverScreen">
	<h2>游戏结束</h2>
	<div class="game-stats">
		<div class="stat">
			<span class="label">得分</span>
			<span class="value highlight" id="finalScore">0</span>
		</div>
		<div class="stat">
			<span class="label">最大体积</span>
			<span class="value" id="finalMaxSize">0</span>
		</div>
		<div class="stat">
			<span class="label">吞噬数量</span>
			<span class="value" id="finalEatCount">0</span>
		</div>
		<div class="stat">
			<span class="label">存活时间</span>
			<span class="value" id="finalTime">0s</span>
		</div>
		<div class="stat">
			<span class="label">最高分</span>
			<span class="value" id="finalHighscore">0</span>
		</div>
	</div>
	<button id="restartBtn">再来一局</button>
</div>

<div id="hud">
	<div class="hud-left">
		<div class="hud-item">分数: <span class="value" id="hudScore">0</span></div>
		<div class="hud-item">大小: <span class="value" id="hudSize">30</span></div>
	</div>
	<div class="hud-right">
		<div class="hud-item">排名: <span class="value" id="hudRank">1/31</span></div>
		<div class="hud-item">分裂: <span class="value" id="hudSplits">0/4</span></div>
	</div>
</div>

<div id="mobileControls">
	<div class="mobile-btn" id="btnSplit">分裂</div>
	<div class="mobile-btn" id="btnEject">吐出</div>
</div>
<div id="pauseBtn" style="position:absolute;top:8px;right:8px;z-index:20;width:44px;height:44px;background:rgba(0,0,0,0.6);border:2px solid rgba(255,255,255,0.4);border-radius:8px;color:#fff;font-size:20px;cursor:pointer;display:none;line-height:40px;text-align:center">||</div>
<div id="pauseScreen" style="position:absolute;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.85);z-index:15;color:#fff">
	<h2 style="font-size:40px;margin-bottom:20px;color:#4ecdc4">暂停</h2>
	<button style="padding:15px 50px;font-size:22px;background:linear-gradient(135deg,#4ecdc4,#44bd64);color:#fff;border:none;border-radius:30px;cursor:pointer;margin:8px" onclick="togglePause()">继续游戏</button>
	<button style="padding:12px 40px;font-size:18px;background:linear-gradient(135deg,#666,#444);color:#fff;border:none;border-radius:30px;cursor:pointer;margin:8px" onclick="location.reload()">返回菜单</button>
</div>

<script>
// ============================================================
// 细胞吞噬 - Game 19
// ============================================================

const Canvas = document.getElementById('gameCanvas');
const ctx = Canvas.getContext('2d');

// 游戏配置
const CONFIG = {
	MAP_SIZE: 2000,
	FOOD_COUNT: 300,
	AI_COUNT: 30,
	PLAYER_INIT_SIZE: 40,
	PLAYER_MAX_SIZE: 500,
	SPEED_BASE: 5,
	SPEED_DECAY: 0.005,
	SPLIT_SPEED: 15,
	SPLIT_COOLDOWN: 5000,
	MAX_SPLITS: 4,
	EJECT_MASS_RATIO: 0.1,
	EJECT_SIZE: 10,
	MERGE_DISTANCE: 0.6,
	VIEWPORT_PADDING: 100,
	MINIMAP_SIZE: 150,
	GRID_SIZE: 50,
	BORDER_WIDTH: 20,
	AI_TYPES: {
		SMALL: { min: 5, max: 12, count: 15, color: () => randomHue(120, 180) },
		MEDIUM: { min: 12, max: 30, count: 10, color: () => randomHue(30, 60) },
		LARGE: { min: 30, max: 45, count: 3, color: () => randomHue(0, 30) }
	}
};

// 游戏状态
let gameState = 'menu'; // menu, playing, paused, gameover
let canvasWidth, canvasHeight;
let camera = { x: 0, y: 0 };
let mouse = { x: 0, y: 0, worldX: 0, worldY: 0 };
let isMobile = false;

// 游戏对象
let player = null;
let playerCells = [];
let aiCells = [];
let foodItems = [];
let particles = [];

// 统计数据
let stats = {
	score: 0,
	maxSize: 0,
	eatCount: 0,
	startTime: 0,
	totalEatCount: 0,
	highscore: 0,
	bestMaxSize: 0
};

// 音频系统
let audioCtx = null;
const sounds = {};

// ============================================================
// 初始化
// ============================================================

function init() {
	resizeCanvas();
	loadStats();
	updatePreviewStats();
	setupEventListeners();
	checkMobile();
	requestAnimationFrame(gameLoop);
}

function resizeCanvas() {
	canvasWidth = window.innerWidth;
	canvasHeight = window.innerHeight;
	Canvas.width = canvasWidth;
	Canvas.height = canvasHeight;
}

function loadStats() {
	try {
		const saved = localStorage.getItem('cellGame_stats');
		if (saved) {
			const data = JSON.parse(saved);
			stats.totalEatCount = data.totalEatCount || 0;
			stats.highscore = data.highscore || 0;
			stats.bestMaxSize = data.bestMaxSize || 0;
		}
	} catch (e) {}
}

function saveStats() {
	try {
		localStorage.setItem('cellGame_stats', JSON.stringify({
			totalEatCount: stats.totalEatCount,
			highscore: stats.highscore,
			bestMaxSize: stats.bestMaxSize
		}));
	} catch (e) {}
}

function updatePreviewStats() {
	document.getElementById('previewHighscore').textContent = stats.highscore;
	document.getElementById('previewEatCount').textContent = stats.totalEatCount;
}

function checkMobile() {
	isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
	if (isMobile) {
		document.getElementById('mobileControls').style.display = 'block';
	}
}

// ============================================================
// 音频系统
// ============================================================

function initAudio() {
	if (audioCtx) return;
	audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playSound(type) {
	if (!audioCtx) return;

	const now = audioCtx.currentTime;
	const osc = audioCtx.createOscillator();
	const gain = audioCtx.createGain();

	osc.connect(gain);
	gain.connect(audioCtx.destination);

	switch (type) {
		case 'eat':
			osc.frequency.setValueAtTime(600, now);
			osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
			gain.gain.setValueAtTime(0.15, now);
			gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
			osc.start(now);
			osc.stop(now + 0.15);
			break;

		case 'split':
			osc.frequency.setValueAtTime(400, now);
			osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
			gain.gain.setValueAtTime(0.12, now);
			gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
			osc.start(now);
			osc.stop(now + 0.12);
			break;

		case 'merge':
			osc.frequency.setValueAtTime(800, now);
			osc.frequency.exponentialRampToValueAtTime(400, now + 0.15);
			gain.gain.setValueAtTime(0.1, now);
			gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
			osc.start(now);
			osc.stop(now + 0.2);
			break;

		case 'die':
			osc.frequency.setValueAtTime(300, now);
			osc.frequency.exponentialRampToValueAtTime(100, now + 0.3);
			gain.gain.setValueAtTime(0.2, now);
			gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
			osc.start(now);
			osc.stop(now + 0.4);
			break;
	}
}

// ============================================================
// 游戏对象创建
// ============================================================

function createCell(x, y, size, color, isPlayer = false) {
	return {
		x,
		y,
		size,
		color,
		isPlayer,
		vx: 0,
		vy: 0,
		canMergeAt: 0,
		isSplitting: false,
		splitEndTime: 0,
		mergeAnimation: 0,
		eatAnimation: 0,
		pulsePhase: Math.random() * Math.PI * 2
	};
}

function createPlayer(name) {
	const x = CONFIG.MAP_SIZE / 2 + (Math.random() - 0.5) * 400;
	const y = CONFIG.MAP_SIZE / 2 + (Math.random() - 0.5) * 400;
	return createCell(x, y, CONFIG.PLAYER_INIT_SIZE, '#4a90d9', true);
}

function createAI(type) {
	const config = CONFIG.AI_TYPES[type];
	const size = config.min + Math.random() * (config.max - config.min);
	const margin = 100;
	const x = margin + Math.random() * (CONFIG.MAP_SIZE - margin * 2);
	const y = margin + Math.random() * (CONFIG.MAP_SIZE - margin * 2);
	const cell = createCell(x, y, size, config.color(), false);
	cell.aiType = type;
	cell.targetX = x;
	cell.targetY = y;
	cell.changeTargetTime = Date.now() + Math.random() * 3000;
	cell.splitCooldown = 0;
	return cell;
}

function createFood() {
	const margin = 50;
	return {
		x: margin + Math.random() * (CONFIG.MAP_SIZE - margin * 2),
		y: margin + Math.random() * (CONFIG.MAP_SIZE - margin * 2),
		size: 3 + Math.random() * 2,
		color: `hsl(${Math.random() * 360}, 70%, 60%)`,
		pulsePhase: Math.random() * Math.PI * 2
	};
}

function createParticle(x, y, color) {
	return {
		x,
		y,
		vx: (Math.random() - 0.5) * 4,
		vy: (Math.random() - 0.5) * 4,
		size: 2 + Math.random() * 3,
		color,
		alpha: 1,
		life: 0.5 + Math.random() * 0.3
	};
}

// ============================================================
// 暂停功能
// ============================================================

function togglePause() {
	if (gameState === 'playing') {
		gameState = 'paused';
		document.getElementById('pauseScreen').style.display = 'flex';
		document.getElementById('pauseBtn').innerHTML = '▶';
	} else if (gameState === 'paused') {
		gameState = 'playing';
		document.getElementById('pauseScreen').style.display = 'none';
		document.getElementById('pauseBtn').innerHTML = '||';
	}
}

// ============================================================
// 游戏开始/结束
// ============================================================

function startGame() {
	initAudio();

	const name = document.getElementById('nicknameInput').value.trim() || '玩家';

	stats.score = 0;
	stats.maxSize = CONFIG.PLAYER_INIT_SIZE;
	stats.eatCount = 0;
	stats.startTime = Date.now();

	player = createPlayer(name);
	playerCells = [player];

	aiCells = [];
	Object.entries(CONFIG.AI_TYPES).forEach(([type, config]) => {
		for (let i = 0; i < config.count; i++) {
			aiCells.push(createAI(type));
		}
	});

	foodItems = [];
	for (let i = 0; i < CONFIG.FOOD_COUNT; i++) {
		foodItems.push(createFood());
	}

	particles = [];

	document.getElementById('startScreen').style.display = 'none';
	document.getElementById('gameOverScreen').style.display = 'none';
	document.getElementById('pauseScreen').style.display = 'none';
	document.getElementById('pauseBtn').style.display = 'block';
	document.getElementById('hud').style.display = 'flex';

	gameState = 'playing';
}

function gameOver() {
	gameState = 'gameover';
	playSound('die');

	if (stats.score > stats.highscore) {
		stats.highscore = stats.score;
	}
	if (stats.maxSize > stats.bestMaxSize) {
		stats.bestMaxSize = stats.maxSize;
	}
	stats.totalEatCount += stats.eatCount;
	saveStats();

	const elapsed = Math.floor((Date.now() - stats.startTime) / 1000);

	document.getElementById('finalScore').textContent = stats.score;
	document.getElementById('finalMaxSize').textContent = Math.floor(stats.maxSize);
	document.getElementById('finalEatCount').textContent = stats.eatCount;
	document.getElementById('finalTime').textContent = formatTime(elapsed);
	document.getElementById('finalHighscore').textContent = stats.highscore;

	document.getElementById('gameOverScreen').style.display = 'flex';
	document.getElementById('pauseBtn').style.display = 'none';
	document.getElementById('hud').style.display = 'none';
}

function formatTime(seconds) {
	const m = Math.floor(seconds / 60);
	const s = seconds % 60;
	return m > 0 ? `${m}分${s}秒` : `${s}秒`;
}

// ============================================================
// 输入处理
// ============================================================

function setupEventListeners() {
	window.addEventListener('resize', resizeCanvas);

	Canvas.addEventListener('mousemove', (e) => {
		mouse.x = e.clientX;
		mouse.y = e.clientY;
		updateMouseWorld();
	});

	Canvas.addEventListener('touchstart', (e) => {
		e.preventDefault();
		const touch = e.touches[0];
		mouse.x = touch.clientX;
		mouse.y = touch.clientY;
		updateMouseWorld();
	}, { passive: false });

	Canvas.addEventListener('touchmove', (e) => {
		e.preventDefault();
		const touch = e.touches[0];
		mouse.x = touch.clientX;
		mouse.y = touch.clientY;
		updateMouseWorld();
	}, { passive: false });

	document.addEventListener('keydown', (e) => {
		if (e.code === 'Escape' && (gameState === 'playing' || gameState === 'paused')) {
			e.preventDefault();
			togglePause();
			return;
		}
		if (gameState !== 'playing') return;

		if (e.code === 'Space') {
			e.preventDefault();
			splitPlayer();
		} else if (e.code === 'KeyW') {
			e.preventDefault();
			ejectMass();
		}
	});

	document.getElementById('pauseBtn').addEventListener('click', (e) => {
		e.stopPropagation();
		togglePause();
	});
	document.getElementById('startBtn').addEventListener('click', startGame);
	document.getElementById('nicknameInput').addEventListener('keypress', (e) => {
		if (e.key === 'Enter') startGame();
	});

	document.getElementById('restartBtn').addEventListener('click', () => {
		document.getElementById('gameOverScreen').style.display = 'none';
		document.getElementById('startScreen').style.display = 'flex';
		updatePreviewStats();
	});

	document.getElementById('btnSplit').addEventListener('touchstart', (e) => {
		e.preventDefault();
		if (gameState === 'playing') splitPlayer();
	});

	document.getElementById('btnEject').addEventListener('touchstart', (e) => {
		e.preventDefault();
		if (gameState === 'playing') ejectMass();
	});
}

function updateMouseWorld() {
	mouse.worldX = mouse.x + camera.x - canvasWidth / 2;
	mouse.worldY = mouse.y + camera.y - canvasHeight / 2;
}

// ============================================================
// 玩家操作
// ============================================================

function splitPlayer() {
	if (playerCells.length >= CONFIG.MAX_SPLITS) return;

	const newCells = [];
	playerCells.forEach(cell => {
		if (playerCells.length + newCells.length >= CONFIG.MAX_SPLITS) return;

		const dx = mouse.worldX - cell.x;
		const dy = mouse.worldY - cell.y;
		const dist = Math.sqrt(dx * dx + dy * dy);

		if (dist < 1) return;

		const newSize = cell.size / Math.sqrt(2);
		if (newSize < 15) return;

		cell.size = newSize;

		const newCell = createCell(cell.x, cell.y, newSize, cell.color, true);
		newCell.vx = (dx / dist) * CONFIG.SPLIT_SPEED;
		newCell.vy = (dy / dist) * CONFIG.SPLIT_SPEED;
		newCell.isSplitting = true;
		newCell.splitEndTime = Date.now() + CONFIG.SPLIT_COOLDOWN;
		newCell.canMergeAt = Date.now() + CONFIG.SPLIT_COOLDOWN;
		cell.isSplitting = true;
		cell.splitEndTime = Date.now() + CONFIG.SPLIT_COOLDOWN;
		cell.canMergeAt = Date.now() + CONFIG.SPLIT_COOLDOWN;

		newCells.push(newCell);
	});

	if (newCells.length > 0) {
		playerCells.push(...newCells);
		playSound('split');
	}
}

function ejectMass() {
	playerCells.forEach(cell => {
		if (cell.size < 30) return;

		const ejectSize = cell.size * CONFIG.EJECT_MASS_RATIO;
		cell.size -= ejectSize;

		const dx = mouse.worldX - cell.x;
		const dy = mouse.worldY - cell.y;
		const dist = Math.sqrt(dx * dx + dy * dy) || 1;

		foodItems.push({
			x: cell.x + (dx / dist) * 30,
			y: cell.y + (dy / dist) * 30,
			size: Math.max(5, ejectSize / 2),
			color: cell.color,
			pulsePhase: 0,
			vx: (dx / dist) * 5,
			vy: (dy / dist) * 5
		});
	});
}

// ============================================================
// 游戏逻辑更新
// ============================================================

function update(deltaTime) {
	if (gameState !== 'playing') return;

	updatePlayerMovement(deltaTime);
	updatePlayerMerge(deltaTime);
	updateAI(deltaTime);
	updateFood(deltaTime);
	updateParticles(deltaTime);
	checkCollisions();
	updateCamera();
	updateHUD();
	checkPlayerDeath();
	respawnAI();
}

function updatePlayerMovement(deltaTime) {
	const now = Date.now();

	playerCells.forEach(cell => {
		if (cell.isSplitting) {
			if (now > cell.splitEndTime) {
				cell.isSplitting = false;
			} else {
				cell.vx *= 0.96;
				cell.vy *= 0.96;
				cell.x += cell.vx;
				cell.y += cell.vy;
				cell.x = Math.max(cell.size, Math.min(CONFIG.MAP_SIZE - cell.size, cell.x));
				cell.y = Math.max(cell.size, Math.min(CONFIG.MAP_SIZE - cell.size, cell.y));
				cell.pulsePhase += deltaTime * 2;
				cell.mergeAnimation = Math.max(0, cell.mergeAnimation - deltaTime * 3);
				cell.eatAnimation = Math.max(0, cell.eatAnimation - deltaTime * 4);
				return;
			}
		}

		const dx = mouse.worldX - cell.x;
		const dy = mouse.worldY - cell.y;
		const dist = Math.sqrt(dx * dx + dy * dy);

		const speed = CONFIG.SPEED_BASE / (1 + cell.size * CONFIG.SPEED_DECAY);

		if (dist > 5) {
			cell.vx = (dx / dist) * speed;
			cell.vy = (dy / dist) * speed;
		} else {
			cell.vx *= 0.9;
			cell.vy *= 0.9;
		}

		cell.x += cell.vx;
		cell.y += cell.vy;

		cell.x = Math.max(cell.size, Math.min(CONFIG.MAP_SIZE - cell.size, cell.x));
		cell.y = Math.max(cell.size, Math.min(CONFIG.MAP_SIZE - cell.size, cell.y));

		cell.pulsePhase += deltaTime * 2;
		cell.mergeAnimation = Math.max(0, cell.mergeAnimation - deltaTime * 3);
		cell.eatAnimation = Math.max(0, cell.eatAnimation - deltaTime * 4);
	});
}

function updatePlayerMerge(deltaTime) {
	if (playerCells.length < 2) return;

	const now = Date.now();

	for (let i = 0; i < playerCells.length; i++) {
		for (let j = i + 1; j < playerCells.length; j++) {
			const a = playerCells[i];
			const b = playerCells[j];

			if (now < a.canMergeAt || now < b.canMergeAt) continue;

			const dx = b.x - a.x;
			const dy = b.y - a.y;
			const dist = Math.sqrt(dx * dx + dy * dy);
			const mergeDist = (a.size + b.size) * CONFIG.MERGE_DISTANCE;

			if (dist < mergeDist) {
				if (a.size >= b.size) {
					a.size = Math.sqrt(a.size * a.size + b.size * b.size);
					a.mergeAnimation = 1;
					playerCells.splice(j, 1);
					j--;
					playSound('merge');
				} else {
					b.size = Math.sqrt(a.size * a.size + b.size * b.size);
					b.mergeAnimation = 1;
					playerCells.splice(i, 1);
					i--;
					playSound('merge');
					break;
				}
			}
		}
	}

	stats.maxSize = Math.max(stats.maxSize, getTotalPlayerSize());
}

function getTotalPlayerSize() {
	let total = 0;
	playerCells.forEach(c => total += c.size * c.size);
	return Math.sqrt(total);
}

function updateAI(deltaTime) {
	const now = Date.now();

	aiCells.forEach(ai => {
		const speed = CONFIG.SPEED_BASE / (1 + ai.size * CONFIG.SPEED_DECAY);
		const totalPlayerSize = getTotalPlayerSize();

		if (now > ai.changeTargetTime) {
			ai.changeTargetTime = now + 1000 + Math.random() * 2000;

			switch (ai.aiType) {
				case 'SMALL':
					if (totalPlayerSize > ai.size * 1.2 && distanceToPlayer(ai) < 200) {
						const nearest = getNearestPlayerCell(ai);
						if (nearest) {
							ai.targetX = ai.x - (nearest.x - ai.x) * 2;
							ai.targetY = ai.y - (nearest.y - ai.y) * 2;
						}
					} else {
						ai.targetX = 100 + Math.random() * (CONFIG.MAP_SIZE - 200);
						ai.targetY = 100 + Math.random() * (CONFIG.MAP_SIZE - 200);
					}
					break;

				case 'MEDIUM':
					const nearestSmall = findNearestSmaller(ai);
					const nearestBig = findNearestBigger(ai);
					if (nearestBig && distance(ai, nearestBig) < 250) {
						ai.targetX = ai.x - (nearestBig.x - ai.x) * 2;
						ai.targetY = ai.y - (nearestBig.y - ai.y) * 2;
					} else if (nearestSmall && distance(ai, nearestSmall) < 300) {
						ai.targetX = nearestSmall.x;
						ai.targetY = nearestSmall.y;
					} else {
						ai.targetX = 100 + Math.random() * (CONFIG.MAP_SIZE - 200);
						ai.targetY = 100 + Math.random() * (CONFIG.MAP_SIZE - 200);
					}
					break;

				case 'LARGE':
					const target = findNearestSmaller(ai) || getNearestPlayerCell(ai);
					if (target) {
						ai.targetX = target.x;
						ai.targetY = target.y;
					}
					break;
			}
		}

		const dx = ai.targetX - ai.x;
		const dy = ai.targetY - ai.y;
		const dist = Math.sqrt(dx * dx + dy * dy) || 1;

		ai.vx = (dx / dist) * speed * 0.8;
		ai.vy = (dy / dist) * speed * 0.8;

		ai.x += ai.vx;
		ai.y += ai.vy;

		ai.x = Math.max(ai.size, Math.min(CONFIG.MAP_SIZE - ai.size, ai.x));
		ai.y = Math.max(ai.size, Math.min(CONFIG.MAP_SIZE - ai.size, ai.y));

		ai.pulsePhase += deltaTime * 1.5;
		ai.eatAnimation = Math.max(0, ai.eatAnimation - deltaTime * 4);
	});
}

function updateFood(deltaTime) {
	foodItems.forEach(food => {
		food.pulsePhase += deltaTime * 3;
		if (food.vx) {
			food.x += food.vx;
			food.y += food.vy;
			food.vx *= 0.95;
			food.vy *= 0.95;
			if (Math.abs(food.vx) < 0.1) food.vx = 0;
			if (Math.abs(food.vy) < 0.1) food.vy = 0;
		}
		food.x = Math.max(food.size, Math.min(CONFIG.MAP_SIZE - food.size, food.x));
		food.y = Math.max(food.size, Math.min(CONFIG.MAP_SIZE - food.size, food.y));
	});

	while (foodItems.length < CONFIG.FOOD_COUNT) {
		foodItems.push(createFood());
	}
}

function updateParticles(deltaTime) {
	for (let i = particles.length - 1; i >= 0; i--) {
		const p = particles[i];
		p.x += p.vx;
		p.y += p.vy;
		p.life -= deltaTime;
		p.alpha = p.life / 0.8;
		if (p.life <= 0) {
			particles.splice(i, 1);
		}
	}
}

// ============================================================
// 碰撞检测
// ============================================================

function checkCollisions() {
	// 玩家吃食物
	playerCells.forEach(cell => {
		for (let i = foodItems.length - 1; i >= 0; i--) {
			const food = foodItems[i];
			if (distance(cell, food) < cell.size) {
				cell.size = Math.sqrt(cell.size * cell.size + food.size * food.size);
				cell.eatAnimation = 0.5;
				stats.score += Math.floor(food.size);
				foodItems.splice(i, 1);
				spawnParticles(food.x, food.y, food.color, 3);
			}
		}
	});

	// 玩家吃AI
	playerCells.forEach(cell => {
		for (let i = aiCells.length - 1; i >= 0; i--) {
			const ai = aiCells[i];
			if (cell.size >= ai.size && distance(cell, ai) < cell.size - ai.size * 0.2) {
				cell.size = Math.sqrt(cell.size * cell.size + ai.size * ai.size);
				cell.eatAnimation = 0.8;
				stats.score += Math.floor(ai.size * 2);
				stats.eatCount++;
				spawnParticles(ai.x, ai.y, ai.color, 8);
				playSound('eat');
				aiCells.splice(i, 1);
			}
		}
	});

	// AI吃食物
	aiCells.forEach(ai => {
		for (let i = foodItems.length - 1; i >= 0; i--) {
			const food = foodItems[i];
			if (distance(ai, food) < ai.size) {
				ai.size = Math.sqrt(ai.size * ai.size + food.size * food.size);
				ai.eatAnimation = 0.3;
				foodItems.splice(i, 1);
			}
		}
	});

	// AI互相吃
	for (let i = 0; i < aiCells.length; i++) {
		for (let j = aiCells.length - 1; j > i; j--) {
			const a = aiCells[i];
			const b = aiCells[j];
			if (a.size > b.size * 1.1 && distance(a, b) < a.size - b.size * 0.3) {
				a.size = Math.sqrt(a.size * a.size + b.size * b.size);
				a.eatAnimation = 0.5;
				spawnParticles(b.x, b.y, b.color, 5);
				aiCells.splice(j, 1);
			} else if (b.size > a.size * 1.1 && distance(b, a) < b.size - a.size * 0.3) {
				b.size = Math.sqrt(a.size * a.size + b.size * b.size);
				b.eatAnimation = 0.5;
				spawnParticles(a.x, a.y, a.color, 5);
				aiCells.splice(i, 1);
				i--;
				break;
			}
		}
	}

	// AI吃玩家
	for (let i = aiCells.length - 1; i >= 0; i--) {
		const ai = aiCells[i];
		for (let j = playerCells.length - 1; j >= 0; j--) {
			const cell = playerCells[j];
			if (ai.size > cell.size * 1.1 && distance(ai, cell) < ai.size - cell.size * 0.3) {
				ai.size = Math.sqrt(ai.size * ai.size + cell.size * cell.size);
				ai.eatAnimation = 0.8;
				spawnParticles(cell.x, cell.y, cell.color, 10);
				playerCells.splice(j, 1);
				playSound('die');
			}
		}
	}
}

function checkPlayerDeath() {
	if (playerCells.length === 0) {
		gameOver();
		return;
	}

	const totalSize = getTotalPlayerSize();
	if (totalSize > stats.maxSize) {
		stats.maxSize = totalSize;
	}
}

function respawnAI() {
	while (aiCells.length < CONFIG.AI_COUNT) {
		const types = Object.keys(CONFIG.AI_TYPES);
		const type = types[Math.floor(Math.random() * types.length)];
		const ai = createAI(type);

		if (playerCells.length > 0) {
			const totalPlayerSize = getTotalPlayerSize();
			let tooClose = false;
			for (const p of playerCells) {
				if (distance(ai, p) < totalPlayerSize + 200) {
					tooClose = true;
					break;
				}
			}
			if (tooClose) {
				const pushDist = totalPlayerSize + 300;
				let newX = ai.x;
				let newY = ai.y;
				for (const p of playerCells) {
					if (distance(ai, p) < totalPlayerSize + 200) {
						const dx = ai.x - p.x;
						const dy = ai.y - p.y;
						const d = Math.sqrt(dx * dx + dy * dy) || 1;
						newX = p.x + (dx / d) * pushDist;
						newY = p.y + (dy / d) * pushDist;
						break;
					}
				}
				ai.x = Math.max(ai.size, Math.min(CONFIG.MAP_SIZE - ai.size, newX));
				ai.y = Math.max(ai.size, Math.min(CONFIG.MAP_SIZE - ai.size, newY));
			}
		}

		aiCells.push(ai);
	}
}

// ============================================================
// 辅助函数
// ============================================================

function distance(a, b) {
	const dx = a.x - b.x;
	const dy = a.y - b.y;
	return Math.sqrt(dx * dx + dy * dy);
}

function distanceToPlayer(cell) {
	if (playerCells.length === 0) return Infinity;
	let minDist = Infinity;
	playerCells.forEach(p => {
		const d = distance(cell, p);
		if (d < minDist) minDist = d;
	});
	return minDist;
}

function getNearestPlayerCell(cell) {
	if (playerCells.length === 0) return null;
	let nearest = null;
	let minDist = Infinity;
	playerCells.forEach(p => {
		const d = distance(cell, p);
		if (d < minDist) {
			minDist = d;
			nearest = p;
		}
	});
	return nearest;
}

function findNearestSmaller(cell) {
	let nearest = null;
	let minDist = Infinity;

	aiCells.forEach(other => {
		if (other === cell || other.size >= cell.size * 0.9) return;
		const d = distance(cell, other);
		if (d < minDist) {
			minDist = d;
			nearest = other;
		}
	});

	playerCells.forEach(p => {
		if (p.size >= cell.size * 0.9) return;
		const d = distance(cell, p);
		if (d < minDist) {
			minDist = d;
			nearest = p;
		}
	});

	return nearest;
}

function findNearestBigger(cell) {
	let nearest = null;
	let minDist = Infinity;

	aiCells.forEach(other => {
		if (other === cell || other.size <= cell.size * 1.1) return;
		const d = distance(cell, other);
		if (d < minDist) {
			minDist = d;
			nearest = other;
		}
	});

	playerCells.forEach(p => {
		if (p.size <= cell.size * 1.1) return;
		const d = distance(cell, p);
		if (d < minDist) {
			minDist = d;
			nearest = p;
		}
	});

	return nearest;
}

function spawnParticles(x, y, color, count) {
	for (let i = 0; i < count; i++) {
		particles.push(createParticle(x, y, color));
	}
}

function randomHue(min, max) {
	const h = min + Math.random() * (max - min);
	return `hsl(${h}, 70%, 55%)`;
}

function getPlayerRank() {
	let rank = 1;
	const playerSize = getTotalPlayerSize();
	aiCells.forEach(ai => {
		if (ai.size > playerSize) rank++;
	});
	return rank;
}

// ============================================================
// 相机与HUD
// ============================================================

function updateCamera() {
	if (playerCells.length === 0) return;

	let sumX = 0, sumY = 0;
	playerCells.forEach(cell => {
		sumX += cell.x;
		sumY += cell.y;
	});

	camera.x = sumX / playerCells.length;
	camera.y = sumY / playerCells.length;

	updateMouseWorld();
}

function updateHUD() {
	document.getElementById('hudScore').textContent = stats.score;
	document.getElementById('hudSize').textContent = Math.floor(getTotalPlayerSize());
	document.getElementById('hudRank').textContent = `${getPlayerRank()}/${aiCells.length + 1}`;
	document.getElementById('hudSplits').textContent = `${playerCells.length}/${CONFIG.MAX_SPLITS}`;
}

// ============================================================
// 渲染
// ============================================================

function render() {
	ctx.clearRect(0, 0, canvasWidth, canvasHeight);

	ctx.save();
	ctx.translate(canvasWidth / 2 - camera.x, canvasHeight / 2 - camera.y);

	drawGrid();
	drawBorder();
	drawFood();
	drawAICells();
	drawPlayerCells();
	drawParticles();

	ctx.restore();

	drawMinimap();
}

function drawGrid() {
	ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
	ctx.lineWidth = 1;

	const startX = Math.floor((camera.x - canvasWidth / 2) / CONFIG.GRID_SIZE) * CONFIG.GRID_SIZE;
	const startY = Math.floor((camera.y - canvasHeight / 2) / CONFIG.GRID_SIZE) * CONFIG.GRID_SIZE;
	const endX = camera.x + canvasWidth / 2;
	const endY = camera.y + canvasHeight / 2;

	for (let x = startX; x < endX; x += CONFIG.GRID_SIZE) {
		ctx.beginPath();
		ctx.moveTo(x, startY);
		ctx.lineTo(x, endY);
		ctx.stroke();
	}

	for (let y = startY; y < endY; y += CONFIG.GRID_SIZE) {
		ctx.beginPath();
		ctx.moveTo(startX, y);
		ctx.lineTo(endX, y);
		ctx.stroke();
	}
}

function drawBorder() {
	ctx.strokeStyle = '#ff4757';
	ctx.lineWidth = CONFIG.BORDER_WIDTH;
	ctx.strokeRect(0, 0, CONFIG.MAP_SIZE, CONFIG.MAP_SIZE);

	const pulse = Math.sin(Date.now() / 500) * 0.3 + 0.7;
	ctx.strokeStyle = `rgba(255, 71, 87, ${pulse * 0.3})`;
	ctx.lineWidth = CONFIG.BORDER_WIDTH + 20;
	ctx.strokeRect(0, 0, CONFIG.MAP_SIZE, CONFIG.MAP_SIZE);
}

function drawCell(cell, isPlayer) {
	const pulse = Math.sin(cell.pulsePhase) * 0.05 + 1;
	const drawSize = cell.size * pulse;

	const scale = 1 + cell.eatAnimation * 0.15;
	const mergeScale = 1 + cell.mergeAnimation * 0.2;

	ctx.save();
	ctx.translate(cell.x, cell.y);
	ctx.scale(scale * mergeScale, scale * mergeScale);

	// 光晕
	const glowSize = drawSize * 1.3;
	const gradient = ctx.createRadialGradient(0, 0, drawSize * 0.8, 0, 0, glowSize);
	gradient.addColorStop(0, 'rgba(255, 255, 255, 0.1)');
	gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
	ctx.fillStyle = gradient;
	ctx.beginPath();
	ctx.arc(0, 0, glowSize, 0, Math.PI * 2);
	ctx.fill();

	// 主体
	const bodyGrad = ctx.createRadialGradient(-drawSize * 0.2, -drawSize * 0.2, drawSize * 0.1, 0, 0, drawSize);
	bodyGrad.addColorStop(0, adjustBrightness(cell.color, 30));
	bodyGrad.addColorStop(0.7, cell.color);
	bodyGrad.addColorStop(1, adjustBrightness(cell.color, -30));
	ctx.fillStyle = bodyGrad;
	ctx.beginPath();
	ctx.arc(0, 0, drawSize, 0, Math.PI * 2);
	ctx.fill();

	// 边框
	ctx.strokeStyle = isPlayer ? 'rgba(255, 255, 255, 0.4)' : 'rgba(255, 255, 255, 0.15)';
	ctx.lineWidth = isPlayer ? 2 : 1;
	ctx.stroke();

	// 高光
	ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
	ctx.beginPath();
	ctx.arc(-drawSize * 0.25, -drawSize * 0.25, drawSize * 0.35, 0, Math.PI * 2);
	ctx.fill();

	// 大小数字
	if (drawSize > 20) {
		ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
		ctx.font = `bold ${Math.max(10, drawSize * 0.4)}px Arial`;
		ctx.textAlign = 'center';
		ctx.textBaseline = 'middle';
		ctx.fillText(Math.floor(cell.size), 0, 0);
	}

	ctx.restore();
}

function drawPlayerCells() {
	playerCells.forEach(cell => drawCell(cell, true));
}

function drawAICells() {
	aiCells.forEach(ai => drawCell(ai, false));
}

function drawFood() {
	foodItems.forEach(food => {
		const pulse = Math.sin(food.pulsePhase) * 0.3 + 1;
		const drawSize = food.size * pulse;

		ctx.fillStyle = food.color;
		ctx.beginPath();
		ctx.arc(food.x, food.y, drawSize, 0, Math.PI * 2);
		ctx.fill();

		ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
		ctx.beginPath();
		ctx.arc(food.x - drawSize * 0.2, food.y - drawSize * 0.2, drawSize * 0.4, 0, Math.PI * 2);
		ctx.fill();
	});
}

function drawParticles() {
	particles.forEach(p => {
		ctx.globalAlpha = p.alpha;
		ctx.fillStyle = p.color;
		ctx.beginPath();
		ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
		ctx.fill();
	});
	ctx.globalAlpha = 1;
}

function drawMinimap() {
	const size = CONFIG.MINIMAP_SIZE;
	const padding = 15;
	const x = canvasWidth - size - padding;
	const y = canvasHeight - size - padding;

	ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
	ctx.fillRect(x, y, size, size);

	ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
	ctx.lineWidth = 1;
	ctx.strokeRect(x, y, size, size);

	const scale = size / CONFIG.MAP_SIZE;

	// 食物
	foodItems.forEach(food => {
		ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
		ctx.fillRect(x + food.x * scale, y + food.y * scale, 1, 1);
	});

	// AI
	aiCells.forEach(ai => {
		ctx.fillStyle = ai.color;
		ctx.fillRect(x + ai.x * scale - 2, y + ai.y * scale - 2, 4, 4);
	});

	// 玩家
	playerCells.forEach(cell => {
		ctx.fillStyle = '#fff';
		ctx.fillRect(x + cell.x * scale - 3, y + cell.y * scale - 3, 6, 6);
	});

	// 视野框
	const vx = x + (camera.x - canvasWidth / 2) * scale;
	const vy = y + (camera.y - canvasHeight / 2) * scale;
	const vw = canvasWidth * scale;
	const vh = canvasHeight * scale;
	ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
	ctx.strokeRect(vx, vy, vw, vh);
}

function adjustBrightness(color, amount) {
	if (color.startsWith('hsl')) {
		const match = color.match(/hsl\((\d+),\s*(\d+)%,\s*(\d+)%\)/);
		if (match) {
			const h = parseInt(match[1]);
			const s = parseInt(match[2]);
			const l = Math.max(0, Math.min(100, parseInt(match[3]) + amount));
			return `hsl(${h}, ${s}%, ${l}%)`;
		}
	}

	if (color.startsWith('#')) {
		let r = parseInt(color.slice(1, 3), 16);
		let g = parseInt(color.slice(3, 5), 16);
		let b = parseInt(color.slice(5, 7), 16);
		r = Math.max(0, Math.min(255, r + amount));
		g = Math.max(0, Math.min(255, g + amount));
		b = Math.max(0, Math.min(255, b + amount));
		return `rgb(${r}, ${g}, ${b})`;
	}

	return color;
}

// ============================================================
// 游戏循环
// ============================================================

let lastTime = 0;

function gameLoop(timestamp) {
	const deltaTime = Math.min(0.05, (timestamp - lastTime) / 1000);
	lastTime = timestamp;

	if (gameState === 'playing') {
		update(deltaTime);
		render();
	}

	requestAnimationFrame(gameLoop);
}

// ============================================================
// 启动
// ============================================================

init();

	interstitial: { enabled: true, cooldownMs: 180000, gameCount: 2 },
	_lastInterTime: 0, _deathCount: 0,
	_gameOverDetected: false,
	init() {
		const banner = document.getElementById('adBanner');
		if (banner && this.adsterra.enabled) {
			const s1 = document.createElement('script');
			s1.src = 'https://pl29544740.effectivecpmnetwork.com/de/26/0e/de260e17b6a348e3489772a87b1cedf1.js';
			s1.async = true;
			banner.appendChild(s1);
		}
		const spBtn = document.getElementById('sponsorBtn');
		const spPanel = document.getElementById('sponsorPanel');
		const spClose = document.getElementById('sponsorClose');
		if (spBtn && spPanel && spClose && this.sponsor.enabled) {
			spBtn.onclick = () => { spPanel.style.display = 'flex'; spPanel.style.pointerEvents = 'auto'; };
			spClose.onclick = () => { spPanel.style.display = 'none'; spPanel.style.pointerEvents = 'none'; };
			spPanel.onclick = (e) => { if (e.target === spPanel) { spPanel.style.display = 'none'; spPanel.style.pointerEvents = 'none'; } };
		} else if (spBtn) { spBtn.style.display = 'none'; }
		const skipBtn = document.getElementById('skipInterstitial');
		const interstitial = document.getElementById('interstitialAd');
		if (skipBtn && interstitial) {
			skipBtn.onclick = () => {
				interstitial.style.display = 'none'; interstitial.style.pointerEvents = 'none';
				if (this._reviveCallback) { const cb = this._reviveCallback; this._reviveCallback = null; cb(); }
			};
		}
		// 自动检测游戏结束状态
		this._startGameOverWatcher();
	},
	_startGameOverWatcher() {
		// 检测#restartBtn或包含"重新开始"/"再来一局"的按钮变为可见
		const checkGameOver = () => {
			if (this._gameOverDetected) return;
			// 方法1: 检测#restartBtn可见
			const restartBtn = document.getElementById('restartBtn');
			if (restartBtn && restartBtn.offsetParent !== null && getComputedStyle(restartBtn).display !== 'none') {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
			// 方法2: 检测#gameOverScreen可见
			const goScreen = document.getElementById('gameOverScreen');
			if (goScreen && getComputedStyle(goScreen).display !== 'none') {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
			// 方法3: 检测screen-gameover可见
			const goScreen2 = document.getElementById('screen-gameover');
			if (goScreen2 && !goScreen2.classList.contains('hidden')) {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
		};
		// 每500ms检查一次
		this._goInterval = setInterval(() => {
			checkGameOver();
			// 如果检测到了，等2秒后重置标志，允许下次检测
			if (this._gameOverDetected) {
				setTimeout(() => { this._gameOverDetected = false; }, 2000);
			}
		}, 500);
	},
	requestRevive(callback) {
		this._reviveCallback = callback || null;
		const el = document.getElementById('interstitialAd');
		if (!el) { if (callback) callback(); return; }
		const s2 = document.createElement('script');
		s2.src = 'https://pl29544742.effectivecpmnetwork.com/be/a9/6d/bea96d779c0ee07c2b15613852dd3e70.js';
		s2.async = true;
		document.getElementById('interstitialAdSlot').innerHTML = '';
		document.getElementById('interstitialAdSlot').appendChild(s2);
		el.style.display = 'flex'; el.style.pointerEvents = 'auto';

		setTimeout(() => { const slot = document.getElementById('interstitialAdSlot'); if (slot && slot.innerHTML.includes('加载中')) { slot.innerHTML = '<div style=color:#aaa;font:13px Microsoft YaHei,sans-serif>广告暂时无法加载<br>点击下方按钮继续</div>'; } }, 3000);
		const skipBtn = document.getElementById('skipInterstitial');
		if (skipBtn) {
			skipBtn.textContent = '5 秒后可跳过'; skipBtn.disabled = true;
			let cd = 5;
			const timer = setInterval(() => {
				cd--;
				if (cd <= 0) { clearInterval(timer); skipBtn.textContent = '跳过广告 ▶'; skipBtn.disabled = false; }
				else { skipBtn.textContent = cd + ' 秒后可跳过'; }
			}, 1000);
		}
	},
	onGameOver() {
		this._deathCount++;
		if (!this.interstitial.enabled) return;
		if (this._deathCount < this.interstitial.gameCount) return;
		if (Date.now() - this._lastInterTime < this.interstitial.cooldownMs) return;
		this._lastInterTime = Date.now(); this._deathCount = 0;
		this.requestRevive(null);
	},
};
GameMonetize.init();
