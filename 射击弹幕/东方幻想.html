* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  font-family: 'Microsoft YaHei', sans-serif;
  overflow: hidden;
  touch-action: none;
}
#gameCanvas {
  image-rendering: pixelated;
  background: #000;
  display: block;
}
.ui-overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none;
}
.hud {
  position: absolute;
  top: 10px; left: 10px;
  color: #fff;
  font-size: 14px;
  text-shadow: 0 0 5px rgba(255,255,255,0.5);
}
.hud div { margin-bottom: 5px; }
.boss-hp-bar {
  position: absolute;
  top: 10px; left: 50%;
  transform: translateX(-50%);
  width: 300px;
  height: 20px;
  background: rgba(0,0,0,0.7);
  border: 2px solid #f00;
  border-radius: 10px;
  overflow: hidden;
  display: none;
}
.boss-hp-fill {
  height: 100%;
  background: linear-gradient(90deg, #f00, #ff6600);
  transition: width 0.3s;
}
.boss-name {
  position: absolute;
  top: 35px; left: 50%;
  transform: translateX(-50%);
  color: #ff6600;
  font-size: 18px;
  font-weight: bold;
  text-shadow: 0 0 10px rgba(255,102,0,0.8);
  display: none;
}
.mobile-controls {
  position: absolute;
  bottom: 20px;
  left: 0; right: 0;
  display: none;
  justify-content: space-between;
  padding: 0 20px;
}
.joystick-area {
  width: 120px;
  height: 120px;
  background: rgba(255,255,255,0.1);
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.3);
  position: relative;
}
.joystick-knob {
  width: 40px;
  height: 40px;
  background: rgba(255,255,255,0.5);
  border-radius: 50%;

  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
}

  display: flex;
  flex-direction: column;
  gap: 10px;
}
.action-btn {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: rgba(255,255,255,0.2);
  border: 2px solid rgba(255,255,255,0.4);

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const GAME_WIDTH = 480;
const GAME_HEIGHT = 720;
canvas.width = GAME_WIDTH;
canvas.height = GAME_HEIGHT;

const isMobile = /Android|iPhone|iPad|iPod|Opera Mini|IEMobile|WPDesktop/i.test(navigator.userAgent);

if (isMobile) {
  document.getElementById('mobileControls').style.display = 'flex';
}

const touchState = { dx: 0, dy: 0, shooting: false };
(function setupTouchControls() {
  const joystickArea = document.getElementById('joystickArea');
  const joystickKnob = document.getElementById('joystickKnob');
  const shootBtn = document.getElementById('shootBtn');
  const bombBtn = document.getElementById('bombBtn');
  let joystickTouchId = null;
  let joystickCenter = { x: 0, y: 0 };
  const maxRadius = 40;

  joystickArea.addEventListener('touchstart', e => {
    e.preventDefault();
    const touch = e.changedTouches[0];
    joystickTouchId = touch.identifier;
    const rect = joystickArea.getBoundingClientRect();
    joystickCenter.x = rect.left + rect.width / 2;
    joystickCenter.y = rect.top + rect.height / 2;
  });

  document.addEventListener('touchmove', e => {
    for (const touch of e.changedTouches) {
      if (touch.identifier === joystickTouchId) {
        let dx = touch.clientX - joystickCenter.x;
        let dy = touch.clientY - joystickCenter.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > maxRadius) {
          dx = (dx / dist) * maxRadius;
          dy = (dy / dist) * maxRadius;
        }
        touchState.dx = dx / maxRadius;
        touchState.dy = dy / maxRadius;
        joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
      }
    }
  });

  const resetJoystick = (e) => {
    for (const touch of e.changedTouches) {
      if (touch.identifier === joystickTouchId) {
        joystickTouchId = null;
        touchState.dx = 0;
        touchState.dy = 0;
        joystickKnob.style.transform = 'translate(-50%, -50%)';
      }
    }
  };
  document.addEventListener('touchend', resetJoystick);
  document.addEventListener('touchcancel', resetJoystick);

  shootBtn.addEventListener('touchstart', e => { e.preventDefault(); touchState.shooting = true; });
  shootBtn.addEventListener('touchend', e => { e.preventDefault(); touchState.shooting = false; });
  shootBtn.addEventListener('touchcancel', e => { touchState.shooting = false; });

  bombBtn.addEventListener('touchstart', e => { e.preventDefault(); useBomb(); });
})();

const STORAGE_KEY = 'touhou_fantasy_save';

let gameState = 'title';
let gamePaused = false;
let score = 0;
let highScore = 0;
let totalGames = 0;
let maxStageCleared = 0;
let grazeCount = 0;
let grazeMultiplier = 1;
let grazeTimer = 0;

const saveData = {
  load() {
    try {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (data) {
        highScore = data.highScore || 0;
        totalGames = data.totalGames || 0;
        maxStageCleared = data.maxStageCleared || 0;
      }
    } catch(e) {}
  },
  save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        highScore: Math.max(highScore, score),
        totalGames,
        maxStageCleared
      }));
    } catch(e) {}
  }
};

saveData.load();

const keys = {};
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) {
    e.preventDefault();
  }
  if (e.code === 'Escape') {
    if (gamePaused) { togglePause(); return; }
    if (gameState === 'game') { togglePause(); return; }
  }
  if (gamePaused) return;
  if (gameState === 'title' && (e.code === 'Space' || e.code === 'KeyZ')) {
    startGame();
  }
  if (gameState === 'gameover' && (e.code === 'Space' || e.code === 'KeyZ')) {
    gameState = 'title';
  }
  if (gameState === 'game' && e.code === 'KeyX') {
    useBomb();
  }
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSound(type) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);

  switch(type) {
    case 'shoot':
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.1);
      break;
    case 'bomb':
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(200, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.5);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.5);
      break;
    case 'graze':
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1600, audioCtx.currentTime + 0.05);
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
      break;
    case 'boss':
      osc.type = 'square';
      osc.frequency.setValueAtTime(100, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.3);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.5);
      break;
    case 'hit':
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(300, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.2);
      break;
    case 'powerup':
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
      break;
  }
}

let player = null;
let playerBullets = [];
let enemyBullets = [];
let enemies = [];
let items = [];
let particles = [];
let bosses = [];
let currentBoss = null;
let bossSpawned = [false, false, false];
const bossThresholds = [1800, 5400, 10800];
let waveTimer = 0;
let currentWave = 0;
let stageTimer = 0;
let invincibleTimer = 0;
let bombActive = false;
let bombTimer = 0;

const PLAYER_SPEED = 4;
const PLAYER_SLOW_SPEED = 1.5;
const BULLET_SPEED = 8;
const ITEM_FALL_SPEED = 2;

function startGame() {
  gameState = 'game';
  gamePaused = false;
  document.getElementById('pauseScreen').style.display = 'none';
  score = 0;
  grazeCount = 0;
  grazeMultiplier = 1;
  grazeTimer = 0;
  totalGames++;
  playerBullets = [];
  enemyBullets = [];
  enemies = [];
  items = [];
  particles = [];
  bosses = [];
  currentBoss = null;
  bossSpawned = [false, false, false];
  waveTimer = 0;
  currentWave = 0;
  stageTimer = 0;
  invincibleTimer = 0;
  bombActive = false;
  bombTimer = 0;

  player = {
    x: GAME_WIDTH / 2,
    y: GAME_HEIGHT - 100,
    width: 32,
    height: 32,
    lives: 3,
    bombs: 3,
    power: 1,
    shootTimer: 0,
    hitboxRadius: 4
  };

  audioCtx.resume();
  saveData.save();
}

function useBomb() {
  if (!player || player.bombs <= 0 || bombActive) return;
  player.bombs--;
  bombActive = true;
  bombTimer = 120;
  invincibleTimer = 180;
  playSound('bomb');

  enemyBullets = [];
  enemies.forEach(e => {
    e.hp -= 50;
    spawnParticles(e.x, e.y, '#ff0', 5);
  });
  enemies = enemies.filter(e => {
    if (e.hp <= 0) {
      score += e.score;
      spawnParticles(e.x, e.y, '#ff0', 10);
      if (e.type === 'splitter') {
        for (let k = 0; k < 3; k++) {
          const child = createEnemy('small', e.x + (k - 1) * 20, e.y);
          child.hp = 5;
          child.maxHp = 5;
          enemies.push(child);
        }
      }
      if (Math.random() < 0.3) {
        const types = ['power', 'bomb', 'score', 'life'];
        const weights = [0.4, 0.2, 0.3, 0.1];
        let r = Math.random();
        let type = 'power';
        for (let k = 0; k < types.length; k++) {
          r -= weights[k];
          if (r <= 0) { type = types[k]; break; }
        }
        spawnItem(e.x, e.y, type);
      }
      return false;
    }
    return true;
  });

  for (let i = 0; i < 50; i++) {
    particles.push({
      x: player.x,
      y: player.y,
      vx: (Math.random() - 0.5) * 10,
      vy: (Math.random() - 0.5) * 10,
      life: 60,
      maxLife: 60,
      color: '#fff',
      size: Math.random() * 4 + 2
    });
  }
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 4,
      vy: (Math.random() - 0.5) * 4,
      life: 30 + Math.random() * 20,
      maxLife: 50,
      color,
      size: Math.random() * 3 + 1
    });
  }
}

function shootBullet() {
  if (!player || player.shootTimer > 0) return;

  const power = player.power;
  player.shootTimer = Math.max(3, 8 - power);

  playSound('shoot');

  // Base damage is 3 + power level
  const damage = 3 + power;

  if (power <= 2) {
    playerBullets.push({
      x: player.x,
      y: player.y - 16,
      vx: 0,
      vy: -BULLET_SPEED,
      damage: damage,
      width: 8,
      height: 16
    });
  } else if (power <= 4) {
    playerBullets.push({
      x: player.x - 8,
      y: player.y - 16,
      vx: 0,
      vy: -BULLET_SPEED,
      damage: damage,
      width: 8,
      height: 16
    });
    playerBullets.push({
      x: player.x + 8,
      y: player.y - 16,
      vx: 0,
      vy: -BULLET_SPEED,
      damage: damage,
      width: 8,
      height: 16
    });
  } else {
    playerBullets.push({
      x: player.x,
      y: player.y - 16,
      vx: 0,
      vy: -BULLET_SPEED,
      damage: damage,
      width: 8,
      height: 16
    });
    playerBullets.push({
      x: player.x - 12,
      y: player.y - 12,
      vx: -1,
      vy: -BULLET_SPEED,
      damage: damage - 1,
      width: 6,
      height: 12
    });
    playerBullets.push({
      x: player.x + 12,
      y: player.y - 12,
      vx: 1,
      vy: -BULLET_SPEED,
      damage: damage - 1,
      width: 6,
      height: 12
    });
  }
}

function spawnItem(x, y, type) {
  items.push({
    x, y, type,
    width: 16, height: 16,
    vy: ITEM_FALL_SPEED,
    vx: (Math.random() - 0.5) * 2
  });
}

function checkCollision(a, b) {
  return Math.abs(a.x - b.x) < (a.width + b.width) / 2 &&
         Math.abs(a.y - b.y) < (a.height + b.height) / 2;
}

function checkCircleCollision(x1, y1, r1, x2, y2, r2) {
  const dx = x1 - x2;
  const dy = y1 - y2;
  return dx * dx + dy * dy < (r1 + r2) * (r1 + r2);
}

function updatePlayer() {
  if (!player) return;

  const slow = keys['ShiftLeft'] || keys['ShiftRight'];
  const speed = slow ? PLAYER_SLOW_SPEED : PLAYER_SPEED;

  let dx = 0, dy = 0;
  if (keys['ArrowLeft'] || keys['KeyA']) dx -= 1;
  if (keys['ArrowRight'] || keys['KeyD']) dx += 1;
  if (keys['ArrowUp'] || keys['KeyW']) dy -= 1;
  if (keys['ArrowDown'] || keys['KeyS']) dy += 1;

  if (touchState.dx !== 0 || touchState.dy !== 0) {
    dx = touchState.dx;
    dy = touchState.dy;
  }

  if (dx !== 0 && dy !== 0) {
    dx *= 0.707;
    dy *= 0.707;
  }

  player.x += dx * speed;
  player.y += dy * speed;

  player.x = Math.max(16, Math.min(GAME_WIDTH - 16, player.x));
  player.y = Math.max(16, Math.min(GAME_HEIGHT - 16, player.y));

  if (player.shootTimer > 0) player.shootTimer--;

  if (keys['KeyZ'] || keys['Space'] || touchState.shooting) {
    shootBullet();
  }

  if (invincibleTimer > 0) invincibleTimer--;
}

function updateBullets() {
  playerBullets = playerBullets.filter(b => {
    b.x += b.vx;
    b.y += b.vy;
    return b.y > -20 && b.y < GAME_HEIGHT + 20 && b.x > -20 && b.x < GAME_WIDTH + 20;
  });

  enemyBullets = enemyBullets.filter(b => {
    if (b.tracking && player) {
      if (b.trackTime !== undefined) {
        b.trackTime--;
        if (b.trackTime <= 0) {
          b.tracking = false;
        }
      }
      if (b.tracking) {
        const angle = Math.atan2(player.y - b.y, player.x - b.x);
        const speed = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
        b.vx += Math.cos(angle) * 0.15;
        b.vy += Math.sin(angle) * 0.15;
        const currentSpeed = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
        if (currentSpeed > 0) {
          b.vx = (b.vx / currentSpeed) * speed;
          b.vy = (b.vy / currentSpeed) * speed;
        }
      }
    }

    b.x += b.vx;
    b.y += b.vy;

    if (player && !bombActive) {
      const dist = Math.sqrt((b.x - player.x) ** 2 + (b.y - player.y) ** 2);
      if (dist < 20 && dist >= player.hitboxRadius) {
        grazeCount++;
        grazeMultiplier = Math.min(8, 1 + Math.floor(grazeCount / 10));
        grazeTimer = 60;
        score += 10 * grazeMultiplier;
        playSound('graze');
        spawnParticles(b.x, b.y, '#0ff', 2);
      }
    }

    return b.y > -20 && b.y < GAME_HEIGHT + 20 && b.x > -20 && b.x < GAME_WIDTH + 20;
  });
}

function updateEnemies() {
  enemies = enemies.filter(e => {
    switch(e.pattern) {
      case 'straight':
        e.y += e.speed;
        break;
      case 'curve':
        e.angle += 0.05;
        e.x += Math.sin(e.angle) * 2;
        e.y += e.speed;
        break;
      case 'fixed':
        if (e.y < 150) e.y += e.speed;
        break;
      case 'tracker':
        if (player) {
          const angle = Math.atan2(player.y - e.y, player.x - e.x);
          e.x += Math.cos(angle) * e.speed * 0.5;
          e.y += Math.sin(angle) * e.speed * 0.5;
        }
        break;
      case 'splitter':
        e.y += e.speed;
        break;
      case 'shield':
        e.y += e.speed * 0.5;
        break;
    }

    if (e.shootCooldown > 0) e.shootCooldown--;
    if (e.shootCooldown <= 0 && e.y > 0 && e.y < GAME_HEIGHT - 100) {
      e.shootCooldown = e.shootTimer;
      enemyShoot(e);
    }

    return e.hp > 0 && e.y < GAME_HEIGHT + 50;
  });
}

function enemyShoot(enemy) {
  if (!player) return;
  const angle = Math.atan2(player.y - enemy.y, player.x - enemy.x);

  switch(enemy.type) {
    case 'small':
      enemyBullets.push({
        x: enemy.x, y: enemy.y,
        vx: Math.cos(angle) * 3,
        vy: Math.sin(angle) * 3,
        radius: 4, color: '#f88'
      });
      break;
    case 'medium':
      for (let i = -2; i <= 2; i++) {
        const a = angle + i * 0.2;
        enemyBullets.push({
          x: enemy.x, y: enemy.y,
          vx: Math.cos(a) * 2.5,
          vy: Math.sin(a) * 2.5,
          radius: 4, color: '#8f8'
        });
      }
      break;
    case 'large':
      for (let i = 0; i < 12; i++) {
        const a = (Math.PI * 2 / 12) * i;
        enemyBullets.push({
          x: enemy.x, y: enemy.y,
          vx: Math.cos(a) * 2,
          vy: Math.sin(a) * 2,
          radius: 5, color: '#88f'
        });
      }
      break;
    case 'tracker':
      enemyBullets.push({
        x: enemy.x, y: enemy.y,
        vx: Math.cos(angle) * 2,
        vy: Math.sin(angle) * 2,
        radius: 6, color: '#f0f', tracking: true, trackTime: 120
      });
      break;
    case 'splitter':
      enemyBullets.push({
        x: enemy.x, y: enemy.y,
        vx: 0, vy: 3,
        radius: 5, color: '#ff0'
      });
      break;
    case 'shield':
      for (let i = -1; i <= 1; i++) {
        const a = angle + i * 0.3;
        enemyBullets.push({
          x: enemy.x, y: enemy.y,
          vx: Math.cos(a) * 3,
          vy: Math.sin(a) * 3,
          radius: 4, color: '#0ff'
        });
      }
      break;
  }
}

function updateBoss() {
  if (!currentBoss) return;

  if (currentBoss.y < currentBoss.targetY) {
    currentBoss.y += 2;
    return;
  }

  currentBoss.moveTimer++;
  if (currentBoss.moveTimer > 120) {
    currentBoss.moveDir *= -1;
    currentBoss.moveTimer = 0;
  }
  currentBoss.x += currentBoss.moveDir * 1.5;
  currentBoss.x = Math.max(60, Math.min(GAME_WIDTH - 60, currentBoss.x));

  currentBoss.phaseTimer++;
  if (currentBoss.shootTimer > 0) currentBoss.shootTimer--;

  if (currentBoss.hp <= 0) {
    score += currentBoss.score;
    spawnParticles(currentBoss.x, currentBoss.y, '#ff0', 30);
    currentBoss = null;
    return;
  }

  const hpPercent = currentBoss.hp / currentBoss.maxHp;

  if (currentBoss.name === '巨型战舰') {
    if (hpPercent > 0.66) {
      currentBoss.phase = 0;
    } else if (hpPercent > 0.33) {
      currentBoss.phase = 1;
    } else {
      currentBoss.phase = 2;
    }

    if (currentBoss.shootTimer <= 0) {
      switch(currentBoss.phase) {
        case 0:
          for (let i = -3; i <= 3; i++) {
            const angle = Math.PI / 2 + i * 0.15;
            enemyBullets.push({
              x: currentBoss.x, y: currentBoss.y + 30,
              vx: Math.cos(angle) * 3,
              vy: Math.sin(angle) * 3,
              radius: 6, color: '#f80'
            });
          }
          currentBoss.shootTimer = 30;
          break;
        case 1:
          for (let i = 0; i < 16; i++) {
            const angle = (Math.PI * 2 / 16) * i + currentBoss.phaseTimer * 0.02;
            enemyBullets.push({
              x: currentBoss.x, y: currentBoss.y,
              vx: Math.cos(angle) * 2.5,
              vy: Math.sin(angle) * 2.5,
              radius: 5, color: '#f00'
            });
          }
          currentBoss.shootTimer = 20;
          break;
        case 2:
          for (let i = 0; i < 24; i++) {
            const angle = (Math.PI * 2 / 24) * i;
            enemyBullets.push({
              x: currentBoss.x, y: currentBoss.y,
              vx: Math.cos(angle) * 2,
              vy: Math.sin(angle) * 2,
              radius: 6, color: '#ff0'
            });
          }
          for (let i = -2; i <= 2; i++) {
            const angle = Math.atan2(player.y - currentBoss.y, player.x - currentBoss.x) + i * 0.2;
            enemyBullets.push({
              x: currentBoss.x, y: currentBoss.y,
              vx: Math.cos(angle) * 4,
              vy: Math.sin(angle) * 4,
              radius: 8, color: '#f00'
            });
          }
          currentBoss.shootTimer = 15;
          break;
      }
    }
  } else if (currentBoss.name === '龙形怪物') {
    if (hpPercent > 0.75) currentBoss.phase = 0;
    else if (hpPercent > 0.5) currentBoss.phase = 1;
    else if (hpPercent > 0.25) currentBoss.phase = 2;
    else currentBoss.phase = 3;

    if (currentBoss.shootTimer <= 0) {
      switch(currentBoss.phase) {
        case 0: {
          const angle0 = Math.atan2(player.y - currentBoss.y, player.x - currentBoss.x);
          for (let i = 0; i < 3; i++) {
            enemyBullets.push({
              x: currentBoss.x, y: currentBoss.y,
              vx: Math.cos(angle0) * (3 + i),
              vy: Math.sin(angle0) * (3 + i),
              radius: 8, color: '#0f0'
            });
          }
          currentBoss.shootTimer = 40;
          break;
        }
        case 1: {
          for (let i = 0; i < 2; i++) {
            const lx = currentBoss.x + (i === 0 ? -60 : 60);
            for (let j = 0; j < 20; j++) {
              enemyBullets.push({
                x: lx, y: currentBoss.y,
                vx: (Math.random() - 0.5) * 2,
                vy: 3 + Math.random() * 2,
                radius: 4, color: '#0ff'
              });
            }
          }
          currentBoss.shootTimer = 60;
          break;
        }
        case 2: {
          const angle2 = Math.atan2(player.y - currentBoss.y, player.x - currentBoss.x);
          for (let i = 0; i < 5; i++) {
            const a = angle2 + (i - 2) * 0.1;
            enemyBullets.push({
              x: currentBoss.x, y: currentBoss.y,
              vx: Math.cos(a) * 4,
              vy: Math.sin(a) * 4,
              radius: 10, color: '#f0f', tracking: true, trackTime: 30
            });
          }
          currentBoss.shootTimer = 35;
          break;
        }
        case 3: {
          for (let i = 0; i < 32; i++) {
            const a = (Math.PI * 2 / 32) * i + currentBoss.phaseTimer * 0.03;
            enemyBullets.push({
              x: currentBoss.x, y: currentBoss.y,
              vx: Math.cos(a) * 2,
              vy: Math.sin(a) * 2,
              radius: 5, color: '#ff0'
            });
          }
          currentBoss.shootTimer = 10;
          break;
        }
      }
    }
  } else if (currentBoss.name === '暗影魔女') {
    if (hpPercent > 0.8) currentBoss.phase = 0;
    else if (hpPercent > 0.6) currentBoss.phase = 1;
    else if (hpPercent > 0.4) currentBoss.phase = 2;
    else if (hpPercent > 0.2) currentBoss.phase = 3;
    else currentBoss.phase = 4;

    if (currentBoss.shootTimer <= 0) {
      switch(currentBoss.phase) {
        case 0:
          for (let i = 0; i < 3; i++) {
            const a = currentBoss.phaseTimer * 0.05 + (Math.PI * 2 / 3) * i;
            for (let j = 0; j < 3; j++) {
              enemyBullets.push({
                x: currentBoss.x, y: currentBoss.y,
                vx: Math.cos(a) * (2 + j),
                vy: Math.sin(a) * (2 + j),
                radius: 5, color: '#f0f'
              });
            }
          }
          currentBoss.shootTimer = 25;
          break;
        case 1:
          for (let i = 0; i < 20; i++) {
            const a = (Math.PI * 2 / 20) * i + currentBoss.phaseTimer * 0.02;
            enemyBullets.push({
              x: currentBoss.x, y: currentBoss.y,
              vx: Math.cos(a) * 1.5,
              vy: Math.sin(a) * 1.5,
              radius: 4, color: '#80f'
            });
          }
          currentBoss.shootTimer = 15;
          break;
        case 2:
          for (let i = 0; i < 5; i++) {
            const a = Math.random() * Math.PI * 2;
            const s = 2 + Math.random() * 3;
            enemyBullets.push({
              x: currentBoss.x, y: currentBoss.y,
              vx: Math.cos(a) * s,
              vy: Math.sin(a) * s,
              radius: 6, color: '#f88'
            });
          }
          currentBoss.shootTimer = 8;
          break;
        case 3:
          for (let i = 0; i < 36; i++) {
            const a = (Math.PI * 2 / 36) * i + currentBoss.phaseTimer * 0.01;
            enemyBullets.push({
              x: currentBoss.x, y: currentBoss.y,
              vx: Math.cos(a) * 1.5,
              vy: Math.sin(a) * 1.5,
              radius: 4, color: '#fff'
            });
          }
          for (let i = -1; i <= 1; i++) {
            const a = Math.atan2(player.y - currentBoss.y, player.x - currentBoss.x) + i * 0.3;
            enemyBullets.push({
              x: currentBoss.x, y: currentBoss.y,
              vx: Math.cos(a) * 5,
              vy: Math.sin(a) * 5,
              radius: 10, color: '#f00'
            });
          }
          currentBoss.shootTimer = 20;
          break;
        case 4:
          for (let i = 0; i < 48; i++) {
            const a = (Math.PI * 2 / 48) * i;
            enemyBullets.push({
              x: currentBoss.x, y: currentBoss.y,
              vx: Math.cos(a) * 2,
              vy: Math.sin(a) * 2,
              radius: 5, color: '#f0f'
            });
          }
          for (let i = 0; i < 8; i++) {
            const a = Math.random() * Math.PI * 2;
            enemyBullets.push({
              x: currentBoss.x, y: currentBoss.y,
              vx: Math.cos(a) * 4,
              vy: Math.sin(a) * 4,
              radius: 12, color: '#ff0'
            });
          }
          currentBoss.shootTimer = 12;
          break;
      }
    }
  }
}

function checkPlayerHit() {
  if (!player || invincibleTimer > 0 || bombActive) return;

  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];
    const dist = Math.sqrt((b.x - player.x) ** 2 + (b.y - player.y) ** 2);
    if (dist < player.hitboxRadius + b.radius) {
      enemyBullets.splice(i, 1);
      playerHit();
      return;
    }
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (checkCollision(player, e)) {
      playerHit();
      return;
    }
  }
}

function playerHit() {
  if (!player) return;
  player.lives--;
  invincibleTimer = 180;
  player.power = Math.max(1, player.power - 1);
  playSound('hit');
  spawnParticles(player.x, player.y, '#f00', 20);

  if (player.lives <= 0) {
    gameOver();
  }
}

function gameOver() {
  gameState = 'gameover';
  if (score > highScore) {
    highScore = score;
  }
  saveData.save();
}

function checkBulletEnemyCollisions() {
  const bulletsToRemove = new Set();
  const enemiesToRemove = new Set();

  for (let i = playerBullets.length - 1; i >= 0; i--) {
    if (bulletsToRemove.has(i)) continue;
    const b = playerBullets[i];

    let hit = false;

    for (let j = enemies.length - 1; j >= 0; j--) {
      if (enemiesToRemove.has(j)) continue;
      const e = enemies[j];
      if (checkCollision(b, e)) {
        bulletsToRemove.add(i);
        hit = true;

        if (e.shield > 0) {
          const overflow = b.damage - e.shield;
          e.shield = Math.max(0, e.shield - b.damage);
          if (overflow > 0) e.hp -= overflow;
          spawnParticles(b.x, b.y, '#0ff', 2);
        } else {
          e.hp -= b.damage;
          spawnParticles(b.x, b.y, '#ff0', 2);
        }

        if (e.hp <= 0) {
          enemiesToRemove.add(j);
          score += e.score;
          spawnParticles(e.x, e.y, '#ff0', 10);

          if (e.type === 'splitter') {
            for (let k = 0; k < 3; k++) {
              const child = createEnemy('small', e.x + (k - 1) * 20, e.y);
              child.hp = 5;
              child.maxHp = 5;
              enemies.push(child);
            }
          }

          if (Math.random() < 0.3) {
            const types = ['power', 'bomb', 'score', 'life'];
            const weights = [0.4, 0.2, 0.3, 0.1];
            let r = Math.random();
            let type = 'power';
            for (let k = 0; k < types.length; k++) {
              r -= weights[k];
              if (r <= 0) { type = types[k]; break; }
            }
            spawnItem(e.x, e.y, type);
          }
        }
        break;
      }
    }

    if (!hit && currentBoss && checkCollision(b, currentBoss)) {
      bulletsToRemove.add(i);
      currentBoss.hp -= b.damage;
      spawnParticles(b.x, b.y, '#f80', 3);
    }
  }

  playerBullets = playerBullets.filter((_, i) => !bulletsToRemove.has(i));
  enemies = enemies.filter((_, i) => !enemiesToRemove.has(i));
}

function updateItems() {
  items = items.filter(item => {
    item.y += item.vy;
    item.x += item.vx;

    if (player && checkCollision(player, item)) {
      switch(item.type) {
        case 'power':
          player.power = Math.min(5, player.power + 1);
          score += 100;
          break;
        case 'bomb':
          player.bombs = Math.min(5, player.bombs + 1);
          score += 200;
          break;
        case 'score':
          score += 1000;
          break;
        case 'life':
          player.lives = Math.min(5, player.lives + 1);
          score += 500;
          break;
      }
      playSound('powerup');
      spawnParticles(item.x, item.y, '#fff', 5);
      return false;
    }

    return item.y < GAME_HEIGHT + 20;
  });
}

function updateParticles() {
  particles = particles.filter(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    return p.life > 0;
  });
}

function updateWaves() {
  waveTimer++;

  if (currentBoss) return;

  const unlockedCount = Math.min(6, 1 + Math.floor(waveTimer / 600));

  if (waveTimer % 90 === 0) {
    const types = ['small', 'medium', 'large', 'tracker', 'splitter', 'shield'];
    const x = Math.random() * (GAME_WIDTH - 100) + 50;
    const type = types[Math.floor(Math.random() * unlockedCount)];
    enemies.push(createEnemy(type, x, -30));
  }

  if (waveTimer % 240 === 0 && waveTimer > 0) {
    const count = 3 + Math.floor(Math.random() * 3);
    const types = ['small', 'medium', 'large', 'tracker', 'splitter', 'shield'];
    for (let i = 0; i < count; i++) {
      const x = 50 + (GAME_WIDTH - 100) * (i / (count - 1));
      const type = types[Math.floor(Math.random() * Math.min(3, unlockedCount))];
      enemies.push(createEnemy(type, x, -30));
    }
  }

  if (waveTimer % 600 === 0 && waveTimer > 300) {
    const count = 2 + Math.floor(Math.random() * 2);
    for (let i = 0; i < count; i++) {
      const x = Math.random() * (GAME_WIDTH - 100) + 50;
      enemies.push(createEnemy('tracker', x, -30));
    }
  }

  for (let i = 0; i < bossThresholds.length; i++) {
    if (waveTimer >= bossThresholds[i] && !bossSpawned[i] && !currentBoss) {
      bossSpawned[i] = true;
      currentBoss = createBoss(i);
      playSound('boss');
      enemyBullets = [];
      break;
    }
  }
}

function updateBomb() {
  if (bombActive) {
    bombTimer--;
    if (bombTimer <= 0) {
      bombActive = false;
    }
  }

  if (grazeTimer > 0) grazeTimer--;
  if (grazeTimer <= 0) grazeMultiplier = 1;
}

function update() {
  if (gameState !== 'game') return;

  updatePlayer();
  updateBullets();
  updateEnemies();
  updateBoss();
  checkBulletEnemyCollisions();
  checkPlayerHit();
  updateItems();
  updateParticles();
  updateWaves();
  updateBomb();

  stageTimer++;
}

let stars = [];
for (let i = 0; i < 100; i++) {
  stars.push({
    x: Math.random() * GAME_WIDTH,
    y: Math.random() * GAME_HEIGHT,
    speed: Math.random() * 2 + 0.5,
    size: Math.random() * 2 + 1
  });
}

function drawStars() {
  stars.forEach(s => {
    s.y += s.speed;
    if (s.y > GAME_HEIGHT) {
      s.y = 0;
      s.x = Math.random() * GAME_WIDTH;
    }
    ctx.fillStyle = `rgba(255,255,255,${0.3 + s.speed * 0.2})`;
    ctx.fillRect(s.x, s.y, s.size, s.size);
  });
}

function drawPlayer() {
  if (!player || invincibleTimer > 0 && Math.floor(invincibleTimer / 4) % 2 === 0) return;

  ctx.save();
  ctx.translate(player.x, player.y);

  ctx.fillStyle = '#fff';
  ctx.fillRect(-12, -16, 24, 32);
  ctx.fillStyle = '#88f';
  ctx.fillRect(-8, -12, 16, 24);
  ctx.fillStyle = '#ff0';
  ctx.fillRect(-4, -8, 8, 16);

  ctx.fillStyle = '#f00';
  ctx.beginPath();
  ctx.arc(0, 0, player.hitboxRadius, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawBullets() {
  playerBullets.forEach(b => {
    ctx.fillStyle = '#ff0';
    ctx.fillRect(b.x - b.width/2, b.y - b.height/2, b.width, b.height);
    ctx.fillStyle = '#fff';
    ctx.fillRect(b.x - 2, b.y - b.height/2, 4, b.height);
  });

  enemyBullets.forEach(b => {
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath();
    ctx.arc(b.x - b.radius * 0.3, b.y - b.radius * 0.3, b.radius * 0.3, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawEnemies() {
  enemies.forEach(e => {
    ctx.fillStyle = e.type === 'small' ? '#888' : e.type === 'medium' ? '#8a8' : '#a88';
    ctx.fillRect(e.x - e.width/2, e.y - e.height/2, e.width, e.height);

    if (e.shield > 0) {
      ctx.strokeStyle = '#0ff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.width/2 + 5, 0, Math.PI * 2);
      ctx.stroke();
    }
  });
}

function drawBoss() {
  if (!currentBoss) return;

  ctx.save();
  ctx.translate(currentBoss.x, currentBoss.y);

  if (currentBoss.name === '巨型战舰') {
    ctx.fillStyle = '#666';
    ctx.fillRect(-60, -40, 120, 80);
    ctx.fillStyle = '#f00';
    ctx.fillRect(-40, -30, 80, 60);
    ctx.fillStyle = '#ff0';
    ctx.fillRect(-20, -20, 40, 40);
  } else if (currentBoss.name === '龙形怪物') {
    ctx.fillStyle = '#080';
    ctx.beginPath();
    ctx.moveTo(0, -50);
    ctx.lineTo(70, 20);
    ctx.lineTo(40, 50);
    ctx.lineTo(-40, 50);
    ctx.lineTo(-70, 20);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#f00';
    ctx.fillRect(-15, -20, 30, 30);
  } else {
    ctx.fillStyle = '#808';
    ctx.beginPath();
    ctx.arc(0, 0, 50, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#f0f';
    ctx.beginPath();
    ctx.arc(0, 0, 30, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(0, 0, 10, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();

  const hpPercent = currentBoss.hp / currentBoss.maxHp;
  document.getElementById('bossHpBar').style.display = 'block';
  document.getElementById('bossHpFill').style.width = `${hpPercent * 100}%`;
  document.getElementById('bossName').style.display = 'block';
  document.getElementById('bossName').textContent = currentBoss.name;
}

function drawItems() {
  const colors = {
    power: '#f00',
    bomb: '#00f',
    score: '#ff0',
    life: '#0f0'
  };
  const labels = {
    power: 'P',
    bomb: 'B',
    score: '$',
    life: '♥'
  };

  items.forEach(item => {
    ctx.fillStyle = colors[item.type];
    ctx.fillRect(item.x - 8, item.y - 8, 16, 16);
    ctx.fillStyle = '#fff';
    ctx.font = '12px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(labels[item.type], item.x, item.y);
  });
}

function drawParticles() {
  particles.forEach(p => {
    const alpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.globalAlpha = alpha;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  });
  ctx.globalAlpha = 1;
}

function drawBombEffect() {
  if (!bombActive) return;

  const alpha = bombTimer / 120;
  ctx.fillStyle = `rgba(255,255,255,${alpha * 0.3})`;
  ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

  for (let i = 0; i < 5; i++) {
    const x = Math.random() * GAME_WIDTH;
    const y = Math.random() * GAME_HEIGHT;
    ctx.fillStyle = `rgba(255,255,0,${alpha})`;
    ctx.beginPath();
    ctx.arc(x, y, 20 + Math.random() * 20, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawGrazeEffect() {
  if (grazeTimer > 0 && player) {
    const alpha = grazeTimer / 60;
    ctx.strokeStyle = `rgba(0,255,255,${alpha})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(player.x, player.y, 20, 0, Math.PI * 2);
    ctx.stroke();
  }
}

function drawHUD() {
  document.getElementById('scoreDisplay').textContent = `SCORE: ${score}`;
  document.getElementById('livesDisplay').textContent = `LIVES: ${player ? player.lives : 0}`;
  document.getElementById('bombsDisplay').textContent = `BOMBS: ${player ? player.bombs : 0}`;
  document.getElementById('powerDisplay').textContent = `POWER: ${player ? player.power : 0}`;
  document.getElementById('grazeDisplay').textContent = `GRAZE: ${grazeCount} x${grazeMultiplier}`;
}

function drawTitle() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
  drawStars();

  ctx.fillStyle = '#ff0';
  ctx.font = 'bold 48px "Microsoft YaHei"';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('东方幻想', GAME_WIDTH/2, GAME_HEIGHT/3);

  ctx.fillStyle = '#fff';
  ctx.font = '20px "Microsoft YaHei"';
  ctx.fillText('弹幕射击游戏', GAME_WIDTH/2, GAME_HEIGHT/3 + 50);

  ctx.font = '16px "Microsoft YaHei"';
  ctx.fillText('按 Z 或 空格 开始游戏', GAME_WIDTH/2, GAME_HEIGHT/2 + 50);

  ctx.fillText(`最高分: ${highScore}`, GAME_WIDTH/2, GAME_HEIGHT/2 + 100);
  ctx.fillText(`游戏次数: ${totalGames}`, GAME_WIDTH/2, GAME_HEIGHT/2 + 130);

  ctx.font = '14px "Microsoft YaHei"';
  ctx.fillStyle = '#aaa';
  if(!isMobile){
    ctx.fillText('方向键/WASD移动 | Z/空格射击 | X炸弹', GAME_WIDTH/2, GAME_HEIGHT - 60);
    ctx.fillText('Shift低速移动 | 炸弹清屏+无敌', GAME_WIDTH/2, GAME_HEIGHT - 35);
  }
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

  ctx.fillStyle = '#f00';
  ctx.font = 'bold 48px "Microsoft YaHei"';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('游戏结束', GAME_WIDTH/2, GAME_HEIGHT/3);

  ctx.fillStyle = '#fff';
  ctx.font = '24px "Microsoft YaHei"';
  ctx.fillText(`最终得分: ${score}`, GAME_WIDTH/2, GAME_HEIGHT/2);

  ctx.font = '18px "Microsoft YaHei"';
  ctx.fillText(`最高分: ${highScore}`, GAME_WIDTH/2, GAME_HEIGHT/2 + 40);

  ctx.fillStyle = '#ff0';
  ctx.font = '16px "Microsoft YaHei"';
  ctx.fillText('按 Z 或 空格 返回标题', GAME_WIDTH/2, GAME_HEIGHT/2 + 100);
}

function render() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

  if (gameState === 'title') {
    drawTitle();
    return;
  }

  drawStars();
  drawItems();
  drawEnemies();
  drawBoss();
  drawBullets();
  drawPlayer();
  drawParticles();
  drawBombEffect();
  drawGrazeEffect();
  drawHUD();

  if (gameState === 'gameover') {
    drawGameOver();
  }

  if (!currentBoss) {
    document.getElementById('bossHpBar').style.display = 'none';
    document.getElementById('bossName').style.display = 'none';
  }
}

// Pause system
function togglePause() {
  if (gameState !== 'game') return;
  gamePaused = !gamePaused;
  document.getElementById('pauseScreen').style.display = gamePaused ? 'flex' : 'none';
  document.getElementById('pauseBtn').style.display = gamePaused ? 'none' : 'block';
}

function updatePauseBtnVisibility() {
  document.getElementById('pauseBtn').style.display = (gameState === 'game' && !gamePaused) ? 'block' : 'none';
}

document.getElementById('pauseBtn').addEventListener('click', togglePause);
document.getElementById('resumeBtn').addEventListener('click', togglePause);
document.getElementById('restartBtn').addEventListener('click', () => { location.reload(); });

function gameLoop() {
  if (!gamePaused) {
    update();
  }
  render();
  updatePauseBtnVisibility();
  requestAnimationFrame(gameLoop);
}

function resizeCanvas() {
  const ratio = GAME_WIDTH / GAME_HEIGHT;
  let width = window.innerWidth;
  let height = window.innerHeight;

  if (width / height > ratio) {
    width = height * ratio;
  } else {
    height = width / ratio;
  }

  canvas.style.width = `${width}px`;
  canvas.style.height = `${height}px`;
}

window.addEventListener('resize', resizeCanvas);
resizeCanvas();

gameLoop();


// ===== 游戏工坊统一广告系统 =====
const GameMonetize = {
	adsterra: { enabled: !/localhost|127\.0\.0\.1/.test(location.hostname) },
	sponsor: { enabled: true, wechatQR: '', alipayQR: '' },
	interstitial: { enabled: true, cooldownMs: 180000, gameCount: 2 },
	_lastInterTime: 0, _deathCount: 0,
	_gameOverDetected: false,
	init() {
		const banner = document.getElementById('adBanner');
		if (banner && this.adsterra.enabled) {
			const s1 = document.createElement('script');
			s1.src = 'https://pl29544740.effectivecpmnetwork.com/de/26/0e/de260e17b6a348e3489772a87b1cedf1.js';
			s1.async = true;
			banner.appendChild(s1);
		}
		const spBtn = document.getElementById('sponsorBtn');
		const spPanel = document.getElementById('sponsorPanel');
		const spClose = document.getElementById('sponsorClose');
		if (spBtn && spPanel && spClose && this.sponsor.enabled) {
			spBtn.onclick = () => { spPanel.style.display = 'flex'; spPanel.style.pointerEvents = 'auto'; };
			spClose.onclick = () => { spPanel.style.display = 'none'; spPanel.style.pointerEvents = 'none'; };
			spPanel.onclick = (e) => { if (e.target === spPanel) { spPanel.style.display = 'none'; spPanel.style.pointerEvents = 'none'; } };
		} else if (spBtn) { spBtn.style.display = 'none'; }
		const skipBtn = document.getElementById('skipInterstitial');
		const interstitial = document.getElementById('interstitialAd');
		if (skipBtn && interstitial) {
			skipBtn.onclick = () => {
				interstitial.style.display = 'none'; interstitial.style.pointerEvents = 'none';
				if (this._reviveCallback) { const cb = this._reviveCallback; this._reviveCallback = null; cb(); }
			};
		}
		// 自动检测游戏结束状态
		this._startGameOverWatcher();
	},
	_startGameOverWatcher() {
		// 检测#restartBtn或包含"重新开始"/"再来一局"的按钮变为可见
		const checkGameOver = () => {
			if (this._gameOverDetected) return;
			// 方法1: 检测#restartBtn可见
			const restartBtn = document.getElementById('restartBtn');
			if (restartBtn && restartBtn.offsetParent !== null && getComputedStyle(restartBtn).display !== 'none') {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
			// 方法2: 检测#gameOverScreen可见
			const goScreen = document.getElementById('gameOverScreen');
			if (goScreen && getComputedStyle(goScreen).display !== 'none') {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
			// 方法3: 检测screen-gameover可见
			const goScreen2 = document.getElementById('screen-gameover');
			if (goScreen2 && !goScreen2.classList.contains('hidden')) {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
		};
		// 每500ms检查一次
		this._goInterval = setInterval(() => {
			checkGameOver();
			// 如果检测到了，等2秒后重置标志，允许下次检测
			if (this._gameOverDetected) {
				setTimeout(() => { this._gameOverDetected = false; }, 2000);
			}
		}, 500);
	},
	requestRevive(callback) {
		this._reviveCallback = callback || null;
		const el = document.getElementById('interstitialAd');
		if (!el) { if (callback) callback(); return; }
		const s2 = document.createElement('script');
		s2.src = 'https://pl29544742.effectivecpmnetwork.com/be/a9/6d/bea96d779c0ee07c2b15613852dd3e70.js';
		s2.async = true;
		document.getElementById('interstitialAdSlot').innerHTML = '';
		document.getElementById('interstitialAdSlot').appendChild(s2);
		el.style.display = 'flex'; el.style.pointerEvents = 'auto';

		setTimeout(() => { const slot = document.getElementById('interstitialAdSlot'); if (slot && slot.innerHTML.includes('加载中')) { slot.innerHTML = '<div style=color:#aaa;font:13px Microsoft YaHei,sans-serif>广告暂时无法加载<br>点击下方按钮继续</div>'; } }, 3000);
		const skipBtn = document.getElementById('skipInterstitial');
		if (skipBtn) {
			skipBtn.textContent = '5 秒后可跳过'; skipBtn.disabled = true;
			let cd = 5;
			const timer = setInterval(() => {
				cd--;
				if (cd <= 0) { clearInterval(timer); skipBtn.textContent = '跳过广告 ▶'; skipBtn.disabled = false; }
				else { skipBtn.textContent = cd + ' 秒后可跳过'; }
			}, 1000);
		}
	},
	onGameOver() {
		this._deathCount++;
		if (!this.interstitial.enabled) return;
		if (this._deathCount < this.interstitial.gameCount) return;
		if (Date.now() - this._lastInterTime < this.interstitial.cooldownMs) return;
		this._lastInterTime = Date.now(); this._deathCount = 0;
		this.requestRevive(null);
	},
};
GameMonetize.init();
</script>

<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();

<script>
(function(){
  if (window.__perfStable) return;
  window.__perfStable = true;
  var _origRandom = Math.random;
  var _cache = [];
  for (var i = 0; i < 512; i++) _cache.push(_origRandom());
  var _idx = 0;
  var _frameCount = 0;
  var _origRAF = window.requestAnimationFrame || function(cb){return setTimeout(cb,16)};
  window.requestAnimationFrame = function(cb) {
    return _origRAF.call(window, function(ts) {
      _frameCount++;
      if (_frameCount % 30 === 0) {
        for (var j = 0; j < 20; j++) _cache[(_idx+j) % 512] = _origRandom();
      }
      _idx = 0;
      cb(ts);
    });
  };
  Math.random = function() {
    var v = _cache[_idx % 512];
    _idx++;
    return v;
  };
})();
</script>
