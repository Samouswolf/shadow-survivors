<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,maximum-scale=1.0">
<title>雷电射击</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:"Microsoft YaHei",sans-serif;touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#game-container{position:relative;width:100%;height:100%;display:flex;justify-content:center;align-items:center;background:radial-gradient(ellipse at center,#0a0a2e 0%,#000010 100%)}
canvas{display:block;image-rendering:auto;max-width:100%;max-height:100%}
#ui-layer{position:absolute;top:0;left:0;right:0;pointer-events:none;z-index:3}
.ui-top{display:flex;justify-content:space-between;align-items:flex-start;padding:8px 12px}
.ui-score{color:#ffd700;font:bold 18px "Microsoft YaHei",sans-serif;text-shadow:0 0 10px rgba(255,215,0,.5)}
.ui-score .label{font-size:11px;color:#aaa;display:block}
.ui-lives{display:flex;gap:4px;align-items:center}
.ui-lives span{font-size:20px;filter:drop-shadow(0 0 4px #ff4444)}
.ui-bombs{color:#ff8800;font:bold 14px "Microsoft YaHei",sans-serif;text-shadow:0 0 8px rgba(255,136,0,.5)}
.ui-wave{color:#0ff;font:bold 14px "Microsoft YaHei",sans-serif;text-shadow:0 0 8px rgba(0,255,255,.5);text-align:center}
#weapon-indicator{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);color:#0f0;font:bold 12px "Microsoft YaHei",sans-serif;text-shadow:0 0 8px rgba(0,255,0,.5);pointer-events:none;z-index:3;text-align:center;transition:color .3s}
#game-over-panel{position:absolute;inset:0;background:rgba(0,0,0,.85);z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;pointer-events:auto}
#game-over-panel h2{color:#ff4444;font:bold 36px "Microsoft YaHei",sans-serif;text-shadow:0 0 20px rgba(255,68,68,.6)}
#game-over-panel .final-score{color:#ffd700;font:bold 24px "Microsoft YaHei",sans-serif}
#game-over-panel .restart-btn{padding:12px 40px;background:rgba(255,215,0,.15);border:2px solid rgba(255,215,0,.4);border-radius:25px;color:#ffd700;font:bold 18px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
#game-over-panel .restart-btn:hover{background:rgba(255,215,0,.3);transform:scale(1.05)}
#mobile-controls{position:absolute;bottom:0;left:0;right:0;height:140px;display:none;z-index:4;pointer-events:auto}
.joystick-area{position:absolute;bottom:20px;left:20px;width:120px;height:120px;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.15);border-radius:50%}
.joystick-knob{position:absolute;width:50px;height:50px;background:rgba(255,255,255,.2);border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);transition:background .15s}
.joystick-knob.active{background:rgba(255,255,255,.4)}
.bomb-btn{position:absolute;bottom:30px;right:20px;width:70px;height:70px;background:rgba(255,136,0,.15);border:2px solid rgba(255,136,0,.3);border-radius:50%;color:#ff8800;font:bold 14px "Microsoft YaHei",sans-serif;display:flex;align-items:center;justify-content:center;cursor:pointer}
.bomb-btn:active{background:rgba(255,136,0,.35)}
#start-screen{position:absolute;inset:0;background:rgba(0,0,0,.9);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;pointer-events:auto}
#start-screen h1{color:#ffd700;font:bold 42px "Microsoft YaHei",sans-serif;text-shadow:0 0 30px rgba(255,215,0,.6),0 0 60px rgba(255,215,0,.3)}
#start-screen .subtitle{color:#aaa;font:14px "Microsoft YaHei",sans-serif}
#start-screen .start-btn{padding:14px 50px;background:rgba(255,215,0,.15);border:2px solid rgba(255,215,0,.4);border-radius:30px;color:#ffd700;font:bold 20px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s;animation:pulse 2s ease-in-out infinite}
#start-screen .start-btn:hover{background:rgba(255,215,0,.3);transform:scale(1.08)}
#start-screen .controls-info{color:#666;font:12px "Microsoft YaHei",sans-serif;text-align:center;line-height:1.8}
@keyframes pulse{0%,100%{box-shadow:0 0 20px rgba(255,215,0,.2)}50%{box-shadow:0 0 40px rgba(255,215,0,.5)}}
/* 广告系统 */
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);height:90px;max-height:90px;overflow:hidden;contain:layout style paint;pointer-events:none!important}.ad-banner-container,.ad-banner-container *{pointer-events:none!important}.ad-banner-container iframe{max-height:90px;pointer-events:none!important}
.ad-banner-container iframe{max-width:100%}
.ad-label{position:absolute;top:1px;right:6px;font:9px "Microsoft YaHei",sans-serif;color:rgba(255,255,255,.35)}
.sponsor-btn{position:fixed;top:44px;right:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:3px 9px;border-radius:10px;font:11px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .qr-row{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.sponsor-panel .qr-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px;text-align:center;min-width:140px}
.sponsor-panel .qr-card .qr-icon{font-size:48px;margin-bottom:6px}
.sponsor-panel .qr-card .qr-label{color:#ccc;font:13px "Microsoft YaHei",sans-serif}
.sponsor-panel .qr-card .qr-hint{color:#888;font:11px "Microsoft YaHei",sans-serif;margin-top:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.interstitial-ad .ad-content{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;text-align:center;min-width:280px;max-width:400px}
.interstitial-ad .ad-content p{color:#aaa;font:14px "Microsoft YaHei",sans-serif;margin-bottom:12px}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
@media(max-width:768px){#mobile-controls{display:block}}
</style>
</head>

        <div style="font-weight:bold;color:#f5576c;margin-bottom:5px;">🎮 操作说明</div>

<div id="game-container">

  <div id="ui-layer">

<div class="ad-banner-container" id="adBanner"><div class="ad-label">广告</div><div id="adSlot" style="width:728px;max-width:100%;height:90px;display:flex;align-items:center;justify-content:center;color:#888;font:12px 'Microsoft YaHei',sans-serif">广告加载中...</div></div>

<script>
// ==================== 雷电射击 - 主游戏引擎 ====================
(function(){
"use strict";

// --- DOM元素 ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreDisplay = document.getElementById('scoreDisplay');
const waveDisplay = document.getElementById('waveDisplay');
const bombDisplay = document.getElementById('bombDisplay');
const weaponIndicator = document.getElementById('weaponIndicator');
const finalScore = document.getElementById('finalScore');
const gameOverPanel = document.getElementById('game-over-panel');
const startScreen = document.getElementById('start-screen');
const joystickArea = document.getElementById('joystickArea');
const joystickKnob = document.getElementById('joystickKnob');
const bombBtn = document.getElementById('bombBtn');

// --- 画布尺寸 ---
const GAME_W = 480;
const GAME_H = 800;
let scale = 1;

function resizeCanvas() {
  const maxW = Math.min(window.innerWidth, GAME_W);
  const maxH = Math.min(window.innerHeight - 90, GAME_H); // 给底部广告留空间
  scale = Math.min(maxW / GAME_W, maxH / GAME_H);
  canvas.width = GAME_W;
  canvas.height = GAME_H;
  canvas.style.width = (GAME_W * scale) + 'px';
  canvas.style.height = (GAME_H * scale) + 'px';
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// --- 游戏状态 ---
const STATE = { MENU:0, PLAYING:1, GAMEOVER:2 };
let gameState = STATE.MENU;
let score = 0;
let wave = 1;
let waveTimer = 0;
let waveEnemiesRemaining = 0;
let waveSpawnTimer = 0;
let bombs = 3;
let lives = 3;
let invincibleTimer = 0;
let shieldActive = false;
let shieldTimer = 0;
let comboCount = 0;
let comboTimer = 0;
let screenShake = 0;
let gameTime = 0;
let isBossWave = false;
let bossDefeated = false;

// --- 输入状态 ---
const keys = {};
let moveX = 0, moveY = 0;
let joystickActive = false;
let joystickId = null;
let joystickDX = 0, joystickDY = 0;

// --- 星空背景 ---
class Star {
  constructor() { this.reset(true); }
  reset(init) {
    this.x = Math.random() * GAME_W;
    this.y = init ? Math.random() * GAME_H : -5;
    this.speed = 0.5 + Math.random() * 3;
    this.size = Math.random() * 2.5 + 0.5;
    this.brightness = Math.random() * 0.5 + 0.5;
    this.twinkle = Math.random() * Math.PI * 2;
    this.twinkleSpeed = 0.02 + Math.random() * 0.05;
  }
  update() {
    this.y += this.speed;
    this.twinkle += this.twinkleSpeed;
    if (this.y > GAME_H + 5) this.reset(false);
  }
  draw(ctx) {
    const alpha = this.brightness * (0.6 + 0.4 * Math.sin(this.twinkle));
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}
const stars = Array.from({length: 120}, () => new Star());

// --- 粒子系统 ---
class Particle {
  constructor() { this.reset(); }
  reset() {
    this.x = 0; this.y = 0;
    this.vx = 0; this.vy = 0;
    this.life = 0; this.maxLife = 0;
    this.color = '#fff';
    this.size = 2;
    this.type = 'circle'; // circle, spark, smoke
  }
  init(x, y, vx, vy, life, color, size, type) {
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.life = life; this.maxLife = life;
    this.color = color;
    this.size = size || 2;
    this.type = type || 'circle';
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life--;
    this.vx *= 0.98;
    this.vy *= 0.98;
    if (this.type === 'smoke') this.size += 0.1;
  }
  draw(ctx) {
    const alpha = Math.max(0, this.life / this.maxLife);
    const s = this.type === 'smoke' ? this.size * 2 : this.size;
    if (this.type === 'spark') {
      ctx.strokeStyle = this.color.replace('1)', `${alpha})`).replace('rgb','rgba');
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(this.x - this.vx * 2, this.y - this.vy * 2);
      ctx.lineTo(this.x, this.y);
      ctx.stroke();
    } else {
      ctx.fillStyle = this.color.replace('1)', `${alpha})`).replace('rgb','rgba');
      ctx.beginPath();
      ctx.arc(this.x, this.y, s, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  get dead() { return this.life <= 0; }
}
const particles = [];
const MAX_PARTICLES = 300;
function spawnParticle(x, y, vx, vy, life, color, size, type) {
  let p = particles.find(q => q.dead);
  if (!p) {
    if (particles.length >= MAX_PARTICLES) return;
    p = new Particle();
    particles.push(p);
  }
  p.init(x, y, vx, vy, life, color, size, type);
}
function spawnExplosion(x, y, count, color, spread, life) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = (Math.random() * spread);
    const vx = Math.cos(angle) * speed;
    const vy = Math.sin(angle) * speed;
    const size = 1 + Math.random() * 3;
    const type = Math.random() < 0.3 ? 'spark' : 'circle';
    spawnParticle(x, y, vx, vy, life || 25, color, size, type);
  }
  // smoke particles
  for (let i = 0; i < count * 0.3; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * spread * 0.5;
    spawnParticle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, 20, 'rgb(100,100,100,1)', 3, 'smoke');
  }
}

// --- 对象池 ---
class Bullet {
  constructor() { this.reset(); }
  reset() { this.active = false; this.x = 0; this.y = 0; this.vx = 0; this.vy = 0; this.damage = 1; this.type = 'normal'; this.width = 4; this.height = 10; this.color = '#0ff'; }
  init(x, y, vx, vy, damage, type, w, h, color) {
    this.active = true; this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.damage = damage || 1; this.type = type || 'normal';
    this.width = w || 4; this.height = h || 10; this.color = color || '#0ff';
  }
}
const playerBullets = [];
const MAX_PBULLETS = 200;
function spawnPlayerBullet(x, y, vx, vy, dmg, type, w, h, color) {
  let b = playerBullets.find(q => !q.active);
  if (!b) {
    if (playerBullets.length >= MAX_PBULLETS) return;
    b = new Bullet();
    playerBullets.push(b);
  }
  b.init(x, y, vx, vy, dmg, type, w, h, color);
}

class EnemyBullet {
  constructor() { this.reset(); }
  reset() { this.active = false; this.x = 0; this.y = 0; this.vx = 0; this.vy = 0; this.radius = 4; this.color = '#f44'; }
  init(x, y, vx, vy, radius, color) {
    this.active = true; this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.radius = radius || 4; this.color = color || '#f44';
  }
}
const enemyBullets = [];
const MAX_EBULLETS = 300;
function spawnEnemyBullet(x, y, vx, vy, radius, color) {
  let b = enemyBullets.find(q => !q.active);
  if (!b) {
    if (enemyBullets.length >= MAX_EBULLETS) return;
    b = new EnemyBullet();
    enemyBullets.push(b);
  }
  b.init(x, y, vx, vy, radius, color);
}

// --- 道具 ---
class PowerUp {
  constructor() { this.reset(); }
  reset() { this.active = false; this.x = 0; this.y = 0; this.type = 'weapon'; this.vy = 1.5; }
  init(x, y, type) {
    this.active = true; this.x = x; this.y = y; this.type = type;
    this.vy = 1.5; this.life = 400;
  }
}
const powerUps = [];
const MAX_POWERUPS = 20;
function spawnPowerUp(x, y, type) {
  let p = powerUps.find(q => !q.active);
  if (!p) {
    if (powerUps.length >= MAX_POWERUPS) return;
    p = new PowerUp();
    powerUps.push(p);
  }
  p.init(x, y, type);
}
const POWERUP_TYPES = ['weapon', 'weapon', 'weapon', 'bomb', 'health', 'shield'];
const POWERUP_COLORS = { weapon:'#ff0', bomb:'#f80', health:'#0f0', shield:'#0af' };
const POWERUP_LABELS = { weapon:'W', bomb:'B', health:'+', shield:'S' };

// --- 玩家 ---
const player = {
  x: GAME_W / 2, y: GAME_H - 120,
  width: 32, height: 36,
  speed: 5,
  weaponLevel: 0, // 0=普通,1=双发,2=三发,3=四发,4=激光,5=导弹
  fireTimer: 0,
  fireRate: 8, // frames between shots
  missileTimer: 0,
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    // 引擎火焰
    const flicker = 0.7 + 0.3 * Math.sin(gameTime * 0.5);
    ctx.fillStyle = `rgba(0,180,255,${0.6 * flicker})`;
    ctx.beginPath();
    ctx.moveTo(-8, 18);
    ctx.lineTo(0, 24 + Math.random() * 6);
    ctx.lineTo(8, 18);
    ctx.fill();
    ctx.fillStyle = `rgba(255,255,255,${0.8 * flicker})`;
    ctx.beginPath();
    ctx.moveTo(-4, 16);
    ctx.lineTo(0, 20 + Math.random() * 4);
    ctx.lineTo(4, 16);
    ctx.fill();
    // 机身
    ctx.fillStyle = '#4488ff';
    ctx.beginPath();
    ctx.moveTo(0, -18);
    ctx.lineTo(-14, 8);
    ctx.lineTo(-8, 14);
    ctx.lineTo(0, 10);
    ctx.lineTo(8, 14);
    ctx.lineTo(14, 8);
    ctx.closePath();
    ctx.fill();
    // 机身高光
    ctx.fillStyle = '#88bbff';
    ctx.beginPath();
    ctx.moveTo(0, -16);
    ctx.lineTo(-8, 6);
    ctx.lineTo(0, 0);
    ctx.lineTo(8, 6);
    ctx.closePath();
    ctx.fill();
    // 座舱
    ctx.fillStyle = '#aaddff';
    ctx.beginPath();
    ctx.ellipse(0, -2, 4, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    // 护盾
    if (shieldActive) {
      ctx.strokeStyle = `rgba(0,200,255,${0.5 + 0.3 * Math.sin(gameTime * 0.15)})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, 22, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = `rgba(255,255,255,${0.2 + 0.15 * Math.sin(gameTime * 0.2)})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(0, 0, 24, 0, Math.PI * 2);
      ctx.stroke();
    }
    // 无敌闪烁
    if (invincibleTimer > 0 && Math.floor(invincibleTimer / 4) % 2 === 0) {
      ctx.globalAlpha = 0.4;
      ctx.fillStyle = '#fff';
      ctx.fillRect(-16, -20, 32, 40);
    }
    ctx.restore();
  }
};

// --- 武器系统 ---
function firePlayerWeapon() {
  const p = player;
  const lvl = p.weaponLevel;
  const cx = p.x, cy = p.y - 18;

  if (lvl <= 3) {
    // 普通/散弹模式
    const count = lvl + 1; // 1,2,3,4
    const spread = count > 1 ? 0.3 : 0;
    for (let i = 0; i < count; i++) {
      const offset = (i - (count - 1) / 2) * spread * (count - 1);
      const vx = Math.sin(offset) * 1.5;
      const vy = -8;
      const color = lvl === 3 ? '#ff0' : lvl === 2 ? '#0ff' : '#aaf';
      spawnPlayerBullet(cx + Math.sin(offset) * 8, cy, vx, vy, 1, 'normal', 3, 10, color);
    }
    // 暗红色子弹提示
    if (lvl >= 2) {
      spawnPlayerBullet(cx - 8, cy + 2, -0.5, -7, 0.5, 'normal', 2, 8, '#f66');
      spawnPlayerBullet(cx + 8, cy + 2, 0.5, -7, 0.5, 'normal', 2, 8, '#f66');
    }
  } else if (lvl === 4) {
    // 激光模式
    spawnPlayerBullet(cx, cy - 6, 0, -12, 2, 'laser', 4, 16, '#0ff');
    spawnPlayerBullet(cx, cy - 6, 0, -12, 2, 'laser', 4, 16, '#4af');
    // 侧翼小弹
    spawnPlayerBullet(cx - 10, cy + 4, -0.3, -7, 0.5, 'normal', 2, 8, '#aaf');
    spawnPlayerBullet(cx + 10, cy + 4, 0.3, -7, 0.5, 'normal', 2, 8, '#aaf');
  } else if (lvl >= 5) {
    // 导弹模式
    spawnPlayerBullet(cx, cy - 6, 0, -8, 1.5, 'normal', 4, 10, '#ff0');
    spawnPlayerBullet(cx - 8, cy + 2, -0.3, -7, 1, 'normal', 3, 9, '#0ff');
    spawnPlayerBullet(cx + 8, cy + 2, 0.3, -7, 1, 'normal', 3, 9, '#0ff');
    // 导弹自动追踪
    if (p.missileTimer <= 0) {
      p.missileTimer = 25;
      for (let i = -1; i <= 1; i += 2) {
        spawnPlayerBullet(cx + i * 12, cy + 10, i * 1.5, -3, 3, 'missile', 5, 12, '#f80');
      }
    }
  }
}

// --- 敌机类型 ---
class Enemy {
  constructor() {
    this.active = false;
    this.x = 0; this.y = 0;
    this.vx = 0; this.vy = 0;
    this.width = 30; this.height = 30;
    this.hp = 1; this.maxHp = 1;
    this.type = 'scout';
    this.score = 100;
    this.fireTimer = 0;
    this.fireInterval = 60;
    this.movePattern = 'straight';
    this.moveTimer = 0;
    this.patternData = {};
    this.color = '#f44';
    this.flashTimer = 0;
  }
  init(x, y, vx, vy, type, hp, movePattern, patternData) {
    this.active = true;
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.type = type;
    this.hp = hp; this.maxHp = hp;
    this.movePattern = movePattern || 'straight';
    this.patternData = patternData || {};
    this.moveTimer = 0;
    this.fireTimer = 0;
    this.flashTimer = 0;
    this.score = type === 'boss' ? 5000 : type === 'bomber' ? 500 : type === 'fighter' ? 200 : 100;
    this.fireInterval = type === 'boss' ? 20 : type === 'fighter' ? 55 : 999;
    this.color = type === 'boss' ? '#f44' : type === 'bomber' ? '#f80' : type === 'fighter' ? '#fa0' : '#f66';
    switch(type) {
      case 'scout': this.width = 24; this.height = 24; break;
      case 'fighter': this.width = 34; this.height = 30; break;
      case 'bomber': this.width = 50; this.height = 40; break;
      case 'boss': this.width = 80; this.height = 60; break;
    }
  }
  update() {
    this.moveTimer++;
    this.fireTimer++;
    if (this.flashTimer > 0) this.flashTimer--;

    switch(this.movePattern) {
      case 'straight':
        this.x += this.vx;
        this.y += this.vy;
        break;
      case 'sine':
        this.x += Math.sin(this.moveTimer * 0.05) * 2;
        this.y += this.vy;
        break;
      case 'zigzag':
        if (Math.floor(this.moveTimer / 40) % 2 === 0) {
          this.x += 1.5;
        } else {
          this.x -= 1.5;
        }
        this.y += this.vy;
        break;
      case 'boss_entry':
        if (this.y < 80) {
          this.y += 1;
        } else {
          this.movePattern = 'boss_idle';
          this.moveTimer = 0;
        }
        break;
      case 'boss_idle':
        this.x = GAME_W / 2 + Math.sin(this.moveTimer * 0.03) * 120;
        this.y = 80 + Math.sin(this.moveTimer * 0.02) * 30;
        break;
      case 'circle':
        const cx = this.patternData.cx || GAME_W / 2;
        const cy = this.patternData.cy || 100;
        const r = this.patternData.radius || 80;
        const speed = this.patternData.speed || 0.02;
        this.x = cx + Math.cos(this.moveTimer * speed) * r;
        this.y = cy + Math.sin(this.moveTimer * speed) * r * 0.6;
        break;
    }

    // 开火
    if (this.fireTimer >= this.fireInterval) {
      this.fireTimer = 0;
      this.fire();
    }

    // 离开屏幕
    return this.y > GAME_H + 60 || this.y < -60 || this.x < -60 || this.x > GAME_W + 60;
  }
  fire() {
    const ex = this.x, ey = this.y + this.height / 2;
    switch(this.type) {
      case 'fighter':
        spawnEnemyBullet(ex, ey, 0, 4, 4, '#ff0');
        break;
      case 'bomber':
        for (let a = -0.5; a <= 0.5; a += 0.25) {
          spawnEnemyBullet(ex, ey, a, 3.5, 5, '#f80');
        }
        break;
      case 'boss':
        const p = Math.random();
        if (p < 0.3) {
          // 扇形弹幕
          for (let a = -0.8; a <= 0.8; a += 0.15) {
            spawnEnemyBullet(ex, ey, a * 3, 3, 5, '#f44');
          }
        } else if (p < 0.6) {
          // 瞄准弹
          const dx = player.x - ex;
          const dy = player.y - ey;
          const dist = Math.sqrt(dx * dx + dy * dy) || 1;
          const speed = 4;
          spawnEnemyBullet(ex, ey, dx / dist * speed, dy / dist * speed, 6, '#ff0');
          spawnEnemyBullet(ex - 10, ey, dx / dist * speed * 0.9, dy / dist * speed * 0.9, 5, '#ff0');
          spawnEnemyBullet(ex + 10, ey, dx / dist * speed * 0.9, dy / dist * speed * 0.9, 5, '#ff0');
        } else {
          // 圆形弹幕
          for (let i = 0; i < 12; i++) {
            const a = i * Math.PI * 2 / 12 + this.moveTimer * 0.05;
            spawnEnemyBullet(ex, ey, Math.cos(a) * 3, Math.sin(a) * 3, 4, '#faa');
          }
        }
        break;
    }
  }
  draw(ctx) {
    if (this.flashTimer > 0 && Math.floor(this.flashTimer / 2) % 2 === 0) return;
    ctx.save();
    ctx.translate(this.x, this.y);
    switch(this.type) {
      case 'scout':
        ctx.fillStyle = '#f66';
        ctx.beginPath();
        ctx.moveTo(0, 12);
        ctx.lineTo(-10, -6);
        ctx.lineTo(-4, -2);
        ctx.lineTo(4, -2);
        ctx.lineTo(10, -6);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#faa';
        ctx.beginPath(); ctx.arc(0, 0, 3, 0, Math.PI * 2); ctx.fill();
        break;
      case 'fighter':
        ctx.fillStyle = '#f80';
        ctx.beginPath();
        ctx.moveTo(0, -15);
        ctx.lineTo(-12, 5);
        ctx.lineTo(-6, 10);
        ctx.lineTo(0, 6);
        ctx.lineTo(6, 10);
        ctx.lineTo(12, 5);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#fc0';
        ctx.beginPath(); ctx.arc(0, -3, 4, 0, Math.PI * 2); ctx.fill();
        break;
      case 'bomber':
        ctx.fillStyle = '#f80';
        ctx.fillRect(-20, -15, 40, 30);
        ctx.fillStyle = '#faa';
        ctx.fillRect(-16, -18, 12, 6);
        ctx.fillRect(4, -18, 12, 6);
        ctx.fillStyle = '#ff0';
        ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.fill();
        break;
      case 'boss':
        // Boss body
        ctx.fillStyle = '#c44';
        ctx.beginPath();
        ctx.moveTo(0, -30);
        ctx.lineTo(-30, -10);
        ctx.lineTo(-35, 10);
        ctx.lineTo(-25, 25);
        ctx.lineTo(0, 30);
        ctx.lineTo(25, 25);
        ctx.lineTo(35, 10);
        ctx.lineTo(30, -10);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#e66';
        ctx.fillRect(-15, -25, 30, 45);
        ctx.fillStyle = '#f88';
        ctx.beginPath(); ctx.arc(0, -5, 10, 0, Math.PI * 2); ctx.fill();
        // 翅膀
        ctx.fillStyle = '#a33';
        ctx.beginPath();
        ctx.moveTo(-30, -10); ctx.lineTo(-45, -5); ctx.lineTo(-40, 5); ctx.lineTo(-30, 5); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(30, -10); ctx.lineTo(45, -5); ctx.lineTo(40, 5); ctx.lineTo(30, 5); ctx.fill();
        // HP bar
        if (this.maxHp > 10) {
          const barW = 60;
          ctx.fillStyle = '#333';
          ctx.fillRect(-barW / 2, -38, barW, 5);
          ctx.fillStyle = '#f44';
          ctx.fillRect(-barW / 2, -38, barW * (this.hp / this.maxHp), 5);
        }
        break;
    }
    ctx.restore();
  }
  hit(dmg) {
    this.hp -= dmg;
    this.flashTimer = 4;
    if (this.hp <= 0) {
      this.active = false;
      spawnExplosion(this.x, this.y, this.type === 'boss' ? 50 : this.type === 'bomber' ? 20 : 10,
        this.type === 'boss' ? '#f44' : '#f80',
        this.type === 'boss' ? 6 : 4,
        this.type === 'boss' ? 40 : 25);
      if (this.type === 'boss') screenShake = 15;
      return true;
    }
    spawnParticle(this.x, this.y, (Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2, 8, '#fff', 1.5, 'spark');
    return false;
  }
}
const enemies = [];
const MAX_ENEMIES = 40;

function spawnEnemy(x, y, type, hp, movePattern, patternData) {
  let e = enemies.find(q => !q.active);
  if (!e) {
    if (enemies.length >= MAX_ENEMIES) return;
    e = new Enemy();
    enemies.push(e);
  }
  const vx = type === 'boss' ? 0 : (Math.random() - 0.5) * 1;
  const vy = type === 'boss' ? 0.5 : 1 + Math.random() * 1.5;
  e.init(x, y, vx, vy, type, hp, movePattern, patternData);
}

// --- 波次管理 ---
function spawnWave() {
  waveEnemiesRemaining = 0;
  waveSpawnTimer = 0;
  isBossWave = (wave % 5 === 0);
  bossDefeated = false;

  if (isBossWave) {
    // Boss wave
    spawnEnemy(GAME_W / 2, -60, 'boss', 30 + wave * 10, 'boss_entry', {});
    waveEnemiesRemaining = 1;
  } else {
    // Normal wave
    const enemyCount = 5 + wave * 2;
    waveEnemiesRemaining = enemyCount;
    // 分批生成
  }
}

function spawnWaveEnemies() {
  if (waveSpawnTimer > 0) {
    waveSpawnTimer--;
    return;
  }
  if (waveEnemiesRemaining <= 0) return;
  if (isBossWave) return;

  const r = Math.random();
  if (r < 0.5) {
    spawnEnemy(Math.random() * (GAME_W - 40) + 20, -30, 'scout', 1 + Math.floor(wave / 3), 'straight', {});
  } else if (r < 0.8) {
    spawnEnemy(Math.random() * (GAME_W - 40) + 20, -30, 'fighter', 2 + Math.floor(wave / 2), 'sine', {});
  } else {
    spawnEnemy(Math.random() * (GAME_W - 60) + 30, -40, 'bomber', 4 + wave, 'zigzag', {});
  }
  waveEnemiesRemaining--;
  waveSpawnTimer = Math.max(8, 35 - wave * 2);
}

function checkWaveComplete() {
  if (waveEnemiesRemaining > 0) return false;
  if (isBossWave && !bossDefeated) {
    const bossAlive = enemies.some(e => e.active && e.type === 'boss');
    if (bossAlive) return false;
    bossDefeated = true;
  }
  const anyEnemy = enemies.some(e => e.active);
  if (!anyEnemy) {
    wave++;
    waveDisplay.textContent = wave;
    // 波次完成奖励
    score += 500 * wave;
    scoreDisplay.textContent = score;
    // 波次间过渡
    waveTimer = 60;
    // 清理弹药
    enemyBullets.forEach(b => b.active = false);
    return true;
  }
  return false;
}

// --- 碰撞检测 ---
function rectCollide(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

// --- 炸弹 ---
function useBomb() {
  if (bombs <= 0) return;
  bombs--;
  bombDisplay.textContent = bombs;
  screenShake = 10;
  // 清屏
  enemies.forEach(e => {
    if (e.active) {
      e.hit(999);
      e.active = false;
    }
  });
  enemyBullets.forEach(b => b.active = false);
  // 大爆炸特效
  spawnExplosion(GAME_W / 2, GAME_H / 2, 80, '#fff', 8, 50);
  for (let i = 0; i < 5; i++) {
    setTimeout(() => {
      spawnExplosion(Math.random() * GAME_W, Math.random() * GAME_H, 20, '#ff0', 5, 30);
    }, i * 80);
  }
}

// --- 游戏循环 ---
function update() {
  if (gameState !== STATE.PLAYING) return;
  gameTime++;

  // 屏幕震动
  if (screenShake > 0) screenShake--;

  // 无敌计时
  if (invincibleTimer > 0) invincibleTimer--;
  if (shieldTimer > 0) {
    shieldTimer--;
    if (shieldTimer <= 0) shieldActive = false;
  }

  // 连击计时
  if (comboTimer > 0) {
    comboTimer--;
    if (comboTimer <= 0) comboCount = 0;
  }

  // 波次过渡
  if (waveTimer > 0) {
    waveTimer--;
    if (waveTimer === 0) spawnWave();
    return;
  }

  // 输入处理
  let dx = 0, dy = 0;
  if (keys['ArrowLeft'] || keys['KeyA'] || keys['a']) dx = -1;
  if (keys['ArrowRight'] || keys['KeyD'] || keys['d']) dx = 1;
  if (keys['ArrowUp'] || keys['KeyW'] || keys['w']) dy = -1;
  if (keys['ArrowDown'] || keys['KeyS'] || keys['s']) dy = 1;
  if (joystickActive) { dx = joystickDX; dy = joystickDY; }

  // 移动玩家
  const moveSpeed = player.speed;
  if (dx !== 0 && dy !== 0) {
    player.x += dx * moveSpeed * 0.707;
    player.y += dy * moveSpeed * 0.707;
  } else {
    player.x += dx * moveSpeed;
    player.y += dy * moveSpeed;
  }
  player.x = Math.max(player.width / 2, Math.min(GAME_W - player.width / 2, player.x));
  player.y = Math.max(player.height / 2, Math.min(GAME_H - player.height / 2 - 40, player.y));

  // 自动射击
  player.fireTimer++;
  if (player.fireTimer >= player.fireRate) {
    player.fireTimer = 0;
    firePlayerWeapon();
  }
  if (player.missileTimer > 0) player.missileTimer--;

  // 更新星空
  stars.forEach(s => s.update());

  // 生成敌人
  if (!isBossWave || bossDefeated) {
    spawnWaveEnemies();
  }

  // 更新玩家子弹
  playerBullets.forEach(b => {
    if (!b.active) return;
    b.x += b.vx;
    b.y += b.vy;
    if (b.type === 'missile') {
      // 追踪最近敌人
      let nearest = null, minDist = 200;
      enemies.forEach(e => {
        if (!e.active) return;
        const d = Math.hypot(e.x - b.x, e.y - b.y);
        if (d < minDist) { minDist = d; nearest = e; }
      });
      if (nearest) {
        const dx = nearest.x - b.x, dy = nearest.y - b.y;
        const dist = Math.hypot(dx, dy) || 1;
        b.vx += (dx / dist) * 0.3;
        b.vy += (dy / dist) * 0.3;
        const mag = Math.hypot(b.vx, b.vy);
        if (mag > 6) { b.vx = b.vx / mag * 6; b.vy = b.vy / mag * 6; }
      }
    }
    if (b.y < -20 || b.y > GAME_H + 20 || b.x < -20 || b.x > GAME_W + 20) {
      b.active = false;
    }
  });

  // 更新敌弹
  enemyBullets.forEach(b => {
    if (!b.active) return;
    b.x += b.vx;
    b.y += b.vy;
    if (b.y > GAME_H + 20 || b.y < -20 || b.x < -20 || b.x > GAME_W + 20) b.active = false;
  });

  // 更新敌人
  enemies.forEach(e => {
    if (!e.active) return;
    const offScreen = e.update();
    if (offScreen) e.active = false;
  });

  // 碰撞：玩家子弹 vs 敌人
  playerBullets.forEach(b => {
    if (!b.active) return;
    enemies.forEach(e => {
      if (!e.active || !b.active) return;
      if (rectCollide(b.x - b.width / 2, b.y - b.height / 2, b.width, b.height,
        e.x - e.width / 2, e.y - e.height / 2, e.width, e.height)) {
        b.active = false;
        const killed = e.hit(b.damage);
        if (killed) {
          comboCount++;
          comboTimer = 60;
          const comboBonus = Math.min(comboCount, 10);
          score += e.score * comboBonus;
          scoreDisplay.textContent = score;
          // 掉落道具
          if (Math.random() < (e.type === 'boss' ? 1 : e.type === 'bomber' ? 0.5 : 0.15)) {
            const types = POWERUP_TYPES;
            const type = types[Math.floor(Math.random() * types.length)];
            spawnPowerUp(e.x, e.y, type);
          }
          if (e.type === 'boss') {
            // Boss必掉武器升级
            spawnPowerUp(e.x, e.y, 'weapon');
            spawnPowerUp(e.x - 20, e.y, 'bomb');
            spawnPowerUp(e.x + 20, e.y, 'health');
          }
        }
      }
    });
  });

  // 碰撞：敌弹 vs 玩家
  if (invincibleTimer <= 0) {
    enemyBullets.forEach(b => {
      if (!b.active) return;
      const hitRadius = shieldActive ? 22 : 12;
      const dx = b.x - player.x, dy = b.y - player.y;
      if (dx * dx + dy * dy < (b.radius + hitRadius) * (b.radius + hitRadius)) {
        b.active = false;
        if (shieldActive) {
          spawnParticle(b.x, b.y, 0, 0, 10, '#0af', 3, 'circle');
          return;
        }
        playerHit();
      }
    });

    // 碰撞：敌机 vs 玩家
    enemies.forEach(e => {
      if (!e.active) return;
      if (rectCollide(player.x - 12, player.y - 12, 24, 24,
        e.x - e.width / 2, e.y - e.height / 2, e.width, e.height)) {
        if (shieldActive) {
          e.hit(5);
          spawnParticle(e.x, e.y, 0, 0, 10, '#0af', 4, 'circle');
          return;
        }
        e.hit(e.hp); // 互毁
        e.active = false;
        spawnExplosion(e.x, e.y, 15, '#f80', 4, 20);
        playerHit();
      }
    });
  }

  // 更新道具
  powerUps.forEach(p => {
    if (!p.active) return;
    p.y += p.vy;
    p.life--;
    if (p.y > GAME_H + 30 || p.life <= 0) { p.active = false; return; }
    // 碰撞玩家
    if (rectCollide(p.x - 10, p.y - 10, 20, 20, player.x - 16, player.y - 18, 32, 36)) {
      p.active = false;
      collectPowerUp(p.type);
    }
  });

  // 更新粒子
  particles.forEach(p => { if (!p.dead) p.update(); });

  // 检查波次完成
  checkWaveComplete();
}

function playerHit() {
  if (invincibleTimer > 0) return;
  lives--;
  invincibleTimer = 90;
  screenShake = 8;
  spawnExplosion(player.x, player.y, 20, '#f44', 3, 20);
  if (lives <= 0) {
    gameOver();
  }
}

function collectPowerUp(type) {
  switch(type) {
    case 'weapon':
      if (player.weaponLevel < 5) {
        player.weaponLevel++;
        updateWeaponUI();
      }
      score += 200;
      break;
    case 'bomb':
      bombs = Math.min(bombs + 1, 9);
      bombDisplay.textContent = bombs;
      break;
    case 'health':
      lives = Math.min(lives + 1, 5);
      break;
    case 'shield':
      shieldActive = true;
      shieldTimer = 300;
      break;
  }
  scoreDisplay.textContent = score;
  spawnExplosion(player.x, player.y, 8, '#ff0', 2, 12);
}

function updateWeaponUI() {
  const names = ['普通射击', '双发', '三向散弹', '四向散弹', '激光炮', '追踪导弹'];
  const colors = ['#aaf', '#0ff', '#0ff', '#ff0', '#0ff', '#f80'];
  const lvl = Math.min(player.weaponLevel, 5);
  weaponIndicator.textContent = '⚡ ' + names[lvl];
  weaponIndicator.style.color = colors[lvl];
}

function gameOver() {
  gameState = STATE.GAMEOVER;
  finalScore.textContent = score;
  gameOverPanel.style.display = 'flex';
  weaponIndicator.style.display = 'none';
  spawnExplosion(player.x, player.y, 40, '#f44', 5, 40);
  setTimeout(() => showInterstitialAd(), 1500);
}

function resetGame() {
  score = 0;
  wave = 1;
  bombs = 3;
  lives = 3;
  player.x = GAME_W / 2;
  player.y = GAME_H - 120;
  player.weaponLevel = 0;
  player.fireTimer = 0;
  player.missileTimer = 0;
  invincibleTimer = 60; // 开局短暂无敌
  shieldActive = false;
  shieldTimer = 0;
  comboCount = 0;
  comboTimer = 0;
  screenShake = 0;
  gameTime = 0;
  waveTimer = 0;
  isBossWave = false;
  bossDefeated = false;
  playerBullets.forEach(b => b.active = false);
  enemyBullets.forEach(b => b.active = false);
  enemies.forEach(e => e.active = false);
  powerUps.forEach(p => p.active = false);
  particles.length = 0;
  scoreDisplay.textContent = '0';
  waveDisplay.textContent = '1';
  bombDisplay.textContent = '3';
  updateWeaponUI();
  gameOverPanel.style.display = 'none';
  weaponIndicator.style.display = 'block';
  spawnWave();
  gameState = STATE.PLAYING;
}

// --- 渲染 ---
function draw() {
  ctx.clearRect(0, 0, GAME_W, GAME_H);

  // 屏幕震动偏移
  let sx = 0, sy = 0;
  if (screenShake > 0) {
    sx = (Math.random() - 0.5) * screenShake;
    sy = (Math.random() - 0.5) * screenShake;
  }
  ctx.save();
  ctx.translate(sx, sy);

  // 星空
  stars.forEach(s => s.draw(ctx));

  // 粒子
  particles.forEach(p => { if (!p.dead) p.draw(ctx); });

  // 道具
  powerUps.forEach(p => {
    if (!p.active) return;
    const color = POWERUP_COLORS[p.type] || '#fff';
    const label = POWERUP_LABELS[p.type] || '?';
    // 发光
    ctx.fillStyle = color.replace(')', ',0.3)').replace('rgb', 'rgba');
    ctx.beginPath();
    ctx.arc(p.x, p.y, 14, 0, Math.PI * 2);
    ctx.fill();
    // 主体
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    // 标签
    ctx.fillStyle = '#000';
    ctx.font = 'bold 11px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, p.x, p.y + 1);
    // 脉冲
    const pulse = 1 + 0.1 * Math.sin(gameTime * 0.1);
    ctx.strokeStyle = `rgba(255,255,255,${0.3 + 0.2 * Math.sin(gameTime * 0.1)})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 12 * pulse, 0, Math.PI * 2);
    ctx.stroke();
  });

  // 玩家子弹
  playerBullets.forEach(b => {
    if (!b.active) return;
    if (b.type === 'laser') {
      ctx.strokeStyle = b.color;
      ctx.lineWidth = b.width;
      ctx.beginPath();
      ctx.moveTo(b.x, b.y - b.height / 2);
      ctx.lineTo(b.x, b.y + b.height / 2);
      ctx.stroke();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(b.x, b.y - b.height / 2);
      ctx.lineTo(b.x, b.y + b.height / 2);
      ctx.stroke();
    } else if (b.type === 'missile') {
      ctx.fillStyle = b.color;
      ctx.beginPath();
      ctx.moveTo(b.x, b.y - b.height / 2);
      ctx.lineTo(b.x - b.width / 2, b.y + b.height / 2);
      ctx.lineTo(b.x + b.width / 2, b.y + b.height / 2);
      ctx.closePath();
      ctx.fill();
      // 尾焰
      ctx.fillStyle = '#ff0';
      ctx.beginPath();
      ctx.arc(b.x, b.y + b.height / 2, 3, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = b.color;
      ctx.fillRect(b.x - b.width / 2, b.y - b.height / 2, b.width, b.height);
      ctx.fillStyle = '#fff';
      ctx.fillRect(b.x - 1, b.y - b.height / 2, 2, b.height);
    }
  });

  // 敌弹
  enemyBullets.forEach(b => {
    if (!b.active) return;
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius * 0.4, 0, Math.PI * 2);
    ctx.fill();
  });

  // 敌人
  enemies.forEach(e => { if (e.active) e.draw(ctx); });

  // 玩家
  if (gameState === STATE.PLAYING || (gameState === STATE.GAMEOVER && gameTime > 0)) {
    player.draw(ctx);
  }

  ctx.restore();

  // 波次提示
  if (waveTimer > 0 && waveTimer > 30) {
    ctx.fillStyle = `rgba(255,255,255,${(60 - waveTimer) / 30})`;
    ctx.font = 'bold 24px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.fillText(isBossWave ? '⚠ BOSS 来袭！' : `第 ${wave} 波`, GAME_W / 2, GAME_H / 2 - 40);
    if (isBossWave) {
      ctx.fillStyle = '#f44';
      ctx.font = 'bold 16px "Microsoft YaHei"';
      ctx.fillText('WARNING', GAME_W / 2, GAME_H / 2);
    }
  }
  if (waveTimer > 0 && waveTimer <= 30) {
    ctx.fillStyle = `rgba(255,255,255,${waveTimer / 30})`;
    ctx.font = 'bold 24px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.fillText(isBossWave ? '⚠ BOSS 来袭！' : `第 ${wave} 波`, GAME_W / 2, GAME_H / 2 - 40);
  }
}

function gameLoop() {
  update();
  draw();
  // 更新UI面板的生命显示
  updateLivesUI();
  requestAnimationFrame(gameLoop);
}

function updateLivesUI() {
  // 用简单方式更新（通过DOM不如直接画，但为了简单这里用DOM）
  // 生命在UI层显示为爱心
  const livesEl = document.querySelector('.ui-lives');
  if (!livesEl) {
    const uiTop = document.querySelector('.ui-top');
    const div = document.createElement('div');
    div.className = 'ui-lives';
    div.innerHTML = Array.from({length:Math.max(0,lives)}, () => '<span>❤️</span>').join('');
    uiTop.appendChild(div);
  } else {
    livesEl.innerHTML = Array.from({length:Math.max(0,lives)}, () => '<span>❤️</span>').join('');
  }
}

// 触屏虚拟摇杆
joystickArea.addEventListener('touchstart', handleJoystickStart, {passive: false});
joystickArea.addEventListener('touchmove', handleJoystickMove, {passive: false});
joystickArea.addEventListener('touchend', handleJoystickEnd, {passive: false});
joystickArea.addEventListener('touchcancel', handleJoystickEnd, {passive: false});

function handleJoystickStart(e) {
  e.preventDefault();
  const touch = e.touches[0];
  joystickId = touch.identifier;
  joystickActive = true;
  updateJoystick(touch);
  joystickKnob.classList.add('active');
}
function handleJoystickMove(e) {
  e.preventDefault();
  for (let i = 0; i < e.touches.length; i++) {
    if (e.touches[i].identifier === joystickId) {
      updateJoystick(e.touches[i]);
      return;
    }
  }
}
function handleJoystickEnd(e) {
  e.preventDefault();
  joystickActive = false;
  joystickDX = 0;
  joystickDY = 0;
  joystickId = null;
  joystickKnob.style.transform = 'translate(-50%,-50%)';
  joystickKnob.classList.remove('active');
}
function updateJoystick(touch) {
  const rect = joystickArea.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const maxR = rect.width / 2 - 25;
  let dx = touch.clientX - cx;
  let dy = touch.clientY - cy;
  const dist = Math.hypot(dx, dy);
  if (dist > maxR) {
    dx = dx / dist * maxR;
    dy = dy / dist * maxR;
  }
  joystickDX = dx / maxR;
  joystickDY = dy / maxR;
  joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
}

        // 音效支持
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq = 440, duration = 0.1) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }
        
        // 存档系统
        const Storage = {
            save: function(key, value) {
                try { localStorage.setItem(key, JSON.stringify(value)); } catch(e) {}
            },
            load: function(key, defaultValue) {
                try { return JSON.parse(localStorage.getItem(key) || JSON.stringify(defaultValue)); }
                catch(e) { return defaultValue; }
            }
        };
        
        // 最高分系统
        let highScore = Storage.load("high_score", 0);
        function updateHighScore(newScore) {
            if(newScore > highScore) {
                highScore = newScore;
                Storage.save("high_score", highScore);
            }
        }
