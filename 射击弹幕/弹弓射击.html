<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>弹弓射击</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); min-height: 100vh; overflow: hidden; }
        .game-container { width: 100%; height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 10px; }
        .stat { display: flex; flex-direction: column; align-items: center; color: #fff; }
        .stat-label { font-size: 12px; opacity: 0.8; }
        .stat-value { font-size: 24px; font-weight: bold; color: #ffd700; }
        
        .canvas-container { flex: 1; position: relative; background: rgba(0,0,0,0.3); border-radius: 15px; overflow: hidden; }
        #gameCanvas { width: 100%; height: 100%; display: block; }
        
        .controls { display: flex; gap: 10px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
        .btn { padding: 12px 25px; border: none; border-radius: 25px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; }
        .btn-secondary { background: linear-gradient(135deg, #4facfe, #00f2fe); color: #fff; }
        
        .power-bar { position: absolute; bottom: 20px; left: 20px; width: 150px; height: 20px; background: rgba(0,0,0,0.5); border-radius: 10px; overflow: hidden; }
        .power-fill { height: 100%; background: linear-gradient(90deg, #4facfe, #f5576c); width: 0%; transition: width 0.1s; }
        
        .info-panel { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: #fff; padding: 10px; border-radius: 10px; font-size: 12px; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">得分</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">剩余弹珠</div>
                <div class="stat-value" id="balls">10</div>
            </div>
            <div class="stat">
                <div class="stat-label">最高分</div>
                <div class="stat-value" id="highScore">0</div>
            </div>
        </div>
        
        <div class="canvas-container">
            <canvas id="gameCanvas"></canvas>
            <div class="power-bar">
                <div class="power-fill" id="powerFill"></div>
            </div>
            <div class="info-panel">
                <div>拖动弹弓瞄准</div>
                <div>松开发射</div>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" id="btnRestart">🔄 重新开始</button>
            <button class="btn btn-secondary" id="btnNextLevel">➡️ 下一关</button>
        </div>
        
        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let score = 0;
        let balls = 10;
        let highScore = parseInt(localStorage.getItem('highscore_弹弓射击') || '0');
        let level = 1;
        
        let slingshot = { x: 100, y: 0, pulling: false, pullX: 0, pullY: 0 };
        let projectile = null;
        let targets = [];
        let particles = [];
        
        const TARGET_COLORS = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#ffeaa7', '#fd79a8'];
        
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            slingshot.y = canvas.height - 100;
            initLevel();
        }
        
        function initLevel() {
            targets = [];
            const targetCount = 5 + level * 2;
            
            for (let i = 0; i < targetCount; i++) {
                targets.push({
                    x: 200 + Math.random() * (canvas.width - 300),
                    y: 50 + Math.random() * (canvas.height - 200),
                    radius: 20 + Math.random() * 20,
                    color: TARGET_COLORS[Math.floor(Math.random() * TARGET_COLORS.length)],
                    points: Math.floor(50 / (20 + Math.random() * 20) * 10),
                    hit: false
                });
            }
        }
        
        class Projectile {
            constructor(x, y, vx, vy) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.radius = 10;
                this.trail = [];
            }
            
            update() {
                this.vy += 0.3; // 重力
                this.x += this.vx;
                this.y += this.vy;
                
                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > 20) this.trail.shift();
                
                // 检查碰撞
                targets.forEach(target => {
                    if (!target.hit) {
                        const dx = this.x - target.x;
                        const dy = this.y - target.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        
                        if (dist < this.radius + target.radius) {
                            target.hit = true;
                            score += target.points;
                            createExplosion(target.x, target.y, target.color);
                            updateStats();
                        }
                    }
                });
                
                // 边界检查
                if (this.x < 0 || this.x > canvas.width || this.y > canvas.height) {
                    return false;
                }
                
                return true;
            }
            
            draw() {
                // 绘制轨迹
                ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                this.trail.forEach((p, i) => {
                    if (i === 0) ctx.moveTo(p.x, p.y);
                    else ctx.lineTo(p.x, p.y);
                });
                ctx.stroke();
                
                // 绘制弹珠
                ctx.fillStyle = '#fff';
                ctx.shadowColor = '#fff';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }
        
        function createExplosion(x, y, color) {
            for (let i = 0; i < 15; i++) {
                const angle = (Math.PI * 2 / 15) * i;
                const speed = 3 + Math.random() * 3;
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: 3 + Math.random() * 3,
                    color,
                    life: 1
                });
            }
        }
        
        function updateParticles() {
            particles = particles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.1;
                p.life -= 0.02;
                return p.life > 0;
            });
        }
        
        function drawParticles() {
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }
        
        function drawSlingshot() {
            // 弹弓支架
            ctx.strokeStyle = '#8b4513';
            ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.moveTo(slingshot.x - 30, slingshot.y + 50);
            ctx.lineTo(slingshot.x, slingshot.y);
            ctx.lineTo(slingshot.x + 30, slingshot.y + 50);
            ctx.stroke();
            
            // 橡皮筋
            ctx.strokeStyle = '#8b0000';
            ctx.lineWidth = 4;
            
            if (slingshot.pulling) {
                ctx.beginPath();
                ctx.moveTo(slingshot.x - 25, slingshot.y + 5);
                ctx.lineTo(slingshot.pullX, slingshot.pullY);
                ctx.lineTo(slingshot.x + 25, slingshot.y + 5);
                ctx.stroke();
                
                // 待发射弹珠
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(slingshot.pullX, slingshot.pullY, 10, 0, Math.PI * 2);
                ctx.fill();
                
                // 更新力量条
                const dx = slingshot.x - slingshot.pullX;
                const dy = slingshot.y - slingshot.pullY;
                const power = Math.min(Math.sqrt(dx * dx + dy * dy) / 150 * 100, 100);
                document.getElementById('powerFill').style.width = power + '%';
            } else {
                ctx.beginPath();
                ctx.moveTo(slingshot.x - 25, slingshot.y + 5);
                ctx.lineTo(slingshot.x, slingshot.y - 10);
                ctx.lineTo(slingshot.x + 25, slingshot.y + 5);
                ctx.stroke();
            }
        }
        
        function drawTargets() {
            targets.forEach(target => {
                if (!target.hit) {
                    ctx.fillStyle = target.color;
                    ctx.shadowColor = target.color;
                    ctx.shadowBlur = 15;
                    ctx.beginPath();
                    ctx.arc(target.x, target.y, target.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    
                    // 分数显示
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 12px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(target.points, target.x, target.y + 4);
                }
            });
        }
        
        function updateStats() {
            document.getElementById('score').textContent = score;
            document.getElementById('balls').textContent = balls;
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('highscore_弹弓射击', highScore);
            }
            document.getElementById('highScore').textContent = highScore;
        }
        
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 绘制背景
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            for (let i = 0; i < 50; i++) {
                ctx.beginPath();
                ctx.arc(Math.random() * canvas.width, Math.random() * canvas.height, 1, 0, Math.PI * 2);
                ctx.fill();
            }
            
            drawTargets();
            drawSlingshot();
            
            if (projectile) {
                if (!projectile.update()) {
                    projectile = null;
                    document.getElementById('powerFill').style.width = '0%';
                } else {
                    projectile.draw();
                }
            }
            
            updateParticles();
            drawParticles();
            
            // 检查关卡完成
            if (targets.every(t => t.hit) && !projectile) {
                level++;
                balls += 5;
                initLevel();
                updateStats();
            }
            
            requestAnimationFrame(gameLoop);
        }
        
        // 鼠标/触摸事件
        function handleStart(x, y) {
            if (balls > 0 && !projectile) {
                const dx = x - slingshot.x;
                const dy = y - slingshot.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < 80) {
                    slingshot.pulling = true;
                    slingshot.pullX = x;
                    slingshot.pullY = y;
                }
            }
        }
        
        function handleMove(x, y) {
            if (slingshot.pulling) {
                const dx = slingshot.x - x;
                const dy = slingshot.y - y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const maxDist = 150;
                
                if (dist > maxDist) {
                    const angle = Math.atan2(dy, dx);
                    slingshot.pullX = slingshot.x - Math.cos(angle) * maxDist;
                    slingshot.pullY = slingshot.y - Math.sin(angle) * maxDist;
                } else {
                    slingshot.pullX = x;
                    slingshot.pullY = y;
                }
            }
        }
        
        function handleEnd() {
            if (slingshot.pulling) {
                const dx = slingshot.x - slingshot.pullX;
                const dy = slingshot.y - slingshot.pullY;
                const power = Math.sqrt(dx * dx + dy * dy) / 10;
                
                if (power > 2) {
                    const angle = Math.atan2(dy, dx);
                    projectile = new Projectile(
                        slingshot.x,
                        slingshot.y,
                        Math.cos(angle) * power,
                        Math.sin(angle) * power
                    );
                    balls--;
                    updateStats();
                }
                
                slingshot.pulling = false;
                slingshot.pullX = 0;
                slingshot.pullY = 0;
                document.getElementById('powerFill').style.width = '0%';
            }
        }
        
        canvas.addEventListener('mousedown', e => {
            const rect = canvas.getBoundingClientRect();
            handleStart(e.clientX - rect.left, e.clientY - rect.top);
        });
        
        canvas.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            handleMove(e.clientX - rect.left, e.clientY - rect.top);
        });
        
        canvas.addEventListener('mouseup', handleEnd);
        
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            handleStart(touch.clientX - rect.left, touch.clientY - rect.top);
        }, { passive: false });
        
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            handleMove(touch.clientX - rect.left, touch.clientY - rect.top);
        }, { passive: false });
        
        canvas.addEventListener('touchend', e => {
            e.preventDefault();
            handleEnd();
        }, { passive: false });
        
        document.getElementById('btnRestart').addEventListener('click', () => {
            score = 0;
            balls = 10;
            level = 1;
            projectile = null;
            particles = [];
            initLevel();
            updateStats();
        });
        
        document.getElementById('btnNextLevel').addEventListener('click', () => {
            if (targets.every(t => t.hit)) {
                level++;
                balls += 5;
                initLevel();
                updateStats();
            }
        });
        
        // 初始化
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        document.getElementById('highScore').textContent = highScore;
        gameLoop();
    </script>
</body>
</html>
