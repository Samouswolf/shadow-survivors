<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>太空射击</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(180deg, #000428 0%, #004e92 100%); min-height: 100vh; overflow: hidden; }
#game-container { position: relative; width: 100%; height: 100vh; }
#game-canvas { display: block; width: 100%; height: 100%; }
#game-ui { position: absolute; top: 20px; left: 20px; color: #fff; font-size: 20px; font-weight: bold; z-index: 10; }
#game-ui span { color: #06b6d4; }
#game-over { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 20; flex-direction: column; align-items: center; justify-content: center; }
#game-over h2 { font-size: 48px; color: #f5576c; margin-bottom: 20px; }
#game-over p { font-size: 24px; color: #fff; margin-bottom: 30px; }
#game-over .btn { padding: 15px 40px; font-size: 20px; background: #06b6d4; color: #fff; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
#start-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#start-screen h1 { font-size: 48px; color: #06b6d4; margin-bottom: 20px; text-shadow: 0 0 20px rgba(6,182,212,0.5); }
#start-screen p { color: #aaa; margin-bottom: 40px; font-size: 16px; }
#start-screen .btn { padding: 18px 50px; font-size: 22px; background: linear-gradient(145deg, #06b6d4, #0891b2); color: #fff; border: none; border-radius: 15px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 20px rgba(6,182,212,0.4); }
.ad-banner-container { position: absolute; bottom: 0; left: 0; width: 100%; padding: 10px; z-index: 10; }
.sponsor-btn { position: fixed; top: 20px; right: 20px; width: 50px; height: 50px; background: rgba(255,165,0,0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; z-index: 100; box-shadow: 0 4px 15px rgba(255,165,0,0.4); }
.sponsor-panel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 200; align-items: center; justify-content: center; }
.sponsor-panel.show { display: flex; }
.sponsor-content { background: #fff; padding: 30px; border-radius: 20px; text-align: center; max-width: 90%; }
.sponsor-content h3 { margin-bottom: 20px; color: #333; }
.sponsor-close { position: absolute; top: 20px; right: 20px; width: 40px; height: 40px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; }

#loading-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a2e; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#loading-screen .loading-icon { width: 60px; height: 60px; border: 4px solid #6366f1; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#loading-screen p { color: #6366f1; margin-top: 20px; font-size: 18px; }
.interstitial-ad { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 999; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
.interstitial-ad .ad-content { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; text-align: center; min-width: 280px; max-width: 400px; }
.interstitial-ad .ad-content p { color: #aaa; font-size: 14px; margin-bottom: 12px; }
.interstitial-ad .skip-btn { padding: 8px 28px; background: rgba(255,215,0,0.15); border: 1px solid rgba(255,215,0,0.3); border-radius: 20px; color: #ffd700; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.2s; }
.interstitial-ad .skip-btn:hover { background: rgba(255,215,0,0.25); }

</style>
</head>
<body>
<div id="start-screen">
  <h1>🚀 太空射击</h1>
  <p>拖动飞船移动<br>自动发射子弹，消灭敌人！</p>
  <button class="btn" onclick="startGame()">开始游戏</button>
</div>

<div id="game-container">
  <canvas id="game-canvas"></canvas>
  <div id="game-ui">
    分数: <span id="score">0</span> | 生命: <span id="lives">3</span> | 最高: <span id="high-score">0</span>
  </div>
  
  <div id="game-over">
    <h2>💥 游戏结束</h2>
    <p>最终得分: <span id="final-score">0</span></p>
    <button class="btn" onclick="restartGame()">再来一次</button>
  </div>
  
  <div class="ad-banner-container">
    <div style="background:#f0f0f0;height:90px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#666;font-size:14px;">广告位</div>
  </div>
</div>

<div class="sponsor-btn" onclick="showSponsor()">☕</div>
<div class="sponsor-panel" id="sponsor-panel" onclick="hideSponsor()">
  <div class="sponsor-content" onclick="event.stopPropagation()">
    <h3>支持开发者</h3>
    <p>感谢您的支持！</p>
    <div style="color:#666;font-size:14px;margin-top:10px;">微信赞赏码</div>
  </div>
  <div class="sponsor-close" onclick="hideSponsor()">×</div>
</div>


<div id="loading-screen">
  <div class="loading-icon"></div>
  <p>加载中...</p>
</div>

<div class="interstitial-ad" id="interstitialAd">
  <div class="ad-content">
    <p>赞助商广告</p>
    <div id="interstitialAdSlot" style="min-height:250px;display:flex;align-items:center;justify-content:center;color:#888;font-size:13px;">广告加载中...</div>
  </div>
  <button class="skip-btn" id="skipInterstitial" onclick="closeInterstitial()">跳过广告</button>
</div>

<script>

// ==================== 游戏说明 ====================
// 操作说明: 使用键盘方向键或触屏控制
// 游戏目标: 获得最高分数
// 存档系统: 自动保存最高分到本地
// ==================== 模块说明 ====================
// 1. 游戏初始化模块 - 初始化Canvas和游戏状态
// 2. 游戏逻辑模块 - 处理玩家移动、碰撞检测
// 3. 渲染模块 - 绘制游戏画面和UI
// 4. 音效模块 - 播放游戏音效
// 5. 存档模块 - 管理最高分记录
// ==================== 配置参数 ====================
const GAME_NAME = '太空射击';

class GameCore {
  static init(options) {
    if (options.highScore) {
      this.highScoreKey = options.highScore;
    }
  }
  
  static getHighScore() {
    return parseInt(localStorage.getItem(this.highScoreKey)) || 0;
  }
  
  static setHighScore(value) {
    const current = this.getHighScore();
    if (value > current) {
      localStorage.setItem(this.highScoreKey, value);
      return true;
    }
    return false;
  }
}

GameCore.init({ highScore: GAME_NAME });

const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const highScoreEl = document.getElementById('high-score');
const finalScoreEl = document.getElementById('final-score');

let gameRunning = false;
let score = 0;
let lives = 3;
let enemies = [];
let bullets = [];
let particles = [];
let stars = [];
let lastShot = 0;

const player = {
  x: 0,
  y: 0,
  width: 50,
  height: 50,
  color: '#06b6d4'
};

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  player.x = canvas.width / 2;
  player.y = canvas.height - 100;
}

resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function initStars() {
  stars = [];
  for (let i = 0; i < 100; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      size: Math.random() * 2 + 0.5,
      speed: Math.random() * 2 + 0.5
    });
  }
}

function startGame() {
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('game-over').style.display = 'none';
  gameRunning = true;
  score = 0;
  lives = 3;
  enemies = [];
  bullets = [];
  particles = [];
  lastShot = 0;
  
  player.x = canvas.width / 2;
  player.y = canvas.height - 100;
  
  initStars();
  
  scoreEl.textContent = '0';
  livesEl.textContent = '3';
  highScoreEl.textContent = GameCore.getHighScore();
  
  gameLoop();
}

function restartGame() {
  startGame();
}

function showSponsor() {
  document.getElementById('sponsor-panel').classList.add('show');
}

function hideSponsor() {
  document.getElementById('sponsor-panel').classList.remove('show');
}

function createParticles(x, y, color) {
  for (let i = 0; i < 12; i++) {
    particles.push({
      x: x,
      y: y,
      vx: (Math.random() - 0.5) * 12,
      vy: (Math.random() - 0.5) * 12,
      size: Math.random() * 6 + 2,
      color: color,
      life: 1
    });
  }
}

function shoot() {
  const now = Date.now();
  if (now - lastShot < 200) return;
  
  bullets.push({
    x: player.x,
    y: player.y - player.height / 2,
    width: 4,
    height: 15,
    velocityY: -10,
    color: '#06b6d4'
  });
  
  lastShot = now;
}

function spawnEnemy() {
  const types = ['normal', 'fast', 'tank'];
  const type = types[Math.floor(Math.random() * types.length)];
  
  const enemy = {
    x: Math.random() * (canvas.width - 40) + 20,
    y: -50,
    type: type,
    width: type === 'tank' ? 50 : 40,
    height: type === 'tank' ? 50 : 40,
    speed: type === 'fast' ? 4 : type === 'tank' ? 1 : 2,
    health: type === 'tank' ? 3 : 1,
    maxHealth: type === 'tank' ? 3 : 1,
    color: type === 'fast' ? '#f97316' : type === 'tank' ? '#ef4444' : '#8b5cf6'
  };
  
  enemies.push(enemy);
}

function update() {
  if (!gameRunning) return;
  
  shoot();
  
  stars.forEach(star => {
    star.y += star.speed;
    if (star.y > canvas.height) {
      star.y = 0;
      star.x = Math.random() * canvas.width;
    }
  });
  
  bullets.forEach(bullet => {
    bullet.y += bullet.velocityY;
  });
  
  bullets = bullets.filter(b => b.y > -20);
  
  enemies.forEach(enemy => {
    enemy.y += enemy.speed;
  });
  
  enemies = enemies.filter(e => e.y < canvas.height + 60);
  
  if (Math.random() < 0.02) {
    spawnEnemy();
  }
  
  bullets.forEach(bullet => {
    enemies.forEach(enemy => {
      if (bullet.x > enemy.x - enemy.width / 2 &&
          bullet.x < enemy.x + enemy.width / 2 &&
          bullet.y > enemy.y - enemy.height / 2 &&
          bullet.y < enemy.y + enemy.height / 2) {
        bullet.y = -20;
        enemy.health--;
        
        if (enemy.health <= 0) {
          enemy.y = canvas.height + 100;
          const points = enemy.type === 'fast' ? 30 : enemy.type === 'tank' ? 50 : 10;
          score += points;
          scoreEl.textContent = score;
          createParticles(enemy.x, enemy.y, enemy.color);
        }
      }
    });
  });
  
  enemies.forEach(enemy => {
    const dx = player.x - enemy.x;
    const dy = player.y - enemy.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    
    if (dist < 35) {
      createParticles(player.x, player.y, '#06b6d4');
      lives--;
      livesEl.textContent = lives;
      enemy.y = canvas.height + 100;
      
      if (lives <= 0) {
        gameOver();
      }
    }
  });
  
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.02;
  });
  
  particles = particles.filter(p => p.life > 0);
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  ctx.fillStyle = '#000428';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  stars.forEach(star => {
    ctx.fillStyle = 'rgba(255,255,255,' + (star.size / 3) + ')';
    ctx.beginPath();
    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
    ctx.fill();
  });
  
  bullets.forEach(bullet => {
    ctx.fillStyle = bullet.color;
    ctx.fillRect(bullet.x - bullet.width / 2, bullet.y, bullet.width, bullet.height);
    
    ctx.fillStyle = '#22d3ee';
    ctx.fillRect(bullet.x - bullet.width / 2, bullet.y + bullet.height - 5, bullet.width, 5);
  });
  
  enemies.forEach(enemy => {
    ctx.save();
    ctx.translate(enemy.x, enemy.y);
    
    ctx.fillStyle = enemy.color;
    ctx.beginPath();
    ctx.moveTo(0, -enemy.height / 2);
    ctx.lineTo(-enemy.width / 2, enemy.height / 2);
    ctx.lineTo(enemy.width / 2, enemy.height / 2);
    ctx.closePath();
    ctx.fill();
    
    if (enemy.type === 'tank') {
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 12px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(enemy.health.toString(), 0, 0);
    }
    
    ctx.restore();
  });
  
  ctx.save();
  ctx.translate(player.x, player.y);
  
  ctx.fillStyle = player.color;
  ctx.beginPath();
  ctx.moveTo(0, -player.height / 2);
  ctx.lineTo(-player.width / 2, player.height / 2);
  ctx.lineTo(-player.width / 4, player.height / 3);
  ctx.lineTo(player.width / 4, player.height / 3);
  ctx.lineTo(player.width / 2, player.height / 2);
  ctx.closePath();
  ctx.fill();
  
  ctx.fillStyle = '#22d3ee';
  ctx.beginPath();
  ctx.arc(-player.width / 4, -player.height / 4, 5, 0, Math.PI * 2);
  ctx.arc(player.width / 4, -player.height / 4, 5, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.restore();
  
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });
  
  ctx.globalAlpha = 1;
}

function gameLoop() {
  if (!gameRunning) return;
  
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

function gameOver() {
  gameRunning = false;
  finalScoreEl.textContent = score;
  
  if (GameCore.setHighScore(score)) {
    highScoreEl.textContent = score;
  }
  
  document.getElementById('game-over').style.display = 'flex';
}

canvas.addEventListener('mousemove', (e) => {
  if (gameRunning) {
    player.x = e.clientX;
  }
});

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (gameRunning) {
    player.x = e.touches[0].clientX;
  }
});

document.addEventListener('keydown', (e) => {
  if (!gameRunning) return;
  
  if (e.code === 'ArrowLeft') {
    player.x -= 20;
  } else if (e.code === 'ArrowRight') {
    player.x += 20;
  }
  
  player.x = Math.max(player.width / 2, Math.min(canvas.width - player.width / 2, player.x));
});

// ==================== 错误处理 ====================
function closeInterstitial() {
  try {
    var el = document.getElementById('interstitialAd');
    if (el) el.style.display = 'none';
  } catch (error) {
    console.error('关闭广告失败:', error);
  }
}

// ==================== 音效支持 ====================
var audioCtx = null;
function initAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch (error) {
    console.warn('音频初始化失败:', error);
  }
}
function playSound(freq, dur, type, vol) {
  try {
    if (!audioCtx) return;
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = type || 'square';
    o.frequency.value = freq;
    g.gain.value = vol || 0.15;
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime + dur);
  } catch (error) {
    console.warn('音效播放失败:', error);
  }
}

// ==================== 页面加载处理 ====================
window.addEventListener('load', function() {
  try {
    var loadingScreen = document.getElementById('loading-screen');
    if (loadingScreen) {
      setTimeout(function() {
        loadingScreen.style.display = 'none';
      }, 1500);
    }
  } catch (error) {
    console.error('加载界面处理失败:', error);
  }
});

</script>
</body>
</html>
