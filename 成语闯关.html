function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;
  scale = Math.min(W / 420, H / 750);
  if (scale < 0.55) scale = 0.55;
  if (scale > 1.5) scale = 1.5;
}
window.addEventListener('resize', resize);
resize();

// ========== 粒子系统 ==========
function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 0.5) * 6 - 3,
      life: 1,
      decay: 0.015 + Math.random() * 0.03,
      size: 2 + Math.random() * 4,
      color
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.1;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function drawRoundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawButton(x, y, w, h, text, color, textColor, hover) {
  ctx.save();
  const r = 12 * scale;
  if (hover) {
    ctx.shadowColor = color;
    ctx.shadowBlur = 15 * scale;
  }
  ctx.fillStyle = color;
  drawRoundRect(x, y, w, h, r);
  ctx.fill();
  ctx.restore();
  ctx.fillStyle = textColor || '#fff';
  ctx.font = `bold ${15 * scale}px "Microsoft YaHei"`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x + w / 2, y + h / 2);
}

function isInside(x, y, w, h) {
  return mouseX >= x && mouseX <= x + w && mouseY >= y && mouseY <= y + h;
}

// ========== 生成题目 ==========
function generateQuestion(type, difficulty) {
  // 按难度筛选题库
  const pool = IDIOM_DB.filter(i => i.difficulty <= difficulty);
  const easyPool = IDIOM_DB.filter(i => i.difficulty === 1);

  switch (type) {
    case 'guess': { // 看解释猜成语
      const item = pool[Math.floor(Math.random() * pool.length)];
      // 生成3个干扰项
      const others = pool.filter(i => i.idiom !== item.idiom);
      const shuffled = shuffle(others);
      const distractors = shuffled.slice(0, 3).map(i => i.idiom);
      const opts = shuffle([item.idiom, ...distractors]);
      return {
        type: 'guess',
        title: '📖 看解释猜成语',
        prompt: item.def,
        idiom: item.idiom,
        options: opts,
        correctIndex: opts.indexOf(item.idiom),
        difficulty: item.difficulty,
        points: 100 * item.difficulty
      };
    }
    case 'fill': { // 填空缺字
      const item = pool[Math.floor(Math.random() * pool.length)];
      // 生成错误选项
      const allChars = [...new Set(pool.map(i => i.answer))];
      const wrongChars = shuffle(allChars.filter(c => c !== item.answer)).slice(0, 3);
      const opts = shuffle([item.answer, ...wrongChars]);
      return {
        type: 'fill',
        title: '✏️ 填空缺字',
        prompt: item.hint.replace('__', '⬜'),
        idiom: item.idiom,
        answer: item.answer,
        options: opts,
        correctIndex: opts.indexOf(item.answer),
        difficulty: item.difficulty,
        points: 100 * item.difficulty
      };
    }
    case 'emoji': { // 看图猜成语
      const item = EMOJI_IDIOMS[Math.floor(Math.random() * EMOJI_IDIOMS.length)];
      return {
        type: 'emoji',
        title: '🎨 看图猜成语',
        prompt: item.emoji,
        idiom: item.idiom,
        options: item.options,
        correctIndex: item.options.indexOf(item.idiom),
        difficulty: 1,
        points: 150
      };
    }
    case 'chain': { // 成语接龙
      const item = CHAIN_DATA[Math.floor(Math.random() * CHAIN_DATA.length)];
      const opts = shuffle([item.next, ...item.distractors]);
      return {
        type: 'chain',
        title: '🔗 成语接龙',
        prompt: `${item.prev} → ？`,
        idiom: item.next,
        hint: `前一个成语尾字"${item.prev[item.prev.length-1]}"，接一个以它开头的成语`,
        options: opts,
        correctIndex: opts.indexOf(item.next),
        difficulty: 2,
        points: 200
      };
    }
  }
}

function generateLevelQuestions(level) {
  const difficulty = Math.min(3, Math.ceil(level / 3));
  const types = shuffle(['guess', 'fill', 'emoji', 'chain']);
  const qs = [];
  const count = 3 + Math.min(2, Math.floor(level / 3)); // 3-5题
  for (let i = 0; i < count; i++) {
    qs.push(generateQuestion(types[i % types.length], difficulty));
  }
  return qs;
}

// ========== 游戏流程 ==========
function startGame() {
  currentLevel = 1;
  score = 0;
  coins = 3;
  totalCorrect = 0;
  startLevel();
}

function startLevel() {
  gameState = 'playing';
  questionIndex = 0;
  levelQuestions = generateLevelQuestions(currentLevel);
  showQuestion();
}

function showQuestion() {
  if (questionIndex >= levelQuestions.length) {
    levelClear();
    return;
  }
  currentQuestion = levelQuestions[questionIndex];
  questionType = currentQuestion.type;
  options = currentQuestion.options;
  selectedOption = -1;
  feedbackState = null;
  feedbackTimer = 0;
  timer = maxTimer - Math.min(3, currentLevel); // 越往后时间越短
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timer--;
    if (timer <= 0) {
      clearInterval(timerInterval);
      handleTimeout();
    }
  }, 1000);
}

function handleTimeout() {
  feedbackState = 'wrong';
  feedbackTimer = 60;
  selectedOption = currentQuestion.correctIndex;
  // 扣分
  score = Math.max(0, score - 25);
}

function selectOption(index) {
  if (feedbackState || !currentQuestion) return;
  selectedOption = index;
  clearInterval(timerInterval);
  
  if (index === currentQuestion.correctIndex) {
    feedbackState = 'correct';
    feedbackTimer = 40;
    totalCorrect++;
    score += currentQuestion.points;
    // 奖励金币
    if (Math.random() < 0.2) coins++;
    // 粒子效果
    const cx = W / 2;
    const cy = H * 0.45;
    spawnParticles(cx, cy, '#ffd700', 20);
  } else {
    feedbackState = 'wrong';
    feedbackTimer = 60;
    score = Math.max(0, score - 25);
  }
}

function useHint() {
  if (coins <= 0 || feedbackState || !currentQuestion) return;
  coins--;
  // 去掉两个错误选项
  if (currentQuestion.type === 'guess' || currentQuestion.type === 'emoji' || currentQuestion.type === 'chain') {
    const wrongIndices = options.map((_, i) => i).filter(i => i !== currentQuestion.correctIndex);
    const toRemove = shuffle(wrongIndices).slice(0, 2);
    // 标记为已移除（在UI中变灰）
    options = options.map((opt, i) => toRemove.includes(i) ? null : opt);
    // 保留原数组用于正确索引
    currentQuestion._removed = toRemove;
  }
}

function nextQuestion() {
  feedbackState = null;
  questionIndex++;
  showQuestion();
}

function levelClear() {
  gameState = 'levelClear';
  coins += 2;
  score += 100 * currentLevel;
  spawnParticles(W / 2, H * 0.4, '#ffd700', 40);
  clearInterval(timerInterval);
}

function nextLevel() {
  currentLevel++;
  startLevel();
}

function gameOver() {
  gameState = 'gameOver';
  clearInterval(timerInterval);
  showInterstitialAd();
}

function goToMenu() {
  gameState = 'menu';
  clearInterval(timerInterval);
  currentQuestion = null;
  feedbackState = null;
  document.getElementById('startScreen').classList.remove('hidden');
}

function drawBackground() {
  // 深色渐变背景
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0d0d1a');
  grad.addColorStop(0.5, '#141428');
  grad.addColorStop(1, '#0a0a14');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // 装饰性中式底纹
  ctx.globalAlpha = 0.03;
  for (let i = 0; i < 5; i++) {
    const x = (i * W / 4) + Math.sin(animFrame * 0.01 + i) * 30;
    const y = 100 + i * 120;
    ctx.fillStyle = '#ffd700';
    ctx.font = `${80 * scale}px serif`;
    ctx.textAlign = 'center';
    ctx.fillText('龘', x, y);
  }
  ctx.globalAlpha = 1;
}

function drawTopBar() {

  const lineGrad = ctx.createLinearGradient(W * 0.1, 0, W * 0.9, 0);

  lineGrad.addColorStop(0.5, 'rgba(255,215,0,0.8)');
  lineGrad.addColorStop(0.7, 'rgba(255,215,0,0.5)');
  lineGrad.addColorStop(1, 'transparent');

  ctx.fillRect(0, barH - 2, W, 2);

  // 关卡信息
  ctx.fillStyle = '#ffd700';
  ctx.font = `bold ${14 * scale}px "Microsoft YaHei"`;
  ctx.textAlign = 'left';
  ctx.fillText(`第 ${currentLevel} 关`, 15 * scale, barH * 0.35);
  
  ctx.fillStyle = '#ccc';
  ctx.font = `${10 * scale}px "Microsoft YaHei"`;
  ctx.fillText(`第 ${questionIndex + 1}/${levelQuestions.length} 题`, 15 * scale, barH * 0.7);

  ctx.font = `bold ${13 * scale}px "Microsoft YaHei"`;
  ctx.textAlign = 'right';

  // 提示按钮
  const hintX = W - 70 * scale;
  const hintY = barH * 0.15;
  const hintW = 55 * scale;
  const hintH = 22 * scale;
  const hintHover = isInside(hintX, hintY, hintW, hintH);
  ctx.fillStyle = coins > 0 ? (hintHover ? 'rgba(255,215,0,0.3)' : 'rgba(255,215,0,0.15)') : 'rgba(100,100,100,0.15)';
  drawRoundRect(hintX, hintY, hintW, hintH, 8 * scale);
  ctx.fill();
  ctx.fillStyle = coins > 0 ? '#ffd700' : '#666';
  ctx.font = `${10 * scale}px "Microsoft YaHei"`;
  ctx.textAlign = 'center';
  ctx.fillText('💡 提示', hintX + hintW / 2, hintY + hintH / 2);
}

function drawTimerBar() {
  const barW = W * 0.85;
  const barH = 6 * scale;
  const barX = (W - barW) / 2;
  const barY = 65 * scale;
  const progress = timer / maxTimer;

  // 背景
  ctx.fillStyle = 'rgba(255,255,255,0.1)';
  drawRoundRect(barX, barY, barW, barH, barH / 2);
  ctx.fill();

  // 进度
  const color = progress > 0.5 ? '#4caf50' : progress > 0.25 ? '#ff9800' : '#f44336';
  const progressGrad = ctx.createLinearGradient(barX, 0, barX + barW * progress, 0);
  progressGrad.addColorStop(0, color);
  progressGrad.addColorStop(1, progress > 0.5 ? '#8bc34a' : '#ff5722');
  ctx.fillStyle = progressGrad;
  drawRoundRect(barX, barY, barW * progress, barH, barH / 2);
  ctx.fill();

  // 时间文字
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${11 * scale}px "Microsoft YaHei"`;
  ctx.textAlign = 'center';
  ctx.fillText(`${timer}s`, W / 2, barY - 5 * scale);
}

function drawQuestionCard() {
  const cardX = W * 0.05;
  const cardY = 80 * scale;
  const cardW = W * 0.9;
  const cardH = H * 0.28;

  // 卡片背景
  ctx.fillStyle = 'rgba(255,255,255,0.04)';
  ctx.strokeStyle = 'rgba(255,215,0,0.15)';
  ctx.lineWidth = 1;
  drawRoundRect(cardX, cardY, cardW, cardH, 16 * scale);
  ctx.fill();
  ctx.stroke();

  // 顶部装饰
  ctx.strokeStyle = 'rgba(255,215,0,0.3)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cardX + 20 * scale, cardY + 2);
  ctx.lineTo(cardX + cardW - 20 * scale, cardY + 2);
  ctx.stroke();

  // 题型标题
  ctx.fillStyle = '#ffd700';
  ctx.font = `bold ${14 * scale}px "Microsoft YaHei"`;
  ctx.textAlign = 'center';
  ctx.fillText(currentQuestion.title, cardX + cardW / 2, cardY + 25 * scale);

  // 题目内容
  ctx.fillStyle = '#eee';
  if (currentQuestion.type === 'emoji') {
    ctx.font = `${40 * scale}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`;
    ctx.fillText(currentQuestion.prompt, cardX + cardW / 2, cardY + cardH / 2 + 10 * scale);
  } else if (currentQuestion.type === 'chain') {
    ctx.font = `bold ${22 * scale}px "Microsoft YaHei"`;
    ctx.fillText(currentQuestion.prompt, cardX + cardW / 2, cardY + cardH / 2 - 5 * scale);
    ctx.fillStyle = '#999';
    ctx.font = `${11 * scale}px "Microsoft YaHei"`;
    ctx.fillText(currentQuestion.hint, cardX + cardW / 2, cardY + cardH / 2 + 28 * scale);
  } else {
    ctx.font = `bold ${15 * scale}px "Microsoft YaHei"`;
    // 换行
    const words = currentQuestion.prompt;
    const maxW = cardW - 40 * scale;
    let line = '';
    let yOff = cardY + cardH / 2 - 8 * scale;
    ctx.font = `bold ${15 * scale}px "Microsoft YaHei"`;
    for (let i = 0; i < words.length; i++) {
      const test = line + words[i];
      if (ctx.measureText(test).width > maxW && line) {
        ctx.fillText(line, cardX + cardW / 2, yOff);
        yOff += 24 * scale;
        line = words[i];
      } else {
        line = test;
      }
    }
    if (line) ctx.fillText(line, cardX + cardW / 2, yOff);
  }
}

function drawOptions() {
  const startY = H * 0.38;
  const optW = W * 0.85;
  const optH = 42 * scale;
  const optX = (W - optW) / 2;
  const gap = 8 * scale;

  for (let i = 0; i < options.length; i++) {
    if (options[i] === null) continue; // 被提示移除
    const y = startY + i * (optH + gap);
    const hover = isInside(optX, y, optW, optH);
    
    let bgColor = 'rgba(255,255,255,0.06)';
    let borderColor = 'rgba(255,255,255,0.15)';
    let textColor = '#ddd';

    if (feedbackState) {
      if (i === currentQuestion.correctIndex) {
        bgColor = 'rgba(76,175,80,0.2)';
        borderColor = '#4caf50';
        textColor = '#4caf50';
      } else if (i === selectedOption && feedbackState === 'wrong') {
        bgColor = 'rgba(244,67,54,0.2)';
        borderColor = '#f44336';
        textColor = '#f44336';
      }
    } else if (hover) {
      bgColor = 'rgba(255,215,0,0.1)';
      borderColor = 'rgba(255,215,0,0.4)';
    }

    ctx.fillStyle = bgColor;
    ctx.strokeStyle = borderColor;
    ctx.lineWidth = 1;
    drawRoundRect(optX, y, optW, optH, 10 * scale);
    ctx.fill();
    ctx.stroke();

    // 选项编号
    const labels = ['A', 'B', 'C', 'D'];
    ctx.fillStyle = textColor;
    ctx.font = `bold ${12 * scale}px "Microsoft YaHei"`;
    ctx.textAlign = 'left';
    ctx.fillText(labels[i], optX + 15 * scale, y + optH / 2);

    // 选项文字
    ctx.fillStyle = textColor;
    ctx.font = `${14 * scale}px "Microsoft YaHei"`;
    ctx.textAlign = 'center';
    ctx.fillText(options[i], optX + optW / 2, y + optH / 2);
  }
}

function drawFeedback() {
  if (!feedbackState) return;
  
  const cx = W / 2;
  const cy = H * 0.7;
  
  ctx.fillStyle = feedbackState === 'correct' ? 'rgba(76,175,80,0.9)' : 'rgba(244,67,54,0.9)';
  ctx.font = `bold ${18 * scale}px "Microsoft YaHei"`;
  ctx.textAlign = 'center';
  const text = feedbackState === 'correct' ? '✅ 正确！' : '❌ 错误';
  ctx.fillText(text, cx, cy);

  // 显示正确答案

    if (currentQuestion.type === 'fill') {
      ctx.fillText(`正确答案：${currentQuestion.idiom}（${currentQuestion.answer}）`, cx, cy + 28 * scale);
    } else {
      ctx.fillText(`正确答案：${currentQuestion.idiom}`, cx, cy + 28 * scale);

  // 下一题按钮

  const btnH = 36 * scale;

  ctx.fillText(`✅ 答对：${totalCorrect} 题`, cx, statsY + 30 * scale);
  const rank = getRank();
  ctx.fillStyle = rank.color;
  ctx.fillText(`🏅 段位：${rank.name}`, cx, statsY + 60 * scale);

  const btnW = 160 * scale;
  const btnH = 44 * scale;
  const btnX = cx - btnW / 2;
  const btnY = statsY + 100 * scale;
  const btnHover = isInside(btnX, btnY, btnW, btnH);
  drawButton(btnX, btnY, btnW, btnH, '再来一次', '#ffd700', '#1a1a2e', btnHover);

  const menuBtnY = btnY + 55 * scale;
  const menuHover = isInside(btnX, menuBtnY, btnW, btnH);
  drawButton(btnX, menuBtnY, btnW, btnH, '返回菜单', 'rgba(255,255,255,0.1)', '#aaa', menuHover);
}

// ========== 主循环 ==========
function update() {
  animFrame++;
  menuPulse = Math.sin(animFrame * 0.05) * 0.5 + 0.5;
  updateParticles();

  if (feedbackState) {
    feedbackTimer--;
    if (feedbackTimer <= 0) {
      if (feedbackState === 'wrong' && questionIndex >= levelQuestions.length - 1) {
        gameOver();
      }
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  if (gameState === 'menu') {
    drawMenu();
  } else if (gameState === 'playing' && currentQuestion) {
    drawBackground();
    drawTopBar();
    drawTimerBar();
    drawQuestionCard();
    drawOptions();
    drawFeedback();
  } else if (gameState === 'levelClear') {
    drawLevelClear();
  } else if (gameState === 'gameOver') {
    drawGameOver();
  }

  drawParticles();
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

// ========== 事件处理 ==========
canvas.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  mouseX = e.touches[0].clientX;
  mouseY = e.touches[0].clientY;
}, {passive: false});

canvas.addEventListener('mousedown', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
  handleClick();
});

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  mouseX = e.touches[0].clientX;
  mouseY = e.touches[0].clientY;
  handleClick();
}, {passive: false});

function handleClick() {
  if (gameState === 'menu') {
    // 开始按钮
    const btnW = 180 * scale;
    const btnH = 48 * scale;
    const btnX = W / 2 - btnW / 2;
    const btnY = H * 0.18 + 100 * scale + 160 * scale;
    if (isInside(btnX, btnY, btnW, btnH)) {
      startGame();
    }
  } else if (gameState === 'playing' && currentQuestion) {
    // 提示按钮
    const barH = 55 * scale;
    const hintX = W - 70 * scale;
    const hintY = barH * 0.15;
    const hintW = 55 * scale;
    const hintH = 22 * scale;
    if (isInside(hintX, hintY, hintW, hintH) && coins > 0) {
      useHint();
      return;
    }

    // 选项
    if (feedbackState) {
      // 下一题/查看结果
      const cx = W / 2;
      const cy = H * 0.7;
      const btnW = 120 * scale;
      const btnH = 36 * scale;
      const btnX = cx - btnW / 2;
      const btnY = cy + 42 * scale;
      if (isInside(btnX, btnY, btnW, btnH)) {
        if (questionIndex >= levelQuestions.length - 1) {
          levelClear();
        } else {
          nextQuestion();
        }
      }
      return;
    }

    // 选项点击
    const startY = H * 0.38;
    const optW = W * 0.85;
    const optH = 42 * scale;
    const optX = (W - optW) / 2;
    const gap = 8 * scale;
    for (let i = 0; i < options.length; i++) {
      if (options[i] === null) continue;
      const y = startY + i * (optH + gap);
      if (isInside(optX, y, optW, optH)) {
        selectOption(i);
        return;
      }
    }
  } else if (gameState === 'levelClear') {
    const cx = W / 2;
    const btnW = 160 * scale;
    const btnH = 44 * scale;
    const btnX = cx - btnW / 2;
    const statsY = H * 0.35 + 85 * scale;
    const btnY = statsY + 100 * scale;
    const menuBtnY = btnY + 55 * scale;

    if (isInside(btnX, btnY, btnW, btnH)) {
      nextLevel();
    } else if (isInside(btnX, menuBtnY, btnW, btnH)) {
      goToMenu();
    }
  } else if (gameState === 'gameOver') {
    const cx = W / 2;
    const btnW = 160 * scale;
    const btnH = 44 * scale;
    const btnX = cx - btnW / 2;
    const statsY = H * 0.3 + 80 * scale;
    const btnY = statsY + 100 * scale;
    const menuBtnY = btnY + 55 * scale;

    if (isInside(btnX, btnY, btnW, btnH)) {
      startGame();
    } else if (isInside(btnX, menuBtnY, btnW, btnH)) {
      goToMenu();
    }
  }
}

if(sb&&sp){sb.onclick=function(){sp.style.display='flex'};if(sc)sc.onclick=function(){sp.style.display='none'}}

</script>
