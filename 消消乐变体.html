<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>消消乐变体</title>
<style>

<body>
<canvas id="C"></canvas>
<script>
(function(){
"use strict";

/* ===== CONSTANTS ===== */
const COLS=8,ROWS=8,GEM_TYPES=6,GEM_SIZE=56,PAD=6;
const BOARD_W=COLS*GEM_SIZE,BOARD_H=ROWS*GEM_SIZE;
const HUD_H=90,FOOTER_H=60;
const CANVAS_W=BOARD_W+PAD*2,CANVAS_H=BOARD_H+PAD*2+HUD_H+FOOTER_H;
const SWAP_DUR=250,FALL_DUR=180,FLASH_DUR=150;
const COMBO_BASE=10,COMBO_MULT=1.5;
const SPECIAL_MATCH4='col_bomb',SPECIAL_MATCH5='rainbow',SPECIAL_L='area_bomb';
const COLORS=['#ff4466','#44bbff','#44dd55','#ffaa22','#cc55ff','#ffdd44'];
const COLORS_LIGHT=['#ff7799','#77ddff','#77ff99','#ffcc66','#dd88ff','#ffee77'];
const COLORS_DARK=['#aa2244','#2277aa','#228844','#aa7711','#8833aa','#aa9922'];
const SPECIAL_ICONS={col_bomb:'|',rainbow:'*',area_bomb:'#'};

/* ===== CANVAS SETUP ===== */
const canvas=document.getElementById('C');
const ctx=canvas.getContext('2d');
function resize(){
    const s=Math.min(window.innerWidth/CANVAS_W,window.innerHeight/CANVAS_H,2);
    canvas.width=CANVAS_W;canvas.height=CANVAS_H;
    canvas.style.width=CANVAS_W*s+'px';canvas.style.height=CANVAS_H*s+'px';
}
window.addEventListener('resize',resize);resize();

/* ===== AUDIO ===== */
let audioCtx=null;
function ensureAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
function playTone(freq,dur,type){
    ensureAudio();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=type||'sine';o.frequency.value=freq;
    g.gain.setValueAtTime(0.12,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
    o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur);
}
function sfxSwap(){playTone(600,0.08,'sine')}
function sfxMatch(combo){
    const f=400+combo*80;
    playTone(f,0.12,'square');
    setTimeout(()=>playTone(f*1.25,0.1,'square'),50);
}
function sfxSpecial(){playTone(800,0.2,'triangle');setTimeout(()=>playTone(1000,0.15,'triangle'),80)}
function sfxInvalid(){playTone(200,0.15,'sawtooth')}
function sfxGameOver(){playTone(300,0.3,'sine');setTimeout(()=>playTone(200,0.4,'sine'),200)}
function sfxLevelUp(){playTone(500,0.1,'sine');setTimeout(()=>playTone(700,0.12,'sine'),100);setTimeout(()=>playTone(900,0.15,'sine'),200)}

/* ===== GEM OBJECT ===== */
function gem(type,col,row,special){
    this.type=type;this.col=col;this.row=row;
    this.special=special||null;
    this.px=col*GEM_SIZE+PAD;this.py=row*GEM_SIZE+PAD+HUD_H;
    this.tx=this.px;this.ty=this.py;
    this.scale=1;this.alpha=1;
    this.swapAnim=null;this.fallAnim=null;
    this.flashTimer=0;this.removeTimer=0;
    this.removed=false;
}

/* ===== PARTICLES ===== */
var particles=[];
function spawnParticles(x,y,color,count){
    for(var i=0;i<count;i++){
        particles.push({x:x,y:y,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6-2,
            life:1,decay:0.015+Math.random()*0.02,color:color,r:2+Math.random()*3});
    }
}
function updateParticles(dt){
    for(var i=particles.length-1;i>=0;i--){
        var p=particles[i];
        p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;
        p.life-=p.decay;
        if(p.life<=0)particles.splice(i,1);
    }
}
function drawParticles(){
    for(var i=0;i<particles.length;i++){
        var p=particles[i];
        ctx.globalAlpha=p.life;ctx.fillStyle=p.color;
        ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
}

/* ===== GAME STATE ===== */
var G={
    state:'menu', // menu,play,pause,over
    grid:[], // 2D array [col][row]
    score:0,combo:0,maxCombo:0,
    level:1,targetScore:500,movesLeft:30,
    selected:null, // {col,row}
    animating:false,animQueue:[],
    bestScore:parseInt(localStorage.getItem('match3_best')||'0'),
    shakeTimer:0,shakeX:0,shakeY:0,
    levelUpTimer:0,
    hoverCell:null, // for mouse/touch
    hintTimer:0,hintCells:null,
    time:0
};

/* ===== BOARD HELPERS ===== */
function inBounds(c,r){return c>=0&&c<COLS&&r>=0&&r<ROWS}
function gemAt(c,r){return inBounds(c,r)?G.grid[c][r]:null}

function randomType(){return Math.floor(Math.random()*GEM_TYPES)}

function createGem(c,r){
    // Avoid immediate matches during generation
    var t=randomType(),tries=0;
    while(tries<20){
        var left1=gemAt(c-1,r),left2=gemAt(c-2,r);
        var up1=gemAt(c,r-1),up2=gemAt(c,r-2);
        var matchL=left1&&left2&&left1.type===t&&left2.type===t;
        var matchU=up1&&up2&&up1.type===t&&up2.type===t;
        if(!matchL&&!matchU)break;
        t=randomType();tries++;
    }
    return new gem(t,c,r);
}

function initBoard(){
    G.grid=[];
    for(var c=0;c<COLS;c++){
        G.grid[c]=[];
        for(var r=0;r<ROWS;r++){
            G.grid[c][r]=createGem(c,r);
        }
    }
    // Ensure no initial matches
    while(findMatches().length>0){
        for(var c=0;c<COLS;c++)for(var r=0;r<ROWS;r++){
            G.grid[c][r]=createGem(c,r);
        }
    }
}

/* ===== MATCH DETECTION ===== */
function findMatches(){
    var matched=[];
    // Horizontal
    for(var r=0;r<ROWS;r++){
        var run=1;
        for(var c=1;c<COLS;c++){
            if(G.grid[c][r]&&G.grid[c-1][r]&&G.grid[c][r].type===G.grid[c-1][r].type){run++;continue}
            if(run>=3){
                for(var k=0;k<run;k++)matched.push({col:c-1-k,row:r});
            }
            run=1;
        }
        if(run>=3)for(var k=0;k<run;k++)matched.push({col:COLS-1-k,row:r});
    }
    // Vertical
    for(var c=0;c<COLS;c++){
        var run=1;
        for(var r=1;r<ROWS;r++){
            if(G.grid[c][r]&&G.grid[c][r-1]&&G.grid[c][r].type===G.grid[c][r-1].type){run++;continue}
            if(run>=3){
                for(var k=0;k<run;k++)matched.push({col:c,row:r-1-k});
            }
            run=1;
        }
        if(run>=3)for(var k=0;k<run;k++)matched.push({col:c,row:ROWS-1-k});
    }
    // Unique
    var seen={};
    var result=[];
    for(var i=0;i<matched.length;i++){
        var key=matched[i].col+','+matched[i].row;
        if(!seen[key]){seen[key]=true;result.push(matched[i])}
    }
    return result;
}

/* Detect special creation from match shapes */
function detectSpecials(matches){
    // Group matches by type, check for 4/L/5 patterns
    var specials=[];
    var byType={};
    for(var i=0;i<matches.length;i++){
        var m=matches[i],g=G.grid[m.col][m.row];
        if(!g)continue;
        if(!byType[g.type])byType[g.type]=[];
        byType[g.type].push(m);
    }
    for(var t in byType){
        var cells=byType[t];
        if(cells.length>=5){
            // Rainbow
            var center=cells[Math.floor(cells.length/2)];
            specials.push({col:center.col,row:center.row,type:t,special:SPECIAL_MATCH5});
        } else if(cells.length===4){
            // Check if line
            var allSameR=true,allSameC=true;
            for(var i=1;i<cells.length;i++){
                if(cells[i].row!==cells[0].row)allSameR=false;
                if(cells[i].col!==cells[0].col)allSameC=false;
            }
            var center=cells[1];
            specials.push({col:center.col,row:center.row,type:t,special:SPECIAL_MATCH4});
        }
    }
    return specials;
}

/* ===== SWAP LOGIC ===== */
function swapGems(c1,r1,c2,r2){
    var a=G.grid[c1][r1],b=G.grid[c2][r2];
    G.grid[c1][r1]=b;G.grid[c2][r2]=a;
    if(a){a.col=c2;a.row=r2}
    if(b){b.col=c1;b.row=r1}
}

function canSwap(c1,r1,c2,r2){
    if(!inBounds(c1,r1)||!inBounds(c2,r2))return false;
    var dc=Math.abs(c1-c2),dr=Math.abs(r1-r2);
    if(dc+dr!==1)return false;
    // Try swap, check matches, swap back
    swapGems(c1,r1,c2,r2);
    var has=findMatches().length>0;
    swapGems(c1,r1,c2,r2);
    return has;
}

/* ===== ANIMATIONS ===== */
function animateSwap(c1,r1,c2,r2,cb){
    var a=G.grid[c1][r1],b=G.grid[c2][r2];
    G.animating=true;
    var t2x=c2*GEM_SIZE+PAD,t2y=r2*GEM_SIZE+PAD+HUD_H;
    var t1x=c1*GEM_SIZE+PAD,t1y=r1*GEM_SIZE+PAD+HUD_H;
    if(a){a.tx=t2x;a.ty=t2y}
    if(b){b.tx=t1x;b.ty=t1y}
    setTimeout(function(){
        if(a){a.px=a.tx;a.py=a.ty}
        if(b){b.px=b.tx;b.py=b.ty}
        if(cb)cb();
    },SWAP_DUR);
}

function animateFalls(cb){
    var moved=false;
    // Gravity: drop existing gems
    for(var c=0;c<COLS;c++){
        var empty=0;
        for(var r=ROWS-1;r>=0;r--){
            if(!G.grid[c][r]){empty++;continue}
            if(empty>0){
                var g=G.grid[c][r];
                G.grid[c][r]=null;
                G.grid[c][r+empty]=g;
                g.row=r+empty;
                g.ty=g.row*GEM_SIZE+PAD+HUD_H;
                moved=true;
            }
        }
        // Fill top with new gems
        for(var r=0;r<empty;r++){
            var ng=createGem(c,r);
            ng.py=-GEM_SIZE*(empty-r)+PAD+HUD_H;
            ng.ty=r*GEM_SIZE+PAD+HUD_H;
            G.grid[c][r]=ng;
            moved=true;
        }
    }
    G.animating=true;
    setTimeout(function(){
        // Snap all
        for(var c=0;c<COLS;c++)for(var r=0;r<ROWS;r++){
            var g=G.grid[c][r];
            if(g){g.px=g.tx;g.py=g.ty}
        }
        G.animating=false;
        if(cb)cb();
    },FALL_DUR);
}

/* ===== SPECIAL TRIGGERS ===== */
function triggerSpecial(g){
    if(!g||!g.special)return[];
    var removed=[];
    if(g.special===SPECIAL_MATCH4){
        // Clear entire column
        for(var r=0;r<ROWS;r++){if(G.grid[g.col][r])removed.push({col:g.col,row:r})}
        sfxSpecial();
    } else if(g.special===SPECIAL_MATCH5){
        // Clear all of random type
        var t=randomType();
        for(var c=0;c<COLS;c++)for(var r=0;r<ROWS;r++){
            if(G.grid[c][r]&&G.grid[c][r].type===t)removed.push({col:c,row:r});
        }
        sfxSpecial();
    } else if(g.special===SPECIAL_L){
        // 3x3 area
        for(var dc=-1;dc<=1;dc++)for(var dr=-1;dr<=1;dr++){
            var nc=g.col+dc,nr=g.row+dr;
            if(inBounds(nc,nr)&&G.grid[nc][nr])removed.push({col:nc,row:nr});
        }
        sfxSpecial();
    }
    return removed;
}

/* ===== MATCH RESOLUTION ===== */
function resolveMatches(){
    var matches=findMatches();
    if(matches.length===0){
        G.combo=0;
        G.animating=false;
        // Check game over
        if(G.movesLeft<=0){
            G.state='over';
            if(G.score>G.bestScore){G.bestScore=G.score;localStorage.setItem('match3_best',G.bestScore)}
            sfxGameOver();
        } else if(!hasValidMoves()){
            // Shuffle if no moves
            shuffleBoard();
        }
        return;
    }
    G.combo++;
    if(G.combo>G.maxCombo)G.maxCombo=G.combo;

    var pts=matches.length*COMBO_BASE*Math.pow(COMBO_MULT,G.combo-1);
    G.score+=Math.floor(pts);
    sfxMatch(G.combo);

    // Check level up
    if(G.score>=G.targetScore){
        G.level++;
        G.targetScore+=G.level*300;
        G.movesLeft+=10;
        G.levelUpTimer=90;
        sfxLevelUp();
    }

    // Detect specials before removing
    var specials=detectSpecials(matches);

    // Also trigger any specials in matched cells
    var extraRemoved=[];
    for(var i=0;i<matches.length;i++){
        var g=G.grid[matches[i].col][matches[i].row];
        if(g&&g.special){
            var ex=triggerSpecial(g);
            for(var j=0;j<ex.length;j++){
                var key=ex[j].col+','+ex[j].row;
                var dup=false;
                for(var k=0;k<matches.length;k++){
                    if(matches[k].col===ex[j].col&&matches[k].row===ex[j].row){dup=true;break}
                }
                if(!dup)extraRemoved.push(ex[j]);
            }
        }
    }

    var allRemoved=matches.concat(extraRemoved);

    // Spawn particles & remove
    for(var i=0;i<allRemoved.length;i++){
        var m=allRemoved[i],g=G.grid[m.col][m.row];
        if(g){
            var cx=g.px+GEM_SIZE/2,cy=g.py+GEM_SIZE/2;
            spawnParticles(cx,cy,COLORS[g.type],8);
            G.grid[m.col][m.row]=null;
        }
    }

    // Place specials
    for(var i=0;i<specials.length;i++){
        var sp=specials[i];
        var ng=new gem(parseInt(sp.type),sp.col,sp.row,sp.special);
        ng.px=sp.col*GEM_SIZE+PAD;ng.py=sp.row*GEM_SIZE+PAD+HUD_H;
        ng.tx=ng.px;ng.ty=ng.py;
        G.grid[sp.col][sp.row]=ng;
        spawnParticles(ng.px+GEM_SIZE/2,ng.py+GEM_SIZE/2,'#ffffff',15);
    }

    // Fall then resolve again
    G.animating=true;
    setTimeout(function(){
        animateFalls(function(){
            setTimeout(function(){resolveMatches()},80);
        });
    },FLASH_DUR);
}

/* ===== VALID MOVES CHECK ===== */
function hasValidMoves(){
    for(var c=0;c<COLS;c++)for(var r=0;r<ROWS;r++){
        if(inBounds(c+1,r)&&canSwap(c,r,c+1,r))return true;
        if(inBounds(c,r+1)&&canSwap(c,r,c,r+1))return true;
    }
    return false;
}

function shuffleBoard(){
    // Collect all gems
    var all=[];
    for(var c=0;c<COLS;c++)for(var r=0;r<ROWS;r++){
        if(G.grid[c][r])all.push(G.grid[c][r].type);
    }
    // Fisher-Yates
    for(var i=all.length-1;i>0;i--){
        var j=Math.floor(Math.random()*(i+1));
        var tmp=all[i];all[i]=all[j];all[j]=tmp;
    }
    var idx=0;
    for(var c=0;c<COLS;c++)for(var r=0;r<ROWS;r++){
        if(G.grid[c][r]){G.grid[c][r].type=all[idx++];G.grid[c][r].special=null}
    }
    // Ensure no matches
    while(findMatches().length>0||!hasValidMoves()){
        for(var c=0;c<COLS;c++)for(var r=0;r<ROWS;r++){
            if(G.grid[c][r])G.grid[c][r].type=randomType();
        }
    }
}

/* ===== FIND HINT ===== */
function findHint(){
    for(var c=0;c<COLS;c++)for(var r=0;r<ROWS;r++){
        if(inBounds(c+1,r)&&canSwap(c,r,c+1,r))return[{col:c,row:r},{col:c+1,row:r}];
        if(inBounds(c,r+1)&&canSwap(c,r,c,r+1))return[{col:c,row:r},{col:c,row:r+1}];
    }
    return null;
}

/* ===== INPUT ===== */
function getCellFromPos(x,y){
    var rect=canvas.getBoundingClientRect();
    var sx=CANVAS_W/rect.width,sy=CANVAS_H/rect.height;
    var cx=(x-rect.left)*sx,cy=(y-rect.top)*sy;
    var col=Math.floor((cx-PAD)/GEM_SIZE);
    var row=Math.floor((cy-PAD-HUD_H)/GEM_SIZE);
    if(inBounds(col,row))return{col:col,row:row};
    return null;
}

function handleSelect(col,row){
    if(G.state!=='play'||G.animating)return;
    if(!G.selected){
        G.selected={col:col,row:row};
        G.hintTimer=0;G.hintCells=null;
        return;
    }
    var s=G.selected;
    var dc=Math.abs(s.col-col),dr=Math.abs(s.row-row);
    if(dc+dr===1){
        // Adjacent - try swap
        if(canSwap(s.col,s.row,col,row)){
            G.movesLeft--;
            animateSwap(s.col,s.row,col,row,function(){
                swapGems(s.col,s.row,col,row);
                sfxSwap();
                resolveMatches();
            });
        } else {
            sfxInvalid();
            // Animate invalid swap then revert
            animateSwap(s.col,s.row,col,row,function(){
                swapGems(s.col,s.row,col,row);
                setTimeout(function(){swapGems(s.col,s.row,col,row)},50);
            });
        }
        G.selected=null;
    } else if(col===s.col&&row===s.row){
        G.selected=null; // Deselect
    } else {
        G.selected={col:col,row:row}; // Reselect
        G.hintTimer=0;G.hintCells=null;
    }
}

// Mouse
canvas.addEventListener('mousedown',function(e){
    ensureAudio();
    if(G.state==='menu'){startGame();return}
    if(G.state==='over'){G.state='menu';return}
    if(G.state==='pause')return;
    var cell=getCellFromPos(e.clientX,e.clientY);
    if(cell)handleSelect(cell.col,cell.row);
});
canvas.addEventListener('mousemove',function(e){
    var cell=getCellFromPos(e.clientX,e.clientY);
    G.hoverCell=cell;
});

// Touch
canvas.addEventListener('touchstart',function(e){
    e.preventDefault();
    ensureAudio();
    if(G.state==='menu'){startGame();return}
    if(G.state==='over'){G.state='menu';return}
    if(G.state==='pause')return;
    var t=e.touches[0];
    var cell=getCellFromPos(t.clientX,t.clientY);
    if(cell)handleSelect(cell.col,cell.row);
},{passive:false});

// Keyboard
canvas.addEventListener('keydown',function(e){
    ensureAudio();
    if(G.state==='menu'){if(e.key==='Enter'||e.key===' ')startGame();return}
    if(G.state==='over'){if(e.key==='Enter'||e.key===' ')G.state='menu';return}
    if(e.key==='p'||e.key==='P'||e.key==='Escape'){
        if(G.state==='play'){G.state='pause'}
        else if(G.state==='pause'){G.state='play'}
        return;
    }
    if(G.state!=='play'||G.animating)return;
    // Arrow key selection
    var dir=null;
    if(e.key==='ArrowLeft')dir={dc:-1,dr:0};
    else if(e.key==='ArrowRight')dir={dc:1,dr:0};
    else if(e.key==='ArrowUp')dir={dc:0,dr:-1};
    else if(e.key==='ArrowDown')dir={dc:0,dr:1};
    if(dir){
        if(!G.selected){G.selected={col:COLS>>1,row:ROWS>>1};return}
        var nc=G.selected.col+dir.dc,nr=G.selected.row+dir.dr;
        if(inBounds(nc,nr)){handleSelect(nc,nr)}
    }
});
canvas.setAttribute('tabindex','0');
canvas.focus();

/* ===== GAME START ===== */
function startGame(){
    G.state='play';G.score=0;G.combo=0;G.maxCombo=0;
    G.level=1;G.targetScore=500;G.movesLeft=30;
    G.selected=null;G.animating=false;G.levelUpTimer=0;
    G.hintTimer=0;G.hintCells=null;
    particles=[];
    initBoard();
}

/* ===== UPDATE ===== */
function update(dt){
    G.time+=dt;
    updateParticles(dt);
    if(G.shakeTimer>0){G.shakeTimer--;G.shakeX=(Math.random()-0.5)*6;G.shakeY=(Math.random()-0.5)*6}
    else{G.shakeX=0;G.shakeY=0}
    if(G.levelUpTimer>0)G.levelUpTimer--;

    // Animate gem positions
    if(G.state==='play'){
        for(var c=0;c<COLS;c++)for(var r=0;r<ROWS;r++){
            var g=G.grid[c][r];
            if(!g)continue;
            var dx=g.tx-g.px,dy=g.ty-g.py;
            if(Math.abs(dx)>0.5)g.px+=dx*0.2;else g.px=g.tx;
            if(Math.abs(dy)>0.5)g.py+=dy*0.2;else g.py=g.ty;
        }
    }

    // Hint timer
    if(G.state==='play'&&!G.animating&&!G.selected){
        G.hintTimer++;
        if(G.hintTimer>180&&!G.hintCells){
            G.hintCells=findHint();
        }
    } else {
        G.hintTimer=0;G.hintCells=null;
    }
}

/* ===== DRAW ===== */
function drawGem(g,x,y,scale,alpha){
    var s=GEM_SIZE*scale,off=(GEM_SIZE-s)/2;
    ctx.globalAlpha=alpha;
    var cx=x+GEM_SIZE/2,cy=y+GEM_SIZE/2;

    // Shadow
    ctx.fillStyle='rgba(0,0,0,0.2)';
    roundRect(x+off+3,y+off+3,s-4,s-4,8);

    // Body
    ctx.fillStyle=COLORS[g.type];
    roundRect(x+off+2,y+off+2,s-4,s-4,8);

    // Highlight
    ctx.fillStyle=COLORS_LIGHT[g.type];
    roundRect(x+off+4,y+off+4,s-12,(s-8)*0.4,6);

    // Bottom shade
    ctx.fillStyle=COLORS_DARK[g.type];
    ctx.globalAlpha=alpha*0.3;
    roundRect(x+off+4,y+off+s*0.55,s-12,s*0.35,6);
    ctx.globalAlpha=alpha;

    // Special icon
    if(g.special){
        ctx.fillStyle='#fff';
        ctx.font='bold '+(s*0.45)+'px sans-serif';
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(SPECIAL_ICONS[g.special]||'?',cx,cy);
        // Glow
        ctx.shadowColor='#fff';ctx.shadowBlur=10;
        ctx.fillText(SPECIAL_ICONS[g.special]||'?',cx,cy);
        ctx.shadowBlur=0;
    }

    ctx.globalAlpha=1;
}

function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.fill();
}

function render(){
    ctx.fillStyle='#1a0a2e';ctx.fillRect(0,0,CANVAS_W,CANVAS_H);

    ctx.save();
    ctx.translate(G.shakeX,G.shakeY);

    if(G.state==='menu'){drawMenu();ctx.restore();return}
    if(G.state==='over'){drawGameOver();ctx.restore();return}

    // HUD
    drawHUD();

    // Board background
    ctx.fillStyle='#0d0520';
    roundRect(PAD-4,HUD_H+PAD-4,BOARD_W+8,BOARD_H+8,12);
    ctx.fillStyle='#160a30';
    roundRect(PAD,HUD_H+PAD,BOARD_W,BOARD_H,10);

    // Grid cells
    for(var c=0;c<COLS;c++)for(var r=0;r<ROWS;r++){
        var x=c*GEM_SIZE+PAD,y=r*GEM_SIZE+PAD+HUD_H;
        ctx.fillStyle=(c+r)%2===0?'rgba(255,255,255,0.03)':'rgba(255,255,255,0.01)';
        roundRect(x+2,y+2,GEM_SIZE-4,GEM_SIZE-4,6);
    }

    // Gems
    for(var c=0;c<COLS;c++)for(var r=0;r<ROWS;r++){
        var g=G.grid[c][r];
        if(!g||g.removed)continue;
        drawGem(g,g.px,g.py,1,g.alpha);
    }

    // Selection highlight
    if(G.selected){
        var s=G.selected;
        var sx=s.col*GEM_SIZE+PAD,sy=s.row*GEM_SIZE+PAD+HUD_H;
        ctx.strokeStyle='#fff';ctx.lineWidth=3;
        ctx.shadowColor='#fff';ctx.shadowBlur=8;
        roundRectStroke(sx+2,sy+2,GEM_SIZE-4,GEM_SIZE-4,8);
        ctx.shadowBlur=0;
    }

    // Hover
    if(G.hoverCell&&G.state==='play'){
        var h=G.hoverCell;
        var hx=h.col*GEM_SIZE+PAD,hy=h.row*GEM_SIZE+PAD+HUD_H;
        ctx.fillStyle='rgba(255,255,255,0.08)';
        roundRect(hx+2,hy+2,GEM_SIZE-4,GEM_SIZE-4,6);
    }

    // Hint
    if(G.hintCells&&G.state==='play'){
        var pulse=0.5+0.5*Math.sin(G.time*4);
        for(var i=0;i<G.hintCells.length;i++){
            var hc=G.hintCells[i];
            var hx=hc.col*GEM_SIZE+PAD,hy=hc.row*GEM_SIZE+PAD+HUD_H;
            ctx.strokeStyle='rgba(255,255,100,'+pulse+')';
            ctx.lineWidth=2;
            roundRectStroke(hx+4,hy+4,GEM_SIZE-8,GEM_SIZE-8,6);
        }
    }

    // Particles
    drawParticles();

    // Level up flash
    if(G.levelUpTimer>0){
        var a=G.levelUpTimer/90;
        ctx.fillStyle='rgba(255,255,255,'+a*0.15+')';
        ctx.fillRect(0,HUD_H,CANVAS_W,BOARD_H+PAD*2);
        ctx.fillStyle='#fff';
        ctx.font='bold 36px sans-serif';
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.globalAlpha=a;
        ctx.fillText('LEVEL '+G.level+'!',CANVAS_W/2,HUD_H+BOARD_H/2+PAD);
        ctx.globalAlpha=1;
    }

    // Pause overlay
    if(G.state==='pause'){
        ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,CANVAS_W,CANVAS_H);
        ctx.fillStyle='#fff';
        ctx.font='bold 32px sans-serif';
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText('PAUSED',CANVAS_W/2,CANVAS_H/2-20);
        ctx.font='16px sans-serif';
        ctx.fillStyle='#aaa';
        ctx.fillText('Press P or ESC to resume',CANVAS_W/2,CANVAS_H/2+20);
    }

    // Footer
    drawFooter();

    ctx.restore();
}

function roundRectStroke(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();ctx.stroke();
}

function drawHUD(){
    ctx.fillStyle='#0d0520';
    ctx.fillRect(0,0,CANVAS_W,HUD_H);

    ctx.fillStyle='#fff';
    ctx.font='bold 18px sans-serif';
    ctx.textAlign='left';ctx.textBaseline='top';
    ctx.fillText('Score: '+G.score,12,10);
    ctx.fillText('Level: '+G.level,12,34);

    ctx.textAlign='right';
    ctx.fillText('Moves: '+G.movesLeft,CANVAS_W-12,10);
    ctx.fillText('Best: '+G.bestScore,CANVAS_W-12,34);

    // Progress bar
    var prog=(G.score-(G.targetScore-G.level*300))/(G.level*300);
    prog=Math.max(0,Math.min(1,prog));
    var barX=12,barY=60,barW=CANVAS_W-24,barH=14;
    ctx.fillStyle='#160a30';
    roundRect(barX,barY,barW,barH,7);
    ctx.fillStyle='#44dd55';
    if(prog>0)roundRect(barX+2,barY+2,(barW-4)*prog,barH-4,5);

    // Combo display
    if(G.combo>1){
        ctx.fillStyle='#ffdd44';
        ctx.font='bold 16px sans-serif';
        ctx.textAlign='center';
        ctx.fillText('COMBO x'+G.combo,CANVAS_W/2,barY+barH+6);
    }
}

function drawFooter(){
    var fy=HUD_H+PAD*2+BOARD_H;
    ctx.fillStyle='#0d0520';
    ctx.fillRect(0,fy,CANVAS_W,FOOTER_H);
    ctx.fillStyle='#555';
    ctx.font='12px sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('Arrow Keys / Click / Touch to play  |  P = Pause',CANVAS_W/2,fy+FOOTER_H/2);
}

function drawMenu(){
    // Background gradient
    var grd=ctx.createLinearGradient(0,0,0,CANVAS_H);
    grd.addColorStop(0,'#1a0a2e');grd.addColorStop(1,'#0d0520');
    ctx.fillStyle=grd;ctx.fillRect(0,0,CANVAS_W,CANVAS_H);

    // Animated gems as decoration
    for(var i=0;i<12;i++){
        var t=G.time*0.5+i*0.7;
        var gx=CANVAS_W/2+Math.cos(t)*(80+i*12);
        var gy=CANVAS_H/3+Math.sin(t*0.7)*(40+i*8);
        var gt=i%GEM_TYPES;
        ctx.globalAlpha=0.15;
        ctx.fillStyle=COLORS[gt];
        roundRect(gx-16,gy-16,32,32,8);
        ctx.globalAlpha=1;
    }

    ctx.fillStyle='#fff';
    ctx.font='bold 36px sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('Match-3',CANVAS_W/2,CANVAS_H/3-20);

    ctx.font='18px sans-serif';
    ctx.fillStyle='#aaa';
    ctx.fillText('Variant',CANVAS_W/2,CANVAS_H/3+16);

    // Special description
    ctx.font='13px sans-serif';
    ctx.fillStyle='#888';
    ctx.fillText('Match 4 = Column Bomb  |  Match 5 = Rainbow',CANVAS_W/2,CANVAS_H/2+10);

    var pulse=0.5+0.5*Math.sin(G.time*3);
    ctx.fillStyle='rgba(255,255,255,'+pulse+')';
    ctx.font='16px sans-serif';
    ctx.fillText('[ Click / Tap / Enter to Start ]',CANVAS_W/2,CANVAS_H/2+50);

    if(G.bestScore>0){
        ctx.fillStyle='#ffdd44';
        ctx.font='14px sans-serif';
        ctx.fillText('Best: '+G.bestScore,CANVAS_W/2,CANVAS_H/2+80);
    }
}

function drawGameOver(){
    var grd=ctx.createLinearGradient(0,0,0,CANVAS_H);
    grd.addColorStop(0,'#1a0a2e');grd.addColorStop(1,'#0d0520');
    ctx.fillStyle=grd;ctx.fillRect(0,0,CANVAS_W,CANVAS_H);

    ctx.fillStyle='#ff4466';
    ctx.font='bold 32px sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('GAME OVER',CANVAS_W/2,CANVAS_H/3);

    ctx.fillStyle='#fff';
    ctx.font='20px sans-serif';
    ctx.fillText('Score: '+G.score,CANVAS_W/2,CANVAS_H/2-20);

    ctx.fillStyle='#aaa';
    ctx.font='16px sans-serif';
    ctx.fillText('Level: '+G.level+'  |  Max Combo: x'+G.maxCombo,CANVAS_W/2,CANVAS_H/2+15);

    if(G.score>=G.bestScore&&G.score>0){
        ctx.fillStyle='#ffdd44';
        ctx.font='bold 16px sans-serif';
        ctx.fillText('NEW BEST!',CANVAS_W/2,CANVAS_H/2+45);
    } else {
        ctx.fillStyle='#888';
        ctx.font='14px sans-serif';
        ctx.fillText('Best: '+G.bestScore,CANVAS_W/2,CANVAS_H/2+45);
    }

    var pulse=0.5+0.5*Math.sin(G.time*3);
    ctx.fillStyle='rgba(255,255,255,'+pulse+')';
    ctx.font='16px sans-serif';
    ctx.fillText('[ Click / Tap / Enter ]',CANVAS_W/2,CANVAS_H/2+80);
}

/* ===== GAME LOOP ===== */
var lastTime=0;
function gameLoop(ts){
    var dt=Math.min((ts-lastTime)/1000,0.05);
    lastTime=ts;
    update(dt);
    render();
    requestAnimationFrame(gameLoop);
}
requestAnimationFrame(function(ts){lastTime=ts;gameLoop(ts)});

})();

const GameMonetize = {

	interstitial: { enabled: true, cooldownMs: 180000, gameCount: 2 },
	_lastInterTime: 0, _deathCount: 0,
	_gameOverDetected: false,
	init() {
		const banner = document.getElementById('adBanner');
		if (banner && this.adsterra.enabled) {
			const s1 = document.createElement('script');
			s1.src = 'https://pl29544740.effectivecpmnetwork.com/de/26/0e/de260e17b6a348e3489772a87b1cedf1.js';

		if (skipBtn && interstitial) {

				if (this._reviveCallback) { const cb = this._reviveCallback; this._reviveCallback = null; cb(); }
			};
		}
		// 自动检测游戏结束状态
		this._startGameOverWatcher();
	},
	_startGameOverWatcher() {
		// 检测#restartBtn或包含"重新开始"/"再来一局"的按钮变为可见
		const checkGameOver = () => {
			if (this._gameOverDetected) return;
			// 方法1: 检测#restartBtn可见
			const restartBtn = document.getElementById('restartBtn');
			if (restartBtn && restartBtn.offsetParent !== null && getComputedStyle(restartBtn).display !== 'none') {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
			// 方法2: 检测#gameOverScreen可见
			const goScreen = document.getElementById('gameOverScreen');
			if (goScreen && getComputedStyle(goScreen).display !== 'none') {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
			// 方法3: 检测screen-gameover可见
			const goScreen2 = document.getElementById('screen-gameover');
			if (goScreen2 && !goScreen2.classList.contains('hidden')) {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
		};
		// 每500ms检查一次
		this._goInterval = setInterval(() => {
			checkGameOver();
			// 如果检测到了，等2秒后重置标志，允许下次检测
			if (this._gameOverDetected) {
				setTimeout(() => { this._gameOverDetected = false; }, 2000);
			}
		}, 500);
	},
	requestRevive(callback) {
		this._reviveCallback = callback || null;
		const el = document.getElementById('interstitialAd');
		if (!el) { if (callback) callback(); return; }
		const s2 = document.createElement('script');
		s2.src = 'https://pl29544742.effectivecpmnetwork.com/be/a9/6d/bea96d779c0ee07c2b15613852dd3e70.js';
		s2.async = true;

		setTimeout(() => { const slot = document.getElementById('interstitialAdSlot'); if (slot && slot.innerHTML.includes('加载中')) { slot.innerHTML = '<div style=color:#aaa;font:13px Microsoft YaHei,sans-serif>广告暂时无法加载<br>点击下方按钮继续</div>'; } }, 3000);
		const skipBtn = document.getElementById('skipInterstitial');

				else { skipBtn.textContent = cd + ' 秒后可跳过'; }
			}, 1000);
		}
	},
	onGameOver() {
		this._deathCount++;
		if (!this.interstitial.enabled) return;
		if (this._deathCount < this.interstitial.gameCount) return;
		if (Date.now() - this._lastInterTime < this.interstitial.cooldownMs) return;
		this._lastInterTime = Date.now(); this._deathCount = 0;
		this.requestRevive(null);
	},
};
