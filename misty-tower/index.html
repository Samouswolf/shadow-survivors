// Build floor grid from floor definition
function buildFloor(def){
  const g=[];
  const doorColors={y:CL.YD,b:CL.BD,r:CL.RD};
  const keyColors={y:CL.KY,b:CL.KB,r:CL.KR};
  // Parse grid characters
  for(let y=0;y<R;y++){
    const r=[];
    const row=(def.g[y]||'').padEnd(C,'W');
    for(let x=0;x<C;x++){
      const ch=row[x]||'W';
      r.push(CHAR_TO_CL[ch]!==undefined?CHAR_TO_CL[ch]:CL.F);
    }
    g.push(r);

// BFS路径查找
function findPath(tx,ty){

		const c=q.shift();if(c.x===tx&&c.y===ty)return c.p;
		for(const[dX,dY]of[[0,-1],[0,1],[-1,0],[1,0]]){
			const nx=c.x+dX,ny=c.y+dY,k=nx+','+ny;
			if(v.has(k)||nx<0||nx>=C||ny<0||ny>=R)continue;
			const cl=g[ny][nx];if(cl===CL.W||cl===CL.YD||cl===CL.BD||cl===CL.RD)continue;
			v.add(k);q.push({x:nx,y:ny,p:[...c.p,{x:nx,y:ny}]});

	}

}
