<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>吃豆人大作战</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;user-select:none;-webkit-user-select:none;}
canvas{display:block;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);}
</style>
<style>/* 游戏工坊广告系统 */
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);height:90px;max-height:90px;overflow:hidden;contain:layout style paint;pointer-events:none!important}.ad-banner-container,.ad-banner-container *{pointer-events:none!important}.ad-banner-container iframe{max-height:90px;pointer-events:none!important}
.ad-banner-container iframe{max-width:100%}

.sponsor-btn{position:fixed;top:44px;right:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:3px 9px;border-radius:10px;font:11px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}

.sponsor-panel .qr-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px;text-align:center;min-width:140px}
.sponsor-panel .qr-card .qr-icon{font-size:48px;margin-bottom:6px}
.sponsor-panel .qr-card .qr-label{color:#ccc;font:13px "Microsoft YaHei",sans-serif}
.sponsor-panel .qr-card .qr-hint{color:#888;font:11px "Microsoft YaHei",sans-serif;margin-top:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.interstitial-ad .ad-content{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;text-align:center;min-width:280px;max-width:400px}
.interstitial-ad .ad-content p{color:#aaa;font:14px "Microsoft YaHei",sans-serif;margin-bottom:12px}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
(function(){
"use strict";

/* ========== 常量 ========== */
const COLS=28,ROWS=31,TILE=16;
const W=COLS*TILE,H=ROWS*TILE;
const PAC_SPEED=1.8,GHOST_SPEED=1.4,GHOST_FRIGHT_SPEED=0.9;
const FRIGHT_TIME=480,SCATTER_TIME=420,CHASE_TIME=1200;
const DOT_PTS=10,POWER_PTS=50,GHOST_PTS=[200,400,800,1600];
const LIVES_INIT=3;

/* ========== 地图 ========== */
// 0=空 1=墙 2=豆 3=能量豆 4=门
const MAP_TEMPLATE=[
"1111111111111111111111111111",
"1222222222222112222222222221",
"1211112111112112111112111121",
"1311112111112112111112111131",
"1211112111112112111112111121",
"1222222222222222222222222221",
"1211112112111111112112111121",
"1211112112111111112112111121",
"1222222112222112222112222221",
"1111112111110110111112111111",
"1111112111110110111112111111",
"1111112110000000001112111111",
"1111112110111441101112111111",
"0000002000100000010002000000",
"1111112110100000011112111111",
"1111112110111111111112111111",
"1111112110000000001112111111",
"1111112110111111111112111111",
"1111112110111111111112111111",
"1222222222222112222222222221",
"1211112111112112111112111121",
"1211112111112112111112111121",
"1322112222222002222222112231",
"1112112112111111112112112111",
"1112112112111111112112112111",
"1222222112222112222112222221",
"1211111111112112111111111121",
"1211111111112112111111111121",
"1222222222222222222222222221",
"1111111111111111111111111111",
"1111111111111111111111111111"
];

/* ========== 幽灵颜色和名字 ========== */
const GHOST_COLORS=["#FF0000","#FFB8FF","#00FFFF","#FFB852"];
const GHOST_NAMES=["Blinky","Pinky","Inky","Clyde"];

/* ========== Canvas ========== */
const cv=document.getElementById("cv");
const ctx=cv.getContext("2d");
let scale=1;

function resize(){
    const ww=window.innerWidth,wh=window.innerHeight;
    scale=Math.min(ww/W,wh/H);
    cv.width=Math.floor(W*scale);
    cv.height=Math.floor(H*scale);
    ctx.imageSmoothingEnabled=false;
}
window.addEventListener("resize",resize);
resize();

/* ========== 音效 ========== */
let audioCtx=null;
function ensureAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();}
function playTone(freq,dur,type){
    if(!audioCtx)return;
    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();
    o.type=type||"square";
    o.frequency.value=freq;
    g.gain.value=0.08;
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
    o.connect(g);g.connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+dur);
}
function sfxEat(){playTone(600,0.06,"sine");}
function sfxPower(){playTone(200,0.3,"sine");}
function sfxGhost(){playTone(150,0.15,"sawtooth");}
function sfxDie(){playTone(100,0.5,"sawtooth");}
function sfxLevel(){playTone(800,0.1,"sine");setTimeout(()=>playTone(1000,0.1,"sine"),120);setTimeout(()=>playTone(1200,0.15,"sine"),240);}

/* ========== 游戏状态 ========== */
const STATE={MENU:0,PLAYING:1,PAUSED:2,GAMEOVER:3,WIN:4,DYING:5};
let G={};

function initMap(){
    const m=[];
    for(let r=0;r<ROWS;r++){
        m[r]=[];
        for(let c=0;c<COLS;c++){
            const ch=MAP_TEMPLATE[r][c];
            m[r][c]=ch==="0"?0:ch==="1"?1:ch==="2"?2:ch==="3"?3:ch==="4"?4:0;
        }
    }
    return m;
}

function countDots(m){
    let n=0;
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(m[r][c]===2||m[r][c]===3)n++;
    return n;
}

function initGame(){
    const m=initMap();
    G={
        state:STATE.MENU,
        map:m,
        score:0,
        lives:LIVES_INIT,
        level:1,
        highScore:parseInt(localStorage.getItem("pacman_high")||"0"),
        dotsLeft:countDots(m),
        totalDots:countDots(m),
        modeTimer:0,
        mode:"scatter",// scatter|chase
        frightTimer:0,
        ghostsEaten:0,
        dyingTimer:0,
        levelCompleteTimer:0,
        // Pac-Man
        px:13.5*TILE,py:23*TILE,pdir:{x:-1,y:0},pnext:{x:-1,y:0},pmouth:0,pmouthDir:1,
        // Ghosts
        ghosts:[],
        // 输入
        touchStart:null,
        // 动画
        frame:0
    };
    initGhosts();
}

function initGhosts(){
    G.ghosts=[];
    const starts=[{x:13.5,y:11},{x:13.5,y:14},{x:11.5,y:14},{x:15.5,y:14}];
    const targets=[{x:25,y:-3},{x:2,y:-3},{x:27,y:31},{x:0,y:31}];
    for(let i=0;i<4;i++){
        G.ghosts.push({
            x:starts[i].x*TILE,y:starts[i].y*TILE,
            dir:{x:i===0?-1:(i===2?-1:1),y:0},
            target:targets[i],
            mode:i===0?"chase":"scatter",
            frightened:false,
            eaten:false,
            inHouse:i>0,
            houseTimer:i*120,
            color:GHOST_COLORS[i],
            idx:i
        });
    }
}

/* ========== 碰撞 ========== */
function tileAt(px,py){
    const c=Math.floor(px/TILE),r=Math.floor(py/TILE);
    if(r<0||r>=ROWS||c<0||c>=COLS)return 1;
    return G.map[r][c];
}

function canMove(x,y,radius){
    const r1=radius||4;
    // Check four corners
    const pts=[{x:x-r1,y:y-r1},{x:x+r1,y:y-r1},{x:x-r1,y:y+r1},{x:x+r1,y:y+r1}];
    for(const p of pts){
        const t=tileAt(p.x,p.y);
        if(t===1)return false;
    }
    return true;
}

function canMoveGhost(x,y,isEaten){
    const r1=5;
    const pts=[{x:x-r1,y:y-r1},{x:x+r1,y:y-r1},{x:x-r1,y:y+r1},{x:x+r1,y:y+r1}];
    for(const p of pts){
        const c=Math.floor(p.x/TILE),r=Math.floor(p.y/TILE);
        if(r<0||r>=ROWS||c<0||c>=COLS)return false;
        const t=G.map[r][c];
        if(t===1)return false;
        if(t===4&&!isEaten)return false;
    }
    return true;
}

function dist(x1,y1,x2,y2){return Math.sqrt((x2-x1)*(x2-x1)+(y2-y1)*(y2-y1));}

/* ========== AI ========== */
function getTarget(ghost){
    if(ghost.eaten)return{x:13.5*TILE,y:11*TILE};
    if(ghost.idx===0)return{x:G.px,y:G.py};// Blinky: 直接追踪
    if(ghost.idx===1){// Pinky: 前方4格
        return{x:G.px+G.pdir.x*4*TILE,y:G.py+G.pdir.y*4*TILE};
    }
    if(ghost.idx===2){// Inky: 复杂计算
        const ax=G.px+G.pdir.x*2*TILE;
        const ay=G.py+G.pdir.y*2*TILE;
        const bx=G.ghosts[0].x,by=G.ghosts[0].y;
        return{x:ax+(ax-bx),y:ay+(ay-by)};
    }
    // Clyde: 近追远散
    const d=dist(ghost.x,ghost.y,G.px,G.py);
    if(d<8*TILE)return{x:0,y:30*TILE};
    return{x:G.px,y:G.py};
}

function ghostDir(ghost){
    const cx=Math.floor(ghost.x/TILE),cy=Math.floor(ghost.y/TILE);
    // Must be centered on tile to change direction
    const onTile=Math.abs(ghost.x-cx*TILE-TILE/2)<2&&Math.abs(ghost.y-cy*TILE-TILE/2)<2;
    if(!onTile)return ghost.dir;

    const tx=ghost.target.x,ty=ghost.target.y;
    const dirs=[{x:0,y:-1},{x:-1,y:0},{x:0,y:1},{x:1,y:0}];
    const opp={x:-ghost.dir.x,y:-ghost.dir.y};
    let best=ghost.dir,bestD=1e9;
    for(const d of dirs){
        if(d.x===opp.x&&d.y===opp.y)continue;// 不能掉头
        const nx=cx+d.x,ny=cy+d.y;
        if(ny<0||ny>=ROWS||nx<0||nx>=COLS)continue;
        const t=G.map[ny][nx];
        if(t===1)continue;
        if(t===4&&!ghost.eaten)continue;
        const dd=(nx*TILE-tx)*(nx*TILE-tx)+(ny*TILE-ty)*(ny*TILE-ty);
        if(dd<bestD){bestD=dd;best=d;}
    }
    return best;
}

function updateGhosts(){
    for(const g of G.ghosts){
        // House timer
        if(g.inHouse){
            g.houseTimer--;
            if(g.houseTimer<=0)g.inHouse=false;
            else continue;
        }
        // Speed
        let spd=GHOST_SPEED;
        if(g.eaten)spd=3.5;
        else if(g.frightened)spd=GHOST_FRIGHT_SPEED;
        // Get direction
        const d=ghostDir(g);
        g.dir=d;
        // Move with wall sliding
        const nx=g.x+d.x*spd,ny=g.y+d.y*spd;
        if(canMoveGhost(nx,ny,g.eaten)){
            g.x=nx;g.y=ny;
        }else{
            // Try horizontal only
            if(d.x!==0&&canMoveGhost(g.x+d.x*spd,g.y,g.eaten)){
                g.x+=d.x*spd;
            }
            // Try vertical only
            else if(d.y!==0&&canMoveGhost(g.x,g.y+d.y*spd,g.eaten)){
                g.y+=d.y*spd;
            }
        }
        // Tunnel wrap
        if(g.x<-TILE/2)g.x=W-TILE/2;
        if(g.x>W-TILE/2)g.x=-TILE/2;
        // Return to house when eaten
        if(g.eaten&&dist(g.x,g.y,13.5*TILE,11*TILE)<TILE){
            g.eaten=false;g.frightened=false;
        }
    }
}

/* ========== 更新 ========== */
function update(){
    if(G.state===STATE.PLAYING){
        updatePac();
        updateGhosts();
        checkCollisions();
        updateMode();
        // Level complete
        if(G.dotsLeft<=0){
            G.state=STATE.WIN;
            G.levelCompleteTimer=120;
            sfxLevel();
        }
    }else if(G.state===STATE.DYING){
        G.dyingTimer--;
        if(G.dyingTimer<=0){
            G.lives--;
            if(G.lives<=0){
                G.state=STATE.GAMEOVER;
                if(G.score>G.highScore){
                    G.highScore=G.score;
                    localStorage.setItem("pacman_high",G.highScore);
                }
            }else{
                resetPositions();
                G.state=STATE.PLAYING;
            }
        }
    }else if(G.state===STATE.WIN){
        G.levelCompleteTimer--;
        if(G.levelCompleteTimer<=0){
            nextLevel();
        }
    }
    G.frame++;
}

function resetPositions(){
    G.px=13.5*TILE;G.py=23*TILE;
    G.pdir={x:-1,y:0};G.pnext={x:-1,y:0};
    initGhosts();
    G.frightTimer=0;G.ghostsEaten=0;
    G.modeTimer=0;G.mode="scatter";
}

function nextLevel(){
    G.level++;
    G.map=initMap();
    G.dotsLeft=countDots(G.map);
    G.totalDots=G.dotsLeft;
    resetPositions();
    G.state=STATE.PLAYING;
}

function updatePac(){
    // Try next direction
    const nx=G.px+G.pnext.x*PAC_SPEED;
    const ny=G.py+G.pnext.y*PAC_SPEED;
    if(canMove(nx,ny,6)){
        G.pdir=G.pnext;
    }
    // Move in current direction
    const mx=G.px+G.pdir.x*PAC_SPEED;
    const my=G.py+G.pdir.y*PAC_SPEED;
    if(canMove(mx,my,6)){
        G.px=mx;G.py=my;
    }
    // Tunnel wrap
    if(G.px<-TILE/2)G.px=W-TILE/2;
    if(G.px>W-TILE/2)G.px=-TILE/2;
    // Eat dots
    const c=Math.floor(G.px/TILE),r=Math.floor(G.py/TILE);
    if(r>=0&&r<ROWS&&c>=0&&c<COLS){
        if(G.map[r][c]===2){
            G.map[r][c]=0;G.score+=DOT_PTS;G.dotsLeft--;sfxEat();
        }else if(G.map[r][c]===3){
            G.map[r][c]=0;G.score+=POWER_PTS;G.dotsLeft--;
            G.frightTimer=FRIGHT_TIME;G.ghostsEaten=0;
            for(const g of G.ghosts)if(!g.eaten)g.frightened=true;
            sfxPower();
        }
    }
    // Mouth animation
    G.pmouth+=0.15*G.pmouthDir;
    if(G.pmouth>0.4)G.pmouthDir=-1;
    if(G.pmouth<0)G.pmouthDir=1;
}

function checkCollisions(){
    for(const g of G.ghosts){
        if(g.inHouse)continue;
        if(dist(G.px,G.py,g.x,g.y)<TILE*0.7){
            if(g.eaten)continue;
            if(g.frightened){
                // Eat ghost
                g.eaten=true;g.frightened=false;
                G.score+=GHOST_PTS[Math.min(G.ghostsEaten,3)];
                G.ghostsEaten++;
                sfxGhost();
            }else{
                // Die
                G.state=STATE.DYING;
                G.dyingTimer=60;
                sfxDie();
                return;
            }
        }
    }
}

function updateMode(){
    if(G.frightTimer>0){
        G.frightTimer--;
        if(G.frightTimer<=0){
            for(const g of G.ghosts)g.frightened=false;
            G.ghostsEaten=0;
        }
        return;
    }
    G.modeTimer++;
    const limit=G.mode==="scatter"?SCATTER_TIME:CHASE_TIME;
    if(G.modeTimer>=limit){
        G.modeTimer=0;
        G.mode=G.mode==="scatter"?"chase":"scatter";
    }
    for(const g of G.ghosts){
        if(!g.eaten&&!g.frightened){
            g.mode=G.mode;
            g.target=G.mode==="scatter"?[
                {x:25*TILE,y:-3*TILE},{x:2*TILE,y:-3*TILE},{x:27*TILE,y:31*TILE},{x:0*TILE,y:31*TILE}
            ][g.idx]:getTarget(g);
        }
    }
}

/* ========== 渲染 ========== */
function render(){
    ctx.save();
    ctx.scale(scale,scale);
    ctx.fillStyle="#000";
    ctx.fillRect(0,0,W,H);
    if(G.state===STATE.MENU){
        renderMenu();
    }else if(G.state===STATE.GAMEOVER){
        renderGame("GAME OVER","#FF0000");
    }else if(G.state===STATE.WIN){
        renderGame("LEVEL CLEAR!","#00FF00");
    }else{
        renderPlay();
    }
    ctx.restore();
}

function renderPlay(){
    // Map
    for(let r=0;r<ROWS;r++){
        for(let c=0;c<COLS;c++){
            const t=G.map[r][c];
            const x=c*TILE,y=r*TILE;
            if(t===1){
                ctx.fillStyle="#1a1aff";
                ctx.fillRect(x,y,TILE,TILE);
                // Border
                ctx.strokeStyle="#3333ff";
                ctx.lineWidth=1;
                ctx.strokeRect(x+0.5,y+0.5,TILE-1,TILE-1);
            }else if(t===2){
                ctx.fillStyle="#FFB897";
                ctx.beginPath();
                ctx.arc(x+TILE/2,y+TILE/2,2,0,Math.PI*2);
                ctx.fill();
            }else if(t===3){
                ctx.fillStyle="#FFB897";
                const pulse=1+Math.sin(G.frame*0.1)*0.3;
                ctx.beginPath();
                ctx.arc(x+TILE/2,y+TILE/2,4*pulse,0,Math.PI*2);
                ctx.fill();
            }else if(t===4){
                ctx.fillStyle="#FFB852";
                ctx.fillRect(x+2,y+6,TILE-4,4);
            }
        }
    }
    // Pac-Man
    if(G.state!==STATE.DYING||G.dyingTimer%4<2){
        renderPac(G.px,G.py,G.pdir,G.pmouth,G.state===STATE.DYING?(1-G.dyingTimer/60):0);
    }
    // Ghosts
    for(const g of G.ghosts){
        if(g.inHouse&&g.houseTimer>60)continue;
        renderGhost(g);
    }
    // UI
    ctx.fillStyle="#FFF";
    ctx.font="bold 12px monospace";
    ctx.textAlign="left";
    ctx.fillText("SCORE: "+G.score,4,12);
    ctx.textAlign="right";
    ctx.fillText("HI: "+G.highScore,W-4,12);
    ctx.textAlign="center";
    ctx.fillText("LV "+G.level,W/2,12);
    // Lives
    for(let i=0;i<G.lives-1;i++){
        renderPac(16+i*18,H-10,{x:1,y:0},0.2,0);
    }
    // Fright timer bar
    if(G.frightTimer>0){
        const pct=G.frightTimer/FRIGHT_TIME;
        ctx.fillStyle=pct>0.3?"#0000FF":"#FF0000";
        ctx.fillRect(W/2-50,H-6,100*pct,4);
    }
    // Pause
    if(G.state===STATE.PAUSED){
        ctx.fillStyle="rgba(0,0,0,0.6)";
        ctx.fillRect(0,0,W,H);
        ctx.fillStyle="#FFFF00";
        ctx.font="bold 24px monospace";
        ctx.textAlign="center";
        ctx.fillText("PAUSED",W/2,H/2);
        ctx.font="12px monospace";
        ctx.fillText("Press P or Tap to resume",W/2,H/2+24);
    }
}

function renderPac(x,y,dir,mouth,dying){
    ctx.save();
    ctx.translate(x,y);
    let angle=0;
    if(dir.x===1)angle=0;
    else if(dir.x===-1)angle=Math.PI;
    else if(dir.y===-1)angle=-Math.PI/2;
    else if(dir.y===1)angle=Math.PI/2;
    ctx.rotate(angle);
    if(dying>0){
        // Dying animation: pie shrinking
        ctx.fillStyle="#FFFF00";
        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.arc(0,0,7,Math.PI*dying,Math.PI*2-Math.PI*dying);
        ctx.closePath();
        ctx.fill();
    }else{
        ctx.fillStyle="#FFFF00";
        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.arc(0,0,7,mouth*Math.PI,Math.PI*2-mouth*Math.PI);
        ctx.closePath();
        ctx.fill();
    }
    ctx.restore();
}

function renderGhost(g){
    const x=g.x,y=g.y;
    ctx.save();
    ctx.translate(x,y);
    if(g.eaten){
        // Just eyes
        drawEyes(0,0,g.dir);
    }else{
        // Body
        ctx.fillStyle=g.frightened?(G.frightTimer<120&&G.frame%8<4?"#FFFFFF":"#2121DE"):g.color;
        ctx.beginPath();
        ctx.arc(0,-2,7,Math.PI,0);
        ctx.lineTo(7,5);
        // Wavy bottom
        const wave=G.frame*0.2;
        for(let i=7;i>=-7;i-=3.5){
            ctx.lineTo(i,5+Math.sin(wave+i)*2);
        }
        ctx.closePath();
        ctx.fill();
        // Eyes
        if(!g.frightened){
            drawEyes(0,-2,g.dir);
        }else{
            // Frightened face
            ctx.fillStyle="#FFF";
            ctx.fillRect(-4,-4,2,2);
            ctx.fillRect(2,-4,2,2);
            // Wavy mouth
            ctx.strokeStyle="#FFF";
            ctx.lineWidth=1;
            ctx.beginPath();
            ctx.moveTo(-4,2);
            for(let i=-4;i<=4;i+=2){
                ctx.lineTo(i,2+((i/2)%2===0?1:-1));
            }
            ctx.stroke();
        }
    }
    ctx.restore();
}

function drawEyes(x,y,dir){
    // White
    ctx.fillStyle="#FFF";
    ctx.beginPath();ctx.ellipse(x-3,y,3,4,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(x+3,y,3,4,0,0,Math.PI*2);ctx.fill();
    // Pupil
    ctx.fillStyle="#00F";
    ctx.beginPath();ctx.arc(x-3+dir.x*1.5,y+dir.y*1.5,1.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(x+3+dir.x*1.5,y+dir.y*1.5,1.5,0,Math.PI*2);ctx.fill();
}

function renderMenu(){
    // Title
    ctx.fillStyle="#FFFF00";
    ctx.font="bold 28px monospace";
    ctx.textAlign="center";
    ctx.fillText("PAC-MAN",W/2,80);
    ctx.fillStyle="#FF0000";
    ctx.font="16px monospace";
    ctx.fillText("吃豆人大作战",W/2,110);
    // Animated pac-man and ghost
    const animX=W/2-40+Math.sin(G.frame*0.03)*20;
    renderPac(animX,160,{x:1,y:0},Math.abs(Math.sin(G.frame*0.1))*0.4,0);
    for(let i=0;i<4;i++){
        renderGhost({x:W/2+20+i*18,y:160,dir:{x:-1,y:0},frightened:false,eaten:false,color:GHOST_COLORS[i],idx:i,inHouse:false,houseTimer:0,mode:"chase",target:{x:0,y:0}});
    }
    // Instructions
    ctx.fillStyle="#FFF";
    ctx.font="12px monospace";
    ctx.fillText("Arrow Keys / WASD / Touch to Move",W/2,220);
    ctx.fillText("P = Pause",W/2,240);
    ctx.fillText("Eat all dots to advance!",W/2,260);
    ctx.fillText("Power pellets let you eat ghosts!",W/2,280);
    // High score
    ctx.fillStyle="#FFB852";
    ctx.fillText("High Score: "+G.highScore,W/2,320);
    // Start
    ctx.fillStyle=G.frame%60<30?"#00FF00":"#FFFF00";
    ctx.font="bold 18px monospace";
    ctx.fillText("Press SPACE or Tap to Start",W/2,H/2+60);
    // Level info
    ctx.fillStyle="#888";
    ctx.font="10px monospace";
    ctx.fillText("4 Ghost AI: Blinky(Pursuit) / Pinky(Ambush) / Inky(Patrol) / Clyde(Random)",W/2,H-30);
}

function renderGame(text,color){
    renderPlay();
    ctx.fillStyle="rgba(0,0,0,0.7)";
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle=color;
    ctx.font="bold 24px monospace";
    ctx.textAlign="center";
    ctx.fillText(text,W/2,H/2-20);
    ctx.fillStyle="#FFF";
    ctx.font="14px monospace";
    ctx.fillText("Score: "+G.score,W/2,H/2+10);
    ctx.fillText("High Score: "+G.highScore,W/2,H/2+30);
    if(G.state===STATE.GAMEOVER){
        ctx.fillStyle=G.frame%60<30?"#00FF00":"#FFFF00";
        ctx.font="bold 14px monospace";
        ctx.fillText("Press SPACE or Tap to Restart",W/2,H/2+60);
    }
}

/* ========== 输入 ========== */
document.addEventListener("keydown",function(e){
    ensureAudio();
    const key=e.key.toLowerCase();
    if(G.state===STATE.MENU){
        if(key===" "||key==="enter"){startGame();e.preventDefault();return;}
    }
    if(G.state===STATE.GAMEOVER){
        if(key===" "||key==="enter"){initGame();startGame();e.preventDefault();return;}
    }
    if(G.state===STATE.PLAYING||G.state===STATE.PAUSED){
        if(key==="p"||key==="escape"){
            togglePause();e.preventDefault();return;
        }
    }
    if(G.state===STATE.PLAYING){
        if(key==="arrowup"||key==="w"){G.pnext={x:0,y:-1};e.preventDefault();}
        else if(key==="arrowdown"||key==="s"){G.pnext={x:0,y:1};e.preventDefault();}
        else if(key==="arrowleft"||key==="a"){G.pnext={x:-1,y:0};e.preventDefault();}
        else if(key==="arrowright"||key==="d"){G.pnext={x:1,y:0};e.preventDefault();}
    }
});

// Mouse/Touch
function handleTap(ex,ey){
    ensureAudio();
    if(G.state===STATE.MENU){startGame();return;}
    if(G.state===STATE.GAMEOVER){initGame();startGame();return;}
    if(G.state===STATE.PAUSED){togglePause();return;}
    if(G.state!==STATE.PLAYING)return;
    // Direction from tap relative to pac
    const rect=cv.getBoundingClientRect();
    const tx=(ex-rect.left)/scale;
    const ty=(ey-rect.top)/scale;
    const dx=tx-G.px,dy=ty-G.py;
    if(Math.abs(dx)>Math.abs(dy)){
        G.pnext={x:dx>0?1:-1,y:0};
    }else{
        G.pnext={x:0,y:dy>0?1:-1};
    }
}

cv.addEventListener("click",function(e){handleTap(e.clientX,e.clientY);});
cv.addEventListener("touchstart",function(e){
    e.preventDefault();
    const t=e.touches[0];
    G.touchStart={x:t.clientX,y:t.clientY};
},{passive:false});
cv.addEventListener("touchend",function(e){
    e.preventDefault();
    if(!G.touchStart)return;
    const t=e.changedTouches[0];
    const dx=t.clientX-G.touchStart.x;
    const dy=t.clientY-G.touchStart.y;
    const minSwipe=20;
    if(Math.abs(dx)<minSwipe&&Math.abs(dy)<minSwipe){
        handleTap(t.clientX,t.clientY);
    }else if(G.state===STATE.PLAYING){
        ensureAudio();
        if(Math.abs(dx)>Math.abs(dy)){
            G.pnext={x:dx>0?1:-1,y:0};
        }else{
            G.pnext={x:0,y:dy>0?1:-1};
        }
    }
    G.touchStart=null;
},{passive:false});

function startGame(){
    if(G.state===STATE.MENU||G.state===STATE.GAMEOVER){
        G.state=STATE.PLAYING;
    }
}

function togglePause(){
    if(G.state===STATE.PLAYING)G.state=STATE.PAUSED;
    else if(G.state===STATE.PAUSED)G.state=STATE.PLAYING;
}

/* ========== 主循环 ========== */
let lastTime=0;
const TARGET_DT=1000/60;

function gameLoop(ts){
    const dt=ts-lastTime;
    if(dt>=TARGET_DT*0.8){
        lastTime=ts;
        update();
        render();
    }
    requestAnimationFrame(gameLoop);
}

initGame();
requestAnimationFrame(gameLoop);

})();

const GameMonetize = {
	adsterra: { enabled: !/localhost|127\.0\.0\.1/.test(location.hostname) },
	sponsor: { enabled: true, wechatQR: '', alipayQR: '' },
	interstitial: { enabled: true, cooldownMs: 180000, gameCount: 2 },
	_lastInterTime: 0, _deathCount: 0,
	_gameOverDetected: false,
	init() {
		const banner = document.getElementById('adBanner');
		if (banner && this.adsterra.enabled) {
			const s1 = document.createElement('script');
			s1.src = 'https://pl29544740.effectivecpmnetwork.com/de/26/0e/de260e17b6a348e3489772a87b1cedf1.js';
			s1.async = true;
			banner.appendChild(s1);
		}
		const spBtn = document.getElementById('sponsorBtn');
		const spPanel = document.getElementById('sponsorPanel');
		const spClose = document.getElementById('sponsorClose');
		if (spBtn && spPanel && spClose && this.sponsor.enabled) {
			spBtn.onclick = () => { spPanel.style.display = 'flex'; spPanel.style.pointerEvents = 'auto'; };
			spClose.onclick = () => { spPanel.style.display = 'none'; spPanel.style.pointerEvents = 'none'; };
			spPanel.onclick = (e) => { if (e.target === spPanel) { spPanel.style.display = 'none'; spPanel.style.pointerEvents = 'none'; } };
		} else if (spBtn) { spBtn.style.display = 'none'; }
		const skipBtn = document.getElementById('skipInterstitial');
		const interstitial = document.getElementById('interstitialAd');
		if (skipBtn && interstitial) {
			skipBtn.onclick = () => {
				interstitial.style.display = 'none'; interstitial.style.pointerEvents = 'none';
				if (this._reviveCallback) { const cb = this._reviveCallback; this._reviveCallback = null; cb(); }
			};
		}
		// 自动检测游戏结束状态
		this._startGameOverWatcher();
	},
	_startGameOverWatcher() {
		// 检测#restartBtn或包含"重新开始"/"再来一局"的按钮变为可见
		const checkGameOver = () => {
			if (this._gameOverDetected) return;
			// 方法1: 检测#restartBtn可见
			const restartBtn = document.getElementById('restartBtn');
			if (restartBtn && restartBtn.offsetParent !== null && getComputedStyle(restartBtn).display !== 'none') {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
			// 方法2: 检测#gameOverScreen可见
			const goScreen = document.getElementById('gameOverScreen');
			if (goScreen && getComputedStyle(goScreen).display !== 'none') {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
			// 方法3: 检测screen-gameover可见
			const goScreen2 = document.getElementById('screen-gameover');
			if (goScreen2 && !goScreen2.classList.contains('hidden')) {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
		};
		// 每500ms检查一次
		this._goInterval = setInterval(() => {
			checkGameOver();
			// 如果检测到了，等2秒后重置标志，允许下次检测
			if (this._gameOverDetected) {
				setTimeout(() => { this._gameOverDetected = false; }, 2000);
			}
		}, 500);
	},
	requestRevive(callback) {
		this._reviveCallback = callback || null;
		const el = document.getElementById('interstitialAd');
		if (!el) { if (callback) callback(); return; }
		const s2 = document.createElement('script');
		s2.src = 'https://pl29544742.effectivecpmnetwork.com/be/a9/6d/bea96d779c0ee07c2b15613852dd3e70.js';
		s2.async = true;
		document.getElementById('interstitialAdSlot').innerHTML = '';
		document.getElementById('interstitialAdSlot').appendChild(s2);
		el.style.display = 'flex'; el.style.pointerEvents = 'auto';

		setTimeout(() => { const slot = document.getElementById('interstitialAdSlot'); if (slot && slot.innerHTML.includes('加载中')) { slot.innerHTML = '<div style=color:#aaa;font:13px Microsoft YaHei,sans-serif>广告暂时无法加载<br>点击下方按钮继续</div>'; } }, 3000);
		const skipBtn = document.getElementById('skipInterstitial');
		if (skipBtn) {
			skipBtn.textContent = '5 秒后可跳过'; skipBtn.disabled = true;
			let cd = 5;
			const timer = setInterval(() => {
				cd--;
				if (cd <= 0) { clearInterval(timer); skipBtn.textContent = '跳过广告 ▶'; skipBtn.disabled = false; }
				else { skipBtn.textContent = cd + ' 秒后可跳过'; }
			}, 1000);
		}
	},
	onGameOver() {
		this._deathCount++;
		if (!this.interstitial.enabled) return;
		if (this._deathCount < this.interstitial.gameCount) return;
		if (Date.now() - this._lastInterTime < this.interstitial.cooldownMs) return;
		this._lastInterTime = Date.now(); this._deathCount = 0;
		this.requestRevive(null);
	},
};
GameMonetize.init();
