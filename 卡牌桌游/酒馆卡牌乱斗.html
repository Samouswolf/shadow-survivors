function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function rollMinions(tier,n){
    const pool=MINIONS.filter(m=>m.tier<=tier);
    const wPool=[];
    pool.forEach(m=>{
        const w=Math.max(1,7-m.tier);
        for(let i=0;i<w;i++)wPool.push(m);
    });
    const result=[];
    for(let i=0;i<n;i++){
        if(wPool.length===0)break;
        result.push({...wPool[Math.floor(Math.random()*wPool.length)]});
    }
    return result;
}
function mkCard(tpl,extra){
    return{
        ...tpl,
        ...extra,
        uid:'t'+Math.random().toString(36).slice(2,9),
        curAtk:tpl.atk,
        curHp:tpl.hp,
        maxHp:tpl.hp,
        taunt:tpl.skillType==='taunt'||tpl.skillType==='divine_taunt'||tpl.skillType==='aura_taunt'||tpl.skillType==='divine_taunt_death',
        divine:tpl.skillType==='divine'||tpl.skillType==='divine_taunt'||tpl.skillType==='divine_windfury'||tpl.skillType==='divine_taunt_death',
        poison:tpl.skillType==='poison',
        charge:tpl.skillType==='charge',
        windfury:tpl.skillType==='divine_windfury',
        summoned:false,
        attacksThisTurn:0,
        dead:false,
        gold:(tpl.price||3),
        inTavern:true
    };
}
function refreshTavern(keepFreeze){
    if(!keepFreeze||!G.freeze){

}
let particles=[];
function spawnParticles(x,y,color,count){count=count||12;for(let i=0;i<count;i++)particles.push({x,y,vx:(Math.random()-0.5)*8,vy:(Math.random()-0.5)*8-3,life:35+Math.random()*20,maxLife:55,size:2+Math.random()*4,color,gravity:0.2});}
function updateParticles(){for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;if(p.gravity)p.vy+=p.gravity;p.vx*=0.98;p.life--;if(p.life<=0)particles.splice(i,1);}}
function drawParticles(ctx){for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.maxLife);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;}
let bgParticles=[];
function initBgParticles(){
    bgParticles=[];
    for(let i=0;i<55;i++){
        bgParticles.push({
            x:Math.random()*W,
            y:Math.random()*H,
            vy:0.15+Math.random()*0.35,
            size:1+Math.random()*2.5,
            hue:30+Math.random()*25,
            alpha:0.04+Math.random()*0.08,
            phase:Math.random()*Math.PI*2
        });
    }
}
function updateBgParticles(){
    const t=Date.now()/1000;
    for(const p of bgParticles){
        p.y-=p.vy;
        p.x+=Math.sin(t+p.phase)*0.2;
        if(p.y<-5){p.y=H+5;p.x=Math.random()*W;}
    }
}
function drawBgParticles(ctx){
    const t=Date.now()/800;
    for(const p of bgParticles){
        ctx.globalAlpha=p.alpha*(0.7+0.3*Math.sin(t+p.phase));
        ctx.fillStyle=`hsl(${p.hue},90%,60%)`;
        ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
}
initBgParticles();
let floats=[];
function addFloat(x,y,t,c){floats.push({x,y,text:t,color:c||'#fff',life:60,maxLife:60,vy:-1.5});}
function updateFloats(){for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.y+=f.vy;f.vy*=0.96;f.life--;if(f.life<=0)floats.splice(i,1);}}

function roundRect(ctx,x,y,w,h,r,fill,stroke){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();if(fill)ctx.fill();if(stroke!==false)ctx.stroke();}
function tierColor(t){return['#9e9e9e','#9e9e9e','#4caf50','#2196f3','#9c27b0','#ff9800','#e53935'][t]||'#9e9e9e';}
function drawMinion(ctx,m,x,y,w,h,selected,mode){

        ctx.fillStyle=grd;roundRect(ctx,x-1,y-1,w+2,h+2,mode==='tavern'?9:8,true,false);
        ctx.restore();
    }
    const g=ctx.createLinearGradient(x,y,x,y+h);
    g.addColorStop(0,m.col||tcol);g.addColorStop(0.55,'#2a1810');g.addColorStop(1,'#1a0e08');
    ctx.fillStyle=g;roundRect(ctx,x,y,w,h,mode==='tavern'?8:7,true,false);
    const isSel=selected||G.hoverCard===m.uid;
    if(isSel){ctx.strokeStyle='#ffd700';ctx.lineWidth=3;ctx.shadowColor='#ffd700';ctx.shadowBlur=12;}
    else{ctx.strokeStyle=tcol;ctx.lineWidth=2;}

    if(m.golden){ctx.fillStyle='#ffd700';ctx.font='bold 10px Arial';ctx.fillText('★',x+w-14,y+13);}

    const es=Math.min(26,w*0.4);ctx.font=es+'px Arial';ctx.textAlign='center';
    if(m.golden){ctx.save();ctx.shadowColor='#ffd700';ctx.shadowBlur=6;}
    ctx.fillText(m.emoji,x+w/2,y+h*0.38);
    if(m.golden)ctx.restore();
    ctx.textAlign='left';
    ctx.fillStyle=m.golden?'#fff176':'#fff';ctx.font='bold '+Math.min(mode==='tavern'?10:9,w*0.14)+'px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.fillText(m.name.length>5?m.name.slice(0,5):m.name,x+w/2,y+h*0.6);
    if(m.skill){
        ctx.font=(mode==='tavern'?8:7)+'px "Microsoft YaHei"';
        ctx.fillStyle='rgba(255,255,255,0.85)';
        const sk=m.skill.length>8?m.skill.slice(0,8)+'..':m.skill;
        ctx.fillText(sk,x+w/2,y+h*0.73);
    }
    if(m.tribe&&m.tribe!=='无'){
        ctx.fillStyle='rgba(255,255,255,0.45)';
        ctx.font='bold 7px Arial';
        ctx.fillText(m.tribe,x+w/2,y+h*0.83);
    }
    ctx.textAlign='left';
    if(m.curAtk!==undefined){
        const atkY=y+h-10;
        ctx.fillStyle=(m.curAtk>m.atk&&!m.golden)?'#ffeb3b':(m.golden?'#ffd700':'#f44336');ctx.beginPath();ctx.arc(x+11,atkY,8.5,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
        ctx.fillStyle='#000';ctx.font='bold 11px Arial';ctx.textAlign='center';

            const picked=arr.slice(0,3);
            const tpl=MINIONS.find(m=>m.name===name)||picked[0];
            const mergedCard=mkCard(tpl,{inTavern:false});
            mergedCard.curAtk=tpl.atk*2;mergedCard.atk=mergedCard.curAtk;

    G.goldPerRound=10+Math.min(5,Math.floor(G.round/3));

function runBattle(){
    G.animating=true;
    let pTurn=G.board.length>0&&(G.board.length>=G.oppBoard.length||Math.random()<0.5);
    let step=0;
    const maxSteps=100;
    function fightStep(){
        if(step++>maxSteps||G.board.length===0||G.oppBoard.length===0){
            endBattleCalc();return;
        }
        const atkBoard=pTurn?G.board:G.oppBoard;
        const defBoard=pTurn?G.oppBoard:G.board;
        if(atkBoard.length===0){pTurn=!pTurn;fightStep();return;}
        const atkIdx=0;
        const attacker=atkBoard[atkIdx];
        if(attacker.attacksThisTurn>=2){
            atkBoard.splice(atkIdx,1);atkBoard.push(attacker);attacker.attacksThisTurn=0;
            pTurn=!pTurn;setTimeout(fightStep,350);return;
        }
        let target;
        const taunts=defBoard.filter(c=>c.taunt);
        if(taunts.length>0)target=taunts[0];
        else if(defBoard.length>0)target=defBoard[Math.floor(Math.random()*defBoard.length)];
        if(target){
            minionAttack(attacker,target,pTurn?'player':'opp');
        }else{
            if(pTurn)G.oppLife-=Math.max(1,attacker.curAtk);
            else G.life-=Math.max(1,attacker.curAtk);
            G.shake=8;G.flash=10;G.flashColor='#ff3333';sfxHit();
        }
        attacker.attacksThisTurn=(attacker.attacksThisTurn||0)+1;
        if(!attacker.windfury||attacker.attacksThisTurn>=2){
            atkBoard.splice(atkIdx,1);atkBoard.push(attacker);attacker.attacksThisTurn=0;
        }
        if(G.life<=0||G.oppLife<=0){endBattleCalc();return;}
        pTurn=!pTurn;
        setTimeout(fightStep,attacker.windfury?180:350);
    }
    setTimeout(fightStep,500);
}
function minionAttack(a,d,who){
    const atkSide=who==='player'?G.board:G.oppBoard;
    const defSide=who==='player'?G.oppBoard:G.board;
    let aAtk=a.curAtk,dAtk=d.curAtk;
    const aWasDead=a.curHp<=0,dWasDead=d.curHp<=0;
    if(a.divine){
        if(dAtk>0){a.divine=false;spawnParticles(W/2,who==='player'?H-230:180,'#fdd835',15);}
    }else{
        const dmg=Math.max(0,dAtk);
        if(a.poison&&dAtk>0)a.curHp=0;
        else{a.curHp-=dmg;if(dmg>0)addFloat(posOf(a,who==='player'),who==='player'?H-230:180,'-'+dmg,'#ff6b6b');}
    }
    if(d.divine){
        if(aAtk>0){d.divine=false;spawnParticles(W/2,who==='player'?180:H-230,'#fdd835',15);}
    }else{
        const dmg=Math.max(0,aAtk);
        if(a.poison&&aAtk>0)d.curHp=0;
        else{d.curHp-=dmg;if(dmg>0)addFloat(posOf(d,who!=='player'),who==='player'?180:H-230,'-'+dmg,'#ff6b6b');}
    }
    sfxFight();G.shake=6;
    spawnParticles(W/2,H/2,'#ff4444',12);
    if(a.curHp<=0&&!a.dead){
        a.dead=true;
        if(who==='opp'){G.totalKills=(G.totalKills||0)+1;Storage.save('tavern_kills',G.totalKills);}
        addLog((who==='player'?'我方':'敌方')+' ['+a.name+'] 阵亡',who==='player'?'player':'enemy');
        applyDeathrattle(a,who);
    }
    if(d.curHp<=0&&!d.dead){
        d.dead=true;
        if(who==='player'){G.totalKills=(G.totalKills||0)+1;Storage.save('tavern_kills',G.totalKills);}
        addLog((who==='player'?'敌方':'我方')+' ['+d.name+'] 被击杀',who==='player'?'enemy':'player');
        applyDeathrattle(d,who==='player'?'opp':'player');
    }
    G.board=G.board.filter(c=>!c.dead);
    G.oppBoard=G.oppBoard.filter(c=>!c.dead);
}

function startBattle(){
    if(G.board.length===0){G.life-=3;addFloat(W/2,H/2,'空场扣3血!','#ff6b6b');}
    G.oppBoard=[];
    const tier=Math.min(6,G.level+1);
    const n=Math.min(7,3+Math.floor(G.round/3));
    const oppB=G.oppBuff||0;
    for(let i=0;i<n;i++){
        const pool=MINIONS.filter(m=>m.tier<=tier);
        const tpl=pool[Math.floor(Math.random()*pool.length)];
        const c=mkCard(tpl,{inTavern:false});
        c.curAtk+=Math.floor(G.round/4)+Math.floor(tpl.atk*oppB);c.atk=c.curAtk;
        c.curHp+=Math.floor(G.round/3)+Math.floor(tpl.hp*oppB);c.maxHp=c.curHp;
        c.summoned=true;
        G.oppBoard.push(c);
    }
    G.oppLife=20+G.round*3;
    addLog('===== 第'+G.round+'回合战斗开始 敌方'+n+'个随从 =====','system');
    applyTribeBuffs('player');applyTribeBuffs('opp');
    G.battleState='fighting';
    sfxFight();G.shake=10;
    runBattle();
}
function endBattleCalc(){
    G.animating=false;
    let won=false;
    if(G.oppLife<=0&&G.life>0)won=true;
    else if(G.oppBoard.length===0&&G.board.length>0)won=true;
    else if(G.board.length===0&&G.oppBoard.length>0)won=false;
    else won=(G.life-G.oppLife)>=0;
    const dmg=Math.max(1,G.oppBoard.length+Math.floor(G.round/2));
    if(won){
        G.winStreak++;G.loseStreak=0;G.score+=100;
        G.wins=(G.wins||0)+1;Storage.save('tavern_wins',G.wins);
        if(G.round>=G.maxRound)G.bossKills=(G.bossKills||0)+1;
        if(G.winStreak>=3)G.gold+=1;
        addLog('战斗胜利! +100分 连胜:'+G.winStreak,'player');
        addFloat(W/2,H/2,'胜利! 🎉 +'+(100)+'分','#4caf50');
        sfxWin();
    }else{
        G.loseStreak++;G.winStreak=0;G.life-=dmg;
        addLog('战斗失败! -'+dmg+'❤️ 连败:'+G.loseStreak,'enemy');
        addFloat(W/2,H/2,'失败! -'+dmg+'❤️','#ff5252');
        sfxLose();
    }
    if(G.round>(G.maxTurns||0)){G.maxTurns=G.round;}
    saveStats();
    setTimeout(()=>{
        if(G.life<=0){endGame(false);return;}
        G.battleState=null;
        nextRound();
    },1200);
}
function endGame(won){
    G.state=STATE_OVER;
    G.score+=G.life*10+G.level*50+G.round*30;
    if(won)G.score+=500;
    if(G.score>G.highScore){G.highScore=G.score;Storage.save('tavern_high',G.highScore);}
    if(G.round>(G.maxTurns||0))G.maxTurns=G.round;
    addLog('===== 游戏结束 '+(won?'胜利!':'失败')+' 得分:'+G.score+' =====','system');
    saveStats();
    checkAchievements();
    if(won)sfxWin();else sfxLose();
}

function handlePointerDown(e){
    initAudio();const p=getPos(e);
    if(G.state===STATE_MENU){
        if(G.showCodex){
            if(hitBtn(p,'codexClose')){G.showCodex=false;sfxBtn();return;}
            if(hitBtn(p,'codexPrev')){G.codexPage=Math.max(0,G.codexPage-1);sfxBtn();return;}
            if(hitBtn(p,'codexNext')){
                const pool=G.codexTier===0?MINIONS:MINIONS.filter(m=>m.tier===G.codexTier);
                const tp=Math.max(1,Math.ceil(pool.length/10));
                G.codexPage=Math.min(tp-1,G.codexPage+1);sfxBtn();return;
            }
            if(G.codexTierBtns){for(const b of G.codexTierBtns){if(rectHit(p,b)){G.codexTier=b.id;G.codexPage=0;sfxBtn();return;}}}
            if(G.codexCards){for(const c of G.codexCards){if(rectHit(p,c)){G.codexHover=G.codexHover===c.m?null:c.m;sfxBtn();return;}}}
            return;
        }
        if(G.showAch){
            if(hitBtn(p,'achClose')){G.showAch=false;sfxBtn();return;}
            if(hitBtn(p,'achPrev')){G.achPage=Math.max(0,G.achPage-1);sfxBtn();return;}
            if(hitBtn(p,'achNext')){G.achPage=Math.min(Math.max(0,Math.ceil(ACHIEVEMENTS.length/5)-1),G.achPage+1);sfxBtn();return;}
            return;
        }
        if(G.diffBtns){
            for(const b of G.diffBtns){if(rectHit(p,b)){G.diff=b.id;Storage.save('tavern_diff',b.id);sfxBtn();return;}}
        }
        if(hitBtn(p,'codex')){G.showCodex=true;G.codexPage=0;sfxBtn();return;}
        if(hitBtn(p,'achBtn')){G.showAch=true;G.achPage=0;sfxBtn();return;}
        if(hitBtn(p,'start')){startGame();return;}
    }
    else if(G.state===STATE_OVER){if(hitBtn(p,'restart')){G.state=STATE_MENU;return;}if(hitBtn(p,'menu')){G.state=STATE_MENU;return;}}
    else if(G.state===STATE_PLAYING){
        if(G.battleState!=='fighting'){
            if(hitBtn(p,'reroll')){rerollTavern();return;}
            if(hitBtn(p,'freeze')){toggleFreeze();return;}
            if(hitBtn(p,'upgrade')){upgradeTavern();return;}
            if(hitBtn(p,'battle')){startBattle();return;}
            const trs=tavernRects();
            for(let i=0;i<trs.length;i++){if(rectHit(p,trs[i])&&!trs[i].card.sold){buyTavern(i);return;}}
            const hrs=handRects();
            for(let i=0;i<hrs.length;i++){
                if(rectHit(p,hrs[i])){
                    if(G.selectedCard==='h'+i){playFromHand(i);G.selectedCard=null;}
                    else{G.selectedCard='h'+i;sfxBtn();}
                    return;
                }
            }
            const brs=boardRects(true);
            for(let i=0;i<brs.length;i++){
                if(rectHit(p,brs[i])){sellBoard(i);G.selectedCard=null;return;}
            }
            G.selectedCard=null;
        }
    }
}
function handlePointerMove(e){

}

function applyTribeBuffs(who){
    const me=who==='player'?G.board:G.oppBoard;
    if(!me||me.length===0)return;
    const tribeCounts={};
    for(const c of me){if(c.tribe&&TRIBE_BUFFS[c.tribe])tribeCounts[c.tribe]=(tribeCounts[c.tribe]||0)+1;}
    for(const c of me){
        if(!c._baseAtk){c._baseAtk=c.atk;c._baseHp=c.maxHp;}
        c.atk=c._baseAtk;c.maxHp=c._baseHp;c.curAtk=c.atk;c.curHp=Math.min(c.curHp,c.maxHp);
    }
    for(const tribe in tribeCounts){
        const cnt=tribeCounts[tribe];
        if(cnt>=2){
            const b=TRIBE_BUFFS[tribe];
            for(const c of me){
                if(c.tribe===tribe){
                    c.atk+=b.atk;c.maxHp+=b.hp;c.curAtk=c.atk;
                    if(c.curHp===c._baseHp)c.curHp=c.maxHp;
                }
            }
        }
    }
}
