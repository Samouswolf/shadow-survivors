function nextBoss(){
    G.stage++;

    else if(G.boss.sk==='末日'&&r<0.35)G.bossIntent=6;
    else if(G.boss.sk==='湮灭'&&r<0.4)G.bossIntent=6;

function applyBattlecry(c){
    switch(c.st){
        case 'draw':for(let i=0;i<c.v;i++)drawCard();sfxSkill();break;
        case 'draw_shield':for(let i=0;i<2;i++)drawCard();G.shield+=3;sfxSkill();addFloat(W/2,H-290,'🛡️+3','#4fc3f7');break;
        case 'draw_atk':for(let i=0;i<c.v;i++)drawCard();c.curAtk+=c.v;c.baseAtk+=c.v;sfxSkill();break;
        case 'gold':G.energy=Math.min(G.maxEnergy,G.energy+c.v);addFloat(W/2,H-290,'⚡+'+c.v,'#ffd700');break;
        case 'enemy':damageBoss(c.v);break;
        case 'enemy3':for(let i=0;i<3;i++)damageBoss(c.v);sfxSkill();G.glitchT=Math.max(G.glitchT,10);break;
        case 'aoe':damageBoss(c.v);sfxLaser();G.shake=6;break;
        case 'heal_all':G.hp=Math.min(G.maxHp,G.hp+c.v);G.board.forEach(m=>{m.curHp=Math.min(m.maxHp,m.curHp+c.v);});sfxHeal();addFloat(W/2,H-290,'❤️+'+c.v,'#4caf50');break;
        case 'summon':for(let i=0;i<c.v;i++){
            if(G.board.length<G.maxBoard){
                const tk=makeCard({n:'节点',e:'✨',c:c.c,type:c.type,t:1,atk:1,hp:1,dmg:0,sk:'',st:'n',v:0,cost:0,desc:''});
                tk.curAtk=1;tk.curHp=1;tk.maxHp=1;tk.baseAtk=1;
                G.board.push(tk);tk.onBoard=true;
            }}sfxNeon();break;
        case 'shield':case 't_shield':G.shield+=c.v;addFloat(W/2,H-290,'🛡️+'+c.v,'#4fc3f7');sfxHeal();break;
        case 'control':for(let i=0;i<4;i++)drawCard();damageBoss(c.v);G.shield+=3;sfxSkill();break;
        case 'ult':{

function bossTurn(){

function roundRect(ctx,x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}

function updateParticles(){for(let i=G.particles.length-1;i>=0;i--){const p=G.particles[i];p.x+=p.vx;p.y+=p.vy;if(p.gravity)p.vy+=p.gravity;p.vx*=0.98;p.life--;if(p.life<=0)G.particles.splice(i,1);}}
function drawParticles(ctx){for(const p of G.particles){ctx.globalAlpha=Math.max(0,p.life/p.maxLife);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;}
function addFloat(x,y,t,c){G.floats.push({x,y,text:t,color:c||'#fff',life:60,maxLife:60,vy:-1.6});}
function updateFloats(){for(let i=G.floats.length-1;i>=0;i--){const f=G.floats[i];f.y+=f.vy;f.vy*=0.96;f.life--;if(f.life<=0)G.floats.splice(i,1);}}
function drawFloats(ctx){for(const f of G.floats){ctx.globalAlpha=f.life/f.maxLife;ctx.fillStyle=f.color;ctx.strokeStyle='#000';ctx.lineWidth=3;ctx.font='bold 20px "Microsoft YaHei"';ctx.textAlign='center';ctx.strokeText(f.text,f.x,f.y);ctx.fillText(f.text,f.x,f.y);ctx.textAlign='left';}ctx.globalAlpha=1;}
function drawCard(ctx,m,x,y,w,h,selected,mode){

function getPos(e){const rect=canvas.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:(t.clientX-rect.left)/scale,y:(t.clientY-rect.top)/scale};}

function boardRects(){

    const w=58,h=80,gap=5;
    const w2=Math.min(w,(W-50-(n-1)*gap)/n);const aw=w2<w?w2:w;
    const total=n*aw+(n-1)*gap;let sx=(W-total)/2;
    const y=H-250;const rs=[];
    for(let i=0;i<n;i++)rs.push({x:sx+i*(aw+gap),y,w:aw,h,idx:i,card:G.board[i]});
    return rs;
}
function handRects(){
    const n=G.hand.length;if(n===0)return[];
    const w=70,h=104,gap=5;
    const w2=Math.min(w,(W-20-(n-1)*gap)/n);const aw=w2<w?w2:w;
    const total=n*aw+(n-1)*gap;let sx=(W-total)/2;
    const y=H-135;const rs=[];
    for(let i=0;i<n;i++){

        rs.push({x:sx+i*(aw+gap),y:isSel?y-20:y,w:aw,h,idx:i,card:G.hand[i]});

    const icons=[['🔍','黑入','#00bcd4'],['🤖','机甲','#546e7a'],['☠️','病毒','#76ff03'],['🧱','冰墙','#4fc3f7'],['🕳️','量子','#7c4dff'],['👑','王者','#ffd740']];
    for(let i=0;i<6;i++){
        const x=20+i%3*145,y=330+Math.floor(i/3)*85;
        const yy=y+Math.sin(Date.now()/700+i)*4;
        ctx.fillStyle='rgba(10,0,45,0.6)';roundRect(ctx,x,yy,135,75,10);ctx.fill();
        ctx.strokeStyle=icons[i][2];ctx.lineWidth=2;roundRect(ctx,x,yy,135,75,10);ctx.stroke();
        ctx.font='26px Arial';ctx.textAlign='center';ctx.fillText(icons[i][0],x+67,yy+32);
        ctx.fillStyle='#fff';ctx.font='bold 12px "Microsoft YaHei"';ctx.fillText(icons[i][1],x+67,yy+58);
        ctx.textAlign='left';
    }
    ctx.fillStyle='#ffd700';ctx.font='bold 17px "Microsoft YaHei"';ctx.textAlign='center';
    ctx.fillText('🏆 历史最高分: '+G.highScore,W/2,505);ctx.textAlign='left';
    const diffLbl=['简单','普通','困难','地狱'];const diffCol=['#4caf50','#2196f3','#ff9800','#f44336'];
    const diffDesc=['HP+5 回能+1','标准模式','HP-3 BOSS+15%','HP-7 BOSS+35% 12关'];
    G.diff=G.diff===undefined?1:G.diff;
    ctx.fillStyle='rgba(0,0,0,0.4)';roundRect(ctx,25,518,W-50,58,12);ctx.fill();
    ctx.strokeStyle=diffCol[G.diff];ctx.lineWidth=2;roundRect(ctx,25,518,W-50,58,12);ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold 14px "Microsoft YaHei"';ctx.textAlign='left';
    ctx.fillText('🎮 难度:',42,542);
    const dw=(W-170)/4;G.diffBtns=[];
    for(let i=0;i<4;i++){
        const bx=125+i*dw;
        ctx.fillStyle=G.diff===i?diffCol[i]:'rgba(255,255,255,0.08)';roundRect(ctx,bx,525,dw-8,44,8);ctx.fill();
        ctx.fillStyle=G.diff===i?'#fff':'#ccc';ctx.font='bold 13px "Microsoft YaHei"';ctx.textAlign='center';
        ctx.fillText(diffLbl[i],bx+(dw-8)/2,545);
        ctx.font='10px "Microsoft YaHei"';ctx.fillStyle=G.diff===i?'#fff9c4':'#888';
        ctx.fillText(diffDesc[i],bx+(dw-8)/2,563);
        G.diffBtns.push({x:bx,y:525,w:dw-8,h:44,id:i});
    }
    ctx.textAlign='left';
    drawBtn(ctx,W/2-110,590,220,60,'💾 连接网络','start','#6200ea');
    drawBtn(ctx,W/2-110,660,105,40,'🏆 成就','ach_menu','#6a1b9a');
    drawBtn(ctx,W/2+5,660,105,40,'📖 教程','tut_menu','#1565c0');
    ctx.fillStyle='rgba(200,220,255,0.85)';ctx.font='12.5px "Microsoft YaHei"';ctx.textAlign='center';
    const tips=['⚡能量:召唤卡牌消耗 · 每回合刷新','🌐 召唤卡牌到赛博空间 · 场上卡牌点攻击BOSS','🌆 10节点通关 · 最终对战天网AI','💥 越后期卡牌越强 · 打穿赛博空间称王!'];
    for(let i=0;i<tips.length;i++)ctx.fillText(tips[i],W/2,720+i*22);ctx.textAlign='left';
}
function drawGame(ctx){
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#02001a');g.addColorStop(0.5,'#1a0040');g.addColorStop(1,'#02001a');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    for(let i=0;i<50;i++){
        ctx.fillStyle=`rgba(${100+(i%120)},${80+(i%100)},255,${0.03+(i%9)/40})`;
        ctx.beginPath();ctx.arc((i*113)%W,(i*61)%(H*0.5),1+((i*7)%3)*0.5,0,Math.PI*2);ctx.fill();
    }
    drawGlitchBG();
    drawHUD(ctx);
    drawBoss(ctx);
    drawBoard(ctx);
    drawHand(ctx);
    drawBtn(ctx,W/2-100,H-368,200,40,'⏭️ 结束回合','endturn','#00695c',!!G.anim);
    if(G.selectedHand>=0)drawBtn(ctx,15,H-368,75,28,'📋 详情','detail_btn','#6a1b9a');
    drawParticles(ctx);drawFloats(ctx);
    if(G.selectedHand>=0){
        const c=G.hand[G.selectedHand];if(c){
            ctx.fillStyle='rgba(5,0,30,0.78)';roundRect(ctx,50,H-410,W-100,36,8);ctx.fill();
            ctx.strokeStyle='#b388ff';ctx.lineWidth=1;roundRect(ctx,50,H-410,W-100,36,8);ctx.stroke();
            ctx.fillStyle='#00e5ff';ctx.font='bold 11px "Microsoft YaHei"';ctx.textAlign='center';
            ctx.fillText(c.n+'['+c.type+'] · '+c.desc+' · 消耗⚡'+c.cost+' (再点加载)  能量:'+G.energy,W/2,H-387);
            ctx.textAlign='left';
        }
    }
}
function drawGameOver(ctx){
    const win=G.hp>0;
    const g=ctx.createLinearGradient(0,0,0,H);
    if(win){g.addColorStop(0,'#004d40');g.addColorStop(1,'#001a15');}
    else{g.addColorStop(0,'#3e0000');g.addColorStop(1,'#000000');}
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    for(let i=0;i<50;i++){
        ctx.fillStyle=win?`rgba(100,255,200,${0.04+(i%8)/40})`:`rgba(255,80,80,${0.04+(i%8)/40})`;
        ctx.beginPath();ctx.arc((i*97)%W,(i*53)%H,1.5+(i%3),0,Math.PI*2);ctx.fill();
    }
    if(!win)drawGlitchBG();
    ctx.fillStyle=win?'#ffd700':'#ff1744';ctx.font='bold 56px "Microsoft YaHei"';ctx.textAlign='center';
    ctx.fillText(win?'🏆 连接成功!':'💀 连接失败',W/2,150);ctx.textAlign='left';
    ctx.fillStyle='#fff';ctx.font='bold 20px "Microsoft YaHei"';ctx.textAlign='center';
    ctx.fillText('节点数: '+Math.min(G.stage,G.maxStage)+'/'+G.maxStage,W/2,218);
    ctx.fillText('最终能量: '+G.maxEnergy+'  剩余HP: '+Math.max(0,G.hp),W/2,250);
    ctx.fillStyle='#ffd700';ctx.fillText('最终得分: '+G.score,W/2,288);
    const rank=G.score>=2500?'S+':G.score>=1800?'S':G.score>=1200?'A':G.score>=700?'B':G.score>=300?'C':'D';
    const rankCol={'S+':'#ff1744','S':'#ff9800','A':'#ffd700','B':'#4caf50','C':'#2196f3','D':'#9e9e9e'};
    ctx.save();ctx.translate(W/2,355);const rt=Date.now()/300;
    ctx.shadowColor=rankCol[rank];ctx.shadowBlur=25+Math.sin(rt)*10;
    ctx.fillStyle=rankCol[rank];ctx.font='bold 78px Arial';ctx.textAlign='center';ctx.fillText(rank,0,12);
    ctx.restore();ctx.textAlign='center';
    ctx.font='bold 15px "Microsoft YaHei"';ctx.fillStyle='#fff';ctx.fillText('本局评级',W/2,410);
    if(G.score>=G.highScore){ctx.fillStyle='#ffd700';ctx.font='bold 18px "Microsoft YaHei"';ctx.fillText('🎉 新纪录! 🎉',W/2,440);}
    else{ctx.fillStyle='#ccc';ctx.font='16px "Microsoft YaHei"';ctx.fillText('历史最高: '+G.highScore,W/2,440);}
    const diffTxt=['简单模式','普通模式','困难模式','地狱模式'][G.diff||1];
    ctx.fillStyle='#aaa';ctx.font='13px "Microsoft YaHei"';ctx.fillText('难度: '+diffTxt+'  总伤害: '+(G._totalDmg||0),W/2,468);
    ctx.textAlign='left';
    drawBtn(ctx,W/2-100,485,200,56,'💾 重新连接','restart','#6200ea');
    drawBtn(ctx,W/2-100,552,95,40,'🏆 成就','ach_end','#6a1b9a');
    drawBtn(ctx,W/2+5,552,95,40,'断开连接','menu','#555');
    ctx.fillStyle='rgba(200,220,255,0.55)';ctx.font='12px "Microsoft YaHei"';ctx.textAlign='center';
    ctx.fillText('在霓虹灯下的赛博空间，等待你的下一次潜入...',W/2,625);ctx.textAlign='left';
}
function update(){
    updateBgParticles();
    updateParticles();updateFloats();
    if(G.shake>0)G.shake-=0.5;
    if(G.flash>0)G.flash--;
}
function draw(){
    ctx.save();
    if(G.shake>0)ctx.translate((Math.random()-0.5)*G.shake,(Math.random()-0.5)*G.shake);
    drawBgParticles(ctx);
    switch(G.state){
        case STATE_MENU:drawMenu(ctx);break;
        case STATE_PLAYING:drawGame(ctx);break;
        case STATE_OVER:drawGameOver(ctx);break;
        case STATE_PAUSE:drawGame(ctx);drawPauseMenu();break;
    }
    if(G.state===STATE_PLAYING||G.state===STATE_PAUSE){
        if(G.subState==='tutorial'||G.showTut)drawTutorial();
        else if(G.subState==='ach'||G.showAch)drawAchievements();
        else if(G.subState==='log'||G.showLog)drawBattleLog();
        if(G.showDetail)drawCardDetail();
    }
    if(G.flash>0){ctx.globalAlpha=G.flash/20;ctx.fillStyle=G.flashColor||'#aa2222';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
    ctx.restore();
    if(banner)drawBanner(ctx);
}
function handleSubUI(p){
    if(G.subState==='tutorial'||G.showTut){
        for(const b of (G.tutBtns||[]))if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){
            sfxBtn();
            if(b.id==='prev'){if(G.tutStep>0)G.tutStep--;else{G.showTut=false;G.subState=null;}}
            else if(b.id==='next'){if(G.tutStep<TUTORIAL_STEPS.length-1)G.tutStep++;else{G.showTut=false;G.subState=null;}}
            return true;
        }
        return true;
    }
    if(G.subState==='ach'||G.showAch){
        for(const b of (G.achBtns||[]))if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){
            sfxBtn();
            if(b.id==='prev')G.achPage=Math.max(0,(G.achPage||0)-1);
            else if(b.id==='next')G.achPage=Math.min(Math.ceil(ACHIEVEMENTS.length/6)-1,(G.achPage||0)+1);
            else if(b.id==='close'){G.showAch=false;G.subState=null;}
            return true;
        }
        return true;
    }
    if(G.subState==='log'||G.showLog){
        const b=G.logBtn;if(b&&p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){sfxBtn();G.showLog=false;G.subState=null;return true;}
        return true;
    }
    if(G.showDetail&&G.detailBtn){
        const b=G.detailBtn;if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){sfxBtn();G.showDetail=false;G.detailCard=null;return true;}
        return true;
    }
    return false;
}
function handlePauseBtns(p){
    for(const b of (G.pauseBtns||[]))if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){
        sfxBtn();
        if(b.id==='resume'){G.state=STATE_PLAYING;G.subState=null;}
        else if(b.id==='tutorial'){G.tutStep=0;G.showTut=true;G.subState='tutorial';}
        else if(b.id==='ach'){G.achPage=0;G.showAch=true;G.subState='ach';}
        else if(b.id==='log'){G.showLog=true;G.subState='log';}
        else if(b.id==='restart'){G.state=STATE_MENU;}
        else if(b.id==='menu'){G.state=STATE_MENU;}
        return true;
    }
    return false;
}
function handlePointerDown(e){
    initAudio();const p=getPos(e);
    if((G.state===STATE_PLAYING||G.state===STATE_PAUSE)&&handleSubUI(p))return;
    if(G.state===STATE_PAUSE){handlePauseBtns(p);return;}
    if(G.state===STATE_MENU){
        if(G.diffBtns){
            for(const b of G.diffBtns){if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){G.diff=b.id;Storage.save('cyber_diff',b.id);sfxBtn();return;}}
        }
        if(hitBtn(p,'ach_menu')){G.achPage=0;G.showAch=true;G.subState='ach';G.state=STATE_PLAYING;setTimeout(()=>{G.state=STATE_MENU;},50);return;}
        if(hitBtn(p,'tut_menu')){G.tutStep=0;G.showTut=true;G.subState='tutorial';G.state=STATE_PLAYING;setTimeout(()=>{G.state=STATE_MENU;},50);return;}
        if(hitBtn(p,'start')){startGame();return;}
    }
    else if(G.state===STATE_OVER){if(hitBtn(p,'restart')){G.state=STATE_MENU;return;}if(hitBtn(p,'menu')){G.state=STATE_MENU;return;}if(hitBtn(p,'ach_end')){G.achPage=0;G.showAch=true;G.subState='ach';return;}}
    else if(G.state===STATE_PLAYING){
        if(hitBtn(p,'pause_btn')){togglePause();return;}
        if(hitBtn(p,'log_btn')){G.showLog=true;G.subState='log';return;}
        if(hitBtn(p,'ach_btn')){G.achPage=0;G.showAch=true;G.subState='ach';return;}
        if(hitBtn(p,'detail_btn')&&G.selectedHand>=0){G.detailCard=G.hand[G.selectedHand];G.showDetail=true;return;}
        if(hitBtn(p,'endturn')){bossTurn();return;}
        const hrs=handRects();
        for(let i=0;i<hrs.length;i++){
            if(rectHit(p,hrs[i])){
                if(G.selectedHand===i){playCard(i);G.selectedHand=-1;return;}
                else{G.selectedHand=i;sfxBtn();return;}
            }
        }
        const brs=boardRects();
        for(let i=0;i<brs.length;i++){
            if(rectHit(p,brs[i])){
                const m=brs[i].card;
                if(!G.anim&&m.canAttack&&m.attacksThisTurn<(m.wind?2:1)){attackBossWithMinion(i);return;}
                else{G.detailCard=m;G.showDetail=true;return;}
            }
        }
        G.selectedHand=-1;
    }
}
function handlePointerMove(e){
    const p=getPos(e);G.hover=null;
    if(G.state!==STATE_PLAYING)return;
    const hrs=handRects();for(const r of hrs)if(rectHit(p,r)){G.hover=r.card.uid;return;}
    const brs=boardRects();for(const r of brs)if(rectHit(p,r)){G.hover=r.card.uid;return;}
}
canvas.addEventListener('mousedown',handlePointerDown);
canvas.addEventListener('mousemove',handlePointerMove);
canvas.addEventListener('touchstart',e=>{e.preventDefault();handlePointerDown(e);},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();handlePointerMove(e);},{passive:false});
canvas.addEventListener('touchend',e=>{e.preventDefault();},{passive:false});
function gameLoop(){requestAnimationFrame(gameLoop);update();draw();}
gameLoop();
})();
</script>

<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>

    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
