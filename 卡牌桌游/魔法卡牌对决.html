function initAudio(){

function playTone(freq,dur,type,vol){
    if(!audioCtx)return;
    try{
        const o=audioCtx.createOscillator();
        const g=audioCtx.createGain();
        o.type=type||'square';
        o.frequency.value=freq;
        g.gain.value=vol||0.15;
        g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
        o.connect(g);g.connect(audioCtx.destination);
        o.start();o.stop(audioCtx.currentTime+dur);
    }catch(e){}
}

function cardRarity(r){
    if(r==='SSR')return{col:'#ffd700',name:'SSR',weight:5};
    if(r==='SR')return{col:'#a855f7',name:'SR',weight:15};
    if(r==='R')return{col:'#3b82f6',name:'R',weight:35};
    return{col:'#9ca3af',name:'N',weight:45};
}

function makeCard(tpl){
    const r=cardRarity(tpl.rar||'N');
    return{
        ...tpl,
        rarity:tpl.rar||'N',
        rarityCol:r.col,
        uid:'m'+Math.random().toString(36).slice(2,10),
        curAtk:tpl.atk,
        curHp:tpl.hp,
        maxHp:tpl.hp,
        canAttack:false,
        hasAttacked:false,
        armor:0,
        stealth:false,
        shielded:false,
        frozen:0,
        buffAtk:0,
        taunt:tpl.skillType==='taunt',
        summoned:false,
        dead:false
    };
}

let particles=[];
function spawnParticles(x,y,color,count){
    count=count||15;
    for(let i=0;i<count;i++){
        particles.push({
            x:x,y:y,
            vx:(Math.random()-0.5)*9,
            vy:(Math.random()-0.5)*9-3,
            life:40+Math.random()*20,maxLife:60,
            size:2+Math.random()*4,
            color:color,
            gravity:0.2
        });
    }
}
function updateParticles(){
    for(let i=particles.length-1;i>=0;i--){
        const p=particles[i];
        p.x+=p.vx;p.y+=p.vy;
        if(p.gravity)p.vy+=p.gravity;
        p.vx*=0.98;p.life--;
        if(p.life<=0)particles.splice(i,1);
    }
}
function drawParticles(ctx){
    for(const p of particles){
        ctx.globalAlpha=Math.max(0,p.life/p.maxLife);
        ctx.fillStyle=p.color;
        ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
}

let spells=[];
function spawnSpellAnim(type,x,y){
    spells.push({type:type,x:x,y:y,t:0,maxT:40});
}
function updateSpells(){
    for(let i=spells.length-1;i>=0;i--){
        spells[i].t++;
        if(spells[i].t>=spells[i].maxT)spells.splice(i,1);
    }
}
function drawSpells(ctx){
    for(const s of spells){
        const p=s.t/s.maxT;
        ctx.save();ctx.globalAlpha=1-p;
        if(s.type==='fire'){
            ctx.fillStyle=`rgba(255,${100+Math.floor(p*100)},0,${1-p})`;
            for(let i=0;i<8;i++){
                const a=i/8*Math.PI*2;
                const r=10+p*50;
                ctx.beginPath();ctx.arc(s.x+Math.cos(a)*r,s.y+Math.sin(a)*r,6*(1-p),0,Math.PI*2);ctx.fill();
            }
        }else if(s.type==='water'){
            ctx.strokeStyle=`rgba(30,136,229,${1-p})`;ctx.lineWidth=3;
            for(let i=0;i<4;i++){
                ctx.beginPath();ctx.arc(s.x,s.y,10+p*40+i*5,0,Math.PI*2);ctx.stroke();
            }
        }else if(s.type==='heal'){
            ctx.fillStyle=`rgba(100,255,150,${1-p})`;
            ctx.font=`${24+p*30}px Arial`;ctx.textAlign='center';
            ctx.fillText('💚',s.x,s.y-p*40);
        }else if(s.type==='arcane'){
            ctx.strokeStyle=`rgba(142,36,170,${1-p})`;ctx.lineWidth=2+p*3;
            for(let i=0;i<6;i++){
                const a=p*Math.PI*2+i/6*Math.PI*2;
                const r=20+p*30;
                ctx.beginPath();ctx.arc(s.x+Math.cos(a)*r,s.y+Math.sin(a)*r,5,0,Math.PI*2);ctx.stroke();
            }
        }else{
            ctx.fillStyle=`rgba(255,255,255,${1-p})`;
            ctx.beginPath();ctx.arc(s.x,s.y,5+p*40,0,Math.PI*2);ctx.fill();
        }
        ctx.globalAlpha=1;ctx.restore();
    }
}

let floatTexts=[];
function addFloatText(x,y,text,color){
    floatTexts.push({x:x,y:y,text:text,color:color||'#fff',life:60,maxLife:60,vy:-1.6});
}
function updateFloatTexts(){
    for(let i=floatTexts.length-1;i>=0;i--){
        const f=floatTexts[i];
        f.y+=f.vy;f.vy*=0.96;f.life--;
        if(f.life<=0)floatTexts.splice(i,1);
    }
}
function drawFloatTexts(ctx){
    for(const f of floatTexts){
        ctx.globalAlpha=f.life/f.maxLife;
        ctx.fillStyle=f.color;ctx.strokeStyle='#000';ctx.lineWidth=3;
        ctx.font='bold 22px "Microsoft YaHei"';ctx.textAlign='center';
        ctx.strokeText(f.text,f.x,f.y);ctx.fillText(f.text,f.x,f.y);
        ctx.textAlign='left';
    }
    ctx.globalAlpha=1;
}

function shuffle(a){
    for(let i=a.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [a[i],a[j]]=[a[j],a[i]];

}

function getRandomCard(){
    const allR=N=>Array.from({length:N},(_,i)=>i+1).reduce((a,v)=>a+=v,0);
    const total=allR(5);
    let r=Math.random()*total,acc=0;
    for(let i=5;i>=1;i--){acc+=i;if(r<=acc){const rar=['SSR','SR','R','N','N'][5-i];const pool=CARD_POOL.filter(c=>(c.rar||'N')===rar);if(pool.length>0)return pool[Math.floor(Math.random()*pool.length)]}}
    return CARD_POOL[Math.floor(Math.random()*CARD_POOL.length)];
}

function buildDeck(){
    const deck=[];
    for(let i=0;i<30;i++){
        deck.push(makeCard(getRandomCard()));
    }
    return shuffle(deck);
}

function drawCard(n,who){
    n=n||1;who=who||'p';
    for(let i=0;i<n;i++){
        if(who==='p'){
            if(G.playerDeck.length>0&&G.playerHand.length<8){
                const c=G.playerDeck.pop();
                G.playerHand.push(c);sfxMana();
            }
        }
    }
}

function roundRect(ctx,x,y,w,h,r){
    r=Math.min(r,w/2,h/2);
    ctx.beginPath();
    ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

function drawRarityGem(ctx,x,y,rarCol,size){
    size=size||6;
    ctx.fillStyle=rarCol;
    ctx.save();ctx.translate(x,y);ctx.rotate(Math.PI/4);
    ctx.fillRect(-size/2,-size/2,size,size);
    ctx.strokeStyle='#fff';ctx.lineWidth=0.8;
    ctx.strokeRect(-size/2,-size/2,size,size);
    ctx.restore();
}

function drawCardView(ctx,c,x,y,w,h,selected,faceDown){
    h=h||102;w=w||68;
    if(faceDown){
        const g=ctx.createLinearGradient(x,y,x+w,y+h);
        g.addColorStop(0,'#4a148c');g.addColorStop(0.5,'#7b1fa2');g.addColorStop(1,'#4a148c');
        ctx.fillStyle=g;roundRect(ctx,x,y,w,h,7);ctx.fill();
        ctx.strokeStyle='#ffd700';ctx.lineWidth=2;roundRect(ctx,x,y,w,h,7);ctx.stroke();
        ctx.fillStyle='rgba(255,215,0,0.4)';ctx.font='22px Arial';ctx.textAlign='center';
        ctx.fillText('✦',x+w/2,y+h/2+2);ctx.textAlign='left';
        return;
    }
    const col=ELEMENTS[c.el]||'#555';
    const g=ctx.createLinearGradient(x,y,x,y+h);
    g.addColorStop(0,col);g.addColorStop(0.55,'#1a1a2e');g.addColorStop(1,'#0a0a20');
    ctx.fillStyle=g;roundRect(ctx,x,y,w,h,7);ctx.fill();
    const isSel=selected||G.hoverCard===c.uid;
    ctx.strokeStyle=isSel?'#ffd700':(c.rarityCol||'rgba(255,255,255,0.4)');
    ctx.lineWidth=isSel?3:2;
    if(isSel){ctx.shadowColor='#ffd700';ctx.shadowBlur=14;}
    roundRect(ctx,x,y,w,h,7);ctx.stroke();ctx.shadowBlur=0;
    if(c.mana>=0||c.cost>=0){
        const cost=c.cost||c.mana||0;
        const grd=ctx.createRadialGradient(x+10,y+11,2,x+10,y+11,10);
        grd.addColorStop(0,'#4fc3f7');grd.addColorStop(1,'#01579b');
        ctx.fillStyle=grd;ctx.beginPath();ctx.arc(x+10,y+11,10,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
        ctx.fillStyle='#fff';ctx.font='bold 13px Arial';ctx.textAlign='center';
        ctx.fillText(cost,x+10,y+15);ctx.textAlign='left';
    }
    drawRarityGem(ctx,x+w-10,y+10,c.rarityCol||'#888',7);
    const iconY=y+h*0.38;
    ctx.fillStyle='rgba(255,255,255,0.12)';
    roundRect(ctx,x+5,y+22,w-10,32,4);ctx.fill();
    const emSize=Math.min(28,w*0.38);
    ctx.font=emSize+'px Arial';ctx.textAlign='center';
    ctx.fillText(c.emoji,x+w/2,iconY+5);ctx.textAlign='left';
    ctx.fillStyle='#fff';ctx.font='bold '+Math.min(10,w*0.14)+'px "Microsoft YaHei"';
    ctx.textAlign='center';
    ctx.fillText(c.name.length>5?c.name.slice(0,5):c.name,x+w/2,y+h*0.62);
    ctx.textAlign='left';
    ctx.font='8px "Microsoft YaHei"';
    ctx.fillStyle='rgba(255,255,255,0.85)';
    ctx.textAlign='center';
    const sk=c.skill||'';
    const lines=[];
    if(sk.length>10){lines.push(sk.slice(0,10));lines.push(sk.slice(10,20)+(sk.length>20?'..':''));}
    else lines.push(sk);
    for(let li=0;li<Math.min(lines.length,2);li++){
        ctx.fillText(lines[li],x+w/2,y+h*0.73+li*10);
    }
    ctx.textAlign='left';
    if(!c.type||c.type!=='spell'){
        const atkY=y+h-12;
        ctx.fillStyle='#f44336';ctx.beginPath();ctx.arc(x+12,atkY,9,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.stroke();
        ctx.fillStyle='#fff';ctx.font='bold 11px Arial';ctx.textAlign='center';
        ctx.fillText(c.curAtk||c.atk,x+12,atkY+4);
        ctx.fillStyle=c.curHp<c.maxHp?'#ffeb3b':'#4caf50';
        ctx.beginPath();ctx.arc(x+w-12,atkY,9,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.stroke();
        ctx.fillStyle='#fff';ctx.fillText(c.curHp||c.hp,x+w-12,atkY+4);
        ctx.textAlign='left';
    }else{
        ctx.fillStyle='#ffd700';ctx.font='bold 9px "Microsoft YaHei"';ctx.textAlign='center';
        ctx.fillText('法术',x+w/2,y+h-10);ctx.textAlign='left';
    }
    if(c.armor>0){ctx.fillStyle='#90caf9';ctx.font='bold 9px Arial';ctx.fillText('🛡'+c.armor,x+2,y+h-28);}
    if(c.stealth){ctx.fillStyle='rgba(120,120,180,0.35)';roundRect(ctx,x,y,w,h,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='10px Arial';ctx.fillText('👁',x+w-16,y+26);}
    if(c.shielded){ctx.strokeStyle='#fdd835';ctx.lineWidth=2.5;ctx.setLineDash([3,3]);roundRect(ctx,x-2,y-2,w+4,h+4,9);ctx.stroke();ctx.setLineDash([]);}
    if(c.frozen>0){ctx.fillStyle='rgba(100,200,255,0.45)';roundRect(ctx,x,y,w,h,7);ctx.fill();ctx.font='14px Arial';ctx.textAlign='center';ctx.fillText('❄️',x+w/2,y+h/2-5);ctx.textAlign='left';}
    if(c.taunt){ctx.strokeStyle='#ffc107';ctx.lineWidth=3;roundRect(ctx,x-1,y-1,w+2,h+2,8);ctx.stroke();}
    if(!c.canAttack&&(!c.type||c.type!=='spell')&&!c.hasAttacked&&c.frozen<=0){
        ctx.fillStyle='rgba(0,0,0,0.4)';roundRect(ctx,x,y,w,h,7);ctx.fill();
    }
}

function drawBtn(ctx,x,y,w,h,text,name,color){
    G.btnRects[name]={x:x,y:y,w:w,h:h};
    const c=color||'#7b1fa2';
    const grad=ctx.createLinearGradient(x,y,x,y+h);
    grad.addColorStop(0,c);grad.addColorStop(1,'#000');
    ctx.fillStyle=grad;ctx.strokeStyle='#ffd700';ctx.lineWidth=2;
    roundRect(ctx,x,y,w,h,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold 15px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(text,x+w/2,y+h/2);
    ctx.textBaseline='alphabetic';ctx.textAlign='left';
}
function hitBtn(p,name){const r=G.btnRects[name];return r&&p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;}
function getPos(e){const rect=canvas.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:(t.clientX-rect.left)/scale,y:(t.clientY-rect.top)/scale};}
function rectHit(p,r){return p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;}

function cardRectsHand(){
    const rs=[],n=G.playerHand.length,gap=6;
    const tw=n*62+(n-1)*gap;let sx=(W-tw)/2;const y=H-142;
    for(let i=0;i<n;i++)rs.push({x:sx+i*(62+gap),y:y,w:62,h:102,idx:i,card:G.playerHand[i]});
    return rs;
}
function cardRectsPlayer(){
    const rs=[],n=G.playerField.length;if(n===0)return rs;
    const gap=6,cw=Math.min(64,(W-80-gap*(n-1))/n);
    const tw=n*cw+(n-1)*gap;let sx=(W-tw)/2;const y=H-290;
    for(let i=0;i<n;i++)rs.push({x:sx+i*(cw+gap),y:y,w:cw,h:94,idx:i,card:G.playerField[i]});
    return rs;
}
function cardRectsEnemy(){
    const rs=[],n=G.enemyField.length;if(n===0)return rs;
    const gap=6,cw=Math.min(64,(W-80-gap*(n-1))/n);
    const tw=n*cw+(n-1)*gap;let sx=(W-tw)/2;const y=160;
    for(let i=0;i<n;i++)rs.push({x:sx+i*(cw+gap),y:y,w:cw,h:94,idx:i,card:G.enemyField[i]});
    return rs;
}

function getSpellPow(who){
    if(who==='player'){
        let sp=G.spellPow;
        G.playerField.forEach(c=>{if(c.skillType==='spellpow')sp+=c.skillVal;});
        return sp;
    }
    return 0;
}

function useCard(card){
    if(!G.isPlayerTurn||G.animating)return;
    if((card.cost||0)>G.mana){addFloatText(W/2,H/2,'法力不足!','#ff6b6b');return false;}
    G.mana-=card.cost||0;
    G.playerHand=G.playerHand.filter(c=>c.uid!==card.uid);
    G.score+=(card.cost||0)*15;
    if(card.type==='spell'){
        executeSpell(card);
    }else{
        card.canAttack=false;card.hasAttacked=false;card.summoned=true;
        if(card.skillType==='charge')card.canAttack=true;
        if(card.skillType==='slow')card.frozen=2;
        G.playerField.push(card);
        sfxSummon();
        spawnParticles(W/2,H-250,ELEMENTS[card.el]||'#fff',18);
        executeBattlecry(card,'player');
    }
    checkGameOver();
    return true;
}

function executeSpell(card){
    sfxCast();
    spx=W/2;spy=H/2;
    let sp=getSpellPow('player');
    spawnSpellAnim(card.el||'arcane',W/2,H/2);
    G.shake=5;
    switch(card.skillType){
        case 'spelldmg':
            if(G.enemyField.length>0)dealDamage(G.enemyField[0],card.skillVal+sp,'enemy');
            else dealDamageToHero('enemy',card.skillVal+sp);
            break;
        case 'freezedmg':
            if(G.enemyField.length>0){
                const t=G.enemyField[0];
                t.frozen=2;dealDamage(t,card.skillVal+sp,'enemy');
            }else dealDamageToHero('enemy',card.skillVal+sp);
            break;
        case 'aoe':
            G.enemyField.forEach(c=>dealDamage(c,card.skillVal+sp,'enemy'));
            dealDamageToHero('enemy',Math.floor((card.skillVal+sp)/2));
            break;
        case 'draw':
            drawCard(card.skillVal,'p');
            break;
        case 'healhero':
            const h=Math.min(card.skillVal,G.playerMaxHp-G.playerHp);
            G.playerHp+=h;addFloatText(W/2,H-340,'+'+h,'#4caf50');sfxHeal();
            spawnSpellAnim('heal',W/2,H-340);
            break;
        case 'armor':
            G.playerArmor+=card.skillVal;
            addFloatText(W/2,H-340,'🛡+'+card.skillVal,'#90caf9');sfxHeal();
            break;
        case 'shield':
            if(G.playerField.length>0){
                G.playerField[0].shielded=true;
                addFloatText(W/2,H-250,'圣盾!','#fdd835');
            }
            break;
        case 'destroy':
            if(G.enemyField.length>0){
                const t=G.enemyField[Math.floor(Math.random()*G.enemyField.length)];
                t.curHp=0;killCard(t,'enemy');
            }
            break;
        case 'multirand':
            for(let i=0;i<card.skillVal;i++){
                if(G.enemyField.length>0&&Math.random()<0.6){
                    const t=G.enemyField[Math.floor(Math.random()*G.enemyField.length)];
                    dealDamage(t,1+sp,'enemy');
                }else{
                    dealDamageToHero('enemy',1+sp);
                }
            }
            break;
        case 'randdmg':
            for(let i=0;i<card.skillVal;i++){
                if(G.enemyField.length>0){
                    const t=G.enemyField[Math.floor(Math.random()*G.enemyField.length)];
                    dealDamage(t,1,'enemy');
                }
            }
            break;
        case 'dot':
            G.curseActive=true;G.dot=card.skillVal;
            addFloatText(W/2,100,'诅咒!','#6a1b9a');
            break;
        case 'managrowth':
            G.maxMana=Math.min(10,G.maxMana+card.skillVal);
            G.mana=Math.min(G.maxMana,G.mana+card.skillVal);
            addFloatText(W/2,H-40,'水晶+'+card.skillVal,'#2196f3');
            break;
        case 'summon':
            for(let i=0;i<card.skillVal;i++){
                if(G.playerField.length<7){
                    const tk=makeCard({name:'小兵',el:'arcane',cost:0,atk:1,hp:1,rar:'N',skill:'Token',emoji:'👤',skillType:'none',skillVal:0});
                    tk.canAttack=false;tk.summoned=true;G.playerField.push(tk);
                }
            }
            spawnParticles(W/2,H-250,'#ffd700',15);
            break;
        case 'summonsapling':
            if(G.playerField.length<7){
                const tk=makeCard({name:'树苗',el:'nature',cost:0,atk:2,hp:2,rar:'N',skill:'Token',emoji:'🌱',skillType:'none',skillVal:0});
                tk.canAttack=false;G.playerField.push(tk);
            }
            break;
        case 'summonwolves':
            for(let i=0;i<card.skillVal;i++){
                if(G.playerField.length<7){
                    const tk=makeCard({name:'狼',el:'nature',cost:0,atk:2,hp:2,rar:'N',skill:'Token',emoji:'🐺',skillType:'none',skillVal:0});
                    tk.canAttack=false;G.playerField.push(tk);
                }
            }
            break;
    }
    addFloatText(W/2,H/2-50,card.name,ELEMENTS[card.el]||'#fff');
}

function executeBattlecry(card,who){
    const oppSide=who==='player'?G.enemyField:G.playerField;
    switch(card.skillType){
        case 'aoe':
            oppSide.forEach(c=>dealDamage(c,card.skillVal,who==='player'?'enemy':'player'));
            break;
        case 'charge':
            card.canAttack=true;
            break;
        case 'heal':
            if(who==='player'){
                const hh=Math.min(card.skillVal,G.playerMaxHp-G.playerHp);
                G.playerHp+=hh;addFloatText(W/2,H-340,'+'+hh,'#4caf50');sfxHeal();
            }else{
                const hh=Math.min(card.skillVal,G.enemyMaxHp-G.enemyHp);
                G.enemyHp+=hh;
            }
            break;
        case 'selfheal':
            const sh=Math.min(card.skillVal,card.maxHp-card.curHp);
            card.curHp+=sh;break;
        case 'draw':
            if(who==='player')drawCard(card.skillVal,'p');
            break;
        case 'stealth':
            card.stealth=true;break;
        case 'regen':
            break;
        case 'freeze':
            if(oppSide.length>0){
                const t=oppSide[Math.floor(Math.random()*oppSide.length)];
                t.frozen=2;addFloatText(W/2+(who==='player'?0:0),who==='player'?180:H-220,'❄️冻','#29b6f6');
            }
            break;
        case 'pierce':
            break;
        case 'taunt':
            card.taunt=true;break;
    }
}

function dealDamage(target,amount,side){
    let dmg=amount;
    if(target.shielded){target.shielded=false;addFloatText(0,0,'圣盾!','#fdd835');sfxHeal();return;}
    if(target.armor>0){const a=Math.min(target.armor,dmg);target.armor-=a;dmg-=a;}
    target.curHp-=dmg;
    const rects=side==='player'?cardRectsPlayer():cardRectsEnemy();
    const r=rects.find(rr=>rr.card.uid===target.uid);
    const tx=r?r.x+r.w/2:W/2;const ty=r?r.y+r.h/2:(side==='player'?H-290:160);
    addFloatText(tx,ty,'-'+dmg,'#ff6b6b');
    sfxHit();spawnParticles(tx,ty,'#ff4444',12);
    G.shake=Math.max(G.shake,4);
    if(target.skillType==='burn'&&target.curHp>0){
        setTimeout(()=>{
            if(target.curHp>0){
                target.curHp-=target.skillVal;
                addFloatText(tx,ty-12,'-'+target.skillVal+'🔥','#ff9800');
                if(target.curHp<=0)killCard(target,side);
            }
        },300);
    }
    if(target.curHp<=0)killCard(target,side);
}

function dealDamageToHero(side,amount){
    let dmg=amount;
    if(side==='player'){
        if(G.playerArmor>0){const a=Math.min(G.playerArmor,dmg);G.playerArmor-=a;dmg-=a;}
        G.playerHp-=dmg;addFloatText(W/2,H-360,'-'+dmg,'#ff6b6b');
    }else{
        if(G.enemyArmor>0){const a=Math.min(G.enemyArmor,dmg);G.enemyArmor-=a;dmg-=a;}
        G.enemyHp-=dmg;addFloatText(W/2,100,'-'+dmg,'#ff6b6b');
    }
    sfxHit();G.shake=8;G.flash=10;G.flashColor='#ff3333';
}

function killCard(card,side){
    sfxHit();G.score+=side==='enemy'?25:0;
    const rects=side==='player'?cardRectsPlayer():cardRectsEnemy();
    const r=rects.find(rr=>rr.card.uid===card.uid);
    if(r)spawnParticles(r.x+r.w/2,r.y+r.h/2,ELEMENTS[card.el]||'#333',18);
    if(card.skillType==='rebirth'&&!card.summoned){
        setTimeout(()=>{
            const re=makeCard({...card,name:card.name+'+'});
            re.curAtk=3;re.curHp=3;re.maxHp=3;re.canAttack=false;re.summoned=true;
            re.skillType='none';re.skillVal=0;
            if(side==='player'&&G.playerField.length<7){G.playerField.push(re);}
            else if(side==='enemy'&&G.enemyField.length<7){G.enemyField.push(re);}
            sfxSummon();
        },200);
    }
    if(card.skillType==='deathspawn'){
        if(side==='player'&&G.playerField.length<7){
            const tk=makeCard({name:'碎晶',el:'earth',cost:0,atk:1,hp:1,rar:'N',skill:'',emoji:'💠',skillType:'none',skillVal:0});
            tk.canAttack=false;tk.summoned=true;G.playerField.push(tk);
        }
    }
    if(side==='player')G.playerField=G.playerField.filter(c=>c.uid!==card.uid);
    else G.enemyField=G.enemyField.filter(c=>c.uid!==card.uid);
    card.dead=true;G.graveyard.push(card);
}

function attackerCanHit(att,target,attSide){
    const oppSide=attSide==='player'?G.enemyField:G.playerField;
    const taunts=oppSide.filter(c=>c.taunt);
    if(taunts.length>0&&!target.taunt&&att.skillType!=='flying'&&att.skillType!=='ranged')return false;
    if(target.stealth){
        const others=oppSide.filter(c=>c.uid!==target.uid&&!c.stealth);
        if(others.length>0)return false;
    }
    return true;
}

function performAttack(att,target,attSide){
    if(!attackerCanHit(att,target,attSide)){addFloatText(W/2,H/2,'必须先攻击嘲讽!','#ffc107');return false;}
    if(att.stealth)att.stealth=false;
    let atkVal=att.curAtk+(att.buffAtk||0);
    const tSide=attSide==='player'?'enemy':'player';
    const pierce=att.skillType==='pierce';
    let overkill=0;
    if(!pierce){
        if(target.curHp<atkVal)overkill=atkVal-target.curHp;
        dealDamage(target,atkVal,tSide);
    }else{
        target.curHp-=atkVal;
        const rects=tSide==='player'?cardRectsPlayer():cardRectsEnemy();
        const r=rects.find(rr=>rr.card.uid===target.uid);
        if(r)addFloatText(r.x+r.w/2,r.y+r.h/2,'-'+atkVal+' 穿','#ff9800');
        if(target.curHp<=0)killCard(target,tSide);
    }
    if(att.skillType==='lifesteal'){
        const heal=Math.min(atkVal,attSide==='player'?G.playerMaxHp-G.playerHp:G.enemyMaxHp-G.enemyHp);
        if(attSide==='player'){G.playerHp+=heal;addFloatText(W/2,H-340,'+'+heal,'#4caf50');}
        else{G.enemyHp+=heal;}
    }
    if(overkill>0&&attSide==='player')dealDamageToHero('enemy',overkill);
    if(target.curHp>0&&target.faction!=='spell'){
        const ca=target.curAtk+(target.buffAtk||0);
        if(!att.stealth||attSide==='enemy')dealDamage(att,ca,attSide);
    }
    att.hasAttacked=true;att.canAttack=false;
    if(att.skillType==='double'&&att.curHp>0){att.hasAttacked=false;att.canAttack=true;}
    return true;
}

function attackHero(att,attSide){
    if(att.stealth)att.stealth=false;
    const oppSide=attSide==='player'?G.enemyField:G.playerField;
    const taunts=oppSide.filter(c=>c.taunt);
    if(taunts.length>0&&att.skillType!=='flying'&&att.skillType!=='ranged'){
        addFloatText(W/2,H/2,'必须先击败嘲讽!','#ffc107');return;
    }
    let atkVal=att.curAtk+(att.buffAtk||0);
    dealDamageToHero(attSide==='player'?'enemy':'player',atkVal);
    if(att.skillType==='lifesteal'){
        const heal=Math.min(atkVal,attSide==='player'?G.playerMaxHp-G.playerHp:G.enemyMaxHp-G.enemyHp);
        if(attSide==='player'){G.playerHp+=heal;addFloatText(W/2,H-340,'+'+heal,'#4caf50');}
        else G.enemyHp+=heal;
    }
    att.hasAttacked=true;att.canAttack=false;
    if(att.skillType==='double'&&att.curHp>0){att.hasAttacked=false;att.canAttack=true;}
}

function checkGameOver(){
    if(G.enemyHp<=0){
        G.state=STATE_OVER;G.score+=500+G.round*50;
        if(G.score>G.highScore){G.highScore=G.score;Storage.save('magic_high',G.highScore);}
        sfxWin();
    }else if(G.playerHp<=0){
        G.state=STATE_OVER;
        if(G.score>G.highScore){G.highScore=G.score;Storage.save('magic_high',G.highScore);}
        sfxLose();
    }
}

function startPlayerTurn(){
    G.isPlayerTurn=true;G.turn++;
    G.maxMana=Math.min(10,G.maxMana+1);G.mana=G.maxMana;
    G.playerField.forEach(c=>{
        if(c.frozen>0)c.frozen--;
        c.canAttack=(c.frozen<=0);c.hasAttacked=false;
        if(c.skillType==='regen'){
            const h=Math.min(c.skillVal,c.maxHp-c.curHp);
            c.curHp+=h;
            if(h>0){const rects=cardRectsPlayer();const r=rects.find(rr=>rr.card.uid===c.uid);if(r)addFloatText(r.x+r.w/2,r.y,'+'+h,'#4caf50');}
        }
        if(c.skillType==='buff'){
            G.playerField.forEach(cc=>{if(cc.uid!==c.uid)cc.buffAtk=(cc.buffAtk||0)+c.skillVal;});
        }
    });
    if(G.curseActive&&G.dot>0){
        dealDamageToHero('enemy',G.dot);
    }
    drawCard(1,'p');
}

function enemyTurn(){
    G.isPlayerTurn=false;G.animating=true;
    setTimeout(()=>{
        G.enemyMaxMana=Math.min(10,G.enemyMaxMana+1);G.enemyMana=G.enemyMaxMana;
        G.enemyField.forEach(c=>{if(c.frozen>0)c.frozen--;c.canAttack=(c.frozen<=0);c.hasAttacked=false;});
        const pool=CARD_POOL.filter(c=>!c.type||c.type!=='spell');
        let tries=0;
        while(G.enemyMana>0&&tries<5&&G.enemyField.length<6){
            const afford=pool.filter(c=>c.cost<=G.enemyMana);
            if(afford.length===0)break;
            const tpl=afford[Math.floor(Math.random()*afford.length)];
            G.enemyMana-=tpl.cost;
            const c=makeCard(tpl);
            const lvBonus=Math.floor(G.round/3);
            c.curAtk+=lvBonus;c.curHp+=lvBonus;c.maxHp=c.curHp;
            c.canAttack=false;c.summoned=true;
            if(c.skillType==='charge')c.canAttack=true;
            G.enemyField.push(c);sfxSummon();
            executeBattlecry(c,'enemy');
            tries++;
        }
        setTimeout(()=>enemyAttackPhase(),500);
    },400);
}

function enemyAttackPhase(){
    const attackers=G.enemyField.filter(c=>c.canAttack&&!c.hasAttacked);
    let idx=0;
    function nxt(){
        if(idx>=attackers.length){
            G.animating=false;
            G.round++;
            if(G.round>G.maxRound){
                G.playerHp=0;checkGameOver();
                return;
            }
            startPlayerTurn();return;
        }
        const atk=attackers[idx++];
        const valid=G.playerField.filter(t=>attackerCanHit(atk,t,'enemy'));
        if(valid.length>0&&Math.random()<0.65){
            const t=valid[Math.floor(Math.random()*valid.length)];
            performAttack(atk,t,'enemy');
        }else{
            attackHero(atk,'enemy');
        }
        checkGameOver();
        if(G.state===STATE_PLAYING)setTimeout(nxt,450);
    }
    nxt();
}

function endTurn(){
    if(!G.isPlayerTurn||G.animating)return;
    sfxBtn();G.selectedCard=null;G.selectedField=null;G.targetMode=false;
    enemyTurn();
}

function drawHp(ctx,x,y,w,hp,max,color,armor,label){
    ctx.fillStyle='rgba(0,0,0,0.65)';roundRect(ctx,x-2,y-2,w+4,20,5);ctx.fill();
    const rr=Math.max(0,hp/max);
    ctx.fillStyle=color;roundRect(ctx,x,y,w*rr,16,4);ctx.fill();
    ctx.strokeStyle='#ffd700';ctx.lineWidth=1;roundRect(ctx,x,y,w,16,4);ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold 12px "Microsoft YaHei"';
    ctx.textAlign='left';ctx.fillText(label,x+5,y+12);
    ctx.textAlign='right';
    let s=hp+'/'+max;if(armor>0)s+=' 🛡'+armor;
    ctx.fillText(s,x+w-5,y+12);ctx.textAlign='left';
}

function drawMana(ctx){
    const bx=W/2-110,by=H-30,bw=220,bh=20;
    ctx.fillStyle='rgba(0,0,0,0.65)';roundRect(ctx,bx-2,by-2,bw+4,bh+4,5);ctx.fill();

        const sx=bx+i*(bw/10)+1,sw=(bw/10)-2;
        if(i<G.maxMana){
            ctx.fillStyle=i<G.mana?'#29b6f6':'#37474f';
            const g=ctx.createRadialGradient(sx+sw/2,by+bh/2,1,sx+sw/2,by+bh/2,sw);
            if(i<G.mana){g.addColorStop(0,'#81d4fa');g.addColorStop(1,'#0277bd');}else{g.addColorStop(0,'#546e7a');g.addColorStop(1,'#263238');}
            ctx.fillStyle=g;roundRect(ctx,sx,by,sw,bh,3);ctx.fill();
        }
    }
    ctx.strokeStyle='#ffd700';ctx.lineWidth=1;roundRect(ctx,bx,by,bw,bh,3);ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold 11px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.fillText('💎 '+G.mana+'/'+G.maxMana+' 回合'+G.round+'/'+G.maxRound,W/2,by+14);

}

function update(){
    updateParticles();updateFloatTexts();updateSpells();
    if(G.shake>0)G.shake-=0.5;
    if(G.flash>0)G.flash--;
}

function draw(){
    ctx.save();
    if(G.shake>0)ctx.translate((Math.random()-0.5)*G.shake,(Math.random()-0.5)*G.shake);
    switch(G.state){
        case STATE_MENU:drawMenu(ctx);break;
        case STATE_PLAYING:drawGame(ctx);break;
        case STATE_OVER:drawGameOver(ctx);break;
        case STATE_PAUSE:drawGame(ctx);break;
    }
    if(G.flash>0){ctx.globalAlpha=G.flash/20;ctx.fillStyle=G.flashColor;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
    ctx.restore();
}

function handlePointerDown(e){
    initAudio();const p=getPos(e);
    if(G.state===STATE_MENU){if(hitBtn(p,'start')){startGame();return;}}
    else if(G.state===STATE_OVER){if(hitBtn(p,'restart')){startGame();return;}if(hitBtn(p,'menu')){G.state=STATE_MENU;return;}}
    else if(G.state===STATE_PLAYING){
        if(hitBtn(p,'endturn')){endTurn();return;}
        if(hitBtn(p,'surrender')){G.playerHp=0;checkGameOver();return;}
        if(G.targetMode&&G.selectedField){
            if(p.y>15&&p.y<58){
                const att=G.playerField.find(c=>c.uid===G.selectedField);
                if(att)attackHero(att,'player');
                G.selectedField=null;G.targetMode=false;checkGameOver();return;
            }
            const ers=cardRectsEnemy();
            for(const r of ers){
                if(rectHit(p,r)){
                    const att=G.playerField.find(c=>c.uid===G.selectedField);
                    if(att)performAttack(att,r.card,'player');
                    G.selectedField=null;G.targetMode=false;checkGameOver();return;
                }
            }
            G.selectedField=null;G.targetMode=false;return;
        }
        const hrs=cardRectsHand();
        for(const r of hrs){
            if(rectHit(p,r)){
                if(G.selectedCard===r.card.uid){useCard(r.card);G.selectedCard=null;}
                else{G.selectedCard=r.card.uid;G.selectedField=null;G.targetMode=false;sfxBtn();}
                return;
            }
        }
        const prs=cardRectsPlayer();
        for(const r of prs){
            if(rectHit(p,r)){
                if(r.card.canAttack&&!r.card.hasAttacked&&G.isPlayerTurn&&!G.animating&&r.card.frozen<=0){
                    G.selectedField=r.card.uid;G.targetMode=true;G.selectedCard=null;sfxBtn();
                }
                return;
            }
        }
        if(G.selectedCard){
            const c=G.playerHand.find(x=>x.uid===G.selectedCard);
            if(c&&p.y>H-350&&p.y<H-160){useCard(c);G.selectedCard=null;return;}
        }
        G.selectedCard=null;G.selectedField=null;G.targetMode=false;
    }
}

function handlePointerMove(e){
    const p=getPos(e);G.hoverCard=null;
    if(G.state!==STATE_PLAYING)return;
    const hrs=cardRectsHand();for(const r of hrs){if(rectHit(p,r)){G.hoverCard=r.card.uid;return;}}
}

function addLog(msg,type){
    G.log.push({m:msg,t:type||'info',time:Date.now()});

function wrapText(text,x,y,maxW,lineH,align){
    const lines=[];let cur='';
    if(text.indexOf('\n')>=0){const ps=text.split('\n');for(const p of ps){
        const chars=p.split('');cur='';for(const ch of chars){
            const t2=cur+ch;if(ctx.measureText(t2).width>maxW){lines.push(cur);cur=ch;}else cur=t2;
        }lines.push(cur);}
    }else{
        const chars=text.split('');for(const ch of chars){
            const t2=cur+ch;if(ctx.measureText(t2).width>maxW){lines.push(cur);cur=ch;}else cur=t2;
        }lines.push(cur);}
    ctx.textAlign=align||'left';
    for(let i=0;i<lines.length;i++){ctx.fillText(lines[i],x,y+i*lineH);}
}

function handleExtraPointer(p){
    if(G.state===STATE_PAUSE){
        if(G.pauseBtns){for(const b of G.pauseBtns){if(rectHit(p,b)){
            sfxBtn();if(b.id==='resume'){G.state=STATE_PLAYING;}
            else if(b.id==='tutorial'){G.tutStep=0;G.showTutorial=true;}
            else if(b.id==='ach'){G.achPage=0;G.showAch=true;G.state=STATE_MENU;}
            else if(b.id==='mute'){G.mute=!G.mute;if(G.mute&&audioCtx)audioCtx.suspend();else if(!G.mute&&audioCtx)audioCtx.resume();}
            else if(b.id==='restart'){newGame();}
            else if(b.id==='menu'){G.state=STATE_MENU;}
            return true;}}}return true;
    }
    if(G.showTutorial){
        if(G.tutBtns){for(const b of G.tutBtns){if(rectHit(p,b)){
            sfxBtn();if(b.id==='prev'){if(G.tutStep>0)G.tutStep--;else{G.showTutorial=false;G.showAch=false;}}
            else{if(G.tutStep<TUTORIAL_STEPS.length-1)G.tutStep++;else{G.showTutorial=false;if(G.level===1)newGame();}}
            return true;}}}return true;
    }
    if(G.showAch){
        if(G.achBtns){for(const b of G.achBtns){if(rectHit(p,b)){
            sfxBtn();if(b.id==='prev'&&G.achPage>0)G.achPage--;
            else if(b.id==='next'){const tp=Math.ceil(ACHIEVEMENTS.length/6);if(G.achPage<tp-1)G.achPage++;}
            else if(b.id==='close'){G.showAch=false;}
            return true;}}}return true;
    }
    if(G.showLog){
        if(G.logBtn&&rectHit(p,G.logBtn)){G.showLog=false;sfxBtn();return true;}return true;
    }
    if(G.detCard){
        if(G.detBtn&&rectHit(p,G.detBtn)){G.detCard=null;sfxBtn();return true;}
        return true;
    }
    if(G.state===STATE_MENU&&G.menuBtns){
        for(const b of G.menuBtns){if(rectHit(p,b)){
            sfxBtn();if(b.id==='ach_menu'){G.achPage=0;G.showAch=true;}
            return true;
        }}
    }
    return false;
}

let _origDraw=draw;draw=function(){
    _origDraw();
    if(G.state===STATE_PAUSE)drawPauseMenu();
    else if(G.showTutorial)drawTutorial();
    else if(G.showAch)drawAchievements();
    if(G.showLog)drawBattleLog();
    if(G.detCard)drawCardDetail();
    if(G.state===STATE_MENU)drawMenuExtras();
    if(G.achQueue&&G.achQueue.length>0){
        const a=G.achQueue[0];if(a._t===undefined)a._t=0;a._t++;
        ctx.save();ctx.globalAlpha=Math.max(0,1-Math.abs(a._t-150)/150);
        ctx.fillStyle='rgba(123,31,162,0.95)';roundRect(W/2-135,H/2-50,270,70,14,true,false);
        ctx.strokeStyle='#ffd700';ctx.lineWidth=2;roundRect(W/2-135,H/2-50,270,70,14,false,true);
        ctx.fillStyle='#ffd700';ctx.font='30px Arial';ctx.textAlign='center';
        ctx.fillText('🏆',W/2,H/2-15);
        ctx.fillStyle='#fff';ctx.font='bold 16px Microsoft YaHei';
        ctx.fillText('成就解锁! '+a.name,W/2,H/2+8);
        ctx.fillStyle='#ccc';ctx.font='12px Microsoft YaHei';
        ctx.fillText(a.reward,W/2,H/2+26);
        ctx.restore();if(a._t>300)G.achQueue.shift();
    }
};
let _origUpdate=update;update=function(){
    _origUpdate();
    if(G.state===STATE_PLAYING)checkAchievements();
};
let _origHPD=handlePointerDown;handlePointerDown=function(e){
    initAudio();const p=getPos(e);
    if(handleExtraPointer(p))return;
    if(G.state===STATE_PLAYING){
        if(p.x>W-58&&p.y>14&&p.x<W-14&&p.y<50){G.state=STATE_PAUSE;sfxBtn();return;}
        if(p.x>14&&p.y>14&&p.x<62&&p.y<46){G.showLog=true;sfxBtn();return;}
    }
    _origHPD(e);
    if(G.state===STATE_PLAYING&&G.hoverCard){
        for(const c of G.hand){if(c.uid===G.hoverCard){G.detCard=c;break;}}
    }
};

function gameLoop(){requestAnimationFrame(gameLoop);update();draw();}
loadAchievements();
if(G.achUnlocked===undefined)G.achUnlocked=[];
gameLoop();
})();

<!-- [BATCH-FIX:responsive-js] -->
<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>
<!-- [/BATCH-FIX:responsive-js] -->
<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
