function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();}
function playTone(freq,dur,type,vol){if(!audioCtx)return;try{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type||'square';o.frequency.value=freq;g.gain.value=vol||0.15;g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur);}catch(e){}}
function sfxBuy(){playTone(660,0.08,'triangle',0.18);setTimeout(()=>playTone(880,0.1,'triangle',0.18),80);}

{n:'机械巨神',c:'#006064',t:5,tribe:'机械',atk:9,hp:9,emoji:'🤖',price:5,sk:'全屏激光',st:'l'},

const G={
state:STATE_MENU,
hp:100,
gold:5,
level:1,maxLevel:10,
shop:[],freeze:false,
bench:[],board:[],maxBench:8,maxBoard:7,
triples:{},
round:0,maxRound:25,
phase:'shop',
battleIdx:0,
battleTimer:0,
battleSeq:null,
lastResult:null,
opponent:null,
enemyLife:100,
score:0,highScore:0,
hover:null,
selectedHand:-1,
particles:[],floats:[],
shake:0,flash:0,flashColor:'',
anim:null,
btnRects:{},
};
G.highScore=parseInt(Storage.load('auto_high','0'));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function rollShop(tier){
    const pool=UNITS.filter(u=>u.t<=tier);
    const weighted=[];
    pool.forEach(u=>{const w=Math.max(1,7-u.t);for(let i=0;i<w;i++)weighted.push(u);});
    const n=4+Math.min(2,G.level);
    const res=[];for(let i=0;i<n;i++)res.push(makeCard(weighted[Math.floor(Math.random()*weighted.length)]));
    return res;
}
function makeCard(t){
    const stars=1;
    return{...t,uid:'u'+Math.random().toString(36).slice(2,9),stars,
    curAtk:t.atk,curHp:t.hp,maxHp:t.hp,baseAtk:t.atk,
    bonusAtk:0,bonusHp:0,
    shield:0,divine:t.st==='d'||t.st==='dt'||t.st==='g',
    taunt:t.st==='t'||t.st==='dt',
    poison:false,charge:t.st==='c',
    canAttack:false,attacksThisTurn:0,
    onBench:true,dead:false,level:stars,tier:t.t,
    gold:t.price,starCount:stars,tripletReady:false,
    merged:false};
}
function startGame(){
    initAudio();
    G.state=STATE_PLAYING;
    G.hp=100;G.gold=10;G.level=1;
    G.shop=[];G.bench=[];G.board=[];G.triples={};
    G.round=0;G.maxRound=25;G.phase='shop';G.freeze=false;
    G.score=0;G.particles=[];G.floats=[];G.anim=null;
    newRound();sfxBtn();
}
function newRound(){
    G.round++;
    if(G.round>G.maxRound){endGame(true);return;}
    const base=10+Math.min(5,Math.floor(G.round/3));
    G.gold=base;
    G.shop=rollShop(G.level);
    G.phase='shop';G.freeze=false;
    addFloat(W/2,80,'第 '+G.round+' 回合  💰'+G.gold,'#ffd700');
    recomputeBuffs();
}
function getTierForLevel(lv){return Math.min(6,Math.ceil(lv/2)+(lv>=6?1:0));}
function getUpgradeCost(){return[0,4,6,7,8,9,10,12,14,16,20][G.level]||999;}
function buyFromShop(idx){
    const c=G.shop[idx];if(!c||c.sold)return;
    if(G.gold<c.gold){addFloat(W/2,H/2,'金币不足!','#ff6b6b');return;}
    if(G.bench.length>=G.maxBench&&G.board.length>=G.maxBoard){addFloat(W/2,H/2,'已满!','#ff6b6b');return;}
    G.gold-=c.gold;
    const nc=makeCard(c);nc.onBench=true;
    const newKey=nc.n+'_'+nc.tier;
    G.triples[newKey]=(G.triples[newKey]||0)+1;
    if(G.triples[newKey]>=3){
        nc.stars=3;nc.curAtk=nc.atk*3;nc.curHp=nc.hp*3;nc.maxHp=nc.hp*3;nc.baseAtk=nc.atk*3;nc.gold=0;nc.tripletReady=true;
        G.triples[newKey]=0;
        const bs=[...G.bench];
        for(let i=bs.length-1;i>=0;i--){if(bs[i].n===nc.n&&bs[i].tier===nc.tier&&bs[i].stars<3){G.bench.splice(i,1);}}
        sfxTriple();addFloat(W/2,H/2,'⭐⭐⭐ 三星 '+nc.n+'!','#ffd700');
        spawnParticles(W/2,H/2,'#ffd700',40);
    }
    G.bench.push(nc);
    c.sold=true;
    sfxBuy();
    spawnParticles(W/2,240,c.c,15);
}
function sellBench(idx){
    const c=G.bench[idx];if(!c)return;
    const refund=c.stars>=3?c.gold*3+3:c.gold;
    G.gold+=Math.max(1,refund);
    const k=c.n+'_'+c.tier;
    G.triples[k]=Math.max(0,(G.triples[k]||0)-1);
    G.bench.splice(idx,1);
    sfxSell();
    addFloat(W/2,H-220,'卖出+'+Math.max(1,refund)+'💰','#ffd700');
    recomputeBuffs();
}
function sellBoard(idx){
    const c=G.board[idx];if(!c)return;
    const refund=c.stars>=3?c.gold*3+3:c.gold;
    G.gold+=Math.max(1,refund);
    const k=c.n+'_'+c.tier;
    G.triples[k]=Math.max(0,(G.triples[k]||0)-1);
    G.board.splice(idx,1);
    sfxSell();recomputeBuffs();
}
function benchToBoard(bidx,pos){
    const c=G.bench[bidx];if(!c)return;
    if(G.board.length>=G.maxBoard){addFloat(W/2,H/2,'战场已满!','#ff6b6b');return;}
    G.bench.splice(bidx,1);
    c.onBench=false;c.canAttack=!!c.charge;
    const ins=pos!==undefined?pos:G.board.length;
    G.board.splice(ins,0,c);
    sfxBuy();spawnParticles(W/2,H-230,c.c,15);
    recomputeBuffs();
}
function boardToBench(bidx,pos){
    const c=G.board[bidx];if(!c)return;
    if(G.bench.length>=G.maxBench){addFloat(W/2,H/2,'板凳已满!','#ff6b6b');return;}
    G.board.splice(bidx,1);
    c.onBench=true;c.canAttack=false;
    G.bench.push(c);
    sfxSell();recomputeBuffs();
}
function upgradeLevel(){
    if(G.level>=G.maxLevel){addFloat(W/2,H/2,'已满级!','#ff6b6b');return;}
    const c=getUpgradeCost();
    if(G.gold<c){addFloat(W/2,H/2,'金币不足: '+c+'💰','#ff6b6b');return;}
    G.gold-=c;G.level++;
    sfxUp();
    addFloat(W/2,H/2,'⭐ 升到 Lv.'+G.level+'!','#ffd700');
    spawnParticles(W/2,H/2,'#ffd700',30);
}
function reroll(){
    const c=1;
    if(G.gold<c){addFloat(W/2,H/2,'金币不足!','#ff6b6b');return;}
    G.gold-=c;
    if(!G.freeze){G.shop=rollShop(getTierForLevel(G.level));}
    sfxRoll();spawnParticles(W/2,240,'#90caf9',12);
}
function toggleFreeze(){
    G.freeze=!G.freeze;sfxBtn();
    addFloat(W/2,H/2,G.freeze?'❄️ 已锁定刷新':'已解锁','#4fc3f7');
}
function startBattle(){
    if(G.board.length===0){G.hp-=5;addFloat(W/2,H/2,'空场: -5❤️!','#ff6b6b');}
    G.phase='battle';
    const diff=5+Math.floor(G.round*1.5);
    G.opponent={
        name:'AI 对手 Lv.'+Math.min(10,1+Math.floor(G.round/2)),
        hp:80+G.round*5,life:80+G.round*5,
        level:Math.min(10,G.level+Math.floor(Math.random()*2)),
        board:[]
    };
    const n=Math.min(7,3+Math.floor(G.round/3));
    for(let i=0;i<n;i++){
        const pool=UNITS.filter(u=>u.t<=getTierForLevel(G.opponent.level));
        const tpl=pool[Math.floor(Math.random()*pool.length)];
        const c=makeCard(tpl);
        c.curAtk+=Math.floor(G.round/4);c.curHp+=Math.floor(G.round/3);
        c.maxHp=c.curHp;c.baseAtk=c.curAtk;c.onBench=false;
        if(Math.random()<0.15&&tpl.t>=2){
            c.stars=3;c.curAtk=c.baseAtk*2;c.curHp=c.maxHp*2;c.maxHp*=2;c.baseAtk*=2;
        }
        G.opponent.board.push(c);
    }
    recomputeBuffsOpp();
    G.battleIdx=0;G.battleTimer=0;G.battleSeq=[];G.lastResult=null;
    sfxFight();G.shake=10;
    runBattle();
}
function runBattle(){
    let pTurn=G.board.length>=G.opponent.board.length;
    const maxStep=80;let step=0;
    const mine=G.board.map(c=>({...c,cHp:c.curHp}));
    const opps=G.opponent.board.map(c=>({...c,cHp:c.curHp}));
    const myHpRef={v:G.hp};
    const opHpRef={v:G.opponent.life};
    function doStep(){
        if(++step>maxStep||mine.filter(c=>c.cHp>0).length===0||opps.filter(c=>c.cHp>0).length===0){
            const surp=mine.filter(c=>c.cHp>0);const suro=opps.filter(c=>c.cHp>0);
            let result=0;
            if(surp.length>0&&suro.length===0)result=1;
            else if(surp.length===0&&suro.length>0)result=-1;
            else result=(myHpRef.v-opHpRef.v>=0?1:-1);
            finishBattle(result,surp,suro);return;
        }
        const atkList=pTurn?mine:opps;
        const defList=pTurn?opps:mine;
        const alive=atkList.filter(c=>c.cHp>0);
        if(alive.length===0){pTurn=!pTurn;setTimeout(doStep,250);return;}
        let attacker=null;let idx=-1;
        for(let k=0;k<atkList.length;k++){
            const cc=atkList[k];if(cc.cHp>0){
                const maxA=cc.wind?2:1;
                if(cc.attackCount===undefined)cc.attackCount=0;
                if(cc.attackCount<maxA){attacker=cc;idx=k;break;}
            }
        }
        if(!attacker){atkList.forEach(c=>c.attackCount=0);pTurn=!pTurn;setTimeout(doStep,250);return;}
        const taunts=defList.filter(c=>c.cHp>0&&(c.st==='t'||c.st==='dt'));
        let target;
        if(taunts.length>0)target=taunts[Math.floor(Math.random()*taunts.length)];
        else{
            const alives=defList.filter(c=>c.cHp>0);
            if(alives.length>0)target=alives[Math.floor(Math.random()*alives.length)];
        }
        if(target){
            const aDmg=attacker.curAtk,dDmg=target.curAtk;
            if(attacker.divine){if(dDmg>0)attacker.divine=false;}
            else{attacker.cHp-=Math.max(0,dDmg);}
            if(target.divine){if(aDmg>0)target.divine=false;}
            else{target.cHp-=Math.max(0,aDmg);}
            sfxHit();G.shake=4;
            spawnParticles(W/2,H/2,'#ff4444',10);
            if(attacker.st==='v'&&aDmg>0){attacker.cHp=Math.min(attacker.maxHp,attacker.cHp+aDmg);}
            attacker.attackCount=(attacker.attackCount||0)+1;
            if(!attacker.wind||attacker.attackCount>=2){
                atkList.splice(idx,1);atkList.push(attacker);
            }
        }else{
            const dmg=Math.max(1,attacker.curAtk);
            if(pTurn){opHpRef.v-=dmg;}else{myHpRef.v-=dmg;}
            G.shake=8;G.flash=10;G.flashColor='#ff3333';sfxHit();
            atkList.forEach(c=>c.attackCount=0);
        }
        G.hp=Math.max(0,myHpRef.v);
        G.opponent.life=Math.max(0,opHpRef.v);
        G.battleView={mine:mine.map(c=>({...c})),opps:opps.map(c=>({...c}))};
        if(G.hp<=0||G.opponent.life<=0){
            finishBattle(G.hp>0?1:-1,mine.filter(c=>c.cHp>0),opps.filter(c=>c.cHp>0));
            return;
        }
        pTurn=!pTurn;
        setTimeout(doStep,320);
    }
    G.battleView={mine:mine.map(c=>({...c})),opps:opps.map(c=>({...c}))};
    setTimeout(doStep,400);
}
function finishBattle(result,surp,suro){
    G.phase='result';

        G.score+=50+G.round*10;

        G.gold+=Math.min(5,1+surp.length);

        const dmg=Math.max(3,Math.min(20,5+G.round+suro.length*2));
        G.hp=Math.max(0,G.hp-dmg);

        sfxLose();
    }

function recomputeBuffs(){
    if(!G.board)return;
    const counts={};
    G.board.forEach(c=>{
        counts[c.tribe]=(counts[c.tribe]||0)+(c.stars||1);
    });
    G.board.forEach(c=>{
        let atkBuff=0,hpBuff=0;
        if(counts[c.tribe]>=2){atkBuff+=2;hpBuff+=2;}
        if(counts[c.tribe]>=4){atkBuff+=4;hpBuff+=4;}
        if(counts[c.tribe]>=6){atkBuff+=6;hpBuff+=8;}
        if(c.tribe==='战士'&&counts['战士']>=3)hpBuff+=6;
        if(c.tribe==='法师'&&counts['法师']>=3)atkBuff+=6;
        if(c.tribe==='刺客'&&counts['刺客']>=3)atkBuff+=10;
        if(c.tribe==='骑士'&&counts['骑士']>=2)hpBuff+=5;
        if(c.tribe==='野兽'&&counts['野兽']>=2)atkBuff+=3;
        if(c.tribe==='龙'&&counts['龙']>=2){atkBuff+=5;hpBuff+=5;}
        if(c.tribe==='机械'&&counts['机械']>=3)c.shield=3;
        c.curAtk=c.baseAtk+atkBuff;
        c.curHp=c.maxHp+hpBuff;
    });
}

        case STATE_MENU:drawMenu(ctx);break;

function handlePointerDown(e){
    initAudio();const p=getPos(e);
    if(G.state===STATE_MENU){if(hitBtn(p,'start')){startGame();return;}}
    else if(G.state===STATE_OVER){if(hitBtn(p,'restart')){G.state=STATE_MENU;return;}if(hitBtn(p,'menu')){G.state=STATE_MENU;return;}}
    else if(G.state===STATE_PLAYING){
        if(G.phase!=='shop')return;
        if(hitBtn(p,'reroll')){reroll();return;}
        if(hitBtn(p,'freeze')){toggleFreeze();return;}
        if(hitBtn(p,'upgrade')){upgradeLevel();return;}
        if(hitBtn(p,'battle')){startBattle();return;}
        const srs=shopRects();
        for(let i=0;i<srs.length;i++){
            if(rectHit(p,srs[i])&&!srs[i].card.sold){
                if(G.selectedHand==='s'+i){buyFromShop(i);G.selectedHand=-1;return;}
                else{G.selectedHand='s'+i;sfxBtn();return;}
            }
        }
        const crs=benchRects();
        for(let i=0;i<crs.length;i++){
            if(rectHit(p,crs[i])){
                if(G.selectedHand==='c'+i){benchToBoard(i);G.selectedHand=-1;return;}
                else{G.selectedHand='c'+i;sfxBtn();return;}
            }
        }
        const brs=boardRects(true);
        for(let i=0;i<brs.length;i++){
            if(brs[i].arr===G.board&&rectHit(p,brs[i])){
                if(G.selectedHand==='b'+i){sellBoard(i);G.selectedHand=-1;return;}
                else{G.selectedHand='b'+i;sfxBtn();return;}
            }
        }
        G.selectedHand=-1;
    }
}
function handlePointerMove(e){
    const p=getPos(e);G.hover=null;
    if(G.state!==STATE_PLAYING)return;
    const srs=shopRects();for(const r of srs)if(rectHit(p,r)){G.hover=r.card.uid;return;}
    const crs=benchRects();for(const r of crs)if(rectHit(p,r)){G.hover=r.card.uid;return;}
    const brs=boardRects(true);for(const r of brs)if(rectHit(p,r)){G.hover=r.card.uid;return;}
}

function wrapText(text,x,y,maxW,lineH,align)
{
    const lines=[];let cur='';
    if(text.indexOf('\n')>=0)
    {
        const ps=text.split('\n');
        for(const p of ps)
        {
            const chars=p.split('');cur='';
            for(const ch of chars)
            {
                const t2=cur+ch;
                if(ctx.measureText(t2).width>maxW){lines.push(cur);cur=ch;}else cur=t2;
            }
            lines.push(cur);
        }
    }
    else
    {
        const chars=text.split('');
        for(const ch of chars)
        {
            const t2=cur+ch;
            if(ctx.measureText(t2).width>maxW){lines.push(cur);cur=ch;}else cur=t2;
        }
        lines.push(cur);
    }
    ctx.textAlign=align||'left';
    for(let i=0;i<lines.length;i++){ctx.fillText(lines[i],x,y+i*lineH);}
}

function handleExtraPointer(p)
{
    if(G.state===STATE_PAUSE)
    {
        if(G.pauseBtns)for(const b of G.pauseBtns)if(rectHit(p,b)){
            sfxBtn();
            if(b.id==='resume')G.state=STATE_PLAYING;
            else if(b.id==='tutorial'){G.tutStep=0;G.showTutorial=true;}
            else if(b.id==='ach'){G.achPage=0;G.showAch=true;G.state=STATE_MENU;}
            else if(b.id==='mute'){G.mute=!G.mute;if(G.mute&&audioCtx)audioCtx.suspend();else if(!G.mute&&audioCtx)audioCtx.resume();}
            else if(b.id==='restart')newGame();
            else if(b.id==='menu')G.state=STATE_MENU;
            return true;
        }
        return true;
    }
    if(G.showTutorial)
    {
        if(G.tutBtns)for(const b of G.tutBtns)if(rectHit(p,b)){
            sfxBtn();
            if(b.id==='prev'){if(G.tutStep>0)G.tutStep--;else{G.showTutorial=false;G.showAch=false;}}
            else{if(G.tutStep<TUTORIAL_STEPS.length-1)G.tutStep++;else{G.showTutorial=false;if(!G.level||G.level===1)newGame();}}
            return true;
        }
        return true;
    }
    if(G.showAch)
    {
        if(G.achBtns)for(const b of G.achBtns)if(rectHit(p,b)){
            sfxBtn();
            if(b.id==='prev'&&G.achPage>0)G.achPage--;
            else if(b.id==='next'){const tp=Math.ceil(ACHIEVEMENTS.length/6);if(G.achPage<tp-1)G.achPage++;}
            else if(b.id==='close')G.showAch=false;
            return true;
        }
        return true;
    }
    if(G.showLog){if(G.logBtn&&rectHit(p,G.logBtn)){G.showLog=false;sfxBtn();return true;}return true;}
    if(G.detCard){if(G.detBtn&&rectHit(p,G.detBtn)){G.detCard=null;sfxBtn();return true;}return true;}
    if(G.state===STATE_MENU&&G.menuBtns)for(const b of G.menuBtns)if(rectHit(p,b)){sfxBtn();if(b.id==='ach_menu'){G.achPage=0;G.showAch=true;}return true;}
    return false;
}
let _origDraw=draw;draw=function()
{
    _origDraw();
    if(G.state===STATE_PAUSE)drawPauseMenu();
    else if(G.showTutorial)drawTutorial();
    else if(G.showAch)drawAchievements();
    if(G.showLog)drawBattleLog();
    if(G.detCard)drawCardDetail();
    if(G.state===STATE_MENU)drawMenuExtras();
    if(G.achQueue&&G.achQueue.length>0)
    {
        const a=G.achQueue[0];if(a._t===undefined)a._t=0;a._t++;
        ctx.save();ctx.globalAlpha=Math.max(0,1-Math.abs(a._t-150)/150);
        ctx.fillStyle='rgba(93,64,55,0.95)';roundRect(W/2-135,H/2-50,270,70,14,true,false);
        ctx.strokeStyle='#d7ccc8';ctx.lineWidth=2;roundRect(W/2-135,H/2-50,270,70,14,false,true);
        ctx.fillStyle='#ffd700';ctx.font='30px Arial';ctx.textAlign='center';
        ctx.fillText('🏆',W/2,H/2-15);
        ctx.fillStyle='#fff';ctx.font='bold 16px Microsoft YaHei';
        ctx.fillText('称号解锁! '+a.name,W/2,H/2+8);
        ctx.fillStyle='#ccc';ctx.font='12px Microsoft YaHei';
        ctx.fillText(a.reward,W/2,H/2+26);
        ctx.restore();if(a._t>300)G.achQueue.shift();
    }
};
let _origUpdate=update;update=function(){_origUpdate();if(G.state===STATE_PLAYING)checkAchievements();};
let _origHPD=handlePointerDown;handlePointerDown=function(e)
{
    initAudio();const p=getPos(e);
    if(handleExtraPointer(p))return;
    if(G.state===STATE_PLAYING)
    {
        if(p.x>W-58&&p.y>14&&p.x<W-14&&p.y<50){G.state=STATE_PAUSE;sfxBtn();return;}
        if(p.x>14&&p.y>14&&p.x<62&&p.y<46){G.showLog=true;sfxBtn();return;}
    }
    _origHPD(e);
    if(G.state===STATE_PLAYING&&G.hover)
    {
        G.detCard=null;const hv=G.hover;
        const allCards=[];
        for(const c of (G.shop||[]))allCards.push(c);
        for(const c of (G.bench||[]))allCards.push(c);
        for(const c of (G.board||[]))allCards.push(c);
        for(const c of allCards)if(c.uid===hv){G.detCard=c;break;}
    }
};
function gameLoop()
{
    requestAnimationFrame(gameLoop);
    update();
    draw();
}
loadAchievements();if(G.achUnlocked===undefined)G.achUnlocked=[];
G.achQueue=G.achQueue||[];G.log=G.log||[];
gameLoop();
})();
</script>
