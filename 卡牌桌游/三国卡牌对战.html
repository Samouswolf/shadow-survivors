function initAudio(){
    if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
}
function playTone(freq,dur,type,vol){
    if(!audioCtx)return;
    try{
        const o=audioCtx.createOscillator();
        const g=audioCtx.createGain();
        o.type=type||'square';
        o.frequency.value=freq;
        g.gain.value=vol||0.15;
        g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
        o.connect(g);g.connect(audioCtx.destination);
        o.start();o.stop(audioCtx.currentTime+dur);
    }catch(e){}
}

function makeCard(tpl){
    return{
        ...tpl,
        uid:'c'+Math.random().toString(36).slice(2,10),
        curAtk:tpl.atk,
        curHp:tpl.hp,
        maxHp:tpl.hp,
        canAttack:false,
        hasAttacked:false,
        armor:0,
        stealth:false,
        buffAtk:0
    };
}

let particles=[];
function spawnParticles(x,y,color,count){
    count=count||12;
    for(let i=0;i<count;i++){
        particles.push({
            x:x,y:y,
            vx:(Math.random()-0.5)*8,
            vy:(Math.random()-0.5)*8-3,
            life:35+Math.random()*20,
            maxLife:55,
            size:2+Math.random()*4,
            color:color
        });
    }
}
function updateParticles(){
    for(let i=particles.length-1;i>=0;i--){
        const p=particles[i];
        p.x+=p.vx;p.y+=p.vy;
        p.vy+=0.25;p.vx*=0.98;
        p.life--;
        if(p.life<=0) particles.splice(i,1);
    }
}
function drawParticles(ctx){
    for(const p of particles){
        ctx.globalAlpha=Math.max(0,p.life/p.maxLife);
        ctx.fillStyle=p.color;
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
        ctx.fill();
    }
    ctx.globalAlpha=1;
}

let floatTexts=[];
function addFloatText(x,y,text,color){
    floatTexts.push({x:x,y:y,text:text,color:color||'#fff',life:60,maxLife:60,vy:-1.5});
}
function updateFloatTexts(){
    for(let i=floatTexts.length-1;i>=0;i--){
        const f=floatTexts[i];
        f.y+=f.vy;f.life--;
        if(f.life<=0) floatTexts.splice(i,1);
    }
}
function drawFloatTexts(ctx){
    for(const f of floatTexts){
        ctx.globalAlpha=f.life/f.maxLife;
        ctx.fillStyle=f.color;
        ctx.strokeStyle='#000';
        ctx.lineWidth=3;
        ctx.font='bold 22px "Microsoft YaHei"';
        ctx.textAlign='center';
        ctx.strokeText(f.text,f.x,f.y);
        ctx.fillText(f.text,f.x,f.y);
        ctx.textAlign='left';
    }
    ctx.globalAlpha=1;
}

function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    return arr;
}

function buildDeck(){
    const deck=[];
    const pool=[...CARD_POOL];
    for(let i=0;i<25;i++){
        const c=pool[Math.floor(Math.random()*pool.length)];
        deck.push(makeCard(c));
    }
    return shuffle(deck);
}

function drawCard(n,who){
    n=n||1;who=who||'p';
    const deck=who==='p'?G.playerDeck:null;
    const hand=who==='p'?G.playerHand:null;
    for(let i=0;i<n;i++){
        if(deck.length>0 && hand.length<8){
            const c=deck.pop();
            hand.push(c);
            sfxDraw();
        }
    }
}

function roundRect(ctx,x,y,w,h,r){
    r=Math.min(r,w/2,h/2);
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
}

function factionColor(f){
    if(f==='蜀')return '#2e7d32';
    if(f==='魏')return '#1565c0';
    if(f==='吴')return '#e65100';
    if(f==='群')return '#6a1b9a';
    if(f==='策')return '#c62828';
    return '#555';
}

function drawCardView(ctx,c,x,y,w,h,selected,faceDown){
    h=h||100;w=w||70;
    if(faceDown){
        const g=ctx.createLinearGradient(x,y,x+w,y+h);
        g.addColorStop(0,'#5d4037');
        g.addColorStop(1,'#3e2723');
        ctx.fillStyle=g;
        roundRect(ctx,x,y,w,h,6);ctx.fill();
        ctx.strokeStyle='#ffd700';
        ctx.lineWidth=2;
        roundRect(ctx,x,y,w,h,6);ctx.stroke();
        ctx.fillStyle='#ffd700';
        ctx.font='bold 20px "Microsoft YaHei"';
        ctx.textAlign='center';
        ctx.fillText('三',x+w/2,y+h/2+8);
        ctx.font='10px "Microsoft YaHei"';
        ctx.fillText('國',x+w/2,y+h/2+22);
        ctx.textAlign='left';
        return;
    }
    const col=c.color||factionColor(c.faction);
    const g=ctx.createLinearGradient(x,y,x,y+h);
    g.addColorStop(0,col);
    g.addColorStop(1,'#222');
    ctx.fillStyle=g;
    roundRect(ctx,x,y,w,h,6);ctx.fill();
    if(selected){
        ctx.strokeStyle='#ffd700';
        ctx.lineWidth=3;
        ctx.shadowColor='#ffd700';
        ctx.shadowBlur=10;
    }else{
        ctx.strokeStyle=G.hoverCard===c.uid?'#fff':'rgba(255,255,255,0.4)';
        ctx.lineWidth=2;
    }
    roundRect(ctx,x,y,w,h,6);ctx.stroke();
    ctx.shadowBlur=0;
    if(c.cost>=0){
        ctx.fillStyle='#2196f3';
        ctx.beginPath();
        ctx.arc(x+10,y+11,9,0,Math.PI*2);
        ctx.fill();
        ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
        ctx.fillStyle='#fff';
        ctx.font='bold 12px Arial';
        ctx.textAlign='center';
        ctx.fillText(c.cost,x+10,y+15);
        ctx.textAlign='left';
    }
    const iconSize=Math.min(28,w*0.4);
    ctx.font=iconSize+'px Arial';
    ctx.textAlign='center';
    ctx.fillText(c.emoji,x+w/2,y+h*0.4);
    ctx.textAlign='left';
    ctx.fillStyle='#fff';
    ctx.font='bold '+(Math.min(10,w*0.14))+'px "Microsoft YaHei"';
    ctx.textAlign='center';
    ctx.fillText(c.name,x+w/2,y+h*0.58);
    ctx.textAlign='left';
    ctx.font='8px "Microsoft YaHei"';
    ctx.fillStyle='rgba(255,255,255,0.85)';
    ctx.textAlign='center';
    const skillText=c.skill.length>10?c.skill.slice(0,10)+'..':c.skill;
    ctx.fillText(skillText,x+w/2,y+h*0.72);
    ctx.textAlign='left';
    if(c.curAtk>0||c.atk>0){
        const atkY=y+h-12;
        ctx.fillStyle='#f44336';
        ctx.beginPath();ctx.arc(x+12,atkY,8,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.stroke();
        ctx.fillStyle='#fff';
        ctx.font='bold 10px Arial';
        ctx.textAlign='center';
        ctx.fillText(c.curAtk||c.atk,x+12,atkY+3);
        ctx.textAlign='left';
        ctx.fillStyle=c.curHp<c.maxHp?'#ffeb3b':'#4caf50';
        ctx.beginPath();ctx.arc(x+w-12,atkY,8,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.stroke();
        ctx.fillStyle='#fff';
        ctx.font='bold 10px Arial';
        ctx.textAlign='center';
        ctx.fillText(c.curHp||c.hp,x+w-12,atkY+3);
        ctx.textAlign='left';
    }
    if(c.armor>0){
        ctx.fillStyle='#90caf9';
        ctx.font='bold 10px Arial';
        ctx.fillText('🛡'+c.armor,x+2,y+h-28);
    }
    if(c.stealth){
        ctx.fillStyle='rgba(200,200,255,0.3)';
        roundRect(ctx,x,y,w,h,6);ctx.fill();
        ctx.fillStyle='#fff';
        ctx.font='10px Arial';
        ctx.fillText('👻',x+w-16,y+18);
    }
    if(!c.canAttack && c.faction!=='策' && !c.hasAttacked){
        ctx.fillStyle='rgba(0,0,0,0.4)';
        roundRect(ctx,x,y,w,h,6);ctx.fill();
    }
    if(c.hasAttacked){
        ctx.strokeStyle='rgba(255,100,100,0.6)';
        ctx.lineWidth=2;
        ctx.setLineDash([3,3]);
        roundRect(ctx,x,y,w,h,6);ctx.stroke();
        ctx.setLineDash([]);
    }
}

function drawBtn(ctx,x,y,w,h,text,name,color,textColor){
    G.btnRects[name]={x:x,y:y,w:w,h:h};
    const c=color||'#c9302c';
    const grad=ctx.createLinearGradient(x,y,x,y+h);
    grad.addColorStop(0,c);
    grad.addColorStop(1,'#000');
    ctx.fillStyle=grad;
    ctx.strokeStyle='#ffd700';
    ctx.lineWidth=2;
    roundRect(ctx,x,y,w,h,8);
    ctx.fill();ctx.stroke();
    ctx.fillStyle=textColor||'#fff';
    ctx.font='bold 16px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(text,x+w/2,y+h/2);
    ctx.textBaseline='alphabetic';
    ctx.textAlign='left';
}

function hitBtn(p,name){
    const r=G.btnRects[name];
    return r && p.x>=r.x && p.x<=r.x+r.w && p.y>=r.y && p.y<=r.y+r.h;
}

function getPos(e){
    const rect=canvas.getBoundingClientRect();
    const t=e.touches?e.touches[0]:e;
    return{x:(t.clientX-rect.left)/scale,y:(t.clientY-rect.top)/scale};
}

function rectHit(p,r){
    return p.x>=r.x && p.x<=r.x+r.w && p.y>=r.y && p.y<=r.y+r.h;
}

function cardRectsHand(){
    const rs=[];
    const n=G.playerHand.length;
    const gap=8;
    const totalW=n*62+(n-1)*gap;
    let startX=(W-totalW)/2;
    const y=H-140;
    for(let i=0;i<n;i++){
        rs.push({x:startX+i*(62+gap),y:y,w:62,h:100,idx:i,card:G.playerHand[i]});
    }
    return rs;
}

function cardRectsPlayer(){
    const rs=[];
    const n=G.playerField.length;
    if(n===0)return rs;
    const gap=8;
    const cardW=Math.min(66,(W-80-gap*(n-1))/n);
    const totalW=n*cardW+(n-1)*gap;
    let startX=(W-totalW)/2;
    const y=H-290;
    for(let i=0;i<n;i++){
        rs.push({x:startX+i*(cardW+gap),y:y,w:cardW,h:94,idx:i,card:G.playerField[i]});
    }
    return rs;
}

function cardRectsEnemy(){
    const rs=[];
    const n=G.enemyField.length;
    if(n===0)return rs;
    const gap=8;
    const cardW=Math.min(66,(W-80-gap*(n-1))/n);
    const totalW=n*cardW+(n-1)*gap;
    let startX=(W-totalW)/2;
    const y=160;
    for(let i=0;i<n;i++){
        rs.push({x:startX+i*(cardW+gap),y:y,w:cardW,h:94,idx:i,card:G.enemyField[i]});
    }
    return rs;
}

function useCard(card){
    if(!G.isPlayerTurn)return;
    if(card.cost>G.playerEnergy){
        addFloatText(W/2,H/2,'能量不足!','#ff6b6b');
        return false;
    }
    G.playerEnergy-=card.cost;
    G.playerHand=G.playerHand.filter(c=>c.uid!==card.uid);
    G.score+=card.cost*10;
    if(card.faction==='策'){
        executeSpell(card);
    }else{
        card.canAttack=false;
        card.hasAttacked=false;
        G.playerField.push(card);
        addFloatText(W/2,H-300,card.name+' 登场!',card.color);
        sfxSkill();
        spawnParticles(W/2,H-260,card.color,20);
        executeBattlecry(card,'player');
    }
    checkGameOver();
    return true;
}

function executeSpell(card){
    sfxSkill();
    spawnParticles(W/2,H/2,card.color,30);
    switch(card.skillType){
        case 'spelldmg':
            if(G.enemyField.length>0){
                const target=G.enemyField[0];
                dealDamage(target,card.skillVal,'enemy');
            }else{
                dealDamageToHero('enemy',card.skillVal);
            }
            break;
        case 'aoeheal':
            G.playerField.forEach(c=>{
                const heal=Math.min(card.skillVal,c.maxHp-c.curHp);
                c.curHp+=heal;
                addFloatText(W/2+(G.playerField.indexOf(c)-G.playerField.length/2)*70,H-243,'+'+heal,'#4caf50');
            });
            const heroHeal=Math.min(card.skillVal,G.playerMaxHp-G.playerHp);
            G.playerHp+=heroHeal;
            if(heroHeal>0)addFloatText(W/2,H-340,'+'+heroHeal,'#4caf50');
            break;
        case 'draw':
            drawCard(card.skillVal,'p');
            break;
        case 'aoe':
            G.enemyField.forEach(c=>dealDamage(c,card.skillVal,'enemy'));
            dealDamageToHero('enemy',card.skillVal);
            break;
        case 'discard':
            break;
        case 'steal':
            drawCard(card.skillVal,'p');
            break;
    }
    addFloatText(W/2,H/2-50,card.name,card.color);
    G.shake=8;
}

function executeBattlecry(card,who){
    const selfSide=who==='player'?G.playerField:G.enemyField;
    const oppSide=who==='player'?G.enemyField:G.playerField;
    switch(card.skillType){
        case 'damage':
            if(oppSide.length>0){
                const t=oppSide[Math.floor(Math.random()*oppSide.length)];
                dealDamage(t,card.skillVal,who==='player'?'enemy':'player');
            }else{
                dealDamageToHero(who==='player'?'enemy':'player',card.skillVal);
            }
            break;
        case 'armor':
            card.armor=card.skillVal;
            break;
        case 'draw':
            if(who==='player')drawCard(card.skillVal,'p');
            break;
        case 'heal':
            if(who==='player'){
                const h=Math.min(card.skillVal,G.playerMaxHp-G.playerHp);
                G.playerHp+=h;
                addFloatText(W/2,H-340,'+'+h,'#4caf50');
            }else{
                const h=Math.min(card.skillVal,G.enemyMaxHp-G.enemyHp);
                G.enemyHp+=h;
            }
            break;
        case 'charge':
            card.canAttack=true;
            break;
        case 'stealth':
            card.stealth=true;
            break;
    }
}

function dealDamage(target,amount,side){
    let dmg=amount;
    if(target.armor>0){
        const absorb=Math.min(target.armor,dmg);
        target.armor-=absorb;
        dmg-=absorb;
        sfxDefend();
    }
    target.curHp-=dmg;
    const rects=side==='player'?cardRectsPlayer():cardRectsEnemy();
    const r=rects.find(rr=>rr.card.uid===target.uid);
    const tx=r?r.x+r.w/2:W/2;
    const ty=r?r.y+r.h/2:(side==='player'?H-290:160);
    addFloatText(tx,ty,'-'+dmg,'#ff6b6b');
    sfxAttack();
    spawnParticles(tx,ty,'#ff6b6b',10);
    G.shake=Math.max(G.shake,5);
    if(target.curHp<=0){
        killCard(target,side);
    }
}

function dealDamageToHero(side,amount){
    let dmg=amount;
    if(side==='player'){
        if(G.playerArmor>0){
            const a=Math.min(G.playerArmor,dmg);
            G.playerArmor-=a;dmg-=a;sfxDefend();
        }
        G.playerHp-=dmg;
        addFloatText(W/2,H-360,'-'+dmg,'#ff6b6b');
    }else{
        if(G.enemyArmor>0){
            const a=Math.min(G.enemyArmor,dmg);
            G.enemyArmor-=a;dmg-=a;sfxDefend();
        }
        G.enemyHp-=dmg;
        addFloatText(W/2,100,'-'+dmg,'#ff6b6b');
    }
    sfxAttack();
    G.shake=8;
    G.flash=10;G.flashColor='#ff3333';
}

function killCard(card,side){
    sfxDeath();
    const rects=side==='player'?cardRectsPlayer():cardRectsEnemy();
    const r=rects.find(rr=>rr.card.uid===card.uid);
    if(r)spawnParticles(r.x+r.w/2,r.y+r.h/2,'#333',20);
    if(side==='player'){
        G.playerField=G.playerField.filter(c=>c.uid!==card.uid);
    }else{
        G.enemyField=G.enemyField.filter(c=>c.uid!==card.uid);
        G.score+=20;
    }
    if(card.skillType==='deathdraw' && side==='player'){
        drawCard(card.skillVal,'p');
    }
}

function attackerCanHitTarget(attacker,target,attackerSide){
    if(target.stealth && attackerSide==='enemy'){
        const others=G.playerField.filter(c=>c.uid!==target.uid && !c.stealth);
        if(others.length>0)return false;
    }
    if(target.stealth && attackerSide==='player'){
        const others=G.enemyField.filter(c=>c.uid!==target.uid && !c.stealth);
        if(others.length>0)return false;
    }
    return true;
}

function performAttack(attacker,target,attackerSide){
    if(!attackerCanHitTarget(attacker,target,attackerSide)){
        addFloatText(W/2,H/2,'需先清除嘲讽!','#ffc107');
        return false;
    }
    if(attacker.stealth)attacker.stealth=false;
    let atkVal=attacker.curAtk+(attacker.buffAtk||0);
    if(attacker.skillType==='atkboost')atkVal+=attacker.skillVal;
    if(attacker.skillType==='berserk'){
        const ratio=1-attacker.curHp/attacker.maxHp;
        atkVal+=Math.floor(ratio*3);
    }
    const targetSide=attackerSide==='player'?'enemy':'player';
    const pierce=attacker.skillType==='pierce';
    if(!pierce){
        dealDamage(target,atkVal,targetSide);
    }else{
        target.curHp-=atkVal;
        const rects=targetSide==='player'?cardRectsPlayer():cardRectsEnemy();
        const r=rects.find(rr=>rr.card.uid===target.uid);
        const tx=r?r.x+r.w/2:W/2;
        const ty=r?r.y+r.h/2:160;
        addFloatText(tx,ty,'-'+atkVal+' 穿!','#ff9800');
        sfxAttack();
        G.shake=6;
        if(target.curHp<=0)killCard(target,targetSide);
    }
    if(target.curHp>0 && target.faction!=='策'){
        const counterAtk=target.curAtk+(target.buffAtk||0);
        if(!attacker.stealth || attackerSide==='enemy'){
            dealDamage(attacker,counterAtk,attackerSide);
        }
    }
    if(target.skillType==='reflect' && target.curHp>0){
        dealDamage(attacker,target.skillVal,attackerSide);
    }
    attacker.hasAttacked=true;
    attacker.canAttack=false;
    return true;
}

function attackHero(attacker,attackerSide){
    if(attacker.stealth)attacker.stealth=false;
    let atkVal=attacker.curAtk+(attacker.buffAtk||0);
    if(attacker.skillType==='atkboost')atkVal+=attacker.skillVal;
    dealDamageToHero(attackerSide==='player'?'enemy':'player',atkVal);
    attacker.hasAttacked=true;
    attacker.canAttack=false;
}

function checkGameOver(){
    if(G.enemyHp<=0){
        if(G.level>=G.maxLevel){
            G.state=STATE_OVER;
            G.score+=500;
            if(G.score>G.highScore){
                G.highScore=G.score;
                Storage.save('sanguo_high',G.highScore);
            }
            sfxWin();
        }else{
            nextLevel();
        }
    }else if(G.playerHp<=0){
        G.state=STATE_OVER;
        if(G.score>G.highScore){
            G.highScore=G.score;
            Storage.save('sanguo_high',G.highScore);
        }
        sfxLose();
    }
}

function nextLevel(){
    G.level++;
    G.enemyMaxHp=20+G.level*5;
    G.enemyHp=G.enemyMaxHp;
    G.enemyArmor=Math.floor(G.level/2);
    G.playerMaxEnergy=Math.min(10,G.playerMaxEnergy+1);
    G.playerEnergy=G.playerMaxEnergy;
    G.playerHp=Math.min(G.playerMaxHp,G.playerHp+8);
    G.playerField.forEach(c=>{
        c.canAttack=true;c.hasAttacked=false;
        if(c.skillType==='buff')c.buffAtk=(c.buffAtk||0)+c.skillVal;
    });
    drawCard(2,'p');
    spawnEnemyField();
    G.turn=1;G.isPlayerTurn=true;
    addFloatText(W/2,H/2,'第'+G.level+'关!','#ffd700');
    sfxWin();
}

function spawnEnemyField(){
    G.enemyField=[];
    const n=Math.min(5,1+Math.floor(G.level/1.5));
    const pool=CARD_POOL.filter(c=>c.faction!=='策');
    for(let i=0;i<n;i++){
        const tpl=pool[Math.floor(Math.random()*pool.length)];
        const c=makeCard(tpl);
        c.curAtk+=Math.floor(G.level/3);
        c.curHp+=Math.floor(G.level/2);
        c.maxHp=c.curHp;
        c.canAttack=false;
        G.enemyField.push(c);
    }
}

function startPlayerTurn(){
    G.isPlayerTurn=true;
    G.turn++;
    G.playerMaxEnergy=Math.min(10,G.playerMaxEnergy+1);
    G.playerEnergy=G.playerMaxEnergy;
    G.playerField.forEach(c=>{
        c.canAttack=true;c.hasAttacked=false;
        if(c.skillType==='buff')c.buffAtk=(c.buffAtk||0)+c.skillVal;
    });
    drawCard(1,'p');
}

function enemyTurn(){
    G.isPlayerTurn=false;
    G.animating=true;
    setTimeout(()=>{
        const eEnergy=Math.min(10,G.level+2);
        let ee=eEnergy;
        const pool=CARD_POOL.filter(c=>c.faction!=='策');
        let tries=0;
        while(ee>0 && tries<5 && G.enemyField.length<5){
            const affordable=pool.filter(c=>c.cost<=ee);
            if(affordable.length===0)break;
            const tpl=affordable[Math.floor(Math.random()*affordable.length)];
            ee-=tpl.cost;
            const c=makeCard(tpl);
            c.curAtk+=Math.floor(G.level/3);
            c.curHp+=Math.floor(G.level/2);
            c.maxHp=c.curHp;
            c.canAttack=false;
            G.enemyField.push(c);
            executeBattlecry(c,'enemy');
            tries++;
        }
        setTimeout(()=>{
            enemyAttackPhase();
        },600);
    },500);
}

function enemyAttackPhase(){
    const attackers=G.enemyField.filter(c=>c.canAttack && !c.hasAttacked);
    let idx=0;
    function doOne(){
        if(idx>=attackers.length){
            G.enemyField.forEach(c=>{c.canAttack=true;c.hasAttacked=false;});
            G.animating=false;
            startPlayerTurn();
            return;
        }
        const atk=attackers[idx++];
        const validTargets=G.playerField.filter(t=>attackerCanHitTarget(atk,t,'enemy'));
        if(validTargets.length>0 && Math.random()<0.7){
            const t=validTargets[Math.floor(Math.random()*validTargets.length)];
            performAttack(atk,t,'enemy');
        }else{
            attackHero(atk,'enemy');
        }
        checkGameOver();
        if(G.state===STATE_PLAYING)setTimeout(doOne,500);
    }
    doOne();
}

function endTurn(){
    if(!G.isPlayerTurn||G.animating)return;
    sfxBtn();
    G.selectedCard=null;G.selectedField=null;G.targetMode=false;
    enemyTurn();
}

function drawHpBar(ctx,x,y,w,hp,maxHp,color,armor,label){
    const barW=w;
    ctx.fillStyle='rgba(0,0,0,0.6)';
    roundRect(ctx,x-2,y-2,barW+4,18,4);ctx.fill();
    const ratio=Math.max(0,hp/maxHp);
    ctx.fillStyle=color;
    roundRect(ctx,x,y,barW*ratio,14,3);ctx.fill();
    ctx.strokeStyle='#ffd700';ctx.lineWidth=1;
    roundRect(ctx,x,y,barW,14,3);ctx.stroke();
    ctx.fillStyle='#fff';
    ctx.font='bold 12px "Microsoft YaHei"';
    ctx.textAlign='left';
    ctx.fillText(label,x+4,y+11);
    ctx.textAlign='right';
    let txt=hp+'/'+maxHp;
    if(armor>0)txt+=' 🛡'+armor;
    ctx.fillText(txt,x+barW-4,y+11);
    ctx.textAlign='left';
}

function drawEnergy(ctx){
    const barX=W/2-100,barY=H-30,barW=200,barH=18;
    ctx.fillStyle='rgba(0,0,0,0.6)';
    roundRect(ctx,barX-2,barY-2,barW+4,barH+4,4);ctx.fill();
    for(let i=0;i<G.playerMaxEnergy;i++){
        const sx=barX+i*(barW/G.playerMaxEnergy)+1;
        const sw=(barW/G.playerMaxEnergy)-2;
        ctx.fillStyle=i<G.playerEnergy?'#2196f3':'#37474f';
        roundRect(ctx,sx,barY,sw,barH,3);ctx.fill();
    }
    ctx.strokeStyle='#ffd700';ctx.lineWidth=1;
    roundRect(ctx,barX,barY,barW,barH,3);ctx.stroke();
    ctx.fillStyle='#fff';
    ctx.font='bold 11px "Microsoft YaHei"';
    ctx.textAlign='center';
    ctx.fillText('能量 '+G.playerEnergy+'/'+G.playerMaxEnergy,W/2,barY+13);
    ctx.textAlign='left';
}

function drawBoard(ctx){
    const bgGrad=ctx.createLinearGradient(0,0,0,H);
    bgGrad.addColorStop(0,'#3e1f0a');
    bgGrad.addColorStop(0.5,'#1a0a00');
    bgGrad.addColorStop(1,'#3e1f0a');
    ctx.fillStyle=bgGrad;
    ctx.fillRect(0,0,W,H);
    for(let i=0;i<8;i++){
        ctx.strokeStyle='rgba(255,215,0,0.04)';
        ctx.lineWidth=1;
        ctx.beginPath();
        ctx.moveTo(0,80+i*90);ctx.lineTo(W,80+i*90);
        ctx.stroke();
    }
    ctx.strokeStyle='rgba(255,215,0,0.15)';
    ctx.setLineDash([8,8]);
    ctx.lineWidth=2;
    ctx.strokeRect(30,145,W-60,120);
    ctx.strokeRect(30,H-310,W-60,120);
    ctx.setLineDash([]);
    ctx.fillStyle='rgba(255,215,0,0.06)';
    ctx.fillRect(30,145,W-60,120);
    ctx.fillStyle='rgba(50,200,100,0.06)';
    ctx.fillRect(30,H-310,W-60,120);
}

function drawTargetHints(ctx){
    if(G.targetMode && G.selectedField){
        ctx.fillStyle='rgba(255,0,0,0.15)';
        const ers=cardRectsEnemy();
        ers.forEach(r=>{
            if(attackerCanHitTarget(G.playerField.find(c=>c.uid===G.selectedField),r.card,'player')){
                roundRect(ctx,r.x-4,r.y-4,r.w+8,r.h+8,10);ctx.fill();
            }
        });
        ctx.fillStyle='rgba(255,0,0,0.1)';
        roundRect(ctx,W/2-60,15,120,40,8);ctx.fill();
        ctx.strokeStyle='#ff6b6b';ctx.lineWidth=2;
        roundRect(ctx,W/2-60,15,120,40,8);ctx.stroke();
        ctx.fillStyle='#ff6b6b';
        ctx.font='bold 13px "Microsoft YaHei"';
        ctx.textAlign='center';
        ctx.fillText('点击攻击敌将',W/2,42);
        ctx.textAlign='left';
    }
    if(G.selectedCard){
        const c=G.playerHand.find(x=>x.uid===G.selectedCard);
        if(c && c.cost<=G.playerEnergy){
            ctx.fillStyle='rgba(0,255,100,0.1)';
            roundRect(ctx,W/2-60,H-305,120,30,8);ctx.fill();
            ctx.fillStyle='#4caf50';
            ctx.font='bold 12px "Microsoft YaHei"';
            ctx.textAlign='center';
            if(c.faction==='策'){
                ctx.fillText('点击使用策略',W/2,H-285);
            }else{
                ctx.fillText('点击召唤上场',W/2,H-285);
            }
            ctx.textAlign='left';
        }
    }
}

function drawMenu(ctx){
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#4a148c');
    g.addColorStop(0.5,'#880e4f');
    g.addColorStop(1,'#3e1f0a');
    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);
    for(let i=0;i<50;i++){
        ctx.fillStyle=`rgba(255,215,0,${Math.random()*0.3})`;
        const x=(i*97)%W,y=(i*53)%H;
        ctx.fillRect(x,y,2,2);
    }
    ctx.save();
    ctx.translate(W/2,180);
    const t=Date.now()/1000;
    ctx.rotate(Math.sin(t)*0.05);
    ctx.fillStyle='#c9302c';
    roundRect(ctx,-140,-60,280,120,20);ctx.fill();
    ctx.strokeStyle='#ffd700';ctx.lineWidth=4;
    roundRect(ctx,-140,-60,280,120,20);ctx.stroke();
    ctx.restore();
    ctx.fillStyle='#ffd700';
    ctx.font='bold 52px "Microsoft YaHei"';
    ctx.textAlign='center';
    ctx.fillText('三国卡牌',W/2,170);
    ctx.fillText('对战',W/2,225);
    ctx.textAlign='left';
    const factions=[['蜀','#2e7d32','⚔️'],['魏','#1565c0','🏰'],['吴','#e65100','🌊'],['群','#6a1b9a','🦁']];
    for(let i=0;i<4;i++){
        const fx=40+i*100,fy=320;
        ctx.fillStyle=factions[i][1];
        roundRect(ctx,fx,fy,90,90,15);ctx.fill();
        ctx.strokeStyle='#ffd700';ctx.lineWidth=2;
        roundRect(ctx,fx,fy,90,90,15);ctx.stroke();
        ctx.font='36px Arial';ctx.textAlign='center';
        ctx.fillText(factions[i][2],fx+45,fy+48);
        ctx.fillStyle='#fff';
        ctx.font='bold 18px "Microsoft YaHei"';
        ctx.fillText(factions[i][0]+'国',fx+45,fy+80);
        ctx.textAlign='left';
    }
    ctx.fillStyle='#ffd700';
    ctx.font='bold 18px "Microsoft YaHei"';
    ctx.textAlign='center';
    ctx.fillText('历史最高分: '+G.highScore,W/2,460);
    ctx.textAlign='left';
    drawBtn(ctx,W/2-110,500,220,60,'⚔️ 征战天下','start','#c9302c');
    const tips=[
        '🃏 拖动或点击手牌召唤武将',
        '⚔️ 点击我方武将后再点敌方攻击',
        '🎯 消灭敌将后可直取敌酋',
        '🛡️ 每回合能量+1,上限10点',
        '🏆 通过8关获得最终胜利!'
    ];
    ctx.fillStyle='rgba(255,255,255,0.75)';
    ctx.font='13px "Microsoft YaHei"';
    ctx.textAlign='center';
    for(let i=0;i<tips.length;i++){
        ctx.fillText(tips[i],W/2,590+i*24);
    }
    ctx.textAlign='left';
}

function drawGame(ctx){
    drawBoard(ctx);
    drawHeroInfo(ctx);
    drawAllCards(ctx);
    drawTurnButtons(ctx);
    drawTargetHints(ctx);
    drawEnergy(ctx);
    drawParticles(ctx);
    drawFloatTexts(ctx);
}

function drawGameOver(ctx){
    const win=G.playerHp>0;
    const g=ctx.createLinearGradient(0,0,0,H);
    if(win){
        g.addColorStop(0,'#1b5e20');g.addColorStop(1,'#0a2a0a');
    }else{
        g.addColorStop(0,'#b71c1c');g.addColorStop(1,'#2a0a0a');
    }
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.fillStyle=win?'#ffd700':'#ff6b6b';
    ctx.font='bold 64px "Microsoft YaHei"';
    ctx.textAlign='center';
    ctx.fillText(win?'🏆 统一天下!':'💀 败走麦城',W/2,200);
    ctx.textAlign='left';
    ctx.fillStyle='#fff';
    ctx.font='bold 20px "Microsoft YaHei"';
    ctx.textAlign='center';
    ctx.fillText('通关关卡: '+Math.min(G.level,G.maxLevel)+'/'+G.maxLevel,W/2,290);
    ctx.fillText('最终得分: '+G.score,W/2,325);
    if(G.score>=G.highScore){
        ctx.fillStyle='#ffd700';
        ctx.fillText('🎉 新纪录! 🎉',W/2,370);
    }else{
        ctx.fillText('历史最高: '+G.highScore,W/2,370);
    }
    ctx.textAlign='left';
    drawBtn(ctx,W/2-90,430,180,55,'⚔️ 再战','restart','#c9302c');
    drawBtn(ctx,W/2-70,505,140,45,'返回','menu','#555');
    ctx.fillStyle='rgba(255,255,255,0.55)';
    ctx.font='12px "Microsoft YaHei"';
    ctx.textAlign='center';
    ctx.fillText('策略+武将,智取天下!',W/2,590);
    ctx.textAlign='left';
}

function update(){
    updateParticles();
    updateFloatTexts();
    if(G.shake>0)G.shake-=0.5;
    if(G.flash>0)G.flash--;
    if(G.state!==STATE_PLAYING)return;
}

function draw(){
    ctx.save();
    if(G.shake>0){
        ctx.translate((Math.random()-0.5)*G.shake,(Math.random()-0.5)*G.shake);
    }
    switch(G.state){
        case STATE_MENU: drawMenu(ctx); break;
        case STATE_PLAYING: drawGame(ctx); break;
        case STATE_OVER: drawGameOver(ctx); break;
        case STATE_PAUSE: drawGame(ctx); break;
    }
    if(G.flash>0){
        ctx.globalAlpha=G.flash/20;
        ctx.fillStyle=G.flashColor;
        ctx.fillRect(0,0,W,H);
        ctx.globalAlpha=1;
    }
    ctx.restore();
}

function handlePointerDown(e){
    initAudio();
    const p=getPos(e);
    if(G.state===STATE_MENU){
        if(hitBtn(p,'start')){startGame();return}
    }else if(G.state===STATE_OVER){
        if(hitBtn(p,'restart')){startGame();return}
        if(hitBtn(p,'menu')){G.state=STATE_MENU;return}
    }else if(G.state===STATE_PLAYING){
        if(hitBtn(p,'endturn')){endTurn();return}
        if(hitBtn(p,'surrender')){G.playerHp=0;checkGameOver();return}
        if(G.targetMode && G.selectedField){
            if(p.y>15 && p.y<65){
                const attacker=G.playerField.find(c=>c.uid===G.selectedField);
                if(attacker)attackHero(attacker,'player');
                G.selectedField=null;G.targetMode=false;
                checkGameOver();
                return;
            }
            const ers=cardRectsEnemy();
            for(const r of ers){
                if(rectHit(p,r)){
                    const attacker=G.playerField.find(c=>c.uid===G.selectedField);
                    if(attacker)performAttack(attacker,r.card,'player');
                    G.selectedField=null;G.targetMode=false;
                    checkGameOver();
                    return;
                }
            }
            G.selectedField=null;G.targetMode=false;
            return;
        }
        const hrs=cardRectsHand();
        for(const r of hrs){
            if(rectHit(p,r)){
                if(G.selectedCard===r.card.uid){
                    useCard(r.card);
                    G.selectedCard=null;
                }else{
                    G.selectedCard=r.card.uid;
                    G.selectedField=null;G.targetMode=false;
                    sfxBtn();
                }
                return;
            }
        }
        const prs=cardRectsPlayer();
        for(const r of prs){
            if(rectHit(p,r)){
                if(r.card.canAttack && !r.card.hasAttacked && G.isPlayerTurn && !G.animating){
                    G.selectedField=r.card.uid;
                    G.targetMode=true;
                    G.selectedCard=null;
                    sfxBtn();
                }
                return;
            }
        }
        if(G.selectedCard){
            const c=G.playerHand.find(x=>x.uid===G.selectedCard);
            if(c){
                if(p.y>H-350 && p.y<H-160){
                    useCard(c);
                    G.selectedCard=null;
                    return;
                }
            }
        }
        G.selectedCard=null;G.selectedField=null;G.targetMode=false;
    }
}

function handlePointerMove(e){
    const p=getPos(e);
    G.hoverCard=null;G.hoverField=null;
    if(G.state!==STATE_PLAYING)return;
    const hrs=cardRectsHand();
    for(const r of hrs){if(rectHit(p,r)){G.hoverCard=r.card.uid;return}}
    const prs=cardRectsPlayer();
    for(const r of prs){if(rectHit(p,r)){G.hoverField=r.card.uid;return}}
}

canvas.addEventListener('mousedown',handlePointerDown);
canvas.addEventListener('mousemove',handlePointerMove);
canvas.addEventListener('touchstart',function(e){e.preventDefault();handlePointerDown(e)},{passive:false});
canvas.addEventListener('touchmove',function(e){e.preventDefault();handlePointerMove(e)},{passive:false});
canvas.addEventListener('touchend',function(e){e.preventDefault()},{passive:false});

function gameLoop(){
    requestAnimationFrame(gameLoop);
    update();
    draw();
}
gameLoop();

})();
</script>

  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>

  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {

    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {

  };
  window.clearAllBatchTimers = function() {
