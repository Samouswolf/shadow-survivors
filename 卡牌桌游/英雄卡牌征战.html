function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();}
function playTone(freq,dur,type,vol){if(!audioCtx)return;try{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type||'square';o.frequency.value=freq;g.gain.value=vol||0.15;g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur);}catch(e){}}
function sfxSwing(){playTone(500,0.04,'square',0.15);setTimeout(()=>playTone(200,0.08,'sawtooth',0.14),40);}
function sfxGold(){playTone(880,0.06,'sine',0.15);setTimeout(()=>playTone(1100,0.1,'sine',0.14),70);}
function sfxLevel(){for(let i=0;i<4;i++)setTimeout(()=>playTone(400+i*150,0.12,'sine',0.15),i*90);}

function sfxWin(){for(let i=0;i<5;i++)setTimeout(()=>playTone(500+i*100,0.16,'sine',0.2),i*100);}
function sfxLose(){for(let i=0;i<5;i++)setTimeout(()=>playTone(300-i*50,0.22,'sawtooth',0.18),i*130);}

const canvas=document.getElementById('c');const ctx=canvas.getContext('2d');let scale=1;
function resize(){const r=W/H;let cw=window.innerWidth,ch=window.innerHeight;if(cw/ch>r){ch=cw/r;}else{cw=ch*r;}canvas.width=cw;canvas.height=ch;scale=cw/W;ctx.setTransform(scale,0,0,scale,0,0);}

const G={

G.highScore=parseInt(Storage.load('hero_high','0'));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function makeCard(tpl){return{...tpl,uid:'s'+Math.random().toString(36).slice(2,9)};}
function buildDeck(){
    const d=[];
    for(let i=0;i<4;i++)d.push(makeCard(SKILL_CARDS[0]));
    for(let i=0;i<3;i++)d.push(makeCard(SKILL_CARDS[1]));
    for(let i=0;i<3;i++)d.push(makeCard(SKILL_CARDS[2]));
    for(let i=0;i<2;i++)d.push(makeCard(SKILL_CARDS[3]));
    for(let i=0;i<2;i++)d.push(makeCard(SKILL_CARDS[4]));
    for(let i=0;i<2;i++)d.push(makeCard(SKILL_CARDS[5]));
    for(let i=0;i<1;i++)d.push(makeCard(SKILL_CARDS[6]));
    return shuffle(d);
}
function addCardToDeck(card){G.deck.push(makeCard(card));shuffle(G.deck);}
function drawCards(n){
    for(let i=0;i<n;i++){
        if(G.hand.length>=8)break;
        if(G.deck.length===0){G.deck=shuffle([...G.discard]);G.discard=[];}
        if(G.deck.length>0)G.hand.push(G.deck.pop());
    }
}
function discardHand(){G.discard.push(...G.hand);G.hand=[];}
let particles=[];
function spawnParticles(x,y,color,count){count=count||12;for(let i=0;i<count;i++)particles.push({x,y,vx:(Math.random()-0.5)*8,vy:(Math.random()-0.5)*8-3,life:35+Math.random()*20,maxLife:55,size:2+Math.random()*4,color});}
function updateParticles(){for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.25;p.vx*=0.98;p.life--;if(p.life<=0)particles.splice(i,1);}}
function drawParticles(ctx){for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.maxLife);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;}
let floats=[];
function addFloat(x,y,t,c){floats.push({x,y,text:t,color:c||'#fff',life:60,maxLife:60,vy:-1.5});}
function updateFloats(){for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.y+=f.vy;f.vy*=0.96;f.life--;if(f.life<=0)floats.splice(i,1);}}
function drawFloats(ctx){for(const f of floats){ctx.globalAlpha=f.life/f.maxLife;ctx.fillStyle=f.color;ctx.strokeStyle='#000';ctx.lineWidth=3;ctx.font='bold 22px "Microsoft YaHei"';ctx.textAlign='center';ctx.strokeText(f.text,f.x,f.y);ctx.fillText(f.text,f.x,f.y);ctx.textAlign='left';}ctx.globalAlpha=1;}
function roundRect(ctx,x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
function totalAtk(){
    let a=G.heroAtk;
    if(G.equipment.weapon)a+=G.equipment.weapon.bonus.atk||0;
    if(G.equipment.special&&G.equipment.special.bonus.atk)a+=G.equipment.special.bonus.atk;
    if(G.buffAtkTurn>0)a+=G.buffAtk;
    if(G.rageTurn>0)a+=G.rage;
    if(G.heroClass){
        const ratio=1-G.heroHp/G.heroMaxHp;
        if(G.heroClass.id==='warrior')a+=Math.floor(ratio*8);
    }
    return Math.max(1,a);
}
function totalDef(){
    let d=G.heroDef;
    if(G.equipment.armor)d+=G.equipment.armor.bonus.def||0;
    if(G.equipment.special&&G.equipment.special.bonus.def)d+=G.equipment.special.bonus.def;
    if(G.rageTurn>0)d-=4;
    if(G.heroClass&&G.heroClass.id==='knight')d=Math.ceil(d*1.2);
    return Math.max(0,d);
}
function totalCrit(){
    let c=5;
    if(G.heroClass&&G.heroClass.id==='hunter')c+=15;
    if(G.equipment.special&&G.equipment.special.bonus.crit)c+=G.equipment.special.bonus.crit;
    return c;
}
function drawCardView(ctx,c,x,y,w,h,selected){
    h=h||94;w=w||60;
    const rcol=c.rar==='SSR'?'#ffd700':c.rar==='SR'?'#a855f7':c.rar==='R'?'#3b82f6':'#9ca3af';
    const g=ctx.createLinearGradient(x,y,x,y+h);
    g.addColorStop(0,rcol);g.addColorStop(0.4,'#16213e');g.addColorStop(1,'#001122');
    ctx.fillStyle=g;roundRect(ctx,x,y,w,h,6);ctx.fill();
    if(selected||G.hoverCard===c.uid){ctx.strokeStyle='#ffd700';ctx.lineWidth=3;ctx.shadowBlur=12;ctx.shadowColor='#ffd700';}
    else{ctx.strokeStyle=rcol;ctx.lineWidth=2;}
    roundRect(ctx,x,y,w,h,6);ctx.stroke();ctx.shadowBlur=0;
    const cost=c.cost||0;
    ctx.fillStyle='#1976d2';ctx.beginPath();ctx.arc(x+10,y+11,8,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold 11px Arial';ctx.textAlign='center';ctx.fillText(cost,x+10,y+15);ctx.textAlign='left';
    const es=Math.min(24,w*0.4);ctx.font=es+'px Arial';ctx.textAlign='center';
    ctx.fillText(c.emoji,x+w/2,y+h*0.38);ctx.textAlign='left';
    ctx.fillStyle='#fff';ctx.font='bold '+Math.min(9,w*0.14)+'px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.fillText(c.name.length>4?c.name.slice(0,4):c.name,x+w/2,y+h*0.58);
    ctx.font='8px "Microsoft YaHei"';ctx.fillStyle='rgba(255,255,255,0.85)';
    const desc=(c.desc||'').length>9?(c.desc||'').slice(0,9)+'..':(c.desc||'');
    ctx.fillText(desc,x+w/2,y+h*0.72);
    ctx.fillStyle=rcol;ctx.font='bold 8px Arial';ctx.fillText(c.rar||'N',x+w/2,y+h*0.84);
    ctx.textAlign='left';
}
function drawBtn(ctx,x,y,w,h,text,name,color){
    G.btnRects[name]={x,y,w,h};
    const c=color||'#00796b';const grad=ctx.createLinearGradient(x,y,x,y+h);
    grad.addColorStop(0,c);grad.addColorStop(1,'#000');
    ctx.fillStyle=grad;ctx.strokeStyle='#ffd700';ctx.lineWidth=2;roundRect(ctx,x,y,w,h,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold 14px "Microsoft YaHei"';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(text,x+w/2,y+h/2);ctx.textBaseline='alphabetic';ctx.textAlign='left';
}
function hitBtn(p,name){const r=G.btnRects[name];return r&&p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;}
function getPos(e){const rect=canvas.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:(t.clientX-rect.left)/scale,y:(t.clientY-rect.top)/scale};}
function rectHit(p,r){return p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;}
function cardRectsHand(){
    const rs=[],n=G.hand.length,gap=5;
    const tw=n*58+(n-1)*gap;let sx=(W-tw)/2;const y=H-130;
    for(let i=0;i<n;i++)rs.push({x:sx+i*(58+gap),y,w:58,h:94,idx:i,card:G.hand[i]});
    return rs;
}
function useSkillCard(card){
    if(!G.playerTurn||G.animating||G.energy<(card.cost||0)){if(G.energy<(card.cost||0))addFloat(W/2,H/2,'能量不足!','#ff6b6b');return false;}
    G.energy-=card.cost||0;
    G.hand=G.hand.filter(c=>c.uid!==card.uid);
    G.discard.push(card);
    sfxItem();G.shake=3;
    switch(card.effect){
        case 'crit':G.critNext=card.val;addFloat(W/2,H-320,'暴击准备!','#ff9800');break;
        case 'block':G.blockNext=card.val;addFloat(W/2,H-320,'防御姿态!','#2196f3');break;
        case 'heal':{const h=Math.min(card.val,G.heroMaxHp-G.heroHp);G.heroHp+=h;addFloat(W/2,H-340,'+'+h,'#4caf50');break;}
        case 'dmg':{dealDmgToEnemy(card.val);break;}
        case 'buff':G.buffAtk=card.val;G.buffAtkTurn=4;addFloat(W/2,H-320,'攻击+'+card.val,'#ff5722');break;
        case 'dodge':G.dodgeNext=card.val;addFloat(W/2,H-320,'闪避!','#9c27b0');break;
        case 'dot':G.enemyPoison=Math.max(G.enemyPoison,card.val);addFloat(W/2,180,'中毒!','#689f38');break;
        case 'steal':{const d=dealDmgToEnemy(card.val);const h=Math.min(d,G.heroMaxHp-G.heroHp);G.heroHp+=h;if(h>0)addFloat(W/2,H-340,'+'+h,'#4caf50');break;}
        case 'shield':G.shield+=card.val;addFloat(W/2,H-320,'护盾+'+card.val,'#64b5f6');break;
        case 'rage':G.rage=card.val;G.rageTurn=1;addFloat(W/2,H-320,'狂暴!','#f44336');break;
        case 'nuke':{dealTrueDmg(card.val);sfxSwing();break;}
        case 'skip':G.enemySkip=card.val+1;addFloat(W/2,180,'时停!','#ffd700');break;
    }
    checkBattleEnd();return true;
}
function dealTrueDmg(val){
    G.enemyHp-=val;
    addFloat(W/2,220,'-'+val+' 真','#ff5252');
    spawnParticles(W/2,220,'#ff5252',18);
    sfxHit();G.shake=8;G.flash=10;G.flashColor='#ff3333';
}
function dealDmgToEnemy(baseVal){
    let dmg=baseVal;
    let isCrit=Math.random()*100<G.critNext;
    if(isCrit){dmg=Math.floor(dmg*1.5);addFloat(W/2,200,'暴击!','#ffd700');}
    const absorbed=Math.min(G.enemyDef,dmg);
    dmg-=absorbed;
    G.enemyHp-=dmg;
    addFloat(W/2,220,'-'+dmg+(absorbed>0?'('+absorbed+'挡)':''),'#ff6b6b');
    spawnParticles(W/2,220,'#ff4444',12);
    sfxSwing();G.shake=5;
    return dmg;
}
function playerAttack(){
    if(!G.playerTurn||G.animating)return;
    G.animating=true;
    let atk=totalAtk();
    let isCrit=G.critNext>0?Math.random()*100<G.critNext:Math.random()*100<totalCrit();
    if(G.critNext>0)G.critNext=0;
    if(G.heroClass){
        if(G.heroClass.id==='mage'&&Math.random()<0.3){atk*=2;addFloat(W/2,H-320,'法术双倍!','#e040fb');isCrit=true;}
        if(G.heroClass.id==='rogue'&&Math.random()<0.25){
            const defSav=G.enemyDef;
            const t1=atk,isC1=isCrit;
            setTimeout(()=>{
                let d=t1;if(isC1)d*=1.5;
                const a=Math.min(G.enemyDef,d);d-=a;
                G.enemyHp-=d;
                addFloat(W/2,220,'-'+d,'#ff6b6b');
                spawnParticles(W/2,220,'#ff4444',10);sfxSwing();G.shake=5;
                checkBattleEnd();
            },300);
        }
    }
    if(isCrit){atk*=1.5;addFloat(W/2,200,'💥 暴击!','#ffd700');}
    atk=Math.floor(atk);
    const absorbed=Math.min(G.enemyDef,atk);
    let dmg=atk-absorbed;
    G.enemyHp-=dmg;
    addFloat(W/2,220,'-'+dmg+(absorbed>0?' 🛡':''),'#ff6b6b');
    spawnParticles(W/2,220,'#ff4444',14);sfxSwing();G.shake=6;
    setTimeout(()=>{G.animating=false;checkBattleEnd();},250);
}
function enemyAttack(){
    if(G.enemySkip>0){G.enemySkip--;addFloat(W/2,180,'敌人跳过','#90a4ae');endEnemyTurn();return;}
    if(G.dodgeNext>0&&Math.random()*100<G.dodgeNext){addFloat(W/2,H-340,'闪避!','#9c27b0');G.dodgeNext=0;endEnemyTurn();return;}
    let atk=G.enemyAtk;
    if(Math.random()<5){atk*=1.5;addFloat(W/2,180,'敌暴击!','#ff1744');}
    let def=totalDef();
    if(G.blockNext>0){def+=G.blockNext;G.blockNext=0;}
    if(G.heroClass&&G.heroClass.id==='knight')atk=Math.floor(atk*0.8);
    const absorbed=Math.min(def,atk);
    let dmg=atk-absorbed;
    if(G.shield>0){
        const sh=Math.min(G.shield,dmg);
        dmg-=sh;G.shield-=sh;
        addFloat(W/2,H-340,'🛡-'+sh,'#64b5f6');
    }
    if(dmg>0){
        G.heroHp-=dmg;
        addFloat(W/2,H-340,'-'+dmg+(absorbed>0?' 🛡':''),'#ff5252');
    }else{
        addFloat(W/2,H-340,'无伤','#78909c');
    }
    spawnParticles(W/2,H-340,'#ff4444',12);sfxHit();G.shake=6;G.flash=8;G.flashColor='#ff3333';
    endEnemyTurn();
}
function endEnemyTurn(){
    if(G.heroClass&&G.heroClass.id==='priest'){
        const h=3;const hh=Math.min(h,G.heroMaxHp-G.heroHp);
        G.heroHp+=hh;if(hh>0)addFloat(W/2,H-340,'+'+hh+'✨','#4caf50');
    }
    if(G.playerDot>0){G.heroHp-=3;G.playerDot--;addFloat(W/2,H-340,'毒-3','#8bc34a');}
    if(G.buffAtkTurn>0)G.buffAtkTurn--;
    if(G.rageTurn>0)G.rageTurn--;
    G.turn++;
    G.playerTurn=true;
    G.maxEnergy=Math.min(10,G.maxEnergy+1);
    G.energy=G.maxEnergy;
    discardHand();drawCards(5);
    checkBattleEnd();
}
function endPlayerTurn(){
    if(!G.playerTurn||G.animating)return;
    sfxBtn();G.playerTurn=false;
    G.shield=Math.floor(G.shield*0.5);
    if(G.enemyPoison>0){
        G.enemyHp-=4;G.enemyPoison--;
        addFloat(W/2,220,'毒-4','#8bc34a');
    }
    setTimeout(()=>{enemyAttack();},400);
}
function spawnEnemy(){
    const stageMul=1+(G.stage-1)*0.25;
    const idx=Math.min(ENEMY_NAMES.length-1,Math.floor((G.stage-1)/1+Math.floor(Math.random()*3)));
    G.enemyName=ENEMY_NAMES[idx];
    const emojiMap=['👹','👺','💀','👾','🗡️','🧟','🐉','😈','🗡️','🧊','🕷️','🦇','☠️','😈','🐲'];
    G.enemyEmoji=emojiMap[idx]||'👾';
    G.enemyMaxHp=Math.floor((30+G.stage*10+G.wave*5)*stageMul);
    G.enemyHp=G.enemyMaxHp;
    G.enemyAtk=Math.floor((5+G.stage*1.5)*stageMul);
    G.enemyDef=Math.floor((2+G.stage*0.8)*stageMul);
    G.enemyPoison=0;G.enemySkip=0;
    spawnParticles(W/2,220,'#6a1b9a',25);
}
function startBattle(){
    G.wave++;
    spawnEnemy();
    G.turn=1;G.playerTurn=true;
    G.maxEnergy=Math.min(10,2+Math.floor(G.wave/2));G.energy=G.maxEnergy;
    discardHand();G.deck=buildDeck();G.discard=[];
    G.buffAtkTurn=0;G.rageTurn=0;G.dodgeNext=0;G.critNext=0;G.blockNext=0;G.shield=0;
    drawCards(5);
    G.animating=false;G.inShop=false;
}
function checkBattleEnd(){
    if(G.enemyHp<=0){
        const gold=30+G.stage*20+G.wave*10;
        G.gold+=gold;G.score+=G.stage*100+G.wave*30;
        sfxGold();
        addFloat(W/2,H/2,'💰+'+gold,'#ffd700');
        spawnParticles(W/2,H/2,'#ffd700',30);
        setTimeout(()=>{
            if(G.wave>=G.maxWave){
                if(G.stage>=G.maxStage){winGame();}
                else{enterShop();}
            }else{startBattle();}
        },800);
    }else if(G.heroHp<=0){
        if(G.equipment.special&&G.equipment.special.bonus.revive&&G.equipment.special.bonus.revive>0){
            G.equipment.special.bonus.revive--;
            G.heroHp=Math.floor(G.heroMaxHp*0.3);
            addFloat(W/2,H-340,'复活!','#ffd700');
            sfxLevel();spawnParticles(W/2,H-340,'#ffd700',30);
            if(G.equipment.special.bonus.revive<=0)G.equipment.special=null;
        }else{loseGame();}
    }
}
function enterShop(){
    G.inShop=true;G.shopItems=[];
    const items=shuffle([...EQUIPMENT]).slice(0,3);
    items.forEach((it,i)=>{G.shopItems.push({...it,idx:i,uid:'sh'+i});});
    const pool=shuffle([...SKILL_CARDS.filter(c=>c.rar!=='SSR')]).slice(0,2);
    pool.forEach((c,i)=>{G.shopItems.push({...c,idx:3+i,uid:'shc'+i,isCard:true,cost:20*(c.rar==='SR'?3:c.rar==='R'?2:1)});});
    sfxLevel();
}
function buyItem(item){
    if(G.gold<(item.cost||0)){addFloat(W/2,H/2,'金币不足!','#ff6b6b');return;}
    G.gold-=(item.cost||0);sfxItem();
    if(item.isCard){addCardToDeck(item);addFloat(W/2,H/2,'获得卡牌: '+item.name,'#4caf50');}
    else if(item.slot==='potion'){
        if(item.bonus.heal){const h=Math.min(item.bonus.heal,G.heroMaxHp-G.heroHp);G.heroHp+=h;addFloat(W/2,H/2,'+'+h,'#4caf50');}
        if(item.bonus.buffAtk){G.buffAtk=Math.max(G.buffAtk,item.bonus.buffAtk);G.buffAtkTurn=Math.max(G.buffAtkTurn,item.bonus.buffTurn);}
    }else{
        const old=G.equipment[item.slot];
        G.equipment[item.slot]={...item};
        if(item.bonus.hp){G.heroMaxHp+=item.bonus.hp;G.heroHp+=item.bonus.hp;}
        if(old&&old.bonus.hp){G.heroMaxHp-=old.bonus.hp;G.heroHp=Math.min(G.heroHp,G.heroMaxHp);}
        addFloat(W/2,H/2,'装备: '+item.name,'#4caf50');
    }
    G.shopItems=G.shopItems.filter(s=>s.uid!==item.uid);
}
function nextStage(){
    G.stage++;G.wave=0;G.inShop=false;
    G.heroHp=Math.min(G.heroMaxHp,G.heroHp+Math.floor(G.heroMaxHp*0.2));
    startBattle();
}
function winGame(){
    G.state=STATE_OVER;G.score+=G.stage*500+G.gold;
    if(G.score>G.highScore){G.highScore=G.score;Storage.save('hero_high',G.highScore);}
    sfxWin();
}
function loseGame(){
    G.state=STATE_OVER;
    if(G.score>G.highScore){G.highScore=G.score;Storage.save('hero_high',G.highScore);}
    sfxLose();
}
function startGame(classIdx){
    initAudio();

    G.heroClass=cls;
    G.heroMaxHp=cls.hp;G.heroHp=cls.hp;G.heroAtk=cls.atk;G.heroDef=cls.def;
    G.stage=1;G.wave=0;G.gold=50;G.score=0;

}

function drawHpBar(ctx,x,y,w,hp,max,color,label,sub){

    const rr=Math.max(0,hp/max);
    const g=ctx.createLinearGradient(x,y,x,y+18);
    g.addColorStop(0,color);g.addColorStop(1,'#000');
    ctx.fillStyle=g;roundRect(ctx,x,y,w*rr,18,4);ctx.fill();
    ctx.strokeStyle='#ffd700';ctx.lineWidth=1;roundRect(ctx,x,y,w,18,4);ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold 12px "Microsoft YaHei"';
    ctx.textAlign='left';ctx.fillText(label,x+5,y+13);
    ctx.textAlign='right';ctx.fillText(hp+'/'+max+(sub||''),x+w-5,y+13);ctx.textAlign='left';
}

function handlePointerDown(e){
    initAudio();const p=getPos(e);
    if(G.state===STATE_MENU){
        for(let i=0;i<CLASSES.length;i++)if(hitBtn(p,'cls'+i)){startGame(i);return;}
    }else if(G.state===STATE_OVER){
        if(hitBtn(p,'restart')){G.state=STATE_MENU;return;}
        if(hitBtn(p,'menu')){G.state=STATE_MENU;return;}
    }else if(G.state===STATE_PLAYING){
        if(G.inShop){
            for(let i=0;i<G.shopItems.length;i++)if(hitBtn(p,'shop'+i)){buyItem(G.shopItems[i]);return;}
            if(hitBtn(p,'nextStage')){nextStage();return;}
        }else{
            if(hitBtn(p,'attack')){playerAttack();return;}
            if(hitBtn(p,'end')){endPlayerTurn();return;}
            const hrs=cardRectsHand();
            for(const r of hrs){
                if(rectHit(p,r)){
                    if(G.selectedCard===r.card.uid){useSkillCard(r.card);G.selectedCard=null;}
                    else{G.selectedCard=r.card.uid;sfxBtn();}
                    return;
                }
            }
            if(p.y>0&&p.y<200&&G.selectedCard==null&&G.playerTurn&&!G.animating){playerAttack();return;}
            G.selectedCard=null;
        }
    }
}
function handlePointerMove(e){
    const p=getPos(e);G.hoverCard=null;
    if(G.state!==STATE_PLAYING)return;
    const hrs=cardRectsHand();for(const r of hrs)if(rectHit(p,r)){G.hoverCard=r.card.uid;return;}
}

function wrapText(text,x,y,maxW,lineH,align){
    const lines=[];let cur='';
    if(text.indexOf('\n')>=0){const ps=text.split('\n');for(const p of ps){
        const chars=p.split('');cur='';for(const ch of chars){
            const t2=cur+ch;if(ctx.measureText(t2).width>maxW){lines.push(cur);cur=ch;}else cur=t2;
        }lines.push(cur);}
    }else{
        const chars=text.split('');for(const ch of chars){
            const t2=cur+ch;if(ctx.measureText(t2).width>maxW){lines.push(cur);cur=ch;}else cur=t2;
        }lines.push(cur);}
    ctx.textAlign=align||'left';
    for(let i=0;i<lines.length;i++){ctx.fillText(lines[i],x,y+i*lineH);}
}

    ctx.fillText('征战之路 Lv.'+G.level+' 已解锁英雄: 6/6',W/2,py+385);
    ctx.fillStyle='#2196f3';roundRect(W/2-55,py+400,110,32,12,true,false);
    ctx.fillStyle='#fff';ctx.font='bold 15px Microsoft YaHei';
    ctx.fillText('✕ 关闭',W/2,py+422);
    G.detBtn={x:W/2-55,y:py+400,w:110,h:32,id:'close'};
}
function drawMenuExtras(){
    ctx.fillStyle='rgba(255,255,255,0.06)';roundRect(20,H-200,W-40,110,14,true,false);
    ctx.fillStyle='#ffd700';ctx.font='bold 14px Microsoft YaHei';ctx.textAlign='left';
    ctx.fillText('📊 征战统计',38,H-178);
    ctx.fillStyle='#ccc';ctx.font='12px Microsoft YaHei';
    ctx.fillText('胜场: '+G.wins+'     击杀累计: '+G.totalKills,38,H-152);
    ctx.fillText('总伤害: '+G.totalDmg+'     总治疗: '+G.totalHeal,38,H-132);
    ctx.fillText('金币累计: '+G.totalGold+'     最佳关卡: Lv.'+G.bestLevel,38,H-112);
    ctx.fillStyle='rgba(255,255,255,0.05)';roundRect(W-175,H-198,145,106,12,true,false);
    ctx.fillStyle='#fff';ctx.font='13px Microsoft YaHei';ctx.textAlign='center';
    ctx.fillText('🏆 '+G.achUnlocked.length+'/'+ACHIEVEMENTS.length,W-102,H-175);
    ctx.font='11px Microsoft YaHei';ctx.fillStyle='#ccc';
    ctx.fillText('成就完成度',W-102,H-158);
    const un=ACHIEVEMENTS.length>0?Math.floor(G.achUnlocked.length*100/ACHIEVEMENTS.length):0;
    ctx.fillStyle='rgba(255,255,255,0.1)';roundRect(W-165,H-145,125,12,6,true,false);
    ctx.fillStyle='#4caf50';roundRect(W-165,H-145,125*un/100,12,6,true,false);
    ctx.fillStyle='#fff';ctx.font='10px Microsoft YaHei';ctx.fillText(un+'%',W-102,H-135);
    ctx.fillStyle=THEME_COLOR;roundRect(W-160,H-122,115,26,10,true,false);
    ctx.fillStyle='#fff';ctx.font='bold 12px Microsoft YaHei';
    ctx.fillText('📖 成就图鉴',W-102,H-104);
    G.menuBtns=G.menuBtns||[];G.menuBtns.push({x:W-160,y:H-122,w:115,h:26,id:'ach_menu'});
}
function handleExtraPointer(p){
    if(G.state===STATE_PAUSE){
        if(G.pauseBtns){for(const b of G.pauseBtns){if(rectHit(p,b)){
            sfxBtn();if(b.id==='resume'){G.state=STATE_PLAYING;}
            else if(b.id==='tutorial'){G.tutStep=0;G.showTutorial=true;}
            else if(b.id==='ach'){G.achPage=0;G.showAch=true;G.state=STATE_MENU;}
            else if(b.id==='mute'){G.mute=!G.mute;if(G.mute&&audioCtx)audioCtx.suspend();else if(!G.mute&&audioCtx)audioCtx.resume();}
            else if(b.id==='restart'){newGame();}
            else if(b.id==='menu'){G.state=STATE_MENU;}
            return true;}}}return true;
    }
    if(G.showTutorial){
        if(G.tutBtns){for(const b of G.tutBtns){if(rectHit(p,b)){
            sfxBtn();if(b.id==='prev'){if(G.tutStep>0)G.tutStep--;else{G.showTutorial=false;G.showAch=false;}}
            else{if(G.tutStep<TUTORIAL_STEPS.length-1)G.tutStep++;else{G.showTutorial=false;if(G.level===1)newGame();}}
            return true;}}}return true;
    }
    if(G.showAch){
        if(G.achBtns){for(const b of G.achBtns){if(rectHit(p,b)){
            sfxBtn();if(b.id==='prev'&&G.achPage>0)G.achPage--;
            else if(b.id==='next'){const tp=Math.ceil(ACHIEVEMENTS.length/6);if(G.achPage<tp-1)G.achPage++;}
            else if(b.id==='close'){G.showAch=false;}
            return true;}}}return true;
    }
    if(G.showLog){if(G.logBtn&&rectHit(p,G.logBtn)){G.showLog=false;sfxBtn();return true;}return true;}
    if(G.detCard){if(G.detBtn&&rectHit(p,G.detBtn)){G.detCard=null;sfxBtn();return true;}return true;}
    if(G.state===STATE_MENU&&G.menuBtns){for(const b of G.menuBtns){if(rectHit(p,b)){sfxBtn();if(b.id==='ach_menu'){G.achPage=0;G.showAch=true;}return true;}}}
    return false;
}
let _origDraw=draw;draw=function(){
    _origDraw();
    if(G.state===STATE_PAUSE)drawPauseMenu();
    else if(G.showTutorial)drawTutorial();
    else if(G.showAch)drawAchievements();
    if(G.showLog)drawBattleLog();
    if(G.detCard)drawCardDetail();
    if(G.state===STATE_MENU)drawMenuExtras();
    if(G.achQueue&&G.achQueue.length>0){
        const a=G.achQueue[0];if(a._t===undefined)a._t=0;a._t++;
        ctx.save();ctx.globalAlpha=Math.max(0,1-Math.abs(a._t-150)/150);
        ctx.fillStyle='rgba(21,101,192,0.95)';roundRect(W/2-135,H/2-50,270,70,14,true,false);
        ctx.strokeStyle='#ffd700';ctx.lineWidth=2;roundRect(W/2-135,H/2-50,270,70,14,false,true);
        ctx.fillStyle='#ffd700';ctx.font='30px Arial';ctx.textAlign='center';
        ctx.fillText('🏆',W/2,H/2-15);
        ctx.fillStyle='#fff';ctx.font='bold 16px Microsoft YaHei';
        ctx.fillText('成就解锁! '+a.name,W/2,H/2+8);
        ctx.fillStyle='#ccc';ctx.font='12px Microsoft YaHei';
        ctx.fillText(a.reward,W/2,H/2+26);
        ctx.restore();if(a._t>300)G.achQueue.shift();
    }
};
let _origUpdate=update;update=function(){_origUpdate();if(G.state===STATE_PLAYING)checkAchievements();};
let _origHPD=handlePointerDown;handlePointerDown=function(e){
    initAudio();const p=getPos(e);
    if(handleExtraPointer(p))return;
    if(G.state===STATE_PLAYING){
        if(p.x>W-58&&p.y>14&&p.x<W-14&&p.y<50){G.state=STATE_PAUSE;sfxBtn();return;}
        if(p.x>14&&p.y>14&&p.x<62&&p.y<46){G.showLog=true;sfxBtn();return;}
    }
    _origHPD(e);
    if(G.state===STATE_PLAYING&&G.hoverCard){for(const c of G.hand)if(c.uid===G.hoverCard){G.detCard=c;break;}}
};

function gameLoop(){requestAnimationFrame(gameLoop);update();draw();}
loadAchievements();if(G.achUnlocked===undefined)G.achUnlocked=[];
gameLoop();
})();
</script>

    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;

      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
