<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>精灵选择器 - TD v2 Sprite Mapper</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #1e1e1e;
  color: #e0e0e0;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  padding: 16px;
  min-width: 1100px;
}

header {
  margin-bottom: 14px;
}

header h1 {
  font-size: 20px;
  font-weight: 600;
  color: #4fc3f7;
}

header p {
  font-size: 13px;
  color: #888;
  margin-top: 2px;
}

/* ====== Layout ====== */
.container {
  display: flex;
  gap: 16px;
  align-items: flex-start;
}

/* ====== Left Panel ====== */
.left-panel {
  flex-shrink: 0;
}

.left-panel canvas {
  display: block;
  border: 1px solid #444;
  image-rendering: pixelated;
  cursor: crosshair;
}

.left-panel .canvas-status {
  font-size: 12px;
  color: #888;
  margin-top: 6px;
}

/* ====== Right Panel ====== */
.right-panel {
  flex: 1;
  min-width: 280px;
  max-width: 380px;
  background: #252526;
  border: 1px solid #333;
  border-radius: 6px;
  display: flex;
  flex-direction: column;
}

.right-panel-header {
  padding: 12px 16px;
  border-bottom: 1px solid #333;
}

.right-panel-header h2 {
  font-size: 14px;
  font-weight: 600;
  color: #ccc;
}

.right-panel-header .hint {
  font-size: 11px;
  color: #666;
  margin-top: 2px;
}

.list-wrap {
  flex: 1;
  overflow-y: auto;
  max-height: 520px;
  padding: 4px 0;
}

.list-wrap::-webkit-scrollbar {
  width: 5px;
}

.list-wrap::-webkit-scrollbar-track {
  background: transparent;
}

.list-wrap::-webkit-scrollbar-thumb {
  background: #444;
  border-radius: 3px;
}

/* ====== Sprite List Items ====== */
.sprite-item {
  display: flex;
  align-items: center;
  padding: 6px 16px;
  cursor: pointer;
  transition: background 0.1s;
  border-left: 3px solid transparent;
  user-select: none;
}

.sprite-item:hover {
  background: rgba(79, 195, 247, 0.06);
}

.sprite-item.active {
  background: rgba(79, 195, 247, 0.12);
  border-left-color: #4fc3f7;
}

.sprite-item.assigned {
  background: rgba(102, 187, 106, 0.08);
}

.sprite-item.assigned.active {
  background: rgba(79, 195, 247, 0.15);
  border-left-color: #4fc3f7;
}

.sprite-item .name-part {
  font-family: 'Consolas', 'Courier New', monospace;
  font-size: 12px;
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.sprite-item .name-part .desc {
  font-family: 'Segoe UI', system-ui, sans-serif;
  font-size: 10px;
  color: #777;
  margin-left: 6px;
}

.sprite-item .coord-part {
  font-family: 'Consolas', 'Courier New', monospace;
  font-size: 11px;
  color: #ffeb3b;
  margin-left: 8px;
  white-space: nowrap;
}

.sprite-item .coord-part.unset {
  color: #555;
  font-style: italic;
}

.sprite-item .check-mark {
  color: #66bb6a;
  font-size: 13px;
  margin-left: 6px;
  width: 14px;
  text-align: center;
}

/* ====== Status Bar ====== */
.status-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 16px;
  border-top: 1px solid #333;
  font-size: 12px;
  color: #888;
}

.status-bar .dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  margin-right: 3px;
}

.status-bar .dot.green { background: #66bb6a; }
.status-bar .dot.red { background: #e53935; }
.status-bar .dot.yellow { background: #ffa726; }

.status-bar .progress {
  color: #aaa;
  margin-left: auto;
}

/* ====== Bottom: Export Section ====== */
.export-section {
  margin-top: 14px;
  background: #252526;
  border: 1px solid #333;
  border-radius: 6px;
  padding: 14px 16px;
}

.export-section h3 {
  font-size: 14px;
  font-weight: 600;
  color: #ccc;
  margin-bottom: 8px;
}

.export-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 6px 14px;
  border: none;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s;
}

.btn-primary {
  background: #4fc3f7;
  color: #111;
}
.btn-primary:hover { background: #29b6f6; }

.btn-secondary {
  background: #333;
  color: #ccc;
  border: 1px solid #444;
}
.btn-secondary:hover { background: #444; }

.btn-danger {
  background: #c62828;
  color: #fff;
}
.btn-danger:hover { background: #e53935; }

.btn:disabled {
  background: #333;
  color: #666;
  cursor: not-allowed;
}

.export-textarea {
  width: 100%;
  min-height: 120px;
  max-height: 250px;
  padding: 10px;
  background: #121212;
  border: 1px solid #333;
  border-radius: 4px;
  color: #e0e0e0;
  font-family: 'Consolas', 'Courier New', monospace;
  font-size: 12px;
  line-height: 1.5;
  resize: vertical;
  outline: none;
  white-space: pre;
  overflow: auto;
}

.export-textarea:focus {
  border-color: #4fc3f7;
}

.copy-row {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-top: 8px;
}

.copy-feedback {
  font-size: 12px;
  color: #66bb6a;
  opacity: 0;
  transition: opacity 0.3s;
}

.copy-feedback.show {
  opacity: 1;
}

/* ====== Flash animation ====== */
@keyframes flash-yellow {
  0%, 100% { stroke: #ffeb3b; }
  50% { stroke: rgba(255, 235, 59, 0.3); }
}
</style>

.interstitial-ad .ad-content p{color:#aaa;font:14px "Microsoft YaHei",sans-serif;margin-bottom:12px}

</head>
<body>

<header>
  <h1>TD v2 精灵映射选择器</h1>
  <p>右侧点选精灵名称 → 左侧点击格子 → 自动记录映射</p>
</header>

<div class="container">
  <div class="left-panel">
    <canvas id="main-canvas"></canvas>
    <div class="canvas-status">
      <span id="load-status"><span class="dot yellow"></span>加载中...</span>
      <span id="file-info" style="margin-left:10px"></span>
      <span style="margin-left:10px;color:#666" id="hover-hint"></span>
    </div>
  </div>

  <div class="right-panel">
    <div class="right-panel-header">
      <h2>精灵列表</h2>
      <div class="hint">点击名称选中，再点左侧格子分配</div>
    </div>
    <div class="list-wrap" id="sprite-list"></div>
    <div class="status-bar">
      <span id="status-text"><span class="dot yellow"></span>就绪</span>
      <span class="progress" id="progress-text">0 / 0</span>
    </div>
  </div>
</div>

<div class="export-section">
  <h3>导出映射</h3>
  <div class="export-actions">
    <button class="btn btn-primary" id="export-btn">导出 SC 代码</button>
    <button class="btn btn-secondary" id="copy-btn" disabled>复制到剪贴板</button>
    <button class="btn btn-danger" id="clear-btn">清空所有分配</button>
  </div>
  <textarea class="export-textarea" id="export-output" readonly placeholder="点击「导出 SC 代码」生成..."></textarea>
  <div class="copy-row">
    <span class="copy-feedback" id="copy-feedback">已复制</span>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ====== Constants ====== */
  const SPRITE_PATH = 'assets/暗影幸存者/spritesheet.png';
  const COLS = 20;
  const ROWS = 11;
  const TILE_SIZE = 16;
  const SCALE = 3;
  const DISPLAY_TILE = TILE_SIZE * SCALE; // 48
  const CANVAS_W = COLS * DISPLAY_TILE;   // 960
  const CANVAS_H = ROWS * DISPLAY_TILE;   // 528

  /* ====== Predefined Sprite List ====== */
  const spriteList = [
    // 地形
    { name: 'grass', desc: '草地' },
    { name: 'road', desc: '道路' },
    { name: 'building_place', desc: '建造位置' },
    { name: 'wall', desc: '墙壁' },
    // 水晶
    { name: 'crystal_lv1', desc: '水晶Lv1' },
    { name: 'crystal_lv2', desc: '水晶Lv2' },
    { name: 'crystal_lv3', desc: '水晶Lv3' },
    // 射手塔
    { name: 'archer_lv1', desc: '射手塔Lv1' },
    { name: 'archer_lv2', desc: '射手塔Lv2' },
    { name: 'archer_lv3', desc: '射手塔Lv3' },
    // 法师塔
    { name: 'wizard_lv1', desc: '法师塔Lv1' },
    { name: 'wizard_lv2', desc: '法师塔Lv2' },
    { name: 'wizard_lv3', desc: '法师塔Lv3' },
    // 骑士营
    { name: 'barrack_lv1', desc: '骑士营Lv1' },
    { name: 'barrack_lv2', desc: '骑士营Lv2' },
    { name: 'barrack_lv3', desc: '骑士营Lv3' },
    // 冰霜塔
    { name: 'frost_lv1', desc: '冰霜塔Lv1' },
    { name: 'frost_lv2', desc: '冰霜塔Lv2' },
    { name: 'frost_lv3', desc: '冰霜塔Lv3' },
    // 火焰塔
    { name: 'fire_lv1', desc: '火焰塔Lv1' },
    { name: 'fire_lv2', desc: '火焰塔Lv2' },
    { name: 'fire_lv3', desc: '火焰塔Lv3' },
    // 骑士
    { name: 'knight_lv1', desc: '骑士Lv1' },
    { name: 'knight_lv2', desc: '骑士Lv2' },
    { name: 'knight_lv3', desc: '骑士Lv3' },
    // 子弹
    { name: 'bullet_arrow', desc: '箭矢' },
    { name: 'bullet_wizard', desc: '法弹' },
    { name: 'bullet_frost', desc: '冰弹' },
    { name: 'bullet_fire', desc: '火弹' },
    // 怪物7帧
    { name: 'monster_1', desc: '怪物帧1' },
    { name: 'monster_2', desc: '怪物帧2' },
    { name: 'monster_3', desc: '怪物帧3' },
    { name: 'monster_4', desc: '怪物帧4' },
    { name: 'monster_5', desc: '怪物帧5' },
    { name: 'monster_6', desc: '怪物帧6' },
    { name: 'monster_7', desc: '怪物帧7' },
    // 装饰
    { name: 'tree_1', desc: '树1' },
    { name: 'tree_2', desc: '树2' },
    { name: 'stone', desc: '石头' },
    { name: 'grass_deco', desc: '草丛装饰' },
  ];

  /* ====== State ====== */
  let spritesheetImage = null;
  let imageLoaded = false;
  // mapping: name -> { col, row } or null
  let mapping = {};
  // currently selected sprite name (null = none)
  let selectedName = null;
  // flashing animation frame id
  let flashFrameId = null;

  /* ====== DOM ====== */
  const canvas = document.getElementById('main-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = CANVAS_W;
  canvas.height = CANVAS_H;

  const listEl = document.getElementById('sprite-list');
  const statusText = document.getElementById('status-text');
  const progressText = document.getElementById('progress-text');
  const loadStatus = document.getElementById('load-status');
  const fileInfo = document.getElementById('file-info');
  const hoverHint = document.getElementById('hover-hint');
  const exportOutput = document.getElementById('export-output');
  const exportBtn = document.getElementById('export-btn');
  const copyBtn = document.getElementById('copy-btn');
  const copyFeedback = document.getElementById('copy-feedback');
  const clearBtn = document.getElementById('clear-btn');

  /* ====== Rendering: Canvas ====== */
  function render() {
    ctx.imageSmoothingEnabled = false;

    // Background
    ctx.fillStyle = '#111';
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

    if (imageLoaded && spritesheetImage) {
      ctx.drawImage(spritesheetImage, 0, 0, CANVAS_W, CANVAS_H);
    }

    drawGrid();
    drawAssignedHighlights();
    drawSelectedHighlight();
  }

  function drawGrid() {
    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    ctx.lineWidth = 1;

    for (let col = 0; col <= COLS; col++) {
      const x = col * DISPLAY_TILE;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, CANVAS_H);
      ctx.stroke();
    }
    for (let row = 0; row <= ROWS; row++) {
      const y = row * DISPLAY_TILE;
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(CANVAS_W, y);
      ctx.stroke();
    }

    // Hover labels
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    for (let col = 0; col < COLS; col++) {
      for (let row = 0; row < ROWS; row++) {
        const x = col * DISPLAY_TILE;
        const y = row * DISPLAY_TILE;
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(x, y + DISPLAY_TILE - 12, DISPLAY_TILE, 12);
        ctx.fillStyle = '#aaa';
        ctx.font = '8px "Consolas", monospace';
        ctx.fillText('[' + col + ',' + row + ']', x + DISPLAY_TILE / 2, y + DISPLAY_TILE - 2);
      }
    }
  }

  function drawAssignedHighlights() {
    // Build reverse map: col,row -> set of names
    const assignedCells = {};
    for (const name in mapping) {
      const m = mapping[name];
      if (m) {
        const key = m.col + ',' + m.row;
        if (!assignedCells[key]) assignedCells[key] = [];
        assignedCells[key].push(name);
      }
    }

    for (const key in assignedCells) {
      const [col, row] = key.split(',').map(Number);
      const x = col * DISPLAY_TILE;
      const y = row * DISPLAY_TILE;

      ctx.strokeStyle = '#66bb6a';
      ctx.lineWidth = 2;
      ctx.strokeRect(x + 1, y + 1, DISPLAY_TILE - 2, DISPLAY_TILE - 2);

      // Small dot indicator
      ctx.fillStyle = 'rgba(102, 187, 106, 0.15)';
      ctx.fillRect(x, y, DISPLAY_TILE, DISPLAY_TILE);
    }
  }

  function drawSelectedHighlight() {
    if (!selectedName) return;
    const m = mapping[selectedName];
    if (!m) return;

    const x = m.col * DISPLAY_TILE;
    const y = m.row * DISPLAY_TILE;

    // Flashing border via alternating draw
    const flash = Math.floor(performance.now() / 400) % 2 === 0;

    ctx.strokeStyle = flash ? '#ffeb3b' : 'rgba(255, 235, 59, 0.25)';
    ctx.lineWidth = 3;
    ctx.strokeRect(x + 1, y + 1, DISPLAY_TILE - 2, DISPLAY_TILE - 2);

    // Slight overlay
    ctx.fillStyle = flash ? 'rgba(255, 235, 59, 0.1)' : 'rgba(255, 235, 59, 0.03)';
    ctx.fillRect(x, y, DISPLAY_TILE, DISPLAY_TILE);
  }

  /* ====== Flash Animation Loop ====== */
  function startFlashLoop() {
    if (flashFrameId) return;
    function tick() {
      render();
      flashFrameId = requestAnimationFrame(tick);
    }
    tick();
  }

  function stopFlashLoop() {
    if (flashFrameId) {
      cancelAnimationFrame(flashFrameId);
      flashFrameId = null;
    }
  }

  /* ====== Sprite List Rendering ====== */
  function renderList(advanceToNext) {
    listEl.innerHTML = '';

    let firstUnassigned = null;

    spriteList.forEach(function (item) {
      const div = document.createElement('div');
      div.className = 'sprite-item';
      if (item.name === selectedName) div.classList.add('active');

      const m = mapping[item.name];
      if (m) {
        div.classList.add('assigned');
      }

      // Name part
      const nameSpan = document.createElement('span');
      nameSpan.className = 'name-part';
      nameSpan.textContent = item.name;
      const descSpan = document.createElement('span');
      descSpan.className = 'desc';
      descSpan.textContent = item.desc;
      nameSpan.appendChild(descSpan);
      div.appendChild(nameSpan);

      // Coord part
      const coordSpan = document.createElement('span');
      coordSpan.className = 'coord-part' + (m ? '' : ' unset');
      coordSpan.textContent = m ? '[' + m.col + ',' + m.row + ']' : '待分配';
      div.appendChild(coordSpan);

      // Check mark
      const check = document.createElement('span');
      check.className = 'check-mark';
      check.textContent = m ? '✓' : '';
      div.appendChild(check);

      div.addEventListener('click', function () {
        selectSprite(item.name);
      });

      listEl.appendChild(div);

      if (!m && firstUnassigned === null) {
        firstUnassigned = item.name;
      }
    });

    updateStatus();

    // Advance to next unassigned if requested and current is now assigned
    if (advanceToNext) {
      if (selectedName && mapping[selectedName]) {
        // Current is now assigned, jump to next
        if (firstUnassigned) {
          selectSprite(firstUnassigned);
        } else {
          // All assigned
          selectSprite(null);
        }
      }
    }

    // Scroll selected into view
    if (selectedName) {
      const items = listEl.querySelectorAll('.sprite-item');
      for (let i = 0; i < items.length; i++) {
        if (spriteList[i] && spriteList[i].name === selectedName) {
          items[i].scrollIntoView({ block: 'nearest' });
          break;
        }
      }
    }
  }

  function updateStatus() {
    let assigned = 0;
    let total = spriteList.length;
    spriteList.forEach(function (item) {
      if (mapping[item.name]) assigned++;
    });
    progressText.textContent = assigned + ' / ' + total;

    if (selectedName) {
      const m = mapping[selectedName];
      if (m) {
        statusText.innerHTML = '<span class="dot green"></span>' + selectedName + ' [' + m.col + ',' + m.row + ']';
      } else {
        statusText.innerHTML = '<span class="dot yellow"></span>选中: ' + selectedName + ' — 点击左侧格子';
      }
    } else {
      statusText.innerHTML = '<span class="dot green"></span>就绪';
    }
  }

  /* ====== Selection Logic ====== */
  function selectSprite(name) {
    if (selectedName === name) {
      // Toggle off
      selectedName = null;
    } else {
      selectedName = name;
    }

    if (selectedName && !mapping[selectedName]) {
      // Waiting for assignment
      stopFlashLoop();
      render();
      renderList(false);
    } else if (selectedName && mapping[selectedName]) {
      // Already assigned, start flash
      startFlashLoop();
      renderList(false);
    } else {
      stopFlashLoop();
      render();
      renderList(false);
    }
  }

  function assignTile(col, row) {
    if (!selectedName) {
      statusText.innerHTML = '<span class="dot yellow"></span>请先在右侧点选一个精灵名称';
      return;
    }

    // Check if this cell is already assigned to a DIFFERENT sprite
    let conflictName = null;
    for (const name in mapping) {
      const m = mapping[name];
      if (m && m.col === col && m.row === row && name !== selectedName) {
        conflictName = name;
        break;
      }
    }

    if (conflictName) {
      statusText.innerHTML = '<span class="dot red"></span>冲突: [' + col + ',' + row + '] 已被 ' + conflictName + ' 占用';
      return;
    }

    mapping[selectedName] = { col: col, row: row };
    exportOutput.value = '';
    copyBtn.disabled = true;

    // Check if all assigned
    let allAssigned = spriteList.every(function (item) {
      return mapping[item.name];
    });

    // Re-render
    stopFlashLoop();
    if (allAssigned) {
      selectedName = null;
      render();
      renderList(false);
      statusText.innerHTML = '<span class="dot green"></span>全部已分配！';
    } else {
      render();
      renderList(true); // advance to next
    }
  }

  /* ====== Canvas Interaction ====== */
  function handleCanvasClick(e) {
    if (!imageLoaded) return;

    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const cx = (e.clientX - rect.left) * scaleX;
    const cy = (e.clientY - rect.top) * scaleY;

    const col = Math.floor(cx / DISPLAY_TILE);
    const row = Math.floor(cy / DISPLAY_TILE);

    if (col >= 0 && col < COLS && row >= 0 && row < ROWS) {
      assignTile(col, row);
    }
  }

  function handleCanvasMove(e) {
    if (!imageLoaded) return;
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const cx = (e.clientX - rect.left) * scaleX;
    const cy = (e.clientY - rect.top) * scaleY;

    const col = Math.floor(cx / DISPLAY_TILE);
    const row = Math.floor(cy / DISPLAY_TILE);

    if (col >= 0 && col < COLS && row >= 0 && row < ROWS) {
      hoverHint.textContent = '[' + col + ',' + row + ']';
    } else {
      hoverHint.textContent = '';
    }
  }

  /* ====== Export ====== */
  function generateExport() {
    const names = Object.keys(mapping)
      .filter(function (n) { return mapping[n]; })
      .sort();

    const lines = [];
    lines.push('const SC = {');
    names.forEach(function (name, i) {
      const m = mapping[name];
      const comma = (i < names.length - 1) ? ',' : '';
      lines.push('  ' + name + ': [' + m.col + ', ' + m.row + ']' + comma);
    });
    lines.push('};');

    exportOutput.value = lines.join('\n') + '\n';
    copyBtn.disabled = false;
    exportOutput.focus();
  }

  function copyToClipboard() {
    const text = exportOutput.value;
    if (!text) return;

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(showCopyFeedback).catch(function () {
        fallbackCopy(text);
      });
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      showCopyFeedback();
    } catch (e) {
      // ignore
    }
    document.body.removeChild(ta);
  }

  function showCopyFeedback() {
    copyFeedback.classList.add('show');
    setTimeout(function () {
      copyFeedback.classList.remove('show');
    }, 1500);
  }

  function clearAll() {
    if (spriteList.some(function (item) { return mapping[item.name]; })) {
      if (!confirm('确定清空所有已分配的精灵映射？')) return;
    }
    mapping = {};
    selectedName = null;
    stopFlashLoop();
    exportOutput.value = '';
    copyBtn.disabled = true;
    render();
    renderList(false);
    statusText.innerHTML = '<span class="dot green"></span>已清空';
  }

  /* ====== Image Loading ====== */
  function loadSpritesheet() {
    loadStatus.innerHTML = '<span class="dot yellow"></span>加载精灵表中...';

    const img = new Image();
    img.onload = function () {
      spritesheetImage = img;
      imageLoaded = true;
      loadStatus.innerHTML = '<span class="dot green"></span>已加载';
      fileInfo.textContent = img.naturalWidth + 'x' + img.naturalHeight + ' (' + COLS + 'x' + ROWS + ' tiles)';
      render();
    };

    img.onerror = function () {
      loadStatus.innerHTML = '<span class="dot red"></span>加载失败';
      fileInfo.textContent = SPRITE_PATH;
      render();
    };

    img.src = SPRITE_PATH;
  }

  /* ====== Init ====== */
  function init() {
    canvas.addEventListener('click', handleCanvasClick);
    canvas.addEventListener('mousemove', handleCanvasMove);

    exportBtn.addEventListener('click', generateExport);
    copyBtn.addEventListener('click', copyToClipboard);
    clearBtn.addEventListener('click', clearAll);

    // Initial states
    render();
    renderList(false);
    loadSpritesheet();
  }

  init();
})();
