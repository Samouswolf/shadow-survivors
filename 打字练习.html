<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>打字练习</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);font-family:'Microsoft YaHei',sans-serif}
#gameContainer{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#stats{display:flex;gap:30px;margin-bottom:30px;flex-wrap:wrap;justify-content:center}
.stat-box{background:rgba(255,255,255,.15);backdrop-filter:blur(10px);padding:15px 25px;border-radius:15px;text-align:center;min-width:100px}
.stat-label{font-size:12px;color:rgba(255,255,255,.7);margin-bottom:5px}
.stat-value{font-size:24px;font-weight:bold;color:#fff}
#wordDisplay{background:rgba(255,255,255,.95);padding:30px 50px;border-radius:20px;margin-bottom:20px;min-width:300px;max-width:90%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.2)}
#targetWord{font-size:36px;font-weight:bold;color:#333;letter-spacing:2px}
#inputArea{width:100%;max-width:400px}
#userInput{width:100%;padding:15px 25px;font-size:24px;text-align:center;border:3px solid rgba(255,255,255,.3);border-radius:15px;background:rgba(255,255,255,.9);outline:none;transition:border-color .3s}
#userInput:focus{border-color:#667eea}
#userInput.correct{border-color:#2ecc71}
#userInput.wrong{border-color:#e74c3c}
#progress{width:100%;max-width:400px;height:8px;background:rgba(255,255,255,.2);border-radius:4px;margin-top:20px;overflow:hidden}
#progressBar{height:100%;background:#2ecc71;transition:width .3s}
#message{margin-top:20px;font-size:18px;color:#fff;font-weight:bold;min-height:30px}
#startBtn{margin-top:20px;padding:15px 40px;font-size:18px;font-weight:bold;color:#fff;background:linear-gradient(135deg,#f093fb 0%,#f5576c 100%);border:none;border-radius:25px;cursor:pointer;transition:all .3s;box-shadow:0 4px 15px rgba(245,87,108,.4)}
#startBtn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(245,87,108,.6)}
#startBtn:disabled{opacity:.5;cursor:not-allowed;transform:none}
@media(max-width:375px){
#targetWord{font-size:28px}
#userInput{font-size:20px;padding:12px 20px}
.stat-box{padding:10px 15px;min-width:80px}
.stat-value{font-size:20px}
}
</style>
<style>
/* 游戏工坊广告系统 */
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);height:90px;max-height:90px;overflow:hidden;contain:layout style paint;pointer-events:none!important}.ad-banner-container,.ad-banner-container *{pointer-events:none!important}.ad-banner-container iframe{max-height:90px;pointer-events:none!important}
.ad-banner-container iframe{max-width:100%}
.ad-label{position:absolute;top:1px;right:6px;font:9px "Microsoft YaHei",sans-serif;color:rgba(255,255,255,.35)}
.sponsor-btn{position:fixed;top:44px;right:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:3px 9px;border-radius:10px;font:11px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .qr-row{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.sponsor-panel .qr-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px;text-align:center;min-width:140px}
.sponsor-panel .qr-card .qr-icon{font-size:48px;margin-bottom:6px}
.sponsor-panel .qr-card .qr-label{color:#ccc;font:13px "Microsoft YaHei",sans-serif}
.sponsor-panel .qr-card .qr-hint{color:#888;font:11px "Microsoft YaHei",sans-serif;margin-top:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.interstitial-ad .ad-content{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;text-align:center;min-width:280px;max-width:400px}
.interstitial-ad .ad-content p{color:#aaa;font:14px "Microsoft YaHei",sans-serif;margin-bottom:12px}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
</style>
</head>
<body>
<div id="gameContainer">
<div id="stats">
<div class="stat-box">
<div class="stat-label">时间</div>
<div class="stat-value" id="timer">60</div>
</div>
<div class="stat-box">
<div class="stat-label">正确数</div>
<div class="stat-value" id="correct">0</div>
</div>
<div class="stat-box">
<div class="stat-label">错误数</div>
<div class="stat-value" id="wrong">0</div>
</div>
<div class="stat-box">
<div class="stat-label">正确率</div>
<div class="stat-value" id="accuracy">100%</div>
</div>
</div>

<div id="wordDisplay">
<div id="targetWord">点击开始</div>
</div>

<div id="inputArea">
<input type="text" id="userInput" placeholder="在此输入..." disabled autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
</div>

<div id="progress">
<div id="progressBar" style="width:0%"></div>
</div>

<div id="message"></div>

<button id="startBtn">开始练习</button>
</div>

<!-- 广告系统 -->
<div class="ad-banner-container" id="adBanner"><div class="ad-label">广告</div><div id="adSlot" style="width:728px;max-width:100%;height:90px;display:flex;align-items:center;justify-content:center;color:#888;font:12px 'Microsoft YaHei',sans-serif">广告加载中...</div></div>
<button class="sponsor-btn" id="sponsorBtn">☕ 赞助</button>
<div class="sponsor-panel" id="sponsorPanel">
<h2>💛 支持开发者</h2>
<div style="color:#aaa;font:14px 'Microsoft YaHei',sans-serif;text-align:center;max-width:280px">如果你喜欢这个游戏，请开发者喝杯咖啡吧 ☕<br>每一份支持都是持续更新的动力！</div>
<div class="qr-row">
<div class="qr-card"><div class="qr-icon">💚</div><div class="qr-label">微信赞赏</div><div class="qr-hint">打开微信扫一扫</div></div>
<div class="qr-card"><div class="qr-icon">💙</div><div class="qr-label">支付宝支持</div><div class="qr-hint">打开支付宝扫一扫</div></div>
</div>
<button class="sponsor-close" id="sponsorClose">关闭</button>
</div>
<div class="interstitial-ad" id="interstitialAd">
<div class="ad-content">
<p>📢 赞助商广告</p>
<div id="interstitialAdSlot" style="min-height:250px;display:flex;align-items:center;justify-content:center;color:#888;font:13px 'Microsoft YaHei',sans-serif">广告加载中...</div>
</div>
<button class="skip-btn" id="skipInterstitial">跳过广告 ▶</button>
</div>

<script>
(function(){
// 词库
const WORDS = [
    'hello', 'world', 'computer', 'keyboard', 'mouse', 'screen', 'program', 'coding',
    'developer', 'software', 'hardware', 'internet', 'website', 'browser', 'search',
    'download', 'upload', 'network', 'server', 'client', 'database', 'system',
    'function', 'variable', 'constant', 'string', 'number', 'array', 'object',
    'class', 'method', 'property', 'event', 'loop', 'condition', 'return', 'value',
    'type', 'error', 'debug', 'test', 'build', 'deploy', 'version', 'update',
    'create', 'delete', 'modify', 'query', 'insert', 'select', 'update', 'remove',
    'apple', 'banana', 'orange', 'grape', 'water', 'coffee', 'bread', 'cheese',
    'happy', 'smile', 'laugh', 'enjoy', 'peace', 'dream', 'hope', 'love',
    'music', 'dance', 'movie', 'book', 'game', 'sport', 'travel', 'nature'
];

const TOTAL_TIME = 60;
const TOTAL_WORDS = 20;

// 游戏状态
let isPlaying = false;
let timeLeft = TOTAL_TIME;
let correctCount = 0;
let wrongCount = 0;
let currentWordIndex = 0;
let gameWords = [];
let timer = null;

// DOM元素
const timerDiv = document.getElementById('timer');
const correctDiv = document.getElementById('correct');
const wrongDiv = document.getElementById('wrong');
const accuracyDiv = document.getElementById('accuracy');
const targetWordDiv = document.getElementById('targetWord');
const userInput = document.getElementById('userInput');
const progressBar = document.getElementById('progressBar');
const messageDiv = document.getElementById('message');
const startBtn = document.getElementById('startBtn');

// 初始化游戏
function initGame() {
    // 随机选择单词
    gameWords = [];
    const shuffled = [...WORDS].sort(() => Math.random() - 0.5);
    for (let i = 0; i < TOTAL_WORDS; i++) {
        gameWords.push(shuffled[i % shuffled.length]);
    }
    
    currentWordIndex = 0;
    timeLeft = TOTAL_TIME;
    correctCount = 0;
    wrongCount = 0;
    
    updateStats();
    showWord();
}

// 显示当前单词
function showWord() {
    if (currentWordIndex < gameWords.length) {
        targetWordDiv.textContent = gameWords[currentWordIndex];
        progressBar.style.width = `${(currentWordIndex / TOTAL_WORDS) * 100}%`;
    }
}

// 更新统计
function updateStats() {
    timerDiv.textContent = timeLeft;
    correctDiv.textContent = correctCount;
    wrongDiv.textContent = wrongCount;
    
    const total = correctCount + wrongCount;
    const accuracy = total > 0 ? Math.round((correctCount / total) * 100) : 100;
    accuracyDiv.textContent = `${accuracy}%`;
}

// 开始游戏
function startGame() {
    if (isPlaying) return;
    
    isPlaying = true;
    initGame();
    
    userInput.disabled = false;
    userInput.value = '';
    userInput.focus();
    startBtn.disabled = true;
    messageDiv.textContent = '';
    
    // 启动计时器
    timer = setInterval(() => {
        timeLeft--;
        updateStats();
        
        if (timeLeft <= 0) {
            endGame();
        }
    }, 1000);
}

// 结束游戏
function endGame() {
    isPlaying = false;
    clearInterval(timer);
    
    userInput.disabled = true;
    startBtn.disabled = false;
    
    const total = correctCount + wrongCount;
    const accuracy = total > 0 ? Math.round((correctCount / total) * 100) : 0;
    
    messageDiv.innerHTML = `
        <div style="background:rgba(255,255,255,.15);padding:20px;border-radius:15px;text-align:center">
            <div style="font-size:28px;margin-bottom:10px">🎉 游戏结束！</div>
            <div style="font-size:18px">正确: ${correctCount} | 错误: ${wrongCount} | 正确率: ${accuracy}%</div>
        </div>
    `;
    
    if (timeLeft <= 0) {
        showInterstitialAd();
    }
}

// 检查输入
function checkInput() {
    if (!isPlaying) return;
    
    const input = userInput.value.toLowerCase().trim();
    const target = gameWords[currentWordIndex].toLowerCase();
    
    // 实时反馈
    if (input === target) {
        userInput.classList.remove('wrong');
        userInput.classList.add('correct');
        
        correctCount++;
        currentWordIndex++;
        updateStats();
        
        if (currentWordIndex >= TOTAL_WORDS) {
            endGame();
        } else {
            setTimeout(() => {
                userInput.value = '';
                userInput.classList.remove('correct');
                showWord();
            }, 200);
        }
    } else if (target.startsWith(input)) {
        userInput.classList.remove('wrong');
        userInput.classList.remove('correct');
    } else if (input.length > 0) {
        userInput.classList.add('wrong');
        userInput.classList.remove('correct');
    }
}

// 事件监听
startBtn.addEventListener('click', startGame);
userInput.addEventListener('input', checkInput);

// 阻止表单提交
userInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        e.preventDefault();
    }
});
})();

// 广告系统
(function(){
var sb=document.getElementById('sponsorBtn'),sp=document.getElementById('sponsorPanel'),sc=document.getElementById('sponsorClose');
if(sb&&sp){sb.onclick=function(){sp.style.display='flex'};if(sc)sc.onclick=function(){sp.style.display='none'}}
var ia=document.getElementById('interstitialAd'),si=document.getElementById('skipInterstitial');
if(ia&&si){si.onclick=function(){ia.style.display='none'}}
window.showInterstitialAd=function(){if(ia)ia.style.display='flex'};
})();
</script>
</body>
</html>
