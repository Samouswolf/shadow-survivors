// ==================== GAME STATE ====================
var G = {
    state: 'menu', // menu, playing, paused, levelComplete, gameOver, allClear
    level: 0,
    score: 0,
    combo: 0,
    maxCombo: 0,
    bestScore: 0,
    hintsUsed: 0,
    hintsRevealed: 0,
    skipped: 0,
    totalScore: 0,
    inputChars: [],
    particles: [],
    bgParticles: [],
    timer: 0,
    levelTimer: 0,
    maxLevelTime: 60,
    shakeTimer: 0,
    shakeX: 0,
    shakeY: 0,
    fadeAlpha: 0,
    fadeDir: 0,
    flashTimer: 0,
    flashColor: '',
    messageText: '',
    messageTimer: 0,
    buttonHover: -1,
    scrollY: 0,
    selectedInputIdx: -1,
    charOptions: [],
    revealedChars: 0,
    showKeyboard: false,
    wrongFlash: 0
};

// ==================== CANVAS SETUP ====================
var canvas = document.getElementById('gc');
var ctx = canvas.getContext('2d');
var W, H, scale;

function resizeCanvas() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    scale = Math.min(W / 400, H / 700);
    if (scale < 0.5) scale = 0.5;
    if (scale > 2) scale = 2;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ==================== STORAGE ====================
function loadBest() {
    try {
        var s = localStorage.getItem(CONFIG.SAVE_KEY);
        if (s) G.bestScore = parseInt(s) || 0;
    } catch(e) {}
}
function saveBest() {
    try {
        if (G.score > G.bestScore) {
            G.bestScore = G.score;
            localStorage.setItem(CONFIG.SAVE_KEY, G.bestScore);
        }
    } catch(e) {}
}

// ==================== PARTICLES ====================
function spawnParticles(x, y, color, count, speed) {
    for (var i = 0; i < count; i++) {
        var angle = Math.random() * Math.PI * 2;
        var sp = (Math.random() * 0.7 + 0.3) * speed;
        G.particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * sp,
            vy: Math.sin(angle) * sp,
            life: 1,
            decay: 0.01 + Math.random() * 0.02,
            size: 2 + Math.random() * 4,
            color: color
        });
    }
}

function spawnTextParticle(x, y, text, color) {
    G.particles.push({
        x: x, y: y,
        vx: (Math.random() - 0.5) * 2,
        vy: -2 - Math.random() * 2,
        life: 1,
        decay: 0.015,
        size: 0,
        text: text,
        color: color,
        isText: true
    });
}

function initBgParticles() {
    G.bgParticles = [];
    for (var i = 0; i < 50; i++) {
        G.bgParticles.push({
            x: Math.random() * W,
            y: Math.random() * H,
            size: 1 + Math.random() * 3,
            speed: 0.2 + Math.random() * 0.5,
            alpha: 0.1 + Math.random() * 0.3,
            hue: Math.random() * 60 + 200
        });
    }
}

function updateParticles(dt) {
    for (var i = G.particles.length - 1; i >= 0; i--) {
        var p = G.particles[i];
        p.x += p.vx;
        p.y += p.vy;
        if (!p.isText) {
            p.vy += 0.05;
        }
        p.life -= p.decay;
        if (p.life <= 0) G.particles.splice(i, 1);
    }
    for (var i = 0; i < G.bgParticles.length; i++) {
        var p = G.bgParticles[i];
        p.y -= p.speed;
        if (p.y < -10) {
            p.y = H + 10;
            p.x = Math.random() * W;
        }
    }
}

function drawParticles() {
    for (var i = 0; i < G.bgParticles.length; i++) {
        var p = G.bgParticles[i];
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = 'hsl(' + p.hue + ',60%,70%)';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (var i = 0; i < G.particles.length; i++) {
        var p = G.particles[i];
        ctx.globalAlpha = p.life;
        if (p.isText) {
            ctx.fillStyle = p.color;
            ctx.font = 'bold ' + Math.round(20 * scale) + 'px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(p.text, p.x, p.y);
        } else {
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
            ctx.fill();
        }
    }
    ctx.globalAlpha = 1;
}

// ==================== DRAWING HELPERS ====================
function drawBg() {
    var grd = ctx.createLinearGradient(0, 0, 0, H);
    grd.addColorStop(0, '#0a0a2e');
    grd.addColorStop(0.5, '#1a1040');
    grd.addColorStop(1, '#0a0a1a');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, H);
}

function drawButton(x, y, w, h, text, colorIdx, fontSize) {
    var hovered = G.buttonHover === colorIdx;
    var fs = fontSize || Math.round(20 * scale);

    ctx.save();
    if (hovered) {
        ctx.shadowColor = '#fff';
        ctx.shadowBlur = 15;
    }

    var grd = ctx.createLinearGradient(x, y, x, y + h);
    var colors = [
        ['#4a90d9', '#2a5fa0'],
        ['#e05555', '#a03030'],
        ['#50c050', '#2a8a2a'],
        ['#e0a030', '#a07020'],
        ['#9060d0', '#6040a0']
    ];
    var c = colors[colorIdx % colors.length];
    grd.addColorStop(0, c[0]);
    grd.addColorStop(1, c[1]);

    ctx.fillStyle = grd;
    roundRect(ctx, x, y, w, h, 10 * scale);
    ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1.5;
    roundRect(ctx, x, y, w, h, 10 * scale);
    ctx.stroke();

    ctx.fillStyle = '#fff';
    ctx.font = 'bold ' + fs + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + w / 2, y + h / 2);
    ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

function drawCharBox(x, y, size, char, revealed, highlight, isInput) {
    ctx.save();
    var grd = ctx.createLinearGradient(x, y, x, y + size);
    if (isInput) {
        grd.addColorStop(0, '#2a4a6a');
        grd.addColorStop(1, '#1a2a4a');
    } else if (revealed) {
        grd.addColorStop(0, '#3a5a3a');
        grd.addColorStop(1, '#2a4a2a');
    } else {
        grd.addColorStop(0, '#2a2a4a');
        grd.addColorStop(1, '#1a1a3a');
    }
    ctx.fillStyle = grd;
    roundRect(ctx, x, y, size, size, 6 * scale);
    ctx.fill();

    if (highlight) {
        ctx.strokeStyle = '#ffcc00';
        ctx.lineWidth = 3;
    } else {
        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
        ctx.lineWidth = 1.5;
    }
    roundRect(ctx, x, y, size, size, 6 * scale);
    ctx.stroke();

    if (char) {
        ctx.fillStyle = revealed ? '#88ff88' : '#ffffff';
        ctx.font = 'bold ' + Math.round(size * 0.6) + 'px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(char, x + size / 2, y + size / 2);
    } else if (!isInput) {
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.font = Math.round(size * 0.4) + 'px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('?', x + size / 2, y + size / 2);
    }
    ctx.restore();
}

// ==================== LEVEL LOGIC ====================
function getCurrentLevelData() {
    if (G.level >= LEVEL_DATA.length) return null;
    return LEVEL_DATA[G.level];
}

function getTierName(level) {
    var tier = Math.floor(level / CONFIG.LEVELS_PER_TIER);
    var names = ['初学者', '入门', '进阶', '精通', '高手',
                 '大师', '宗师', '传奇', '神话', '至高'];
    return names[tier] || '未知';
}

function generateOptions(answer) {
    var options = [answer];
    var allChars = '的一是不了人我在有他这中大来上个国和也子时道说那要没出会就对能着以到过下可起你都把得里如自它公好样';
    var extraChars = '心明力量手足山木水火山石田土日月金风雨雪花草树木鸟虫鱼龙马牛羊鸡狗猪猫';

    while (options.length < 6) {
        var pool = Math.random() < 0.5 ? allChars : extraChars;
        var c = pool[Math.floor(Math.random() * pool.length)];
        if (options.indexOf(c) === -1 && c !== answer) {
            options.push(c);
        }
    }
    // Shuffle
    for (var i = options.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = options[i];
        options[i] = options[j];
        options[j] = tmp;
    }
    return options;
}

function initLevel() {
    var data = getCurrentLevelData();
    if (!data) {
        G.state = 'allClear';
        return;
    }
    G.state = 'playing';
    G.inputChars = [];
    G.hintsRevealed = 0;
    G.levelTimer = 0;
    G.charOptions = generateOptions(data[1]);
    G.revealedChars = 0;
    G.wrongFlash = 0;
    G.showKeyboard = false;
    G.selectedInputIdx = -1;

    var answerLen = data[1].length;
    for (var i = 0; i < answerLen; i++) {
        G.inputChars.push('');
    }
}

function checkAnswer() {
    var data = getCurrentLevelData();
    if (!data) return;
    var answer = data[1];
    var input = G.inputChars.join('');

    if (input.length !== answer.length) return;

    if (input === answer) {
        // Correct!
        G.combo++;
        if (G.combo > G.maxCombo) G.maxCombo = G.combo;

        var baseScore = CONFIG.BASE_SCORE;
        var comboBonus = Math.floor(baseScore * CONFIG.COMBO_MULT * Math.min(G.combo, CONFIG.MAX_COMBO));
        var timeBonus = Math.floor((G.maxLevelTime - G.levelTimer) * CONFIG.TIME_BONUS_MULT);
        var hintPenalty = G.hintsRevealed * 20;
        var levelScore = Math.max(10, baseScore + comboBonus + timeBonus - hintPenalty);

        G.score += levelScore;
        G.totalScore += levelScore;

        // Effects
        var cx = W / 2, cy = H / 2;
        spawnParticles(cx, cy, '#ffcc00', 20, 5);
        spawnParticles(cx, cy, '#ff8800', 15, 4);
        spawnTextParticle(cx, cy - 30, '+' + levelScore, '#ffcc00');
        if (G.combo > 1) {
            spawnTextParticle(cx, cy - 60, G.combo + '连击!', '#ff5555');
        }

        G.state = 'levelComplete';
        G.messageText = '回答正确!';
        G.messageTimer = 0;
    } else {
        // Wrong
        G.combo = 0;
        G.shakeTimer = 15;
        G.wrongFlash = 30;
        spawnParticles(W / 2, H / 2, '#ff3333', 10, 3);
    }
}

function useHint() {
    var data = getCurrentLevelData();
    if (!data) return;
    var answer = data[1];

    // Reveal one unrevealed character
    for (var i = 0; i < answer.length; i++) {
        if (G.inputChars[i] !== answer[i]) {
            G.inputChars[i] = answer[i];
            G.hintsRevealed++;
            G.score = Math.max(0, G.score - CONFIG.HINT_COST);
            spawnParticles(W / 2, H / 2, '#44aaff', 8, 3);
            break;
        }
    }

    // Check if fully revealed by hints
    var allRevealed = true;
    for (var i = 0; i < answer.length; i++) {
        if (G.inputChars[i] !== answer[i]) {
            allRevealed = false;
            break;
        }
    }
    if (allRevealed) {
        G.combo = 0;
        G.state = 'levelComplete';
        G.messageText = '已用提示填满答案';
        G.messageTimer = 0;
    }
}

function skipLevel() {
    G.combo = 0;
    G.skipped++;
    G.score = Math.max(0, G.score - CONFIG.SKIP_COST);
    G.level++;
    if (G.level >= LEVEL_DATA.length) {
        G.state = 'allClear';
    } else {
        initLevel();
    }
}

    if (G.combo > 1) {

        ctx.textAlign = 'center';
        ctx.fillText('连击 x' + G.combo, cx, 68 * scale);

    // Timer bar
    var timerW = W - 2 * pad;
    var timerH = 8 * scale;
    var timerY = 52 * scale;
    var timerRatio = Math.max(0, 1 - G.levelTimer / G.maxLevelTime);

    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    roundRect(ctx, pad, timerY, timerW, timerH, 4 * scale);
    ctx.fill();

    var timerColor = timerRatio > 0.5 ? '#44cc44' : (timerRatio > 0.25 ? '#cccc44' : '#cc4444');
    ctx.fillStyle = timerColor;
    roundRect(ctx, pad, timerY, timerW * timerRatio, timerH, 4 * scale);
    ctx.fill();

    // Hint text box
    var hintBoxY = 80 * scale;
    var hintBoxH = 100 * scale;
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    roundRect(ctx, pad, hintBoxY, W - 2 * pad, hintBoxH, 10 * scale);
    ctx.fill();

    ctx.strokeStyle = 'rgba(255,204,0,0.3)';
    ctx.lineWidth = 1.5;
    roundRect(ctx, pad, hintBoxY, W - 2 * pad, hintBoxH, 10 * scale);
    ctx.stroke();

    // Category badge
    ctx.fillStyle = '#ffcc00';
    ctx.font = 'bold ' + Math.round(13 * scale) + 'px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('[' + data[2] + ']', pad + 15 * scale, hintBoxY + 25 * scale);

    // Hint text
    ctx.fillStyle = '#ffffff';
    ctx.font = Math.round(18 * scale) + 'px sans-serif';
    ctx.textAlign = 'center';
    wrapText(ctx, '"' + data[0] + '"', cx, hintBoxY + 60 * scale, W - 4 * pad, 24 * scale);

    // Answer boxes
    var answerLen = data[1].length;
    var boxSize = Math.min(60 * scale, (W - 2 * pad - (answerLen - 1) * 10 * scale) / answerLen);
    var totalW = answerLen * boxSize + (answerLen - 1) * 10 * scale;
    var startX = cx - totalW / 2;
    var boxY = hintBoxY + hintBoxH + 30 * scale;

    for (var i = 0; i < answerLen; i++) {
        var bx = startX + i * (boxSize + 10 * scale);
        var isHighlighted = (G.selectedInputIdx === i);
        var revealed = G.inputChars[i] !== '' && G.inputChars[i] === data[1][i];
        drawCharBox(bx, boxY, boxSize, G.inputChars[i], revealed, isHighlighted, true);
    }

    // Character options grid
    var optY = boxY + boxSize + 30 * scale;
    var optCols = 6;
    var optRows = Math.ceil(G.charOptions.length / optCols);
    var optSize = Math.min(50 * scale, (W - 2 * pad - (optCols - 1) * 8 * scale) / optCols);
    var optTotalW = optCols * optSize + (optCols - 1) * 8 * scale;
    var optStartX = cx - optTotalW / 2;

    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = Math.round(13 * scale) + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('选择汉字填入答案', cx, optY - 10 * scale);
    optY += 5 * scale;

    for (var i = 0; i < G.charOptions.length; i++) {
        var col = i % optCols;
        var row = Math.floor(i / optCols);
        var ox = optStartX + col * (optSize + 8 * scale);
        var oy = optY + row * (optSize + 8 * scale);
        drawCharBox(ox, oy, optSize, G.charOptions[i], false, false, false);
    }

    // Buttons row
    var btnY = optY + optRows * (optSize + 8 * scale) + 20 * scale;
    var btnW = 90 * scale;
    var btnH = 40 * scale;
    var btnGap = 12 * scale;
    var totalBtnW = 3 * btnW + 2 * btnGap;
    var btnStartX = cx - totalBtnW / 2;

    drawButton(btnStartX, btnY, btnW, btnH, '提示(-50)', 3, Math.round(14 * scale));
    drawButton(btnStartX + btnW + btnGap, btnY, btnW, btnH, '确认', 2, Math.round(16 * scale));
    drawButton(btnStartX + 2 * (btnW + btnGap), btnY, btnW, btnH, '跳过(-100)', 1, Math.round(14 * scale));

    // Wrong flash overlay
    if (G.wrongFlash > 0) {
        ctx.fillStyle = 'rgba(255,0,0,' + (G.wrongFlash / 30 * 0.3) + ')';
        ctx.fillRect(0, 0, W, H);
    }

    // Store button positions for click detection
    G._btnPositions = {
        hint: { x: btnStartX, y: btnY, w: btnW, h: btnH },
        confirm: { x: btnStartX + btnW + btnGap, y: btnY, w: btnW, h: btnH },
        skip: { x: btnStartX + 2 * (btnW + btnGap), y: btnY, w: btnW, h: btnH },
        optionStartY: optY,
        optionSize: optSize,
        optionGap: 8 * scale,
        optionCols: optCols,
        optionStartX: optStartX,
        boxStartY: boxY,
        boxSize: boxSize,
        boxGap: 10 * scale,
        boxStartX: startX,
        boxCount: answerLen
    };
}

// ==================== WRAP TEXT ====================
function wrapText(ctx, text, x, y, maxW, lineH) {
    var chars = text.split('');
    var line = '';
    var lines = [];
    for (var i = 0; i < chars.length; i++) {
        var testLine = line + chars[i];
        var metrics = ctx.measureText(testLine);
        if (metrics.width > maxW && line.length > 0) {
            lines.push(line);
            line = chars[i];
        } else {
            line = testLine;
        }
    }
    if (line) lines.push(line);
    for (var i = 0; i < lines.length; i++) {
        ctx.fillText(lines[i], x, y + i * lineH);
    }
}

// ==================== MAIN LOOP ====================
var lastTime = 0;
function gameLoop(timestamp) {
    var dt = Math.min(50, timestamp - lastTime);
    lastTime = timestamp;

    // Shake
    var sx = 0, sy = 0;
    if (G.shakeTimer > 0) {
        G.shakeTimer--;
        sx = (Math.random() - 0.5) * G.shakeTimer * 0.8;
        sy = (Math.random() - 0.5) * G.shakeTimer * 0.8;
    }

    ctx.save();
    ctx.translate(sx, sy);

    // Update timer
    if (G.state === 'playing') {
        G.levelTimer += dt / 1000;
        if (G.levelTimer >= G.maxLevelTime) {
            G.combo = 0;
            G.state = 'levelComplete';
            G.messageText = '时间到!';
        }
    }

    // Wrong flash
    if (G.wrongFlash > 0) G.wrongFlash--;

    // Message timer
    if (G.messageTimer > 0) G.messageTimer--;

    updateParticles(dt);

    // Draw
    switch (G.state) {
        case 'menu':
            drawMenu();
            break;
        case 'playing':
            drawGame();
            break;
        case 'paused':
            drawPaused();
            break;
        case 'levelComplete':
            drawLevelComplete();
            break;
        case 'allClear':
            drawAllClear();
            break;
    }

    if (G_showHelp) {
        drawHelp();
    }

    // Flash overlay
    if (G.flashTimer > 0) {
        G.flashTimer--;
        ctx.globalAlpha = G.flashTimer / 30;
        ctx.fillStyle = G.flashColor;
        ctx.fillRect(-20, -20, W + 40, H + 40);
        ctx.globalAlpha = 1;
    }

    // Fade overlay
    if (G.fadeDir !== 0) {
        G.fadeAlpha += G.fadeDir * 0.05;
        if (G.fadeAlpha >= 1) {
            G.fadeAlpha = 1;
            G.fadeDir = -1;
            // Execute transition action
            if (G._fadeAction) {
                G._fadeAction();
                G._fadeAction = null;
            }
        }
        if (G.fadeAlpha <= 0) {
            G.fadeAlpha = 0;
            G.fadeDir = 0;
        }
        ctx.globalAlpha = G.fadeAlpha;
        ctx.fillStyle = '#000';
        ctx.fillRect(-20, -20, W + 40, H + 40);
        ctx.globalAlpha = 1;
    }

    ctx.restore();

    requestAnimationFrame(gameLoop);
}

// ==================== INPUT HANDLING ====================
function handleClick(x, y) {
    if (G_showHelp) {
        var cx = W / 2;
        var bw = 150 * scale, bh = 45 * scale;
        var bx = cx - bw / 2, by = H - 80 * scale;
        if (x >= bx && x <= bx + bw && y >= by && y <= by + bh) {
            G_showHelp = false;
        }
        return;
    }

    if (G.fadeDir !== 0) return;

    var cx = W / 2;

    switch (G.state) {
        case 'menu': {
            var bw = 200 * scale, bh = 50 * scale;
            var bx = cx - bw / 2;
            // Start button
            var by1 = H * 0.42;
            if (x >= bx && x <= bx + bw && y >= by1 && y <= by1 + bh) {
                G.score = 0;
                G.combo = 0;
                G.maxCombo = 0;
                G.hintsUsed = 0;
                G.skipped = 0;
                G.totalScore = 0;
                G.level = 0;
                initLevel();
                initBgParticles();
                return;
            }
            // Help button
            var by2 = by1 + bh + 15 * scale;
            if (x >= bx && x <= bx + bw && y >= by2 && y <= by2 + bh) {
                G_showHelp = true;
                return;
            }
            break;
        }

        case 'playing': {
            if (!G._btnPositions) return;
            var bp = G._btnPositions;

            // Option clicks
            var optY = bp.optionStartY;
            for (var i = 0; i < G.charOptions.length; i++) {
                var col = i % bp.optionCols;
                var row = Math.floor(i / bp.optionCols);
                var ox = bp.optionStartX + col * (bp.optionSize + bp.optionGap);
                var oy = optY + row * (bp.optionSize + bp.optionGap);
                if (x >= ox && x <= ox + bp.optionSize && y >= oy && y <= oy + bp.optionSize) {
                    // Find first empty input slot
                    var answerLen = bp.boxCount;
                    var placed = false;
                    for (var j = 0; j < answerLen; j++) {
                        if (G.inputChars[j] === '') {
                            G.inputChars[j] = G.charOptions[i];
                            placed = true;
                            spawnParticles(ox + bp.optionSize / 2, oy + bp.optionSize / 2, '#44aaff', 5, 2);
                            break;
                        }
                    }
                    return;
                }
            }

            // Answer box clicks (clear)
            for (var i = 0; i < bp.boxCount; i++) {
                var bx = bp.boxStartX + i * (bp.boxSize + bp.boxGap);
                var by = bp.boxStartY;
                if (x >= bx && x <= bx + bp.boxSize && y >= by && y <= by + bp.boxSize) {
                    if (G.inputChars[i] !== '') {
                        G.inputChars[i] = '';
                        spawnParticles(bx + bp.boxSize / 2, by + bp.boxSize / 2, '#ff6644', 5, 2);
                    }
                    return;
                }
            }

            // Hint button
            var h = bp.hint;
            if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) {
                useHint();
                return;
            }

            // Confirm button
            var c = bp.confirm;
            if (x >= c.x && x <= c.x + c.w && y >= c.y && y <= c.y + c.h) {
                checkAnswer();
                return;
            }

            // Skip button
            var s = bp.skip;
            if (x >= s.x && x <= s.x + s.w && y >= s.y && y <= s.y + s.h) {
                skipLevel();
                return;
            }

            // Pause button (top right area)
            if (x >= W - 50 * scale && y <= 50 * scale) {
                G.state = 'paused';
                return;
            }
            break;
        }

        case 'paused': {
            var bw = 180 * scale, bh = 50 * scale;
            var bx = cx - bw / 2;
            var by1 = H * 0.45;
            if (x >= bx && x <= bx + bw && y >= by1 && y <= by1 + bh) {
                G.state = 'playing';
                return;
            }
            var by2 = by1 + bh + 15 * scale;
            if (x >= bx && x <= bx + bw && y >= by2 && y <= by2 + bh) {
                G.state = 'menu';
                G_showHelp = false;
                return;
            }
            break;
        }

        case 'levelComplete': {
            var bw = 180 * scale, bh = 50 * scale;
            var bx = cx - bw / 2;
            var by = H * 0.72;
            if (x >= bx && x <= bx + bw && y >= by && y <= by + bh) {
                G.level++;
                if (G.level >= LEVEL_DATA.length) {
                    saveBest();
                    G.state = 'allClear';
                } else {
                    initLevel();
                }
                return;
            }
            break;
        }

        case 'allClear': {
            saveBest();
            var bw = 200 * scale, bh = 50 * scale;
            var bx = cx - bw / 2;
            // Back to menu
            var by1 = H * 0.65;
            if (x >= bx && x <= bx + bw && y >= by1 && y <= by1 + bh) {
                G.state = 'menu';
                return;
            }
            // Play again
            var by2 = by1 + bh + 15 * scale;
            if (x >= bx && x <= bx + bw && y >= by2 && y <= by2 + bh) {
                G.score = 0;
                G.combo = 0;
                G.maxCombo = 0;
                G.hintsUsed = 0;
                G.skipped = 0;
                G.totalScore = 0;
                G.level = 0;
                initLevel();
                return;
            }
            break;
        }
    }
}

// Mouse events
canvas.addEventListener('click', function(e) {
    handleClick(e.clientX, e.clientY);
});

// Touch events
canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    var t = e.touches[0];
    handleClick(t.clientX, t.clientY);
}, { passive: false });

// Keyboard events
document.addEventListener('keydown', function(e) {
    if (G_showHelp) {
        G_showHelp = false;
        return;
    }

    if (e.key === 'Escape') {
        if (G.state === 'playing') {
            G.state = 'paused';
        } else if (G.state === 'paused') {
            G.state = 'playing';
        }
    }

    if (G.state === 'playing') {
        if (e.key === 'Enter') {
            checkAnswer();
        }
        if (e.key === 'h' || e.key === 'H') {
            useHint();
        }
        if (e.key === 's' || e.key === 'S') {
            skipLevel();
        }
        // Number keys 1-6 for option selection
        var num = parseInt(e.key);
        if (num >= 1 && num <= 6 && num <= G.charOptions.length) {
            var answerLen = getCurrentLevelData()[1].length;
            for (var j = 0; j < answerLen; j++) {
                if (G.inputChars[j] === '') {
                    G.inputChars[j] = G.charOptions[num - 1];
                    break;
                }
            }
        }
        // Backspace to clear last filled
        if (e.key === 'Backspace') {
            for (var j = answerLen - 1; j >= 0; j--) {
                if (G.inputChars[j] !== '') {
                    G.inputChars[j] = '';
                    break;
                }
            }
        }
    }

    if (G.state === 'levelComplete' && (e.key === 'Enter' || e.key === ' ')) {
        G.level++;
        if (G.level >= LEVEL_DATA.length) {
            saveBest();
            G.state = 'allClear';
        } else {
            initLevel();
        }
    }

    if (G.state === 'menu' && (e.key === 'Enter' || e.key === ' ')) {
        G.score = 0;
        G.combo = 0;
        G.maxCombo = 0;
        G.hintsUsed = 0;
        G.skipped = 0;
        G.totalScore = 0;
        G.level = 0;
        initLevel();
        initBgParticles();
    }
});

// ==================== INIT ====================
loadBest();
initBgParticles();
requestAnimationFrame(gameLoop);

  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
