<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <title>填字游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
            overflow: hidden;
        }
        #gameCanvas {
            display: block;
            touch-action: none;
        }
        #adContainer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: linear-gradient(135deg, #2d2d44 0%, #1a1a2e 100%);
            border-top: 2px solid #e94560;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        #adBanner {
            color: #ffffff;
            font-size: 14px;
            text-align: center;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }
        #sponsorBtn {
            position: fixed;
            bottom: 70px;
            right: 10px;
            background: linear-gradient(135deg, #e94560 0%, #c23152 100%);
            color: white;
            border: none;
            border-radius: 25px;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            z-index: 101;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
            transition: transform 0.3s ease;
        }
        #sponsorBtn:hover {
            transform: scale(1.05);
        }
        #sponsorModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        #sponsorModal.active {
            display: flex;
        }
        #sponsorContent {
            background: linear-gradient(135deg, #16213e 0%, #0f3460 100%);
            border: 2px solid #e94560;
            border-radius: 15px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            color: white;
        }
        #sponsorContent h2 {
            color: #e94560;
            margin-bottom: 20px;
            font-size: 24px;
        }
        #sponsorContent p {
            margin-bottom: 15px;
            line-height: 1.6;
            font-size: 14px;
        }
        #sponsorClose {
            background: linear-gradient(135deg, #e94560 0%, #c23152 100%);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 30px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
        #interstitialAd {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #interstitialAd.active {
            display: flex;
        }
        #interstitialContent {
            background: linear-gradient(135deg, #16213e 0%, #0f3460 100%);
            border: 2px solid #e94560;
            border-radius: 15px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            color: white;
        }
        #interstitialContent h2 {
            color: #e94560;
            margin-bottom: 20px;
            font-size: 22px;
        }
        #interstitialContent p {
            margin-bottom: 20px;
            line-height: 1.6;
        }
        #interstitialClose {
            background: linear-gradient(135deg, #e94560 0%, #c23152 100%);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 30px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        #interstitialTimer {
            color: #e94560;
            font-size: 24px;
            font-weight: bold;
            margin-top: 15px;
        }
    @keyframes spin { to { transform:rotate(360deg); } }

        // ===== 游戏状态 =====
        var G = {
            state: 'menu', // menu, playing, paused, gameover, levelComplete
            canvas: null,
            ctx: null,
            width: 0,
            height: 0,
            dpr: 1,
            offsetX: 0,
            offsetY: 0,
            currentPuzzle: 0,
            puzzle: null,
            grid: [],
            userGrid: [],
            selectedCell: null,
            selectedDir: 'across',
            score: 0,
            highScore: 0,
            combo: 0,
            maxCombo: 0,
            hintsUsed: 0,
            wordsFound: 0,
            totalWords: 0,
            startTime: 0,
            elapsedTime: 0,
            timerInterval: null,
            particles: [],
            buttons: [],
            menuButtons: [],
            adTimer: 0,
            interstitialShown: false
        };

        // ===== 初始化 =====
        function init() {
            G.canvas = document.getElementById('gameCanvas');
            G.ctx = G.canvas.getContext('2d');
            G.dpr = window.devicePixelRatio || 1;

            loadHighScore();
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            G.canvas.addEventListener('click', handleClick);
            G.canvas.addEventListener('touchstart', handleTouch, { passive: false });

        var cellInput = document.getElementById('cellInput');

        function showCellInput() {
            if (G.state !== 'playing' || !G.selectedCell) { cellInput.style.display = 'none'; return; }
            var x = G.offsetX + G.selectedCell.col * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            var y = G.offsetY + G.selectedCell.row * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
            cellInput.style.left = (x - 25) + 'px';
            cellInput.style.top = (y - 25) + 'px';
            cellInput.style.display = 'block';
            cellInput.value = '';
            cellInput.focus();
        }

        cellInput.addEventListener('input', function() {
            if (G.state !== 'playing' || !G.selectedCell) return;
            var val = cellInput.value;
            if (val) {
                var ch = val[0];
                if (ch >= '一' && ch <= '鿿') {
                    enterLetter(G.selectedCell.row, G.selectedCell.col, ch);
                    cellInput.value = '';
                }
            }
        });

        cellInput.addEventListener('keydown', function(e) {
            if (e.key === 'Tab') { e.preventDefault(); return; }
            if (e.key === 'Backspace' || e.key === 'Delete') {
                if (G.state === 'playing' && G.selectedCell) {
                    G.userGrid[G.selectedCell.row][G.selectedCell.col] = '';
                    moveToPreviousCell();
                    showCellInput();
                    e.preventDefault();
                }
            }
        });

        document.addEventListener('keydown', handleKeyDown);

            createMenuButtons();
            gameLoop();
        }

        function resizeCanvas() {
            G.width = window.innerWidth;
            G.height = window.innerHeight - 60; // 减去广告栏高度

            G.canvas.width = G.width * G.dpr;
            G.canvas.height = G.height * G.dpr;
            G.canvas.style.width = G.width + 'px';
            G.canvas.style.height = G.height + 'px';

            G.ctx.setTransform(G.dpr, 0, 0, G.dpr, 0, 0);

            // 重新计算按钮位置
            if (G.state === 'menu') {
                createMenuButtons();
            } else if (G.state === 'playing') {
                calculateGridOffset();
                createPlayingButtons();
            }
        }

        function calculateGridOffset() {
            var puzzle = G.puzzle;
            var cellSize = Math.min(
                (G.width - 40) / puzzle.size,
                (G.height - 160) / puzzle.size,
                50
            );
            CONFIG.CELL_SIZE = cellSize;

            var gridWidth = puzzle.size * cellSize;
            var gridHeight = puzzle.size * cellSize;

            G.offsetX = (G.width - gridWidth) / 2;
            G.offsetY = 60 + (G.height - 60 - gridHeight) / 2;
        }

        // ===== 按钮创建 =====
        function createMenuButtons() {
            var centerX = G.width / 2;
            var centerY = G.height / 2;

            G.menuButtons = [
                {
                    x: centerX - 100,
                    y: centerY + 50,
                    w: 200,
                    h: 50,
                    text: '开始游戏',
                    action: function() { startGame(); }
                },
                {
                    x: centerX - 100,
                    y: centerY + 120,
                    w: 200,
                    h: 50,
                    text: '选择关卡',
                    action: function() { showLevelSelect(); }
                }
            ];
        }

        function createPlayingButtons() {
            G.buttons = [
                {
                    x: 10,
                    y: 10,
                    w: 60,
                    h: 40,
                    text: '返回',
                    action: function() { backToMenu(); }
                },
                {
                    x: G.width - 70,
                    y: 10,
                    w: 60,
                    h: 40,
                    text: '提示',
                    action: function() { useHint(); }
                }
            ];
        }

        // ===== 游戏开始 =====
        function startGame(levelIndex) {
            if (levelIndex === undefined) {
                levelIndex = 0;
            }

            G.currentPuzzle = levelIndex;
            G.puzzle = PUZZLES[levelIndex];
            G.state = 'playing';
            G.score = 0;
            G.combo = 0;
            G.maxCombo = 0;
            G.hintsUsed = 0;
            setTimeout(showCellInput, 100);
            G.wordsFound = 0;
            G.totalWords = G.puzzle.words.length;
            G.selectedCell = null;
            G.selectedDir = 'across';
            G.interstitialShown = false;

            // 初始化网格
            initGrid();

            // 开始计时
            G.startTime = Date.now();
            if (G.timerInterval) {
                clearInterval(G.timerInterval);
            }
            G.timerInterval = setInterval(updateTimer, 1000);

            calculateGridOffset();
            createPlayingButtons();
        }

        function initGrid() {
            var puzzle = G.puzzle;
            G.grid = [];
            G.userGrid = [];

            // 创建空网格
            for (var i = 0; i < puzzle.size; i++) {
                G.grid[i] = [];
                G.userGrid[i] = [];
                for (var j = 0; j < puzzle.size; j++) {
                    G.grid[i][j] = null;
                    G.userGrid[i][j] = '';
                }
            }

            // 填充单词
            var wordNumber = 1;
            for (var w = 0; w < puzzle.words.length; w++) {
                var word = puzzle.words[w];
                word.number = wordNumber++;

                for (var c = 0; c < word.text.length; c++) {
                    var r = word.dir === 'down' ? word.row + c : word.row;
                    var col = word.dir === 'across' ? word.col + c : word.col;

                    if (r >= 0 && r < puzzle.size && col >= 0 && col < puzzle.size) {
                        G.grid[r][col] = {
                            letter: word.text[c],
                            wordIndex: w,
                            charIndex: c,
                            number: c === 0 ? word.number : null
                        };
                    }
                }
            }
        }

        function showLevelSelect() {
            // 简单实现：随机选择一个关卡
            var randomIndex = Math.floor(Math.random() * PUZZLES.length);
            startGame(randomIndex);
        }

        function backToMenu() {
            G.state = 'menu';
            if (G.timerInterval) {
                clearInterval(G.timerInterval);
            }
            createMenuButtons();
        }

        // ===== 提示系统 =====
        function useHint() {
            if (G.selectedCell === null) return;

            var row = G.selectedCell.row;
            var col = G.selectedCell.col;

            if (G.grid[row][col] && G.userGrid[row][col] !== G.grid[row][col].letter) {
                G.userGrid[row][col] = G.grid[row][col].letter;
                G.score += CONFIG.POINTS.HINT;
                G.hintsUsed++;

                // 检查是否有完整的词被填完
                checkWordCompletion(row, col);

                // 创建粒子效果
                createParticles(G.offsetX + col * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2,
                               G.offsetY + row * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2,
                               CONFIG.COLORS.hint);
            }
        }

        // ===== 输入处理 =====
        function handleClick(e) {
            var rect = G.canvas.getBoundingClientRect();
            var x = e.clientX - rect.left;
            var y = e.clientY - rect.top;

            handleInteraction(x, y);
        }

        function handleTouch(e) {
            e.preventDefault();
            var rect = G.canvas.getBoundingClientRect();
            var touch = e.touches[0];
            var x = touch.clientX - rect.left;
            var y = touch.clientY - rect.top;

            handleInteraction(x, y);
        }

        function handleInteraction(x, y) {
            if (G.state === 'menu') {
                for (var i = 0; i < G.menuButtons.length; i++) {
                    var btn = G.menuButtons[i];
                    if (x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h) {
                        btn.action();
                        return;
                    }
                }
            } else if (G.state === 'playing') {
                // 检查按钮
                for (var i = 0; i < G.buttons.length; i++) {
                    var btn = G.buttons[i];
                    if (x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h) {
                        btn.action();
                        return;
                    }
                }

                // 检查网格点击
                var gridX = Math.floor((x - G.offsetX) / CONFIG.CELL_SIZE);
                var gridY = Math.floor((y - G.offsetY) / CONFIG.CELL_SIZE);

                if (gridX >= 0 && gridX < G.puzzle.size && gridY >= 0 && gridY < G.puzzle.size) {
                    if (G.grid[gridY][gridX] !== null) {
                        // 如果点击同一个单元格，切换方向
                        if (G.selectedCell && G.selectedCell.row === gridY && G.selectedCell.col === gridX) {
                            G.selectedDir = G.selectedDir === 'across' ? 'down' : 'across';
                        } else {
                            G.selectedCell = { row: gridY, col: gridX };
                            showCellInput();
                        }

                        // 尝试选择一个单词
                        selectWordAtCell(gridY, gridX);
                    }
                }
            }
        }

        function selectWordAtCell(row, col) {
            // 找到包含此单元格的单词
            var cell = G.grid[row][col];
            if (cell) {
                var word = G.puzzle.words[cell.wordIndex];
                G.selectedDir = word.dir;
            }
        }

        function handleKeyDown(e) {
            if (G.state !== 'playing' || G.selectedCell === null) return;

            var row = G.selectedCell.row;
            var col = G.selectedCell.col;

            if (e.key >= 'a' && e.key <= 'z') {
                var letter = e.key.toUpperCase();
                enterLetter(row, col, letter);
            } else if (e.key >= 'A' && e.key <= 'Z') {
                enterLetter(row, col, e.key);
            } else if (e.key >= '一' && e.key <= '鿿') {
                // 汉字直接输入
                enterLetter(row, col, e.key);
            } else if (e.key === 'Backspace' || e.key === 'Delete') {
                G.userGrid[row][col] = '';
                moveToPreviousCell();
                showCellInput();
            } else if (e.key === 'ArrowLeft') {
                moveSelection(0, -1); showCellInput();
            } else if (e.key === 'ArrowRight') {
                moveSelection(0, 1); showCellInput();
            } else if (e.key === 'ArrowUp') {
                moveSelection(-1, 0); showCellInput();
            } else if (e.key === 'ArrowDown') {
                moveSelection(1, 0); showCellInput();
            } else if (e.key === 'Tab') {
                // 切换方向
                G.selectedDir = G.selectedDir === 'across' ? 'down' : 'across';
                e.preventDefault();
            }
        }

        function enterLetter(row, col, letter) {
            if (G.grid[row][col] === null) return;

            G.userGrid[row][col] = letter;

            // 检查是否正确
            if (G.grid[row][col].letter === letter) {
                // 正确
                G.score += CONFIG.POINTS.CORRECT;
                G.combo++;
                if (G.combo > G.maxCombo) {
                    G.maxCombo = G.combo;
                }
                if (G.combo > 1) {
                    G.score += CONFIG.POINTS.COMBO_BONUS * (G.combo - 1);
                }

                createParticles(G.offsetX + col * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2,
                               G.offsetY + row * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2,
                               CONFIG.COLORS.correct);

                // 检查单词完成
                checkWordCompletion(row, col);

                // 移动到下一个单元格
                moveToNextCell();
                showCellInput();
            } else {
                // 错误
                G.combo = 0;
                G.score -= 2;
                if (G.score < 0) G.score = 0;

                createParticles(G.offsetX + col * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2,
                               G.offsetY + row * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2,
                               CONFIG.COLORS.wrong);
            }
        }

        function moveToNextCell() {
            if (G.selectedDir === 'across') {
                moveSelection(0, 1);
            } else {
                moveSelection(1, 0);
            }
        }

        function moveToPreviousCell() {
            if (G.selectedDir === 'across') {
                moveSelection(0, -1);
            } else {
                moveSelection(-1, 0);
            }
        }

        function moveSelection(dr, dc) {
            var newRow = G.selectedCell.row + dr;
            var newCol = G.selectedCell.col + dc;

            // 找到下一个有效单元格
            while (newRow >= 0 && newRow < G.puzzle.size && newCol >= 0 && newCol < G.puzzle.size) {
                if (G.grid[newRow][newCol] !== null) {
                    G.selectedCell = { row: newRow, col: newCol };
                    showCellInput();
                    return;
                }
                newRow += dr;
                newCol += dc;
            }
        }

        function checkWordCompletion(row, col) {
            var cell = G.grid[row][col];
            if (!cell) return;

            var wordIndex = cell.wordIndex;
            var word = G.puzzle.words[wordIndex];

            // 检查整个单词是否填完
            var complete = true;
            for (var c = 0; c < word.text.length; c++) {
                var r = word.dir === 'down' ? word.row + c : word.row;
                var cl = word.dir === 'across' ? word.col + c : word.col;

                if (G.userGrid[r][cl] !== word.text[c]) {
                    complete = false;
                    break;
                }
            }

            if (complete && !word.completed) {
                word.completed = true;
                G.wordsFound++;

                // 额外奖励
                G.score += word.text.length * 5;

                createParticles(G.width / 2, G.height / 2, CONFIG.COLORS.hint);

                // 检查游戏完成
                if (G.wordsFound >= G.totalWords) {
                    gameComplete();
                }
            }
        }

        function gameComplete() {
            G.state = 'levelComplete';
            G.elapsedTime = Math.floor((Date.now() - G.startTime) / 1000);

            if (G.timerInterval) {
                clearInterval(G.timerInterval);
            }

            // 更新最高分
            if (G.score > G.highScore) {
                G.highScore = G.score;
                saveHighScore();
            }

            // 显示插屏广告
            if (!G.interstitialShown) {
                G.interstitialShown = true;
                setTimeout(showInterstitialAd, 500);
            }
        }

        function updateTimer() {
            if (G.state === 'playing') {
                G.elapsedTime = Math.floor((Date.now() - G.startTime) / 1000);
            }
        }

        // ===== 广告系统 =====
        function showSponsorModal() {
            document.getElementById('sponsorModal').classList.add('active');
        }

        function hideSponsorModal() {
            document.getElementById('sponsorModal').classList.remove('active');
        }

        function sponsorAction(method) {
            alert('感谢您的支持！' + method + '赞助功能即将上线');
            hideSponsorModal();
        }

        function showInterstitialAd() {
            document.getElementById('interstitialAd').classList.add('active');
            var timer = 3;
            var timerElement = document.getElementById('interstitialTimer');
            timerElement.textContent = timer;

            var countdown = setInterval(function() {
                timer--;
                timerElement.textContent = timer;
                if (timer <= 0) {
                    clearInterval(countdown);
                    document.getElementById('interstitialClose').style.display = 'block';
                }
            }, 1000);

            document.getElementById('interstitialClose').style.display = 'none';
        }

        function hideInterstitialAd() {
            document.getElementById('interstitialAd').classList.remove('active');
        }

        // ===== 粒子系统 =====
        function createParticles(x, y, color) {
            for (var i = 0; i < 15; i++) {
                G.particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    life: 1.0,
                    color: color,
                    size: Math.random() * 4 + 2
                });
            }
        }

        function updateParticles() {
            for (var i = G.particles.length - 1; i >= 0; i--) {
                var p = G.particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;
                p.size *= 0.98;

                if (p.life <= 0) {
                    G.particles.splice(i, 1);
                }
            }
        }

        function drawParticles() {
            for (var i = 0; i < G.particles.length; i++) {
                var p = G.particles[i];
                G.ctx.globalAlpha = p.life;
                G.ctx.fillStyle = p.color;
                G.ctx.beginPath();
                G.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                G.ctx.fill();
            }
            G.ctx.globalAlpha = 1.0;
        }

        // ===== 高分管理 =====
        function loadHighScore() {
            var saved = localStorage.getItem('crossword_highScore');
            G.highScore = saved ? parseInt(saved) : 0;
        }

        function saveHighScore() {
            localStorage.setItem('crossword_highScore', G.highScore.toString());
        }

        // ===== 渲染函数 =====
        function render() {
            var ctx = G.ctx;
            ctx.clearRect(0, 0, G.width, G.height);

            // 背景渐变
            var gradient = ctx.createLinearGradient(0, 0, G.width, G.height);
            gradient.addColorStop(0, '#1a1a2e');
            gradient.addColorStop(1, '#16213e');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, G.width, G.height);

            if (G.state === 'menu') {
                renderMenu();
            } else if (G.state === 'playing' || G.state === 'levelComplete') {
                renderGame();
            }

            drawParticles();
        }

        function renderMenu() {
            var ctx = G.ctx;
            var centerX = G.width / 2;
            var centerY = G.height / 2;

            // 标题
            ctx.fillStyle = CONFIG.COLORS.gradient1;
            ctx.font = 'bold 48px "Microsoft YaHei", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('填字游戏', centerX, centerY - 100);

            // 副标题
            ctx.fillStyle = '#ffffff';
            ctx.font = '20px "Microsoft YaHei", sans-serif';
            ctx.fillText('挑战你的中文词汇量！', centerX, centerY - 40);

            // 最高分
            ctx.fillStyle = CONFIG.COLORS.hint;
            ctx.font = '16px "Microsoft YaHei", sans-serif';
            ctx.fillText('最高分: ' + G.highScore, centerX, centerY);

            // 按钮
            for (var i = 0; i < G.menuButtons.length; i++) {
                var btn = G.menuButtons[i];
                drawButton(btn, '#e94560', '#c23152');
            }
        }

        function renderGame() {
            var ctx = G.ctx;

            // 绘制顶部信息栏
            renderTopBar();

            // 绘制网格
            renderGrid();

            // 绘制提示信息
            renderCluePanel();

            // 如果游戏完成，显示完成信息
            if (G.state === 'levelComplete') {
                renderLevelComplete();
            }
        }

        function renderTopBar() {
            var ctx = G.ctx;

            // 背景
            ctx.fillStyle = 'rgba(22, 33, 62, 0.9)';
            ctx.fillRect(0, 0, G.width, 50);

            // 题目标题
            ctx.fillStyle = CONFIG.COLORS.gradient1;
            ctx.font = 'bold 20px "Microsoft YaHei", sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.fillText(G.puzzle.title, 80, 25);

            // 分数
            ctx.fillStyle = '#ffffff';
            ctx.font = '16px "Microsoft YaHei", sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText('分数: ' + G.score, G.width - 10, 15);

            // 连击
            ctx.fillStyle = CONFIG.COLORS.hint;
            ctx.fillText('连击: ' + G.combo, G.width - 10, 35);

            // 进度
            ctx.fillStyle = '#00d2ff';
            ctx.textAlign = 'center';
            ctx.fillText(G.wordsFound + '/' + G.totalWords, G.width / 2, 25);

            // 时间
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'left';
            var minutes = Math.floor(G.elapsedTime / 60);
            var seconds = G.elapsedTime % 60;
            ctx.fillText(formatTime(minutes) + ':' + formatTime(seconds), 80, 45);
        }

        function formatTime(t) {
            return t < 10 ? '0' + t : t.toString();
        }

        function renderGrid() {
            var ctx = G.ctx;
            var puzzle = G.puzzle;
            var cellSize = CONFIG.CELL_SIZE;

            // 绘制网格背景
            ctx.fillStyle = CONFIG.COLORS.grid;
            ctx.fillRect(G.offsetX, G.offsetY, puzzle.size * cellSize, puzzle.size * cellSize);

            // 绘制单元格
            for (var i = 0; i < puzzle.size; i++) {
                for (var j = 0; j < puzzle.size; j++) {
                    var x = G.offsetX + j * cellSize;
                    var y = G.offsetY + i * cellSize;

                    if (G.grid[i][j] !== null) {
                        // 选中状态
                        if (G.selectedCell && G.selectedCell.row === i && G.selectedCell.col === j) {
                            ctx.fillStyle = CONFIG.COLORS.selected;
                        } else {
                            ctx.fillStyle = CONFIG.COLORS.cell;
                        }

                        ctx.fillRect(x + 1, y + 1, cellSize - 2, cellSize - 2);

                        // 绘制边框
                        ctx.strokeStyle = '#333355';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(x, y, cellSize, cellSize);

                        // 绘制编号
                        if (G.grid[i][j].number !== null) {
                            ctx.fillStyle = CONFIG.COLORS.number;
                            ctx.font = 'bold 10px "Microsoft YaHei", sans-serif';
                            ctx.textAlign = 'left';
                            ctx.textBaseline = 'top';
                            ctx.fillText(G.grid[i][j].number.toString(), x + 3, y + 2);
                        }

                        // 绘制用户输入
                        if (G.userGrid[i][j]) {
                            var isCorrect = G.userGrid[i][j] === G.grid[i][j].letter;
                            ctx.fillStyle = isCorrect ? CONFIG.COLORS.correct : CONFIG.COLORS.wrong;
                            ctx.font = 'bold ' + (cellSize * 0.6) + 'px "Microsoft YaHei", sans-serif';
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.fillText(G.userGrid[i][j], x + cellSize / 2, y + cellSize / 2);
                        }
                    } else {
                        // 空单元格（黑色）
                        ctx.fillStyle = '#0a0a1a';
                        ctx.fillRect(x, y, cellSize, cellSize);
                    }
                }
            }
        }

        function renderCluePanel() {
            var ctx = G.ctx;
            var panelY = G.offsetY + G.puzzle.size * CONFIG.CELL_SIZE + 10;
            var panelHeight = G.height - panelY - 10;

            if (panelHeight < 60) return;

            // 背景
            ctx.fillStyle = 'rgba(22, 33, 62, 0.8)';
            ctx.fillRect(10, panelY, G.width - 20, panelHeight);

            // 标题
            ctx.fillStyle = CONFIG.COLORS.gradient1;
            ctx.font = 'bold 14px "Microsoft YaHei", sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText('提示：', 20, panelY + 10);

            // 显示当前选中单词的提示
            if (G.selectedCell) {
                var cell = G.grid[G.selectedCell.row][G.selectedCell.col];
                if (cell) {
                    var word = G.puzzle.words[cell.wordIndex];
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '14px "Microsoft YaHei", sans-serif';
                    ctx.fillText(word.number + '. ' + word.clue, 20, panelY + 30);
                }
            }
        }

        function renderLevelComplete() {
            var ctx = G.ctx;
            var centerX = G.width / 2;
            var centerY = G.height / 2;

            // 半透明遮罩
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, G.width, G.height);

            // 完成面板
            ctx.fillStyle = 'rgba(22, 33, 62, 0.95)';
            ctx.fillRect(centerX - 150, centerY - 120, 300, 240);

            // 标题
            ctx.fillStyle = CONFIG.COLORS.hint;
            ctx.font = 'bold 28px "Microsoft YaHei", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('恭喜通关！', centerX, centerY - 80);

            // 统计信息
            ctx.fillStyle = '#ffffff';
            ctx.font = '16px "Microsoft YaHei", sans-serif';
            ctx.fillText('分数: ' + G.score, centerX, centerY - 30);
            ctx.fillText('最高连击: ' + G.maxCombo, centerX, centerY);
            ctx.fillText('用时: ' + formatTime(Math.floor(G.elapsedTime / 60)) + ':' + formatTime(G.elapsedTime % 60), centerX, centerY + 30);
            ctx.fillText('使用提示: ' + G.hintsUsed + ' 次', centerX, centerY + 60);

            // 继续按钮
            drawButton({
                x: centerX - 60,
                y: centerY + 90,
                w: 120,
                h: 40,
                text: '继续'
            }, '#e94560', '#c23152');
        }

        function drawButton(btn, color1, color2) {
            var ctx = G.ctx;

            // 按钮渐变
            var gradient = ctx.createLinearGradient(btn.x, btn.y, btn.x, btn.y + btn.h);
            gradient.addColorStop(0, color1);
            gradient.addColorStop(1, color2);

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.roundRect(btn.x, btn.y, btn.w, btn.h, 8);
            ctx.fill();

            // 按钮文字
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 16px "Microsoft YaHei", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(btn.text, btn.x + btn.w / 2, btn.y + btn.h / 2);
        }

        // ===== 游戏循环 =====
        function gameLoop() {
            updateParticles();
            render();
            requestAnimationFrame(gameLoop);
        }

        // ===== 启动游戏 =====
        window.onload = init;
    
        // 游戏结束处理
        function gameOver() {
            console.log("游戏结束");
        }
        
        // 音效支持
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq = 440, duration = 0.1) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }
        
        // 错误处理
        try {
        } catch(e) {
            console.error("游戏错误:", e);
        }
        
        // 加载完成
        window.addEventListener("load", function() {
            const ls = document.getElementById("loadingScreen");
            if(ls) ls.style.display = "none";
        });
        </script>

<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
