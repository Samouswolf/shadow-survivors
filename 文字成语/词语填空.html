/* ===== 粒子系统 ===== */
class Particle {
    constructor(x, y, color, speed, life, size) {
        this.x = x; this.y = y;
        this.vx = (Math.random() - 0.5) * speed;
        this.vy = (Math.random() - 0.5) * speed;
        this.life = this.maxLife = life;
        this.color = color;
        this.size = size || Math.random() * 4 + 2;
    }
    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.life -= dt;
        return this.life > 0;
    }
    draw(ctx) {
        const alpha = this.life / this.maxLife;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * alpha, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }
}

/* ===== 浮动文字 ===== */
class FloatText {
    constructor(x, y, text, color, size) {
        this.x = x; this.y = y;
        this.text = text; this.color = color;
        this.size = size || 28;
        this.life = 1.5;
        this.maxLife = 1.5;
        this.vy = -60;
    }
    update(dt) {
        this.y += this.vy * dt;
        this.life -= dt;
        return this.life > 0;
    }
    draw(ctx) {
        const alpha = this.life / this.maxLife;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = this.color;
        ctx.font = `bold ${this.size}px 'Microsoft YaHei', sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText(this.text, this.x, this.y);
        ctx.globalAlpha = 1;
    }
}

/* ===== 游戏状态 ===== */
const STATE = { MENU: 0, PLAYING: 1, RESULT: 2, ANSWER_FEEDBACK: 3 };

var G = {
    state: STATE.MENU,
    canvas: null, ctx: null,
    W: 0, H: 0, scale: 1,
    particles: [], floatTexts: [],
    // 游戏数据
    questions: [],
    currentQ: 0,
    score: 0,
    combo: 0,
    maxCombo: 0,
    correctCount: 0,
    timeLeft: CONFIG.TIME_LIMIT,
    timerActive: false,
    selectedOption: -1,
    feedbackTimer: 0,
    // 动画
    menuAnim: 0,
    resultAnim: 0,
    btnHover: -1,
    optionHover: -1,
    // 最高分
    highScore: 0,
    // 背景星星
    stars: [],
    // 题目显示动画
    phraseAnim: 0,
    optionAnim: 0,
    // 计时器
    timerInterval: null
};

/* ===== 初始化 ===== */
function init() {
    G.canvas = document.getElementById('c');
    G.ctx = G.canvas.getContext('2d');
    // 加载最高分
    try { G.highScore = parseInt(localStorage.getItem('wordFill_highScore')) || 0; } catch(e) {}
    // 生成背景星星
    for (let i = 0; i < 80; i++) {
        G.stars.push({
            x: Math.random(), y: Math.random(),
            size: Math.random() * 2 + 1,
            speed: Math.random() * 0.02 + 0.005,
            alpha: Math.random() * 0.5 + 0.3
        });
    }
    resize();
    window.addEventListener('resize', resize);
    // 事件绑定
    G.canvas.addEventListener('click', handleClick);
    G.canvas.addEventListener('mousemove', handleMouseMove);
    G.canvas.addEventListener('touchstart', handleTouch, { passive: false });
    // 键盘支持
    window.addEventListener('keydown', handleKey);
    // 启动循环
    requestAnimationFrame(gameLoop);
}

function resize() {
    const dpr = window.devicePixelRatio || 1;
    G.W = window.innerWidth;
    G.H = window.innerHeight;
    G.canvas.width = G.W * dpr;
    G.canvas.height = G.H * dpr;
    G.canvas.style.width = G.W + 'px';
    G.canvas.style.height = G.H + 'px';
    G.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    G.scale = Math.min(G.W / 400, G.H / 700, 1.5);
}

/* ===== 题目生成 ===== */
function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function generateQuestions() {
    const shuffled = shuffle(QUESTION_BANK);
    G.questions = shuffled.slice(0, CONFIG.TOTAL_QUESTIONS).map(q => {
        // 重新打乱选项顺序
        const opts = shuffle(q.options);
        const ansIdx = opts.indexOf(q.answer);
        return { ...q, options: opts, answerIdx: ansIdx };
    });
}

/* ===== 游戏控制 ===== */
function startGame() {
    G.state = STATE.PLAYING;
    resize(); // 确保进入游戏时canvas尺寸正确
    G.score = 0; G.combo = 0; G.maxCombo = 0; G.correctCount = 0;
    G.currentQ = 0; G.selectedOption = -1;
    G.particles = []; G.floatTexts = [];
    generateQuestions();
    // 防御：确保题库非空
    if (!G.questions || G.questions.length === 0) {
        G.questions = [{
            phrase: "__心丧气", answer: "灰", options: ["灰","黑","白","红"],
            hint: "形容因失败或不顺利而失去信心", answerIdx: 0
        }];
    }
    startTimer();
}

function startTimer() {
    G.timeLeft = CONFIG.TIME_LIMIT;
    G.timerActive = true;
    if (G.timerInterval) clearInterval(G.timerInterval);
    G.timerInterval = setInterval(() => {
        if (G.timerActive) {
            G.timeLeft -= 0.1;
            if (G.timeLeft <= 0) {
                G.timeLeft = 0;
                handleTimeout();
            }
        }
    }, 100);
}

function stopTimer() {
    G.timerActive = false;
    if (G.timerInterval) { clearInterval(G.timerInterval); G.timerInterval = null; }
}

function handleTimeout() {
    stopTimer();
    G.combo = 0;
    G.state = STATE.ANSWER_FEEDBACK;
    G.feedbackTimer = 1.5;
    G.selectedOption = -2; // -2 表示超时
    spawnParticles(G.W / 2, G.H / 2, '#ff4444', 15);
    G.floatTexts.push(new FloatText(G.W / 2, G.H / 2 - 30, '时间到!', '#ff4444', 32));
    G.floatTexts.push(new FloatText(G.W / 2, G.H / 2 + 10, '答案: ' + G.questions[G.currentQ].answer, '#ffaa00', 24));
}

function selectAnswer(idx) {
    if (G.state !== STATE.PLAYING) return;
    stopTimer();
    G.selectedOption = idx;
    const q = G.questions[G.currentQ];
    if (idx === q.answerIdx) {
        // 正确
        G.combo++;
        if (G.combo > G.maxCombo) G.maxCombo = G.combo;
        G.correctCount++;
        const bonus = Math.floor(G.combo * CONFIG.STREAK_MULTIPLIER * CONFIG.CORRECT_SCORE);
        G.score += CONFIG.CORRECT_SCORE + bonus;
        G.state = STATE.ANSWER_FEEDBACK;
        G.feedbackTimer = 1.2;
        spawnParticles(G.W / 2, G.H / 2, '#44ff88', 25);
        G.floatTexts.push(new FloatText(G.W / 2, G.H / 2 - 30, '正确!', '#44ff88', 36));
        if (G.combo > 1) {
            G.floatTexts.push(new FloatText(G.W / 2, G.H / 2 + 10, G.combo + '连击! +' + bonus, '#ffdd44', 24));
        }
    } else {
        // 错误
        G.combo = 0;
        G.state = STATE.ANSWER_FEEDBACK;
        G.feedbackTimer = 1.5;
        spawnParticles(G.W / 2, G.H / 2, '#ff4444', 15);
        G.floatTexts.push(new FloatText(G.W / 2, G.H / 2 - 30, '错误!', '#ff4444', 32));
        G.floatTexts.push(new FloatText(G.W / 2, G.H / 2 + 10, '答案: ' + q.answer, '#ffaa00', 24));
    }
}

function nextQuestion() {
    G.currentQ++;
    if (G.currentQ >= G.questions.length) {
        endGame();
    } else {
        G.state = STATE.PLAYING;
        G.selectedOption = -1;
        G.phraseAnim = 0;
        G.optionAnim = 0;
        startTimer();
    }
}

function endGame() {
    G.state = STATE.RESULT;
    G.resultAnim = 0;
    if (G.score > G.highScore) {
        G.highScore = G.score;
        try { localStorage.setItem('wordFill_highScore', G.highScore); } catch(e) {}
    }
    // 庆祝粒子
    for (let i = 0; i < 50; i++) {
        setTimeout(() => {
            spawnParticles(Math.random() * G.W, Math.random() * G.H * 0.5, ['#ffdd44','#44ff88','#ff66aa','#66aaff','#ff8844'][Math.floor(Math.random()*5)], 8);
        }, i * 60);
    }
}

/* ===== 粒子特效 ===== */
function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        G.particles.push(new Particle(x, y, color, 200 + Math.random() * 150, 0.8 + Math.random() * 0.6, Math.random() * 5 + 2));
    }
}

/* ===== 渲染 ===== */
function drawBg() {
    const ctx = G.ctx;
    const gradient = ctx.createLinearGradient(0, 0, 0, G.H);
    gradient.addColorStop(0, '#0a0a2e');
    gradient.addColorStop(0.5, '#1a1a4e');
    gradient.addColorStop(1, '#0a0a3e');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, G.W, G.H);
    // 星星
    G.stars.forEach(s => {
        const sx = s.x * G.W;
        const sy = s.y * G.H;
        ctx.globalAlpha = s.alpha * (0.5 + 0.5 * Math.sin(Date.now() * s.speed));
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(sx, sy, s.size, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;
}

function drawButton(x, y, w, h, text, hovered, color1, color2) {
    const ctx = G.ctx;
    const r = 12 * G.scale;
    ctx.save();
    // 阴影
    ctx.shadowColor = 'rgba(0,0,0,0.3)';
    ctx.shadowBlur = 10 * G.scale;
    ctx.shadowOffsetY = 4 * G.scale;
    // 渐变按钮
    const grad = ctx.createLinearGradient(x, y, x, y + h);
    if (hovered) {
        grad.addColorStop(0, lightenColor(color1, 30));
        grad.addColorStop(1, lightenColor(color2, 30));
    } else {
        grad.addColorStop(0, color1);
        grad.addColorStop(1, color2);
    }
    ctx.fillStyle = grad;
    roundRect(ctx, x, y, w, h, r);
    ctx.fill();
    // 边框
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1.5 * G.scale;
    roundRect(ctx, x, y, w, h, r);
    ctx.stroke();
    ctx.restore();
    // 文字
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${18 * G.scale}px 'Microsoft YaHei', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + w / 2, y + h / 2);
}

function drawOptionButton(x, y, w, h, text, idx, selected, correct, hovered) {
    const ctx = G.ctx;
    const r = 10 * G.scale;
    let bg1, bg2;
    if (selected === idx) {
        if (correct) {
            bg1 = '#2ecc71'; bg2 = '#27ae60';
        } else {
            bg1 = '#e74c3c'; bg2 = '#c0392b';
        }
    } else if (G.state === STATE.ANSWER_FEEDBACK && idx === G.questions[G.currentQ].answerIdx) {
        bg1 = '#2ecc71'; bg2 = '#27ae60';
    } else if (hovered && G.state === STATE.PLAYING) {
        bg1 = '#4a6fa5'; bg2 = '#3a5a8a';
    } else {
        bg1 = '#2a3a5a'; bg2 = '#1a2a4a';
    }
    const grad = ctx.createLinearGradient(x, y, x, y + h);
    grad.addColorStop(0, bg1);
    grad.addColorStop(1, bg2);
    ctx.fillStyle = grad;
    roundRect(ctx, x, y, w, h, r);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.lineWidth = 1.5 * G.scale;
    roundRect(ctx, x, y, w, h, r);
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${22 * G.scale}px 'Microsoft YaHei', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + w / 2, y + h / 2);
}

function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

function lightenColor(hex, percent) {
    let r = parseInt(hex.slice(1, 3), 16);
    let g = parseInt(hex.slice(3, 5), 16);
    let b = parseInt(hex.slice(5, 7), 16);
    r = Math.min(255, r + Math.floor((255 - r) * percent / 100));
    g = Math.min(255, g + Math.floor((255 - g) * percent / 100));
    b = Math.min(255, b + Math.floor((255 - b) * percent / 100));
    return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
}

/* ===== 界面渲染 ===== */
function drawMenu(dt) {

function drawPlaying(dt) {
    const ctx = G.ctx;
    const s = G.scale;
    const q = G.questions[G.currentQ];
    if (!q) return;
    // 顶部信息栏
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(0, 0, G.W, 50 * s);
    // 进度
    ctx.fillStyle = '#88ccff';
    ctx.font = `bold ${16 * s}px 'Microsoft YaHei', sans-serif`;
    ctx.textAlign = 'left';
    ctx.fillText(`第 ${G.currentQ + 1}/${G.questions.length} 题`, 15 * s, 30 * s);
    // 分数
    ctx.textAlign = 'right';
    ctx.fillStyle = '#ffdd44';
    ctx.fillText(`分数: ${G.score}`, G.W - 15 * s, 30 * s);
    // 连击
    if (G.combo > 1) {
        ctx.textAlign = 'center';
        ctx.fillStyle = '#ff8844';
        ctx.fillText(`${G.combo}连击!`, G.W / 2, 30 * s);
    }
    // 时间条
    const timeBarW = G.W - 30 * s;
    const timeBarH = 8 * s;
    const timeBarX = 15 * s;
    const timeBarY = 55 * s;
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    roundRect(ctx, timeBarX, timeBarY, timeBarW, timeBarH, 4 * s);
    ctx.fill();
    const timePct = G.timeLeft / CONFIG.TIME_LIMIT;
    let timeColor = '#44ff88';
    if (timePct < 0.3) timeColor = '#ff4444';
    else if (timePct < 0.6) timeColor = '#ffaa00';
    ctx.fillStyle = timeColor;
    roundRect(ctx, timeBarX, timeBarY, timeBarW * timePct, timeBarH, 4 * s);
    ctx.fill();
    // 时间数字
    ctx.fillStyle = timeColor;
    ctx.font = `bold ${14 * s}px 'Microsoft YaHei', sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(Math.ceil(G.timeLeft) + 's', G.W / 2, timeBarY + timeBarH + 18 * s);
    // 题目提示
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.font = `${14 * s}px 'Microsoft YaHei', sans-serif`;
    ctx.fillText(q.hint, G.W / 2, timeBarY + timeBarH + 42 * s);
    // 成语显示（带动画）
    G.phraseAnim = Math.min(1, G.phraseAnim + dt * 4);
    const phraseY = G.H * 0.3;
    ctx.save();
    ctx.globalAlpha = G.phraseAnim;
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${42 * s}px 'Microsoft YaHei', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    // 绘制成语，空缺字用下划线标出
    const phrase = q.phrase;
    const chars = phrase.split('');
    const charWidth = 45 * s;
    const startX = G.W / 2 - (chars.length * charWidth) / 2 + charWidth / 2;
    chars.forEach((ch, i) => {
        const cx = startX + i * charWidth;
        if (ch === '_') {
            // 下划线
            ctx.fillStyle = '#ffdd44';
            ctx.fillRect(cx - 15 * s, phraseY + 18 * s, 30 * s, 3 * s);
            ctx.fillStyle = '#ffdd44';
            ctx.font = `bold ${28 * s}px 'Microsoft YaHei', sans-serif`;
            ctx.fillText('？', cx, phraseY);
        } else {
            ctx.fillStyle = '#fff';
            ctx.font = `bold ${42 * s}px 'Microsoft YaHei', sans-serif`;
            ctx.fillText(ch, cx, phraseY);
        }
    });
    ctx.restore();
    // 选项按钮
    G.optionAnim = Math.min(1, G.optionAnim + dt * 3);
    const optW = Math.min(280 * s, G.W - 40 * s);
    const optH = 52 * s;
    const optGap = 14 * s;
    const optStartY = G.H * 0.48;
    G._optionBtns = [];
    for (let i = 0; i < 4; i++) {
        const optY = optStartY + i * (optH + optGap);
        const optX = G.W / 2 - optW / 2;
        const alpha = Math.max(0, Math.min(1, G.optionAnim * 3 - i * 0.5));
        ctx.save();
        ctx.globalAlpha = alpha;
        const isSelected = (G.state === STATE.ANSWER_FEEDBACK && G.selectedOption === i);
        const isCorrect = (G.state === STATE.ANSWER_FEEDBACK && i === q.answerIdx);
        drawOptionButton(optX, optY, optW, optH, q.options[i], i, G.selectedOption, G.selectedOption === q.answerIdx, G.optionHover === i);
        ctx.restore();
        G._optionBtns.push({ x: optX, y: optY, w: optW, h: optH });
    }
    // 键盘提示
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.font = `${12 * s}px 'Microsoft YaHei', sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('按 1-4 快速选择', G.W / 2, optStartY + 4 * (optH + optGap) + 20 * s);
}

function drawFeedback(dt) {
    // 答案反馈界面 - 底层绘制题目信息，上层显示结果
    drawPlaying(dt);
    // 反馈叠加效果由floatTexts处理
}

function drawResult(dt) {
    G.resultAnim += dt;
    const ctx = G.ctx;
    const s = G.scale;
    // 半透明遮罩
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, G.W, G.H);
    // 结果框
    const boxW = Math.min(340 * s, G.W - 40 * s);
    const boxH = 360 * s;
    const boxX = G.W / 2 - boxW / 2;
    const boxY = G.H * 0.15;
    // 背景
    const grad = ctx.createLinearGradient(boxX, boxY, boxX, boxY + boxH);
    grad.addColorStop(0, 'rgba(30,40,80,0.95)');
    grad.addColorStop(1, 'rgba(15,20,50,0.95)');
    ctx.fillStyle = grad;
    roundRect(ctx, boxX, boxY, boxW, boxH, 20 * s);
    ctx.fill();
    ctx.strokeStyle = 'rgba(100,180,255,0.3)';
    ctx.lineWidth = 2 * s;
    roundRect(ctx, boxX, boxY, boxW, boxH, 20 * s);
    ctx.stroke();
    // 标题
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${32 * s}px 'Microsoft YaHei', sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('游戏结束', G.W / 2, boxY + 50 * s);
    // 分数动画
    const displayScore = Math.min(G.score, Math.floor(G.resultAnim * 200));
    ctx.fillStyle = '#ffdd44';
    ctx.font = `bold ${48 * s}px 'Microsoft YaHei', sans-serif`;
    ctx.fillText(displayScore + ' 分', G.W / 2, boxY + 110 * s);
    // 新纪录
    if (G.score >= G.highScore && G.score > 0) {
        ctx.fillStyle = '#ff66aa';
        ctx.font = `bold ${18 * s}px 'Microsoft YaHei', sans-serif`;
        ctx.fillText('新纪录!', G.W / 2, boxY + 145 * s);
    }
    // 统计
    ctx.fillStyle = '#88ccff';
    ctx.font = `${16 * s}px 'Microsoft YaHei', sans-serif`;
    const stats = [
        `正确: ${G.correctCount}/${G.questions.length}`,
        `最高连击: ${G.maxCombo}`,
        `最高分: ${G.highScore}`
    ];
    stats.forEach((txt, i) => {
        ctx.fillText(txt, G.W / 2, boxY + 190 * s + i * 30 * s);
    });
    // 重新开始按钮
    const btnW = 180 * s, btnH = 50 * s;
    const btnX = G.W / 2 - btnW / 2;
    const btnY = boxY + boxH - 80 * s;
    G._restartBtn = { x: btnX, y: btnY, w: btnW, h: btnH };
    drawButton(btnX, btnY, btnW, btnH, '再来一次', G.btnHover === 1, '#4a90d9', '#3a70b9');
}

/* ===== 主循环 ===== */
let lastTime = 0;
function gameLoop(now) {
    if (!lastTime) lastTime = now;
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;
    const ctx = G.ctx;
    if (G.W < 10 || G.H < 10) { requestAnimationFrame(gameLoop); return; }
    // 清屏
    ctx.clearRect(0, 0, G.W, G.H);
    drawBg();
    // 状态更新
    switch (G.state) {
        case STATE.MENU: drawMenu(dt); break;
        case STATE.PLAYING: drawPlaying(dt); break;
        case STATE.ANSWER_FEEDBACK:
            G.feedbackTimer -= dt;
            drawFeedback(dt);
            if (G.feedbackTimer <= 0) {
                G.feedbackTimer = 0;
                nextQuestion();
            }
            break;
        case STATE.RESULT: drawResult(dt); break;
    }
    // 粒子和浮动文字（始终更新绘制）
    G.particles = G.particles.filter(p => { p.update(dt); p.draw(ctx); return p.life > 0; });
    G.floatTexts = G.floatTexts.filter(f => { f.update(dt); f.draw(ctx); return f.life > 0; });
    requestAnimationFrame(gameLoop);
}

/* ===== 事件处理 ===== */
function getClickPos(e) {
    const rect = G.canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

function inRect(px, py, rect) {
    return rect && px >= rect.x && px <= rect.x + rect.w && py >= rect.y && py <= rect.y + rect.h;
}

function handleClick(e) {
    const pos = getClickPos(e);
    handleInteraction(pos.x, pos.y);
}

function handleMouseMove(e) {
    const pos = getClickPos(e);
    G.btnHover = -1;
    G.optionHover = -1;
    if (G.state === STATE.MENU && inRect(pos.x, pos.y, G._menuBtn)) G.btnHover = 0;
    if (G.state === STATE.RESULT && inRect(pos.x, pos.y, G._restartBtn)) G.btnHover = 1;
    if (G.state === STATE.PLAYING && G._optionBtns) {
        G._optionBtns.forEach((btn, i) => {
            if (inRect(pos.x, pos.y, btn)) G.optionHover = i;
        });
    }
}

function handleTouch(e) {
    e.preventDefault();
    const touch = e.touches[0];
    const rect = G.canvas.getBoundingClientRect();
    const x = touch.clientX - rect.left;
    const y = touch.clientY - rect.top;
    handleInteraction(x, y);
}

function handleInteraction(x, y) {
    if (G.state === STATE.MENU) {
        if (inRect(x, y, G._menuBtn)) {
            startGame();
            spawnParticles(G.W / 2, G.H * 0.55, '#4a90d9', 20);
        }
    } else if (G.state === STATE.PLAYING) {
        if (G._optionBtns) {
            G._optionBtns.forEach((btn, i) => {
                if (inRect(x, y, btn)) selectAnswer(i);
            });
        }
    } else if (G.state === STATE.RESULT) {
        if (inRect(x, y, G._restartBtn)) {
            startGame();
            spawnParticles(G.W / 2, G.H * 0.6, '#4a90d9', 20);
        }
    }
}

function handleKey(e) {
    if (G.state === STATE.PLAYING) {
        const key = parseInt(e.key);
        if (key >= 1 && key <= 4) selectAnswer(key - 1);
    } else if (G.state === STATE.MENU) {
        if (e.key === 'Enter' || e.key === ' ') startGame();
    } else if (G.state === STATE.RESULT) {
        if (e.key === 'Enter' || e.key === ' ') startGame();
    }
}

        // 音效支持
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq = 440, duration = 0.1) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }
