<body>
<canvas id="cv"></canvas>
<script>
// ========== 歇后语数据 ==========
const XHY_DATA = [

    {h:"飞蛾扑火", t:"自取灭亡"},
    {h:"百米赛跑", t:"分秒必争"},

    {h:"兔子尾巴", t:"长不了"},
    {h:"偷鸡不成", t:"蚀把米"},
    {h:"王小二过年", t:"一年不如一年"},
    {h:"老虎拉车", t:"谁敢（赶）"},
    {h:"铜钣上铆铜钣", t:"一是一，二是二"},
    {h:"铁打的公鸡", t:"一毛不拔"},
    {h:"三十六计", t:"走为上计"},
    {h:"塞翁失马", t:"焉知祸福"},
    {h:"墙上茅草", t:"随风两边倒"},

    {h:"泥牛入海", t:"无消息"},
    {h:"门缝里看人", t:"把人看扁了"},
    {h:"猫哭耗子", t:"假慈悲"},
    {h:"鲁班门前弄斧", t:"自不量力"},
    {h:"聋子耳朵", t:"摆设"},
    {h:"冷水烫猪", t:"不来气"},
    {h:"老鼠过街", t:"人人喊打"},
    {h:"老牛追兔子", t:"有劲使不上"},
    {h:"快刀斩乱麻", t:"干脆利落"},
    {h:"孔夫子搬家", t:"净是书（输）"},
    {h:"鸡蛋碰石头", t:"不自量力"},
    {h:"和尚训道士", t:"管得宽"},
    {h:"韩信点兵", t:"多多益善"},
    {h:"关公走麦城", t:"骄必败"},
    {h:"狗掀门帘", t:"全凭一张嘴"},
    {h:"擀面杖吹火", t:"一窍不通"},
    {h:"放风筝断了线", t:"没指望了"},
    {h:"顶风顶水划船", t:"硬撑"},
];

// ========== 游戏常量 ==========
const COLS = 6;
const ROWS = 5;
const CARD_GAP = 10;
const MATCH_DELAY = 600;
const FLIP_SPEED = 0.12;
const PARTICLE_COUNT = 20;
const COMBO_TIME = 3000;

// ========== Canvas 设置 ==========
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W, H, scale;
let cardW, cardH, gridX, gridY, gridW, gridH;
let btnW, btnH, btnX, btnY;

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width = W;
    cv.height = H;
    scale = Math.min(W / 420, H / 750);
    if (scale > 1.2) scale = 1.2;
    calcLayout();
}

function calcLayout() {
    const padX = 16 * scale;
    const padY = 12 * scale;
    const topBarH = 60 * scale;
    gridW = W - padX * 2;
    const totalGapX = CARD_GAP * (COLS - 1) * scale;
    cardW = (gridW - totalGapX) / COLS;
    const totalGapY = CARD_GAP * (ROWS - 1) * scale;
    const availH = H - topBarH - padY * 2 - 80 * scale;
    cardH = Math.min((availH - totalGapY) / ROWS, cardW * 1.4);
    cardH = Math.max(cardH, 50 * scale);
    gridH = cardH * ROWS + totalGapY;
    gridX = padX;
    gridY = topBarH + padY + (availH - gridH) / 2;
    // 按钮
    btnW = 180 * scale;
    btnH = 50 * scale;
    btnX = (W - btnW) / 2;
    btnY = gridY + gridH + 15 * scale;
}

window.addEventListener('resize', resize);
resize();

// ========== 游戏状态 ==========
const STATE_MENU = 0;
const STATE_PLAY = 1;
const STATE_OVER = 2;

let state = STATE_MENU;
let cards = [];
let firstCard = null;
let secondCard = null;
let canClick = true;
let score = 0;
let highScore = parseInt(localStorage.getItem('xhy_high') || '0');
let combo = 0;
let lastMatchTime = 0;
let matchCount = 0;
let totalPairs = 0;
let startTime = 0;
let elapsed = 0;
let timerInterval = null;
let particles = [];
let menuParticles = [];
let shakeTime = 0;
let comboPopups = [];
let menuAnim = 0;

// ========== 歇后语打乱选题 ==========
function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function pickPairs(n) {
    const pool = shuffleArray([...XHY_DATA]);
    return pool.slice(0, n);
}

// ========== 卡片对象 ==========
function createCard(text, pairId, isFront) {
    return {
        text: text,
        pairId: pairId,
        isFront: isFront, // true=前半句, false=后半句
        matched: false,
        flipping: false,
        flipProgress: 1, // 0=正面, 1=背面（初始背面朝上）
        flipTarget: 1,
        scale: 1,
        glow: 0,
        row: 0,
        col: 0,
        x: 0,
        y: 0,
    };
}

function initGame() {
    const numPairs = 15;
    totalPairs = numPairs;
    const pairs = pickPairs(numPairs);
    cards = [];
    pairs.forEach((p, idx) => {
        cards.push(createCard(p.h, idx, true));
        cards.push(createCard(p.t, idx, false));
    });
    shuffleArray(cards);
    // 排列位置
    for (let i = 0; i < cards.length; i++) {
        cards[i].row = Math.floor(i / COLS);
        cards[i].col = i % COLS;
    }
    firstCard = null;
    secondCard = null;
    canClick = true;
    score = 0;
    combo = 0;
    matchCount = 0;
    lastMatchTime = 0;
    particles = [];
    comboPopups = [];
    shakeTime = 0;
    startTime = Date.now();
    elapsed = 0;
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        if (state === STATE_PLAY) elapsed = Date.now() - startTime;
    }, 100);
    state = STATE_PLAY;
}

// ========== 粒子系统 ==========
function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.5 + Math.random() * 3;
        particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 1,
            life: 1,
            decay: 0.015 + Math.random() * 0.02,
            size: 2 + Math.random() * 4,
            color: color,
        });
    }
}

function spawnComboPopup(x, y, text, color) {
    comboPopups.push({
        x: x, y: y,
        text: text,
        color: color,
        life: 1,
        vy: -1.5,
    });
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.05;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = comboPopups.length - 1; i >= 0; i--) {
        const p = comboPopups[i];
        p.y += p.vy;
        p.life -= 0.018;
        if (p.life <= 0) comboPopups.splice(i, 1);
    }
}

function drawParticles() {
    particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * scale, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;
}

function drawComboPopups() {
    comboPopups.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.font = `bold ${22 * scale}px "Microsoft YaHei", sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText(p.text, p.x, p.y);
    });
    ctx.globalAlpha = 1;
}

// ========== 菜单粒子 ==========
function initMenuParticles() {
    menuParticles = [];
    for (let i = 0; i < 40; i++) {
        menuParticles.push({
            x: Math.random() * W,
            y: Math.random() * H,
            vx: (Math.random() - 0.5) * 0.5,
            vy: (Math.random() - 0.5) * 0.5,
            size: 1 + Math.random() * 3,
            alpha: 0.3 + Math.random() * 0.5,
        });
    }
}
initMenuParticles();

function updateMenuParticles() {
    menuParticles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0) p.x = W;
        if (p.x > W) p.x = 0;
        if (p.y < 0) p.y = H;
        if (p.y > H) p.y = 0;
    });
}

function drawMenuParticles() {
    menuParticles.forEach(p => {
        ctx.globalAlpha = p.alpha * (0.5 + 0.5 * Math.sin(Date.now() * 0.002 + p.x));
        ctx.fillStyle = '#ffcc00';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * scale, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;
}

// ========== 绘制渐变背景 ==========
function drawBg() {
    const grd = ctx.createLinearGradient(0, 0, 0, H);
    grd.addColorStop(0, '#0d0d2b');
    grd.addColorStop(0.5, '#1a1a4e');
    grd.addColorStop(1, '#2d1b69');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, H);
}

// ========== 绘制卡片 ==========
function getCardPos(card) {
    const totalGapX = CARD_GAP * (COLS - 1) * scale;
    const totalGapY = CARD_GAP * (ROWS - 1) * scale;
    const cw = (gridW - totalGapX) / COLS;
    const ch = cardH;
    const x = gridX + card.col * (cw + CARD_GAP * scale);
    const y = gridY + card.row * (ch + CARD_GAP * scale);
    return { x, y, w: cw, h: ch };
}

function drawCard(card) {
    const pos = getCardPos(card);
    const cx = pos.x + pos.w / 2;
    const cy = pos.y + pos.h / 2;
    const fp = card.flipProgress;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(card.scale, card.scale);

    // 翻转效果：水平缩放
    const scaleX = Math.abs(Math.cos(fp * Math.PI));
    ctx.scale(scaleX || 0.01, 1);

    const hw = pos.w / 2;
    const hh = pos.h / 2;
    const r = 8 * scale;

    if (card.matched) {
        // 已匹配 - 发光卡片
        ctx.globalAlpha = 0.7 + 0.3 * Math.sin(Date.now() * 0.003);
        drawRoundRect(ctx, -hw, -hh, pos.w, pos.h, r);
        const grd = ctx.createLinearGradient(-hw, -hh, hw, hh);
        grd.addColorStop(0, card.isFront ? '#1b5e20' : '#0d47a1');
        grd.addColorStop(1, card.isFront ? '#2e7d32' : '#1565c0');
        ctx.fillStyle = grd;
        ctx.fill();
        ctx.strokeStyle = card.isFront ? '#4caf50' : '#42a5f5';
        ctx.lineWidth = 2 * scale;
        ctx.stroke();
        ctx.globalAlpha = 1;
    } else if (fp < 0.5) {
        // 正面 - 显示文字
        drawRoundRect(ctx, -hw, -hh, pos.w, pos.h, r);
        const grd = ctx.createLinearGradient(-hw, -hh, hw, hh);
        grd.addColorStop(0, card.isFront ? '#ff6f00' : '#6a1b9a');
        grd.addColorStop(1, card.isFront ? '#ff8f00' : '#8e24aa');
        ctx.fillStyle = grd;
        ctx.fill();
        ctx.strokeStyle = card.isFront ? '#ffab40' : '#ce93d8';
        ctx.lineWidth = 2 * scale;
        ctx.stroke();

        // 闪烁光晕
        if (card.glow > 0) {
            ctx.globalAlpha = card.glow * 0.3;
            ctx.shadowColor = card.isFront ? '#ffab40' : '#ce93d8';
            ctx.shadowBlur = 15 * scale;
            drawRoundRect(ctx, -hw, -hh, pos.w, pos.h, r);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1;
        }

        // 文字
        const fontSize = Math.min(pos.w / (card.text.length * 0.6), pos.h * 0.35, 18 * scale);
        ctx.font = `bold ${fontSize}px "Microsoft YaHei", sans-serif`;
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        wrapText(ctx, card.text, 0, 0, pos.w - 12 * scale, fontSize * 1.3);
    } else {
        // 背面
        drawRoundRect(ctx, -hw, -hh, pos.w, pos.h, r);
        const grd = ctx.createLinearGradient(-hw, -hh, hw, hh);
        grd.addColorStop(0, '#283593');
        grd.addColorStop(1, '#3949ab');
        ctx.fillStyle = grd;
        ctx.fill();
        ctx.strokeStyle = '#5c6bc0';
        ctx.lineWidth = 2 * scale;
        ctx.stroke();

        // 背面图案
        ctx.font = `${Math.min(pos.w, pos.h) * 0.4}px sans-serif`;
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('?', 0, 0);
    }

    ctx.restore();
}

function drawRoundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
    const lines = [];
    let line = '';
    for (let i = 0; i < text.length; i++) {
        const testLine = line + text[i];
        const metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && line !== '') {
            lines.push(line);
            line = text[i];
        } else {
            line = testLine;
        }
    }
    lines.push(line);
    const startY = y - (lines.length - 1) * lineHeight / 2;
    lines.forEach((l, i) => {
        ctx.fillText(l, x, startY + i * lineHeight);
    });
}

// ========== 绘制顶部信息栏 ==========
function drawTopBar() {
    const barH = 55 * scale;
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(0, 0, W, barH);

    const fontSize = 16 * scale;
    ctx.font = `bold ${fontSize}px "Microsoft YaHei", sans-serif`;
    ctx.textBaseline = 'middle';
    const cy = barH / 2;

    // 分数
    ctx.textAlign = 'left';
    ctx.fillStyle = '#ffcc00';
    ctx.fillText(`分数: ${score}`, 12 * scale, cy);

    // 连击
    if (combo > 1) {
        ctx.fillStyle = '#ff5722';
        ctx.fillText(`连击 x${combo}`, 120 * scale, cy);
    }

    // 时间
    ctx.textAlign = 'center';
    ctx.fillStyle = '#e0e0e0';
    const sec = Math.floor(elapsed / 1000);
    const min = Math.floor(sec / 60);
    const s = sec % 60;
    ctx.fillText(`${String(min).padStart(2,'0')}:${String(s).padStart(2,'0')}`, W / 2, cy);

    // 匹配进度
    ctx.textAlign = 'right';
    ctx.fillStyle = '#4caf50';
    ctx.fillText(`${matchCount}/${totalPairs}`, W - 12 * scale, cy);
}

// ========== 绘制菜单 ==========
function drawMenu() {
    drawBg();
    updateMenuParticles();
    drawMenuParticles();

    menuAnim += 0.02;

    // 标题
    const titleSize = 42 * scale;
    ctx.font = `bold ${titleSize}px "Microsoft YaHei", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const titleY = H * 0.22;

    // 标题光晕
    ctx.shadowColor = '#ffcc00';
    ctx.shadowBlur = 20 * scale;
    ctx.fillStyle = '#ffcc00';
    ctx.fillText('歇后语配对', W / 2, titleY);
    ctx.shadowBlur = 0;

    // 副标题
    ctx.font = `${18 * scale}px "Microsoft YaHei", sans-serif`;
    ctx.fillStyle = '#b0bec5';
    ctx.fillText('前后半句配对消除 · 50+经典歇后语', W / 2, titleY + 40 * scale);

    // 玩法说明
    const infoY = H * 0.42;
    ctx.font = `${14 * scale}px "Microsoft YaHei", sans-serif`;
    ctx.fillStyle = '#90a4ae';
    ctx.fillText('翻开卡片，找到歇后语的前后半句配对', W / 2, infoY);
    ctx.fillText('连续配对成功获得连击加分！', W / 2, infoY + 24 * scale);

    // 开始按钮
    const pulse = 1 + 0.03 * Math.sin(menuAnim * 3);
    const bw = 200 * scale * pulse;
    const bh = 55 * scale * pulse;
    const bx = (W - bw) / 2;
    const by = H * 0.62;
    drawRoundRect(ctx, bx, by, bw, bh, 12 * scale);
    const grd = ctx.createLinearGradient(bx, by, bx, by + bh);
    grd.addColorStop(0, '#ff6f00');
    grd.addColorStop(1, '#e65100');
    ctx.fillStyle = grd;
    ctx.fill();
    ctx.strokeStyle = '#ffab40';
    ctx.lineWidth = 2 * scale;
    ctx.stroke();

    ctx.font = `bold ${22 * scale}px "Microsoft YaHei", sans-serif`;
    ctx.fillStyle = '#fff';
    ctx.fillText('开始游戏', W / 2, by + bh / 2);

    // 最高分
    if (highScore > 0) {
        ctx.font = `${16 * scale}px "Microsoft YaHei", sans-serif`;
        ctx.fillStyle = '#ffcc00';
        ctx.fillText(`最高分: ${highScore}`, W / 2, by + bh + 35 * scale);
    }

    // 底部装饰
    ctx.font = `${12 * scale}px "Microsoft YaHei", sans-serif`;
    ctx.fillStyle = '#546e7a';
    ctx.fillText('键盘/鼠标/触屏均可操作', W / 2, H - 30 * scale);

    // 按钮位置记录（用于点击检测）
    btnX = bx;
    btnY = by;
    btnW = bw;
    btnH = bh;
}

// ========== 绘制游戏结束 ==========
function drawGameOver() {
    drawBg();

    const isWin = matchCount >= totalPairs;
    const titleText = isWin ? '恭喜通关！' : '游戏结束';
    const titleColor = isWin ? '#4caf50' : '#f44336';

    // 标题
    ctx.shadowColor = titleColor;
    ctx.shadowBlur = 20 * scale;
    ctx.font = `bold ${36 * scale}px "Microsoft YaHei", sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillStyle = titleColor;
    ctx.fillText(titleText, W / 2, H * 0.2);
    ctx.shadowBlur = 0;

    // 统计信息
    ctx.font = `${18 * scale}px "Microsoft YaHei", sans-serif`;
    ctx.fillStyle = '#e0e0e0';
    const sec = Math.floor(elapsed / 1000);
    const min = Math.floor(sec / 60);
    const s = sec % 60;
    ctx.fillText(`用时: ${String(min).padStart(2,'0')}:${String(s).padStart(2,'0')}`, W / 2, H * 0.32);
    ctx.fillText(`配对: ${matchCount}/${totalPairs}`, W / 2, H * 0.38);
    ctx.fillText(`分数: ${score}`, W / 2, H * 0.44);

    if (score >= highScore && score > 0) {
        ctx.fillStyle = '#ffcc00';
        ctx.font = `bold ${20 * scale}px "Microsoft YaHei", sans-serif`;
        ctx.fillText('新纪录！', W / 2, H * 0.52);
    }

    // 重新开始按钮
    const bw = 200 * scale;
    const bh = 50 * scale;
    const bx = (W - bw) / 2;
    const by = H * 0.62;
    drawRoundRect(ctx, bx, by, bw, bh, 12 * scale);
    const grd = ctx.createLinearGradient(bx, by, bx, by + bh);
    grd.addColorStop(0, '#ff6f00');
    grd.addColorStop(1, '#e65100');
    ctx.fillStyle = grd;
    ctx.fill();
    ctx.strokeStyle = '#ffab40';
    ctx.lineWidth = 2 * scale;
    ctx.stroke();

    ctx.font = `bold ${20 * scale}px "Microsoft YaHei", sans-serif`;
    ctx.fillStyle = '#fff';
    ctx.fillText('再来一局', W / 2, by + bh / 2);

    // 返回菜单按钮
    const bw2 = 160 * scale;
    const bx2 = (W - bw2) / 2;
    const by2 = by + bh + 20 * scale;
    drawRoundRect(ctx, bx2, by2, bw2, bh, 12 * scale);
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.fill();
    ctx.strokeStyle = '#78909c';
    ctx.lineWidth = 1.5 * scale;
    ctx.stroke();

    ctx.font = `${18 * scale}px "Microsoft YaHei", sans-serif`;
    ctx.fillStyle = '#b0bec5';
    ctx.fillText('返回菜单', W / 2, by2 + bh / 2);

    btnX = bx; btnY = by; btnW = bw; btnH = bh;
    // 记录第二个按钮
    window._btn2 = { x: bx2, y: by2, w: bw2, h: bh };
}

// ========== 主渲染 ==========
function render() {
    ctx.clearRect(0, 0, W, H);

    if (state === STATE_MENU) {
        drawMenu();
        return;
    }

    drawBg();
    drawTopBar();

    // 震动效果
    if (shakeTime > 0) {
        ctx.save();
        const sx = (Math.random() - 0.5) * 4 * scale;
        const sy = (Math.random() - 0.5) * 4 * scale;
        ctx.translate(sx, sy);
    }

    cards.forEach(c => drawCard(c));

    if (shakeTime > 0) {
        ctx.restore();
        shakeTime -= 16;
    }

    drawParticles();
    drawComboPopups();

    if (state === STATE_OVER) {
        drawGameOver();
    }
}

// ========== 更新逻辑 ==========
function update() {
    updateParticles();

    cards.forEach(c => {
        // 翻转动画
        if (c.flipping) {
            const diff = c.flipTarget - c.flipProgress;
            if (Math.abs(diff) < 0.01) {
                c.flipProgress = c.flipTarget;
                c.flipping = false;
            } else {
                c.flipProgress += diff * 0.25;
            }
        }
        // 发光衰减
        if (c.glow > 0) c.glow -= 0.02;
        // 缩放恢复
        if (c.scale > 1) c.scale -= 0.02;
        if (c.scale < 1) c.scale = 1;
    });

    // 连击超时
    if (combo > 0 && Date.now() - lastMatchTime > COMBO_TIME) {
        combo = 0;
    }
}

// ========== 游戏循环 ==========
function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
}

// ========== 点击处理 ==========
function handleClick(x, y) {
    if (state === STATE_MENU) {
        if (x >= btnX && x <= btnX + btnW && y >= btnY && y <= btnY + btnH) {
            initGame();
        }
        return;
    }

    if (state === STATE_OVER) {
        if (x >= btnX && x <= btnX + btnW && y >= btnY && y <= btnY + btnH) {
            initGame();
        }
        if (window._btn2) {
            const b = window._btn2;
            if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
                state = STATE_MENU;
                initMenuParticles();
            }
        }
        return;
    }

    if (state !== STATE_PLAY || !canClick) return;

    // 检查卡片点击
    for (let i = 0; i < cards.length; i++) {
        const c = cards[i];
        if (c.matched) continue;
        if (c.flipProgress < 0.5) continue; // 已经是正面
        const pos = getCardPos(c);
        if (x >= pos.x && x <= pos.x + pos.w && y >= pos.y && y <= pos.y + pos.h) {
            flipCard(c);
            break;
        }
    }
}

function flipCard(card) {
    if (card.flipping) return;
    card.flipping = true;
    card.flipTarget = 0; // 翻到正面
    card.scale = 1.1;

    if (!firstCard) {
        firstCard = card;
    } else if (!secondCard && card !== firstCard) {
        secondCard = card;
        canClick = false;
        setTimeout(checkMatch, MATCH_DELAY);
    }
}

function checkMatch() {
    if (!firstCard || !secondCard) {
        canClick = true;
        return;
    }

    if (firstCard.pairId === secondCard.pairId) {
        // 匹配成功
        firstCard.matched = true;
        secondCard.matched = true;
        firstCard.glow = 1;
        secondCard.glow = 1;
        matchCount++;

        // 连击
        const now = Date.now();
        if (now - lastMatchTime < COMBO_TIME) {
            combo++;
        } else {
            combo = 1;
        }
        lastMatchTime = now;

        // 计分
        const baseScore = 100;
        const comboBonus = combo > 1 ? (combo - 1) * 50 : 0;
        score += baseScore + comboBonus;

        // 粒子效果
        const pos1 = getCardPos(firstCard);
        const pos2 = getCardPos(secondCard);
        const colors = ['#ffcc00', '#ff9800', '#4caf50', '#2196f3'];
        spawnParticles(pos1.x + pos1.w/2, pos1.y + pos1.h/2, colors[Math.floor(Math.random()*colors.length)], PARTICLE_COUNT);
        spawnParticles(pos2.x + pos2.w/2, pos2.y + pos2.h/2, colors[Math.floor(Math.random()*colors.length)], PARTICLE_COUNT);

        // 连击提示
        if (combo > 1) {
            const mx = (pos1.x + pos2.x) / 2 + pos1.w / 2;
            const my = (pos1.y + pos2.y) / 2;
            spawnComboPopup(mx, my, `连击 x${combo}! +${comboBonus}`, '#ff5722');
        }

        // 检查胜利
        if (matchCount >= totalPairs) {
            setTimeout(() => {
                state = STATE_OVER;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('xhy_high', String(highScore));
                }
                if (timerInterval) clearInterval(timerInterval);
            }, 800);
        }
    } else {
        // 不匹配，翻回去
        firstCard.flipping = true;
        firstCard.flipTarget = 1;
        secondCard.flipping = true;
        secondCard.flipTarget = 1;
        shakeTime = 200;
        combo = 0;
    }

    firstCard = null;
    secondCard = null;
    canClick = true;
}

// ========== 事件绑定 ==========
function getPos(e) {
    const rect = cv.getBoundingClientRect();
    if (e.touches) {
        return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
    }
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

let lastTouchTime = 0;
cv.addEventListener('click', (e) => {
    // 防止移动端touchstart后重复触发click
    if (Date.now() - lastTouchTime < 300) return;
    const p = getPos(e);
    handleClick(p.x, p.y);
});

cv.addEventListener('touchstart', (e) => {
    e.preventDefault();
    lastTouchTime = Date.now();
    const p = getPos(e);
    handleClick(p.x, p.y);
}, { passive: false });

// 键盘支持 - 用数字键选卡
cv.addEventListener('keydown', (e) => {
    if (state === STATE_MENU) {
        if (e.key === 'Enter' || e.key === ' ') {
            initGame();
        }
        return;
    }
    if (state === STATE_OVER) {
        if (e.key === 'Enter' || e.key === ' ') {
            initGame();
        }
        if (e.key === 'Escape') {
            state = STATE_MENU;
            initMenuParticles();
        }
        return;
    }
    if (state !== STATE_PLAY || !canClick) return;

    // 空格键暂停/继续（简单实现：暂停点击）
    if (e.key === 'Escape') {
        state = STATE_MENU;
        if (timerInterval) clearInterval(timerInterval);
        initMenuParticles();
    }
});

// ========== 启动 ==========
gameLoop();
