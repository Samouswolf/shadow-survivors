<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>拼单词</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1a2e;font-family:'Microsoft YaHei',sans-serif}
canvas{display:block;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
</style>
<style>/* 游戏工坊广告系统 */
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);height:90px;max-height:90px;overflow:hidden;contain:layout style paint;pointer-events:none!important}.ad-banner-container,.ad-banner-container *{pointer-events:none!important}.ad-banner-container iframe{max-height:90px;pointer-events:none!important}
.ad-banner-container iframe{max-width:100%}
.ad-label{position:absolute;top:1px;right:6px;font:9px "Microsoft YaHei",sans-serif;color:rgba(255,255,255,.35)}
.sponsor-btn{position:fixed;top:44px;right:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:3px 9px;border-radius:10px;font:11px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .qr-row{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.sponsor-panel .qr-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px;text-align:center;min-width:140px}
.sponsor-panel .qr-card .qr-icon{font-size:48px;margin-bottom:6px}
.sponsor-panel .qr-card .qr-label{color:#ccc;font:13px "Microsoft YaHei",sans-serif}
.sponsor-panel .qr-card .qr-hint{color:#888;font:11px "Microsoft YaHei",sans-serif;margin-top:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.interstitial-ad .ad-content{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;text-align:center;min-width:280px;max-width:400px}
.interstitial-ad .ad-content p{color:#aaa;font:14px "Microsoft YaHei",sans-serif;margin-bottom:12px}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
</style>
</head>
<body>
<canvas id="C"></canvas>
<button class="sponsor-btn" onclick="toggleSponsor()">☕</button>
<div class="sponsor-panel" id="sponsorPanel">
<h2>支持开发者</h2>
<div class="qr-row">
<div class="qr-card"><div class="qr-icon">💚</div><div class="qr-label">微信赞赏</div><div class="qr-hint">扫码支持</div></div>
<div class="qr-card"><div class="qr-icon">💙</div><div class="qr-label">支付宝</div><div class="qr-hint">扫码支持</div></div>
</div>
<button class="sponsor-close" onclick="toggleSponsor()">关闭</button>
</div>
<div class="interstitial-ad" id="interstitialAd">
<div class="ad-content"><p>感谢游玩！</p><button class="skip-btn" onclick="closeInterstitial()">继续</button></div>
</div>
<div class="ad-banner-container"><span class="ad-label">AD</span></div>
<script>
// ============================================================
// 拼单词 - 英文单词拼写游戏
// ============================================================

var canvas = document.getElementById('C');
var ctx = canvas.getContext('2d');
var W = 600, H = 600;
var SCALE = 1;

function resize() {
    var maxW = window.innerWidth - 20;
    var maxH = window.innerHeight - 110;
    SCALE = Math.min(maxW / W, maxH / H);
    canvas.width = W * SCALE;
    canvas.height = H * SCALE;
    canvas.style.width = (W * SCALE) + 'px';
    canvas.style.height = (H * SCALE) + 'px';
    ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ============================================================
// 游戏配置
// ============================================================
var WORDS = [
    {word: 'HELLO', hint: '问候语'},
    {word: 'WORLD', hint: '地球'},
    {word: 'GAME', hint: '游戏'},
    {word: 'PLAY', hint: '玩耍'},
    {word: 'LOVE', hint: '爱'},
    {word: 'HAPPY', hint: '快乐'},
    {word: 'SMILE', hint: '微笑'},
    {word: 'SUN', hint: '太阳'},
    {word: 'MOON', hint: '月亮'},
    {word: 'STAR', hint: '星星'},
    {word: 'TREE', hint: '树'},
    {word: 'FLOWER', hint: '花'},
    {word: 'WATER', hint: '水'},
    {word: 'FIRE', hint: '火'},
    {word: 'BOOK', hint: '书'},
    {word: 'APPLE', hint: '苹果'},
    {word: 'BANANA', hint: '香蕉'},
    {word: 'CAT', hint: '猫'},
    {word: 'DOG', hint: '狗'},
    {word: 'FISH', hint: '鱼'}
];

var LETTER_SIZE = 50;
var COL = {
    bg: '#1a1a2e',
    letterBg: '#34495e',
    letterActive: '#3498db',
    letterCorrect: '#2ecc71',
    letterWrong: '#e74c3c',
    text: '#fff',
    score: '#f1c40f',
    hint: '#aaa'
};

// ============================================================
// 游戏状态
// ============================================================
var G = {
    state: 'menu', // menu, playing, success, fail
    currentWord: null,
    hint: '',
    letters: [],
    userInput: [],
    revealedLetters: [],
    score: 0,
    level: 1,
    timer: 0,
    maxTime: 60,
    wrongAttempts: 0,
    maxWrong: 3,
    particles: [],
    highScore: 0
};

// ============================================================
// 音效系统
// ============================================================
var audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playTone(freq, dur, vol, type) {
    if (!audioCtx) return;
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = type || 'square';
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.15, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
}
function sfxLetter() { playTone(400, 0.08, 0.1, 'triangle'); }
function sfxCorrect() { playTone(600, 0.15, 0.15, 'sine'); playTone(800, 0.1, 0.1, 'sine'); }
function sfxWrong() { playTone(200, 0.15, 0.12, 'sawtooth'); }
function sfxSuccess() {
    [0,100,200,300].forEach(function(d,i) {
        setTimeout(function() { playTone(440 + i * 110, 0.2, 0.15, 'sine'); }, d);
    });
}

// ============================================================
// 输入处理
// ============================================================
document.addEventListener('keydown', function(e) {
    if (G.state === 'playing') {
        var key = e.key.toUpperCase();
        if (key >= 'A' && key <= 'Z') {
            handleLetter(key);
        } else if (e.key === 'Backspace') {
            removeLastLetter();
        } else if (e.key === 'Enter') {
            checkWord();
        }
    }
});

canvas.addEventListener('click', function(e) {
    initAudio();
    var rect = canvas.getBoundingClientRect();
    var x = (e.clientX - rect.left) / SCALE;
    var y = (e.clientY - rect.top) / SCALE;
    
    if (G.state === 'menu') {
        if (x > W/2 - 80 && x < W/2 + 80 && y > H/2 + 50 && y < H/2 + 90) {
            startGame();
        }
    } else if (G.state === 'playing') {
        handleLetterClick(x, y);
    } else if (G.state === 'success' || G.state === 'fail') {
        if (x > W/2 - 80 && x < W/2 + 80 && y > H/2 + 50 && y < H/2 + 90) {
            nextWord();
        }
    }
});

function startGame() {
    G.state = 'playing';
    G.score = 0;
    G.level = 1;
    G.timer = G.maxTime;
    G.wrongAttempts = 0;
    G.highScore = 0;
    
    selectWord();
}

function selectWord() {
    var idx = Math.floor(Math.random() * WORDS.length);
    G.currentWord = WORDS[idx].word;
    G.hint = WORDS[idx].hint;
    
    // 创建字母数组
    G.letters = [];
    for (var i = 0; i < G.currentWord.length; i++) {
        G.letters.push({
            char: G.currentWord[i],
            revealed: false,
            x: 0,
            y: 0,
            active: false
        });
    }
    
    // 随机揭示一些字母
    var revealCount = Math.floor(G.currentWord.length * 0.3);
    var revealed = [];
    while (revealed.length < revealCount) {
        var pos = Math.floor(Math.random() * G.currentWord.length);
        if (revealed.indexOf(pos) === -1) {
            revealed.push(pos);
            G.letters[pos].revealed = true;
        }
    }
    
    G.userInput = [];
    G.revealedLetters = revealed;
    
    // 计算字母位置
    var startX = (W - G.currentWord.length * LETTER_SIZE) / 2;
    for (var i = 0; i < G.letters.length; i++) {
        G.letters[i].x = startX + i * LETTER_SIZE;
        G.letters[i].y = 200;
    }
}

function handleLetter(char) {
    // 检查字母是否在单词中且未揭示
    var found = false;
    for (var i = 0; i < G.letters.length; i++) {
        if (G.letters[i].char === char && !G.letters[i].revealed) {
            G.letters[i].revealed = true;
            G.letters[i].active = true;
            G.userInput.push({char: char, pos: i});
            found = true;
            sfxLetter();
            
            // 添加粒子
            spawnParticles(G.letters[i].x + LETTER_SIZE/2, G.letters[i].y + LETTER_SIZE/2, COL.letterCorrect);
            break;
        }
    }
    
    if (!found) {
        G.wrongAttempts++;
        sfxWrong();
        spawnParticles(W/2, 300, COL.letterWrong);
        
        if (G.wrongAttempts >= G.maxWrong) {
            G.state = 'fail';
            if (G.score > G.highScore) G.highScore = G.score;
            showInterstitial();
        }
    }
    
    // 检查是否完成
    checkComplete();
}

function handleLetterClick(x, y) {
    // 点击字母区域（键盘布局）
    var keyboardY = 400;
    var keySize = 40;
    var keysPerRow = 10;
    var rows = 3;
    
    for (var row = 0; row < rows; row++) {
        var rowLetters = 'QWERTYUIOPASDFGHJKLZXCVBNM'.slice(row * keysPerRow, (row + 1) * keysPerRow);
        var rowX = (W - rowLetters.length * keySize) / 2;
        var rowY = keyboardY + row * (keySize + 5);
        
        for (var i = 0; i < rowLetters.length; i++) {
            var keyX = rowX + i * keySize;
            if (x >= keyX && x <= keyX + keySize && y >= rowY && y <= rowY + keySize) {
                handleLetter(rowLetters[i]);
                return;
            }
        }
    }
    
    // 点击提示按钮
    if (x > W - 100 && x < W - 20 && y > 20 && y < 50) {
        revealHint();
    }
}

function revealHint() {
    // 揭示一个未揭示的字母
    for (var i = 0; i < G.letters.length; i++) {
        if (!G.letters[i].revealed) {
            G.letters[i].revealed = true;
            G.score -= 5; // 提示扣分
            sfxLetter();
            return;
        }
    }
}

function removeLastLetter() {
    if (G.userInput.length > 0) {
        var last = G.userInput.pop();
        G.letters[last.pos].revealed = false;
        G.letters[last.pos].active = false;
        sfxLetter();
    }
}

function checkComplete() {
    var complete = true;
    for (var i = 0; i < G.letters.length; i++) {
        if (!G.letters[i].revealed) {
            complete = false;
            break;
        }
    }
    
    if (complete) {
        G.state = 'success';
        G.score += G.currentWord.length * 10;
        G.level++;
        sfxSuccess();
        if (G.score > G.highScore) G.highScore = G.score;
        showInterstitial();
    }
}

function nextWord() {
    G.state = 'playing';
    G.wrongAttempts = 0;
    G.timer = G.maxTime;
    selectWord();
}

function spawnParticles(x, y, color) {
    for (var i = 0; i < 10; i++) {
        var angle = Math.random() * Math.PI * 2;
        var speed = 2 + Math.random() * 3;
        G.particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            color: color,
            life: 30
        });
    }
}

// ============================================================
// 广告系统
// ============================================================
function toggleSponsor() {
    var panel = document.getElementById('sponsorPanel');
    panel.style.display = panel.style.display === 'flex' ? 'none' : 'flex';
    panel.style.pointerEvents = panel.style.display === 'flex' ? 'auto' : 'none';
}

function showInterstitial() {
    var ad = document.getElementById('interstitialAd');
    ad.style.display = 'flex';
    ad.style.pointerEvents = 'auto';
}

function closeInterstitial() {
    var ad = document.getElementById('interstitialAd');
    ad.style.display = 'none';
    ad.style.pointerEvents = 'none';
}

// ============================================================
// 游戏逻辑
// ============================================================
function update() {
    // 更新计时器
    if (G.state === 'playing') {
        G.timer -= 1/60;
        if (G.timer <= 0) {
            G.state = 'fail';
            if (G.score > G.highScore) G.highScore = G.score;
            showInterstitial();
        }
    }
    
    // 更新粒子
    for (var i = G.particles.length - 1; i >= 0; i--) {
        var p = G.particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.1;
        p.life--;
        if (p.life <= 0) G.particles.splice(i, 1);
    }
}

// ============================================================
// 渲染
// ============================================================
function draw() {
    ctx.fillStyle = COL.bg;
    ctx.fillRect(0, 0, W, H);
    
    update();
    
    if (G.state === 'menu') {
        drawMenu();
    } else if (G.state === 'success') {
        drawSuccess();
    } else if (G.state === 'fail') {
        drawFail();
    } else {
        drawGame();
    }
}

function drawMenu() {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 48px Microsoft YaHei';
    ctx.textAlign = 'center';
    ctx.fillText('拼单词', W/2, H/2 - 60);
    
    ctx.font = '20px Microsoft YaHei';
    ctx.fillStyle = '#aaa';
    ctx.fillText('英文单词拼写 · 提示字母', W/2, H/2);
    
    ctx.fillStyle = '#3498db';
    ctx.fillRect(W/2 - 80, H/2 + 50, 160, 40);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px Microsoft YaHei';
    ctx.fillText('开始游戏', W/2, H/2 + 75);
}

function drawSuccess() {
    drawGame();
    
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    
    ctx.fillStyle = '#2ecc71';
    ctx.font = 'bold 48px Microsoft YaHei';
    ctx.textAlign = 'center';
    ctx.fillText('正确!', W/2, H/2 - 40);
    
    ctx.font = '24px Microsoft YaHei';
    ctx.fillStyle = COL.score;
    ctx.fillText('得分: ' + G.score, W/2, H/2);
    
    ctx.fillStyle = '#3498db';
    ctx.fillRect(W/2 - 80, H/2 + 50, 160, 40);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px Microsoft YaHei';
    ctx.fillText('下一个单词', W/2, H/2 + 75);
}

function drawFail() {
    drawGame();
    
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    
    ctx.fillStyle = '#e74c3c';
    ctx.font = 'bold 48px Microsoft YaHei';
    ctx.textAlign = 'center';
    ctx.fillText('失败!', W/2, H/2 - 40);
    
    ctx.font = '24px Microsoft YaHei';
    ctx.fillStyle = '#fff';
    ctx.fillText('正确答案: ' + G.currentWord, W/2, H/2);
    
    ctx.fillStyle = COL.score;
    ctx.fillText('得分: ' + G.score, W/2, H/2 + 30);
    
    ctx.fillStyle = '#3498db';
    ctx.fillRect(W/2 - 80, H/2 + 50, 160, 40);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px Microsoft YaHei';
    ctx.fillText('继续', W/2, H/2 + 75);
}

function drawGame() {
    // 绘制提示
    ctx.fillStyle = COL.hint;
    ctx.font = '18px Microsoft YaHei';
    ctx.textAlign = 'center';
    ctx.fillText('提示: ' + G.hint, W/2, 100);
    
    // 绘制单词格子
    for (var i = 0; i < G.letters.length; i++) {
        var letter = G.letters[i];
        var x = letter.x;
        var y = letter.y;
        
        // 格子背景
        if (letter.revealed) {
            ctx.fillStyle = letter.active ? COL.letterCorrect : COL.letterActive;
        } else {
            ctx.fillStyle = COL.letterBg;
        }
        ctx.fillRect(x, y, LETTER_SIZE, LETTER_SIZE);
        
        // 格子边框
        ctx.strokeStyle = '#7f8c8d';
        ctx.lineWidth = 2;
        ctx.strokeRect(x, y, LETTER_SIZE, LETTER_SIZE);
        
        // 字母
        if (letter.revealed) {
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 32px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(letter.char, x + LETTER_SIZE/2, y + LETTER_SIZE/2);
        } else {
            ctx.fillStyle = '#7f8c8d';
            ctx.font = '24px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('?', x + LETTER_SIZE/2, y + LETTER_SIZE/2);
        }
    }
    
    // 绘制粒子
    for (var i = 0; i < G.particles.length; i++) {
        var p = G.particles[i];
        ctx.globalAlpha = p.life / 30;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
    
    // 绘制键盘
    drawKeyboard();
    
    // 绘制UI
    ctx.fillStyle = COL.text;
    ctx.font = 'bold 20px Microsoft YaHei';
    ctx.textAlign = 'left';
    ctx.fillText('得分: ' + G.score, 20, 30);
    
    ctx.fillStyle = COL.score;
    ctx.textAlign = 'center';
    ctx.fillText('关卡: ' + G.level, W/2, 30);
    
    // 计时器
    var timeColor = G.timer < 10 ? '#e74c3c' : '#aaa';
    ctx.fillStyle = timeColor;
    ctx.textAlign = 'right';
    ctx.fillText('时间: ' + Math.ceil(G.timer) + '秒', W - 20, 30);
    
    // 错误次数
    ctx.fillStyle = G.wrongAttempts >= 2 ? '#e74c3c' : '#aaa';
    ctx.fillText('错误: ' + G.wrongAttempts + '/' + G.maxWrong, W - 20, 55);
    
    // 提示按钮
    ctx.fillStyle = '#34495e';
    ctx.fillRect(W - 100, 20, 80, 30);
    ctx.fillStyle = '#fff';
    ctx.font = '14px Microsoft YaHei';
    ctx.textAlign = 'center';
    ctx.fillText('提示(-5分)', W - 60, 40);
}

function drawKeyboard() {
    var keyboardY = 400;
    var keySize = 40;
    var rows = [
        'QWERTYUIOP',
        'ASDFGHJKL',
        'ZXCVBNM'
    ];
    
    for (var row = 0; row < rows.length; row++) {
        var rowLetters = rows[row];
        var rowX = (W - rowLetters.length * keySize) / 2;
        var rowY = keyboardY + row * (keySize + 5);
        
        for (var i = 0; i < rowLetters.length; i++) {
            var keyX = rowX + i * keySize;
            var char = rowLetters[i];
            
            // 检查字母是否在单词中
            var inWord = false;
            var revealed = false;
            for (var j = 0; j < G.letters.length; j++) {
                if (G.letters[j].char === char) {
                    inWord = true;
                    revealed = G.letters[j].revealed;
                    break;
                }
            }
            
            // 键背景
            if (revealed) {
                ctx.fillStyle = COL.letterCorrect;
            } else if (inWord) {
                ctx.fillStyle = COL.letterActive;
            } else {
                ctx.fillStyle = COL.letterBg;
            }
            ctx.fillRect(keyX, rowY, keySize, keySize);
            
            // 键边框
            ctx.strokeStyle = '#7f8c8d';
            ctx.lineWidth = 1;
            ctx.strokeRect(keyX, rowY, keySize, keySize);
            
            // 字母
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 20px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(char, keyX + keySize/2, rowY + keySize/2);
        }
    }
}

// ============================================================
// 游戏循环
// ============================================================
function gameLoop() {
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
