const CONFIG = {
    partSize: 55,
    timeLimit: 90,
    scorePerChar: 100,
    comboBonus: 50,
    levelsPerRound: 15,
};

let gameState = STATE.MENU;
let score = 0;
let highScore = parseInt(localStorage.getItem('hanzi_highScore')) || 0;
let currentLevel = 0;
let combo = 0;
let timeLeft = CONFIG.timeLimit;
let lastTime = 0;

let currentHanzi = null;
let targetChar = '';
let availableParts = [];
let selectedParts = [];
let partPositions = [];
let dragging = null;
let dragOffset = { x: 0, y: 0 };

let particles = [];
let shakeTimer = 0;
let shakeIntensity = 0;
let fadeInAlpha = 0;
let resultAnim = null;

if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        if (typeof r === 'number') r = [r, r, r, r];
        const [tl, tr, br, bl] = r;
        this.moveTo(x + tl, y);
        this.lineTo(x + w - tr, y);
        this.quadraticCurveTo(x + w, y, x + w, y + tr);
        this.lineTo(x + w, y + h - br);
        this.quadraticCurveTo(x + w, y + h, x + w - br, y + h);
        this.lineTo(x + bl, y + h);
        this.quadraticCurveTo(x, y + h, x, y + h - bl);
        this.lineTo(x, y + tl);
        this.quadraticCurveTo(x, y, x + tl, y);
        this.closePath();
        return this;
    };
}

function initGame() {
    score = 0;
    currentLevel = 0;
    combo = 0;
    timeLeft = CONFIG.timeLimit;
    particles = [];
    shakeTimer = 0;
    shakeIntensity = 0;
    fadeInAlpha = 0;
    resultAnim = null;
    loadLevel();
}

function loadLevel() {
    if (currentLevel >= CONFIG.levelsPerRound) {
        gameState = STATE.GAME_OVER;
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('hanzi_highScore', highScore);
        }
        return;
    }

    const idx = Math.floor(Math.random() * HANZI_DATA.length);
    currentHanzi = HANZI_DATA[idx];
    targetChar = currentHanzi.char;

    availableParts = [...currentHanzi.parts].sort(() => Math.random() - 0.5);
    selectedParts = [];

    partPositions = [];
    const cols = 4;
    const gap = 15;
    const totalW = cols * CONFIG.partSize + (cols - 1) * gap;
    const startX = (BASE_WIDTH - totalW) / 2 + CONFIG.partSize / 2;
    const startY = BASE_HEIGHT - 130;

    for (let i = 0; i < availableParts.length; i++) {
        const row = Math.floor(i / cols);
        const col = i % cols;
        partPositions.push({
            x: startX + col * (CONFIG.partSize + gap),
            y: startY + row * (CONFIG.partSize + gap),
            origX: startX + col * (CONFIG.partSize + gap),
            origY: startY + row * (CONFIG.partSize + gap),
            partIndex: i,
            placed: false
        });
    }

    timeLeft = CONFIG.timeLimit;
    fadeInAlpha = 0;
    resultAnim = null;
}

function createParticles(x, y, count, color) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8 - 3,
            life: 1,
            decay: 0.015 + Math.random() * 0.02,
            size: 3 + Math.random() * 5,
            color: color || '#ffd700'
        });
    }
}

function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.15;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function drawParticles() {
    particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;
}

function drawGradientBg() {
    const grd = ctx.createLinearGradient(0, 0, 0, BASE_HEIGHT);
    grd.addColorStop(0, '#0a0a2e');
    grd.addColorStop(0.3, '#1a1a4e');
    grd.addColorStop(0.7, '#0d0d3d');
    grd.addColorStop(1, '#050520');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, BASE_WIDTH, BASE_HEIGHT);

    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    for (let i = 0; i < 50; i++) {
        const x = (i * 137.5 + Date.now() * 0.001 * (i % 3 + 1)) % BASE_WIDTH;
        const y = (i * 89.3 + Date.now() * 0.0005 * (i % 2 + 1)) % BASE_HEIGHT;
        ctx.beginPath();
        ctx.arc(x, y, 1 + Math.sin(Date.now() * 0.002 + i) * 0.5, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawMenu() {
    drawGradientBg();

    const titleY = 180 + Math.sin(Date.now() * 0.002) * 10;
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 52px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 20;
    ctx.fillText('汉字拼字', BASE_WIDTH / 2, titleY);
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#aaa';
    ctx.font = '18px "Microsoft YaHei", sans-serif';
    ctx.fillText('拖拽部件，拼出正确汉字', BASE_WIDTH / 2, titleY + 50);

    const btnX = BASE_WIDTH / 2, btnY = 380, btnW = 200, btnH = 60;
    const btnGrd = ctx.createLinearGradient(btnX - btnW/2, btnY, btnX + btnW/2, btnY);
    btnGrd.addColorStop(0, '#4CAF50');
    btnGrd.addColorStop(1, '#45a049');
    ctx.fillStyle = btnGrd;
    ctx.beginPath();
    ctx.roundRect(btnX - btnW/2, btnY - btnH/2, btnW, btnH, 15);
    ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 28px "Microsoft YaHei", sans-serif';
    ctx.fillText('开始游戏', btnX, btnY);

    ctx.fillStyle = '#888';
    ctx.font = '16px "Microsoft YaHei", sans-serif';
    ctx.fillText('最高分: ' + highScore, BASE_WIDTH / 2, 480);

    ctx.fillStyle = '#666';
    ctx.font = '14px "Microsoft YaHei", sans-serif';
    ctx.fillText('拖拽汉字部件到目标位置', BASE_WIDTH / 2, 540);
    ctx.fillText('拼出正确的汉字得分', BASE_WIDTH / 2, 565);
    ctx.fillText('按 P 或 ESC 暂停', BASE_WIDTH / 2, 590);
}

function drawPlaying() {
    drawGradientBg();

    let sx = 0, sy = 0;
    if (shakeTimer > 0) {
        sx = (Math.random() - 0.5) * shakeIntensity;
        sy = (Math.random() - 0.5) * shakeIntensity;
        shakeTimer--;
    }
    ctx.save();
    ctx.translate(sx, sy);

    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, BASE_WIDTH, 65);

    ctx.fillStyle = '#fff';
    ctx.font = '16px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText('分数: ' + score, 20, 22);

    ctx.textAlign = 'center';
    ctx.fillText('第 ' + (currentLevel + 1) + '/' + CONFIG.levelsPerRound + ' 关', BASE_WIDTH / 2, 22);

    ctx.textAlign = 'right';
    ctx.fillStyle = timeLeft < 10 ? '#ff4444' : '#fff';
    ctx.fillText('时间: ' + Math.ceil(timeLeft) + 's', BASE_WIDTH - 20, 22);

    if (combo > 1) {
        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 18px "Microsoft YaHei", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('连击 x' + combo, BASE_WIDTH / 2, 50);
    }

    const targetX = BASE_WIDTH / 2;
    const targetY = 150;

    ctx.strokeStyle = '#4CAF50';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.roundRect(targetX - 65, targetY - 65, 130, 130, 12);
    ctx.stroke();

    ctx.fillStyle = 'rgba(76,175,80,0.1)';
    ctx.fill();

    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 80px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(targetChar, targetX, targetY);

    ctx.fillStyle = '#888';
    ctx.font = '16px "Microsoft YaHei", sans-serif';
    ctx.textBaseline = 'top';
    ctx.fillText(currentHanzi.hint, targetX, targetY + 75);

    const selectedY = 310;
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.beginPath();
    ctx.roundRect(30, selectedY - 40, BASE_WIDTH - 60, 80, 10);
    ctx.fill();
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.fillStyle = '#777';
    ctx.font = '13px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText('已选部件（点击可移除）', BASE_WIDTH / 2, selectedY - 45);

    selectedParts.forEach((part, i) => {
        const px = 70 + i * 65;
        const py = selectedY;

        ctx.fillStyle = '#4CAF50';
        ctx.beginPath();
        ctx.arc(px, py, 28, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#66BB6A';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 30px "Microsoft YaHei", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(part, px, py);
    });

    const partsAreaY = BASE_HEIGHT - 180;
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    ctx.beginPath();
    ctx.roundRect(15, partsAreaY - 15, BASE_WIDTH - 30, 140, 10);
    ctx.fill();

    partPositions.forEach((pos, i) => {
        if (pos.placed) return;
        const part = availableParts[i];
        const isDragging = dragging && dragging.index === i;

        ctx.fillStyle = isDragging ? '#1565C0' : '#1a237e';
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, CONFIG.partSize / 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = isDragging ? '#42A5F5' : '#3949AB';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 30px "Microsoft YaHei", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(part, pos.x, pos.y);
    });

    ctx.fillStyle = '#555';
    ctx.font = '13px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText('拖拽部件到上方区域，拼出 "' + targetChar + '"', BASE_WIDTH / 2, BASE_HEIGHT - 15);

    drawParticles();

    if (resultAnim) {
        ctx.globalAlpha = resultAnim.alpha;
        ctx.fillStyle = resultAnim.color;
        ctx.font = 'bold 52px "Microsoft YaHei", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = resultAnim.color;
        ctx.shadowBlur = 15;
        ctx.fillText(resultAnim.text, BASE_WIDTH / 2, resultAnim.y);
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
    }

    ctx.restore();
}

function drawPaused() {
    drawGradientBg();
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(0, 0, BASE_WIDTH, BASE_HEIGHT);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 36px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('游戏暂停', BASE_WIDTH / 2, BASE_HEIGHT / 2 - 50);

    ctx.fillStyle = '#aaa';
    ctx.font = '18px "Microsoft YaHei", sans-serif';
    ctx.fillText('点击屏幕继续', BASE_WIDTH / 2, BASE_HEIGHT / 2 + 20);
}

function drawGameOver() {
    drawGradientBg();

    ctx.fillStyle = '#ff4444';
    ctx.font = 'bold 42px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('游戏结束', BASE_WIDTH / 2, 180);

    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 30px "Microsoft YaHei", sans-serif';
    ctx.fillText('最终得分: ' + score, BASE_WIDTH / 2, 260);

    ctx.fillStyle = '#fff';
    ctx.font = '22px "Microsoft YaHei", sans-serif';
    ctx.fillText('最高分: ' + highScore, BASE_WIDTH / 2, 310);

    ctx.fillStyle = '#aaa';
    ctx.font = '18px "Microsoft YaHei", sans-serif';
    ctx.fillText('完成了 ' + Math.min(currentLevel, CONFIG.levelsPerRound) + ' 个汉字', BASE_WIDTH / 2, 355);

    if (score >= highScore && score > 0) {
        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 26px "Microsoft YaHei", sans-serif';
        ctx.shadowColor = '#ffd700';
        ctx.shadowBlur = 10;
        ctx.fillText('新纪录！', BASE_WIDTH / 2, 400);
        ctx.shadowBlur = 0;
    }

    const btnX = BASE_WIDTH / 2, btnY = 470, btnW = 200, btnH = 55;
    const btnGrd = ctx.createLinearGradient(btnX - btnW/2, btnY, btnX + btnW/2, btnY);
    btnGrd.addColorStop(0, '#2196F3');
    btnGrd.addColorStop(1, '#1976D2');
    ctx.fillStyle = btnGrd;
    ctx.beginPath();
    ctx.roundRect(btnX - btnW/2, btnY - btnH/2, btnW, btnH, 12);
    ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 24px "Microsoft YaHei", sans-serif';
    ctx.fillText('再来一局', btnX, btnY);
}

function update(dt) {
    if (gameState !== STATE.PLAYING) return;

    if (fadeInAlpha < 1) fadeInAlpha = Math.min(1, fadeInAlpha + dt * 3);

    timeLeft -= dt;
    if (timeLeft <= 0 && !resultAnim) {
        timeLeft = 0;
        gameState = STATE.GAME_OVER;
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('hanzi_highScore', highScore);
        }
        shakeTimer = 20;
        shakeIntensity = 10;
    }

    updateParticles(dt);

    if (resultAnim) {
        resultAnim.y -= dt * 30;
        resultAnim.timer -= dt;
        if (resultAnim.timer < 0.5) resultAnim.alpha = resultAnim.timer * 2;
        if (resultAnim.timer <= 0) {
            resultAnim = null;
            loadLevel();
        }
    }
}

let pointerDown = false;
let pointerX = 0;
let pointerY = 0;

function getPointerPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
        x: (clientX - rect.left) / scale,
        y: (clientY - rect.top) / scale
    };
}

function getPointerEndPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
    const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
    return {
        x: (clientX - rect.left) / scale,
        y: (clientY - rect.top) / scale
    };
}

function handlePointerDown(e) {
    e.preventDefault();
    const pos = getPointerPos(e);
    pointerDown = true;
    pointerX = pos.x;
    pointerY = pos.y;

    if (gameState === STATE.MENU) {
        if (pos.x > BASE_WIDTH/2 - 100 && pos.x < BASE_WIDTH/2 + 100 &&
            pos.y > 350 && pos.y < 410) {
            gameState = STATE.PLAYING;
            initGame();
        }
        return;
    }

    if (gameState === STATE.GAME_OVER) {
        if (pos.x > BASE_WIDTH/2 - 100 && pos.x < BASE_WIDTH/2 + 100 &&
            pos.y > 442 && pos.y < 498) {
            gameState = STATE.PLAYING;
            initGame();
        }
        return;
    }

    if (gameState === STATE.PAUSED) {
        gameState = STATE.PLAYING;
        return;
    }

    if (gameState === STATE.PLAYING && !resultAnim) {
        const selectedY = 310;
        for (let i = selectedParts.length - 1; i >= 0; i--) {
            const px = 70 + i * 65;
            const dist = Math.sqrt((pos.x - px) ** 2 + (pos.y - selectedY) ** 2);
            if (dist < 32) {
                const removedPart = selectedParts.splice(i, 1)[0];
                for (let j = 0; j < availableParts.length; j++) {
                    if (availableParts[j] === removedPart && partPositions[j].placed) {
                        partPositions[j].placed = false;
                        partPositions[j].x = partPositions[j].origX;
                        partPositions[j].y = partPositions[j].origY;
                        break;
                    }
                }
                return;
            }
        }

        for (let i = 0; i < partPositions.length; i++) {
            const pos2 = partPositions[i];
            if (pos2.placed) continue;
            const dist = Math.sqrt((pos.x - pos2.x) ** 2 + (pos.y - pos2.y) ** 2);
            if (dist < CONFIG.partSize / 2 + 5) {
                dragging = { index: i, part: availableParts[i] };
                dragOffset.x = pos.x - pos2.x;
                dragOffset.y = pos.y - pos2.y;
                break;
            }
        }
    }
}

function handlePointerMove(e) {
    e.preventDefault();
    if (!pointerDown || !dragging) return;
    const pos = getPointerPos(e);
    pointerX = pos.x;
    pointerY = pos.y;
    partPositions[dragging.index].x = pos.x - dragOffset.x;
    partPositions[dragging.index].y = pos.y - dragOffset.y;
}

function handlePointerUp(e) {
    e.preventDefault();
    if (!pointerDown) return;
    pointerDown = false;

    if (dragging && gameState === STATE.PLAYING && !resultAnim) {
        const pos = getPointerEndPos(e);
        const selectedY = 310;

        if (pos.y > selectedY - 60 && pos.y < selectedY + 60 && pos.x > 30 && pos.x < BASE_WIDTH - 30) {
            selectedParts.push(dragging.part);
            partPositions[dragging.index].placed = true;
            checkAnswer();
        } else {
            partPositions[dragging.index].x = partPositions[dragging.index].origX;
            partPositions[dragging.index].y = partPositions[dragging.index].origY;
        }
    }
    dragging = null;
}

function checkAnswer() {
    if (selectedParts.length < 2) return;

    const targetParts = currentHanzi.parts.slice(0, 2);
    const hasAll = targetParts.every(p => selectedParts.includes(p));

    if (hasAll) {
        const bonus = combo * CONFIG.comboBonus;
        const earned = CONFIG.scorePerChar + bonus;
        score += earned;
        combo++;

        resultAnim = { text: '+' + earned, color: '#4CAF50', y: 250, alpha: 1, timer: 1.2 };
        createParticles(BASE_WIDTH / 2, 200, 30, '#4CAF50');
        createParticles(BASE_WIDTH / 2, 200, 20, '#ffd700');
        currentLevel++;
    } else if (selectedParts.length >= availableParts.length) {
        combo = 0;
        shakeTimer = 10;
        shakeIntensity = 5;
        resultAnim = { text: '再试试', color: '#ff4444', y: 250, alpha: 1, timer: 1 };

        setTimeout(() => {
            selectedParts = [];
            partPositions.forEach(p => {
                p.placed = false;
                p.x = p.origX;
                p.y = p.origY;
            });
        }, 500);
    }
}

canvas.addEventListener('mousedown', handlePointerDown);
canvas.addEventListener('mousemove', handlePointerMove);
canvas.addEventListener('mouseup', handlePointerUp);
canvas.addEventListener('touchstart', handlePointerDown, { passive: false });
canvas.addEventListener('touchmove', handlePointerMove, { passive: false });
canvas.addEventListener('touchend', handlePointerUp, { passive: false });

document.addEventListener('keydown', (e) => {
    if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
        if (gameState === STATE.PLAYING) gameState = STATE.PAUSED;
        else if (gameState === STATE.PAUSED) gameState = STATE.PLAYING;
    }
    if (e.key === ' ' || e.key === 'Enter') {
        if (gameState === STATE.MENU) { gameState = STATE.PLAYING; initGame(); }
        else if (gameState === STATE.GAME_OVER) { gameState = STATE.PLAYING; initGame(); }
    }
});

function gameLoop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;

    update(dt);

    switch (gameState) {
        case STATE.MENU: drawMenu(); break;
        case STATE.PLAYING: drawPlaying(); break;
        case STATE.PAUSED: drawPaused(); break;
        case STATE.GAME_OVER: drawGameOver(); break;
    }

    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);

<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
