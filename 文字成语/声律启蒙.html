const CATEGORIES=["天文","地理","人物","动物","植物","数字","色彩","声音","动作","建筑","方位","文化"];

/* ===== 配置 ===== */
const CFG={
    roundPairs:10,     // 每轮题目数
    timePerQ:15,       // 每题秒数
    comboMult:0.5,     // 连击加分倍率
    wrongPenalty:5,    // 错误扣分
    easyTimeBonus:1,   // 快答奖励(秒内答对+额外分)
    optionsCount:4     // 选项数量
};

/* ===== 游戏状态 ===== */
var canvas,ctx,W,H,dpr;
var particles=[];
var state="menu"; // menu,play,gameover,pause
var score=0,hiScore=0,combo=0,maxCombo=0,correctCnt=0,wrongCnt=0,round=0;
var timer=0,questionTimer=0;
var questions=[];
var currentQ=null;
var options=[];
var selectedOption=-1;
var feedbackTimer=0,feedbackCorrect=false;
var animFrame=0;
var menuAnim=0;

/* ===== 初始化 ===== */
function init(){
    canvas=document.getElementById("c");
    ctx=canvas.getContext("2d");
    dpr=Math.min(window.devicePixelRatio||1,3);
    resize();
    window.addEventListener("resize",resize);
    canvas.addEventListener("click",onClick);
    canvas.addEventListener("touchstart",onTouch,{passive:false});
    document.addEventListener("keydown",onKey);
    hiScore=parseInt(localStorage.getItem("shenglyu_hi")||"0");
    loop();
}

function resize(){
    W=window.innerWidth;
    H=window.innerHeight;
    canvas.width=W*dpr;
    canvas.height=H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
}

/* ===== 粒子系统 ===== */
function spawnParticles(x,y,color,count){
    for(var i=0;i<count;i++){
        var angle=Math.random()*Math.PI*2;
        var speed=1+Math.random()*3;
        particles.push({x:x,y:y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:60+Math.random()*40,maxLife:100,color:color,r:2+Math.random()*3});
    }
}

function spawnBurst(x,y,color){
    spawnParticles(x,y,color,15);
}

function spawnConfetti(){
    for(var i=0;i<60;i++){
        var x=Math.random()*W;
        particles.push({x:x,y:-20,vx:Math.random()*2-1,vy:1+Math.random()*3,life:200+Math.random()*100,maxLife:300,color:"hsl("+Math.floor(Math.random()*360)+",80%,60%)",r:3+Math.random()*4,type:"confetti"});
    }
}

function updateParticles(){
    for(var i=particles.length-1;i>=0;i--){
        var p=particles[i];
        p.x+=p.vx;
        p.y+=p.vy;
        if(p.type!=="confetti") p.vy+=0.05;
        p.life--;
        if(p.life<=0) particles.splice(i,1);
    }
}

function drawParticles(){
    for(var i=0;i<particles.length;i++){
        var p=particles[i];
        var a=Math.max(0,p.life/p.maxLife);
        ctx.globalAlpha=a;
        ctx.fillStyle=p.color;
        if(p.type==="confetti"){
            ctx.fillRect(p.x,p.y,p.r*2,p.r);
        } else {
            ctx.beginPath();
            ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
            ctx.fill();
        }
    }
    ctx.globalAlpha=1;
}

/* ===== 背景渲染 ===== */
function drawBg(){
    var grad=ctx.createLinearGradient(0,0,W,H);
    if(state==="menu"){
        grad.addColorStop(0,"#1a0533");
        grad.addColorStop(0.5,"#0d1b2a");
        grad.addColorStop(1,"#1b2838");
    } else if(state==="gameover"){
        grad.addColorStop(0,"#2d1b00");
        grad.addColorStop(0.5,"#1a0a00");
        grad.addColorStop(1,"#0d0500");
    } else {
        grad.addColorStop(0,"#0a0a2e");
        grad.addColorStop(0.5,"#16213e");
        grad.addColorStop(1,"#0f3460");
    }
    ctx.fillStyle=grad;
    ctx.fillRect(0,0,W,H);
}

/* ===== 工具函数 ===== */
function randInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function shuffle(arr){
    var a=arr.slice();
    for(var i=a.length-1;i>0;i--){
        var j=randInt(0,i);
        var t=a[i];a[i]=a[j];a[j]=t;
    }
    return a;
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function lerp(a,b,t){return a+(b-a)*t;}

/* ===== 按钮检测 ===== */
function hitBtn(mx,my,bx,by,bw,bh){
    return mx>=bx && mx<=bx+bw && my>=by && my<=by+bh;
}

/* ===== 生成题目 ===== */
function generateQuestions(){
    var all=shuffle(PAIR_DATA);
    questions=all.slice(0,CFG.roundPairs);
    round=0;
    correctCnt=0;
    wrongCnt=0;
    combo=0;
    maxCombo=0;
    score=0;
    nextQuestion();
}

function nextQuestion(){
    if(round>=CFG.roundPairs){
        endGame();
        return;
    }
    currentQ=questions[round];
    selectedOption=-1;
    feedbackTimer=0;
    questionTimer=CFG.timePerQ*60;

    // 生成选项：1个正确答案+若干干扰项
    var wrongPool=PAIR_DATA.filter(function(p){return p.left!==currentQ.left;});
    wrongPool=shuffle(wrongPool);
    var opts=[{text:currentQ.right,correct:true}];
    for(var i=0;i<wrongPool.length && opts.length<CFG.optionsCount;i++){
        opts.push({text:wrongPool[i].right,correct:false});
    }
    options=shuffle(opts);
}

/* ===== 回答判定 ===== */
function answer(idx){
    if(selectedOption>=0 || feedbackTimer>0) return;
    selectedOption=idx;
    var opt=options[idx];
    if(opt.correct){
        feedbackCorrect=true;
        combo++;
        if(combo>maxCombo) maxCombo=combo;
        correctCnt++;
        var base=10;
        var comboBonus=Math.floor(combo*CFG.comboMult);
        var timeBonus=questionTimer>CFG.timePerQ*30?CFG.easyTimeBonus:0;
        score+=base+comboBonus+timeBonus;
        feedbackTimer=90;
        spawnBurst(W/2,H/2,"#4ade80");
        spawnBurst(W/2,H/2,"#a78bfa");
    } else {
        feedbackCorrect=false;
        combo=0;
        wrongCnt++;
        score=Math.max(0,score-CFG.wrongPenalty);
        feedbackTimer=90;
        spawnBurst(W/2,H/2,"#f87171");
    }
}

function timeUp(){
    if(selectedOption>=0) return;
    feedbackCorrect=false;
    combo=0;
    wrongCnt++;
    feedbackTimer=90;
    spawnBurst(W/2,H/2,"#fbbf24");
}

/* ===== 游戏流程 ===== */
function startGame(){
    state="play";
    document.getElementById("ui").style.display="block";
    generateQuestions();
}

function endGame(){
    state="gameover";
    document.getElementById("ui").style.display="none";
    if(score>hiScore){
        hiScore=score;
        localStorage.setItem("shenglyu_hi",hiScore.toString());
    }
    spawnConfetti();
}

function restartGame(){
    state="play";
    document.getElementById("pauseOverlay").style.display="none";
    document.getElementById("ui").style.display="block";
    generateQuestions();
}

function togglePause(){
    if(state==="play"){
        state="pause";
        document.getElementById("pauseOverlay").style.display="flex";
    } else if(state==="pause"){
        state="play";
        document.getElementById("pauseOverlay").style.display="none";
    }
}

/* ===== 输入处理 ===== */
function getClickPos(e){
    var rect=canvas.getBoundingClientRect();
    return {x:e.clientX-rect.left,y:e.clientY-rect.top};
}

function onClick(e){
    var pos=getClickPos(e);
    handleInput(pos.x,pos.y);
}

function onTouch(e){
    e.preventDefault();
    var t=e.touches[0];
    var rect=canvas.getBoundingClientRect();
    handleInput(t.clientX-rect.left,t.clientY-rect.top);
}

function onKey(e){
    if(state==="menu"){
        if(e.key==="Enter"||e.key===" "){
            startGame();
            return;
        }
    }
    if(state==="play" && selectedOption<0){
        var idx=parseInt(e.key)-1;
        if(idx>=0 && idx<options.length){
            answer(idx);
        }
    }
    if(state==="gameover"){
        if(e.key==="Enter"||e.key===" "){
            state="menu";
        }
    }
    if(e.key==="Escape"||e.key==="p"){
        if(state==="play"||state==="pause") togglePause();
    }
}

function handleInput(x,y){
    if(state==="menu"){
        // 开始按钮
        var bw=220,bh=55;
        var bx=W/2-bw/2,by=H*0.62;
        if(hitBtn(x,y,bx,by,bw,bh)){
            startGame();
            return;
        }
    }
    if(state==="play" && selectedOption<0){
        // 选项按钮
        var optW=Math.min(W*0.8,400);
        var optH=56;
        var startX=(W-optW)/2;
        var startY=H*0.52;
        var gap=12;
        for(var i=0;i<options.length;i++){
            var oy=startY+i*(optH+gap);
            if(hitBtn(x,y,startX,oy,optW,optH)){
                answer(i);
                return;
            }
        }
    }
    if(state==="gameover"){
        var bw=220,bh=50;
        var bx=W/2-bw/2;
        if(hitBtn(x,y,bx,H*0.72,bw,bh)){
            state="menu";
            return;
        }
        if(hitBtn(x,y,bx,H*0.72+60,bw,bh)){
            startGame();
            return;
        }
    }
}

/* ===== 渲染：菜单 ===== */
function drawMenu(){
    menuAnim+=0.02;
    drawBg();

    // 装饰粒子
    var t=menuAnim*50;
    ctx.globalAlpha=0.15;
    for(var i=0;i<20;i++){
        var px=(Math.sin(t*0.01+i*1.3)*0.5+0.5)*W;
        var py=(Math.cos(t*0.008+i*0.9)*0.5+0.5)*H;
        ctx.fillStyle="hsl("+(i*18+t)%360+",70%,60%)";
        ctx.beginPath();
        ctx.arc(px,py,30+Math.sin(t*0.02+i)*15,0,Math.PI*2);
        ctx.fill();
    }
    ctx.globalAlpha=1;

    // 标题
    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.shadowColor="rgba(168,85,247,0.5)";
    ctx.shadowBlur=30;
    ctx.fillStyle="#e9d5ff";
    ctx.font="bold "+Math.min(52,W*0.11)+"px 'Microsoft YaHei',sans-serif";
    ctx.fillText("声律启蒙",W/2,H*0.28);
    ctx.shadowBlur=0;

    ctx.fillStyle="#c4b5fd";
    ctx.font=Math.min(20,W*0.045)+"px 'Microsoft YaHei',sans-serif";
    ctx.fillText("对仗词配对 · 学习声律格律",W/2,H*0.38);

    // 装饰线
    var lineW=Math.min(W*0.5,250);
    ctx.strokeStyle="rgba(168,85,247,0.3)";
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(W/2-lineW/2,H*0.43);
    ctx.lineTo(W/2+lineW/2,H*0.43);
    ctx.stroke();

    // 显示最高分
    ctx.fillStyle="#a78bfa";
    ctx.font=Math.min(16,W*0.035)+"px 'Microsoft YaHei',sans-serif";
    ctx.fillText("最高分: "+hiScore,W/2,H*0.48);

    // 玩法说明
    ctx.fillStyle="rgba(200,200,255,0.7)";
    ctx.font=Math.min(14,W*0.03)+"px 'Microsoft YaHei',sans-serif";
    ctx.fillText("选择正确的对仗词 · 每题"+CFG.timePerQ+"秒 · "+CFG.roundPairs+"题",W/2,H*0.55);

    // 开始按钮
    var bw=220,bh=55;
    var bx=W/2-bw/2,by=H*0.62;
    var pulse=1+Math.sin(menuAnim*3)*0.03;
    ctx.save();
    ctx.translate(W/2,by+bh/2);
    ctx.scale(pulse,pulse);
    ctx.translate(-W/2,-(by+bh/2));
    var g=ctx.createLinearGradient(bx,by,bx+bw,by+bh);
    g.addColorStop(0,"#8b5cf6");
    g.addColorStop(1,"#6366f1");
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.roundRect(bx,by,bw,bh,12);
    ctx.fill();
    ctx.shadowColor="rgba(139,92,246,0.4)";
    ctx.shadowBlur=20;
    ctx.fillStyle="#fff";
    ctx.font="bold "+Math.min(22,W*0.05)+"px 'Microsoft YaHei',sans-serif";
    ctx.fillText("开始游戏",W/2,by+bh/2);
    ctx.shadowBlur=0;
    ctx.restore();

    // 分类展示
    ctx.fillStyle="rgba(200,200,255,0.5)";
    ctx.font=Math.min(13,W*0.028)+"px 'Microsoft YaHei',sans-serif";
    var cats=CATEGORIES.join(" · ");
    ctx.fillText("涵盖"+CATEGORIES.length+"大类："+cats,W/2,H*0.82);

    // 底部
    ctx.fillStyle="rgba(200,200,255,0.3)";
    ctx.font=Math.min(12,W*0.025)+"px 'Microsoft YaHei',sans-serif";
    ctx.fillText("键盘1-4选答案 · ESC暂停 · 共"+PAIR_DATA.length+"对仗词",W/2,H*0.92);
}

/* ===== 渲染：游戏中 ===== */
function drawPlay(){
    drawBg();

    // 更新计时
    if(feedbackTimer>0){
        feedbackTimer--;
        if(feedbackTimer<=0 && selectedOption>=0){
            round++;
            nextQuestion();
        }
    } else if(selectedOption<0){
        questionTimer--;
        if(questionTimer<=0){
            timeUp();
        }
    }

    var fontSize=Math.min(22,W*0.045);
    ctx.textAlign="center";
    ctx.textBaseline="middle";

    // 顶部信息栏
    var barH=55;
    ctx.fillStyle="rgba(0,0,0,0.3)";
    ctx.fillRect(0,0,W,barH);
    ctx.fillStyle="#e9d5ff";
    ctx.font="bold "+fontSize+"px 'Microsoft YaHei',sans-serif";
    ctx.fillText("分数: "+score,W*0.2,barH/2);
    ctx.fillText("连击: "+combo,W*0.5,barH/2);
    ctx.fillText(round+"/"+CFG.roundPairs,W*0.8,barH/2);

    // 计时条
    var tbY=barH+5;
    var tbW=W*0.6;
    var tbH=8;
    var tbX=(W-tbW)/2;
    var pct=Math.max(0,questionTimer/(CFG.timePerQ*60));
    ctx.fillStyle="rgba(255,255,255,0.1)";
    ctx.fillRect(tbX,tbY,tbW,tbH);
    var tc=pct>0.5?"#4ade80":(pct>0.25?"#fbbf24":"#f87171");
    ctx.fillStyle=tc;
    ctx.fillRect(tbX,tbY,tbW*pct,tbH);

    if(!currentQ) return;

    // 题目区域
    var qY=H*0.25;
    var catSize=Math.min(16,W*0.035);
    ctx.fillStyle="#a78bfa";
    ctx.font=catSize+"px 'Microsoft YaHei',sans-serif";
    ctx.fillText("【"+currentQ.cat+"】",W/2,qY-40);

    ctx.fillStyle="rgba(255,255,255,0.6)";
    ctx.font=Math.min(14,W*0.03)+"px 'Microsoft YaHei',sans-serif";
    ctx.fillText(currentQ.hint,W/2,qY-15);

    var qSize=Math.min(48,W*0.1);
    ctx.fillStyle="#fff";
    ctx.font="bold "+qSize+"px 'Microsoft YaHei',sans-serif";
    ctx.shadowColor="rgba(139,92,246,0.3)";
    ctx.shadowBlur=15;
    ctx.fillText(currentQ.left,W/2,qY+25);
    ctx.shadowBlur=0;

    ctx.fillStyle="rgba(255,255,255,0.5)";
    ctx.font=Math.min(18,W*0.04)+"px 'Microsoft YaHei',sans-serif";
    ctx.fillText("的对仗词是？",W/2,qY+70);

    // 选项按钮
    var optW=Math.min(W*0.8,400);
    var optH=56;
    var startX=(W-optW)/2;
    var startY=H*0.52;
    var gap=12;

    for(var i=0;i<options.length;i++){
        var oy=startY+i*(optH+gap);
        var isSelected=(selectedOption===i);
        var isCorrect=isSelected && feedbackCorrect;
        var isWrong=isSelected && !feedbackCorrect;
        var showAnswer=(selectedOption>=0 && options[i].correct && !feedbackCorrect);

        var g=ctx.createLinearGradient(startX,oy,startX+optW,oy+optH);
        if(isCorrect){
            g.addColorStop(0,"#059669");
            g.addColorStop(1,"#10b981");
        } else if(isWrong){
            g.addColorStop(0,"#dc2626");
            g.addColorStop(1,"#ef4444");
        } else if(showAnswer){
            g.addColorStop(0,"#059669");
            g.addColorStop(1,"#10b981");
        } else {
            g.addColorStop(0,"rgba(139,92,246,0.3)");
            g.addColorStop(1,"rgba(99,102,241,0.3)");
        }

        ctx.fillStyle=g;
        ctx.beginPath();
        ctx.roundRect(startX,oy,optW,optH,10);
        ctx.fill();

        ctx.strokeStyle=(isCorrect||showAnswer)?"#4ade80":(isWrong?"#f87171":"rgba(255,255,255,0.2)");
        ctx.lineWidth=2;
        ctx.stroke();

        ctx.fillStyle="#fff";
        ctx.font="bold "+Math.min(20,W*0.042)+"px 'Microsoft YaHei',sans-serif";
        ctx.fillText((i+1)+". "+options[i].text,W/2,oy+optH/2);
    }

    // 反馈文字
    if(feedbackTimer>0){
        var fAlpha=Math.min(1,feedbackTimer/30);
        ctx.globalAlpha=fAlpha;
        ctx.fillStyle=feedbackCorrect?"#4ade80":"#f87171";
        ctx.font="bold "+Math.min(28,W*0.06)+"px 'Microsoft YaHei',sans-serif";
        var fText=feedbackCorrect?"✓ 正对！+10":"✗ 不对";
        if(feedbackCorrect && combo>1){
            fText+=" (连击×"+combo+")";
        }
        ctx.fillText(fText,W/2,H*0.48);
        ctx.globalAlpha=1;

        // 显示配对信息
        if(!feedbackCorrect){
            ctx.fillStyle="rgba(255,255,255,0.6)";
            ctx.font=Math.min(16,W*0.035)+"px 'Microsoft YaHei',sans-serif";
            ctx.fillText(currentQ.left+" 对 "+currentQ.right,W/2,H*0.48+30);
        }
    }
}

/* ===== 渲染：游戏结束 ===== */
function drawGameover(){
    drawBg();

    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.shadowColor="rgba(251,191,36,0.5)";
    ctx.shadowBlur=20;
    ctx.fillStyle="#fbbf24";
    ctx.font="bold "+Math.min(42,W*0.09)+"px 'Microsoft YaHei',sans-serif";
    ctx.fillText("本轮结束",W/2,H*0.15);
    ctx.shadowBlur=0;

    ctx.fillStyle="#e9d5ff";
    ctx.font="bold "+Math.min(52,W*0.12)+"px 'Microsoft YaHei',sans-serif";
    ctx.fillText(score+" 分",W/2,H*0.28);

    if(score>=hiScore && score>0){
        ctx.fillStyle="#fbbf24";
        ctx.font="bold "+Math.min(20,W*0.045)+"px 'Microsoft YaHei',sans-serif";
        ctx.fillText("新纪录！",W/2,H*0.36);
    }

    ctx.fillStyle="#c4b5fd";
    ctx.font=Math.min(18,W*0.04)+"px 'Microsoft YaHei',sans-serif";
    var stats=[
        "正确: "+correctCnt+"/"+CFG.roundPairs,
        "最高连击: "+maxCombo,
        "最高分: "+hiScore
    ];
    for(var i=0;i<stats.length;i++){
        ctx.fillText(stats[i],W/2,H*0.44+i*32);
    }

    // 本次配对回顾
    ctx.fillStyle="rgba(168,85,247,0.5)";
    ctx.font=Math.min(14,W*0.03)+"px 'Microsoft YaHei',sans-serif";
    ctx.fillText("—— 本次配对回顾 ——",W/2,H*0.58);

    ctx.fillStyle="rgba(200,200,255,0.7)";
    ctx.font=Math.min(13,W*0.028)+"px 'Microsoft YaHei',sans-serif";
    var reviewY=H*0.62;
    var showCount=Math.min(questions.length,6);
    for(var i=0;i<showCount;i++){
        var q=questions[i];
        ctx.fillText(q.left+" — "+q.right,W/2,reviewY+i*22);
    }
    if(questions.length>6){
        ctx.fillText("...",W/2,reviewY+showCount*22);
    }

    // 按钮
    var bw=220,bh=50;
    var bx=W/2-bw/2;
    drawBtn(bx,H*0.72,bw,bh,"返回菜单","#8b5cf6","#6366f1");
    drawBtn(bx,H*0.72+60,bw,bh,"再来一轮","#059669","#10b981");
}

function drawBtn(x,y,w,h,text,c1,c2){
    var g=ctx.createLinearGradient(x,y,x+w,y+h);
    g.addColorStop(0,c1);
    g.addColorStop(1,c2);
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.roundRect(x,y,w,h,10);
    ctx.fill();
    ctx.fillStyle="#fff";
    ctx.font="bold "+Math.min(18,W*0.04)+"px 'Microsoft YaHei',sans-serif";
    ctx.fillText(text,x+w/2,y+h/2);
}

/* ===== 主循环 ===== */
function loop(){
    animFrame++;
    updateParticles();

    switch(state){
        case "menu": drawMenu(); break;
        case "play": case "pause": drawPlay(); break;
        case "gameover": drawGameover(); break;
    }

    drawParticles();
    requestAnimationFrame(loop);
}

/* ===== roundRect polyfill ===== */
if(!CanvasRenderingContext2D.prototype.roundRect){
    CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
        if(typeof r==="number") r=[r,r,r,r];
        var tl=r[0],tr=r[1],br=r[2],bl=r[3];
        this.moveTo(x+tl,y);
        this.lineTo(x+w-tr,y);
        this.quadraticCurveTo(x+w,y,x+w,y+tr);
        this.lineTo(x+w,y+h-br);
        this.quadraticCurveTo(x+w,y+h,x+w-br,y+h);
        this.lineTo(x+bl,y+h);
        this.quadraticCurveTo(x,y+h,x,y+h-bl);
        this.lineTo(x,y+tl);
        this.quadraticCurveTo(x,y,x+tl,y);
        this.closePath();
        return this;
    };
}

    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {

  window.batchResizeCanvas = batchResizeCanvas;
})();

    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);

  };
  window.clearAllBatchTimers = function() {
