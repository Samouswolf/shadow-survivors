<script>
// ===== 常量 =====
var CARD_COLS = 6;
var CARD_ROWS = 4;
var TOTAL_CARDS = CARD_COLS * CARD_ROWS; // 24 cards = 12 pairs
var PAIR_COUNT = TOTAL_CARDS / 2;

// ===== 成语数据（上半句 → 下半句配对） =====
var IDIOM_DATA = [

    { first: "掩耳盗铃", second: "自欺欺人" },
    { first: "悬梁刺股", second: "发愤图强" },
    { first: "凿壁偷光", second: "勤学苦读" },

    { first: "井底之蛙", second: "目光短浅" },
    { first: "狐假虎威", second: "狗仗人势" },
    { first: "鹤立鸡群", second: "出类拔萃" },
    { first: "龙飞凤舞", second: "笔走龙蛇" },
    { first: "风花雪月", second: "才子佳人" },
    { first: "天长地久", second: "海誓山盟" },
    { first: "花好月圆", second: "良辰美景" },
    { first: "春风得意", second: "马蹄疾驰" }
];

// ===== 配色 =====
var COLORS = {
    bg1: "#0a0a2e", bg2: "#1a1a4e", bg3: "#2a1a5e",
    cardBack: "#2c3e80", cardBackLight: "#4a6fa5",
    cardMatched: "#1a6b3c", cardMatchedLight: "#2ecc71",
    cardText: "#ffffff", cardShadow: "rgba(0,0,0,0.4)",
    pairA: ["#e74c3c", "#c0392b"], // 红色系 - 上半句
    pairB: ["#3498db", "#2980b9"], // 蓝色系 - 下半句
    gold: "#ffd700", silver: "#c0c0c0", bronze: "#cd7f32",
    uiText: "#ffffff", uiDim: "#8899bb",
    btnStart: ["#2ecc71", "#27ae60"],
    btnRestart: ["#e67e22", "#d35400"]
};

// ===== 粒子系统 =====
var particles = [];

function spawnParticles(x, y, count, color, speed, life) {
    for (var i = 0; i < count; i++) {
        var angle = Math.random() * Math.PI * 2;
        var spd = speed * (0.3 + Math.random() * 0.7);
        particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * spd,
            vy: Math.sin(angle) * spd,
            life: life * (0.5 + Math.random() * 0.5),
            maxLife: life,
            size: 2 + Math.random() * 4,
            color: color
        });
    }
}

function updateParticles(dt) {
    for (var i = particles.length - 1; i >= 0; i--) {
        var p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function drawParticles(ctx) {
    for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        var alpha = Math.max(0, p.life / p.maxLife);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

// ===== 背景粒子（装饰） =====
var bgParticles = [];
function initBgParticles() {
    bgParticles = [];
    for (var i = 0; i < 40; i++) {
        bgParticles.push({
            x: Math.random() * W,
            y: Math.random() * H,
            size: 1 + Math.random() * 2,
            speed: 0.2 + Math.random() * 0.5,
            alpha: 0.1 + Math.random() * 0.3,
            phase: Math.random() * Math.PI * 2
        });
    }
}

function updateBgParticles(dt, time) {
    for (var i = 0; i < bgParticles.length; i++) {
        var bp = bgParticles[i];
        bp.y -= bp.speed * dt * 30;
        bp.x += Math.sin(time * 0.5 + bp.phase) * 0.3;
        if (bp.y < -10) { bp.y = H + 10; bp.x = Math.random() * W; }
    }
}

function drawBgParticles(ctx) {
    for (var i = 0; i < bgParticles.length; i++) {
        var bp = bgParticles[i];
        ctx.globalAlpha = bp.alpha;
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(bp.x, bp.y, bp.size, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

// ===== 游戏状态 =====
var G = {
    state: "menu", // menu, playing, gameover
    cards: [],
    selected: [], // 当前翻开的卡片索引（最多2个）
    matched: 0,   // 已匹配对数
    moves: 0,     // 翻牌次数
    score: 0,
    highScore: 0,
    combo: 0,     // 连续匹配计数
    timer: 0,     // 游戏用时（秒）
    matchAnim: [], // 匹配动画
    flipAnim: {},  // 翻牌动画 {idx: progress}
    lockInput: false, // 动画期间锁定输入
    bestTime: 0,
    level: 1,
    shuffleAnim: 0, // 洗牌动画
    showHint: false,
    hintTimer: 0,
    difficulty: 1,  // 1=简单, 2=中等, 3=困难
    comboText: null // {text, x, y, life}
};

// ===== Canvas =====
var canvas = document.getElementById("cv");
var ctx = canvas.getContext("2d");
var W, H, dpr;

function resizeCanvas() {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    initBgParticles();
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();

// ===== 加载最高分 =====
function loadHighScore() {
    try {
        var data = localStorage.getItem("idiom_match_hs");
        if (data) {
            var obj = JSON.parse(data);
            G.highScore = obj.score || 0;
            G.bestTime = obj.time || 0;
        }
    } catch(e) {}
}

function saveHighScore() {
    try {
        localStorage.setItem("idiom_match_hs", JSON.stringify({
            score: G.highScore,
            time: G.bestTime
        }));
    } catch(e) {}
}

loadHighScore();

// ===== 工具函数 =====
function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
}

function lerp(a, b, t) { return a + (b - a) * t; }
function easeOutBack(t) { var s = 1.70158; return 1 + (t - 1) * (t - 1) * ((s + 1) * (t - 1) + s); }
function easeOutBounce(t) {
    if (t < 1/2.75) return 7.5625*t*t;
    else if (t < 2/2.75) return 7.5625*(t-=1.5/2.75)*t+0.75;
    else if (t < 2.5/2.75) return 7.5625*(t-=2.25/2.75)*t+0.9375;
    else return 7.5625*(t-=2.625/2.75)*t+0.984375;
}

// ===== 卡片布局计算 =====
function getCardLayout() {
    var margin = Math.min(W, H) * 0.03;
    var topArea = 80; // 顶部信息栏
    var availW = W - margin * 2;
    var availH = H - topArea - margin * 2;

    var cardW = Math.floor((availW - (CARD_COLS - 1) * margin) / CARD_COLS);
    var cardH = Math.floor((availH - (CARD_ROWS - 1) * margin) / CARD_ROWS);

    // 保持卡片比例约 3:2.5
    var maxCardW = cardH * 1.2;
    var maxCardH = cardW * 0.83;
    if (cardW > maxCardW) cardW = maxCardW;
    if (cardH > maxCardH) cardH = maxCardH;

    cardW = Math.min(cardW, 160);
    cardH = Math.min(cardH, 130);

    var totalW = CARD_COLS * cardW + (CARD_COLS - 1) * margin;
    var totalH = CARD_ROWS * cardH + (CARD_ROWS - 1) * margin;
    var startX = (W - totalW) / 2;
    var startY = topArea + (availH - totalH) / 2;

    return { cardW: cardW, cardH: cardH, margin: margin, startX: startX, startY: startY };
}

function getCardRect(idx, layout) {
    var col = idx % CARD_COLS;
    var row = Math.floor(idx / CARD_COLS);
    var x = layout.startX + col * (layout.cardW + layout.margin);
    var y = layout.startY + row * (layout.cardH + layout.margin);
    return { x: x, y: y, w: layout.cardW, h: layout.cardH };
}

// ===== 初始化游戏 =====
function initGame() {
    // 随机选成语对
    var pool = IDIOM_DATA.slice();
    shuffle(pool);
    var selectedPairs = pool.slice(0, PAIR_COUNT);

    // 生成卡片：每对有上半句和下半句两张卡
    G.cards = [];
    for (var i = 0; i < selectedPairs.length; i++) {
        var pair = selectedPairs[i];
        G.cards.push({
            text: pair.first,
            pairId: i,
            type: "first",  // 上半句
            flipped: false,
            matched: false,
            flipProgress: 0, // 0=背面, 1=正面
            matchAnim: 0     // 匹配动画进度
        });
        G.cards.push({
            text: pair.second,
            pairId: i,
            type: "second", // 下半句
            flipped: false,
            matched: false,
            flipProgress: 0,
            matchAnim: 0
        });
    }
    shuffle(G.cards);

    G.selected = [];
    G.matched = 0;
    G.moves = 0;
    G.score = 0;
    G.combo = 0;
    G.timer = 0;
    G.matchAnim = [];
    G.flipAnim = {};
    G.lockInput = false;
    G.state = "playing";
    G.comboText = null;
    particles = [];
}

// ===== 翻牌逻辑 =====
function flipCard(idx) {
    if (G.lockInput) return;
    var card = G.cards[idx];
    if (card.flipped || card.matched) return;
    if (G.selected.length >= 2) return;
    if (G.selected.indexOf(idx) >= 0) return;

    card.flipped = true;
    G.flipAnim[idx] = 0; // 开始翻牌动画
    G.selected.push(idx);

    if (G.selected.length === 2) {
        G.moves++;
        G.lockInput = true;

        var c1 = G.cards[G.selected[0]];
        var c2 = G.cards[G.selected[1]];

        // 延迟判定
        setTimeout(function() {
            if (c1.pairId === c2.pairId) {
                // 匹配成功
                c1.matched = true;
                c2.matched = true;
                G.matched++;
                G.combo++;

                // 计分：基础分 + 连击加成
                var baseScore = 100;
                var comboBonus = (G.combo - 1) * 50;
                G.score += baseScore + comboBonus;

                // 连击文字
                if (G.combo >= 2) {
                    G.comboText = {
                        text: G.combo + "连击!",
                        life: 1.5,
                        maxLife: 1.5
                    };
                }

                // 匹配粒子特效
                var layout = getCardLayout();
                for (var i = 0; i < 2; i++) {
                    var rect = getCardRect(G.selected[i], layout);
                    spawnParticles(
                        rect.x + rect.w/2, rect.y + rect.h/2,
                        15, COLORS.gold, 120, 0.8
                    );
                }

                // 检查胜利
                if (G.matched >= PAIR_COUNT) {
                    setTimeout(function() {
                        endGame();
                    }, 500);
                }
            } else {
                // 不匹配，翻回
                c1.flipped = false;
                c2.flipped = false;
                G.flipAnim[G.selected[0]] = 1; // 开始翻回动画
                G.flipAnim[G.selected[1]] = 1;
                G.combo = 0;
            }
            G.selected = [];
            G.lockInput = false;
        }, 800);
    }
}

// ===== 游戏结束 =====
function endGame() {
    G.state = "gameover";

    // 用时奖励
    var timeBonus = Math.max(0, 300 - Math.floor(G.timer)) * 2;
    G.score += timeBonus;

    // 更新最高分
    if (G.score > G.highScore) {
        G.highScore = G.score;
        G.bestTime = G.timer;
        saveHighScore();
    }

    // 胜利粒子
    for (var i = 0; i < 80; i++) {
        var x = Math.random() * W;
        spawnParticles(x, -20, 1,
            ["#ffd700","#ff6b6b","#4ecdc4","#a855f7","#3b82f6"][Math.floor(Math.random()*5)],
            80 + Math.random()*60, 2 + Math.random()*2
        );
    }
}

// ===== 按钮区域 =====
function getStartBtnRect() {
    var bw = Math.min(260, W * 0.5);
    var bh = 56;
    return { x: W/2 - bw/2, y: H * 0.62, w: bw, h: bh };
}

function getRestartBtnRect() {
    var bw = Math.min(220, W * 0.45);
    var bh = 50;
    return { x: W/2 - bw/2, y: H * 0.68, w: bw, h: bh };
}

function getMenuBtnRect() {
    var bw = Math.min(220, W * 0.45);
    var bh = 50;
    return { x: W/2 - bw/2, y: H * 0.68 + 65, w: bw, h: bh };
}

function getDiffBtnRects() {
    var bw = Math.min(140, W * 0.25);
    var bh = 44;
    var gap = 15;
    var totalW = bw * 3 + gap * 2;
    var baseX = W/2 - totalW/2;
    var baseY = H * 0.5;
    return [
        { x: baseX, y: baseY, w: bw, h: bh, label: "简单", diff: 1 },
        { x: baseX + bw + gap, y: baseY, w: bw, h: bh, label: "中等", diff: 2 },
        { x: baseX + (bw + gap) * 2, y: baseY, w: bw, h: bh, label: "困难", diff: 3 }
    ];
}

// ===== 点击处理 =====
function handleClick(px, py) {
    if (G.state === "menu") {
        // 难度选择按钮
        var diffs = getDiffBtnRects();
        for (var i = 0; i < diffs.length; i++) {
            var d = diffs[i];
            if (px >= d.x && px <= d.x + d.w && py >= d.y && py <= d.y + d.h) {
                G.difficulty = d.diff;
                return;
            }
        }
        // 开始按钮
        var btn = getStartBtnRect();
        if (px >= btn.x && px <= btn.x + btn.w && py >= btn.y && py <= btn.y + btn.h) {
            initGame();
            return;
        }
    } else if (G.state === "playing") {
        // 翻牌
        var layout = getCardLayout();
        for (var i = 0; i < G.cards.length; i++) {
            var rect = getCardRect(i, layout);
            if (px >= rect.x && px <= rect.x + rect.w &&
                py >= rect.y && py <= rect.y + rect.h) {
                flipCard(i);
                return;
            }
        }
    } else if (G.state === "gameover") {
        var rb = getRestartBtnRect();
        if (px >= rb.x && px <= rb.x + rb.w && py >= rb.y && py <= rb.y + rb.h) {
            initGame();
            return;
        }
        var mb = getMenuBtnRect();
        if (px >= mb.x && px <= mb.x + mb.w && py >= mb.y && py <= mb.y + mb.h) {
            G.state = "menu";
            return;
        }
    }
}

// ===== 事件绑定 =====
canvas.addEventListener("click", function(e) {
    var rect = canvas.getBoundingClientRect();
    handleClick(e.clientX - rect.left, e.clientY - rect.top);
});

canvas.addEventListener("touchstart", function(e) {
    e.preventDefault();
    var touch = e.touches[0];
    var rect = canvas.getBoundingClientRect();
    handleClick(touch.clientX - rect.left, touch.clientY - rect.top);
}, { passive: false });

document.addEventListener("keydown", function(e) {
    if (e.key === "Enter" || e.key === " ") {
        if (G.state === "menu") {
            initGame();
        } else if (G.state === "gameover") {
            initGame();
        }
    }
    if (e.key === "Escape") {
        if (G.state === "playing") {
            G.state = "menu";
        } else if (G.state === "gameover") {
            G.state = "menu";
        }
    }
});

// ===== 绘制按钮 =====
function drawButton(ctx, x, y, w, h, text, colors, radius) {
    radius = radius || 12;
    // 阴影
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    roundRect(ctx, x + 2, y + 3, w, h, radius);
    ctx.fill();
    // 渐变背景
    var grad = ctx.createLinearGradient(x, y, x, y + h);
    grad.addColorStop(0, colors[0]);
    grad.addColorStop(1, colors[1]);
    ctx.fillStyle = grad;
    roundRect(ctx, x, y, w, h, radius);
    ctx.fill();
    // 边框高光
    ctx.strokeStyle = "rgba(255,255,255,0.2)";
    ctx.lineWidth = 1;
    roundRect(ctx, x, y, w, h, radius);
    ctx.stroke();
    // 文字
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold " + Math.min(20, h * 0.42) + "px 'Microsoft YaHei', sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(text, x + w/2, y + h/2);
}

function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

// ===== 绘制卡片 =====
function drawCard(ctx, idx, layout) {
    var card = G.cards[idx];
    var rect = getCardRect(idx, layout);
    var cx = rect.x + rect.w / 2;
    var cy = rect.y + rect.h / 2;

    // 翻牌动画
    var flipProg = 0;
    if (G.flipAnim[idx] !== undefined) {
        flipProg = G.flipAnim[idx];
    } else if (card.flipped || card.matched) {
        flipProg = 1;
    }

    // 匹配动画（弹跳）
    var matchScale = 1;
    if (card.matched && card.matchAnim < 1) {
        matchScale = 1 + 0.15 * Math.sin(card.matchAnim * Math.PI);
    }

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(matchScale, matchScale);

    // 翻牌效果：通过 scaleX 模拟3D翻转
    var scaleX = Math.abs(Math.cos(flipProg * Math.PI));
    if (scaleX < 0.02) scaleX = 0.02;
    ctx.scale(scaleX, 1);

    var hw = rect.w / 2;
    var hh = rect.h / 2;

    if (flipProg < 0.5) {
        // 背面
        var grad = ctx.createLinearGradient(-hw, -hh, hw, hh);
        grad.addColorStop(0, COLORS.cardBack);
        grad.addColorStop(1, COLORS.cardBackLight);
        ctx.fillStyle = grad;
        roundRect(ctx, -hw, -hh, rect.w, rect.h, 10);
        ctx.fill();

        // 背面装饰图案
        ctx.strokeStyle = "rgba(255,255,255,0.15)";
        ctx.lineWidth = 1.5;
        roundRect(ctx, -hw + 8, -hh + 8, rect.w - 16, rect.h - 16, 6);
        ctx.stroke();

        // 中间问号
        ctx.fillStyle = "rgba(255,255,255,0.3)";
        ctx.font = "bold " + Math.min(rect.h * 0.4, 36) + "px 'Microsoft YaHei', sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("?", 0, 2);
    } else {
        // 正面
        var isUpper = card.type === "first";
        var baseColor = isUpper ? COLORS.pairA : COLORS.pairB;
        var grad2 = ctx.createLinearGradient(-hw, -hh, hw, hh);
        grad2.addColorStop(0, card.matched ? COLORS.cardMatched : baseColor[0]);
        grad2.addColorStop(1, card.matched ? COLORS.cardMatchedLight : baseColor[1]);
        ctx.fillStyle = grad2;
        roundRect(ctx, -hw, -hh, rect.w, rect.h, 10);
        ctx.fill();

        // 边框
        ctx.strokeStyle = card.matched ? "rgba(255,255,255,0.4)" : "rgba(255,255,255,0.25)";
        ctx.lineWidth = card.matched ? 2 : 1;
        roundRect(ctx, -hw, -hh, rect.w, rect.h, 10);
        ctx.stroke();

        // 类型标记
        ctx.fillStyle = "rgba(255,255,255,0.5)";
        ctx.font = Math.min(12, rect.h * 0.12) + "px 'Microsoft YaHei', sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(isUpper ? "上" : "下", 0, -hh + 14);

        // 成语文本
        ctx.fillStyle = card.matched ? "#ffffff" : COLORS.cardText;
        var fontSize = Math.min(rect.h * 0.28, rect.w * 0.22, 26);
        if (card.text.length > 5) fontSize *= 0.8;
        if (card.text.length > 6) fontSize *= 0.85;
        ctx.font = "bold " + Math.floor(fontSize) + "px 'Microsoft YaHei', sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(card.text, 0, 4);

        // 匹配勾号
        if (card.matched) {
            ctx.fillStyle = "rgba(255,255,255,0.6)";
            ctx.font = "bold " + Math.min(20, rect.h * 0.18) + "px sans-serif";
            ctx.fillText("✓", hw - 14, -hh + 14);
        }
    }

    // 卡片阴影
    ctx.restore();

    if (!card.matched) {
        ctx.fillStyle = COLORS.cardShadow;
        roundRect(ctx, rect.x + 3, rect.y + 3, rect.w, rect.h, 10);
        ctx.fill();
    }
    // 重绘卡片本体（在阴影之上）
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(matchScale * scaleX, matchScale);

    if (flipProg < 0.5) {
        var grad3 = ctx.createLinearGradient(-hw, -hh, hw, hh);
        grad3.addColorStop(0, COLORS.cardBack);
        grad3.addColorStop(1, COLORS.cardBackLight);
        ctx.fillStyle = grad3;
        roundRect(ctx, -hw, -hh, rect.w, rect.h, 10);
        ctx.fill();
        ctx.strokeStyle = "rgba(255,255,255,0.15)";
        ctx.lineWidth = 1.5;
        roundRect(ctx, -hw + 8, -hh + 8, rect.w - 16, rect.h - 16, 6);
        ctx.stroke();
        ctx.fillStyle = "rgba(255,255,255,0.3)";
        ctx.font = "bold " + Math.min(rect.h * 0.4, 36) + "px 'Microsoft YaHei', sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("?", 0, 2);
    } else {
        var isUpper2 = card.type === "first";
        var baseColor2 = isUpper2 ? COLORS.pairA : COLORS.pairB;
        var grad4 = ctx.createLinearGradient(-hw, -hh, hw, hh);
        grad4.addColorStop(0, card.matched ? COLORS.cardMatched : baseColor2[0]);
        grad4.addColorStop(1, card.matched ? COLORS.cardMatchedLight : baseColor2[1]);
        ctx.fillStyle = grad4;
        roundRect(ctx, -hw, -hh, rect.w, rect.h, 10);
        ctx.fill();
        ctx.strokeStyle = card.matched ? "rgba(255,255,255,0.4)" : "rgba(255,255,255,0.25)";
        ctx.lineWidth = card.matched ? 2 : 1;
        roundRect(ctx, -hw, -hh, rect.w, rect.h, 10);
        ctx.stroke();
        ctx.fillStyle = "rgba(255,255,255,0.5)";
        ctx.font = Math.min(12, rect.h * 0.12) + "px 'Microsoft YaHei', sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(isUpper2 ? "上" : "下", 0, -hh + 14);
        ctx.fillStyle = card.matched ? "#ffffff" : COLORS.cardText;
        var fs2 = Math.min(rect.h * 0.28, rect.w * 0.22, 26);
        if (card.text.length > 5) fs2 *= 0.8;
        if (card.text.length > 6) fs2 *= 0.85;
        ctx.font = "bold " + Math.floor(fs2) + "px 'Microsoft YaHei', sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(card.text, 0, 4);
        if (card.matched) {
            ctx.fillStyle = "rgba(255,255,255,0.6)";
            ctx.font = "bold " + Math.min(20, rect.h * 0.18) + "px sans-serif";
            ctx.fillText("✓", hw - 14, -hh + 14);
        }
    }
    ctx.restore();
}

function drawGame(ctx, time) {
    drawBackground(ctx, time);

    var layout = getCardLayout();

    // 顶部信息栏
    var barH = 70;
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.fillRect(0, 0, W, barH);

    // 信息文字
    var infoFontSize = Math.min(16, W * 0.03);
    ctx.font = "bold " + infoFontSize + "px 'Microsoft YaHei', sans-serif";
    ctx.textBaseline = "middle";

    var infoY = barH / 2;
    var colW = W / 5;

    // 分数
    ctx.fillStyle = COLORS.gold;
    ctx.textAlign = "center";
    ctx.fillText("分数", colW * 0.5, infoY - 10);
    ctx.font = infoFontSize + "px 'Microsoft YaHei', sans-serif";
    ctx.fillText(G.score, colW * 0.5, infoY + 12);

    // 翻牌次数
    ctx.fillStyle = "#ff6b6b";
    ctx.font = "bold " + infoFontSize + "px 'Microsoft YaHei', sans-serif";
    ctx.fillText("翻牌", colW * 1.5, infoY - 10);
    ctx.font = infoFontSize + "px 'Microsoft YaHei', sans-serif";
    ctx.fillText(G.moves, colW * 1.5, infoY + 12);

    // 已配对
    ctx.fillStyle = "#4ecdc4";
    ctx.font = "bold " + infoFontSize + "px 'Microsoft YaHei', sans-serif";
    ctx.fillText("配对", colW * 2.5, infoY - 10);
    ctx.font = infoFontSize + "px 'Microsoft YaHei', sans-serif";
    ctx.fillText(G.matched + "/" + PAIR_COUNT, colW * 2.5, infoY + 12);

    // 连击
    ctx.fillStyle = G.combo >= 2 ? "#ffd700" : COLORS.uiDim;
    ctx.font = "bold " + infoFontSize + "px 'Microsoft YaHei', sans-serif";
    ctx.fillText("连击", colW * 3.5, infoY - 10);
    ctx.font = infoFontSize + "px 'Microsoft YaHei', sans-serif";
    ctx.fillText(G.combo, colW * 3.5, infoY + 12);

    // 用时
    ctx.fillStyle = COLORS.uiText;
    ctx.font = "bold " + infoFontSize + "px 'Microsoft YaHei', sans-serif";
    ctx.fillText("时间", colW * 4.5, infoY - 10);
    var min = Math.floor(G.timer / 60);
    var sec = Math.floor(G.timer % 60);
    ctx.font = infoFontSize + "px 'Microsoft YaHei', sans-serif";
    ctx.fillText((min < 10 ? "0" : "") + min + ":" + (sec < 10 ? "0" : "") + sec, colW * 4.5, infoY + 12);

    // 绘制卡片
    for (var i = 0; i < G.cards.length; i++) {
        drawCard(ctx, i, layout);
    }

    // 连击文字动画
    if (G.comboText && G.comboText.life > 0) {
        var ctAlpha = Math.min(1, G.comboText.life / 0.5);
        var ctScale = 1 + (1 - G.comboText.life / G.comboText.maxLife) * 0.3;
        ctx.save();
        ctx.globalAlpha = ctAlpha;
        ctx.fillStyle = "#ffd700";
        ctx.font = "bold " + Math.floor(32 * ctScale) + "px 'Microsoft YaHei', sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(G.comboText.text, W/2, H * 0.42);
        ctx.restore();
    }

    // 进度条
    var progW = W * 0.6;
    var progH = 6;
    var progX = (W - progW) / 2;
    var progY = barH - 8;
    ctx.fillStyle = "rgba(255,255,255,0.15)";
    roundRect(ctx, progX, progY, progW, progH, 3);
    ctx.fill();
    var progFill = G.matched / PAIR_COUNT;
    var progGrad = ctx.createLinearGradient(progX, 0, progX + progW * progFill, 0);
    progGrad.addColorStop(0, "#4ecdc4");
    progGrad.addColorStop(1, "#2ecc71");
    ctx.fillStyle = progGrad;
    roundRect(ctx, progX, progY, progW * progFill, progH, 3);
    ctx.fill();
}

function drawGameOver(ctx, time) {
    drawBackground(ctx, time);

    // 半透明遮罩

    ctx.fillRect(0, 0, W, H);

    var panelX = (W - panelW) / 2;
    var panelY = (H - panelH) / 2;

    // 面板阴影
    ctx.fillStyle = "rgba(0,0,0,0.4)";
    roundRect(ctx, panelX + 4, panelY + 4, panelW, panelH, 16);
    ctx.fill();

    // 面板背景
    var pgrad = ctx.createLinearGradient(panelX, panelY, panelX, panelY + panelH);
    pgrad.addColorStop(0, "#1a1a4e");
    pgrad.addColorStop(1, "#0a0a2e");
    ctx.fillStyle = pgrad;
    roundRect(ctx, panelX, panelY, panelW, panelH, 16);
    ctx.fill();

    ctx.strokeStyle = "rgba(255,255,255,0.15)";
    ctx.lineWidth = 1;
    roundRect(ctx, panelX, panelY, panelW, panelH, 16);
    ctx.stroke();

    // 恭喜文字
    ctx.fillStyle = "#ffd700";
    var titleFs = Math.min(32, panelW * 0.085);
    ctx.font = "bold " + titleFs + "px 'Microsoft YaHei', sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("恭喜通关!", W/2, panelY + 40);

    // 统计信息
    var statFs = Math.min(18, panelW * 0.047);
    var statY = panelY + 90;
    var statGap = 38;

    ctx.fillStyle = COLORS.uiText;
    ctx.font = statFs + "px 'Microsoft YaHei', sans-serif";
    ctx.fillText("最终分数: " + G.score, W/2, statY);
    ctx.fillText("翻牌次数: " + G.moves, W/2, statY + statGap);

    var min = Math.floor(G.timer / 60);
    var sec = Math.floor(G.timer % 60);
    ctx.fillText("用时: " + (min < 10 ? "0" : "") + min + ":" + (sec < 10 ? "0" : "") + sec, W/2, statY + statGap * 2);
    ctx.fillText("配对数: " + PAIR_COUNT, W/2, statY + statGap * 3);

    // 最高分标记
    if (G.score >= G.highScore && G.highScore > 0) {
        ctx.fillStyle = "#ffd700";
        ctx.font = "bold " + (statFs + 2) + "px 'Microsoft YaHei', sans-serif";
        ctx.fillText("新纪录!", W/2, statY + statGap * 4);
    }

    // 评级
    var stars = 1;
    if (G.moves <= PAIR_COUNT + 4) stars = 3;
    else if (G.moves <= PAIR_COUNT * 2) stars = 2;

    var starY = statY + statGap * (G.score >= G.highScore && G.highScore > 0 ? 5 : 4) + 5;
    var starSize = Math.min(28, panelW * 0.07);
    ctx.font = starSize + "px sans-serif";
    var starStr = "";
    for (var s = 0; s < 3; s++) {
        starStr += s < stars ? "★ " : "☆ ";
    }
    ctx.fillStyle = "#ffd700";
    ctx.fillText(starStr.trim(), W/2, starY);

    // 按钮
    var rb = getRestartBtnRect();
    drawButton(ctx, rb.x, rb.y, rb.w, rb.h, "再来一局", COLORS.btnRestart, 12);
    var mb = getMenuBtnRect();
    drawButton(ctx, mb.x, mb.y, mb.w, mb.h, "返回菜单", ["#3a3a6a", "#2a2a5a"], 12);
}

// ===== 主循环 =====
var lastTime = 0;

function gameLoop(timestamp) {
    var dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;
    var time = timestamp / 1000;

    // 更新
    updateParticles(dt);
    updateBgParticles(dt, time);

    if (G.state === "playing") {
        // 计时
        G.timer += dt;

        // 更新翻牌动画
        var animKeys = Object.keys(G.flipAnim);
        for (var i = 0; i < animKeys.length; i++) {
            var idx = parseInt(animKeys[i]);
            var card = G.cards[idx];
            if (card.flipped || card.matched) {
                G.flipAnim[idx] = Math.min(1, G.flipAnim[idx] + dt * 4);
            } else {
                G.flipAnim[idx] = Math.max(0, G.flipAnim[idx] - dt * 4);
                if (G.flipAnim[idx] <= 0) delete G.flipAnim[idx];
            }
        }

        // 更新匹配动画
        for (var j = 0; j < G.cards.length; j++) {
            if (G.cards[j].matched && G.cards[j].matchAnim < 1) {
                G.cards[j].matchAnim = Math.min(1, G.cards[j].matchAnim + dt * 3);
            }
        }

        // 连击文字
        if (G.comboText) {
            G.comboText.life -= dt;
            if (G.comboText.life <= 0) G.comboText = null;
        }
    }

    // 渲染
    ctx.clearRect(0, 0, W, H);

    if (G.state === "menu") {
        drawMenu(ctx, time);
    } else if (G.state === "playing") {
        drawGame(ctx, time);
    } else if (G.state === "gameover") {
        drawGame(ctx, time);
        drawGameOver(ctx, time);
    }

    drawParticles(ctx);

    requestAnimationFrame(gameLoop);
}

// ===== 启动 =====
requestAnimationFrame(gameLoop);

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
