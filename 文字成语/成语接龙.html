// 按首字索引
const indexByFirst={};
const indexByLast={};
IDIOMS.forEach(idiom=>{
    const first=idiom[0],last=idiom[idiom.length-1];
    if(!indexByFirst[first])indexByFirst[first]=[];
    indexByFirst[first].push(idiom);
    if(!indexByLast[last])indexByLast[last]=[];
    indexByLast[last].push(idiom);
});

function drawBg(){
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#0f0c29');g.addColorStop(0.5,'#302b63');g.addColorStop(1,'#24243e');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}

function drawText(text,x,y,size,color,align){
    ctx.fillStyle=color||'#fff';ctx.font=`bold ${size}px 'Microsoft YaHei',sans-serif`;
    ctx.textAlign=align||'center';ctx.textBaseline='middle';ctx.fillText(text,x,y);
}

class Particle{
    constructor(x,y,color){this.x=x;this.y=y;this.vx=(Math.random()-0.5)*4;this.vy=(Math.random()-0.5)*4;this.life=1;this.color=color||'#ffd700';this.size=Math.random()*3+1}
    update(){this.x+=this.vx;this.y+=this.vy;this.life-=0.02;this.vy+=0.05}
    draw(){ctx.globalAlpha=this.life;ctx.fillStyle=this.color;ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}
}

function spawnParticles(x,y,count,color){for(let i=0;i<count;i++)particles.push(new Particle(x,y,color))}

function canContinue(idiom){
    const last=idiom[idiom.length-1];
    return indexByFirst[last]&&indexByFirst[last].filter(i=>!usedIdioms.includes(i)).length>0;
}

function aiPlay(){
    const last=currentIdiom[currentIdiom.length-1];
    const candidates=(indexByFirst[last]||[]).filter(i=>!usedIdioms.includes(i));
    if(candidates.length===0){message='AI无词可接，你赢了！';score+=100;gameState='win';return}
    const pick=candidates[Math.floor(Math.random()*candidates.length)];
    usedIdioms.push(pick);currentIdiom=pick;turn='player';
    message=`AI接：${pick}`;msgTimer=120;
    spawnParticles(W/2,H/2,10,'#4ecdc4');
    if(!canContinue(pick)){message=`AI接：${pick}，你无词可接！`;gameState='lose'}
}

function checkPlayerInput(){
    const input=playerInput.trim();
    if(!input)return;
    if(usedIdioms.includes(input)){message='这个成语已经用过了！';msgTimer=90;playerInput='';return}
    if(!IDIOMS.includes(input)){message='不在成语库中！';msgTimer=90;playerInput='';return}
    const last=currentIdiom[currentIdiom.length-1];
    if(input[0]!==last){message=`首字应为"${last}"！`;msgTimer=90;playerInput='';return}
    usedIdioms.push(input);currentIdiom=input;combo++;score+=10+combo*2;
    if(score>highScore){highScore=score;localStorage.setItem('idiom_chain_hi',highScore)}
    spawnParticles(W/2,H/2,15,'#ffd700');
    playerInput='';
    if(!canContinue(input)){message='AI无词可接，你赢了！';gameState='win';return}
    turn='ai';aiThinkTimer=60;
}

function drawMenu(){
    drawBg();
    drawText('成语接龙',W/2,H*0.25,Math.min(W*0.08,48),'#ffd700');
    drawText('首尾相连，妙语连珠',W/2,H*0.35,Math.min(W*0.035,20),'#aaa');
    const bw=Math.min(W*0.4,200),bh=50,bx=W/2-bw/2,by=H*0.5;
    ctx.fillStyle='#4ecdc4';ctx.beginPath();ctx.roundRect(bx,by,bw,bh,12);ctx.fill();
    drawText('开始游戏',W/2,by+bh/2,20,'#fff');
    drawText(`最高分: ${highScore}`,W/2,H*0.65,18,'#aaa');
    drawText('规则：接上一个成语的最后一个字',W/2,H*0.75,14,'#888');
    drawText('500+成语库 | 人机对战',W/2,H*0.8,14,'#888');
}

function drawGame(){
    drawBg();
    // 标题栏
    drawText('成语接龙',W/2,30,24,'#ffd700');
    drawText(`得分: ${score}  连击: ${combo}`,W/2,60,16,'#aaa');
    // 当前成语
    ctx.fillStyle='rgba(255,255,255,0.1)';ctx.beginPath();ctx.roundRect(W*0.1,90,W*0.8,80,16);ctx.fill();
    drawText('当前成语',W/2,110,14,'#888');
    drawText(currentIdiom,W/2,145,Math.min(W*0.06,36),'#fff');
    // 提示下一个字
    const nextChar=currentIdiom[currentIdiom.length-1];
    drawText(`请接：以"${nextChar}"开头`,W/2,190,16,'#4ecdc4');
    // 输入框
    const iy=H*0.55,iw=Math.min(W*0.7,350),ih=50,ix=W/2-iw/2;
    ctx.fillStyle='rgba(255,255,255,0.15)';ctx.beginPath();ctx.roundRect(ix,iy,iw,ih,12);ctx.fill();
    ctx.strokeStyle='#4ecdc4';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(ix,iy,iw,ih,12);ctx.stroke();
    drawText(playerInput||'输入成语...',W/2,iy+ih/2,18,playerInput?'#fff':'#666');
    // 消息
    if(msgTimer>0){drawText(message,W/2,H*0.72,18,'#ffd700');msgTimer--}
    // 已用成语
    const usedY=H*0.82,maxShow=Math.min(usedIdioms.length,8);
    if(usedY<H-40){
        drawText('已用成语:',W*0.15,usedY,12,'#666','left');
        const recent=usedIdioms.slice(-maxShow);
        drawText(recent.join(' → '),W/2,usedY+20,12,'#888');
    }
    // 统计
    drawText(`已用: ${usedIdioms.length} | 库: ${IDIOMS.length}`,W/2,H-20,12,'#555');
}

function drawEnd(){
    drawBg();
    const isWin=gameState==='win';
    drawText(isWin?'🎉 你赢了！':'😢 游戏结束',W/2,H*0.3,Math.min(W*0.07,40),isWin?'#ffd700':'#ff6b6b');
    drawText(`得分: ${score}`,W/2,H*0.42,24,'#fff');
    drawText(`最大连击: ${combo}`,W/2,H*0.5,18,'#aaa');
    drawText(`已用成语: ${usedIdioms.length}`,W/2,H*0.57,18,'#aaa');
    const bw=Math.min(W*0.4,200),bh=50,bx=W/2-bw/2,by=H*0.68;
    ctx.fillStyle='#4ecdc4';ctx.beginPath();ctx.roundRect(bx,by,bw,bh,12);ctx.fill();
    drawText('再来一局',W/2,by+bh/2,20,'#fff');
}

function draw(){
    if(gameState==='menu'){inputWrap.style.display='none';drawMenu()}
    else if(gameState==='playing')drawGame();
    else{inputWrap.style.display='none';drawEnd()}
    particles.forEach(p=>{p.update();p.draw()});particles=particles.filter(p=>p.life>0);
}

function startGame(){
    gameState='playing';score=0;combo=0;usedIdioms=[];playerInput='';turn='player';
    const start=IDIOMS[Math.floor(Math.random()*IDIOMS.length)];
    currentIdiom=start;usedIdioms.push(start);
    message=`起始成语：${start}`;msgTimer=120;
    positionInput(); inputWrap.style.display='block'; wordInput.value=''; wordInput.focus();
}

function positionInput(){
    iw=Math.min(W*0.7,350); ih=50;
    inputWrap.style.bottom=(H*0.45-ih/2)+'px';
    inputWrap.style.width=iw+'px'; inputWrap.style.height=ih+'px';
    inputWrap.style.left='50%';
}

let keysDown={};
const inputWrap=document.getElementById('inputWrap');
const wordInput=document.getElementById('wordInput');

// 真实HTML输入框，IME天然支持
wordInput.addEventListener('input',()=>{
    if(gameState!=='playing')return;
    playerInput=wordInput.value.trim();
});
wordInput.addEventListener('keydown',e=>{
    if(gameState!=='playing')return;
    if(e.key==='Enter'){checkPlayerInput();wordInput.value='';e.preventDefault()}
});
// 点击canvas自动聚焦输入框
addEventListener('click',e=>{
    const x=e.clientX,y=e.clientY;
    if(gameState==='menu'){
        const bw=Math.min(W*0.4,200),bh=50,bx=W/2-bw/2,by=H*0.5;
        if(x>=bx&&x<=bx+bw&&y>=by&&y<=by+bh)startGame(); else wordInput.focus();
    }else if(gameState==='playing'){
        wordInput.focus();
        if(/Mobi|Android/i.test(navigator.userAgent)){
            const input=prompt('输入成语：');
            if(input){playerInput=input;checkPlayerInput()}
        }
    }else{
        const bw=Math.min(W*0.4,200),bh=50,bx=W/2-bw/2,by=H*0.68;
        if(x>=bx&&x<=bx+bw&&y>=by&&y<=by+bh)startGame();
    }
});

// 触屏输入
let touchStartY=0;
addEventListener('touchstart',e=>{
    touchStartY=e.touches[0].clientY;
    if(gameState==='playing'&&/Mobi|Android/i.test(navigator.userAgent)){
        const input=prompt('输入成语：');
        if(input){playerInput=input;checkPlayerInput()}
    }
});

function loop(){
    if(gameState==='playing'&&turn==='ai'){
        aiThinkTimer--;
        if(aiThinkTimer<=0){aiPlay()}
    }
    draw();
    requestAnimationFrame(loop);
}
loop();

  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>

  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
