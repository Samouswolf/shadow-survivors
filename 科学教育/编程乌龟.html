<canvas id="c"></canvas>

<script>
if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;

<script>
(function(){
"use strict";

const W=480,H=800;

let audioCtx=null;
function initAudio(){
    if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
}
function playTone(freq,dur,type,vol){
    if(!audioCtx)return;
    try{
        const o=audioCtx.createOscillator();
        const g=audioCtx.createGain();
        o.type=type||'square';
        o.frequency.value=freq;
        g.gain.value=vol||0.15;
        g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
        o.connect(g);g.connect(audioCtx.destination);
        o.start();o.stop(audioCtx.currentTime+dur);
    }catch(e){}
}
function sfxStart(){playTone(523,0.1,'sine',0.2);setTimeout(()=>playTone(659,0.1,'sine',0.2),100);setTimeout(()=>playTone(784,0.15,'sine',0.2),200)}
function sfxScore(){playTone(880,0.08,'sine',0.18);setTimeout(()=>playTone(1047,0.1,'sine',0.18),80);setTimeout(()=>playTone(1319,0.15,'sine',0.18),160)}
function sfxFail(){playTone(220,0.15,'sawtooth',0.18);setTimeout(()=>playTone(165,0.25,'sawtooth',0.18),120)}
function sfxClick(){playTone(660,0.05,'triangle',0.12)}
function sfxMove(){playTone(700+Math.random()*100,0.03,'sine',0.08)}
function sfxTurn(){playTone(500,0.04,'triangle',0.1)}
function sfxPen(){playTone(900,0.05,'sine',0.1)}
function sfxRun(){playTone(600,0.08,'sine',0.15);setTimeout(()=>playTone(800,0.08,'sine',0.15),80);setTimeout(()=>playTone(1000,0.12,'sine',0.15),160)}
function sfxWin(){for(let i=0;i<5;i++){setTimeout(()=>playTone(523+i*131,0.12,'sine',0.18),i*100)}}

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let scale=1;
function resize(){
    const r=W/H;
    let cw=window.innerWidth,ch=window.innerHeight;
    if(cw/ch>r){ch=cw/r}else{cw=ch*r}
    canvas.width=cw;canvas.height=ch;
    scale=cw/W;
    ctx.setTransform(scale,0,0,scale,0,0);
}
window.addEventListener('resize',resize);
resize();

function getPos(e){
    const r=canvas.getBoundingClientRect();
    return {x:(e.clientX-r.left)/scale,y:(e.clientY-r.top)/scale};
}

const BLOCK_TYPES={
    FORWARD:{id:'FORWARD',name:'前进',color:'#4caf50',param:50,paramLabel:'步数',emoji:'➡️'},
    BACK:{id:'BACK',name:'后退',color:'#8bc34a',param:50,paramLabel:'步数',emoji:'⬅️'},
    LEFT:{id:'LEFT',name:'左转',color:'#2196f3',param:90,paramLabel:'角度',emoji:'↺'},
    RIGHT:{id:'RIGHT',name:'右转',color:'#03a9f4',param:90,paramLabel:'角度',emoji:'↻'},
    PEN_UP:{id:'PEN_UP',name:'抬笔',color:'#ff9800',param:0,emoji:'✏️⬆️'},
    PEN_DOWN:{id:'PEN_DOWN',name:'落笔',color:'#f57c00',param:0,emoji:'✏️⬇️'},
    COLOR:{id:'COLOR',name:'颜色',color:'#e91e63',param:0,paramLabel:'颜色',emoji:'🎨',options:['#ff5252','#ff9800','#ffeb3b','#4caf50','#2196f3','#9c27b0','#000000']},
    REPEAT:{id:'REPEAT',name:'重复',color:'#9c27b0',param:4,paramLabel:'次数',emoji:'🔁',hasBlock:true}
};

const COLOR_PALETTE=['#ff5252','#ff9800','#ffeb3b','#4caf50','#2196f3','#9c27b0','#000000','#ffffff'];

const LEVELS=[
    {
        id:1,name:'第一关：画一条线',
        desc:'用"前进100步"画出一条横线',
        targetLines:[[{x:240,y:400},{x:340,y:400}]],
        minBlocks:1,idealBlocks:1,
        startX:240,startY:400,startAngle:0,
        hint:'只需要一个"前进"积木，步数设为100'
    },
    {
        id:2,name:'第二关：画正方形',
        desc:'画一个边长80步的正方形',
        targetShape:'square',size:80,
        startX:240,startY:420,startAngle:-90,
        hint:'前进→右转90°，重复4次！试试"重复"积木'
    },
    {
        id:3,name:'第三关：画三角形',
        desc:'画一个边长100步的正三角形',
        targetShape:'triangle',size:100,
        startX:240,startY:430,startAngle:-90,
        hint:'三角形有3条边，每次转120°（360÷3）'
    },
    {
        id:4,name:'第四关：画五角星',
        desc:'画一个边长70步的五角星',
        targetShape:'star',size:70,
        startX:240,startY:400,startAngle:-90,
        hint:'五角星有5条边，每次转144°（72×2）'
    },
    {
        id:5,name:'第五关：画花朵',
        desc:'重复画正方形，每次转15度，共24次',
        targetShape:'flower',size:60,
        startX:240,startY:400,startAngle:0,
        hint:'外层重复24次，内层重复4次画正方形'
    },
    {
        id:6,name:'第六关：螺旋线',
        desc:'每次前进步数逐渐增加，右转20度',
        targetShape:'spiral',size:40,
        startX:200,startY:420,startAngle:0,
        hint:'重复20次，前进从5步开始每次加3步，右转20°'
    },
    {
        id:7,name:'第七关：小房子',
        desc:'画一个带三角形屋顶的房子',
        targetShape:'house',size:80,
        startX:200,startY:450,startAngle:-90,
        hint:'先画正方形主体，再画三角形屋顶'
    },
    {
        id:8,name:'第八关：国旗',
        desc:'画一个矩形旗面，内有5个小方块',
        targetShape:'flag',size:100,
        startX:160,startY:440,startAngle:-90,
        hint:'先画大矩形，再换颜色画5个小方块'
    },
    {
        id:9,name:'第九关：彩虹圆',
        desc:'用7种颜色画7个同心圆',
        targetShape:'rainbow',size:100,
        startX:240,startY:400,startAngle:0,
        hint:'重复7次，每次换颜色画圆，圆可以用36次转10°前进模拟'
    },
    {
        id:10,name:'第十关：复杂图案',
        desc:'自由创作一个你喜欢的图案，相似度≥90%',
        targetShape:'complex',size:80,
        startX:240,startY:400,startAngle:-90,
        hint:'综合运用所有积木，加油！'
    }
];

const TURTLE_SIZE=20;

let G;
function initState(){
    G={
        state:STATE_MENU,
        score:0,
        high:parseInt(Storage.load('biancheng_wugui_highscore','0'))||0,
        level:0,
        levelScore:0,
        totalScore:0,
        stars:0,
        turtle:{x:240,y:400,angle:0,penDown:true,color:'#000000',trail:[]},
        blocks:[],
        selectedBlock:null,
        dragBlock:null,
        dragOffset:{x:0,y:0},
        running:false,
        runIndex:0,
        runStep:0,
        repeatStack:[],
        drawnLines:[],
        currentLine:null,
        showingHint:false,
        animT:0,
        resultPopup:null,
        levelComplete:false,
        paletteIdx:0
    };
}

const TOOLBOX_Y=500;
const TOOLBOX_H=260;
const CANVAS_H=480;
const BLOCK_W=90;
const BLOCK_H=50;
const PARAM_W=60;

function getToolboxBlocks(){
    return [
        {type:'FORWARD',x:10,y:TOOLBOX_Y+10},
        {type:'BACK',x:110,y:TOOLBOX_Y+10},
        {type:'LEFT',x:210,y:TOOLBOX_Y+10},
        {type:'RIGHT',x:310,y:TOOLBOX_Y+10},
        {type:'PEN_UP',x:10,y:TOOLBOX_Y+70},
        {type:'PEN_DOWN',x:110,y:TOOLBOX_Y+70},
        {type:'COLOR',x:210,y:TOOLBOX_Y+70},
        {type:'REPEAT',x:310,y:TOOLBOX_Y+70}
    ];
}

function drawTurtle(){
    const t=G.turtle;
    ctx.save();
    ctx.translate(t.x,t.y);
    ctx.rotate(t.angle*Math.PI/180);
    ctx.beginPath();
    ctx.moveTo(TURTLE_SIZE,0);
    ctx.lineTo(-TURTLE_SIZE*0.7,TURTLE_SIZE*0.6);
    ctx.lineTo(-TURTLE_SIZE*0.4,0);
    ctx.lineTo(-TURTLE_SIZE*0.7,-TURTLE_SIZE*0.6);
    ctx.closePath();
    ctx.fillStyle='#4caf50';
    ctx.fill();
    ctx.strokeStyle='#2e7d32';
    ctx.lineWidth=2;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(TURTLE_SIZE*0.3,-3,3,0,Math.PI*2);
    ctx.arc(TURTLE_SIZE*0.3,3,3,0,Math.PI*2);
    ctx.fillStyle='#fff';
    ctx.fill();
    ctx.restore();
}

function drawDrawnLines(){
    ctx.lineCap='round';
    ctx.lineJoin='round';
    for(const line of G.drawnLines){
        if(line.points.length<2)continue;
        ctx.beginPath();
        ctx.strokeStyle=line.color;
        ctx.lineWidth=line.width||3;
        ctx.moveTo(line.points[0].x,line.points[0].y);
        for(let i=1;i<line.points.length;i++){
            ctx.lineTo(line.points[i].x,line.points[i].y);
        }
        ctx.stroke();
    }
    if(G.currentLine&&G.currentLine.points.length>=2){
        ctx.beginPath();
        ctx.strokeStyle=G.currentLine.color;
        ctx.lineWidth=3;
        ctx.moveTo(G.currentLine.points[0].x,G.currentLine.points[0].y);
        for(let i=1;i<G.currentLine.points.length;i++){
            ctx.lineTo(G.currentLine.points[i].x,G.currentLine.points[i].y);
        }
        ctx.stroke();
    }
}

function drawTargetPreview(){
    const level=LEVELS[G.level];
    if(!level)return;
    ctx.save();
    ctx.globalAlpha=0.15;
    ctx.strokeStyle='#ffeb3b';
    ctx.lineWidth=8;
    ctx.lineCap='round';
    ctx.lineJoin='round';
    if(level.targetLines){
        for(const line of level.targetLines){
            ctx.beginPath();
            ctx.moveTo(line[0].x,line[0].y);
            for(let i=1;i<line.length;i++)ctx.lineTo(line[i].x,line[i].y);
            ctx.stroke();
        }
    }else if(level.targetShape){
        drawShapePreview(level);
    }
    ctx.restore();
}

function drawShapePreview(level){
    const cx=level.startX,cy=level.startY;
    const size=level.size;
    let angle=level.startAngle;
    let x=cx,y=cy;
    ctx.beginPath();
    ctx.moveTo(x,y);
    switch(level.targetShape){
        case 'square':
            for(let i=0;i<4;i++){
                const rad=angle*Math.PI/180;
                x+=Math.cos(rad)*size;y+=Math.sin(rad)*size;
                ctx.lineTo(x,y);
                angle+=90;
            }
            break;
        case 'triangle':
            for(let i=0;i<3;i++){
                const rad=angle*Math.PI/180;
                x+=Math.cos(rad)*size;y+=Math.sin(rad)*size;
                ctx.lineTo(x,y);
                angle+=120;
            }
            break;
        case 'star':
            for(let i=0;i<5;i++){
                const rad=angle*Math.PI/180;
                x+=Math.cos(rad)*size;y+=Math.sin(rad)*size;
                ctx.lineTo(x,y);
                angle+=144;
            }
            break;
        case 'flower':
            for(let r=0;r<24;r++){
                let a2=angle+r*15;
                let x2=cx,y2=cy;
                ctx.moveTo(x2,y2);
                for(let i=0;i<4;i++){
                    const rad=a2*Math.PI/180;
                    x2+=Math.cos(rad)*size;y2+=Math.sin(rad)*size;
                    ctx.lineTo(x2,y2);
                    a2+=90;
                }
            }
            break;
        case 'house':
            let a2=angle,x2=cx,y2=cy;
            for(let i=0;i<4;i++){
                const rad=a2*Math.PI/180;
                x2+=Math.cos(rad)*size;y2+=Math.sin(rad)*size;
                ctx.lineTo(x2,y2);
                a2+=90;
            }
            const rad2=angle*Math.PI/180;
            x2=cx;y2=cy;
            x2+=Math.cos(rad2)*size;y2+=Math.sin(rad2)*size;
            ctx.moveTo(x2,y2);
            const rad3=(angle-90)*Math.PI/180;
            const mx=x2+Math.cos(rad3)*size/2,my=y2+Math.sin(rad3)*size/2;
            const ex=mx+Math.cos(rad3)*size/2,ey=my+Math.sin(rad3)*size/2;
            const rad4=(angle+180)*Math.PI/180;
            const rx=ex+Math.cos(rad4)*size,ry=ey+Math.sin(rad4)*size;
            ctx.lineTo(ex,ey);ctx.lineTo(rx,ry);
            break;
    }
    ctx.stroke();
}

function drawBlock(block,x,y,isToolbox,isSelected,isDragging){
    const type=BLOCK_TYPES[block.type];
    const w=BLOCK_W+(type.param&&!type.options?PARAM_W:0)+(type.options?50:0);
    const h=BLOCK_H+(block.children&&block.children.length?block.children.length*(BLOCK_H+5)+15:0);
    ctx.save();
    if(isDragging)ctx.globalAlpha=0.85;
    ctx.fillStyle=isSelected?'#fff':type.color;
    roundRect(ctx,x,y,w,h,8);
    ctx.fill();
    ctx.strokeStyle=isSelected?'#ffeb3b':'rgba(0,0,0,0.3)';
    ctx.lineWidth=isSelected?3:1;
    ctx.stroke();
    ctx.fillStyle=isSelected?type.color:'#fff';
    ctx.font='bold 13px "Microsoft YaHei"';
    ctx.textAlign='left';
    ctx.textBaseline='middle';
    ctx.fillText(type.emoji+' '+type.name,x+10,y+BLOCK_H/2);
    if(type.param&&type.options){
        const color=COLOR_PALETTE[block.colorIdx||0];
        ctx.fillStyle=color;
        roundRect(ctx,x+w-45,y+10,35,30,5);
        ctx.fill();
        ctx.strokeStyle='rgba(0,0,0,0.3)';
        ctx.lineWidth=1;
        ctx.stroke();
    }else if(type.param||type.param===0){
        if(type.id==='FORWARD'||type.id==='BACK'||type.id==='LEFT'||type.id==='RIGHT'||type.id==='REPEAT'){
            ctx.fillStyle='rgba(255,255,255,0.9)';
            roundRect(ctx,x+BLOCK_W-5,y+10,PARAM_W+5,30,5);
            ctx.fill();
            ctx.fillStyle='#333';
            ctx.font='bold 15px "Microsoft YaHei"';
            ctx.textAlign='center';
            const val=block.param!=null?block.param:type.param;
            ctx.fillText(val,x+BLOCK_W+PARAM_W/2-5,y+BLOCK_H/2);
            if(type.id==='LEFT'||type.id==='RIGHT'){
                ctx.font='10px "Microsoft YaHei"';
                ctx.fillText('°',x+BLOCK_W+PARAM_W/2+18,y+BLOCK_H/2-8);
            }
        }
    }
    if(block.children&&block.children.length>0){
        let cy=y+BLOCK_H+8;
        for(const child of block.children){
            drawBlock(child,x+15,cy,false,false,false);
            cy+=BLOCK_H+5;
        }
    }
    ctx.restore();
    return {w,h};
}

function drawProgramBlocks(){
    let y=10;
    for(let i=0;i<G.blocks.length;i++){
        const b=G.blocks[i];
        const sz=drawBlock(b,360,y,false,G.selectedBlock===i);
        b._x=360;b._y=y;b._w=sz.w;b._h=sz.h;
        y+=sz.h+8;
    }
}

function drawToolbox(){
    ctx.fillStyle='rgba(255,255,255,0.08)';
    roundRect(ctx,0,TOOLBOX_Y,W,TOOLBOX_H,12);
    ctx.fill();
    ctx.fillStyle='#fff';
    ctx.font='bold 14px "Microsoft YaHei"';
    ctx.textAlign='left';
    ctx.fillText('📦 积木工具箱（拖入右侧程序区）',15,TOOLBOX_Y-8);
    const blocks=getToolboxBlocks();
    for(const tb of blocks){

function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);
}

function wrapText(ctx,text,x,y,maxWidth,lineHeight){
    const chars=text.split('');
    let line='';
    for(let i=0;i<chars.length;i++){
        const test=line+chars[i];
        if(ctx.measureText(test).width>maxWidth){
            ctx.fillText(line,x,y);
            line=chars[i];y+=lineHeight;
        }else{
            line=test;
        }
    }
    if(line)ctx.fillText(line,x,y);
}

function flattenBlocks(blocks,output){
    output=output||[];
    for(const b of blocks){
        if(b.type==='REPEAT'){
            const times=b.param||BLOCK_TYPES.REPEAT.param;
            for(let i=0;i<times;i++){
                flattenBlocks(b.children||[],output);
            }
        }else{
            output.push(b);
        }
    }
    return output;
}

function runStepOnce(){
    if(!G.running)return;
    const flat=flattenBlocks(G.blocks);
    if(G.runIndex>=flat.length){
        G.running=false;
        evaluateResult();
        return;
    }
    const cmd=flat[G.runIndex];
    executeCommand(cmd);
    G.runIndex++;
}

function executeCommand(cmd){
    const t=G.turtle;
    switch(cmd.type){
        case 'FORWARD':{
            const steps=cmd.param||BLOCK_TYPES.FORWARD.param;
            const rad=t.angle*Math.PI/180;
            const dx=Math.cos(rad),dy=Math.sin(rad);
            for(let i=0;i<steps;i++){
                t.x+=dx;t.y+=dy;
                if(t.penDown){
                    if(!G.currentLine){
                        G.currentLine={color:t.color,points:[{x:t.x,y:t.y}]};
                    }else{
                        G.currentLine.points.push({x:t.x,y:t.y});
                    }
                }
            }
            if(G.currentLine){
                G.drawnLines.push(G.currentLine);
                G.currentLine=null;
            }
            sfxMove();
            break;
        }
        case 'BACK':{
            const steps=cmd.param||BLOCK_TYPES.BACK.param;
            const rad=(t.angle+180)*Math.PI/180;
            const dx=Math.cos(rad),dy=Math.sin(rad);
            for(let i=0;i<steps;i++){
                t.x+=dx;t.y+=dy;
                if(t.penDown){
                    if(!G.currentLine)G.currentLine={color:t.color,points:[{x:t.x,y:t.y}]};
                    else G.currentLine.points.push({x:t.x,y:t.y});
                }
            }
            if(G.currentLine){G.drawnLines.push(G.currentLine);G.currentLine=null;}
            sfxMove();
            break;
        }
        case 'LEFT':
            t.angle-=(cmd.param||BLOCK_TYPES.LEFT.param);
            sfxTurn();
            break;
        case 'RIGHT':
            t.angle+=(cmd.param||BLOCK_TYPES.RIGHT.param);
            sfxTurn();
            break;
        case 'PEN_UP':
            t.penDown=false;
            if(G.currentLine){G.drawnLines.push(G.currentLine);G.currentLine=null;}
            sfxPen();
            break;
        case 'PEN_DOWN':
            t.penDown=true;
            sfxPen();
            break;
        case 'COLOR':
            t.color=COLOR_PALETTE[cmd.colorIdx!=null?cmd.colorIdx:0];
            if(G.currentLine){G.drawnLines.push(G.currentLine);G.currentLine=null;}
            sfxClick();
            break;
    }
}

function evaluateResult(){
    const level=LEVELS[G.level];
    if(!level)return;
    let similarity=0;
    const drawnCount=G.drawnLines.reduce((s,l)=>s+l.points.length,0);
    if(drawnCount<5){
        similarity=Math.min(50,drawnCount*10);
    }else{
        similarity=calcShapeSimilarity(level);
    }
    const blockCount=G.blocks.length;
    const ideal=level.idealBlocks||Math.max(1,LEVELS.length-G.level);
    let blockBonus=0;
    if(blockCount<=ideal)blockBonus=30;
    else if(blockCount<=ideal+2)blockBonus=15;
    else if(blockCount<=ideal+5)blockBonus=5;
    const baseScore=Math.floor(similarity*1.2);
    const total=baseScore+blockBonus;
    let stars=0;
    if(similarity>=95)stars=3;
    else if(similarity>=80)stars=2;
    else if(similarity>=60)stars=1;
    const pass=stars>0;
    if(pass){
        sfxWin();
        G.totalScore+=total;
        G['lvlStar'+G.level]=Math.max(G['lvlStar'+G.level]||0,stars);
    }else{
        sfxFail();
    }
    G.resultPopup={pass,similarity:Math.round(similarity),score:total,stars,blockCount,ideal:blockCount};
    G.levelComplete=pass;
}

function calcShapeSimilarity(level){
    if(level.targetLines){
        if(G.drawnLines.length===0)return 0;
        let score=0;
        for(const target of level.targetLines){
            let best=0;
            for(const drawn of G.drawnLines){
                const sim=lineSimilarity(target,drawn.points);
                if(sim>best)best=sim;
            }
            score+=best;
        }
        return Math.min(100,score/level.targetLines.length*100);
    }
    const drawnBBox=getLinesBBox(G.drawnLines);
    const expectedBBox=getExpectedBBox(level);
    if(!drawnBBox||!expectedBBox)return 30;
    const overlap=bboxOverlap(drawnBBox,expectedBBox);
    const sizeRatio=Math.min(drawnBBox.w/expectedBBox.w,expectedBBox.w/drawnBBox.w)*
                    Math.min(drawnBBox.h/expectedBBox.h,expectedBBox.h/drawnBBox.h);
    const centerDist=Math.hypot(drawnBBox.cx-expectedBBox.cx,drawnBBox.cy-expectedBBox.cy);
    const centerScore=Math.max(0,1-centerDist/200);
    const coverage=Math.min(1,G.drawnLines.reduce((s,l)=>s+l.points.length,0)/150);
    let sim=(overlap*0.4+sizeRatio*0.25+centerScore*0.2+coverage*0.15)*100;
    if(G.level===0&&drawnBBox.w>50)sim=Math.min(100,sim+20);
    return Math.max(20,Math.min(100,sim));
}

function lineSimilarity(a,b){
    if(a.length<2||b.length<2)return 0;
    const aLen=lineLength(a),bLen=lineLength(b);
    if(aLen<1||bLen<1)return 0;
    const lenRatio=Math.min(aLen/bLen,bLen/aLen);
    const dirA=Math.atan2(a[a.length-1].y-a[0].y,a[a.length-1].x-a[0].x);
    const dirB=Math.atan2(b[b.length-1].y-b[0].y,b[b.length-1].x-b[0].x);
    const dirDiff=Math.abs(Math.cos(dirA-dirB));
    const startDist=Math.hypot(a[0].x-b[0].x,a[0].y-b[0].y);
    const startScore=Math.max(0,1-startDist/150);
    return lenRatio*0.35+dirDiff*0.35+startScore*0.3;
}

function lineLength(pts){
    let s=0;
    for(let i=1;i<pts.length;i++)s+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);
    return s;
}

function getLinesBBox(lines){
    if(!lines||!lines.length)return null;
    let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
    for(const l of lines){
        for(const p of l.points){
            if(p.x<minX)minX=p.x;if(p.y<minY)minY=p.y;
            if(p.x>maxX)maxX=p.x;if(p.y>maxY)maxY=p.y;
        }
    }
    return {x:minX,y:minY,w:maxX-minX,h:maxY-minY,cx:(minX+maxX)/2,cy:(minY+maxY)/2};
}

function getExpectedBBox(level){
    const cx=level.startX,cy=level.startY;
    const s=level.size||80;
    switch(level.targetShape){
        case 'square':return {x:cx-s,y:cy-s,w:s*1.5,h:s*1.5,cx:cx+s/2,cy:cy-s/2};
        case 'triangle':return {x:cx-s/2,y:cy-s,w:s*1.5,h:s*1.2,cx:cx+s/4,cy:cy-s/3};
        case 'star':return {x:cx-s,y:cy-s,w:s*2,h:s*2,cx:cx,cy:cy};
        case 'flower':return {x:cx-s*1.5,y:cy-s*1.5,w:s*3,h:s*3,cx:cx,cy:cy};
        case 'house':return {x:cx-s/2,y:cy-s*1.5,w:s*1.5,h:s*2,cx:cx+s/2,cy:cy-s/2};
        case 'spiral':return {x:cx-s,y:cy-s,w:s*3,h:s*2,cx:cx+s,cy:cy};
        case 'flag':return {x:cx,y:cy-s,w:s*1.5,h:s*1.2,cx:cx+s*0.75,cy:cy-s/2};
        case 'rainbow':return {x:cx-s*1.2,y:cy-s*1.2,w:s*2.4,h:s*2.4,cx:cx,cy:cy};
        case 'complex':return {x:cx-s*2,y:cy-s*2,w:s*4,h:s*4,cx:cx,cy:cy};
        default:return {x:cx-s,y:cy-s,w:s*2,h:s*2,cx:cx,cy:cy};
    }
}

function bboxOverlap(a,b){
    const ox=Math.max(0,Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x));
    const oy=Math.max(0,Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y));
    const i=ox*oy;
    const u=a.w*a.h+b.w*b.h-i;
    return u>0?i/u:0;
}

function handleToolboxClick(p){
    const blocks=getToolboxBlocks();
    for(const tb of blocks){
        if(p.x>=tb.x&&p.x<=tb.x+tb._w&&p.y>=tb.y&&p.y<=tb.y+tb._h){
            const newBlock={type:tb.type,param:BLOCK_TYPES[tb.type].param,colorIdx:0,children:[]};
            if(tb.type==='COLOR')newBlock.colorIdx=G.paletteIdx;
            G.blocks.push(newBlock);
            G.selectedBlock=G.blocks.length-1;
            sfxClick();
            return true;
        }
    }
    return false;
}

function handleProgramClick(p){
    for(let i=0;i<G.blocks.length;i++){
        const b=G.blocks[i];
        if(p.x>=b._x&&p.x<=b._x+b._w&&p.y>=b._y&&p.y<=b._y+b._h){
            G.selectedBlock=i;
            if(BLOCK_TYPES[b.type].param&&BLOCK_TYPES[b.type].options){
                b.colorIdx=((b.colorIdx||0)+1)%COLOR_PALETTE.length;
                G.paletteIdx=b.colorIdx;
            }else if(b.type==='FORWARD'||b.type==='BACK'){
                const opts=[50,100,30,80,150];
                const idx=opts.indexOf(b.param);
                b.param=opts[(idx+1)%opts.length];
            }else if(b.type==='LEFT'||b.type==='RIGHT'){
                const opts=[90,45,120,60,30,144,15,20];
                const idx=opts.indexOf(b.param);
                b.param=opts[(idx+1)%opts.length];
            }else if(b.type==='REPEAT'){
                const opts=[4,3,5,2,6,10,24,20,7,36];
                const idx=opts.indexOf(b.param);
                b.param=opts[(idx+1)%opts.length];
            }
            sfxClick();
            return true;
        }
    }
    G.selectedBlock=null;
    return false;
}

function onPointerDown(p){
    if(G.state===STATE_MENU){
        startGame();sfxStart();return;
    }
    if(G.showingHint){
        if(hitBtn(p,'closeHint')){G.showingHint=false;sfxClick();}
        return;
    }
    if(G.resultPopup){
        if(hitBtn(p,'next')){nextLevel();return;}
        if(hitBtn(p,'replay')){replayLevel();return;}
        return;
    }
    if(G.state===STATE_PAUSE){
        if(hitBtn(p,'resume')){G.state=STATE_PLAYING;sfxClick();}
        else if(hitBtn(p,'menu')){G.state=STATE_MENU;sfxClick();}
        return;
    }
    if(G.state===STATE_OVER){
        if(hitBtn(p,'restart')){initState();G.state=STATE_PLAYING;sfxStart();}
        else if(hitBtn(p,'menu')){G.state=STATE_MENU;sfxClick();}
        return;
    }
    if(G.state!==STATE_PLAYING)return;
    if(G.selectedBlock!=null&&p.x<350){
        const b=G.blocks[G.selectedBlock];
        if(b){
            if(b.type==='FORWARD'||b.type==='BACK'){
                if(p.x>280&&p.x<340&&p.y>TOOLBOX_Y+10&&p.y<TOOLBOX_Y+BLOCK_H+10){
                    G.blocks.splice(G.selectedBlock,1);
                    G.selectedBlock=null;
                    sfxClick();
                    return;
                }
            }
        }
    }
    if(hitBtn(p,'run')&&G.blocks.length>0){
        resetTurtle();
        G.running=true;
        G.runIndex=0;
        sfxRun();
        return;
    }
    if(hitBtn(p,'clear')){clearProgram();return;}
    if(hitBtn(p,'hint')){G.showingHint=true;sfxClick();return;}
    if(hitBtn(p,'skip')){
        G.resultPopup={pass:true,similarity:60,score:60,stars:1,blockCount:0,ideal:LEVELS[G.level].idealBlocks||1};
        G.totalScore+=60;
        G['lvlStar'+G.level]=Math.max(G['lvlStar'+G.level]||0,1);
        sfxScore();
        return;
    }
    if(!G.running){
        if(p.y>=TOOLBOX_Y){handleToolboxClick(p);return;}
        if(p.x>=350){handleProgramClick(p);return;}
    }
    if(!G.running&&p.y<CANVAS_H&&p.x<350){
        resetTurtle();
        sfxClick();
    }
}

        ['嵌套','指令里面又放指令','循环里面再放循环=画螺旋','#5c6bc0'],
        ['调试','找bug修bug的过程','一步步跑,看每步的结果对错','#26a69a'],

        ctx.fillText(d[1],cx-60,y+2);
        ctx.fillStyle='#fff9c4';ctx.font='10px Microsoft YaHei';

function drawShapesLibrary(){
    const cx=W/2,cy=150;
    const shapes=[
        {n:'正三角形',s:3,c:'#ef5350'},{n:'正方形',s:4,c:'#66bb6a'},
        {n:'正五边形',s:5,c:'#42a5f5'},{n:'正六边形',s:6,c:'#ab47bc'},
        {n:'正八边形',s:8,c:'#ffa726'},{n:'圆(36边形)',s:36,c:'#26c6da'},
    ];
    const totalW=shapes.length*70;
    for(let i=0;i<shapes.length;i++){
        const sh=shapes[i];
        const x=cx-totalW/2+i*70+35,y=cy;
        ctx.strokeStyle=sh.c;ctx.lineWidth=2;
        ctx.beginPath();
        for(let k=0;k<=sh.s;k++){
            const a=-Math.PI/2+k*Math.PI*2/sh.s;
            const px=x+Math.cos(a)*22,py=y+Math.sin(a)*22;
            if(k===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
        }
        ctx.stroke();
        ctx.fillStyle=sh.c;ctx.font='bold 10px Microsoft YaHei';ctx.textAlign='center';
        ctx.fillText(sh.n,x,y+42);
        ctx.fillStyle='#bdbdbd';ctx.font='9px Microsoft YaHei';
        ctx.fillText(sh.s+'次 外角度',x,y+54);
    }
    ctx.lineWidth=1;
}

function update(){
    G.animT++;
    if(G.running&&G.animT%8===0){
        runStepOnce();
    }
}

function draw(){
    ctx.clearRect(0,0,W,H);
    if(G.state===STATE_MENU){drawMenu();return;}
    ctx.fillStyle='#e3f2fd';
    ctx.fillRect(0,0,W,TOOLBOX_Y);
    ctx.strokeStyle='rgba(33,150,243,0.2)';
    ctx.lineWidth=1;
    for(let x=0;x<350;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,CANVAS_H);ctx.stroke();}
    for(let y=0;y<CANVAS_H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(350,y);ctx.stroke();}
    drawTargetPreview();
    drawDrawnLines();
    drawTurtle();
    drawProgramBlocks();
    drawToolbox();
    drawHUD();
    if(G.selectedBlock!=null){
        const b=G.blocks[G.selectedBlock];
        if(b){
            ctx.fillStyle='rgba(255,235,59,0.2)';
            ctx.fillRect(285,TOOLBOX_Y+10,55,40);
            ctx.fillStyle='#fff';
            ctx.font='bold 11px "Microsoft YaHei"';
            ctx.textAlign='center';
            ctx.fillText('🗑️',312,TOOLBOX_Y+30);
            ctx.fillText('删除',312,TOOLBOX_Y+45);
        }
    }
    if(G.state===STATE_PAUSE)drawPause();
    if(G.state===STATE_OVER)drawGameOver();
    drawResultPopup();
    drawHintPopup();
}

function startGame(){
    initState();
    G.state=STATE_PLAYING;
}

function endGame(){
    G.state=STATE_OVER;
}

function loop(){
    if(G&&(G.state===STATE_PLAYING||G.running))update();
    draw();
}

setInterval(loop,16);

canvas.addEventListener('mousedown',e=>{
    e.preventDefault();
    onPointerDown(getPos(e));
});
canvas.addEventListener('mousemove',e=>{
    onPointerMove(getPos(e));
});
canvas.addEventListener('mouseup',e=>{
    onPointerUp(getPos(e));
});
canvas.addEventListener('touchstart',e=>{
    e.preventDefault();
    if(e.touches[0])onPointerDown(getPos(e.touches[0]));
},{passive:false});
canvas.addEventListener('touchmove',e=>{
    e.preventDefault();
    if(e.touches[0])onPointerMove(getPos(e.touches[0]));
},{passive:false});
canvas.addEventListener('touchend',e=>{
    e.preventDefault();
    if(e.changedTouches[0])onPointerUp(getPos(e.changedTouches[0]));
},{passive:false});

document.addEventListener('keydown',e=>{
    if(e.key===' '||e.key==='Enter'){
        e.preventDefault();
        if(G&&G.state===STATE_MENU){sfxStart();startGame();}
        else if(G&&G.state===STATE_OVER){initState();G.state=STATE_PLAYING;sfxStart();}
    }
    if(e.key==='Escape'){
        e.preventDefault();
        if(G){
            if(G.state===STATE_PLAYING)G.state=STATE_PAUSE;
            else if(G.state===STATE_PAUSE)G.state=STATE_PLAYING;
        }
    }
    if(e.key==='Backspace'&&G&&G.state===STATE_PLAYING&&!G.running){
        if(G.selectedBlock!=null){G.blocks.splice(G.selectedBlock,1);G.selectedBlock=null;sfxClick();}
        else if(G.blocks.length>0){G.blocks.pop();sfxClick();}
    }
});

const _sbtn=document.getElementById('start-game-btn');
_sbtn.addEventListener('click',function(){
    initAudio();
    startGame();
    sfxStart();
    this.style.display='none';
});

if(!G)initState();

})();
