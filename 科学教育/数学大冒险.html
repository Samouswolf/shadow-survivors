function initAudio(){
    if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();

function playTone(freq,dur,type,vol){
    if(!audioCtx)return;
    try{
        const o=audioCtx.createOscillator();
        const g=audioCtx.createGain();
        o.type=type||'square';
        o.frequency.value=freq;
        g.gain.value=vol||0.15;
        g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
        o.connect(g);g.connect(audioCtx.destination);
        o.start();o.stop(audioCtx.currentTime+dur);
    }catch(e){}
}
function sfxStart(){playTone(523,0.1,'sine',0.2);setTimeout(()=>playTone(659,0.1,'sine',0.2),100);setTimeout(()=>playTone(784,0.15,'sine',0.2),200)}

let G;

function initState(){
    G={
        state:STATE_PLAYING,
        score:0,
        high:Storage.load('shuxue_damaoxian_highscore',0),
        level:0,
        levelScore:[],
        selectedOpt:null,
        answered:false,
        result:null,
        showExplain:false,
        timeLeft:0,
        anim:0,
        stars:0,
        hintUsed:false,
        hintVisible:false,
        totalStars:0,
        buttons:[],
        message:'',
        messageTimer:0,
        part:0
    };
    startLevel();
}

function startLevel(){
    const L=LEVELS[G.level];
    G.selectedOpt=null;
    G.answered=false;
    G.result=null;
    G.showExplain=false;
    G.timeLeft=L.time;
    G.hintUsed=false;
    G.hintVisible=false;
    G.anim=0;
    showMessage('第'+(G.level+1)+'关：'+L.name+' '+L.emoji,2.5);
}

function showMessage(msg,dur){
    G.message=msg;
    G.messageTimer=dur*60;
}

function update(dt){
    if(G.messageTimer>0)G.messageTimer--;
    G.anim+=dt;
    if(G.state===STATE_PLAYING && !G.answered){
        G.timeLeft-=dt;
        if(G.timeLeft<=0){
            G.timeLeft=0;
            submitAnswer(-1);
        }
    }
}

function submitAnswer(idx){
    if(G.answered)return;
    const L=LEVELS[G.level];
    G.selectedOpt=idx;
    G.answered=true;
    G.showExplain=true;
    
    const isCorrect=idx>=0 && L.options[idx].correct;
    const timeRatio=Math.max(0.3,G.timeLeft/L.time);
    const hintPenalty=G.hintUsed?0.7:1;
    
    let stars=0,score=0;
    if(isCorrect){
        stars=1;
        score=50;
        if(timeRatio>0.6)stars++;
        if(!G.hintUsed && timeRatio>0.4)stars++;
        score+=Math.floor(50*timeRatio);
        score+=stars*20;
        sfxRight();
        for(let i=0;i<stars;i++)setTimeout(()=>sfxStar(),i*150);
    }else{
        sfxWrong();
    }
    
    G.result={correct:isCorrect,stars:stars,score:score,timeRatio:timeRatio};
    G.levelScore.push({level:G.level,stars:stars,score:score,correct:isCorrect});
    G.score+=score;
    G.totalStars+=stars;
    
    if(G.score>G.high){
        G.high=G.score;
        Storage.save('shuxue_damaoxian_highscore',G.high);
    }
}

function nextLevel(){
    if(G.level>=LEVELS.length-1){
        endGame();
    }else{
        G.level++;
        startLevel();
    }
}

function endGame(){
    G.state=STATE_OVER;
    if(G.score>G.high){
        G.high=G.score;
        Storage.save('shuxue_damaoxian_highscore',G.high);
    }
    sfxWin();
}

function startGame(){
    initState();
    sfxStart();
}

function draw(){
    const grad=ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,'#1a237e');
    grad.addColorStop(0.5,'#283593');
    grad.addColorStop(1,'#3949ab');
    ctx.fillStyle=grad;
    ctx.fillRect(0,0,W,H);
    
    ctx.globalAlpha=0.1;
    for(let i=0;i<20;i++){
        const x=(i*47+G.anim*20)%W;
        const y=50+i*35;
        ctx.fillStyle='#fff';
        ctx.font=Math.floor(12+i%3*6)+'px Microsoft YaHei';
        ctx.textAlign='center';
        ctx.fillText(['+','−','×','÷','=','x','π','%'][i%8],x,y);
    }
    ctx.globalAlpha=1;
    
    switch(G.state){
        case STATE_MENU:drawMenu();break;
        case STATE_PLAYING:drawGame();drawHUD();break;
        case STATE_PAUSE:drawGame();drawPause();break;
        case STATE_OVER:drawGame();drawOver();break;
    }
    if(G.messageTimer>0)drawMessage();
}

    ctx.fillStyle='rgba(0,0,0,0.55)';
    ctx.fillRect(0,0,W,H);
    
    ctx.textAlign='center';
    ctx.fillStyle='#ffc107';
    ctx.font='bold 48px Microsoft YaHei';
    ctx.fillText('📐 数学大冒险',W/2,130);
    
    ctx.fillStyle='#fff';
    ctx.font='bold 22px Microsoft YaHei';
    ctx.fillText('5-6年级 情景数学 8关挑战',W/2,180);
    
    ctx.fillStyle='rgba(255,255,255,0.08)';
    ctx.fillRect(20,210,W-40,160);
    ctx.strokeStyle='rgba(255,255,255,0.2)';
    ctx.strokeRect(20,210,W-40,160);
    ctx.fillStyle='#ffd54f';
    ctx.font='bold 16px Microsoft YaHei';
    ctx.fillText('🎯 8大情景主题',W/2,238);

function drawIllustration(L,cx,cy){
    const type=L.illustration;
    ctx.save();
    ctx.translate(cx,cy);
    const t=G.anim*2;
    
    if(type==='pizza'){
        for(let i=0;i<8;i++){
            const a=i/8*Math.PI*2-Math.PI/2;
            ctx.fillStyle=i<6?'#ff9800':'#fff3e0';
            ctx.beginPath();
            ctx.moveTo(0,0);
            ctx.arc(0,0,55,a,a+Math.PI/4);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle='#bf360c';
            ctx.lineWidth=2;
            ctx.stroke();
            if(i<5){
                const mx=Math.cos(a+Math.PI/8)*30,my=Math.sin(a+Math.PI/8)*30;
                ctx.fillStyle='#d32f2f';
                ctx.beginPath();
                ctx.arc(mx+Math.sin(t+i)*2,my,4,0,Math.PI*2);
                ctx.fill();
            }
        }

        ctx.fillStyle='#c8e6c9';
        ctx.fillRect(-70,-50,140,100);
        ctx.strokeStyle='#388e3c';

function wrapText(txt,x,y,maxW,lh){
    const chars=txt.split('');
    let line='',cy=y;
    for(const ch of chars){
        const test=line+ch;
        if(ctx.measureText(test).width>maxW){
            ctx.fillText(line,x,cy);
            line=ch;cy+=lh;
        }else{
            line=test;
        }
    }
    if(line)ctx.fillText(line,x,cy);
}

function hitBtn(p,b){
    return b&&p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h;
}

function onPointerDown(p){
    sfxClick();
    if(G.state===STATE_MENU){startGame();return}
    if(G.state===STATE_PAUSE){
        if(hitBtn(p,G.resumeBtn)){G.state=STATE_PLAYING;sfxStart()}
        else if(hitBtn(p,G.quitBtn)){G.state=STATE_MENU}
        return;
    }
    if(G.state===STATE_OVER){
        if(hitBtn(p,G.retryBtn))startGame();
        else if(hitBtn(p,G.menuBtn))G.state=STATE_MENU;
        return;
    }
    if(G.state===STATE_PLAYING){
        if(hitBtn(p,G.pauseBtn)){G.state=STATE_PAUSE;return}
        if(G.showExplain && G.result){
            if(hitBtn(p,G.nextBtn)){nextLevel();return}
            return;
        }
        if(!G.answered){
            if(hitBtn(p,G.hintBtn)&&!G.hintVisible){
                G.hintVisible=true;G.hintUsed=true;sfxHint();return;
            }
            for(const b of G.buttons){
                if(hitBtn(p,b)){G.selectedOpt=b.idx;sfxClick();return}
            }
            if(G.submitBtn&&G.submitBtn.enabled&&hitBtn(p,G.submitBtn)){
                submitAnswer(G.selectedOpt);
            }
        }
    }
}

document.addEventListener('keydown',function(e){
    if(e.code==='Space'||e.code==='Enter'){
        e.preventDefault();
        if(G.state===STATE_MENU||G.state===STATE_OVER)startGame();
        else if(G.state===STATE_PLAYING){
            if(G.showExplain&&G.result){nextLevel()}
            else if(!G.answered&&G.submitBtn&&G.submitBtn.enabled){submitAnswer(G.selectedOpt)}
        }
    }else if(e.code==='Escape'){
        e.preventDefault();
        if(G.state===STATE_PLAYING)G.state=STATE_PAUSE;
        else if(G.state===STATE_PAUSE)G.state=STATE_PLAYING;
    }else if(G.state===STATE_PLAYING && !G.answered){
        if(['Digit1','Digit2','Digit3','Digit4','KeyA','KeyB','KeyC','KeyD'].includes(e.code)){
            const idx=['Digit1','KeyA'].includes(e.code)?0:['Digit2','KeyB'].includes(e.code)?1:['Digit3','KeyC'].includes(e.code)?2:3;
            G.selectedOpt=idx;sfxClick();
        }
    }
});

    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
