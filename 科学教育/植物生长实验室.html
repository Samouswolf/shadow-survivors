<body>

<button id="start-game-btn" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:20px 40px;font-size:20px;background:#2e7d32;color:#fff;border:none;border-radius:12px;cursor:pointer;z-index:999;font-weight:bold;">开始实验</button>

<canvas id="c"></canvas>

<script>
if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
</script>
<script src="../game_core.js"></script>
<script>
(function(){
"use strict";

const W=480,H=800;

let audioCtx=null;
function initAudio(){
    if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
}
function playTone(freq,dur,type,vol){
    if(!audioCtx)return;
    try{
        const o=audioCtx.createOscillator();
        const g=audioCtx.createGain();
        o.type=type||'square';
        o.frequency.value=freq;
        g.gain.value=vol||0.15;
        g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
        o.connect(g);g.connect(audioCtx.destination);
        o.start();o.stop(audioCtx.currentTime+dur);
    }catch(e){}
}
function sfxStart(){playTone(523,0.1,'sine',0.2);setTimeout(()=>playTone(659,0.1,'sine',0.2),100);setTimeout(()=>playTone(784,0.15,'sine',0.2),200)}
function sfxScore(){playTone(880,0.08,'sine',0.18);setTimeout(()=>playTone(1047,0.1,'sine',0.18),80);setTimeout(()=>playTone(1319,0.15,'sine',0.18),160)}
function sfxFail(){playTone(220,0.15,'sawtooth',0.18);setTimeout(()=>playTone(165,0.25,'sawtooth',0.18),120)}
function sfxClick(){playTone(660,0.05,'triangle',0.12)}
function sfxGrow(){playTone(400,0.1,'sine',0.12);setTimeout(()=>playTone(500,0.1,'sine',0.12),100);setTimeout(()=>playTone(600,0.15,'sine',0.12),200)}
function sfxWater(){playTone(300,0.05,'sine',0.1);setTimeout(()=>playTone(250,0.05,'sine',0.08),50);setTimeout(()=>playTone(200,0.08,'sine',0.06),100)}
function sfxSun(){playTone(700,0.05,'sine',0.12);setTimeout(()=>playTone(900,0.08,'sine',0.1),60)}
function sfxBloom(){for(let i=0;i<5;i++){setTimeout(()=>playTone(600+i*80,0.1,'sine',0.14),i*60)}}
function sfxWin(){for(let i=0;i<6;i++){setTimeout(()=>playTone(523+i*131,0.12,'sine',0.18),i*90)}}

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let scale=1;
function resize(){
    const r=W/H;
    let cw=window.innerWidth,ch=window.innerHeight;
    if(cw/ch>r){ch=cw/r}else{cw=ch*r}
    canvas.width=cw;canvas.height=ch;
    scale=cw/W;
    ctx.setTransform(scale,0,0,scale,0,0);
}
window.addEventListener('resize',resize);resize();

function getPos(e){
    const r=canvas.getBoundingClientRect();
    return {x:(e.clientX-r.left)/scale,y:(e.clientY-r.top)/scale};
}

const STAGES=['种子','发芽','幼苗','生长','开花','结果'];
const SOILS=[
    {id:'sand',name:'沙土',color:'#d7ccc8',desc:'颗粒大，透气好，保水差',waterK:0.7,tempK:1.1,fertK:0.6},
    {id:'loam',name:'壤土',color:'#8d6e63',desc:'颗粒中等，最佳土壤，均衡',waterK:1.0,tempK:1.0,fertK:1.0},
    {id:'clay',name:'黏土',color:'#5d4037',desc:'颗粒细，保水好，透气差',waterK:1.4,tempK:0.8,fertK:1.2}
];

const LEVELS=[
    {
        id:1,name:'种子发芽实验',type:'germinate',
        desc:'设置合适的光/水/土壤/温度，观察豌豆种子7天内发芽！',
        targetDay:7,goal:'发芽',
        ideal:{light:6,water:40,soil:'loam',temp:22},
        passCond:function(p){return p.day>=7 && p.stage>=1},
        principle:'种子萌发三要素：适量水分(软化种皮+物质运输)、适宜温度(酶活性20-25℃最佳)、充足空气(呼吸作用)。光不是必需条件！'
    },
    {
        id:2,name:'幼苗生长成株',type:'grow',
        desc:'发芽后继续培养，目标21天内开花！注意合理光温水！',
        targetDay:21,goal:'开花',
        ideal:{light:8,water:50,soil:'loam',temp:25},
        passCond:function(p){return p.day>=21 && p.stage>=4},
        principle:'营养生长→生殖生长：幼苗需充足光照(光合作用)、N肥长叶、P肥长根、K肥壮茎。花芽分化需要合适的光周期(长日照植物豌豆需>12h光/天)。'
    },
    {
        id:3,name:'孟德尔豌豆杂交',type:'mendel',
        desc:'孟德尔遗传实验：纯合紫花(RR)×纯合白花(rr)，预测F2代紫花:白花比例！',
        targetDay:40,goal:'F2性状分离比',
        ideal:{light:8,water:50,soil:'loam',temp:25},
        mendel:true,
        passCond:function(p){
            return p.predRatio>=3.0 && p.predRatio<=3.4;
        },
        principle:'孟德尔分离定律：RR×rr→F1全Rr(紫)。F1自交→F2基因型1RR:2Rr:1rr，表现型比例紫花:白花=3:1！显隐性基因分离随机组合。'
    },
    {
        id:4,name:'极端环境救治',type:'rescue',
        desc:'你的植物生病了！判断环境问题(旱/涝/热/冻/缺光)并调整参数救治它！',
        targetDay:14,goal:'救治成功',
        rescue:true,
        initialCrisis:null,
        passCond:function(p){return p.day>=14 && p.health>=80 && p.stage>=3},
        principle:'植物逆境胁迫：干旱→气孔关闭萎蔫；水涝→根缺氧烂根；高温→蛋白变性；冻害→细胞结冰；缺光→黄化徒长。救治要对症下药！'
    }
];

const CRISES=[
    {id:'drought',name:'干旱缺水',symptoms:['叶片卷曲','茎干萎蔫','土壤干裂'],
     fix:{water:65},bad:{water:15},explain:'严重缺水！需要大量浇水，但不能一次涝死。'},
    {id:'flood',name:'水涝烂根',symptoms:['叶片发黄','根部发黑','土壤积水'],
     fix:{water:20,soil:'sand'},bad:{water:85},explain:'根被水淹无法呼吸！减少浇水+换透气沙土。'},
    {id:'heat',name:'高温灼伤',symptoms:['叶缘焦枯','叶片发白','植物萎蔫'],
     fix:{temp:24,light:4,water:60},bad:{temp:38,light:10},explain:'高温破坏叶绿体！降温+遮阴+补水。'},
    {id:'cold',name:'冻害低温',symptoms:['叶片水渍状','茎干软腐','生长停滞'],
     fix:{temp:22,soil:'loam'},bad:{temp:10},explain:'低温冻坏细胞！升高温度，保持土壤适中。'},
    {id:'shade',name:'缺光黄化',symptoms:['叶片发黄','植株细高','节间过长(徒长)'],
     fix:{light:9},bad:{light:1},explain:'缺光无法光合作用！增加光照时间让它合成叶绿素。'}
];

let G;

function initState(){
    G={
        state:STATE_PLAYING,
        score:0,
        high:Storage.load('zhiwu_shengzhang_highscore',0),
        level:0,
        levelsResult:[],
        day:0,
        maxDay:0,
        stage:0,
        health:100,
        height:0,
        leaves:0,
        flowers:0,
        pods:0,
        water:50,
        waterSat:0,
        light:8,
        lightSat:0,
        temp:23,
        soil:'loam',
        paused:false,
        speed:1,
        speedIdx:1,
        params:null,
        records:[],
        f1Offspring:[],
        f2Offspring:[],
        predRatio:0,
        userPred:null,
        predSet:false,
        crisis:null,
        crisisFixed:false,
        principleTimer:0,
        principle:null,
        message:'',
        messageTimer:0,
        stageReached:[],
        experimentScore:0,
        report:[],
        selectedParam:null,
        buttons:[]
    };
    startLevel();
}

function startLevel(){
    const L=LEVELS[G.level];
    G.day=0;
    G.stage=0;
    G.health=95;
    G.height=0;
    G.leaves=0;
    G.flowers=0;
    G.pods=0;
    G.water=50;
    G.waterSat=0;
    G.light=L.ideal?L.ideal.light:8;
    G.lightSat=0;
    G.temp=L.ideal?L.ideal.temp:23;
    G.soil=L.ideal?L.ideal.soil:'loam';
    G.speedIdx=1;G.speed=1;
    G.records=[];
    G.report=[];
    G.stageReached=[];
    G.experimentScore=0;
    G.maxDay=L.targetDay;
    G.userPred=null;
    G.predSet=false;
    G.predRatio=0;
    
    if(L.rescue){
        G.crisis=CRISES[Math.floor(Math.random()*CRISES.length)];
        if(G.crisis.bad.water!==undefined)G.water=G.crisis.bad.water;
        if(G.crisis.bad.temp!==undefined)G.temp=G.crisis.bad.temp;
        if(G.crisis.bad.light!==undefined)G.light=G.crisis.bad.light;
        if(G.crisis.bad.soil!==undefined)G.soil=G.crisis.bad.soil;
        G.health=45;
        G.crisisFixed=false;
        showMessage('⚠ 植物遭遇：'+G.crisis.name+'！快救治！',4);
    }
    
    if(L.mendel){
        G.f1Offspring=[];
        G.f2Offspring=[];
    }
    
    showMessage('第'+G.level+'关：'+L.name,3);
}

function showMessage(msg,dur){
    G.message=msg;
    G.messageTimer=dur*60;
}

function addWater(amt){
    const sk=SOILS.find(s=>s.id===G.soil).waterK;
    G.water=Math.max(0,Math.min(100,G.water+amt*sk));
    sfxWater();
}
function changeLight(amt){G.light=Math.max(0,Math.min(12,G.light+amt));sfxSun()}
function changeTemp(amt){G.temp=Math.max(5,Math.min(40,G.temp+amt));sfxClick()}
function cycleSoil(){
    const idx=(SOILS.findIndex(s=>s.id===G.soil)+1)%SOILS.length;
    G.soil=SOILS[idx].id;
    sfxClick();
    showMessage('土壤换成：'+SOILS[idx].name,2);
}

function update(dt){
    if(G.messageTimer>0)G.messageTimer--;
    if(G.principleTimer>0)G.principleTimer--;
    
    if(G.state!==STATE_PLAYING||G.paused)return;
    
    const actualDt=dt*G.speed;
    G.waterSat+=actualDt;
    G.lightSat+=actualDt;
    
    const dayLen=1.5;
    while(G.waterSat>=dayLen && G.day<G.maxDay+1){
        G.waterSat-=dayLen;
        simulateDay();
    }
}

function simulateDay(){
    G.day++;
    const L=LEVELS[G.level];
    const S=SOILS.find(s=>s.id===G.soil);
    
    let waterStress=0;
    if(G.water<20)waterStress=-(20-G.water)/2;
    if(G.water>85)waterStress=-(G.water-85)/2;
    
    let tempStress=0;
    if(G.temp<12)tempStress=-(12-G.temp);
    if(G.temp>32)tempStress=-(G.temp-32);
    
    let lightStress=0;
    if(G.level===0)lightStress=0;
    else{
        if(G.light<3)lightStress=-(3-G.light)*1.5;
        if(G.light>11)lightStress=-(G.light-11)*0.8;
    }
    
    const dayHealth=Math.max(0,Math.min(100,G.health+waterStress*S.waterK+tempStress*S.tempK+lightStress));
    G.health=dayHealth;
    
    G.water=Math.max(0,G.water-(5+G.temp*0.2+G.light*0.3)/S.waterK);
    
    const dailyRec=[];
    if(waterStress!==0)dailyRec.push((waterStress<0?'水':'')+Math.abs(waterStress).toFixed(0));
    if(tempStress!==0)dailyRec.push((tempStress<0?'温':'')+Math.abs(tempStress).toFixed(0));
    if(lightStress!==0)dailyRec.push((lightStress<0?'光':'')+Math.abs(lightStress).toFixed(0));
    
    if(G.health>40){
        const growRate=(G.health/100)*S.fertK*0.8;
        if(G.level<2 || L.rescue){
            if(G.stage===0 && G.day>=2 && G.water>25 && G.temp>15){
                G.stage=1;G.height=2;sfxGrow();
                G.stageReached.push({day:G.day,stage:1,name:STAGES[1]});
                showMessage('🌱 第'+G.day+'天：发芽了！',2.5);
            }else if(G.stage===1 && G.height>=3 && G.leaves>=1){
                G.stage=2;sfxGrow();
                G.stageReached.push({day:G.day,stage:2,name:STAGES[2]});
                showMessage('🌿 第'+G.day+'天：进入幼苗期！',2);
            }else if(G.stage===2 && G.height>=12){
                G.stage=3;sfxGrow();
                G.stageReached.push({day:G.day,stage:3,name:STAGES[3]});
                showMessage('🌾 第'+G.day+'天：快速生长期！',2);
            }else if(G.stage===3 && G.height>=22 && G.day>=18){
                G.stage=4;sfxBloom();
                G.flowers=4+Math.floor(Math.random()*5);
                G.stageReached.push({day:G.day,stage:4,name:STAGES[4]});
                showMessage('🌸 第'+G.day+'天：开花啦！',2.5);
            }else if(G.stage===4 && G.day>=25){
                G.stage=5;G.pods=Math.max(1,G.flowers-1);
                G.stageReached.push({day:G.day,stage:5,name:STAGES[5]});
                showMessage('🫛 第'+G.day+'天：结出豆荚！',2);
            }
            if(G.health>60){
                G.height+=growRate*(0.8+G.light*0.04);
            }
            if(G.health>50 && G.day%2===0 && G.stage>=1 && G.leaves<15){
                G.leaves+=1;
            }
        }
    }else if(G.health<25){
        if(Math.random()<0.1)G.leaves=Math.max(0,G.leaves-1);
    }
    
    if(G.day%2===0){
        G.records.push({
            day:G.day,health:Math.floor(G.health),
            height:G.height.toFixed(1),water:Math.floor(G.water),
            stage:STAGES[G.stage],
            issues:dailyRec.join(' ')||'正常'
        });
    }
    
    if(G.crisis){
        let fixed=true;
        if(G.crisis.fix.water!==undefined && Math.abs(G.water-G.crisis.fix.water)>25)fixed=false;
        if(G.crisis.fix.temp!==undefined && Math.abs(G.temp-G.crisis.fix.temp)>8)fixed=false;
        if(G.crisis.fix.light!==undefined && Math.abs(G.light-G.crisis.fix.light)>3)fixed=false;
        if(G.crisis.fix.soil!==undefined && G.soil!==G.crisis.fix.soil)fixed=false;
        if(fixed && !G.crisisFixed && G.health>60){
            G.crisisFixed=true;
            showMessage('✅ 环境调整正确！植物在恢复！',3);
            sfxScore();
        }
    }
    
    if(L.mendel && G.stage>=5 && G.f2Offspring.length===0){
        for(let i=0;i<20;i++){
            const g1=Math.random()<0.5?'R':'r';
            const g2=Math.random()<0.5?'R':'r';
            const geno=g1+g2;
            const pheno=geno.includes('R')?'紫':'白';
            G.f2Offspring.push({geno:geno,pheno:pheno});
        }
    }
    
    checkEnd();
}

function checkEnd(){
    const L=LEVELS[G.level];
    const passed=L.passCond(G);
    
    if(G.day>=G.maxDay+1 || (G.day>=G.maxDay && passed)){
        G.paused=true;
        
        let quality=0;
        if(passed)quality+=40;
        quality+=Math.floor(G.health*0.3);
        quality+=Math.floor((G.maxDay-Math.abs(G.day-G.maxDay))*0.2);
        if(G.stageReached.length>=2)quality+=10;
        if(L.mendel && G.predSet){
            const realPurple=G.f2Offspring.filter(x=>x.pheno==='紫').length;
            const realWhite=G.f2Offspring.length-realPurple;
            const realRatio=realWhite>0?(realPurple/realWhite):99;
            if(Math.abs(realRatio-G.userPred)<0.4)quality+=20;
            else quality+=5;
            G.predRatio=realRatio;
        }
        if(L.rescue && G.crisisFixed)quality+=15;
        
        G.experimentScore=Math.min(100,quality);
        G.score+=G.experimentScore;
        if(G.score>G.high){G.high=G.score;Storage.save('zhiwu_shengzhang_highscore',G.high)}
        
        G.levelsResult.push({level:G.level,score:G.experimentScore,passed:passed,stage:STAGES[G.stage],health:Math.floor(G.health)});
        
        sfxScore();
        showPrinciple(L.principle);
        
        setTimeout(()=>{
            if(G.level>=LEVELS.length-1){endGame()}
            else{G.level++;startLevel()}
        },6000);
    }
}

function drawPlant(){
    const cx=W/2,baseY=560;
    const h=Math.max(2,Math.min(180,G.height*6));
    const sway=Math.sin(G.day*0.5)*2;
    
    ctx.strokeStyle='#33691e';
    ctx.lineWidth=Math.max(2,3+G.height*0.1);
    ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(cx,baseY);
    ctx.quadraticCurveTo(cx+sway,baseY-h/2,cx+sway*1.5,baseY-h);
    ctx.stroke();
    ctx.lineCap='butt';ctx.lineWidth=1;
    
    const leafCount=Math.max(0,Math.min(15,G.leaves));
    for(let i=0;i<leafCount;i++){
        const y=baseY-5-(i+1)*(h/(leafCount+1));
        const side=i%2===0?1:-1;
        const lx=cx+sway*(1-i/leafCount*0.8),ly=y;
        const lcol=G.health>70?'#66bb6a':(G.health>40?'#c0ca33':'#9e9d24');
        ctx.fillStyle=lcol;
        ctx.save();
        ctx.translate(lx+side*8,ly);
        ctx.rotate(side*0.5+Math.sin(G.day+i)*0.1);
        ctx.beginPath();
        ctx.ellipse(side*10,0,14,6,0,0,Math.PI*2);
        ctx.fill();
        ctx.strokeStyle='#33691e';ctx.lineWidth=1;ctx.stroke();
        ctx.restore();
    }
    
    if(G.stage===1){
        ctx.fillStyle='#689f38';
        ctx.beginPath();
        ctx.ellipse(cx,baseY-h-3,4,10,0,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='#33691e';ctx.stroke();
    }
    
    for(let i=0;i<G.flowers;i++){
        const angle=i/G.flowers*Math.PI*2+G.day*0.2;
        const fx=cx+Math.cos(angle)*14+sway*0.5;
        const fy=baseY-h-5+Math.sin(angle)*8;
        const col=['#e91e63','#9c27b0','#f06292','#ba68c8'][i%4];
        for(let k=0;k<5;k++){
            const a=k/5*Math.PI*2;
            ctx.fillStyle=col;
            ctx.beginPath();
            ctx.ellipse(fx+Math.cos(a)*5,fy+Math.sin(a)*5,5,8,a,0,Math.PI*2);ctx.fill();
        }
        ctx.fillStyle='#ffeb3b';ctx.beginPath();ctx.arc(fx,fy,3.5,0,Math.PI*2);ctx.fill();
    }
    
    for(let i=0;i<G.pods;i++){
        const angle=i/G.pods*Math.PI*2;
        const px=cx+Math.cos(angle)*18;
        const py=baseY-h*0.9+Math.sin(angle)*12;
        ctx.fillStyle='#8d6e63';
        ctx.save();ctx.translate(px,py);ctx.rotate(Math.PI/6+i);
        ctx.beginPath();ctx.ellipse(0,0,15,5,0,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='#5d4037';ctx.stroke();ctx.restore();
    }
    
    if(G.health<50 && G.level!==0){
        for(let i=0;i<3;i++){
            ctx.fillStyle='rgba(255,0,0,0.7)';
            ctx.font='bold 18px Microsoft YaHei';
            ctx.fillText('⚠',80+i*140,500+Math.sin(G.day+i)*3);
        }
    }
}

function hitBtn(p,b){return b&&p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h}

function onPointerDown(p){
    sfxClick();
    if(G.state===STATE_MENU){startGame();return}
    if(G.state===STATE_PAUSE){
        if(hitBtn(p,G.resumeBtn)){G.state=STATE_PLAYING;sfxStart()}
        else if(hitBtn(p,G.quitBtn))G.state=STATE_MENU;
        return;
    }
    if(G.state===STATE_OVER){
        if(hitBtn(p,G.retryBtn))startGame();
        else if(hitBtn(p,G.menuBtn))G.state=STATE_MENU;
        return;
    }
    if(G.state===STATE_PLAYING){
        if(hitBtn(p,G.pauseBtn)){G.state=STATE_PAUSE;return}
        if(G.paused&&G.day<G.maxDay+1){
            if(p.x>0&&p.y>0){G.paused=false;return}
        }
        
        if(G.predBtn&&G.predBtn.show&&hitBtn(p,G.predBtn)){
            const r=prompt('请输入F2代 紫花:白花 的预测比值（例：3:1 输入 3）：','3');
            if(r){
                const n=parseFloat(r);
                if(!isNaN(n)&&n>0){G.userPred=n;G.predSet=true;sfxScore()}
                else showMessage('输入无效数字',2);
            }
            G.predBtn.show=false;
            return;
        }
        
        for(const b of G.buttons){
            if(hitBtn(p,b)){
                if(b.action==='speed'){
                    G.speedIdx=(G.speedIdx+1)%4;
                    G.speed=[0.5,1,3,5][G.speedIdx];
                    showMessage('实验速度: '+(G.speed===0.5?'慢速':'×'+G.speed),1.5);
                }else if(b.action==='pause'){
                    G.paused=!G.paused;
                }else if(b.action==='light'){
                    changeLight(b.dir*1);
                }else if(b.action==='temp'){
                    changeTemp(b.dir*2);
                }else if(b.action==='water'){
                    addWater(b.dir*15);
                }else if(b.action==='soil'){
                    cycleSoil();
                }
                return;
            }
        }
    }
}

document.addEventListener('keydown',function(e){
    if(e.code==='Space'||e.code==='Enter'){
        e.preventDefault();
        if(G.state===STATE_MENU||G.state===STATE_OVER)startGame();
    }else if(e.code==='Escape'){
        e.preventDefault();
        if(G.state===STATE_PLAYING)G.state=STATE_PAUSE;
        else if(G.state===STATE_PAUSE)G.state=STATE_PLAYING;
    }else if(G.state===STATE_PLAYING){
        if(e.code==='KeyW'||e.code==='ArrowUp')changeTemp(2);
        else if(e.code==='KeyS'||e.code==='ArrowDown')changeTemp(-2);
        else if(e.code==='KeyA'||e.code==='ArrowLeft')changeLight(-1);
        else if(e.code==='KeyD'||e.code==='ArrowRight')changeLight(1);
        else if(e.code==='KeyQ')addWater(-15);
        else if(e.code==='KeyE'||e.code==='KeyR')addWater(15);
        else if(e.code==='KeyT'||e.code==='KeyC')cycleSoil();
        else if(e.code==='KeyP'){G.speedIdx=(G.speedIdx+1)%4;G.speed=[0.5,1,3,5][G.speedIdx]}
        else if(e.code==='KeyZ')G.paused=!G.paused;
    }
});

    const dt=Math.min(0.05,(t-lastT)/1000||0);
    lastT=t;
    if(G.state===STATE_PLAYING)update(dt);
    draw();
    requestAnimationFrame(loop);
}

};

  var _origSetInterval = window.setInterval;

    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {

    _timerIds.push({type: 'interval', id: id});
    return id;
  };

})();
