function playTone(freq,dur,type,vol){
    if(!audioCtx)return;
    try{
        const o=audioCtx.createOscillator();
        const g=audioCtx.createGain();
        o.type=type||'square';
        o.frequency.value=freq;
        g.gain.value=vol||0.15;
        g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
        o.connect(g);g.connect(audioCtx.destination);
        o.start();o.stop(audioCtx.currentTime+dur);
    }catch(e){}
}

}

function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
}

function drawHeart(){
    const pulse=Math.sin(G.beatT*0.2)*3;
    ctx.save();
    ctx.translate(0,0);
    const sys=SYSTEMS[G.sysIdx];
    for(const p of sys.parts){
        if(p.id==='ra'||p.id==='rv'){
            ctx.fillStyle=isActive(p.id)?'rgba(229,57,53,0.35)':'rgba(239,83,80,0.25)';
            ctx.beginPath();
            if(p.id==='ra'){
                ctx.ellipse(p.x,p.y,p.r+pulse*0.5,p.r*1.2+pulse*0.3,0,0,Math.PI*2);
            }else{
                ctx.ellipse(p.x,p.y+pulse*0.5,p.r*1.1,p.r*1.4,0,0,Math.PI*2);
            }
            ctx.fill();
            ctx.strokeStyle='#c62828';ctx.lineWidth=3;ctx.stroke();
        }
    }
    for(const p of sys.parts){

            ctx.strokeStyle=isActive(p.id)?'#ffeb3b':'#e65100';
            ctx.lineWidth=isActive(p.id)?3:2;ctx.stroke();
            ctx.fillStyle='#263238';
            ctx.beginPath();ctx.arc(p.x-8,p.y+5,3,0,Math.PI*2);ctx.arc(p.x+8,p.y+5,3,0,Math.PI*2);ctx.fill();
        }else if(p.id==='trachea'){
            ctx.strokeStyle=isActive(p.id)?'#ffeb3b':'#0d47a1';
            ctx.lineWidth=isActive(p.id)?15:11;ctx.lineCap='round';

            ctx.strokeStyle='rgba(255,255,255,0.8)';ctx.lineWidth=3;

                ctx.beginPath();ctx.moveTo(p.x-10,yy);ctx.lineTo(p.x+10,yy);ctx.stroke();
            }

            const sign=p.id==='lbronch'?-1:1;
            ctx.strokeStyle=isActive(p.id)?'#ffeb3b':'#1565c0';

            ctx.beginPath();ctx.moveTo(240,248);ctx.lineTo(p.x+sign*5,p.y+15);ctx.stroke();
        }else if(p.id==='diaphragm'){
            ctx.fillStyle=isActive(p.id)?'rgba(255,235,59,0.6)':cols[p.id];
            ctx.beginPath();
            ctx.moveTo(80,p.y+breath);
            ctx.quadraticCurveTo(240,p.y-30+breath,400,p.y+breath);
            ctx.lineTo(400,p.y+20+breath);ctx.quadraticCurveTo(240,p.y+10+breath,80,p.y+20+breath);

            ctx.strokeStyle=isActive(p.id)?'#ffeb3b':'#c2185b';
            ctx.lineWidth=isActive(p.id)?3:2;ctx.stroke();
        }else if(p.id==='alveoli'){
            for(let i=0;i<7;i++){
                const a=i*Math.PI*2/7+G.pulseT*0.01;
                const r1=p.r+Math.sin(G.pulseT*0.1+i)*4;
                ctx.fillStyle=isActive(p.id)?'rgba(255,235,59,0.6)':cols[p.id];
                ctx.beginPath();ctx.arc(p.x+Math.cos(a)*16,p.y+Math.sin(a)*8,r1*0.5,0,Math.PI*2);ctx.fill();
                ctx.strokeStyle=isActive(p.id)?'#ffeb3b':'#6a1b9a';ctx.lineWidth=isActive(p.id)?2:1;ctx.stroke();
            }
        }
    }
    drawLabels(sys);
    if(G.animT%120===0)sfxBreathe();
    ctx.restore();
}

function isActive(pid){
    if(G.selectedPart===pid)return true;
    if(G.partFlash[pid]&&G.partFlash[pid]>0)return true;
    const sys=SYSTEMS[G.sysIdx];const stage=sys.steps[G.stageIdx];
    if(!stage)return false;
    if(stage.type==='label'&&stage.targets){
        if(G.clickedParts.has(pid)&&stage.targets.includes(pid))return true;
        if(!G.clickedParts.has(pid)&&stage.targets.includes(pid))return G.animT%40<20;
    }
    if(stage.type==='path'&&stage.path){
        const idx=stage.path.indexOf(pid);
        if(idx<G.pathIndex)return true;
        if(idx===G.pathIndex)return G.animT%30<18;
    }
    return false;
}

function drawLabels(sys){
    for(const p of sys.parts){
        if(G.clickedParts.has(p.id)||G.selectedPart===p.id){
            ctx.save();
            const bx=Math.min(Math.max(p.x-70,5),W-155);
            const by=p.y+50>H-100?p.y-60:p.y+50;
            ctx.fillStyle='rgba(0,0,0,0.82)';
            roundRect(ctx,bx,by,150,50,8);
            ctx.fill();
            ctx.strokeStyle='#ffeb3b';ctx.lineWidth=2;ctx.stroke();
            ctx.fillStyle='#ffeb3b';
            ctx.font='bold 13px "Microsoft YaHei"';
            ctx.textAlign='center';
            ctx.fillText(p.name,bx+75,by+20);
            ctx.fillStyle='#fff';
            ctx.font='10px "Microsoft YaHei"';
            wrapText(ctx,p.desc,bx+75,by+38,140,12);
            ctx.restore();
        }else{
            ctx.fillStyle='rgba(0,0,0,0.55)';
            ctx.font='10px "Microsoft YaHei"';ctx.textAlign='center';
            ctx.fillText(p.name,p.x,p.y+p.r+14);
        }
    }
}

function wrapText(ctx,txt,x,y,maxW,lh){
    const words=txt.split('');let line='';let cy=y;
    for(let i=0;i<words.length;i++){
        const test=line+words[i];
        if(ctx.measureText(test).width>maxW&&i>0){
            ctx.fillText(line,x,cy);line=words[i];cy+=lh;
        }else line=test;
    }
    ctx.fillText(line,x,cy);
}

function drawBtn(x,y,w,h,label,color,id){
    G._btns=G._btns||{};G._btns[id]={x,y,w,h};
    ctx.fillStyle=color;roundRect(ctx,x,y,w,h,10);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 13px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(label,x+w/2,y+h/2);
}

function hitBtn(p,id){
    if(!G._btns||!G._btns[id])return false;
    const b=G._btns[id];
    return p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h;
}

function hitPart(p){
    const sys=SYSTEMS[G.sysIdx];
    for(const part of sys.parts){
        const d=Math.hypot(p.x-part.x,p.y-part.y);
        if(d<part.r+8)return part;
    }
    return null;
}

function completeStage(pass,stars,score,title,extraPrinciple){
    const sys=SYSTEMS[G.sysIdx];
    const stage=sys.steps[G.stageIdx];
    const isLast=G.stageIdx>=sys.stages.length-1;
    if(pass){
        G.totalScore+=score;
        sfxRight();
    }else{
        sfxWrong();
    }
    G.resultPopup={
        pass,stars,score,title:title||stage.title,
        principle:extraPrinciple||sys.principle,
        isLast
    };
    G.stageComplete=pass;
    if(isLast&&pass){
        G.sysStars[G.sysIdx]=Math.max(G.sysStars[G.sysIdx],stars);
        G.sysPassed[G.sysIdx]=true;
    }
}

function nextStage(){
    const sys=SYSTEMS[G.sysIdx];
    G.resultPopup=null;G.stageComplete=false;
    G.clickedParts=new Set();G.pathIndex=0;G.quizIdx=0;G.selectedPart=null;
    G.partFlash={};G.wrongPath=false;
    if(G.stageIdx<sys.stages.length-1){
        G.stageIdx++;sfxScore();
    }else{
        if(G.sysIdx>=SYSTEMS.length-1){G.state=STATE_OVER;sfxWin();}
        else{G.sysIdx++;G.stageIdx=0;sfxStart();}
    }
}

function replayStage(){
    G.resultPopup=null;G.stageComplete=false;
    G.clickedParts=new Set();G.pathIndex=0;G.quizIdx=0;G.selectedPart=null;
    G.partFlash={};G.wrongPath=false;
    sfxClick();
}

function onPointerDown(p){
    G._btns={};G._optBtns=[];
    if(G.state===STATE_MENU){startGame();sfxStart();return;}
    if(G.showingHint){if(hitBtn(p,'closeHint')){G.showingHint=false;sfxClick();}return;}
    if(G.showingPrinciple){if(hitBtn(p,'closePrin')){G.showingPrinciple=false;sfxClick();}return;}
    if(G.resultPopup){
        if(hitBtn(p,'next')){nextStage();return;}
        if(hitBtn(p,'replay')){replayStage();return;}
        if(hitBtn(p,'showprin')){G.showingPrinciple=true;sfxClick();return;}
    }
    if(G.state===STATE_PAUSE){
        if(hitBtn(p,'resume')){G.state=STATE_PLAYING;sfxClick();}
        else if(hitBtn(p,'menu')){G.state=STATE_MENU;sfxClick();}
        return;
    }
    if(G.state===STATE_OVER){
        if(hitBtn(p,'restart')){initState();G.state=STATE_PLAYING;sfxStart();}
        else if(hitBtn(p,'menu')){G.state=STATE_MENU;sfxClick();}
        return;
    }
    if(G.state!==STATE_PLAYING)return;
    drawHUD();
    if(hitBtn(p,'hint')){G.showingHint=true;sfxClick();return;}
    if(hitBtn(p,'prin')){G.showingPrinciple=true;sfxClick();return;}
    if(hitBtn(p,'retry')){replayStage();return;}
    if(hitBtn(p,'skip')){
        completeStage(true,1,50,'跳过',SYSTEMS[G.sysIdx].principle);
        return;
    }
    if(hitBtn(p,'pause')){G.state=STATE_PAUSE;sfxClick();return;}
    if(G.resultPopup)return;
    const sys=SYSTEMS[G.sysIdx];const stage=sys.steps[G.stageIdx];
    if(G._optBtns&&G._optBtns.length){
        drawQuiz();
        for(let i=0;i<G._optBtns.length;i++){
            const ob=G._optBtns[i];
            if(p.x>=ob.x&&p.x<=ob.x+ob.w&&p.y>=ob.y&&p.y<=ob.y+ob.h){
                let correct=false,explanation='';
                if(stage.type==='quiz'){
                    correct=i===stage.qs[G.quizIdx].a;
                    if(correct){
                        G.quizIdx++;G.totalScore+=25;sfxRight();
                        G.partFlash['correct']=20;
                        if(G.quizIdx>=stage.qs.length){
                            completeStage(true,3,75,'问答测验',sys.principle);
                        }
                    }else{sfxFail();G.wrongTimer=30;G.wrongPath=true;}
                }else if(stage.q){
                    correct=i===stage.answer;
                    if(correct){
                        const stars=G.clickedParts.size>=((stage.targets||stage.path||[]).length*0.8)?3:G.pathIndex?3:2;
                        completeStage(true,stars,(stars+1)*25,stage.title,sys.principle);
                    }else{sfxFail();G.wrongTimer=30;G.wrongPath=true;}
                }
                return;
            }
        }
    }
    const hit=hitPart(p);
    if(hit){
        G.selectedPart=hit.id;G.partFlash[hit.id]=18;sfxClick();
        if(G.stageComplete||G.resultPopup)return;
        if(stage.type==='label'&&stage.targets){
            if(stage.targets.includes(hit.id)){
                G.clickedParts.add(hit.id);sfxRight();
                if(G.clickedParts.size===stage.targets.length){
                    setTimeout(()=>{
                        if(!G._optBtns)completeStage(true,3,80,stage.title,sys.principle);
                    },500);
                }
            }else{
                sfxWrong();G.wrongTimer=25;
            }
        }else if(stage.type==='path'&&stage.path){
            if(hit.id===stage.path[G.pathIndex]){
                G.clickedParts.add(hit.id);G.pathIndex++;sfxRight();
                if(G.pathIndex>=stage.path.length){
                    setTimeout(()=>{
                        if(!G._optBtns)completeStage(true,3,80,stage.title,sys.principle);
                    },400);
                }
            }else{
                sfxWrong();G.wrongPath=true;G.wrongTimer=30;
                G.pathIndex=0;G.clickedParts=new Set();
            }
        }
    }
}

        ['② 到肺泡','气管→支气管→7亿个肺泡(摊开有网球场大!)','气'],
        ['③ 气体交换','肺泡薄膜: O₂进血液 / CO₂从血出来','交'],
        ['④ 氧气运输','红血球载O₂到全身每个细胞线粒体','运'],
        ['⑤ 细胞呼吸','葡萄糖+O₂ → 能量ATP+CO₂+H₂O (燃烧!)','燃'],
        ['⑥ 呼气','膈肌放松→胸腔变小→肺收缩→CO₂废气排出','呼']
    ];
    for(let i=0;i<breath.length;i++){
        const b=breath[i];
        const y=cy-125+i*45;
        ctx.fillStyle=i%2===0?'rgba(33,150,243,0.12)':'rgba(33,150,243,0.06)';
        ctx.fillRect(cx-185,y-18,370,40);
        ctx.strokeStyle='#90caf9';ctx.lineWidth=1;ctx.strokeRect(cx-185,y-18,370,40);
        ctx.fillStyle='#1976d2';ctx.font='34px Microsoft YaHei';ctx.textAlign='center';
        ctx.fillText(b[2],cx-165,y+10);
        ctx.fillStyle='#64b5f6';ctx.font='bold 12px Microsoft YaHei';ctx.textAlign='left';
        ctx.fillText(b[0],cx-130,y+5);
        ctx.fillStyle='#fff';ctx.font='11px Microsoft YaHei';
        ctx.fillText(b[1],cx-130,y+22);
    }
    const comps=[
        ['吸入空气','78%氮','21%氧','0.04%CO₂'],
        ['呼出气','78%氮','16%氧','4%CO₂+水汽']
    ];
    for(let i=0;i<2;i++){
        const y=cy+155+i*18;
        ctx.fillStyle=i===0?'rgba(76,175,80,0.12)':'rgba(244,67,54,0.12)';
        ctx.fillRect(cx-190,y-12,380,15);
        ctx.fillStyle=i===0?'#4caf50':'#ef5350';ctx.font='bold 11px Microsoft YaHei';ctx.textAlign='left';
        ctx.fillText(comps[i][0],cx-180,y);
        ctx.fillStyle='#fff';ctx.font='10px Microsoft YaHei';ctx.textAlign='center';
        ctx.fillText(comps[i][1],cx-90,y);
        ctx.fillStyle=comps[i][2].includes('21%')?'#00e676':'#ff5252';
        ctx.fillText(comps[i][2],cx,y);
        ctx.fillStyle='#ffcc80';ctx.fillText(comps[i][3],cx+100,y);
    }
    ctx.fillStyle='#ffeb3b';ctx.font='bold 12px Microsoft YaHei';ctx.textAlign='center';
    ctx.fillText('💡 每次呼吸约500ml，一天2万次！肺活量男3.5L女2.5L',cx,cy+185);
    ctx.lineWidth=1;
}

function drawResultReportCard(sys,marks){
    const cx=W/2,cy=400;
    ctx.fillStyle='rgba(0,0,0,0.95)';ctx.fillRect(cx-210,cy-240,420,480);
    ctx.strokeStyle=sys.color;ctx.lineWidth=4;ctx.strokeRect(cx-210,cy-240,420,480);
    ctx.fillStyle=sys.color;ctx.font='bold 24px Microsoft YaHei';ctx.textAlign='center';
    ctx.fillText(sys.emoji+' '+sys.name+'  · 行医报告',cx,cy-210);
    const star=Math.floor(marks.total/34);
    let stars='';for(let i=0;i<3;i++)stars+=i<star?'★':'☆';
    ctx.fillStyle='#ffd700';ctx.font='bold 32px Microsoft YaHei';ctx.fillText(stars,cx,cy-178);
    ctx.fillStyle='#fff';ctx.font='bold 16px Microsoft YaHei';ctx.fillText('总分 '+marks.total+'/100 分',cx,cy-150);
    const items=[
        ['认识结构标对',marks.labelScore,marks.labelTotal,sys.color],
        ['路径顺序正确',marks.pathScore,marks.pathTotal,'#ff9800'],
        ['问答选择正确',marks.quizScore,marks.quizTotal,'#4caf50'],
        ['完成速度奖励',marks.speedScore,30,'#2196f3']
    ];
    for(let i=0;i<items.length;i++){
        const it=items[i];
        const y=cy-120+i*52;
        ctx.fillStyle=i%2===0?'rgba(255,255,255,0.05)':'rgba(255,255,255,0.08)';
        ctx.fillRect(cx-185,y-20,370,45);
        ctx.strokeStyle=it[3];ctx.lineWidth=2;ctx.strokeRect(cx-185,y-20,370,45);
        ctx.fillStyle='#eee';ctx.font='bold 13px Microsoft YaHei';ctx.textAlign='left';
        ctx.fillText(it[0],cx-175,y+8);
        const pct=it[2]>0?it[1]/it[2]:0;
        ctx.fillStyle='rgba(255,255,255,0.1)';ctx.fillRect(cx+20,y-8,190,18);
        ctx.fillStyle=it[3];ctx.fillRect(cx+20,y-8,190*pct,18);
        ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.strokeRect(cx+20,y-8,190,18);
        ctx.fillStyle='#fff';ctx.font='bold 12px Microsoft YaHei';ctx.textAlign='right';
        ctx.fillText(it[1]+'/'+it[2],cx+185,y+8);
    }
    const grade=marks.total>=90?'🏆 神医再世 (90+)':
                marks.total>=70?'👍 优秀医学生 (70+)':
                marks.total>=50?'✅ 合格医护员 (50+)':'📚 需要继续学习';
    const gc=marks.total>=90?'#ffd700':marks.total>=70?'#4caf50':marks.total>=50?'#2196f3':'#ef5350';
    ctx.fillStyle=gc;ctx.font='bold 20px Microsoft YaHei';ctx.textAlign='center';
    ctx.fillText(grade,cx,cy+120);
    const tips=[
        marks.labelScore<marks.labelTotal?'💡 建议：记住各器官功能+位置！':'',
        marks.pathScore<marks.pathTotal?'💡 建议：亲自比划流程加强记忆！':'',
        marks.quizScore<marks.quizTotal?'💡 建议：多看系统原理解释！':''
    ].filter(x=>x);
    for(let i=0;i<tips.length;i++){
        ctx.fillStyle='#ffab91';ctx.font='11px Microsoft YaHei';ctx.textAlign='center';
        ctx.fillText(tips[i],cx,cy+150+i*18);
    }
    const nx=W/2-110,ny=cy+200,nw=220,nh=42;
    ctx.fillStyle='#ff9800';ctx.fillRect(nx,ny,nw,nh);
    ctx.strokeStyle='#e65100';ctx.lineWidth=3;ctx.strokeRect(nx,ny,nw,nh);
    ctx.fillStyle='#fff';ctx.font='bold 16px Microsoft YaHei';
    ctx.fillText('➡ 继续下一个系统',nx+nw/2,ny+28);
    ctx.lineWidth=1;
}

function update(){
    G.animT++;G.pulseT++;
    if(G.sysIdx===0)G.beatT++;
    if(G.sysIdx===3)G.breathT++;
    if(G.wrongTimer>0)G.wrongTimer--;
    if(G.wrongTimer===1)G.wrongPath=false;
    for(const k of Object.keys(G.partFlash)){
        G.partFlash[k]--;
        if(G.partFlash[k]<=0)delete G.partFlash[k];
    }
}

function draw(){
    G._btns={};G._optBtns=[];
    ctx.clearRect(0,0,W,H);
    if(G.state===STATE_MENU){drawMenu();return;}
    const sys=SYSTEMS[G.sysIdx];
    ctx.fillStyle=sys.bg;ctx.fillRect(0,0,W,H);
    if(G.wrongPath&&G.wrongTimer>0){
        ctx.save();ctx.globalAlpha=G.wrongTimer/30*0.35;
        ctx.fillStyle='#f44336';ctx.fillRect(0,0,W,H);ctx.restore();
    }
    if(sys.id==='heart')drawHeart();
    else if(sys.id==='brain')drawBrain();
    else if(sys.id==='digest')drawDigest();
    else if(sys.id==='lung')drawLung();
    drawHUD();
    drawQuiz();
    if(G.state===STATE_PAUSE)drawPause();
    if(G.state===STATE_OVER)drawGameOver();
    drawResultPopup();
    if(G.showingHint)drawHint();
    if(G.showingPrinciple)drawPrinciple();
}

function startGame(){
    initState();G.state=STATE_PLAYING;
}

function loop(){
    if(G&&G.state===STATE_PLAYING)update();
    draw();
}

setInterval(loop,16);

canvas.addEventListener('mousedown',e=>{e.preventDefault();onPointerDown(getPos(e));});
canvas.addEventListener('mousemove',e=>{onPointerMove(getPos(e));});
canvas.addEventListener('mouseup',e=>{onPointerUp(getPos(e));});
canvas.addEventListener('touchstart',e=>{e.preventDefault();if(e.touches[0])onPointerDown(getPos(e.touches[0]));},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();if(e.touches[0])onPointerMove(getPos(e.touches[0]));},{passive:false});
canvas.addEventListener('touchend',e=>{e.preventDefault();if(e.changedTouches[0])onPointerUp(getPos(e.changedTouches[0]));},{passive:false});

document.addEventListener('keydown',e=>{
    if(e.key===' '||e.key==='Enter'){
        e.preventDefault();
        if(G&&G.state===STATE_MENU){sfxStart();startGame();}
        else if(G&&G.state===STATE_OVER){initState();G.state=STATE_PLAYING;sfxStart();}
    }
    if(e.key==='Escape'){
        e.preventDefault();
        if(G){if(G.state===STATE_PLAYING)G.state=STATE_PAUSE;else if(G.state===STATE_PAUSE)G.state=STATE_PLAYING;}
    }
    if(G&&G.state===STATE_PLAYING&&!G.resultPopup){
        if(e.key>='1'&&e.key<='4'){
            const optIdx=parseInt(e.key)-1;
            if(G._optBtns&&G._optBtns[optIdx])onPointerDown({x:G._optBtns[optIdx].x+5,y:G._optBtns[optIdx].y+5});
        }
    }
});

const _sbtn=document.getElementById('start-game-btn');
_sbtn.addEventListener('click',function(){
    initAudio();startGame();sfxStart();this.style.display='none';
});

if(!G)initState();

})();
</script>

  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
