let audioCtx=null;
function initAudio(){
    if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
}
function playTone(freq,dur,type,vol){
    if(!audioCtx)return;
    try{
        const o=audioCtx.createOscillator();
        const g=audioCtx.createGain();
        o.type=type||'square';
        o.frequency.value=freq;
        g.gain.value=vol||0.15;
        g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
        o.connect(g);g.connect(audioCtx.destination);
        o.start();o.stop(audioCtx.currentTime+dur);
    }catch(e){}
}
function sfxStart(){playTone(523,0.1,'sine',0.2);setTimeout(()=>playTone(659,0.1,'sine',0.2),100);setTimeout(()=>playTone(784,0.15,'sine',0.2),200)}
function sfxScore(){playTone(880,0.08,'sine',0.18);setTimeout(()=>playTone(1047,0.1,'sine',0.18),80);setTimeout(()=>playTone(1319,0.15,'sine',0.18),160)}
function sfxFail(){playTone(220,0.15,'sawtooth',0.18);setTimeout(()=>playTone(165,0.25,'sawtooth',0.18),120)}
function sfxClick(){playTone(660,0.05,'triangle',0.12)}
function sfxFocus(){playTone(1200,0.05,'sine',0.12)}
function sfxCapture(){for(let i=0;i<4;i++){setTimeout(()=>playTone(800+i*200,0.1,'sine',0.18),i*80)}}
function sfxMeteor(){playTone(1500,0.02,'sine',0.1);setTimeout(()=>playTone(1200,0.02,'sine',0.08),20);setTimeout(()=>playTone(900,0.03,'sine',0.06),40)}

    canvas.width=cw;canvas.height=ch;
    scale=cw/W;
    ctx.setTransform(scale,0,0,scale,0,0);
}
window.addEventListener('resize',resize);resize();

function getPos(e){

    return {x:(e.clientX-r.left)/scale,y:(e.clientY-r.top)/scale};

let G;

function initState(){
    G={
        state:STATE_PLAYING,
        score:0,
        high:Storage.load('tianwen_gaoce_highscore',0),
        level:0,
        time:180,
        lastTime:0,
        az:0,
        alt:0,
        targetAz:0,
        targetAlt:0,
        targetIdx:0,
        collected:[],
        clarity:0,
        focusTimer:0,
        needFocus:2,
        capturing:false,
        captureProgress:0,
        meteors:[],
        meteorTimer:0,
        stars:[],
        principle:null,
        principleTimer:0,
        dragging:null,
        buttons:[],
        message:'',
        messageTimer:0,
        phase:0,
        moonPhase:0
    };
    for(let i=0;i<200;i++){
        G.stars.push({
            x:Math.random()*W,
            y:Math.random()*H*0.6,
            r:Math.random()*1.5+0.3,
            s:Math.random()*0.5+0.3,
            tw:Math.random()*Math.PI*2
        });
    }
    startLevel();
}

function startLevel(){
    G.targetIdx=G.level%TARGETS.length;
    const t=TARGETS[G.targetIdx];
    G.targetAz=t.az;
    G.targetAlt=t.alt;
    G.az=Math.random()*360;
    G.alt=10+Math.random()*60;
    G.clarity=0;
    G.focusTimer=0;
    G.capturing=false;
    G.captureProgress=0;
    if(t.id==='moon'){
        G.moonPhase=Math.floor(Math.random()*8);
    }
    showMessage('对准：'+t.name+' '+t.emoji,3);
}

function showMessage(msg,dur){
    G.message=msg;
    G.messageTimer=dur*60;
}

function showPrinciple(t){
    G.principle=t;
    G.principleTimer=600;
}

function addMeteor(){
    G.meteors.push({
        x:Math.random()*W,
        y:-20,
        vx:(Math.random()-0.5)*6-2,
        vy:4+Math.random()*4,
        len:30+Math.random()*30,
        life:60+Math.random()*40
    });
    sfxMeteor();
}

function update(dt){
    if(G.messageTimer>0)G.messageTimer--;
    if(G.principleTimer>0)G.principleTimer--;
    
    G.time-=dt;
    if(G.time<=0){
        G.time=0;
        endGame();
        return;
    }
    
    G.meteorTimer++;
    if(G.meteorTimer>240+Math.random()*240){
        G.meteorTimer=0;
        addMeteor();
    }
    
    for(let i=G.meteors.length-1;i>=0;i--){
        const m=G.meteors[i];
        m.x+=m.vx;
        m.y+=m.vy;
        m.life--;
        const dx=240-(W/2+Math.cos((G.az-G.targetAz)*Math.PI/180)*Math.sin(G.targetAlt*Math.PI/180)*200);
        const dy=250-(H/2-Math.sin((G.alt-G.targetAlt)*Math.PI/180)*200);
        if(Math.abs(m.x-W/2-240+W/2)<30 && Math.abs(m.y-250)<30 && !G.capturing){
            G.score+=50;
            showMessage('🌠 流星！+50分',2);
            sfxScore();
        }
        if(m.life<=0||m.y>H)G.meteors.splice(i,1);
    }
    
    for(const s of G.stars){
        s.tw+=0.05;
    }
    
    const azDiff=Math.abs(((G.az-G.targetAz+540)%360)-180);
    const altDiff=Math.abs(G.alt-G.targetAlt);
    
    let newClarity=0;
    const azErr=azDiff;
    const altErr=altDiff;
    const maxErr=20;
    if(azErr<maxErr && altErr<maxErr){
        newClarity=Math.max(0,100-(azErr+altErr)*5);
        G.focusTimer+=dt*60;
        if(newClarity>G.clarity)G.clarity=newClarity;
        if(G.focusTimer>20){
            sfxFocus();
            G.focusTimer=0;
        }
    }else{
        G.focusTimer=0;
        G.clarity=Math.max(0,G.clarity-dt*30);
    }
    
    if(G.capturing){
        G.captureProgress+=dt*0.4;
        if(G.captureProgress>=1){
            G.captureProgress=1;
            completeCapture();
        }
    }
}

function completeCapture(){
    const t=TARGETS[G.targetIdx];
    const quality=Math.floor(G.clarity);
    let bonus=0;
    if(quality>=90){bonus=100;showMessage('🌟 完美观测！清晰度'+quality+'% +'+bonus+'分',3)}
    else if(quality>=70){bonus=70;showMessage('👍 良好观测！清晰度'+quality+'% +'+bonus+'分',3)}
    else if(quality>=50){bonus=40;showMessage('😊 合格观测！清晰度'+quality+'% +'+bonus+'分',3)}
    else{bonus=20;showMessage('😅 勉强看清。清晰度'+quality+'% +'+bonus+'分',3)}
    
    G.score+=bonus+quality;
    G.collected.push({idx:G.targetIdx,quality:quality,t:t});
    
    if(G.score>G.high){
        G.high=G.score;
        Storage.save('tianwen_gaoce_highscore',G.high);
    }
    
    sfxCapture();
    showPrinciple(t);
    
    setTimeout(()=>{
        if(G.level>=9){
            endGame();
        }else{
            G.level++;
            startLevel();
        }
    },4000);
    
    G.capturing=false;
}

function endGame(){
    G.state=STATE_OVER;
    if(G.score>G.high){
        G.high=G.score;
        Storage.save('tianwen_gaoce_highscore',G.high);
    }
    sfxWin();
}

function startGame(){
    initState();
    sfxStart();
}

function draw(){
    ctx.fillStyle='#0a0e27';
    ctx.fillRect(0,0,W,H);
    
    drawSkyBackground();
    
    switch(G.state){
        case STATE_MENU:drawMenu();break;
        case STATE_PLAYING:drawGame();drawHUD();break;
        case STATE_PAUSE:drawGame();drawPause();break;
        case STATE_OVER:drawGame();drawOver();break;
    }
    
    if(G.messageTimer>0)drawMessage();
    if(G.principleTimer>0 && G.principle)drawPrinciple();
}

function drawSkyBackground(){
    const grad=ctx.createLinearGradient(0,0,0,H*0.6);
    grad.addColorStop(0,'#000510');
    grad.addColorStop(0.5,'#0a1628');
    grad.addColorStop(1,'#1a237e');
    ctx.fillStyle=grad;
    ctx.fillRect(0,0,W,H*0.6);
    
    for(const s of G.stars){
        const a=0.5+Math.sin(s.tw)*0.5;
        ctx.globalAlpha=a;
        ctx.fillStyle='#fff';
        ctx.beginPath();
        ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
        ctx.fill();
    }
    ctx.globalAlpha=1;
    
    for(const m of G.meteors){
        const alpha=Math.min(1,m.life/40);
        ctx.strokeStyle='rgba(255,255,200,'+alpha+')';
        ctx.lineWidth=2;
        ctx.beginPath();
        ctx.moveTo(m.x,m.y);
        ctx.lineTo(m.x-m.vx*m.len/5,m.y-m.vy*m.len/5);
        ctx.stroke();
        ctx.fillStyle='rgba(255,255,255,'+alpha+')';
        ctx.beginPath();
        ctx.arc(m.x,m.y,2,0,Math.PI*2);
        ctx.fill();
    }
    
    ctx.fillStyle='#1b5e20';
    ctx.fillRect(0,H*0.58,W,H*0.08);
    ctx.fillStyle='#2e7d32';
    for(let i=0;i<12;i++){
        const x=i*45+10;
        const y=H*0.58;
        ctx.beginPath();
        ctx.moveTo(x-15,y+5);
        ctx.lineTo(x,y-20-Math.sin(i)*8);
        ctx.lineTo(x+15,y+5);
        ctx.fill();
    }
}

function drawTelescopeView(t){
    const cx=240,cy=250,cr=180;
    
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx,cy,cr,0,Math.PI*2);
    ctx.clip();
    
    let dx=0,dy=0;
    const azOffset=((G.az-G.targetAz+540)%360)-180;
    const altOffset=G.alt-G.targetAlt;
    dx=-azOffset*3;
    dy=altOffset*3;
    
    ctx.fillStyle='#000814';
    ctx.fillRect(cx-cr,cy-cr,cr*2,cr*2);
    
    for(let i=0;i<50;i++){
        const sx=cx-cr+Math.random()*cr*2+dx*0.3;
        const sy=cy-cr+Math.random()*cr*2+dy*0.3;
        if(sx>cx-cr&&sx<cx+cr&&sy>cy-cr&&sy<cy+cr){
            const a=0.3+Math.random()*0.5;
            ctx.globalAlpha=a;
            ctx.fillStyle='#fff';
            ctx.fillRect(sx,sy,1,1);
        }
    }
    ctx.globalAlpha=1;
    
    const clarityFactor=G.clarity/100;
    
    if(t.type==='constellation'){
        drawConstellation(t,cx+dx,cy+dy,clarityFactor);
    }else if(t.type==='planet'){
        drawPlanet(t,cx+dx,cy+dy,clarityFactor);
    }else if(t.type==='moon'){
        drawMoon(t,cx+dx,cy+dy,clarityFactor,G.moonPhase);
    }
    
    ctx.strokeStyle='rgba(255,255,255,0.3)';
    ctx.lineWidth=0.5;
    ctx.beginPath();
    ctx.moveTo(cx-cr,cy);ctx.lineTo(cx+cr,cy);
    ctx.moveTo(cx,cy-cr);ctx.lineTo(cx,cy+cr);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx,cy,cr*0.5,0,Math.PI*2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx,cy,cr*0.8,0,Math.PI*2);
    ctx.stroke();
    
    ctx.restore();
    
    ctx.strokeStyle='#455a64';
    ctx.lineWidth=8;
    ctx.beginPath();
    ctx.arc(cx,cy,cr+4,0,Math.PI*2);
    ctx.stroke();
    
    if(G.clarity>0){
        const barW=cr*1.6,barH=10;
        const bx=cx-barW/2,by=cy+cr+20;
        ctx.fillStyle='rgba(0,0,0,0.5)';
        ctx.fillRect(bx-2,by-2,barW+4,barH+4);
        let col='#f44336';
        if(G.clarity>=90)col='#4caf50';
        else if(G.clarity>=70)col='#8bc34a';
        else if(G.clarity>=50)col='#ffc107';
        ctx.fillStyle=col;
        ctx.fillRect(bx,by,barW*(G.clarity/100),barH);
        ctx.strokeStyle='#fff';
        ctx.lineWidth=1;
        ctx.strokeRect(bx,by,barW,barH);
        ctx.fillStyle='#fff';
        ctx.font='bold 12px Microsoft YaHei';
        ctx.textAlign='center';
        ctx.fillText('清晰度 '+Math.floor(G.clarity)+'%',cx,by+barH+15);
    }
    
    if(G.capturing){
        ctx.fillStyle='rgba(255,255,255,0.3)';
        ctx.fillRect(0,0,W,H);
        const p=G.captureProgress;
        ctx.strokeStyle='#4caf50';
        ctx.lineWidth=6;
        ctx.lineCap='round';
        ctx.beginPath();
        ctx.arc(cx,cy,cr+20,-Math.PI/2,-Math.PI/2+p*Math.PI*2);
        ctx.stroke();
        ctx.lineCap='butt';
        ctx.fillStyle='#4caf50';
        ctx.font='bold 20px Microsoft YaHei';
        ctx.textAlign='center';
        ctx.fillText('📸 拍摄中 '+Math.floor(p*100)+'%',cx,cy+cr+55);
    }
}

function drawConstellation(t,cx,cy,cf){
    if(cf<0.05)return;
    ctx.globalAlpha=Math.max(0.1,cf);
    
    const stars=t.stars;
    for(const s of stars){
        const x=cx+s[0]*1.5,y=cy+s[1]*1.5;
        const r=2+Math.random()*2;
        const grad=ctx.createRadialGradient(x,y,0,x,y,r*4);
        grad.addColorStop(0,t.color);
        grad.addColorStop(1,'transparent');
        ctx.fillStyle=grad;
        ctx.beginPath();
        ctx.arc(x,y,r*4,0,Math.PI*2);
        ctx.fill();
        ctx.fillStyle='#fff';
        ctx.beginPath();
        ctx.arc(x,y,r*cf,0,Math.PI*2);
        ctx.fill();
    }
    
    if(cf>0.3){
        ctx.strokeStyle=t.color;
        ctx.lineWidth=1.5*cf;
        ctx.globalAlpha=cf*0.6;
        for(const ln of t.lines){
            const a=stars[ln[0]],b=stars[ln[1]];
            ctx.beginPath();
            ctx.moveTo(cx+a[0]*1.5,cy+a[1]*1.5);
            ctx.lineTo(cx+b[0]*1.5,cy+b[1]*1.5);
            ctx.stroke();
        }
    }
    
    if(cf>0.7){
        ctx.globalAlpha=cf;
        ctx.fillStyle=t.color;
        ctx.font='bold 14px Microsoft YaHei';
        ctx.textAlign='center';
        ctx.fillText(t.name,cx,cy+stars[stars.length-1][1]*1.5+25);
    }
    ctx.globalAlpha=1;
}

function drawPlanet(t,cx,cy,cf){
    if(cf<0.05)return;
    ctx.globalAlpha=Math.max(0.1,cf);
    const r=t.radius*Math.max(0.3,cf);
    
    if(t.hasRing){
        ctx.save();
        ctx.translate(cx,cy);
        ctx.rotate(0.3);
        ctx.scale(1,0.3);
        ctx.strokeStyle='rgba(255,224,130,'+cf+')';
        ctx.lineWidth=r*0.5;
        ctx.beginPath();
        ctx.arc(0,0,r*2.2,0,Math.PI*2);
        ctx.stroke();
        ctx.strokeStyle='rgba(255,193,7,'+cf*0.7+')';
        ctx.lineWidth=r*0.2;
        ctx.beginPath();
        ctx.arc(0,0,r*2.6,0,Math.PI*2);
        ctx.stroke();
        ctx.restore();
    }
    
    const grad=ctx.createRadialGradient(cx-r*0.3,cy-r*0.3,r*0.1,cx,cy,r);
    grad.addColorStop(0,'#fff');
    grad.addColorStop(0.3,t.color);
    grad.addColorStop(1,'#333');
    ctx.fillStyle=grad;
    ctx.beginPath();
    ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.fill();
    
    if(t.bands){
        ctx.save();
        ctx.beginPath();
        ctx.arc(cx,cy,r,0,Math.PI*2);
        ctx.clip();
        for(let i=0;i<t.bands.length;i++){
            ctx.fillStyle=t.bands[i];
            ctx.globalAlpha=0.5*cf;
            ctx.fillRect(cx-r,cy-r+i*(r*2/t.bands.length),r*2,r*2/t.bands.length);
        }
        ctx.restore();
    }
    
    if(t.features){
        ctx.save();
        ctx.beginPath();
        ctx.arc(cx,cy,r,0,Math.PI*2);
        ctx.clip();
        for(const f of t.features){
            ctx.fillStyle=f[3];
            ctx.globalAlpha=0.6*cf;
            ctx.beginPath();
            ctx.arc(cx+f[0]*r,cy+f[1]*r,f[2]*r,0,Math.PI*2);
            ctx.fill();
        }
        ctx.restore();
    }
    
    if(t.atmosphere){
        ctx.strokeStyle='rgba(255,255,200,'+cf*0.5+')';
        ctx.lineWidth=2;
        ctx.beginPath();
        ctx.arc(cx,cy,r+3,0,Math.PI*2);
        ctx.stroke();
    }
    
    if(cf>0.6){
        ctx.globalAlpha=cf;
        ctx.fillStyle='#fff';
        ctx.font='bold 14px Microsoft YaHei';
        ctx.textAlign='center';
        ctx.fillText(t.name+' '+t.emoji,cx,cy+r+20);
    }
    ctx.globalAlpha=1;
}

function drawMoon(t,cx,cy,cf,phase){
    if(cf<0.05)return;
    ctx.globalAlpha=Math.max(0.1,cf);
    const r=25*Math.max(0.3,cf);
    
    ctx.fillStyle='#e0e0e0';
    ctx.beginPath();
    ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.fill();
    
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.clip();
    
    const craters=[[0.3,-0.2,0.15],[-0.2,0.3,0.12],[0.1,0.1,0.1],[-0.4,-0.1,0.08],[0.2,0.4,0.11]];
    ctx.fillStyle='#bdbdbd';
    ctx.globalAlpha=0.7*cf;
    for(const c of craters){
        ctx.beginPath();
        ctx.arc(cx+c[0]*r,cy+c[1]*r,c[2]*r,0,Math.PI*2);
        ctx.fill();
    }
    
    const seas=[[-0.3,0.1,0.25],[0.2,-0.3,0.2],[0.1,0.3,0.18]];
    ctx.fillStyle='#9e9e9e';
    for(const s of seas){
        ctx.beginPath();
        ctx.ellipse(cx+s[0]*r,cy+s[1]*r,s[2]*r,s[2]*r*0.7,0,0,Math.PI*2);
        ctx.fill();
    }
    ctx.restore();
    
    ctx.globalAlpha=1;
    if(phase>0){
        ctx.save();
        ctx.beginPath();
        ctx.arc(cx,cy,r,0,Math.PI*2);
        ctx.clip();
        const shadeX=r*2*(phase/7-0.5)*2;
        const shadeLeft=phase<4;
        ctx.fillStyle='#000814';
        ctx.globalAlpha=0.9;
        if(shadeLeft){
            ctx.fillRect(cx-r,cy-r,shadeX+r,r*2);
        }else{
            ctx.fillRect(cx+shadeX-r,cy-r,r*2-(shadeX-r+cx)+cx,r*2);
        }
        if(phase===0){
            ctx.fillRect(cx-r,cy-r,r*2,r*2);
        }else if(phase===4){
            ctx.globalAlpha=0;
            ctx.fillRect(0,0,0,0);
        }
        ctx.restore();
    }
    
    if(cf>0.5){
        ctx.globalAlpha=cf;
        ctx.fillStyle='#fff';
        ctx.font='bold 13px Microsoft YaHei';
        ctx.textAlign='center';
        const phaseName=t.phases[phase]||'满月';
        ctx.fillText('月相：'+phaseName,cx,cy+r+20);
    }
    ctx.globalAlpha=1;
}

    ];

function drawWheel(x,y,r,val,label,sub,target){
    ctx.fillStyle='rgba(255,255,255,0.08)';
    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.3)';
    ctx.lineWidth=3;
    ctx.stroke();
    
    for(let i=0;i<36;i++){
        const a=i*10*Math.PI/180-Math.PI/2;
        const isBig=i%3===0;
        const r1=r-8,r2=isBig?r-20:r-14;
        ctx.strokeStyle=isBig?'rgba(255,255,255,0.8)':'rgba(255,255,255,0.3)';
        ctx.lineWidth=isBig?2:1;
        ctx.beginPath();
        ctx.moveTo(x+Math.cos(a)*r1,y+Math.sin(a)*r1);
        ctx.lineTo(x+Math.cos(a)*r2,y+Math.sin(a)*r2);
        ctx.stroke();
    }
    
    const ang=val*Math.PI/180-Math.PI/2;
    ctx.strokeStyle='#2196f3';
    ctx.lineWidth=4;
    ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.lineTo(x+Math.cos(ang)*(r-12),y+Math.sin(ang)*(r-12));
    ctx.stroke();
    ctx.fillStyle='#2196f3';
    ctx.beginPath();
    ctx.arc(x,y,6,0,Math.PI*2);
    ctx.fill();
    
    const tAng=target*Math.PI/180-Math.PI/2;
    ctx.strokeStyle='rgba(76,175,80,0.6)';
    ctx.lineWidth=2;
    ctx.setLineDash([4,4]);
    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.lineTo(x+Math.cos(tAng)*(r-4),y+Math.sin(tAng)*(r-4));
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#4caf50';
    ctx.beginPath();
    ctx.arc(x+Math.cos(tAng)*(r-8),y+Math.sin(tAng)*(r-8),4,0,Math.PI*2);
    ctx.fill();
    ctx.lineCap='butt';
    
    ctx.fillStyle='#fff';
    ctx.font='bold 14px Microsoft YaHei';
    ctx.textAlign='center';
    ctx.fillText(label,x,y+4);
    ctx.font='11px Microsoft YaHei';
    ctx.fillStyle='#aaa';
    ctx.fillText(sub,x,y+18);
    ctx.fillStyle='#2196f3';
    ctx.font='bold 16px Microsoft YaHei';
    ctx.fillText(Math.floor(val)+'°',x,y+r+18);
}

    ctx.font='bold 16px Microsoft YaHei';
    ctx.fillText('📚 已收集图鉴 ('+G.collected.length+'/10)',W/2,315);
    
    for(let i=0;i<G.collected.length;i++){
        const c=G.collected[i];
        const x=45+(i%5)*82;
        const y=345+Math.floor(i/5)*110;
        ctx.fillStyle=c.quality>=90?'rgba(255,215,0,0.2)':c.quality>=70?'rgba(76,175,80,0.2)':'rgba(33,150,243,0.2)';
        ctx.fillRect(x-32,y-20,64,90);
        ctx.strokeStyle=c.quality>=90?'#ffd700':c.quality>=70?'#4caf50':'#2196f3';
        ctx.strokeRect(x-32,y-20,64,90);
        ctx.fillStyle=c.t.color;
        ctx.font='24px Microsoft YaHei';
        ctx.textAlign='center';
        ctx.fillText(c.t.emoji,x,y+10);
        ctx.fillStyle='#fff';
        ctx.font='11px Microsoft YaHei';
        ctx.fillText(c.t.name,x,y+30);
        let stars='★★★';
        if(c.quality<70)stars='★★☆';
        if(c.quality<50)stars='★☆☆';
        ctx.fillStyle=c.quality>=90?'#ffd700':'#ccc';
        ctx.font='bold 12px Microsoft YaHei';
        ctx.fillText(stars,x,y+46);
        ctx.fillStyle='#aaa';
        ctx.font='10px Microsoft YaHei';
        ctx.fillText(c.quality+'%',x,y+60);
    }
    
    const missing=10-G.collected.length;
    for(let i=0;i<missing;i++){
        const mi=G.collected.length+i;
        const x=45+(mi%5)*82;
        const y=345+Math.floor(mi/5)*110;
        ctx.fillStyle='rgba(100,100,100,0.2)';
        ctx.fillRect(x-32,y-20,64,90);
        ctx.strokeStyle='#555';
        ctx.strokeRect(x-32,y-20,64,90);
        ctx.fillStyle='#666';
        ctx.font='24px Microsoft YaHei';
        ctx.textAlign='center';
        ctx.fillText('❓',x,y+10);
        ctx.font='11px Microsoft YaHei';
        ctx.fillText('未解锁',x,y+40);
    }
    
    const bx=W/2,by=620,bw=180,bh=50;
    ctx.fillStyle='#4caf50';
    ctx.fillRect(bx-bw/2,by,bw,bh);
    ctx.fillStyle='#fff';
    ctx.font='bold 18px Microsoft YaHei';
    ctx.fillText('🔄 再玩一次',bx,by+33);
    G.retryBtn={x:bx-bw/2,y:by,w:bw,h:bh};
    
    ctx.fillStyle='#2196f3';
    ctx.fillRect(bx-bw/2,by+65,bw,bh);
    ctx.fillStyle='#fff';
    ctx.fillText('🏠 返回菜单',bx,by+98);
    G.menuBtn={x:bx-bw/2,y:by+65,w:bw,h:bh};
}

function drawMessage(){
    const alpha=Math.min(1,G.messageTimer/60);
    ctx.globalAlpha=alpha;
    ctx.fillStyle='rgba(0,0,0,0.8)';
    const tw=ctx.measureText(G.message).width+40;
    ctx.fillRect(W/2-tw/2,70,tw,36);
    ctx.strokeStyle='rgba(255,215,0,0.6)';
    ctx.lineWidth=1;
    ctx.strokeRect(W/2-tw/2,70,tw,36);
    ctx.fillStyle='#fff';
    ctx.font='bold 15px Microsoft YaHei';
    ctx.textAlign='center';
    ctx.fillText(G.message,W/2,95);
    ctx.globalAlpha=1;
}

function drawPrinciple(){
    const t=G.principle;
    const alpha=Math.min(1,G.principleTimer/60);
    const bx=40,by=150,bw=W-80,bh=350;
    ctx.globalAlpha=alpha;
    
    ctx.fillStyle='rgba(10,20,50,0.95)';
    ctx.fillRect(bx,by,bw,bh);
    ctx.strokeStyle=t.color;
    ctx.lineWidth=3;
    ctx.strokeRect(bx,by,bw,bh);
    
    ctx.fillStyle=t.color;
    ctx.font='bold 22px Microsoft YaHei';
    ctx.textAlign='center';
    ctx.fillText(t.emoji+' '+t.name+' 小知识',W/2,by+35);
    
    ctx.fillStyle='#fff';
    ctx.font='14px Microsoft YaHei';
    ctx.textAlign='left';
    const desc=t.desc;
    const words=desc.split('');
    let line='',ly=by+70;
    for(const ch of words){
        const test=line+ch;
        if(ctx.measureText(test).width>bw-40){
            ctx.fillText(line,bx+20,ly);
            line=ch;
            ly+=22;
        }else{
            line=test;
        }
    }
    if(line)ctx.fillText(line,bx+20,ly);
    
    ly+=20;
    ctx.fillStyle='#ffd54f';
    ctx.font='bold 14px Microsoft YaHei';
    ctx.fillText('💡 趣味事实：',bx+20,ly);
    ly+=22;
    ctx.fillStyle='#b3e5fc';
    ctx.font='13px Microsoft YaHei';
    const fact=t.fact;
    line='';
    for(const ch of fact){
        const test=line+ch;
        if(ctx.measureText(test).width>bw-40){
            ctx.fillText(line,bx+20,ly);
            line=ch;
            ly+=20;
        }else{
            line=test;
        }
    }
    if(line)ctx.fillText(line,bx+20,ly);
    
    ctx.globalAlpha=1;
}

function hitBtn(p,b){
    return b&&p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h;
}

function onPointerDown(p){
    sfxClick();
    if(G.state===STATE_MENU){
        startGame();
        return;
    }
    if(G.state===STATE_PAUSE){
        if(hitBtn(p,G.resumeBtn)){G.state=STATE_PLAYING;sfxStart()}
        else if(hitBtn(p,G.quitBtn)){G.state=STATE_MENU}
        return;
    }
    if(G.state===STATE_OVER){
        if(hitBtn(p,G.retryBtn))startGame();
        else if(hitBtn(p,G.menuBtn))G.state=STATE_MENU;
        return;
    }
    if(G.state===STATE_PLAYING){
        if(hitBtn(p,G.pauseBtn)){G.state=STATE_PAUSE;return}
        if(hitBtn(p,G.captureBtn)&&G.captureBtn.enabled){
            G.capturing=true;
            G.captureProgress=0;
            return;
        }
        for(const b of G.buttons){
            if(hitBtn(p,b)){
                G.dragging=b.name;
                return;
            }
        }
    }
}

function onPointerMove(p){
    if(G.dragging && G.state===STATE_PLAYING){
        if(G.dragging==='az'){
            const bx=100,by=650;
            const ang=Math.atan2(p.y-by,p.x-bx)*180/Math.PI+90;
            G.az=(ang+360)%360;
        }else if(G.dragging==='alt'){
            const bx=380,by=650;
            const ang=Math.atan2(p.y-by,p.x-bx)*180/Math.PI+90;
            G.alt=Math.max(0,Math.min(90,((ang+360)%360)/4));
        }
    }
}

function onPointerUp(){
    G.dragging=null;
}

document.addEventListener('keydown',function(e){
    if(e.code==='Space'||e.code==='Enter'){
        e.preventDefault();
        if(G.state===STATE_MENU||G.state===STATE_OVER)startGame();
        else if(G.state===STATE_PLAYING){
            if(G.captureBtn&&G.captureBtn.enabled&&!G.capturing){
                G.capturing=true;G.captureProgress=0;
            }
        }
    }else if(e.code==='Escape'){
        e.preventDefault();
        if(G.state===STATE_PLAYING)G.state=STATE_PAUSE;
        else if(G.state===STATE_PAUSE)G.state=STATE_PLAYING;
    }else if(G.state===STATE_PLAYING){
        if(e.code==='ArrowLeft')G.az=(G.az-5+360)%360;
        else if(e.code==='ArrowRight')G.az=(G.az+5)%360;
        else if(e.code==='ArrowUp')G.alt=Math.min(90,G.alt+3);
        else if(e.code==='ArrowDown')G.alt=Math.max(0,G.alt-3);
    }
});

canvas.addEventListener('mousedown',function(e){onPointerDown(getPos(e))});
canvas.addEventListener('mousemove',function(e){onPointerMove(getPos(e))});
canvas.addEventListener('mouseup',function(e){onPointerUp(getPos(e))});
canvas.addEventListener('touchstart',function(e){e.preventDefault();if(e.touches[0])onPointerDown(getPos(e.touches[0]))},{passive:false});
canvas.addEventListener('touchmove',function(e){e.preventDefault();if(e.touches[0])onPointerMove(getPos(e.touches[0]))},{passive:false});
canvas.addEventListener('touchend',function(e){e.preventDefault();onPointerUp()},{passive:false});

let lastT=0;
function loop(t){
    const dt=Math.min(0.05,(t-lastT)/1000||0);
    lastT=t;
    if(G.state===STATE_PLAYING)update(dt);
    draw();
    requestAnimationFrame(loop);
}

G={
    state:STATE_MENU,
    score:0,high:Storage.load('tianwen_gaoce_highscore',0),
    level:0,time:180,lastTime:0,az:0,alt:0,
    targetAz:0,targetAlt:0,targetIdx:0,collected:[],
    clarity:0,focusTimer:0,needFocus:2,capturing:false,
    captureProgress:0,meteors:[],meteorTimer:0,stars:[],
    principle:null,principleTimer:0,dragging:null,buttons:[],
    message:'',messageTimer:0,phase:0,moonPhase:0
};
for(let i=0;i<200;i++){
    G.stars.push({x:Math.random()*W,y:Math.random()*H*0.6,r:Math.random()*1.5+0.3,s:Math.random()*0.5+0.3,tw:Math.random()*Math.PI*2});
}

var _sbtn=document.getElementById('start-game-btn');
_sbtn.addEventListener('click',function(){initAudio();startGame();this.style.display='none';});
if(typeof showStartBtn==='function')showStartBtn();

requestAnimationFrame(loop);
})();
</script>

  var _origSetInterval = window.setInterval;

    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {

    _timerIds.push({type: 'interval', id: id});
    return id;
  };

    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });

})();

<script>
(function(){
  if (window.__perfStable) return;
  window.__perfStable = true;
  var _origRandom = Math.random;
  var _cache = [];
  for (var i = 0; i < 512; i++) _cache.push(_origRandom());
  var _idx = 0;
  var _frameCount = 0;
  var _origRAF = window.requestAnimationFrame || function(cb){return setTimeout(cb,16)};
  window.requestAnimationFrame = function(cb) {
    return _origRAF.call(window, function(ts) {
      _frameCount++;
      if (_frameCount % 30 === 0) {
        for (var j = 0; j < 20; j++) _cache[(_idx+j) % 512] = _origRandom();
      }
      _idx = 0;
      cb(ts);
    });
  };
  Math.random = function() {
    var v = _cache[_idx % 512];
    _idx++;
    return v;
  };
})();
</script>
