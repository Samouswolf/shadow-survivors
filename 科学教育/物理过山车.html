<body>

<button id="start-game-btn" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:20px 40px;font-size:20px;background:#00d9ff;color:#0a1628;border:none;border-radius:12px;cursor:pointer;z-index:999;font-weight:bold;">开始设计</button>

<canvas id="c"></canvas>

<script>
if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
</script>
<script src="../game_core.js"></script>
<script>
(function(){
"use strict";

const W=480,H=800;
const GRAVITY=0.35;
const FRICTION=0.992;
const BALL_R=10;

let audioCtx=null;
function initAudio(){
    if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
}
function playTone(freq,dur,type,vol){
    if(!audioCtx)return;
    try{
        const o=audioCtx.createOscillator();
        const g=audioCtx.createGain();
        o.type=type||'square';
        o.frequency.value=freq;
        g.gain.value=vol||0.15;
        g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
        o.connect(g);g.connect(audioCtx.destination);
        o.start();o.stop(audioCtx.currentTime+dur);
    }catch(e){}
}
function sfxStart(){playTone(523,0.1,'sine',0.2);setTimeout(()=>playTone(659,0.1,'sine',0.2),100);setTimeout(()=>playTone(784,0.15,'sine',0.2),200)}
function sfxScore(){playTone(880,0.08,'sine',0.18);setTimeout(()=>playTone(1047,0.1,'sine',0.18),80);setTimeout(()=>playTone(1319,0.15,'sine',0.18),160)}
function sfxFail(){playTone(220,0.15,'sawtooth',0.18);setTimeout(()=>playTone(165,0.25,'sawtooth',0.18),120)}
function sfxClick(){playTone(660,0.05,'triangle',0.12)}
function sfxRelease(){playTone(440,0.1,'sine',0.15);setTimeout(()=>playTone(880,0.15,'sine',0.15),80)}
function sfxLoop(){for(let i=0;i<3;i++){setTimeout(()=>playTone(600+i*100,0.08,'sine',0.1),i*50)}}
function sfxCrash(){playTone(100,0.3,'sawtooth',0.2);setTimeout(()=>playTone(80,0.2,'square',0.15),150)}

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let scale=1;
function resize(){
    const r=W/H;
    let cw=window.innerWidth,ch=window.innerHeight;
    if(cw/ch>r){ch=cw/r}else{cw=ch*r}
    canvas.width=cw;canvas.height=ch;
    scale=cw/W;
    ctx.setTransform(scale,0,0,scale,0,0);
}
window.addEventListener('resize',resize);
resize();

const LEVELS=[
    {
        id:'basic',
        name:'初级坡道',
        emoji:'🎢',
        desc:'学习基本的重力和动能',
        nodes:6,
        startH:100,
        endH:500,
        targetX:W-60,
        minH:80,
        maxH:550,
        loop:false,
        targetScore:70,
        principle:'机械能守恒：势能 PE = mgh，动能 KE = ½mv²。忽略摩擦时 PE+KE=常数。小球从高处释放，重力势能转化为动能。',
        formula:'PE + KE = 常数 (无摩擦时)'
    },
    {
        id:'double',
        name:'双坡挑战',
        emoji:'⛰️',
        desc:'上坡下坡的能量转换',
        nodes:8,
        startH:80,
        endH:520,
        targetX:W-60,
        minH:60,
        maxH:560,
        loop:false,
        targetScore:75,
        principle:'小球上坡时动能→势能(减速)，下坡时势能→动能(加速)。若最高点高度>起点，则小球无法通过(能量不足)。',
        formula:'v² = 2g(h₀-h) 无摩擦末速度'
    },
    {
        id:'loop',
        name:'回环过山车',
        emoji:'🎡',
        desc:'向心力完成圆环回环',
        nodes:10,
        startH:60,
        endH:520,
        targetX:W-60,
        minH:50,
        maxH:580,
        loop:true,
        loopCenter:{x:W*0.55,y:350},
        loopRadius:70,
        targetScore:80,
        principle:'圆周运动需要向心力 F=mv²/r。回环最高点最小速度 v=√(gr)。所以起点必须远高于环顶(至少2.5倍环半径)才能安全通过。',
        formula:'v_min = √(g·r) 回环顶不脱轨速度'
    },
    {
        id:'spiral',
        name:'螺旋下降',
        emoji:'🌀',
        desc:'螺旋轨道消耗能量',
        nodes:12,
        startH:50,
        endH:540,
        targetX:W-60,
        minH:40,
        maxH:560,
        loop:false,
        targetScore:78,
        principle:'摩擦力做功 W=f·s 转化为热能耗散。螺旋轨道更长→摩擦力做功更多→末速度更慢。总能量 E=PE+KE+热能(散失)。',
        formula:'W_friction = f × distance (路程)'
    },
    {
        id:'jump',
        name:'跳跃平台',
        emoji:'🏔️',
        desc:'抛物线飞跃间隙',
        nodes:9,
        startH:70,
        endH:510,
        targetX:W-60,
        minH:50,
        maxH:570,
        loop:false,
        hasJump:true,
        gapStart:W*0.55,
        gapEnd:W*0.70,
        targetScore:82,
        principle:'平抛运动：脱离轨道后水平匀速(x=v₀t)，竖直自由下落(y=½gt²)。水平速度越大，飞跃距离越远。需在起跳前获得足够速度。',
        formula:'d = v₀·√(2h/g) 平抛水平距离'
    }
];

const G={
    state:STATE_MENU,
    score:0,
    highScore:0,
    currentLevel:0,
    btnRects:{},
    keys:{},
    paused:false,
    nodes:[],
    selectedNode:-1,
    dragging:false,
    ball:null,
    running:false,
    runTime:0,
    trail:[],
    simulationResults:null,
    principleOpen:false,
    resultMsg:'',
    animationFrame:0,
    levelStars:[],
    totalStars:0
};

G.highScore=parseInt(Storage.load('coaster_highscore','0'));
const savedStars=Storage.load('coaster_stars',null);
if(savedStars)G.levelStars=savedStars;

function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
}

function drawBtn(ctx,x,y,w,h,text,name,color,textColor){
    G.btnRects[name]={x:x,y:y,w:w,h:h};
    ctx.fillStyle=color||'#00d9ff';
    ctx.strokeStyle='#fff';
    ctx.lineWidth=2;
    roundRect(ctx,x,y,w,h,8);
    ctx.fill();ctx.stroke();
    ctx.fillStyle=textColor||'#0a1628';
    ctx.font='bold 14px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(text,x+w/2,y+h/2);
    ctx.textBaseline='alphabetic';
}

function hitBtn(p,name){
    const r=G.btnRects[name];
    return r && p.x>=r.x && p.x<=r.x+r.w && p.y>=r.y && p.y<=r.y+r.h;
}

function getPos(e){
    const rect=canvas.getBoundingClientRect();
    const t=e.touches?e.touches[0]:e;
    return{x:(t.clientX-rect.left)/scale,y:(t.clientY-rect.top)/scale};
}

window.addEventListener('keydown',function(e){
    G.keys[e.key.toLowerCase()]=true;
    if(e.key===' '||e.key==='Enter'){
        e.preventDefault();
        initAudio();
        if(G.state===STATE_MENU){startGame();return}
        if(G.state===STATE_OVER){startGame();return}
        if(G.state===STATE_PLAYING&&!G.paused&&!G.running){releaseBall();return}
    }
    if(e.key==='Escape'){
        if(G.state===STATE_PLAYING)togglePause();
    }
    if(G.state===STATE_PLAYING&&!G.paused){
        if(e.key==='r'||e.key==='R'){resetBall();}
    }
});
window.addEventListener('keyup',function(e){
    G.keys[e.key.toLowerCase()]=false;
});

function handlePointerDown(e){
    initAudio();
    const p=getPos(e);
    if(G.state===STATE_MENU){
        if(hitBtn(p,'start')){startGame();return}
        if(hitBtn(p,'selectLeft')){changeLevel(-1);return}
        if(hitBtn(p,'selectRight')){changeLevel(1);return}
    } else if(G.state===STATE_OVER){
        if(hitBtn(p,'restart')){startGame();return}
        if(hitBtn(p,'menu')){G.state=STATE_MENU;return}
    } else if(G.state===STATE_PLAYING){
        if(G.paused){
            if(hitBtn(p,'resume')){togglePause();return}
            if(hitBtn(p,'quit')){G.state=STATE_MENU;G.paused=false;return}
            return;
        }
        if(G.principleOpen){
            if(hitBtn(p,'closePrinciple')){G.principleOpen=false;return}
            return;
        }
        if(hitBtn(p,'pauseBtn')){togglePause();return}
        if(hitBtn(p,'showPrinciple')){G.principleOpen=true;return}
        if(hitBtn(p,'release')&&!G.running){releaseBall();return}
        if(hitBtn(p,'reset')){resetBall();return}
        if(hitBtn(p,'nextLevel')&&G.simulationResults){nextLevel();return}
        handleNodeClick(p);
    }
}

function handlePointerMove(e){
    if(G.state!==STATE_PLAYING||G.paused||G.running)return;
    if(G.dragging&&G.selectedNode>=0){
        const p=getPos(e);
        const lv=LEVELS[G.currentLevel];
        const node=G.nodes[G.selectedNode];
        if(G.selectedNode>0&&G.selectedNode<G.nodes.length-1){
            node.y=Math.max(lv.minH,Math.min(lv.maxH,p.y));
            node.x=Math.max(60,Math.min(W-60,p.x));
        }
    }
}

function handlePointerUp(e){
    G.dragging=false;
    G.selectedNode=-1;
}

canvas.addEventListener('mousedown',handlePointerDown);
canvas.addEventListener('mousemove',handlePointerMove);
canvas.addEventListener('mouseup',handlePointerUp);
canvas.addEventListener('touchstart',function(e){e.preventDefault();handlePointerDown(e)},{passive:false});
canvas.addEventListener('touchmove',function(e){e.preventDefault();handlePointerMove(e)},{passive:false});
canvas.addEventListener('touchend',function(e){e.preventDefault();handlePointerUp(e)},{passive:false});

function handleNodeClick(p){
    for(let i=1;i<G.nodes.length-1;i++){
        const n=G.nodes[i];
        const d=Math.hypot(p.x-n.x,p.y-n.y);
        if(d<18){
            G.selectedNode=i;
            G.dragging=true;
            sfxClick();
            return;
        }
    }
}

function changeLevel(dir){
    G.currentLevel=(G.currentLevel+dir+LEVELS.length)%LEVELS.length;
    sfxClick();
}

function initNodes(){
    const lv=LEVELS[G.currentLevel];
    G.nodes=[];
    const n=lv.nodes;
    for(let i=0;i<n;i++){
        const t=i/(n-1);
        const x=40+t*(W-80);
        let y;
        if(i===0)y=lv.startH;
        else if(i===n-1)y=lv.endH;
        else{
            const midH=(lv.startH+lv.endH)/2;
            const amp=150;
            if(lv.id==='basic'){
                y=midH-Math.sin(t*Math.PI)*amp;
            }else if(lv.id==='double'){
                y=midH-Math.sin(t*Math.PI*2)*amp*0.7;
            }else if(lv.id==='loop'){
                y=midH-Math.sin(t*Math.PI*3)*amp*0.6;
            }else if(lv.id==='spiral'){
                y=lv.startH+t*(lv.endH-lv.startH)+Math.sin(t*Math.PI*6)*40;
            }else if(lv.id==='jump'){
                if(t<0.55)y=midH-Math.sin(t*Math.PI*1.8)*amp*0.8;
                else if(t>0.7)y=midH-Math.sin((t-0.3)*Math.PI*1.5)*amp*0.7;
                else y=300;
            }else{
                y=midH-Math.sin(t*Math.PI)*amp*0.8;
            }
            y=Math.max(lv.minH,Math.min(lv.maxH,y));
        }
        G.nodes.push({x:x,y:y});
    }
}

function getTrackPoint(t){
    const n=G.nodes.length;
    if(n<2)return{x:W/2,y:H/2};
    const seg=(n-1)*t;
    const i=Math.min(n-2,Math.floor(seg));
    const f=seg-i;
    const a=G.nodes[i],b=G.nodes[i+1];
    return{
        x:a.x+(b.x-a.x)*f,
        y:a.y+(b.y-a.y)*f
    };
}

function getTrackPoints(){
    const pts=[];
    for(let i=0;i<=200;i++){
        pts.push(getTrackPoint(i/200));
    }
    return pts;
}

function releaseBall(){
    if(G.running)return;
    sfxRelease();
    G.running=true;
    G.runTime=0;
    G.trail=[];
    G.simulationResults=null;
    const start=G.nodes[0];
    G.ball={
        x:start.x,
        y:start.y+20,
        vx:0,
        vy:0,
        onTrack:true,
        t:0,
        angle:0,
        rotation:0,
        passed:0,
        escaped:false,
        finished:false
    };
}

function resetBall(){
    G.running=false;
    G.ball=null;
    G.runTime=0;
    G.trail=[];
    G.simulationResults=null;
    G.resultMsg='';
    sfxClick();
}

function simulateBall(){
    if(!G.ball)return;
    G.runTime++;
    const lv=LEVELS[G.currentLevel];
    const b=G.ball;

    if(b.onTrack&&!b.escaped){
        const trackT=Math.min(1,b.t+0.004+b.vx*0.0003);
        b.t=trackT;
        const p=getTrackPoint(trackT);
        const p2=getTrackPoint(Math.min(1,trackT+0.002));
        const dx=p2.x-p.x,dy=p2.y-p.y;
        const dist=Math.hypot(dx,dy)+0.001;
        const speed=0.8+Math.max(0,(p.y-b.y))*0.02;
        b.vx=dx/dist*speed;
        b.vy=dy/dist*speed+GRAVITY*0.3;
        b.x=p.x;
        b.y=p.y+BALL_R;
        b.angle=Math.atan2(dy,dx);
        
        if(lv.hasJump){
            if(b.x>lv.gapStart&&b.x<lv.gapEnd&&b.y>200){
                b.escaped=true;
                b.onTrack=false;
            }
        }
        
        if(lv.loop){
            const lc=lv.loopCenter;
            const dToC=Math.hypot(b.x-lc.x,b.y-lc.y);
            if(dToC<lv.loopRadius+30&&b.y<lc.y){
                const neededV=Math.sqrt(9.8*lv.loopRadius*0.1);
                const curV=Math.hypot(b.vx,b.vy);
                if(curV<neededV){
                    b.escaped=true;
                    b.onTrack=false;
                    sfxFail();
                    G.resultMsg='向心力不足！脱轨了 💥';
                }else{
                    sfxLoop();
                }
            }
        }
        
        if(trackT>=0.995){
            b.finished=true;
            evaluateRun(true);
            return;
        }
    }else{
        b.vy+=GRAVITY;
        b.vx*=FRICTION;
        b.x+=b.vx*2;
        b.y+=b.vy*2;
        b.rotation+=b.vx*0.1;
        
        const pts=getTrackPoints();
        let reattach=false;
        for(let i=0;i<pts.length;i++){
            const d=Math.hypot(b.x-pts[i].x,b.y-pts[i].y);
            if(d<20&&b.vy>0){
                if(lv.hasJump&&((pts[i].x<lv.gapStart)||(pts[i].x>lv.gapEnd))){
                    reattach=true;
                    b.onTrack=true;
                    b.escaped=false;
                    b.t=i/pts.length;
                    break;
                }
            }
        }
        
        if(b.y>H+50||b.x<-50||b.x>W+50){
            evaluateRun(false);
            sfxCrash();
            return;
        }
    }
    
    G.trail.push({x:b.x,y:b.y});
    if(G.trail.length>80)G.trail.shift();
    b.rotation+=b.vx*0.05;
}

function evaluateRun(success){
    const lv=LEVELS[G.currentLevel];
    const startH=G.nodes[0].y;
    const endH=G.nodes[G.nodes.length-1].y;
    const b=G.ball;
    
    let score=0;
    let stars=0;
    let details='';
    
    if(success){
        score=60;
        
        const startPE=startH*1.0;
        const endPE=endH*1.0;
        const vFinal=Math.hypot(b.vx,b.vy);
        const endKE=vFinal*vFinal*0.5;
        const energyLoss=Math.abs((startPE)-(endPE+endKE))/startPE;
        const energyScore=Math.max(0,25-energyLoss*200);
        score+=energyScore;
        details+='能量守恒: +'+energyScore.toFixed(0)+'分\n';
        
        if(lv.loop){
            score+=5;
            details+='完成回环: +5分\n';
        }
        if(lv.hasJump){
            score+=5;
            details+='飞跃间隙: +5分\n';
        }
        const targetSpeed=8;
        const speedDiff=Math.abs(vFinal-targetSpeed)/targetSpeed;
        const sScore=Math.max(0,10-speedDiff*20);
        score+=sScore;
        details+='速度控制: +'+sScore.toFixed(0)+'分';
        
        stars=score>=lv.targetScore+10?3:score>=lv.targetScore?2:1;
        
        G.resultMsg='🎉 成功到达! 得分: '+score.toFixed(0);
        sfxScore();
    }else{
        score=Math.max(0,20-G.runTime*0.05);
        stars=0;
        G.resultMsg='💥 脱轨失败! 得分: '+score.toFixed(0);
        sfxFail();
    }
    
    G.score+=Math.floor(score);
    G.simulationResults={
        success:success,
        score:score,
        stars:stars,
        details:details,
        time:G.runTime
    };
    if(!G.levelStars[G.currentLevel]||G.levelStars[G.currentLevel]<stars){
        G.levelStars[G.currentLevel]=stars;
        Storage.save('coaster_stars',G.levelStars);
    }
    G.totalStars=G.levelStars.reduce((s,x)=>s+(x||0),0);
    if(G.score>G.highScore){
        G.highScore=G.score;
        Storage.save('coaster_highscore',G.highScore);
    }
    
    setTimeout(()=>{G.running=false;},100);
}

function nextLevel(){
    if(G.currentLevel<LEVELS.length-1){
        G.currentLevel++;
        initNodes();
        resetBall();
        sfxClick();
    }else{
        endGame();

}

function drawTrack(ctx){
    const lv=LEVELS[G.currentLevel];
    const pts=getTrackPoints();
    if(lv.hasJump){
        ctx.save();
        ctx.setLineDash([8,8]);
        ctx.strokeStyle='rgba(255,100,100,0.5)';
        ctx.lineWidth=2;
        ctx.beginPath();
        ctx.moveTo(lv.gapStart,250);ctx.lineTo(lv.gapStart,H-80);
        ctx.moveTo(lv.gapEnd,250);ctx.lineTo(lv.gapEnd,H-80);
        ctx.stroke();
        ctx.restore();
    }
    if(lv.loop){
        const lc=lv.loopCenter;
        ctx.strokeStyle='rgba(255,215,0,0.2)';
        ctx.lineWidth=1;
        ctx.setLineDash([4,4]);
        ctx.beginPath();ctx.arc(lc.x,lc.y,lv.loopRadius,0,Math.PI*2);ctx.stroke();
        ctx.setLineDash([]);
    }
    ctx.strokeStyle='#334';
    ctx.lineWidth=16;
    ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();
    let drawing=!lv.hasJump;
    if(!lv.hasJump){ctx.moveTo(pts[0].x,pts[0].y);}
    for(let i=0;i<pts.length;i++){
        if(lv.hasJump){
            const px=pts[i].x;
            if(px<lv.gapStart||px>lv.gapEnd){
                if(!drawing){
                    ctx.moveTo(pts[i].x,pts[i].y);
                    drawing=true;
                }else{
                    ctx.lineTo(pts[i].x,pts[i].y);
                }
            }else{
                drawing=false;
            }
        }else{
            ctx.lineTo(pts[i].x,pts[i].y);
        }
    }
    ctx.stroke();
    const trkGrad=ctx.createLinearGradient(0,100,0,600);
    trkGrad.addColorStop(0,'#ff6b6b');
    trkGrad.addColorStop(0.5,'#ffd93d');
    trkGrad.addColorStop(1,'#6bcB77');
    ctx.strokeStyle=trkGrad;
    ctx.lineWidth=8;
    ctx.beginPath();
    drawing=!lv.hasJump;
    if(!lv.hasJump){ctx.moveTo(pts[0].x,pts[0].y);}
    for(let i=0;i<pts.length;i++){
        if(lv.hasJump){
            const px=pts[i].x;
            if(px<lv.gapStart||px>lv.gapEnd){
                if(!drawing){
                    ctx.moveTo(pts[i].x,pts[i].y);
                    drawing=true;
                }else{
                    ctx.lineTo(pts[i].x,pts[i].y);
                }
            }else{
                drawing=false;
            }
        }else{
            ctx.lineTo(pts[i].x,pts[i].y);
        }
    }
    ctx.stroke();
    ctx.lineCap='butt';ctx.lineJoin='miter';
}

    const tips=lv.id==='loop'
        ?['起点必须远高于环顶(至少>2.5R)','保证回环最高点 v>√(gR)','减小回环前的摩擦损失']
        :lv.id==='jump'
        ?['起跳前加速下坡获得大v₀','计算平抛距离 d=v₀√(2h/g)','起跳点不要太高(下落时间够)']
        :['起终点落差越大→末速度越大','中间峰不能超过起点高','平缓曲线→减少能量突变'];
    for(const t of tips){ctx.fillText('• '+t,px+25,ly);ly+=24;}
    drawBtn(ctx,W/2-60,py+ph-50,120,40,'明白了 ✓','closePrinciple','#4caf50','#fff');
}

function wrapText(ctx,text,maxWidth){
    const lines=[];
    let current='';
    for(const ch of text){
        const test=current+ch;
        if(ctx.measureText(test).width>maxWidth&&current.length>0){
            lines.push(current);
            current=ch;
        }else{
            current=test;
        }
    }
    if(current)lines.push(current);
    return lines;
}

function drawGame(ctx){
    drawBackground(ctx);
    drawTrack(ctx);
    drawNodes(ctx);
    drawBall(ctx);
    drawHUD(ctx);
    if(G.paused){
        drawPause(ctx);
    }
    if(G.principleOpen){
        drawPrinciplePopup(ctx);
    }
}

function drawPause(ctx){
    ctx.fillStyle='rgba(0,0,0,0.75)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';
    ctx.font='bold 46px "Microsoft YaHei"';
    ctx.textAlign='center';
    ctx.fillText('⏸ 暂停中',W/2,H/2-60);
    drawBtn(ctx,W/2-90,H/2,180,55,'▶ 继续设计','resume','#00d9ff');
    drawBtn(ctx,W/2-75,H/2+80,150,45,'🏠 返回菜单','quit','#78909c','#fff');
    ctx.fillStyle='#888';
    ctx.font='13px "Microsoft YaHei"';
    ctx.fillText('按 ESC 键可快速继续',W/2,H/2+150);
    ctx.textAlign='left';
}

function drawGameOver(ctx){
    ctx.fillStyle='#050a14';
    ctx.fillRect(0,0,W,H);
    const grd=ctx.createRadialGradient(W/2,H*0.3,20,W/2,H*0.3,300);
    grd.addColorStop(0,'rgba(0,217,255,0.15)');
    grd.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
    const isNew=G.score>=G.highScore&&G.score>0;
    ctx.fillStyle=isNew?'#ffd700':'#00d9ff';
    ctx.font='bold 44px "Microsoft YaHei"';
    ctx.textAlign='center';
    ctx.fillText(isNew?'🎉 新纪录！':'🏆 设计报告',W/2,120);
    ctx.fillStyle='#fff';
    ctx.font='bold 22px "Microsoft YaHei"';
    ctx.fillText('最终得分',W/2,190);
    ctx.fillStyle='#ffd700';
    ctx.font='bold 80px Arial';
    ctx.fillText(G.score,W/2,280);
    ctx.fillStyle='#aaa';
    ctx.font='14px "Microsoft YaHei"';
    ctx.fillText('历史最高分: '+G.highScore,W/2,315);
    G.totalStars=G.levelStars.reduce((s,x)=>s+(x||0),0);
    const pct=LEVELS.length>0?Math.round((G.levelStars.filter(x=>x>0).length/LEVELS.length)*100):0;
    ctx.fillStyle='#ffd700';
    ctx.font='bold 22px "Microsoft YaHei"';
    const medal=G.totalStars>=LEVELS.length*2.5?'🏅 顶级工程师！':G.totalStars>=LEVELS.length*1.5?'🥈 优秀设计师':'🎖️ 初级学徒';
    ctx.fillText('⭐ '+G.totalStars+' / '+(LEVELS.length*3)+'  '+medal,W/2,360);
    ctx.fillStyle='#4fc3f7';
    ctx.font='16px "Microsoft YaHei"';
    ctx.fillText('通关进度: '+pct+'% ('+G.levelStars.filter(x=>x>0).length+'/'+LEVELS.length+' 关卡)',W/2,395);
    const avgStars=LEVELS.length>0?(G.totalStars/LEVELS.length):0;
    ctx.fillStyle='#a5d6a7';
    ctx.font='14px "Microsoft YaHei"';
    ctx.fillText('平均星级: '+(avgStars>0?avgStars.toFixed(1):'0.0')+' ⭐/关',W/2,425);
    drawBtn(ctx,W/2-95,475,190,55,'🔄 再来一次','restart','#00d9ff');
    drawBtn(ctx,W/2-80,550,160,45,'🏠 返回菜单','menu','#5c6bc0','#fff');
    ctx.fillStyle='#888';
    ctx.font='13px "Microsoft YaHei"';
    ctx.fillText('⌨️ 按空格/回车键重新挑战',W/2,640);
    ctx.fillStyle='#666';
    ctx.font='11px "Microsoft YaHei"';
    ctx.fillText('掌握物理原理，设计完美过山车！🎢',W/2,700);
    ctx.textAlign='left';
}

function draw(){
    switch(G.state){
        case STATE_MENU: drawMenu(ctx); break;
        case STATE_PLAYING: drawGame(ctx); break;
        case STATE_OVER: drawGameOver(ctx); break;
        case STATE_PAUSE: drawGame(ctx); break;
    }
}

let rafId=null;
function gameLoop(){
    rafId=requestAnimationFrame(gameLoop);
    update();
    draw();
}
initNodes();
gameLoop();

})();
</script>

  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>

  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
