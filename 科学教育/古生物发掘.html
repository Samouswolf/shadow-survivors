function playTone(freq,dur,type,vol){
    if(!audioCtx)return;
    try{
        const o=audioCtx.createOscillator();
        const g=audioCtx.createGain();
        o.type=type||'square';
        o.frequency.value=freq;
        g.gain.value=vol||0.15;
        g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
        o.connect(g);g.connect(audioCtx.destination);
        o.start();o.stop(audioCtx.currentTime+dur);
    }catch(e){}
}

function startDino(){

    G.tool=0;
    G.digProgress=0;
    G.brushProgress=0;
    G.fossilDamage=0;
    G.bonesFound=0;
    G.totalBones=D.bones;
    G.bonePositions=[];
    G.assemblePhase=false;
    G.selectedBone=null;
    G.placedBones=[];
    G.identifyPhase=false;
    G.identifySelected=null;
    G.identifyAnswer=null;
    
    generateDigSite();
    showMessage('第'+(G.dinoIdx+1)+'关：发掘 '+D.emoji+' '+D.name+'！先铲掉表面土层',3);
}

function generateDigSite(){
    const W2=400,H2=340;
    const ox=40,oy=160;
    G.digArea={x:ox,y:oy,w:W2,h:H2};
    
    G.soilMap=[];
    for(let y=0;y<G.soilMapH;y++){
        const row=[];
        for(let x=0;x<G.soilMapW;x++){
            const depth=y/G.soilMapH;
            row.push({
                soil:1-Math.min(1,depth*1.5+Math.random()*0.2),
                rock:y<5?0:(depth>0.45&&Math.random()<0.25?1:0),
                dug:false,fineDug:false,
                hasBone:false,boneIdx:-1
            });
        }
        G.soilMap.push(row);
    }
    
    G.boneCells=[];
    for(let i=0;i<G.dino.bones;i++){
        let placed=false,attempts=0;
        while(!placed&&attempts<50){
            attempts++;
            const cx=5+Math.floor(Math.random()*(G.soilMapW-14));
            const cy=8+Math.floor(Math.random()*(G.soilMapH-18));
            const w=4+Math.floor(Math.random()*5);
            const h=3+Math.floor(Math.random()*4);
            let ok=true;
            for(let dy=0;dy<h&&ok;dy++){
                for(let dx=0;dx<w&&ok;dx++){
                    const x=cx+dx,y=cy+dy;
                    if(x>=G.soilMapW||y>=G.soilMapH){ok=false;break}
                    if(G.soilMap[y][x].hasBone){ok=false;break}
                    G.soilMap[y][x].hasBone=true;
                    G.soilMap[y][x].boneIdx=i;
                }
            }
            if(ok){
                G.boneCells.push({
                    idx:i,x:cx,y:cy,w:w,h:h,
                    name:G.dino.skeleton[i].name,
                    found:false,type:G.dino.skeleton[i].type,
                    exposed:0
                });
                placed=true;
            }
        }
    }
    
    for(let i=0;i<18;i++){
        const rx=Math.floor(Math.random()*G.soilMapW);
        const ry=12+Math.floor(Math.random()*(G.soilMapH-15));
        if(!G.soilMap[ry][rx].hasBone){
            G.soilMap[ry][rx].rock=1;
            if(rx<G.soilMapW-1&&!G.soilMap[ry][rx+1].hasBone)G.soilMap[ry][rx+1].rock=0.7;
        }
    }
}

function showMessage(msg,dur){
    G.message=msg;G.messageTimer=dur*60;
}

function update(dt){
    G.t+=dt;
    if(G.messageTimer>0)G.messageTimer--;
    for(let i=G.particles.length-1;i>=0;i--){
        const p=G.particles[i];
        p.x+=p.vx;p.y+=p.vy;p.vy+=0.2;
        p.life-=dt;
        if(p.life<=0)G.particles.splice(i,1);
    }
    
    if(G.phase===0&&G.state===STATE_PLAYING){
        const dugTotal=G.soilMapW*G.soilMapH;
        let dCount=0,fCount=0,rCount=0,rockTotal=0,boneExposed=0;
        for(let y=0;y<G.soilMapH;y++){
            for(let x=0;x<G.soilMapW;x++){
                const c=G.soilMap[y][x];
                if(c.dug)dCount++;
                if(c.fineDug)fCount++;
                if(c.rock>0)rockTotal++;
                if(c.rock===0)rCount++;
                if(c.hasBone&&c.dug&&c.fineDug&&c.rock===0){
                    boneExposed++;
                    const b=G.boneCells[c.boneIdx];
                    if(b&&!b.found){
                        b.exposed++;
                        if(b.exposed>=b.w*b.h*0.5){
                            b.found=true;
                            G.bonesFound++;
                            showMessage('🎉 发现了 '+b.name+'！('+G.bonesFound+'/'+G.totalBones+')',2.5);
                            sfxFossil();
                            G.score+=30;
                        }
                    }
                }
            }
        }
        G.digProgress=dCount/dugTotal;
        G.brushProgress=fCount/dugTotal;
        
        if(G.bonesFound>=G.totalBones && G.phase===0){
            setTimeout(()=>{
                G.phase=1;
                startAssemble();
            },1500);
        }
    }
    
    if(G.phase===1&&G.assemblePhase){
        if(G.placedBones.length>=G.totalBones){
            setTimeout(()=>{
                G.phase=2;
                startIdentify();
            },1200);
        }
    }
    
    if(G.phase===2&&G.identifyAnswer!==null){
        setTimeout(()=>{
            const correct=G.identifyAnswer;
            const dmgPenalty=Math.floor(G.fossilDamage*50);
            const assembleBonus=G.placedBones.length*15;
            let identifyBonus=0;
            if(correct){identifyBonus=80;sfxIdentify()}
            else sfxFail();
            const total=Math.max(0,G.score+assembleBonus+identifyBonus-dmgPenalty);
            G.score=total;
            if(G.score>G.high){G.high=G.score;Storage.save('gushengwu_fajue_highscore',G.high)}
            
            G.dinoResult.push({
                dino:G.dino,
                damage:G.fossilDamage,
                assembled:G.placedBones.length,
                identifyCorrect:correct,
                score:total
            });
            G.showInfo=true;
            
            setTimeout(()=>{
                G.showInfo=false;
                if(G.dinoIdx>=DINOS.length-1)endGame();
                else{G.dinoIdx++;startDino()}
            },5500);
            G.phase=3;
        },1200);
        G.identifyAnswer=null;
    }
}

function startAssemble(){
    G.assemblePhase=true;
    const cx=240,cy=580,scale=2.3;
    G.targetSlots=[];
    G.placedBones=[];
    for(let i=0;i<G.dino.skeleton.length;i++){
        const sk=G.dino.skeleton[i];
        let sx=0,sy=0;
        for(const p of sk.points){sx+=p[0];sy+=p[1]}
        sx/=sk.points.length;sy/=sk.points.length;
        G.targetSlots.push({
            idx:i,name:sk.name,type:sk.type,
            x:cx+sx*scale,y:cy-150+sy*scale,
            points:sk.points.map(p=>[cx+p[0]*scale,cy-150+p[1]*scale]),
            filled:false
        });
    }
    showMessage('🧩 拼接骨骼：把下方骨头拖到正确位置！',3);
}

function startIdentify(){
    G.identifyPhase=true;
    const real=G.dinoIdx;
    const opts=[real];
    while(opts.length<4){
        const n=Math.floor(Math.random()*DINOS.length);
        if(!opts.includes(n))opts.push(n);
    }
    G.identifyOptions=[];
    for(let i=0;i<4;i++){
        const ri=Math.floor(Math.random()*opts.length);
        G.identifyOptions.push(opts.splice(ri,1)[0]);
    }
    showMessage('🔍 鉴定物种：这是什么恐龙/古生物？',3);
}

function endGame(){
    G.state=STATE_OVER;
    if(G.score>G.high){G.high=G.score;Storage.save('gushengwu_fajue_highscore',G.high)}
    sfxWin();
}

function applyTool(p){
    const A=G.digArea;
    if(!A||p.x<A.x||p.x>A.x+A.w||p.y<A.y||p.y>A.y+A.h)return;
    const T=TOOLS[G.tool];
    const mx=Math.floor((p.x-A.x)/10);
    const my=Math.floor((p.y-A.y)/10);
    const r=Math.ceil(T.radius/10);
    
    for(let dy=-r;dy<=r;dy++){
        for(let dx=-r;dx<=r;dx++){
            const dist=Math.sqrt(dx*dx+dy*dy);
            if(dist>r)continue;
            const x=mx+dx,y=my+dy;
            if(x<0||y<0||x>=G.soilMapW||y>=G.soilMapH)continue;
            const c=G.soilMap[y][x];
            const strength=1-dist/r*0.5;
            if(T.id==='shovel'){
                if(!c.dug){
                    c.soil=Math.max(0,c.soil-0.35*strength);
                    if(c.soil<=0){c.dug=true;sfxDig()}
                    addParticle(A.x+x*10+5,A.y+y*10+5,'#8d6e63');
                    if(c.hasBone&&c.rock===0&&G.fossilDamage<0.8){
                        c.fineDug=true;
                    }
                }
            }else if(T.id==='brush'){
                if(c.dug&&!c.fineDug&&c.rock===0){
                    c.fineDug=true;
                    sfxBrush();
                    addParticle(A.x+x*10+5,A.y+y*10+5,'#bcaaa4');
                }
            }else if(T.id==='hammer'){
                if(c.rock>0){
                    c.rock=Math.max(0,c.rock-0.4*strength);
                    if(c.rock===0)sfxHammer();
                    addParticle(A.x+x*10+5,A.y+y*10+5,'#616161');
                    if(c.hasBone&&Math.random()<0.1*strength){
                        G.fossilDamage=Math.min(1,G.fossilDamage+0.04);
                        showMessage('⚠ 锤子敲到化石了！小心点',1.5);
                        sfxFail();
                    }
                }else if(!c.dug){
                    c.soil=Math.max(0,c.soil-0.25*strength);
                    if(c.soil<=0)c.dug=true;
                }
            }
        }
    }
}

            vy:-1-Math.random()*2,

        });
    }
}

function drawDigging(){
    const A=G.digArea;
    ctx.fillStyle='#212121';
    ctx.fillRect(A.x-6,A.y-6,A.w+12,A.h+12);
    ctx.strokeStyle='#6d4c41';ctx.lineWidth=4;ctx.strokeRect(A.x-6,A.y-6,A.w+12,A.h+12);
    
    const sky=ctx.createLinearGradient(A.x,A.y,A.x,A.y+A.h*0.4);
    sky.addColorStop(0,'#fdd835');sky.addColorStop(1,'#ff8f00');
    ctx.fillStyle=sky;ctx.fillRect(A.x,A.y,A.w,A.h*0.3);
    
    for(let y=0;y<G.soilMapH;y++){
        for(let x=0;x<G.soilMapW;x++){
            const c=G.soilMap[y][x];
            const px=A.x+x*10,py=A.y+y*10;
            if(!c.dug||c.rock>0||!c.fineDug){
                let col1='#8d6e63',col2='#6d4c41';
                if(c.rock>0){col1='#9e9e9e';col2='#616161'}
                if(y<G.soilMapH*0.3){col1='#a1887f';col2='#8d6e63'}
                const ss=!c.dug?1:(c.fineDug?0:c.soil*0.5);
                if(ss>0){
                    const gr=ctx.createLinearGradient(px,py,px+10,py+10);
                    gr.addColorStop(0,col1);gr.addColorStop(1,col2);
                    ctx.fillStyle=gr;
                    ctx.globalAlpha=c.rock>0?c.rock:ss;
                    ctx.fillRect(px,py,10,10);
                    ctx.globalAlpha=1;
                }
            }
            if(c.dug&&!c.fineDug&&c.rock===0){
                ctx.fillStyle='rgba(141,110,99,0.3)';
                ctx.fillRect(px,py,10,10);
            }
            if(c.dug&&c.fineDug&&c.rock===0&&c.hasBone){
                const b=G.boneCells[c.boneIdx];
                if(b&&b.found){
                    ctx.fillStyle='rgba(255,248,225,0.95)';
                }else{
                    ctx.fillStyle='rgba(224,224,224,0.7)';
                }
                ctx.fillRect(px,py,10,10);
                ctx.strokeStyle='#757575';ctx.lineWidth=0.5;
                ctx.strokeRect(px,py,10,10);
                ctx.lineWidth=1;
            }
        }
    }
    
    for(const b of G.boneCells){
        if(!b.found)continue;
        const px=A.x+b.x*10,py=A.y+b.y*10;
        const pw=b.w*10,ph=b.h*10;
        ctx.fillStyle='#fff8e1';
        ctx.fillRect(px+2,py+2,pw-4,ph-4);
        ctx.strokeStyle=G.dino.color;ctx.lineWidth=2;
        ctx.strokeRect(px,py,pw,ph);
        ctx.fillStyle='#5d4037';ctx.font='bold 10px Microsoft YaHei';ctx.textAlign='center';
        ctx.fillText(b.name,px+pw/2,py+ph/2+3);
        ctx.lineWidth=1;
    }
}

function drawMessage(){
    const alpha=Math.min(1,G.messageTimer/60);
    ctx.globalAlpha=alpha;
    const tw=Math.max(260,ctx.measureText(G.message).width+50);
    ctx.fillStyle='rgba(0,0,0,0.85)';
    ctx.fillRect(W/2-tw/2,70,tw,40);

    ctx.fillText(G.message,W/2,97);
    ctx.globalAlpha=1;ctx.lineWidth=1;
}

function drawParticles(){
    for(const p of G.particles){
        ctx.globalAlpha=Math.max(0,Math.min(1,p.life*2));
        ctx.fillStyle=p.color;
        ctx.fillRect(p.x,p.y,p.size,p.size);
    }
    ctx.globalAlpha=1;
}

function hitBtn(p,b){return b&&p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h}

function onPointerDown(p){
    sfxClick();
    if(G.state===STATE_MENU){startGame();return}
    if(G.state===STATE_PAUSE){
        if(hitBtn(p,G.resumeBtn)){G.state=STATE_PLAYING;sfxStart()}
        else if(hitBtn(p,G.quitBtn))G.state=STATE_MENU;
        return;
    }
    if(G.state===STATE_OVER){
        if(hitBtn(p,G.retryBtn))startGame();
        else if(hitBtn(p,G.menuBtn))G.state=STATE_MENU;
        return;
    }
    if(G.state===STATE_PLAYING){
        if(hitBtn(p,G.pauseBtn)){G.state=STATE_PAUSE;return}
        if(G.showInfo&&G.dinoResult.length>0){return}
        if(G.phase===0){
            let changed=false;
            for(const tb of G.toolButtons){
                if(hitBtn(p,tb)){G.tool=tb.idx;changed=true;break}
            }
            if(!changed)applyTool(p);
        }else if(G.phase===1){
            for(let i=0;i<G.boneCells.length;i++){
                const b=G.boneCells[i];
                if(G.placedBones.includes(i))continue;
                if(b.drawX===undefined)continue;
                if(p.x>=b.drawX-28&&p.x<=b.drawX+28&&p.y>=b.drawY-28&&p.y<=b.drawY+32){
                    G.selectedBone=i;
                    G.dragging='bone';
                    G.dragOffset.x=p.x-b.drawX;
                    G.dragOffset.y=p.y-b.drawY;
                    sfxSnap();
                    return;
                }
            }
            if(G.selectedBone!==null){
                for(let si=0;si<G.targetSlots.length;si++){
                    const s=G.targetSlots[si];
                    if(s.filled)continue;
                    const dx=p.x-s.x,dy=p.y-s.y;
                    if(dx*dx+dy*dy<2500){
                        if(G.boneCells[G.selectedBone].type===s.type){
                            s.filled=true;
                            G.placedBones.push(G.selectedBone);
                            showMessage('✅ '+s.name+' 拼接正确！',2);
                            sfxScore();
                            G.score+=15;
                        }else{
                            showMessage('❌ 位置不匹配，再仔细看看！',2);
                            sfxWrong();
                        }
                        G.selectedBone=null;
                        return;
                    }
                }
            }
        }else if(G.phase===2){
            for(const bi of G.idBtns){
                if(hitBtn(p,bi)){G.identifySelected=bi.idx;sfxClick();return}
            }
            if(G.identifySelected!==null&&hitBtn(p,G.confirmBtn)){
                const pick=G.identifyOptions[G.identifySelected];
                G.identifyAnswer=(pick===G.dinoIdx);
                showMessage(G.identifyAnswer?'🎉 鉴定正确！':'❌ 鉴定错误！正确是：'+G.dino.name,3);
            }
        }
    }
}

function onPointerMove(p){
    if(G.dragging==='bone'&&G.selectedBone!==null&&G.phase===1){
        const b=G.boneCells[G.selectedBone];
        b.drawX=p.x-G.dragOffset.x;
        b.drawY=p.y-G.dragOffset.y;
    }
}
function onPointerUp(p){
    if(G.dragging==='bone'&&G.selectedBone!==null&&G.phase===1){
        const b=G.boneCells[G.selectedBone];
        let matched=false;
        for(let si=0;si<G.targetSlots.length;si++){
            const s=G.targetSlots[si];
            if(s.filled)continue;
            const dx=b.drawX-s.x,dy=b.drawY-s.y;
            if(dx*dx+dy*dy<3000){
                if(G.boneCells[G.selectedBone].type===s.type){
                    s.filled=true;
                    G.placedBones.push(G.selectedBone);
                    showMessage('✅ 拼接正确！+'+s.name,2);sfxScore();G.score+=15;
                    matched=true;
                }else{
                    showMessage('❌ 这块骨头位置不对',1.8);
                    sfxWrong();
                }
                break;
            }
        }
        if(!matched){
            b.drawX=undefined;
        }
        G.selectedBone=null;
    }
    G.dragging=null;
}

document.addEventListener('keydown',function(e){
    if(e.code==='Space'||e.code==='Enter'){
        e.preventDefault();
        if(G.state===STATE_MENU||G.state===STATE_OVER)startGame();
    }else if(e.code==='Escape'){
        e.preventDefault();
        if(G.state===STATE_PLAYING)G.state=STATE_PAUSE;
        else if(G.state===STATE_PAUSE)G.state=STATE_PLAYING;
    }else if(G.state===STATE_PLAYING){
        if(e.code==='Digit1')G.tool=0;
        else if(e.code==='Digit2')G.tool=1;
        else if(e.code==='Digit3')G.tool=2;
    }
});

canvas.addEventListener('mousedown',function(e){onPointerDown(getPos(e))});
canvas.addEventListener('mousemove',function(e){onPointerMove(getPos(e))});
canvas.addEventListener('mouseup',function(e){onPointerUp(getPos(e))});
canvas.addEventListener('touchstart',function(e){e.preventDefault();if(e.touches[0])onPointerDown(getPos(e.touches[0]))},{passive:false});
canvas.addEventListener('touchmove',function(e){e.preventDefault();if(e.touches[0])onPointerMove(getPos(e.touches[0]))},{passive:false});
canvas.addEventListener('touchend',function(e){e.preventDefault();onPointerUp()},{passive:false});

let lastT=0;
function loop(t){
    const dt=Math.min(0.05,(t-lastT)/1000||0);
    lastT=t;
    if(G.state===STATE_PLAYING)update(dt);
    draw();
    requestAnimationFrame(loop);
}

G={
    state:STATE_MENU,score:0,high:Storage.load('gushengwu_fajue_highscore',0),
    dinoIdx:0,dino:null,dinoResult:[],phase:0,tool:0,toolButtons:[],

    fossilDamage:0,bonesFound:0,totalBones:0,bonePositions:[],
    fossilData:null,assemblePhase:false,selectedBone:null,placedBones:[],
    targetSlots:[],identifyOptions:[],identifySelected:null,identifyPhase:false,
    identifyAnswer:null,showInfo:false,infoData:null,message:'',
    messageTimer:0,particles:[],t:0,dragging:null,dragOffset:{x:0,y:0}
};

var _sbtn=document.getElementById('start-game-btn');
_sbtn.addEventListener('click',function(){initAudio();startGame();this.style.display='none';});
if(typeof showStartBtn==='function')showStartBtn();

requestAnimationFrame(loop);
})();
