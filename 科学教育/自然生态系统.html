function initAudio(){
    if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();

function playTone(freq,dur,type,vol){
    if(!audioCtx)return;
    try{
        const o=audioCtx.createOscillator();
        const g=audioCtx.createGain();
        o.type=type||'square';
        o.frequency.value=freq;
        g.gain.value=vol||0.15;
        g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
        o.connect(g);g.connect(audioCtx.destination);
        o.start();o.stop(audioCtx.currentTime+dur);
    }catch(e){}
}

}

function createOrganism(sp,x,y){
    return {
        species:sp,
        spId:sp.id,
        x:x||Math.random()*(SIM_W-60)+30,
        y:y||Math.random()*(SIM_H-60)+SIM_Y+30,
        vx:(Math.random()-0.5)*2,
        vy:(Math.random()-0.5)*2,
        energy:sp.energy||50,
        age:0,
        alive:true,
        size:16+Math.random()*6,
        hungerLevel:0,
        justAte:0,
        reproCd:0
    };
}

function startSim(){
    G.simRunning=true;
    G.simTime=0;
    sfxClick();
}

function pauseSim(){
    G.simRunning=false;
    sfxClick();
}

    if(!sp)return;
    const count=G.organisms.filter(o=>o.alive&&o.spId===spId).length;
    if(count>=sp.maxPop){sfxFail();return;}
    if(G.placedCount>=G.maxPlace){sfxFail();return;}
    G.organisms.push(createOrganism(sp));
    G.placedCount++;
    sfxPlace();
    if(sp.trophic===TROPHIC.CARNIVORE)G.nutrients-=5;
}

function addRandomSpecies(){
    const eco=ECOSYSTEMS[G.ecoIdx];
    const available=eco.species.filter(sp=>{
        const count=G.organisms.filter(o=>o.alive&&o.spId===sp.id).length;
        return count<sp.maxPop*0.8;
    });
    if(available.length===0)return;
    const sp=available[Math.floor(Math.random()*available.length)];
    addSpecies(sp.id);
}

function removeAt(p){
    for(let i=G.organisms.length-1;i>=0;i--){
        const o=G.organisms[i];
        if(!o.alive)continue;
        const d=Math.hypot(o.x-p.x,o.y-p.y);
        if(d<o.size+10){
            o.alive=false;
            G.deadCount++;
            sfxDie();
            spawnParticles(o.x,o.y,'#f44336',8);
            return true;
        }
    }
    return false;
}

function spawnParticles(x,y,color,n){
    for(let i=0;i<n;i++){
        G.particles.push({
            x,y,
            vx:(Math.random()-0.5)*4,
            vy:(Math.random()-0.5)*4-1,
            life:30+Math.random()*20,
            color,
            size:3+Math.random()*4
        });
    }
}

function updateSim(){
    const eco=ECOSYSTEMS[G.ecoIdx];
    G.simTime++;
    if(G.simTime%60===0&&G.nutrients<150)G.nutrients+=3;
    const aliveOrg=G.organisms.filter(o=>o.alive);
    const counts={producer:0,herbivore:0,carnivore:0,decomposer:0};
    aliveOrg.forEach(o=>counts[o.species.trophic]++);
    const totalA=aliveOrg.length||1;
    const ratios={
        producer:counts.producer/totalA,
        herbivore:counts.herbivore/totalA,
        carnivore:counts.carnivore/totalA,
        decomposer:counts.decomposer/totalA
    };
    let bal=0;
    for(const k of Object.keys(eco.ideal)){
        const diff=Math.abs(ratios[k]-eco.ideal[k]);
        bal+=(1-Math.min(1,diff*3));
    }
    bal/=4;
    G.balanceScore=bal;
    for(const o of G.organisms){
        if(!o.alive)continue;
        o.age++;
        const sp=o.species;
        if(sp.trophic===TROPHIC.PRODUCER){
            if(G.nutrients>5){
                o.energy=Math.min(100,o.energy+0.1);
                G.nutrients-=0.02;
                if(G.animT%30===0&&Math.random()<0.3)spawnParticles(o.x,o.y,sp.color,1);
            }else{
                o.energy-=0.05;
            }
        }else{
            o.hungerLevel+=(sp.hunger||0.08)*0.1;
            if(o.hungerLevel>0.3)o.energy-=0.08;
            if(o.justAte>0)o.justAte--;
            if(sp.eat&&o.justAte===0&&o.hungerLevel>0.2){
                let target=null,minD=Infinity;
                for(const other of G.organisms){
                    if(!other.alive||other===o)continue;
                    let canEat=false;
                    if(sp.eat.includes('dead')){
                        if(!other.alive)canEat=true;
                    }
                    if(sp.eat.includes(other.spId))canEat=true;
                    if(!canEat)continue;
                    const d=Math.hypot(other.x-o.x,other.y-o.y);
                    if(d<minD){minD=d;target=other;}
                }
                if(target){
                    const ang=Math.atan2(target.y-o.y,target.x-o.x);
                    const speed=sp.trophic===TROPHIC.CARNIVORE?1.4:0.9;
                    o.x+=Math.cos(ang)*speed;
                    o.y+=Math.sin(ang)*speed;
                    if(minD<o.size+target.size){
                        if(target.alive){
                            target.alive=false;
                            G.deadCount++;
                            o.energy=Math.min(100,o.energy+(target.species.nutrient||target.species.energy||30));
                            o.hungerLevel=Math.max(0,o.hungerLevel-0.8);
                            o.justAte=60;
                            sfxEat();
                            spawnParticles(target.x,target.y,target.species.color,10);
                        }else if(sp.trophic===TROPHIC.DECOMPOSER){
                            o.energy=Math.min(100,o.energy+20);
                            o.hungerLevel=Math.max(0,o.hungerLevel-0.5);
                            o.justAte=40;
                            G.nutrients=Math.min(200,G.nutrients+(sp.clean||10));
                            const idx=G.organisms.indexOf(target);
                            if(idx>=0)G.organisms.splice(idx,1);
                            sfxPlace();
                            spawnParticles(o.x,o.y,'#8d6e63',6);
                        }
                    }
                }
            }
        }
        if(sp.trophic!==TROPHIC.PRODUCER){
            let ang=null;
            if(sp.trophic===TROPHIC.CARNIVORE){
                let nearestPred=null,minPD=Infinity;
                for(const other of G.organisms){
                    if(!other.alive||other===o)continue;
                    const osp=other.species;
                    if(osp.trophic===TROPHIC.CARNIVORE&&osp.eat&&osp.eat.includes(o.spId)){
                        const d=Math.hypot(other.x-o.x,other.y-o.y);
                        if(d<80&&d<minPD){minPD=d;nearestPred=other;}
                    }
                }
                if(nearestPred){
                    ang=Math.atan2(o.y-nearestPred.y,o.x-nearestPred.x);
                }
            }
            if(ang==null){
                if(Math.random()<0.03){o.vx=(Math.random()-0.5)*2;o.vy=(Math.random()-0.5)*2;}
                o.x+=o.vx;o.y+=o.vy;
            }else{
                const spd=1.5;
                o.x+=Math.cos(ang)*spd;o.y+=Math.sin(ang)*spd;
            }
        }else{
            o.x+=(Math.random()-0.5)*0.3;
            o.y+=(Math.random()-0.5)*0.3;
        }
        o.x=Math.max(20,Math.min(SIM_W-20,o.x));
        o.y=Math.max(SIM_Y+20,Math.min(SIM_Y+SIM_H-20,o.y));
        if(o.reproCd>0)o.reproCd--;
        if(o.reproCd===0&&o.energy>70&&Math.random()<(sp.reproduce||0.05)*0.05){
            const spCount=G.organisms.filter(x=>x.alive&&x.spId===o.spId).length;
            if(spCount<sp.maxPop){
                G.organisms.push(createOrganism(sp,o.x+(Math.random()-0.5)*30,o.y+(Math.random()-0.5)*30));
                o.energy-=30;
                o.reproCd=120;
                spawnParticles(o.x,o.y,sp.color,5);
                if(G.animT%300===0)sfxBird();
            }
        }
        if(o.energy<=5||Math.random()<(sp.die||0.02)*0.005){
            o.alive=false;
            G.deadCount++;
            sfxDie();
            spawnParticles(o.x,o.y,'#9e9e9e',8);
        }
    }
    for(let i=G.particles.length-1;i>=0;i--){
        const p=G.particles[i];
        p.x+=p.vx;p.y+=p.vy;p.vy+=0.08;p.life--;
        if(p.life<=0)G.particles.splice(i,1);
    }
    const timeLeft=eco.targetTime-G.simTime/60;
    if(timeLeft<=0){
        endEcoSim();
    }
    if(G.animT%1800===0&&Math.random()<0.5){
        for(let i=0;i<5;i++)sfxRain();
    }
}

function endEcoSim(){
    G.simRunning=false;
    const eco=ECOSYSTEMS[G.ecoIdx];
    const aliveCount=G.organisms.filter(o=>o.alive).length;
    const survivalRate=aliveCount/Math.max(1,G.placedCount);
    const bal=G.balanceScore;
    const nutrientScore=Math.min(1,G.nutrients/100);
    const speciesPresent=new Set(G.organisms.filter(o=>o.alive).map(o=>o.spId)).size;
    const totalSp=eco.species.length;
    const diversity=speciesPresent/Math.min(6,totalSp);
    let finalScore=Math.round((bal*50+survivalRate*25+diversity*20+nutrientScore*5)*10)/10;
    finalScore=Math.max(0,Math.min(100,finalScore));
    let stars=0;
    if(finalScore>=85)stars=3;
    else if(finalScore>=65)stars=2;
    else if(finalScore>=40)stars=1;
    const pass=stars>0;
    G.ecoStars[G.ecoIdx]=Math.max(G.ecoStars[G.ecoIdx],stars);
    G.ecoPassed[G.ecoIdx]=pass;
    G.totalScore+=Math.round(finalScore);
    if(pass)sfxWin();else sfxFail();
    G.resultPopup={pass,score:Math.round(finalScore),stars,bal:Math.round(bal*100),surv:Math.round(survivalRate*100),div:Math.round(diversity*100)};
}

function nextEco(){

    G.deadCount=0;

function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
}

function drawBackground(){
    const eco=ECOSYSTEMS[G.ecoIdx];
    const g=ctx.createLinearGradient(0,SIM_Y,0,SIM_Y+SIM_H);
    if(eco.water){
        g.addColorStop(0,eco.bgColor);
        g.addColorStop(1,'#01579b');
    }else if(eco.id==='grassland'){
        g.addColorStop(0,'#ffe082');
        g.addColorStop(0.5,eco.bgColor);
        g.addColorStop(1,'#827717');
    }else if(eco.id==='garden'){
        g.addColorStop(0,'#aed581');
        g.addColorStop(1,eco.bgColor);
    }else{
        g.addColorStop(0,'#689f38');
        g.addColorStop(1,eco.bgColor);
    }
    ctx.fillStyle=g;
    ctx.fillRect(0,SIM_Y,SIM_W,SIM_H);
    if(eco.water){
        ctx.strokeStyle='rgba(255,255,255,0.2)';
        ctx.lineWidth=2;
        for(let i=0;i<5;i++){
            const yy=SIM_Y+50+i*60+Math.sin(G.animT*0.02+i)*5;
            ctx.beginPath();
            ctx.moveTo(10,yy);
            for(let x=10;x<SIM_W;x+=20){
                ctx.lineTo(x,yy+Math.sin((x+G.animT*0.5+i*10)*0.05)*4);
            }
            ctx.stroke();
        }
    }else{
        ctx.fillStyle='rgba(255,255,255,0.05)';
        for(let i=0;i<20;i++){
            ctx.beginPath();
            ctx.arc(Math.random()*SIM_W,SIM_Y+SIM_H-10+Math.random()*10,2+Math.random()*4,0,Math.PI*2);
            ctx.fill();
        }
    }
}

function drawOrganisms(){
    const sorted=[...G.organisms].sort((a,b)=>{
        const ta={producer:0,herbivore:1,decomposer:2,carnivore:3};
        return ta[a.species.trophic]-ta[b.species.trophic];
    });
    for(const o of sorted){
        if(!o.alive)continue;
        const sp=o.species;
        ctx.save();
        ctx.globalAlpha=o.energy<20?0.6:1;
        ctx.font=Math.round(o.size*1.6)+'px serif';
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(sp.emoji,o.x,o.y+Math.sin((G.animT+o.x)*0.05)*2);
        if(o.hungerLevel>0.6){
            ctx.font='12px serif';
            ctx.fillText('💧',o.x+12,o.y-12);
        }
        if(o.reproCd>100){
            ctx.font='10px serif';
            ctx.fillText('💕',o.x-12,o.y-12);
        }
        ctx.restore();
    }
    for(const p of G.particles){
        ctx.save();
        ctx.globalAlpha=p.life/50;
        ctx.fillStyle=p.color;
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
        ctx.fill();
        ctx.restore();
    }
}

    ctx.fillStyle=color;
    roundRect(ctx,x,y,w,h,8);
    ctx.fill();
    ctx.fillStyle='#fff';
    ctx.font='bold 12px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(label,x+w/2,y+h/2);
    ctx.restore();
}

function hitBtn(p,id){
    if(!G._btns||!G._btns[id])return false;
    const b=G._btns[id];
    return p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h;
}

function onPointerDown(p){
    G._btns={};G._spBtns=[];
    if(G.state===STATE_MENU){startGame();sfxStart();return;}
    if(G.showingHint){
        if(hitBtn(p,'closeHint')){G.showingHint=false;sfxClick();}
        return;
    }
    if(G.resultPopup){
        if(hitBtn(p,'next')){nextEco();return;}
        if(hitBtn(p,'replay')){replayEco();return;}
        return;
    }
    if(G.state===STATE_PAUSE){
        if(hitBtn(p,'resume')){G.state=STATE_PLAYING;sfxClick();}
        else if(hitBtn(p,'menu')){G.state=STATE_MENU;sfxClick();}
        return;
    }
    if(G.state===STATE_OVER){
        if(hitBtn(p,'restart')){initState();G.state=STATE_PLAYING;sfxStart();}
        else if(hitBtn(p,'menu')){G.state=STATE_MENU;sfxClick();}
        return;
    }
    if(G.state!==STATE_PLAYING)return;
    drawHUD();drawToolbox();
    if(hitBtn(p,'start')){startSim();return;}
    if(hitBtn(p,'pause')){pauseSim();return;}
    if(hitBtn(p,'rand')){for(let i=0;i<6;i++)addRandomSpecies();return;}
    if(hitBtn(p,'clear')){resetEco();sfxClick();return;}
    if(hitBtn(p,'hint')){G.showingHint=true;sfxClick();return;}
    if(hitBtn(p,'skip')){
        G.resultPopup={pass:true,score:55,stars:1,bal:50,surv:60,div:50};
        G.totalScore+=55;
        G.ecoStars[G.ecoIdx]=Math.max(G.ecoStars[G.ecoIdx],1);
        G.ecoPassed[G.ecoIdx]=true;
        sfxScore();
        return;
    }
    for(let i=0;i<(G._spBtns||[]).length;i++){
        const sb=G._spBtns[i];
        if(p.x>=sb.x&&p.x<=sb.x+sb.w&&p.y>=sb.y&&p.y<=sb.y+sb.h){
            addSpecies(sb.sp.id);
            return;
        }
    }
    if(p.y>=SIM_Y+10&&p.y<=SIM_Y+SIM_H-10&&p.x>=10&&p.x<=SIM_W-10){
        if(!removeAt(p)){
            if(G.selectedSp!=null){
                const eco=ECOSYSTEMS[G.ecoIdx];
                const sp=eco.species[G.selectedSp];
                if(sp){
                    const count=G.organisms.filter(o=>o.alive&&o.spId===sp.id).length;
                    if(count<sp.maxPop&&G.placedCount<G.maxPlace){
                        G.organisms.push(createOrganism(sp,p.x,p.y));
                        G.placedCount++;
                        sfxPlace();
                    }
                }
            }
        }
    }
}

        const t=terms[i];
        const y=cy-195+i*32;
        ctx.fillStyle=i%2===0?'rgba(255,255,255,0.03)':'rgba(255,255,255,0.06)';
        ctx.fillRect(cx-195,y-12,390,28);
        ctx.fillStyle=t[3];ctx.font='bold 10px Microsoft YaHei';ctx.textAlign='left';
        ctx.fillText(String(i+1)+'. '+t[0],cx-190,y+7);
        ctx.fillStyle='#e0e0e0';ctx.font='9px Microsoft YaHei';
        ctx.fillText(t[1],cx-80,y+7);
        ctx.fillStyle='#fff9c4';ctx.font='9px Microsoft YaHei';
        ctx.fillText(t[2],cx-190,y+20);
    }
    ctx.lineWidth=1;
}

function drawCarryingCap(){
    const cx=W/2,cy=690;
    ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(cx-170,cy-40,340,60);
    ctx.strokeStyle='#8d6e63';ctx.lineWidth=2;ctx.strokeRect(cx-170,cy-40,340,60);
    ctx.fillStyle='#8d6e63';ctx.font='bold 11px Microsoft YaHei';ctx.textAlign='left';
    ctx.fillText('📊 种群增长两种曲线',cx-160,cy-20);
    ctx.strokeStyle='#ef5350';ctx.lineWidth=2;
    ctx.beginPath();
    for(let i=0;i<=30;i++){
        const x=cx-150+i*8,y=cy+10-Math.exp(i/12)*0.5;
        if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.stroke();
    ctx.fillStyle='#ef5350';ctx.font='9px Microsoft YaHei';ctx.fillText('J型(理想无上限)',cx-60,cy-5);
    ctx.strokeStyle='#66bb6a';ctx.lineWidth=2;
    ctx.beginPath();
    for(let i=0;i<=30;i++){
        const x=cx-150+i*8,k=80/(1+Math.exp(-(i-15)/3)),y=cy+10-k;
        if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.stroke();
    ctx.fillStyle='#66bb6a';ctx.fillText('S型(有K值=上限)',cx-60,cy+7);
    ctx.fillStyle='#fff9c4';ctx.font='9px Microsoft YaHei';
    ctx.fillText('→ K就是环境容纳量! 种群到K就不涨了',cx+40,cy+5);
    ctx.lineWidth=1;
}

function update(){
    G.animT++;
    if(G.simRunning&&G.state===STATE_PLAYING){
        updateSim();
    }
}

function draw(){
    G._btns={};G._spBtns=[];
    ctx.clearRect(0,0,W,H);
    if(G.state===STATE_MENU){drawMenu();return;}
    drawBackground();
    drawOrganisms();
    drawHUD();
    drawToolbox();
    if(G.state===STATE_PAUSE)drawPause();
    if(G.state===STATE_OVER)drawGameOver();
    drawResultPopup();
    drawHintPopup();
}

function startGame(){
    initState();
    G.state=STATE_PLAYING;
}

function loop(){
    if(G&&G.state===STATE_PLAYING)update();
    draw();
}

setInterval(loop,16);

canvas.addEventListener('mousedown',e=>{
    e.preventDefault();
    onPointerDown(getPos(e));
});
canvas.addEventListener('mousemove',e=>{onPointerMove(getPos(e));});
canvas.addEventListener('mouseup',e=>{onPointerUp(getPos(e));});
canvas.addEventListener('touchstart',e=>{
    e.preventDefault();
    if(e.touches[0])onPointerDown(getPos(e.touches[0]));
},{passive:false});
canvas.addEventListener('touchmove',e=>{
    e.preventDefault();
    if(e.touches[0])onPointerMove(getPos(e.touches[0]));
},{passive:false});
canvas.addEventListener('touchend',e=>{
    e.preventDefault();
    if(e.changedTouches[0])onPointerUp(getPos(e.changedTouches[0]));
},{passive:false});

document.addEventListener('keydown',e=>{
    if(e.key===' '||e.key==='Enter'){
        e.preventDefault();
        if(G&&G.state===STATE_MENU){sfxStart();startGame();}
        else if(G&&G.state===STATE_OVER){initState();G.state=STATE_PLAYING;sfxStart();}
    }
    if(e.key==='Escape'){
        e.preventDefault();
        if(G){
            if(G.state===STATE_PLAYING)G.state=STATE_PAUSE;
            else if(G.state===STATE_PAUSE)G.state=STATE_PLAYING;
        }
    }
    if(G&&G.state===STATE_PLAYING){
        if(e.key==='s'||e.key==='S'){if(G.simRunning)pauseSim();else startSim();}
        if(e.key>='1'&&e.key<='9'){
            const idx=parseInt(e.key)-1;
            const eco=ECOSYSTEMS[G.ecoIdx];
            if(idx<eco.species.length)addSpecies(eco.species[idx].id);
        }
    }
});

const _sbtn=document.getElementById('start-game-btn');
_sbtn.addEventListener('click',function(){
    initAudio();
    startGame();
    sfxStart();
    this.style.display='none';
});

if(!G)initState();

})();
</script>

  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
