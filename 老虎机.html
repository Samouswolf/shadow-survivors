<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>老虎机</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:linear-gradient(180deg,#2c1810 0%,#1a0f08 100%);font-family:'Microsoft YaHei',sans-serif}
#gameContainer{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#machine{background:linear-gradient(180deg,#d4af37 0%,#b8941f 50%,#8b6914 100%);border-radius:20px;padding:30px 20px;box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 2px 10px rgba(255,255,255,.2)}
#slotsContainer{display:flex;gap:10px;background:#1a1a1a;padding:15px;border-radius:10px;box-shadow:inset 0 5px 15px rgba(0,0,0,.8)}
.slot{width:80px;height:100px;background:#fff;border-radius:8px;overflow:hidden;position:relative;box-shadow:inset 0 0 20px rgba(0,0,0,.1)}
.slot-inner{position:absolute;width:100%;transition:transform 0.1s}
.symbol{width:80px;height:100px;display:flex;align-items:center;justify-content:center;font-size:48px}
#controls{margin-top:20px;display:flex;gap:15px;align-items:center}
#spinBtn{padding:15px 50px;font-size:20px;font-weight:bold;color:#fff;background:linear-gradient(180deg,#e74c3c 0%,#c0392b 100%);border:none;border-radius:25px;cursor:pointer;transition:all .3s;box-shadow:0 4px 15px rgba(231,76,60,.4)}
#spinBtn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(231,76,60,.6)}
#spinBtn:disabled{opacity:.5;cursor:not-allowed;transform:none}
#credits{font-size:18px;color:#ffd700;font-weight:bold;background:rgba(0,0,0,.3);padding:10px 20px;border-radius:15px}
#result{margin-top:15px;font-size:24px;font-weight:bold;color:#ffd700;text-shadow:0 0 10px rgba(255,215,0,.5);min-height:30px}
#betControls{display:flex;gap:10px;align-items:center;margin-top:10px}
#betBtn{padding:8px 15px;font-size:14px;color:#fff;background:#3498db;border:none;border-radius:15px;cursor:pointer}
#betDisplay{font-size:16px;color:#fff}
@media(max-width:375px){
.slot{width:60px;height:80px}
.symbol{width:60px;height:80px;font-size:36px}
#machine{padding:20px 15px}
}
</style>
<style>
/* 游戏工坊广告系统 */
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);height:90px;max-height:90px;overflow:hidden;contain:layout style paint;pointer-events:none!important}.ad-banner-container,.ad-banner-container *{pointer-events:none!important}.ad-banner-container iframe{max-height:90px;pointer-events:none!important}
.ad-banner-container iframe{max-width:100%}
.ad-label{position:absolute;top:1px;right:6px;font:9px "Microsoft YaHei",sans-serif;color:rgba(255,255,255,.35)}
.sponsor-btn{position:fixed;top:44px;right:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:3px 9px;border-radius:10px;font:11px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .qr-row{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.sponsor-panel .qr-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px;text-align:center;min-width:140px}
.sponsor-panel .qr-card .qr-icon{font-size:48px;margin-bottom:6px}
.sponsor-panel .qr-card .qr-label{color:#ccc;font:13px "Microsoft YaHei",sans-serif}
.sponsor-panel .qr-card .qr-hint{color:#888;font:11px "Microsoft YaHei",sans-serif;margin-top:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.interstitial-ad .ad-content{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;text-align:center;min-width:280px;max-width:400px}
.interstitial-ad .ad-content p{color:#aaa;font:14px "Microsoft YaHei",sans-serif;margin-bottom:12px}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
</style>
</head>
<body>
<div id="gameContainer">
<div id="machine">
<div id="slotsContainer">
<div class="slot" id="slot1"><div class="slot-inner" id="inner1"></div></div>
<div class="slot" id="slot2"><div class="slot-inner" id="inner2"></div></div>
<div class="slot" id="slot3"><div class="slot-inner" id="inner3"></div></div>
</div>
<div id="controls">
<div id="credits">💰 100</div>
<button id="spinBtn">🎰 拉动</button>
</div>
<div id="betControls">
<button id="betBtn" data-action="decrease">-</button>
<span id="betDisplay">赌注: 10</span>
<button id="betBtn" data-action="increase">+</button>
</div>
<div id="result"></div>
</div>
</div>

<!-- 广告系统 -->
<div class="ad-banner-container" id="adBanner"><div class="ad-label">广告</div><div id="adSlot" style="width:728px;max-width:100%;height:90px;display:flex;align-items:center;justify-content:center;color:#888;font:12px 'Microsoft YaHei',sans-serif">广告加载中...</div></div>
<button class="sponsor-btn" id="sponsorBtn">☕ 赞助</button>
<div class="sponsor-panel" id="sponsorPanel">
<h2>💛 支持开发者</h2>
<div style="color:#aaa;font:14px 'Microsoft YaHei',sans-serif;text-align:center;max-width:280px">如果你喜欢这个游戏，请开发者喝杯咖啡吧 ☕<br>每一份支持都是持续更新的动力！</div>
<div class="qr-row">
<div class="qr-card"><div class="qr-icon">💚</div><div class="qr-label">微信赞赏</div><div class="qr-hint">打开微信扫一扫</div></div>
<div class="qr-card"><div class="qr-icon">💙</div><div class="qr-label">支付宝支持</div><div class="qr-hint">打开支付宝扫一扫</div></div>
</div>
<button class="sponsor-close" id="sponsorClose">关闭</button>
</div>
<div class="interstitial-ad" id="interstitialAd">
<div class="ad-content">
<p>📢 赞助商广告</p>
<div id="interstitialAdSlot" style="min-height:250px;display:flex;align-items:center;justify-content:center;color:#888;font:13px 'Microsoft YaHei',sans-serif">广告加载中...</div>
</div>
<button class="skip-btn" id="skipInterstitial">跳过广告 ▶</button>
</div>

<script>
(function(){
// 水果符号配置
const SYMBOLS = [
    { emoji: '🍒', name: '樱桃', multiplier: 2 },
    { emoji: '🍋', name: '柠檬', multiplier: 3 },
    { emoji: '🍊', name: '橙子', multiplier: 4 },
    { emoji: '🍇', name: '葡萄', multiplier: 5 },
    { emoji: '🍉', name: '西瓜', multiplier: 8 },
    { emoji: '⭐', name: '星星', multiplier: 10 },
    { emoji: '💎', name: '钻石', multiplier: 15 },
    { emoji: '7️⃣', name: '幸运7', multiplier: 20 }
];

const SYMBOL_HEIGHT = 100;
const VISIBLE_SYMBOLS = 1;

// 游戏状态
let credits = 100;
let bet = 10;
let isSpinning = false;

// DOM元素
const slots = [
    document.getElementById('inner1'),
    document.getElementById('inner2'),
    document.getElementById('inner3')
];
const spinBtn = document.getElementById('spinBtn');
const creditsDiv = document.getElementById('credits');
const betDisplay = document.getElementById('betDisplay');
const resultDiv = document.getElementById('result');
const betBtns = document.querySelectorAll('#betBtn');

// 初始化符号显示
function initSlots() {
    slots.forEach((slot, index) => {
        const symbols = generateSymbols(20);
        slot.innerHTML = symbols.map(s => `<div class="symbol">${s.emoji}</div>`).join('');
        slot.style.transform = 'translateY(0)';
    });
}

// 生成符号序列
function generateSymbols(count) {
    const result = [];
    for (let i = 0; i < count; i++) {
        result.push(SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)]);
    }
    return result;
}

// 开始旋转
function spin() {
    if (isSpinning || credits < bet) return;
    
    isSpinning = true;
    credits -= bet;
    creditsDiv.textContent = `💰 ${credits}`;
    spinBtn.disabled = true;
    resultDiv.textContent = '';
    
    // 为每个槽生成结果
    const results = [];
    const spinPromises = [];
    
    slots.forEach((slot, index) => {
        const symbols = generateSymbols(30);
        slot.innerHTML = symbols.map(s => `<div class="symbol">${s.emoji}</div>`).join('');
        
        // 目标位置（随机停在某个符号上）
        const targetSymbol = Math.floor(Math.random() * 8) + 10;
        const targetPosition = targetSymbol * SYMBOL_HEIGHT;
        results.push(symbols[targetSymbol]);
        
        // 旋转动画
        const duration = 2000 + index * 500;
        const promise = animateSlot(slot, targetPosition, duration);
        spinPromises.push(promise);
    });
    
    // 等待所有槽停止
    Promise.all(spinPromises).then(() => {
        isSpinning = false;
        spinBtn.disabled = false;
        checkWin(results);
    });
}

// 槽动画
function animateSlot(slot, targetPosition, duration) {
    return new Promise(resolve => {
        const startTime = Date.now();
        const startPosition = 0;
        
        function animate() {
            const elapsed = Date.now() - startTime;
            const progress = Math.min(elapsed / duration, 1);
            
            // 缓动函数
            const easeOut = 1 - Math.pow(1 - progress, 3);
            const currentPosition = startPosition + (targetPosition - startPosition) * easeOut;
            
            slot.style.transform = `translateY(-${currentPosition}px)`;
            
            if (progress < 1) {
                requestAnimationFrame(animate);
            } else {
                resolve();
            }
        }
        
        animate();
    });
}

// 检查获胜
function checkWin(results) {
    const allSame = results.every(r => r.name === results[0].name);
    
    if (allSame) {
        const winAmount = bet * results[0].multiplier;
        credits += winAmount;
        creditsDiv.textContent = `💰 ${credits}`;
        resultDiv.textContent = `🎉 ${results[0].name}三连！赢得 ${winAmount}！`;
        resultDiv.style.color = '#ffd700';
        
        // 闪烁效果
        slots.forEach(slot => {
            slot.parentElement.style.boxShadow = '0 0 20px #ffd700';
            setTimeout(() => {
                slot.parentElement.style.boxShadow = 'inset 0 0 20px rgba(0,0,0,.1)';
            }, 500);
        });
    } else {
        // 检查两个相同
        const counts = {};
        results.forEach(r => {
            counts[r.name] = (counts[r.name] || 0) + 1;
        });
        
        const pairs = Object.entries(counts).find(([name, count]) => count === 2);
        if (pairs) {
            const symbol = SYMBOLS.find(s => s.name === pairs[0]);
            const winAmount = Math.floor(bet * symbol.multiplier * 0.5);
            credits += winAmount;
            creditsDiv.textContent = `💰 ${credits}`;
            resultDiv.textContent = `✨ ${pairs[0]}两连！赢得 ${winAmount}！`;
            resultDiv.style.color = '#4ecdc4';
        } else {
            resultDiv.textContent = '😅 没有匹配，再试一次！';
            resultDiv.style.color = '#aaa';
        }
    }
    
    // 检查游戏结束
    if (credits <= 0) {
        setTimeout(() => {
            resultDiv.textContent = '💸 游戏结束！金币耗尽';
            resultDiv.style.color = '#e74c3c';
            spinBtn.disabled = true;
            showInterstitialAd();
        }, 1000);
    }
}

// 调整赌注
betBtns.forEach(btn => {
    btn.addEventListener('click', () => {
        const action = btn.dataset.action;
        if (action === 'increase' && bet < credits) {
            bet = Math.min(bet + 10, 100);
        } else if (action === 'decrease' && bet > 10) {
            bet -= 10;
        }
        betDisplay.textContent = `赌注: ${bet}`;
    });
});

// 事件监听
spinBtn.addEventListener('click', spin);

// 初始化
initSlots();
})();

// 广告系统
(function(){
var sb=document.getElementById('sponsorBtn'),sp=document.getElementById('sponsorPanel'),sc=document.getElementById('sponsorClose');
if(sb&&sp){sb.onclick=function(){sp.style.display='flex'};if(sc)sc.onclick=function(){sp.style.display='none'}}
var ia=document.getElementById('interstitialAd'),si=document.getElementById('skipInterstitial');
if(ia&&si){si.onclick=function(){ia.style.display='none'}}
window.showInterstitialAd=function(){if(ia)ia.style.display='flex'};
})();
</script>
</body>
</html>
