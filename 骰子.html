<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>骰子游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }

        .game-title {
            text-align: center;
            font-size: 32px;
            color: #333;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .dice-area {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .dice {
            width: 100px;
            height: 100px;
            background: white;
            border: 3px solid #333;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 48px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s;
        }

        .dice.rolling {
            animation: roll 0.5s ease-in-out;
        }

        @keyframes roll {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(90deg); }
            50% { transform: rotate(180deg); }
            75% { transform: rotate(270deg); }
            100% { transform: rotate(360deg); }
        }

        .result-area {
            text-align: center;
            margin-bottom: 30px;
        }

        .result-text {
            font-size: 24px;
            color: #333;
            margin-bottom: 10px;
        }

        .result-value {
            font-size: 36px;
            font-weight: bold;
            color: #f5576c;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .btn {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            width: 100%;
            max-width: 200px;
        }

        .btn-roll {
            background: #f5576c;
            color: white;
        }

        .btn-roll:hover {
            background: #d63031;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(214, 48, 49, 0.4);
        }

        .btn-roll:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .bet-area {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .bet-btn {
            padding: 10px 20px;
            font-size: 16px;
            border: 2px solid #f5576c;
            background: white;
            color: #f5576c;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .bet-btn:hover {
            background: #f5576c;
            color: white;
        }

        .bet-btn.selected {
            background: #f5576c;
            color: white;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 10px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        /* 广告组件 */
        .ad-banner-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 90px;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .sponsor-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            z-index: 1001;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
            transition: all 0.3s;
        }

        .sponsor-btn:hover {
            transform: scale(1.1);
        }

        .sponsor-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            z-index: 1002;
            display: none;
            max-width: 300px;
            width: 90%;
        }

        .sponsor-panel.show {
            display: block;
        }

        .sponsor-close {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ddd;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
        }

        @media (max-width: 375px) {
            .dice {
                width: 80px;
                height: 80px;
                font-size: 36px;
            }

            .game-title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <!-- 赞助按钮 -->
    <button class="sponsor-btn" onclick="toggleSponsor()">☕</button>

    <!-- 赞助弹窗 -->
    <div class="sponsor-panel" id="sponsorPanel">
        <button class="sponsor-close" onclick="toggleSponsor()">×</button>
        <h3 style="text-align: center; margin-bottom: 20px;">支持开发者</h3>
        <p style="text-align: center; color: #666;">扫码赞赏</p>
    </div>

    <div class="game-container">
        <h1 class="game-title">骰子游戏</h1>

        <div class="dice-area">
            <div class="dice" id="dice1">?</div>
            <div class="dice" id="dice2">?</div>
        </div>

        <div class="result-area">
            <div class="result-text">总点数</div>
            <div class="result-value" id="totalValue">-</div>
        </div>

        <div class="controls">
            <div class="bet-area">
                <button class="bet-btn" onclick="setBet('small')">小 (2-6)</button>
                <button class="bet-btn" onclick="setBet('big')">大 (8-12)</button>
                <button class="bet-btn" onclick="setBet('seven')">7点</button>
            </div>
            <button class="btn btn-roll" id="rollBtn" onclick="rollDice()">掷骰子</button>
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-label">总次数</div>
                <div class="stat-value" id="totalRolls">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">赢</div>
                <div class="stat-value" id="wins">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">输</div>
                <div class="stat-value" id="losses">0</div>
            </div>
        </div>
    </div>

    <!-- 底部广告 -->
    <div class="ad-banner-container">
        <div style="color: white; font-size: 14px;">广告位招租</div>
    </div>

    <script>
        let currentBet = null;
        let stats = { totalRolls: 0, wins: 0, losses: 0 };

        function setBet(type) {
            currentBet = type;
            document.querySelectorAll('.bet-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
            event.target.classList.add('selected');
        }

        function rollDice() {
            if (!currentBet) {
                alert('请先选择押注类型！');
                return;
            }

            const dice1 = document.getElementById('dice1');
            const dice2 = document.getElementById('dice2');
            const rollBtn = document.getElementById('rollBtn');

            rollBtn.disabled = true;
            dice1.classList.add('rolling');
            dice2.classList.add('rolling');

            setTimeout(() => {
                const value1 = Math.floor(Math.random() * 6) + 1;
                const value2 = Math.floor(Math.random() * 6) + 1;
                const total = value1 + value2;

                dice1.textContent = value1;
                dice2.textContent = value2;
                dice1.classList.remove('rolling');
                dice2.classList.remove('rolling');

                document.getElementById('totalValue').textContent = total;

                // 判断输赢
                let won = false;
                if (currentBet === 'small' && total >= 2 && total <= 6) won = true;
                if (currentBet === 'big' && total >= 8 && total <= 12) won = true;
                if (currentBet === 'seven' && total === 7) won = true;

                stats.totalRolls++;
                if (won) {
                    stats.wins++;
                    document.getElementById('wins').textContent = stats.wins;
                    alert('恭喜！你赢了！');
                } else {
                    stats.losses++;
                    document.getElementById('losses').textContent = stats.losses;
                    alert('很遗憾，你输了！');
                }

                document.getElementById('totalRolls').textContent = stats.totalRolls;
                rollBtn.disabled = false;
            }, 500);
        }

        function toggleSponsor() {
            const panel = document.getElementById('sponsorPanel');
            panel.classList.toggle('show');
        }
    </script>
</body>
</html>
