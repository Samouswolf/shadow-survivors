<body>

  <h1 style="font-size:48px;color:#ff9ff3;margin-bottom:10px">🔗 连连看</h1>

  </div>

<div id="pauseScreen" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);flex-direction:column;align-items:center;justify-content:center;z-index:999">
  <h2 style="color:#fff;margin-bottom:30px">游戏暂停</h2>
  <button id="resumeBtn" style="padding:12px 40px;font-size:18px;background:#ff9ff3;color:#fff;border:none;border-radius:8px;margin-bottom:15px">继续游戏</button>
  <button id="restartBtn" style="padding:12px 40px;font-size:18px;background:#666;color:#fff;border:none;border-radius:8px">重新开始</button>
</div>
<canvas id="cv"></canvas>
<div class="ad-banner-container" id="adBanner"><span class="ad-label">ad</span></div>

<script>
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
const W=400,H=600;
cv.width=W;cv.height=H;

function resizeCanvas(){
    const maxW=window.innerWidth-20;
    if(W>maxW){
        cv.style.width=maxW+'px';
        cv.style.height=(H*maxW/W)+'px';
    }else{
        cv.style.width='';
        cv.style.height='';
    }
}
window.addEventListener('resize',resizeCanvas);
resizeCanvas();

// 图案emoji列表
const ICONS=['🍎','🍊','🍋','🍇','🍓','🍒','🍑','🥝','🍍','🍌','🫐','🍉'];
const ROWS=6;
const COLS=8;
const CELL_W=42;
const CELL_H=42;
const OFFSET_X=(W-COLS*CELL_W)/2;
const OFFSET_Y=80;

// 游戏状态
let G={
    state:'menu',
    score:0,
    time:0,
    grid:[],
    selected:null,
    hintPath:null,
    hintTimer:0,
    matchPath:null,
    matchTimer:0,
    particles:[],
    combo:0
};

let paused=false;

// 初始化网格
function initGrid(){
    G.grid=[];

    // 计算每种图案需要的数量（必须是偶数）
    const totalCells=ROWS*COLS;
    const pairsPerIcon=2;
    const iconsNeeded=Math.ceil(totalCells/pairsPerIcon);

    // 创建图案对
    let tiles=[];
    for(let i=0;i<totalCells/2;i++){
        const iconIdx=i%ICONS.length;
        tiles.push(iconIdx);
        tiles.push(iconIdx);
    }

    // 打乱
    for(let i=tiles.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [tiles[i],tiles[j]]=[tiles[j],tiles[i]];
    }

    // 填充网格
    let idx=0;
    for(let r=0;r<ROWS;r++){
        G.grid[r]=[];
        for(let c=0;c<COLS;c++){
            G.grid[r][c]={
                icon:tiles[idx],
                alive:true
            };
            idx++;
        }
    }
}

// 初始化游戏
function initGame(){
    G.state='playing';
    G.score=0;
    G.time=120;
    G.selected=null;
    G.hintPath=null;
    G.matchPath=null;
    G.particles=[];
    G.combo=0;

    initGrid();

    document.getElementById('startScreen').style.display='none';
    document.getElementById('pauseBtn').style.display='block';
}

// 获取单元格中心坐标
function getCellCenter(r,c){
    return{
        x:OFFSET_X+c*CELL_W+CELL_W/2,
        y:OFFSET_Y+r*CELL_H+CELL_H/2
    };
}

// 检查两点之间是否可以直线连接（无障碍）
function canLineConnect(r1,c1,r2,c2){
    if(r1===r2){
        // 同一行
        const minC=Math.min(c1,c2);
        const maxC=Math.max(c1,c2);
        for(let c=minC+1;c<maxC;c++){
            if(G.grid[r1][c].alive)return false;
        }
        return true;
    }
    if(c1===c2){
        // 同一列
        const minR=Math.min(r1,r2);
        const maxR=Math.max(r1,r2);
        for(let r=minR+1;r<maxR;r++){
            if(G.grid[r][c1].alive)return false;
        }
        return true;
    }
    return false;
}

// 查找连接路径（最多2个拐点）
function findPath(r1,c1,r2,c2){
    // 直连
    if(canLineConnect(r1,c1,r2,c2)){
        return [{r:r1,c:c1},{r:r2,c:c2}];
    }

    // 1个拐点
    // 尝试(r1,c2)和(r2,c1)
    if(!G.grid[r1][c2].alive&&canLineConnect(r1,c1,r1,c2)&&canLineConnect(r1,c2,r2,c2)){
        return [{r:r1,c:c1},{r:r1,c:c2},{r:r2,c:c2}];
    }
    if(!G.grid[r2][c1].alive&&canLineConnect(r1,c1,r2,c1)&&canLineConnect(r2,c1,r2,c2)){
        return [{r:r1,c:c1},{r:r2,c:c1},{r:r2,c:c2}];
    }

    // 2个拐点 - 需要更复杂的搜索
    // 尝试所有可能的中间行/列
    for(let r=-1;r<=ROWS;r++){
        if(r===r1||r===r2)continue;
        const midR=r<0?-1:r>=ROWS?-1:r;

        // 尝试(r,c1)和(r,c2)
        const testR=midR===-1?(r<0?-1:ROWS):midR;
        if(testR>=-1&&testR<=ROWS){
            const checkR=testR<0||testR>=ROWS?-1:testR;
            if(checkR===-1||!G.grid[checkR][c1].alive){
                if(canLineConnect(r1,c1,checkR===-1?(r<0?-1:ROWS):checkR,c1)&&
                   canLineConnect(checkR===-1?(r<0?-1:ROWS):checkR,c1,checkR===-1?(r<0?-1:ROWS):checkR,c2)&&
                   canLineConnect(checkR===-1?(r<0?-1:ROWS):checkR,c2,r2,c2)){
                    return [{r:r1,c:c1},{r:checkR===-1?(r<0?-1:ROWS):checkR,c:c1},{r:checkR===-1?(r<0?-1:ROWS):checkR,c:c2},{r:r2,c:c2}];
                }
            }
        }
    }

    for(let c=-1;c<=COLS;c++){
        if(c===c1||c===c2)continue;
        const midC=c<0?-1:c>=COLS?-1:c;

        const testC=midC===-1?(c<0?-1:COLS):midC;
        if(testC>=-1&&testC<=COLS){
            const checkC=testC<0||testC>=COLS?-1:testC;
            if(checkC===-1||!G.grid[r1][checkC].alive){
                if(canLineConnect(r1,c1,r1,checkC===-1?(c<0?-1:COLS):checkC)&&
                   canLineConnect(r1,checkC===-1?(c<0?-1:COLS):checkC,r2,checkC===-1?(c<0?-1:COLS):checkC)&&
                   canLineConnect(r2,checkC===-1?(c<0?-1:COLS):checkC,r2,c2)){
                    return [{r:r1,c:c1},{r:r1,c:checkC===-1?(c<0?-1:COLS):checkC},{r:r2,c:checkC===-1?(c<0?-1:COLS):checkC},{r:r2,c:c2}];
                }
            }
        }
    }

    return null;
}

// 查找所有可用配对
function findAllPairs(){
    const pairs=[];
    for(let r1=0;r1<ROWS;r1++){
        for(let c1=0;c1<COLS;c1++){
            if(!G.grid[r1][c1].alive)continue;
            for(let r2=r1;r2<ROWS;r2++){
                const startC=(r2===r1)?c1+1:0;
                for(let c2=startC;c2<COLS;c2++){
                    if(!G.grid[r2][c2].alive)continue;
                    if(G.grid[r1][c1].icon!==G.grid[r2][c2].icon)continue;

                    const path=findPath(r1,c1,r2,c2);
                    if(path){
                        pairs.push({r1,c1,r2,c2,path});
                    }
                }
            }
        }
    }
    return pairs;
}

// 创建粒子
function createParticles(x,y,color,count){
    for(let i=0;i<count;i++){
        G.particles.push({
            x:x,
            y:y,
            vx:(Math.random()-0.5)*4,
            vy:(Math.random()-0.5)*4,
            size:Math.random()*6+2,
            color:color,
            life:20+Math.random()*15
        });
    }
}

// 处理点击
function handleClick(r,c){
    if(r<0||r>=ROWS||c<0||c>=COLS)return;
    if(!G.grid[r][c].alive)return;

    if(!G.selected){
        // 第一次选择
        G.selected={r,c};
        G.hintPath=null;
        G.hintTimer=0;
    }else{
        // 第二次选择
        if(G.selected.r===r&&G.selected.c===c){
            // 取消选择
            G.selected=null;
            return;
        }

        // 检查是否同图案
        if(G.grid[G.selected.r][G.selected.c].icon!==G.grid[r][c].icon){
            G.selected={r,c};
            return;
        }

        // 检查连接
        const path=findPath(G.selected.r,G.selected.c,r,c);
        if(path){
            // 匹配成功
            G.matchPath=path;
            G.matchTimer=20;

            const icon=G.grid[r][c].icon;
            const p1=getCellCenter(G.selected.r,G.selected.c);
            const p2=getCellCenter(r,c);

            createParticles(p1.x,p1.y,'#ff9ff3',5);
            createParticles(p2.x,p2.y,'#ff9ff3',5);

            G.grid[G.selected.r][G.selected.c].alive=false;
            G.grid[r][c].alive=false;

            G.combo++;
            G.score+=10*G.combo;

            // 检查是否全部消除
            let allCleared=true;
            for(let rr=0;rr<ROWS;rr++){
                for(let cc=0;cc<COLS;cc++){
                    if(G.grid[rr][cc].alive){
                        allCleared=false;
                        break;
                    }
                }
                if(!allCleared)break;
            }

            if(allCleared){
                G.state='over';
            }
        }

        G.selected=null;
    }
}

// 更新游戏
function update(){
    if(G.state!=='playing'||paused)return;

    // 更新时间
    G.time-=1/60;
    if(G.time<=0){
        G.time=0;
        G.state='over';
        return;
    }

    // 更新提示
    if(G.hintTimer>0){
        G.hintTimer--;
    }

    // 更新匹配动画
    if(G.matchTimer>0){
        G.matchTimer--;
    }

    // 更新粒子
    for(let i=G.particles.length-1;i>=0;i--){
        const p=G.particles[i];
        p.x+=p.vx;
        p.y+=p.vy;
        p.life--;
        if(p.life<=0){
            G.particles.splice(i,1);
        }
    }
}

// 绘制游戏
function render(){
    ctx.fillStyle='#1a0a2e';
    ctx.fillRect(0,0,W,H);

    // 绘制网格背景
    ctx.fillStyle='rgba(255,255,255,0.03)';
    for(let r=0;r<ROWS;r++){
        for(let c=0;c<COLS;c++){
            ctx.fillRect(OFFSET_X+c*CELL_W,OFFSET_Y+r*CELL_H,CELL_W-2,CELL_H-2);
        }
    }

    // 绘制匹配路径
    if(G.matchPath&&G.matchTimer>0){
        ctx.strokeStyle='rgba(255,159,243,0.8)';
        ctx.lineWidth=3;
        ctx.lineCap='round';
        ctx.lineJoin='round';
        ctx.beginPath();
        const p0=getCellCenter(G.matchPath[0].r,G.matchPath[0].c);
        ctx.moveTo(p0.x,p0.y);
        for(let i=1;i<G.matchPath.length;i++){
            const p=getCellCenter(G.matchPath[i].r,G.matchPath[i].c);
            ctx.lineTo(p.x,p.y);
        }
        ctx.stroke();
    }

    // 绘制提示路径
    if(G.hintPath&&G.hintTimer>0){
        ctx.strokeStyle='rgba(255,255,0,0.5)';
        ctx.lineWidth=2;
        ctx.setLineDash([5,5]);
        ctx.beginPath();
        const p0=getCellCenter(G.hintPath[0].r,G.hintPath[0].c);
        ctx.moveTo(p0.x,p0.y);
        for(let i=1;i<G.hintPath.length;i++){
            const p=getCellCenter(G.hintPath[i].r,G.hintPath[i].c);
            ctx.lineTo(p.x,p.y);
        }
        ctx.stroke();
        ctx.setLineDash([]);
    }

    // 绘制网格图案
    for(let r=0;r<ROWS;r++){
        for(let c=0;c<COLS;c++){
            const cell=G.grid[r][c];
            if(!cell.alive)continue;

            const x=OFFSET_X+c*CELL_W;
            const y=OFFSET_Y+r*CELL_H;
            const center=getCellCenter(r,c);

            // 选中高亮
            if(G.selected&&G.selected.r===r&&G.selected.c===c){
                ctx.fillStyle='rgba(255,159,243,0.3)';
                ctx.fillRect(x,y,CELL_W-2,CELL_H-2);
                ctx.strokeStyle='#ff9ff3';
                ctx.lineWidth=2;
                ctx.strokeRect(x,y,CELL_W-2,CELL_H-2);
            }else{
                // 单元格背景
                ctx.fillStyle='rgba(255,255,255,0.08)';
                ctx.fillRect(x,y,CELL_W-2,CELL_H-2);
            }

            // 绘制emoji
            ctx.font='22px serif';
            ctx.textAlign='center';
            ctx.textBaseline='middle';
            ctx.fillText(ICONS[cell.icon],center.x,center.y);
        }
    }

    // 绘制粒子
    for(const p of G.particles){
        ctx.globalAlpha=p.life/35;
        ctx.fillStyle=p.color;
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
        ctx.fill();
    }
    ctx.globalAlpha=1;

    // HUD
    ctx.fillStyle='#fff';
    ctx.font='bold 18px Microsoft YaHei';
    ctx.textAlign='left';
    ctx.fillText('得分: '+G.score,10,30);

    ctx.textAlign='center';
    ctx.fillStyle=G.time<30?'#ff4444':'#fff';
    ctx.fillText(Math.ceil(G.time)+'秒',W/2,30);

    ctx.textAlign='right';
    ctx.fillStyle='#ff9ff3';
    ctx.fillText('连击: '+G.combo,W-10,30);

    // 提示按钮
    ctx.fillStyle='rgba(255,255,255,0.1)';
    ctx.fillRect(W-80,45,70,30);
    ctx.fillStyle='#888';
    ctx.font='14px Microsoft YaHei';
    ctx.textAlign='center';
    ctx.fillText('💡 提示',W-45,64);

    // 游戏结束
    if(G.state==='over'){
        ctx.fillStyle='rgba(0,0,0,0.7)';
        ctx.fillRect(0,0,W,H);

        const allCleared=G.score>0;
        ctx.fillStyle='#ff9ff3';
        ctx.font='bold 36px Microsoft YaHei';
        ctx.textAlign='center';
        ctx.fillText(allCleared?'恭喜过关!':'时间到!',W/2,H/2-40);

        ctx.fillStyle='#fff';
        ctx.font='24px Microsoft YaHei';
        ctx.fillText('最终得分: '+G.score,W/2,H/2+10);

        ctx.fillStyle='#c49bff';
        ctx.font='18px Microsoft YaHei';
        ctx.fillText('点击重新开始',W/2,H/2+60);
    }
}

// 主循环
function gameLoop(){
    update();
    render();
    requestAnimationFrame(gameLoop);
}

// 获取点击的单元格
function getCell(x,y){
    const c=Math.floor((x-OFFSET_X)/CELL_W);
    const r=Math.floor((y-OFFSET_Y)/CELL_H);
    if(r>=0&&r<ROWS&&c>=0&&c<COLS){
        return{r,c};
    }
    return null;
}

// 事件绑定
cv.addEventListener('click',(e)=>{
    const rect=cv.getBoundingClientRect();
    const x=(e.clientX-rect.left)*(W/rect.width);
    const y=(e.clientY-rect.top)*(H/rect.height);

    if(G.state==='over'){
        initGame();
        return;
    }

    if(G.state!=='playing')return;

    // 检查提示按钮
    if(x>=W-80&&x<=W-10&&y>=45&&y<=75){
        const pairs=findAllPairs();
        if(pairs.length>0){

cv.addEventListener('touchstart',(e)=>{
    e.preventDefault();
    const rect=cv.getBoundingClientRect();
    const touch=e.touches[0];
    const x=(touch.clientX-rect.left)*(W/rect.width);
    const y=(touch.clientY-rect.top)*(H/rect.height);

    if(G.state==='over'){
        initGame();
        return;
    }

    if(G.state!=='playing')return;

    // 检查提示按钮
    if(x>=W-80&&x<=W-10&&y>=45&&y<=75){
        const pairs=findAllPairs();
        if(pairs.length>0){
            const pair=pairs[Math.floor(Math.random()*pairs.length)];
            G.hintPath=pair.path;
            G.hintTimer=120;
        }
        return;
    }

    const cell=getCell(x,y);
    if(cell){
        handleClick(cell.r,cell.c);
    }
},{passive:false});

document.getElementById('startBtn').onclick=()=>{

};

// 暂停按钮
document.getElementById('pauseBtn').onclick=()=>{
    paused=true;
    document.getElementById('pauseScreen').style.display='flex';
};

// 继续按钮
document.getElementById('resumeBtn').onclick=()=>{
    paused=false;
    document.getElementById('pauseScreen').style.display='none';
};

// 重新开始
document.getElementById('restartBtn').onclick=()=>location.reload();

// Escape键暂停
document.addEventListener('keydown',(e)=>{
    if(e.key==='Escape'&&G.state==='playing'){
        if(!paused){
            paused=true;
            document.getElementById('pauseScreen').style.display='flex';
        }else{
            paused=false;
            document.getElementById('pauseScreen').style.display='none';
        }
    }

        const pairs=findAllPairs();
        if(pairs.length>0){
            const pair=pairs[Math.floor(Math.random()*pairs.length)];
            G.hintPath=pair.path;
            G.hintTimer=120;
        }
    }
});
