<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>别踩白块</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1e1e2f 0%, #2a2a3e 50%, #3a2a4e 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 10px; color: #fff; overflow-x: hidden; }
        #wrap { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 10px; }
        .hud { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; background: rgba(255,255,255,0.07); border-radius: 14px; border: 1px solid rgba(255,255,255,0.1); }
        .hud-tit { display: flex; flex-direction: column; gap: 4px; }
        .game-tit { font-size: 20px; font-weight: bold; background: linear-gradient(90deg, #ff6b6b, #feca57); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .hs-txt { font-size: 12px; color: rgba(255,255,255,0.55); }
        .hud-sc { text-align: right; }
        .sc-lbl { font-size: 11px; color: rgba(255,255,255,0.45); }
        .sc-val { font-size: 30px; font-weight: bold; color: #4ecdc4; line-height: 1; }
        .tm-val { font-size: 14px; color: #feca57; margin-top: 2px; }
        canvas { width: 100%; height: 580px; background: #fefefe; border-radius: 14px; border: 2px solid rgba(255,255,255,0.3); touch-action: none; display: block; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        .btn-row { display: flex; gap: 10px; }
        .gb { flex: 1; padding: 14px; border: none; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; color: #fff; transition: transform 0.1s; }
        .gb:active { transform: scale(0.94); }
        .gb-st { background: linear-gradient(135deg, #ee5253 0%, #ff9f43 100%); }
        .gb-ps { background: linear-gradient(135deg, #5f27cd 0%, #341f97 100%); }
        .gb-hp { background: linear-gradient(135deg, #00d2d3 0%, #01a3a4 100%); }
        .ad { width: 100%; height: 55px; background: linear-gradient(135deg, #ffeaa7 0%, #fab1a0 100%); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #2d3436; font-weight: bold; }
        .ov { position: fixed; inset: 0; background: rgba(0,0,0,0.88); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
        .ov-in { background: linear-gradient(145deg, #2d2d3f, #1e1e2f); padding: 28px 24px; border-radius: 20px; max-width: 400px; width: 100%; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        .ov-in h2 { font-size: 26px; margin-bottom: 14px; background: linear-gradient(90deg, #ff6b6b, #feca57); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .ov-in p { color: rgba(255,255,255,0.8); line-height: 1.8; margin-bottom: 10px; font-size: 14px; }
        .ov-stats { display: flex; justify-content: space-around; margin: 18px 0; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 12px; }
        .ov-stc { display: flex; flex-direction: column; gap: 4px; }
        .ov-stn { font-size: 22px; font-weight: bold; color: #4ecdc4; }
        .ov-stl { font-size: 12px; color: rgba(255,255,255,0.5); }
        .ov-in button { margin-top: 10px; width: 100%; padding: 15px; font-size: 17px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; color: #fff; background: linear-gradient(135deg, #ee5253, #ff9f43); }
        .hdn { display: none !important; }
        .nr { color: #feca57; font-size: 16px; font-weight: bold; animation: bl 0.8s infinite; margin: 8px 0; }
        @keyframes bl { 50% { opacity: 0.4; } }
        .md-row { display: flex; gap: 8px; margin: 14px 0; }
        .md-btn { flex: 1; padding: 10px; border: 2px solid rgba(255,255,255,0.2); border-radius: 10px; background: transparent; color: #fff; font-size: 13px; cursor: pointer; font-weight: bold; }
        .md-btn.active { background: linear-gradient(135deg, #ee5253, #ff9f43); border-color: transparent; }
    /* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}

<body>
    <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div id="wrap">
        <div class="hud">
            <div class="hud-tit">
                <div class="game-tit">⬛ 别踩白块</div>
                <div class="hs-txt">最高分: <span id="hs">0</span></div>
            </div>
            <div class="hud-sc">
                <div class="sc-lbl">得分</div>
                <div class="sc-val" id="sc">0</div>
                <div class="tm-val" id="tm">⏱ 经典模式</div>
            </div>
        </div>
        <canvas id="cv" width="480" height="720"></canvas>
        <div class="btn-row">
            <button class="gb gb-st" id="btn-st">▶ 开始</button>
            <button class="gb gb-ps" id="btn-ps">⏸ 暂停</button>
            <button class="gb gb-hp" id="btn-hp">❓ 玩法</button>
        </div>
        <div class="ad">⬛ 挑战最快手速！冲榜赢奖励</div>
    </div>

    <div class="ov hdn" id="guide">
        <div class="ov-in">
            <h2>⬛ 别踩白块</h2>
            <p>🎯 黑块从上往下滚动</p>
            <p>👆 <b>点击黑块</b>，千万<b>别踩白块！</b></p>
            <p>⌨️ 键盘: <b>D F J K</b> 对应四列</p>
            <div class="md-row">
                <button class="md-btn active" data-md="classic">经典</button>
                <button class="md-btn" data-md="zen">禅模式</button>
                <button class="md-btn" data-md="rush">极速</button>
            </div>
            <p id="mode-desc">经典模式: 速度逐渐加快，挑战极限</p>
            <button id="go">开始游戏</button>
        </div>
    </div>

    <div class="ov hdn" id="end">
        <div class="ov-in">
            <h2 id="et">游戏结束</h2>
            <div class="nr hdn" id="nr">🏆 新纪录！</div>
            <div class="ov-stats">
                <div class="ov-stc"><div class="ov-stn" id="es">0</div><div class="ov-stl">本次得分</div></div>
                <div class="ov-stc"><div class="ov-stn" id="ec">0</div><div class="ov-stl">连击最高</div></div>
                <div class="ov-stc"><div class="ov-stn" id="eh">0</div><div class="ov-stl">历史最高</div></div>
            </div>
            <button id="reb">再来一局</button>
        </div>
    </div>

    <div class="ov hdn" id="psov">
        <div class="ov-in">
            <h2>⏸ 暂停中</h2>
            <p>深呼吸一下，准备好了吗？</p>
            <button id="rsb">继续游戏</button>
        </div>
    </div>

    <script>
        if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
        if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
        if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
        if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
    </script>
    <script src="../game_core.js"></script>
    <script>
    (function() {
        const GN = '别踩白块';
        GameCore.init({ highScore: GN });
        const cv = document.getElementById('cv');
        const ctx = cv.getContext('2d');
        const W = cv.width, H = cv.height;
        const COLS = 4, CW = W / COLS, BH = H / 4;
        let state = STATE_MENU;
        let mode = 'classic';
        let blocks = [];
        let score = 0, combo = 0, mCombo = 0;
        let speed = 3;
        let st = 0, si = 60;
        let raf = null;
        let ripples = [];
        let wrongFx = null;

        const es = document.getElementById('sc');
        const et = document.getElementById('tm');
        const ehs = document.getElementById('hs');
        ehs.textContent = GameCore.highScore.get(GN);

        const MDI = {
            classic: '经典模式: 速度逐渐加快，挑战极限手速',
            zen: '禅模式: 恒定速度，60秒内最高连击',
            rush: '极速模式: 初始即高速，挑战反应极限'
        };

        function Block(c, r) { this.c = c; this.r = r; this.y = -BH + r * BH; this.done = false; this.fo = 0; }

        function spawn() {
            const c = Math.floor(Math.random() * COLS);
            blocks.push(new Block(c, -1));
        }

        function init() {
            blocks = []; ripples = []; wrongFx = null;
            score = 0; combo = 0; mCombo = 0; st = 0;
            if (mode === 'classic') { speed = 3; si = 58; }
            else if (mode === 'zen') { speed = 3.2; si = 52; }
            else { speed = 5.5; si = 36; }
            for (let r = 0; r < 5; r++) {
                if (Math.random() < 0.9) {
                    const c = Math.floor(Math.random() * COLS);
                    const b = new Block(c, r); b.y = r * BH; blocks.push(b);
                }
            }
            h();
        }

        function h() {
            es.textContent = score;
            if (mode === 'zen') {
                const tl = Math.max(0, 60 - Math.floor((performance.now() - (window._zst || performance.now())) / 1000));
                et.textContent = '⏱ ' + tl + 's';
            } else if (mode === 'rush') { et.textContent = '⚡ 极速'; }
            else { et.textContent = '🔥 经典'; }
            const hs = GameCore.highScore.get(GN);
            if (score > hs) ehs.textContent = score;
        }

        function addRipple(x, y, col) {
            ripples.push({ x: x, y: y, r: 5, a: 1, c: col });
        }

        function tap(col, cy) {
            if (state !== STATE_PLAYING) return;
            let hit = null, hi = -1;
            for (let i = 0; i < blocks.length; i++) {
                const b = blocks[i];
                if (b.c === col && !b.done) {
                    if (cy >= b.y && cy <= b.y + BH + BH * 0.25) {
                        if (!hit || b.y > hit.y) { hit = b; hi = i; }
                    }
                }
            }
            if (hit) {
                hit.done = true;
                score++; combo++; mCombo = Math.max(mCombo, combo);
                if (mode === 'classic') { speed += 0.015; si = Math.max(26, 58 - Math.floor(score / 60) * 2); }
                else if (mode === 'rush') { speed += 0.008; }
                const px = col * CW + CW / 2, py = hit.y + BH / 2;
                addRipple(px, py, '#4ecdc4');
                GameCore.highScore.set(GN, score);
                h();
            } else {
                wrongFx = { x: col * CW + CW / 2, y: cy, a: 1 };
                addRipple(col * CW + CW / 2, cy, '#ff4757');
                gO(false);
            }
        }

        function gO(win) {
            state = STATE_OVER;
            if (raf) cancelAnimationFrame(raf);
            raf = null;
            const isNew = GameCore.highScore.set(GN, score);
            document.getElementById('et').textContent = win ? '🎉 挑战成功！' : '❌ 踩错了！';
            document.getElementById('es').textContent = score;
            document.getElementById('ec').textContent = mCombo;
            document.getElementById('eh').textContent = GameCore.highScore.get(GN);
            document.getElementById('nr').classList.toggle('hdn', !isNew);
            document.getElementById('end').classList.remove('hdn');
        }

        function upd() {
            if (state !== STATE_PLAYING) return;
            for (let i = blocks.length - 1; i >= 0; i--) {
                const b = blocks[i];
                b.y += speed;
                if (b.done) { b.fo += 0.07; if (b.fo >= 1) blocks.splice(i, 1); continue; }
                if (b.y > H) {
                    if (!b.done) { combo = 0; h(); gO(false); return; }
                    blocks.splice(i, 1);
                }
            }
            st++;
            if (st >= si) { st = 0; if (blocks.filter(b => !b.done).length < 9) spawn(); }
            for (let i = ripples.length - 1; i >= 0; i--) {
                const r = ripples[i]; r.r += 4; r.a -= 0.04;
                if (r.a <= 0) ripples.splice(i, 1);
            }
            if (wrongFx) { wrongFx.a -= 0.05; if (wrongFx.a <= 0) wrongFx = null; }
            if (mode === 'zen') {
                if (!window._zst) window._zst = performance.now();
                const elapsed = (performance.now() - window._zst) / 1000;
                if (elapsed >= 60) { h(); gO(true); return; }
                h();
            }
        }

        function dr() {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, W, H);
            for (let r = 0; r < 5; r++) {
                const yy = r * BH;
                ctx.strokeStyle = '#e8e8e8';
                ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(W, yy); ctx.stroke();
            }
            for (let c = 1; c < COLS; c++) {
                ctx.strokeStyle = '#e0e0e0';
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(c * CW, 0); ctx.lineTo(c * CW, H); ctx.stroke();
            }
            for (let i = 0; i < blocks.length; i++) {
                const b = blocks[i];
                const x = b.c * CW, y = b.y;
                if (b.done) {
                    ctx.globalAlpha = Math.max(0, 1 - b.fo);
                    ctx.fillStyle = '#2ecc71';
                    ctx.fillRect(x + 4, y + 4, CW - 8, BH - 8);
                    ctx.globalAlpha = 1;
                } else {
                    const grad = ctx.createLinearGradient(x, y, x, y + BH);
                    grad.addColorStop(0, '#2a2a2a');
                    grad.addColorStop(1, '#0f0f0f');
                    ctx.fillStyle = grad;
                    ctx.fillRect(x + 4, y + 4, CW - 8, BH - 8);
                    ctx.strokeStyle = '#444';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(x + 4, y + 4, CW - 8, BH - 8);
                }
            }
            const zy = H - BH * 0.35;
            ctx.fillStyle = 'rgba(78, 205, 196, 0.1)';
            ctx.fillRect(0, zy, W, BH * 0.35);
            ctx.strokeStyle = 'rgba(78, 205, 196, 0.6)';
            ctx.lineWidth = 2;
            ctx.setLineDash([12, 6]);
            ctx.beginPath(); ctx.moveTo(0, zy); ctx.lineTo(W, zy); ctx.stroke();
            ctx.setLineDash([]);
            for (let i = 0; i < ripples.length; i++) {
                const r = ripples[i];
                ctx.globalAlpha = r.a;
                ctx.strokeStyle = r.c;
                ctx.lineWidth = 3;
                ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke();
            }
            if (wrongFx) {
                ctx.globalAlpha = wrongFx.a;
                ctx.fillStyle = 'rgba(255, 71, 87, 0.5)';
                ctx.fillRect(0, 0, W, H);
                ctx.globalAlpha = 1;
                ctx.fillStyle = '#ff4757';
                ctx.font = 'bold 60px Microsoft YaHei';
                ctx.textAlign = 'center';
                ctx.fillText('❌', W / 2, H / 2);
            }
            ctx.globalAlpha = 1;
            if (combo >= 5 && state === STATE_PLAYING) {
                ctx.fillStyle = '#feca57';
                ctx.font = 'bold 40px Microsoft YaHei';
                ctx.textAlign = 'center';
                ctx.fillText(combo + ' COMBO', W / 2, 80);
            }
            if (state === STATE_MENU) {
                ctx.fillStyle = 'rgba(0,0,0,0.55)';
                ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = '#ff6b6b';
                ctx.font = 'bold 42px Microsoft YaHei';
                ctx.textAlign = 'center';
                ctx.fillText('准备开始', W / 2, H / 2 - 10);
                ctx.fillStyle = '#fff';
                ctx.font = '16px Microsoft YaHei';
                ctx.fillText('点击"开始"选择模式', W / 2, H / 2 + 30);
            }
        }

        function lp() { upd(); dr(); raf = requestAnimationFrame(lp); }

        function colOf(cx) { return Math.max(0, Math.min(COLS - 1, Math.floor(cx / CW))); }

        cv.addEventListener('mousedown', function(e) {
            const r = cv.getBoundingClientRect();
            const sx = W / r.width, sy = H / r.height;
            tap(colOf((e.clientX - r.left) * sx), (e.clientY - r.top) * sy);
        });
        cv.addEventListener('touchstart', function(e) {
            const r = cv.getBoundingClientRect();
            const sx = W / r.width, sy = H / r.height;
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                tap(colOf((t.clientX - r.left) * sx), (t.clientY - r.top) * sy);
            }
        }, { passive: true });

        const km = { 'd': 0, 'f': 1, 'j': 2, 'k': 3, 'D': 0, 'F': 1, 'J': 2, 'K': 3 };
        document.addEventListener('keydown', function(e) {
            if (km[e.key] !== undefined) {
                e.preventDefault();
                tap(km[e.key], H - BH * 0.2);
            }
        });

        function sg() {
            init();
            state = STATE_PLAYING;
            window._zst = null;
            document.getElementById('guide').classList.add('hdn');
            document.getElementById('end').classList.add('hdn');
            document.getElementById('psov').classList.add('hdn');
            h();
            if (!raf) lp();
        }

        function pg() {
            if (state !== STATE_PLAYING) return;
            state = STATE_PAUSE;
            document.getElementById('psov').classList.remove('hdn');
        }

        function rg() {
            if (state !== STATE_PAUSE) return;
            state = STATE_PLAYING;
            document.getElementById('psov').classList.add('hdn');
        }

        document.getElementById('btn-st').addEventListener('click', function() {
            document.getElementById('guide').classList.remove('hdn');
        });
        document.getElementById('btn-ps').addEventListener('click', function() {
            if (state === STATE_PLAYING) pg();
            else if (state === STATE_PAUSE) rg();
        });
        document.getElementById('btn-hp').addEventListener('click', function() {
            document.getElementById('guide').classList.remove('hdn');
        });
        document.getElementById('go').addEventListener('click', sg);
        document.getElementById('reb').addEventListener('click', sg);
        document.getElementById('rsb').addEventListener('click', rg);
        document.getElementById('start-game-btn').addEventListener('click', function() {
            document.getElementById('guide').classList.remove('hdn');
        });

        document.querySelectorAll('.md-btn').forEach(function(b) {
            b.addEventListener('click', function() {
                document.querySelectorAll('.md-btn').forEach(function(x) { x.classList.remove('active'); });
                b.classList.add('active');
                mode = b.dataset.md;
                document.getElementById('mode-desc').textContent = MDI[mode];
            });
        });

        GameCore.hints.showStartGuide(
            '⬛ <b>别踩白块</b><br><br>🎯 黑色方块从上滚动<br>👆 只能点击黑色方块<br>⌨️ D F J K 控制四列<br>💔 点白块或漏黑块结束<br>🏆 三种模式等你挑战！'
        );
        setTimeout(function() { document.getElementById('guide').classList.remove('hdn'); }, 100);
    })();
    </script>
<!-- [BATCH-FIX:responsive-js] -->
<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>

<script>
(function(){
  if (window.__batchFixAds) return;
  window.__batchFixAds = true;

    var btn = document.getElementById('batchSponsorBtn');
    if (btn) btn.style.display = '';
  });

</script>

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
