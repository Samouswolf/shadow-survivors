<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>架子鼓模拟器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1410 0%, #2a1e14 50%, #3a2818 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 10px; color: #fff; overflow-x: hidden; }
        #wrap { width: 100%; max-width: 540px; display: flex; flex-direction: column; gap: 10px; }
        .hud { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; background: rgba(255,180,80,0.08); border-radius: 14px; border: 1px solid rgba(255,180,80,0.25); backdrop-filter: blur(8px); }
        .hud-l { display: flex; flex-direction: column; gap: 3px; }
        .gt { font-size: 20px; font-weight: bold; background: linear-gradient(90deg, #ff9944, #ffcc00); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .ht { font-size: 12px; color: rgba(255,255,255,0.55); }
        .hud-r { text-align: right; }
        .sl { font-size: 11px; color: rgba(255,255,255,0.45); }
        .sv { font-size: 28px; font-weight: bold; color: #ff9944; line-height: 1; text-shadow: 0 0 12px rgba(255,153,68,0.5); }
        .mv { font-size: 14px; color: #ffcc00; margin-top: 2px; }
        canvas { width: 100%; height: 600px; background: radial-gradient(ellipse at bottom, #2a1e14 0%, #1a1410 100%); border-radius: 14px; border: 2px solid rgba(255,153,68,0.25); touch-action: none; display: block; box-shadow: inset 0 0 80px rgba(0,0,0,0.6); }
        .br { display: flex; gap: 10px; }
        .gb { flex: 1; padding: 14px; border: none; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; color: #fff; transition: transform 0.1s; }
        .gb:active { transform: scale(0.94); }
        .gbs { background: linear-gradient(135deg, #ff7722 0%, #ff3300 100%); }
        .gbp { background: linear-gradient(135deg, #4488ff 0%, #2244aa 100%); }
        .gbh { background: linear-gradient(135deg, #ffcc44 0%, #ff8800 100%); }
        .ad { width: 100%; height: 55px; background: linear-gradient(135deg, #ff994444 0%, #ffcc0044 100%); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #fff; font-weight: bold; border: 1px solid rgba(255,255,255,0.15); }
        .ov { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
        .ov-in { background: linear-gradient(145deg, #3a2818, #2a1e14); padding: 28px 24px; border-radius: 20px; max-width: 400px; width: 100%; text-align: center; border: 1px solid rgba(255,153,68,0.3); }
        .ov-in h2 { font-size: 26px; margin-bottom: 14px; background: linear-gradient(90deg, #ff9944, #ffcc00); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .ov-in p { color: rgba(255,255,255,0.8); line-height: 1.8; margin-bottom: 10px; font-size: 14px; }
        .os { display: flex; justify-content: space-around; margin: 18px 0; padding: 15px; background: rgba(255,153,68,0.08); border-radius: 12px; }
        .osc { display: flex; flex-direction: column; gap: 4px; }
        .osn { font-size: 22px; font-weight: bold; color: #ffcc00; }
        .osl { font-size: 12px; color: rgba(255,255,255,0.5); }
        .ov-in button { margin-top: 10px; width: 100%; padding: 15px; font-size: 17px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; color: #fff; background: linear-gradient(135deg, #ff7722, #ff3300); }
        .hdn { display: none !important; }
        .nr { color: #ffcc00; font-size: 16px; font-weight: bold; animation: bl 0.8s infinite; margin: 8px 0; }
        @keyframes bl { 50% { opacity: 0.4; } }
        .md-row { display: flex; gap: 8px; margin: 14px 0; }
        .md-btn { flex: 1; padding: 10px; border: 2px solid rgba(255,255,255,0.2); border-radius: 10px; background: transparent; color: #fff; font-size: 13px; cursor: pointer; font-weight: bold; }
        .md-btn.active { background: linear-gradient(135deg, #ff7722, #ff3300); border-color: transparent; }
    /* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */
/* [BATCH-FIX:ad-components-css] */
.sponsor-btn{position:fixed;top:44px;right:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:3px 9px;border-radius:10px;font:11px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.sponsor-panel.show{display:flex}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.interstitial-ad.show{display:flex}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* [/BATCH-FIX:ad-components-css] */
</style>
</head>
<body>
    <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div id="wrap">
        <div class="hud">
            <div class="hud-l">
                <div class="gt">🥁 架子鼓模拟器</div>
                <div class="ht">最高分: <span id="hs">0</span></div>
            </div>
            <div class="hud-r">
                <div class="sl">演奏分</div>
                <div class="sv" id="sc">0</div>
                <div class="mv" id="mv">🎵 节奏模式</div>
            </div>
        </div>
        <canvas id="cv" width="540" height="760"></canvas>
        <div class="br">
            <button class="gb gbs" id="bst">▶ 演奏</button>
            <button class="gb gbp" id="bps">⏸ 暂停</button>
            <button class="gb gbh" id="bhp">❓ 指南</button>
        </div>
        <div class="ad">🥁 戴上耳机，成为摇滚鼓手</div>
    </div>

    <div class="ov hdn" id="guide">
        <div class="ov-in">
            <h2>🥁 架子鼓模拟器</h2>
            <p>🎵 音符从上方落入相应鼓/镲区域</p>
            <p>👆 到达判定线时点击对应鼓面</p>
            <p>⌨️ 键盘: <b>Q W E R A S D F</b></p>
            <div class="md-row">
                <button class="md-btn active" data-md="rhythm">节奏</button>
                <button class="md-btn" data-md="free">自由</button>
                <button class="md-btn" data-md="hard">困难</button>
            </div>
            <p id="md-dsc">节奏模式: 跟随乐谱精准演奏</p>
            <p>🔥 连续命中获得华丽连击加成</p>
            <button id="go">开始演奏</button>
        </div>
    </div>

    <div class="ov hdn" id="end">
        <div class="ov-in">
            <h2 id="et">演奏结束</h2>
            <div class="nr hdn" id="nr">🏆 新纪录！</div>
            <div class="os">
                <div class="osc"><div class="osn" id="es">0</div><div class="osl">演奏分</div></div>
                <div class="osc"><div class="osn" id="ec">0</div><div class="osl">最高连击</div></div>
                <div class="osc"><div class="osn" id="ea">0</div><div class="osl">准确率</div></div>
            </div>
            <p id="ed" style="margin-bottom:14px;"></p>
            <button id="reb">再次演奏</button>
        </div>
    </div>

    <div class="ov hdn" id="psov">
        <div class="ov-in">
            <h2>⏸ 暂停中</h2>
            <p>鼓手稍作休息，准备好了吗？</p>
            <button id="rsb">继续演奏</button>
        </div>
    </div>

    <script>
        if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
        if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
        if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
        if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
    </script>
    <script src="../game_core.js"></script>
    <script>
    (function() {
        const GN = '架子鼓模拟器';
        GameCore.init({ highScore: GN });
        const cv = document.getElementById('cv');
        const ctx = cv.getContext('2d');
        const W = cv.width, H = cv.height;
        const DRUM_Y = H - 260;
        const HIT_Y = DRUM_Y + 30;
        const PADS = [
            { id: 0, key: 'Q', name: '踩镲', x: 80, y: DRUM_Y + 60, r: 52, col: '#b0b0c0', glow: 'rgba(180,180,220,0.5)', isHiHat: true },
            { id: 1, key: 'W', name: '军鼓', x: 195, y: DRUM_Y + 120, r: 58, col: '#d4a054', glow: 'rgba(255,180,80,0.5)', isSnare: true },
            { id: 2, key: 'E', name: '嗵鼓1', x: 310, y: DRUM_Y + 60, r: 50, col: '#cc5533', glow: 'rgba(220,90,50,0.5)', isTom: true },
            { id: 3, key: 'R', name: '嗵鼓2', x: 425, y: DRUM_Y + 60, r: 50, col: '#3388cc', glow: 'rgba(60,140,220,0.5)', isTom: true },
            { id: 4, key: 'A', name: '叮叮镲', x: 475, y: DRUM_Y - 10, r: 54, col: '#c8c888', glow: 'rgba(220,220,120,0.5)', isCymbal: true },
            { id: 5, key: 'S', name: '强音镲', x: 65, y: DRUM_Y - 10, r: 54, col: '#a8a8a8', glow: 'rgba(200,200,200,0.5)', isCrash: true },
            { id: 6, key: 'D', name: '地嗵', x: 375, y: DRUM_Y + 180, r: 62, col: '#8844aa', glow: 'rgba(160,80,200,0.5)', isFloor: true },
            { id: 7, key: 'F', name: '底鼓', x: 270, y: DRUM_Y + 220, r: 72, col: '#552211', glow: 'rgba(120,40,20,0.5)', isKick: true },
        ];

        let state = STATE_MENU;
        let mode = 'rhythm';
        let notes = [];
        let score = 0, combo = 0, mCombo = 0;
        let totalN = 0, hitN = 0;
        let miss = 0;
        let st = 0, si = 45;
        let baseSpeed = 2.2;
        let raf = null;
        let fx = [];
        let pressAnim = [0, 0, 0, 0, 0, 0, 0, 0];
        let freeHits = [];

        const esc = document.getElementById('sc');
        const emv = document.getElementById('mv');
        const ehs = document.getElementById('hs');
        ehs.textContent = GameCore.highScore.get(GN);

        const MDS = {
            rhythm: '节奏模式: 跟随乐谱精准演奏，获取完美分数',
            free: '自由模式: 无限制自由打击，随心所欲演奏',
            hard: '困难模式: 高速密集音符，挑战极限反应'
        };

        function Note(padId) {
            this.pad = padId;
            this.y = -40;
            this.hit = false;
            this.missed = false;
            this.judge = '';
        }

        function spawn() {
            let n = 1;
            if (mode === 'hard') n = Math.random() < 0.4 ? 2 : 1;
            else if (mode === 'free') n = 1;
            else n = Math.random() < 0.2 ? 2 : 1;
            const used = [];
            for (let i = 0; i < n; i++) {
                let p;
                let tries = 0;
                do {
                    if (mode === 'hard') p = Math.floor(Math.random() * 8);
                    else if (mode === 'free') p = Math.floor(Math.random() * 8);
                    else {
                        const r = Math.random();
                        p = r < 0.18 ? 7 : r < 0.33 ? 1 : r < 0.45 ? 0 : r < 0.58 ? 5 : r < 0.7 ? 4 : r < 0.8 ? 2 : r < 0.9 ? 6 : 3;
                    }
                    tries++;
                } while (used.indexOf(p) >= 0 && tries < 8);
                if (used.indexOf(p) < 0) {
                    used.push(p);
                    notes.push(new Note(p));
                    totalN++;
                }
            }
        }

        function init() {
            notes = []; fx = []; freeHits = [];
            score = 0; combo = 0; mCombo = 0;
            totalN = 0; hitN = 0; miss = 0;
            st = 0; pressAnim = [0,0,0,0,0,0,0,0];
            if (mode === 'rhythm') { baseSpeed = 2.2; si = 48; }
            else if (mode === 'free') { baseSpeed = 2.0; si = 40; }
            else { baseSpeed = 3.2; si = 30; }
            h();
        }

        function h() {
            esc.textContent = score;
            if (mode === 'free') emv.textContent = '🎵 自由演奏';
            else if (mode === 'hard') emv.textContent = '⚡ 困难模式 x' + combo;
            else emv.textContent = '🎵 连击 x' + combo;
            const hs = GameCore.highScore.get(GN);
            if (score > hs) ehs.textContent = score;
        }

        function addFx(x, y, col, txt, big) {
            fx.push({ x: x, y: y, vy: -1.5, a: 1, c: col, t: txt, s: big ? 32 : 22, isT: true });
        }

        function addRing(x, y, col) {
            for (let k = 0; k < 14; k++) {
                const a = Math.random() * Math.PI * 2;
                const sp = 1 + Math.random() * 5;
                fx.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, a: 1, c: col, s: 2 + Math.random() * 4, isT: false });
            }
        }

        function hitPad(padId, fromNote) {
            const p = PADS[padId];
            pressAnim[padId] = 1;
            addRing(p.x, p.y, p.col);
            if (mode === 'free') {
                const pts = 10 + combo * 2;
                score += pts;
                combo++; mCombo = Math.max(mCombo, combo);
                freeHits.push({ id: Date.now() + Math.random(), pad: padId, t: 0 });
                addFx(p.x, p.y - 30, '#fff', '+' + pts, false);
                GameCore.highScore.set(GN, score);
                h();
                return;
            }
            if (!fromNote) {
                combo = 0; h();
                return;
            }
            let best = null, bd = 999, bi = -1;
            for (let i = 0; i < notes.length; i++) {
                const nt = notes[i];
                if (nt.pad !== padId || nt.hit || nt.missed) continue;
                const d = Math.abs(nt.y - HIT_Y);
                if (d < 80 && d < bd) { bd = d; best = nt; bi = i; }
            }
            if (best) {
                best.hit = true; hitN++;
                let pts = 0, txt = '', col = '#fff';
                if (bd < 15) { pts = 200; txt = 'PERFECT!'; col = '#ffff00'; }
                else if (bd < 35) { pts = 120; txt = 'GREAT!'; col = '#00ff88'; }
                else { pts = 60; txt = 'GOOD'; col = '#ffffff'; }
                pts = Math.floor(pts * (1 + combo * 0.03));
                if (mode === 'hard') pts = Math.floor(pts * 1.5);
                score += pts; combo++; mCombo = Math.max(mCombo, combo);
                baseSpeed += 0.006;
                si = Math.max(mode === 'hard' ? 20 : 28, si - 0.3);
                addFx(p.x, p.y - 40, col, txt, true);
                addFx(p.x, p.y - 15, p.col, '+' + pts, false);
                GameCore.highScore.set(GN, score);
                h();
            } else {
                combo = 0; h();
            }
        }

        function freeHit(padId) { hitPad(padId, false); }

        function tapAt(x, y) {
            if (state !== STATE_PLAYING) return;
            let best = -1, bd = 999;
            for (let i = 0; i < PADS.length; i++) {
                const p = PADS[i];
                const d = Math.hypot(x - p.x, y - p.y);
                if (d < p.r + 10 && d < bd) { bd = d; best = i; }
            }
            if (best >= 0) {
                if (mode === 'free') freeHit(best);
                else hitPad(best, true);
            }
        }

        function gO() {
            state = STATE_OVER;
            if (raf) cancelAnimationFrame(raf);
            raf = null;
            const isNew = GameCore.highScore.set(GN, score);
            document.getElementById('es').textContent = score;
            document.getElementById('ec').textContent = mCombo;
            const acc = totalN > 0 ? Math.floor((hitN / totalN) * 100) : 0;
            document.getElementById('ea').textContent = acc + '%';
            document.getElementById('nr').classList.toggle('hdn', !isNew);
            let rank, ttl;
            if (mode === 'free') { rank = score >= 5000 ? '🥁 传奇鼓手' : score >= 2500 ? '⭐ 明星鼓手' : '🎵 节奏鼓手'; ttl = '自由演奏结束'; }
            else if (acc >= 95) { rank = '🏆 SSS级 完美鼓手'; ttl = '🎉 完美演奏！'; }
            else if (acc >= 85) { rank = '⭐ S级 优秀鼓手'; ttl = '👏 精彩演奏！'; }
            else if (acc >= 70) { rank = '🎵 A级 合格鼓手'; ttl = '演奏结束'; }
            else { rank = '🥁 B级 继续加油'; ttl = '演奏结束'; }
            document.getElementById('et').textContent = ttl;
            document.getElementById('ed').textContent = rank;
            document.getElementById('end').classList.remove('hdn');
        }

        function upd() {
            if (state !== STATE_PLAYING) return;
            for (let i = 0; i < 8; i++) if (pressAnim[i] > 0) pressAnim[i] -= 0.08;
            for (let i = notes.length - 1; i >= 0; i--) {
                const n = notes[i];
                n.y += baseSpeed;
                if (n.hit) { if (n.y > HIT_Y + 60) notes.splice(i, 1); continue; }
                if (n.y > HIT_Y + 60 && !n.missed) {
                    n.missed = true; miss++; combo = 0; h();
                    if (mode !== 'free' && miss >= 8) { notes.splice(i, 1); gO(); return; }
                }
                if (n.y > H + 60) notes.splice(i, 1);
            }
            st++;
            if (st >= Math.floor(si)) { st = 0; if (notes.length < (mode === 'hard' ? 12 : 9)) spawn(); }
            for (let i = freeHits.length - 1; i >= 0; i--) {
                freeHits[i].t++;
                if (freeHits[i].t > 30) freeHits.splice(i, 1);
            }
            for (let i = fx.length - 1; i >= 0; i--) {
                const p = fx[i];
                if (p.isT) { p.y += p.vy; p.a -= 0.025; }
                else { p.x += p.vx || 0; p.y += p.vy || 0; p.vy = (p.vy || 0) + 0.08; p.a -= 0.04; }
                if (p.a <= 0) fx.splice(i, 1);
            }
            if (mode === 'free') {
                if (!window._ft) window._ft = performance.now();
                if ((performance.now() - window._ft) / 1000 >= 90) { gO(); return; }
            }
        }

        function drPad(p, ai) {
            const pr = pressAnim[ai];
            const scale = 1 + pr * 0.15;
            const sz = p.r * scale;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.shadowColor = p.glow;
            ctx.shadowBlur = pr > 0 ? 35 : 18;
            if (p.isKick) {
                const g = ctx.createRadialGradient(0, 0, 10, 0, 0, sz);
                g.addColorStop(0, '#3a1508'); g.addColorStop(0.6, p.col); g.addColorStop(1, '#2a0f05');
                ctx.fillStyle = g;
                ctx.beginPath(); ctx.arc(0, 0, sz, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#ffcc66'; ctx.lineWidth = 3;
                ctx.stroke();
                ctx.fillStyle = '#e0c080';
                ctx.beginPath(); ctx.arc(0, 0, sz * 0.5, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#888'; ctx.lineWidth = 1;
                for (let l = 0; l < 8; l++) {
                    const a = (l / 8) * Math.PI * 2;
                    ctx.beginPath(); ctx.moveTo(Math.cos(a) * sz * 0.2, Math.sin(a) * sz * 0.2);
                    ctx.lineTo(Math.cos(a) * sz * 0.48, Math.sin(a) * sz * 0.48); ctx.stroke();
                }
            } else if (p.isCymbal || p.isCrash || p.isHiHat) {
                const g = ctx.createRadialGradient(0, -4, 4, 0, 0, sz);
                g.addColorStop(0, pr > 0 ? '#ffffff' : '#f0f0e0');
                g.addColorStop(0.7, p.col);
                g.addColorStop(1, '#555540');
                ctx.fillStyle = g;
                ctx.beginPath(); ctx.ellipse(0, 0, sz, sz * 0.38, 0, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = p.isCrash ? '#777' : '#999'; ctx.lineWidth = 1.5;
                for (let r = 2; r <= 5; r++) {
                    ctx.beginPath(); ctx.ellipse(0, 0, sz * (r / 6), sz * 0.38 * (r / 6), 0, 0, Math.PI * 2); ctx.stroke();
                }
                ctx.fillStyle = '#222';
                ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill();
            } else {
                const g = ctx.createRadialGradient(0, -sz * 0.2, 5, 0, 0, sz);
                g.addColorStop(0, pr > 0 ? '#ffffff' : '#f5e8c8');
                g.addColorStop(0.65, '#e8d090');
                g.addColorStop(1, p.col);
                ctx.fillStyle = g;
                ctx.beginPath(); ctx.arc(0, 0, sz, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#8b6914'; ctx.lineWidth = 3; ctx.stroke();
                ctx.fillStyle = p.col;
                ctx.beginPath(); ctx.arc(0, 0, sz * 0.72, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#553311'; ctx.lineWidth = 2;
                for (let t = 0; t < 6; t++) {
                    const a = (t / 6) * Math.PI * 2 + 0.3;
                    ctx.beginPath();
                    ctx.moveTo(Math.cos(a) * sz * 0.3, Math.sin(a) * sz * 0.3);
                    ctx.lineTo(Math.cos(a) * sz * 0.68, Math.sin(a) * sz * 0.68);
                    ctx.stroke();
                }
            }
            ctx.restore();
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 13px Microsoft YaHei';
            ctx.textAlign = 'center';
            ctx.fillText(p.name, p.x, p.y + p.r + 20);
            ctx.fillStyle = pr > 0 ? '#ffff00' : '#000';
            ctx.font = 'bold 16px Arial';
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
            ctx.strokeText(p.key, p.x, p.y + 5);
            ctx.fillText(p.key, p.x, p.y + 5);
        }

        function dr() {
            ctx.fillStyle = '#1a1410';
            ctx.fillRect(0, 0, W, H);
            ctx.globalAlpha = 0.06;
            for (let k = 0; k < 40; k++) {
                const yk = (k * 37 + (performance.now() * 0.015) % 40) % H;
                ctx.fillStyle = (k % 2) ? '#ffaa44' : '#ffffff';
                ctx.fillRect(0, yk, W, 1);
            }
            ctx.globalAlpha = 1;
            for (let r = 0; r < 8; r++) {
                const y1 = DRUM_Y - 100 + r * 45;
                ctx.fillStyle = r % 2 ? 'rgba(255,255,255,0.02)' : 'rgba(255,170,68,0.03)';
                ctx.fillRect(0, y1, W, 45);
            }
            ctx.fillStyle = 'rgba(255,204,0,0.12)';
            ctx.fillRect(0, HIT_Y - 30, W, 60);
            ctx.strokeStyle = 'rgba(255,204,0,0.7)';
            ctx.lineWidth = 2; ctx.setLineDash([10, 8]);
            ctx.beginPath(); ctx.moveTo(0, HIT_Y); ctx.lineTo(W, HIT_Y); ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = 'rgba(255,204,0,0.8)';
            ctx.font = 'bold 14px Microsoft YaHei';
            ctx.textAlign = 'left';
            ctx.fillText('判定线', 10, HIT_Y - 36);
            for (let i = 0; i < notes.length; i++) {
                const n = notes[i];
                if (n.missed) continue;
                const p = PADS[n.pad];
                const y = n.y;
                const sz = p.r * 0.85;
                ctx.save();
                ctx.globalAlpha = n.hit ? 0.4 : 1;
                ctx.shadowColor = p.glow; ctx.shadowBlur = 25;
                const gg = ctx.createRadialGradient(p.x, y, 2, p.x, y, sz);
                gg.addColorStop(0, '#ffffff');
                gg.addColorStop(0.4, p.col);
                gg.addColorStop(1, p.col);
                ctx.fillStyle = gg;
                ctx.beginPath(); ctx.arc(p.x, y, sz, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
                ctx.fillStyle = '#000';
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(p.key, p.x, y + 5);
                ctx.restore();
            }
            for (let i = 0; i < PADS.length; i++) drPad(PADS[i], i);
            for (let i = 0; i < fx.length; i++) {
                const p = fx[i];
                ctx.globalAlpha = Math.max(0, p.a);
                if (p.isT && p.t) {
                    ctx.font = 'bold ' + p.s + 'px Microsoft YaHei';
                    ctx.textAlign = 'center';
                    ctx.fillStyle = p.c;
                    ctx.shadowColor = p.c; ctx.shadowBlur = 10;
                    ctx.fillText(p.t, p.x, p.y);
                    ctx.shadowBlur = 0;
                } else {
                    ctx.fillStyle = p.c;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, Math.PI * 2); ctx.fill();
                }
            }
            ctx.globalAlpha = 1;
            if (combo >= 15) {
                ctx.save();
                ctx.shadowColor = '#ffcc00'; ctx.shadowBlur = 25;
                ctx.fillStyle = '#ffcc00';
                ctx.font = 'bold 52px Microsoft YaHei';
                ctx.textAlign = 'center';
                ctx.fillText(combo + ' COMBO', W / 2, 90);
                ctx.restore();
            }
            if (mode !== 'free') {
                ctx.font = '14px Microsoft YaHei';
                ctx.fillStyle = '#ff9944';
                ctx.textAlign = 'right';
                ctx.fillText('失误: ' + miss + '/8', W - 14, 30);
                const acc = totalN > 0 ? Math.floor((hitN / totalN) * 100) : 100;
                ctx.fillText('准确率: ' + acc + '%', W - 14, 52);
            }
            if (state === STATE_MENU) {
                ctx.fillStyle = 'rgba(0,0,0,0.65)';
                ctx.fillRect(0, 0, W, H);
                ctx.save();
                ctx.shadowColor = '#ff9944'; ctx.shadowBlur = 30;
                ctx.fillStyle = '#ff9944';
                ctx.font = 'bold 46px Microsoft YaHei';
                ctx.textAlign = 'center';
                ctx.fillText('架子鼓大师', W / 2, H / 2 - 30);
                ctx.restore();
                ctx.fillStyle = '#fff';
                ctx.font = '18px Microsoft YaHei';
                ctx.fillText('点击"演奏"开启你的舞台', W / 2, H / 2 + 20);
            }
        }

        function lp() { upd(); dr(); raf = requestAnimationFrame(lp); }

        cv.addEventListener('mousedown', function(e) {
            const r = cv.getBoundingClientRect();
            const sx = W / r.width, sy = H / r.height;
            tapAt((e.clientX - r.left) * sx, (e.clientY - r.top) * sy);
        });
        cv.addEventListener('touchstart', function(e) {
            const r = cv.getBoundingClientRect();
            const sx = W / r.width, sy = H / r.height;
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                tapAt((t.clientX - r.left) * sx, (t.clientY - r.top) * sy);
            }
        }, { passive: true });

        const keyMap = { 'Q':0,'q':0,'W':1,'w':1,'E':2,'e':2,'R':3,'r':3,'A':4,'a':4,'S':5,'s':5,'D':6,'d':6,'F':7,'f':7 };
        document.addEventListener('keydown', function(e) {
            if (keyMap[e.key] !== undefined) {
                e.preventDefault();
                const p = keyMap[e.key];
                if (state !== STATE_PLAYING) return;
                if (mode === 'free') freeHit(p);
                else hitPad(p, true);
            }
        });

        function sg() {
            init(); state = STATE_PLAYING; window._ft = null;
            document.getElementById('guide').classList.add('hdn');
            document.getElementById('end').classList.add('hdn');
            document.getElementById('psov').classList.add('hdn');
            if (!raf) lp();
        }
        function pg() { if (state !== STATE_PLAYING) return; state = STATE_PAUSE; document.getElementById('psov').classList.remove('hdn'); }
        function rg() { if (state !== STATE_PAUSE) return; state = STATE_PLAYING; document.getElementById('psov').classList.add('hdn'); }

        document.getElementById('bst').addEventListener('click', function() { document.getElementById('guide').classList.remove('hdn'); });
        document.getElementById('bps').addEventListener('click', function() { if (state === STATE_PLAYING) pg(); else if (state === STATE_PAUSE) rg(); });
        document.getElementById('bhp').addEventListener('click', function() { document.getElementById('guide').classList.remove('hdn'); });
        document.getElementById('go').addEventListener('click', sg);
        document.getElementById('reb').addEventListener('click', sg);
        document.getElementById('rsb').addEventListener('click', rg);
        document.getElementById('start-game-btn').addEventListener('click', function() { document.getElementById('guide').classList.remove('hdn'); });

        document.querySelectorAll('.md-btn').forEach(function(b) {
            b.addEventListener('click', function() {
                document.querySelectorAll('.md-btn').forEach(function(x) { x.classList.remove('active'); });
                b.classList.add('active');
                mode = b.dataset.md;
                document.getElementById('md-dsc').textContent = MDS[mode];
            });
        });

        GameCore.hints.showStartGuide(
            '🥁 <b>架子鼓模拟器</b><br><br>🎵 音符落入对应鼓区<br>👆 到达判定线时点击鼓面<br>⌨️ Q W E R A S D F 八键<br>🔥 连击倍率获得高分<br>🏆 三种模式等你挑战！'
        );
        setTimeout(function() { document.getElementById('guide').classList.remove('hdn'); }, 100);
    })();
    </script>

<script>

  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();

<script>

  if (window.__batchFixTimers) return;

  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };

})();
