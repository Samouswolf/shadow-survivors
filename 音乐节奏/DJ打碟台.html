<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DJ打碟台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #2a0a3e 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 10px; color: #fff; overflow-x: hidden; }
        #wrap { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 10px; }
        .hud { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; background: rgba(255,0,128,0.08); border-radius: 14px; border: 1px solid rgba(255,0,128,0.25); backdrop-filter: blur(8px); }
        .hud-l { display: flex; flex-direction: column; gap: 3px; }
        .gt { font-size: 20px; font-weight: bold; background: linear-gradient(90deg, #ff00ff, #00ffff, #ffff00); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .ht { font-size: 12px; color: rgba(255,255,255,0.55); }
        .hud-r { text-align: right; }
        .sl { font-size: 11px; color: rgba(255,255,255,0.45); }
        .sv { font-size: 28px; font-weight: bold; color: #ff00aa; line-height: 1; text-shadow: 0 0 12px rgba(255,0,170,0.6); }
        .mv { font-size: 14px; color: #00ffff; margin-top: 2px; text-shadow: 0 0 8px rgba(0,255,255,0.5); }
        canvas { width: 100%; height: 580px; background: radial-gradient(ellipse at center, #1a0a2e 0%, #0a0a1a 100%); border-radius: 14px; border: 2px solid rgba(255,0,255,0.3); touch-action: none; display: block; box-shadow: 0 0 40px rgba(255,0,170,0.2), inset 0 0 60px rgba(0,0,0,0.5); }
        .br { display: flex; gap: 10px; }
        .gb { flex: 1; padding: 14px; border: none; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; color: #fff; transition: transform 0.1s, box-shadow 0.1s; }
        .gb:active { transform: scale(0.94); }
        .gbs { background: linear-gradient(135deg, #ff00aa 0%, #aa00ff 100%); box-shadow: 0 0 20px rgba(255,0,170,0.4); }
        .gbp { background: linear-gradient(135deg, #00aaff 0%, #0066ff 100%); box-shadow: 0 0 20px rgba(0,170,255,0.4); }
        .gbh { background: linear-gradient(135deg, #ffaa00 0%, #ff6600 100%); box-shadow: 0 0 20px rgba(255,170,0,0.4); }
        .ad { width: 100%; height: 55px; background: linear-gradient(135deg, #ff00ff33 0%, #00ffff33 100%); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #fff; font-weight: bold; border: 1px solid rgba(255,255,255,0.15); }
        .ov { position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
        .ov-in { background: linear-gradient(145deg, #2a0a3e, #1a0a2e); padding: 28px 24px; border-radius: 20px; max-width: 400px; width: 100%; text-align: center; border: 1px solid rgba(255,0,255,0.3); box-shadow: 0 0 50px rgba(255,0,170,0.3); }
        .ov-in h2 { font-size: 26px; margin-bottom: 14px; background: linear-gradient(90deg, #ff00ff, #00ffff, #ffff00); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .ov-in p { color: rgba(255,255,255,0.8); line-height: 1.8; margin-bottom: 10px; font-size: 14px; }
        .os { display: flex; justify-content: space-around; margin: 18px 0; padding: 15px; background: rgba(255,0,255,0.08); border-radius: 12px; border: 1px solid rgba(255,0,255,0.2); }
        .osc { display: flex; flex-direction: column; gap: 4px; }
        .osn { font-size: 22px; font-weight: bold; color: #00ffff; text-shadow: 0 0 10px rgba(0,255,255,0.6); }
        .osl { font-size: 12px; color: rgba(255,255,255,0.5); }
        .ov-in button { margin-top: 10px; width: 100%; padding: 15px; font-size: 17px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; color: #fff; background: linear-gradient(135deg, #ff00aa, #aa00ff); box-shadow: 0 0 20px rgba(255,0,170,0.5); }
        .hdn { display: none !important; }
        .nr { color: #ffff00; font-size: 16px; font-weight: bold; animation: bl 0.8s infinite; margin: 8px 0; text-shadow: 0 0 12px rgba(255,255,0,0.7); }
        @keyframes bl { 50% { opacity: 0.4; } }
    /* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */
/* [BATCH-FIX:ad-components-css] */
.sponsor-btn{position:fixed;bottom:8px;left:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:2px 6px;border-radius:10px;font:10px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.sponsor-panel.show{display:flex}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.interstitial-ad.show{display:flex}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* [/BATCH-FIX:ad-components-css] */

/* [AD-FIX:responsive] */
@media (max-width:768px){.ad-banner-container{display:none!important}.sponsor-btn{transform:scale(.8);opacity:.6}}
/* [/AD-FIX:responsive] */
</style>
</head>
<body>
    <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div id="wrap">
        <div class="hud">
            <div class="hud-l">
                <div class="gt">🎧 DJ打碟台</div>
                <div class="ht">最高分: <span id="hs">0</span></div>
            </div>
            <div class="hud-r">
                <div class="sl">狂热值</div>
                <div class="sv" id="sc">0</div>
                <div class="mv" id="mv">🔥 FEVER x0</div>
            </div>
        </div>
        <canvas id="cv" width="520" height="720"></canvas>
        <div class="br">
            <button class="gb gbs" id="bst">▶ 打碟</button>
            <button class="gb gbp" id="bps">⏸ 暂停</button>
            <button class="gb gbh" id="bhp">❓ 指南</button>
        </div>
        <div class="ad">🎧 戴上耳机，沉浸电音世界</div>
    </div>

    <div class="ov hdn" id="guide">
        <div class="ov-in">
            <h2>🎧 DJ打碟台</h2>
            <p>🎵 彩色节拍圆环从中心向外扩散</p>
            <p>👆 当圆环到达<b>判定圈</b>时点击对应区域</p>
            <p>⌨️ 键盘: <b>A S D F</b> (上右下左)</p>
            <p>🔥 连续命中积累FEVER，双倍得分！</p>
            <p>💔 错过3次节拍，演出结束</p>
            <button id="go">开始打碟</button>
        </div>
    </div>

    <div class="ov hdn" id="end">
        <div class="ov-in">
            <h2 id="et">演出结束</h2>
            <div class="nr hdn" id="nr">🏆 打破纪录！</div>
            <div class="os">
                <div class="osc"><div class="osn" id="es">0</div><div class="osl">狂热值</div></div>
                <div class="osc"><div class="osn" id="ec">0</div><div class="osl">最高连击</div></div>
                <div class="osc"><div class="osn" id="eh">0</div><div class="osl">历史最强</div></div>
            </div>
            <p id="ed" style="margin-bottom:14px;"></p>
            <button id="reb">再次演出</button>
        </div>
    </div>

    <div class="ov hdn" id="psov">
        <div class="ov-in">
            <h2>⏸ 暂停中</h2>
            <p>派对暂时休息，准备好了吗？</p>
            <button id="rsb">继续打碟</button>
        </div>
    </div>

    <script>
        if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
        if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
        if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
        if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
    </script>
    <script src="../game_core.js"></script>
    <script>
    (function() {
        const GN = 'DJ打碟台';
        GameCore.init({ highScore: GN });
        const cv = document.getElementById('cv');
        const ctx = cv.getContext('2d');
        const W = cv.width, H = cv.height;
        const CX = W / 2, CY = H / 2 + 40;
        const ZONE_R = 160;
        const DIRS = 4;
        const DIR_NAMES = ['上', '右', '下', '左'];
        const DIR_ANGLES = [-Math.PI / 2, 0, Math.PI / 2, Math.PI];
        const COLORS = ['#ff0066', '#00ffaa', '#ffaa00', '#00aaff'];
        const GLOW = ['rgba(255,0,102,0.5)', 'rgba(0,255,170,0.5)', 'rgba(255,170,0,0.5)', 'rgba(0,170,255,0.5)'];

        let state = STATE_MENU;
        let beats = [];
        let score = 0, combo = 0, mCombo = 0;
        let miss = 0;
        let fever = 0, feverOn = false;
        let st = 0, si = 55;
        let baseSpeed = 1.6;
        let raf = null;
        let fx = [];
        let bgPulse = 0;
        let djAngle = 0;

        const esc = document.getElementById('sc');
        const emv = document.getElementById('mv');
        const ehs = document.getElementById('hs');
        ehs.textContent = GameCore.highScore.get(GN);

        function Beat(dir) {
            this.dir = dir;
            this.r = 40;
            this.hit = false;
            this.missed = false;
            this.judge = '';
            this.score = 0;
        }

        function spawn() {
            const n = Math.random() < 0.3 + Math.min(0.4, score / 800) ? 2 : 1;
            const used = [];
            for (let i = 0; i < n; i++) {
                let d;
                do { d = Math.floor(Math.random() * DIRS); } while (used.indexOf(d) >= 0);
                used.push(d);
                beats.push(new Beat(d));
            }
        }

        function init() {
            beats = []; fx = [];
            score = 0; combo = 0; mCombo = 0; miss = 0;
            fever = 0; feverOn = false;
            st = 0; si = 55; baseSpeed = 1.6; bgPulse = 0; djAngle = 0;
            h();
        }

        function h() {
            esc.textContent = score;
            const mult = feverOn ? 2 : 1;
            emv.textContent = (feverOn ? '🔥 FEVER x2 ' : '🔥 FEVER x') + Math.floor(fever / 10);
            const hs = GameCore.highScore.get(GN);
            if (score > hs) ehs.textContent = score;
        }

        function addFx(x, y, col, txt) {
            fx.push({ x: x, y: y, vy: -1.5, a: 1, c: col, t: txt, s: 24 });
        }

        function judge(dir) {
            if (state !== STATE_PLAYING) return;
            let best = null, bestDist = 999, bestIdx = -1;
            for (let i = 0; i < beats.length; i++) {
                const b = beats[i];
                if (b.dir !== dir || b.hit || b.missed) continue;
                const d = Math.abs(b.r - ZONE_R);
                if (d < bestDist && d < 70) { bestDist = d; best = b; bestIdx = i; }
            }
            const dx = CX + Math.cos(DIR_ANGLES[dir]) * ZONE_R;
            const dy = CY + Math.sin(DIR_ANGLES[dir]) * ZONE_R;
            if (best) {
                best.hit = true;
                let pts = 0, txt = '', col = '#ffffff';
                if (bestDist < 14) { pts = 300; txt = 'PERFECT!'; col = '#ffff00'; }
                else if (bestDist < 32) { pts = 180; txt = 'GREAT!'; col = '#00ff88'; }
                else { pts = 80; txt = 'GOOD'; col = '#ffffff'; }
                if (feverOn) pts *= 2;
                pts = Math.floor(pts * (1 + combo * 0.02));
                score += pts; combo++; mCombo = Math.max(mCombo, combo);
                fever = Math.min(100, fever + (bestDist < 14 ? 12 : bestDist < 32 ? 7 : 3));
                if (fever >= 100 && !feverOn) { feverOn = true; fever = 100; }
                baseSpeed += 0.008;
                si = Math.max(32, 55 - Math.floor(score / 120));
                addFx(dx, dy - 30, col, txt);
                addFx(dx, dy, COLORS[dir], '+' + pts);
                for (let k = 0; k < 12; k++) {
                    const ang = DIR_ANGLES[dir] + (Math.random() - 0.5) * 1.2;
                    const sp = 2 + Math.random() * 5;
                    fx.push({ x: dx, y: dy, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, a: 1, c: COLORS[dir], t: '', s: 3 + Math.random() * 4, isP: true });
                }
                GameCore.highScore.set(GN, score);
                h();
            } else {
                miss++; combo = 0; fever = Math.max(0, fever - 15); feverOn = false;
                addFx(dx, dy - 30, '#ff4444', 'MISS');
                h();
                if (miss >= 3) gO(false);
            }
        }

        function gO(win) {
            state = STATE_OVER;
            if (raf) cancelAnimationFrame(raf);
            raf = null;
            const isNew = GameCore.highScore.set(GN, score);
            document.getElementById('et').textContent = win ? '🎉 完美压轴！' : (score >= 3000 ? '👏 精彩演出！' : '🎵 演出结束');
            document.getElementById('es').textContent = score;
            document.getElementById('ec').textContent = mCombo;
            document.getElementById('eh').textContent = GameCore.highScore.get(GN);
            document.getElementById('nr').classList.toggle('hdn', !isNew);
            const rank = score >= 8000 ? '🏆 DJ大神 SSS级' : score >= 5000 ? '⭐ 明星DJ S级' : score >= 2500 ? '🎵 专业DJ A级' : '🎧 新秀DJ B级';
            document.getElementById('ed').textContent = rank;
            document.getElementById('end').classList.remove('hdn');
        }

        function upd() {
            if (state !== STATE_PLAYING) return;
            djAngle += 0.04;
            bgPulse += 0.05;
            for (let i = beats.length - 1; i >= 0; i--) {
                const b = beats[i];
                b.r += baseSpeed;
                if (b.hit) {
                    if (b.r > ZONE_R + 80) beats.splice(i, 1);
                    continue;
                }
                if (b.r > ZONE_R + 55 && !b.missed) {
                    b.missed = true; miss++; combo = 0;
                    fever = Math.max(0, fever - 12); feverOn = false;
                    const dx = CX + Math.cos(DIR_ANGLES[b.dir]) * ZONE_R;
                    const dy = CY + Math.sin(DIR_ANGLES[b.dir]) * ZONE_R;
                    addFx(dx, dy - 20, '#ff4444', 'MISS');
                    h();
                    if (miss >= 3) { beats.splice(i, 1); gO(false); return; }
                }
                if (b.r > 280) beats.splice(i, 1);
            }
            st++;
            if (st >= si) { st = 0; if (beats.length < 8) spawn(); }
            if (feverOn) { fever -= 0.12; if (fever <= 0) { fever = 0; feverOn = false; } h(); }
            for (let i = fx.length - 1; i >= 0; i--) {
                const p = fx[i];
                if (p.isP) {
                    p.x += p.vx || 0; p.y += p.vy || 0;
                    p.vy = (p.vy || 0) + 0.1;
                } else {
                    p.y += p.vy || 0;
                }
                p.a -= p.isP ? 0.035 : 0.022;
                if (p.a <= 0) fx.splice(i, 1);
            }
        }

        function dr() {
            const pulseW = feverOn ? Math.sin(bgPulse) * 8 : 0;
            const g = ctx.createRadialGradient(CX, CY, 20, CX, CY, 320 + pulseW);
            g.addColorStop(0, feverOn ? '#3a0a4a' : '#1a0a2e');
            g.addColorStop(1, '#0a0a1a');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, W, H);
            for (let i = 0; i < 40; i++) {
                const a = (i / 40) * Math.PI * 2 + djAngle * 0.3;
                const r = 40 + (feverOn ? 30 : 15) + Math.sin(djAngle * 2 + i) * 10;
                const x = CX + Math.cos(a) * r;
                const y = CY + Math.sin(a) * r;
                ctx.globalAlpha = 0.5;
                ctx.fillStyle = feverOn ? COLORS[i % 4] : '#ffffff22';
                ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI * 2); ctx.fill();
            }
            ctx.globalAlpha = 1;
            for (let ring = 0; ring < 3; ring++) {
                ctx.strokeStyle = 'rgba(255,255,255,0.05)';
                ctx.lineWidth = 1;
                ctx.beginPath(); ctx.arc(CX, CY, 80 + ring * 40, 0, Math.PI * 2); ctx.stroke();
            }
            for (let d = 0; d < DIRS; d++) {
                const ang = DIR_ANGLES[d];
                const x = CX + Math.cos(ang) * ZONE_R;
                const y = CY + Math.sin(ang) * ZONE_R;
                ctx.save();
                ctx.shadowColor = GLOW[d];
                ctx.shadowBlur = feverOn ? 30 : 15;
                ctx.strokeStyle = COLORS[d];
                ctx.lineWidth = 4;
                ctx.globalAlpha = 0.35 + Math.sin(bgPulse * 2 + d) * 0.1;
                ctx.beginPath(); ctx.arc(x, y, 46, 0, Math.PI * 2); ctx.stroke();
                ctx.globalAlpha = 0.15;
                ctx.fillStyle = COLORS[d];
                ctx.beginPath(); ctx.arc(x, y, 44, 0, Math.PI * 2); ctx.fill();
                ctx.globalAlpha = 1;
                ctx.fillStyle = COLORS[d];
                ctx.font = 'bold 22px Microsoft YaHei';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                const keys = ['A', 'S', 'D', 'F'];
                ctx.fillText(keys[d], x, y);
                ctx.font = '11px Microsoft YaHei';
                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.fillText(DIR_NAMES[d], x, y + 28);
                ctx.restore();
            }
            ctx.save();
            ctx.shadowColor = feverOn ? '#ffff00' : '#ff00aa';
            ctx.shadowBlur = 40 + Math.sin(bgPulse * 3) * 15;
            const djGrad = ctx.createRadialGradient(CX, CY, 10, CX, CY, 55);
            djGrad.addColorStop(0, feverOn ? '#ffff00' : '#ff00aa');
            djGrad.addColorStop(1, feverOn ? '#ff8800' : '#8800ff');
            ctx.fillStyle = djGrad;
            ctx.beginPath(); ctx.arc(CX, CY, 48, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
            ctx.strokeStyle = 'rgba(255,255,255,0.85)';
            ctx.lineWidth = 3;
            for (let l = 0; l < 4; l++) {
                const a = djAngle + (l / 4) * Math.PI * 2;
                ctx.beginPath();
                ctx.moveTo(CX, CY);
                ctx.lineTo(CX + Math.cos(a) * 40, CY + Math.sin(a) * 40);
                ctx.stroke();
            }
            for (let i = 0; i < beats.length; i++) {
                const b = beats[i];
                if (b.hit || b.missed) continue;
                const ang = DIR_ANGLES[b.dir];
                const x = CX + Math.cos(ang) * b.r;
                const y = CY + Math.sin(ang) * b.r;
                const sz = 20 + Math.sin(b.r * 0.08) * 2;
                ctx.save();
                ctx.shadowColor = GLOW[b.dir];
                ctx.shadowBlur = 25;
                ctx.fillStyle = COLORS[b.dir];
                ctx.globalAlpha = 0.95;
                ctx.beginPath(); ctx.arc(x, y, sz, 0, Math.PI * 2); ctx.fill();
                ctx.globalAlpha = 1;
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(x, y, sz * 0.45, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            }
            const fbW = feverOn ? W : (fever / 100) * W;
            const fbH = 8;
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.fillRect(0, H - fbH - 4, W, fbH);
            const fg = ctx.createLinearGradient(0, 0, W, 0);
            fg.addColorStop(0, '#ff0066'); fg.addColorStop(0.5, '#ffff00'); fg.addColorStop(1, '#00ffff');
            ctx.fillStyle = fg;
            ctx.fillRect(0, H - fbH - 4, fbW, fbH);
            if (feverOn) {
                ctx.globalAlpha = 0.3 + Math.sin(bgPulse * 5) * 0.2;
                ctx.fillStyle = '#ffff00';
                ctx.fillRect(0, 0, W, 6);
                ctx.fillRect(0, H - 10, W, 6);
                ctx.globalAlpha = 1;
            }
            for (let i = 0; i < fx.length; i++) {
                const p = fx[i];
                ctx.globalAlpha = p.a;
                if (p.t) {
                    ctx.font = 'bold ' + (p.s || 24) + 'px Microsoft YaHei';
                    ctx.textAlign = 'center';
                    ctx.fillStyle = p.c;
                    ctx.shadowColor = p.c; ctx.shadowBlur = 10;
                    ctx.fillText(p.t, p.x, p.y);
                    ctx.shadowBlur = 0;
                } else {
                    ctx.fillStyle = p.c;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, Math.PI * 2); ctx.fill();
                }
            }
            ctx.globalAlpha = 1;
            if (combo >= 10) {
                ctx.save();
                ctx.shadowColor = '#ffff00'; ctx.shadowBlur = 20;
                ctx.fillStyle = '#ffff00';
                ctx.font = 'bold 48px Microsoft YaHei';
                ctx.textAlign = 'center';
                ctx.fillText(combo + ' COMBO', CX, 80);
                ctx.restore();
            }
            if (miss > 0) {
                ctx.font = '14px Microsoft YaHei';
                ctx.fillStyle = '#ff6666';
                ctx.textAlign = 'right';
                ctx.fillText('失误: ' + miss + '/3', W - 14, 30);
            }
            if (state === STATE_MENU) {
                ctx.fillStyle = 'rgba(0,0,0,0.65)';
                ctx.fillRect(0, 0, W, H);
                ctx.save();
                ctx.shadowColor = '#ff00aa'; ctx.shadowBlur = 30;
                ctx.fillStyle = '#ff00aa';
                ctx.font = 'bold 44px Microsoft YaHei';
                ctx.textAlign = 'center';
                ctx.fillText('DJ打碟台', CX, CY - 30);
                ctx.restore();
                ctx.fillStyle = '#fff';
                ctx.font = '16px Microsoft YaHei';
                ctx.fillText('点击"打碟"开始派对', CX, CY + 20);
            }
        }

        function lp() { upd(); dr(); raf = requestAnimationFrame(lp); }

        function hitDirAt(x, y) {
            let best = -1, bd = 999;
            for (let d = 0; d < DIRS; d++) {
                const ang = DIR_ANGLES[d];
                const tx = CX + Math.cos(ang) * ZONE_R;
                const ty = CY + Math.sin(ang) * ZONE_R;
                const dd = Math.hypot(x - tx, y - ty);
                if (dd < 60 && dd < bd) { bd = dd; best = d; }
            }
            return best;
        }

        cv.addEventListener('mousedown', function(e) {
            const r = cv.getBoundingClientRect();
            const sx = W / r.width, sy = H / r.height;
            const x = (e.clientX - r.left) * sx, y = (e.clientY - r.top) * sy;
            const d = hitDirAt(x, y);
            if (d >= 0) judge(d);
        });
        cv.addEventListener('touchstart', function(e) {
            const r = cv.getBoundingClientRect();
            const sx = W / r.width, sy = H / r.height;
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                const x = (t.clientX - r.left) * sx, y = (t.clientY - r.top) * sy;
                const d = hitDirAt(x, y);
                if (d >= 0) judge(d);
            }
        }, { passive: true });

        const km = { 'a': 0, 'A': 0, 's': 1, 'S': 1, 'd': 2, 'D': 2, 'f': 3, 'F': 3 };
        document.addEventListener('keydown', function(e) {
            if (km[e.key] !== undefined) { e.preventDefault(); judge(km[e.key]); }
        });

        function sg() {
            init(); state = STATE_PLAYING;
            document.getElementById('guide').classList.add('hdn');
            document.getElementById('end').classList.add('hdn');
            document.getElementById('psov').classList.add('hdn');
            if (!raf) lp();
        }
        function pg() { if (state !== STATE_PLAYING) return; state = STATE_PAUSE; document.getElementById('psov').classList.remove('hdn'); }
        function rg() { if (state !== STATE_PAUSE) return; state = STATE_PLAYING; document.getElementById('psov').classList.add('hdn'); }

        document.getElementById('bst').addEventListener('click', function() { document.getElementById('guide').classList.remove('hdn'); });
        document.getElementById('bps').addEventListener('click', function() { if (state === STATE_PLAYING) pg(); else if (state === STATE_PAUSE) rg(); });
        document.getElementById('bhp').addEventListener('click', function() { document.getElementById('guide').classList.remove('hdn'); });
        document.getElementById('go').addEventListener('click', sg);
        document.getElementById('reb').addEventListener('click', sg);
        document.getElementById('rsb').addEventListener('click', rg);
        document.getElementById('start-game-btn').addEventListener('click', function() { document.getElementById('guide').classList.remove('hdn'); });

        GameCore.hints.showStartGuide(
            '🎧 <b>DJ打碟台</b><br><br>🎵 彩色音符从中心扩散<br>👆 到达判定圈时点击对应按钮<br>⌨️ A S D F 对应上右下左<br>🔥 连击积累FEVER双倍得分<br>💔 失误3次派对结束！'
        );
        setTimeout(function() { document.getElementById('guide').classList.remove('hdn'); }, 100);
    })();
    </script>

<script>

  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>

<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
