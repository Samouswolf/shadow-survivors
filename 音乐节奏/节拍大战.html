<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>节拍大战</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #101218 0%, #1a1025 50%, #2a0a1a 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 10px; color: #fff; overflow-x: hidden; }
        #wrap { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 10px; }
        .hud { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; background: rgba(255,60,80,0.1); border-radius: 14px; border: 1px solid rgba(255,60,80,0.3); backdrop-filter: blur(8px); }
        .hud-l { display: flex; flex-direction: column; gap: 3px; }
        .gt { font-size: 20px; font-weight: bold; background: linear-gradient(90deg, #ef4444, #f97316, #facc15); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .ht { font-size: 12px; color: rgba(255,255,255,0.55); }
        .hud-r { text-align: right; }
        .sl { font-size: 11px; color: rgba(255,255,255,0.45); }
        .sv { font-size: 28px; font-weight: bold; color: #f97316; line-height: 1; text-shadow: 0 0 15px rgba(249,115,22,0.55); }
        .mv { font-size: 14px; color: #facc15; margin-top: 2px; }
        canvas { width: 100%; height: 580px; background: #101218; border-radius: 14px; border: 2px solid rgba(239,68,68,0.35); touch-action: none; display: block; box-shadow: inset 0 0 80px rgba(200,20,40,0.3); }
        .br { display: flex; gap: 10px; }
        .gb { flex: 1; padding: 14px; border: none; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; color: #fff; transition: transform 0.1s; }
        .gb:active { transform: scale(0.94); }
        .gbs { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); }
        .gbp { background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%); }
        .gbh { background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); }
        .ad { width: 100%; height: 55px; background: linear-gradient(135deg, #ef444444 0%, #f9731644 100%); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #fff; font-weight: bold; border: 1px solid rgba(255,255,255,0.15); }
        .ov { position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
        .ov-in { background: linear-gradient(145deg, #2a0a1a, #101218); padding: 28px 24px; border-radius: 20px; max-width: 400px; width: 100%; text-align: center; border: 1px solid rgba(239,68,68,0.35); }
        .ov-in h2 { font-size: 26px; margin-bottom: 14px; background: linear-gradient(90deg, #ef4444, #f97316, #facc15); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .ov-in p { color: rgba(255,255,255,0.8); line-height: 1.8; margin-bottom: 10px; font-size: 14px; }
        .os { display: flex; justify-content: space-around; margin: 18px 0; padding: 15px; background: rgba(239,68,68,0.08); border-radius: 12px; }
        .osc { display: flex; flex-direction: column; gap: 4px; }
        .osn { font-size: 22px; font-weight: bold; color: #facc15; }
        .osl { font-size: 12px; color: rgba(255,255,255,0.5); }
        .ov-in button { margin-top: 10px; width: 100%; padding: 15px; font-size: 17px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; color: #fff; background: linear-gradient(135deg, #ef4444, #dc2626); }
        .hdn { display: none !important; }
        .nr { color: #facc15; font-size: 16px; font-weight: bold; animation: bl 0.8s infinite; margin: 8px 0; }
        @keyframes bl { 50% { opacity: 0.4; } }
        .hp-bar { width: 100%; height: 12px; background: rgba(0,0,0,0.4); border-radius: 6px; overflow: hidden; margin-top: 10px; }
        .hp-fill { height: 100%; background: linear-gradient(90deg, #22c55e, #84cc16, #facc15, #f97316, #ef4444); transition: width 0.2s; }
    /* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */
/* [BATCH-FIX:ad-components-css] */
.sponsor-btn{position:fixed;top:44px;right:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:3px 9px;border-radius:10px;font:11px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.sponsor-panel.show{display:flex}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.interstitial-ad.show{display:flex}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* [/BATCH-FIX:ad-components-css] */
</style>
</head>
<body>
    <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div id="wrap">
        <div class="hud">
            <div class="hud-l">
                <div class="gt">⚔️ 节拍大战</div>
                <div class="ht">最高分: <span id="hs">0</span></div>
            </div>
            <div class="hud-r">
                <div class="sl">战分</div>
                <div class="sv" id="sc">0</div>
                <div class="mv" id="mv">⚡ 击杀 x0</div>
            </div>
        </div>
        <canvas id="cv" width="520" height="760"></canvas>
        <div class="hp-bar"><div class="hp-fill" id="hp" style="width:100%"></div></div>
        <div class="br">
            <button class="gb gbs" id="bst">▶ 开战</button>
            <button class="gb gbp" id="bps">⏸ 暂停</button>
            <button class="gb gbh" id="bhp">❓ 指南</button>
        </div>
        <div class="ad">⚔️ 节拍即战力，用节奏击败敌人！</div>
    </div>

    <div class="ov hdn" id="guide">
        <div class="ov-in">
            <h2>⚔️ 节拍大战</h2>
            <p>👾 敌人沿4条进攻路线冲向你的基地</p>
            <p>👆 点击对应轨道<b>发射节拍弹</b>消灭敌人</p>
            <p>⌨️ 键盘: <b>J K L ;</b> 或 <b>1 2 3 4</b></p>
            <p>💥 连续击杀积攒大招，一击清屏！</p>
            <p>❤️ 敌人突破基地扣血，血量归零失败</p>
            <button id="go">开始战斗</button>
        </div>
    </div>

    <div class="ov hdn" id="end">
        <div class="ov-in">
            <h2 id="et">战斗结束</h2>
            <div class="nr hdn" id="nr">🏆 新纪录！</div>
            <div class="os">
                <div class="osc"><div class="osn" id="es">0</div><div class="osl">战分</div></div>
                <div class="osc"><div class="osn" id="ek">0</div><div class="osl">击杀数</div></div>
                <div class="osc"><div class="osn" id="ew">0</div><div class="osl">波次</div></div>
            </div>
            <p id="ed" style="margin-bottom:14px;"></p>
            <button id="reb">再战一局</button>
        </div>
    </div>

    <div class="ov hdn" id="psov">
        <div class="ov-in">
            <h2>⏸ 暂停中</h2>
            <p>战场暂时沉寂，准备好再次战斗？</p>
            <button id="rsb">继续战斗</button>
        </div>
    </div>

    <script>
        if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
        if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
        if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
        if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
    </script>
    <script src="../game_core.js"></script>
    <script>
    (function() {
        const GN = '节拍大战';
        GameCore.init({ highScore: GN });
        const cv = document.getElementById('cv');
        const ctx = cv.getContext('2d');
        const W = cv.width, H = cv.height;
        const TRACKS = 4;
        const BASE_Y = H - 70;
        let TRACK_W, TX0;
        const TRACK_COLORS = ['#ef4444', '#f97316', '#22c55e', '#3b82f6'];
        const TRACK_GLOW = ['rgba(239,68,68,0.5)', 'rgba(249,115,22,0.5)', 'rgba(34,197,94,0.5)', 'rgba(59,130,246,0.5)'];

        let state = STATE_MENU;
        let enemies = [];
        let bullets = [];
        let particles = [];
        let score = 0, kills = 0, wave = 1, maxCombo = 0, combo = 0;
        let hp = 100, maxHp = 100;
        let ultCharge = 0, ultActive = 0;
        let st = 0, si = 90;
        let baseSpeed = 1.4;
        let raf = null;
        let screenShake = 0;
        let laneFlash = [0, 0, 0, 0];
        let waveText = null;

        const esc = document.getElementById('sc');
        const emv = document.getElementById('mv');
        const ehs = document.getElementById('hs');
        const ehp = document.getElementById('hp');
        ehs.textContent = GameCore.highScore.get(GN);

        function recalcLayout() {
            TRACK_W = Math.min(110, (W - 40) / TRACKS);
            TX0 = (W - TRACK_W * TRACKS) / 2;
        }

        function Enemy(tr) {
            this.tr = tr;
            this.y = -30;
            this.hp = 1 + Math.floor(wave / 3);
            this.maxHp = this.hp;
            this.type = Math.random() < 0.15 + Math.min(0.25, wave * 0.02) ? 1 : 0;
            this.speed = baseSpeed * (this.type === 1 ? 1.55 : 1);
            this.size = this.type === 1 ? 30 : 24;
            this.dead = false;
            this.r = 0;
            this.hitFx = 0;
        }

        function Bullet(tr) {
            this.tr = tr;
            this.y = BASE_Y - 30;
            this.speed = 9;
            this.dead = false;
            this.r = 0;
        }

        function spawnEnemy() {
            let n = 1;
            if (wave >= 3) n = Math.random() < 0.3 ? 2 : 1;
            if (wave >= 6) n = Math.random() < 0.2 ? 3 : (Math.random() < 0.5 ? 2 : 1);
            const used = [];
            for (let i = 0; i < n; i++) {
                let t; let tries = 0;
                do { t = Math.floor(Math.random() * TRACKS); tries++; } while (used.indexOf(t) >= 0 && tries < 10);
                if (used.indexOf(t) < 0) { used.push(t); enemies.push(new Enemy(t)); }
            }
        }

        function initGame() {
            enemies = []; bullets = []; particles = [];
            score = 0; kills = 0; wave = 1; combo = 0; maxCombo = 0;
            hp = 100; maxHp = 100;
            ultCharge = 0; ultActive = 0;
            st = 0; si = 90; baseSpeed = 1.4; screenShake = 0;
            laneFlash = [0,0,0,0];
            waveText = { t: '第 1 波！', a: 1, y: H / 2 - 40 };
            recalcLayout();
            updateHUD();
        }

        function updateHUD() {
            esc.textContent = score;
            emv.textContent = '⚡ 击杀' + kills + ' 连击' + combo;
            ehp.style.width = Math.max(0, (hp / maxHp) * 100) + '%';
            const hs = GameCore.highScore.get(GN);
            if (score > hs) ehs.textContent = score;
        }

        function addParticles(x, y, c, n, big) {
            for (let k = 0; k < n; k++) {
                const a = Math.random() * Math.PI * 2;
                const sp = (big ? 2 : 1) + Math.random() * (big ? 7 : 4);
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (big ? 2 : 1),
                    a: 1, c: c, s: (big ? 3 : 2) + Math.random() * (big ? 5 : 3),
                    g: big ? 0.12 : 0.08
                });
            }
        }

        function laneCenter(tr) { return TX0 + tr * TRACK_W + TRACK_W / 2; }

        function fireLane(tr) {
            if (state !== STATE_PLAYING) return;
            if (ultCharge >= 100) {
                ultCharge = 0; ultActive = 60;
                screenShake = 18;
                for (let i = 0; i < enemies.length; i++) {
                    if (!enemies[i].dead) {
                        enemies[i].dead = true; kills++; score += 250; combo++; maxCombo = Math.max(maxCombo, combo);
                        addParticles(laneCenter(enemies[i].tr), enemies[i].y, TRACK_COLORS[enemies[i].tr], 22, true);
                    }
                }
                GameCore.highScore.set(GN, score);
                updateHUD();
                return;
            }
            bullets.push(new Bullet(tr));
            laneFlash[tr] = 1;
        }

        function gO(win) {
            state = STATE_OVER;
            if (raf) cancelAnimationFrame(raf);
            raf = null;
            const isNew = GameCore.highScore.set(GN, score);
            document.getElementById('es').textContent = score;
            document.getElementById('ek').textContent = kills;
            document.getElementById('ew').textContent = wave;
            document.getElementById('nr').classList.toggle('hdn', !isNew);
            let rank;
            if (win) rank = '🏆 传奇指挥官';
            else if (wave >= 15) rank = '⭐ 王牌指挥官';
            else if (wave >= 8) rank = '🎖 优秀指挥官';
            else rank = '🛡 新晋指挥官';
            document.getElementById('et').textContent = win ? '🎉 全部通关！' : '战斗失败';
            document.getElementById('ed').textContent = rank;
            document.getElementById('end').classList.remove('hdn');
        }

        function upd() {
            if (state !== STATE_PLAYING) return;
            for (let i = 0; i < TRACKS; i++) if (laneFlash[i] > 0) laneFlash[i] -= 0.12;
            if (screenShake > 0) screenShake *= 0.88;
            if (ultActive > 0) ultActive--;
            if (waveText) {
                waveText.a -= 0.012;
                waveText.y -= 0.6;
                if (waveText.a <= 0) waveText = null;
            }
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                if (e.dead) { enemies.splice(i, 1); continue; }
                e.y += e.speed;
                e.r += 0.05;
                if (e.hitFx > 0) e.hitFx -= 0.1;
                if (e.y >= BASE_Y - 10) {
                    e.dead = true;
                    const dmg = e.type === 1 ? 20 : 12;
                    hp = Math.max(0, hp - dmg);
                    combo = 0; screenShake = 14;
                    addParticles(laneCenter(e.tr), BASE_Y, '#ef4444', 22, true);
                    updateHUD();
                    if (hp <= 0) { enemies.splice(i, 1); gO(false); return; }
                    enemies.splice(i, 1);
                    continue;
                }
            }
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                if (b.dead) { bullets.splice(i, 1); continue; }
                b.y -= b.speed;
                b.r += 0.15;
                let hit = false;
                for (let j = 0; j < enemies.length; j++) {
                    const e = enemies[j];
                    if (e.dead || e.tr !== b.tr) continue;
                    if (Math.abs(b.y - e.y) < e.size + 10) {
                        hit = true;
                        e.hp--; e.hitFx = 1;
                        addParticles(laneCenter(e.tr), e.y, TRACK_COLORS[e.tr], 8, false);
                        if (e.hp <= 0) {
                            e.dead = true; kills++; combo++; maxCombo = Math.max(maxCombo, combo);
                            let pts = e.type === 1 ? 180 : 100;
                            pts = Math.floor(pts * (1 + Math.min(3, combo * 0.03)));
                            score += pts;
                            ultCharge = Math.min(100, ultCharge + (e.type === 1 ? 8 : 5));
                            addParticles(laneCenter(e.tr), e.y, '#facc15', 16, true);
                            addParticles(laneCenter(e.tr), e.y, TRACK_COLORS[e.tr], 14, false);
                            GameCore.highScore.set(GN, score);
                        }
                        updateHUD();
                        break;
                    }
                }
                if (hit || b.y < -20) b.dead = true;
            }
            st++;
            const curSi = Math.max(32, si - Math.floor(wave * 5));
            if (st >= curSi) {
                st = 0;
                if (enemies.filter(function(e){return !e.dead;}).length < TRACKS * 3) spawnEnemy();
            }
            const newWave = 1 + Math.floor(kills / 15);
            if (newWave !== wave) {
                wave = newWave;
                baseSpeed = Math.min(3.8, 1.4 + wave * 0.18);
                waveText = { t: '第 ' + wave + ' 波！', a: 1, y: H / 2 - 40 };
                if (wave > 20) { updateHUD(); gO(true); return; }
                updateHUD();
            }
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy;
                p.vy += p.g || 0.1;
                p.a -= 0.035;
                if (p.a <= 0) particles.splice(i, 1);
            }
        }

        function drawTracks() {
            for (let t = 0; t < TRACKS; t++) {
                const x0 = TX0 + t * TRACK_W;
                const lf = laneFlash[t];
                ctx.fillStyle = lf > 0 ? TRACK_COLORS[t] + '66' : 'rgba(255,255,255,0.03)';
                ctx.fillRect(x0 + 4, 0, TRACK_W - 8, BASE_Y);
                ctx.strokeStyle = TRACK_COLORS[t] + '66';
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(x0, 0); ctx.lineTo(x0, BASE_Y + 10); ctx.stroke();
                if (lf > 0) {
                    ctx.globalAlpha = lf * 0.7;
                    ctx.fillStyle = TRACK_COLORS[t];
                    ctx.fillRect(x0 + 4, BASE_Y - 50, TRACK_W - 8, 50);
                    ctx.globalAlpha = 1;
                }
            }
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.beginPath(); ctx.moveTo(TX0 + TRACKS * TRACK_W, 0); ctx.lineTo(TX0 + TRACKS * TRACK_W, BASE_Y + 10); ctx.stroke();
            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            ctx.fillRect(TX0 - 4, BASE_Y, TRACKS * TRACK_W + 8, 6);
            ctx.save();
            ctx.shadowColor = '#facc15'; ctx.shadowBlur = 22;
            const gg = ctx.createLinearGradient(TX0, BASE_Y, TX0, BASE_Y + 60);
            gg.addColorStop(0, '#1f2937'); gg.addColorStop(1, '#111827');
            ctx.fillStyle = gg;
            ctx.fillRect(TX0 - 6, BASE_Y, TRACKS * TRACK_W + 12, 60);
            for (let t = 0; t < TRACKS; t++) {
                const x = laneCenter(t);
                ctx.fillStyle = TRACK_COLORS[t];
                ctx.shadowColor = TRACK_GLOW[t]; ctx.shadowBlur = 16;
                ctx.beginPath(); ctx.arc(x, BASE_Y + 30, 22, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                const keys = ['J','K','L',';'];
                ctx.fillText(keys[t], x, BASE_Y + 31);
            }
            ctx.restore();
        }

        function drawEnemy(e) {
            const x = laneCenter(e.tr);
            const y = e.y;
            ctx.save();
            ctx.translate(x, y);
            if (e.hitFx > 0) { ctx.globalAlpha = 0.6 + e.hitFx * 0.4; }
            ctx.shadowColor = TRACK_GLOW[e.tr]; ctx.shadowBlur = e.type === 1 ? 24 : 14;
            const ec = e.type === 1 ? '#7c3aed' : TRACK_COLORS[e.tr];
            if (e.type === 1) {
                ctx.rotate(e.r);
                const s = e.size;
                ctx.fillStyle = ec;
                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    const a = (i / 6) * Math.PI * 2;
                    const px = Math.cos(a) * s, py = Math.sin(a) * s;
                    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                }
                ctx.closePath(); ctx.fill();
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(0, 0, s * 0.35, 0, Math.PI * 2); ctx.fill();
            } else {
                ctx.fillStyle = ec;
                const s = e.size;
                ctx.beginPath();
                ctx.moveTo(-s, 0); ctx.lineTo(0, -s); ctx.lineTo(s, 0); ctx.lineTo(0, s);
                ctx.closePath(); ctx.fill();
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
                ctx.fillStyle = '#111';
                ctx.fillRect(-s * 0.35, -3, s * 0.25, 6);
                ctx.fillRect(s * 0.1, -3, s * 0.25, 6);
            }
            ctx.restore();
            if (e.maxHp > 1) {
                const bw = e.size * 2;
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(x - bw / 2, y - e.size - 10, bw, 5);
                ctx.fillStyle = '#22c55e';
                ctx.fillRect(x - bw / 2, y - e.size - 10, bw * (e.hp / e.maxHp), 5);
            }
        }

        function drawBullet(b) {
            const x = laneCenter(b.tr);
            ctx.save();
            ctx.translate(x, b.y);
            ctx.shadowColor = TRACK_GLOW[b.tr]; ctx.shadowBlur = 20;
            const g = ctx.createRadialGradient(0, 0, 2, 0, 0, 16);
            g.addColorStop(0, '#ffffff');
            g.addColorStop(0.5, TRACK_COLORS[b.tr]);
            g.addColorStop(1, TRACK_COLORS[b.tr]);
            ctx.fillStyle = g;
            ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI * 2); ctx.stroke();
            ctx.restore();
        }

        function drawUltBg() {
            if (ultActive > 0) {
                ctx.globalAlpha = ultActive / 60 * 0.6;
                const g = ctx.createRadialGradient(W/2, H/2, 20, W/2, H/2, Math.max(W, H));
                g.addColorStop(0, '#facc15');
                g.addColorStop(1, 'transparent');
                ctx.fillStyle = g;
                ctx.fillRect(0, 0, W, H);
                ctx.globalAlpha = 1;
            }
        }

        function drawUltBar() {
            const barX = TX0, barY = 18, barW = TRACKS * TRACK_W, barH = 10;
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(barX, barY, barW, barH);
            const gu = ctx.createLinearGradient(barX, 0, barX + barW, 0);
            gu.addColorStop(0, '#facc15'); gu.addColorStop(1, '#f97316');
            ctx.fillStyle = gu;
            ctx.fillRect(barX, barY, barW * (ultCharge / 100), barH);
            ctx.strokeStyle = ultCharge >= 100 ? '#facc15' : 'rgba(255,255,255,0.3)';
            ctx.lineWidth = ultCharge >= 100 ? 2 : 1;
            ctx.strokeRect(barX, barY, barW, barH);
            ctx.font = 'bold 12px Microsoft YaHei';
            ctx.fillStyle = ultCharge >= 100 ? '#facc15' : '#fff';
            ctx.textAlign = 'center';
            const txt = ultCharge >= 100 ? '⚡ 满充能！点击任意发射大招' : '⚡ 大招能量 ' + Math.floor(ultCharge) + '%';
            ctx.fillText(txt, barX + barW / 2, barY + barH + 15);
        }

        function drawParticles() {
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                ctx.globalAlpha = Math.max(0, p.a);
                ctx.fillStyle = p.c;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, Math.PI * 2); ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        function dr() {
            ctx.save();
            if (screenShake > 0.5) ctx.translate((Math.random()-0.5) * screenShake, (Math.random()-0.5) * screenShake);
            const g = ctx.createLinearGradient(0, 0, 0, H);
            g.addColorStop(0, '#121826'); g.addColorStop(0.6, '#1a1025'); g.addColorStop(1, '#2a0a1a');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, W, H);
            for (let i = 0; i < 50; i++) {
                const y = ((i * 41 + performance.now() * 0.02) % (BASE_Y + 40)) - 20;
                ctx.globalAlpha = 0.08 + (i % 3) * 0.04;
                ctx.fillStyle = TRACK_COLORS[i % TRACKS];
                ctx.fillRect(TX0, y, TRACKS * TRACK_W, 1);
            }
            ctx.globalAlpha = 1;
            drawTracks();
            enemies.sort(function(a,b){return b.y - a.y;});
            for (let i = 0; i < enemies.length; i++) drawEnemy(enemies[i]);
            for (let i = 0; i < bullets.length; i++) drawBullet(bullets[i]);
            drawParticles();
            drawUltBg();
            drawUltBar();
            if (waveText) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, waveText.a);
                ctx.shadowColor = '#facc15'; ctx.shadowBlur = 30;
                ctx.fillStyle = '#facc15';
                ctx.font = 'bold 52px Microsoft YaHei';
                ctx.textAlign = 'center';
                ctx.fillText(waveText.t, W/2, waveText.y);
                ctx.restore();
            }
            if (combo >= 10) {
                ctx.save();
                ctx.shadowColor = '#facc15'; ctx.shadowBlur = 25;
                ctx.fillStyle = '#facc15';
                ctx.font = 'bold 46px Microsoft YaHei';
                ctx.textAlign = 'center';
                ctx.fillText(combo + ' COMBO', W/2, 95);
                ctx.restore();
            }
            ctx.font = '14px Microsoft YaHei';
            ctx.fillStyle = '#fbbf24';
            ctx.textAlign = 'right';
            ctx.fillText('波次: ' + wave + '/20', W - 14, 28);
            ctx.fillStyle = '#fca5a5';
            ctx.fillText('HP: ' + hp + '/' + maxHp, W - 14, 48);
            if (state === STATE_MENU) {
                ctx.fillStyle = 'rgba(0,0,0,0.72)';
                ctx.fillRect(0, 0, W, H);
                ctx.save();
                ctx.shadowColor = '#ef4444'; ctx.shadowBlur = 35;
                ctx.fillStyle = '#fca5a5';
                ctx.font = 'bold 48px Microsoft YaHei';
                ctx.textAlign = 'center';
                ctx.fillText('节拍大战', W/2, H/2 - 30);
                ctx.restore();
                ctx.fillStyle = '#fff';
                ctx.font = '18px Microsoft YaHei';
                ctx.fillText('点击"开战"，用节拍击败敌人！', W/2, H/2 + 20);
            }
            ctx.restore();
        }

        function lp() { upd(); dr(); raf = requestAnimationFrame(lp); }

        function laneAt(x) {
            for (let t = 0; t < TRACKS; t++) {
                const x0 = TX0 + t * TRACK_W;
                if (x >= x0 && x < x0 + TRACK_W) return t;
            }
            return -1;
        }

        cv.addEventListener('mousedown', function(e) {
            const r = cv.getBoundingClientRect();
            const sx = W / r.width, sy = H / r.height;
            fireLane(laneAt((e.clientX - r.left) * sx));
        });
        cv.addEventListener('touchstart', function(e) {
            const r = cv.getBoundingClientRect();
            const sx = W / r.width, sy = H / r.height;
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                fireLane(laneAt((t.clientX - r.left) * sx));
            }
        }, { passive: true });

        const km1 = { 'j':0,'J':0,'k':1,'K':1,'l':2,'L':2,';':3,':':3 };
        const km2 = { '1':0,'2':1,'3':2,'4':3 };
        document.addEventListener('keydown', function(e) {
            let d = -1;
            if (km1[e.key] !== undefined) d = km1[e.key];
            else if (km2[e.key] !== undefined) d = km2[e.key];
            if (d >= 0) { e.preventDefault(); fireLane(d); }
        });

        function sg() {
            initGame(); state = STATE_PLAYING;
            document.getElementById('guide').classList.add('hdn');
            document.getElementById('end').classList.add('hdn');
            document.getElementById('psov').classList.add('hdn');
            if (!raf) lp();
        }
        function pg() { if (state !== STATE_PLAYING) return; state = STATE_PAUSE; document.getElementById('psov').classList.remove('hdn'); }
        function rg() { if (state !== STATE_PAUSE) return; state = STATE_PLAYING; document.getElementById('psov').classList.add('hdn'); }

        document.getElementById('bst').addEventListener('click', function() { document.getElementById('guide').classList.remove('hdn'); });
        document.getElementById('bps').addEventListener('click', function() { if (state === STATE_PLAYING) pg(); else if (state === STATE_PAUSE) rg(); });
        document.getElementById('bhp').addEventListener('click', function() { document.getElementById('guide').classList.remove('hdn'); });
        document.getElementById('go').addEventListener('click', sg);
        document.getElementById('reb').addEventListener('click', sg);
        document.getElementById('rsb').addEventListener('click', rg);
        document.getElementById('start-game-btn').addEventListener('click', function() { document.getElementById('guide').classList.remove('hdn'); });

        recalcLayout();
        GameCore.hints.showStartGuide(
            '⚔️ <b>节拍大战</b><br><br>👾 敌人沿4线进攻基地<br>👆 点击轨道发射节拍弹<br>⌨️ J K L ; 或 1 2 3 4<br>💥 攒能量释放全屏大招<br>❤️ 血量归零战斗结束！'
        );
        setTimeout(function() { document.getElementById('guide').classList.remove('hdn'); }, 100);
    })();
    </script>

<script>
(function(){

  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>

<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
