<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>律动方块</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #0d0820 0%, #1a0d3a 50%, #2a0d4a 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 10px; color: #fff; overflow-x: hidden; }
        #wrap { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 10px; }
        .hud { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; background: rgba(255,100,200,0.08); border-radius: 14px; border: 1px solid rgba(255,100,200,0.3); backdrop-filter: blur(8px); }
        .hud-l { display: flex; flex-direction: column; gap: 3px; }
        .gt { font-size: 20px; font-weight: bold; background: linear-gradient(90deg, #f472b6, #fb923c, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .ht { font-size: 12px; color: rgba(255,255,255,0.55); }
        .hud-r { text-align: right; }
        .sl { font-size: 11px; color: rgba(255,255,255,0.45); }
        .sv { font-size: 28px; font-weight: bold; color: #f472b6; line-height: 1; text-shadow: 0 0 15px rgba(244,114,182,0.6); }
        .mv { font-size: 14px; color: #fb923c; margin-top: 2px; }
        canvas { width: 100%; height: 580px; background: #0d0820; border-radius: 14px; border: 2px solid rgba(255,100,200,0.35); touch-action: none; display: block; box-shadow: inset 0 0 80px rgba(150,50,200,0.3); }
        .br { display: flex; gap: 10px; }
        .gb { flex: 1; padding: 14px; border: none; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; color: #fff; transition: transform 0.1s; }
        .gb:active { transform: scale(0.94); }
        .gbs { background: linear-gradient(135deg, #f472b6 0%, #ec4899 100%); }
        .gbp { background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%); }
        .gbh { background: linear-gradient(135deg, #34d399 0%, #059669 100%); }
        .ad { width: 100%; height: 55px; background: linear-gradient(135deg, #f472b644 0%, #fb923c44 100%); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #fff; font-weight: bold; border: 1px solid rgba(255,255,255,0.15); }
        .ov { position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
        .ov-in { background: linear-gradient(145deg, #1e0a3e, #0f0820); padding: 28px 24px; border-radius: 20px; max-width: 400px; width: 100%; text-align: center; border: 1px solid rgba(244,114,182,0.35); }
        .ov-in h2 { font-size: 26px; margin-bottom: 14px; background: linear-gradient(90deg, #f472b6, #fb923c, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .ov-in p { color: rgba(255,255,255,0.8); line-height: 1.8; margin-bottom: 10px; font-size: 14px; }
        .os { display: flex; justify-content: space-around; margin: 18px 0; padding: 15px; background: rgba(244,114,182,0.08); border-radius: 12px; }
        .osc { display: flex; flex-direction: column; gap: 4px; }
        .osn { font-size: 22px; font-weight: bold; color: #fbbf24; }
        .osl { font-size: 12px; color: rgba(255,255,255,0.5); }
        .ov-in button { margin-top: 10px; width: 100%; padding: 15px; font-size: 17px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; color: #fff; background: linear-gradient(135deg, #f472b6, #ec4899); }
        .hdn { display: none !important; }
        .nr { color: #fb923c; font-size: 16px; font-weight: bold; animation: bl 0.8s infinite; margin: 8px 0; }
        @keyframes bl { 50% { opacity: 0.4; } }
    /* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */

.sponsor-btn{position:fixed;top:44px;right:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:3px 9px;border-radius:10px;font:11px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}

.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.interstitial-ad.show{display:flex}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}

</style>
</head>
<body>
    <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div id="wrap">
        <div class="hud">
            <div class="hud-l">
                <div class="gt">🟦 律动方块</div>
                <div class="ht">最高分: <span id="hs">0</span></div>
            </div>
            <div class="hud-r">
                <div class="sl">分数</div>
                <div class="sv" id="sc">0</div>
                <div class="mv" id="mv">💫 连击 x0</div>
            </div>
        </div>
        <canvas id="cv" width="500" height="760"></canvas>
        <div class="br">
            <button class="gb gbs" id="bst">▶ 开始</button>
            <button class="gb gbp" id="bps">⏸ 暂停</button>
            <button class="gb gbh" id="bhp">❓ 玩法</button>
        </div>
        <div class="ad">🟦 让方块跟随节拍律动起来！</div>
    </div>

    <div class="ov hdn" id="guide">
        <div class="ov-in">
            <h2>🟦 律动方块</h2>
            <p>🎵 彩色方块从四面八方飞向中央</p>
            <p>👆 当方块<b>到达中央光环</b>时点击<b>同色按钮</b></p>
            <p>⌨️ 键盘: <b>← ↑ ↓ →</b> 或 <b>A W S D</b></p>
            <p>💫 连续命中获得律动加成，越来越快！</p>
            <p>💔 漏接5次方块，律动停止</p>
            <button id="go">律动起来</button>
        </div>
    </div>

    <div class="ov hdn" id="end">
        <div class="ov-in">
            <h2 id="et">律动结束</h2>
            <div class="nr hdn" id="nr">🏆 新纪录！</div>
            <div class="os">
                <div class="osc"><div class="osn" id="es">0</div><div class="osl">总分数</div></div>
                <div class="osc"><div class="osn" id="ec">0</div><div class="osl">最高连击</div></div>
                <div class="osc"><div class="osn" id="ep">0</div><div class="osl">命中数</div></div>
            </div>
            <p id="ed" style="margin-bottom:14px;"></p>
            <button id="reb">再来律动</button>
        </div>
    </div>

    <div class="ov hdn" id="psov">
        <div class="ov-in">
            <h2>⏸ 暂停中</h2>
            <p>节拍暂停，准备好再次律动？</p>
            <button id="rsb">继续律动</button>
        </div>
    </div>

    <script>
        if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
        if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
        if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
        if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
    </script>
    <script src="../game_core.js"></script>
    <script>
    (function() {
        const GN = '律动方块';
        GameCore.init({ highScore: GN });
        const cv = document.getElementById('cv');
        const ctx = cv.getContext('2d');
        const W = cv.width, H = cv.height;
        const CX = W / 2, CY = H / 2;
        const RING_R = 100;
        const DIRS = 4;
        const DIR_ANGLES = [Math.PI, -Math.PI / 2, Math.PI / 2, 0];
        const DIR_NAMES = ['左', '上', '下', '右'];
        const COLORS = ['#60a5fa', '#34d399', '#fbbf24', '#f472b6'];
        const BTN_COLORS = ['#3b82f6', '#10b981', '#f59e0b', '#ec4899'];
        const GLOW = ['rgba(96,165,250,0.6)', 'rgba(52,211,153,0.6)', 'rgba(251,191,36,0.6)', 'rgba(244,114,182,0.6)'];

        let state = STATE_MENU;
        let blocks = [];
        let score = 0, combo = 0, mCombo = 0, hits = 0, miss = 0;
        let st = 0, si = 70;
        let baseSpeed = 2.4;
        let raf = null;
        let fx = [];
        let ringPulse = 0;
        let btnPress = [0, 0, 0, 0];
        let beatPulse = 0;

        const esc = document.getElementById('sc');
        const emv = document.getElementById('mv');
        const ehs = document.getElementById('hs');
        ehs.textContent = GameCore.highScore.get(GN);

        function Block(dir) {
            this.dir = dir;
            this.ang = DIR_ANGLES[dir];
            const sd = 460;
            this.x = CX + Math.cos(this.ang) * sd;
            this.y = CY + Math.sin(this.ang) * sd;
            this.speed = baseSpeed;
            this.hit = false;
            this.missed = false;
            this.spin = Math.random() * Math.PI;
            this.size = 28;
        }

        function spawn() {
            let n = 1;
            const r = Math.random();
            if (score > 2000) n = r < 0.25 ? 2 : 1;
            if (score > 5000) n = r < 0.15 ? 3 : (r < 0.4 ? 2 : 1);
            const used = [];
            for (let i = 0; i < n; i++) {
                let d; let t = 0;
                do { d = Math.floor(Math.random() * DIRS); t++; } while (used.indexOf(d) >= 0 && t < 10);
                if (used.indexOf(d) < 0) { used.push(d); blocks.push(new Block(d)); }
            }
        }

        function initGame() {
            blocks = []; fx = [];
            score = 0; combo = 0; mCombo = 0; hits = 0; miss = 0;
            st = 0; si = 70; baseSpeed = 2.4; ringPulse = 0; beatPulse = 0;
            btnPress = [0,0,0,0];
            h();
        }

        function h() {
            esc.textContent = score;
            emv.textContent = '💫 连击 x' + combo;
            const hs = GameCore.highScore.get(GN);
            if (score > hs) ehs.textContent = score;
        }

        function addFx(x, y, col, txt, big) {
            fx.push({ x: x, y: y, vy: -1.8, a: 1, c: col, t: txt, s: big ? 30 : 22, isT: true });
        }
        function addBurst(x, y, col, n) {
            for (let k = 0; k < n; k++) {
                const a = Math.random() * Math.PI * 2;
                const sp = 1.5 + Math.random() * 5;
                fx.push({ x: x, y: y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 1, a: 1, c: col, s: 2+Math.random()*4, isT: false });
            }
        }

        function tapDir(dir) {
            if (state !== STATE_PLAYING) return;
            btnPress[dir] = 1;
            let best = null, bd = 999, bi = -1;
            for (let i = 0; i < blocks.length; i++) {
                const b = blocks[i];
                if (b.dir !== dir || b.hit || b.missed) continue;
                const dx = b.x - CX, dy = b.y - CY;
                const d = Math.abs(Math.hypot(dx, dy) - RING_R);
                if (d < 80 && d < bd) { bd = d; best = b; bi = i; }
            }
            const tx = CX + Math.cos(DIR_ANGLES[dir]) * RING_R;
            const ty = CY + Math.sin(DIR_ANGLES[dir]) * RING_R;
            if (best) {
                best.hit = true; hits++; ringPulse = 1;
                let pts = 0, jdg = '', col = '#fff';
                if (bd < 12) { pts = 280; jdg = 'AMAZING!'; col = '#fbbf24'; }
                else if (bd < 28) { pts = 180; jdg = 'PERFECT!'; col = '#f472b6'; }
                else if (bd < 50) { pts = 100; jdg = 'GREAT!'; col = '#34d399'; }
                else { pts = 50; jdg = 'GOOD'; col = '#fff'; }
                const bonus = Math.min(3, 1 + combo * 0.025);
                pts = Math.floor(pts * bonus);
                score += pts; combo++; mCombo = Math.max(mCombo, combo);
                baseSpeed = Math.min(5.5, baseSpeed + 0.01);
                si = Math.max(32, 70 - Math.floor(score / 180));
                addFx(tx, ty - 40, col, jdg, true);
                addFx(tx, ty - 10, COLORS[dir], '+' + pts, false);
                addBurst(tx, ty, col, 18);
                addBurst(CX, CY, col, 10);
                GameCore.highScore.set(GN, score);
                h();
            } else {
                combo = 0; h();
            }
        }

        function gO() {
            state = STATE_OVER;
            if (raf) cancelAnimationFrame(raf);
            raf = null;
            const isNew = GameCore.highScore.set(GN, score);
            document.getElementById('es').textContent = score;
            document.getElementById('ec').textContent = mCombo;
            document.getElementById('ep').textContent = hits;
            document.getElementById('nr').classList.toggle('hdn', !isNew);
            let rank;
            if (score >= 10000) rank = '🌟 律动之神';
            else if (score >= 6000) rank = '⭐ 节奏大师';
            else if (score >= 3000) rank = '🎵 律动高手';
            else rank = '🟦 律动新手';
            document.getElementById('et').textContent = score >= 5000 ? '🎉 精彩律动！' : '律动结束';
            document.getElementById('ed').textContent = rank;
            document.getElementById('end').classList.remove('hdn');
        }

        function upd() {
            if (state !== STATE_PLAYING) return;
            beatPulse += 0.08;
            ringPulse = Math.max(0, ringPulse - 0.06);
            for (let i = 0; i < DIRS; i++) if (btnPress[i] > 0) btnPress[i] -= 0.08;
            for (let i = blocks.length - 1; i >= 0; i--) {
                const b = blocks[i];
                const dx = CX - b.x, dy = CY - b.y;
                const dist = Math.hypot(dx, dy);
                const nx = dx / (dist || 1), ny = dy / (dist || 1);
                b.x += nx * b.speed;
                b.y += ny * b.speed;
                b.spin += 0.04;
                if (b.hit) {
                    if (dist < RING_R - 10 || dist > RING_R + 120) blocks.splice(i, 1);
                    continue;
                }
                if (dist < RING_R - 40 && !b.missed) {
                    b.missed = true; miss++; combo = 0; h();
                    const tx = CX + Math.cos(DIR_ANGLES[b.dir]) * RING_R;
                    const ty = CY + Math.sin(DIR_ANGLES[b.dir]) * RING_R;
                    addFx(tx, ty - 20, '#ef4444', 'MISS', false);
                    addBurst(tx, ty, '#ef4444', 12);
                    if (miss >= 5) { blocks.splice(i, 1); gO(); return; }
                }
                if (dist < 10) blocks.splice(i, 1);
            }
            st++;
            if (st >= Math.floor(si)) { st = 0; if (blocks.length < 10) spawn(); }
            for (let i = fx.length - 1; i >= 0; i--) {
                const p = fx[i];
                if (p.isT) { p.y += p.vy; p.a -= 0.028; }
                else { p.x += p.vx || 0; p.y += p.vy || 0; p.vy = (p.vy || 0) + 0.14; p.a -= 0.04; }
                if (p.a <= 0) fx.splice(i, 1);
            }
        }

        function rr(cx, cy, r, col, glow, pulseAmt) {
            const pr = r + Math.sin(beatPulse * 2 + pulseAmt) * 5;
            ctx.save();
            ctx.shadowColor = glow; ctx.shadowBlur = 25;
            ctx.strokeStyle = col; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.arc(cx, cy, pr, 0, Math.PI * 2); ctx.stroke();
            ctx.restore();
        }

        function drBg() {
            const g = ctx.createRadialGradient(CX, CY, 20, CX, CY, 500);
            g.addColorStop(0, '#2a0d5e');
            g.addColorStop(0.5, '#1a0840');
            g.addColorStop(1, '#0d0820');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, W, H);
            for (let i = 0; i < 80; i++) {
                const a = (i / 80) * Math.PI * 2 + beatPulse * 0.15;
                const r1 = 150 + ((i * 13) % 180);
                const x = CX + Math.cos(a) * r1;
                const y = CY + Math.sin(a) * r1;
                ctx.globalAlpha = 0.35 + Math.sin(beatPulse * 3 + i) * 0.2;
                ctx.fillStyle = COLORS[i % DIRS];
                ctx.beginPath(); ctx.arc(x, y, 2 + (i % 3), 0, Math.PI * 2); ctx.fill();
            }
            ctx.globalAlpha = 1;
            for (let d = 0; d < DIRS; d++) {
                const ang = DIR_ANGLES[d];
                const sx = CX + Math.cos(ang) * (RING_R + 10);
                const sy = CY + Math.sin(ang) * (RING_R + 10);
                const ex = CX + Math.cos(ang) * 480;
                const ey = CY + Math.sin(ang) * 480;
                ctx.strokeStyle = COLORS[d] + '44';
                ctx.lineWidth = 8;
                ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
            }
        }

        function drRing() {
            rr(CX, CY, RING_R - 12, 'rgba(255,255,255,0.25)', 'rgba(255,255,255,0.3)', 0);
            const mainR = RING_R + ringPulse * 20;
            ctx.save();
            ctx.shadowColor = '#ffffff';
            ctx.shadowBlur = 35 + ringPulse * 30;
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 5 + ringPulse * 3;
            ctx.beginPath(); ctx.arc(CX, CY, mainR, 0, Math.PI * 2); ctx.stroke();
            ctx.restore();
            rr(CX, CY, RING_R + 14, 'rgba(255,255,255,0.2)', 'rgba(255,255,255,0.25)', 2);
            for (let d = 0; d < DIRS; d++) {
                const ang = DIR_ANGLES[d];
                const x = CX + Math.cos(ang) * RING_R;
                const y = CY + Math.sin(ang) * RING_R;
                ctx.save();
                const sc = 1 + btnPress[d] * 0.2;
                ctx.translate(x, y); ctx.scale(sc, sc);
                ctx.shadowColor = GLOW[d]; ctx.shadowBlur = 25;
                ctx.fillStyle = COLORS[d];
                ctx.globalAlpha = 0.5 + btnPress[d] * 0.4;
                ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI * 2); ctx.fill();
                ctx.globalAlpha = 1;
                ctx.strokeStyle = BTN_COLORS[d]; ctx.lineWidth = 3;
                ctx.stroke();
                const arrows = ['◀','▲','▼','▶'];
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 22px Arial';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(arrows[d], 0, 1);
                ctx.restore();
            }
        }

        function drBlock(b) {
            ctx.save();
            ctx.translate(b.x, b.y);
            ctx.rotate(b.spin);
            if (b.missed) ctx.globalAlpha = 0.35;
            else if (b.hit) ctx.globalAlpha = 0.5;
            ctx.shadowColor = GLOW[b.dir]; ctx.shadowBlur = 25;
            const g = ctx.createLinearGradient(-b.size, -b.size, b.size, b.size);
            g.addColorStop(0, '#ffffff');
            g.addColorStop(0.4, COLORS[b.dir]);
            g.addColorStop(1, BTN_COLORS[b.dir]);
            ctx.fillStyle = g;
            const s = b.size;
            ctx.beginPath();
            ctx.moveTo(0, -s); ctx.lineTo(s, 0); ctx.lineTo(0, s); ctx.lineTo(-s, 0);
            ctx.closePath(); ctx.fill();
            ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();
        }

        function drCenter() {
            const pr = 24 + Math.sin(beatPulse * 4) * 4;
            ctx.save();
            ctx.shadowColor = '#fbbf24'; ctx.shadowBlur = 30;
            const g = ctx.createRadialGradient(CX, CY, 4, CX, CY, pr);
            g.addColorStop(0, '#ffffff');
            g.addColorStop(0.5, '#fbbf24');
            g.addColorStop(1, '#f59e0b');
            ctx.fillStyle = g;
            ctx.beginPath(); ctx.arc(CX, CY, pr, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        }

        function drFx() {
            for (let i = 0; i < fx.length; i++) {
                const p = fx[i];
                ctx.globalAlpha = Math.max(0, p.a);
                if (p.isT && p.t) {
                    ctx.font = 'bold ' + p.s + 'px Microsoft YaHei';
                    ctx.textAlign = 'center';
                    ctx.fillStyle = p.c;
                    ctx.shadowColor = p.c; ctx.shadowBlur = 12;
                    ctx.fillText(p.t, p.x, p.y);
                    ctx.shadowBlur = 0;
                } else {
                    ctx.fillStyle = p.c;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, Math.PI * 2); ctx.fill();
                }
            }
            ctx.globalAlpha = 1;
        }

        function dr() {
            drBg();
            drRing();
            blocks.sort(function(a,b){ const da=Math.hypot(a.x-CX,a.y-CY), db=Math.hypot(b.x-CX,b.y-CY); return db-da; });
            for (let i = 0; i < blocks.length; i++) drBlock(blocks[i]);
            drCenter();
            drFx();
            if (combo >= 15) {
                ctx.save();
                ctx.shadowColor = '#fbbf24'; ctx.shadowBlur = 28;
                ctx.fillStyle = '#fbbf24';
                ctx.font = 'bold 54px Microsoft YaHei';
                ctx.textAlign = 'center';
                ctx.fillText(combo + ' COMBO', CX, 80);
                ctx.restore();
            }
            ctx.font = '14px Microsoft YaHei';
            ctx.fillStyle = '#fca5a5';
            ctx.textAlign = 'right';
            ctx.fillText('漏接: ' + miss + '/5', W - 14, 28);
            ctx.fillStyle = '#fde68a';
            ctx.fillText('命中: ' + hits, W - 14, 50);
            if (state === STATE_MENU) {
                ctx.fillStyle = 'rgba(0,0,0,0.68)';
                ctx.fillRect(0, 0, W, H);
                ctx.save();
                ctx.shadowColor = '#f472b6'; ctx.shadowBlur = 35;
                ctx.fillStyle = '#f9a8d4';
                ctx.font = 'bold 46px Microsoft YaHei';
                ctx.textAlign = 'center';
                ctx.fillText('律动方块', CX, H/2 - 30);
                ctx.restore();
                ctx.fillStyle = '#fff';
                ctx.font = '18px Microsoft YaHei';
                ctx.fillText('点击"开始"让节奏律动起来', CX, H/2 + 20);
            }
        }

        function lp() { upd(); dr(); raf = requestAnimationFrame(lp); }

        function dirAt(x, y) {
            for (let d = 0; d < DIRS; d++) {
                const ang = DIR_ANGLES[d];
                const tx = CX + Math.cos(ang) * RING_R;
                const ty = CY + Math.sin(ang) * RING_R;
                if (Math.hypot(x - tx, y - ty) < 45) return d;
            }
            return -1;
        }

        cv.addEventListener('mousedown', function(e) {
            const r = cv.getBoundingClientRect();
            const sx = W / r.width, sy = H / r.height;
            const d = dirAt((e.clientX - r.left) * sx, (e.clientY - r.top) * sy);
            if (d >= 0) tapDir(d);
        });
        cv.addEventListener('touchstart', function(e) {
            const r = cv.getBoundingClientRect();
            const sx = W / r.width, sy = H / r.height;
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                const d = dirAt((t.clientX - r.left) * sx, (t.clientY - r.top) * sy);
                if (d >= 0) tapDir(d);
            }
        }, { passive: true });

        const km1 = { 'ArrowLeft':0,'ArrowUp':1,'ArrowDown':2,'ArrowRight':3 };
        const km2 = { 'a':0,'A':0,'w':1,'W':1,'s':2,'S':2,'d':3,'D':3 };
        document.addEventListener('keydown', function(e) {
            let d = -1;
            if (km1[e.key] !== undefined) d = km1[e.key];
            else if (km2[e.key] !== undefined) d = km2[e.key];
            if (d >= 0) { e.preventDefault(); tapDir(d); }
        });

        function sg() {
            initGame(); state = STATE_PLAYING;
            document.getElementById('guide').classList.add('hdn');
            document.getElementById('end').classList.add('hdn');
            document.getElementById('psov').classList.add('hdn');
            if (!raf) lp();
        }
        function pg() { if (state !== STATE_PLAYING) return; state = STATE_PAUSE; document.getElementById('psov').classList.remove('hdn'); }
        function rg() { if (state !== STATE_PAUSE) return; state = STATE_PLAYING; document.getElementById('psov').classList.add('hdn'); }

        document.getElementById('bst').addEventListener('click', function() { document.getElementById('guide').classList.remove('hdn'); });
        document.getElementById('bps').addEventListener('click', function() { if (state === STATE_PLAYING) pg(); else if (state === STATE_PAUSE) rg(); });
        document.getElementById('bhp').addEventListener('click', function() { document.getElementById('guide').classList.remove('hdn'); });
        document.getElementById('go').addEventListener('click', sg);
        document.getElementById('reb').addEventListener('click', sg);
        document.getElementById('rsb').addEventListener('click', rg);
        document.getElementById('start-game-btn').addEventListener('click', function() { document.getElementById('guide').classList.remove('hdn'); });

        GameCore.hints.showStartGuide(
            '🟦 <b>律动方块</b><br><br>🎵 方块飞向中央光环<br>👆 到达时点击同色按钮<br>⌨️ ← ↑ ↓ → 或 A W S D<br>💫 连击加成速度更快<br>💔 漏接5次律动结束！'
        );
        setTimeout(function() { document.getElementById('guide').classList.remove('hdn'); }, 100);
    })();
    </script>

<script>

  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>

<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
