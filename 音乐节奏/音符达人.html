<body>

<button id="start-game-btn" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:20px 40px;font-size:20px;background:linear-gradient(135deg,#667eea,#764ba2);color:white;border:none;border-radius:12px;cursor:pointer;z-index:999;font-weight:bold;">开始游戏</button>

<canvas id="c"></canvas>

<script>
if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
</script>
<script src="../game_core.js"></script>
<script>
(function(){
"use strict";

const W=480,H=720;
const COLS=4;
const COL_W=W/COLS;
const JUDGE_LINE_Y=H-100;
const PERFECT_RANGE=60;
const GOOD_RANGE=120;
const NOTE_H=30;
const MAX_HP=100;

let audioCtx=null;
function initAudio(){
    if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
}
function playTone(freq,dur,type,vol){
    if(!audioCtx)return;
    try{
        const o=audioCtx.createOscillator();
        const g=audioCtx.createGain();
        o.type=type||'sine';
        o.frequency.value=freq;
        g.gain.value=vol||0.15;
        g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
        o.connect(g);g.connect(audioCtx.destination);
        o.start();o.stop(audioCtx.currentTime+dur);
    }catch(e){}
}
function sfxStart(){playTone(523,0.1,'sine',0.18);setTimeout(()=>playTone(659,0.1,'sine',0.18),100);setTimeout(()=>playTone(784,0.2,'sine',0.18),200)}
function sfxPerfect(){playTone(880,0.08,'sine',0.2);setTimeout(()=>playTone(1108,0.08,'sine',0.15),60)}
function sfxGood(){playTone(660,0.1,'sine',0.18)}
function sfxMiss(){playTone(150,0.2,'sawtooth',0.15)}
function sfxHold(){playTone(740,0.05,'triangle',0.1)}
function sfxBgmBeat(freq){playTone(freq,0.1,'sine',0.08)}
function sfxBtn(){playTone(600,0.06,'sine',0.1)}
function sfxWin(){playTone(523,0.15,'sine',0.2);setTimeout(()=>playTone(659,0.15,'sine',0.2),150);setTimeout(()=>playTone(784,0.15,'sine',0.2),300);setTimeout(()=>playTone(1047,0.3,'sine',0.2),450)}

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let scale=1;
function resize(){
    const r=W/H;
    let cw=window.innerWidth,ch=window.innerHeight;
    if(cw/ch>r){ch=cw/r}else{cw=ch*r}
    canvas.width=cw;canvas.height=ch;
    scale=cw/W;
    ctx.setTransform(scale,0,0,scale,0,0);
}
window.addEventListener('resize',resize);
resize();

const SONGS=[
    {name:"晨曦微光",bpm:80,duration:60,color1:"#4facfe",color2:"#00f2fe"},
    {name:"夏日热浪",bpm:110,duration:60,color1:"#f093fb",color2:"#f5576c"},
    {name:"巅峰之夜",bpm:140,duration:60,color1:"#ffecd2",color2:"#fcb69f"}
];

const NOTE_FREQ=[262,330,392,523];
const COL_KEYS=['d','f','j','k'];
const COL_NAMES=['D','F','J','K'];

const G={
    state:STATE_MENU,
    score:0,
    highScore:0,
    bestRank:'C',
    hp:MAX_HP,
    combo:0,
    maxCombo:0,
    comboMult:1,
    perfectCount:0,
    goodCount:0,
    missCount:0,
    notes:[],
    particles:[],
    judgeEffects:[],
    currentSong:0,
    songTime:0,
    spawnTimer:0,
    nextNoteTime:0,
    noteSpeed:3,
    songProgress:0,
    holdNotes:[null,null,null,null],
    beatTimer:0,
    beatCount:0,
    btnRects:{},
    keys:{},
    pointerDown:[false,false,false,false],
    songStartTs:0,
    finalRank:'C',
    victory:false,
    songTransition:false,
    songTransitionTimer:0,
    songTransitionText:'',
    comboMilestoneShown:0,
    trails:[[],[],[],[]],
    flashEffects:[],
    noteTrailTimer:[0,0,0,0],
    screenShake:0,
    bonusPopupTimer:0,
    bonusPopupText:'',
    totalNotesHit:0,
    lastPerfectChain:0,
    perfectChain:0,
    feverMode:false,
    feverTimer:0
};

G.highScore=parseInt(Storage.load('yf_highscore','0'));
G.bestRank=Storage.load('yf_bestrank','C');

function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
}

function drawBtn(ctx,x,y,w,h,text,name,color){
    G.btnRects[name]={x:x,y:y,w:w,h:h};
    const grad=ctx.createLinearGradient(x,y,x+w,y+h);
    if(color){grad.addColorStop(0,color[0]);grad.addColorStop(1,color[1])}
    else{grad.addColorStop(0,'#667eea');grad.addColorStop(1,'#764ba2')}
    ctx.fillStyle=grad;
    ctx.strokeStyle='rgba(255,255,255,0.4)';
    ctx.lineWidth=2;
    roundRect(ctx,x,y,w,h,10);
    ctx.fill();ctx.stroke();
    ctx.fillStyle='#fff';
    ctx.font='bold 18px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(text,x+w/2,y+h/2);
    ctx.textBaseline='alphabetic';
}

function hitBtn(p,name){
    const r=G.btnRects[name];
    return r && p.x>=r.x && p.x<=r.x+r.w && p.y>=r.y && p.y<=r.y+r.h;
}

function getPos(e){
    const rect=canvas.getBoundingClientRect();
    const t=e.touches?e.touches[0]:(e.changedTouches?e.changedTouches[0]:e);
    if(!t)return{x:0,y:0};
    return{x:(t.clientX-rect.left)/scale,y:(t.clientY-rect.top)/scale};
}

function Note(col,type,holdDuration){
    this.col=col;
    this.type=type||'normal';
    this.y=-NOTE_H;
    this.holdDuration=holdDuration||0;
    this.hit=false;
    this.missed=false;
    this.holding=false;
    this.hitY=0;
    this.holdProgress=0;
    this.color=type==='hold'?'#ffd700':['#ff6b9d','#4facfe','#43e97b','#fa709a'][col];
}

function initState(){
    G.score=0;
    G.hp=MAX_HP;
    G.combo=0;
    G.maxCombo=0;
    G.comboMult=1;
    G.perfectCount=0;
    G.goodCount=0;
    G.missCount=0;
    G.notes=[];
    G.particles=[];
    G.judgeEffects=[];
    G.currentSong=0;
    G.songTime=0;
    G.spawnTimer=0;
    G.nextNoteTime=0;
    G.noteSpeed=getNoteSpeed(0);
    G.songProgress=0;
    G.holdNotes=[null,null,null,null];
    G.beatTimer=0;
    G.beatCount=0;
    G.songStartTs=Date.now();
    G.victory=false;
    G.state=STATE_PLAYING;
    G.songTransition=false;
    G.songTransitionTimer=0;
    G.comboMilestoneShown=0;
    G.trails=[[],[],[],[]];
    G.flashEffects=[];
    G.noteTrailTimer=[0,0,0,0];
    G.screenShake=0;
    G.bonusPopupTimer=0;
    G.totalNotesHit=0;
    G.perfectChain=0;
    G.feverMode=false;
    G.feverTimer=0;
    G.patternQueue=buildSongPattern(0);
    G.patternIdx=0;
}

function buildSongPattern(songIdx){
    const s=SONGS[songIdx];
    const beatMs=60000/s.bpm;
    const totalBeats=Math.floor(s.duration*1000/(beatMs/2));
    const queue=[];
    for(let b=0;b<totalBeats;b++){
        const isStrong= b%4===0;
        const density= isStrong?0.6:0.35+songIdx*0.05;
        const cols=[];
        for(let c=0;c<4;c++){
            if(Math.random()<density){
                if(cols.length<(isStrong&&songIdx>=1?2:1))cols.push(c);
            }
        }
        if(cols.length===0&&isStrong)cols.push(Math.floor(Math.random()*4));
        for(const c of cols){
            const isHold=songIdx>=0&&Math.random()<(0.12+songIdx*0.05);
            const holdMs=isHold?beatMs*(1+Math.floor(Math.random()*3)):0;
            queue.push({beat:b*(beatMs/2),col:c,type:isHold?'hold':'normal',hold:holdMs});
        }
    }
    return queue;
}

function trySpawnFromPattern(){
    if(!G.patternQueue||G.patternQueue.length===0)return false;
    while(G.patternIdx<G.patternQueue.length){
        const p=G.patternQueue[G.patternIdx];
        if(G.songTime>=p.beat){
            G.patternIdx++;
            const note=new Note(p.col,p.type,p.hold);
            note.y=-NOTE_H;
            G.notes.push(note);
        }else{break}
    }
    return true;
}

function getSongRemaining(){
    const s=SONGS[G.currentSong];
    const rem=s.duration*1000-G.songTime;
    return Math.max(0,Math.ceil(rem/1000));
}

function formatTime(secs){
    const m=Math.floor(secs/60);
    const s=secs%60;
    return m+':'+String(s).padStart(2,'0');
}

function getNoteSpeed(songIdx){
    const base=2.5;
    return base+songIdx*0.8+G.currentSong*0.3;
}

function spawnNote(){
    const song=SONGS[G.currentSong];
    const beatInterval=60000/song.bpm;
    const colsUsed=[];
    const numNotes=Math.random()<0.15?2:1;
    for(let i=0;i<numNotes;i++){
        let col;
        do{col=Math.floor(Math.random()*COLS)}while(colsUsed.indexOf(col)!==-1);
        colsUsed.push(col);
        const isHold=Math.random()<0.2;
        const holdDur=isHold?beatInterval*(1+Math.floor(Math.random()*3)):0;
        const n=new Note(col,isHold?'hold':'normal',holdDur);
        G.notes.push(n);
    }
}

function addParticles(x,y,color,count){
    for(let i=0;i<count;i++){
        G.particles.push({
            x:x,y:y,
            vx:(Math.random()-0.5)*8,
            vy:(Math.random()-0.5)*8-2,
            life:40,maxLife:40,
            size:2+Math.random()*4,
            color:color,
            type:'spark'
        });
    }
}

function addJudgeEffect(col,text,color){
    const x=col*COL_W+COL_W/2;
    G.judgeEffects.push({
        x:x,y:JUDGE_LINE_Y-60,
        text:text,color:color,
        life:40,maxLife:40,
        scale:1.5
    });
}

function calcRank(){
    const total=G.perfectCount+G.goodCount+G.missCount;
    if(total===0)return'C';
    const scoreRate=(G.perfectCount*100+G.goodCount*50)/(total*100);
    const comboRate=G.maxCombo/Math.max(1,total);
    const finalRate=scoreRate*0.7+comboRate*0.3;
    if(finalRate>=0.95)return'SS';
    if(finalRate>=0.88)return'S';
    if(finalRate>=0.75)return'A';
    if(finalRate>=0.60)return'B';
    return'C';
}

function rankColor(r){
    if(r==='SS')return'#ff00ff';
    if(r==='S')return'#ffd700';
    if(r==='A')return'#43e97b';
    if(r==='B')return'#4facfe';
    return'#aaa';
}

function hitNote(col){
    if(G.state!==STATE_PLAYING)return;
    let hitIdx=-1;
    let bestDist=Infinity;
    for(let i=0;i<G.notes.length;i++){
        const n=G.notes[i];
        if(n.col!==col||n.hit||n.missed)continue;
        const dist=Math.abs(n.y-JUDGE_LINE_Y);
        if(dist<GOOD_RANGE+NOTE_H/2 && dist<bestDist){
            bestDist=dist;hitIdx=i;
        }
    }
    if(hitIdx===-1)return;
    const n=G.notes[hitIdx];
    const dist=Math.abs(n.y-JUDGE_LINE_Y);
    let pts=0,judge='',jcolor='';
    if(dist<=PERFECT_RANGE){
        pts=100;judge='PERFECT!';jcolor='#ffd700';
        G.perfectCount++;G.hp=Math.min(MAX_HP,G.hp+0.5);
        sfxPerfect();
    }else if(dist<=GOOD_RANGE){
        pts=50;judge='GOOD';jcolor='#43e97b';
        G.goodCount++;
        sfxGood();
    }else{
        return;
    }
    n.hit=true;
    G.combo++;
    G.maxCombo=Math.max(G.maxCombo,G.combo);
    if(G.combo>=300)G.comboMult=3;
    else if(G.combo>=100)G.comboMult=2;
    else G.comboMult=1;
    pts*=G.comboMult;
    if(G.feverMode)pts=Math.floor(pts*1.5);
    G.score+=pts;
    G.totalNotesHit++;
    addParticles(col*COL_W+COL_W/2,JUDGE_LINE_Y,jcolor,judge==='PERFECT!'?18:10);
    addFlash(col*COL_W+COL_W/2,JUDGE_LINE_Y,jcolor);
    if(judge==='PERFECT!'){
        G.perfectChain++;
        if(G.perfectChain>=20&&!G.feverMode){
            G.feverMode=true;G.feverTimer=320;G.comboMult=Math.max(G.comboMult,3);
            G.bonusPopupText='🔥 狂热模式触发! 1.5倍分加成!';G.bonusPopupTimer=150;
            sfxSync();
        }
        G.lastPerfectChain=Math.max(G.lastPerfectChain,G.perfectChain);
    }else{G.perfectChain=0}
    checkComboMilestone();
    addJudgeEffect(col,judge+(G.comboMult>1?' x'+G.comboMult:'',jcolor);
    playTone(NOTE_FREQ[col],0.15,'sine',0.15);
    if(n.type==='hold'){
        n.holding=true;
        n.hitY=n.y;
        G.holdNotes[col]=n;
    }else{
        G.notes.splice(hitIdx,1);
    }
}

function missNote(n,idx){
    if(n.hit||n.missed)return;
    n.missed=true;
    G.missCount++;
    G.combo=0;G.comboMult=1;G.perfectChain=0;
    G.feverMode=false;G.feverTimer=0;
    G.hp=Math.max(0,G.hp-5);
    G.screenShake=10;
    addParticles(n.col*COL_W+COL_W/2,JUDGE_LINE_Y,'#ff4444',15);
    addJudgeEffect(n.col,'MISS','#ff4444');
    sfxMiss();
    G.notes.splice(idx,1);
    if(G.hp<=0){
        endGame(false);
    }
}

function updateHoldNotes(dt){
    for(let c=0;c<COLS;c++){
        const n=G.holdNotes[c];
        if(!n||!n.holding)continue;
        if(!G.pointerDown[c]&&!G.keys[COL_KEYS[c]]){
            n.holding=false;
            G.holdNotes[c]=null;
            const idx=G.notes.indexOf(n);
            if(idx!==-1)G.notes.splice(idx,1);
            continue;
        }
        n.holdProgress+=dt;
        G.score+=Math.floor(0.5*G.comboMult);
        if(Math.floor(n.holdProgress/80)!==Math.floor((n.holdProgress-dt)/80)){
            sfxHold();
            addParticles(c*COL_W+COL_W/2,JUDGE_LINE_Y,'#ffd700',3);
        }
        if(n.holdProgress>=n.holdDuration/16){
            n.holding=false;
            G.holdNotes[c]=null;
            const idx=G.notes.indexOf(n);
            if(idx!==-1)G.notes.splice(idx,1);
        }
    }
}

function update(){
    if(G.state!==STATE_PLAYING)return;
    const dt=16;
    const song=SONGS[G.currentSong];
    G.songTime+=dt;
    G.songProgress=G.songTime/(song.duration*1000);
    G.noteSpeed=getNoteSpeed(G.currentSong)+G.songProgress*1.5;
    G.beatTimer+=dt;
    const beatInterval=60000/song.bpm;
    if(G.beatTimer>=beatInterval){
        G.beatTimer-=beatInterval;
        G.beatCount++;
        sfxBgmBeat(NOTE_FREQ[G.beatCount%4]);
    }
    G.spawnTimer+=dt;
    const spawnInterval=beatInterval*(0.8+Math.random()*0.6);
    if(G.spawnTimer>=spawnInterval){
        G.spawnTimer=0;
        spawnNote();
    }
    trySpawnFromPattern();
    for(let i=G.notes.length-1;i>=0;i--){
        const n=G.notes[i];
        if(!n.holding)n.y+=G.noteSpeed;
        if(n.y-JUDGE_LINE_Y>GOOD_RANGE+NOTE_H){
            if(!n.hit&&!n.holding){
                missNote(n,i);
            }
        }
    }
    updateHoldNotes(dt);
    for(let i=G.particles.length-1;i>=0;i--){
        const p=G.particles[i];
        p.x+=p.vx;p.y+=p.vy;
        p.vy+=0.25;p.life--;
        if(p.life<=0)G.particles.splice(i,1);
    }
    for(let i=G.judgeEffects.length-1;i>=0;i--){
        const e=G.judgeEffects[i];
        e.life--;e.scale=Math.max(1,e.scale-0.02);e.y-=0.5;
        if(e.life<=0)G.judgeEffects.splice(i,1);
    }
    updateTrails();
    updateFlashes();
    updateSongTransition(dt);
    updateAccuracy();
    if(G.feverMode){
        G.feverTimer--;
        if(G.feverTimer<=0){G.feverMode=false}
    }
    if(G.songTime>=song.duration*1000){
        if(G.currentSong<SONGS.length-1){
            G.currentSong++;
            G.songTransition=true;G.songTransitionTimer=1800;
            G.songTransitionText='✨ 第 '+(G.currentSong)+' 首完成！+500 ✨';
            G.score+=500;G.comboMilestoneShown=0;
            G.songTime=0;
            G.spawnTimer=0;
            G.notes=[];
            G.holdNotes=[null,null,null,null];
            G.noteSpeed=getNoteSpeed(G.currentSong);
            G.hp=Math.min(MAX_HP,G.hp+25);
            G.feverMode=false;G.feverTimer=0;G.perfectChain=0;
            G.patternQueue=buildSongPattern(G.currentSong);
            G.patternIdx=0;
        }else{
            G.victory=true;
            G.songTransition=true;G.songTransitionTimer=500;
            endGame(true);
        }
    }
}

function drawNotes(){
    for(const n of G.notes){
        if(n.hit&&!n.holding)continue;
        const x=n.col*COL_W+6;
        const w=COL_W-12;
        if(n.type==='hold'){
            const holdLen=Math.min(n.holdDuration/16*G.noteSpeed,400);
            const hy=n.holding?JUDGE_LINE_Y:n.y;
            const topY=hy-holdLen;
            const grad=ctx.createLinearGradient(x,topY,x,hy);
            grad.addColorStop(0,n.color+'44');
            grad.addColorStop(1,n.color+'cc');
            ctx.fillStyle=grad;
            roundRect(ctx,x,topY,w,holdLen,6);
            ctx.fill();
            ctx.strokeStyle=n.color;
            ctx.lineWidth=2;
            roundRect(ctx,x,topY,w,holdLen,6);
            ctx.stroke();
            if(n.holding&&n.holdDuration>0){
                const prog=Math.min(1,n.holdProgress/n.holdDuration);
                const progH=holdLen*prog;
                const pGrad=ctx.createLinearGradient(x,hy-progH,x,hy);
                pGrad.addColorStop(0,'#fff0');
                pGrad.addColorStop(0.7,n.color+'aa');
                pGrad.addColorStop(1,'#ffffaa');
                ctx.fillStyle=pGrad;
                roundRect(ctx,x+2,hy-progH,w-4,progH,4);
                ctx.fill();
                ctx.strokeStyle='#ffffff88';
                ctx.lineWidth=1;
                ctx.beginPath();
                ctx.moveTo(x+2,hy-progH);ctx.lineTo(x+w-2,hy-progH);
                ctx.stroke();
            }
            ctx.shadowBlur=8;ctx.shadowColor=n.color;
            ctx.fillStyle=n.color;
            roundRect(ctx,x,hy-NOTE_H/2,w,NOTE_H,6);
            ctx.fill();
            ctx.shadowBlur=0;
            ctx.fillStyle='#fff';
            ctx.font='bold 14px Arial';
            ctx.textAlign='center';ctx.textBaseline='middle';
            ctx.fillText('HOLD',x+w/2,hy);
            ctx.textBaseline='alphabetic';
        }else{
            ctx.shadowBlur=6;ctx.shadowColor=n.color;
            const grad=ctx.createLinearGradient(x,n.y,x+w,n.y+NOTE_H);
            grad.addColorStop(0,n.color);
            grad.addColorStop(1,shadeColor(n.color,-30));
            ctx.fillStyle=grad;
            roundRect(ctx,x,n.y-NOTE_H/2,w,NOTE_H,8);
            ctx.fill();
            ctx.shadowBlur=0;
            ctx.strokeStyle='rgba(255,255,255,0.5)';
            ctx.lineWidth=1;
            roundRect(ctx,x,n.y-NOTE_H/2,w,NOTE_H,8);
            ctx.stroke();
            ctx.fillStyle='rgba(255,255,255,0.3)';
            roundRect(ctx,x+4,n.y-NOTE_H/2+3,w-8,6,3);
            ctx.fill();
        }
    }
}

function shadeColor(hex,percent){
    const num=parseInt(hex.replace('#',''),16);
    const amt=Math.round(2.55*percent);
    const R=(num>>16)+amt;
    const G=(num>>8&0x00FF)+amt;
    const B=(num&0x0000FF)+amt;
    return'#'+(
        0x1000000+
        (R<255?R<1?0:R:255)*0x10000+
        (G<255?G<1?0:G:255)*0x100+
        (B<255?B<1?0:B:255)
    ).toString(16).slice(1);
}

function updateSongTransition(dt){
    if(!G.songTransition)return;
    G.songTransitionTimer-=dt;
    if(G.songTransitionTimer<=0){
        G.songTransition=false;
    }
}

function drawSongTransition(){
    if(!G.songTransition)return;
    const alpha=Math.min(1,G.songTransitionTimer/1200);
    const fadeAlpha=Math.sin((1-alpha)*Math.PI);
    ctx.fillStyle='rgba(0,0,0,'+(0.75*fadeAlpha)+')';
    ctx.fillRect(0,0,W,H);
    ctx.save();
    const scale=1+(1-alpha)*0.5;
    ctx.translate(W/2,H/2);
    ctx.scale(scale,scale);
    ctx.fillStyle='#fff';
    ctx.font='bold '+Math.floor(48*fadeAlpha)+'px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowBlur=30;ctx.shadowColor='#ffd700';
    ctx.fillText(G.songTransitionText,0,-10);
    ctx.shadowBlur=0;
    if(G.currentSong<SONGS.length){
        const s=SONGS[G.currentSong];
        ctx.font='bold 22px "Microsoft YaHei"';
        ctx.fillStyle=s.color1;
        ctx.fillText('下一首：'+s.name+'  BPM '+s.bpm,0,55);
    }
    ctx.restore();
    ctx.textBaseline='alphabetic';ctx.textAlign='left';
}

function checkComboMilestone(){
    const milestones=[50,100,200,300,500,700,1000];
    for(let i=G.comboMilestoneShown;i<milestones.length;i++){
        if(G.combo>=milestones[i]){
            G.comboMilestoneShown=i+1;
            const bonus=milestones[i]*10;
            G.score+=bonus;
            G.bonusPopupText='🎯 '+milestones[i]+' 连击达成! +'+bonus;
            G.bonusPopupTimer=120;
            G.screenShake=12;
            sfxSync();
            for(let c=0;c<COLS;c++)addParticles(c*COL_W+COL_W/2,JUDGE_LINE_Y,'#ffd700',30,1.8);
            break;
        }
    }
}

function updateTrails(){
    for(let c=0;c<COLS;c++){
        G.noteTrailTimer[c]++;
        if(G.noteTrailTimer[c]>=3){
            G.noteTrailTimer[c]=0;
            let hasNote=false;
            for(const n of G.notes){
                if(n.col===c&&!n.hit&&!n.missed&&n.y>60&&n.y<JUDGE_LINE_Y-20){
                    G.trails[c].push({y:n.y,color:n.color,life:25});
                    hasNote=true;
                    if(n.type==='hold')break;
                }
            }
        }
        for(let i=G.trails[c].length-1;i>=0;i--){
            G.trails[c][i].life--;
            G.trails[c][i].y+=G.noteSpeed*0.4;
            if(G.trails[c][i].life<=0)G.trails[c].splice(i,1);
        }
    }
}

function drawTrails(){
    for(let c=0;c<COLS;c++){
        const x=c*COL_W+COL_W/2;
        for(const t of G.trails[c]){
            const alpha=t.life/25;
            ctx.globalAlpha=alpha*0.35;
            const grad=ctx.createRadialGradient(x,t.y,0,x,t.y,28);
            grad.addColorStop(0,t.color);
            grad.addColorStop(1,t.color+'00');
            ctx.fillStyle=grad;
            ctx.beginPath();
            ctx.arc(x,t.y,28,0,Math.PI*2);
            ctx.fill();
        }
    }
    ctx.globalAlpha=1;
}

function updateFlashes(){

function updateAccuracy(){

function applyScreenShake(){

        const sy=(Math.random()-0.5)*G.screenShake;
        ctx.translate(sx,sy);

    for(let si=0;si<SONGS.length;si++){
        const s=SONGS[si];
        const bx=55+si*((W-110)/SONGS.length);
        const by=622;
        const bw=(W-130)/SONGS.length;
        const ig=ctx.createLinearGradient(bx,by,bx+bw,by+32);
        ig.addColorStop(0,s.color1+'66');
        ig.addColorStop(1,s.color2+'66');
        ctx.fillStyle=ig;
        roundRect(ctx,bx,by,bw,32,7);ctx.fill();
        ctx.strokeStyle=s.color1;
        ctx.lineWidth=1;
        roundRect(ctx,bx,by,bw,32,7);ctx.stroke();
        ctx.fillStyle='#fff';
        ctx.font='bold 12px "Microsoft YaHei"';
        ctx.textAlign='center';
        ctx.fillText(s.name,bx+bw/2,by+11);
        ctx.fillStyle='rgba(255,255,255,0.7)';
        ctx.font='10px Arial';
        ctx.fillText('BPM'+s.bpm+' · '+s.duration+'s',bx+bw/2,by+25);
    }
    ctx.textAlign='center';ctx.textBaseline='alphabetic';
    drawBtn(ctx,W/2-100,680,200,48,'🎮 开始游戏','startBtn',['#667eea','#764ba2']);
    ctx.fillStyle='#888';
    ctx.font='12px "Microsoft YaHei"';
    ctx.textAlign='center';
    ctx.fillText('按 Space / Enter 开始，Esc 暂停',W/2,H-14);
}

function drawPause(){
    ctx.fillStyle='rgba(0,0,0,0.8)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';
    ctx.font='bold 44px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('⏸ 暂停中',W/2,H/2-100);
    ctx.fillStyle='#aaa';
    ctx.font='16px "Microsoft YaHei"';
    ctx.fillText('休息一下，准备好继续挑战吧',W/2,H/2-55);
    drawBtn(ctx,W/2-90,H/2-10,180,50,'▶ 继续游戏','resumeBtn',['#43e97b','#38f9d7']);
    drawBtn(ctx,W/2-90,H/2+60,180,50,'🏠 返回菜单','exitBtn',['#f5576c','#f093fb']);
    ctx.textBaseline='alphabetic';
}

function drawOver(){
    ctx.fillStyle='rgba(0,0,0,0.85)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';
    ctx.font='bold 42px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowBlur=15;ctx.shadowColor=G.victory?'#ffd700':'#ff6b6b';
    ctx.fillText(G.victory?'🎉 完美通关！':'💔 演奏结束',W/2,90);
    ctx.shadowBlur=0;
    G.finalRank=calcRank();
    ctx.font='bold 80px Arial';
    ctx.fillStyle=rankColor(G.finalRank);
    ctx.shadowBlur=20;ctx.shadowColor=ctx.fillStyle;
    ctx.fillText(G.finalRank,W/2,200);
    ctx.shadowBlur=0;
    ctx.fillStyle='#aaa';
    ctx.font='16px "Microsoft YaHei"';
    ctx.fillText('本局评级',W/2,260);
    ctx.fillStyle='rgba(255,255,255,0.05)';
    roundRect(ctx,30,282,W-60,230,14);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.1)';
    roundRect(ctx,30,282,W-60,230,14);ctx.stroke();
    const acc=G.perfectCount+G.goodCount+G.missCount>0
        ?((G.perfectCount*100+G.goodCount*50)/((G.perfectCount+G.goodCount+G.missCount)*100)*100):100;
    const stats=[
        ['本局得分',G.score.toLocaleString(),'#ffd700'],
        ['历史最高',Math.max(G.highScore,G.score).toLocaleString(),'#4facfe'],
        ['最高连击',G.maxCombo+'','#4ecdc4'],
        ['总命中',G.totalNotesHit+'','#fa709a'],
        ['PERFECT',G.perfectCount+'','#ffd700'],
        ['GOOD',G.goodCount+'','#43e97b'],
        ['MISS',G.missCount+'','#ff6b6b'],
        ['准确率',acc.toFixed(1)+'%',acc>=90?'#ffd700':acc>=70?'#43e97b':'#ff6b6b'],
        ['连Perfect',G.lastPerfectChain+'','#c77dff']
    ];
    const cols=3;
    const cw=(W-80)/cols;
    for(let i=0;i<stats.length;i++){
        const col=i%cols,row=Math.floor(i/cols);
        const x=50+col*cw;
        const y=304+row*62;
        ctx.fillStyle='#888';
        ctx.font='12px "Microsoft YaHei"';
        ctx.textAlign='center';
        ctx.fillText(stats[i][0],x+cw/2,y);
        ctx.fillStyle=stats[i][2];
        ctx.font='bold 20px Arial';
        ctx.fillText(stats[i][1],x+cw/2,y+26);
    }
    if(G.score>G.highScore){
        ctx.fillStyle='#ffd700';
        ctx.font='bold 18px "Microsoft YaHei"';
        ctx.shadowBlur=10;ctx.shadowColor='#ffd700';
        ctx.fillText('🏆 新纪录达成！观众掌声雷动！',W/2,528);
        ctx.shadowBlur=0;
    }
    drawBtn(ctx,W/2-100,558,200,50,G.victory?'🎵 再挑战一次':'🔄 再玩一次','retryBtn',['#667eea','#764ba2']);
    drawBtn(ctx,W/2-100,620,200,50,'🏠 返回菜单','menuBtn',['#4facfe','#00f2fe']);
    ctx.textBaseline='alphabetic';
}

function draw(){
    if(G.state===STATE_MENU){drawMenu();return}
    ctx.save();
    applyScreenShake();
    drawBackground();
    drawFeverMode();
    drawTrails();
    drawTracks();
    drawNotes();
    drawJudgeLine();
    drawFlashes();
    drawParticles();
    drawJudgeEffects();
    drawHUD();
    drawStatsMini();
    drawBonusPopup();
    ctx.restore();
    drawSongTransition();
    if(G.state===STATE_PAUSE)drawPause();
    if(G.state===STATE_OVER)drawOver();
}

function startGame(){
    initState();
    sfxStart();
}

function endGame(win){
    G.state=STATE_OVER;
    const rank=calcRank();
    if(G.score>G.highScore){
        G.highScore=G.score;
        Storage.save('yf_highscore',G.highScore);
    }
    const rankOrder={'C':0,'B':1,'A':2,'S':3,'SS':4};
    if(rankOrder[rank]>rankOrder[G.bestRank]){
        G.bestRank=rank;
        Storage.save('yf_bestrank',G.bestRank);
    }
    if(win)sfxWin();else sfxMiss();
}

function togglePause(){
    if(G.state===STATE_PLAYING){G.state=STATE_PAUSE;sfxBtn()}
    else if(G.state===STATE_PAUSE){G.state=STATE_PLAYING;sfxBtn()}
}

function backToMenu(){
    G.state=STATE_MENU;
    sfxBtn();
}

function onPointerDown(p){
    if(G.state===STATE_MENU){
        if(hitBtn(p,'startBtn')){initAudio();startGame();return}
    }
    if(G.state===STATE_PAUSE){
        if(hitBtn(p,'resumeBtn')){togglePause();return}
        if(hitBtn(p,'exitBtn')){backToMenu();return}
    }
    if(G.state===STATE_OVER){
        if(hitBtn(p,'retryBtn')){initAudio();startGame();return}
        if(hitBtn(p,'menuBtn')){backToMenu();return}
    }
    if(G.state!==STATE_PLAYING)return;
    if(p.y>=JUDGE_LINE_Y){
        const col=Math.min(COLS-1,Math.floor(p.x/COL_W));
        if(col>=0&&col<COLS){
            G.pointerDown[col]=true;
            hitNote(col);
        }
    }
}

function onPointerUp(p){
    for(let c=0;c<COLS;c++)G.pointerDown[c]=false;
}

function onPointerMove(p){}

canvas.addEventListener('mousedown',function(e){e.preventDefault();onPointerDown(getPos(e))},{passive:false});
canvas.addEventListener('mousemove',function(e){onPointerMove(getPos(e))});
canvas.addEventListener('mouseup',function(e){onPointerUp(getPos(e))});
canvas.addEventListener('mouseleave',function(e){onPointerUp(getPos(e))});
canvas.addEventListener('touchstart',function(e){
    e.preventDefault();
    const rect=canvas.getBoundingClientRect();
    for(let i=0;i<e.touches.length;i++){
        const t=e.touches[i];
        const pp={x:(t.clientX-rect.left)/scale,y:(t.clientY-rect.top)/scale};
        onPointerDown(pp);
    }
},{passive:false});
canvas.addEventListener('touchmove',function(e){e.preventDefault()},{passive:false});
canvas.addEventListener('touchend',function(e){
    e.preventDefault();
    for(let c=0;c<COLS;c++)G.pointerDown[c]=false;
},{passive:false});
canvas.addEventListener('touchcancel',function(e){
    e.preventDefault();
    for(let c=0;c<COLS;c++)G.pointerDown[c]=false;
},{passive:false});

window.addEventListener('keydown',function(e){
    const k=e.key.toLowerCase();
    G.keys[k]=true;
    initAudio();
    if(k===' '||k==='enter'){
        e.preventDefault();
        if(G.state===STATE_MENU||G.state===STATE_OVER){initAudio();startGame()}
    }
    if(k==='escape'){
        if(G.state===STATE_PLAYING||G.state===STATE_PAUSE)togglePause();
    }
    if(G.state===STATE_PLAYING){
        const ci=COL_KEYS.indexOf(k);
        if(ci!==-1){e.preventDefault();hitNote(ci)}
    }
});
window.addEventListener('keyup',function(e){
    G.keys[e.key.toLowerCase()]=false;
});

setInterval(function(){
    update();
    draw();
},16);

var _sbtn=document.getElementById('start-game-btn');
_sbtn.addEventListener('click',function(){initAudio();startGame();this.style.display='none';});

})();
</script>

  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();

<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
