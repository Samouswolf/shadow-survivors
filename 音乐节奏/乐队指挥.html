<body>

<button id="start-game-btn" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:20px 40px;font-size:20px;background:linear-gradient(135deg,#ff6b9d,#c44569);color:white;border:none;border-radius:12px;cursor:pointer;z-index:999;font-weight:bold;display:none;">开始游戏</button>

<canvas id="c"></canvas>

<script>
if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
</script>
<script src="../game_core.js"></script>
<script>
(function(){
"use strict";

const W=480,H=720;
const CORNER_RADIUS=75;
const TARGET_RADIUS=30;
const PERFECT_MIN=0.9;
const PERFECT_MAX=1.1;
const GOOD_MAX=1.35;
const TOTAL_SEGMENTS=8;
const SEGMENT_DURATION=30000;
const INSTRUMENTS=['钢琴','鼓','贝斯','小提琴'];
const INSTRUMENT_ICONS=['🎹','🥁','🎸','🎻'];
const INSTRUMENT_COLORS=['#4facfe','#ff6b6b','#ffd93d','#a29bfe'];
const INSTRUMENT_GRADIENTS=[
    ['#4facfe','#00f2fe'],
    ['#ff6b6b','#ee5a6f'],
    ['#ffd93d','#f093fb'],
    ['#a29bfe','#6c5ce7']
];
const CORNER_KEYS=['7','9','1','3'];
const CORNER_NAMES=['左上(TL)','右上(TR)','左下(BL)','右下(BR)'];
const BPM_PROGRESSION=[80,90,100,110,120,125,130,140];

let audioCtx=null;
function initAudio(){
    if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
}
function playTone(freq,dur,type,vol){
    if(!audioCtx)return;
    try{
        const o=audioCtx.createOscillator();
        const g=audioCtx.createGain();
        o.type=type||'sine';
        o.frequency.value=freq;
        g.gain.value=vol||0.15;
        g.gain.setValueAtTime(g.gain.value,audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
        o.connect(g);g.connect(audioCtx.destination);
        o.start();o.stop(audioCtx.currentTime+dur);
    }catch(e){}
}
function playDrum(){
    if(!audioCtx)return;
    try{
        const o=audioCtx.createOscillator();
        const g=audioCtx.createGain();
        o.type='square';
        o.frequency.setValueAtTime(150,audioCtx.currentTime);
        o.frequency.exponentialRampToValueAtTime(40,audioCtx.currentTime+0.1);
        g.gain.setValueAtTime(0.25,audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.12);
        o.connect(g);g.connect(audioCtx.destination);
        o.start();o.stop(audioCtx.currentTime+0.12);
    }catch(e){}
}
function playInstrument(idx){
    switch(idx){
        case 0:playTone(523,0.22,'triangle',0.22);setTimeout(()=>playTone(659,0.18,'triangle',0.15),30);break;
        case 1:playDrum();break;
        case 2:playTone(131,0.3,'sawtooth',0.18);break;
        case 3:playTone(440,0.28,'sine',0.2);setTimeout(()=>playTone(554,0.2,'sine',0.14),40);break;
    }
}
function sfxStart(){playTone(523,0.12,'sine',0.2);setTimeout(()=>playTone(659,0.12,'sine',0.2),100);setTimeout(()=>playTone(784,0.12,'sine',0.2),200);setTimeout(()=>playTone(1047,0.25,'sine',0.22),300)}
function sfxPerfect(){playTone(1046,0.09,'sine',0.2);setTimeout(()=>playTone(1318,0.1,'sine',0.16),50)}
function sfxGood(){playTone(784,0.14,'sine',0.18)}
function sfxMiss(){playTone(120,0.25,'sawtooth',0.18)}
function sfxSync(){playTone(523,0.1,'square',0.2);setTimeout(()=>playTone(659,0.1,'square',0.2),80);setTimeout(()=>playTone(784,0.1,'square',0.2),160);setTimeout(()=>playTone(1047,0.2,'square',0.2),240)}
function sfxBeat(idx){switch(idx){case 0:playTone(440,0.08,'sine',0.1);break;case 1:playTone(330,0.08,'sine',0.1);break;case 2:playTone(262,0.08,'sine',0.1);break;case 3:playTone(392,0.08,'sine',0.1);break}}
function sfxBtn(){playTone(600,0.06,'sine',0.1)}
function sfxWin(){playTone(523,0.15,'triangle',0.2);setTimeout(()=>playTone(659,0.15,'triangle',0.2),150);setTimeout(()=>playTone(784,0.15,'triangle',0.2),300);setTimeout(()=>playTone(1047,0.15,'triangle',0.2),450);setTimeout(()=>playTone(1319,0.35,'triangle',0.25),600)}

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let scale=1;
function resize(){
    const r=W/H;
    let cw=window.innerWidth,ch=window.innerHeight;
    if(cw/ch>r){ch=cw/r}else{cw=ch*r}
    canvas.width=cw;canvas.height=ch;
    scale=cw/W;
    ctx.setTransform(scale,0,0,scale,0,0);
}
window.addEventListener('resize',resize);
resize();

function getCornerPos(idx){
    const margin=CORNER_RADIUS+50;
    const topY=margin+40;
    const bottomY=H-margin-60;
    switch(idx){
        case 0:return{x:margin,y:topY};
        case 1:return{x:W-margin,y:topY};
        case 2:return{x:margin,y:bottomY};
        case 3:return{x:W-margin,y:bottomY};
    }
    return{x:0,y:0};
}

function cornerHitTest(px,py){
    for(let i=0;i<4;i++){
        const c=getCornerPos(i);
        if(Math.hypot(px-c.x,py-c.y)<=CORNER_RADIUS+10)return i;
    }
    return -1;
}

const G={
    state:STATE_MENU,
    score:0,
    highScore:0,
    bestRank:'C',
    combo:0,
    maxCombo:0,
    comboMult:1,
    perfectCount:0,
    goodCount:0,
    missCount:0,
    notes:[],
    particles:[],
    judgeTexts:[],
    ripples:[],
    segmentIdx:0,
    segmentTime:0,
    totalTime:0,
    bpm:BPM_PROGRESSION[0],
    beatIdx:0,
    beatTimer:0,
    measureInSegment:0,
    btnRects:{},
    keys:{},
    pointerDown:false,
    pointerX:W/2,pointerY:H/2,
    batonAngle:0,
    lastHitTime:0,
    syncCounter:0,
    syncActive:false,
    syncTimer:0,
    sectionPatterns:[],
    currentPatternIdx:0,
    cornerGlow:[0,0,0,0],
    conductorPos:{x:W/2,y:H/2-30},
    finalRank:'C',
    segmentTransition:false,
    segmentTransitionTimer:0,
    segmentTransitionText:'',
    comboMilestoneShown:0,
    conductorTrail:[],
    flashes:[],
    screenShake:0,
    bonusPopupTimer:0,
    bonusPopupText:'',
    perfectChain:0,
    lastPerfectChain:0,
    feverMode:false,
    feverTimer:0,
    ringPulses:[[],[],[],[]],
    totalHits:0,
    accuracy:100,
    tempoMultiplier:1
};

G.highScore=parseInt(Storage.load('ydzh_highscore','0'));
G.bestRank=Storage.load('ydzh_bestrank','C');

function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
}

function drawBtn(ctx,x,y,w,h,text,name,color){
    G.btnRects[name]={x:x,y:y,w:w,h:h};
    const grad=ctx.createLinearGradient(x,y,x+w,y+h);
    if(color){grad.addColorStop(0,color[0]);grad.addColorStop(1,color[1])}
    else{grad.addColorStop(0,'#667eea');grad.addColorStop(1,'#764ba2')}
    ctx.fillStyle=grad;
    ctx.strokeStyle='rgba(255,255,255,0.4)';
    ctx.lineWidth=2;
    roundRect(ctx,x,y,w,h,10);
    ctx.fill();ctx.stroke();
    ctx.fillStyle='#fff';
    ctx.font='bold 18px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(text,x+w/2,y+h/2);
    ctx.textBaseline='alphabetic';
}

function hitBtn(p,name){
    const r=G.btnRects[name];
    return r && p.x>=r.x && p.x<=r.x+r.w && p.y>=r.y && p.y<=r.y+r.h;
}

function getPos(e){
    const rect=canvas.getBoundingClientRect();
    const t=e.touches?e.touches[0]:(e.changedTouches?e.changedTouches[0]:e);
    if(!t)return{x:0,y:0};
    return{x:(t.clientX-rect.left)/scale,y:(t.clientY-rect.top)/scale};
}

function RhythmNote(cornerIdx,startTime,lifeMs){
    this.corner=cornerIdx;
    this.startTime=startTime;
    this.lifeMs=lifeMs;
    this.elapsed=0;
    this.hit=false;
    this.missed=false;
    this.hitJudge='';
}

function generatePattern(segmentIdx){
    const measures=[];
    const complexity=Math.min(1,0.3+segmentIdx*0.09);
    for(let m=0;m<Math.ceil(SEGMENT_DURATION/(60000/G.bpm/4*4));m++){
        const measure=[];
        for(let beat=0;beat<16;beat++){
            const beatMask=[];
            for(let c=0;c<4;c++){
                let threshold=0.18+complexity*0.22;
                if(beat%4===0)threshold+=0.25;
                else if(beat%2===0)threshold+=0.1;
                if(segmentIdx>=5&&(beat===0||beat===8))threshold+=0.15;
                beatMask.push(Math.random()<threshold);
            }
            if(segmentIdx>=3&&m%2===0&&beat===0){
                for(let c=0;c<4;c++)if(Math.random()<0.5+complexity*0.3)beatMask[c]=true;
            }
            measure.push(beatMask);
        }
        measures.push(measure);
    }
    return measures;
}

function initState(){
    G.score=0;
    G.combo=0;
    G.maxCombo=0;
    G.comboMult=1;
    G.perfectCount=0;
    G.goodCount=0;
    G.missCount=0;
    G.notes=[];
    G.particles=[];
    G.judgeTexts=[];
    G.ripples=[];
    G.segmentIdx=0;
    G.segmentTime=0;
    G.totalTime=0;
    G.bpm=BPM_PROGRESSION[0];
    G.beatIdx=0;
    G.beatTimer=0;
    G.measureInSegment=0;
    G.pointerDown=false;
    G.pointerX=W/2;G.pointerY=H/2-30;
    G.batonAngle=0;
    G.syncCounter=0;
    G.syncActive=false;
    G.syncTimer=0;
    G.sectionPatterns=generatePattern(0);
    G.currentPatternIdx=0;
    G.cornerGlow=[0,0,0,0];
    G.conductorPos={x:W/2,y:H/2-30};
    G.state=STATE_PLAYING;
}

function addParticles(cornerIdx,color,count,extraSpeed){
    const c=getCornerPos(cornerIdx);
    for(let i=0;i<count;i++){
        const a=Math.random()*Math.PI*2;
        const s=(2+Math.random()*5)*(extraSpeed||1);
        G.particles.push({
            x:c.x,y:c.y,
            vx:Math.cos(a)*s,
            vy:Math.sin(a)*s,
            life:35+Math.random()*15,maxLife:50,
            size:2+Math.random()*5,
            color:color
        });
    }
}

function addJudgeText(cornerIdx,text,color){
    const c=getCornerPos(cornerIdx);
    G.judgeTexts.push({
        x:c.x,y:c.y,
        text:text,color:color,
        life:50,maxLife:50,
        scale:1.6,vy:-1
    });
}

function addRipple(cornerIdx,color){
    const c=getCornerPos(cornerIdx);
    G.ripples.push({
        x:c.x,y:c.y,
        radius:TARGET_RADIUS,
        maxRadius:CORNER_RADIUS+20,
        life:25,maxLife:25,
        color:color
    });
}

function calcRank(){
    const total=G.perfectCount+G.goodCount+G.missCount;
    if(total===0)return'C';
    const scoreRate=(G.perfectCount*100+G.goodCount*50)/(total*100);
    const comboRate=G.maxCombo/Math.max(1,total*1.5);
    const syncRate=Math.min(1,G.syncCounter/8);
    const finalRate=scoreRate*0.6+comboRate*0.25+syncRate*0.15;
    if(finalRate>=0.95)return'SS';
    if(finalRate>=0.88)return'S';
    if(finalRate>=0.75)return'A';
    if(finalRate>=0.60)return'B';
    return'C';
}

function rankColor(r){
    if(r==='SS')return'#ff00ff';
    if(r==='S')return'#ffd700';
    if(r==='A')return'#43e97b';
    if(r==='B')return'#4facfe';
    return'#bbb';
}

function updateSegmentTransition(dt){
    if(!G.segmentTransition)return;
    G.segmentTransitionTimer-=dt;
    if(G.segmentTransitionTimer<=0)G.segmentTransition=false;
}

function drawSegmentTransition(){
    if(!G.segmentTransition)return;
    const t=G.segmentTransitionTimer;
    const alpha=Math.min(1,t/1200);
    const fadeAlpha=Math.sin((1-alpha)*Math.PI);
    ctx.fillStyle='rgba(0,0,0,'+(0.72*fadeAlpha)+')';
    ctx.fillRect(0,0,W,H);
    ctx.save();
    const scale=1+(1-alpha)*0.45;
    ctx.translate(W/2,H/2-20);ctx.scale(scale,scale);
    ctx.fillStyle='#fff';
    ctx.font='bold '+Math.floor(44*fadeAlpha)+'px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowBlur=28;ctx.shadowColor='#ffd93d';
    ctx.fillText(G.segmentTransitionText,0,0);
    ctx.shadowBlur=0;
    if(G.segmentIdx<TOTAL_SEGMENTS){
        ctx.font='bold 20px "Microsoft YaHei"';
        ctx.fillStyle=INSTRUMENT_COLORS[G.segmentIdx%4];
        ctx.fillText('下一乐章 BPM '+BPM_PROGRESSION[Math.min(G.segmentIdx,BPM_PROGRESSION.length-1)],0,60);
    }
    ctx.restore();
    ctx.textAlign='left';ctx.textBaseline='alphabetic';
}

function checkComboMilestone(){
    const ms=[50,100,200,300,500,750,1000];
    for(let i=G.comboMilestoneShown;i<ms.length;i++){
        if(G.combo>=ms[i]){
            G.comboMilestoneShown=i+1;
            const bonus=ms[i]*12;
            G.score+=bonus;
            G.bonusPopupText='🎼 '+ms[i]+' 连击大师! +'+bonus;
            G.bonusPopupTimer=140;
            G.screenShake=14;
            sfxSync();
            for(let k=0;k<4;k++)addParticles(k,'#ff00ff',25,1.6);
            break;
        }
    }
}

function updateConductorTrail(){
    if(G.conductorTrail.length===0||
        Math.hypot(G.conductorTrail[G.conductorTrail.length-1].x-G.conductorPos.x,
                   G.conductorTrail[G.conductorTrail.length-1].y-G.conductorPos.y)>4){
        G.conductorTrail.push({x:G.conductorPos.x,y:G.conductorPos.y,life:22});
    }
    if(G.conductorTrail.length>35)G.conductorTrail.shift();
    for(let i=G.conductorTrail.length-1;i>=0;i--){
        G.conductorTrail[i].life--;
        if(G.conductorTrail[i].life<=0)G.conductorTrail.splice(i,1);
    }
}

function drawConductorTrail(){
    for(let i=0;i<G.conductorTrail.length;i++){
        const p=G.conductorTrail[i];
        const a=p.life/22;
        ctx.globalAlpha=a*0.55;
        const grad=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,24);
        grad.addColorStop(0,G.syncActive?'#ff00ff':'#ffd93d');
        grad.addColorStop(1,'rgba(255,255,255,0)');
        ctx.fillStyle=grad;
        ctx.beginPath();ctx.arc(p.x,p.y,24,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
}

function addFlashEffect(cornerIdx,color){
    const c=getCornerPos(cornerIdx);
    G.flashes.push({x:c.x,y:c.y,life:20,maxLife:20,color:color,size:65});
}

function updateFlashes(){
    for(let i=G.flashes.length-1;i>=0;i--){
        G.flashes[i].life--;
        G.flashes[i].size+=5;
        if(G.flashes[i].life<=0)G.flashes.splice(i,1);
    }
}

function drawFlashes(){

        ctx.fillStyle=grad;
        ctx.beginPath();ctx.arc(f.x,f.y,f.size,0,Math.PI*2);ctx.fill();

}

function addRingPulse(cornerIdx,color){
    const c=getCornerPos(cornerIdx);
    G.ringPulses[cornerIdx].push({radius:TARGET_RADIUS+4,life:30,maxLife:30,color:color});
}

function updateRingPulses(){
    for(let ci=0;ci<4;ci++){

            const rp=G.ringPulses[ci][i];
            rp.radius+=2.5;rp.life--;
            if(rp.life<=0)G.ringPulses[ci].splice(i,1);
        }

}

function drawRingPulses(){

function hitCorner(cornerIdx){
    if(G.state!==STATE_PLAYING||cornerIdx<0||cornerIdx>=4)return;
    G.cornerGlow[cornerIdx]=1;
    addRingPulse(cornerIdx,INSTRUMENT_COLORS[cornerIdx]);
    let bestIdx=-1;
    let bestDist=Infinity;
    for(let i=0;i<G.notes.length;i++){
        const n=G.notes[i];
        if(n.corner!==cornerIdx||n.hit||n.missed)continue;
        const ratio=n.elapsed/n.lifeMs;
        const distToTarget=Math.abs(ratio-1);
        if(distToTarget<GOOD_MAX-1&&distToTarget<bestDist){
            bestDist=distToTarget;bestIdx=i;
        }
    }
    if(bestIdx===-1){
        G.missCount++;G.combo=0;G.comboMult=1;G.perfectChain=0;
        G.feverMode=false;G.feverTimer=0;G.screenShake=10;
        addJudgeText(cornerIdx,'MISS','#ff4444');
        addParticles(cornerIdx,'#ff4444',8);
        sfxMiss();
        return;
    }
    const n=G.notes[bestIdx];
    const ratio=n.elapsed/n.lifeMs;
    let judge='',jcolor='',points=0;
    if(ratio>=PERFECT_MIN&&ratio<=PERFECT_MAX){
        judge='PERFECT!';jcolor='#ffd700';points=100;
        G.perfectCount++;G.perfectChain++;
        if(G.perfectChain>=15&&!G.feverMode){
            G.feverMode=true;G.feverTimer=360;G.comboMult=Math.max(G.comboMult,3);
            G.bonusPopupText='🔥 全场狂热!';G.bonusPopupTimer=150;
            sfxSync();
        }
        G.lastPerfectChain=Math.max(G.lastPerfectChain,G.perfectChain);
        sfxPerfect();
    }else if(ratio<=GOOD_MAX){
        judge='GOOD';jcolor='#43e97b';points=50;
        G.goodCount++;G.perfectChain=0;
        sfxGood();
    }else{
        judge='MISS';jcolor='#ff4444';points=0;
        G.missCount++;G.combo=0;G.comboMult=1;G.perfectChain=0;
        G.feverMode=false;G.feverTimer=0;G.screenShake=8;
        sfxMiss();
    }
    n.hit=true;n.hitJudge=judge;
    if(points>0){
        G.totalHits++;
        if(G.feverMode)points=Math.floor(points*1.5);
        G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);
        if(G.combo>=300)G.comboMult=3;
        else if(G.combo>=100)G.comboMult=2;
        else G.comboMult=1;
        G.score+=points*G.comboMult;
        addRipple(cornerIdx,jcolor);
        addFlashEffect(cornerIdx,jcolor);
        addParticles(cornerIdx,jcolor,judge==='PERFECT!'?18:11,judge==='PERFECT!'?1.4:1);
        playInstrument(cornerIdx);
        checkSync();
        checkComboMilestone();
    }else{
        G.combo=0;G.comboMult=1;
    }
    addJudgeText(cornerIdx,judge+(G.comboMult>1&&points>0?' x'+G.comboMult:''),jcolor);
}

function checkSync(){
    const now=Date.now();
    if(now-G.lastHitTime<220){
        G.syncCounter++;
        if(G.syncCounter>=3&&!G.syncActive){
            G.syncActive=true;
            G.syncTimer=140;
            G.score+=600;
            G.bonusPopupText='🎼 乐队同步! 完美齐奏 +600';
            G.bonusPopupTimer=140;
            for(let k=0;k<4;k++){
                addJudgeText(k,'SYNC!','#ff00ff');
                addParticles(k,'#ff00ff',18,1.6);
            }
            sfxSync();
        }
    }else{
        G.syncCounter=1;
    }
    G.lastHitTime=now;
}

function update(dt){
    if(G.state!==STATE_PLAYING)return;
    G.totalTime+=dt;
    G.segmentTime+=dt;
    if(G.syncActive){
        G.syncTimer--;
        if(G.syncTimer<=0)G.syncActive=false;
    }
    for(let i=0;i<4;i++){
        if(G.cornerGlow[i]>0)G.cornerGlow[i]=Math.max(0,G.cornerGlow[i]-0.04);
    }
    const beatInterval=60000/G.bpm;
    G.beatTimer+=dt;
    while(G.beatTimer>=beatInterval/4){
        G.beatTimer-=beatInterval/4;
        G.beatIdx++;
        const subBeat=G.beatIdx%16;
        if(subBeat===0){
            G.measureInSegment++;
            if(G.sectionPatterns[G.measureInSegment]){
                const m=G.sectionPatterns[G.measureInSegment];
                if(m[0]){
                    for(let c=0;c<4;c++){
                        if(m[0][c]){
                            G.notes.push(new RhythmNote(c,0,beatInterval*2));
                        }
                    }
                }
            }
        }
        if(subBeat<16&&G.sectionPatterns[G.measureInSegment]){
            const mask=G.sectionPatterns[G.measureInSegment][subBeat];
            if(mask){
                for(let c=0;c<4;c++){
                    if(mask[c]&&Math.random()<0.85){
                        const existing=G.notes.filter(n=>n.corner===c&&!n.hit&&!n.missed&&n.elapsed<beatInterval*0.3).length;
                        if(existing===0){
                            G.notes.push(new RhythmNote(c,0,beatInterval*1.8));
                        }
                    }
                }
            }
        }
        if(subBeat%4===0)sfxBeat(subBeat/4);
        if(G.beatIdx%8===0){
            const angleDir=Math.floor(G.beatIdx/8)%2===0?1:-1;
            G.batonAngle+=angleDir*0.3;
        }
    }
    G.conductorPos.x+=(G.pointerX-G.conductorPos.x)*0.12;
    G.conductorPos.y+=(G.pointerY-G.conductorPos.y)*0.12;
    G.batonAngle=Math.atan2(G.conductorPos.y-(H/2-30),G.conductorPos.x-W/2);
    for(let i=G.notes.length-1;i>=0;i--){
        const n=G.notes[i];
        n.elapsed+=dt;
        if(!n.hit&&!n.missed&&n.elapsed/n.lifeMs>GOOD_MAX+0.2){
            n.missed=true;
            G.missCount++;
            G.combo=0;G.comboMult=1;
            addJudgeText(n.corner,'MISS','#ff4444');
            addParticles(n.corner,'#ff4444',6);
            sfxMiss();
        }
        if(n.hit||n.missed){
            if(n.elapsed-n.lifeMs>500)G.notes.splice(i,1);
        }
    }
    for(let i=G.particles.length-1;i>=0;i--){
        const p=G.particles[i];
        p.x+=p.vx;p.y+=p.vy;
        p.vy+=0.15;p.vx*=0.98;
        p.life--;
        if(p.life<=0)G.particles.splice(i,1);
    }
    for(let i=G.judgeTexts.length-1;i>=0;i--){
        const t=G.judgeTexts[i];
        t.y+=t.vy;
        t.vy*=0.96;
        t.scale=Math.max(1,t.scale-0.02);
        t.life--;
        if(t.life<=0)G.judgeTexts.splice(i,1);
    }
    for(let i=G.ripples.length-1;i>=0;i--){
        const r=G.ripples[i];
        r.radius+=(r.maxRadius-r.radius)*0.18;
        r.life--;
        if(r.life<=0)G.ripples.splice(i,1);
    }
    updateConductorTrail();
    updateFlashes();
    updateRingPulses();
    updateSegmentTransition(dt);
    updateAccuracy();
    if(G.feverMode){
        G.feverTimer--;
        if(G.feverTimer<=0)G.feverMode=false;
    }
    if(G.segmentTime>=SEGMENT_DURATION){
        G.segmentTime=0;
        G.segmentIdx++;
        G.measureInSegment=-1;
        G.comboMilestoneShown=0;
        G.segmentTransition=true;G.segmentTransitionTimer=2000;
        G.segmentTransitionText='🎵 第 '+G.segmentIdx+' 乐章完成! +800 🎵';
        if(G.segmentIdx<TOTAL_SEGMENTS){
            G.bpm=BPM_PROGRESSION[Math.min(G.segmentIdx,BPM_PROGRESSION.length-1)];
            G.sectionPatterns=generatePattern(G.segmentIdx);
            G.score+=800;
            G.feverMode=false;G.feverTimer=0;G.perfectChain=0;
            for(let i=0;i<4;i++)addParticles(i,'#ffd700',24,1.5);
        }else{
            endGame(true);
        }
    }
}

function drawNotes(){
    for(const n of G.notes){
        if(n.hit||n.missed)continue;
        const c=getCornerPos(n.corner);
        const ratio=Math.min(GOOD_MAX+0.5,n.elapsed/n.lifeMs);
        const radius=CORNER_RADIUS+(TARGET_RADIUS-CORNER_RADIUS)*Math.min(1,ratio);
        const color=INSTRUMENT_COLORS[n.corner];
        let alpha=0.8;
        if(ratio<PERFECT_MIN-0.2)alpha=0.5;
        else if(ratio>=PERFECT_MIN&&ratio<=PERFECT_MAX)alpha=1;
        else if(ratio>PERFECT_MAX)alpha=Math.max(0.3,1-(ratio-PERFECT_MAX)*2);
        ctx.globalAlpha=alpha;
        ctx.strokeStyle=color;
        ctx.lineWidth=4;
        ctx.beginPath();ctx.arc(c.x,c.y,radius,0,Math.PI*2);ctx.stroke();
        ctx.lineWidth=2;
        ctx.strokeStyle='rgba(255,255,255,0.35)';
        ctx.beginPath();ctx.arc(c.x,c.y,radius-3,0,Math.PI*2);ctx.stroke();
        if(ratio>=PERFECT_MIN-0.15&&ratio<=GOOD_MAX){
            const perfectRatio=Math.abs(ratio-1);
            ctx.shadowBlur=15+Math.max(0,(1-perfectRatio*8))*20;
            ctx.shadowColor=color;
            ctx.strokeStyle=color;
            ctx.lineWidth=3;
            ctx.beginPath();ctx.arc(c.x,c.y,radius,0,Math.PI*2);ctx.stroke();
            ctx.shadowBlur=0;
        }
        ctx.globalAlpha=1;
    }
}

    roundRect(ctx,W/2-pw/2,52,pw,5,3);ctx.fill();
    const sg=ctx.createLinearGradient(W/2-pw/2,0,W/2+pw/2,0);
    sg.addColorStop(0,INSTRUMENT_GRADIENTS[G.segmentIdx%4][0]);
    sg.addColorStop(1,INSTRUMENT_GRADIENTS[G.segmentIdx%4][1]);
    ctx.fillStyle=sg;
    roundRect(ctx,W/2-pw/2,52,pw*segProg,5,3);ctx.fill();
    ctx.textAlign='right';
    ctx.fillStyle='#fff';
    ctx.font='13px "Microsoft YaHei"';
    ctx.fillText('连击',W-14,8);
    ctx.fillStyle=G.comboMult>1?'#ffd700':'#4ecdc4';
    ctx.font='bold 22px "Microsoft YaHei"';
    ctx.fillText(G.combo+(G.comboMult>1?' x'+G.comboMult:''),W-14,26);
    if(G.combo>=10&&G.state===STATE_PLAYING){
        ctx.save();
        ctx.textAlign='center';
        const comboY=H/2+140;
        const scale=Math.min(1.6,1+G.combo/300);
        ctx.translate(W/2,comboY);
        ctx.scale(scale,scale);
        ctx.fillStyle=G.comboMult>1?'#ffd700':'#4ecdc4';
        ctx.font='bold 34px "Microsoft YaHei"';
        ctx.shadowBlur=15;ctx.shadowColor=ctx.fillStyle;
        ctx.fillText(G.combo+' COMBO',0,0);
        if(G.comboMult>1){
            ctx.fillStyle='#ff00ff';
            ctx.shadowColor='#ff00ff';
            ctx.font='bold 20px "Microsoft YaHei"';
            ctx.fillText('x'+G.comboMult+' 倍分加成!',0,30);
        }
        ctx.restore();
        ctx.shadowBlur=0;
    }
    ctx.textAlign='left';ctx.textBaseline='alphabetic';
}

function drawMenu(){
    drawBackground();
    ctx.fillStyle='rgba(0,0,0,0.45)';
    ctx.fillRect(0,0,W,H);
    for(let i=0;i<4;i++){
        const c=getCornerPos(i);
        ctx.globalAlpha=0.3+Math.sin(Date.now()*0.003+i)*0.15;
        ctx.strokeStyle=INSTRUMENT_COLORS[i];
        ctx.lineWidth=3;
        ctx.beginPath();ctx.arc(c.x,c.y,CORNER_RADIUS,0,Math.PI*2);ctx.stroke();
        ctx.font='34px serif';
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(INSTRUMENT_ICONS[i],c.x,c.y);
    }
    ctx.globalAlpha=1;ctx.textBaseline='alphabetic';
    ctx.fillStyle='#fff';
    ctx.font='bold 50px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowBlur=25;ctx.shadowColor='#ff6b9d';
    ctx.fillText('🎼 乐队指挥',W/2,100);
    ctx.shadowBlur=0;
    ctx.font='17px "Microsoft YaHei"';
    ctx.fillStyle='#aaa';
    ctx.fillText('Yue Dui Zhi Hui',W/2,145);
    ctx.fillStyle='rgba(255,255,255,0.05)';
    roundRect(ctx,35,170,W-70,340,16);
    ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.12)';
    ctx.lineWidth=1;
    roundRect(ctx,35,170,W-70,340,16);ctx.stroke();
    ctx.fillStyle='#ffd93d';
    ctx.font='bold 20px "Microsoft YaHei"';
    ctx.textAlign='left';ctx.textBaseline='top';
    ctx.fillText('🎩 指挥守则',55,190);
    ctx.fillStyle='#ddd';
    ctx.font='15px "Microsoft YaHei"';
    const rules=[
        '🎯 4个角落=4种乐器，节奏圈从外缩小到中心',
        '👆 鼠标/触屏点击角落，或使用键盘 7/9/1/3',
        '🎯 大小接近判定圈时命中，Perfect=100 Good=50',
        '🎹 命中触发对应乐器音色，连续命中累加Combo',
        '🔥 100连击 x2倍，300连击 x3倍得分加成',
        '⚡ 3+乐器在短时间内同时命中=乐队同步奖励',
        '🎵 共8个乐章，BPM逐渐升高，坚持到最后！'
    ];
    for(let i=0;i<rules.length;i++){
        ctx.fillText(rules[i],55,228+i*38);
    }
    ctx.fillStyle='rgba(255,255,255,0.05)';
    roundRect(ctx,35,525,W-70,58,12);ctx.fill();
    ctx.fillStyle='#aaa';
    ctx.font='14px "Microsoft YaHei"';
    ctx.textAlign='left';
    ctx.fillText('🏆 最高得分：',55,547);
    ctx.fillStyle='#ffd93d';
    ctx.font='bold 20px Arial';
    ctx.fillText(G.highScore.toLocaleString(),160,543);
    ctx.fillStyle='#aaa';
    ctx.font='14px "Microsoft YaHei"';
    ctx.textAlign='right';
    ctx.fillText('最佳评级：',W-165,547);
    ctx.fillStyle=rankColor(G.bestRank);
    ctx.font='bold 24px Arial';
    ctx.fillText(G.bestRank,W-55,543);
    ctx.textAlign='center';ctx.textBaseline='alphabetic';
    drawBtn(ctx,W/2-100,608,200,56,'🎮 指挥乐队','startBtn',['#ff6b9d','#c44569']);
    ctx.fillStyle='#888';
    ctx.font='13px "Microsoft YaHei"';
    ctx.textAlign='center';
    ctx.fillText('Space / Enter 开始     Esc 暂停',W/2,688);
}

function drawPause(){
    ctx.fillStyle='rgba(0,0,0,0.82)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';
    ctx.font='bold 42px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('⏸ 指挥暂停',W/2,H/2-110);
    ctx.fillStyle='#aaa';
    ctx.font='16px "Microsoft YaHei"';
    ctx.fillText('乐手们在等待您的手势...',W/2,H/2-65);
    drawBtn(ctx,W/2-90,H/2-15,180,50,'▶ 继续指挥','resumeBtn',['#43e97b','#38f9d7']);
    drawBtn(ctx,W/2-90,H/2+55,180,50,'🏠 返回后台','exitBtn',['#f5576c','#f093fb']);
    ctx.textBaseline='alphabetic';
}

function drawOver(){
    ctx.fillStyle='rgba(0,0,0,0.88)';
    ctx.fillRect(0,0,W,H);
    const win=G.segmentIdx>=TOTAL_SEGMENTS||G.score>G.highScore;
    ctx.fillStyle='#fff';
    ctx.font='bold 42px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowBlur=16;ctx.shadowColor=win?'#ffd93d':'#ff6b6b';
    ctx.fillText(win?'🎊 演出成功！':'🎭 演出结束',W/2,85);
    ctx.shadowBlur=0;
    G.finalRank=calcRank();
    ctx.font='bold 86px Arial';
    ctx.fillStyle=rankColor(G.finalRank);
    ctx.shadowBlur=22;ctx.shadowColor=ctx.fillStyle;
    ctx.fillText(G.finalRank,W/2,195);
    ctx.shadowBlur=0;
    ctx.fillStyle='#aaa';
    ctx.font='16px "Microsoft YaHei"';
    ctx.fillText('演出评级',W/2,255);
    ctx.fillStyle='rgba(255,255,255,0.05)';
    roundRect(ctx,32,280,W-64,220,14);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.1)';
    roundRect(ctx,32,280,W-64,220,14);ctx.stroke();
    const row1=[
        ['本局得分',G.score.toLocaleString(),'#ffd700'],
        ['历史最高',Math.max(G.highScore,G.score).toLocaleString(),'#4facfe'],
        ['最高连击',G.maxCombo+'','#4ecdc4']
    ];
    for(let i=0;i<3;i++){
        const x=56+i*(W-112)/3;
        ctx.fillStyle='#888';
        ctx.font='13px "Microsoft YaHei"';
        ctx.textAlign='center';
        ctx.fillText(row1[i][0],x,308);
        ctx.fillStyle=row1[i][2];
        ctx.font='bold 22px Arial';
        ctx.fillText(row1[i][1],x,340);
    }
    const row2=[
        ['PERFECT',G.perfectCount+'','#ffd700'],
        ['GOOD',G.goodCount+'','#43e97b'],
        ['MISS',G.missCount+'','#ff6b6b'],
        ['同步次数',G.syncCounter+'','#ff00ff']
    ];
    for(let i=0;i<4;i++){
        const x=48+i*(W-96)/4;
        ctx.fillStyle='#888';
        ctx.font='12px "Microsoft YaHei"';
        ctx.textAlign='center';
        ctx.fillText(row2[i][0],x,392);
        ctx.fillStyle=row2[i][2];
        ctx.font='bold 20px Arial';
        ctx.fillText(row2[i][1],x,422);
    }
    ctx.textAlign='center';
    if(G.score>G.highScore){
        ctx.fillStyle='#ffd93d';
        ctx.font='bold 18px "Microsoft YaHei"';
        ctx.shadowBlur=12;ctx.shadowColor='#ffd93d';
        ctx.fillText('🏆 新纪录诞生！观众欢呼！',W/2,518);
        ctx.shadowBlur=0;
    }else if(win){
        ctx.fillStyle='#4ecdc4';
        ctx.font='bold 17px "Microsoft YaHei"';
        ctx.fillText('👏 完成全部8个乐章，精彩演出！',W/2,518);
    }
    drawBtn(ctx,W/2-100,548,200,50,win?'🎵 再演一场':'🔄 再来一次','retryBtn',['#ff6b9d','#c44569']);
    drawBtn(ctx,W/2-100,612,200,50,'🏠 返回后台','menuBtn',['#4facfe','#00f2fe']);
    ctx.textBaseline='alphabetic';
}

function draw(){
    if(G.state===STATE_MENU){drawMenu();return}
    ctx.save();
    applyScreenShake();
    drawBackground();
    drawFeverBackground();
    drawConductorTrail();
    drawCorners();
    drawNotes();
    drawRingPulses();
    drawConductor();
    drawRipples();
    drawFlashes();
    drawParticles();
    drawJudgeTexts();
    drawHUD();
    drawMiniStats();
    drawBonusPopup();
    ctx.restore();
    drawSegmentTransition();
    if(G.state===STATE_PAUSE)drawPause();
    if(G.state===STATE_OVER)drawOver();
}

function startGame(){
    initState();
    sfxStart();
}

function endGame(win){
    G.state=STATE_OVER;
    const rank=calcRank();
    if(G.score>G.highScore){
        G.highScore=G.score;
        Storage.save('ydzh_highscore',G.highScore);
    }
    const rankOrder={'C':0,'B':1,'A':2,'S':3,'SS':4};
    if(rankOrder[rank]>rankOrder[G.bestRank]){
        G.bestRank=rank;
        Storage.save('ydzh_bestrank',G.bestRank);
    }
    if(win)sfxWin();else sfxMiss();
}

function togglePause(){
    if(G.state===STATE_PLAYING){G.state=STATE_PAUSE;sfxBtn()}
    else if(G.state===STATE_PAUSE){G.state=STATE_PLAYING;sfxBtn()}
}

function backToMenu(){
    G.state=STATE_MENU;
    sfxBtn();
}

function onPointerDown(p){
    if(G.state===STATE_MENU){
        if(hitBtn(p,'startBtn')){initAudio();startGame();return}
    }
    if(G.state===STATE_PAUSE){
        if(hitBtn(p,'resumeBtn')){togglePause();return}
        if(hitBtn(p,'exitBtn')){backToMenu();return}
    }
    if(G.state===STATE_OVER){
        if(hitBtn(p,'retryBtn')){initAudio();startGame();return}
        if(hitBtn(p,'menuBtn')){backToMenu();return}
    }
    G.pointerDown=true;
    G.pointerX=p.x;G.pointerY=p.y;
    if(G.state!==STATE_PLAYING)return;
    const ci=cornerHitTest(p.x,p.y);
    if(ci!==-1){hitCorner(ci)}
}

function onPointerUp(p){
    G.pointerDown=false;
}

function onPointerMove(p){
    G.pointerX=p.x;G.pointerY=p.y;
}

canvas.addEventListener('mousedown',function(e){e.preventDefault();onPointerDown(getPos(e))},{passive:false});
canvas.addEventListener('mousemove',function(e){onPointerMove(getPos(e))});
canvas.addEventListener('mouseup',function(e){onPointerUp(getPos(e))});
canvas.addEventListener('mouseleave',function(e){onPointerUp(getPos(e))});
canvas.addEventListener('touchstart',function(e){
    e.preventDefault();
    const rect=canvas.getBoundingClientRect();
    for(let i=0;i<e.touches.length;i++){
        const t=e.touches[i];
        const pp={x:(t.clientX-rect.left)/scale,y:(t.clientY-rect.top)/scale};
        if(i===0){G.pointerX=pp.x;G.pointerY=pp.y;onPointerDown(pp)}
        else{
            const ci=cornerHitTest(pp.x,pp.y);
            if(ci!==-1)hitCorner(ci);
        }
    }
},{passive:false});
canvas.addEventListener('touchmove',function(e){
    e.preventDefault();
    const rect=canvas.getBoundingClientRect();
    if(e.touches.length>0){
        const t=e.touches[0];
        G.pointerX=(t.clientX-rect.left)/scale;
        G.pointerY=(t.clientY-rect.top)/scale;
    }
},{passive:false});
canvas.addEventListener('touchend',function(e){
    e.preventDefault();
    G.pointerDown=false;
},{passive:false});
canvas.addEventListener('touchcancel',function(e){
    e.preventDefault();
    G.pointerDown=false;
},{passive:false});

window.addEventListener('keydown',function(e){
    const k=e.key.toLowerCase();
    G.keys[k]=true;
    initAudio();
    if(k===' '||k==='enter'){
        e.preventDefault();
        if(G.state===STATE_MENU||G.state===STATE_OVER){initAudio();startGame()}
    }
    if(k==='escape'){
        if(G.state===STATE_PLAYING||G.state===STATE_PAUSE)togglePause();
    }
    if(G.state===STATE_PLAYING){
        const keyMap={'7':0,'9':1,'1':2,'3':3};
        if(keyMap[k]!==undefined){e.preventDefault();hitCorner(keyMap[k])}
        else if(k==='q'){e.preventDefault();hitCorner(0)}
        else if(k==='w'||k==='e'){e.preventDefault();hitCorner(1)}
        else if(k==='a'||k==='z'){e.preventDefault();hitCorner(2)}
        else if(k==='s'||k==='x'||k==='c'){e.preventDefault();hitCorner(3)}
    }
});
window.addEventListener('keyup',function(e){
    G.keys[e.key.toLowerCase()]=false;
});

setInterval(function(){
    update(16);
    draw();
},16);

var _sbtn=document.getElementById('start-game-btn');
_sbtn.addEventListener('click',function(){initAudio();startGame();this.style.display='none';});

})();
</script>
