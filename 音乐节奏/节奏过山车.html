<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>节奏过山车</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(180deg, #0a0e2e 0%, #1a144e 40%, #4a1a5e 80%, #5a2a2e 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 10px; color: #fff; overflow-x: hidden; }
        #wrap { width: 100%; max-width: 540px; display: flex; flex-direction: column; gap: 10px; }
        .hud { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; background: rgba(120,180,255,0.1); border-radius: 14px; border: 1px solid rgba(120,180,255,0.3); backdrop-filter: blur(8px); }
        .hud-l { display: flex; flex-direction: column; gap: 3px; }
        .gt { font-size: 20px; font-weight: bold; background: linear-gradient(90deg, #4facfe 0%, #00f2fe 50%, #43e97b 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .ht { font-size: 12px; color: rgba(255,255,255,0.55); }
        .hud-r { text-align: right; }
        .sl { font-size: 11px; color: rgba(255,255,255,0.45); }
        .sv { font-size: 28px; font-weight: bold; color: #4facfe; line-height: 1; text-shadow: 0 0 15px rgba(79,172,254,0.6); }
        .mv { font-size: 14px; color: #43e97b; margin-top: 2px; }
        canvas { width: 100%; height: 580px; background: #0a0e2e; border-radius: 14px; border: 2px solid rgba(120,180,255,0.35); touch-action: none; display: block; box-shadow: inset 0 0 100px rgba(0,0,0,0.5); }
        .br { display: flex; gap: 10px; }
        .gb { flex: 1; padding: 14px; border: none; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; color: #fff; transition: transform 0.1s; }
        .gb:active { transform: scale(0.94); }
        .gbs { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .gbp { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); color: #333; }
        .gbh { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); color: #224; }
        .ad { width: 100%; height: 55px; background: linear-gradient(135deg, #4facfe55 0%, #00f2fe55 100%); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #fff; font-weight: bold; border: 1px solid rgba(255,255,255,0.15); }
        .ov { position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
        .ov-in { background: linear-gradient(145deg, #1a144e, #0a0e2e); padding: 28px 24px; border-radius: 20px; max-width: 400px; width: 100%; text-align: center; border: 1px solid rgba(79,172,254,0.35); box-shadow: 0 0 50px rgba(79,172,254,0.2); }
        .ov-in h2 { font-size: 26px; margin-bottom: 14px; background: linear-gradient(90deg, #4facfe, #00f2fe, #43e97b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .ov-in p { color: rgba(255,255,255,0.8); line-height: 1.8; margin-bottom: 10px; font-size: 14px; }
        .os { display: flex; justify-content: space-around; margin: 18px 0; padding: 15px; background: rgba(79,172,254,0.08); border-radius: 12px; }
        .osc { display: flex; flex-direction: column; gap: 4px; }
        .osn { font-size: 22px; font-weight: bold; color: #43e97b; text-shadow: 0 0 10px rgba(67,233,123,0.5); }
        .osl { font-size: 12px; color: rgba(255,255,255,0.5); }
        .ov-in button { margin-top: 10px; width: 100%; padding: 15px; font-size: 17px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; color: #fff; background: linear-gradient(135deg, #4facfe, #00f2fe); }
        .hdn { display: none !important; }
        .nr { color: #43e97b; font-size: 16px; font-weight: bold; animation: bl 0.8s infinite; margin: 8px 0; text-shadow: 0 0 12px rgba(67,233,123,0.7); }
        @keyframes bl { 50% { opacity: 0.4; } }
    /* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */
/* [BATCH-FIX:ad-components-css] */
.sponsor-btn{position:fixed;bottom:8px;left:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:2px 6px;border-radius:10px;font:10px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.sponsor-panel.show{display:flex}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.interstitial-ad.show{display:flex}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* [/BATCH-FIX:ad-components-css] */

/* [AD-FIX:responsive] */
@media (max-width:768px){.ad-banner-container{display:none!important}.sponsor-btn{transform:scale(.8);opacity:.6}}
/* [/AD-FIX:responsive] */
</style>
</head>
<body>
    <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div id="wrap">
        <div class="hud">
            <div class="hud-l">
                <div class="gt">🎢 节奏过山车</div>
                <div class="ht">最高分: <span id="hs">0</span></div>
            </div>
            <div class="hud-r">
                <div class="sl">里程分</div>
                <div class="sv" id="sc">0</div>
                <div class="mv" id="mv">🎯 完美 x0</div>
            </div>
        </div>
        <canvas id="cv" width="540" height="760"></canvas>
        <div class="br">
            <button class="gb gbs" id="bst">▶ 出发</button>
            <button class="gb gbp" id="bps">⏸ 暂停</button>
            <button class="gb gbh" id="bhp">❓ 玩法</button>
        </div>
        <div class="ad">🎢 跟随节奏，飞跃音符轨道！</div>
    </div>

    <div class="ov hdn" id="guide">
        <div class="ov-in">
            <h2>🎢 节奏过山车</h2>
            <p>🎵 过山车沿蜿蜒轨道极速前进</p>
            <p>👆 在<b>正确时机</b>点击屏幕<b>跳跃</b>穿越音符环</p>
            <p>⌨️ 键盘: <b>空格 / ↑ / W</b> 跳跃</p>
            <p>🎯 完美穿越获得连击，连续加速！</p>
            <p>💥 撞墙或漏掉3个音符环结束冒险</p>
            <button id="go">即刻启程</button>
        </div>
    </div>

    <div class="ov hdn" id="end">
        <div class="ov-in">
            <h2 id="et">冒险结束</h2>
            <div class="nr hdn" id="nr">🏆 新纪录！</div>
            <div class="os">
                <div class="osc"><div class="osn" id="es">0</div><div class="osl">里程分</div></div>
                <div class="osc"><div class="osn" id="ec">0</div><div class="osl">完美连击</div></div>
                <div class="osc"><div class="osn" id="ep">0</div><div class="osl">穿越环数</div></div>
            </div>
            <p id="ed" style="margin-bottom:14px;"></p>
            <button id="reb">再来一次</button>
        </div>
    </div>

    <div class="ov hdn" id="psov">
        <div class="ov-in">
            <h2>⏸ 暂停中</h2>
            <p>过山车临时停靠，准备好了吗？</p>
            <button id="rsb">继续旅程</button>
        </div>
    </div>

    <script>
        if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
        if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
        if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
        if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
    </script>
    <script src="../game_core.js"></script>
    <script>
    (function() {
        const GN = '节奏过山车';
        GameCore.init({ highScore: GN });
        const cv = document.getElementById('cv');
        const ctx = cv.getContext('2d');
        const W = cv.width, H = cv.height;
        const GROUND_Y = H - 120;
        const GRAVITY = 0.85;
        const JUMP_V = -17;

        let state = STATE_MENU;
        let cart = { x: 130, y: GROUND_Y, vy: 0, jumping: false, rot: 0, trail: [] };
        let rings = [];
        let stars = [];
        let clouds = [];
        let mountains = [];
        let particles = [];
        let score = 0, combo = 0, mCombo = 0;
        let ringsHit = 0, miss = 0;
        let speed = 4.2;
        let dist = 0;
        let bgOff = 0;
        let raf = null;
        let shake = 0;
        let jumpFlash = 0;

        const esc = document.getElementById('sc');
        const emv = document.getElementById('mv');
        const ehs = document.getElementById('hs');
        ehs.textContent = GameCore.highScore.get(GN);

        function Ring(x, y, r) { this.x = x; this.y = y; this.r = r; this.hit = false; this.missed = false; this.rot = Math.random() * Math.PI; }
        function Star(x, y, s) { this.x = x; this.y = y; this.s = s; this.phase = Math.random() * Math.PI * 2; }
        function Cloud(x, y, s) { this.x = x; this.y = y; this.s = s; }
        function Mountain(x, h, w) { this.x = x; this.h = h; this.w = w; this.c = Math.floor(Math.random() * 3); }
        function Particle(x, y, vx, vy, c, s, l) { this.x=x; this.y=y; this.vx=vx; this.vy=vy; this.c=c; this.s=s; this.l=l; this.maxL=l; }

        function initBg() {
            stars = []; clouds = []; mountains = [];
            for (let i = 0; i < 60; i++) stars.push(new Star(Math.random()*W, Math.random()*GROUND_Y*0.7, Math.random()*2+0.5));
            for (let i = 0; i < 6; i++) clouds.push(new Cloud(Math.random()*W, 40+Math.random()*140, 0.7+Math.random()*0.9));
            for (let i = 0; i < 8; i++) mountains.push(new Mountain(i*140 - 70, 100+Math.random()*100, 160+Math.random()*120));
        }

        function initGame() {
            rings = []; particles = [];
            cart.x = 130; cart.y = GROUND_Y; cart.vy = 0; cart.jumping = false; cart.rot = 0; cart.trail = [];
            score = 0; combo = 0; mCombo = 0; ringsHit = 0; miss = 0;
            speed = 4.2; dist = 0; bgOff = 0; shake = 0; jumpFlash = 0;
            let nx = W + 120;
            for (let i = 0; i < 12; i++) {
                const ry = GROUND_Y - 80 - Math.random() * 160;
                rings.push(new Ring(nx, ry, 36 + Math.random()*12));
                nx += 180 + Math.random() * 180;
            }
            initBg();
            h();
        }

        function h() {
            esc.textContent = score;
            emv.textContent = '🎯 连击 x' + combo;
            const hs = GameCore.highScore.get(GN);
            if (score > hs) ehs.textContent = score;
        }

        function jump() {
            if (state !== STATE_PLAYING) return;
            if (!cart.jumping && cart.y >= GROUND_Y - 1) {
                cart.vy = JUMP_V;
                cart.jumping = true;
                jumpFlash = 1;
                for (let k = 0; k < 10; k++) {
                    particles.push(new Particle(cart.x, cart.y+10, (Math.random()-0.5)*4, -Math.random()*2, '#ffcc66', 3+Math.random()*3, 25));
                }
            }
        }

        function addParticlesRing(x, y, c, n) {
            for (let k = 0; k < n; k++) {
                const a = Math.random()*Math.PI*2;
                const sp = 2 + Math.random()*5;
                particles.push(new Particle(x, y, Math.cos(a)*sp, Math.sin(a)*sp - 1, c, 2+Math.random()*4, 35));
            }
        }

        function checkRing(r) {
            if (r.hit || r.missed) return;
            const cx = cart.x + 5;
            const cy = cart.y - 5;
            const d = Math.hypot(cx - r.x, cy - r.y);
            if (d < r.r * 0.55) {
                r.hit = true;
                ringsHit++;
                let pts = 0, txt='', col='#fff';
                if (d < r.r * 0.22) { pts = 250; txt = 'PERFECT!'; col = '#ffff00'; combo++; }
                else if (d < r.r * 0.4) { pts = 150; txt = 'GREAT!'; col = '#00ff88'; combo++; }
                else { pts = 80; txt = 'GOOD'; col = '#fff'; combo++; }
                mCombo = Math.max(mCombo, combo);
                const mult = 1 + Math.min(2, combo * 0.05);
                pts = Math.floor(pts * mult);
                score += pts;
                speed = Math.min(9, speed + 0.04);
                addParticlesRing(r.x, r.y, col, 22);
                GameCore.highScore.set(GN, score);
                h();
                return;
            }
            if (r.x + r.r < cart.x - 30) {
                r.missed = true;
                miss++;
                combo = 0;
                shake = 10;
                h();
                if (miss >= 3) gO();
            }
        }

        function gO() {
            state = STATE_OVER;
            if (raf) cancelAnimationFrame(raf);
            raf = null;
            const isNew = GameCore.highScore.set(GN, score);
            document.getElementById('es').textContent = score;
            document.getElementById('ec').textContent = mCombo;
            document.getElementById('ep').textContent = ringsHit;
            document.getElementById('nr').classList.toggle('hdn', !isNew);
            let rank;
            if (score >= 12000) rank = '🏆 过山车之神';
            else if (score >= 7000) rank = '⭐ 极限大师';
            else if (score >= 3500) rank = '🎯 节奏高手';
            else rank = '🎢 新晋车手';
            document.getElementById('et').textContent = score >= 6000 ? '🎉 精彩冒险！' : '冒险结束';
            document.getElementById('ed').textContent = rank;
            document.getElementById('end').classList.remove('hdn');
        }

        function upd() {
            if (state !== STATE_PLAYING) return;
            cart.vy += GRAVITY;
            cart.y += cart.vy;
            if (cart.y >= GROUND_Y) {
                if (cart.jumping && cart.vy > 3) {
                    for (let k = 0; k < 6; k++) particles.push(new Particle(cart.x+(Math.random()-0.5)*20, GROUND_Y, (Math.random()-0.5)*3, -Math.random()*2, '#886644', 2+Math.random()*2, 20));
                }
                cart.y = GROUND_Y;
                cart.vy = 0;
                cart.jumping = false;
            }
            cart.rot = cart.jumping ? cart.vy * 0.015 : 0;
            cart.trail.push({ x: cart.x, y: cart.y, a: 1 });
            if (cart.trail.length > 12) cart.trail.shift();
            for (let i = 0; i < cart.trail.length; i++) cart.trail[i].a -= 0.07;
            dist += speed;
            score += Math.floor(speed * 0.3);
            speed = Math.min(9, 4.2 + Math.floor(dist / 4000) * 0.6);
            bgOff = (bgOff + speed * 0.3) % 10000;
            for (let i = 0; i < rings.length; i++) {
                rings[i].x -= speed;
                rings[i].rot += 0.02;
                checkRing(rings[i]);
            }
            rings = rings.filter(function(r) { return r.x > -200 && !r.missed; });
            const lastR = rings[rings.length - 1];
            if (!lastR || lastR.x < W + 80) {
                const baseX = lastR ? lastR.x + 180 + Math.random()*180 : W + 150;
                const baseY = GROUND_Y - 90 - Math.random() * 200;
                rings.push(new Ring(baseX, baseY, 36 + Math.random()*12));
                if (Math.random() < 0.35) {
                    rings.push(new Ring(baseX + 100, baseY - 60 - Math.random()*50, 32 + Math.random()*10));
                }
            }
            for (let i = 0; i < stars.length; i++) { stars[i].phase += 0.05; stars[i].x -= speed * 0.08; if (stars[i].x < -5) { stars[i].x = W + 5; stars[i].y = Math.random()*GROUND_Y*0.7; } }
            for (let i = 0; i < clouds.length; i++) { clouds[i].x -= speed * 0.18; if (clouds[i].x < -180) { clouds[i].x = W + 50; clouds[i].y = 40+Math.random()*140; } }
            for (let i = 0; i < mountains.length; i++) {
                mountains[i].x -= speed * 0.38;
                if (mountains[i].x + mountains[i].w < -50) {
                    mountains[i].x = W + Math.random()*100;
                    mountains[i].h = 100+Math.random()*100;
                    mountains[i].w = 160+Math.random()*120;
                    mountains[i].c = Math.floor(Math.random()*3);
                }
            }
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.l--;
                if (p.l <= 0) particles.splice(i, 1);
            }
            if (shake > 0) shake *= 0.85;
            if (jumpFlash > 0) jumpFlash -= 0.08;
            if (Math.floor(dist) % 20 < 5) h();
        }

        function drBg() {
            const g = ctx.createLinearGradient(0, 0, 0, H);
            g.addColorStop(0, '#0a0e2e');
            g.addColorStop(0.35, '#2a1a5e');
            g.addColorStop(0.75, '#5a2a5e');
            g.addColorStop(1, '#4a2030');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, W, H);
            ctx.save();
            for (let i = 0; i < stars.length; i++) {
                const s = stars[i];
                ctx.globalAlpha = 0.4 + Math.sin(s.phase)*0.4;
                ctx.fillStyle = '#ffffcc';
                ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, Math.PI*2); ctx.fill();
            }
            ctx.restore();
            for (let i = 0; i < mountains.length; i++) {
                const m = mountains[i];
                const colA = ['#2a1a5e', '#3a2a6e', '#4a2a5e'];
                const colB = ['#1a0e3e', '#2a1e4e', '#3a1e3e'];
                const mg = ctx.createLinearGradient(m.x, GROUND_Y - m.h, m.x, GROUND_Y);
                mg.addColorStop(0, colA[m.c]); mg.addColorStop(1, colB[m.c]);
                ctx.fillStyle = mg;
                ctx.beginPath();
                ctx.moveTo(m.x, GROUND_Y);
                ctx.lineTo(m.x + m.w*0.5, GROUND_Y - m.h);
                ctx.lineTo(m.x + m.w, GROUND_Y);
                ctx.closePath(); ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.6)';
                ctx.beginPath();
                ctx.moveTo(m.x + m.w*0.35, GROUND_Y - m.h*0.75);
                ctx.lineTo(m.x + m.w*0.5, GROUND_Y - m.h);
                ctx.lineTo(m.x + m.w*0.65, GROUND_Y - m.h*0.75);
                ctx.lineTo(m.x + m.w*0.5, GROUND_Y - m.h*0.6);
                ctx.closePath(); ctx.fill();
            }
            for (let i = 0; i < clouds.length; i++) {
                const c = clouds[i];
                ctx.fillStyle = 'rgba(200,200,255,0.25)';
                for (let b = 0; b < 5; b++) {
                    ctx.beginPath();
                    ctx.arc(c.x + b*22*c.s, c.y + (b%2)*10*c.s, 22*c.s, 0, Math.PI*2);
                    ctx.fill();
                }
            }
        }

        function drGround() {
            ctx.save();
            const gg = ctx.createLinearGradient(0, GROUND_Y, 0, H);
            gg.addColorStop(0, '#6a3a2a'); gg.addColorStop(1, '#3a1a0a');
            ctx.fillStyle = gg;
            ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
            ctx.strokeStyle = '#aa6644'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(0, GROUND_Y); ctx.lineTo(W, GROUND_Y); ctx.stroke();
            ctx.strokeStyle = 'rgba(255,180,100,0.4)'; ctx.lineWidth = 2;
            ctx.setLineDash([20, 16]);
            const dashOff = -(bgOff * 0.6) % 36;
            ctx.lineDashOffset = dashOff;
            ctx.beginPath(); ctx.moveTo(0, GROUND_Y + 30); ctx.lineTo(W, GROUND_Y + 30); ctx.stroke();
            ctx.setLineDash([]);
            for (let i = 0; i < 40; i++) {
                const x = ((i * 70 - bgOff * 1.5) % (W + 140)) - 70;
                ctx.fillStyle = 'rgba(200,120,60,0.35)';
                ctx.beginPath(); ctx.arc(x, GROUND_Y + 60 + (i%2)*30, 4, 0, Math.PI*2); ctx.fill();
            }
            ctx.restore();
        }

        function drRing(r) {
            ctx.save();
            ctx.translate(r.x, r.y);
            ctx.rotate(r.rot);
            if (r.hit) { ctx.globalAlpha = 0.4; ctx.scale(1.3, 1.3); }
            else if (r.missed) { ctx.globalAlpha = 0.2; }
            ctx.shadowColor = r.hit ? '#ffff00' : '#4facfe';
            ctx.shadowBlur = 25;
            ctx.strokeStyle = r.hit ? '#ffff00' : '#4facfe';
            ctx.lineWidth = 5;
            ctx.beginPath(); ctx.arc(0, 0, r.r, 0, Math.PI*2); ctx.stroke();
            ctx.strokeStyle = r.hit ? '#ffaa00' : '#00f2fe';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(0, 0, r.r - 8, 0, Math.PI*2); ctx.stroke();
            for (let s = 0; s < 8; s++) {
                const a = (s/8)*Math.PI*2;
                ctx.fillStyle = '#ffffff';
                ctx.beginPath(); ctx.arc(Math.cos(a)*r.r, Math.sin(a)*r.r, 3, 0, Math.PI*2); ctx.fill();
            }
            ctx.restore();
        }

        function drCart() {
            for (let i = 0; i < cart.trail.length; i++) {
                const tr = cart.trail[i];
                ctx.globalAlpha = Math.max(0, tr.a) * 0.4;
                ctx.fillStyle = '#4facfe';
                ctx.beginPath(); ctx.arc(tr.x, tr.y, 8 * tr.a, 0, Math.PI*2); ctx.fill();
            }
            ctx.globalAlpha = 1;
            ctx.save();
            ctx.translate(cart.x, cart.y);
            ctx.rotate(cart.rot);
            if (jumpFlash > 0) {
                ctx.globalAlpha = jumpFlash * 0.5;
                ctx.fillStyle = '#ffffff';
                ctx.beginPath(); ctx.arc(0, 0, 40, 0, Math.PI*2); ctx.fill();
                ctx.globalAlpha = 1;
            }
            ctx.shadowColor = '#4facfe'; ctx.shadowBlur = 20;
            const cg = ctx.createLinearGradient(0, -25, 0, 18);
            cg.addColorStop(0, '#ff6699'); cg.addColorStop(0.5, '#ff3366'); cg.addColorStop(1, '#cc1133');
            ctx.fillStyle = cg;
            ctx.beginPath();
            ctx.moveTo(-22, 5); ctx.lineTo(-18, -18); ctx.lineTo(18, -18); ctx.lineTo(24, 5); ctx.lineTo(20, 15); ctx.lineTo(-20, 15);
            ctx.closePath(); ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#aaddff';
            ctx.beginPath(); ctx.ellipse(0, -10, 12, 7, 0, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = '#334'; ctx.lineWidth = 1.5; ctx.stroke();
            ctx.fillStyle = '#222';
            ctx.beginPath(); ctx.arc(-14, 18, 6, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(14, 18, 6, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#888';
            ctx.beginPath(); ctx.arc(-14, 18, 2.5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(14, 18, 2.5, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#ffcc00';
            ctx.shadowColor = '#ffcc00'; ctx.shadowBlur = 10;
            ctx.beginPath(); ctx.arc(-20, -4, 2.5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(20, -4, 2.5, 0, Math.PI*2); ctx.fill();
            ctx.restore();
        }

        function drParticles() {
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                ctx.globalAlpha = Math.max(0, p.l / p.maxL);
                ctx.fillStyle = p.c;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.s * (p.l / p.maxL), 0, Math.PI*2); ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        function dr() {
            ctx.save();
            if (shake > 0.5) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
            drBg();
            drGround();
            for (let i = 0; i < rings.length; i++) drRing(rings[i]);
            drParticles();
            drCart();
            ctx.restore();
            if (combo >= 10) {
                ctx.save();
                ctx.shadowColor = '#43e97b'; ctx.shadowBlur = 25;
                ctx.fillStyle = '#43e97b';
                ctx.font = 'bold 52px Microsoft YaHei';
                ctx.textAlign = 'center';
                ctx.fillText(combo + ' COMBO', W/2, 90);
                ctx.restore();
            }
            ctx.font = '14px Microsoft YaHei';
            ctx.fillStyle = '#aaeeff';
            ctx.textAlign = 'right';
            ctx.fillText('速度: ' + speed.toFixed(1) + 'x', W - 16, 28);
            ctx.fillStyle = '#ffaaaa';
            ctx.fillText('失误: ' + miss + '/3', W - 16, 50);
            if (state === STATE_MENU) {
                ctx.fillStyle = 'rgba(0,0,0,0.65)';
                ctx.fillRect(0, 0, W, H);
                ctx.save();
                ctx.shadowColor = '#4facfe'; ctx.shadowBlur = 35;
                ctx.fillStyle = '#4facfe';
                ctx.font = 'bold 48px Microsoft YaHei';
                ctx.textAlign = 'center';
                ctx.fillText('节奏过山车', W/2, H/2 - 30);
                ctx.restore();
                ctx.fillStyle = '#ffffff';
                ctx.font = '18px Microsoft YaHei';
                ctx.fillText('点击"出发"开启冒险之旅', W/2, H/2 + 20);
            }
        }

        function lp() { upd(); dr(); raf = requestAnimationFrame(lp); }

        cv.addEventListener('mousedown', function() { jump(); });
        cv.addEventListener('touchstart', function(e) { jump(); }, { passive: true });
        document.addEventListener('keydown', function(e) {
            if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
                e.preventDefault(); jump();
            }
        });

        function sg() {
            initGame(); state = STATE_PLAYING;
            document.getElementById('guide').classList.add('hdn');
            document.getElementById('end').classList.add('hdn');
            document.getElementById('psov').classList.add('hdn');
            if (!raf) lp();
        }
        function pg() { if (state !== STATE_PLAYING) return; state = STATE_PAUSE; document.getElementById('psov').classList.remove('hdn'); }
        function rg() { if (state !== STATE_PAUSE) return; state = STATE_PLAYING; document.getElementById('psov').classList.add('hdn'); }

        document.getElementById('bst').addEventListener('click', function() { document.getElementById('guide').classList.remove('hdn'); });
        document.getElementById('bps').addEventListener('click', function() { if (state === STATE_PLAYING) pg(); else if (state === STATE_PAUSE) rg(); });
        document.getElementById('bhp').addEventListener('click', function() { document.getElementById('guide').classList.remove('hdn'); });
        document.getElementById('go').addEventListener('click', sg);
        document.getElementById('reb').addEventListener('click', sg);
        document.getElementById('rsb').addEventListener('click', rg);
        document.getElementById('start-game-btn').addEventListener('click', function() { document.getElementById('guide').classList.remove('hdn'); });

        GameCore.hints.showStartGuide(
            '🎢 <b>节奏过山车</b><br><br>🎵 过山车沿轨道飞驰<br>👆 点击屏幕跳跃穿越音符环<br>⌨️ 空格/↑/W 执行跳跃<br>🎯 完美穿越获取连击加成<br>💥 漏掉3环冒险结束！'
        );
        setTimeout(function() { document.getElementById('guide').classList.remove('hdn'); }, 100);
    })();
    </script>

      c.style.maxWidth = '100%';

      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {

  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };

})();
