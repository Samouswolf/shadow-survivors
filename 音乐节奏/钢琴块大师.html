<head>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 50%, #2d1b4e 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 10px; color: #fff; overflow-x: hidden; }
        #game-wrapper { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 10px; }
        .hud { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; background: rgba(255,255,255,0.08); border-radius: 14px; backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1); }
        .hud-left { display: flex; flex-direction: column; gap: 4px; }
        .game-title { font-size: 20px; font-weight: bold; background: linear-gradient(90deg, #ffd700, #ff6b9d); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .hs-text { font-size: 12px; color: rgba(255,255,255,0.6); }
        .hud-right { text-align: right; }
        .score-label { font-size: 11px; color: rgba(255,255,255,0.5); }
        .score-val { font-size: 28px; font-weight: bold; color: #ffd700; line-height: 1; }
        .combo-val { font-size: 14px; color: #4ecdc4; margin-top: 2px; }
        canvas { width: 100%; height: 560px; background: #0a0a1a; border-radius: 14px; border: 2px solid rgba(255,255,255,0.1); touch-action: none; display: block; }
        .ctrl-row { display: flex; gap: 10px; }
        .ctrl-btn { flex: 1; padding: 14px; border: none; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; color: #fff; transition: transform 0.1s; }
        .ctrl-btn:active { transform: scale(0.95); }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .btn-secondary { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .btn-info { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .ad-box { width: 100%; height: 55px; background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #333; font-weight: bold; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.88); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
        .overlay-inner { background: linear-gradient(145deg, #2a2a4a, #1a1a2e); padding: 30px 24px; border-radius: 20px; max-width: 400px; width: 100%; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        .overlay h2 { font-size: 26px; margin-bottom: 16px; background: linear-gradient(90deg, #ffd700, #ff6b9d); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .overlay p { color: rgba(255,255,255,0.8); line-height: 1.8; margin-bottom: 10px; font-size: 14px; }
        .overlay .stat-row { display: flex; justify-content: space-around; margin: 20px 0; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 12px; }
        .overlay .stat-col { display: flex; flex-direction: column; gap: 4px; }
        .overlay .stat-num { font-size: 24px; font-weight: bold; color: #ffd700; }
        .overlay .stat-lbl { font-size: 12px; color: rgba(255,255,255,0.5); }
        .overlay button { margin-top: 10px; width: 100%; padding: 16px; font-size: 17px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; color: #fff; background: linear-gradient(135deg, #f5576c, #f093fb); }
        .hidden { display: none !important; }
        .new-record { color: #ffd700; font-size: 16px; font-weight: bold; animation: blink 0.8s infinite; margin: 8px 0; }
        @keyframes blink { 50% { opacity: 0.4; } }

<body>
    <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div id="game-wrapper">
        <div class="hud">
            <div class="hud-left">
                <div class="game-title">🎹 钢琴块大师</div>
                <div class="hs-text">最高分: <span id="hs-val">0</span></div>
            </div>
            <div class="hud-right">
                <div class="score-label">得分</div>
                <div class="score-val" id="score-val">0</div>
                <div class="combo-val" id="combo-val">连击 x0</div>
            </div>
        </div>
        <canvas id="cv" width="480" height="720"></canvas>
        <div class="ctrl-row">
            <button class="ctrl-btn btn-primary" id="btn-start">▶ 开始</button>
            <button class="ctrl-btn btn-secondary" id="btn-pause">⏸ 暂停</button>
            <button class="ctrl-btn btn-info" id="btn-help">❓ 帮助</button>
        </div>
        <div class="ad-box">🎵 点击探索更多钢琴名曲</div>
    </div>

    <div class="overlay hidden" id="guide-overlay">
        <div class="overlay-inner">
            <h2>🎹 钢琴块大师</h2>
            <p>🎯 黑色琴键从上方下落</p>
            <p>👆 <b>点击/触摸</b>黑色块，千万别错过！</p>
            <p>⌨️ 键盘: <b>D F J K</b> 对应四列</p>
            <p>⚡ 连续命中获得连击加成</p>
            <p>💔 漏点或点错白块游戏结束</p>
            <button id="start-from-guide">开始挑战</button>
        </div>
    </div>

    <div class="overlay hidden" id="end-overlay">
        <div class="overlay-inner">
            <h2 id="end-title">游戏结束</h2>
            <div class="new-record hidden" id="new-rec">🏆 新纪录！</div>
            <div class="stat-row">
                <div class="stat-col"><div class="stat-num" id="end-score">0</div><div class="stat-lbl">本次得分</div></div>
                <div class="stat-col"><div class="stat-num" id="end-combo">0</div><div class="stat-lbl">最高连击</div></div>
                <div class="stat-col"><div class="stat-num" id="end-hs">0</div><div class="stat-lbl">历史最高</div></div>
            </div>
            <button id="restart-btn">再来一局</button>
        </div>
    </div>

    <div class="overlay hidden" id="pause-overlay">
        <div class="overlay-inner">
            <h2>⏸ 游戏暂停</h2>
            <p>休息一下，手指准备好了吗？</p>
            <button id="resume-btn">继续游戏</button>
        </div>
    </div>

    <script>
        if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
        if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
        if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
        if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
    </script>
    <script src="../game_core.js"></script>
    <script>
    (function() {
        const GAME_NAME = '钢琴块大师';
        GameCore.init({ highScore: GAME_NAME });

        const cv = document.getElementById('cv');
        const ctx = cv.getContext('2d');
        const W = cv.width, H = cv.height;
        const COLS = 4;
        const COL_W = W / COLS;
        const TILE_H = H / 4;

        let state = STATE_MENU;
        let tiles = [];
        let score = 0;
        let combo = 0;
        let maxCombo = 0;
        let speed = 3.5;
        let spawnTimer = 0;
        let spawnInterval = 55;
        let rafId = null;
        let missCount = 0;
        let particles = [];

        const elScore = document.getElementById('score-val');
        const elCombo = document.getElementById('combo-val');
        const elHs = document.getElementById('hs-val');

        elHs.textContent = GameCore.highScore.get(GAME_NAME);

        function Tile(col, row) {
            this.col = col;
            this.row = row;
            this.y = -TILE_H + row * TILE_H;
            this.clicked = false;
            this.missed = false;
            this.wrong = false;
            this.fadeOut = 0;
            this.flash = 0;
        }

        function spawnTile() {
            const col = Math.floor(Math.random() * COLS);
            const row = -1;
            tiles.push(new Tile(col, row));
        }

        function initGame() {
            tiles = [];
            particles = [];
            score = 0;
            combo = 0;
            maxCombo = 0;
            speed = 3.5;
            spawnTimer = 0;
            spawnInterval = 55;
            missCount = 0;
            for (let r = 0; r < 4; r++) {
                if (Math.random() < 0.85) {
                    const c = Math.floor(Math.random() * COLS);
                    const t = new Tile(c, r);
                    t.y = r * TILE_H;
                    tiles.push(t);
                }
            }
            updateHUD();
        }

        function updateHUD() {
            elScore.textContent = score;
            elCombo.textContent = '连击 x' + combo;
            const hs = GameCore.highScore.get(GAME_NAME);
            if (score > hs) elHs.textContent = score;
        }

        function addParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8 - 2,
                    life: 1,
                    size: 3 + Math.random() * 4,
                    color: color
                });
            }
        }

        function handleTap(col, rowClickY) {
            if (state !== STATE_PLAYING) return;
            let hitTile = null;
            let hitIdx = -1;
            for (let i = 0; i < tiles.length; i++) {
                const t = tiles[i];
                if (t.col === col && !t.clicked && !t.missed) {
                    if (rowClickY >= t.y && rowClickY <= t.y + TILE_H + TILE_H * 0.3) {
                        if (!hitTile || t.y > hitTile.y) {
                            hitTile = t;
                            hitIdx = i;
                        }
                    }
                }
            }
            if (hitTile) {
                hitTile.clicked = true;
                hitTile.flash = 1;
                score += 10 + Math.floor(combo / 5) * 2;
                combo++;
                maxCombo = Math.max(maxCombo, combo);
                speed += 0.02;
                spawnInterval = Math.max(22, 55 - Math.floor(score / 80));
                const px = col * COL_W + COL_W / 2;
                const py = hitTile.y + TILE_H / 2;
                addParticles(px, py, '#ffd700', 12);
                addParticles(px, py, '#ffffff', 6);
                GameCore.highScore.set(GAME_NAME, score);
                updateHUD();
            } else {
                const px = col * COL_W + COL_W / 2;
                const py = rowClickY;
                addParticles(px, py, '#ff4444', 18);
                gameOver(false);
            }
        }

        function gameOver(isWin) {
            state = STATE_OVER;
            if (rafId) cancelAnimationFrame(rafId);
            rafId = null;
            const finalScore = score;
            const isNew = GameCore.highScore.set(GAME_NAME, finalScore);
            document.getElementById('end-title').textContent = isWin ? '🎉 完美演奏！' : '💔 演奏中断';
            document.getElementById('end-score').textContent = finalScore;
            document.getElementById('end-combo').textContent = maxCombo;
            document.getElementById('end-hs').textContent = GameCore.highScore.get(GAME_NAME);
            document.getElementById('new-rec').classList.toggle('hidden', !isNew);
            document.getElementById('end-overlay').classList.remove('hidden');
        }

        function update() {
            if (state !== STATE_PLAYING) return;
            for (let i = tiles.length - 1; i >= 0; i--) {
                const t = tiles[i];
                t.y += speed;
                if (t.flash > 0) t.flash -= 0.06;
                if (t.clicked) {
                    t.fadeOut += 0.08;
                    if (t.fadeOut >= 1) tiles.splice(i, 1);
                    continue;
                }
                if (t.y > H) {
                    if (!t.missed && !t.clicked) {
                        t.missed = true;
                        missCount++;
                        combo = 0;
                        updateHUD();
                        const px = t.col * COL_W + COL_W / 2;
                        addParticles(px, H - 30, '#ff4444', 20);
                        if (missCount >= 3) {
                            tiles.splice(i, 1);
                            gameOver(false);
                            return;
                        }
                    }
                    tiles.splice(i, 1);
                }
            }
            spawnTimer++;
            if (spawnTimer >= spawnInterval) {
                spawnTimer = 0;
                if (tiles.filter(t => !t.clicked).length < 8) {
                    spawnTile();
                }
            }
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.3;
                p.life -= 0.025;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function draw() {
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, W, H);
            for (let c = 1; c < COLS; c++) {
                ctx.strokeStyle = 'rgba(255,255,255,0.08)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(c * COL_W, 0);
                ctx.lineTo(c * COL_W, H);
                ctx.stroke();
            }
            for (let i = 0; i < tiles.length; i++) {
                const t = tiles[i];
                const x = t.col * COL_W;
                const y = t.y;
                if (t.clicked) {
                    ctx.globalAlpha = Math.max(0, 1 - t.fadeOut);
                    ctx.fillStyle = '#4ecdc4';
                    ctx.fillRect(x + 3, y + 3, COL_W - 6, TILE_H - 6);
                    ctx.globalAlpha = 1;
                } else if (t.missed) {
                    ctx.fillStyle = '#ff4444';
                    ctx.fillRect(x + 3, y + 3, COL_W - 6, TILE_H - 6);
                } else {
                    const grad = ctx.createLinearGradient(x, y, x, y + TILE_H);
                    grad.addColorStop(0, '#3a3a5a');
                    grad.addColorStop(1, '#1a1a2e');
                    ctx.fillStyle = grad;
                    ctx.fillRect(x + 3, y + 3, COL_W - 6, TILE_H - 6);
                    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(x + 3, y + 3, COL_W - 6, TILE_H - 6);
                    if (t.flash > 0) {
                        ctx.globalAlpha = t.flash * 0.6;
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(x + 3, y + 3, COL_W - 6, TILE_H - 6);
                        ctx.globalAlpha = 1;
                    }
                }
            }
            const zoneY = H - TILE_H * 0.4;
            ctx.fillStyle = 'rgba(255, 215, 0, 0.08)';
            ctx.fillRect(0, zoneY, W, TILE_H * 0.4);
            ctx.strokeStyle = 'rgba(255, 215, 0, 0.4)';
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 6]);
            ctx.beginPath();
            ctx.moveTo(0, zoneY);
            ctx.lineTo(W, zoneY);
            ctx.stroke();
            ctx.setLineDash([]);
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            if (state === STATE_MENU) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = '#ffd700';
                ctx.font = 'bold 38px Microsoft YaHei';
                ctx.textAlign = 'center';
                ctx.fillText('准备开始', W / 2, H / 2 - 10);
                ctx.fillStyle = '#ffffff';
                ctx.font = '16px Microsoft YaHei';
                ctx.fillText('点击"开始"按钮进入', W / 2, H / 2 + 30);
            }
        }

        function loop() {
            update();
            draw();
            rafId = requestAnimationFrame(loop);
        }

        function canvasToCol(canvasX) {
            return Math.max(0, Math.min(COLS - 1, Math.floor(canvasX / COL_W)));
        }

        cv.addEventListener('mousedown', function(e) {
            const rect = cv.getBoundingClientRect();
            const sx = W / rect.width;
            const sy = H / rect.height;
            const x = (e.clientX - rect.left) * sx;
            const y = (e.clientY - rect.top) * sy;
            handleTap(canvasToCol(x), y);
        });

        cv.addEventListener('touchstart', function(e) {
            const rect = cv.getBoundingClientRect();
            const sx = W / rect.width;
            const sy = H / rect.height;
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                const x = (t.clientX - rect.left) * sx;
                const y = (t.clientY - rect.top) * sy;
                handleTap(canvasToCol(x), y);
            }
        }, { passive: true });

        const keyMap = { 'd': 0, 'f': 1, 'j': 2, 'k': 3, 'D': 0, 'F': 1, 'J': 2, 'K': 3 };
        document.addEventListener('keydown', function(e) {
            if (keyMap[e.key] !== undefined) {
                e.preventDefault();
                const col = keyMap[e.key];
                handleTap(col, H - TILE_H * 0.2);
            }
        });

        function startGame() {
            initGame();
            state = STATE_PLAYING;
            document.getElementById('guide-overlay').classList.add('hidden');
            document.getElementById('end-overlay').classList.add('hidden');
            document.getElementById('pause-overlay').classList.add('hidden');
            if (!rafId) loop();
        }

        function pauseGame() {
            if (state !== STATE_PLAYING) return;
            state = STATE_PAUSE;
            document.getElementById('pause-overlay').classList.remove('hidden');
        }

        function resumeGame() {
            if (state !== STATE_PAUSE) return;
            state = STATE_PLAYING;
            document.getElementById('pause-overlay').classList.add('hidden');
        }

        document.getElementById('btn-start').addEventListener('click', startGame);
        document.getElementById('btn-pause').addEventListener('click', function() {
            if (state === STATE_PLAYING) pauseGame();
            else if (state === STATE_PAUSE) resumeGame();
        });
        document.getElementById('btn-help').addEventListener('click', function() {
            document.getElementById('guide-overlay').classList.remove('hidden');
        });
        document.getElementById('start-from-guide').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);
        document.getElementById('resume-btn').addEventListener('click', resumeGame);
        document.getElementById('start-game-btn').addEventListener('click', function() {
            document.getElementById('guide-overlay').classList.remove('hidden');
        });

        GameCore.hints.showStartGuide(
            '🎹 <b>钢琴块大师</b><br><br>🎯 黑色琴键从上方落下<br>👆 点击或触摸黑色琴键<br>⌨️ 键盘 D F J K 控制四列<br>💔 错过或点错白块即结束<br>⚡ 连击加成获取高分！'
        );
        setTimeout(function() { document.getElementById('guide-overlay').classList.remove('hidden'); }, 100);
    })();
    </script>

<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>

    <p style="color:#ccc;font:16px 'Microsoft YaHei',sans-serif;margin-bottom:16px">广告加载中...</p>
    <button class="skip-btn" onclick="document.getElementById('batchInterstitialAd').classList.remove('show')">跳过 ⏭</button>
  </div>
</div>
<!-- [/BATCH-FIX:ad-components-html] -->
<!-- [BATCH-FIX:ad-components-js] -->
<script>
(function(){
  if (window.__batchFixAds) return;
  window.__batchFixAds = true;
  window.addEventListener('load', function() {
    var btn = document.getElementById('batchSponsorBtn');
    if (btn) btn.style.display = '';
  });
})();
</script>
<!-- [/BATCH-FIX:ad-components-js] -->
<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
</body>
</html>
