<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>音乐大师</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #101828 0%, #1a2440 50%, #2e1e50 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 10px; color: #fff; overflow-x: hidden; }
        #wrap { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 10px; }
        .hud { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; background: rgba(140,100,255,0.1); border-radius: 14px; border: 1px solid rgba(140,100,255,0.3); backdrop-filter: blur(8px); }
        .hud-l { display: flex; flex-direction: column; gap: 3px; }
        .gt { font-size: 20px; font-weight: bold; background: linear-gradient(90deg, #a78bfa, #f472b6, #60a5fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .ht { font-size: 12px; color: rgba(255,255,255,0.55); }
        .hud-r { text-align: right; }
        .sl { font-size: 11px; color: rgba(255,255,255,0.45); }
        .sv { font-size: 28px; font-weight: bold; color: #a78bfa; line-height: 1; text-shadow: 0 0 14px rgba(167,139,250,0.5); }
        .mv { font-size: 14px; color: #fbbf24; margin-top: 2px; }
        canvas { width: 100%; height: 580px; background: #0b0e1e; border-radius: 14px; border: 2px solid rgba(140,100,255,0.35); touch-action: none; display: block; box-shadow: inset 0 0 80px rgba(80,40,160,0.3); }
        .br { display: flex; gap: 10px; }
        .gb { flex: 1; padding: 14px; border: none; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; color: #fff; transition: transform 0.1s; }
        .gb:active { transform: scale(0.94); }
        .gbs { background: linear-gradient(135deg, #a78bfa 0%, #8b5cf6 100%); }
        .gbp { background: linear-gradient(135deg, #fb7185 0%, #f43f5e 100%); }
        .gbh { background: linear-gradient(135deg, #34d399 0%, #10b981 100%); }
        .ad { width: 100%; height: 55px; background: linear-gradient(135deg, #a78bfa44 0%, #f472b644 100%); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #fff; font-weight: bold; border: 1px solid rgba(255,255,255,0.15); }
        .ov { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
        .ov-in { background: linear-gradient(145deg, #1e2040, #0e102e); padding: 28px 24px; border-radius: 20px; max-width: 400px; width: 100%; text-align: center; border: 1px solid rgba(140,100,255,0.35); }
        .ov-in h2 { font-size: 26px; margin-bottom: 14px; background: linear-gradient(90deg, #a78bfa, #f472b6, #60a5fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .ov-in p { color: rgba(255,255,255,0.8); line-height: 1.8; margin-bottom: 10px; font-size: 14px; }
        .os { display: flex; justify-content: space-around; margin: 18px 0; padding: 15px; background: rgba(140,100,255,0.08); border-radius: 12px; }
        .osc { display: flex; flex-direction: column; gap: 4px; }
        .osn { font-size: 22px; font-weight: bold; color: #fbbf24; }
        .osl { font-size: 12px; color: rgba(255,255,255,0.5); }
        .ov-in button { margin-top: 10px; width: 100%; padding: 15px; font-size: 17px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; color: #fff; background: linear-gradient(135deg, #a78bfa, #8b5cf6); }
        .hdn { display: none !important; }
        .nr { color: #fbbf24; font-size: 16px; font-weight: bold; animation: bl 0.8s infinite; margin: 8px 0; }
        @keyframes bl { 50% { opacity: 0.4; } }
        .lv-row { display: flex; gap: 8px; margin: 14px 0; }
        .lv-btn { flex: 1; padding: 10px; border: 2px solid rgba(255,255,255,0.2); border-radius: 10px; background: transparent; color: #fff; font-size: 13px; cursor: pointer; font-weight: bold; }
        .lv-btn.active { background: linear-gradient(135deg, #a78bfa, #8b5cf6); border-color: transparent; }
    /* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */
/* [BATCH-FIX:ad-components-css] */
.sponsor-btn{position:fixed;bottom:8px;left:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:2px 6px;border-radius:10px;font:10px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.sponsor-panel.show{display:flex}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.interstitial-ad.show{display:flex}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* [/BATCH-FIX:ad-components-css] */

/* [AD-FIX:responsive] */
@media (max-width:768px){.ad-banner-container{display:none!important}.sponsor-btn{transform:scale(.8);opacity:.6}}
/* [/AD-FIX:responsive] */
</style>
</head>
<body>
    <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div id="wrap">
        <div class="hud">
            <div class="hud-l">
                <div class="gt">🎼 音乐大师</div>
                <div class="ht">最高分: <span id="hs">0</span></div>
            </div>
            <div class="hud-r">
                <div class="sl">演奏分</div>
                <div class="sv" id="sc">0</div>
                <div class="mv" id="mv">⭐ 评分等级</div>
            </div>
        </div>
        <canvas id="cv" width="520" height="760"></canvas>
        <div class="br">
            <button class="gb gbs" id="bst">▶ 演奏</button>
            <button class="gb gbp" id="bps">⏸ 暂停</button>
            <button class="gb gbh" id="bhp">❓ 指南</button>
        </div>
        <div class="ad">🎼 登上舞台，成就音乐大师之路</div>
    </div>

    <div class="ov hdn" id="guide">
        <div class="ov-in">
            <h2>🎼 音乐大师</h2>
            <p>🎵 六键音符从上方飘落</p>
            <p>👆 到达判定线时点击对应轨道</p>
            <p>⌨️ 键盘: <b>D F G H J K</b> 六键演奏</p>
            <div class="lv-row">
                <button class="lv-btn active" data-lv="easy">入门</button>
                <button class="lv-btn" data-lv="normal">进阶</button>
                <button class="lv-btn" data-lv="hard">大师</button>
            </div>
            <p id="lv-dsc">入门: 4键慢节奏，适合新手练习</p>
            <p>🏆 全连无失误，冲击SSS评价！</p>
            <button id="go">开始演奏</button>
        </div>
    </div>

    <div class="ov hdn" id="end">
        <div class="ov-in">
            <h2 id="et">演奏结束</h2>
            <div class="nr hdn" id="nr">🏆 打破纪录！</div>
            <div style="font-size:48px;font-weight:bold;margin:12px 0;" id="er">A</div>
            <div class="os">
                <div class="osc"><div class="osn" id="es">0</div><div class="osl">总分</div></div>
                <div class="osc"><div class="osn" id="ec">0</div><div class="osl">最高连击</div></div>
                <div class="osc"><div class="osn" id="ea">0%</div><div class="osl">准确率</div></div>
            </div>
            <div style="font-size:13px;color:rgba(255,255,255,0.7);line-height:1.8;margin-bottom:10px;" id="ed"></div>
            <button id="reb">再次挑战</button>
        </div>
    </div>

    <div class="ov hdn" id="psov">
        <div class="ov-in">
            <h2>⏸ 暂停中</h2>
            <p>聚光灯暗下，准备好再次登台？</p>
            <button id="rsb">继续演奏</button>
        </div>
    </div>

    <script>
        if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
        if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
        if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
        if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
    </script>
    <script src="../game_core.js"></script>
    <script>
    (function() {
        const GN = '音乐大师';
        GameCore.init({ highScore: GN });
        const cv = document.getElementById('cv');
        const ctx = cv.getContext('2d');
        const W = cv.width, H = cv.height;
        let TRACKS = 4;
        let trackColors = ['#ef4444', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6', '#ec4899'];
        const HIT_Y = H - 140;
        let TRACK_W, START_X;

        let state = STATE_MENU;
        let level = 'easy';
        let notes = [];
        let score = 0, combo = 0, mCombo = 0;
        let perfect = 0, great = 0, good = 0, missN = 0, totalN = 0;
        let st = 0, si = 60;
        let baseSpeed = 2.8;
        let raf = null;
        let fx = [];
        let laneFlash = [];
        let stageLights = 0;

        const esc = document.getElementById('sc');
        const emv = document.getElementById('mv');
        const ehs = document.getElementById('hs');
        ehs.textContent = GameCore.highScore.get(GN);

        const LVI = {
            easy:   { t: 4, sp: 2.4, si: 62, desc: '入门: 4键慢节奏，适合新手练习' },
            normal: { t: 5, sp: 3.2, si: 48, desc: '进阶: 5键中等速度，考验手速' },
            hard:   { t: 6, sp: 4.2, si: 34, desc: '大师: 6键高速密集，挑战极限！' }
        };

        function recalcLayout() {
            TRACK_W = Math.min(82, (W - 40) / TRACKS);
            START_X = (W - TRACK_W * TRACKS) / 2;
        }

        function Note(tr) { this.tr = tr; this.y = -36; this.hit = false; this.missed = false; this.judge = ''; this.long = Math.random() < 0.12 && level !== 'easy'; this.longY = 0; }

        function spawn() {
            let numNotes = 1;
            const r = Math.random();
            if (level === 'hard') numNotes = r < 0.28 ? 2 : (r < 0.08 ? 3 : 1);
            else if (level === 'normal') numNotes = r < 0.2 ? 2 : 1;
            else numNotes = r < 0.12 ? 2 : 1;
            const used = [];
            for (let i = 0; i < numNotes; i++) {
                let t;
                let tries = 0;
                do { t = Math.floor(Math.random() * TRACKS); tries++; } while (used.indexOf(t) >= 0 && tries < 10);
                if (used.indexOf(t) < 0) { used.push(t); notes.push(new Note(t)); totalN++; }
            }
        }

        function initGame() {
            const cfg = LVI[level];
            TRACKS = cfg.t; baseSpeed = cfg.sp; si = cfg.si;
            recalcLayout();
            notes = []; fx = [];
            score = 0; combo = 0; mCombo = 0;
            perfect = 0; great = 0; good = 0; missN = 0; totalN = 0;
            st = 0; stageLights = 0;
            laneFlash = new Array(TRACKS).fill(0);
            let initX = W + 60;
            for (let r = 0; r < 10; r++) {
                const t = Math.floor(Math.random() * TRACKS);
                const n = new Note(t);
                n.y = HIT_Y - 120 - r * (120 + baseSpeed * 15);
                notes.push(n); totalN++;
            }
            h();
        }

        function h() {
            esc.textContent = score;
            let lvTxt = 'F';
            if (totalN > 0) {
                const acc = (perfect * 100 + great * 80 + good * 50) / (totalN * 100);
                if (acc > 0.98 && missN === 0) lvTxt = '⭐ SSS';
                else if (acc > 0.95) lvTxt = '⭐ SS';
                else if (acc > 0.90) lvTxt = '⭐ S';
                else if (acc > 0.82) lvTxt = 'A';
                else if (acc > 0.70) lvTxt = 'B';
                else if (acc > 0.55) lvTxt = 'C';
            }
            emv.textContent = lvTxt + ' 连击' + combo;
            const hs = GameCore.highScore.get(GN);
            if (score > hs) ehs.textContent = score;
        }

        function addFx(x, y, col, txt, big) {
            fx.push({ x: x, y: y, vy: -1.8, a: 1, c: col, t: txt, s: big ? 28 : 20, isT: true });
        }
        function addBurst(x, y, col) {
            for (let k = 0; k < 16; k++) {
                const a = Math.random() * Math.PI * 2;
                const sp = 1 + Math.random() * 5;
                fx.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1, a: 1, c: col, s: 2 + Math.random() * 4, isT: false });
            }
        }

        function hitTrack(tr) {
            if (state !== STATE_PLAYING) return;
            if (tr < 0 || tr >= TRACKS) return;
            laneFlash[tr] = 1;
            let best = null, bd = 999, bi = -1;
            for (let i = 0; i < notes.length; i++) {
                const n = notes[i];
                if (n.tr !== tr || n.hit || n.missed) continue;
                const d = Math.abs(n.y - HIT_Y);
                if (d < 90 && d < bd) { bd = d; best = n; bi = i; }
            }
            const tx = START_X + tr * TRACK_W + TRACK_W / 2;
            if (best) {
                best.hit = true;
                let pts = 0, jdg = '', col = '#fff';
                if (bd < 18) { pts = 300; jdg = 'PERFECT'; col = '#fbbf24'; perfect++; }
                else if (bd < 40) { pts = 200; jdg = 'GREAT'; col = '#34d399'; great++; }
                else { pts = 100; jdg = 'GOOD'; col = '#60a5fa'; good++; }
                const bonus = Math.min(3, 1 + combo * 0.02);
                pts = Math.floor(pts * bonus);
                score += pts; combo++; mCombo = Math.max(mCombo, combo);
                addFx(tx, HIT_Y - 50, col, jdg, true);
                addFx(tx, HIT_Y - 20, trackColors[tr], '+' + pts, false);
                addBurst(tx, HIT_Y, col);
                GameCore.highScore.set(GN, score);
                h();
            } else {
                combo = 0; h();
            }
        }

        function gO() {
            state = STATE_OVER;
            if (raf) cancelAnimationFrame(raf);
            raf = null;
            const isNew = GameCore.highScore.set(GN, score);
            const denom = Math.max(1, totalN);
            const acc = Math.floor(((perfect * 100 + great * 80 + good * 50) / (denom * 100)) * 100);
            let grade = 'C';
            if (acc > 98 && missN === 0) grade = 'SSS';
            else if (acc > 95) grade = 'SS';
            else if (acc > 90) grade = 'S';
            else if (acc > 82) grade = 'A';
            else if (acc > 70) grade = 'B';
            const gradeCol = { SSS:'#fbbf24', SS:'#fcd34d', S:'#f59e0b', A:'#34d399', B:'#60a5fa', C:'#94a3b8' };
            document.getElementById('es').textContent = score;
            document.getElementById('ec').textContent = mCombo;
            document.getElementById('ea').textContent = acc + '%';
            const erEl = document.getElementById('er');
            erEl.textContent = grade;
            erEl.style.color = gradeCol[grade] || '#fff';
            erEl.style.textShadow = '0 0 25px ' + (gradeCol[grade] || '#fff');
            document.getElementById('nr').classList.toggle('hdn', !isNew);
            document.getElementById('ed').innerHTML =
                '🟡 Perfect: ' + perfect + ' &nbsp; 🟢 Great: ' + great + '<br>' +
                '🔵 Good: ' + good + ' &nbsp; 🔴 Miss: ' + missN;
            document.getElementById('et').textContent = grade === 'SSS' ? '🎉 完美无缺！' : (grade[0] === 'S' ? '🌟 精彩演奏！' : (acc >= 70 ? '👏 不错的演奏' : '演奏结束'));
            document.getElementById('end').classList.remove('hdn');
        }

        function upd() {
            if (state !== STATE_PLAYING) return;
            stageLights += 0.04;
            for (let i = 0; i < TRACKS; i++) if (laneFlash[i] > 0) laneFlash[i] -= 0.09;
            for (let i = notes.length - 1; i >= 0; i--) {
                const n = notes[i];
                n.y += baseSpeed;
                if (n.long) { /* future expansion */ }
                if (n.hit) { if (n.y > HIT_Y + 80) notes.splice(i, 1); continue; }
                if (n.y > HIT_Y + 80 && !n.missed) {
                    n.missed = true; missN++; combo = 0;
                    const tx = START_X + n.tr * TRACK_W + TRACK_W / 2;
                    addFx(tx, HIT_Y - 20, '#ef4444', 'MISS', false);
                    h();
                    if (missN >= Math.ceil(totalN * 0.4) && totalN > 40) { notes.splice(i, 1); gO(); return; }
                }
                if (n.y > H + 60) notes.splice(i, 1);
            }
            st++;
            if (st >= Math.floor(si)) { st = 0; if (notes.length < TRACKS * 3) spawn(); }
            for (let i = fx.length - 1; i >= 0; i--) {
                const p = fx[i];
                if (p.isT) { p.y += p.vy; p.a -= 0.028; }
                else { p.x += p.vx || 0; p.y += p.vy || 0; p.vy = (p.vy || 0) + 0.12; p.a -= 0.038; }
                if (p.a <= 0) fx.splice(i, 1);
            }
        }

        function drBg() {
            const g = ctx.createLinearGradient(0, 0, 0, H);
            g.addColorStop(0, '#0a0e1e');
            g.addColorStop(0.5, '#141a38');
            g.addColorStop(1, '#1a0e2e');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, W, H);
            for (let i = 0; i < 30; i++) {
                const x = ((i * 47 + stageLights * 40) % (W + 100)) - 50;
                const y = HIT_Y - 50 + Math.sin(stageLights + i) * 80;
                ctx.globalAlpha = 0.15 + Math.sin(stageLights * 2 + i) * 0.08;
                ctx.fillStyle = trackColors[i % TRACKS];
                ctx.beginPath(); ctx.arc(x, y, 4 + (i % 3), 0, Math.PI * 2); ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        function drTracks() {
            for (let t = 0; t < TRACKS; t++) {
                const x = START_X + t * TRACK_W;
                const lf = laneFlash[t];
                ctx.fillStyle = lf > 0 ? trackColors[t] + '55' : 'rgba(255,255,255,0.03)';
                ctx.fillRect(x + 3, 0, TRACK_W - 6, HIT_Y + 80);
                if (lf > 0) {
                    ctx.globalAlpha = lf * 0.6;
                    ctx.fillStyle = trackColors[t];
                    ctx.fillRect(x + 3, HIT_Y - 40, TRACK_W - 6, 80);
                    ctx.globalAlpha = 1;
                }
                ctx.strokeStyle = 'rgba(255,255,255,0.12)';
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, HIT_Y + 80); ctx.stroke();
            }
            ctx.strokeStyle = 'rgba(255,255,255,0.2)';
            ctx.beginPath(); ctx.moveTo(START_X + TRACKS * TRACK_W, 0); ctx.lineTo(START_X + TRACKS * TRACK_W, HIT_Y + 80); ctx.stroke();
            ctx.fillStyle = 'rgba(251, 191, 36, 0.16)';
            ctx.fillRect(START_X - 4, HIT_Y - 32, TRACKS * TRACK_W + 8, 64);
            const hg = ctx.createLinearGradient(START_X, HIT_Y - 28, START_X, HIT_Y + 28);
            hg.addColorStop(0, 'rgba(251,191,36,0)');
            hg.addColorStop(0.5, 'rgba(251,191,36,0.85)');
            hg.addColorStop(1, 'rgba(251,191,36,0)');
            ctx.fillStyle = hg;
            ctx.fillRect(START_X - 2, HIT_Y - 4, TRACKS * TRACK_W + 4, 8);
            ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(START_X - 4, HIT_Y); ctx.lineTo(START_X + TRACKS * TRACK_W + 4, HIT_Y); ctx.stroke();
            for (let t = 0; t < TRACKS; t++) {
                const x = START_X + t * TRACK_W + TRACK_W / 2;
                ctx.save();
                ctx.shadowColor = trackColors[t]; ctx.shadowBlur = 18;
                ctx.fillStyle = trackColors[t];
                ctx.globalAlpha = 0.9;
                ctx.fillRect(START_X + t * TRACK_W + 8, HIT_Y + 16, TRACK_W - 16, 70);
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                const keys = ['D','F','G','H','J','K'];
                ctx.fillText(keys[t], x, HIT_Y + 58);
                ctx.restore();
            }
        }

        function drNote(n) {
            const x = START_X + n.tr * TRACK_W;
            const c = trackColors[n.tr];
            ctx.save();
            if (n.missed) ctx.globalAlpha = 0.35;
            else if (n.hit) ctx.globalAlpha = 0.45;
            ctx.shadowColor = c; ctx.shadowBlur = 20;
            const grad = ctx.createLinearGradient(x, n.y - 18, x, n.y + 18);
            grad.addColorStop(0, '#ffffff');
            grad.addColorStop(0.3, c);
            grad.addColorStop(1, c);
            ctx.fillStyle = grad;
            const nw = TRACK_W - 14;
            roundRect(x + 7, n.y - 16, nw, 32, 8);
            ctx.fill();
            ctx.strokeStyle = '#ffffffcc';
            ctx.lineWidth = 2;
            roundRect(x + 7, n.y - 16, nw, 32, 8);
            ctx.stroke();
            ctx.restore();
        }

        function roundRect(x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        function drFx() {
            for (let i = 0; i < fx.length; i++) {
                const p = fx[i];
                ctx.globalAlpha = Math.max(0, p.a);
                if (p.isT && p.t) {
                    ctx.font = 'bold ' + p.s + 'px Microsoft YaHei';
                    ctx.textAlign = 'center';
                    ctx.fillStyle = p.c;
                    ctx.shadowColor = p.c; ctx.shadowBlur = 10;
                    ctx.fillText(p.t, p.x, p.y);
                    ctx.shadowBlur = 0;
                } else {
                    ctx.fillStyle = p.c;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, Math.PI * 2); ctx.fill();
                }
            }
            ctx.globalAlpha = 1;
        }

        function dr() {
            drBg();
            drTracks();
            notes.sort(function(a, b) { return a.y - b.y; });
            for (let i = 0; i < notes.length; i++) drNote(notes[i]);
            drFx();
            if (combo >= 20) {
                ctx.save();
                ctx.shadowColor = '#fbbf24'; ctx.shadowBlur = 25;
                ctx.fillStyle = '#fbbf24';
                ctx.font = 'bold 56px Microsoft YaHei';
                ctx.textAlign = 'center';
                ctx.fillText(combo + ' COMBO', W/2, 90);
                ctx.restore();
            } else if (combo >= 10) {
                ctx.save();
                ctx.shadowColor = '#a78bfa'; ctx.shadowBlur = 18;
                ctx.fillStyle = '#e9d5ff';
                ctx.font = 'bold 40px Microsoft YaHei';
                ctx.textAlign = 'center';
                ctx.fillText(combo + ' COMBO', W/2, 80);
                ctx.restore();
            }
            ctx.font = '14px Microsoft YaHei';
            ctx.fillStyle = '#fca5a5';
            ctx.textAlign = 'right';
            ctx.fillText('Miss: ' + missN, W - 14, 28);
            ctx.fillStyle = '#fde68a';
            ctx.fillText('Perfect: ' + perfect, W - 14, 48);
            if (state === STATE_MENU) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, W, H);
                ctx.save();
                ctx.shadowColor = '#a78bfa'; ctx.shadowBlur = 35;
                ctx.fillStyle = '#c4b5fd';
                ctx.font = 'bold 48px Microsoft YaHei';
                ctx.textAlign = 'center';
                ctx.fillText('音乐大师', W/2, H/2 - 30);
                ctx.restore();
                ctx.fillStyle = '#fff';
                ctx.font = '18px Microsoft YaHei';
                ctx.fillText('点击"演奏"开启你的舞台', W/2, H/2 + 20);
            }
        }

        function lp() { upd(); dr(); raf = requestAnimationFrame(lp); }

        function colAt(x) {
            for (let t = 0; t < TRACKS; t++) {
                const tx = START_X + t * TRACK_W;
                if (x >= tx && x < tx + TRACK_W) return t;
            }
            return -1;
        }

        cv.addEventListener('mousedown', function(e) {
            const r = cv.getBoundingClientRect();
            const sx = W / r.width, sy = H / r.height;
            hitTrack(colAt((e.clientX - r.left) * sx));
        });
        cv.addEventListener('touchstart', function(e) {
            const r = cv.getBoundingClientRect();
            const sx = W / r.width, sy = H / r.height;
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                hitTrack(colAt((t.clientX - r.left) * sx));
            }
        }, { passive: true });

        const keyMap = { 'd':0,'D':0,'f':1,'F':1,'g':2,'G':2,'h':3,'H':3,'j':4,'J':4,'k':5,'K':5 };
        document.addEventListener('keydown', function(e) {
            if (keyMap[e.key] !== undefined) {
                e.preventDefault();
                if (state !== STATE_PLAYING) return;
                const tr = keyMap[e.key];
                if (level === 'easy' && tr >= 4) return;
                if (level === 'normal' && tr >= 5) return;
                hitTrack(tr);
            }
        });

        function sg() {
            initGame(); state = STATE_PLAYING;
            document.getElementById('guide').classList.add('hdn');
            document.getElementById('end').classList.add('hdn');
            document.getElementById('psov').classList.add('hdn');
            if (!raf) lp();
        }
        function pg() { if (state !== STATE_PLAYING) return; state = STATE_PAUSE; document.getElementById('psov').classList.remove('hdn'); }
        function rg() { if (state !== STATE_PAUSE) return; state = STATE_PLAYING; document.getElementById('psov').classList.add('hdn'); }

        document.getElementById('bst').addEventListener('click', function() { document.getElementById('guide').classList.remove('hdn'); });
        document.getElementById('bps').addEventListener('click', function() { if (state === STATE_PLAYING) pg(); else if (state === STATE_PAUSE) rg(); });
        document.getElementById('bhp').addEventListener('click', function() { document.getElementById('guide').classList.remove('hdn'); });
        document.getElementById('go').addEventListener('click', sg);
        document.getElementById('reb').addEventListener('click', sg);
        document.getElementById('rsb').addEventListener('click', rg);
        document.getElementById('start-game-btn').addEventListener('click', function() { document.getElementById('guide').classList.remove('hdn'); });

        document.querySelectorAll('.lv-btn').forEach(function(b) {
            b.addEventListener('click', function() {
                document.querySelectorAll('.lv-btn').forEach(function(x) { x.classList.remove('active'); });
                b.classList.add('active');
                level = b.dataset.lv;
                document.getElementById('lv-dsc').textContent = LVI[level].desc;
            });
        });

        recalcLayout();
        GameCore.hints.showStartGuide(
            '🎼 <b>音乐大师</b><br><br>🎵 多轨音符飘落<br>👆 命中判定线上的音符<br>⌨️ D F G H J K 六键<br>⭐ SSS评分完美通关<br>🏆 三个难度任选挑战！'
        );
        setTimeout(function() { document.getElementById('guide').classList.remove('hdn'); }, 100);
    })();
    </script>
