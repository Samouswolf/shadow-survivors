<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>深海探险</title>
    <script src="game_core.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0077b6 0%, #023e8a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px;
            background: linear-gradient(135deg, #0077b6, #023e8a);
            border-radius: 12px;
        }
        .stat {
            text-align: center;
            color: white;
        }
        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }
        .stat-value {
            font-size: 20px;
            font-weight: bold;
        }
        .depth-meter {
            padding: 15px;
            background: #023e8a;
            border-radius: 12px;
            margin-bottom: 15px;
            text-align: center;
        }
        .depth-value {
            font-size: 32px;
            color: #00b4d8;
            font-weight: bold;
        }
        .depth-label {
            font-size: 14px;
            color: white;
        }
        .ocean-view {
            height: 200px;
            background: linear-gradient(180deg, #00b4d8, #0077b6, #023e8a);
            border-radius: 12px;
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
        }
        .submarine {
            position: absolute;
            width: 50px;
            height: 30px;
            font-size: 30px;
            transition: all 0.5s;
        }
        .creature {
            position: absolute;
            font-size: 24px;
            animation: swim 3s infinite;
        }
        @keyframes swim {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(20px); }
        }
        .treasure {
            position: absolute;
            font-size: 20px;
            animation: glow 1s infinite;
        }
        @keyframes glow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .status-bars {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .status-item {
            flex: 1;
            padding: 10px;
            background: #dfe6e9;
            border-radius: 10px;
            text-align: center;
        }
        .status-icon {
            font-size: 20px;
        }
        .status-bar {
            height: 10px;
            background: #b2bec3;
            border-radius: 5px;
            margin-top: 5px;
        }
        .status-fill {
            height: 100%;
            border-radius: 5px;
        }
        .fill-oxygen { background: #00b4d8; }
        .fill-energy { background: #f39c12; }
        .fill-pressure { background: #e74c3c; }
        .actions {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .action-btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            background: #0077b6;
            color: white;
        }
        .action-btn:hover {
            transform: scale(1.05);
        }
        .btn-down { background: #023e8a; }
        .btn-up { background: #00b4d8; }
        .btn-collect { background: #f39c12; }
        .btn-repair { background: #2ecc71; }
        .collection {
            display: flex;
            gap: 10px;
            padding: 10px;
            background: #dfe6e9;
            border-radius: 10px;
        }
        .col-item {
            padding: 8px 15px;
            background: white;
            border-radius: 8px;
            font-size: 14px;
        }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #0077b6, #023e8a);
            color: white;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 20px 40px;
            border-radius: 15px;
            font-size: 18px;
            display: none;
            z-index: 100;
            text-align: center;
        }
        .message.show { display: block; }
        .ad-banner {
            width: 100%;
            height: 60px;
            background: linear-gradient(135deg, #0077b6, #023e8a);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">发现</div>
                <div class="stat-value" id="discoveries">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">宝藏</div>
                <div class="stat-value" id="treasures">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">分数</div>
                <div class="stat-value" id="score">0</div>
            </div>
        </div>

        <div class="depth-meter">
            <div class="depth-value" id="depthValue">100m</div>
            <div class="depth-label">当前深度</div>
        </div>

        <div class="ocean-view" id="oceanView"></div>

        <div class="status-bars">
            <div class="status-item">
                <div class="status-icon">💨</div>
                <div style="font-size: 12px;">氧气</div>
                <div class="status-bar">
                    <div class="status-fill fill-oxygen" id="oxygenBar" style="width: 100%"></div>
                </div>
            </div>
            <div class="status-item">
                <div class="status-icon">⚡</div>
                <div style="font-size: 12px;">能量</div>
                <div class="status-bar">
                    <div class="status-fill fill-energy" id="energyBar" style="width: 100%"></div>
                </div>
            </div>
            <div class="status-item">
                <div class="status-icon">🔴</div>
                <div style="font-size: 12px;">压力</div>
                <div class="status-bar">
                    <div class="status-fill fill-pressure" id="pressureBar" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <div class="actions">
            <button class="action-btn btn-down" id="btnDown">⬇️ 下潜</button>
            <button class="action-btn btn-up" id="btnUp">⬆️ 上浮</button>
            <button class="action-btn btn-collect" id="btnCollect">📦 收集</button>
            <button class="action-btn btn-repair" id="btnRepair">🔧 维修</button>
        </div>

        <div class="collection" id="collection">
            <div class="col-item">🪸 珊瑚: 0</div>
            <div class="col-item">🐚 贝壳: 0</div>
            <div class="col-item">💰 宝藏: 0</div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" id="btnReset">🔄 新探险</button>
        </div>

        <div class="message" id="message"></div>

        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    <script>
        let depth = 100;
        let oxygen = 100;
        let energy = 100;
        let pressure = 0;
        let discoveries = 0;
        let treasures = 0;
        let score = 0;
        let collection = { coral: 0, shell: 0, treasure: 0 };
        let gameOver = false;
        let creatures = [];
        let items = [];

        function initGame() {
            depth = 100;
            oxygen = 100;
            energy = 100;
            pressure = 0;
            discoveries = 0;
            treasures = 0;
            score = 0;
            collection = { coral: 0, shell: 0, treasure: 0 };
            gameOver = false;
            creatures = [];
            items = [];

            generateOcean();
            renderOcean();
            updateUI();
        }

        function generateOcean() {
            // 生成海洋生物
            creatures = [];
            for (let i = 0; i < 5; i++) {
                creatures.push({
                    type: ['🐟', '🦈', '🐙', '🦑', '🦐'][Math.floor(Math.random() * 5)],
                    x: Math.random() * 400,
                    y: Math.random() * 150 + 25,
                    speed: Math.random() * 2 + 1
                });
            }

            // 生成物品
            items = [];
            for (let i = 0; i < 3; i++) {
                items.push({
                    type: ['🪸', '🐚', '💰'][Math.floor(Math.random() * 3)],
                    x: Math.random() * 400,
                    y: Math.random() * 150 + 25
                });
            }
        }

        function renderOcean() {
            const el = document.getElementById('oceanView');
            el.innerHTML = '';

            // 潜水艇
            const sub = document.createElement('div');
            sub.className = 'submarine';
            sub.textContent = '🚢';
            sub.style.left = '200px';
            sub.style.top = (depth / 10) + '%';
            el.appendChild(sub);

            // 生物
            creatures.forEach(c => {
                const creature = document.createElement('div');
                creature.className = 'creature';
                creature.textContent = c.type;
                creature.style.left = c.x + 'px';
                creature.style.top = c.y + 'px';
                el.appendChild(creature);
            });

            // 物品
            items.forEach(i => {
                const item = document.createElement('div');
                item.className = 'treasure';
                item.textContent = i.type;
                item.style.left = i.x + 'px';
                item.style.top = i.y + 'px';
                el.appendChild(item);
            });
        }

        function dive() {
            if (gameOver) return;
            if (energy < 10) {
                showMessage('能量不足！');
                return;
            }

            depth += 50;
            energy -= 10;
            oxygen -= 5;
            pressure += 10;

            // 深度压力
            if (pressure > 80) {
                showMessage('压力过大！潜艇受损！');
                energy -= 20;
            }

            if (depth > 1000) {
                showMessage('到达深海！发现神秘宝藏！');
                treasures++;
                score += 100;
            }

            checkStatus();
            generateOcean();
            renderOcean();
            updateUI();
        }

        function rise() {
            if (gameOver) return;

            depth -= 50;
            pressure -= 10;
            oxygen += 5;

            if (depth < 100) {
                depth = 100;
                showMessage('已到达水面！');
            }

            checkStatus();
            renderOcean();
            updateUI();
        }

        function collect() {
            if (gameOver) return;
            if (energy < 5) {
                showMessage('能量不足！');
                return;
            }

            energy -= 5;

            // 收集物品
            const nearbyItems = items.filter(i => Math.abs(i.y - (depth / 10 * 2)) < 30);
            if (nearbyItems.length > 0) {
                const item = nearbyItems[0];
                if (item.type === '🪸') {
                    collection.coral++;
                    discoveries++;
                    score += 10;
                } else if (item.type === '🐚') {
                    collection.shell++;
                    discoveries++;
                    score += 15;
                } else {
                    collection.treasure++;
                    treasures++;
                    score += 50;
                }
                items = items.filter(i => i !== item);
                showMessage('收集到' + item.type + '！');
            } else {
                showMessage('附近没有物品！');
            }

            renderOcean();
            renderCollection();
            updateUI();
        }

        function repair() {
            if (gameOver) return;

            if (depth > 200) {
                showMessage('太深了！无法维修！');
                return;
            }

            energy = Math.min(100, energy + 30);
            oxygen = Math.min(100, oxygen + 20);
            pressure = Math.max(0, pressure - 20);

            showMessage('维修成功！');
            updateUI();
        }

        function checkStatus() {
            if (oxygen <= 0) {
                gameOver = true;
                showMessage('氧气耗尽！\n发现: ' + discoveries + '\n宝藏: ' + treasures);
                GameCore.highScore.set('deepsea_game', score);
            }
            if (energy <= 0) {
                gameOver = true;
                showMessage('能量耗尽！\n发现: ' + discoveries + '\n宝藏: ' + treasures);
                GameCore.highScore.set('deepsea_game', score);
            }
        }

        function renderCollection() {
            const el = document.getElementById('collection');
            el.innerHTML = `
                <div class="col-item">🪸 珊瑚: ${collection.coral}</div>
                <div class="col-item">🐚 贝壳: ${collection.shell}</div>
                <div class="col-item">💰 宝藏: ${collection.treasure}</div>
            `;
        }

        function updateUI() {
            document.getElementById('depthValue').textContent = depth + 'm';
            document.getElementById('discoveries').textContent = discoveries;
            document.getElementById('treasures').textContent = treasures;
            document.getElementById('score').textContent = score;
            document.getElementById('oxygenBar').style.width = oxygen + '%';
            document.getElementById('energyBar').style.width = energy + '%';
            document.getElementById('pressureBar').style.width = pressure + '%';
        }

        function showMessage(msg) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 1500);
        }

        document.getElementById('btnDown').addEventListener('click', dive);
        document.getElementById('btnUp').addEventListener('click', rise);
        document.getElementById('btnCollect').addEventListener('click', collect);
        document.getElementById('btnRepair').addEventListener('click', repair);
        document.getElementById('btnReset').addEventListener('click', initGame);

        // 自动消耗氧气
        setInterval(() => {
            if (!gameOver) {
                oxygen -= 2;
                checkStatus();
                updateUI();
            }
        }, 2000);

        // 生物移动
        setInterval(() => {
            if (!gameOver) {
                creatures.forEach(c => {
                    c.x += c.speed;
                    if (c.x > 450) c.x = 0;
                });
                renderOcean();
            }
        }, 1000);

        // 初始化
        GameCore.init({ highScore: 'deepsea_game' });
        initGame();
    </script>
</body>
</html>
