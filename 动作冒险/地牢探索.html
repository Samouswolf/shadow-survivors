<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>地牢探索</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #2d1b4e 0%, #4a2c7a 50%, #6b3fa0 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; color: #fff; }
        
        .game-container { width: 100%; flex: 1; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: #ff6b6b; }
        .stats { display: flex; gap: 20px; font-size: 14px; }
        
        .dungeon-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .dungeon-display { width: 200px; height: 200px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 80px; margin-bottom: 20px; }
        
        .monster-info { text-align: center; margin-bottom: 20px; }
        .monster-name { font-size: 20px; font-weight: bold; }
        .health-bar { width: 200px; height: 20px; background: rgba(255,255,255,0.2); border-radius: 10px; overflow: hidden; margin: 10px auto; }
        .health-fill { height: 100%; background: #ff6b6b; border-radius: 10px; }
        
        .actions-area { display: flex; gap: 15px; }
        .action-btn { padding: 15px 30px; border: none; border-radius: 15px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .action-btn.attack { background: linear-gradient(135deg, #ff6b6b, #ff8c42); color: #fff; }
        .action-btn.defend { background: linear-gradient(135deg, #4ecdc4, #44a08d); color: #fff; }
        .action-btn.item { background: linear-gradient(135deg, #a8e6cf, #88d8b0); color: #333; }
        
        .log-area { width: 100%; height: 80px; background: rgba(255,255,255,0.1); border-radius: 10px; padding: 10px; margin-top: 15px; overflow-y: auto; font-size: 14px; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }
    /* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */
/* [BATCH-FIX:ad-components-css] */
.sponsor-btn{position:fixed;bottom:8px;left:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:2px 6px;border-radius:10px;font:10px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.sponsor-panel.show{display:flex}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.interstitial-ad.show{display:flex}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* [/BATCH-FIX:ad-components-css] */

/* [AD-FIX:responsive] */
@media (max-width:768px){.ad-banner-container{display:none!important}.sponsor-btn{transform:scale(.8);opacity:.6}}
/* [/AD-FIX:responsive] */
</style>
</head>
<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="title">🏰 地牢探索</div>
            <div class="stats">
                <span>❤️ HP: <span id="hp">100</span></span>
                <span>⚔️ 攻击: <span id="attack">20</span></span>
                <span>💰 金币: <span id="gold">0</span></span>
            </div>
        </div>
        
        <div class="dungeon-area">
            <div class="dungeon-display" id="dungeonDisplay">👹</div>
            
            <div class="monster-info">
                <div class="monster-name" id="monsterName">哥布林</div>
                <div class="health-bar">
                    <div class="health-fill" id="monsterHealth" style="width: 100%;"></div>
                </div>
                <div style="font-size: 12px;">剩余血量: <span id="monsterHp">50</span></div>
            </div>
            
            <div class="actions-area">
                <button class="action-btn attack" onclick="attackMonster()">⚔️ 攻击</button>
                <button class="action-btn defend" onclick="defend()">🛡️ 防御</button>
                <button class="action-btn item" onclick="useItem()">🧪 药水</button>
            </div>
            
            <div class="log-area" id="logArea"></div>
        </div>
    </div>
    
    

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <script>
        const GAME_NAME = '地牢探索';
        GameCore.init({ highScore: GAME_NAME });
        
        const monsters = [
            { name: '哥布林', emoji: '👹', hp: 50, attack: 10, gold: 20 },
            { name: '骷髅', emoji: '💀', hp: 70, attack: 15, gold: 35 },
            { name: '史莱姆', emoji: '🟢', hp: 40, attack: 8, gold: 15 },
            { name: '蝙蝠', emoji: '🦇', hp: 30, attack: 12, gold: 25 },
            { name: '巨龙', emoji: '🐉', hp: 200, attack: 30, gold: 100 }
        ];
        
        let player = { hp: 100, attack: 20, gold: 0, potions: 3, defendMode: false };
        let currentMonster = null;
        
        function initGame() {
            const highScore = GameCore.highScore.get(GAME_NAME);
            player.gold = highScore || 0;
            spawnMonster();
            updateUI();
        }
        
        function updateUI() {
            document.getElementById('hp').textContent = player.hp;
            document.getElementById('attack').textContent = player.attack;
            document.getElementById('gold').textContent = player.gold;
            
            GameCore.highScore.set(GAME_NAME, player.gold);
        }
        
        function spawnMonster() {
            const monsterIndex = Math.floor(Math.random() * monsters.length);
            currentMonster = { ...monsters[monsterIndex], maxHp: monsters[monsterIndex].hp };
            
            document.getElementById('dungeonDisplay').textContent = currentMonster.emoji;
            document.getElementById('monsterName').textContent = currentMonster.name;
            document.getElementById('monsterHp').textContent = currentMonster.hp;
            document.getElementById('monsterHealth').style.width = '100%';
            
            addLog(`遭遇了 ${currentMonster.name}！`);
        }
        
        function attackMonster() {
            if (!currentMonster) return;
            
            const damage = player.attack + Math.floor(Math.random() * 10);
            currentMonster.hp -= damage;
            
            addLog(`你对 ${currentMonster.name} 造成了 ${damage} 点伤害！`);
            
            if (currentMonster.hp <= 0) {
                player.gold += currentMonster.gold;
                addLog(`击败了 ${currentMonster.name}！获得 ${currentMonster.gold} 金币！`);
                spawnMonster();
            } else {
                document.getElementById('monsterHp').textContent = currentMonster.hp;
                document.getElementById('monsterHealth').style.width = (currentMonster.hp / currentMonster.maxHp * 100) + '%';
                monsterAttack();
            }
            
            updateUI();
        }
        
        function monsterAttack() {
            let damage = currentMonster.attack + Math.floor(Math.random() * 5);
            
            if (player.defendMode) {
                damage = Math.floor(damage / 2);
                player.defendMode = false;
                addLog(`防御成功！受到 ${damage} 点伤害！`);
            } else {
                addLog(`${currentMonster.name} 对你造成了 ${damage} 点伤害！`);
            }
            
            player.hp -= damage;
            
            if (player.hp <= 0) {
                player.hp = 0;
                addLog('你被击败了！游戏结束！');
                currentMonster = null;
            }
            
            updateUI();
        }
        
        function defend() {
            player.defendMode = true;
            addLog('进入防御状态！');
        }
        
        function useItem() {
            if (player.potions > 0) {
                player.potions--;
                const healAmount = 30;
                player.hp = Math.min(100, player.hp + healAmount);
                addLog(`使用药水！恢复 ${healAmount} 点生命值！`);
                updateUI();
            } else {
                addLog('没有药水了！');
            }
        }
        
        function addLog(message) {
            const logArea = document.getElementById('logArea');
            const logItem = document.createElement('div');
            logItem.textContent = message;
            logArea.appendChild(logItem);
            logArea.scrollTop = logArea.scrollHeight;
        }
        
        initGame();
        GameCore.touch.enableAllButtons();
    </script>
<!-- [BATCH-FIX:responsive-js] -->
<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>
<!-- [/BATCH-FIX:responsive-js] -->
<!-- [BATCH-FIX:touch-support] -->
<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>
<!-- [/BATCH-FIX:touch-support] -->

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
