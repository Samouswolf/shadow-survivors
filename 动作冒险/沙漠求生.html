<!DOCTYPE html>

    <title>沙漠求生</title>
    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px;
            background: linear-gradient(135deg, #f39c12, #e67e22);
            border-radius: 12px;
        }
        .stat {
            text-align: center;
            color: white;
        }
        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }
        .stat-value {
            font-size: 20px;
            font-weight: bold;
        }
        .desert-view {
            height: 150px;
            background: linear-gradient(180deg, #ffeaa7, #f39c12);
            border-radius: 12px;
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
        }
        .sun {
            position: absolute;
            top: 20px;
            right: 50px;
            font-size: 40px;
        }
        .dunes {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 60px;
            background: #e67e22;
            border-radius: 50% 50% 0 0;
        }
        .traveler {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 30px;
            transition: all 0.5s;
        }
        .landmark {
            position: absolute;
            font-size: 24px;
        }
        .status-bars {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
            padding: 15px;
            background: #dfe6e9;
            border-radius: 12px;
        }
        .status-bar {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .status-icon {
            font-size: 20px;
        }
        .bar-container {
            flex: 1;
            height: 20px;
            background: #b2bec3;
            border-radius: 10px;
        }
        .bar-fill {
            height: 100%;
            border-radius: 10px;
        }
        .bar-water { background: #3498db; }
        .bar-food { background: #e74c3c; }
        .bar-energy { background: #2ecc71; }
        .bar-heat { background: #f39c12; }
        .actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        .action-btn {
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            background: #f39c12;
            color: white;
        }
        .action-btn:hover {
            transform: scale(1.05);
        }
        .btn-walk { background: #e67e22; }
        .btn-rest { background: #2ecc71; }
        .btn-search { background: #3498db; }
        .btn-drink { background: #00b894; }
        .btn-eat { background: #e74c3c; }
        .btn-shade { background: #6c5ce7; }
        .inventory {
            display: flex;
            gap: 10px;
            padding: 10px;
            background: #dfe6e9;
            border-radius: 10px;
        }
        .inv-item {
            padding: 10px;
            background: white;
            border-radius: 8px;
            text-align: center;
        }
        .inv-icon {
            font-size: 20px;
        }
        .inv-count {
            font-size: 12px;
            color: #636e72;
        }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: white;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 20px 40px;
            border-radius: 15px;
            font-size: 18px;
            display: none;
            z-index: 100;
            text-align: center;
        }
        .message.show { display: block; }
        .ad-banner {
            width: 100%;
            height: 60px;
            background: linear-gradient(135deg, #f39c12, #e67e22);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            margin-top: 10px;
            font-size: 14px;
        }

<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">天数</div>
                <div class="stat-value" id="days">1</div>
            </div>
            <div class="stat">
                <div class="stat-label">距离</div>
                <div class="stat-value" id="distance">0km</div>
            </div>
            <div class="stat">
                <div class="stat-label">温度</div>
                <div class="stat-value" id="temperature">45°C</div>
            </div>
        </div>

        <div class="desert-view" id="desertView"></div>

        <div class="status-bars">
            <div class="status-bar">
                <span class="status-icon">💧</span>
                <span style="width: 50px;">水分</span>
                <div class="bar-container">
                    <div class="bar-fill bar-water" id="waterBar" style="width: 80%"></div>
                </div>
                <span id="waterValue">80</span>
            </div>
            <div class="status-bar">
                <span class="status-icon">🍖</span>
                <span style="width: 50px;">食物</span>
                <div class="bar-container">
                    <div class="bar-fill bar-food" id="foodBar" style="width: 80%"></div>
                </div>
                <span id="foodValue">80</span>
            </div>
            <div class="status-bar">
                <span class="status-icon">⚡</span>
                <span style="width: 50px;">体力</span>
                <div class="bar-container">
                    <div class="bar-fill bar-energy" id="energyBar" style="width: 100%"></div>
                </div>
                <span id="energyValue">100</span>
            </div>
            <div class="status-bar">
                <span class="status-icon">🔥</span>
                <span style="width: 50px;">热度</span>
                <div class="bar-container">
                    <div class="bar-fill bar-heat" id="heatBar" style="width: 50%"></div>
                </div>
                <span id="heatValue">50</span>
            </div>
        </div>

        <div class="actions">
            <button class="action-btn btn-walk" id="btnWalk">🚶 前行</button>
            <button class="action-btn btn-rest" id="btnRest">😴 休息</button>
            <button class="action-btn btn-search" id="btnSearch">🔍 搜寻</button>
            <button class="action-btn btn-drink" id="btnDrink">💧 喝水</button>
            <button class="action-btn btn-eat" id="btnEat">🍖 吃食</button>
            <button class="action-btn btn-shade" id="btnShade">🌴 阴凉</button>
        </div>

        <div class="inventory" id="inventory"></div>

        <div class="controls">
            <button class="btn btn-primary" id="btnReset">🔄 新求生</button>
        </div>

        <div class="message" id="message"></div>

        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    <script>
        let water = 80;
        let food = 80;
        let energy = 100;
        let heat = 50;
        let days = 1;
        let distance = 0;
        let temperature = 45;
        let inventory = { water: 3, food: 2 };
        let gameOver = false;
        let landmarks = [];

        function initGame() {
            water = 80;
            food = 80;
            energy = 100;
            heat = 50;
            days = 1;
            distance = 0;
            temperature = 45;
            inventory = { water: 3, food: 2 };
            gameOver = false;
            landmarks = [];

            generateLandmarks();
            renderDesert();
            renderInventory();
            updateUI();
        }

        function generateLandmarks() {
            landmarks = [];
            for (let i = 0; i < 3; i++) {
                landmarks.push({
                    type: ['🌵', '🏜️', '🛖'][Math.floor(Math.random() * 3)],
                    x: Math.random() * 400,
                    distance: Math.floor(Math.random() * 50) + 10
                });
            }
        }

        function renderDesert() {
            const el = document.getElementById('desertView');
            el.innerHTML = `
                <div class="sun">☀️</div>
                <div class="dunes"></div>
                <div class="traveler">🧍</div>
            `;

            landmarks.forEach(l => {
                const mark = document.createElement('div');
                mark.className = 'landmark';
                mark.textContent = l.type;
                mark.style.left = l.x + 'px';
                mark.style.bottom = '40px';
                el.appendChild(mark);
            });
        }

        function walk() {
            if (gameOver) return;
            if (energy < 20) {
                showMessage('体力不足！');
                return;
            }

            distance += 5;
            energy -= 20;
            water -= 15;
            food -= 10;
            heat += 10;

            if (heat > 80) {
                showMessage('太热了！寻找阴凉！');
                water -= 10;
            }

            checkStatus();
            generateLandmarks();
            renderDesert();
            updateUI();
        }

        function rest() {
            if (gameOver) return;

            energy = Math.min(100, energy + 30);
            heat -= 20;

            showMessage('休息了一会...');
            updateUI();
        }

        function search() {
            if (gameOver) return;
            if (energy < 10) {
                showMessage('体力不足！');
                return;
            }

            energy -= 10;
            const found = Math.floor(Math.random() * 3);

            if (found === 0) {
                inventory.water += 2;
                showMessage('找到水源！');
            } else if (found === 1) {
                inventory.food += 1;
                showMessage('找到食物！');
            } else {
                showMessage('什么都没找到...');
            }

            renderInventory();
            updateUI();
        }

        function drink() {
            if (gameOver) return;
            if (inventory.water <= 0) {
                showMessage('没有水了！');
                return;
            }

            inventory.water--;
            water = Math.min(100, water + 30);
            heat -= 10;

            showMessage('喝水补充水分');
            renderInventory();
            updateUI();
        }

        function eat() {
            if (gameOver) return;
            if (inventory.food <= 0) {
                showMessage('没有食物了！');
                return;
            }

            inventory.food--;
            food = Math.min(100, food + 25);
            energy = Math.min(100, energy + 10);

            showMessage('吃东西补充能量');
            renderInventory();
            updateUI();
        }

        function findShade() {
            if (gameOver) return;

            heat = Math.max(0, heat - 30);
            energy -= 5;

            showMessage('找到阴凉处休息');
            updateUI();
        }

        function checkStatus() {
            if (water <= 0) {
                gameOver = true;
                showMessage('脱水死亡...\n行走距离: ' + distance + 'km');
                GameCore.highScore.set('desert_game', distance);
            }
            if (food <= 0) {
                gameOver = true;
                showMessage('饥饿死亡...\n行走距离: ' + distance + 'km');
                GameCore.highScore.set('desert_game', distance);
            }
            if (heat >= 100) {
                gameOver = true;
                showMessage('中暑死亡...\n行走距离: ' + distance + 'km');
                GameCore.highScore.set('desert_game', distance);
            }
        }

        function renderInventory() {
            const el = document.getElementById('inventory');
            el.innerHTML = `
                <div class="inv-item">
                    <div class="inv-icon">💧</div>
                    <div class="inv-count">${inventory.water}</div>
                </div>
                <div class="inv-item">
                    <div class="inv-icon">🍖</div>
                    <div class="inv-count">${inventory.food}</div>
                </div>
            `;
        }

        function updateUI() {
            document.getElementById('days').textContent = days;
            document.getElementById('distance').textContent = distance + 'km';
            document.getElementById('temperature').textContent = temperature + '°C';
            document.getElementById('waterBar').style.width = water + '%';
            document.getElementById('waterValue').textContent = Math.max(0, water);
            document.getElementById('foodBar').style.width = food + '%';
            document.getElementById('foodValue').textContent = Math.max(0, food);
            document.getElementById('energyBar').style.width = energy + '%';
            document.getElementById('energyValue').textContent = Math.max(0, energy);
            document.getElementById('heatBar').style.width = heat + '%';
            document.getElementById('heatValue').textContent = Math.max(0, heat);
        }

        function showMessage(msg) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 1500);
        }

        document.getElementById('btnWalk').addEventListener('click', walk);
        document.getElementById('btnRest').addEventListener('click', rest);
        document.getElementById('btnSearch').addEventListener('click', search);
        document.getElementById('btnDrink').addEventListener('click', drink);
        document.getElementById('btnEat').addEventListener('click', eat);
        document.getElementById('btnShade').addEventListener('click', findShade);
        document.getElementById('btnReset').addEventListener('click', initGame);

        // 自动消耗
        setInterval(() => {
            if (!gameOver) {
                water -= 2;
                food -= 1;
                heat += 1;
                if (heat > 50) temperature = 45 + (heat - 50);
                checkStatus();
                updateUI();
            }
        }, 3000);

        // 天数增加
        setInterval(() => {
            if (!gameOver) {
                days++;
                temperature = 40 + Math.floor(Math.random() * 20);
                updateUI();
            }
        }, 30000);

        // 初始化
        GameCore.init({ highScore: 'desert_game' });
        initGame();
    </script>

<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>
<!-- [/BATCH-FIX:responsive-js] -->
<!-- [BATCH-FIX:touch-support] -->
<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>

<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
