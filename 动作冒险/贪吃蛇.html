<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#0a0a0f;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;font-family:'Microsoft YaHei','PingFang SC',sans-serif;
  overflow:hidden;touch-action:none;
  -webkit-user-select:none;user-select:none;
  padding-bottom:100px;
}
#game-container{
  position:relative;
  display:flex;flex-direction:column;align-items:center;
  gap:10px;
}
#header{
  display:flex;align-items:center;justify-content:space-between;
  width:100%;max-width:420px;
  padding:0 12px;
}
#score-board{
  display:flex;gap:16px;align-items:center;
}
.score-item{
  text-align:center;
}
.score-label{
  font-size:10px;color:#888;text-transform:uppercase;letter-spacing:1px;
}
.score-value{
  font-size:24px;font-weight:bold;color:#0ff;text-shadow:0 0 10px rgba(0,255,255,.5);
}
#high-score .score-value{color:#ff0;text-shadow:0 0 10px rgba(255,255,0,.5)}
#canvas-wrapper{
  position:relative;
  border:2px solid #0ff;
  border-radius:8px;
  box-shadow:0 0 20px rgba(0,255,255,.15),0 0 60px rgba(0,255,255,.05);
  background:#0d0d1a;
  overflow:hidden;
}
canvas{display:block}
#overlay{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;
  background:rgba(0,0,0,.75);
  border-radius:6px;
  pointer-events:none;
}
#overlay.active{pointer-events:auto}
#overlay .title{
  font-size:28px;font-weight:bold;
  background:linear-gradient(135deg,#0ff,#f0f);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
#overlay .subtitle{
  font-size:13px;color:#888;
}
#overlay .btn{
  padding:10px 32px;
  border:1px solid #0ff;border-radius:24px;
  background:rgba(0,255,255,.08);color:#0ff;
  font:bold 15px 'Microsoft YaHei',sans-serif;
  cursor:pointer;transition:.2s;
}
#overlay .btn:hover{background:rgba(0,255,255,.2);transform:scale(1.05)}
#overlay .btn:active{transform:scale(.95)}
#controls-bar{
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;
}
#controls-bar .ctrl-btn{
  width:36px;height:36px;
  border:1px solid rgba(255,255,255,.15);border-radius:8px;
  background:rgba(255,255,255,.04);color:#aaa;
  font-size:18px;cursor:pointer;transition:.2s;
  display:flex;align-items:center;justify-content:center;
}
#controls-bar .ctrl-btn:hover{background:rgba(255,255,255,.1);color:#fff}
#controls-bar .ctrl-btn.active{background:rgba(0,255,255,.15);border-color:#0ff;color:#0ff}
#skin-selector{
  display:flex;gap:4px;
}
.skin-btn{
  padding:3px 10px;
  border:1px solid rgba(255,255,255,.12);border-radius:12px;
  background:transparent;color:#888;
  font:11px 'Microsoft YaHei',sans-serif;cursor:pointer;transition:.2s;
}
.skin-btn:hover{color:#ccc;border-color:rgba(255,255,255,.25)}
.skin-btn.active{background:rgba(0,255,255,.12);border-color:#0ff;color:#0ff}
#speed-indicator{
  font-size:10px;color:#666;text-align:center;
}
#speed-indicator span{color:#0ff;font-weight:bold}
/* 广告系统 */
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);height:90px;max-height:90px;overflow:hidden;contain:layout style paint;pointer-events:none!important}.ad-banner-container,.ad-banner-container *{pointer-events:none!important}.ad-banner-container iframe{max-height:90px;pointer-events:none!important}
.ad-banner-container iframe{max-width:100%}
.ad-label{position:absolute;top:1px;right:6px;font:9px "Microsoft YaHei",sans-serif;color:rgba(255,255,255,.35)}
.sponsor-btn{position:fixed;top:44px;right:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:3px 9px;border-radius:10px;font:11px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .qr-row{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.sponsor-panel .qr-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px;text-align:center;min-width:140px}
.sponsor-panel .qr-card .qr-icon{font-size:48px;margin-bottom:6px}
.sponsor-panel .qr-card .qr-label{color:#ccc;font:13px "Microsoft YaHei",sans-serif}
.sponsor-panel .qr-card .qr-hint{color:#888;font:11px "Microsoft YaHei",sans-serif;margin-top:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.interstitial-ad .ad-content{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;text-align:center;min-width:280px;max-width:400px}
.interstitial-ad .ad-content p{color:#aaa;font:14px "Microsoft YaHei",sans-serif;margin-bottom:12px}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* 响应式 */
@media(max-width:480px){
  #canvas-wrapper{border-width:1px;border-radius:4px}
  .score-value{font-size:20px}
  #overlay .title{font-size:22px}
  #overlay .btn{padding:8px 24px;font-size:13px}
}
</style>

<script>
// ==================== 贪吃蛇·经典版 ====================
(function(){

// --- DOM 引用 ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const btnStart = document.getElementById('btnStart');
const btnPause = document.getElementById('btnPause');
const btnRestart = document.getElementById('btnRestart');
const scoreEl = document.querySelector('#score .score-value');
const highScoreEl = document.querySelector('#high-score .score-value');
const foodCountEl = document.querySelector('#food-count .score-value');
const speedLevelEl = document.getElementById('speedLevel');
const skinBtns = document.querySelectorAll('.skin-btn');

// --- 游戏配置 ---
const GRID = 20;           // 网格大小
const COLS = 20;           // 列数
const ROWS = 20;           // 行数
const BASE_SPEED = 140;    // 基础速度 (ms/帧)
const MIN_SPEED = 50;      // 最快速度
const SPEED_STEP = 5;      // 每吃N个食物加速

// --- 皮肤配置 ---
const SKINS = {
  neon: {
    name: '霓虹',
    bg: '#0d0d1a',
    grid: 'rgba(0,255,255,.04)',
    snakeHead: '#0ff',
    snakeBody: '#0cc',
    snakeGlow: 'rgba(0,255,255,.4)',
    food: '#f0f',
    foodGlow: 'rgba(255,0,255,.5)',
    foodInner: '#fff',
    border: '#0ff',
    shadow: 'rgba(0,255,255,.15)',
    particleColor: '#0ff'
  },
  classic: {
    name: '经典',
    bg: '#1a1a2e',
    grid: 'rgba(255,255,255,.03)',
    snakeHead: '#4f4',
    snakeBody: '#3a3',
    snakeGlow: 'rgba(0,200,0,.3)',
    food: '#f44',
    foodGlow: 'rgba(255,50,50,.4)',
    foodInner: '#fff',
    border: '#4f4',
    shadow: 'rgba(0,255,0,.1)',
    particleColor: '#4f4'
  },
  pixel: {
    name: '像素',
    bg: '#111',
    grid: 'rgba(255,255,255,.02)',
    snakeHead: '#ff0',
    snakeBody: '#cc0',
    snakeGlow: 'rgba(255,255,0,.3)',
    food: '#f80',
    foodGlow: 'rgba(255,136,0,.4)',
    foodInner: '#fff',
    border: '#ff0',
    shadow: 'rgba(255,255,0,.1)',
    particleColor: '#ff0'
  }
};

// --- 游戏状态 ---
let currentSkin = 'neon';
let snake = [];
let food = null;
let direction = {x:1, y:0};
let nextDirection = {x:1, y:0};
let score = 0;
let highScore = 0;
let foodEaten = 0;
let gameLoop = null;
let gameRunning = false;
let gamePaused = false;
let gameOver = false;
let particles = [];
let speedLevel = 1;
let currentSpeed = BASE_SPEED;
let foodPulse = 0;
let gridOffset = 0;

// --- 触摸控制 ---
let touchStartX = 0;
let touchStartY = 0;
let touchStartTime = 0;

// --- 初始化 ---
function init(){
  loadHighScore();
  resizeCanvas();
  setupEventListeners();
  updateSkin();
  drawInitialScreen();
}

function resizeCanvas(){
  const maxSize = Math.min(window.innerWidth - 20, window.innerHeight - 280, 440);
  const size = Math.floor(maxSize / GRID) * GRID;
  canvas.width = size;
  canvas.height = size;
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  document.getElementById('canvas-wrapper').style.width = size + 'px';
}

function loadHighScore(){
  try{ highScore = parseInt(localStorage.getItem('snake_classic_high') || '0'); }catch(e){}
  highScoreEl.textContent = highScore;
}

function saveHighScore(){
  try{ localStorage.setItem('snake_classic_high', highScore.toString()); }catch(e){}
}

function setupEventListeners(){
  // 键盘控制
  document.addEventListener('keydown', handleKey);

  // 触摸控制
  canvas.addEventListener('touchstart', handleTouchStart, {passive:false});
  canvas.addEventListener('touchmove', handleTouchMove, {passive:false});
  canvas.addEventListener('touchend', handleTouchEnd, {passive:false});

  // 按钮
  btnStart.addEventListener('click', startGame);
  btnPause.addEventListener('click', togglePause);
  btnRestart.addEventListener('click', restartGame);

  // 皮肤选择
  skinBtns.forEach(btn => {
    btn.addEventListener('click', function(){
      currentSkin = this.dataset.skin;
      skinBtns.forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      updateSkin();
      if(!gameRunning && !gameOver) drawInitialScreen();
    });
  });

  // 窗口调整
  window.addEventListener('resize', () => {
    resizeCanvas();
    if(!gameRunning && !gameOver) drawInitialScreen();
  });
}

function handleKey(e){
  if(gameOver) return;
  if(e.key === ' ' || e.key === 'Escape'){
    e.preventDefault();
    if(gameRunning) togglePause();
    return;
  }
  if(gamePaused || !gameRunning) return;

  const keyMap = {
    'ArrowUp':    {x:0, y:-1}, 'w':{x:0, y:-1}, 'W':{x:0, y:-1},
    'ArrowDown':  {x:0, y:1},  's':{x:0, y:1},  'S':{x:0, y:1},
    'ArrowLeft':  {x:-1,y:0},  'a':{x:-1,y:0},  'A':{x:-1,y:0},
    'ArrowRight': {x:1, y:0},  'd':{x:1, y:0},  'D':{x:1, y:0}
  };

  const newDir = keyMap[e.key];
  if(!newDir) return;
  e.preventDefault();

  // 防止反向
  if(newDir.x === -direction.x && newDir.y === -direction.y) return;
  nextDirection = newDir;
}

function handleTouchStart(e){
  e.preventDefault();
  const t = e.touches[0];
  touchStartX = t.clientX;
  touchStartY = t.clientY;
  touchStartTime = Date.now();
}

function handleTouchMove(e){
  e.preventDefault();
}

function handleTouchEnd(e){
  e.preventDefault();
  const dx = (e.changedTouches[0]?.clientX || touchStartX) - touchStartX;
  const dy = (e.changedTouches[0]?.clientY || touchStartY) - touchStartY;
  const dt = Date.now() - touchStartTime;
  const dist = Math.sqrt(dx*dx + dy*dy);

  if(dist < 20 || dt > 500) return; // 忽略太短/太慢的滑动

  const absDx = Math.abs(dx);
  const absDy = Math.abs(dy);

  let newDir;
  if(absDx > absDy){
    newDir = {x: dx > 0 ? 1 : -1, y: 0};
  } else {
    newDir = {x: 0, y: dy > 0 ? 1 : -1};
  }

  if(!newDir) return;

  if(gameOver) return;
  if(gamePaused || !gameRunning) return;

  if(newDir.x === -direction.x && newDir.y === -direction.y) return;
  nextDirection = newDir;
}

// --- 游戏逻辑 ---
function startGame(){
  snake = [
    {x:10, y:10},
    {x:9, y:10},
    {x:8, y:10}
  ];
  direction = {x:1, y:0};
  nextDirection = {x:1, y:0};
  score = 0;
  foodEaten = 0;
  speedLevel = 1;
  currentSpeed = BASE_SPEED;
  gameOver = false;
  gamePaused = false;
  particles = [];
  foodPulse = 0;
  gridOffset = 0;

  scoreEl.textContent = '0';
  foodCountEl.textContent = '0';
  speedLevelEl.textContent = '1';
  updatePauseBtn();

  spawnFood();
  overlay.classList.remove('active');
  gameRunning = true;

  if(gameLoop) clearInterval(gameLoop);
  gameLoop = setInterval(gameTick, currentSpeed);
}

function gameTick(){
  if(gamePaused || gameOver) return;
  direction = nextDirection;

  const head = snake[0];
  const newHead = {x: head.x + direction.x, y: head.y + direction.y};

  // 撞墙检测
  if(newHead.x < 0 || newHead.x >= COLS || newHead.y < 0 || newHead.y >= ROWS){
    endGame();
    return;
  }

  // 撞自己检测
  for(let i = 0; i < snake.length; i++){
    if(snake[i].x === newHead.x && snake[i].y === newHead.y){
      endGame();
      return;
    }
  }

  snake.unshift(newHead);

  // 吃食物
  if(food && newHead.x === food.x && newHead.y === food.y){
    score += 10;
    foodEaten++;
    scoreEl.textContent = score;
    foodCountEl.textContent = foodEaten;

    // 粒子效果
    spawnParticles(food.x, food.y);

    spawnFood();

    // 每吃5个加速
    if(foodEaten % SPEED_STEP === 0){
      speedLevel++;
      currentSpeed = Math.max(MIN_SPEED, BASE_SPEED - (speedLevel - 1) * 10);
      speedLevelEl.textContent = speedLevel;
      clearInterval(gameLoop);
      gameLoop = setInterval(gameTick, currentSpeed);
    }
  } else {
    // 蛇尾随着头部移动被移除（因为蛇头已添加，如果没有吃食物就移除尾部）
    snake.pop();
  }

  // 更新粒子
  updateParticles();

  draw();
}

function spawnFood(){
  const empty = [];
  for(let x = 0; x < COLS; x++){
    for(let y = 0; y < ROWS; y++){
      let occupied = false;
      for(let i = 0; i < snake.length; i++){
        if(snake[i].x === x && snake[i].y === y){ occupied = true; break; }
      }
      if(!occupied) empty.push({x, y});
    }
  }
  if(empty.length === 0){
    // 胜利！蛇填满了整个地图
    endGame(true);
    return;
  }
  food = empty[Math.floor(Math.random() * empty.length)];
}

function endGame(won = false){
  gameOver = true;
  gameRunning = false;
  if(gameLoop){ clearInterval(gameLoop); gameLoop = null; }

  // 更新最高分
  if(score > highScore){
    highScore = score;
    highScoreEl.textContent = highScore;
    saveHighScore();
  }

  // 显示结束画面
  overlay.classList.add('active');
  const title = overlay.querySelector('.title');
  const subtitle = overlay.querySelector('.subtitle');
  if(won){
    title.textContent = '🎉 恭喜通关！';
    subtitle.textContent = '你太厉害了！';
  } else {
    title.textContent = '💀 游戏结束';
    subtitle.textContent = '得分: ' + score + (score >= highScore && score > 0 ? ' 🏆新纪录！' : '');
  }
  btnStart.textContent = '再来一局';

  // 显示插屏广告
  if(typeof showInterstitialAd === 'function'){
    setTimeout(() => showInterstitialAd(), 500);
  }
}

function togglePause(){
  if(!gameRunning || gameOver) return;
  gamePaused = !gamePaused;
  updatePauseBtn();
  if(gamePaused){
    overlay.classList.add('active');
    overlay.querySelector('.title').textContent = '⏸ 暂停';
    overlay.querySelector('.subtitle').textContent = '按空格键继续';
    btnStart.textContent = '继续游戏';
    btnStart.onclick = function(){ togglePause(); };
  } else {
    overlay.classList.remove('active');
    btnStart.textContent = '开始游戏';
    btnStart.onclick = startGame;
  }
}

function updatePauseBtn(){
  btnPause.textContent = gamePaused ? '▶' : '⏸';
  btnPause.classList.toggle('active', gamePaused);
}

function restartGame(){
  if(gameLoop) clearInterval(gameLoop);
  gameLoop = null;
  gameRunning = false;
  gameOver = false;
  gamePaused = false;
  particles = [];
  overlay.classList.add('active');
  overlay.querySelector('.title').textContent = '🐍 贪吃蛇';
  overlay.querySelector('.subtitle').textContent = '经典版';
  btnStart.textContent = '开始游戏';
  btnStart.onclick = startGame;
  updatePauseBtn();
  drawInitialScreen();
}

// --- 粒子系统 ---
function spawnParticles(x, y){
  const skin = SKINS[currentSkin];
  const px = x * GRID + GRID/2;
  const py = y * GRID + GRID/2;
  for(let i = 0; i < 8; i++){
    particles.push({
      x: px, y: py,
      vx: (Math.random() - .5) * 4,
      vy: (Math.random() - .5) * 4,
      life: 1,
      decay: .02 + Math.random() * .04,
      color: skin.particleColor,
      size: 2 + Math.random() * 3
    });
  }
}

function updateParticles(){
  for(let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= p.decay;
    if(p.life <= 0) particles.splice(i, 1);
  }
}

// --- 绘制 ---
function updateSkin(){
  const skin = SKINS[currentSkin];
  const wrapper = document.getElementById('canvas-wrapper');
  wrapper.style.borderColor = skin.border;
  wrapper.style.boxShadow = `0 0 20px ${skin.shadow},0 0 60px ${skin.shadow.replace('.15','.05')}`;
}

function drawInitialScreen(){
  ctx.fillStyle = SKINS[currentSkin].bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  drawGrid();
}

function draw(){
  const skin = SKINS[currentSkin];
  const w = canvas.width;
  const h = canvas.height;

  // 背景
  ctx.fillStyle = skin.bg;
  ctx.fillRect(0, 0, w, h);

  // 网格
  drawGrid(skin);

  // 食物
  if(food){
    foodPulse += .06;
    const pulse = 1 + Math.sin(foodPulse) * .15;
    const fx = food.x * GRID + GRID/2;
    const fy = food.y * GRID + GRID/2;
    const fr = GRID/2 * .7 * pulse;

    // 食物光晕
    const glowGrad = ctx.createRadialGradient(fx, fy, fr*.3, fx, fy, fr*1.8);
    glowGrad.addColorStop(0, skin.foodGlow);
    glowGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = glowGrad;
    ctx.beginPath();
    ctx.arc(fx, fy, fr*1.8, 0, Math.PI*2);
    ctx.fill();

    // 食物主体
    ctx.fillStyle = skin.food;
    ctx.beginPath();
    ctx.arc(fx, fy, fr, 0, Math.PI*2);
    ctx.fill();

    // 高光
    ctx.fillStyle = skin.foodInner;
    ctx.beginPath();
    ctx.arc(fx - fr*.25, fy - fr*.25, fr*.3, 0, Math.PI*2);
    ctx.fill();
  }

  // 蛇身
  for(let i = snake.length - 1; i >= 0; i--){
    const seg = snake[i];
    const sx = seg.x * GRID;
    const sy = seg.y * GRID;
    const pad = currentSkin === 'pixel' ? 1 : 2;

    if(i === 0){
      // 蛇头光晕
      const headCx = sx + GRID/2;
      const headCy = sy + GRID/2;
      const headGlow = ctx.createRadialGradient(headCx, headCy, GRID*.3, headCx, headCy, GRID*1.2);
      headGlow.addColorStop(0, skin.snakeGlow);
      headGlow.addColorStop(1, 'transparent');
      ctx.fillStyle = headGlow;
      ctx.fillRect(sx - GRID*.3, sy - GRID*.3, GRID*1.6, GRID*1.6);

      // 蛇头
      ctx.fillStyle = skin.snakeHead;
      ctx.fillRect(sx + pad, sy + pad, GRID - pad*2, GRID - pad*2);

      // 眼睛
      ctx.fillStyle = '#000';
      const eyeSize = 3;
      let ex1, ey1, ex2, ey2;
      if(direction.x === 1){ ex1 = sx+13; ey1 = sy+5; ex2 = sx+13; ey2 = sy+13; }
      else if(direction.x === -1){ ex1 = sx+5; ey1 = sy+5; ex2 = sx+5; ey2 = sy+13; }
      else if(direction.y === -1){ ex1 = sx+5; ey1 = sy+5; ex2 = sx+13; ey2 = sy+5; }
      else { ex1 = sx+5; ey1 = sy+13; ex2 = sx+13; ey2 = sy+13; }
      ctx.fillRect(ex1, ey1, eyeSize, eyeSize);
      ctx.fillRect(ex2, ey2, eyeSize, eyeSize);
    } else {
      // 蛇身渐变
      const alpha = 1 - (i / (snake.length + 10)) * .4;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = skin.snakeBody;
      ctx.fillRect(sx + pad, sy + pad, GRID - pad*2, GRID - pad*2);

      // 像素风格内边框
      if(currentSkin === 'pixel'){
        ctx.fillStyle = skin.snakeHead;
        ctx.fillRect(sx + pad + 1, sy + pad + 1, GRID - pad*2 - 2, GRID - pad*2 - 2);
      }
      ctx.globalAlpha = 1;
    }
  }

  // 粒子
  for(const p of particles){
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawGrid(skin){
  const s = skin || SKINS[currentSkin];
  ctx.strokeStyle = s.grid;
  ctx.lineWidth = .5;
  for(let x = 0; x <= canvas.width; x += GRID){
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, canvas.height);
    ctx.stroke();
  }
  for(let y = 0; y <= canvas.height; y += GRID){
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(canvas.width, y);
    ctx.stroke();
  }
}

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq = 440, duration = 0.1) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }
