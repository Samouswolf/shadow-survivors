<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>极速跑酷</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(180deg, #1a1a2e 0%, #0f0f23 100%); min-height: 100vh; overflow: hidden; }
#game-container { position: relative; width: 100%; height: 100vh; }
#game-canvas { display: block; width: 100%; height: 100%; }
#game-ui { position: absolute; top: 20px; left: 20px; color: #fff; font-size: 20px; font-weight: bold; z-index: 10; }
#game-ui span { color: #4ade80; }
#game-over { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 20; flex-direction: column; align-items: center; justify-content: center; }
#game-over h2 { font-size: 48px; color: #f5576c; margin-bottom: 20px; }
#game-over p { font-size: 24px; color: #fff; margin-bottom: 30px; }
#game-over .btn { padding: 15px 40px; font-size: 20px; background: #6366f1; color: #fff; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
#game-over .btn:hover { transform: scale(1.1); }
#start-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#start-screen h1 { font-size: 48px; color: #6366f1; margin-bottom: 20px; text-shadow: 0 0 20px rgba(99,102,241,0.5); }
#start-screen p { color: #aaa; margin-bottom: 40px; font-size: 16px; }
#start-screen .btn { padding: 18px 50px; font-size: 22px; background: linear-gradient(145deg, #6366f1, #4f46e5); color: #fff; border: none; border-radius: 15px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 20px rgba(99,102,241,0.4); }
#start-screen .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(99,102,241,0.6); }
#loading-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a2e; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#loading-screen .loading-icon { width: 60px; height: 60px; border: 4px solid #6366f1; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#loading-screen p { color: #6366f1; margin-top: 20px; font-size: 18px; }
.ad-banner-container { position: absolute; bottom: 0; left: 0; width: 100%; padding: 10px; z-index: 10; }
.sponsor-btn { position: fixed; bottom:8px; left:8px; width: 50px; height: 50px; background: rgba(255,165,0,0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; z-index: 100; box-shadow: 0 4px 15px rgba(255,165,0,0.4); }
.sponsor-btn:hover { transform: scale(1.1); }
.sponsor-panel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 200; align-items: center; justify-content: center; }
.sponsor-panel.show { display: flex; }
.sponsor-content { background: #fff; padding: 30px; border-radius: 20px; text-align: center; max-width: 90%; }
.sponsor-content h3 { margin-bottom: 20px; color: #333; }
.sponsor-close { position: absolute; top: 20px; right: 20px; width: 40px; height: 40px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; }
.interstitial-ad { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 999; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
.interstitial-ad .ad-content { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; text-align: center; min-width: 280px; max-width: 400px; }
.interstitial-ad .ad-content p { color: #aaa; font-size: 14px; margin-bottom: 12px; }
.interstitial-ad .skip-btn { padding: 8px 28px; background: rgba(255,215,0,0.15); border: 1px solid rgba(255,215,0,0.3); border-radius: 20px; color: #ffd700; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.2s; }
.interstitial-ad .skip-btn:hover { background: rgba(255,215,0,0.25); }

/* [AD-FIX:responsive] */
@media (max-width:768px){.ad-banner-container{display:none!important}.sponsor-btn{transform:scale(.8);opacity:.6}}
/* [/AD-FIX:responsive] */
</style>
</head>
<body>
<div id="start-screen">
  <h1>🏃 极速跑酷</h1>
  <p>点击屏幕或按空格键跳跃<br>躲避障碍物，跑得越远越好！</p>
  <button class="btn" onclick="startGame()">开始游戏</button>
</div>

<div id="game-container">
  <canvas id="game-canvas"></canvas>
  <div id="game-ui">
    分数: <span id="score">0</span> | 最高: <span id="high-score">0</span>
  </div>
  
  <div id="game-over">
    <h2>💥 游戏结束</h2>
    <p>最终得分: <span id="final-score">0</span></p>
    <button class="btn" onclick="restartGame()">再来一次</button>
  </div>
  
  <div class="ad-banner-container">
    <div style="background:#f0f0f0;height:90px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#666;font-size:14px;">广告位</div>
  </div>
</div>

<div class="sponsor-btn" onclick="showSponsor()">☕</div>
<div class="sponsor-panel" id="sponsor-panel" onclick="hideSponsor()">
  <div class="sponsor-content" onclick="event.stopPropagation()">
    <h3>支持开发者</h3>
    <p>感谢您的支持！</p>
    <div style="color:#666;font-size:14px;margin-top:10px;">微信赞赏码</div>
  </div>
  <div class="sponsor-close" onclick="hideSponsor()">×</div>
</div>

<div id="loading-screen">
  <div class="loading-icon"></div>
  <p>加载中...</p>
</div>

<div class="interstitial-ad" id="interstitialAd">
  <div class="ad-content">
    <p>📢 赞助商广告</p>
    <div id="interstitialAdSlot" style="min-height:250px;display:flex;align-items:center;justify-content:center;color:#888;font-size:13px;">广告加载中...</div>
  </div>
  <button class="skip-btn" id="skipInterstitial" onclick="closeInterstitial()">跳过广告 ▶</button>
</div>


  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script src="../game_core.js"></script>
<script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script>
// ==================== 游戏常量配置 ====================
const GAME_NAME = '极速跑酷';

// ==================== 游戏核心组件 ====================
/**
 * GameCore 类 - 提供游戏核心功能支持
 * 包含存档管理、最高分记录等通用功能
 */
class GameCore {
  /**
   * 初始化游戏核心组件
   * @param {Object} options - 配置选项
   * @param {string} options.highScore - 最高分存储键名
   */
  static init(options) {
    if (options && options.highScore) {
      this.highScoreKey = options.highScore;
    }
  }
  
  /**
   * 获取最高分
   * @returns {number} 当前存储的最高分
   */
  static getHighScore() {
    try {
      return parseInt(localStorage.getItem(this.highScoreKey)) || 0;
    } catch (error) {
      console.warn('读取最高分失败:', error);
      return 0;
    }
  }
  
  /**
   * 设置新的最高分
   * @param {number} value - 新分数
   * @returns {boolean} 是否成功更新最高分
   */
  static setHighScore(value) {
    try {
      const current = this.getHighScore();
      if (value > current) {
        localStorage.setItem(this.highScoreKey, value.toString());
        return true;
      }
      return false;
    } catch (error) {
      console.warn('保存最高分失败:', error);
      return false;
    }
  }
}

// 初始化游戏核心组件
GameCore.init({ highScore: GAME_NAME });

// ==================== DOM元素引用 ====================
let canvas, ctx, scoreEl, highScoreEl, finalScoreEl;

/**
 * 初始化DOM元素引用
 * 在页面加载完成后调用
 */
function initDOM() {
  try {
    canvas = document.getElementById('game-canvas');
    ctx = canvas.getContext('2d');
    scoreEl = document.getElementById('score');
    highScoreEl = document.getElementById('high-score');
    finalScoreEl = document.getElementById('final-score');
    
    if (!canvas || !ctx) {
      throw new Error('Canvas元素初始化失败');
    }
  } catch (error) {
    console.error('DOM初始化错误:', error);
    alert('游戏初始化失败，请刷新页面重试');
  }
}

// ==================== 游戏状态变量 ====================
let gameRunning = false;
let score = 0;
let speed = 5;
let obstacles = [];
let particles = [];

/**
 * 玩家对象定义
 * 包含位置、尺寸、速度等属性
 */
const player = {
  x: 50,
  y: 0,
  width: 40,
  height: 60,
  velocityY: 0,
  isJumping: false,
  color: '#6366f1'
};

let groundY = 0;

// ==================== 画布处理 ====================
/**
 * 调整画布大小以适应窗口
 * 确保游戏在不同屏幕尺寸下正常显示
 */
function resizeCanvas() {
  try {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    groundY = canvas.height - 100;
    player.y = groundY;
  } catch (error) {
    console.error('画布调整失败:', error);
  }
}

// ==================== 游戏流程控制 ====================
/**
 * 开始游戏
 * 重置游戏状态，启动游戏循环
 */
function startGame() {
  try {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('game-over').style.display = 'none';
    gameRunning = true;
    score = 0;
    speed = 5;
    obstacles = [];
    particles = [];
    player.y = groundY;
    player.velocityY = 0;
    player.isJumping = false;
    highScoreEl.textContent = GameCore.getHighScore();
    scoreEl.textContent = '0';
    gameLoop();
  } catch (error) {
    console.error('开始游戏失败:', error);
    alert('游戏启动失败，请重试');
  }
}

/**
 * 重新开始游戏
 * 调用startGame重置状态
 */
function restartGame() {
  startGame();
}

// ==================== UI交互 ====================
/**
 * 显示赞助面板
 */
function showSponsor() {
  try {
    document.getElementById('sponsor-panel').classList.add('show');
  } catch (error) {
    console.error('显示赞助面板失败:', error);
  }
}

/**
 * 隐藏赞助面板
 */
function hideSponsor() {
  try {
    document.getElementById('sponsor-panel').classList.remove('show');
  } catch (error) {
    console.error('隐藏赞助面板失败:', error);
  }
}

/**
 * 关闭插屏广告
 */
function closeInterstitial() {
  try {
    document.getElementById('interstitialAd').style.display = 'none';
  } catch (error) {
    console.error('关闭广告失败:', error);
  }
}

// ==================== 游戏逻辑 ====================
/**
 * 玩家跳跃
 * 当玩家不在空中且游戏运行时触发跳跃
 */
function jump() {
  if (!player.isJumping && gameRunning) {
    player.velocityY = -15;
    player.isJumping = true;
    createParticles(player.x + player.width/2, player.y + player.height, '#6366f1');
  }
}

/**
 * 创建粒子效果
 * @param {number} x - 粒子生成位置X坐标
 * @param {number} y - 粒子生成位置Y坐标
 * @param {string} color - 粒子颜色
 */
function createParticles(x, y, color) {
  for (let i = 0; i < 5; i++) {
    particles.push({
      x: x,
      y: y,
      vx: (Math.random() - 0.5) * 4,
      vy: (Math.random() - 0.5) * 4,
      size: Math.random() * 5 + 2,
      color: color,
      life: 1
    });
  }
}

/**
 * 生成障碍物
 * 根据随机类型创建不同样式的障碍物
 */
function spawnObstacle() {
  const types = ['low', 'high', 'double'];
  const type = types[Math.floor(Math.random() * types.length)];
  
  let obstacle = {
    x: canvas.width,
    type: type,
    passed: false
  };
  
  if (type === 'low') {
    obstacle.width = 40;
    obstacle.height = 30;
    obstacle.y = groundY + 70;
    obstacle.color = '#f5576c';
  } else if (type === 'high') {
    obstacle.width = 30;
    obstacle.height = 50;
    obstacle.y = groundY + 50;
    obstacle.color = '#fbbf24';
  } else {
    obstacle.width = 20;
    obstacle.height = 40;
    obstacle.y = groundY + 60;
    obstacle.color = '#ef4444';
    obstacle.hasSecond = true;
    obstacle.secondX = canvas.width + 50;
  }
  
  obstacles.push(obstacle);
}

/**
 * 更新游戏状态
 * 处理玩家移动、障碍物更新、碰撞检测等
 */
function update() {
  if (!gameRunning) return;
  
  // 更新分数和速度
  score += 0.1;
  scoreEl.textContent = Math.floor(score);
  speed += 0.001;
  
  // 玩家物理更新
  player.velocityY += 0.8;
  player.y += player.velocityY;
  
  // 地面碰撞检测
  if (player.y >= groundY) {
    player.y = groundY;
    player.velocityY = 0;
    player.isJumping = false;
  }
  
  // 随机生成障碍物
  if (Math.random() < 0.02) {
    spawnObstacle();
  }
  
  // 更新障碍物位置并检测碰撞
  obstacles.forEach(obstacle => {
    obstacle.x -= speed;
    
    if (obstacle.hasSecond) {
      obstacle.secondX -= speed;
    }
    
    if (obstacle.x + obstacle.width < 0) {
      obstacle.passed = true;
    }
    
    // 碰撞检测
    if (!obstacle.passed &&
        player.x < obstacle.x + obstacle.width &&
        player.x + player.width > obstacle.x &&
        player.y + player.height > obstacle.y &&
        player.y < obstacle.y + obstacle.height) {
      gameOver();
    }
    
    if (obstacle.hasSecond && !obstacle.passed &&
        player.x < obstacle.secondX + obstacle.width &&
        player.x + player.width > obstacle.secondX &&
        player.y + player.height > obstacle.y &&
        player.y < obstacle.y + obstacle.height) {
      gameOver();
    }
  });
  
  // 清理已通过的障碍物
  obstacles = obstacles.filter(o => !o.passed);
  
  // 更新粒子状态
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.03;
  });
  
  // 清理已消失的粒子
  particles = particles.filter(p => p.life > 0);
}

/**
 * 绘制游戏画面
 * 渲染背景、玩家、障碍物、粒子等元素
 */
function draw() {
  try {
    // 清空画布
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // 绘制背景
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // 绘制地面
    ctx.fillStyle = '#16213e';
    ctx.fillRect(0, groundY + 100, canvas.width, canvas.height - groundY - 100);
    
    // 绘制地面线条
    ctx.fillStyle = '#4ade80';
    ctx.fillRect(0, groundY + 95, canvas.width, 5);
    
    // 绘制玩家
    ctx.fillStyle = player.color;
    ctx.fillRect(player.x, player.y, player.width, player.height);
    
    // 绘制玩家眼睛
    ctx.fillStyle = '#fff';
    ctx.fillRect(player.x + 10, player.y + 15, 8, 8);
    ctx.fillRect(player.x + 22, player.y + 15, 8, 8);
    
    // 绘制障碍物
    obstacles.forEach(obstacle => {
      ctx.fillStyle = obstacle.color;
      
      if (obstacle.type === 'low') {
        // 三角形障碍物
        ctx.beginPath();
        ctx.moveTo(obstacle.x, obstacle.y);
        ctx.lineTo(obstacle.x + obstacle.width/2, obstacle.y - 20);
        ctx.lineTo(obstacle.x + obstacle.width, obstacle.y);
        ctx.fill();
      } else if (obstacle.type === 'high') {
        // 矩形障碍物
        ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
        ctx.fillStyle = '#fff';
        ctx.fillRect(obstacle.x + 5, obstacle.y + 10, 5, 5);
        ctx.fillRect(obstacle.x + 20, obstacle.y + 10, 5, 5);
      } else {
        // 双障碍物
        ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
        if (obstacle.hasSecond) {
          ctx.fillRect(obstacle.secondX, obstacle.y, obstacle.width, obstacle.height);
        }
      }
    });
    
    // 绘制粒子
    particles.forEach(p => {
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    });
    
    ctx.globalAlpha = 1;
  } catch (error) {
    console.error('绘制错误:', error);
  }
}

/**
 * 游戏主循环
 * 使用requestAnimationFrame实现平滑动画
 */
function gameLoop() {
  if (!gameRunning) return;
  
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

/**
 * 游戏结束处理
 * 停止游戏运行，显示结束界面，保存最高分
 */
function gameOver() {
  try {
    gameRunning = false;
    const finalScore = Math.floor(score);
    finalScoreEl.textContent = finalScore;
    
    if (GameCore.setHighScore(finalScore)) {
      highScoreEl.textContent = finalScore;
    }
    
    document.getElementById('game-over').style.display = 'flex';
  } catch (error) {
    console.error('游戏结束处理失败:', error);
  }
}

// ==================== 事件监听 ====================
/**
 * 键盘事件处理
 * 空格键触发跳跃
 */
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    if (gameRunning) {
      jump();
    }
  }
});

/**
 * 鼠标点击事件处理
 * 点击画布触发跳跃
 */
canvas.addEventListener('click', () => {
  if (gameRunning) {
    jump();
  }
});

/**
 * 触屏事件处理
 * 触摸画布触发跳跃
 */
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (gameRunning) {
    jump();
  }
});

// ==================== 初始化 ====================
/**
 * 页面加载完成后执行初始化
 */
window.addEventListener('load', () => {
  try {
    initDOM();
    resizeCanvas();
    
    setTimeout(() => {
      document.getElementById('loading-screen').style.display = 'none';
    }, 1500);
  } catch (error) {
    console.error('初始化失败:', error);
  }
});

window.addEventListener('resize', resizeCanvas);
</script>
<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
</body>
</html>
