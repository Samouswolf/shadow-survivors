<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>飞刀挑战</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; overflow: hidden; }
#game-container { position: relative; width: 100%; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#game-canvas { display: block; max-width: 100%; }
#game-ui { position: absolute; top: 20px; left: 20px; color: #fff; font-size: 24px; font-weight: bold; z-index: 10; }
#game-ui span { color: #f5576c; }
#game-over { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 20; flex-direction: column; align-items: center; justify-content: center; }
#game-over h2 { font-size: 48px; color: #f5576c; margin-bottom: 20px; }
#game-over p { font-size: 24px; color: #fff; margin-bottom: 30px; }
#game-over .btn { padding: 15px 40px; font-size: 20px; background: #6366f1; color: #fff; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
#start-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#start-screen h1 { font-size: 48px; color: #f5576c; margin-bottom: 20px; text-shadow: 0 0 20px rgba(245,87,108,0.5); }
#start-screen p { color: #aaa; margin-bottom: 40px; font-size: 16px; }
#start-screen .btn { padding: 18px 50px; font-size: 22px; background: linear-gradient(145deg, #f5576c, #ec4899); color: #fff; border: none; border-radius: 15px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 20px rgba(245,87,108,0.4); }
.ad-banner-container { position: absolute; bottom: 0; left: 0; width: 100%; padding: 10px; z-index: 10; }
.sponsor-btn { position: fixed; top: 20px; right: 20px; width: 50px; height: 50px; background: rgba(255,165,0,0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; z-index: 100; box-shadow: 0 4px 15px rgba(255,165,0,0.4); }
.sponsor-panel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 200; align-items: center; justify-content: center; }
.sponsor-panel.show { display: flex; }
.sponsor-content { background: #fff; padding: 30px; border-radius: 20px; text-align: center; max-width: 90%; }
.sponsor-content h3 { margin-bottom: 20px; color: #333; }
.sponsor-close { position: absolute; top: 20px; right: 20px; width: 40px; height: 40px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; }

#loading-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a2e; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#loading-screen .loading-icon { width: 60px; height: 60px; border: 4px solid #6366f1; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#loading-screen p { color: #6366f1; margin-top: 20px; font-size: 18px; }
.interstitial-ad { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 999; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
.interstitial-ad .ad-content { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; text-align: center; min-width: 280px; max-width: 400px; }
.interstitial-ad .ad-content p { color: #aaa; font-size: 14px; margin-bottom: 12px; }
.interstitial-ad .skip-btn { padding: 8px 28px; background: rgba(255,215,0,0.15); border: 1px solid rgba(255,215,0,0.3); border-radius: 20px; color: #ffd700; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.2s; }
.interstitial-ad .skip-btn:hover { background: rgba(255,215,0,0.25); }

</style>
</head>
<body>
<div id="start-screen">
  <h1>🗡️ 飞刀挑战</h1>
  <p>点击屏幕投掷飞刀<br>避开已有的飞刀，击中目标！</p>
  <button class="btn" onclick="startGame()">开始游戏</button>
</div>

<div id="game-container">
  <canvas id="game-canvas"></canvas>
  <div id="game-ui">
    关卡: <span id="level">1</span> | 飞刀: <span id="knives-left">6</span> | 最高: <span id="high-score">0</span>
  </div>
  
  <div id="game-over">
    <h2>💥 游戏结束</h2>
    <p>最终关卡: <span id="final-level">1</span></p>
    <button class="btn" onclick="restartGame()">再来一次</button>
  </div>
  
  <div class="ad-banner-container">
    <div style="background:#f0f0f0;height:90px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#666;font-size:14px;">广告位</div>
  </div>
</div>

<div class="sponsor-btn" onclick="showSponsor()">☕</div>
<div class="sponsor-panel" id="sponsor-panel" onclick="hideSponsor()">
  <div class="sponsor-content" onclick="event.stopPropagation()">
    <h3>支持开发者</h3>
    <p>感谢您的支持！</p>
    <div style="color:#666;font-size:14px;margin-top:10px;">微信赞赏码</div>
  </div>
  <div class="sponsor-close" onclick="hideSponsor()">×</div>
</div>


<div id="loading-screen">
  <div class="loading-icon"></div>
  <p>加载中...</p>
</div>

<div class="interstitial-ad" id="interstitialAd">
  <div class="ad-content">
    <p>赞助商广告</p>
    <div id="interstitialAdSlot" style="min-height:250px;display:flex;align-items:center;justify-content:center;color:#888;font-size:13px;">广告加载中...</div>
  </div>
  <button class="skip-btn" id="skipInterstitial" onclick="closeInterstitial()">跳过广告</button>
</div>


  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script>

// ==================== 游戏说明 ====================
// 操作说明: 使用键盘方向键或触屏控制
// 游戏目标: 获得最高分数
// 存档系统: 自动保存最高分到本地
// ==================== 模块说明 ====================
// 1. 游戏初始化模块 - 初始化Canvas和游戏状态
// 2. 游戏逻辑模块 - 处理玩家移动、碰撞检测
// 3. 渲染模块 - 绘制游戏画面和UI
// 4. 音效模块 - 播放游戏音效
// 5. 存档模块 - 管理最高分记录
// ==================== 配置参数 ====================
const GAME_NAME = '飞刀挑战';

class GameCore {
  static init(options) {
    if (options.highScore) {
      this.highScoreKey = options.highScore;
    }
  }
  
  static getHighScore() {
    return parseInt(localStorage.getItem(this.highScoreKey)) || 0;
  }
  
  static setHighScore(value) {
    const current = this.getHighScore();
    if (value > current) {
      localStorage.setItem(this.highScoreKey, value);
      return true;
    }
    return false;
  }
}

GameCore.init({ highScore: GAME_NAME });

const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
const levelEl = document.getElementById('level');
const knivesLeftEl = document.getElementById('knives-left');
const highScoreEl = document.getElementById('high-score');
const finalLevelEl = document.getElementById('final-level');

canvas.width = 400;
canvas.height = 500;

let gameRunning = false;
let level = 1;
let knivesPerLevel = 6;
let knivesLeft = 6;
let knives = [];
let targetRotation = 0;
let targetRotationSpeed = 0.02;
let flyingKnife = null;
let particles = [];

const target = {
  x: canvas.width / 2,
  y: 150,
  radius: 80
};

const knife = {
  x: canvas.width / 2,
  y: canvas.height - 80,
  width: 10,
  height: 70,
  angle: -Math.PI / 2
};

function startGame() {
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('game-over').style.display = 'none';
  gameRunning = true;
  level = 1;
  knivesPerLevel = 6;
  knivesLeft = 6;
  knives = [];
  targetRotation = 0;
  targetRotationSpeed = 0.02;
  flyingKnife = null;
  
  levelEl.textContent = '1';
  knivesLeftEl.textContent = '6';
  highScoreEl.textContent = GameCore.getHighScore();
  
  gameLoop();
}

function restartGame() {
  startGame();
}

function showSponsor() {
  document.getElementById('sponsor-panel').classList.add('show');
}

function hideSponsor() {
  document.getElementById('sponsor-panel').classList.remove('show');
}

function createParticles(x, y, color) {
  for (let i = 0; i < 10; i++) {
    particles.push({
      x: x,
      y: y,
      vx: (Math.random() - 0.5) * 10,
      vy: (Math.random() - 0.5) * 10,
      size: Math.random() * 5 + 2,
      color: color,
      life: 1
    });
  }
}

function throwKnife() {
  if (!gameRunning || flyingKnife || knivesLeft <= 0) return;
  
  flyingKnife = {
    x: knife.x,
    y: knife.y,
    width: knife.width,
    height: knife.height,
    angle: knife.angle,
    velocityY: -15
  };
}

function checkCollision(newKnife) {
  for (const existingKnife of knives) {
    const dx = newKnife.x - existingKnife.x;
    const dy = newKnife.y - existingKnife.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    
    if (dist < 25) {
      return true;
    }
  }
  return false;
}

function update() {
  if (!gameRunning) return;
  
  targetRotation += targetRotationSpeed;
  
  if (flyingKnife) {
    flyingKnife.y += flyingKnife.velocityY;
    flyingKnife.velocityY += 0.3;
    
    const distToTarget = flyingKnife.y - target.y;
    
    if (Math.abs(distToTarget) < 5) {
      const landedKnife = {
        x: flyingKnife.x,
        y: target.y,
        angle: targetRotation + Math.PI / 2
      };
      
      if (checkCollision(landedKnife)) {
        createParticles(flyingKnife.x, flyingKnife.y, '#f5576c');
        gameOver();
      } else {
        knives.push(landedKnife);
        knivesLeft--;
        knivesLeftEl.textContent = knivesLeft;
        createParticles(flyingKnife.x, flyingKnife.y, '#fbbf24');
        
        if (knivesLeft <= 0) {
          nextLevel();
        }
      }
      
      flyingKnife = null;
    }
  }
  
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.03;
  });
  
  particles = particles.filter(p => p.life > 0);
}

function nextLevel() {
  level++;
  levelEl.textContent = level;
  
  if (level > GameCore.getHighScore()) {
    GameCore.setHighScore(level);
    highScoreEl.textContent = level;
  }
  
  knivesPerLevel = Math.min(knivesPerLevel + 2, 12);
  knivesLeft = knivesPerLevel;
  knivesLeftEl.textContent = knivesLeft;
  
  targetRotationSpeed = Math.min(targetRotationSpeed + 0.005, 0.08);
  
  setTimeout(() => {
    knives = [];
  }, 500);
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  ctx.fillStyle = '#16213e';
  for (let i = 0; i < 30; i++) {
    const x = (i * 47 + Date.now() * 0.01) % canvas.width;
    const y = (i * 33 + Date.now() * 0.02) % canvas.height;
    ctx.fillRect(x, y, 2, 2);
  }
  
  ctx.save();
  ctx.translate(target.x, target.y);
  ctx.rotate(targetRotation);
  
  ctx.fillStyle = '#4f46e5';
  ctx.beginPath();
  ctx.arc(0, 0, target.radius, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.fillStyle = '#6366f1';
  ctx.beginPath();
  ctx.arc(0, 0, target.radius - 10, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.fillStyle = '#818cf8';
  ctx.beginPath();
  ctx.arc(0, 0, target.radius - 20, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.fillStyle = '#4f46e5';
  ctx.beginPath();
  ctx.arc(0, 0, 20, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.restore();
  
  knives.forEach(k => {
    ctx.save();
    ctx.translate(k.x, k.y);
    ctx.rotate(k.angle);
    
    ctx.fillStyle = '#fbbf24';
    ctx.fillRect(-k.width / 2, -k.height / 2, k.width, k.height);
    
    ctx.fillStyle = '#f59e0b';
    ctx.fillRect(-k.width / 2 + 2, -k.height / 2 + 5, k.width - 4, 20);
    
    ctx.fillStyle = '#fff';
    ctx.fillRect(-k.width / 2 + 1, -k.height / 2, k.width - 2, 5);
    
    ctx.restore();
  });
  
  if (!flyingKnife) {
    ctx.save();
    ctx.translate(knife.x, knife.y);
    ctx.rotate(knife.angle);
    
    ctx.fillStyle = '#fbbf24';
    ctx.fillRect(-knife.width / 2, -knife.height / 2, knife.width, knife.height);
    
    ctx.fillStyle = '#f59e0b';
    ctx.fillRect(-knife.width / 2 + 2, -knife.height / 2 + 5, knife.width - 4, 20);
    
    ctx.fillStyle = '#fff';
    ctx.fillRect(-knife.width / 2 + 1, -knife.height / 2, knife.width - 2, 5);
    
    ctx.restore();
  }
  
  if (flyingKnife) {
    ctx.save();
    ctx.translate(flyingKnife.x, flyingKnife.y);
    ctx.rotate(flyingKnife.angle);
    
    ctx.fillStyle = '#fbbf24';
    ctx.fillRect(-flyingKnife.width / 2, -flyingKnife.height / 2, flyingKnife.width, flyingKnife.height);
    
    ctx.fillStyle = '#f59e0b';
    ctx.fillRect(-flyingKnife.width / 2 + 2, -flyingKnife.height / 2 + 5, flyingKnife.width - 4, 20);
    
    ctx.fillStyle = '#fff';
    ctx.fillRect(-flyingKnife.width / 2 + 1, -flyingKnife.height / 2, flyingKnife.width - 2, 5);
    
    ctx.restore();
  }
  
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });
  
  ctx.globalAlpha = 1;
}

function gameLoop() {
  if (!gameRunning) return;
  
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

function gameOver() {
  gameRunning = false;
  finalLevelEl.textContent = level;
  
  document.getElementById('game-over').style.display = 'flex';
}

canvas.addEventListener('click', throwKnife);

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  throwKnife();
});

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    throwKnife();
  }
});

// ==================== 错误处理 ====================
function closeInterstitial() {
  try {
    var el = document.getElementById('interstitialAd');
    if (el) el.style.display = 'none';
  } catch (error) {
    console.error('关闭广告失败:', error);
  }
}

// ==================== 音效支持 ====================
var audioCtx = null;
function initAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch (error) {
    console.warn('音频初始化失败:', error);
  }
}
function playSound(freq, dur, type, vol) {
  try {
    if (!audioCtx) return;
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = type || 'square';
    o.frequency.value = freq;
    g.gain.value = vol || 0.15;
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime + dur);
  } catch (error) {
    console.warn('音效播放失败:', error);
  }
}

// ==================== 页面加载处理 ====================
window.addEventListener('load', function() {
  try {
    var loadingScreen = document.getElementById('loading-screen');
    if (loadingScreen) {
      setTimeout(function() {
        loadingScreen.style.display = 'none';
      }, 1500);
    }
  } catch (error) {
    console.error('加载界面处理失败:', error);
  }
});

</script>
</body>
</html>
