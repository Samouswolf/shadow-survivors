<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>极地探险</title>
    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;

<script src="game_core.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px;
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            border-radius: 12px;
        }
        .stat {
            text-align: center;
            color: white;
        }
        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }
        .stat-value {
            font-size: 20px;
            font-weight: bold;
        }
        .polar-view {
            height: 150px;
            background: linear-gradient(180deg, #ecf0f1, #bdc3c7);
            border-radius: 12px;
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
        }
        .snow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: white;
            opacity: 0.3;
        }
        .iceberg {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 40px;
            background: #dfe6e9;
            border-radius: 20px 20px 0 0;
        }
        .explorer {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 30px;
        }
        .animal {
            position: absolute;
            font-size: 24px;
            animation: move 3s infinite;
        }
        @keyframes move {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(30px); }
        }
        .status-bars {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
            padding: 15px;
            background: #dfe6e9;
            border-radius: 12px;
        }
        .status-bar {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .status-icon {
            font-size: 20px;
        }
        .bar-container {
            flex: 1;
            height: 20px;
            background: #b2bec3;
            border-radius: 10px;
        }
        .bar-fill {
            height: 100%;
            border-radius: 10px;
        }
        .bar-warmth { background: #e74c3c; }
        .bar-food { background: #f39c12; }
        .bar-energy { background: #2ecc71; }
        .bar-health { background: #3498db; }
        .actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        .action-btn {
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            background: #74b9ff;
            color: white;
        }
        .action-btn:hover {
            transform: scale(1.05);
        }
        .btn-walk { background: #0984e3; }
        .btn-camp { background: #e74c3c; }
        .btn-hunt { background: #f39c12; }
        .btn-warm { background: #e67e22; }
        .btn-eat { background: #2ecc71; }
        .btn-heal { background: #3498db; }
        .inventory {
            display: flex;
            gap: 10px;
            padding: 10px;
            background: #dfe6e9;
            border-radius: 10px;
        }
        .inv-item {
            padding: 10px;
            background: white;
            border-radius: 8px;
            text-align: center;
        }
        .inv-icon {
            font-size: 20px;
        }
        .inv-count {
            font-size: 12px;
            color: #636e72;
        }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            color: white;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 20px 40px;
            border-radius: 15px;
            font-size: 18px;
            display: none;
            z-index: 100;
            text-align: center;
        }
        .message.show { display: block; }
        .ad-banner {
            width: 100%;
            height: 60px;
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            margin-top: 10px;
            font-size: 14px;
        }

<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">天数</div>
                <div class="stat-value" id="days">1</div>
            </div>
            <div class="stat">
                <div class="stat-label">距离</div>
                <div class="stat-value" id="distance">0km</div>
            </div>
            <div class="stat">
                <div class="stat-label">温度</div>
                <div class="stat-value" id="temperature">-30°C</div>
            </div>
        </div>

        <div class="polar-view" id="polarView"></div>

        <div class="status-bars">
            <div class="status-bar">
                <span class="status-icon">🔥</span>
                <span style="width: 50px;">体温</span>
                <div class="bar-container">
                    <div class="bar-fill bar-warmth" id="warmthBar" style="width: 80%"></div>
                </div>
                <span id="warmthValue">80</span>
            </div>
            <div class="status-bar">
                <span class="status-icon">🍖</span>
                <span style="width: 50px;">食物</span>
                <div class="bar-container">
                    <div class="bar-fill bar-food" id="foodBar" style="width: 80%"></div>
                </div>
                <span id="foodValue">80</span>
            </div>
            <div class="status-bar">
                <span class="status-icon">⚡</span>
                <span style="width: 50px;">体力</span>
                <div class="bar-container">
                    <div class="bar-fill bar-energy" id="energyBar" style="width: 100%"></div>
                </div>
                <span id="energyValue">100</span>
            </div>
            <div class="status-bar">
                <span class="status-icon">❤️</span>
                <span style="width: 50px;">健康</span>
                <div class="bar-container">
                    <div class="bar-fill bar-health" id="healthBar" style="width: 100%"></div>
                </div>
                <span id="healthValue">100</span>
            </div>
        </div>

        <div class="actions">
            <button class="action-btn btn-walk" id="btnWalk">🚶 前行</button>
            <button class="action-btn btn-camp" id="btnCamp">🏕️ 扎营</button>
            <button class="action-btn btn-hunt" id="btnHunt">🦌 狩猎</button>
            <button class="action-btn btn-warm" id="btnWarm">🔥 取暖</button>
            <button class="action-btn btn-eat" id="btnEat">🍖 进食</button>
            <button class="action-btn btn-heal" id="btnHeal">💊 治疗</button>
        </div>

        <div class="inventory" id="inventory"></div>

        <div class="controls">
            <button class="btn btn-primary" id="btnReset">🔄 新探险</button>
        </div>

        <div class="message" id="message"></div>

        
    </div>

    <script>
        let warmth = 80;
        let food = 80;
        let energy = 100;
        let health = 100;
        let days = 1;
        let distance = 0;
        let temperature = -30;
        let inventory = { food: 2, fuel: 3, medicine: 1 };
        let gameOver = false;
        let animals = [];

        function initGame() {
            warmth = 80;
            food = 80;
            energy = 100;
            health = 100;
            days = 1;
            distance = 0;
            temperature = -30;
            inventory = { food: 2, fuel: 3, medicine: 1 };
            gameOver = false;
            animals = [];

            generateAnimals();
            renderPolar();
            renderInventory();
            updateUI();
        }

        function generateAnimals() {
            animals = [];
            for (let i = 0; i < 2; i++) {
                animals.push({
                    type: ['🦌', '🦊', '🐧', '🦭'][Math.floor(Math.random() * 4)],
                    x: Math.random() * 400,
                    y: Math.random() * 100 + 20
                });
            }
        }

        function renderPolar() {
            const el = document.getElementById('polarView');
            el.innerHTML = `
                <div class="snow"></div>
                <div class="iceberg"></div>
                <div class="explorer">🧍</div>
            `;

            animals.forEach(a => {
                const animal = document.createElement('div');
                animal.className = 'animal';
                animal.textContent = a.type;
                animal.style.left = a.x + 'px';
                animal.style.top = a.y + 'px';
                el.appendChild(animal);
            });
        }

        function walk() {
            if (gameOver) return;
            if (energy < 20) {
                showMessage('体力不足！');
                return;
            }

            distance += 5;
            energy -= 20;
            warmth -= 15;
            food -= 10;

            if (warmth < 30) {
                showMessage('体温过低！快取暖！');
                health -= 10;
            }

            checkStatus();
            generateAnimals();
            renderPolar();
            updateUI();
        }

        function camp() {
            if (gameOver) return;

            energy = Math.min(100, energy + 40);
            warmth = Math.min(100, warmth + 20);

            showMessage('扎营休息...');
            updateUI();
        }

        function hunt() {
            if (gameOver) return;
            if (energy < 30) {
                showMessage('体力不足！');
                return;
            }

            energy -= 30;
            warmth -= 10;

            const success = Math.random() > 0.4;
            if (success) {
                inventory.food += 3;
                showMessage('狩猎成功！获得3份食物');
            } else {
                showMessage('狩猎失败...');
            }

            renderInventory();
            updateUI();
        }

        function warmUp() {
            if (gameOver) return;
            if (inventory.fuel <= 0) {
                showMessage('没有燃料了！');
                return;
            }

            inventory.fuel--;
            warmth = Math.min(100, warmth + 40);

            showMessage('取暖成功！');
            renderInventory();
            updateUI();
        }

        function eat() {
            if (gameOver) return;
            if (inventory.food <= 0) {
                showMessage('没有食物了！');
                return;
            }

            inventory.food--;
            food = Math.min(100, food + 30);
            energy = Math.min(100, energy + 10);

            showMessage('进食补充能量');
            renderInventory();
            updateUI();
        }

        function heal() {
            if (gameOver) return;
            if (inventory.medicine <= 0) {
                showMessage('没有药品了！');
                return;
            }

            inventory.medicine--;
            health = Math.min(100, health + 30);

            showMessage('治疗恢复健康');
            renderInventory();
            updateUI();
        }

        function checkStatus() {
            if (warmth <= 0) {
                gameOver = true;
                showMessage('冻死...\n行走距离: ' + distance + 'km');
                GameCore.highScore.set('polar_game', distance);
            }
            if (food <= 0) {
                gameOver = true;
                showMessage('饿死...\n行走距离: ' + distance + 'km');
                GameCore.highScore.set('polar_game', distance);
            }
            if (health <= 0) {
                gameOver = true;
                showMessage('伤病死亡...\n行走距离: ' + distance + 'km');
                GameCore.highScore.set('polar_game', distance);
            }
        }

        function renderInventory() {
            const el = document.getElementById('inventory');
            el.innerHTML = `
                <div class="inv-item">
                    <div class="inv-icon">🍖</div>
                    <div class="inv-count">${inventory.food}</div>
                </div>
                <div class="inv-item">
                    <div class="inv-icon">🔥</div>
                    <div class="inv-count">${inventory.fuel}</div>
                </div>
                <div class="inv-item">
                    <div class="inv-icon">💊</div>
                    <div class="inv-count">${inventory.medicine}</div>
                </div>
            `;
        }

        function updateUI() {
            document.getElementById('days').textContent = days;
            document.getElementById('distance').textContent = distance + 'km';
            document.getElementById('temperature').textContent = temperature + '°C';
            document.getElementById('warmthBar').style.width = warmth + '%';
            document.getElementById('warmthValue').textContent = Math.max(0, warmth);
            document.getElementById('foodBar').style.width = food + '%';
            document.getElementById('foodValue').textContent = Math.max(0, food);
            document.getElementById('energyBar').style.width = energy + '%';
            document.getElementById('energyValue').textContent = Math.max(0, energy);
            document.getElementById('healthBar').style.width = health + '%';
            document.getElementById('healthValue').textContent = Math.max(0, health);
        }

        function showMessage(msg) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 1500);
        }

        document.getElementById('btnWalk').addEventListener('click', walk);
        document.getElementById('btnCamp').addEventListener('click', camp);
        document.getElementById('btnHunt').addEventListener('click', hunt);
        document.getElementById('btnWarm').addEventListener('click', warmUp);
        document.getElementById('btnEat').addEventListener('click', eat);
        document.getElementById('btnHeal').addEventListener('click', heal);
        document.getElementById('btnReset').addEventListener('click', initGame);

        // 自动消耗
        setInterval(() => {
            if (!gameOver) {
                warmth -= 3;
                food -= 1;
                if (warmth < 50) health -= 2;
                checkStatus();
                updateUI();
            }
        }, 3000);

        // 天数增加
        setInterval(() => {
            if (!gameOver) {
                days++;
                temperature = -20 - Math.floor(Math.random() * 30);
                updateUI();
            }
        }, 30000);

        // 初始化
        GameCore.init({ highScore: 'polar_game' });
        initGame();
    </script>

<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>
<!-- [/BATCH-FIX:responsive-js] -->
<!-- [BATCH-FIX:touch-support] -->
<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>

<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
