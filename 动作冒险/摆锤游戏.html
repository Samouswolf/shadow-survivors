<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>摆锤游戏</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #2c3e50 0%, #4ca1af 100%); min-height: 100vh; overflow: hidden; }
        .game-container { width: 100%; height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 10px; }
        .stat { display: flex; flex-direction: column; align-items: center; color: #fff; }
        .stat-label { font-size: 12px; opacity: 0.8; }
        .stat-value { font-size: 24px; font-weight: bold; color: #ffd700; }
        
        .canvas-container { flex: 1; position: relative; background: rgba(0,0,0,0.3); border-radius: 15px; overflow: hidden; }
        #gameCanvas { width: 100%; height: 100%; display: block; }
        
        .controls { display: flex; gap: 10px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
        .btn { padding: 12px 25px; border: none; border-radius: 25px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #f39c12, #e74c3c); color: #fff; }
        .btn-secondary { background: linear-gradient(135deg, #9b59b6, #8e44ad); color: #fff; }
        
        .info-panel { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: #fff; padding: 10px; border-radius: 10px; font-size: 12px; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 10px; font-size: 14px; }

.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}

</style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">得分</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">破坏目标</div>
                <div class="stat-value" id="targets">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">最高分</div>
                <div class="stat-value" id="highScore">0</div>
            </div>
        </div>
        
        <div class="canvas-container">
            <canvas id="gameCanvas"></canvas>
            <div class="info-panel">
                <div>点击释放摆锤</div>
                <div>击碎目标得分</div>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" id="btnRelease">🚀 释放摆锤</button>
            <button class="btn btn-secondary" id="btnRestart">🔄 重新开始</button>
        </div>
        
        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script src="../game_core.js"></script>
<script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let score = 0;
        let targetsDestroyed = 0;
        let highScore = parseInt(localStorage.getItem('highscore_摆锤游戏') || '0');
        
        let pendulum = {
            anchorX: 0,
            anchorY: 50,
            length: 200,
            angle: Math.PI / 4,
            angularVelocity: 0,
            released: false,
            ballRadius: 25
        };
        
        let targets = [];
        let particles = [];
        let level = 1;
        
        const TARGET_COLORS = ['#e74c3c', '#3498db', '#2ecc71', '#f39c12', '#9b59b6', '#1abc9c'];
        
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            pendulum.anchorX = canvas.width / 2;
            pendulum.length = Math.min(canvas.height - 150, 250);
            initLevel();
        }
        
        function initLevel() {
            targets = [];
            pendulum.angle = Math.PI / 4;
            pendulum.angularVelocity = 0;
            pendulum.released = false;
            
            const targetCount = 3 + level * 2;
            const baseY = pendulum.anchorY + pendulum.length + 50;
            
            for (let i = 0; i < targetCount; i++) {
                const row = Math.floor(i / 5);
                const col = i % 5;
                
                targets.push({
                    x: 100 + col * (canvas.width - 200) / 4,
                    y: baseY + row * 60,
                    radius: 25,
                    color: TARGET_COLORS[Math.floor(Math.random() * TARGET_COLORS.length)],
                    destroyed: false,
                    points: 10 + level * 5
                });
            }
        }
        
        function updatePendulum() {
            if (!pendulum.released) {
                // 简谐运动
                const gravity = 0.05;
                pendulum.angularVelocity += -gravity * Math.sin(pendulum.angle);
                pendulum.angularVelocity *= 0.99; // 阻尼
                pendulum.angle += pendulum.angularVelocity;
            } else {
                // 释放后的物理运动
                const gravity = 0.5;
                
                // 计算摆锤位置
                const ballX = pendulum.anchorX + Math.sin(pendulum.angle) * pendulum.length;
                const ballY = pendulum.anchorY + Math.cos(pendulum.angle) * pendulum.length;
                
                // 转换为自由落体
                pendulum.freeFall = true;
                pendulum.ballX = ballX;
                pendulum.ballY = ballY;
                
                if (pendulum.freeFall) {
                    if (!pendulum.vx && !pendulum.vy) {
                        pendulum.vx = pendulum.angularVelocity * Math.cos(pendulum.angle) * pendulum.length;
                        pendulum.vy = -pendulum.angularVelocity * Math.sin(pendulum.angle) * pendulum.length;
                    }
                    
                    pendulum.vy += gravity;
                    pendulum.ballX += pendulum.vx;
                    pendulum.ballY += pendulum.vy;
                    
                    // 边界碰撞
                    if (pendulum.ballX < pendulum.ballRadius) {
                        pendulum.ballX = pendulum.ballRadius;
                        pendulum.vx *= -0.6;
                    }
                    if (pendulum.ballX > canvas.width - pendulum.ballRadius) {
                        pendulum.ballX = canvas.width - pendulum.ballRadius;
                        pendulum.vx *= -0.6;
                    }
                    if (pendulum.ballY > canvas.height - pendulum.ballRadius) {
                        pendulum.ballY = canvas.height - pendulum.ballRadius;
                        pendulum.vy *= -0.6;
                        pendulum.vx *= 0.8;
                        
                        // 停止条件
                        if (Math.abs(pendulum.vy) < 1 && Math.abs(pendulum.vx) < 1) {
                            setTimeout(() => {
                                if (targetsDestroyed >= targets.length * 0.5) {
                                    level++;
                                    score += 50;
                                }
                                initLevel();
                                updateStats();
                            }, 1000);
                        }
                    }
                    
                    // 目标碰撞
                    targets.forEach(target => {
                        if (!target.destroyed) {
                            const dx = pendulum.ballX - target.x;
                            const dy = pendulum.ballY - target.y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            
                            if (dist < pendulum.ballRadius + target.radius) {
                                target.destroyed = true;
                                targetsDestroyed++;
                                score += target.points;
                                createExplosion(target.x, target.y, target.color);
                                
                                // 反弹
                                const angle = Math.atan2(dy, dx);
                                pendulum.vx = Math.cos(angle) * 5;
                                pendulum.vy = Math.sin(angle) * 5;
                                
                                updateStats();
                            }
                        }
                    });
                }
            }
        }
        
        function createExplosion(x, y, color) {
            for (let i = 0; i < 20; i++) {
                const angle = (Math.PI * 2 / 20) * i;
                const speed = 3 + Math.random() * 5;
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: 3 + Math.random() * 5,
                    color,
                    life: 1
                });
            }
        }
        
        function updateParticles() {
            particles = particles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.2;
                p.life -= 0.02;
                return p.life > 0;
            });
        }
        
        function drawPendulum() {
            // 锚点
            ctx.fillStyle = '#666';
            ctx.beginPath();
            ctx.arc(pendulum.anchorX, pendulum.anchorY, 10, 0, Math.PI * 2);
            ctx.fill();
            
            // 绳子
            ctx.strokeStyle = '#8b4513';
            ctx.lineWidth = 4;
            
            let ballX, ballY;
            
            if (pendulum.released && pendulum.freeFall) {
                ballX = pendulum.ballX;
                ballY = pendulum.ballY;
                
                // 绘制断裂的绳子
                ctx.strokeStyle = 'rgba(139,69,19,0.3)';
                ctx.beginPath();
                ctx.moveTo(pendulum.anchorX, pendulum.anchorY);
                ctx.lineTo(ballX, ballY);
                ctx.stroke();
            } else {
                ballX = pendulum.anchorX + Math.sin(pendulum.angle) * pendulum.length;
                ballY = pendulum.anchorY + Math.cos(pendulum.angle) * pendulum.length;
                
                ctx.beginPath();
                ctx.moveTo(pendulum.anchorX, pendulum.anchorY);
                ctx.lineTo(ballX, ballY);
                ctx.stroke();
            }
            
            // 摆锤球
            ctx.fillStyle = '#f39c12';
            ctx.shadowColor = '#f39c12';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(ballX, ballY, pendulum.ballRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            // 高光
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.beginPath();
            ctx.arc(ballX - pendulum.ballRadius * 0.3, ballY - pendulum.ballRadius * 0.3, pendulum.ballRadius * 0.3, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function drawTargets() {
            targets.forEach(target => {
                if (!target.destroyed) {
                    ctx.fillStyle = target.color;
                    ctx.shadowColor = target.color;
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    ctx.arc(target.x, target.y, target.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    
                    // 分数
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 12px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(target.points, target.x, target.y + 4);
                }
            });
        }
        
        function drawParticles() {
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }
        
        function releasePendulum() {
            if (!pendulum.released) {
                pendulum.released = true;
                pendulum.vx = 0;
                pendulum.vy = 0;
            }
        }
        
        function updateStats() {
            document.getElementById('score').textContent = score;
            document.getElementById('targets').textContent = targetsDestroyed;
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('highscore_摆锤游戏', highScore);
            }
            document.getElementById('highScore').textContent = highScore;
        }
        
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 背景
            ctx.fillStyle = 'rgba(0,0,0,0.05)';
            for (let i = 0; i < 30; i++) {
                ctx.beginPath();
                ctx.arc(Math.random() * canvas.width, Math.random() * canvas.height, 1, 0, Math.PI * 2);
                ctx.fill();
            }
            
            drawTargets();
            updatePendulum();
            drawPendulum();
            
            updateParticles();
            drawParticles();
            
            requestAnimationFrame(gameLoop);
        }
        
        // 事件监听
        canvas.addEventListener('click', releasePendulum);
        
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            releasePendulum();
        }, { passive: false });
        
        document.getElementById('btnRelease').addEventListener('click', releasePendulum);
        
        document.getElementById('btnRestart').addEventListener('click', () => {
            level = 1;
            score = 0;
            targetsDestroyed = 0;
            particles = [];
            initLevel();
            updateStats();
        });
        
        // 初始化
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        document.getElementById('highScore').textContent = highScore;
        gameLoop();
    </script>

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
