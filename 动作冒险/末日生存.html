<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>末日生存</title>
    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #2d3436 0%, #000000 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px;
            background: linear-gradient(135deg, #c0392b, #e74c3c);
            border-radius: 12px;
        }
        .stat {
            text-align: center;
            color: white;
        }
        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }
        .stat-value {
            font-size: 20px;
            font-weight: bold;
        }
        .map-area {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            margin-bottom: 15px;
            padding: 10px;
            background: #2d3436;
            border-radius: 12px;
        }
        .map-cell {
            height: 50px;
            background: #636e72;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .map-cell:hover {
            background: #74b9ff;
        }
        .map-cell.player {
            background: #00b894;
        }
        .map-cell.zombie {
            background: #e74c3c;
        }
        .map-cell.resource {
            background: #f39c12;
        }
        .map-cell.base {
            background: #3498db;
        }
        .status-area {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .status-item {
            flex: 1;
            padding: 10px;
            background: #dfe6e9;
            border-radius: 10px;
            text-align: center;
        }
        .status-icon {
            font-size: 24px;
        }
        .status-name {
            font-size: 12px;
            color: #636e72;
        }
        .status-value {
            font-size: 18px;
            color: #2d3436;
            font-weight: bold;
        }
        .actions {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .action-btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            background: #636e72;
            color: white;
        }
        .action-btn:hover {
            transform: scale(1.05);
        }
        .btn-move { background: #3498db; }
        .btn-attack { background: #e74c3c; }
        .btn-collect { background: #f39c12; }
        .btn-build { background: #2ecc71; }
        .inventory {
            display: flex;
            gap: 10px;
            padding: 10px;
            background: #dfe6e9;
            border-radius: 10px;
        }
        .inv-item {
            padding: 8px 15px;
            background: white;
            border-radius: 8px;
            font-size: 14px;
        }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #c0392b, #e74c3c);
            color: white;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 20px 40px;
            border-radius: 15px;
            font-size: 18px;
            display: none;
            z-index: 100;
            text-align: center;
        }
        .message.show { display: block; }
        .ad-banner {
            width: 100%;
            height: 60px;
            background: linear-gradient(135deg, #c0392b, #e74c3c);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">天数</div>
                <div class="stat-value" id="days">1</div>
            </div>
            <div class="stat">
                <div class="stat-label">僵尸</div>
                <div class="stat-value" id="zombies">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">基地</div>
                <div class="stat-value" id="baseLevel">1</div>
            </div>
        </div>

        <div class="map-area" id="mapArea"></div>

        <div class="status-area">
            <div class="status-item">
                <div class="status-icon">❤️</div>
                <div class="status-name">生命</div>
                <div class="status-value" id="health">100</div>
            </div>
            <div class="status-item">
                <div class="status-icon">🔫</div>
                <div class="status-name">弹药</div>
                <div class="status-value" id="ammo">10</div>
            </div>
            <div class="status-item">
                <div class="status-icon">🧟</div>
                <div class="status-name">击杀</div>
                <div class="status-value" id="kills">0</div>
            </div>
        </div>

        <div class="actions">
            <button class="action-btn btn-move" id="btnMove">🚶 移动</button>
            <button class="action-btn btn-attack" id="btnAttack">🔫 攻击</button>
            <button class="action-btn btn-collect" id="btnCollect">📦 搜集</button>
            <button class="action-btn btn-build" id="btnBuild">🏗️ 建设</button>
        </div>

        <div class="inventory" id="inventory">
            <div class="inv-item">🍖 食物: 3</div>
            <div class="inv-item">💊 药品: 1</div>
            <div class="inv-item">🪵 材料: 0</div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" id="btnReset">🔄 新末日</button>
        </div>

        <div class="message" id="message"></div>

        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    <script>
        const MAP_SIZE = 5;
        let map = [];
        let playerPos = { x: 2, y: 2 };
        let zombies = [];
        let resources = [];
        let basePos = { x: 2, y: 2 };
        let health = 100;
        let ammo = 10;
        let kills = 0;
        let days = 1;
        let baseLevel = 1;
        let inventory = { food: 3, medicine: 1, materials: 0 };
        let gameOver = false;

        function initGame() {
            map = [];
            zombies = [];
            resources = [];

            // 初始化地图
            for (let y = 0; y < MAP_SIZE; y++) {
                map[y] = [];
                for (let x = 0; x < MAP_SIZE; x++) {
                    map[y][x] = 'empty';
                }
            }

            playerPos = { x: 2, y: 2 };
            basePos = { x: 2, y: 2 };
            map[2][2] = 'base';

            // 生成僵尸
            for (let i = 0; i < 3; i++) {
                spawnZombie();
            }

            // 生成资源
            for (let i = 0; i < 3; i++) {
                spawnResource();
            }

            health = 100;
            ammo = 10;
            kills = 0;
            days = 1;
            baseLevel = 1;
            inventory = { food: 3, medicine: 1, materials: 0 };
            gameOver = false;

            renderMap();
            updateUI();
        }

        function spawnZombie() {
            let attempts = 0;
            while (attempts < 100) {
                const x = Math.floor(Math.random() * MAP_SIZE);
                const y = Math.floor(Math.random() * MAP_SIZE);
                if (map[y][x] === 'empty' && !(x === playerPos.x && y === playerPos.y)) {
                    map[y][x] = 'zombie';
                    zombies.push({ x, y, hp: 20 });
                    break;
                }
                attempts++;
            }
        }

        function spawnResource() {
            let attempts = 0;
            while (attempts < 100) {
                const x = Math.floor(Math.random() * MAP_SIZE);
                const y = Math.floor(Math.random() * MAP_SIZE);
                if (map[y][x] === 'empty' && !(x === playerPos.x && y === playerPos.y)) {
                    map[y][x] = 'resource';
                    resources.push({ x, y, type: Math.floor(Math.random() * 3) });
                    break;
                }
                attempts++;
            }
        }

        function renderMap() {
            const el = document.getElementById('mapArea');
            el.innerHTML = '';

            for (let y = 0; y < MAP_SIZE; y++) {
                for (let x = 0; x < MAP_SIZE; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'map-cell';

                    if (x === playerPos.x && y === playerPos.y) {
                        cell.classList.add('player');
                        cell.textContent = '🧙';
                    } else if (map[y][x] === 'zombie') {
                        cell.classList.add('zombie');
                        cell.textContent = '🧟';
                    } else if (map[y][x] === 'resource') {
                        cell.classList.add('resource');
                        cell.textContent = '📦';
                    } else if (map[y][x] === 'base') {
                        cell.classList.add('base');
                        cell.textContent = '🏠';
                    } else {
                        cell.textContent = '';
                    }

                    cell.addEventListener('click', () => moveTo(x, y));
                    el.appendChild(cell);
                }
            }
        }

        function moveTo(x, y) {
            if (gameOver) return;

            const dx = Math.abs(x - playerPos.x);
            const dy = Math.abs(y - playerPos.y);

            if (dx > 1 || dy > 1 || (dx === 1 && dy === 1)) {
                showMessage('只能移动到相邻格子！');
                return;
            }

            playerPos = { x, y };
            renderMap();

            // 检查遭遇
            if (map[y][x] === 'zombie') {
                encounterZombie();
            } else if (map[y][x] === 'resource') {
                collectResource();
            } else if (map[y][x] === 'base') {
                showMessage('回到基地！');
            }
        }

        function encounterZombie() {
            const zombie = zombies.find(z => z.x === playerPos.x && z.y === playerPos.y);
            if (!zombie) return;

            // 自动战斗
            if (ammo > 0) {
                ammo--;
                zombie.hp -= 15;
                if (zombie.hp <= 0) {
                    map[playerPos.y][playerPos.x] = 'empty';
                    zombies = zombies.filter(z => !(z.x === playerPos.x && z.y === playerPos.y));
                    kills++;
                    showMessage('击杀僵尸！');
                } else {
                    health -= 10;
                    showMessage('战斗中受伤！-10生命');
                }
            } else {
                health -= 20;
                showMessage('没有弹药！被攻击！-20生命');
            }

            if (health <= 0) {
                gameOver = true;
                showMessage('你被僵尸击败...\n存活天数: ' + days);
            }

            updateUI();
        }

        function collectResource() {
            const resource = resources.find(r => r.x === playerPos.x && r.y === playerPos.y);
            if (!resource) return;

            map[playerPos.y][playerPos.x] = 'empty';
            resources = resources.filter(r => !(r.x === playerPos.x && r.y === playerPos.y));

            if (resource.type === 0) {
                inventory.food++;
                showMessage('找到食物！');
            } else if (resource.type === 1) {
                inventory.medicine++;
                showMessage('找到药品！');
            } else {
                inventory.materials++;
                ammo += 5;
                showMessage('找到材料和弹药！');
            }

            renderInventory();
            updateUI();
        }

        function attack() {
            if (gameOver) return;
            if (ammo <= 0) {
                showMessage('没有弹药！');
                return;
            }

            // 攻击相邻僵尸
            const adjacent = zombies.filter(z =>
                Math.abs(z.x - playerPos.x) <= 1 && Math.abs(z.y - playerPos.y) <= 1
            );

            if (adjacent.length === 0) {
                showMessage('附近没有僵尸！');
                return;
            }

            ammo--;
            const target = adjacent[0];
            target.hp -= 20;

            if (target.hp <= 0) {
                map[target.y][target.x] = 'empty';
                zombies = zombies.filter(z => !(z.x === target.x && z.y === target.y));
                kills++;
                showMessage('击杀僵尸！');
            } else {
                showMessage('攻击成功！僵尸剩余HP: ' + target.hp);
            }

            renderMap();
            updateUI();
        }

        function collect() {
            if (gameOver) return;

            // 搜集附近资源
            const adjacent = resources.filter(r =>
                Math.abs(r.x - playerPos.x) <= 1 && Math.abs(r.y - playerPos.y) <= 1
            );

            if (adjacent.length === 0) {
                showMessage('附近没有资源！');
                return;
            }

            const target = adjacent[0];
            playerPos = { x: target.x, y: target.y };
            collectResource();
            renderMap();
        }

        function build() {
            if (gameOver) return;
            if (playerPos.x !== basePos.x || playerPos.y !== basePos.y) {
                showMessage('必须在基地才能建设！');
                return;
            }

            if (inventory.materials >= 3) {
                inventory.materials -= 3;
                baseLevel++;
                health = Math.min(100, health + 20);
                showMessage('基地升级！等级: ' + baseLevel);
            } else {
                showMessage('材料不足！需要3份材料');
            }

            renderInventory();
            updateUI();
        }

        function nextDay() {
            if (gameOver) return;

            days++;

            // 消耗食物
            if (inventory.food > 0) {
                inventory.food--;
            } else {
                health -= 10;
                showMessage('没有食物！-10生命');
            }

            // 僵尸移动
            zombies.forEach(zombie => {
                const dx = Math.sign(playerPos.x - zombie.x);
                const dy = Math.sign(playerPos.y - zombie.y);
                const newX = Math.max(0, Math.min(MAP_SIZE - 1, zombie.x + dx));
                const newY = Math.max(0, Math.min(MAP_SIZE - 1, zombie.y + dy));

                if (map[zombie.y][zombie.x] === 'zombie') {
                    map[zombie.y][zombie.x] = 'empty';
                }
                zombie.x = newX;
                zombie.y = newY;
                map[newY][newX] = 'zombie';

                // 基地防御
                if (newX === basePos.x && newY === basePos.y) {
                    if (baseLevel > 1) {
                        showMessage('基地防御成功！');
                    } else {
                        health -= 15;
                        showMessage('僵尸攻击基地！-15生命');
                    }
                }
            });

            // 生成新僵尸
            if (Math.random() < 0.3) {
                spawnZombie();
            }

            // 生成新资源
            if (Math.random() < 0.5) {
                spawnResource();
            }

            if (health <= 0) {
                gameOver = true;
                showMessage('你没能生存下去...\n存活天数: ' + days);
                GameCore.highScore.set('apocalypse_game', days);
            }

            renderMap();
            renderInventory();
            updateUI();
        }

        function renderInventory() {
            const el = document.getElementById('inventory');
            el.innerHTML = `
                <div class="inv-item">🍖 食物: ${inventory.food}</div>
                <div class="inv-item">💊 药品: ${inventory.medicine}</div>
                <div class="inv-item">🪵 材料: ${inventory.materials}</div>
            `;
        }

        function updateUI() {
            document.getElementById('days').textContent = days;
            document.getElementById('zombies').textContent = zombies.length;
            document.getElementById('baseLevel').textContent = baseLevel;
            document.getElementById('health').textContent = health;
            document.getElementById('ammo').textContent = ammo;
            document.getElementById('kills').textContent = kills;
        }

        function showMessage(msg) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 1500);
        }

        document.getElementById('btnMove').addEventListener('click', () => showMessage('点击地图移动'));
        document.getElementById('btnAttack').addEventListener('click', attack);
        document.getElementById('btnCollect').addEventListener('click', collect);
        document.getElementById('btnBuild').addEventListener('click', build);
        document.getElementById('btnReset').addEventListener('click', initGame);

        // 每天自动推进
        setInterval(() => {
            if (!gameOver) nextDay();
        }, 10000);

        // 初始化
        GameCore.init({ highScore: 'apocalypse_game' });
        initGame();
    </script>
</body>
</html>
