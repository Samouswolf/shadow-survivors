<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>霓虹跑酷</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: #0a0a0a; min-height: 100vh; overflow: hidden; color: #fff; }
        .game-container { width: 100%; height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 10px; }
        .stat { display: flex; flex-direction: column; align-items: center; }
        .stat-label { font-size: 12px; opacity: 0.7; }
        .stat-value { font-size: 24px; font-weight: bold; color: #f093fb; }
        
        .game-area { flex: 1; position: relative; background: #000; border-radius: 15px; overflow: hidden; }
        #gameCanvas { width: 100%; height: 100%; display: block; }
        
        .neon-indicator { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 10px; font-size: 16px; }
        
        .controls { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
        .btn { padding: 12px 25px; border: none; border-radius: 25px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">距离</div>
                <div class="stat-value" id="distance">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">分数</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">最高</div>
                <div class="stat-value" id="highScore">0</div>
            </div>
        </div>
        
        <div class="game-area">
            <canvas id="gameCanvas"></canvas>
            <div class="neon-indicator" id="neonIndicator">🌈 霓虹: 紫</div>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" id="btnStart">▶️ 开始游戏</button>
        </div>
        
        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const GAME_NAME = '霓虹跑酷';
        GameCore.init({ highScore: GAME_NAME });
        
        let distance = 0;
        let score = 0;
        let gameRunning = false;
        let speed = 5;
        
        let player = { x: 100, y: 300, width: 30, height: 60, vy: 0, onGround: false };
        let obstacles = [];
        let collectibles = [];
        let neonLines = [];
        
        const NEON_COLORS = ['#f093fb', '#00d2ff', '#ffd700', '#48c78e', '#ff6b6b'];
        let currentColorIndex = 0;
        
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            initGame();
        }
        
        function initGame() {
            player.x = 100;
            player.y = canvas.height - 120;
            player.vy = 0;
            distance = 0;
            score = 0;
            speed = 5;
            currentColorIndex = 0;
            
            obstacles = [];
            collectibles = [];
            neonLines = [];
            
            for (let i = 0; i < 5; i++) {
                neonLines.push({ x: canvas.width + i * 200, y: canvas.height - 20 });
            }
        }
        
        function spawnObstacle() {
            const type = Math.random() > 0.5 ? 'ground' : 'air';
            obstacles.push({
                x: canvas.width + 50,
                y: type === 'ground' ? canvas.height - 60 : canvas.height - 150 - Math.random() * 100,
                width: 40,
                height: type === 'ground' ? 40 : 40,
                color: NEON_COLORS[currentColorIndex]
            });
        }
        
        function spawnCollectible() {
            collectibles.push({
                x: canvas.width + 50,
                y: canvas.height - 100 - Math.random() * 150,
                size: 20,
                color: NEON_COLORS[(currentColorIndex + 1) % NEON_COLORS.length],
                collected: false
            });
        }
        
        function updatePlayer() {
            player.vy += 0.5;
            player.y += player.vy;
            
            if (player.y + player.height > canvas.height - 20) {
                player.y = canvas.height - 20 - player.height;
                player.vy = 0;
                player.onGround = true;
            } else {
                player.onGround = false;
            }
        }
        
        function updateObstacles() {
            obstacles = obstacles.filter(o => {
                o.x -= speed;
                return o.x > -100;
            });
            
            collectibles = collectibles.filter(c => {
                c.x -= speed;
                
                if (!c.collected) {
                    const dx = player.x + player.width / 2 - c.x;
                    const dy = player.y + player.height / 2 - c.y;
                    if (Math.sqrt(dx * dx + dy * dy) < 30) {
                        c.collected = true;
                        score += 100;
                        switchColor();
                    }
                }
                
                return c.x > -100;
            });
            
            neonLines = neonLines.map(line => {
                line.x -= speed;
                if (line.x < -200) line.x = canvas.width + 200;
                return line;
            });
        }
        
        function checkCollisions() {
            obstacles.forEach(o => {
                if (player.x < o.x + o.width &&
                    player.x + player.width > o.x &&
                    player.y < o.y + o.height &&
                    player.y + player.height > o.y) {
                    gameOver();
                }
            });
            
            distance += speed;
            score += 1;
            
            if (distance % 500 === 0) {
                speed += 0.5;
            }
            
            updateStats();
        }
        
        function switchColor() {
            currentColorIndex = (currentColorIndex + 1) % NEON_COLORS.length;
            document.getElementById('neonIndicator').textContent = '🌈 霓虹: ' + ['紫', '蓝', '黄', '绿', '红'][currentColorIndex];
        }
        
        function gameOver() {
            gameRunning = false;
            GameCore.hints.show('游戏结束！\n距离: ' + Math.floor(distance) + ' | 分数: ' + score, 5000);
        }
        
        function draw() {
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 网格背景
            ctx.strokeStyle = NEON_COLORS[currentColorIndex] + '30';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 50) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }
            for (let i = 0; i < canvas.height; i += 50) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }
            
            // 霓虹线
            ctx.strokeStyle = NEON_COLORS[currentColorIndex];
            ctx.lineWidth = 3;
            ctx.shadowColor = NEON_COLORS[currentColorIndex];
            ctx.shadowBlur = 10;
            neonLines.forEach(line => {
                ctx.beginPath();
                ctx.moveTo(line.x, line.y);
                ctx.lineTo(line.x + 150, line.y);
                ctx.stroke();
            });
            ctx.shadowBlur = 0;
            
            // 地面
            ctx.fillStyle = NEON_COLORS[currentColorIndex];
            ctx.shadowColor = NEON_COLORS[currentColorIndex];
            ctx.shadowBlur = 20;
            ctx.fillRect(0, canvas.height - 20, canvas.width, 20);
            ctx.shadowBlur = 0;
            
            // 障碍物
            obstacles.forEach(o => {
                ctx.fillStyle = o.color;
                ctx.shadowColor = o.color;
                ctx.shadowBlur = 15;
                ctx.fillRect(o.x, o.y, o.width, o.height);
                ctx.shadowBlur = 0;
            });
            
            // 收集物
            collectibles.forEach(c => {
                if (!c.collected) {
                    ctx.fillStyle = c.color;
                    ctx.shadowColor = c.color;
                    ctx.shadowBlur = 15;
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, c.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            });
            
            // 玩家
            ctx.fillStyle = NEON_COLORS[currentColorIndex];
            ctx.shadowColor = NEON_COLORS[currentColorIndex];
            ctx.shadowBlur = 20;
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.shadowBlur = 0;
            
            // 玩家头部
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(player.x + 15, player.y + 15, 8, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function updateStats() {
            document.getElementById('distance').textContent = Math.floor(distance);
            document.getElementById('score').textContent = score;
            document.getElementById('highScore').textContent = GameCore.highScore.get(GAME_NAME);
            
            if (GameCore.highScore.set(GAME_NAME, score)) {
                GameCore.hints.show('新纪录！分数: ' + score);
            }
        }
        
        function gameLoop() {
            draw();
            
            if (gameRunning) {
                updatePlayer();
                updateObstacles();
                checkCollisions();
                
                if (Math.random() < 0.02) spawnObstacle();
                if (Math.random() < 0.01) spawnCollectible();
            }
            
            updateStats();
            requestAnimationFrame(gameLoop);
        }
        
        document.addEventListener('keydown', e => {
            if (!gameRunning) return;
            
            if (e.code === 'ArrowUp' || e.code === 'KeyW') {
                if (player.onGround) {
                    player.vy = -12;
                    player.onGround = false;
                }
            }
            if (e.code === 'ArrowDown' || e.code === 'KeyS') {
                player.vy = 5;
            }
        });
        
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            if (!gameRunning) return;
            
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const y = touch.clientY - rect.top;
            
            if (y < canvas.height / 2) {
                if (player.onGround) {
                    player.vy = -12;
                    player.onGround = false;
                }
            } else {
                player.vy = 5;
            }
        }, { passive: false });
        
        document.getElementById('btnStart').onclick = () => {
            gameRunning = true;
            initGame();
        };
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        gameLoop();
    </script>
</body>
</html>
