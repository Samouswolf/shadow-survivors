<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>奇幻冒险</title>
    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            border-radius: 12px;
        }
        .stat {
            text-align: center;
            color: white;
        }
        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }
        .stat-value {
            font-size: 20px;
            font-weight: bold;
        }
        .scene-view {
            height: 150px;
            background: linear-gradient(135deg, #2d3436, #636e72);
            border-radius: 12px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
        }
        .story-area {
            padding: 20px;
            background: #dfe6e9;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .story-title {
            font-size: 18px;
            color: #2d3436;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .story-text {
            font-size: 14px;
            color: #636e72;
            line-height: 1.6;
        }
        .magic-area {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .magic-btn {
            flex: 1;
            padding: 15px;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            border: 2px solid #6c5ce7;
            transition: all 0.2s;
        }
        .magic-btn:hover {
            background: #6c5ce7;
            color: white;
        }
        .magic-icon {
            font-size: 24px;
            margin-bottom: 5px;
        }
        .magic-name {
            font-size: 12px;
            color: #2d3436;
        }
        .choices-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }
        .choice-btn {
            padding: 15px;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            border: 2px solid #dfe6e9;
            transition: all 0.2s;
        }
        .choice-btn:hover {
            border-color: #6c5ce7;
            background: #e8f4f8;
        }
        .choice-icon {
            font-size: 20px;
            margin-right: 10px;
        }
        .choice-text {
            font-size: 14px;
            color: #2d3436;
        }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 20px 40px;
            border-radius: 15px;
            font-size: 18px;
            display: none;
            z-index: 100;
            text-align: center;
        }
        .message.show { display: block; }
        .ad-banner {
            width: 100%;
            height: 60px;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            margin-top: 10px;
            font-size: 14px;
        }
    /* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */
/* [BATCH-FIX:ad-components-css] */
.sponsor-btn{position:fixed;bottom:8px;left:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:2px 6px;border-radius:10px;font:10px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}

.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}

.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.interstitial-ad.show{display:flex}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}

/* [AD-FIX:responsive] */

<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">魔法</div>
                <div class="stat-value" id="magic">100</div>
            </div>
            <div class="stat">
                <div class="stat-label">宝藏</div>
                <div class="stat-value" id="treasure">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">章节</div>
                <div class="stat-value" id="chapter">1</div>
            </div>
        </div>

        <div class="scene-view" id="sceneView">🌲</div>

        <div class="story-area">
            <div class="story-title" id="storyTitle">奇幻森林</div>
            <div class="story-text" id="storyText">你来到了一片神秘的森林...</div>
        </div>

        <div class="magic-area" id="magicArea"></div>

        <div class="choices-area" id="choicesArea"></div>

        <div class="controls">
            <button class="btn btn-primary" id="btnReset">🔄 新冒险</button>
        </div>

        <div class="message" id="message"></div>

        
    </div>

    <script>
        const SCENES = [
            {
                icon: '🌲',
                title: '奇幻森林',
                text: '你来到了一片神秘的森林，树木散发着奇异的光芒。远处传来精灵的歌声...',
                magic: ['✨ 光明术', '🔥 火焰术', '❄️ 冰霜术'],
                choices: [
                    { icon: '🧝', text: '跟随歌声寻找精灵', next: 1 },
                    { icon: '🔍', text: '探索森林深处', next: 2 },
                    { icon: '🧙', text: '施展魔法照亮道路', next: 3 }
                ]
            },
            {
                icon: '🧝',
                title: '精灵村落',
                text: '你发现了一个隐藏的精灵村落。精灵们正在举行神秘的仪式...',
                magic: ['✨ 治愈术', '🎵 音乐术', '🌿 自然术'],
                choices: [
                    { icon: '🤝', text: '加入仪式', next: 4 },
                    { icon: '🎁', text: '赠送礼物', next: 5 },
                    { icon: '❓', text: '询问魔法秘密', next: 6 }
                ]
            },
            {
                icon: '💎',
                title: '宝藏洞穴',
                text: '洞穴深处闪烁着宝石的光芒。但入口被魔法屏障阻挡...',
                magic: ['⚡ 雷电术', '💫 穿透术', '🛡️ 防护术'],
                choices: [
                    { icon: '⚡', text: '用雷电术打破屏障', next: 7 },
                    { icon: '🔍', text: '寻找其他入口', next: 8 }
                ]
            },
            {
                icon: '🐉',
                title: '龙之巢穴',
                text: '一只巨龙守护着传说中的宝藏。它看起来很强大...',
                magic: ['🔥 火焰术', '❄️ 冰霜术', '✨ 光明术'],
                choices: [
                    { icon: '⚔️', text: '战斗', next: 9 },
                    { icon: '🗣️', text: '交谈', next: 10 }
                ]
            }
        ];

        let magic = 100;
        let treasure = 0;
        let chapter = 1;
        let currentScene = 0;
        let gameOver = false;

        function initGame() {
            magic = 100;
            treasure = 0;
            chapter = 1;
            currentScene = 0;
            gameOver = false;

            renderScene();
            renderMagic();
            renderChoices();
            updateUI();
        }

        function renderScene() {
            const scene = SCENES[currentScene];
            document.getElementById('sceneView').textContent = scene.icon;
            document.getElementById('storyTitle').textContent = scene.title;
            document.getElementById('storyText').textContent = scene.text;
        }

        function renderMagic() {
            const scene = SCENES[currentScene];
            const el = document.getElementById('magicArea');
            el.innerHTML = '';

            scene.magic.forEach(m => {
                const btn = document.createElement('div');
                btn.className = 'magic-btn';
                btn.innerHTML = `
                    <div class="magic-icon">${m.split(' ')[0]}</div>
                    <div class="magic-name">${m.split(' ')[1]}</div>
                `;
                btn.addEventListener('click', () => useMagic(m));
                el.appendChild(btn);
            });
        }

        function renderChoices() {
            const scene = SCENES[currentScene];
            const el = document.getElementById('choicesArea');
            el.innerHTML = '';

            scene.choices.forEach(choice => {
                const btn = document.createElement('div');
                btn.className = 'choice-btn';
                btn.innerHTML = `
                    <span class="choice-icon">${choice.icon}</span>
                    <span class="choice-text">${choice.text}</span>
                `;
                btn.addEventListener('click', () => makeChoice(choice));
                el.appendChild(btn);
            });
        }

        function useMagic(magicName) {
            if (magic < 20) {
                showMessage('魔法能量不足！');
                return;
            }

            magic -= 20;
            showMessage('施展 ' + magicName + '！');

            // 魔法效果
            if (magicName.includes('光明')) {
                treasure += 10;
                showMessage('发现隐藏宝藏！+10');
            } else if (magicName.includes('治愈')) {
                magic += 30;
                showMessage('恢复魔法能量！+30');
            }

            updateUI();
        }

        function makeChoice(choice) {
            chapter++;

            // 根据选择更新
            if (choice.icon === '⚔️') {
                magic -= 50;
                treasure += 100;
                showMessage('战胜巨龙！获得100宝藏');
            } else if (choice.icon === '🗣️') {
                treasure += 50;
                showMessage('龙赠送你宝藏！+50');
            } else if (choice.icon === '🎁') {
                treasure += 30;
                showMessage('精灵赠送礼物！+30');
            } else if (choice.icon === '🔍') {
                treasure += 20;
                showMessage('发现宝藏！+20');
            }

            // 下一场景
            if (choice.next < SCENES.length) {
                currentScene = choice.next;
            } else {
                gameOver = true;
                showMessage('🎉 冒险完成！\n宝藏: ' + treasure);
                GameCore.highScore.set('fantasy_game', treasure);
                return;
            }

            renderScene();
            renderMagic();
            renderChoices();
            updateUI();
        }

        function updateUI() {
            document.getElementById('magic').textContent = magic;
            document.getElementById('treasure').textContent = treasure;
            document.getElementById('chapter').textContent = chapter;
        }

        function showMessage(msg) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 1500);
        }

        document.getElementById('btnReset').addEventListener('click', initGame);

        // 初始化
        GameCore.init({ highScore: 'fantasy_game' });
        initGame();
    </script>
<!-- [BATCH-FIX:responsive-js] -->
<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>
<!-- [/BATCH-FIX:responsive-js] -->
<!-- [BATCH-FIX:touch-support] -->
<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>
<!-- [/BATCH-FIX:touch-support] -->

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
