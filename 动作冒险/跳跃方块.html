<body>

    <button id="start-game-btn" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:20px 40px;font-size:20px;background:#f5576c;color:white;border:none;border-radius:12px;cursor:pointer;z-index:999;font-weight:bold;display:none;">开始游戏</button>


    <div class="game-guide" style="margin-bottom:15px;padding:10px;background:#fff3f3;border-radius:8px;border:1px solid #ffcccc;">
        <div style="font-weight:bold;color:#f5576c;margin-bottom:5px;">🎮 操作说明</div>
        <div style="font-size:14px;color:#666;">点击/触摸进行游戏，支持键盘操作</div>
    </div>

<canvas id="gc"></canvas>

  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script src="../game_core.js"></script>
<script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script>
(function(){
'use strict';

// Canvas setup
const c=document.getElementById('gc'),ctx=c.getContext('2d');
const W=400,H=600;
c.width=W;c.height=H;

function resize(){
  const r=W/H;let w=window.innerWidth,h=window.innerHeight;
  if(w/h>r)c.style.width=(h*r)+'px',c.style.height=h+'px';
  else c.style.width=w+'px',c.style.height=(w/r)+'px';
}
window.addEventListener('resize',resize);resize();

// Audio system
let audioCtx=null;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();}
function playSound(freq,dur,type,vol){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type||'square';o.frequency.value=freq;
  g.gain.setValueAtTime(vol||0.1,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
  o.connect(g);g.connect(audioCtx.destination);
  o.start();o.stop(audioCtx.currentTime+dur);
}
function sfxJump(){playSound(400,0.15,'square',0.08);setTimeout(()=>playSound(600,0.1,'square',0.06),50);}
function sfxStar(){playSound(800,0.1,'sine',0.1);setTimeout(()=>playSound(1000,0.15,'sine',0.08),80);}
function sfxDie(){playSound(200,0.3,'sawtooth',0.1);setTimeout(()=>playSound(150,0.4,'sawtooth',0.08),100);}
function sfxBounce(){playSound(500,0.12,'triangle',0.1);}
function sfxHighscore(){playSound(600,0.15,'sine',0.1);setTimeout(()=>playSound(800,0.15,'sine',0.08),150);setTimeout(()=>playSound(1000,0.2,'sine',0.1),300);}

// Input
const keys={};
let mouseX=W/2,touchX=W/2,isTouching=false;
let inputX=W/2;

window.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')e.preventDefault();});
window.addEventListener('keyup',e=>{keys[e.code]=false;});

c.addEventListener('touchstart',e=>{
  e.preventDefault();initAudio();
  const t=e.touches[0],rect=c.getBoundingClientRect();
  touchX=(t.clientX-rect.left)/rect.width*W;isTouching=true;
},{passive:false});
c.addEventListener('touchmove',e=>{
  e.preventDefault();
  const t=e.touches[0],rect=c.getBoundingClientRect();
  touchX=(t.clientX-rect.left)/rect.width*W;
},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();isTouching=false;},{passive:false});

c.addEventListener('mousemove',e=>{
  const rect=c.getBoundingClientRect();
  mouseX=(e.clientX-rect.left)/rect.width*W;
});
c.addEventListener('click',e=>{initAudio();handleClick();});

// Game constants
const PLAT_W=70,PLAT_H=12,GRAVITY=0.35,JUMP_VEL=-10,PLAYER_SIZE=24;
const STAR_SIZE=16;

// Platform types
const PLAT_NORMAL=0,PLAT_MOVING=1,PLAT_FRAGILE=2,PLAT_SPRING=3;

// Game state
let G={
  state:'title', // title,playing,paused,gameover
  score:0,
  highscore:parseInt(localStorage.getItem('jumpBlockHigh'))||0,
  player:null,
  platforms:[],
  stars:[],
  particles:[],
  cameraY:0,
  maxHeight:0,
  difficulty:1,
  frameCount:0,
  paused:false
};

// Platform class
function createPlatform(x,y,type){
  return{x,y,w:PLAT_W,h:PLAT_H,type:type||PLAT_NORMAL,
    moveDir:1,moveSpeed:1+Math.random(),broken:false,breakTimer:0,
    springAnim:0};
}

// Star class
function createStar(x,y){
  return{x:x+PLAT_W/2,y:y-20,size:STAR_SIZE,collected:false,anim:Math.random()*Math.PI*2};
}

// Particle class
function createParticle(x,y,color){
  return{x,y,vx:(Math.random()-0.5)*6,vy:-Math.random()*4-2,
    life:1,color:color||'#fff',size:3+Math.random()*3};
}

// Generate platforms
function generatePlatforms(){
  const platforms=[];
  // Ground platform
  platforms.push(createPlatform(W/2-PLAT_W/2,H-50,PLAT_NORMAL));

  let y=H-50;
  for(let i=0;i<20;i++){
    y-=50+Math.random()*30;
    const x=Math.random()*(W-PLAT_W);
    let type=PLAT_NORMAL;
    const r=Math.random();
    if(r<0.15)type=PLAT_MOVING;
    else if(r<0.25)type=PLAT_FRAGILE;
    else if(r<0.3)type=PLAT_SPRING;
    platforms.push(createPlatform(x,y,type));
  }
  return platforms;
}

// Generate stars for platforms
function generateStars(platforms){
  const stars=[];
  for(let i=3;i<platforms.length;i++){
    if(Math.random()<0.4){
      stars.push(createStar(platforms[i].x,platforms[i].y));
    }
  }
  return stars;
}

// Initialize game
function initGame(){
  G.state='playing';
  G.score=0;
  G.cameraY=0;
  G.maxHeight=0;
  G.difficulty=1;
  G.frameCount=0;
  G.particles=[];

  G.platforms=generatePlatforms();
  G.stars=generateStars(G.platforms);

  G.player={
    x:W/2-PLAYER_SIZE/2,
    y:H-100,
    w:PLAYER_SIZE,
    h:PLAYER_SIZE,
    vx:0,
    vy:0,
    onPlatform:false,
    alive:true,
    anim:0,
    trail:[]
  };
}

// Update platforms
function updatePlatforms(){
  for(const p of G.platforms){
    // Moving platforms
    if(p.type===PLAT_MOVING){
      p.x+=p.moveSpeed*p.moveDir;
      if(p.x<=0||p.x>=W-PLAT_W)p.moveDir*=-1;
    }
    // Fragile platforms
    if(p.type===PLAT_FRAGILE&&p.broken){
      p.breakTimer++;
      if(p.breakTimer>30)p.y=H+100; // Remove
    }
    // Spring animation
    if(p.springAnim>0)p.springAnim-=0.1;
  }
}

// Update player
function updatePlayer(){
  const p=G.player;
  if(!p.alive)return;

  // Input
  if(keys['ArrowLeft']||keys['KeyA'])p.vx=-5;
  else if(keys['ArrowRight']||keys['KeyD'])p.vx=5;
  else if(isTouching)p.vx=(touchX-p.x-PLAYER_SIZE/2)*0.15;
  else p.vx*=0.8;

  // Gravity
  p.vy+=GRAVITY;
  p.y+=p.vy;
  p.x+=p.vx;

  // Wrap around screen
  if(p.x<-PLAYER_SIZE)p.x=W;
  if(p.x>W)p.x=-PLAYER_SIZE;

  // Update trail
  p.trail.push({x:p.x+PLAYER_SIZE/2,y:p.y+PLAYER_SIZE/2,life:10});
  if(p.trail.length>10)p.trail.shift();
  for(const t of p.trail)t.life--;
  p.trail=p.trail.filter(t=>t.life>0);

  // Animation
  p.anim+=0.1;

  // Platform collision (only when falling)
  if(p.vy>=0){
    for(const plat of G.platforms){
      if(plat.y>H)continue;
      if(p.x+p.w>plat.x&&p.x<plat.x+plat.w&&
         p.y+p.h>=plat.y&&p.y+p.h<=plat.y+plat.h+p.vy+2){

        // Fragile platform
        if(plat.type===PLAT_FRAGILE){
          if(!plat.broken){
            plat.broken=true;
            plat.breakTimer=0;
            sfxBounce();
            // Small bounce
            p.vy=JUMP_VEL*0.5;
          }
          continue;
        }

        // Spring platform
        if(plat.type===PLAT_SPRING){
          p.vy=JUMP_VEL*1.6;
          plat.springAnim=1;
          sfxJump();
          // Extra particles
          for(let i=0;i<8;i++){
            G.particles.push(createParticle(p.x+PLAYER_SIZE/2,plat.y,'#ff0'));
          }
        }else{
          p.vy=JUMP_VEL;
          sfxBounce();
        }

        p.y=plat.y-PLAYER_SIZE;
        p.onPlatform=true;

        // Particles
        for(let i=0;i<3;i++){
          G.particles.push(createParticle(p.x+PLAYER_SIZE/2,plat.y,'#8ff'));
        }
      }
    }
  }

  // Star collection
  for(const star of G.stars){
    if(star.collected)continue;
    const dx=p.x+PLAYER_SIZE/2-star.x;
    const dy=p.y+PLAYER_SIZE/2-star.y;
    if(Math.sqrt(dx*dx+dy*dy)<PLAYER_SIZE/2+star.size/2){
      star.collected=true;
      G.score+=10;
      sfxStar();
      // Star particles
      for(let i=0;i<6;i++){
        G.particles.push(createParticle(star.x,star.y,'#fd0'));
      }
    }
  }

  // Camera follow
  const targetY=p.y-H*0.4;
  if(targetY<G.cameraY){
    G.cameraY+=(targetY-G.cameraY)*0.1;
  }

  // Track max height
  const height=Math.floor((H-p.y)/10);
  if(height>G.maxHeight){
    G.maxHeight=height;
    G.score=Math.max(G.score,G.maxHeight);
  }

  // Difficulty scaling
  G.difficulty=1+Math.floor(G.maxHeight/100)*0.1;

  // Death
  if(p.y>G.cameraY+H+50){
    p.alive=false;
    sfxDie();
    // Death particles
    for(let i=0;i<15;i++){
      G.particles.push(createParticle(p.x+PLAYER_SIZE/2,p.y+PLAYER_SIZE/2,'#f44'));
    }
    setTimeout(()=>{
      G.state='gameover';
      if(G.score>G.highscore){
        G.highscore=G.score;
        localStorage.setItem('jumpBlockHigh',G.highscore);
        sfxHighscore();
      }
    },1000);
  }
}

// Update particles
function updateParticles(){
  for(let i=G.particles.length-1;i>=0;i--){
    const p=G.particles[i];
    p.x+=p.vx;
    p.y+=p.vy;
    p.vy+=0.2;
    p.life--;
    if(p.life<=0)G.particles.splice(i,1);
  }
}

// Generate new platforms as we go up
function generateMorePlatforms(){
  const topY=G.platforms.reduce((min,p)=>Math.min(min,p.y),Infinity);
  if(topY>G.cameraY-200){
    const count=5+Math.floor(Math.random()*3);
    for(let i=0;i<count;i++){
      const y=topY-50-Math.random()*30;
      const x=Math.random()*(W-PLAT_W);
      let type=PLAT_NORMAL;
      const r=Math.random();
      const diff=G.difficulty;
      if(r<0.1*diff)type=PLAT_MOVING;
      else if(r<0.2*diff)type=PLAT_FRAGILE;
      else if(r<0.25*diff)type=PLAT_SPRING;
      G.platforms.push(createPlatform(x,y,type));

      // Maybe add star
      if(Math.random()<0.3){
        G.stars.push(createStar(x,y));
      }
    }
  }

  // Cleanup off-screen platforms
  G.platforms=G.platforms.filter(p=>p.y<G.cameraY+H+100);
  G.stars=G.stars.filter(s=>s.y<G.cameraY+H+100&&!s.collected);
}

// Drawing functions
function drawBackground(){
  // Gradient background
  const grad=ctx.createLinearGradient(0,0,0,H);
  const hue=200+Math.sin(G.frameCount*0.001)*20;
  grad.addColorStop(0,`hsl(${hue},60%,15%)`);
  grad.addColorStop(1,`hsl(${hue+30},50%,25%)`);
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,W,H);

  // Stars background
  ctx.fillStyle='rgba(255,255,255,0.3)';
  for(let i=0;i<30;i++){
    const x=(i*137+G.cameraY*0.05)%W;
    const y=(i*89+G.cameraY*0.02)%H;
    const s=1+Math.sin(i+G.frameCount*0.02)*0.5;
    ctx.beginPath();ctx.arc(x,y,s,0,Math.PI*2);ctx.fill();
  }
}

function drawPlatform(plat){
  if(plat.y<G.cameraY-20||plat.y>G.cameraY+H+20)return;
  const x=plat.x,y=plat.y-G.cameraY;

  ctx.save();

  // Fragile platform - shaking
  if(plat.type===PLAT_FRAGILE&&plat.broken){
    ctx.translate(Math.random()*4-2,Math.random()*4-2);
    ctx.globalAlpha=1-plat.breakTimer/30;
  }

  // Spring platform - bounce effect
  let springOffset=0;
  if(plat.type===PLAT_SPRING&&plat.springAnim>0){
    springOffset=-Math.sin(plat.springAnim*Math.PI)*8;
  }

  // Draw platform
  switch(plat.type){
    case PLAT_NORMAL:
      ctx.fillStyle='#4a9';
      ctx.fillRect(x,y,plat.w,plat.h);
      ctx.fillStyle='#5c3';
      ctx.fillRect(x,y,plat.w,4);
      break;
    case PLAT_MOVING:
      ctx.fillStyle='#48f';
      ctx.fillRect(x,y,plat.w,plat.h);
      ctx.fillStyle='#6af';
      ctx.fillRect(x,y,plat.w,4);
      // Arrow indicator
      ctx.fillStyle='#fff';
      ctx.beginPath();
      const arrowX=x+plat.w/2+(plat.moveDir>0?8:-8);
      ctx.moveTo(arrowX,y+6);
      ctx.lineTo(arrowX-plat.moveDir*6,y+3);
      ctx.lineTo(arrowX-plat.moveDir*6,y+9);
      ctx.fill();
      break;
    case PLAT_FRAGILE:
      ctx.fillStyle=plat.broken?'#a55':'#a86';
      ctx.fillRect(x,y,plat.w,plat.h);
      ctx.fillStyle=plat.broken?'#c66':'#ba7';
      ctx.fillRect(x,y,plat.w,4);
      // Crack lines
      ctx.strokeStyle='rgba(0,0,0,0.3)';
      ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(x+plat.w*0.3,y);ctx.lineTo(x+plat.w*0.4,y+plat.h);
      ctx.moveTo(x+plat.w*0.6,y);ctx.lineTo(x+plat.w*0.7,y+plat.h);
      ctx.stroke();
      break;
    case PLAT_SPRING:
      ctx.fillStyle='#d4d';
      ctx.fillRect(x,y+springOffset,plat.w,plat.h);
      ctx.fillStyle='#e6e';
      ctx.fillRect(x,y+springOffset,plat.w,4);
      // Spring coil
      ctx.strokeStyle='#f8f';
      ctx.lineWidth=2;
      ctx.beginPath();
      for(let i=0;i<3;i++){
        const sx=x+plat.w*0.3+i*plat.w*0.2;
        ctx.moveTo(sx,y+springOffset+plat.h);
        ctx.lineTo(sx,y+springOffset+plat.h+8);
      }
      ctx.stroke();
      break;
  }

  ctx.restore();
}

function drawStar(star){
  if(star.collected)return;
  if(star.y<G.cameraY-20||star.y>G.cameraY+H+20)return;

  const x=star.x,y=star.y-G.cameraY;
  const pulse=Math.sin(G.frameCount*0.05+star.anim)*0.2+0.8;
  const size=star.size*pulse;

  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(G.frameCount*0.02+star.anim);

  // Glow
  ctx.fillStyle='rgba(255,220,0,0.3)';
  ctx.beginPath();ctx.arc(0,0,size,0,Math.PI*2);ctx.fill();

  // Star shape
  ctx.fillStyle='#fd0';
  ctx.beginPath();
  for(let i=0;i<5;i++){
    const angle=i*Math.PI*2/5-Math.PI/2;
    const outerX=Math.cos(angle)*size;
    const outerY=Math.sin(angle)*size;
    const innerAngle=angle+Math.PI/5;
    const innerX=Math.cos(innerAngle)*size*0.4;
    const innerY=Math.sin(innerAngle)*size*0.4;
    if(i===0)ctx.moveTo(outerX,outerY);
    else ctx.lineTo(outerX,outerY);
    ctx.lineTo(innerX,innerY);
  }
  ctx.closePath();ctx.fill();

  // Shine
  ctx.fillStyle='rgba(255,255,255,0.5)';
  ctx.beginPath();ctx.arc(-size*0.2,-size*0.2,size*0.3,0,Math.PI*2);ctx.fill();

  ctx.restore();
}

function drawPlayer(){
  const p=G.player;
  if(!p||!p.alive)return;

  const x=p.x,y=p.y-G.cameraY;

  // Trail
  ctx.save();
  for(const t of p.trail){
    ctx.fillStyle=`rgba(100,200,255,${t.life/10*0.3})`;
    ctx.beginPath();
    ctx.arc(t.x,t.y-G.cameraY,PLAYER_SIZE/3*(t.life/10),0,Math.PI*2);
    ctx.fill();
  }
  ctx.restore();

  // Squash and stretch
  let scaleX=1,scaleY=1;
  if(p.vy<-2){scaleX=0.85;scaleY=1.15;}
  else if(p.vy>2){scaleX=1.15;scaleY=0.85;}

  ctx.save();
  ctx.translate(x+PLAYER_SIZE/2,y+PLAYER_SIZE/2);
  ctx.scale(scaleX,scaleY);

  // Body
  ctx.fillStyle='#4af';
  ctx.fillRect(-PLAYER_SIZE/2,-PLAYER_SIZE/2,PLAYER_SIZE,PLAYER_SIZE);

  // Face
  ctx.fillStyle='#fff';
  // Eyes
  const eyeY=-PLAYER_SIZE*0.15;
  const blink=Math.sin(G.frameCount*0.1)>0.95?0.1:1;
  ctx.fillRect(-PLAYER_SIZE*0.25,eyeY,6,6*blink);
  ctx.fillRect(PLAYER_SIZE*0.1,eyeY,6,6*blink);

  // Pupils (look in movement direction)
  ctx.fillStyle='#234';
  const pupilOff=p.vx>0?2:p.vx<0?-2:0;
  ctx.fillRect(-PLAYER_SIZE*0.25+2+pupilOff,eyeY+2,3,3);
  ctx.fillRect(PLAYER_SIZE*0.1+2+pupilOff,eyeY+2,3,3);

  // Mouth
  ctx.fillStyle='#fff';
  ctx.fillRect(-4,PLAYER_SIZE*0.15,8,3);

  ctx.restore();
}

function drawParticles(){
  for(const p of G.particles){
    ctx.fillStyle=p.color;
    ctx.globalAlpha=p.life/10;
    ctx.beginPath();
    ctx.arc(p.x,p.y-G.cameraY,p.size*(p.life/10),0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawHUD(){
  // Score
  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.fillRect(0,0,W,40);

  ctx.fillStyle='#fff';
  ctx.font='bold 20px Arial';
  ctx.textAlign='left';
  ctx.textBaseline='middle';
  ctx.fillText('Score: '+G.score,10,20);

  ctx.textAlign='right';
  ctx.fillText('Best: '+G.highscore,W-10,20);

  // Height indicator
  ctx.fillStyle='#aaa';
  ctx.font='14px Arial';
  ctx.textAlign='center';
  ctx.fillText(G.maxHeight+'m',W/2,20);
}

function drawTitle(){
  // Background
  drawBackground();

  // Title
  ctx.fillStyle='#fff';
  ctx.font='bold 48px Arial';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText('跳跃方块',W/2,120);

  // Subtitle
  ctx.font='18px "Microsoft YaHei",Arial';
  ctx.fillStyle='#aaa';
  ctx.fillText('向上跳跃 · 收集星星 · 挑战高分',W/2,180);

  // Animated preview
  const previewY=300+Math.sin(Date.now()/300)*20;
  ctx.fillStyle='#4af';
  ctx.fillRect(W/2-15,previewY,30,30);
  ctx.fillStyle='#fff';
  ctx.fillRect(W/2-10,previewY+8,4,4);
  ctx.fillRect(W/2+6,previewY+8,4,4);
  ctx.fillRect(W/2-4,previewY+18,8,3);

  // Platforms preview
  ctx.fillStyle='#4a9';
  ctx.fillRect(W/2-40,previewY+50,80,10);
  ctx.fillRect(W/2-60,previewY+100,70,10);
  ctx.fillRect(W/2+10,previewY+140,60,10);

  // Star preview
  ctx.fillStyle='#fd0';
  ctx.beginPath();
  ctx.arc(W/2+50,previewY+30,8,0,Math.PI*2);
  ctx.fill();

  // High score
  if(G.highscore>0){
    ctx.fillStyle='#fd0';
    ctx.font='bold 16px Arial';
    ctx.fillText('最高分: '+G.highscore,W/2,480);
  }

  // Start instruction
  ctx.fillStyle='#fff';
  ctx.font='20px Arial';
  const alpha=Math.sin(Date.now()/500)*0.3+0.7;
  ctx.globalAlpha=alpha;
  ctx.fillText('点击/按空格开始',W/2,530);
  ctx.globalAlpha=1;

  // Controls
  ctx.fillStyle='#888';
  ctx.font='14px Arial';
  ctx.fillText('← → 或 A D 移动 · 触屏滑动',W/2,570);
}

function drawGameOver(){
  drawBackground();

  // Overlay
  ctx.fillStyle='rgba(0,0,0,0.7)';
  ctx.fillRect(0,0,W,H);

  // Game over text
  ctx.fillStyle='#f44';
  ctx.font='bold 48px Arial';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText('游戏结束',W/2,180);

  // Score
  ctx.fillStyle='#fff';
  ctx.font='24px Arial';
  ctx.fillText('得分: '+G.score,W/2,260);
  ctx.fillText('高度: '+G.maxHeight+'m',W/2,300);

  // New high score
  if(G.score>=G.highscore&&G.score>0){
    ctx.fillStyle='#fd0';
    ctx.font='bold 20px Arial';
    ctx.fillText('新纪录!',W/2,350);
  }

  // Restart instruction
  ctx.fillStyle='#aaa';
  ctx.font='18px Arial';
  ctx.fillText('点击/按空格重新开始',W/2,420);
}

// Click handler
function handleClick(){
  if(G.state==='title'){
    initGame();
  }else if(G.state==='gameover'){
    G.state='title';
  }
}

// Pause screen drawing
function drawPause(){
  // Dim background
  ctx.fillStyle='rgba(0,0,0,0.6)';
  ctx.fillRect(0,0,W,H);

  // Pause text
  ctx.fillStyle='#fff';
  ctx.font='bold 48px Arial';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText('暂停',W/2,H/2-30);

  // Instructions
  ctx.fillStyle='#aaa';
  ctx.font='18px Arial';
  ctx.fillText('按 ESC 或 P 继续',W/2,H/2+30);
}

// Main loop
function update(){
  G.frameCount++;

  if(G.state==='playing'){
    updatePlatforms();
    updatePlayer();
    updateParticles();
    generateMorePlatforms();
  }
}

function draw(){
  switch(G.state){
    case 'title':drawTitle();break;
    case 'playing':
      drawBackground();
      for(const p of G.platforms)drawPlatform(p);
      for(const s of G.stars)drawStar(s);
      drawParticles();
      drawPlayer();
      drawHUD();
      break;
    case 'paused':
      drawBackground();
      for(const p of G.platforms)drawPlatform(p);
      for(const s of G.stars)drawStar(s);
      drawParticles();
      drawPlayer();
      drawHUD();
      drawPause();
      break;
    case 'gameover':drawGameOver();break;
  }
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

// Keyboard start
window.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='Enter'){
    if(G.state==='title')initAudio(),initGame();
    else if(G.state==='gameover')G.state='title';
  }
  if(e.code==='Escape'||e.code==='KeyP'){
    if(G.state==='playing'){
      G.state='paused';
      G.paused=true;
    }else if(G.state==='paused'){
      G.state='playing';
      G.paused=false;
    }
  }
});

// Start
loop();

		this._goInterval = setInterval(() => {

	onGameOver() {

		this.requestRevive(null);
	},
};
