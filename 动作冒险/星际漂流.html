<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>星际漂流</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: #000; min-height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        canvas { display: block; width: 100%; height: 100%; }
        
        .ui-overlay { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
        
        .status { color: #fff; font-size: 18px; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .status span { color: #4ecdc4; }
        
        .controls { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px; z-index: 100; }
        .control-btn { width: 60px; height: 60px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.5); background: rgba(0,0,0,0.5); color: #fff; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .control-btn:active { background: rgba(255,255,255,0.2); }
        
        .ad-banner { position: absolute; bottom: 20px; left: 20px; right: 20px; height: 50px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; z-index: 100; }
    /* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */
/* [BATCH-FIX:ad-components-css] */
.sponsor-btn{position:fixed;bottom:8px;left:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:2px 6px;border-radius:10px;font:10px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.sponsor-panel.show{display:flex}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.interstitial-ad.show{display:flex}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* [/BATCH-FIX:ad-components-css] */

/* [AD-FIX:responsive] */
@media (max-width:768px){.ad-banner-container{display:none!important}.sponsor-btn{transform:scale(.8);opacity:.6}}
/* [/AD-FIX:responsive] */
</style>
</head>
<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <canvas id="gameCanvas"></canvas>
    
    <div class="ui-overlay">
        <div class="status">距离: <span id="distance">0</span> | 燃料: <span id="fuel">100</span>%</div>
    </div>
    
    <div class="controls">
        <div class="control-btn" id="leftBtn">◀</div>
        <div class="control-btn" id="upBtn">▲</div>
        <div class="control-btn" id="rightBtn">▶</div>
    </div>
    
    

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="../game_core.js"></script>
    <script>
        const GAME_NAME = '星际漂流';
        GameCore.init({ highScore: GAME_NAME });
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let ship = { x: 0, y: 0, vx: 0, vy: 0, rotation: 0, fuel: 100, speed: 5 };
        let stars = [];
        let planets = [];
        let distance = 0;
        let keys = { left: false, right: false, up: false };
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            ship.x = width / 2;
            ship.y = height - 100;
        }
        
        function initGame() {
            ship = { x: width / 2, y: height - 100, vx: 0, vy: 0, rotation: 0, fuel: 100, speed: 5 };
            distance = 0;
            stars = [];
            planets = [];
            
            for (let i = 0; i < 200; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 2 + 0.5,
                    speed: Math.random() * 3 + 1
                });
            }
            
            for (let i = 0; i < 5; i++) {
                planets.push({
                    x: Math.random() * (width - 100) + 50,
                    y: -100 - i * 300,
                    radius: Math.random() * 30 + 20,
                    color: `hsl(${Math.random() * 360}, 70%, 40%)`,
                    speed: Math.random() * 2 + 1
                });
            }
            
            updateUI();
        }
        
        function updateUI() {
            document.getElementById('distance').textContent = Math.round(distance);
            document.getElementById('fuel').textContent = Math.round(ship.fuel);
        }
        
        function update() {
            distance += 0.1;
            
            if (keys.left) {
                ship.rotation -= 0.05;
                ship.fuel -= 0.02;
            }
            if (keys.right) {
                ship.rotation += 0.05;
                ship.fuel -= 0.02;
            }
            if (keys.up) {
                ship.vx += Math.sin(-ship.rotation) * 0.2;
                ship.vy += Math.cos(-ship.rotation) * 0.2;
                ship.fuel -= 0.05;
            }
            
            ship.vy += 0.05;
            
            ship.vx *= 0.99;
            ship.vy *= 0.99;
            
            ship.x += ship.vx;
            ship.y += ship.vy;
            
            if (ship.x < 0) ship.x = width;
            if (ship.x > width) ship.x = 0;
            if (ship.y < 0) ship.y = height;
            
            if (ship.fuel <= 0) {
                gameOver();
                return;
            }
            
            stars.forEach(s => {
                s.y += s.speed;
                if (s.y > height) {
                    s.y = 0;
                    s.x = Math.random() * width;
                }
            });
            
            planets.forEach((p, index) => {
                p.y += p.speed;
                
                const dx = ship.x - p.x;
                const dy = ship.y - p.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < ship.speed + p.radius) {
                    gameOver();
                    return;
                }
                
                if (p.y > height + 100) {
                    planets[index] = {
                        x: Math.random() * (width - 100) + 50,
                        y: -100,
                        radius: Math.random() * 30 + 20,
                        color: `hsl(${Math.random() * 360}, 70%, 40%)`,
                        speed: Math.random() * 2 + 1
                    };
                }
            });
            
            updateUI();
        }
        
        function draw() {
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, width, height);
            
            stars.forEach(s => {
                ctx.fillStyle = `rgba(255,255,255,${0.3 + Math.random() * 0.7})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            });
            
            planets.forEach(p => {
                const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius);
                gradient.addColorStop(0, p.color);
                gradient.addColorStop(1, 'rgba(0,0,0,0)');
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.strokeStyle = p.color;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius + 5, 0, Math.PI * 2);
                ctx.stroke();
            });
            
            ctx.save();
            ctx.translate(ship.x, ship.y);
            ctx.rotate(-ship.rotation);
            
            ctx.fillStyle = '#4ecdc4';
            ctx.beginPath();
            ctx.moveTo(0, -20);
            ctx.lineTo(-10, 15);
            ctx.lineTo(10, 15);
            ctx.closePath();
            ctx.fill();
            
            if (keys.up) {
                ctx.fillStyle = '#ff6b6b';
                ctx.beginPath();
                ctx.moveTo(-5, 15);
                ctx.lineTo(0, 30 + Math.random() * 10);
                ctx.lineTo(5, 15);
                ctx.closePath();
                ctx.fill();
            }
            
            ctx.restore();
        }
        
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        function gameOver() {
            GameCore.hints.show(`😢 飞船坠毁！距离: ${Math.round(distance)}`);
            GameCore.highScore.set(GAME_NAME, Math.round(distance));
            initGame();
        }
        
        document.getElementById('leftBtn').addEventListener('touchstart', () => keys.left = true);
        document.getElementById('leftBtn').addEventListener('touchend', () => keys.left = false);
        document.getElementById('rightBtn').addEventListener('touchstart', () => keys.right = true);
        document.getElementById('rightBtn').addEventListener('touchend', () => keys.right = false);
        document.getElementById('upBtn').addEventListener('touchstart', () => keys.up = true);
        document.getElementById('upBtn').addEventListener('touchend', () => keys.up = false);
        
        document.getElementById('leftBtn').addEventListener('mousedown', () => keys.left = true);
        document.getElementById('leftBtn').addEventListener('mouseup', () => keys.left = false);
        document.getElementById('rightBtn').addEventListener('mousedown', () => keys.right = true);
        document.getElementById('rightBtn').addEventListener('mouseup', () => keys.right = false);
        document.getElementById('upBtn').addEventListener('mousedown', () => keys.up = true);
        document.getElementById('upBtn').addEventListener('mouseup', () => keys.up = false);
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') keys.left = true;
            if (e.key === 'ArrowRight') keys.right = true;
            if (e.key === 'ArrowUp') keys.up = true;
        });
        
        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft') keys.left = false;
            if (e.key === 'ArrowRight') keys.right = false;
            if (e.key === 'ArrowUp') keys.up = false;
        });
        
        window.addEventListener('resize', resize);
        resize();
        initGame();
        gameLoop();
    </script>
<!-- [BATCH-FIX:responsive-js] -->
<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>
<!-- [/BATCH-FIX:responsive-js] -->

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
