<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>梦境探索</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: #000; min-height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        canvas { display: block; width: 100%; height: 100%; }
        
        .ui-overlay { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
        
        .status { color: #fff; font-size: 18px; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .status span { color: #ffd700; }
        
        .controls { display: flex; gap: 10px; }
        .btn { padding: 10px 20px; border: none; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; background: rgba(255,255,255,0.2); color: #fff; }
        .btn:active { background: rgba(255,255,255,0.4); }
        
        .ad-banner { position: absolute; bottom: 20px; left: 20px; right: 20px; height: 50px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; z-index: 100; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div class="ui-overlay">
        <div class="status">能量: <span id="energy">100</span>% | 收集: <span id="collect">0</span>/20</div>
        <div class="controls">
            <button class="btn" onclick="resetGame()">🔄 重置</button>
        </div>
    </div>
    
    <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>

    <script src="game_core.js"></script>
    <script>
        const GAME_NAME = '梦境探索';
        GameCore.init({ highScore: GAME_NAME });
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let player = { x: 0, y: 0, radius: 20, energy: 100 };
        let collectibles = [];
        let particles = [];
        let time = 0;
        let collected = 0;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            player.x = width / 2;
            player.y = height / 2;
        }
        
        function initGame() {
            player.energy = 100;
            collected = 0;
            collectibles = [];
            particles = [];
            
            for (let i = 0; i < 20; i++) {
                collectibles.push({
                    x: Math.random() * (width - 100) + 50,
                    y: Math.random() * (height - 100) + 50,
                    radius: 15,
                    color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                    pulse: Math.random() * Math.PI * 2
                });
            }
            
            updateUI();
        }
        
        function updateUI() {
            document.getElementById('energy').textContent = Math.round(player.energy);
            document.getElementById('collect').textContent = collected;
        }
        
        function update() {
            time += 0.02;
            
            player.energy -= 0.05;
            if (player.energy <= 0) {
                gameOver();
                return;
            }
            
            collectibles.forEach((c, index) => {
                c.pulse += 0.05;
                
                const dx = player.x - c.x;
                const dy = player.y - c.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < player.radius + c.radius) {
                    collected++;
                    player.energy = Math.min(100, player.energy + 10);
                    
                    for (let i = 0; i < 20; i++) {
                        particles.push({
                            x: c.x, y: c.y,
                            vx: (Math.random() - 0.5) * 10,
                            vy: (Math.random() - 0.5) * 10,
                            color: c.color,
                            life: 1
                        });
                    }
                    
                    collectibles.splice(index, 1);
                    updateUI();
                    
                    if (collected >= 20) {
                        gameWin();
                    }
                }
            });
            
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;
                
                if (p.life <= 0) {
                    particles.splice(index, 1);
                }
            });
            
            updateUI();
        }
        
        function draw() {
            ctx.fillStyle = `hsl(${time * 10}, 30%, ${10 + Math.sin(time) * 5}%)`;
            ctx.fillRect(0, 0, width, height);
            
            ctx.fillStyle = 'rgba(255,255,255,0.02)';
            for (let i = 0; i < 100; i++) {
                const x = (Math.sin(i * 0.1 + time) * width / 2) + width / 2;
                const y = (Math.cos(i * 0.15 + time * 0.7) * height / 2) + height / 2;
                ctx.beginPath();
                ctx.arc(x, y, 1, 0, Math.PI * 2);
                ctx.fill();
            }
            
            collectibles.forEach(c => {
                const pulseSize = 1 + Math.sin(c.pulse) * 0.2;
                
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.radius * pulseSize * 2, 0, Math.PI * 2);
                ctx.fillStyle = c.color + '20';
                ctx.fill();
                
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.radius * pulseSize, 0, Math.PI * 2);
                ctx.fillStyle = c.color;
                ctx.fill();
                
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.radius * pulseSize * 0.5, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();
            });
            
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 5 * p.life, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.fill();
                ctx.globalAlpha = 1;
            });
            
            const gradient = ctx.createRadialGradient(player.x, player.y, 0, player.x, player.y, player.radius * 2);
            gradient.addColorStop(0, 'rgba(255,215,0,0.5)');
            gradient.addColorStop(0.5, 'rgba(255,215,0,0.2)');
            gradient.addColorStop(1, 'rgba(255,215,0,0)');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius * 2, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#ffd700';
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(player.x - 5, player.y - 3, 3, 0, Math.PI * 2);
            ctx.arc(player.x + 5, player.y - 3, 3, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        function gameOver() {
            GameCore.hints.show('😢 能量耗尽！游戏结束');
            GameCore.highScore.set(GAME_NAME, collected);
            initGame();
        }
        
        function gameWin() {
            GameCore.hints.show('🎉 恭喜通关！收集全部梦境碎片！');
            GameCore.highScore.set(GAME_NAME, 20);
            initGame();
        }
        
        function resetGame() {
            initGame();
        }
        
        canvas.addEventListener('mousemove', (e) => {
            player.x = e.clientX;
            player.y = e.clientY;
        });
        
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            player.x = e.touches[0].clientX;
            player.y = e.touches[0].clientY;
        });
        
        window.addEventListener('resize', resize);
        resize();
        initGame();
        gameLoop();
    </script>
</body>
</html>
