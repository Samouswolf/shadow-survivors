<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">楼层</div>
                <div class="stat-value" id="floor">1</div>
            </div>
            <div class="stat">
                <div class="stat-label">金币</div>
                <div class="stat-value" id="gold">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">击杀</div>
                <div class="stat-value" id="kills">0</div>
            </div>
        </div>

        <div class="hp-display">
            <div class="hp-info">HP: <span id="hp">100</span></div>
            <div class="hp-info">攻击: <span id="attack">10</span></div>
        </div>

        <div class="guide">方向键移动，打败怪物，找到楼梯下楼！</div>

        <div class="dungeon-container">
            <div class="dungeon" id="dungeon"></div>
        </div>

        <div class="controls">
            <div class="ctrl-btn empty"></div>
            <button class="ctrl-btn" id="btnUp">↑</button>
            <div class="ctrl-btn empty"></div>
            <button class="ctrl-btn" id="btnLeft">←</button>
            <button class="ctrl-btn" id="btnDown">↓</button>
            <button class="ctrl-btn" id="btnRight">→</button>
        </div>

        <div class="action-btns">
            <button class="btn btn-primary" id="btnReset">🔄 新游戏</button>
        </div>

        <div class="message" id="message"></div>

        
    </div>

    <script>
        const DUNGEON_SIZE = 10;
        let dungeon = [];
        let playerPos = { x: 1, y: 1 };
        let stairsPos = { x: 0, y: 0 };
        let enemies = [];
        let chests = [];
        let hp = 100;
        let attack = 10;
        let gold = 0;
        let kills = 0;
        let floor = 1;
        let gameOver = false;

        function generateDungeon() {
            dungeon = [];

            // 初始化全是墙
            for (let y = 0; y < DUNGEON_SIZE; y++) {
                dungeon[y] = [];
                for (let x = 0; x < DUNGEON_SIZE; x++) {
                    dungeon[y][x] = 'wall';
                }
            }

            // 生成房间和走廊
            function carveRoom(x, y, w, h) {
                for (let dy = y; dy < y + h && dy < DUNGEON_SIZE - 1; dy++) {
                    for (let dx = x; dx < x + w && dx < DUNGEON_SIZE - 1; dx++) {
                        dungeon[dy][dx] = 'floor';
                    }
                }
            }

            // 创建几个房间
            const rooms = [];
            for (let i = 0; i < 3 + floor; i++) {
                const w = 3 + Math.floor(Math.random() * 3);
                const h = 3 + Math.floor(Math.random() * 3);
                const x = 1 + Math.floor(Math.random() * (DUNGEON_SIZE - w - 2));
                const y = 1 + Math.floor(Math.random() * (DUNGEON_SIZE - h - 2));
                carveRoom(x, y, w, h);
                rooms.push({ x, y, w, h });
            }

            // 连接房间
            for (let i = 1; i < rooms.length; i++) {
                const r1 = rooms[i - 1];
                const r2 = rooms[i];
                const x1 = r1.x + Math.floor(r1.w / 2);
                const y1 = r1.y + Math.floor(r1.h / 2);
                const x2 = r2.x + Math.floor(r2.w / 2);
                const y2 = r2.y + Math.floor(r2.h / 2);

                // 水平走廊
                for (let x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) {
                    if (y1 < DUNGEON_SIZE) dungeon[y1][x] = 'floor';
                }
                // 垂直走廊
                for (let y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) {
                    if (x2 < DUNGEON_SIZE) dungeon[y][x2] = 'floor';
                }
            }

            // 设置玩家位置
            playerPos = { x: rooms[0].x + 1, y: rooms[0].y + 1 };

            // 设置楼梯
            const lastRoom = rooms[rooms.length - 1];
            stairsPos = { x: lastRoom.x + 1, y: lastRoom.y + 1 };
            dungeon[stairsPos.y][stairsPos.x] = 'stairs';

            // 添加敌人
            enemies = [];
            const enemyCount = 2 + floor;
            for (let i = 0; i < enemyCount; i++) {
                let attempts = 0;
                while (attempts < 100) {
                    const x = Math.floor(Math.random() * DUNGEON_SIZE);
                    const y = Math.floor(Math.random() * DUNGEON_SIZE);
                    if (dungeon[y][x] === 'floor' &&
                        !(x === playerPos.x && y === playerPos.y) &&
                        !(x === stairsPos.x && y === stairsPos.y) &&
                        !enemies.some(e => e.x === x && e.y === y)) {
                        enemies.push({
                            x, y,
                            hp: 20 + floor * 5,
                            attack: 5 + floor * 2,
                            type: ['👹', '💀', '🦇', '👻'][Math.floor(Math.random() * 4)]
                        });
                        break;
                    }
                    attempts++;
                }
            }

            // 添加宝箱
            chests = [];
            const chestCount = 1 + Math.floor(floor / 2);
            for (let i = 0; i < chestCount; i++) {
                let attempts = 0;
                while (attempts < 100) {
                    const x = Math.floor(Math.random() * DUNGEON_SIZE);
                    const y = Math.floor(Math.random() * DUNGEON_SIZE);
                    if (dungeon[y][x] === 'floor' &&
                        !(x === playerPos.x && y === playerPos.y) &&
                        !(x === stairsPos.x && y === stairsPos.y) &&
                        !enemies.some(e => e.x === x && e.y === y) &&
                        !chests.some(c => c.x === x && c.y === y)) {
                        chests.push({ x, y, gold: 50 + floor * 20 });
                        break;
                    }
                    attempts++;
                }
            }

            gameOver = false;
            renderDungeon();
        }

        function renderDungeon() {
            const dungeonEl = document.getElementById('dungeon');
            dungeonEl.style.gridTemplateColumns = `repeat(${DUNGEON_SIZE}, 35px)`;
            dungeonEl.innerHTML = '';

            for (let y = 0; y < DUNGEON_SIZE; y++) {
                for (let x = 0; x < DUNGEON_SIZE; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell ' + dungeon[y][x];

                    if (x === playerPos.x && y === playerPos.y) {
                        cell.className = 'cell player';
                        cell.textContent = '🧙';
                    } else if (enemies.some(e => e.x === x && e.y === y)) {
                        const enemy = enemies.find(e => e.x === x && e.y === y);
                        cell.className = 'cell enemy';
                        cell.textContent = enemy.type;
                    } else if (chests.some(c => c.x === x && c.y === y)) {
                        cell.className = 'cell chest';
                        cell.textContent = '📦';
                    } else if (dungeon[y][x] === 'stairs') {
                        cell.textContent = '🚪';
                    } else if (dungeon[y][x] === 'wall') {
                        cell.textContent = '';
                    } else {
                        cell.textContent = '';
                    }

                    dungeonEl.appendChild(cell);
                }
            }
        }

        function movePlayer(dx, dy) {
            if (gameOver) return;

            const newX = playerPos.x + dx;
            const newY = playerPos.y + dy;

            if (newX < 0 || newX >= DUNGEON_SIZE || newY < 0 || newY >= DUNGEON_SIZE) return;
            if (dungeon[newY][newX] === 'wall') return;

            playerPos.x = newX;
            playerPos.y = newY;

            // 检查敌人
            const enemyIndex = enemies.findIndex(e => e.x === newX && e.y === newY);
            if (enemyIndex !== -1) {
                fightEnemy(enemyIndex);
            }

            // 检查宝箱
            const chestIndex = chests.findIndex(c => c.x === newX && c.y === newY);
            if (chestIndex !== -1) {
                gold += chests[chestIndex].gold;
                chests.splice(chestIndex, 1);
                showMessage('找到宝箱！+' + chests[chestIndex - 1]?.gold + '金币');
            }

            // 检查楼梯
            if (newX === stairsPos.x && newY === stairsPos.y) {
                floor++;
                hp = Math.min(100, hp + 20);
                attack += 2;
                showMessage('进入下一层！');
                generateDungeon();
            }

            renderDungeon();
            updateUI();
        }

        function fightEnemy(index) {
            const enemy = enemies[index];

            // 简单战斗逻辑
            while (enemy.hp > 0 && hp > 0) {
                enemy.hp -= attack;
                if (enemy.hp > 0) {
                    hp -= enemy.attack;
                }
            }

            if (hp <= 0) {
                gameOver = true;
                showMessage('游戏结束！\n楼层: ' + floor + '\n金币: ' + gold);
                return;
            }

            enemies.splice(index, 1);
            kills++;
            gold += 10 + floor * 5;
            showMessage('击败敌人！');
        }

        function updateUI() {
            document.getElementById('floor').textContent = floor;
            document.getElementById('gold').textContent = gold;
            document.getElementById('kills').textContent = kills;
            document.getElementById('hp').textContent = hp;
            document.getElementById('attack').textContent = attack;
        }

        function showMessage(msg) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 1500);
        }

        function resetGame() {
            floor = 1;
            hp = 100;
            attack = 10;
            gold = 0;
            kills = 0;
            generateDungeon();
            updateUI();
        }

        document.getElementById('btnUp').addEventListener('click', () => movePlayer(0, -1));
        document.getElementById('btnDown').addEventListener('click', () => movePlayer(0, 1));
        document.getElementById('btnLeft').addEventListener('click', () => movePlayer(-1, 0));
        document.getElementById('btnRight').addEventListener('click', () => movePlayer(1, 0));

        document.getElementById('btnReset').addEventListener('click', resetGame);

        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowUp': movePlayer(0, -1); break;
                case 'ArrowDown': movePlayer(0, 1); break;
                case 'ArrowLeft': movePlayer(-1, 0); break;
                case 'ArrowRight': movePlayer(1, 0); break;
            }
        });

        // 初始化
        GameCore.init({ highScore: 'dungeon_game' });
        generateDungeon();
        updateUI();
    </script>

<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>
<!-- [/BATCH-FIX:responsive-js] -->
<!-- [BATCH-FIX:touch-support] -->
<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>

<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
