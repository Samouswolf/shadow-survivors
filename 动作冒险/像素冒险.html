        .game-container { width: 100%; height: 100vh; display: flex; flex-direction: column; padding: 10px; }

        .stat-label { font-size: 12px; opacity: 0.7; }
        .stat-value { font-size: 24px; font-weight: bold; color: #00ff00; }
        
        .game-area { flex: 1; position: relative; background: #000; border-radius: 15px; overflow: hidden; }
        #gameCanvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
        
        .pixel-indicator { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 10px; font-size: 16px; }

    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;

<body>
<button id="start-game-btn" type="button" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:20px 40px;font-size:20px;background:#ff6b35;color:white;border:none;border-radius:12px;cursor:pointer;z-index:999;font-weight:bold;font-family:'Microsoft YaHei',sans-serif;">开始游戏</button>
    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">关卡</div>
                <div class="stat-value" id="level">1</div>
            </div>
            <div class="stat">
                <div class="stat-label">分数</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">最高</div>
                <div class="stat-value" id="highScore">0</div>
            </div>
        </div>
        
        <div class="game-area">
            <canvas id="gameCanvas"></canvas>
            <div class="pixel-indicator" id="pixelIndicator">🎮 像素: 8-bit</div>
        </div>

        </div>

  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="../game_core.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const GAME_NAME = '像素冒险';
        GameCore.init({ highScore: GAME_NAME });
        
        let level = 1;
        let score = 0;
        let gameRunning = false;
        let pixelSize = 8;
        
        let player = { x: 2, y: 5, vx: 0, vy: 0, onGround: false };
        let map = [];
        let enemies = [];
        let collectibles = [];
        
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = Math.floor(container.clientWidth / pixelSize) * pixelSize;
            canvas.height = Math.floor(container.clientHeight / pixelSize) * pixelSize;
            initLevel();
        }
        
        function initLevel() {
            player.x = 2;
            player.y = 5;
            player.vx = 0;
            player.vy = 0;
            
            const cols = canvas.width / pixelSize;
            const rows = canvas.height / pixelSize;
            
            map = [];
            enemies = [];
            collectibles = [];
            
            for (let y = 0; y < rows; y++) {
                map[y] = [];
                for (let x = 0; x < cols; x++) {
                    if (y === rows - 1 || y === rows - 2) {
                        map[y][x] = '#333';
                    } else if (Math.random() > 0.8 && x > 10) {
                        map[y][x] = '#666';
                    } else {
                        map[y][x] = null;
                    }
                }
            }
            
            for (let i = 0; i < 3 + level; i++) {
                enemies.push({
                    x: 10 + i * 15,
                    y: rows - 3,
                    vx: 1,
                    color: '#ff0000'
                });
            }
            
            for (let i = 0; i < 5; i++) {
                collectibles.push({
                    x: 5 + i * 10,
                    y: 3 + Math.floor(Math.random() * 3),
                    collected: false,
                    color: '#ffff00'
                });
            }
        }
        
        function updatePlayer() {
            player.vy += 0.2;
            player.x += player.vx;
            player.y += player.vy;
            
            let onGround = false;
            
            const rows = canvas.height / pixelSize;
            const cols = canvas.width / pixelSize;
            
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    if (map[y][x]) {
                        if (player.y + 1 > y && player.y < y + 1 &&
                            player.x < x + 1 && player.x + 1 > x) {
                            if (player.vy > 0) {
                                player.y = y - 0.5;
                                player.vy = 0;
                                onGround = true;
                            } else if (player.vy < 0) {
                                player.y = y + 1;
                                player.vy = 0;
                            }
                            if (player.vx > 0) player.x = x - 1;
                            if (player.vx < 0) player.x = x + 0.5;
                        }
                    }
                }
            }
            
            player.onGround = onGround;
            
            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width / pixelSize - 1) player.x = canvas.width / pixelSize - 1;
            if (player.y > canvas.height / pixelSize) {
                initLevel();
            }
        }
        
        function updateEnemies() {
            enemies.forEach(enemy => {
                enemy.x += enemy.vx;
                
                if (enemy.x < 5 || enemy.x > canvas.width / pixelSize - 5) {
                    enemy.vx *= -1;
                }
                
                const dx = Math.abs(player.x - enemy.x);
                const dy = Math.abs(player.y - enemy.y);
                if (dx < 1 && dy < 1) {
                    gameOver();
                }
            });
        }
        
        function checkCollisions() {
            collectibles.forEach(c => {
                if (!c.collected) {
                    const dx = Math.abs(player.x - c.x);
                    const dy = Math.abs(player.y - c.y);
                    if (dx < 1 && dy < 1) {
                        c.collected = true;
                        score += 100;
                    }
                }
            });
            
            if (collectibles.every(c => c.collected)) {
                level++;
                score += level * 500;
                pixelSize = Math.max(4, pixelSize - 1);
                resizeCanvas();
            }
            
            if (player.x > canvas.width / pixelSize - 5) {
                level++;
                score += level * 500;
                initLevel();
            }
            
            updateStats();
        }
        
        function gameOver() {
            gameRunning = false;
            GameCore.hints.show('游戏结束！\n关卡: ' + level + ' | 分数: ' + score, 5000);
        }
        
        function drawPixel(x, y, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x * pixelSize, y * pixelSize, pixelSize, pixelSize);
        }
        
        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const rows = canvas.height / pixelSize;
            const cols = canvas.width / pixelSize;
            
            // 地图
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    if (map[y][x]) {
                        drawPixel(x, y, map[y][x]);
                    }
                }
            }
            
            // 收集物
            collectibles.forEach(c => {
                if (!c.collected) {
                    drawPixel(c.x, c.y, c.color);
                }
            });
            
            // 敌人
            enemies.forEach(enemy => {
                drawPixel(Math.floor(enemy.x), Math.floor(enemy.y), enemy.color);
            });
            
            // 玩家
            drawPixel(Math.floor(player.x), Math.floor(player.y), '#00ff00');
            
            // 像素边框
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1;
            for (let x = 0; x <= cols; x++) {
                ctx.beginPath();
                ctx.moveTo(x * pixelSize, 0);
                ctx.lineTo(x * pixelSize, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y <= rows; y++) {
                ctx.beginPath();
                ctx.moveTo(0, y * pixelSize);
                ctx.lineTo(canvas.width, y * pixelSize);
                ctx.stroke();
            }
        }
        
        function updateStats() {
            document.getElementById('level').textContent = level;
            document.getElementById('score').textContent = score;
            document.getElementById('highScore').textContent = GameCore.highScore.get(GAME_NAME);
            document.getElementById('pixelIndicator').textContent = '🎮 像素: ' + pixelSize + '-bit';
            
            if (GameCore.highScore.set(GAME_NAME, score)) {
                GameCore.hints.show('新纪录！分数: ' + score);
            }
        }
        
        function gameLoop() {
            draw();
            
            if (gameRunning) {
                updatePlayer();
                updateEnemies();
                checkCollisions();
            }
            
            updateStats();
            requestAnimationFrame(gameLoop);
        }
        
        document.addEventListener('keydown', e => {
            if (!gameRunning) return;
            
            if (e.code === 'ArrowRight' || e.code === 'KeyD') player.vx = 3;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') player.vx = -3;
            if (e.code === 'ArrowUp' || e.code === 'KeyW') {
                if (player.onGround) {
                    player.vy = -5;
                    player.onGround = false;
                }
            }
        });
        
        document.addEventListener('keyup', e => {
            if (e.code === 'ArrowRight' || e.code === 'KeyD' || e.code === 'ArrowLeft' || e.code === 'KeyA') player.vx = 0;
        });
        
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            if (!gameRunning) return;
            
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            
            if (x < canvas.width / 2) {
                player.vx = -3;
            } else {
                player.vx = 3;
            }
            
            if (player.onGround) {
                player.vy = -5;
                player.onGround = false;
            }
        }, { passive: false });
        
        canvas.addEventListener('touchend', () => {
            player.vx = 0;
        });
        
        document.getElementById('btnStart').onclick = () => {
            gameRunning = true;
            level = 1;
            score = 0;
            pixelSize = 8;
            initLevel();
        };
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        gameLoop();
    </script>

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
