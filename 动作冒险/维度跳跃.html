<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>维度跳跃</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; overflow: hidden; color: #fff; }
        .game-container { width: 100%; height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 10px; }
        .stat { display: flex; flex-direction: column; align-items: center; }
        .stat-label { font-size: 12px; opacity: 0.7; }
        .stat-value { font-size: 24px; font-weight: bold; color: #4ecdc4; }
        
        .game-area { flex: 1; position: relative; background: rgba(0,0,0,0.4); border-radius: 15px; overflow: hidden; }
        #gameCanvas { width: 100%; height: 100%; display: block; }
        
        .dimension-indicator { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 10px; font-size: 16px; }
        
        .controls { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
        .btn { padding: 12px 25px; border: none; border-radius: 25px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">维度</div>
                <div class="stat-value" id="dimension">2D</div>
            </div>
            <div class="stat">
                <div class="stat-label">分数</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">最高</div>
                <div class="stat-value" id="highScore">0</div>
            </div>
        </div>
        
        <div class="game-area">
            <canvas id="gameCanvas"></canvas>
            <div class="dimension-indicator" id="dimensionIndicator">🎲 2D 平面</div>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" id="btnStart">▶️ 开始游戏</button>
        </div>
        
        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    <script src="game_core.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const GAME_NAME = '维度跳跃';
        GameCore.init({ highScore: GAME_NAME });
        
        let dimension = 2;
        let score = 0;
        let gameRunning = false;
        
        let player = { x: 50, y: 300, width: 30, height: 30, vx: 0, vy: 0, onGround: false };
        let platforms = [];
        let dimensionPortals = [];
        let targets = [];
        
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            initLevel();
        }
        
        function initLevel() {
            player.x = 50;
            player.y = canvas.height - 80;
            player.vx = 0;
            player.vy = 0;
            
            platforms = [];
            dimensionPortals = [];
            targets = [];
            
            const platformCount = 5 + Math.floor(dimension / 2);
            for (let i = 0; i < platformCount; i++) {
                platforms.push({
                    x: 100 + i * 120,
                    y: 100 + Math.random() * 250,
                    width: 80 + Math.random() * 40,
                    height: 15,
                    dimension: Math.floor(Math.random() * 3) + 2,
                    color: '#4ecdc4'
                });
            }
            
            platforms.push({ x: 0, y: canvas.height - 20, width: canvas.width, height: 20, dimension: 2, color: '#4a5568' });
            
            for (let i = 0; i < 3; i++) {
                dimensionPortals.push({
                    x: 150 + i * 200,
                    y: canvas.height - 50,
                    width: 50,
                    height: 30,
                    targetDimension: ((i % 3) + 2),
                    color: ['#ff6b6b', '#ffa502', '#48c78e'][i]
                });
            }
            
            targets.push({
                x: canvas.width - 80,
                y: canvas.height / 2 - 25,
                width: 50,
                height: 50,
                color: '#a855f7'
            });
        }
        
        function jumpDimension(targetDim) {
            dimension = targetDim;
            
            const labels = {
                2: '🎲 2D 平面',
                3: '🧊 3D 空间',
                4: '🌀 4D 时空'
            };
            
            document.getElementById('dimension').textContent = dimension + 'D';
            document.getElementById('dimensionIndicator').textContent = labels[dimension];
            
            for (let i = 0; i < 20; i++) {
                particles.push({
                    x: player.x + player.width / 2,
                    y: player.y + player.height / 2,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1,
                    color: ['#ff6b6b', '#ffa502', '#48c78e'][dimension - 2]
                });
            }
        }
        
        function updatePlayer() {
            player.vx *= 0.95;
            player.vy += 0.5;
            
            let onGround = false;
            platforms.forEach(platform => {
                if (platform.dimension !== dimension) return;
                
                if (player.y + player.height > platform.y &&
                    player.y + player.height < platform.y + platform.height + 10 &&
                    player.x < platform.x + platform.width &&
                    player.x + player.width > platform.x &&
                    player.vy >= 0) {
                    player.y = platform.y - player.height;
                    player.vy = 0;
                    onGround = true;
                }
            });
            player.onGround = onGround;
            
            player.x += player.vx;
            player.y += player.vy;
            
            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
        }
        
        function checkCollisions() {
            dimensionPortals.forEach(portal => {
                if (player.x < portal.x + portal.width &&
                    player.x + player.width > portal.x &&
                    player.y < portal.y + portal.height &&
                    player.y + player.height > portal.y) {
                    jumpDimension(portal.targetDimension);
                    score += 200;
                }
            });
            
            targets.forEach(target => {
                if (player.x < target.x + target.width &&
                    player.x + player.width > target.x &&
                    player.y < target.y + target.height &&
                    player.y + player.height > target.y) {
                    dimension++;
                    score += dimension * 1000;
                    initLevel();
                }
            });
            
            if (player.y > canvas.height + 100) {
                initLevel();
            }
            
            updateStats();
        }
        
        function updateParticles() {
            particles = particles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;
                return p.life > 0;
            });
        }
        
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 维度背景
            if (dimension === 2) {
                ctx.fillStyle = '#1a1a2e';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else if (dimension === 3) {
                const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
                gradient.addColorStop(0, '#1a1a2e');
                gradient.addColorStop(1, '#2d1b4e');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 3D网格
                ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                for (let i = 0; i < canvas.width; i += 50) {
                    ctx.beginPath();
                    ctx.moveTo(i, 0);
                    ctx.lineTo(i + 100, canvas.height);
                    ctx.stroke();
                }
            } else {
                const gradient = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, 0, canvas.width / 2, canvas.height / 2, canvas.width);
                gradient.addColorStop(0, '#2d1b4e');
                gradient.addColorStop(1, '#0f0c29');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 4D效果
                for (let i = 0; i < 30; i++) {
                    const x = (i * 73 + Date.now() / 100) % canvas.width;
                    const y = (i * 97 + Date.now() / 100) % canvas.height;
                    ctx.fillStyle = `rgba(168, 85, 247, ${0.1 + Math.sin(Date.now() / 500 + i) * 0.05})`;
                    ctx.beginPath();
                    ctx.arc(x, y, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            
            // 平台
            platforms.forEach(platform => {
                ctx.globalAlpha = platform.dimension === dimension ? 1 : 0.2;
                ctx.fillStyle = platform.color;
                ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
            });
            ctx.globalAlpha = 1;
            
            // 维度传送门
            dimensionPortals.forEach(portal => {
                ctx.fillStyle = portal.color;
                ctx.shadowColor = portal.color;
                ctx.shadowBlur = 15;
                ctx.fillRect(portal.x, portal.y, portal.width, portal.height);
                ctx.shadowBlur = 0;
                
                ctx.fillStyle = '#fff';
                ctx.font = '14px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(portal.targetDimension + 'D', portal.x + portal.width / 2, portal.y + portal.height / 2 + 5);
            });
            
            // 目标
            targets.forEach(target => {
                ctx.fillStyle = target.color;
                ctx.shadowColor = target.color;
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.arc(target.x + target.width / 2, target.y + target.height / 2, 25, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                
                ctx.fillStyle = '#fff';
                ctx.font = '24px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('🎯', target.x + target.width / 2, target.y + target.height / 2 + 8);
            });
            
            // 玩家
            ctx.fillStyle = '#f5576c';
            ctx.shadowColor = '#f5576c';
            ctx.shadowBlur = 10;
            
            if (dimension === 2) {
                ctx.fillRect(player.x, player.y, player.width, player.height);
            } else if (dimension === 3) {
                ctx.beginPath();
                ctx.moveTo(player.x + player.width / 2, player.y);
                ctx.lineTo(player.x + player.width, player.y + player.height);
                ctx.lineTo(player.x, player.y + player.height);
                ctx.closePath();
                ctx.fill();
            } else {
                ctx.beginPath();
                ctx.arc(player.x + player.width / 2, player.y + player.height / 2, player.width / 2, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;
            
            // 粒子
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }
        
        let particles = [];
        
        function updateStats() {
            document.getElementById('score').textContent = score;
            document.getElementById('highScore').textContent = GameCore.highScore.get(GAME_NAME);
            
            if (GameCore.highScore.set(GAME_NAME, score)) {
                GameCore.hints.show('新纪录！分数: ' + score);
            }
        }
        
        function gameLoop() {
            draw();
            
            if (gameRunning) {
                updatePlayer();
                checkCollisions();
                updateParticles();
            }
            
            updateStats();
            requestAnimationFrame(gameLoop);
        }
        
        document.addEventListener('keydown', e => {
            if (!gameRunning) return;
            
            if (e.code === 'ArrowRight' || e.code === 'KeyD') player.vx = 5;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') player.vx = -5;
            if (e.code === 'ArrowUp' || e.code === 'KeyW') {
                if (player.onGround) {
                    player.vy = -12;
                    player.onGround = false;
                }
            }
            if (e.code === 'Digit2') jumpDimension(2);
            if (e.code === 'Digit3') jumpDimension(3);
            if (e.code === 'Digit4') jumpDimension(4);
        });
        
        document.addEventListener('keyup', e => {
            if (e.code === 'ArrowRight' || e.code === 'KeyD' || e.code === 'ArrowLeft' || e.code === 'KeyA') player.vx = 0;
        });
        
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            if (!gameRunning) return;
            
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            
            if (x < canvas.width / 3) {
                player.vx = -5;
            } else if (x > canvas.width * 2 / 3) {
                player.vx = 5;
            } else {
                if (player.onGround) {
                    player.vy = -12;
                    player.onGround = false;
                }
            }
        }, { passive: false });
        
        canvas.addEventListener('touchend', () => {
            player.vx = 0;
        });
        
        document.getElementById('btnStart').onclick = () => {
            gameRunning = true;
            dimension = 2;
            score = 0;
            initLevel();
        };
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        gameLoop();
    </script>
</body>
</html>
