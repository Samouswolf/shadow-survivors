<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>田径跨栏</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); min-height: 100vh; overflow: hidden; }
        .game-container { width: 100%; height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 10px; }
        .score-display { color: #ffd700; font-size: 24px; font-weight: bold; }
        .lap-display { color: #4ecdc4; font-size: 16px; }
        
        .track { flex: 1; background: linear-gradient(180deg, #d2691e, #8b4513); border-radius: 20px; position: relative; overflow: hidden; }
        .track-lines { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent, transparent 50px, rgba(255,255,255,0.2) 50px, rgba(255,255,255,0.2) 52px); }
        
        .runner { position: absolute; bottom: 30px; left: 50px; width: 40px; height: 50px; background: #22c55e; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 28px; transition: bottom 0.2s; }
        .runner.jumping { bottom: 80px; }
        
        .hurdle { position: absolute; width: 60px; height: 40px; background: #ef4444; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        
        .finish { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); width: 10px; height: 200px; background: #fff; }
        
        .stats { display: flex; justify-content: space-around; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-top: 10px; }
        .stat-item { text-align: center; color: #fff; }
        .stat-value { font-size: 20px; font-weight: bold; }
        .stat-label { font-size: 12px; opacity: 0.7; }
        
        .controls { display: flex; gap: 10px; margin-top: 10px; }
        .btn { flex: 1; padding: 15px; border: none; border-radius: 15px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .btn-run { background: linear-gradient(135deg, #22c55e, #16a34a); color: #fff; }
        .btn-jump { background: linear-gradient(135deg, #3b82f6, #2563eb); color: #fff; }
        
        .message { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); color: #fff; padding: 20px 40px; border-radius: 15px; font-size: 20px; display: none; z-index: 100; }
        .message.show { display: block; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 10px; font-size: 14px; }
    /* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */
/* [BATCH-FIX:ad-components-css] */
.sponsor-btn{position:fixed;top:44px;right:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:3px 9px;border-radius:10px;font:11px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.sponsor-panel.show{display:flex}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}

<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="score-display">🏃 <span id="score">0</span></div>
            <div class="lap-display">第 <span id="lap">1</span> 圈</div>
        </div>
        
        <div class="track" id="track">
            <div class="track-lines"></div>
            <div class="runner" id="runner">🏃</div>
            <div class="finish"></div>
        </div>
        
        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="hurdles">0</div>
                <div class="stat-label">跨栏</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="time">0</div>
                <div class="stat-label">用时</div>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn btn-run" id="btnRun">▶️ 奔跑</button>
            <button class="btn btn-jump" id="btnJump">⬆️ 跨栏</button>
        </div>
        
        <div class="message" id="message"></div>
        
        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script>
        const TRACK_WIDTH = 100;
        const HURDLE_COUNT = 5;
        
        let score = 0;
        let lap = 1;
        let hurdles = 0;
        let raceTime = 0;
        let runnerX = 50;
        let hurdleItems = [];
        let isJumping = false;
        let gameRunning = false;
        let gameLoop = null;
        let timerInterval = null;
        
        function loadData() {
            const saved = GameCore.storage.get('hurdle_race_data', null);
            if (saved) {
                score = saved.score;
                lap = saved.lap;
            }
            updateUI();
            setupRace();
        }
        
        function saveData() {
            GameCore.storage.set('hurdle_race_data', { score, lap });
        }
        
        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('lap').textContent = lap;
            document.getElementById('hurdles').textContent = hurdles;
            document.getElementById('time').textContent = raceTime.toFixed(1);
        }
        
        function setupRace() {
            const track = document.getElementById('track');
            
            // Remove old hurdles
            track.querySelectorAll('.hurdle').forEach(el => el.remove());
            
            // Reset runner
            runnerX = 50;
            hurdles = 0;
            raceTime = 0;
            isJumping = false;
            gameRunning = true;
            
            const runner = document.getElementById('runner');
            runner.style.left = runnerX + 'px';
            runner.classList.remove('jumping');
            
            // Create hurdles
            hurdleItems = [];
            for (let i = 0; i < HURDLE_COUNT; i++) {
                const hurdle = document.createElement('div');
                hurdle.className = 'hurdle';
                hurdle.textContent = '🚧';
                hurdle.style.left = (150 + i * 80) + 'px';
                hurdle.style.bottom = '30px';
                track.appendChild(hurdle);
                hurdleItems.push({ el: hurdle, x: 150 + i * 80, passed: false });
            }
            
            startRace();
        }
        
        function startRace() {
            // Timer
            timerInterval = setInterval(() => {
                if (!gameRunning) return;
                raceTime += 0.1;
                updateUI();
            }, 100);
            
            // Auto run
            gameLoop = setInterval(() => {
                if (!gameRunning) return;
                
                runnerX += 3;
                const runner = document.getElementById('runner');
                runner.style.left = runnerX + 'px';
                
                // Check hurdle collision
                hurdleItems.forEach(hurdle => {
                    if (!hurdle.passed && Math.abs(runnerX - hurdle.x) < 30) {
                        if (!isJumping) {
                            endRace(false);
                        } else {
                            hurdle.passed = true;
                            hurdles++;
                            score += 10;
                            updateUI();
                        }
                    }
                });
                
                // Check finish
                if (runnerX > 500) {
                    endRace(true);
                }
            }, 50);
        }
        
        function jump() {
            if (!gameRunning || isJumping) return;
            
            isJumping = true;
            const runner = document.getElementById('runner');
            runner.classList.add('jumping');
            
            setTimeout(() => {
                runner.classList.remove('jumping');
                isJumping = false;
            }, 500);
        }
        
        function endRace(success) {
            gameRunning = false;
            clearInterval(gameLoop);
            clearInterval(timerInterval);
            
            if (success) {
                const bonus = Math.floor(50 - raceTime);
                score += 50 + bonus;
                showMessage(`🎉 完成！用时 ${raceTime.toFixed(1)}s，得分 +${50 + bonus}`);
                lap++;
            } else {
                showMessage('❌ 碰到栏架，比赛失败');
            }
            
            updateUI();
            saveData();
            
            setTimeout(() => {
                setupRace();
            }, 2000);
        }
        
        function showMessage(msg) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 2000);
        }
        
        document.getElementById('btnJump').addEventListener('click', jump);
        
        // Touch controls
        document.getElementById('track').addEventListener('touchstart', jump);
        
        GameCore.init({ highScore: 'hurdle_race' });
        loadData();
    </script>
<!-- [BATCH-FIX:responsive-js] -->
<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>
<!-- [/BATCH-FIX:responsive-js] -->

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
