<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>组队冒险</title>
    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            border-radius: 12px;
        }
        .stat {
            text-align: center;
            color: white;
        }
        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }
        .stat-value {
            font-size: 20px;
            font-weight: bold;
        }
        .team-area {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
            padding: 15px;
            background: #dfe6e9;
            border-radius: 12px;
        }
        .member {
            padding: 15px;
            background: white;
            border-radius: 10px;
            text-align: center;
            min-width: 80px;
        }
        .member-avatar {
            font-size: 40px;
        }
        .member-name {
            font-size: 14px;
            color: #2d3436;
        }
        .member-hp {
            font-size: 12px;
            color: #e74c3c;
        }
        .member-role {
            font-size: 12px;
            color: #6c5ce7;
        }
        .quest-area {
            padding: 20px;
            background: #ffeaa7;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .quest-title {
            font-size: 18px;
            color: #2d3436;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .quest-desc {
            font-size: 14px;
            color: #636e72;
        }
        .quest-progress {
            display: flex;
            gap: 5px;
            margin-top: 10px;
        }
        .progress-step {
            width: 30px;
            height: 30px;
            background: #dfe6e9;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .progress-step.done {
            background: #00b894;
            color: white;
        }
        .progress-step.current {
            background: #6c5ce7;
            color: white;
        }
        .action-area {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
        }
        .action-btn {
            padding: 15px 25px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .action-btn:hover {
            transform: scale(1.05);
        }
        .btn-attack {
            background: #e74c3c;
            color: white;
        }
        .btn-defend {
            background: #3498db;
            color: white;
        }
        .btn-heal {
            background: #00b894;
            color: white;
        }
        .btn-special {
            background: #f39c12;
            color: white;
        }
        .enemy-area {
            padding: 15px;
            background: #e17055;
            border-radius: 12px;
            margin-bottom: 15px;
            text-align: center;
        }
        .enemy-avatar {
            font-size: 50px;
        }
        .enemy-name {
            font-size: 16px;
            color: white;
        }
        .enemy-hp-bar {
            height: 10px;
            background: #2d3436;
            border-radius: 5px;
            margin-top: 10px;
        }
        .enemy-hp-fill {
            height: 100%;
            background: #e74c3c;
            border-radius: 5px;
        }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 20px 40px;
            border-radius: 15px;
            font-size: 18px;
            display: none;
            z-index: 100;
            text-align: center;
        }
        .message.show { display: block; }
        .ad-banner {
            width: 100%;
            height: 60px;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">关卡</div>
                <div class="stat-value" id="level">1</div>
            </div>
            <div class="stat">
                <div class="stat-label">金币</div>
                <div class="stat-value" id="gold">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">胜利</div>
                <div class="stat-value" id="wins">0</div>
            </div>
        </div>

        <div class="team-area" id="teamArea"></div>

        <div class="quest-area">
            <div class="quest-title" id="questTitle">任务：击败怪物</div>
            <div class="quest-desc" id="questDesc">与队友合作打败敌人！</div>
            <div class="quest-progress" id="questProgress"></div>
        </div>

        <div class="enemy-area" id="enemyArea"></div>

        <div class="action-area">
            <button class="action-btn btn-attack" id="btnAttack">⚔️ 攻击</button>
            <button class="action-btn btn-defend" id="btnDefend">🛡️ 防御</button>
            <button class="action-btn btn-heal" id="btnHeal">💚 治疗</button>
            <button class="action-btn btn-special" id="btnSpecial">✨ 特技</button>
        </div>

        <div class="controls">
            <button class="btn btn-primary" id="btnReset">🔄 新冒险</button>
        </div>

        <div class="message" id="message"></div>

        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    <script>
        const TEAM_MEMBERS = [
            { name: '战士', avatar: '🧙', role: '攻击', hp: 100, attack: 15, defense: 5 },
            { name: '法师', avatar: '🧝', role: '魔法', hp: 80, attack: 20, defense: 3 },
            { name: '牧师', avatar: '🧚', role: '治疗', hp: 70, attack: 8, defense: 4 }
        ];

        const ENEMIES = [
            { name: '哥布林', avatar: '👹', hp: 50, attack: 8 },
            { name: '骷髅兵', avatar: '💀', hp: 60, attack: 10 },
            { name: '巨魔', avatar: '🦍', hp: 80, attack: 12 },
            { name: '龙', avatar: '🐉', hp: 120, attack: 15 }
        ];

        let team = [];
        let enemy = null;
        let level = 1;
        let gold = 0;
        let wins = 0;
        let questProgress = 0;
        let defending = false;
        let gameOver = false;

        function initGame() {
            team = TEAM_MEMBERS.map(m => ({ ...m }));
            enemy = null;
            level = 1;
            gold = 0;
            wins = 0;
            questProgress = 0;
            defending = false;
            gameOver = false;

            startBattle();
        }

        function startBattle() {
            const enemyType = ENEMIES[Math.min(level - 1, ENEMIES.length - 1)];
            enemy = {
                ...enemyType,
                hp: enemyType.hp + level * 10,
                attack: enemyType.attack + level * 2,
                maxHp: enemyType.hp + level * 10
            };

            defending = false;
            renderTeam();
            renderEnemy();
            renderProgress();
            updateUI();
        }

        function renderTeam() {
            const el = document.getElementById('teamArea');
            el.innerHTML = '';

            team.forEach(member => {
                const mEl = document.createElement('div');
                mEl.className = 'member';
                mEl.innerHTML = `
                    <div class="member-avatar">${member.avatar}</div>
                    <div class="member-name">${member.name}</div>
                    <div class="member-hp">HP: ${member.hp}</div>
                    <div class="member-role">${member.role}</div>
                `;
                el.appendChild(mEl);
            });
        }

        function renderEnemy() {
            const el = document.getElementById('enemyArea');
            const hpPercent = (enemy.hp / enemy.maxHp) * 100;
            el.innerHTML = `
                <div class="enemy-avatar">${enemy.avatar}</div>
                <div class="enemy-name">${enemy.name} HP: ${enemy.hp}/${enemy.maxHp}</div>
                <div class="enemy-hp-bar">
                    <div class="enemy-hp-fill" style="width: ${hpPercent}%"></div>
                </div>
            `;
        }

        function renderProgress() {
            const el = document.getElementById('questProgress');
            el.innerHTML = '';

            for (let i = 0; i < 5; i++) {
                const step = document.createElement('div');
                step.className = 'progress-step';
                if (i < wins) step.classList.add('done');
                else if (i === wins) step.classList.add('current');
                step.textContent = i < wins ? '✓' : (i === wins ? '!' : i + 1);
                el.appendChild(step);
            }
        }

        function attack() {
            if (gameOver) return;

            // 队伍攻击
            const totalDamage = team.reduce((sum, m) => sum + m.attack, 0);
            enemy.hp -= totalDamage;

            showMessage(`队伍攻击！造成${totalDamage}点伤害`);

            if (enemy.hp <= 0) {
                winBattle();
                return;
            }

            // 敌人反击
            enemyAttack();
        }

        function defend() {
            if (gameOver) return;
            defending = true;
            showMessage('队伍防御！减少伤害');

            enemyAttack();
            defending = false;
        }

        function heal() {
            if (gameOver) return;

            team.forEach(member => {
                member.hp = Math.min(member.hp + 20, 100);
            });

            showMessage('牧师治疗！恢复20HP');
            renderTeam();

            enemyAttack();
        }

        function special() {
            if (gameOver) return;

            // 法师特技：双倍伤害
            const mage = team.find(m => m.role === '魔法');
            const damage = mage.attack * 3;
            enemy.hp -= damage;

            showMessage(`法师特技！造成${damage}点伤害`);

            if (enemy.hp <= 0) {
                winBattle();
                return;
            }

            enemyAttack();
        }

        function enemyAttack() {
            let damage = enemy.attack;
            if (defending) damage = Math.floor(damage / 2);

            // 随机攻击一个队员
            const aliveMembers = team.filter(m => m.hp > 0);
            if (aliveMembers.length === 0) {
                endGame();
                return;
            }

            const target = aliveMembers[Math.floor(Math.random() * aliveMembers.length)];
            target.hp -= damage;
            target.hp = Math.max(0, target.hp);

            showMessage(`${enemy.name}攻击${target.name}！造成${damage}点伤害`);

            renderTeam();

            // 检查队伍存活
            if (team.every(m => m.hp <= 0)) {
                endGame();
            }
        }

        function winBattle() {
            wins++;
            gold += 50 + level * 10;

            showMessage(`胜利！获得${50 + level * 10}金币`);

            if (wins >= 5) {
                level++;
                wins = 0;
                showMessage(`进入第${level}关！`);
            }

            renderProgress();
            updateUI();

            setTimeout(startBattle, 2000);
        }

        function endGame() {
            gameOver = true;
            showMessage(`游戏结束！\n关卡: ${level}\n金币: ${gold}`);
            GameCore.highScore.set('team_game', gold);
        }

        function updateUI() {
            document.getElementById('level').textContent = level;
            document.getElementById('gold').textContent = gold;
            document.getElementById('wins').textContent = wins;
        }

        function showMessage(msg) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 1500);
        }

        document.getElementById('btnAttack').addEventListener('click', attack);
        document.getElementById('btnDefend').addEventListener('click', defend);
        document.getElementById('btnHeal').addEventListener('click', heal);
        document.getElementById('btnSpecial').addEventListener('click', special);
        document.getElementById('btnReset').addEventListener('click', initGame);

        // 初始化
        GameCore.init({ highScore: 'team_game' });
        initGame();
    </script>
</body>
</html>
