  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->

        </div>

        <div class="status-bars">

            </div>

                <div class="env-icon" id="shelterIcon">🏠</div>

    <script>
        let hunger = 80;
        let water = 80;
        let health = 100;
        let energy = 100;
        let days = 1;
        let timeOfDay = '白天';
        let weather = '晴';
        let temperature = 25;
        let hasShelter = false;
        let dangerLevel = '安全';
        let inventory = { food: 2, water: 2, wood: 0, medicine: 0 };
        let gameOver = false;

        function updateStatus() {
            // 每次行动消耗资源
            hunger -= 5;
            water -= 5;
            energy -= 10;

            // 天气影响
            if (weather === '雨') {
                temperature -= 5;
                water += 5;
            }
            if (weather === '热') {
                temperature += 10;
                water -= 10;
            }

            // 没有庇护的影响
            if (!hasShelter && timeOfDay === '夜晚') {
                health -= 10;
            }

            // 检查死亡条件
            if (hunger <= 0 || water <= 0 || health <= 0) {
                gameOver = true;
                showMessage('你没能生存下去...\n存活天数: ' + days);
                return;
            }

            // 时间流逝
            if (energy <= 20) {
                timeOfDay = timeOfDay === '白天' ? '夜晚' : '白天';
                if (timeOfDay === '白天') {
                    days++;
                    // 随机天气
                    const weathers = ['晴', '雨', '热', '冷'];
                    weather = weathers[Math.floor(Math.random() * weathers.length)];
                }
            }

            renderStatus();
            renderEnvironment();
            renderInventory();
            updateUI();
        }

        function renderStatus() {
            document.getElementById('hungerBar').style.width = hunger + '%';
            document.getElementById('hungerValue').textContent = Math.max(0, hunger);
            document.getElementById('waterBar').style.width = water + '%';
            document.getElementById('waterValue').textContent = Math.max(0, water);
            document.getElementById('healthBar').style.width = health + '%';
            document.getElementById('healthValue').textContent = Math.max(0, health);
            document.getElementById('energyBar').style.width = energy + '%';
            document.getElementById('energyValue').textContent = Math.max(0, energy);
        }

        function renderEnvironment() {
            document.getElementById('tempText').textContent = temperature + '°C';
            document.getElementById('shelterIcon').textContent = hasShelter ? '🏠' : '🏕️';
            document.getElementById('shelterText').textContent = hasShelter ? '有庇护' : '无庇护';
            document.getElementById('dangerIcon').textContent = dangerLevel === '安全' ? '✅' : '⚠️';
            document.getElementById('dangerText').textContent = dangerLevel;
        }

        function renderInventory() {
            const el = document.getElementById('inventory');
            el.innerHTML = `
                <div class="inv-item">
                    <div class="inv-icon">🍖</div>
                    <div class="inv-count">${inventory.food}</div>
                </div>
                <div class="inv-item">
                    <div class="inv-icon">💧</div>
                    <div class="inv-count">${inventory.water}</div>
                </div>
                <div class="inv-item">
                    <div class="inv-icon">🪵</div>
                    <div class="inv-count">${inventory.wood}</div>
                </div>
                <div class="inv-item">
                    <div class="inv-icon">💊</div>
                    <div class="inv-count">${inventory.medicine}</div>
                </div>
            `;
        }

        function hunt() {
            if (gameOver) return;
            if (energy < 20) {
                showMessage('体力不足！');
                return;
            }

            const success = Math.random() > 0.3;
            if (success) {
                inventory.food += 2;
                showMessage('狩猎成功！获得2份食物');
            } else {
                showMessage('狩猎失败...');
            }
            updateStatus();
        }

        function getWater() {
            if (gameOver) return;
            if (energy < 10) {
                showMessage('体力不足！');
                return;
            }

            inventory.water += 2;
            showMessage('找到水源！获得2份水');
            updateStatus();
        }

        function rest() {
            if (gameOver) return;

            energy = Math.min(100, energy + 30);
            hunger -= 3;
            water -= 3;

            if (inventory.food > 0) {
                inventory.food--;
                hunger = Math.min(100, hunger + 20);
            }
            if (inventory.water > 0) {
                inventory.water--;
                water = Math.min(100, water + 20);
            }

            showMessage('休息了一会...');
            updateStatus();
        }

        function build() {
            if (gameOver) return;
            if (energy < 30) {
                showMessage('体力不足！');
                return;
            }

            if (inventory.wood >= 5) {
                inventory.wood -= 5;
                hasShelter = true;
                showMessage('庇护所建成！');
            } else {
                inventory.wood += 2;
                showMessage('收集了2份木材');
            }
            updateStatus();
        }

        function heal() {
            if (gameOver) return;

            if (inventory.medicine > 0) {
                inventory.medicine--;
                health = Math.min(100, health + 30);
                showMessage('使用药物，恢复30健康');
            } else {
                showMessage('没有药物！');
            }
            updateStatus();
        }

        function explore() {
            if (gameOver) return;
            if (energy < 20) {
                showMessage('体力不足！');
                return;
            }

            const found = Math.floor(Math.random() * 3);
            if (found === 0) {
                inventory.food += 1;
                showMessage('发现食物！');
            } else if (found === 1) {
                inventory.medicine += 1;
                showMessage('发现药物！');
            } else {
                inventory.wood += 2;
                showMessage('发现木材！');
            }

            // 随机危险
            if (Math.random() < 0.2) {
                dangerLevel = '危险';
                health -= 20;
                showMessage('遇到危险！-20健康');
            } else {
                dangerLevel = '安全';
            }

            updateStatus();
        }

        function updateUI() {
            document.getElementById('days').textContent = days;
            document.getElementById('time').textContent = timeOfDay;
            document.getElementById('weather').textContent = weather;
        }

        function showMessage(msg) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 1500);
        }

        function resetGame() {
            hunger = 80;
            water = 80;
            health = 100;
            energy = 100;
            days = 1;
            timeOfDay = '白天';
            weather = '晴';
            temperature = 25;
            hasShelter = false;
            dangerLevel = '安全';
            inventory = { food: 2, water: 2, wood: 0, medicine: 0 };
            gameOver = false;

            renderStatus();
            renderEnvironment();
            renderInventory();
            updateUI();
        }

        document.getElementById('btnHunt').addEventListener('click', hunt);
        document.getElementById('btnWater').addEventListener('click', getWater);
        document.getElementById('btnRest').addEventListener('click', rest);
        document.getElementById('btnBuild').addEventListener('click', build);
        document.getElementById('btnHeal').addEventListener('click', heal);
        document.getElementById('btnExplore').addEventListener('click', explore);
        document.getElementById('btnReset').addEventListener('click', resetGame);

        // 初始化
        GameCore.init({ highScore: 'survival_game' });
        renderStatus();
        renderEnvironment();
        renderInventory();
        updateUI();

        // 自动消耗
        setInterval(() => {
            if (!gameOver) {
                hunger -= 1;
                water -= 1;
                if (hunger <= 0 || water <= 0) {
                    health -= 5;
                }
                renderStatus();
                if (health <= 0) {
                    gameOver = true;
                    showMessage('你没能生存下去...\n存活天数: ' + days);
                    GameCore.highScore.set('survival_game', days);
                }
            }
        }, 3000);
    </script>

  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>

<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>

<script>
(function(){

  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
