<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>荒野求生</title>
    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #2d3436 0%, #636e72 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px;
            background: linear-gradient(135deg, #e17055, #d63031);
            border-radius: 12px;
        }
        .stat {
            text-align: center;
            color: white;
        }
        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }
        .stat-value {
            font-size: 20px;
            font-weight: bold;
        }
        .status-bars {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
            padding: 15px;
            background: #dfe6e9;
            border-radius: 12px;
        }
        .status-bar {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .status-icon {
            font-size: 20px;
        }
        .status-name {
            font-size: 14px;
            color: #2d3436;
            width: 60px;
        }
        .bar-container {
            flex: 1;
            height: 20px;
            background: #b2bec3;
            border-radius: 10px;
        }
        .bar-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.3s;
        }
        .bar-hunger { background: #f39c12; }
        .bar-water { background: #3498db; }
        .bar-health { background: #e74c3c; }
        .bar-energy { background: #2ecc71; }
        .status-value {
            font-size: 14px;
            color: #636e72;
            width: 40px;
        }
        .environment {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding: 10px;
            background: #ffeaa7;
            border-radius: 10px;
        }
        .env-item {
            text-align: center;
        }
        .env-icon {
            font-size: 24px;
        }
        .env-text {
            font-size: 12px;
            color: #636e72;
        }
        .actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        .action-btn {
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .action-btn:hover {
            transform: scale(1.05);
        }
        .btn-hunt { background: #e17055; color: white; }
        .btn-water { background: #3498db; color: white; }
        .btn-rest { background: #2ecc71; color: white; }
        .btn-build { background: #f39c12; color: white; }
        .btn-heal { background: #e74c3c; color: white; }
        .btn-explore { background: #6c5ce7; color: white; }
        .action-icon {
            font-size: 24px;
        }
        .inventory {
            display: flex;
            gap: 10px;
            padding: 10px;
            background: #dfe6e9;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .inv-item {
            padding: 10px;
            background: white;
            border-radius: 8px;
            text-align: center;
        }
        .inv-icon {
            font-size: 20px;
        }
        .inv-count {
            font-size: 12px;
            color: #636e72;
        }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #e17055, #d63031);
            color: white;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 20px 40px;
            border-radius: 15px;
            font-size: 18px;
            display: none;
            z-index: 100;
            text-align: center;
        }
        .message.show { display: block; }
        .ad-banner {
            width: 100%;
            height: 60px;
            background: linear-gradient(135deg, #e17055, #d63031);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">天数</div>
                <div class="stat-value" id="days">1</div>
            </div>
            <div class="stat">
                <div class="stat-label">时间</div>
                <div class="stat-value" id="time">白天</div>
            </div>
            <div class="stat">
                <div class="stat-label">天气</div>
                <div class="stat-value" id="weather">晴</div>
            </div>
        </div>

        <div class="status-bars">
            <div class="status-bar">
                <span class="status-icon">🍖</span>
                <span class="status-name">饥饿</span>
                <div class="bar-container">
                    <div class="bar-fill bar-hunger" id="hungerBar" style="width: 80%"></div>
                </div>
                <span class="status-value" id="hungerValue">80</span>
            </div>
            <div class="status-bar">
                <span class="status-icon">💧</span>
                <span class="status-name">水分</span>
                <div class="bar-container">
                    <div class="bar-fill bar-water" id="waterBar" style="width: 80%"></div>
                </div>
                <span class="status-value" id="waterValue">80</span>
            </div>
            <div class="status-bar">
                <span class="status-icon">❤️</span>
                <span class="status-name">健康</span>
                <div class="bar-container">
                    <div class="bar-fill bar-health" id="healthBar" style="width: 100%"></div>
                </div>
                <span class="status-value" id="healthValue">100</span>
            </div>
            <div class="status-bar">
                <span class="status-icon">⚡</span>
                <span class="status-name">体力</span>
                <div class="bar-container">
                    <div class="bar-fill bar-energy" id="energyBar" style="width: 100%"></div>
                </div>
                <span class="status-value" id="energyValue">100</span>
            </div>
        </div>

        <div class="environment">
            <div class="env-item">
                <div class="env-icon" id="tempIcon">🌡️</div>
                <div class="env-text" id="tempText">25°C</div>
            </div>
            <div class="env-item">
                <div class="env-icon" id="shelterIcon">🏠</div>
                <div class="env-text" id="shelterText">无庇护</div>
            </div>
            <div class="env-item">
                <div class="env-icon" id="dangerIcon">⚠️</div>
                <div class="env-text" id="dangerText">安全</div>
            </div>
        </div>

        <div class="actions">
            <button class="action-btn btn-hunt" id="btnHunt">
                <span class="action-icon">🏹</span>
                狩猎
            </button>
            <button class="action-btn btn-water" id="btnWater">
                <span class="action-icon">💧</span>
                取水
            </button>
            <button class="action-btn btn-rest" id="btnRest">
                <span class="action-icon">😴</span>
                休息
            </button>
            <button class="action-btn btn-build" id="btnBuild">
                <span class="action-icon">🔨</span>
                建造
            </button>
            <button class="action-btn btn-heal" id="btnHeal">
                <span class="action-icon">💊</span>
                治疗
            </button>
            <button class="action-btn btn-explore" id="btnExplore">
                <span class="action-icon">🔍</span>
                探索
            </button>
        </div>

        <div class="inventory" id="inventory"></div>

        <div class="controls">
            <button class="btn btn-primary" id="btnReset">🔄 新求生</button>
        </div>

        <div class="message" id="message"></div>

        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    <script>
        let hunger = 80;
        let water = 80;
        let health = 100;
        let energy = 100;
        let days = 1;
        let timeOfDay = '白天';
        let weather = '晴';
        let temperature = 25;
        let hasShelter = false;
        let dangerLevel = '安全';
        let inventory = { food: 2, water: 2, wood: 0, medicine: 0 };
        let gameOver = false;

        function updateStatus() {
            // 每次行动消耗资源
            hunger -= 5;
            water -= 5;
            energy -= 10;

            // 天气影响
            if (weather === '雨') {
                temperature -= 5;
                water += 5;
            }
            if (weather === '热') {
                temperature += 10;
                water -= 10;
            }

            // 没有庇护的影响
            if (!hasShelter && timeOfDay === '夜晚') {
                health -= 10;
            }

            // 检查死亡条件
            if (hunger <= 0 || water <= 0 || health <= 0) {
                gameOver = true;
                showMessage('你没能生存下去...\n存活天数: ' + days);
                return;
            }

            // 时间流逝
            if (energy <= 20) {
                timeOfDay = timeOfDay === '白天' ? '夜晚' : '白天';
                if (timeOfDay === '白天') {
                    days++;
                    // 随机天气
                    const weathers = ['晴', '雨', '热', '冷'];
                    weather = weathers[Math.floor(Math.random() * weathers.length)];
                }
            }

            renderStatus();
            renderEnvironment();
            renderInventory();
            updateUI();
        }

        function renderStatus() {
            document.getElementById('hungerBar').style.width = hunger + '%';
            document.getElementById('hungerValue').textContent = Math.max(0, hunger);
            document.getElementById('waterBar').style.width = water + '%';
            document.getElementById('waterValue').textContent = Math.max(0, water);
            document.getElementById('healthBar').style.width = health + '%';
            document.getElementById('healthValue').textContent = Math.max(0, health);
            document.getElementById('energyBar').style.width = energy + '%';
            document.getElementById('energyValue').textContent = Math.max(0, energy);
        }

        function renderEnvironment() {
            document.getElementById('tempText').textContent = temperature + '°C';
            document.getElementById('shelterIcon').textContent = hasShelter ? '🏠' : '🏕️';
            document.getElementById('shelterText').textContent = hasShelter ? '有庇护' : '无庇护';
            document.getElementById('dangerIcon').textContent = dangerLevel === '安全' ? '✅' : '⚠️';
            document.getElementById('dangerText').textContent = dangerLevel;
        }

        function renderInventory() {
            const el = document.getElementById('inventory');
            el.innerHTML = `
                <div class="inv-item">
                    <div class="inv-icon">🍖</div>
                    <div class="inv-count">${inventory.food}</div>
                </div>
                <div class="inv-item">
                    <div class="inv-icon">💧</div>
                    <div class="inv-count">${inventory.water}</div>
                </div>
                <div class="inv-item">
                    <div class="inv-icon">🪵</div>
                    <div class="inv-count">${inventory.wood}</div>
                </div>
                <div class="inv-item">
                    <div class="inv-icon">💊</div>
                    <div class="inv-count">${inventory.medicine}</div>
                </div>
            `;
        }

        function hunt() {
            if (gameOver) return;
            if (energy < 20) {
                showMessage('体力不足！');
                return;
            }

            const success = Math.random() > 0.3;
            if (success) {
                inventory.food += 2;
                showMessage('狩猎成功！获得2份食物');
            } else {
                showMessage('狩猎失败...');
            }
            updateStatus();
        }

        function getWater() {
            if (gameOver) return;
            if (energy < 10) {
                showMessage('体力不足！');
                return;
            }

            inventory.water += 2;
            showMessage('找到水源！获得2份水');
            updateStatus();
        }

        function rest() {
            if (gameOver) return;

            energy = Math.min(100, energy + 30);
            hunger -= 3;
            water -= 3;

            if (inventory.food > 0) {
                inventory.food--;
                hunger = Math.min(100, hunger + 20);
            }
            if (inventory.water > 0) {
                inventory.water--;
                water = Math.min(100, water + 20);
            }

            showMessage('休息了一会...');
            updateStatus();
        }

        function build() {
            if (gameOver) return;
            if (energy < 30) {
                showMessage('体力不足！');
                return;
            }

            if (inventory.wood >= 5) {
                inventory.wood -= 5;
                hasShelter = true;
                showMessage('庇护所建成！');
            } else {
                inventory.wood += 2;
                showMessage('收集了2份木材');
            }
            updateStatus();
        }

        function heal() {
            if (gameOver) return;

            if (inventory.medicine > 0) {
                inventory.medicine--;
                health = Math.min(100, health + 30);
                showMessage('使用药物，恢复30健康');
            } else {
                showMessage('没有药物！');
            }
            updateStatus();
        }

        function explore() {
            if (gameOver) return;
            if (energy < 20) {
                showMessage('体力不足！');
                return;
            }

            const found = Math.floor(Math.random() * 3);
            if (found === 0) {
                inventory.food += 1;
                showMessage('发现食物！');
            } else if (found === 1) {
                inventory.medicine += 1;
                showMessage('发现药物！');
            } else {
                inventory.wood += 2;
                showMessage('发现木材！');
            }

            // 随机危险
            if (Math.random() < 0.2) {
                dangerLevel = '危险';
                health -= 20;
                showMessage('遇到危险！-20健康');
            } else {
                dangerLevel = '安全';
            }

            updateStatus();
        }

        function updateUI() {
            document.getElementById('days').textContent = days;
            document.getElementById('time').textContent = timeOfDay;
            document.getElementById('weather').textContent = weather;
        }

        function showMessage(msg) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 1500);
        }

        function resetGame() {
            hunger = 80;
            water = 80;
            health = 100;
            energy = 100;
            days = 1;
            timeOfDay = '白天';
            weather = '晴';
            temperature = 25;
            hasShelter = false;
            dangerLevel = '安全';
            inventory = { food: 2, water: 2, wood: 0, medicine: 0 };
            gameOver = false;

            renderStatus();
            renderEnvironment();
            renderInventory();
            updateUI();
        }

        document.getElementById('btnHunt').addEventListener('click', hunt);
        document.getElementById('btnWater').addEventListener('click', getWater);
        document.getElementById('btnRest').addEventListener('click', rest);
        document.getElementById('btnBuild').addEventListener('click', build);
        document.getElementById('btnHeal').addEventListener('click', heal);
        document.getElementById('btnExplore').addEventListener('click', explore);
        document.getElementById('btnReset').addEventListener('click', resetGame);

        // 初始化
        GameCore.init({ highScore: 'survival_game' });
        renderStatus();
        renderEnvironment();
        renderInventory();
        updateUI();

        // 自动消耗
        setInterval(() => {
            if (!gameOver) {
                hunger -= 1;
                water -= 1;
                if (hunger <= 0 || water <= 0) {
                    health -= 5;
                }
                renderStatus();
                if (health <= 0) {
                    gameOver = true;
                    showMessage('你没能生存下去...\n存活天数: ' + days);
                    GameCore.highScore.set('survival_game', days);
                }
            }
        }, 3000);
    </script>
</body>
</html>
