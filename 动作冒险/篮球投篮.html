<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>篮球投篮</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; color: #fff; overflow: hidden; }
        
        .game-container { width: 100%; flex: 1; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: #ff6b6b; }
        .stats { display: flex; gap: 20px; font-size: 14px; }
        
        .canvas-area { flex: 1; background: rgba(0,0,0,0.5); border-radius: 15px; overflow: hidden; position: relative; }
        canvas { width: 100%; height: 100%; }
        
        .controls { display: flex; justify-content: center; gap: 15px; margin-top: 15px; }
        .control-btn { padding: 15px 30px; border: none; border-radius: 15px; font-size: 18px; font-weight: bold; cursor: pointer; background: rgba(255,255,255,0.2); color: #fff; }
        
        .power-bar { width: 100%; height: 20px; background: rgba(255,255,255,0.2); border-radius: 10px; overflow: hidden; margin-bottom: 10px; }
        .power-fill { height: 100%; background: linear-gradient(90deg, #48c78e, #ffd700, #ff6b6b); border-radius: 10px; width: 0%; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }
    /* [BATCH-FIX:ad-components-css] */
.sponsor-btn{position:fixed;bottom:8px;left:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:2px 6px;border-radius:10px;font:10px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.sponsor-panel.show{display:flex}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.interstitial-ad.show{display:flex}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* [/BATCH-FIX:ad-components-css] */

/* [AD-FIX:responsive] */
@media (max-width:768px){.ad-banner-container{display:none!important}.sponsor-btn{transform:scale(.8);opacity:.6}}
/* [/AD-FIX:responsive] */
</style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="title">🏀 篮球投篮</div>
            <div class="stats">
                <span>📊 得分: <span id="score">0</span></span>
                <span>🎯 命中: <span id="made">0</span>/<span id="attempts">0</span></span>
                <span>⏱️ 时间: <span id="time">30</span></span>
            </div>
        </div>
        
        <div class="power-bar">
            <div class="power-fill" id="powerFill"></div>
        </div>
        
        <div class="canvas-area">
            <canvas id="gameCanvas"></canvas>
        </div>
        
        <div class="controls">
            <button class="control-btn" onclick="shoot()">🎯 投篮</button>
            <button class="control-btn" onclick="resetGame()">🔄 重新开始</button>
        </div>
    </div>
    
    

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <script>
        const GAME_NAME = '篮球投篮';
        GameCore.init({ highScore: GAME_NAME });
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let gameRunning = true;
        let score = 0;
        let made = 0;
        let attempts = 0;
        let timeLeft = 30;
        let ball = { x: 0, y: 0, vx: 0, vy: 0, inAir: false };
        let hoop = { x: 0, y: 0, radius: 30 };
        let power = 0;
        let powerDirection = 1;
        let charging = false;
        
        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            hoop.x = canvas.width / 2;
            hoop.y = canvas.height * 0.25;
            resetBall();
        }
        
        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height - 100;
            ball.vx = 0;
            ball.vy = 0;
            ball.inAir = false;
        }
        
        function initGame() {
            resizeCanvas();
            gameRunning = true;
            score = 0;
            made = 0;
            attempts = 0;
            timeLeft = 30;
            power = 0;
            powerDirection = 1;
            charging = false;
            resetBall();
            updateUI();
            
            const timer = setInterval(() => {
                if (!gameRunning) {
                    clearInterval(timer);
                    return;
                }
                
                timeLeft--;
                updateUI();
                
                if (timeLeft <= 0) {
                    gameOver();
                    clearInterval(timer);
                }
            }, 1000);
            
            gameLoop();
        }
        
        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('made').textContent = made;
            document.getElementById('attempts').textContent = attempts;
            document.getElementById('time').textContent = timeLeft;
            
            GameCore.highScore.set(GAME_NAME, score);
        }
        
        function shoot() {
            if (ball.inAir || !gameRunning) return;
            
            const angle = -Math.PI / 4 + (Math.random() - 0.5) * 0.3;
            const velocity = power * 0.15;
            
            ball.vx = Math.cos(angle) * velocity;
            ball.vy = Math.sin(angle) * velocity;
            ball.inAir = true;
            attempts++;
            charging = false;
            
            updateUI();
        }
        
        function update() {
            if (!gameRunning) return;
            
            if (!ball.inAir) {
                power += powerDirection * 2;
                if (power >= 100 || power <= 0) {
                    powerDirection *= -1;
                }
                document.getElementById('powerFill').style.width = power + '%';
            } else {
                ball.vy += 0.5;
                ball.x += ball.vx;
                ball.y += ball.vy;
                
                if (ball.y > canvas.height) {
                    resetBall();
                }
                
                const dx = ball.x - hoop.x;
                const dy = ball.y - hoop.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < hoop.radius + 15 && ball.y > hoop.y - 10 && ball.y < hoop.y + 10) {
                    score += 2;
                    made++;
                    GameCore.hints.show('🏀 进球！+2分！');
                    resetBall();
                    updateUI();
                }
            }
        }
        
        function render() {
            ctx.fillStyle = '#4a7c23';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, canvas.height - 50, canvas.width, 50);
            
            ctx.strokeStyle = '#ff6b6b';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(hoop.x, hoop.y, hoop.radius, Math.PI, 0);
            ctx.stroke();
            
            ctx.fillStyle = '#ff6b6b';
            ctx.fillRect(hoop.x - 5, hoop.y - hoop.radius, 10, hoop.radius * 2);
            
            ctx.fillStyle = '#444';
            ctx.fillRect(hoop.x - 5, hoop.y + hoop.radius, 10, 50);
            
            ctx.fillStyle = '#ff8c42';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, 20, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#cc5500';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, 15, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.strokeStyle = '#ff8c42';
            ctx.lineWidth = 2;
            for (let i = 0; i < 4; i++) {
                const angle = (i / 4) * Math.PI * 2;
                ctx.beginPath();
                ctx.moveTo(ball.x + Math.cos(angle) * 5, ball.y + Math.sin(angle) * 5);
                ctx.lineTo(ball.x + Math.cos(angle) * 18, ball.y + Math.sin(angle) * 18);
                ctx.stroke();
            }
        }
        
        function gameLoop() {
            update();
            render();
            
            if (gameRunning) {
                requestAnimationFrame(gameLoop);
            }
        }
        
        function gameOver() {
            gameRunning = false;
            GameCore.hints.show('⏱️ 时间到！');
            
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#fff';
            ctx.font = '30px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('时间到！', canvas.width / 2, canvas.height / 2 - 40);
            ctx.font = '24px Arial';
            ctx.fillText(`得分: ${score}`, canvas.width / 2, canvas.height / 2);
            ctx.font = '20px Arial';
            ctx.fillText(`命中率: ${attempts > 0 ? Math.round(made / attempts * 100) : 0}%`, canvas.width / 2, canvas.height / 2 + 30);
        }
        
        function resetGame() {
            initGame();
        }
        
        window.addEventListener('resize', resizeCanvas);
        initGame();
        GameCore.touch.enableAllButtons();
        
        canvas.addEventListener('click', shoot);
    </script>
<!-- [BATCH-FIX:touch-support] -->
<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>
<!-- [/BATCH-FIX:touch-support] -->

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
