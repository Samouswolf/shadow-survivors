<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>羽毛球</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}
body {
    background: #0a0a1a;
    display: flex;
    justify-content: center;
    align-items: center;

    font-family: 'Segoe UI', Arial, sans-serif;

#gameCanvas {
    background: linear-gradient(180deg, #1a3a2a 0%, #2d5a3d 100%);
    border: 2px solid #1a1a3a;
    border-radius: 10px;
    image-rendering: pixelated;
    max-width: 100vw;
    max-height: 100vh;
}
</style>
<style>/* 游戏工坊广告系统 */
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);height:90px;max-height:90px;overflow:hidden;contain:layout style paint;pointer-events:none!important}.ad-banner-container,.ad-banner-container *{pointer-events:none!important}.ad-banner-container iframe{max-height:90px;pointer-events:none!important}
.ad-banner-container iframe{max-width:100%}
.ad-label{position:absolute;top:1px;right:6px;font:9px "Microsoft YaHei",sans-serif;color:rgba(255,255,255,.35)}
.sponsor-btn{position:fixed;top:44px;right:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:3px 9px;border-radius:10px;font:11px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}

.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.interstitial-ad .ad-content{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;text-align:center;min-width:280px;max-width:400px}
.interstitial-ad .ad-content p{color:#aaa;font:14px "Microsoft YaHei",sans-serif;margin-bottom:12px}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}

<body>
<canvas id="gameCanvas"></canvas>
<div id="startScreen" style="position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,10,26,0.95);z-index:20;color:#fff">
    <h1 style="font-size:42px;margin-bottom:10px;color:#4af;text-shadow:0 0 20px #4af">羽毛球</h1>
    <p style="font-size:16px;color:#aaa;margin-bottom:5px">羽毛球对战 - 击球角度控制</p>
    <p style="font-size:14px;color:#888;margin-bottom:25px">鼠标/触屏点击击球 | 空格暂停</p>
    <button id="btnStart" style="padding:15px 50px;font-size:22px;background:linear-gradient(135deg,#4af,#28d);color:#fff;border:none;border-radius:30px;cursor:pointer;transition:transform 0.2s">开始游戏</button>
    <p style="margin-top:15px;color:#666;font-size:13px">最高分: <span id="previewHS">0</span></p>
</div>
<div id="pauseBtn" style="position:absolute;top:8px;right:8px;z-index:20;width:44px;height:44px;background:rgba(0,0,0,0.6);border:2px solid rgba(255,255,255,0.4);border-radius:8px;color:#fff;font-size:20px;cursor:pointer;display:none;line-height:40px;text-align:center">||</div>
<div id="pauseScreen" style="position:absolute;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.85);z-index:15;color:#fff">
    <h2 style="font-size:38px;margin-bottom:20px;color:#4af">暂停</h2>
    <button id="btnResume" style="padding:15px 50px;font-size:22px;background:linear-gradient(135deg,#4af,#28d);color:#fff;border:none;border-radius:30px;cursor:pointer;margin:8px">继续游戏</button>
    <button style="padding:12px 40px;font-size:18px;background:linear-gradient(135deg,#666,#444);color:#fff;border:none;border-radius:30px;cursor:pointer;margin:8px" onclick="location.reload()">返回菜单</button>
</div>
<div id="gameOverScreen" style="position:absolute;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,10,26,0.95);z-index:20;color:#fff">
    <h2 style="font-size:38px;margin-bottom:20px;color:#f55">游戏结束</h2>
    <p style="font-size:24px;margin-bottom:10px">得分: <span id="finalScore">0</span></p>
    <p style="font-size:18px;color:#aaa;margin-bottom:20px">最高分: <span id="finalHighScore">0</span></p>
    <button id="btnRestart" style="padding:15px 50px;font-size:22px;background:linear-gradient(135deg,#4af,#28d);color:#fff;border:none;border-radius:30px;cursor:pointer;margin:8px">再来一局</button>
</div>
<div class="ad-banner-container" id="adBanner">
    <div class="ad-label">广告</div>
    <div style="color:#aaa;font:14px 'Microsoft YaHei',sans-serif;text-align:center;padding:10px">
        <div style="font-size:16px;color:#4af;margin-bottom:5px">羽毛球对战</div>
        <div style="font-size:12px;color:#666">享受羽毛球的乐趣</div>
    </div>
</div>
<button class="sponsor-btn" id="sponsorBtn">赞助</button>
<div class="sponsor-panel" id="sponsorPanel">
    <h2>感谢支持</h2>
    <div class="qr-row">
        <div class="qr-card">
            <div class="qr-icon">☕</div>
            <div class="qr-label">请喝咖啡</div>
            <div class="qr-hint">扫码支持</div>
        </div>
    </div>
    <button class="sponsor-close" id="sponsorClose">关闭</button>
</div>
<div class="interstitial-ad" id="interstitialAd">
    <div class="ad-content">
        <p style="font-size:18px;color:#4af;margin-bottom:10px">羽毛球对战</p>
        <p>享受击球的乐趣</p>
        <button class="skip-btn" id="skipAd">跳过广告</button>
    </div>
</div>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// 画布尺寸
const BASE_WIDTH = 400;
const BASE_HEIGHT = 700;
canvas.width = BASE_WIDTH;
canvas.height = BASE_HEIGHT;

// 响应式缩放
function resizeCanvas() {
    const ratio = Math.min(window.innerWidth / BASE_WIDTH, window.innerHeight / BASE_HEIGHT);
    canvas.style.width = (BASE_WIDTH * ratio) + 'px';
    canvas.style.height = (BASE_HEIGHT * ratio) + 'px';
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// 游戏状态
const STATE = {
    MENU: 0,
    PLAYING: 1,
    PAUSED: 2,
    GAME_OVER: 3
};

// 游戏变量
let gameState = STATE.MENU;
let score = 0;
let highScore = parseInt(localStorage.getItem('badminton_highScore')) || 0;
let totalGames = parseInt(localStorage.getItem('badminton_totalGames')) || 0;

// 球员
const PLAYER = {
    x: BASE_WIDTH / 2,
    y: BASE_HEIGHT - 100,
    width: 40,
    height: 60,
    speed: 6,
    targetX: BASE_WIDTH / 2,
    swingPower: 1.0,
    swingAngle: 0,
    isSwinging: false,
    swingTimer: 0
};

// AI对手
const AI = {
    x: BASE_WIDTH / 2,
    y: 100,
    width: 40,
    height: 60,
    speed: 4,
    targetX: BASE_WIDTH / 2,
    swingPower: 0.8,
    swingAngle: 0,
    isSwinging: false,
    swingTimer: 0,
    difficulty: 1
};

// 羽毛球
let shuttle = {
    x: BASE_WIDTH / 2,
    y: BASE_HEIGHT / 2,
    radius: 6,
    vx: 0,
    vy: 0,
    speed: 0,
    maxSpeed: 15,
    bounceCount: 0,
    inPlay: false,
    lastHitBy: null,
    trail: []
};

// 球场
const COURT = {
    top: 50,
    bottom: BASE_HEIGHT - 50,
    left: 20,
    right: BASE_WIDTH - 20,
    netY: BASE_HEIGHT / 2,
    netHeight: 2
};

// 粒子系统
let particles = [];

// 输入状态
let keys = {};
let mouseX = BASE_WIDTH / 2;
let mouseY = BASE_HEIGHT / 2;
let isDragging = false;
let dragStartX = 0;
let dragStartY = 0;
let touchActive = false;

// 音频上下文
let audioCtx = null;

// 初始化音频
function initAudio() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

// 播放音效
function playSound(frequency, duration, type = 'sine', volume = 0.3) {
    if (!audioCtx) return;
    try {
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.frequency.value = frequency;
        oscillator.type = type;
        gainNode.gain.setValueAtTime(volume, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        oscillator.start(audioCtx.currentTime);
        oscillator.stop(audioCtx.currentTime + duration);
    } catch (e) {}
}

// 击球音效
function playHitSound() {
    playSound(800 + Math.random() * 400, 0.15, 'sine', 0.3);
}

// 得分音效
function playScoreSound() {
    playSound(1000, 0.2, 'sine', 0.25);
}

// 落地音效
function playLandSound() {
    playSound(200, 0.3, 'sine', 0.2);
}

// 扣杀音效
function playSmashSound() {
    playSound(1200, 0.1, 'sawtooth', 0.4);
}

// 初始化游戏
function initGame() {
    score = 0;
    PLAYER.x = BASE_WIDTH / 2;
    PLAYER.y = BASE_HEIGHT - 100;
    PLAYER.targetX = BASE_WIDTH / 2;
    PLAYER.isSwinging = false;
    PLAYER.swingTimer = 0;

    AI.x = BASE_WIDTH / 2;
    AI.y = 100;
    AI.targetX = BASE_WIDTH / 2;
    AI.isSwinging = false;
    AI.swingTimer = 0;
    AI.difficulty = 1;

    resetShuttle();
    particles = [];
}

// 重置羽毛球
function resetShuttle() {
    shuttle.x = BASE_WIDTH / 2;
    shuttle.y = BASE_HEIGHT / 2;
    shuttle.vx = 0;
    shuttle.vy = 0;
    shuttle.speed = 0;
    shuttle.bounceCount = 0;
    shuttle.inPlay = false;
    shuttle.lastHitBy = null;
    shuttle.trail = [];
}

// 发球
function serveShuttle(player) {
    shuttle.x = player.x;
    shuttle.y = player.y - 30;

    const angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.3;
    const power = 8 + Math.random() * 2;

    shuttle.vx = Math.cos(angle) * power;
    shuttle.vy = Math.sin(angle) * power;
    shuttle.speed = power;
    shuttle.inPlay = true;
    shuttle.lastHitBy = player === PLAYER ? 'player' : 'ai';

    playHitSound();
}

// 击球
function hitShuttle(player, targetX, targetY, isSmash = false) {
    if (!shuttle.inPlay) return;

    const dx = targetX - player.x;
    const dy = targetY - player.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist === 0) return;

    const angle = Math.atan2(dy, dx);
    let power = isSmash ? 15 : 10;

    // 扣杀技巧
    if (isSmash) {
        power *= 1.5;
        playSmashSound();
    } else {
        playHitSound();
    }

    // 击球角度控制
    const accuracy = 0.8 + Math.random() * 0.4;
    const finalAngle = angle + (Math.random() - 0.5) * 0.2;

    shuttle.vx = Math.cos(finalAngle) * power * accuracy;
    shuttle.vy = Math.sin(finalAngle) * power * accuracy;
    shuttle.speed = power;
    shuttle.lastHitBy = player === PLAYER ? 'player' : 'ai';

    // 粒子特效
    createHitParticles(player.x, player.y - 20, isSmash ? 15 : 8);
}

// AI行为
function updateAI() {
    if (!shuttle.inPlay) return;

    // 预测球的位置
    let predictX = shuttle.x + shuttle.vx * 10;
    let predictY = shuttle.y + shuttle.vy * 10;

    // 限制预测范围
    predictX = Math.max(COURT.left, Math.min(COURT.right, predictX));

    // AI移动到预测位置
    AI.targetX = predictX;

    // AI击球逻辑
    const distToShuttle = Math.sqrt(
        Math.pow(AI.x - shuttle.x, 2) +
        Math.pow(AI.y - shuttle.y, 2)
    );

    if (distToShuttle < 60 && shuttle.vy < 0) {
        // 随机决定是否扣杀
        const isSmash = Math.random() < 0.3 * AI.difficulty;

        // 目标位置（玩家半场）
        const targetX = PLAYER.x + (Math.random() - 0.5) * 100;
        const targetY = PLAYER.y;

        hitShuttle(AI, targetX, targetY, isSmash);

        // 增加难度
        AI.difficulty = Math.min(2, AI.difficulty + 0.01);
    }
}

// 碰撞检测
function checkCollisions() {
    if (!shuttle.inPlay) return;

    // 球员击球
    const playerDist = Math.sqrt(
        Math.pow(PLAYER.x - shuttle.x, 2) +
        Math.pow(PLAYER.y - shuttle.y, 2)
    );

    if (playerDist < 50 && PLAYER.isSwinging && shuttle.y > COURT.netY) {
        hitShuttle(PLAYER, mouseX, mouseY, false);
    }

    // 边界碰撞
    if (shuttle.x < COURT.left || shuttle.x > COURT.right) {
        shuttle.vx *= -0.8;
        shuttle.x = shuttle.x < COURT.left ? COURT.left : COURT.right;
    }

    // 网碰撞
    if (Math.abs(shuttle.y - COURT.netY) < 10) {
        if (shuttle.speed > 5) {
            shuttle.vx *= -0.5;
            shuttle.vy *= -0.5;
            createHitParticles(shuttle.x, COURT.netY, 5);
        }
    }

    // 落地检测
    if (shuttle.y > COURT.bottom) {
        if (shuttle.lastHitBy === 'player') {
            // 环境落地，AI得分
            score = Math.max(0, score - 1);
            playLandSound();
        } else {
            // AI落地，玩家得分
            score += 10;
            playScoreSound();
        }
        resetShuttle();
        setTimeout(() => serveShuttle(PLAYER), 1000);
    }

    if (shuttle.y < COURT.top) {
        if (shuttle.lastHitBy === 'ai') {
            // AI出界，玩家得分
            score += 10;
            playScoreSound();
        } else {
            // 环境出界，AI得分
            score = Math.max(0, score - 1);
            playLandSound();
        }
        resetShuttle();
        setTimeout(() => serveShuttle(PLAYER), 1000);
    }
}

// 粒子效果
function createHitParticles(x, y, count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 4,
            vy: (Math.random() - 0.5) * 4,
            life: 1.0,
            decay: 0.02 + Math.random() * 0.02,
            size: 2 + Math.random() * 3,
            color: `hsl(${120 + Math.random() * 60}, 80%, ${50 + Math.random() * 30}%)`
        });
    }
}

// 更新粒子
function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;
        p.size *= 0.98;

        if (p.life <= 0 || p.size < 0.5) {
            particles.splice(i, 1);
        }
    }
}

// 绘制粒子
function drawParticles() {
    for (const p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

// 绘制球场
function drawCourt() {
    // 背景渐变
    const gradient = ctx.createLinearGradient(0, 0, 0, BASE_HEIGHT);
    gradient.addColorStop(0, '#1a3a2a');
    gradient.addColorStop(0.5, '#2d5a3d');
    gradient.addColorStop(1, '#1a3a2a');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, BASE_WIDTH, BASE_HEIGHT);

    // 球场线
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.strokeRect(COURT.left, COURT.top, COURT.right - COURT.left, COURT.bottom - COURT.top);

    // 中线
    ctx.beginPath();
    ctx.moveTo(COURT.left, COURT.netY);
    ctx.lineTo(COURT.right, COURT.netY);
    ctx.stroke();

    // 网
    ctx.strokeStyle = '#888';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(COURT.left, COURT.netY);
    ctx.lineTo(COURT.right, COURT.netY);
    ctx.stroke();

    // 发球线
    ctx.strokeStyle = '#666';
    ctx.lineWidth = 1;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.moveTo(COURT.left, COURT.netY + 80);
    ctx.lineTo(COURT.right, COURT.netY + 80);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(COURT.left, COURT.netY - 80);
    ctx.lineTo(COURT.right, COURT.netY - 80);
    ctx.stroke();
    ctx.setLineDash([]);
}

// 绘制球员
function drawPlayer(player, color) {
    ctx.fillStyle = color;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;

    // 身体
    ctx.beginPath();
    ctx.ellipse(player.x, player.y, player.width / 2, player.height / 2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // 头部
    ctx.beginPath();
    ctx.arc(player.x, player.y - player.height / 2 - 10, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // 球拍
    if (player.isSwinging) {
        ctx.strokeStyle = '#ffd700';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(player.x, player.y - 20);
        ctx.lineTo(player.x + Math.cos(player.swingAngle) * 30, player.y - 20 + Math.sin(player.swingAngle) * 30);
        ctx.stroke();

        // 拍面
        ctx.fillStyle = '#ffd700';
        ctx.beginPath();
        ctx.arc(
            player.x + Math.cos(player.swingAngle) * 30,
            player.y - 20 + Math.sin(player.swingAngle) * 30,
            8, 0, Math.PI * 2
        );
        ctx.fill();
    }
}

// 绘制羽毛球
function drawShuttle() {
    if (!shuttle.inPlay) return;

    // 尾迹
    for (let i = 0; i < shuttle.trail.length; i++) {
        const t = shuttle.trail[i];
        ctx.globalAlpha = i / shuttle.trail.length * 0.5;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(t.x, t.y, shuttle.radius * (i / shuttle.trail.length), 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 球体
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(shuttle.x, shuttle.y, shuttle.radius, 0, Math.PI * 2);
    ctx.fill();

    // 羽毛
    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
        const angle = Math.atan2(shuttle.vy, shuttle.vx) + Math.PI + (i - 1) * 0.3;
        ctx.beginPath();
        ctx.moveTo(shuttle.x, shuttle.y);
        ctx.lineTo(
            shuttle.x + Math.cos(angle) * 12,
            shuttle.y + Math.sin(angle) * 12
        );
        ctx.stroke();
    }
}

// 绘制UI
function drawUI() {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 24px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(`得分: ${score}`, BASE_WIDTH / 2, 30);

    ctx.font = '16px Arial';
    ctx.fillText(`最高分: ${highScore}`, BASE_WIDTH / 2, 55);

    // 操作提示
    ctx.font = '12px Arial';
    ctx.fillStyle = '#aaa';
    ctx.fillText('点击击球 | 空格暂停', BASE_WIDTH / 2, BASE_HEIGHT - 20);
}

// 更新游戏状态
function update() {
    if (gameState !== STATE.PLAYING) return;

    // 更新玩家位置
    PLAYER.x += (PLAYER.targetX - PLAYER.x) * 0.1;
    PLAYER.x = Math.max(COURT.left + 20, Math.min(COURT.right - 20, PLAYER.x));

    // 更新AI位置
    updateAI();
    AI.x += (AI.targetX - AI.x) * 0.1;
    AI.x = Math.max(COURT.left + 20, Math.min(COURT.right - 20, AI.x));

    // 更新羽毛球
    if (shuttle.inPlay) {
        shuttle.x += shuttle.vx;
        shuttle.y += shuttle.vy;
        shuttle.vx *= 0.99;
        shuttle.vy *= 0.99;
        shuttle.speed = Math.sqrt(shuttle.vx * shuttle.vx + shuttle.vy * shuttle.vy);

        // 更新尾迹
        shuttle.trail.push({x: shuttle.x, y: shuttle.y});
        if (shuttle.trail.length > 10) {
            shuttle.trail.shift();
        }
    }

    // 更新挥拍动画
    if (PLAYER.isSwinging) {
        PLAYER.swingTimer--;
        if (PLAYER.swingTimer <= 0) {
            PLAYER.isSwinging = false;
        }
    }

    if (AI.isSwinging) {
        AI.swingTimer--;
        if (AI.swingTimer <= 0) {
            AI.isSwinging = false;
        }
    }

    // 检查碰撞
    checkCollisions();

    // 更新粒子
    updateParticles();

    // 更新最高分
    if (score > highScore) {
        highScore = score;
        localStorage.setItem('badminton_highScore', highScore);
    }

    // 游戏结束条件（5分制）
    if (score >= 50) {
        gameState = STATE.GAME_OVER;
        showGameOver();
    }
}

// 绘制游戏
function draw() {
    ctx.clearRect(0, 0, BASE_WIDTH, BASE_HEIGHT);

    // 绘制球场
    drawCourt();

    // 绘制球员
    drawPlayer(AI, '#ff6b6b');
    drawPlayer(PLAYER, '#4af');

    // 绘制羽毛球
    drawShuttle();

    // 绘制粒子
    drawParticles();

    // 绘制UI
    drawUI();
}

// 游戏循环
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

// 显示游戏结束
function showGameOver() {
    document.getElementById('gameOverScreen').style.display = 'flex';
    document.getElementById('finalScore').textContent = score;
    document.getElementById('finalHighScore').textContent = highScore;

    // 显示插屏广告
    setTimeout(() => {
        document.getElementById('interstitialAd').style.display = 'flex';
    }, 1000);
}

// 开始游戏
function startGame() {
    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('pauseBtn').style.display = 'block';
    gameState = STATE.PLAYING;
    initGame();
    serveShuttle(PLAYER);
}

// 暂停游戏
function pauseGame() {
    if (gameState === STATE.PLAYING) {
        gameState = STATE.PAUSED;
        document.getElementById('pauseScreen').style.display = 'flex';
    }
}

// 继续游戏
function resumeGame() {
    gameState = STATE.PLAYING;
    document.getElementById('pauseScreen').style.display = 'none';
}

// 事件监听
document.getElementById('btnStart').addEventListener('click', startGame);
document.getElementById('btnResume').addEventListener('click', resumeGame);
document.getElementById('btnRestart').addEventListener('click', () => {
    document.getElementById('gameOverScreen').style.display = 'none';
    startGame();
});

// 键盘事件
document.addEventListener('keydown', (e) => {
    keys[e.code] = true;

    if (e.code === 'Space') {
        e.preventDefault();
        if (gameState === STATE.PLAYING) {
            pauseGame();
        } else if (gameState === STATE.PAUSED) {
            resumeGame();
        }
    }

    if (e.code === 'KeyA' || e.code === 'ArrowLeft') {
        PLAYER.targetX -= 30;
    }
    if (e.code === 'KeyD' || e.code === 'ArrowRight') {
        PLAYER.targetX += 30;
    }
});

document.addEventListener('keyup', (e) => {
    keys[e.code] = false;
});

// 鼠标/触屏事件
canvas.addEventListener('mousedown', (e) => {
    if (gameState !== STATE.PLAYING) return;

    const rect = canvas.getBoundingClientRect();
    const scaleX = BASE_WIDTH / rect.width;
    const scaleY = BASE_HEIGHT / rect.height;

    mouseX = (e.clientX - rect.left) * scaleX;
    mouseY = (e.clientY - rect.top) * scaleY;

    isDragging = true;
    dragStartX = mouseX;
    dragStartY = mouseY;

    // 挥拍
    PLAYER.isSwinging = true;
    PLAYER.swingTimer = 15;
    PLAYER.swingAngle = Math.atan2(mouseY - PLAYER.y, mouseX - PLAYER.x);
});

canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = BASE_WIDTH / rect.width;
    const scaleY = BASE_HEIGHT / rect.height;

    mouseX = (e.clientX - rect.left) * scaleX;
    mouseY = (e.clientY - rect.top) * scaleY;

    // 玩家跟随鼠标
    PLAYER.targetX = mouseX;
});

canvas.addEventListener('mouseup', () => {
    isDragging = false;
});

// 触屏事件
canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (gameState !== STATE.PLAYING) return;

    const rect = canvas.getBoundingClientRect();
    const scaleX = BASE_WIDTH / rect.width;
    const scaleY = BASE_HEIGHT / rect.height;

    mouseX = (e.touches[0].clientX - rect.left) * scaleX;
    mouseY = (e.touches[0].clientY - rect.top) * scaleY;

    PLAYER.targetX = mouseX;

    // 挥拍
    PLAYER.isSwinging = true;
    PLAYER.swingTimer = 15;
    PLAYER.swingAngle = Math.atan2(mouseY - PLAYER.y, mouseX - PLAYER.x);

    touchActive = true;
});

canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (gameState !== STATE.PLAYING) return;

    const rect = canvas.getBoundingClientRect();
    const scaleX = BASE_WIDTH / rect.width;
    const scaleY = BASE_HEIGHT / rect.height;

    mouseX = (e.touches[0].clientX - rect.left) * scaleX;
    mouseY = (e.touches[0].clientY - rect.top) * scaleY;

    PLAYER.targetX = mouseX;
});

canvas.addEventListener('touchend', () => {
    touchActive = false;
});

// 赞助按钮
document.getElementById('sponsorBtn').addEventListener('click', () => {
    document.getElementById('sponsorPanel').style.display = 'flex';
    document.getElementById('sponsorPanel').style.pointerEvents = 'auto';
});

document.getElementById('sponsorClose').addEventListener('click', () => {
    document.getElementById('sponsorPanel').style.display = 'none';
    document.getElementById('sponsorPanel').style.pointerEvents = 'none';
});

// 跳过广告
document.getElementById('skipAd').addEventListener('click', () => {
    document.getElementById('interstitialAd').style.display = 'none';
});

// 初始化
document.getElementById('previewHS').textContent = highScore;
gameLoop();
</script>
</body>
