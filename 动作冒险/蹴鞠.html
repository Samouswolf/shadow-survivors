<script>
function showSponsor(){document.getElementById("sponsorModal").classList.add("show");}
function hideSponsor(){document.getElementById("sponsorModal").classList.remove("show");}
function showInterstitial(){var m=document.getElementById("interstitial");m.classList.add("show");var b=m.querySelector(".skip-btn");var t=3;b.textContent="\u8DF3\u8FC7 ("+t+"s)";var iv=setInterval(function(){t--;if(t<=0){clearInterval(iv);hideInterstitial();}else{b.textContent="\u8DF3\u8FC7 ("+t+"s)";}},1000);}
function hideInterstitial(){document.getElementById("interstitial").classList.remove("show");}
var canvas=document.getElementById("C");
var ctx=canvas.getContext("2d");
var W,H,SCALE=1,ADH=50;
function resize(){var maxW=window.innerWidth,maxH=window.innerHeight-ADH,baseW=800,baseH=600,r=Math.min(maxW/baseW,maxH/baseH);SCALE=r;W=Math.floor(baseW*r);H=Math.floor(baseH*r);canvas.width=W;canvas.height=H;}
resize();window.addEventListener("resize",resize);
var BALL_R=14,GOAL_W=130,GOAL_H=100,GK_R=20,DEF_R=18,KICK_POWER=14,FRICTION=0.986,GRAVITY=0.18,GROUND_Y=0.82,MAX_LEVEL=18,AIM_SPEED=0.025,POWER_SPEED=0.018;
var LEVELS=[
{name:"初学蹴鞠",desc:"掌握射门基础",gx:0.82,gy:0.55,bx:0.28,by:0.78,wx:0,wy:0,def:0,gk:0,tl:35,tgt:1,bonus:60},
{name:"校场练兵",desc:"面对守门员",gx:0.82,gy:0.52,bx:0.28,by:0.78,wx:0,wy:0,def:0,gk:1,tl:35,tgt:2,bonus:80},
{name:"春风送暖",desc:"微风拂面",gx:0.82,gy:0.5,bx:0.3,by:0.78,wx:0.25,wy:0,def:0,gk:1,tl:30,tgt:2,bonus:100},
{name:"御林军阵",desc:"突破防线",gx:0.82,gy:0.5,bx:0.25,by:0.78,wx:0,wy:0,def:1,gk:1,tl:32,tgt:3,bonus:120},
{name:"烈日炎炎",desc:"逆风射门",gx:0.82,gy:0.48,bx:0.3,by:0.78,wx:-0.35,wy:0,def:1,gk:1,tl:28,tgt:3,bonus:140},
{name:"雨中蹴鞠",desc:"场地湿滑",gx:0.82,gy:0.5,bx:0.3,by:0.78,wx:0.2,wy:-0.1,def:1,gk:1,tl:28,tgt:3,bonus:160,slip:true},
{name:"宫廷室射",desc:"精准制导",gx:0.8,gy:0.42,bx:0.3,by:0.78,wx:0,wy:0,def:2,gk:1,tl:30,tgt:3,bonus:180,small:true},
{name:"边塞劲风",desc:"强风来袭",gx:0.82,gy:0.5,bx:0.3,by:0.78,wx:0.5,wy:0.15,def:1,gk:1,tl:28,tgt:3,bonus:200},
{name:"双门将阵",desc:"两重考验",gx:0.82,gy:0.5,bx:0.25,by:0.78,wx:0,wy:0,def:1,gk:2,tl:32,tgt:4,bonus:220},
{name:"暗夜蹴鞠",desc:"视野受限",gx:0.82,gy:0.5,bx:0.3,by:0.78,wx:0.1,wy:0,def:2,gk:1,tl:30,tgt:4,bonus:250,dark:true},
{name:"万人观赛",desc:"压力如山",gx:0.82,gy:0.45,bx:0.25,by:0.78,wx:0.3,wy:-0.1,def:2,gk:2,tl:30,tgt:4,bonus:280},
{name:"风卷残云",desc:"狂风大作",gx:0.82,gy:0.48,bx:0.2,by:0.78,wx:-0.5,wy:0.2,def:2,gk:1,tl:26,tgt:4,bonus:300,slip:true},
{name:"金靴之争",desc:"精准打击",gx:0.78,gy:0.38,bx:0.3,by:0.78,wx:0.35,wy:0,def:2,gk:2,tl:30,tgt:5,bonus:340,small:true},
{name:"铁壁铜墙",desc:"固若金汤",gx:0.82,gy:0.45,bx:0.2,by:0.78,wx:0.2,wy:-0.1,def:3,gk:2,tl:30,tgt:5,bonus:380},
{name:"龙争虎斗",desc:"终极对决",gx:0.82,gy:0.4,bx:0.2,by:0.78,wx:0.4,wy:-0.2,def:3,gk:2,tl:26,tgt:5,bonus:420,dark:true},
{name:"天下无双",desc:"传说挑战",gx:0.82,gy:0.38,bx:0.18,by:0.78,wx:-0.5,wy:0.25,def:3,gk:2,tl:24,tgt:5,bonus:460,slip:true,small:true},
{name:"蹴鞠之巅",desc:"登峰造极",gx:0.8,gy:0.35,bx:0.15,by:0.78,wx:-0.6,wy:0.3,def:3,gk:2,tl:22,tgt:6,bonus:500,slip:true,small:true,dark:true},
{name:"无尽传说",desc:"永无止境",gx:0.82,gy:0.4,bx:0.15,by:0.78,wx:0.5,wy:-0.25,def:3,gk:2,tl:20,tgt:6,bonus:600,slip:true,small:true,dark:true}
];
var S_MENU=0,S_SELECT=1,S_AIM=2,S_FLY=3,S_GOAL=4,S_MISS=5,S_CLEAR=6,S_OVER=7;
var G={st:S_MENU,score:0,combo:0,maxCombo:0,lv:0,tgt:0,time:0,kickN:0,ball:{x:0,y:0,vx:0,vy:0},player:{x:0,y:0},goal:{x:0,y:0,w:GOAL_W,h:GOAL_H},def:[],gk:[],wind:{x:0,y:0},aimA:-0.7,aimP:0.5,aimD:1,particles:[],trail:[],popups:[],shake:0,slip:false,dark:false,small:false,best:0,lvScores:[],bestC:0};
function loadBest(){try{var s=localStorage.getItem("cuju_best");if(s){var d=JSON.parse(s);G.best=d.score||0;G.lvScores=d.levels||[];G.bestC=d.combo||0;}}catch(e){}}
function saveBest(){try{localStorage.setItem("cuju_best",JSON.stringify({score:G.best,levels:G.lvScores,combo:G.bestC}));}catch(e){}}
loadBest();
function initLv(idx){var L=LEVELS[idx];G.lv=idx;G.tgt=L.tgt;G.time=L.tl;G.combo=0;G.kickN=0;var gy=GROUND_Y*600;G.player.x=L.bx*800-45;G.player.y=gy-GK_R;G.ball.x=L.bx*800;G.ball.y=gy-BALL_R;G.ball.vx=0;G.ball.vy=0;G.goal.x=L.gx*800;G.goal.y=L.gy*600;G.goal.w=L.small?GOAL_W*0.65:GOAL_W;G.goal.h=L.small?GOAL_H*0.65:GOAL_H;G.wind.x=L.wx||0;G.wind.y=L.wy||0;G.slip=!!L.slip;G.dark=!!L.dark;G.small=!!L.small;G.def=[];for(var i=0;i<(L.def||0);i++){var dx=G.goal.x-90-Math.random()*120;G.def.push({x:dx,y:gy-DEF_R,bx:dx,range:50+Math.random()*40,spd:0.6+Math.random()*0.4,dir:Math.random()>0.5?1:-1});}G.gk=[];for(var i=0;i<(L.gk||0);i++){var gy0=G.goal.y+15;G.gk.push({x:G.goal.x-20,y:gy0+G.goal.h/2-GK_R,by:gy0,range:G.goal.h-30,spd:1.8+idx*0.08,dir:i%2==0?1:-1});}G.particles=[];G.trail=[];G.popups=[];G.st=S_AIM;G.aimA=-0.7;G.aimP=0.5;G.aimD=1;G.shake=0;}
function resetBall(){var L=LEVELS[G.lv];var gy=GROUND_Y*600;G.ball.x=L.bx*800;G.ball.y=gy-BALL_R;G.ball.vx=0;G.ball.vy=0;G.player.x=L.bx*800-45;G.player.y=gy-GK_R;G.trail=[];G.st=S_AIM;G.aimA=-0.7;G.aimP=0.5;G.aimD=1;}
function updateBall(){var b=G.ball;b.vx+=G.wind.x*0.025;b.vy+=G.wind.y*0.025;b.vy+=GRAVITY;b.vx*=FRICTION;b.vy*=FRICTION;if(!G.slip)b.vx*=0.994;b.x+=b.vx;b.y+=b.vy;var gy=GROUND_Y*600;if(b.y+BALL_R>gy){b.y=gy-BALL_R;b.vy*=-0.45;b.vx*=0.75;if(Math.abs(b.vy)<1.2)b.vy=0;}if(b.x-BALL_R<0){b.x=BALL_R;b.vx*=-0.5;}if(b.x+BALL_R>800){b.x=800-BALL_R;b.vx*=-0.5;}if(b.y-BALL_R<0){b.y=BALL_R;b.vy*=-0.4;}if(G.trail.length>35)G.trail.shift();G.trail.push({x:b.x,y:b.y,a:1});}
function updateDefenders(){for(var i=0;i<G.def.length;i++){var d=G.def[i];d.x+=d.spd*d.dir;if(d.x>d.bx+d.range||d.x<d.bx-d.range)d.dir*=-1;}}
function updateGK(){for(var i=0;i<G.gk.length;i++){var k=G.gk[i];k.y+=k.spd*k.dir;if(k.y>k.by+k.range||k.y<k.by)k.dir*=-1;var bdx=G.ball.x-k.x;if(bdx>0&&bdx<300){if(k.y<G.ball.y-5)k.dir=1;else if(k.y>G.ball.y+5)k.dir=-1;}}}
function checkCollisions(){var b=G.ball;for(var i=0;i<G.def.length;i++){var d=G.def[i];var dx=b.x-d.x,dy=b.y-d.y,dist=Math.sqrt(dx*dx+dy*dy);if(dist<BALL_R+DEF_R){var nx=dx/dist,ny=dy/dist,dot=b.vx*nx+b.vy*ny;b.vx-=2*dot*nx*0.65;b.vy-=2*dot*ny*0.65;var ov=BALL_R+DEF_R-dist;b.x+=nx*ov;b.y+=ny*ov;spawnP(d.x,d.y,"#8B6914",6);}}for(var i=0;i<G.gk.length;i++){var k=G.gk[i];var dx=b.x-k.x,dy=b.y-k.y,dist=Math.sqrt(dx*dx+dy*dy);if(dist<BALL_R+GK_R){var nx=dx/dist,ny=dy/dist,dot=b.vx*nx+b.vy*ny;b.vx-=2*dot*nx*0.75;b.vy-=2*dot*ny*0.75;var ov=BALL_R+GK_R-dist;b.x+=nx*ov;b.y+=ny*ov;spawnP(k.x,k.y,"#cc2222",8);G.shake=6;}}}
function checkGoal(){var b=G.ball,gx=G.goal.x-G.goal.w*0.5,gy=G.goal.y;return b.x>gx&&b.x<gx+G.goal.w&&b.y>gy&&b.y<gy+G.goal.h&&b.vx>0.5;}
function ballStopped(){return Math.abs(G.ball.vx)<0.4&&Math.abs(G.ball.vy)<0.5&&G.ball.y>=GROUND_Y*600-BALL_R-1;}
function ballOut(){return G.ball.x>830||G.ball.x<-30||G.ball.y>640;}
function spawnP(x,y,c,n){for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,s=1+Math.random()*3;G.particles.push({x:x*SCALE,y:y*SCALE,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,dec:0.02+Math.random()*0.03,color:c,r:2+Math.random()*3});}}
function spawnGoalP(){var gx=G.goal.x*SCALE,gy=(G.goal.y+G.goal.h*0.5)*SCALE,colors=["#ffd700","#ff8c00","#ff4444","#ffffff","#88ff88"];for(var i=0;i<50;i++){var a=Math.random()*Math.PI*2,s=2+Math.random()*6;G.particles.push({x:gx,y:gy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,life:1,dec:0.012+Math.random()*0.02,color:colors[~~(Math.random()*5)],r:3+Math.random()*5});}}
function updateParticles(){for(var i=G.particles.length-1;i>=0;i--){var p=G.particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.06;p.life-=p.dec;if(p.life<=0)G.particles.splice(i,1);}}
function addPopup(x,y,txt,c){G.popups.push({x:x*SCALE,y:y*SCALE,txt:txt,color:c||"#ffd700",life:1,vy:-2.5});}
function updatePopups(){for(var i=G.popups.length-1;i>=0;i--){var p=G.popups[i];p.y+=p.vy;p.life-=0.018;if(p.life<=0)G.popups.splice(i,1);}}
var keys={};
function getPos(cx,cy){var r=canvas.getBoundingClientRect();return{x:(cx-r.left)/SCALE,y:(cy-r.top)/SCALE};}
canvas.addEventListener("mousedown",function(e){var p=getPos(e.clientX,e.clientY);handleTap(p.x,p.y);});
canvas.addEventListener("touchstart",function(e){e.preventDefault();var p=getPos(e.touches[0].clientX,e.touches[0].clientY);handleTap(p.x,p.y);},{passive:false});
canvas.addEventListener("touchmove",function(e){e.preventDefault();},{passive:false});
canvas.addEventListener("touchend",function(e){e.preventDefault();},{passive:false});
window.addEventListener("keydown",function(e){keys[e.key]=true;if(e.key===" "||e.key==="Enter"){e.preventDefault();if(G.st===S_MENU)G.st=S_SELECT;else if(G.st===S_AIM)kick();else if(G.st===S_MISS)resetBall();else if(G.st===S_CLEAR){if(G.lv<MAX_LEVEL-1)initLv(G.lv+1);else G.st=S_OVER;}else if(G.st===S_OVER)G.st=S_MENU;}});
window.addEventListener("keyup",function(e){keys[e.key]=false;});
function handleTap(x,y){if(G.st===S_MENU){if(hitBtn(x,y,400,340,200,50))G.st=S_SELECT;if(hitBtn(x,y,400,410,200,50))showSponsor();}else if(G.st===S_SELECT){for(var i=0;i<MAX_LEVEL;i++){var col=i%5,row=~~(i/5),bx=95+col*123,by=110+row*93;if(x>bx&&x<bx+115&&y>by&&y<by+85){if(i===0||(G.lvScores[i-1]&&G.lvScores[i-1]>0)){G.score=0;G.combo=0;G.maxCombo=0;initLv(i);}break;}}if(hitBtn(x,y,400,540,180,40))G.st=S_MENU;}else if(G.st===S_AIM)kick();else if(G.st===S_MISS)resetBall();else if(G.st===S_CLEAR){if(G.lv<MAX_LEVEL-1)initLv(G.lv+1);else G.st=S_OVER;}else if(G.st===S_OVER){if(hitBtn(x,y,400,380,200,50))G.st=S_MENU;}}
function hitBtn(x,y,cx,cy,w,h){return x>cx-w*0.5&&x<cx+w*0.5&&y>cy-h*0.5&&y<cy+h*0.5;}
