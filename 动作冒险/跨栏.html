</style>

<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>


    <div class="game-guide" style="margin-bottom:15px;padding:10px;background:#fff3f3;border-radius:8px;border:1px solid #ffcccc;">
        <div style="font-weight:bold;color:#f5576c;margin-bottom:5px;">🎮 操作说明</div>
        <div style="font-size:14px;color:#666;">点击/触摸进行游戏，支持键盘操作</div>
    </div>

<canvas id="cv"></canvas>
<div id="ad-banner" onclick="clickAd()"><span>🔥 推荐好物 · 点击了解更多</span><span class="ad-label">广告</span></div>
<div id="sponsor-btn" onclick="showSponsor()">💛</div>
<div id="sponsor-modal"><div class="modal-box"><h3>💛 支持我们</h3><p>如果觉得游戏好玩，<br>请作者喝杯咖啡吧！<br><br>你的支持是我们持续更新的动力</p><button class="btn-close" onclick="closeSponsor()">谢谢支持</button></div></div>
<div id="interstitial"><div class="ad-content"><h3>🎮 精选推荐</h3><p>更多好玩的游戏等你探索！</p><div class="countdown" id="ad-countdown">5</div><button class="btn-skip" id="btn-skip" onclick="closeInterstitial()">跳过</button></div></div>


  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script src="../game_core.js"></script>
<script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script>
// ==================== 广告系统 ====================
var adShown=false,interstitialShown=false,adTimer=null;
function showAdBanner(){
    if(adShown)return;
    adShown=true;
    document.getElementById('ad-banner').style.display='flex';
    document.getElementById('sponsor-btn').style.display='flex';
    cv.height=window.innerHeight-50;
    resizeCanvas();
}
function hideAdBanner(){
    adShown=false;
    document.getElementById('ad-banner').style.display='none';
    document.getElementById('sponsor-btn').style.display='none';
    cv.height=window.innerHeight;
    resizeCanvas();
}
function clickAd(){console.log('Ad clicked')}
function showSponsor(){document.getElementById('sponsor-modal').style.display='flex'}
function closeSponsor(){document.getElementById('sponsor-modal').style.display='none'}
function showInterstitial(force){
    if(interstitialShown&&!force)return;
    interstitialShown=true;
    var el=document.getElementById('interstitial');
    var cd=document.getElementById('ad-countdown');
    var btn=document.getElementById('btn-skip');
    el.style.display='flex';
    btn.classList.remove('active');
    var t=5;
    cd.textContent=t;
    btn.disabled=true;
    if(adTimer)clearInterval(adTimer);
    adTimer=setInterval(function(){
        t--;
        cd.textContent=t;
        if(t<=0){
            clearInterval(adTimer);
            adTimer=null;
            btn.classList.add('active');
            btn.disabled=false;
        }
    },1000);
}
function closeInterstitial(){
    var btn=document.getElementById('btn-skip');
    if(!btn.classList.contains('active'))return;
    document.getElementById('interstitial').style.display='none';
    resumeFromInterstitial();
}

// ==================== Canvas & 全局 ====================
var cv=document.getElementById('cv');
var ctx=cv.getContext('2d');
var W,H,SCALE=1;

function resizeCanvas(){
    W=window.innerWidth;
    H=window.innerHeight-(adShown?50:0);
    cv.width=W;
    cv.height=H;
    SCALE=Math.min(W/800,H/600);
}
resizeCanvas();
window.addEventListener('resize',resizeCanvas);

// ==================== 常量 ====================
var GROUND_RATIO=0.75;
var PLAYER_W=40,PLAYER_H=60;
var HURDLE_W=16,HURDLE_H=55;
var GRAVITY=0.65;
var JUMP_FORCE=-13.5;
var DOUBLE_JUMP_FORCE=-11;
var RUN_SPEED_BASE=5;
var HURDLE_SPACING_MIN=250,HURDLE_SPACING_MAX=400;
var TRACK_LENGTH=5000;
var OBSTACLE_TYPES=['hurdle','double','water','pit'];

// ==================== 游戏数据 ====================
var LEVELS=[
    {name:'新手训练',distance:3000,hurdles:6,spdMul:0.7,gap:350,desc:'熟悉操作'},
    {name:'校园运动会',distance:3500,hurdles:8,spdMul:0.8,gap:320,desc:'标准赛道'},
    {name:'城市锦标赛',distance:4000,hurdles:10,spdMul:0.9,gap:300,desc:'速度提升'},
    {name:'全国大赛',distance:4500,hurdles:12,spdMul:1.0,gap:280,desc:'正式比赛'},
    {name:'国际邀请赛',distance:5000,hurdles:14,spdMul:1.05,gap:260,desc:'高手对决'},
    {name:'世界田径赛',distance:5500,hurdles:16,spdMul:1.1,gap:250,desc:'顶尖竞技'},
    {name:'奥运决赛',distance:6000,hurdles:18,spdMul:1.15,gap:240,desc:'终极挑战'},
    {name:'传奇之路',distance:7000,hurdles:22,spdMul:1.2,gap:220,desc:'无尽传说'},
    {name:'神话冲刺',distance:8000,hurdles:26,spdMul:1.3,gap:200,desc:'超越极限'},
    {name:'创世之巅',distance:10000,hurdles:32,spdMul:1.4,gap:180,desc:'神话巅峰'}
];

// ==================== 游戏状态 ====================
var G={
    state:'menu', // menu,ready,play,finish,over,interstitial
    level:0,
    score:0,
    time:0,
    bestScores:[],
    bestTimes:[],
    combo:0,
    maxCombo:0,
    perfectJumps:0,
    totalHurdles:0,
    // player
    px:0,py:0,pvy:0,pGround:true,pJumping:false,pDoubleJump:false,pDucking:false,
    pHurt:0,pFrame:0,pRunCycle:0,
    // track
    cameraX:0,trackDistance:0,
    hurdles:[],
    particles:[],
    bgStars:[],
    shakeX:0,shakeY:0,shakeDur:0,
    // effects
    speedBoost:0,invincible:0,
    // UI
    flashMsg:'',flashTimer:0,flashColor:'#fff',
    // ready countdown
    readyTimer:0,
    // finish
    finishRank:'',finishMedal:''
};

// 加载最高分
function loadBest(){
    try{
        var s=localStorage.getItem('hurdle_best');
        if(s){var d=JSON.parse(s);G.bestScores=d.scores||[];G.bestTimes=d.times||[];}
    }catch(e){}
    while(G.bestScores.length<LEVELS.length)G.bestScores.push(99999);
    while(G.bestTimes.length<LEVELS.length)G.bestTimes.push(99999);
}
function saveBest(){
    try{
        localStorage.setItem('hurdle_best',JSON.stringify({scores:G.bestScores,times:G.bestTimes}));
    }catch(e){}
}
loadBest();

// ==================== 粒子系统 ====================
function spawnParticles(x,y,color,count,speed,life){
    for(var i=0;i<count;i++){
        var ang=Math.random()*Math.PI*2;
        var spd=Math.random()*speed+1;
        G.particles.push({x:x,y:y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd-life*0.3,life:life,maxLife:life,color:color,size:Math.random()*3+2});
    }
}
function spawnRunDust(x,y){
    G.particles.push({x:x+Math.random()*10-5,y:y,vx:-Math.random()*2-1,vy:-Math.random()*1.5,life:20,maxLife:20,color:'rgba(180,160,120,0.6)',size:Math.random()*4+2});
}
function spawnJumpEffect(x,y){
    for(var i=0;i<8;i++){
        G.particles.push({x:x+Math.random()*20-10,y:y,vx:Math.random()*4-2,vy:-Math.random()*3,life:25,maxLife:25,color:'rgba(255,255,255,0.7)',size:Math.random()*3+1});
    }
}
function spawnPerfectEffect(x,y){
    spawnParticles(x,y,'#FFD700',15,5,40);
    spawnParticles(x,y,'#FFA500',10,4,35);
}
function spawnHurdleBreak(x,y){
    spawnParticles(x,y,'#8B4513',8,4,30);
    spawnParticles(x,y,'#D2691E',6,3,25);
}
function spawnFinishFireworks(x,y){
    var colors=['#FF6B6B','#4ECDC4','#45B7D1','#FFA07A','#98D8C8','#FFD700'];
    for(var c=0;c<colors.length;c++){
        spawnParticles(x+Math.random()*200-100,y+Math.random()*100-50,colors[c],12,6,50);
    }
}

// ==================== 生成赛道 ====================
function generateTrack(levelIdx){
    var lv=LEVELS[levelIdx];
    G.hurdles=[];
    G.totalHurdles=lv.hurdles;
    var dist=200; // 起始距离
    for(var i=0;i<lv.hurdles;i++){
        var type='hurdle';
        var r=Math.random();
        if(levelIdx>=2&&r<0.15)type='double';
        else if(levelIdx>=4&&r<0.25)type='water';
        else if(levelIdx>=6&&r<0.1)type='pit';
        var hurdleH=HURDLE_H+Math.random()*15-5;
        if(type==='double')hurdleH*=1.3;
        G.hurdles.push({
            x:dist,
            type:type,
            w:type==='water'?60:type==='pit'?80:HURDLE_W,
            h:hurdleH,
            passed:false,
            hit:false,
            y:0
        });
        dist+=lv.gap+Math.random()*80-40;
    }
    G.trackDistance=dist+200;
}

// ==================== 初始化 ====================
function initGame(levelIdx){
    G.level=levelIdx;
    G.score=0;
    G.time=0;
    G.combo=0;
    G.maxCombo=0;
    G.perfectJumps=0;
    G.cameraX=0;
    G.particles=[];
    G.shakeX=0;G.shakeY=0;G.shakeDur=0;
    G.speedBoost=0;G.invincible=0;
    G.flashMsg='';G.flashTimer=0;
    G.pHurt=0;G.pFrame=0;G.pRunCycle=0;
    G.pDucking=false;
    generateTrack(levelIdx);

    var groundY=H*GROUND_RATIO;
    G.px=W*0.25;
    G.py=groundY-PLAYER_H;
    G.pvy=0;
    G.pGround=true;
    G.pJumping=false;
    G.pDoubleJump=false;
    G.state='ready';
    G.readyTimer=180; // 3秒倒计时

    showAdBanner();
}

// ==================== 输入 ====================
var keys={};
var tapDown=false,tapX=0,tapY=0;
var jumpPressed=false,jumpReleased=true;

document.addEventListener('keydown',function(e){
    keys[e.code]=true;
    if((e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')&&jumpReleased){
        jumpPressed=true;jumpReleased=false;
    }
    if(e.code==='ArrowDown'||e.code==='KeyS'){
        G.pDucking=true;
    }
    e.preventDefault();
});
document.addEventListener('keyup',function(e){
    keys[e.code]=false;
    if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){
        jumpReleased=true;
    }
    if(e.code==='ArrowDown'||e.code==='KeyS'){
        G.pDucking=false;
    }
});

cv.addEventListener('mousedown',function(e){
    var rect=cv.getBoundingClientRect();
    tapX=(e.clientX-rect.left)/rect.width*W;
    tapY=(e.clientY-rect.top)/rect.height*H;
    tapDown=true;
    handleTap(tapX,tapY);
});
cv.addEventListener('mouseup',function(){tapDown=false;});
cv.addEventListener('touchstart',function(e){
    e.preventDefault();
    var rect=cv.getBoundingClientRect();
    var t=e.touches[0];
    tapX=(t.clientX-rect.left)/rect.width*W;
    tapY=(t.clientY-rect.top)/rect.height*H;
    tapDown=true;
    handleTap(tapX,tapY);
},{passive:false});
cv.addEventListener('touchend',function(e){
    e.preventDefault();
    tapDown=false;
},{passive:false});

function handleTap(x,y){
    if(G.state==='menu'){
        handleMenuTap(x,y);
    }else if(G.state==='play'){
        // 上半屏跳跃，下半屏下蹲
        if(y<H*0.5){
            if(jumpReleased){jumpPressed=true;jumpReleased=false;}
        }else{
            G.pDucking=true;
            setTimeout(function(){G.pDucking=false;},300);
        }
    }else if(G.state==='finish'){
        handleFinishTap(x,y);
    }else if(G.state==='over'){
        handleOverTap(x,y);
    }
}

// ==================== 跳跃逻辑 ====================
function doJump(){
    if(G.pGround){
        G.pvy=JUMP_FORCE;
        G.pGround=false;
        G.pJumping=true;
        G.pDoubleJump=false;
        spawnJumpEffect(G.px+PLAYER_W/2,G.py+PLAYER_H);
    }else if(!G.pDoubleJump){
        G.pvy=DOUBLE_JUMP_FORCE;
        G.pDoubleJump=true;
        spawnJumpEffect(G.px+PLAYER_W/2,G.py+PLAYER_H);
    }
}

// ==================== 碰撞检测 ====================
function checkHurdleCollision(){
    var groundY=H*GROUND_RATIO;
    var px1=G.px+8,px2=G.px+PLAYER_W-8;
    var py1=G.py+5,py2=G.py+PLAYER_H;

    for(var i=0;i<G.hurdles.length;i++){
        var hr=G.hurdles[i];
        if(hr.passed||hr.hit)continue;
        var hx1=hr.x-G.cameraX;
        var hx2=hx1+hr.w;
        // 检查是否通过
        if(hx2<G.px-20){
            hr.passed=true;
            // 计算完美跳跃判定
            var jumpH=G.py;
            var hurdleTop=groundY-hr.h;
            var distAbove=hurdleTop-jumpH;
            if(distAbove>0&&distAbove<15){
                G.perfectJumps++;
                G.combo++;
                G.score+=100*G.combo;
                spawnPerfectEffect(G.px+PLAYER_W/2,G.py);
                showFlash('完美! x'+G.combo,'#FFD700');
            }else if(distAbove>=0){
                G.combo++;
                G.score+=50;
                showFlash('+50','#4ECDC4');
            }else{
                G.combo=0;
            }
            if(G.combo>G.maxCombo)G.maxCombo=G.combo;
            continue;
        }
        // 碰撞检测
        var hy1=groundY-hr.h;
        var hy2=groundY;
        if(hr.type==='water'||hr.type==='pit'){
            hy1=groundY-5;
            hy2=groundY+30;
        }
        if(px2>hx1&&px1<hx2&&py2>hy1&&py1<hy2){
            if(G.invincible>0){
                hr.hit=true;
                spawnHurdleBreak(hx1+hr.w/2,hy1);
                continue;
            }
            // 撞到障碍物
            hr.hit=true;
            G.combo=0;
            G.pHurt=30;
            G.shakeDur=15;
            G.score=Math.max(0,G.score-50);
            spawnHurdleBreak(hx1+hr.w/2,hy1);
            showFlash('-50','#FF6B6B');
        }
    }
}

// ==================== 显示提示 ====================
function showFlash(msg,color){
    G.flashMsg=msg;
    G.flashTimer=60;
    G.flashColor=color||'#fff';
}

// ==================== 游戏更新 ====================
function update(){
    if(G.state==='ready'){
        G.readyTimer--;
        if(G.readyTimer<=0)G.state='play';
        return;
    }
    if(G.state!=='play')return;

    var lv=LEVELS[G.level];
    var runSpeed=RUN_SPEED_BASE*lv.spdMul;
    if(G.speedBoost>0){runSpeed*=1.3;G.speedBoost--;}

    G.time++;
    G.cameraX+=runSpeed;
    G.trackDistance-=runSpeed;

    // 计分: 基于距离
    G.score+=1;

    // 重力
    if(!G.pGround){
        G.pvy+=GRAVITY;
        G.py+=G.pvy;
    }
    var groundY=H*GROUND_RATIO;
    if(G.py+PLAYER_H>=groundY){
        G.py=groundY-PLAYER_H;
        G.pvy=0;
        G.pGround=true;
        G.pJumping=false;
        G.pDoubleJump=false;
    }

    // 跳跃
    if(jumpPressed){
        doJump();
        jumpPressed=false;
    }

    // 碰撞检测
    checkHurdleCollision();

    // 跑步动画
    G.pRunCycle+=0.15*runSpeed;

    // 跑步尘土
    if(G.pGround&&G.time%4===0){
        spawnRunDust(G.px+5,G.py+PLAYER_H);
    }

    // 受伤计时
    if(G.pHurt>0)G.pHurt--;

    // 闪烁提示
    if(G.flashTimer>0)G.flashTimer--;

    // 震屏
    if(G.shakeDur>0){
        G.shakeX=(Math.random()-0.5)*6;
        G.shakeY=(Math.random()-0.5)*6;
        G.shakeDur--;
    }else{
        G.shakeX=0;G.shakeY=0;
    }

    // 粒子更新
    for(var i=G.particles.length-1;i>=0;i--){
        var p=G.particles[i];
        p.x+=p.vx;
        p.y+=p.vy;
        p.vy+=0.08;
        p.life--;
        if(p.life<=0)G.particles.splice(i,1);
    }

    // 到达终点
    if(G.trackDistance<=0){
        finishRace();
    }
}

function finishRace(){
    G.state='finish';
    var timeSec=(G.time/60).toFixed(2);
    var score=G.score;

    // 评定等级
    var passRate=G.totalHurdles>0?(G.totalHurdles-G.hurdles.filter(function(h){return h.hit}).length)/G.totalHurdles:1;
    if(passRate>=0.95&&G.perfectJumps>=G.totalHurdles*0.5){G.finishMedal='gold';G.finishRank='S';score+=500;}
    else if(passRate>=0.85){G.finishMedal='silver';G.finishRank='A';score+=300;}
    else if(passRate>=0.7){G.finishMedal='bronze';G.finishRank='B';score+=150;}
    else{G.finishMedal='none';G.finishRank='C';}

    // 更新最高分
    if(score>G.bestScores[G.level]){G.bestScores[G.level]=score;saveBest();}
    var t=parseFloat(timeSec);
    if(t<G.bestTimes[G.level]){G.bestTimes[G.level]=t;saveBest();}

    G.score=score;

    // 终点烟花
    for(var i=0;i<5;i++){
        setTimeout(function(){spawnFinishFireworks(W*Math.random(),H*0.3+Math.random()*H*0.3);},i*300);
    }

    // 检查是否需要显示插屏广告
    if((G.level+1)%3===0){
        setTimeout(function(){showInterstitial(true);},1500);
    }
}

    // 插屏广告结束后回到finish状态
}

// ==================== 背景星星 ====================
function initBgStars(){
    G.bgStars=[];
    for(var i=0;i<50;i++){
        G.bgStars.push({x:Math.random()*W,y:Math.random()*H*0.6,s:Math.random()*2+0.5,sp:Math.random()*0.3+0.1});
    }
}
initBgStars();

// ==================== 渲染 ====================
function render(){
    ctx.save();
    ctx.translate(G.shakeX,G.shakeY);

    // 背景
    drawBackground();

    if(G.state==='menu'){
        drawMenu();
    }else if(G.state==='ready'){
        drawGame();
        drawReadyOverlay();
    }else if(G.state==='play'||G.state==='finish'){
        drawGame();
    }else if(G.state==='over'){
        drawGameOver();
    }

    // 粒子
    drawParticles();

    ctx.restore();
}

function drawBackground(){
    var grd=ctx.createLinearGradient(0,0,0,H);
    grd.addColorStop(0,'#0a0a2e');
    grd.addColorStop(0.4,'#1a1a4e');
    grd.addColorStop(1,'#2d1b69');
    ctx.fillStyle=grd;
    ctx.fillRect(0,0,W,H);

    // 星星
    for(var i=0;i<G.bgStars.length;i++){
        var s=G.bgStars[i];
        s.y+=s.sp;
        if(s.y>H*0.6){s.y=0;s.x=Math.random()*W;}
        ctx.fillStyle='rgba(255,255,255,'+(0.3+Math.sin(Date.now()*0.003+i)*0.3)+')';
        ctx.beginPath();
        ctx.arc(s.x,s.y,s.s,0,Math.PI*2);
        ctx.fill();
    }
}

function drawGame(){
    var groundY=H*GROUND_RATIO;

    // 跑道背景
    ctx.fillStyle='#3a2a1a';
    ctx.fillRect(0,groundY,W,H-groundY);

    // 跑道线条
    ctx.strokeStyle='rgba(255,255,255,0.15)';
    ctx.lineWidth=2;
    ctx.setLineDash([20,15]);
    for(var lane=0;lane<4;lane++){
        var ly=groundY+(H-groundY)*lane/4;
        ctx.beginPath();
        ctx.moveTo(0,ly);
        ctx.lineTo(W,ly);
        ctx.stroke();
    }
    ctx.setLineDash([]);

    // 跑道分隔线（白色实线）
    ctx.strokeStyle='rgba(255,255,255,0.3)';
    ctx.lineWidth=3;
    var lineOffset=(-G.cameraX*0.5)%60;
    for(var lx=lineOffset;lx<W;lx+=60){
        ctx.beginPath();
        ctx.moveTo(lx,groundY);
        ctx.lineTo(lx,groundY+8);
        ctx.stroke();
    }

    // 远景建筑
    drawSkyline(groundY);

    // 障碍物
    drawHurdles(groundY);

    // 玩家
    drawPlayer(groundY);

    // 距离指示
    drawDistanceBar();

    // HUD
    drawHUD();
}

function drawSkyline(groundY){
    ctx.fillStyle='rgba(30,20,60,0.8)';
    var offset=(-G.cameraX*0.05)%200;
    for(var bx=offset-200;bx<W+200;bx+=200){
        var bh=60+Math.sin(bx*0.01)*40+Math.cos(bx*0.007)*30;
        ctx.fillRect(bx,groundY-bh-30,80,bh+30);
        // 窗户
        ctx.fillStyle='rgba(255,200,50,0.3)';
        for(var wy=groundY-bh-10;wy<groundY-40;wy+=15){
            for(var wx=bx+8;wx<bx+72;wx+=18){
                if(Math.random()>0.4)ctx.fillRect(wx,wy,8,10);
            }
        }
        ctx.fillStyle='rgba(30,20,60,0.8)';
    }
}

function drawHurdles(groundY){
    for(var i=0;i<G.hurdles.length;i++){
        var hr=G.hurdles[i];
        var sx=hr.x-G.cameraX;
        if(sx<-100||sx>W+100)continue;
        if(hr.hit)continue;

        var hTop=groundY-hr.h;

        if(hr.type==='hurdle'||hr.type==='double'){
            // 栏架
            var color=hr.type==='double'?'#E94560':'#FFD700';
            // 立柱
            ctx.fillStyle='#888';
            ctx.fillRect(sx,hTop,4,hr.h);
            ctx.fillRect(sx+hr.w-4,hTop,4,hr.h);
            // 横杆
            ctx.fillStyle=color;
            ctx.fillRect(sx-2,hTop,hr.w+4,6);
            // 反光
            ctx.fillStyle='rgba(255,255,255,0.3)';
            ctx.fillRect(sx,hTop,hr.w,2);
        }else if(hr.type==='water'){
            // 水坑
            var wgrd=ctx.createLinearGradient(sx,hTop,sx,groundY);
            wgrd.addColorStop(0,'rgba(30,100,200,0.6)');
            wgrd.addColorStop(1,'rgba(20,60,150,0.8)');
            ctx.fillStyle=wgrd;
            ctx.fillRect(sx,hTop,hr.w,groundY-hTop);
            // 波纹
            ctx.strokeStyle='rgba(255,255,255,0.3)';
            ctx.lineWidth=1;
            for(var wave=0;wave<3;wave++){
                ctx.beginPath();
                ctx.moveTo(sx,hTop+wave*8+Math.sin(Date.now()*0.005+wave)*3);
                ctx.quadraticCurveTo(sx+hr.w/2,hTop+wave*8-5+Math.sin(Date.now()*0.005+wave+1)*3,sx+hr.w,hTop+wave*8+Math.sin(Date.now()*0.005+wave+2)*3);
                ctx.stroke();
            }
        }else if(hr.type==='pit'){
            // 陷阱
            ctx.fillStyle='#1a0a00';
            ctx.fillRect(sx,groundY-5,hr.w,40);
            ctx.fillStyle='#8B0000';
            // 尖刺
            for(var sp=0;sp<hr.w;sp+=12){
                ctx.beginPath();
                ctx.moveTo(sx+sp,groundY);
                ctx.lineTo(sx+sp+6,groundY-15);
                ctx.lineTo(sx+sp+12,groundY);
                ctx.fill();
            }
        }
    }
}

function drawPlayer(groundY){
    var x=G.px,y=G.py;
    var hurt=G.pHurt>0&&G.pHurt%4<2;
    if(hurt){ctx.globalAlpha=0.5;}

    // 身体
    var bodyColor=G.invincible>0?'#4ECDC4':'#E94560';
    ctx.fillStyle=bodyColor;

    // 头
    ctx.beginPath();
    ctx.arc(x+PLAYER_W/2,y+12,12,0,Math.PI*2);
    ctx.fill();

    // 身干
    ctx.fillRect(x+PLAYER_W/2-8,y+24,16,20);

    // 腿（跑步动画）
    var legPhase=Math.sin(G.pRunCycle);
    var legY=y+44;
    if(!G.pGround){
        // 跳跃姿势
        ctx.fillRect(x+PLAYER_W/2-10,legY,8,16);
        ctx.fillRect(x+PLAYER_W/2+2,legY,8,12);
    }else if(G.pDucking){
        // 下蹲姿势
        ctx.fillRect(x+PLAYER_W/2-12,legY-5,10,10);
        ctx.fillRect(x+PLAYER_W/2+2,legY-5,10,10);
    }else{
        // 跑步
        ctx.fillRect(x+PLAYER_W/2-10,legY+legPhase*6,8,16);
        ctx.fillRect(x+PLAYER_W/2+2,legY-legPhase*6,8,16);
    }

    // 手臂
    ctx.fillStyle=bodyColor;
    if(!G.pGround){
        ctx.fillRect(x+PLAYER_W/2-14,y+26,6,14);
        ctx.fillRect(x+PLAYER_W/2+8,y+26,6,10);
    }else{
        ctx.fillRect(x+PLAYER_W/2-14,y+26-legPhase*5,6,14);
        ctx.fillRect(x+PLAYER_W/2+8,y+26+legPhase*5,6,14);
    }

    // 眼睛
    ctx.fillStyle='#fff';
    ctx.beginPath();
    ctx.arc(x+PLAYER_W/2+4,y+10,3,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='#000';
    ctx.beginPath();
    ctx.arc(x+PLAYER_W/2+5,y+10,1.5,0,Math.PI*2);
    ctx.fill();

    ctx.globalAlpha=1;

    // 连击特效
    if(G.combo>=3){
        ctx.fillStyle='rgba(255,215,0,'+((Math.sin(Date.now()*0.01)*0.3+0.3))+')';
        ctx.beginPath();
        ctx.arc(x+PLAYER_W/2,y+PLAYER_H/2,30+G.combo*2,0,Math.PI*2);
        ctx.fill();
    }
}

function drawDistanceBar(){
    var barW=W*0.4,barH=8;
    var bx=(W-barW)/2,by=15;
    var progress=Math.max(0,1-G.trackDistance/(LEVELS[G.level].distance));

    ctx.fillStyle='rgba(0,0,0,0.4)';
    ctx.fillRect(bx-2,by-2,barW+4,barH+4);
    ctx.fillStyle='rgba(80,80,80,0.6)';
    ctx.fillRect(bx,by,barW,barH);

    var grd=ctx.createLinearGradient(bx,0,bx+barW*progress,0);
    grd.addColorStop(0,'#4ECDC4');
    grd.addColorStop(1,'#E94560');
    ctx.fillStyle=grd;
    ctx.fillRect(bx,by,barW*progress,barH);

    // 终点标志
    ctx.fillStyle='#FFD700';
    ctx.fillRect(bx+barW-3,by-2,3,barH+4);

    ctx.fillStyle='#fff';
    ctx.font='10px sans-serif';
    ctx.textAlign='center';
    ctx.fillText(Math.floor(progress*100)+'%',W/2,by+barH+12);
}

function drawHUD(){
    ctx.textAlign='left';
    ctx.font='bold '+Math.round(16*SCALE)+'px sans-serif';

    // 分数
    ctx.fillStyle='#FFD700';
    ctx.fillText('分数: '+G.score,15,40);

    // 时间
    ctx.fillStyle='#4ECDC4';
    var timeSec=(G.time/60).toFixed(1);
    ctx.fillText('时间: '+timeSec+'s',15,62);

    // 连击
    if(G.combo>=2){
        ctx.fillStyle='#FF6B6B';
        ctx.font='bold '+Math.round(20*SCALE)+'px sans-serif';
        ctx.fillText('连击 x'+G.combo,W*0.5,40);
    }

    // 关卡
    ctx.textAlign='right';
    ctx.font='bold '+Math.round(14*SCALE)+'px sans-serif';
    ctx.fillStyle='#aaa';
    ctx.fillText(LEVELS[G.level].name,W-15,40);

    // 操作提示
    ctx.textAlign='center';
    ctx.font=Math.round(12*SCALE)+'px sans-serif';
    ctx.fillStyle='rgba(255,255,255,0.4)';
    if(isMobileDevice()){
        ctx.fillText('上半屏跳跃 · 下半屏下蹲 · 可二段跳',W/2,H-20);
    }else{
        ctx.fillText('空格/↑跳跃(可二段跳) · ↓下蹲',W/2,H-20);
    }

    // 闪烁消息
    if(G.flashTimer>0){
        ctx.textAlign='center';
        ctx.font='bold '+Math.round(24*SCALE)+'px sans-serif';
        ctx.fillStyle=G.flashColor;
        ctx.globalAlpha=G.flashTimer/60;
        ctx.fillText(G.flashMsg,W/2,H*0.35);
        ctx.globalAlpha=1;
    }
}

function isMobileDevice(){
    return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)||('ontouchstart' in window);
}

// ==================== 菜单 ====================
function drawMenu(){
    // 标题
    ctx.textAlign='center';
    ctx.textBaseline='middle';

    // 标题光晕
    var glowSize=Math.sin(Date.now()*0.003)*10+20;
    ctx.shadowColor='#E94560';
    ctx.shadowBlur=glowSize;
    ctx.fillStyle='#E94560';
    ctx.font='bold '+Math.round(52*SCALE)+'px sans-serif';
    ctx.fillText('跨栏',W/2,H*0.22);
    ctx.shadowBlur=0;

    // 副标题
    ctx.fillStyle='#aaa';
    ctx.font=Math.round(16*SCALE)+'px sans-serif';
    ctx.fillText('Hurdle Runner',W/2,H*0.30);

    // 跑者动画
    drawMenuRunner(W/2,H*0.46);

    // 关卡选择
    var startY=H*0.56;
    var itemH=Math.min(38*SCALE,H*0.06);
    var boxW=Math.min(300*SCALE,W*0.8);
    var boxX=(W-boxW)/2;

    for(var i=0;i<LEVELS.length;i++){
        var iy=startY+i*itemH*1.15;
        if(iy+itemH>H-60)break;

        var unlocked=i===0||G.bestScores[i-1]<99999;
        var selected=false;

        // 检查悬停（鼠标）
        if(mouseX>boxX&&mouseX<boxX+boxW&&mouseY>iy&&mouseY<iy+itemH){
            selected=true;
        }

        // 背景
        var bgGrd=ctx.createLinearGradient(boxX,iy,boxX+boxW,iy);
        if(!unlocked){
            bgGrd.addColorStop(0,'rgba(40,40,40,0.7)');
            bgGrd.addColorStop(1,'rgba(30,30,30,0.7)');
        }else if(selected){
            bgGrd.addColorStop(0,'rgba(233,69,96,0.3)');
            bgGrd.addColorStop(1,'rgba(233,69,96,0.15)');
        }else{
            bgGrd.addColorStop(0,'rgba(60,60,80,0.6)');
            bgGrd.addColorStop(1,'rgba(40,40,60,0.6)');
        }
        ctx.fillStyle=bgGrd;
        roundRect(ctx,boxX,iy,boxW,itemH,8);
        ctx.fill();

        // 边框
        ctx.strokeStyle=unlocked?(selected?'#E94560':'rgba(255,255,255,0.15)'):('rgba(60,60,60,0.5)');
        ctx.lineWidth=1;
        roundRect(ctx,boxX,iy,boxW,itemH,8);
        ctx.stroke();

        // 文字
        ctx.textAlign='left';
        ctx.font='bold '+Math.round(13*SCALE)+'px sans-serif';
        ctx.fillStyle=unlocked?'#fff':'#555';
        ctx.fillText(LEVELS[i].name,boxX+15,iy+itemH*0.38);

        ctx.font=Math.round(11*SCALE)+'px sans-serif';
        ctx.fillStyle=unlocked?'#aaa':'#444';
        ctx.fillText(unlocked?LEVELS[i].desc:'🔒 未解锁',boxX+15,iy+itemH*0.72);

        // 最高分
        if(unlocked&&G.bestScores[i]<99999){
            ctx.textAlign='right';
            ctx.font=Math.round(11*SCALE)+'px sans-serif';
            ctx.fillStyle='#FFD700';
            ctx.fillText(G.bestScores[i]+'分',boxX+boxW-15,iy+itemH*0.38);
            if(G.bestTimes[i]<99999){
                ctx.fillStyle='#4ECDC4';
                ctx.fillText(G.bestTimes[i].toFixed(1)+'s',boxX+boxW-15,iy+itemH*0.72);
            }
        }
    }

    // 底部提示
    ctx.textAlign='center';
    ctx.fillStyle='rgba(255,255,255,0.3)';
    ctx.font=Math.round(12*SCALE)+'px sans-serif';
    ctx.fillText('点击选择关卡开始游戏',W/2,H-40);
}

function drawMenuRunner(x,y){
    var t=Date.now()*0.008;
    var legPhase=Math.sin(t)*8;

    // 身体
    ctx.fillStyle='#E94560';
    // 头
    ctx.beginPath();
    ctx.arc(x,y-20,10,0,Math.PI*2);

    // 身干
    ctx.fillRect(x-7,y-10,14,18);

// ==================== 结算画面 ====================
function drawFinish(){
    // 半透明遮罩
    ctx.fillStyle='rgba(0,0,0,0.6)';
    ctx.fillRect(0,0,W,H);

    ctx.textAlign='center';
    ctx.textBaseline='middle';

    // 标题
    var medalEmoji=G.finishMedal==='gold'?'🥇':G.finishMedal==='silver'?'🥈':G.finishMedal==='bronze'?'🥉':'🏁';
    ctx.font=Math.round(48*SCALE)+'px sans-serif';
    ctx.fillText(medalEmoji,W/2,H*0.15);

    ctx.fillStyle='#FFD700';
    ctx.font='bold '+Math.round(32*SCALE)+'px sans-serif';
    ctx.fillText('完赛!',W/2,H*0.24);

    // 评级
    ctx.fillStyle=G.finishRank==='S'?'#FFD700':G.finishRank==='A'?'#4ECDC4':G.finishRank==='B'?'#FFA500':'#aaa';
    ctx.font='bold '+Math.round(60*SCALE)+'px sans-serif';
    ctx.fillText(G.finishRank,W/2,H*0.36);

    // 统计
    var statsY=H*0.48;
    var lineH=28*SCALE;

    ctx.fillStyle='#fff';
    ctx.font=Math.round(16*SCALE)+'px sans-serif';
    ctx.fillText('得分: '+G.score,W/2,statsY);
    ctx.fillStyle='#4ECDC4';
    ctx.fillText('用时: '+(G.time/60).toFixed(2)+'s',W/2,statsY+lineH);
    ctx.fillStyle='#FFA500';
    ctx.fillText('完美跳跃: '+G.perfectJumps+'/'+G.totalHurdles,W/2,statsY+lineH*2);
    ctx.fillStyle='#FF6B6B';
    ctx.fillText('最大连击: '+G.maxCombo,W/2,statsY+lineH*3);

    // 按钮
    var btnW=180*SCALE,btnH=45*SCALE;
    var btnY=H*0.78;

    // 重玩
    var btnX1=W/2-btnW-10;
    drawButton(btnX1,btnY,btnW,btnH,'再来一次','#E94560');
    G.btnReplay={x:btnX1,y:btnY,w:btnW,h:btnH};

    // 下一关
    var hasNextLevel=G.level<LEVELS.length-1&&(G.level===0||G.bestScores[G.level-1]<99999);
    if(hasNextLevel){
        var btnX2=W/2+10;
        drawButton(btnX2,btnY,btnW,btnH,'下一关','#4ECDC4');
        G.btnNext={x:btnX2,y:btnY,w:btnW,h:btnH};
    }else{
        G.btnNext=null;
    }

    // 返回菜单
    var btnX3=(W-150*SCALE)/2;
    drawButton(btnX3,btnY+btnH+15,150*SCALE,38*SCALE,'返回菜单','#555');
    G.btnMenu={x:btnX3,y:btnY+btnH+15,w:150*SCALE,h:38*SCALE};
}

function drawGameOver(){
    drawFinish();
}

function handleFinishTap(x,y){
    if(G.btnReplay&&x>G.btnReplay.x&&x<G.btnReplay.x+G.btnReplay.w&&y>G.btnReplay.y&&y<G.btnReplay.y+G.btnReplay.h){
        initGame(G.level);
    }
    if(G.btnNext&&x>G.btnNext.x&&x<G.btnNext.x+G.btnNext.w&&y>G.btnNext.y&&y<G.btnNext.y+G.btnNext.h){
        initGame(G.level+1);
    }
    if(G.btnMenu&&x>G.btnMenu.x&&x<G.btnMenu.x+G.btnMenu.w&&y>G.btnMenu.y&&y<G.btnMenu.y+G.btnMenu.h){
        G.state='menu';
        hideAdBanner();
    }
}

function handleOverTap(x,y){
    handleFinishTap(x,y);
}

// ==================== 菜单点击 ====================
function handleMenuTap(x,y){
    var startY=H*0.56;
    var itemH=Math.min(38*SCALE,H*0.06);
    var boxW=Math.min(300*SCALE,W*0.8);
    var boxX=(W-boxW)/2;

    for(var i=0;i<LEVELS.length;i++){
        var iy=startY+i*itemH*1.15;
        if(iy+itemH>H-60)break;
        if(x>boxX&&x<boxX+boxW&&y>iy&&y<iy+itemH){
            var unlocked=i===0||G.bestScores[i-1]<99999;
            if(unlocked){
                initGame(i);
            }
            break;
        }
    }
}

// ==================== 工具函数 ====================
function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
}

function drawButton(x,y,w,h,text,color){
    ctx.fillStyle=color;
    roundRect(ctx,x,y,w,h,10);
    ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.1)';
    roundRect(ctx,x,y,w,h/2,10);
    ctx.fill();
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillStyle='#fff';
    ctx.font='bold '+Math.round(15*SCALE)+'px sans-serif';
    ctx.fillText(text,x+w/2,y+h/2);
}

function drawParticles(){
    for(var i=0;i<G.particles.length;i++){
        var p=G.particles[i];
        var alpha=p.life/p.maxLife;
        ctx.fillStyle=p.color;
        ctx.globalAlpha=alpha;
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.size*alpha,0,Math.PI*2);
        ctx.fill();
    }
    ctx.globalAlpha=1;
}

// ==================== 鼠标追踪（菜单悬停效果） ====================
var mouseX=0,mouseY=0;
cv.addEventListener('mousemove',function(e){
    var rect=cv.getBoundingClientRect();
    mouseX=(e.clientX-rect.left)/rect.width*W;
    mouseY=(e.clientY-rect.top)/rect.height*H;
});

// ==================== 主循环 ====================
function gameLoop(){
    update();

    // 如果是finish状态，渲染结算画面
    if(G.state==='finish'){
        render();
        drawFinish();
    }else{
        render();
    }

    requestAnimationFrame(gameLoop);
}

// 启动
gameLoop();
