<script>
/* [STORAGE-POLYFILL v1] */
;(function(){
  var G = (typeof window !== 'undefined') ? window : (typeof globalThis !== 'undefined' ? globalThis : this);
  // 浏览器已有 Storage 构造函数，需确保其带 load/save/remove 静态方法
  var S = G.Storage;
  var needAttach = (typeof S === 'undefined' || typeof S.load !== 'function' || typeof S.save !== 'function');
  if (!needAttach) return;
  if (typeof S === 'undefined') { S = function(){}; G.Storage = S; }
  function parseSafe(s, d){
    if (s === null || s === undefined) return d;
    try { return JSON.parse(s); } catch(e) { try { return s; } catch(e2){ return d; } }
  }
  S.load = function(k, d){ try { return parseSafe(localStorage.getItem(k), d); } catch(e){ return d; } };
  S.save = function(k, v){ try { localStorage.setItem(k, typeof v==='string'?v:JSON.stringify(v)); } catch(e){} };
  S.remove = function(k){ try { localStorage.removeItem(k); } catch(e){} };
})();

// ==================== 配置 ====================
var PLAYER_RADIUS = 14;
var PLAYER_SPEED = 5.5;
var INVINCIBLE_TIME = 90; // frames of invincibility after hit
var DIFFICULTY_INTERVAL = 300; // frames between difficulty increases (5s at 60fps)
var BASE_SPAWN_RATE = 60; // frames between spawns at difficulty 1
var MIN_SPAWN_RATE = 12;
var SCORE_PER_SECOND = 10;

// Hazard types
var HAZARD_TYPES = [
    { name: 'circle',   radius: 12, color: '#ff4444', speed: 2.5 },
    { name: 'fast',     radius: 9,  color: '#ff8800', speed: 4.5 },
    { name: 'big',      radius: 22, color: '#cc00cc', speed: 1.8 },
    { name: 'tiny',     radius: 7,  color: '#ffff00', speed: 5.5 },
    { name: 'homing',   radius: 10, color: '#00ff88', speed: 2.0, homing: true },
    { name: 'splitter', radius: 15, color: '#44aaff', speed: 2.8, split: true }
];

// ==================== 状态 ====================
var canvas, ctx, W, H;
var G = {
    state: 'menu', // menu, playing, paused, over
    score: 0,
    bestScore: 0,
    time: 0, // in frames
    difficulty: 1,
    spawnTimer: 0,
    combo: 0, // survival combo
    player: null,
    hazards: [],
    particles: [],
    shakeTimer: 0,
    shakeX: 0,
    shakeY: 0,
    inputMode: 'keyboard', // keyboard, mouse, touch
    mouseX: 0,
    mouseY: 0,
    keys: {},
    touchActive: false,
    touchX: 0,
    touchY: 0
};

// ==================== 音效 ====================
var audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playSound(freq, duration, type, volume) {
    if (!audioCtx) return;
    try {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = type || 'square';
        osc.frequency.value = freq;
        gain.gain.value = volume || 0.15;
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (duration || 0.1));
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + (duration || 0.1));
    } catch(e) {}
}

function sfxHit() { playSound(150, 0.25, 'sawtooth', 0.2); }
function sfxSpawn() { playSound(800, 0.05, 'sine', 0.06); }
function sfxDiffUp() { playSound(600, 0.15, 'triangle', 0.12); playSound(900, 0.15, 'triangle', 0.1); }
function sfxGameOver() { playSound(200, 0.4, 'sawtooth', 0.2); playSound(100, 0.6, 'square', 0.15); }

// ==================== 初始化 ====================
function init() {
    canvas = document.getElementById('c');
    ctx = canvas.getContext('2d');
    resize();
    window.addEventListener('resize', resize);

    // Load best score
    try {
        G.bestScore = parseInt(localStorage.getItem('dodgeMaster_best')) || 0;
    } catch(e) {}
    updateBestDisplay();

    // Keyboard
    window.addEventListener('keydown', function(e) {
        G.keys[e.key] = true;
        G.keys[e.code] = true;
        if (e.key === 'p' || e.key === 'P' || e.code === 'Escape') {
            togglePause();
        }
    });
    window.addEventListener('keyup', function(e) {
        G.keys[e.key] = false;
        G.keys[e.code] = false;
    });

    // Mouse
    canvas.addEventListener('mousemove', function(e) {
        G.mouseX = e.clientX;
        G.mouseY = e.clientY;
        if (G.state === 'playing') G.inputMode = 'mouse';
    });

    // Touch
    canvas.addEventListener('touchstart', function(e) {
        e.preventDefault();
        var t = e.touches[0];
        G.touchActive = true;
        G.touchX = t.clientX;
        G.touchY = t.clientY;
        G.inputMode = 'touch';
        initAudio();
    });
    canvas.addEventListener('touchmove', function(e) {
        e.preventDefault();
        var t = e.touches[0];
        G.touchX = t.clientX;
        G.touchY = t.clientY;
    });
    canvas.addEventListener('touchend', function(e) {
        e.preventDefault();
        G.touchActive = false;
    });

    // Buttons
    document.getElementById('btnStart').addEventListener('click', function() {
        initAudio();
        startGame();
    });
    document.getElementById('btnRestart').addEventListener('click', function() {
        initAudio();
        startGame();
    });

    requestAnimationFrame(gameLoop);
}

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}

// ==================== 游戏控制 ====================
function startGame() {
    G.state = 'playing';
    G.score = 0;
    G.time = 0;
    G.difficulty = 1;
    G.spawnTimer = 0;
    G.combo = 0;
    G.hazards = [];
    G.particles = [];
    G.shakeTimer = 0;
    G.player = {
        x: W / 2,
        y: H / 2,
        radius: PLAYER_RADIUS,
        invincible: 0,
        lives: 3,
        flash: 0
    };
    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('gameOverScreen').style.display = 'none';
    document.getElementById('pauseOverlay').style.display = 'none';
    document.getElementById('ui').style.display = 'flex';
    updateUI();
}

function togglePause() {
    if (G.state === 'playing') {
        G.state = 'paused';
        document.getElementById('pauseOverlay').style.display = 'flex';
    } else if (G.state === 'paused') {
        G.state = 'playing';
        document.getElementById('pauseOverlay').style.display = 'none';
    }
}

function gameOver() {
    G.state = 'over';
    sfxGameOver();
    var isNewBest = G.score > G.bestScore;
    if (isNewBest) {
        G.bestScore = G.score;
        try { localStorage.setItem('dodgeMaster_best', G.bestScore); } catch(e) {}
    }
    updateBestDisplay();
    document.getElementById('finalScore').textContent = G.score;
    document.getElementById('finalDetail').textContent =
        '存活 ' + (G.time / 60).toFixed(1) + ' 秒 | 最终难度 ' + G.difficulty;
    document.getElementById('newBest').style.display = isNewBest ? 'block' : 'none';
    document.getElementById('gameOverScreen').style.display = 'flex';
    document.getElementById('ui').style.display = 'none';
}

// ==================== 生成敌人 ====================
function spawnHazard() {
    var p = G.player;
    if (!p) return;

    // Determine which types are available based on difficulty
    var maxTypeIdx = Math.min(HAZARD_TYPES.length - 1, Math.floor(G.difficulty / 2));
    var typeIdx = Math.floor(Math.random() * (maxTypeIdx + 1));
    var ht = HAZARD_TYPES[typeIdx];

    // Spawn from edges
    var side = Math.floor(Math.random() * 4);
    var x, y;
    switch (side) {
        case 0: x = Math.random() * W; y = -ht.radius; break; // top
        case 1: x = W + ht.radius; y = Math.random() * H; break; // right
        case 2: x = Math.random() * W; y = H + ht.radius; break; // bottom
        case 3: x = -ht.radius; y = Math.random() * H; break; // left
    }

    // Aim toward player with some spread
    var angle = Math.atan2(p.y - y, p.x - x) + (Math.random() - 0.5) * 0.6;
    var speedMul = 1 + (G.difficulty - 1) * 0.08;
    var spd = ht.speed * speedMul;

    G.hazards.push({
        x: x,
        y: y,
        vx: Math.cos(angle) * spd,
        vy: Math.sin(angle) * spd,
        radius: ht.radius * (0.9 + Math.random() * 0.2),
        color: ht.color,
        homing: ht.homing || false,
        split: ht.split || false,
        speed: spd,
        lifetime: 0,
        typeIdx: typeIdx
    });

    sfxSpawn();
}

function splitHazard(h) {
    for (var i = 0; i < 3; i++) {
        var angle = (Math.PI * 2 / 3) * i + Math.random() * 0.5;
        var spd = h.speed * 1.2;
        G.hazards.push({
            x: h.x,
            y: h.y,
            vx: Math.cos(angle) * spd,
            vy: Math.sin(angle) * spd,
            radius: h.radius * 0.5,
            color: '#88ccff',
            homing: false,
            split: false,
            speed: spd,
            lifetime: 0,
            typeIdx: 3
        });
    }
}

// ==================== 粒子系统 ====================
function spawnParticles(x, y, color, count) {
    for (var i = 0; i < count; i++) {
        var angle = Math.random() * Math.PI * 2;
        var spd = 1 + Math.random() * 3;
        G.particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * spd,
            vy: Math.sin(angle) * spd,
            life: 20 + Math.random() * 20,
            maxLife: 40,
            radius: 2 + Math.random() * 3,
            color: color
        });
    }
}

// ==================== 碰撞检测 ====================
function circleCollision(ax, ay, ar, bx, by, br) {
    var dx = ax - bx;
    var dy = ay - by;
    var dist = dx * dx + dy * dy;
    var rSum = ar + br;
    return dist < rSum * rSum;
}

// ==================== 更新逻辑 ====================
function update() {
    if (G.state !== 'playing') return;

    var p = G.player;
    G.time++;
    G.score = Math.floor(G.time / 60 * SCORE_PER_SECOND) + G.combo;

    // Difficulty increase
    var newDiff = 1 + Math.floor(G.time / DIFFICULTY_INTERVAL);
    if (newDiff > G.difficulty) {
        G.difficulty = newDiff;
        sfxDiffUp();
        G.shakeTimer = 15;
    }

    // Player movement
    var dx = 0, dy = 0;

    if (G.inputMode === 'keyboard') {
        if (G.keys['w'] || G.keys['W'] || G.keys['ArrowUp']) dy -= 1;
        if (G.keys['s'] || G.keys['S'] || G.keys['ArrowDown']) dy += 1;
        if (G.keys['a'] || G.keys['A'] || G.keys['ArrowLeft']) dx -= 1;
        if (G.keys['d'] || G.keys['D'] || G.keys['ArrowRight']) dx += 1;
    }

    if (G.inputMode === 'mouse') {
        var mdx = G.mouseX - p.x;
        var mdy = G.mouseY - p.y;
        var mdist = Math.sqrt(mdx * mdx + mdy * mdy);
        if (mdist > 5) {
            dx = mdx / mdist;
            dy = mdy / mdist;
        }
    }

    if (G.inputMode === 'touch' && G.touchActive) {
        var tdx = G.touchX - p.x;
        var tdy = G.touchY - p.y;
        var tdist = Math.sqrt(tdx * tdx + tdy * tdy);
        if (tdist > 5) {
            dx = tdx / tdist;
            dy = tdy / tdist;
        }
    }

    var len = Math.sqrt(dx * dx + dy * dy);
    if (len > 0) {
        p.x += (dx / len) * PLAYER_SPEED;
        p.y += (dy / len) * PLAYER_SPEED;
    }

    // Clamp to screen
    p.x = Math.max(p.radius, Math.min(W - p.radius, p.x));
    p.y = Math.max(p.radius, Math.min(H - p.radius, p.y));

    // Invincibility countdown
    if (p.invincible > 0) p.invincible--;
    if (p.flash > 0) p.flash--;

    // Spawn hazards
    var spawnRate = Math.max(MIN_SPAWN_RATE, BASE_SPAWN_RATE - G.difficulty * 3);
    G.spawnTimer++;
    if (G.spawnTimer >= spawnRate) {
        G.spawnTimer = 0;
        spawnHazard();
        // Extra spawns at high difficulty
        if (G.difficulty >= 5 && Math.random() < 0.3) spawnHazard();
        if (G.difficulty >= 10 && Math.random() < 0.3) spawnHazard();
    }

    // Update hazards
    for (var i = G.hazards.length - 1; i >= 0; i--) {
        var h = G.hazards[i];
        h.lifetime++;

        // Homing behavior
        if (h.homing && h.lifetime > 30) {
            var hdx = p.x - h.x;
            var hdy = p.y - h.y;
            var hdist = Math.sqrt(hdx * hdx + hdy * hdy);
            if (hdist > 0) {
                var homingStr = 0.03;
                h.vx += (hdx / hdist) * homingStr;
                h.vy += (hdy / hdist) * homingStr;
                // Cap speed
                var hspd = Math.sqrt(h.vx * h.vx + h.vy * h.vy);
                if (hspd > h.speed * 1.5) {
                    h.vx = (h.vx / hspd) * h.speed * 1.5;
                    h.vy = (h.vy / hspd) * h.speed * 1.5;
                }
            }
        }

        h.x += h.vx;
        h.y += h.vy;

        // Remove if far off screen
        var margin = 100;
        if (h.x < -margin || h.x > W + margin || h.y < -margin || h.y > H + margin) {
            G.hazards.splice(i, 1);
            continue;
        }

        // Collision with player
        if (circleCollision(h.x, h.y, h.radius, p.x, p.y, p.radius)) {
            if (p.invincible <= 0) {
                // Hit!
                p.lives--;
                p.invincible = INVINCIBLE_TIME;
                p.flash = 30;
                G.shakeTimer = 10;
                G.combo = 0;
                sfxHit();
                spawnParticles(p.x, p.y, '#ff4444', 15);

                if (h.split) {
                    splitHazard(h);
                }

                G.hazards.splice(i, 1);

                if (p.lives <= 0) {
                    gameOver();
                    return;
                }
                continue;
            }
        }

        // Splitter splits after a while
        if (h.split && h.lifetime > 180 && h.radius > 8) {
            splitHazard(h);
            G.hazards.splice(i, 1);
            continue;
        }
    }

    // Update particles
    for (var j = G.particles.length - 1; j >= 0; j--) {
        var pt = G.particles[j];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.vx *= 0.95;
        pt.vy *= 0.95;
        pt.life--;
        if (pt.life <= 0) {
            G.particles.splice(j, 1);
        }
    }

    // Screen shake
    if (G.shakeTimer > 0) {
        G.shakeTimer--;
        G.shakeX = (Math.random() - 0.5) * 6;
        G.shakeY = (Math.random() - 0.5) * 6;
    } else {
        G.shakeX = 0;
        G.shakeY = 0;
    }

    // Survival combo (bonus every 5 seconds)
    if (G.time % 300 === 0 && G.time > 0) {
        G.combo += G.difficulty * 5;
    }

    updateUI();
}

// ==================== 渲染 ====================
function render() {
    ctx.clearRect(0, 0, W, H);

    // Background
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);

    // Grid pattern
    ctx.strokeStyle = 'rgba(0,229,255,0.04)';
    ctx.lineWidth = 1;
    var gridSize = 60;
    for (var gx = 0; gx < W; gx += gridSize) {
        ctx.beginPath();
        ctx.moveTo(gx, 0);
        ctx.lineTo(gx, H);
        ctx.stroke();
    }
    for (var gy = 0; gy < H; gy += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, gy);
        ctx.lineTo(W, gy);
        ctx.stroke();
    }

    ctx.save();
    ctx.translate(G.shakeX, G.shakeY);

    // Particles
    for (var j = 0; j < G.particles.length; j++) {
        var pt = G.particles[j];
        var alpha = pt.life / pt.maxLife;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = pt.color;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.radius * alpha, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Hazards
    for (var i = 0; i < G.hazards.length; i++) {
        var h = G.hazards[i];
        // Glow
        ctx.shadowColor = h.color;
        ctx.shadowBlur = 10;
        ctx.fillStyle = h.color;
        ctx.beginPath();
        ctx.arc(h.x, h.y, h.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Inner highlight
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.beginPath();
        ctx.arc(h.x - h.radius * 0.25, h.y - h.radius * 0.25, h.radius * 0.4, 0, Math.PI * 2);
        ctx.fill();

        // Homing indicator
        if (h.homing) {
            ctx.strokeStyle = 'rgba(0,255,136,0.4)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(h.x, h.y, h.radius + 4, 0, Math.PI * 2);
            ctx.stroke();
        }

        // Split indicator
        if (h.split) {
            ctx.strokeStyle = 'rgba(68,170,255,0.5)';
            ctx.lineWidth = 1;
            ctx.setLineDash([3, 3]);
            ctx.beginPath();
            ctx.arc(h.x, h.y, h.radius + 6, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]);
        }
    }

    // Player
    if (G.player) {
        var p = G.player;
        var drawPlayer = true;

        // Flash when invincible
        if (p.invincible > 0) {
            drawPlayer = Math.floor(p.invincible / 4) % 2 === 0;
        }

        if (drawPlayer) {
            // Outer glow
            ctx.shadowColor = '#00e5ff';
            ctx.shadowBlur = 15;
            ctx.fillStyle = '#00e5ff';
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Inner core
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius * 0.5, 0, Math.PI * 2);
            ctx.fill();

            // Direction indicator
            if (G.inputMode === 'keyboard') {
                var indX = 0, indY = 0;
                if (G.keys['w'] || G.keys['W'] || G.keys['ArrowUp']) indY = -1;
                if (G.keys['s'] || G.keys['S'] || G.keys['ArrowDown']) indY = 1;
                if (G.keys['a'] || G.keys['A'] || G.keys['ArrowLeft']) indX = -1;
                if (G.keys['d'] || G.keys['D'] || G.keys['ArrowRight']) indX = 1;
                if (indX !== 0 || indY !== 0) {
                    var indLen = Math.sqrt(indX * indX + indY * indY);
                    var arrowX = p.x + (indX / indLen) * (p.radius + 8);
                    var arrowY = p.y + (indY / indLen) * (p.radius + 8);
                    ctx.fillStyle = 'rgba(0,229,255,0.6)';
                    ctx.beginPath();
                    ctx.arc(arrowX, arrowY, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        // Lives display (hearts)
        for (var l = 0; l < 3; l++) {
            var hx = p.x - 16 + l * 16;
            var hy = p.y - p.radius - 14;
            if (l < p.lives) {
                ctx.fillStyle = '#ff4444';
            } else {
                ctx.fillStyle = 'rgba(255,68,68,0.2)';
            }
            drawHeart(ctx, hx, hy, 5);
        }
    }

    // Difficulty warning flash
    if (G.shakeTimer > 0 && G.difficulty > 1) {
        ctx.fillStyle = 'rgba(255,0,0,' + (G.shakeTimer / 30) + ')';
        ctx.fillRect(0, 0, W, H);
    }

    ctx.restore();
}

function drawHeart(ctx, x, y, size) {
    ctx.beginPath();
    ctx.moveTo(x, y + size * 0.3);
    ctx.bezierCurveTo(x, y, x - size, y, x - size, y + size * 0.3);
    ctx.bezierCurveTo(x - size, y + size * 0.7, x, y + size, x, y + size * 1.2);
    ctx.bezierCurveTo(x, y + size, x + size, y + size * 0.7, x + size, y + size * 0.3);
    ctx.bezierCurveTo(x + size, y, x, y, x, y + size * 0.3);
    ctx.fill();
}

// ==================== UI更新 ====================
function updateUI() {
    document.getElementById('scoreVal').textContent = G.score;
    document.getElementById('timeVal').textContent = (G.time / 60).toFixed(1);
    document.getElementById('diffVal').textContent = G.difficulty;
}

function updateBestDisplay() {
    document.getElementById('bestVal').textContent = G.bestScore;
}

// ==================== 游戏循环 ====================
function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
}
