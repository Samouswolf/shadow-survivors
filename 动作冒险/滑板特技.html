<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>滑板特技</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(180deg, #166534 0%, #14532d 100%); min-height: 100vh; overflow: hidden; }
#game-container { position: relative; width: 100%; height: 100vh; }
#game-canvas { display: block; width: 100%; height: 100%; }
#game-ui { position: absolute; top: 20px; left: 20px; color: #fff; font-size: 20px; font-weight: bold; z-index: 10; }
#game-ui span { color: #84cc16; }
#game-over { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 20; flex-direction: column; align-items: center; justify-content: center; }
#game-over h2 { font-size: 48px; color: #f5576c; margin-bottom: 20px; }
#game-over p { font-size: 24px; color: #fff; margin-bottom: 30px; }
#game-over .btn { padding: 15px 40px; font-size: 20px; background: #84cc16; color: #fff; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
#start-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#start-screen h1 { font-size: 48px; color: #84cc16; margin-bottom: 20px; text-shadow: 0 0 20px rgba(132,204,22,0.5); }
#start-screen p { color: #aaa; margin-bottom: 40px; font-size: 16px; }
#start-screen .btn { padding: 18px 50px; font-size: 22px; background: linear-gradient(145deg, #84cc16, #65a30d); color: #fff; border: none; border-radius: 15px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 20px rgba(132,204,22,0.4); }
.ad-banner-container { position: absolute; bottom: 0; left: 0; width: 100%; padding: 10px; z-index: 10; }
.sponsor-btn { position: fixed; top: 20px; right: 20px; width: 50px; height: 50px; background: rgba(255,165,0,0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; z-index: 100; box-shadow: 0 4px 15px rgba(255,165,0,0.4); }
.sponsor-panel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 200; align-items: center; justify-content: center; }
.sponsor-panel.show { display: flex; }
.sponsor-content { background: #fff; padding: 30px; border-radius: 20px; text-align: center; max-width: 90%; }
.sponsor-content h3 { margin-bottom: 20px; color: #333; }
.sponsor-close { position: absolute; top: 20px; right: 20px; width: 40px; height: 40px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; }

#loading-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a2e; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#loading-screen .loading-icon { width: 60px; height: 60px; border: 4px solid #6366f1; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#loading-screen p { color: #6366f1; margin-top: 20px; font-size: 18px; }
.interstitial-ad { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 999; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
.interstitial-ad .ad-content { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; text-align: center; min-width: 280px; max-width: 400px; }
.interstitial-ad .ad-content p { color: #aaa; font-size: 14px; margin-bottom: 12px; }
.interstitial-ad .skip-btn { padding: 8px 28px; background: rgba(255,215,0,0.15); border: 1px solid rgba(255,215,0,0.3); border-radius: 20px; color: #ffd700; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.2s; }
.interstitial-ad .skip-btn:hover { background: rgba(255,215,0,0.25); }

</style>
</head>
<body>
<div id="start-screen">
  <h1>🛹 滑板特技</h1>
  <p>点击屏幕跳跃<br>在空中做特技，获得高分！</p>
  <button class="btn" onclick="startGame()">开始游戏</button>
</div>

<div id="game-container">
  <canvas id="game-canvas"></canvas>
  <div id="game-ui">
    分数: <span id="score">0</span> | 特技: <span id="tricks">0</span> | 最高: <span id="high-score">0</span>
  </div>
  
  <div id="game-over">
    <h2>💥 游戏结束</h2>
    <p>最终得分: <span id="final-score">0</span></p>
    <button class="btn" onclick="restartGame()">再来一次</button>
  </div>
  
  <div class="ad-banner-container">
    <div style="background:#f0f0f0;height:90px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#666;font-size:14px;">广告位</div>
  </div>
</div>

<div class="sponsor-btn" onclick="showSponsor()">☕</div>
<div class="sponsor-panel" id="sponsor-panel" onclick="hideSponsor()">
  <div class="sponsor-content" onclick="event.stopPropagation()">
    <h3>支持开发者</h3>
    <p>感谢您的支持！</p>
    <div style="color:#666;font-size:14px;margin-top:10px;">微信赞赏码</div>
  </div>
  <div class="sponsor-close" onclick="hideSponsor()">×</div>
</div>


<div id="loading-screen">
  <div class="loading-icon"></div>
  <p>加载中...</p>
</div>

<div class="interstitial-ad" id="interstitialAd">
  <div class="ad-content">
    <p>赞助商广告</p>
    <div id="interstitialAdSlot" style="min-height:250px;display:flex;align-items:center;justify-content:center;color:#888;font-size:13px;">广告加载中...</div>
  </div>
  <button class="skip-btn" id="skipInterstitial" onclick="closeInterstitial()">跳过广告</button>
</div>


  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script src="../game_core.js"></script>
<script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script>

// ==================== 游戏说明 ====================
// 操作说明: 使用键盘方向键或触屏控制
// 游戏目标: 获得最高分数
// 存档系统: 自动保存最高分到本地
// ==================== 模块说明 ====================
// 1. 游戏初始化模块 - 初始化Canvas和游戏状态
// 2. 游戏逻辑模块 - 处理玩家移动、碰撞检测
// 3. 渲染模块 - 绘制游戏画面和UI
// 4. 音效模块 - 播放游戏音效
// 5. 存档模块 - 管理最高分记录
// ==================== 配置参数 ====================
const GAME_NAME = '滑板特技';

class GameCore {
  static init(options) {
    if (options.highScore) {
      this.highScoreKey = options.highScore;
    }
  }
  
  static getHighScore() {
    return parseInt(localStorage.getItem(this.highScoreKey)) || 0;
  }
  
  static setHighScore(value) {
    const current = this.getHighScore();
    if (value > current) {
      localStorage.setItem(this.highScoreKey, value);
      return true;
    }
    return false;
  }
}

GameCore.init({ highScore: GAME_NAME });

const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const tricksEl = document.getElementById('tricks');
const highScoreEl = document.getElementById('high-score');
const finalScoreEl = document.getElementById('final-score');

let gameRunning = false;
let score = 0;
let tricks = 0;
let speed = 5;
let ramps = [];
let particles = [];
let rotation = 0;
let isInAir = false;
let airTime = 0;

const player = {
  x: 100,
  y: 0,
  width: 40,
  height: 15,
  velocityY: 0,
  color: '#84cc16'
};

let groundY = 0;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  groundY = canvas.height - 80;
  player.y = groundY;
}

resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function startGame() {
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('game-over').style.display = 'none';
  gameRunning = true;
  score = 0;
  tricks = 0;
  speed = 5;
  ramps = [];
  particles = [];
  rotation = 0;
  isInAir = false;
  airTime = 0;
  
  player.y = groundY;
  player.velocityY = 0;
  
  scoreEl.textContent = '0';
  tricksEl.textContent = '0';
  highScoreEl.textContent = GameCore.getHighScore();
  
  gameLoop();
}

function restartGame() {
  startGame();
}

function showSponsor() {
  document.getElementById('sponsor-panel').classList.add('show');
}

function hideSponsor() {
  document.getElementById('sponsor-panel').classList.remove('show');
}

function createParticles(x, y, color) {
  for (let i = 0; i < 8; i++) {
    particles.push({
      x: x,
      y: y,
      vx: (Math.random() - 0.5) * 6,
      vy: Math.random() * -4,
      size: Math.random() * 4 + 2,
      color: color,
      life: 1
    });
  }
}

function jump() {
  if (!isInAir && gameRunning) {
    player.velocityY = -12;
    isInAir = true;
    airTime = Date.now();
    createParticles(player.x, player.y + player.height, '#84cc16');
  }
}

function doTrick() {
  if (isInAir && gameRunning) {
    rotation += Math.PI / 2;
    tricks++;
    tricksEl.textContent = tricks;
    
    const trickBonus = tricks * 10;
    score += trickBonus;
    scoreEl.textContent = score;
    
    createParticles(player.x, player.y, '#fbbf24');
  }
}

function spawnRamp() {
  const ramp = {
    x: canvas.width + 50,
    width: 80,
    height: 40,
    y: groundY
  };
  ramps.push(ramp);
}

function update() {
  if (!gameRunning) return;
  
  score += 0.1;
  scoreEl.textContent = Math.floor(score);
  
  speed += 0.0005;
  
  player.velocityY += 0.6;
  player.y += player.velocityY;
  
  if (player.y >= groundY) {
    player.y = groundY;
    player.velocityY = 0;
    isInAir = false;
    rotation = Math.round(rotation / (Math.PI / 2)) * (Math.PI / 2);
    
    const airDuration = Date.now() - airTime;
    if (airDuration > 500) {
      const airBonus = Math.floor(airDuration / 100);
      score += airBonus;
      scoreEl.textContent = score;
    }
  }
  
  if (Math.random() < 0.01) {
    spawnRamp();
  }
  
  ramps.forEach(ramp => {
    ramp.x -= speed;
    
    if (ramp.x < player.x + player.width && ramp.x + ramp.width > player.x &&
        player.y >= groundY && player.velocityY >= 0) {
      const rampProgress = (player.x - ramp.x) / ramp.width;
      if (rampProgress > 0.3 && rampProgress < 0.7) {
        player.velocityY = -15;
        isInAir = true;
        airTime = Date.now();
        createParticles(player.x, player.y + player.height, '#fbbf24');
      }
    }
  });
  
  ramps = ramps.filter(r => r.x > -100);
  
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.2;
    p.life -= 0.02;
  });
  
  particles = particles.filter(p => p.life > 0);
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  ctx.fillStyle = '#166534';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  ctx.fillStyle = '#15803d';
  for (let i = 0; i < 40; i++) {
    const x = (i * 53 + Date.now() * 0.01) % canvas.width;
    const y = (i * 37 + Date.now() * 0.02) % canvas.height;
    ctx.fillRect(x, y, 2, 2);
  }
  
  ctx.fillStyle = '#166534';
  ctx.fillRect(0, groundY + 80, canvas.width, canvas.height - groundY - 80);
  
  ctx.fillStyle = '#22c55e';
  ctx.fillRect(0, groundY + 75, canvas.width, 5);
  
  ctx.fillStyle = '#4ade80';
  ctx.fillRect(0, groundY + 77, canvas.width, 1);
  
  ramps.forEach(ramp => {
    ctx.fillStyle = '#fbbf24';
    
    ctx.beginPath();
    ctx.moveTo(ramp.x, ramp.y + 80);
    ctx.lineTo(ramp.x + ramp.width / 2, ramp.y + 80 - ramp.height);
    ctx.lineTo(ramp.x + ramp.width, ramp.y + 80);
    ctx.closePath();
    ctx.fill();
    
    ctx.fillStyle = '#fcd34d';
    ctx.beginPath();
    ctx.moveTo(ramp.x + 5, ramp.y + 80);
    ctx.lineTo(ramp.x + ramp.width / 2, ramp.y + 80 - ramp.height + 5);
    ctx.lineTo(ramp.x + ramp.width - 5, ramp.y + 80);
    ctx.closePath();
    ctx.fill();
  });
  
  ctx.save();
  ctx.translate(player.x + player.width / 2, player.y + player.height / 2);
  ctx.rotate(rotation);
  
  ctx.fillStyle = player.color;
  ctx.fillRect(-player.width / 2, -player.height / 2, player.width, player.height);
  
  ctx.fillStyle = '#65a30d';
  ctx.fillRect(-player.width / 2 + 5, -player.height / 2 + 2, player.width - 10, 4);
  
  ctx.fillStyle = '#fff';
  ctx.fillRect(-player.width / 2 + 3, -player.height / 2, 6, 6);
  ctx.fillRect(player.width / 2 - 9, -player.height / 2, 6, 6);
  ctx.fillRect(-player.width / 2 + 3, player.height / 2 - 6, 6, 6);
  ctx.fillRect(player.width / 2 - 9, player.height / 2 - 6, 6, 6);
  
  ctx.restore();
  
  if (isInAir) {
    ctx.fillStyle = '#fbbf24';
    ctx.font = 'bold 24px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(`${tricks}x FLIP!`, player.x + player.width / 2, player.y - 30);
  }
  
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });
  
  ctx.globalAlpha = 1;
}

function gameLoop() {
  if (!gameRunning) return;
  
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

function gameOver() {
  gameRunning = false;
  finalScoreEl.textContent = Math.floor(score);
  
  if (GameCore.setHighScore(Math.floor(score))) {
    highScoreEl.textContent = Math.floor(score);
  }
  
  document.getElementById('game-over').style.display = 'flex';
}

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    if (gameRunning) {
      if (isInAir) {
        doTrick();
      } else {
        jump();
      }
    }
  }
});

canvas.addEventListener('click', () => {
  if (gameRunning) {
    if (isInAir) {
      doTrick();
    } else {
      jump();
    }
  }
});

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (gameRunning) {
    if (isInAir) {
      doTrick();
    } else {
      jump();
    }
  }
});

// ==================== 错误处理 ====================
function closeInterstitial() {
  try {
    var el = document.getElementById('interstitialAd');
    if (el) el.style.display = 'none';
  } catch (error) {
    console.error('关闭广告失败:', error);
  }
}

// ==================== 音效支持 ====================
var audioCtx = null;
function initAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch (error) {
    console.warn('音频初始化失败:', error);
  }
}
function playSound(freq, dur, type, vol) {
  try {
    if (!audioCtx) return;
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = type || 'square';
    o.frequency.value = freq;
    g.gain.value = vol || 0.15;
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime + dur);
  } catch (error) {
    console.warn('音效播放失败:', error);
  }
}

// ==================== 页面加载处理 ====================
window.addEventListener('load', function() {
  try {
    var loadingScreen = document.getElementById('loading-screen');
    if (loadingScreen) {
      setTimeout(function() {
        loadingScreen.style.display = 'none';
      }, 1500);
    }
  } catch (error) {
    console.error('加载界面处理失败:', error);
  }
});

</script>
<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
</body>
</html>
