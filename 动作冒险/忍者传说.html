<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>忍者传说</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #0d0d0d 0%, #1a1a2e 50%, #16213e 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; color: #fff; overflow: hidden; }
        
        .game-container { width: 100%; flex: 1; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: #fff; }
        .stats { display: flex; gap: 20px; font-size: 14px; }
        
        .main-area { flex: 1; background: rgba(0,0,0,0.5); border-radius: 15px; overflow: hidden; position: relative; }
        
        .ninja-display { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 80px; }
        
        .status-panel { position: absolute; bottom: 20px; left: 0; right: 0; display: flex; justify-content: center; gap: 30px; }
        
        .status-item { text-align: center; }
        .status-bar { width: 100px; height: 15px; background: #333; border-radius: 8px; overflow: hidden; margin-top: 5px; }
        .status-fill { height: 100%; background: linear-gradient(90deg, #ff6b6b, #4ecdc4); }
        
        .actions { display: flex; gap: 10px; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; }
        
        .action-btn { flex: 1; padding: 15px; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; background: rgba(255,255,255,0.2); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }
    /* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}

.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}

.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}

<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="title">🥷 忍者传说</div>
            <div class="stats">
                <span>🏆 忍阶: <span id="rank">下忍</span></span>
                <span>⚡ 敏捷: <span id="agility">10</span></span>
                <span>🗡️ 忍术: <span id="ninjutsu">5</span></span>
            </div>
        </div>
        
        <div class="main-area">
            <div class="ninja-display" id="ninjaDisplay">🥷</div>
            
            <div class="status-panel">
                <div class="status-item">
                    <div>❤️ 生命</div>
                    <div class="status-bar"><div class="status-fill" id="hpBar"></div></div>
                    <div id="hpText">100/100</div>
                </div>
                <div class="status-item">
                    <div>⭐ 查克拉</div>
                    <div class="status-bar"><div class="status-fill" id="chakraBar"></div></div>
                    <div id="chakraText">50/50</div>
                </div>
                <div class="status-item">
                    <div>💰 任务点</div>
                    <div class="status-bar"><div class="status-fill" id="missionBar"></div></div>
                    <div id="missionText">0/100</div>
                </div>
            </div>
            
            <div id="message" style="position: absolute; top: 20px; left: 50%; transform: translateX(-50%); font-size: 18px;">准备好接受挑战了吗？</div>
        </div>
        
        <div class="actions">
            <button class="action-btn" onclick="train()">🏋️ 修炼</button>
            <button class="action-btn" onclick="stealth()">👻 潜行</button>
            <button class="action-btn" onclick="mission()">📋 任务</button>
            <button class="action-btn" onclick="meditate()">🧘 冥想</button>
        </div>
    </div>
    
    <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;

<script src="game_core.js"></script>
    <script>
        const GAME_NAME = '忍者传说';
        GameCore.init({ highScore: GAME_NAME });
        
        let ninja = {
            hp: 100,
            maxHp: 100,
            chakra: 50,
            maxChakra: 50,
            agility: 10,
            ninjutsu: 5,
            missionsCompleted: 0,
            rank: 1
        };
        
        const ranks = [
            { name: '下忍', minMissions: 0 },
            { name: '中忍', minMissions: 10 },
            { name: '上忍', minMissions: 30 },
            { name: '精英上忍', minMissions: 60 },
            { name: '影', minMissions: 100 }
        ];
        
        const ninjutsuList = [
            { name: '影分身术', emoji: '👤', cost: 20, effect: '分身攻击' },
            { name: '手里剑', emoji: '🗡️', cost: 10, effect: '远程攻击' },
            { name: '火遁', emoji: '🔥', cost: 25, effect: '火焰攻击' },
            { name: '水遁', emoji: '💧', cost: 25, effect: '水流攻击' },
            { name: '雷遁', emoji: '⚡', cost: 30, effect: '雷电攻击' },
            { name: '须佐能乎', emoji: '🦾', cost: 50, effect: '终极忍术' }
        ];
        
        const missions = [
            { name: '送信任务', difficulty: 1, reward: 1, chakraCost: 10, description: '将信件送到指定地点' },
            { name: '侦查任务', difficulty: 2, reward: 2, chakraCost: 15, description: '侦查敌人据点' },
            { name: '暗杀任务', difficulty: 3, reward: 4, chakraCost: 25, description: '暗杀敌方首领' },
            { name: '护卫任务', difficulty: 4, reward: 6, chakraCost: 30, description: '保护重要人物' },
            { name: 'S级任务', difficulty: 5, reward: 10, chakraCost: 50, description: '最危险的任务' }
        ];
        
        function initGame() {
            updateUI();
        }
        
        function updateUI() {
            const rank = ranks.slice().reverse().find(r => ninja.missionsCompleted >= r.minMissions);
            document.getElementById('rank').textContent = rank ? rank.name : ranks[0].name;
            document.getElementById('agility').textContent = ninja.agility;
            document.getElementById('ninjutsu').textContent = ninja.ninjutsu;
            
            document.getElementById('hpText').textContent = `${ninja.hp}/${ninja.maxHp}`;
            document.getElementById('hpBar').style.width = `${(ninja.hp / ninja.maxHp) * 100}%`;
            
            document.getElementById('chakraText').textContent = `${ninja.chakra}/${ninja.maxChakra}`;
            document.getElementById('chakraBar').style.width = `${(ninja.chakra / ninja.maxChakra) * 100}%`;
            
            document.getElementById('missionText').textContent = `${ninja.missionsCompleted}`;
            document.getElementById('missionBar').style.width = `${Math.min(100, (ninja.missionsCompleted / 10) * 10)}%`;
            
            GameCore.highScore.set(GAME_NAME, ninja.missionsCompleted);
        }
        
        function setMessage(msg) {
            document.getElementById('message').textContent = msg;
        }
        
        function train() {
            if (ninja.hp < 15 || ninja.chakra < 10) {
                setMessage('体力或查克拉不足！需要休息！');
                return;
            }
            
            ninja.hp -= 15;
            ninja.chakra -= 10;
            ninja.agility += 2;
            ninja.ninjutsu += 1;
            
            setMessage('🏋️ 经过刻苦修炼，敏捷和忍术都提升了！');
            updateUI();
        }
        
        function stealth() {
            if (ninja.chakra < 15) {
                setMessage('查克拉不足！');
                return;
            }
            
            ninja.chakra -= 15;
            
            if (ninja.agility > Math.random() * 20) {
                const bonus = Math.floor(Math.random() * 5);
                ninja.missionsCompleted += bonus;
                setMessage(`👻 成功潜入！获得 ${bonus} 额外任务点！`);
            } else {
                ninja.hp -= 10;
                setMessage('👻 潜入失败，被发现了！');
            }
            
            checkRankUp();
            updateUI();
        }
        
        function mission() {
            const missionIndex = Math.min(Math.floor(ninja.missionsCompleted / 20), missions.length - 1);
            const mission = missions[missionIndex];
            
            if (ninja.hp < 20 || ninja.chakra < mission.chakraCost) {
                setMessage('体力或查克拉不足！');
                return;
            }
            
            ninja.hp -= 20;
            ninja.chakra -= mission.chakraCost;
            
            const success = ninja.agility + ninja.ninjutsu > mission.difficulty * 5 + Math.random() * 10;
            
            if (success) {
                ninja.missionsCompleted += mission.reward;
                setMessage(`📋 完成「${mission.name}」！获得 ${mission.reward} 任务点！`);
            } else {
                setMessage(`📋 任务失败了...`);
            }
            
            checkRankUp();
            updateUI();
        }
        
        function meditate() {
            const hpRestore = Math.floor(ninja.maxHp * 0.3);
            const chakraRestore = Math.floor(ninja.maxChakra * 0.5);
            
            ninja.hp = Math.min(ninja.maxHp, ninja.hp + hpRestore);
            ninja.chakra = Math.min(ninja.maxChakra, ninja.chakra + chakraRestore);
            
            setMessage(`🧘 冥想恢复了 ${hpRestore} 体力和 ${chakraRestore} 查克拉！`);
            updateUI();
        }
        
        function checkRankUp() {
            const rankThreshold = ninja.rank * 20;
            if (ninja.missionsCompleted >= rankThreshold && ninja.rank < ranks.length) {
                ninja.rank++;
                ninja.maxHp += 20;
                ninja.maxChakra += 15;
                ninja.hp = ninja.maxHp;
                ninja.chakra = ninja.maxChakra;
                
                const newRank = ranks.find(r => ninja.missionsCompleted >= r.minMissions);
                setMessage(`🏆 晋升了！当前忍阶: ${newRank?.name}`);
            }
        }
        
        initGame();
        GameCore.touch.enableAllButtons();
    </script>

<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>
<!-- [/BATCH-FIX:responsive-js] -->
<!-- [BATCH-FIX:touch-support] -->
<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>
<!-- [/BATCH-FIX:touch-support] -->

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
