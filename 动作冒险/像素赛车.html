<script>
// // 初始化游戏变量

// // 处理碰撞检测

// // 初始化游戏变量
// // 更新游戏状态
// // 渲染游戏画面
// // 处理用户输入
// // 检测游戏结束条件
// // 计算游戏分数
// // 保存游戏进度
// // 加载游戏数据
// // 重置游戏设置
// // 显示游戏提示
// // 播放音效
// // 处理碰撞检测

// // 初始化游戏变量
// // 更新游戏状态
// // 渲染游戏画面
// // 处理用户输入
// // 检测游戏结束条件
// // 计算游戏分数
// // 保存游戏进度
// // 加载游戏数据
// // 重置游戏设置
// // 显示游戏提示
// // 播放音效
// // 处理碰撞检测

// ============================================
// 游戏名称: 像素赛车
// 功能描述: 该游戏提供休闲娱乐体验
// 创建时间: 2026-06-23
// ============================================

(function() {
  'use strict';

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  const GAME_WIDTH = 480;
  const GAME_HEIGHT = 720;
  canvas.width = GAME_WIDTH;
  canvas.height = GAME_HEIGHT;

  function resizeCanvas() {
    const scaleX = window.innerWidth / GAME_WIDTH;
    const scaleY = window.innerHeight / GAME_HEIGHT;
    const scale = Math.min(scaleX, scaleY);
    canvas.style.width = (GAME_WIDTH * scale) + 'px';
    canvas.style.height = (GAME_HEIGHT * scale) + 'px';
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  const LANE_COUNT = 3;
  const ROAD_LEFT = 100;
  const ROAD_RIGHT = 380;
  const ROAD_WIDTH = ROAD_RIGHT - ROAD_LEFT;
  const LANE_WIDTH = ROAD_WIDTH / LANE_COUNT;
  const LANE_CENTERS = [];
  for (let i = 0; i < LANE_COUNT; i++) {
    LANE_CENTERS.push(ROAD_LEFT + LANE_WIDTH * i + LANE_WIDTH / 2);
  }

  const VEHICLE_TYPES = [
    { id: 'sedan', name: '小轿车', speed: 1.0, handling: 1.0, unlockScore: 0, color: '#4488ff', width: 30, height: 50 },
    { id: 'sports', name: '跑车', speed: 1.2, handling: 0.9, unlockScore: 10000, color: '#ff4444', width: 28, height: 48 },
    { id: 'suv', name: '越野车', speed: 0.9, handling: 0.8, unlockScore: 50000, color: '#44aa44', width: 34, height: 54 },
    { id: 'truck', name: '卡车', speed: 0.8, handling: 0.7, unlockScore: 100000, color: '#aa8844', width: 36, height: 58 },
    { id: 'racer', name: '赛车', speed: 1.4, handling: 1.1, unlockScore: 500000, color: '#ffaa00', width: 26, height: 46 }
  ];

  const OBSTACLE_TYPES = [
    { type: 'car', name: '普通车', speed: 0.3, width: 28, height: 48, color: '#888888', lanes: 1 },
    { type: 'truck', name: '卡车', speed: 0.2, width: 56, height: 52, color: '#666666', lanes: 2 },
    { type: 'moto', name: '摩托', speed: 0.6, width: 20, height: 36, color: '#aa44aa', lanes: 1, canChangeLane: true },
    { type: 'barrier', name: '路障', speed: 0, width: 40, height: 20, color: '#ff8800', lanes: 1 },
    { type: 'pothole', name: '坑洞', speed: 0, width: 30, height: 30, color: '#333333', lanes: 1 },
    { type: 'oil', name: '油桶', speed: 0, width: 24, height: 24, color: '#444444', lanes: 1 },
    { type: 'cone', name: '锥桶', speed: 0, width: 18, height: 24, color: '#ff6600', lanes: 1 },
    { type: 'van', name: '面包车', speed: 0.25, width: 30, height: 50, color: '#dddddd', lanes: 1 },
    { type: 'bus', name: '公交车', speed: 0.15, width: 32, height: 60, color: '#2288cc', lanes: 1 },
    { type: 'police', name: '警车', speed: 0.5, width: 30, height: 50, color: '#2244aa', lanes: 1 }
  ];

  const POWERUP_TYPES = [
    { type: 'coin', name: '金币', width: 20, height: 20, color: '#ffdd00', points: 100 },
    { type: 'diamond', name: '钻石', width: 18, height: 18, color: '#00ddff', points: 500 },
    { type: 'shield', name: '护盾', width: 22, height: 22, color: '#44ffaa', duration: 0 },
    { type: 'boost', name: '加速', width: 22, height: 22, color: '#ff44ff', duration: 3000 },
    { type: 'magnet', name: '磁铁', width: 22, height: 22, color: '#ff8844', duration: 5000 },
    { type: 'life', name: '生命', width: 22, height: 22, color: '#ff4444', duration: 0 }
  ];

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;

    switch(type) {
      case 'coin':
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.linearRampToValueAtTime(1200, now + 0.1);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.15);
        osc.start(now); osc.stop(now + 0.15);
        break;
      case 'diamond':
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1000, now);
        osc.frequency.linearRampToValueAtTime(1500, now + 0.15);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
        break;
      case 'crash':
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.linearRampToValueAtTime(50, now + 0.3);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.4);
        osc.start(now); osc.stop(now + 0.4);
        break;
      case 'boost':
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.linearRampToValueAtTime(1200, now + 0.3);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.4);
        osc.start(now); osc.stop(now + 0.4);
        break;
      case 'powerup':
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.linearRampToValueAtTime(900, now + 0.1);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
        break;
      case 'gameover':
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.linearRampToValueAtTime(80, now + 0.8);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0, now + 1.0);
        osc.start(now); osc.stop(now + 1.0);
        break;
      case 'life':
        osc.type = 'sine';
        osc.frequency.setValueAtTime(500, now);
        osc.frequency.linearRampToValueAtTime(800, now + 0.15);
        osc.frequency.linearRampToValueAtTime(1000, now + 0.3);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.35);
        osc.start(now); osc.stop(now + 0.35);
        break;
    }
  }

  let engineOsc = null;
  let engineGain = null;

  function startEngine() {
    if (engineOsc) return;
    engineOsc = audioCtx.createOscillator();
    engineGain = audioCtx.createGain();
    engineOsc.connect(engineGain);
    engineGain.connect(audioCtx.destination);
    engineOsc.type = 'sawtooth';
    engineOsc.frequency.value = 80;
    engineGain.gain.value = 0.03;
    engineOsc.start();
  }

  function updateEngine(speed) {
    if (engineOsc) {
      engineOsc.frequency.value = 60 + speed * 40;
    }
  }

  function stopEngine() {
    if (engineOsc) {
      engineOsc.stop();
      engineOsc = null;
      engineGain = null;
    }
  }

  let gameState = 'menu';
  let paused = false;
  let selectedVehicle = 0;
  let lives = 3;
  let score = 0;
  let distance = 0;
  let currentSpeed = 3;
  let baseSpeed = 3;
  let maxSpeed = 8;
  let playerLane = 1;
  let playerX = LANE_CENTERS[1];
  let targetX = LANE_CENTERS[1];
  let playerY = GAME_HEIGHT - 120;
  let obstacles = [];
  let powerups = [];
  let effects = [];
  let roadOffset = 0;
  let grassOffset = 0;
  let difficultyLevel = 1;
  let shieldActive = false;
  let shieldTimer = 0;
  let boostActive = false;
  let boostTimer = 0;
  let magnetActive = false;
  let magnetTimer = 0;
  let isSliding = false;
  let slideTimer = 0;
  let slideDirection = 0;
  let lastObstacleTime = 0;
  let lastPowerupTime = 0;
  let highScore = 0;
  let bestDistance = 0;
  let totalScore = 0;
  let unlockedVehicles = [true, false, false, false, false];
  let frameCount = 0;
  let invincibleTimer = 0;

  let touchStartX = 0;
  let touchStartY = 0;
  let touchStartTime = 0;

  function loadData() {
    try {
      const data = JSON.parse(localStorage.getItem('pixelRacer_save') || '{}');
      highScore = data.highScore || 0;
      bestDistance = data.bestDistance || 0;
      totalScore = data.totalScore || 0;
      if (data.unlockedVehicles) {
        unlockedVehicles = data.unlockedVehicles;
      }
      checkUnlocks();
    } catch(e) {}
  }

  function saveData() {
    try {
      localStorage.setItem('pixelRacer_save', JSON.stringify({
        highScore, bestDistance, totalScore, unlockedVehicles
      }));
    } catch(e) {}
  }

  function checkUnlocks() {
    for (let i = 1; i < VEHICLE_TYPES.length; i++) {
      if (totalScore >= VEHICLE_TYPES[i].unlockScore) {
        unlockedVehicles[i] = true;
      }
    }
  }

  function initGame() {
    lives = 3;
    score = 0;
    distance = 0;
    currentSpeed = 3;
    baseSpeed = 3;
    playerLane = 1;
    playerX = LANE_CENTERS[1];
    targetX = LANE_CENTERS[1];
    playerY = GAME_HEIGHT - 120;
    obstacles = [];
    powerups = [];
    effects = [];
    roadOffset = 0;
    grassOffset = 0;
    difficultyLevel = 1;
    shieldActive = false;
    shieldTimer = 0;
    boostActive = false;
    boostTimer = 0;
    magnetActive = false;
    magnetTimer = 0;
    isSliding = false;
    slideTimer = 0;
    slideDirection = 0;
    lastObstacleTime = Date.now();
    lastPowerupTime = Date.now();
    frameCount = 0;
    invincibleTimer = 0;
  }

  function spawnObstacle() {
    const now = Date.now();
    const spawnInterval = Math.max(400, 1200 - difficultyLevel * 80);
    if (now - lastObstacleTime < spawnInterval) return;

    lastObstacleTime = now;
    const typeIndex = Math.floor(Math.random() * Math.min(OBSTACLE_TYPES.length, 3 + difficultyLevel));
    const type = OBSTACLE_TYPES[typeIndex];

    if (type.type === 'truck') {
      const lane = Math.floor(Math.random() * 2);
      obstacles.push({
        ...type,
        x: LANE_CENTERS[lane] + LANE_WIDTH / 2,
        y: -60,
        lane: lane,
        active: true
      });
    } else {
      const lane = Math.floor(Math.random() * LANE_COUNT);
      obstacles.push({
        ...type,
        x: LANE_CENTERS[lane],
        y: -60,
        lane: lane,
        active: true,
        laneChangeTimer: type.canChangeLane ? 1000 : 0
      });
    }
  }

  function spawnPowerup() {
    const now = Date.now();
    const spawnInterval = Math.max(1500, 3000 - difficultyLevel * 100);
    if (now - lastPowerupTime < spawnInterval) return;

    lastPowerupTime = now;
    const lane = Math.floor(Math.random() * LANE_COUNT);
    const typeIndex = Math.random() < 0.6 ? 0 : Math.floor(Math.random() * POWERUP_TYPES.length);
    const type = POWERUP_TYPES[typeIndex];

    powerups.push({
      ...type,
      x: LANE_CENTERS[lane],
      y: -30,
      lane: lane,
      active: true,
      bobOffset: Math.random() * Math.PI * 2
    });
  }

  function addEffect(x, y, type, color) {
    effects.push({
      x, y, type, color,
      life: 1.0,
      particles: []
    });
    const effect = effects[effects.length - 1];
    for (let i = 0; i < 12; i++) {
      const angle = (Math.PI * 2 / 12) * i;
      const speed = 2 + Math.random() * 3;
      effect.particles.push({
        x: 0, y: 0,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        size: 2 + Math.random() * 3
      });
    }
  }

  function moveLeft() {
    if (playerLane > 0 && !isSliding) {
      playerLane--;
      targetX = LANE_CENTERS[playerLane];
    }
  }

  function moveRight() {
    if (playerLane < LANE_COUNT - 1 && !isSliding) {
      playerLane++;
      targetX = LANE_CENTERS[playerLane];
    }
  }

  function handleKeyDown(e) {
    if (e.key === 'Escape' && gameState === 'playing') {
      paused = !paused;
      document.getElementById('pauseScreen').style.display = paused ? 'flex' : 'none';
      return;
    }
    if (paused) return;
    if (gameState === 'menu') {
      if (e.key === 'Enter' || e.key === ' ') {
        if (unlockedVehicles[selectedVehicle]) {
          initGame();
          gameState = 'playing';
          startEngine();
          if (audioCtx.state === 'suspended') audioCtx.resume();
        }
      } else if (e.key === 'ArrowLeft' || e.key === 'a') {
        selectedVehicle = (selectedVehicle - 1 + VEHICLE_TYPES.length) % VEHICLE_TYPES.length;
      } else if (e.key === 'ArrowRight' || e.key === 'd') {
        selectedVehicle = (selectedVehicle + 1) % VEHICLE_TYPES.length;
      }
      return;
    }

    if (gameState === 'gameover') {
      if (e.key === 'Enter' || e.key === ' ') {
        gameState = 'menu';
      }
      return;
    }

    if (gameState !== 'playing') return;

    switch(e.key) {
      case 'ArrowLeft': case 'a': case 'A':
        moveLeft();
        break;
      case 'ArrowRight': case 'd': case 'D':
        moveRight();
        break;
      case 'ArrowUp': case 'w': case 'W':
        if (baseSpeed < maxSpeed) baseSpeed += 0.5;
        break;
      case 'ArrowDown': case 's': case 'S':
        if (baseSpeed > 2) baseSpeed -= 0.5;
        break;
    }
  }

  function handleTouchStart(e) {
    e.preventDefault();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const touch = e.touches[0];
    touchStartX = touch.clientX;
    touchStartY = touch.clientY;
    touchStartTime = Date.now();

    if (gameState === 'menu') {
      const rect = canvas.getBoundingClientRect();
      const x = (touch.clientX - rect.left) / (rect.width / GAME_WIDTH);
      const y = (touch.clientY - rect.top) / (rect.height / GAME_HEIGHT);
      if (y > 300 && y < 500) {
        if (x < GAME_WIDTH / 2) {
          selectedVehicle = (selectedVehicle - 1 + VEHICLE_TYPES.length) % VEHICLE_TYPES.length;
        } else {
          selectedVehicle = (selectedVehicle + 1) % VEHICLE_TYPES.length;
        }
      }
      if (y > 500 && y < 580 && unlockedVehicles[selectedVehicle]) {
        initGame();
        gameState = 'playing';
        startEngine();
      }
      return;
    }

    if (gameState === 'gameover') {
      gameState = 'menu';
      return;
    }
  }

  function handleTouchEnd(e) {
    e.preventDefault();
    if (gameState !== 'playing') return;

    const touch = e.changedTouches[0];
    const dx = touch.clientX - touchStartX;
    const dy = touch.clientY - touchStartY;
    const dt = Date.now() - touchStartTime;

    if (dt > 300) return;

    if (Math.abs(dx) > Math.abs(dy)) {
      if (dx > 30) moveRight();
      else if (dx < -30) moveLeft();
    } else {
      if (dy < -30 && baseSpeed < maxSpeed) baseSpeed += 0.5;
      else if (dy > 30 && baseSpeed > 2) baseSpeed -= 0.5;
    }
  }

  document.addEventListener('keydown', handleKeyDown);
  canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
  canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
  canvas.addEventListener('mousedown', (e) => {
    if (audioCtx.state === 'suspended') audioCtx.resume();

    if (gameState === 'menu') {
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) / (rect.width / GAME_WIDTH);
      const y = (e.clientY - rect.top) / (rect.height / GAME_HEIGHT);

      if (y > 300 && y < 400) {
        if (x < GAME_WIDTH / 2) {
          selectedVehicle = (selectedVehicle - 1 + VEHICLE_TYPES.length) % VEHICLE_TYPES.length;
        } else {
          selectedVehicle = (selectedVehicle + 1) % VEHICLE_TYPES.length;
        }
      }

      if (y > 480 && y < 540) {
        if (unlockedVehicles[selectedVehicle]) {
          initGame();
          gameState = 'playing';
          startEngine();
        }
      }
      return;
    }

    if (gameState === 'gameover') {
      gameState = 'menu';
      return;
    }

    if (gameState === 'playing') {
      if (e.pointerType && e.pointerType !== 'mouse') return;
      if (e.clientX < canvas.getBoundingClientRect().left + canvas.getBoundingClientRect().width / 2) {
        moveLeft();
      } else {
        moveRight();
      }
    }
  });

  function updatePlayer(dt) {
    const vehicle = VEHICLE_TYPES[selectedVehicle];
    const handling = vehicle.handling;
    const moveSpeed = 8 * handling;
    const diff = targetX - playerX;

    if (Math.abs(diff) > 1) {
      const lerp = Math.min(0.15 * moveSpeed, 0.85);
      playerX += diff * lerp;
    } else {
      playerX = targetX;
    }

    if (isSliding) {
      slideTimer -= dt;
      playerX += slideDirection * 2;
      if (slideTimer <= 0) {
        isSliding = false;
      }
    }

    playerX = Math.max(ROAD_LEFT + 20, Math.min(ROAD_RIGHT - 20, playerX));

    const speedMult = boostActive ? 1.5 : 1.0;
    currentSpeed = baseSpeed * vehicle.speed * speedMult;
    distance += currentSpeed * dt * 0.01;
    score += Math.floor(currentSpeed * dt * 0.05);

    difficultyLevel = Math.floor(distance / 500) + 1;
    if (baseSpeed < 3 + difficultyLevel * 0.3) {
      baseSpeed = Math.min(maxSpeed, 3 + difficultyLevel * 0.1);
    }
  }

  function updateObstacles(dt) {
    const speed = currentSpeed;
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const obs = obstacles[i];
      obs.y += (speed - obs.speed * speed) * dt * 0.06;

      if (obs.canChangeLane && obs.laneChangeTimer !== undefined) {
        obs.laneChangeTimer -= dt;
        if (obs.laneChangeTimer <= 0) {
          const newLane = Math.floor(Math.random() * LANE_COUNT);
          obs.lane = newLane;
          obs.x = LANE_CENTERS[newLane];
          obs.laneChangeTimer = 800 + Math.random() * 1200;
        }
      }

      if (obs.y > GAME_HEIGHT + 60) {
        obstacles.splice(i, 1);
        continue;
      }

      if (obs.active && invincibleTimer <= 0) {
        const dx = Math.abs(playerX - obs.x);
        const dy = Math.abs(playerY - obs.y);
        const hitW = (vehicle_width() + obs.width) / 2 - 4;
        const hitH = (vehicle_height() + obs.height) / 2 - 4;

        if (dx < hitW && dy < hitH) {
          obs.active = false;

          if (shieldActive) {
            shieldActive = false;
            shieldTimer = 0;
            addEffect(playerX, playerY, 'shield_break', '#44ffaa');
            playSound('powerup');
          } else if (obs.type === 'pothole') {
            lives--;
            invincibleTimer = 1500;
            addEffect(playerX, playerY, 'crash', '#ff4444');
            playSound('crash');
          } else if (obs.type === 'oil') {
            isSliding = true;
            slideTimer = 1500;
            slideDirection = (Math.random() > 0.5 ? 1 : -1);
            addEffect(playerX, playerY, 'slide', '#666666');
            playSound('crash');
          } else {
            lives--;
            invincibleTimer = 1500;
            addEffect(playerX, playerY, 'crash', '#ff4444');
            playSound('crash');
          }

          if (lives <= 0) {
            gameOver();
          }
        }
      }
    }
  }

  function vehicle_width() {
    return VEHICLE_TYPES[selectedVehicle].width;
  }

  function vehicle_height() {
    return VEHICLE_TYPES[selectedVehicle].height;
  }

  function updatePowerups(dt) {
    const speed = currentSpeed;
    for (let i = powerups.length - 1; i >= 0; i--) {
      const pu = powerups[i];
      pu.y += speed * dt * 0.06;

      if (magnetActive && pu.type === 'coin') {
        const dx = playerX - pu.x;
        const dy = playerY - pu.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 150) {
          pu.x += dx * 0.1;
          pu.y += dy * 0.1;
        }
      }

      if (pu.y > GAME_HEIGHT + 30) {
        powerups.splice(i, 1);
        continue;
      }

      if (pu.active) {
        const dx = Math.abs(playerX - pu.x);
        const dy = Math.abs(playerY - pu.y);
        const hitW = (vehicle_width() + pu.width) / 2 + 5;
        const hitH = (vehicle_height() + pu.height) / 2 + 5;

        if (dx < hitW && dy < hitH) {
          pu.active = false;
          powerups.splice(i, 1);

          switch(pu.type) {
            case 'coin':
              score += pu.points;
              addEffect(pu.x, pu.y, 'collect', '#ffdd00');
              playSound('coin');
              break;
            case 'diamond':
              score += pu.points;
              addEffect(pu.x, pu.y, 'collect', '#00ddff');
              playSound('diamond');
              break;
            case 'shield':
              shieldActive = true;
              shieldTimer = 10000;
              addEffect(pu.x, pu.y, 'powerup', '#44ffaa');
              playSound('powerup');
              break;
            case 'boost':
              boostActive = true;
              boostTimer = pu.duration;
              addEffect(pu.x, pu.y, 'powerup', '#ff44ff');
              playSound('boost');
              break;
            case 'magnet':
              magnetActive = true;
              magnetTimer = pu.duration;
              addEffect(pu.x, pu.y, 'powerup', '#ff8844');
              playSound('powerup');
              break;
            case 'life':
              lives = Math.min(lives + 1, 5);
              addEffect(pu.x, pu.y, 'powerup', '#ff4444');
              playSound('life');
              break;
          }
        }
      }
    }
  }

  function updateEffects(dt) {
    for (let i = effects.length - 1; i >= 0; i--) {
      const eff = effects[i];
      eff.life -= dt * 0.002;
      for (const p of eff.particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.95;
        p.vy *= 0.95;
      }
      if (eff.life <= 0) {
        effects.splice(i, 1);
      }
    }
  }

  function updateTimers(dt) {
    if (shieldTimer > 0) {
      shieldTimer -= dt;
      if (shieldTimer <= 0) shieldActive = false;
    }
    if (boostTimer > 0) {
      boostTimer -= dt;
      if (boostTimer <= 0) boostActive = false;
    }
    if (magnetTimer > 0) {
      magnetTimer -= dt;
      if (magnetTimer <= 0) magnetActive = false;
    }
    if (invincibleTimer > 0) {
      invincibleTimer -= dt;
    }
  }

  function gameOver() {
    gameState = 'gameover';
    stopEngine();
    playSound('gameover');

    totalScore += score;
    if (score > highScore) highScore = score;
    if (distance > bestDistance) bestDistance = Math.floor(distance);
    checkUnlocks();
    saveData();
  }

  function drawRoad() {
    ctx.fillStyle = '#2d5a1e';
    ctx.fillRect(0, 0, ROAD_LEFT, GAME_HEIGHT);
    ctx.fillRect(ROAD_RIGHT, 0, GAME_WIDTH - ROAD_RIGHT, GAME_HEIGHT);

    grassOffset = (grassOffset + currentSpeed * 0.5) % 20;
    ctx.fillStyle = '#3a6b28';
    for (let y = -20 + grassOffset; y < GAME_HEIGHT; y += 20) {
      ctx.fillRect(0, y, ROAD_LEFT, 10);
      ctx.fillRect(ROAD_RIGHT, y, GAME_WIDTH - ROAD_RIGHT, 10);
    }

    ctx.fillStyle = '#444444';
    ctx.fillRect(ROAD_LEFT, 0, ROAD_WIDTH, GAME_HEIGHT);

    ctx.fillStyle = '#555555';
    ctx.fillRect(ROAD_LEFT, 0, 4, GAME_HEIGHT);
    ctx.fillRect(ROAD_RIGHT - 4, 0, 4, GAME_HEIGHT);

    roadOffset = (roadOffset + currentSpeed * 2) % 40;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.setLineDash([20, 20]);
    ctx.lineDashOffset = -roadOffset;

    for (let i = 1; i < LANE_COUNT; i++) {
      const x = ROAD_LEFT + LANE_WIDTH * i;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, GAME_HEIGHT);
      ctx.stroke();
    }
    ctx.setLineDash([]);

    ctx.fillStyle = '#666666';
    for (let y = -40 + roadOffset * 2; y < GAME_HEIGHT; y += 80) {
      ctx.fillRect(ROAD_LEFT - 8, y, 8, 40);
      ctx.fillRect(ROAD_RIGHT, y, 8, 40);
    }
  }

  function drawVehicle(x, y, vehicle, alpha) {
    const w = vehicle.width;
    const h = vehicle.height;
    const a = alpha || 1.0;

    ctx.globalAlpha = a;
    ctx.fillStyle = vehicle.color;
    ctx.fillRect(x - w/2, y - h/2, w, h);

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x - w/2 + 4, y - h/2 + 4, w - 8, 12);

    ctx.fillStyle = '#333333';
    ctx.fillRect(x - w/2 - 3, y - h/2 + 8, 4, 14);
    ctx.fillRect(x + w/2 - 1, y - h/2 + 8, 4, 14);
    ctx.fillRect(x - w/2 - 3, y + h/2 - 22, 4, 14);
    ctx.fillRect(x + w/2 - 1, y + h/2 - 22, 4, 14);

    ctx.fillStyle = '#ff4444';
    ctx.fillRect(x - w/2 + 2, y + h/2 - 6, 6, 4);
    ctx.fillRect(x + w/2 - 8, y + h/2 - 6, 6, 4);

    ctx.globalAlpha = 1.0;

    if (shieldActive) {
      ctx.strokeStyle = '#44ffaa';
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.5 + Math.sin(frameCount * 0.1) * 0.3;
      ctx.beginPath();
      ctx.arc(x, y, Math.max(w, h) / 2 + 8, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1.0;
    }

    if (boostActive) {
      ctx.fillStyle = '#ff44ff';
      ctx.globalAlpha = 0.6;
      for (let i = 0; i < 3; i++) {
        const bx = x + (Math.random() - 0.5) * w;
        const by = y + h/2 + Math.random() * 10;
        ctx.fillRect(bx - 2, by, 4, 8);
      }
      ctx.globalAlpha = 1.0;
    }
  }

  function drawObstacle(obs) {
    ctx.fillStyle = obs.color;
    ctx.fillRect(obs.x - obs.width/2, obs.y - obs.height/2, obs.width, obs.height);

    if (obs.type === 'car' || obs.type === 'van' || obs.type === 'bus' || obs.type === 'police') {
      ctx.fillStyle = '#aaddff';
      ctx.fillRect(obs.x - obs.width/2 + 3, obs.y - obs.height/2 + 3, obs.width - 6, 10);

      ctx.fillStyle = '#ff4444';
      ctx.fillRect(obs.x - obs.width/2 + 2, obs.y + obs.height/2 - 5, 5, 3);
      ctx.fillRect(obs.x + obs.width/2 - 7, obs.y + obs.height/2 - 5, 5, 3);
    }

    if (obs.type === 'police') {
      ctx.fillStyle = frameCount % 20 < 10 ? '#ff0000' : '#0000ff';
      ctx.fillRect(obs.x - 6, obs.y - obs.height/2 - 4, 5, 4);
      ctx.fillRect(obs.x + 1, obs.y - obs.height/2 - 4, 5, 4);
    }

    if (obs.type === 'barrier') {
      ctx.fillStyle = '#ffcc00';
      for (let i = 0; i < 3; i++) {
        ctx.fillRect(obs.x - obs.width/2 + i * 14, obs.y - obs.height/2, 8, obs.height);
      }
    }

    if (obs.type === 'pothole') {
      ctx.fillStyle = '#111111';
      ctx.beginPath();
      ctx.ellipse(obs.x, obs.y, obs.width/2, obs.height/2, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    if (obs.type === 'oil') {
      ctx.fillStyle = '#333333';
      ctx.beginPath();
      ctx.arc(obs.x, obs.y, obs.width/2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#555555';
      ctx.beginPath();
      ctx.arc(obs.x - 3, obs.y - 3, 4, 0, Math.PI * 2);
      ctx.fill();
    }

    if (obs.type === 'cone') {
      ctx.fillStyle = '#ff6600';
      ctx.beginPath();
      ctx.moveTo(obs.x, obs.y - obs.height/2);
      ctx.lineTo(obs.x - obs.width/2, obs.y + obs.height/2);
      ctx.lineTo(obs.x + obs.width/2, obs.y + obs.height/2);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(obs.x - 4, obs.y, 8, 4);
    }

    if (obs.type === 'moto') {
      ctx.fillStyle = obs.color;
      ctx.fillRect(obs.x - 4, obs.y - obs.height/2, 8, obs.height);
      ctx.fillStyle = '#333333';
      ctx.beginPath();
      ctx.arc(obs.x, obs.y - obs.height/2 + 5, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(obs.x, obs.y + obs.height/2 - 5, 5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawPowerup(pu) {
    const bob = Math.sin(frameCount * 0.08 + pu.bobOffset) * 3;
    const y = pu.y + bob;

    ctx.fillStyle = pu.color;
    ctx.globalAlpha = 0.8 + Math.sin(frameCount * 0.1) * 0.2;

    if (pu.type === 'coin') {
      ctx.beginPath();
      ctx.arc(pu.x, y, pu.width/2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#cc9900';
      ctx.font = 'bold 12px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('$', pu.x, y);
    } else if (pu.type === 'diamond') {
      ctx.beginPath();
      ctx.moveTo(pu.x, y - pu.height/2);
      ctx.lineTo(pu.x + pu.width/2, y);
      ctx.lineTo(pu.x, y + pu.height/2);
      ctx.lineTo(pu.x - pu.width/2, y);
      ctx.closePath();
      ctx.fill();
    } else if (pu.type === 'shield') {
      ctx.beginPath();
      ctx.arc(pu.x, y, pu.width/2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 14px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('S', pu.x, y);
    } else if (pu.type === 'boost') {
      ctx.beginPath();
      ctx.arc(pu.x, y, pu.width/2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 14px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('B', pu.x, y);
    } else if (pu.type === 'magnet') {
      ctx.beginPath();
      ctx.arc(pu.x, y, pu.width/2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 14px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('M', pu.x, y);
    } else if (pu.type === 'life') {
      ctx.beginPath();
      ctx.arc(pu.x, y, pu.width/2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 14px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('+', pu.x, y);
    }

    ctx.globalAlpha = 1.0;
  }

  function drawEffects() {
    for (const eff of effects) {
      ctx.globalAlpha = eff.life;
      for (const p of eff.particles) {
        ctx.fillStyle = eff.color;
        ctx.fillRect(eff.x + p.x - p.size/2, eff.y + p.y - p.size/2, p.size, p.size);
      }
    }
    ctx.globalAlpha = 1.0;
  }

  function drawHUD() {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, GAME_WIDTH, 40);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';

    ctx.fillText('分数: ' + score, 10, 20);
    ctx.fillText('距离: ' + Math.floor(distance) + 'm', 130, 20);

    ctx.textAlign = 'right';
    for (let i = 0; i < lives; i++) {
      ctx.fillStyle = '#ff4444';
      ctx.fillRect(GAME_WIDTH - 20 - i * 18, 10, 14, 14);
      ctx.fillStyle = '#ff8888';
      ctx.fillRect(GAME_WIDTH - 18 - i * 18, 12, 4, 4);
    }

    if (shieldActive) {
      ctx.fillStyle = '#44ffaa';
      ctx.textAlign = 'center';
      ctx.fillText('护盾', GAME_WIDTH / 2 - 60, 20);
    }
    if (boostActive) {
      ctx.fillStyle = '#ff44ff';
      ctx.textAlign = 'center';
      ctx.fillText('加速', GAME_WIDTH / 2, 20);
    }
    if (magnetActive) {
      ctx.fillStyle = '#ff8844';
      ctx.textAlign = 'center';
      ctx.fillText('磁铁', GAME_WIDTH / 2 + 60, 20);
    }

    ctx.fillStyle = '#888888';
    ctx.font = '12px monospace';
    ctx.textAlign = 'right';
    ctx.fillText('速度: ' + currentSpeed.toFixed(1), GAME_WIDTH - 10, GAME_HEIGHT - 10);
  }

  function drawMenu() {
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

    ctx.fillStyle = '#333355';
    for (let i = 0; i < 20; i++) {
      const x = (i * 37 + frameCount * 0.5) % GAME_WIDTH;
      const y = (i * 53 + frameCount * 0.3) % GAME_HEIGHT;
      ctx.fillRect(x, y, 2, 2);
    }

    ctx.fillStyle = '#ffaa00';
    ctx.font = 'bold 48px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('像素赛车', GAME_WIDTH / 2, 100);

    ctx.fillStyle = '#888888';
    ctx.font = '16px monospace';
    ctx.fillText('PIXEL RACER', GAME_WIDTH / 2, 140);

    ctx.fillStyle = '#ffffff';
    ctx.font = '20px monospace';
    ctx.fillText('选择车辆', GAME_WIDTH / 2, 250);

    const vehicle = VEHICLE_TYPES[selectedVehicle];
    const unlocked = unlockedVehicles[selectedVehicle];

    ctx.fillStyle = unlocked ? '#44ff44' : '#ff4444';
    ctx.font = 'bold 24px monospace';
    ctx.fillText(vehicle.name, GAME_WIDTH / 2, 320);

    ctx.fillStyle = unlocked ? '#aaaaaa' : '#666666';
    ctx.font = '14px monospace';
    const speedStars = Math.min(Math.round(vehicle.speed * 3), 3);
    const handlingStars = Math.min(Math.round(vehicle.handling * 3), 3);
    ctx.fillText('速度: ' + '★'.repeat(speedStars) + '☆'.repeat(3 - speedStars), GAME_WIDTH / 2, 360);
    ctx.fillText('操控: ' + '★'.repeat(handlingStars) + '☆'.repeat(3 - handlingStars), GAME_WIDTH / 2, 385);

    if (!unlocked) {
      ctx.fillStyle = '#ff8844';
      ctx.font = '16px monospace';
      ctx.fillText('累计 ' + vehicle.unlockScore + ' 分解锁', GAME_WIDTH / 2, 420);
      ctx.fillText('当前: ' + totalScore, GAME_WIDTH / 2, 445);
    }

    drawVehicle(GAME_WIDTH / 2, 470, vehicle, unlocked ? 1.0 : 0.3);

    ctx.fillStyle = '#888888';
    ctx.font = '14px monospace';
    ctx.fillText('← → 选择', GAME_WIDTH / 2, 510);

    if (unlocked) {
      ctx.fillStyle = '#ffdd00';
      ctx.font = 'bold 20px monospace';
      const pulse = 0.8 + Math.sin(frameCount * 0.05) * 0.2;
      ctx.globalAlpha = pulse;
      ctx.fillText('按 ENTER 开始', GAME_WIDTH / 2, 560);
      ctx.globalAlpha = 1.0;
    }

    ctx.fillStyle = '#666666';
    ctx.font = '12px monospace';
    ctx.fillText('最高分: ' + highScore, GAME_WIDTH / 2, 620);
    ctx.fillText('最远距离: ' + bestDistance + 'm', GAME_WIDTH / 2, 640);

    ctx.fillStyle = '#555555';
    ctx.font = '11px monospace';
    ctx.fillText('← → 或 A/D 换道 | ↑ ↓ 加减速', GAME_WIDTH / 2, 680);
  }

  function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.8)';
    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

    ctx.fillStyle = '#ff4444';
    ctx.font = 'bold 40px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('GAME OVER', GAME_WIDTH / 2, 200);

    ctx.fillStyle = '#ffffff';
    ctx.font = '20px monospace';
    ctx.fillText('分数: ' + score, GAME_WIDTH / 2, 280);
    ctx.fillText('距离: ' + Math.floor(distance) + 'm', GAME_WIDTH / 2, 310);

    if (score >= highScore) {
      ctx.fillStyle = '#ffdd00';
      ctx.font = 'bold 18px monospace';
      ctx.fillText('新纪录!', GAME_WIDTH / 2, 350);
    }

    ctx.fillStyle = '#888888';
    ctx.font = '16px monospace';
    ctx.fillText('最高分: ' + highScore, GAME_WIDTH / 2, 390);
    ctx.fillText('最远距离: ' + bestDistance + 'm', GAME_WIDTH / 2, 415);

    ctx.fillStyle = '#aaaaaa';
    ctx.font = '14px monospace';
    ctx.fillText('累计总分: ' + totalScore, GAME_WIDTH / 2, 450);

    ctx.fillStyle = '#ffdd00';
    ctx.font = '18px monospace';
    const pulse = 0.8 + Math.sin(frameCount * 0.05) * 0.2;
    ctx.globalAlpha = pulse;
    ctx.fillText('按 ENTER 返回', GAME_WIDTH / 2, 520);
    ctx.globalAlpha = 1.0;
  }

  let lastTime = 0;

  function gameLoop(timestamp) {
    const dt = lastTime ? Math.min(timestamp - lastTime, 50) : 16;
    lastTime = timestamp;
    frameCount++;

    if (gameState === 'menu') {
      drawMenu();
    } else if (gameState === 'playing') {
      if (!paused) {
        updatePlayer(dt);
        updateTimers(dt);
        spawnObstacle();
        spawnPowerup();
        updateObstacles(dt);
        updatePowerups(dt);
        updateEffects(dt);
        updateEngine(currentSpeed);
      }

      drawRoad();
      for (const obs of obstacles) drawObstacle(obs);
      for (const pu of powerups) drawPowerup(pu);

      if (invincibleTimer > 0 && frameCount % 6 < 3) {
        drawVehicle(playerX, playerY, VEHICLE_TYPES[selectedVehicle], 0.3);
      } else {
        drawVehicle(playerX, playerY, VEHICLE_TYPES[selectedVehicle]);
      }

      drawEffects();
      drawHUD();
    } else if (gameState === 'gameover') {
      drawRoad();
      for (const obs of obstacles) drawObstacle(obs);
      for (const pu of powerups) drawPowerup(pu);
      drawVehicle(playerX, playerY, VEHICLE_TYPES[selectedVehicle], 0.5);
      drawEffects();
      drawGameOver();
    }

    requestAnimationFrame(gameLoop);
  }

  document.getElementById('startBtn').onclick = function() {
    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('pauseBtn').style.display = 'block';
    initGame();
    gameState = 'playing';
    startEngine();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  };
  document.getElementById('pauseBtn').onclick = function() { if (gameState === 'playing') { paused = true; document.getElementById('pauseScreen').style.display = 'flex'; } };
  document.getElementById('resumeBtn').onclick = function() { paused = false; document.getElementById('pauseScreen').style.display = 'none'; };
  document.getElementById('restartBtn').onclick = function() { location.reload(); };

  loadData();
  requestAnimationFrame(gameLoop);

})();


// ===== 游戏工坊统一广告系统 =====
const GameMonetize = {
	adsterra: { enabled: !/localhost|127\.0\.0\.1/.test(location.hostname) },
	sponsor: { enabled: true, wechatQR: '', alipayQR: '' },
	interstitial: { enabled: true, cooldownMs: 180000, gameCount: 2 },
	_lastInterTime: 0, _deathCount: 0,
	_gameOverDetected: false,
	init() {
		const banner = document.getElementById('adBanner');
		if (banner && this.adsterra.enabled) {
			const s1 = document.createElement('script');
			s1.src = 'https://pl29544740.effectivecpmnetwork.com/de/26/0e/de260e17b6a348e3489772a87b1cedf1.js';
			s1.async = true;
			banner.appendChild(s1);
		}
		const spBtn = document.getElementById('sponsorBtn');
		const spPanel = document.getElementById('sponsorPanel');
		const spClose = document.getElementById('sponsorClose');
		if (spBtn && spPanel && spClose && this.sponsor.enabled) {
			spBtn.onclick = () => { spPanel.style.display = 'flex'; spPanel.style.pointerEvents = 'auto'; };
			spClose.onclick = () => { spPanel.style.display = 'none'; spPanel.style.pointerEvents = 'none'; };
			spPanel.onclick = (e) => { if (e.target === spPanel) { spPanel.style.display = 'none'; spPanel.style.pointerEvents = 'none'; } };
		} else if (spBtn) { spBtn.style.display = 'none'; }
		const skipBtn = document.getElementById('skipInterstitial');
		const interstitial = document.getElementById('interstitialAd');
		if (skipBtn && interstitial) {
			skipBtn.onclick = () => {
				interstitial.style.display = 'none'; interstitial.style.pointerEvents = 'none';
				if (this._reviveCallback) { const cb = this._reviveCallback; this._reviveCallback = null; cb(); }
			};
		}
		// 自动检测游戏结束状态
		this._startGameOverWatcher();
	},
	_startGameOverWatcher() {
		// 检测#restartBtn或包含"重新开始"/"再来一局"的按钮变为可见
		const checkGameOver = () => {
			if (this._gameOverDetected) return;
			// 方法1: 检测#restartBtn可见
			const restartBtn = document.getElementById('restartBtn');
			if (restartBtn && restartBtn.offsetParent !== null && getComputedStyle(restartBtn).display !== 'none') {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
			// 方法2: 检测#gameOverScreen可见
			const goScreen = document.getElementById('gameOverScreen');
			if (goScreen && getComputedStyle(goScreen).display !== 'none') {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
			// 方法3: 检测screen-gameover可见
			const goScreen2 = document.getElementById('screen-gameover');
			if (goScreen2 && !goScreen2.classList.contains('hidden')) {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
		};
		// 每500ms检查一次
		this._goInterval = setInterval(() => {
			checkGameOver();
			// 如果检测到了，等2秒后重置标志，允许下次检测
			if (this._gameOverDetected) {
				setTimeout(() => { this._gameOverDetected = false; }, 2000);
			}
		}, 500);
	},
	requestRevive(callback) {
		this._reviveCallback = callback || null;
		const el = document.getElementById('interstitialAd');
		if (!el) { if (callback) callback(); return; }
		const s2 = document.createElement('script');
		s2.src = 'https://pl29544742.effectivecpmnetwork.com/be/a9/6d/bea96d779c0ee07c2b15613852dd3e70.js';
		s2.async = true;
		document.getElementById('interstitialAdSlot').innerHTML = '';
		document.getElementById('interstitialAdSlot').appendChild(s2);
		el.style.display = 'flex'; el.style.pointerEvents = 'auto';

		setTimeout(() => { const slot = document.getElementById('interstitialAdSlot'); if (slot && slot.innerHTML.includes('加载中')) { slot.innerHTML = '<div style=color:#aaa;font:13px Microsoft YaHei,sans-serif>广告暂时无法加载<br>点击下方按钮继续</div>'; } }, 3000);
		const skipBtn = document.getElementById('skipInterstitial');
		if (skipBtn) {
			skipBtn.textContent = '5 秒后可跳过'; skipBtn.disabled = true;
			let cd = 5;
			const timer = setInterval(() => {
				cd--;
				if (cd <= 0) { clearInterval(timer); skipBtn.textContent = '跳过广告 ▶'; skipBtn.disabled = false; }
				else { skipBtn.textContent = cd + ' 秒后可跳过'; }
			}, 1000);
		}
	},
	onGameOver() {
		this._deathCount++;
		if (!this.interstitial.enabled) return;
		if (this._deathCount < this.interstitial.gameCount) return;
		if (Date.now() - this._lastInterTime < this.interstitial.cooldownMs) return;
		this._lastInterTime = Date.now(); this._deathCount = 0;
		this.requestRevive(null);
	},
};
GameMonetize.init();
</script>
