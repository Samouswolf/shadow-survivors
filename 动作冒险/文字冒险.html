        // 触屏支持
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', function(e) { e.preventDefault(); this.classList.add('active'); });
            btn.addEventListener('touchend', function(e) { e.preventDefault(); this.classList.remove('active'); this.click(); });
        });
        
        // 加载界面
        window.addEventListener('load', function() {
            const loading = document.createElement('div');
            loading.id = 'game-loading';
            loading.style.cssText = 'position:fixed;inset:0;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;color:white;font-size:18px';
            loading.innerHTML = '<div style="width:50px;height:50px;border:4px solid #f5576c;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;"></div><div style="margin-top:20px;">加载中...</div>';
            document.head.insertAdjacentHTML('beforeend', '<style>@keyframes spin {to{transform:rotate(360deg)}}</style>');
            document.body.appendChild(loading);
            setTimeout(() => { loading.style.display = 'none'; }, 500);
        });
        
        // 游戏结束处理
        function gameOver() {
            console.log("游戏结束");
        }
        
        // 音效支持
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq = 440, duration = 0.1) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }
        </script>

<script>
// ==================== 粒子系统 ====================
(function(){
  var c=document.getElementById('particles'),ctx=c.getContext('2d'),w,h,ps=[];
  function resize(){w=c.width=window.innerWidth;h=c.height=window.innerHeight}
  resize();window.addEventListener('resize',resize);
  for(var i=0;i<40;i++)ps.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.5+0.5,vx:(Math.random()-0.5)*0.3,vy:(Math.random()-0.5)*0.3-0.2,o:Math.random()*0.5+0.1});
  function draw(){
    ctx.clearRect(0,0,w,h);
    for(var i=0;i<ps.length;i++){
      var p=ps[i];
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle='rgba(201,169,110,'+p.o+')';ctx.fill();
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0)p.x=w;if(p.x>w)p.x=0;
      if(p.y<0)p.y=h;if(p.y>h)p.y=0;
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

// ==================== 故事数据 ====================

    id:'s0', scene:'序章', mood:'bg-dawn', chapter:'废墟初醒',
    text:[
      {t:'narration',c:'<span class="highlight">天元十七年，秋。</span>'},
      {t:'narration',c:'你在一片废墟中醒来。'},
      {t:'narration',c:'头痛欲裂，记忆支离破碎。眼前是烧焦的断壁残垣，空气中弥漫着血腥与灰烬的味道。'},
      {t:'narration',c:'你挣扎着起身，发现身边散落着七八具尸体——他们都穿着与你相同的青色长袍。'},
      {t:'thought',c:'（这些人是……我的同门？）'},
      {t:'narration',c:'一阵风吹过，废墟中的灰烬扬起。你注意到不远处，一柄古剑斜插在碎石之中，剑身泛着幽蓝的微光。'},
      {t:'narration',c:'剑旁，一封染血的信件半埋在灰烬里。'},
      {t:'system-msg',c:'—— 你本能地感到，这柄剑与这封信，将决定你的命运 ——'}
    ],
    choices:[
      {text:'📜 先读那封信',next:'s1_letter',icon:'📜'},
      {text:'⚔ 先拔起那柄剑',next:'s2_sword',icon:'⚔'},
    ]
  },
  s1_letter: {
    id:'s1_letter', scene:'第一章', mood:'bg-dawn', chapter:'遗书真相',
    text:[
      {t:'narration',c:'你颤抖着捡起那封信。信封上写着：<span class="highlight">"青云剑派弟子亲启"</span>。'},
      {t:'dialogue',c:'"吾儿，当你读到这封信时，青云剑派已然覆灭。"'},
      {t:'dialogue',c:'"灭门之祸，非天灾，乃人祸。朝中有人容不下我们。但我青云剑派世代守护的秘密，绝不能落入他们手中。"'},
      {t:'dialogue',c:'"你身边那柄剑，名为<span class="highlight">『噬魂』</span>。它封印着上古魔魂，可毁天灭地，亦能吞噬持剑者的心智。"'},
      {t:'dialogue',c:'"切记：剑是凶器，剑术是杀人之术。无论用多么华丽的辞藻修饰，这就是事实。但剑，也能守护。选择在你。"'},
      {t:'narration',c:'信的最后，署名是——<span class="highlight">青云剑派掌门，你的父亲</span>。'},
      {t:'narration',c:'泪水模糊了你的视线。原来你不是孤儿，你有一个家，只是它在你记起之前，就已化为灰烬。'},
      {t:'thought',c:'（父亲……我该怎么做？）'},
    ],
    choices:[
      {text:'🔪 带着噬魂剑下山，为父报仇',next:'s3_revenge',icon:'🔪'},
      {text:'🛡 寻找封印魔魂的方法，阻止更大的灾难',next:'s4_seal',icon:'🛡'},
    ]
  },
  s2_sword: {
    id:'s2_sword', scene:'第一章', mood:'bg-blood', chapter:'剑中魔魂',
    text:[
      {t:'narration',c:'你的手握住剑柄的瞬间，一股冰冷的力量从剑身涌入你的体内。'},
      {t:'narration',c:'眼前的世界瞬间变了颜色——天空暗红，大地龟裂，你的意识被拉入了一个黑暗的空间。'},
      {t:'dialogue',c:'"呵呵……终于有人唤醒我了。"'},
      {t:'narration',c:'一个低沉的声音在你脑海中回荡。那不是语言，而是直接在你意识中成形。'},
      {t:'dialogue',c:'"我在此剑中沉睡了三百年。小子，你身上有青云剑派的味道——那群自以为是的卫道士。"'},
      {t:'dialogue',c:'"但你和他们不一样。你心中有恨，有愤怒，有不甘……我能感受到。"'},
      {t:'dialogue',c:'"接受我的力量吧。我可以让你成为天下第一——无人能挡，无人能敌。"'},
      {t:'narration',c:'你感到一股强大的力量在体内涌动，但同时也感到一种深沉的黑暗正在侵蚀你的意识。'},
      {t:'thought',c:'（这力量……太诱人了。但代价是什么？）'},
    ],
    choices:[
      {text:'🔥 接受魔魂的力量，拥抱黑暗',next:'s5_dark',icon:'🔥'},
      {text:'💪 拒绝魔魂，靠自己的力量复仇',next:'s3_revenge',icon:'💪'},
    ]
  },
  s3_revenge: {
    id:'s3_revenge', scene:'第二章', mood:'bg-mountain', chapter:'狭路相逢',
    text:[
      {t:'narration',c:'你带着噬魂剑下山，一路追踪灭门仇人的线索。'},
      {t:'narration',c:'三个月后，你在苍狼岭遇到了一位白发苍苍的老剑客。他坐在路边的石头上，似乎早已在等你。'},
      {t:'dialogue',c:'"年轻人，你手中的剑……是噬魂吧？"'},
      {t:'narration',c:'老剑客的眼神锐利如鹰，但他的声音却带着一丝不易察觉的悲悯。'},
      {t:'dialogue',c:'"我知道你来找谁。但在此之前，我想给你讲一个故事——关于十二年前，青云剑派灭门之夜的故事。"'},
      {t:'narration',c:'他的手按在腰间的剑柄上，但并未拔剑。'},
      {t:'thought',c:'（这个人……知道些什么？但他也可能是仇人之一。）'},
    ],
    choices:[
      {text:'⚔ 拔剑！先下手为强',next:'s6_fight',icon:'⚔'},
      {text:'👂 收起剑，听他把话说完',next:'s7_listen',icon:'👂'},
    ]
  },
  s4_seal: {
    id:'s4_seal', scene:'第二章', mood:'bg-forest', chapter:'隐世高人',
    text:[
      {t:'narration',c:'你决定不急着复仇，而是先寻找封印魔魂的方法。父亲的遗书中提到，青云剑派世代守护的秘密，与一座名为"天机阁"的地方有关。'},
      {t:'narration',c:'经过数月的寻访，你在云雾缭绕的深山中找到了一座破旧的木屋。屋前，一位鹤发童颜的老者正在打坐。'},
      {t:'dialogue',c:'"来者可是青云剑派的遗孤？老朽已等候多时。"'},
      {t:'narration',c:'老者睁开眼，目光如电。他自称"天机子"，是当年青云剑派掌门的故交。'},
      {t:'dialogue',c:'"噬魂剑的封印之法，我可以教你。但此法有三重代价：第一，你需废去所有武功；第二，你需以十年阳寿为引；第三……"'},
      {t:'dialogue',c:'"第三，封印之后，你此生不能再握剑。"'},
      {t:'narration',c:'天机子看着你，等待着你的回答。山风吹过，松涛如海。'},
      {t:'thought',c:'（放弃武功，放弃剑……这代价太大了。但如果不封印，魔魂迟早会吞噬一切。）'},
    ],
    choices:[
      {text:'🙏 拜师学封印之法，不惜代价',next:'s8_master',icon:'🙏'},
      {text:'🔍 怀疑天机子，自己去寻找其他方法',next:'s9_alone',icon:'🔍'},
    ]
  },
  s5_dark: {
    id:'s5_dark', scene:'第二章', mood:'bg-blood', chapter:'魔道之路',
    text:[
      {t:'narration',c:'你接受了魔魂的力量。那一刻，你感到自己的力量暴增数倍。'},
      {t:'narration',c:'魔魂的声音在你脑海中响起，教你运转邪功。你感觉自己的血液在沸腾，筋脉在扩张——然后是前所未有的力量感。'},
      {t:'dialogue',c:'"很好……很好！你的天赋远超我的预期。来吧，让我们让这个世界颤抖。"'},
      {t:'narration',c:'一个月后，你以"剑魔"之名横扫江湖。所到之处，无人能挡。'},
      {t:'narration',c:'但你也发现，自己越来越难以控制杀意。有时候，你甚至不记得自己做过什么。'},
      {t:'narration',c:'一天夜里，你在一座被屠灭的村庄中醒来，手中还握着染血的噬魂剑。你不记得自己来过这里。'},
      {t:'thought',c:'（这些村民……是我杀的？不……是魔魂控制了我？）'},
      {t:'narration',c:'你跪在血泊中，第一次感到了恐惧。不是恐惧死亡，而是恐惧自己。'},
    ],
    choices:[
      {text:'😈 继续修炼，追求更强的力量',next:'ending_demon',icon:'😈'},
      {text:'😢 在关键时刻醒悟，试图摆脱魔魂',next:'s10_redemption',icon:'😢'},
    ]
  },
  s6_fight: {
    id:'s6_fight', scene:'第二章', mood:'bg-blood', chapter:'血战苍狼岭',
    text:[
      {t:'narration',c:'你拔剑出鞘，噬魂剑发出一声低沉的嗡鸣。老剑客叹了口气，缓缓起身。'},
      {t:'dialogue',c:'"果然……还是走到了这一步。"'},
      {t:'narration',c:'剑光交错，金石相击。你们在苍狼岭上激战了整整一个时辰。'},
      {t:'narration',c:'老剑客的剑法精妙绝伦，但噬魂剑的力量太过霸道。在最后一击中，你刺穿了他的胸口。'},
      {t:'dialogue',c:'"咳……你赢了。"老剑客倒下前，从怀中掏出一物，"这是……灭门夜的真相。当年……我是被逼的……"'},
      {t:'narration',c:'你颤抖着打开那卷泛黄的文书。上面记录着：十二年前，朝廷密令江湖各派联手剿灭青云剑派——因为青云剑派掌握了威胁皇权的秘密。'},
      {t:'narration',c:'老剑客不过是奉命行事的小卒。真正的幕后黑手，是当朝宰相——严嵩。'},
      {t:'thought',c:'（我杀错了人……真正的仇人，在朝堂之上。）'},
    ],
    choices:[
      {text:'🔪 继续复仇，杀入京城',next:'ending_demon',icon:'🔪'},
      {text:'🕊 悔悟，停下杀戮之路',next:'s11_repent',icon:'🕊'},
    ]
  },
  s7_listen: {
    id:'s7_listen', scene:'第二章', mood:'bg-mountain', chapter:'真相大白',
    text:[
      {t:'narration',c:'你收起剑，在老剑客对面坐下。他微微点头，眼中闪过一丝赞许。'},
      {t:'dialogue',c:'"年轻人，你很冷静。青云剑派有你这样的传人，掌门在天之灵也会欣慰。"'},
      {t:'narration',c:'老剑客缓缓道来：十二年前，当朝宰相严嵩以"谋反"之名，密令江湖六大派联手剿灭青云剑派。'},
      {t:'dialogue',c:'"我当年也是奉命行事。但那一夜之后，我夜不能寐。那些孩子的哭喊声……至今还在我耳边回响。"'},
      {t:'dialogue',c:'"我退出江湖，在此隐居，就是为了赎罪。我知道有一天，青云剑派的后人一定会来。"'},
      {t:'narration',c:'老剑客从怀中取出一卷地图和一枚令牌。'},
      {t:'dialogue',c:'"这是京城严府的地图，和江湖义士的联络令牌。真正的仇人在朝堂，不在江湖。"'},
      {t:'narration',c:'你接过了地图和令牌。复仇之路，比想象中更加复杂。'},
      {t:'thought',c:'（严嵩……原来真正的仇人是朝廷。这已经不是简单的江湖恩怨了。）'},
    ],
    choices:[
      {text:'🏯 联合江湖义士，对抗朝廷',next:'s12_court',icon:'🏯'},
      {text:'🌿 放下仇恨，保护百姓才是正道',next:'ending_hero',icon:'🌿'},
    ]
  },
  s8_master: {
    id:'s8_master', scene:'第三章', mood:'bg-forest', chapter:'封印之法',
    text:[
      {t:'narration',c:'你跪在天机子面前，三叩九拜。老者露出欣慰的笑容。'},
      {t:'dialogue',c:'"好。青云剑派后继有人，老朽死而无憾。"'},
      {t:'narration',c:'接下来的三个月，天机子倾囊相授。你学会了封印魔魂的秘法，代价是废去所有武功，并折损十年阳寿。'},
      {t:'narration',c:'封印之日，你将噬魂剑插入天机阁的镇魔大阵中。魔魂在剑中咆哮、挣扎，但最终被层层封印压制。'},
      {t:'dialogue',c:'"成了……成了！"天机子老泪纵横，"三百年了，噬魂剑终于被封印。"'},
      {t:'narration',c:'你已武功尽失，面色苍白，仿佛老了十岁。但你的心中却无比平静。'},
      {t:'narration',c:'天机子拍拍你的肩膀："你虽无武功，但你的心，已经是最强的剑。"'},
      {t:'thought',c:'（父亲，我做到了。我没有让噬魂剑为祸人间。）'},
    ],
    choices:[
      {text:'🌅 以自身为封印，守护苍生',next:'ending_hero',icon:'🌅'},
      {text:'📖 寻找其他方法，不完全牺牲自己',next:'s13_other',icon:'📖'},
    ]
  },
  s9_alone: {
    id:'s9_alone', scene:'第三章', mood:'bg-mountain', chapter:'古墓秘辛',
    text:[
      {t:'narration',c:'你不信任天机子，决定靠自己的力量寻找封印之法。经过数月的搜寻，你在青云剑派后山的废墟中，发现了一条通往地下的密道。'},
      {t:'narration',c:'密道尽头，是一座古老的地下墓室。墙壁上刻满了古老的碑文。'},
      {t:'narration',c:'你花了三天三夜解读碑文，终于明白了真相：噬魂剑并非只能封印——它也可以被净化。'},
      {t:'dialogue',c:'碑文记载："噬魂剑乃上古神兵，魔魂乃怨念所化。若有至纯之心，以自身正气为引，可化魔为神。"'},
      {t:'narration',c:'也就是说，你不需要牺牲自己来封印魔魂——你可以用正气净化它，让它从魔剑变为神剑。'},
      {t:'thought',c:'（以正气化魔……这条路，需要一颗纯净无垢的心。我……能做到吗？）'},
    ],
    choices:[
      {text:'🗡 毁掉噬魂剑，一了百了',next:'ending_hermit',icon:'🗡'},
      {text:'✨ 用正气净化魔魂，化剑为神',next:'ending_hero',icon:'✨'},
    ]
  },
  s10_redemption: {
    id:'s10_redemption', scene:'第三章', mood:'bg-blood', chapter:'最后的机会',
    text:[
      {t:'narration',c:'你意识到自己正在被魔魂吞噬。那次屠村之后，你决定不再让魔魂控制自己。'},
      {t:'narration',c:'你找到了一处灵气充沛的古老祭坛——这是你父亲遗书中提到的地方，青云剑派世代守护的圣地。'},
      {t:'dialogue',c:'"不——！你不能这样做！"魔魂在你体内咆哮。'},
      {t:'narration',c:'你开始在祭坛上运转正气心法，与魔魂进行最后的抗争。这是一场在你自己体内的战争。'},
      {t:'narration',c:'每运转一次心法，魔魂就弱一分，但你的身体也承受着巨大的痛苦。'},
      {t:'narration',c:'三天三夜后，你终于将魔魂压制到了极限。但你也已经油尽灯枯。'},
      {t:'thought',c:'（我快撑不住了……但我不能让它再害人……）'},
    ],
    choices:[
      {text:'💀 与魔魂同归于尽，彻底消灭它',next:'ending_sacrifice',icon:'💀'},
      {text:'🔒 用最后的力量封印魔魂，保住性命',next:'ending_hermit',icon:'🔒'},
    ]
  },
  s11_repent: {
    id:'s11_repent', scene:'第三章', mood:'bg-peace', chapter:'赎罪之路',
    text:[
      {t:'narration',c:'你埋葬了老剑客，在他坟前立誓：不再滥杀，用余生赎罪。'},
      {t:'narration',c:'你开始游历江湖，用噬魂剑的力量帮助需要帮助的人。你救过被山贼围困的村庄，替被权贵欺压的百姓出头。'},
      {t:'narration',c:'渐渐地，人们开始称你为"侠客"而非"剑魔"。你用自己的行动，洗刷了噬魂剑的恶名。'},
      {t:'narration',c:'但你知道，真正的仇人——严嵩——还在京城逍遥法外。'},
      {t:'thought',c:'（我不能让父亲和同门白白死去。但复仇的方式，不一定是杀戮。）'},
    ],
    choices:[
      {text:'🏛 重建青云剑派，以正道方式伸张正义',next:'ending_hero',icon:'🏛'},
      {text:'🏔 放下一切，归隐山林',next:'ending_hermit',icon:'🏔'},
    ]
  },
  s12_court: {
    id:'s12_court', scene:'第三章', mood:'bg-gold', chapter:'朝堂之斗',
    text:[
      {t:'narration',c:'你带着老剑客的令牌，联络了江湖上的义士。三个月后，一支由各派高手组成的义军秘密集结在京城郊外。'},
      {t:'narration',c:'你们计划潜入严府，收集严嵩贪赃枉法、残害忠良的罪证，将其公之于众。'},
      {t:'narration',c:'潜入之夜，月黑风高。你凭借噬魂剑的力量，突破了严府的层层守卫。'},
      {t:'narration',c:'在严嵩的书房中，你找到了大量罪证——密信、账本、甚至与敌国勾结的证据。'},
      {t:'dialogue',c:'"够了……这些证据足以让严嵩满门抄斩。"'},
      {t:'narration',c:'就在你准备离开时，严嵩的声音从身后传来——他在等你。'},
      {t:'dialogue',c:'"青云剑派的余孽，你以为拿到证据就能扳倒我？太天真了。"'},
      {t:'narration',c:'严嵩身边，站着数十名大内高手。他早已布下天罗地网。'},
    ],
    choices:[
      {text:'🗡 暗杀严嵩，为民除害',next:'ending_hero',icon:'🗡'},
      {text:'⚔ 正面决战，杀出一条血路',next:'ending_sacrifice',icon:'⚔'},
    ]
  },
  s13_other: {
    id:'s13_other', scene:'第三章', mood:'bg-dawn', chapter:'古籍线索',
    text:[
      {t:'narration',c:'你谢绝了天机子的提议，开始在江湖上寻找其他方法。功夫不负有心人，你在一位老郎中那里找到了一本失传的古籍。'},
      {t:'narration',c:'古籍中记载了一种古老的"化魔诀"——不需要牺牲武功和阳寿，只需要一颗至诚之心。'},
      {t:'dialogue',c:'"化魔诀的核心，是以爱化怨。魔魂因怨而生，唯有至诚之爱，才能化解怨念。"'},
      {t:'narration',c:'你开始修炼化魔诀。每天，你对着噬魂剑讲述自己的故事——关于父亲，关于青云剑派，关于你想守护的东西。'},
      {t:'narration',c:'日子一天天过去，你发现噬魂剑的幽蓝光芒，渐渐转为温暖的金色。'},
      {t:'narration',c:'魔魂不再咆哮，它在倾听。'},
      {t:'thought',c:'（原来……魔魂也只是一个被怨恨困住的灵魂。它需要的不是封印，而是理解。）'},
    ],

// ==================== 游戏状态 ====================
var gameState = {
  currentNode:'s0',
  history:[],
  choices:[],
  isTyping:false,
  typewriterTimer:null,
  startTime:Date.now()
};

// ==================== 打字机效果 ====================
function typewriterText(container, blocks, callback, speed){
  speed = speed || 35;
  var blockIndex = 0;
  var charIndex = 0;
  var currentBlock = null;
  var currentEl = null;
  gameState.isTyping = true;
  document.getElementById('choicesContainer').innerHTML = '';

  function nextBlock(){
    if(blockIndex >= blocks.length){
      gameState.isTyping = false;
      if(callback) callback();
      return;
    }
    var block = blocks[blockIndex];
    currentBlock = document.createElement('div');
    currentBlock.className = 'story-block';
    currentEl = document.createElement('div');
    currentEl.className = block.t;
    currentBlock.appendChild(currentEl);
    container.appendChild(currentBlock);
    charIndex = 0;
    typeChar();
  }

  function typeChar(){
    if(!currentEl || !currentBlock) return;
    var block = blocks[blockIndex];
    if(!block) return;
    var text = block.c;
    // 跳过HTML标签
    if(charIndex === 0){
      currentEl.innerHTML = '';
    }
    if(charIndex < text.length){
      var bracket = false;
      var tagContent = '';
      // 处理HTML标签
      if(text[charIndex] === '<'){
        var closeIdx = text.indexOf('>', charIndex);
        if(closeIdx !== -1){
          tagContent = text.substring(charIndex, closeIdx + 1);
          charIndex = closeIdx + 1;
          bracket = true;
        }
      }
      if(bracket){
        currentEl.innerHTML += tagContent;
      } else {
        currentEl.innerHTML += text[charIndex];
        charIndex++;
      }
      scrollToBottom();
      // 标点符号停顿更长
      var delay = speed;
      if(!bracket && text[charIndex-1] && '。！？…—，；：、'.indexOf(text[charIndex-1]) !== -1) delay = speed * 3;
      else if(!bracket && text[charIndex-1] && '，；：'.indexOf(text[charIndex-1]) !== -1) delay = speed * 2;
      gameState.typewriterTimer = setTimeout(typeChar, delay);
    } else {
      blockIndex++;
      if(blockIndex < blocks.length){
        gameState.typewriterTimer = setTimeout(nextBlock, speed * 4);
      } else {
        gameState.isTyping = false;
        if(callback) callback();
      }
    }
  }

  nextBlock();
}

function skipTypewriter(){
  if(gameState.typewriterTimer){
    clearTimeout(gameState.typewriterTimer);
    gameState.typewriterTimer = null;
  }
  gameState.isTyping = false;
  var container = document.getElementById('storyContainer');
  container.innerHTML = '';
  var scene = STORY[gameState.currentNode];
  if(!scene) return;
  for(var i = 0; i < scene.text.length; i++){
    var block = scene.text[i];
    var div = document.createElement('div');
    div.className = 'story-block';
    var inner = document.createElement('div');
    inner.className = block.t;
    inner.innerHTML = block.c;
    div.appendChild(inner);
    container.appendChild(div);
  }
  scrollToBottom();
  showChoices();
}

function scrollToBottom(){
  var c = document.getElementById('storyContainer');
  setTimeout(function(){ c.scrollTop = c.scrollHeight; }, 20);
}

// ==================== 场景渲染 ====================
function renderScene(nodeId, addToHistory){
  var scene = STORY[nodeId];
  if(!scene) return;

  // 结局
  if(scene.ending){
    showEnding(scene);
    return;
  }

  gameState.currentNode = nodeId;

  if(addToHistory !== false){
    gameState.history.push(nodeId);
  }

  // 更新场景指示器
  var dots = document.querySelectorAll('#sceneIndicator .dot');
  for(var i = 0; i < dots.length; i++) dots[i].classList.remove('active');
  var sceneNum = scene.scene;
  if(sceneNum === '序章') dots[0].classList.add('active');
  else if(sceneNum === '第一章') dots[0].classList.add('active');
  else if(sceneNum === '第二章') dots[1].classList.add('active');
  else if(sceneNum === '第三章') dots[2].classList.add('active');
  document.getElementById('sceneLabel').textContent = scene.scene + ' · ' + scene.chapter;

  // 更新背景
  if(scene.mood){
    document.body.className = scene.mood;
  }

  // 渲染文本
  var container = document.getElementById('storyContainer');
  if(gameState.history.length <= 1){
    container.innerHTML = '';
  }

  typewriterText(container, scene.text, function(){
    showChoices();
  });
}

function showChoices(){
  var scene = STORY[gameState.currentNode];
  if(!scene || !scene.choices) return;
  var container = document.getElementById('choicesContainer');
  container.innerHTML = '';
  for(var i = 0; i < scene.choices.length; i++){
    (function(choice){
      var btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.innerHTML = '<span class="choice-icon">'+choice.icon+'</span>'+choice.text;
      btn.onclick = function(){
        if(gameState.isTyping){
          skipTypewriter();
          return;
        }
        gameState.choices.push(choice.text);
        renderScene(choice.next);
      };
      container.appendChild(btn);
    })(scene.choices[i]);
  }
  scrollToBottom();
}

// ==================== 结局 ====================
function showEnding(scene){
  document.getElementById('choicesContainer').innerHTML = '';
  document.getElementById('endingIcon').textContent = scene.icon;
  document.getElementById('endingTitle').textContent = scene.title;
  document.getElementById('endingSubtitle').textContent = scene.subtitle;
  document.getElementById('endingStats').textContent = scene.stats;
  document.getElementById('endingPanel').classList.add('show');

  // 结局变色
  if(scene.id === 'ending_demon') document.body.className = 'bg-blood';
  else if(scene.id === 'ending_hero') document.body.className = 'bg-gold';
  else if(scene.id === 'ending_hermit') document.body.className = 'bg-peace';
  else document.body.className = 'bg-dawn';

  // 插屏广告
  setTimeout(function(){ showInterstitialAd(); }, 1000);
}

// ==================== 存档系统 ====================
var SAVE_KEY = 'text_adventure_saves';

function getSaves(){
  try{
    var raw = localStorage.getItem(SAVE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}

function setSaves(saves){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(saves)); }catch(e){}
}

function saveGame(slot){
  var saves = getSaves();
  saves[slot] = {
    node: gameState.currentNode,
    history: gameState.history.slice(),
    choices: gameState.choices.slice(),
    time: new Date().toLocaleString('zh-CN'),
    scene: STORY[gameState.currentNode] ? STORY[gameState.currentNode].chapter : ''
  };
  setSaves(saves);
  renderSaveList();
}

function loadGame(slot){
  var saves = getSaves();
  var data = saves[slot];
  if(!data) return;
  if(gameState.typewriterTimer){
    clearTimeout(gameState.typewriterTimer);
    gameState.typewriterTimer = null;
  }
  gameState.currentNode = data.node;
  gameState.history = data.history.slice();
  gameState.choices = data.choices.slice();
  gameState.isTyping = false;
  document.getElementById('storyContainer').innerHTML = '';
  document.getElementById('choicesContainer').innerHTML = '';
  document.getElementById('endingPanel').classList.remove('show');
  var scene = STORY[data.node];
  if(scene && !scene.ending){
    document.body.className = scene.mood || 'bg-dawn';
  }
  closeSaveModal();
  // 快速渲染已读文本
  var container = document.getElementById('storyContainer');
  var sceneData = STORY[data.node];
  if(sceneData && !sceneData.ending){
    for(var i = 0; i < sceneData.text.length; i++){
      var block = sceneData.text[i];
      var div = document.createElement('div');
      div.className = 'story-block';
      var inner = document.createElement('div');
      inner.className = block.t;
      inner.innerHTML = block.c;
      div.appendChild(inner);
      container.appendChild(div);
    }
    showChoices();
  }
}

function deleteSave(slot){
  var saves = getSaves();
  delete saves[slot];
  setSaves(saves);
  renderSaveList();
}

function renderSaveList(){
  var saves = getSaves();
  var list = document.getElementById('saveList');
  var html = '';
  var slots = ['slot1','slot2','slot3','slot4','slot5'];
  for(var i = 0; i < slots.length; i++){
    var s = slots[i];
    var data = saves[s];
    if(data){
      var sceneLabel = STORY[data.node] ? STORY[data.node].chapter : '';
      html += '<div class="save-slot">';
      html += '<div class="slot-info"><div class="slot-name">📁 存档 '+(i+1)+' — '+sceneLabel+'</div><div class="slot-time">'+data.time+'</div></div>';
      html += '<div class="slot-actions">';
      html += '<button class="slot-action save" onclick="saveGame(\''+s+'\')">💾 覆盖</button>';
      html += '<button class="slot-action load" onclick="loadGame(\''+s+'\')">📂 读取</button>';
      html += '<button class="slot-action del" onclick="deleteSave(\''+s+'\')">🗑 删除</button>';
      html += '</div></div>';
    } else {
      html += '<div class="save-slot">';
      html += '<div class="slot-info"><div class="slot-name">📁 存档 '+(i+1)+'</div><div class="slot-time">空</div></div>';
      html += '<div class="slot-actions">';
      html += '<button class="slot-action save" onclick="saveGame(\''+s+'\')">💾 保存</button>';
      html += '</div></div>';
    }
  }
  list.innerHTML = html;
}

function openSaveModal(mode){
  document.getElementById('saveModalTitle').textContent = mode === 'save' ? '💾 存档管理' : '📂 读档管理';
  renderSaveList();
  document.getElementById('saveModal').classList.add('show');
}

function closeSaveModal(){
  document.getElementById('saveModal').classList.remove('show');
}
