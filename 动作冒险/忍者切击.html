<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>忍者切击</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(180deg, #1a1a2e 0%, #0f0f23 100%); min-height: 100vh; overflow: hidden; }
#game-container { position: relative; width: 100%; height: 100vh; }
#game-canvas { display: block; width: 100%; height: 100%; }
#game-ui { position: absolute; top: 20px; left: 20px; color: #fff; font-size: 20px; font-weight: bold; z-index: 10; }
#game-ui span { color: #f43f5e; }
#game-over { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 20; flex-direction: column; align-items: center; justify-content: center; }
#game-over h2 { font-size: 48px; color: #f5576c; margin-bottom: 20px; }
#game-over p { font-size: 24px; color: #fff; margin-bottom: 30px; }
#game-over .btn { padding: 15px 40px; font-size: 20px; background: #f43f5e; color: #fff; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
#start-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#start-screen h1 { font-size: 48px; color: #f43f5e; margin-bottom: 20px; text-shadow: 0 0 20px rgba(244,63,94,0.5); }
#start-screen p { color: #aaa; margin-bottom: 40px; font-size: 16px; }
#start-screen .btn { padding: 18px 50px; font-size: 22px; background: linear-gradient(145deg, #f43f5e, #e11d48); color: #fff; border: none; border-radius: 15px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 20px rgba(244,63,94,0.4); }
.ad-banner-container { position: absolute; bottom: 0; left: 0; width: 100%; padding: 10px; z-index: 10; }
.sponsor-btn { position: fixed; bottom:8px; left:8px; width: 50px; height: 50px; background: rgba(255,165,0,0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; z-index: 100; box-shadow: 0 4px 15px rgba(255,165,0,0.4); }
.sponsor-panel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 200; align-items: center; justify-content: center; }
.sponsor-panel.show { display: flex; }
.sponsor-content { background: #fff; padding: 30px; border-radius: 20px; text-align: center; max-width: 90%; }
.sponsor-content h3 { margin-bottom: 20px; color: #333; }
.sponsor-close { position: absolute; top: 20px; right: 20px; width: 40px; height: 40px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; }

#loading-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a2e; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#loading-screen .loading-icon { width: 60px; height: 60px; border: 4px solid #6366f1; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#loading-screen p { color: #6366f1; margin-top: 20px; font-size: 18px; }
.interstitial-ad { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 999; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
.interstitial-ad .ad-content { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; text-align: center; min-width: 280px; max-width: 400px; }
.interstitial-ad .ad-content p { color: #aaa; font-size: 14px; margin-bottom: 12px; }
.interstitial-ad .skip-btn { padding: 8px 28px; background: rgba(255,215,0,0.15); border: 1px solid rgba(255,215,0,0.3); border-radius: 20px; color: #ffd700; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.2s; }
.interstitial-ad .skip-btn:hover { background: rgba(255,215,0,0.25); }


/* [AD-FIX:responsive] */
@media (max-width:768px){.ad-banner-container{display:none!important}.sponsor-btn{transform:scale(.8);opacity:.6}}
/* [/AD-FIX:responsive] */
</style>
  <!-- [BUGFIX startup-v1] 补全状态机常量 -->
  <script>
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
</head>
<body>
<button id="start-game-btn" type="button" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:20px 40px;font-size:20px;background:#ff6b35;color:white;border:none;border-radius:12px;cursor:pointer;z-index:999;font-weight:bold;font-family:'Microsoft YaHei',sans-serif;">开始游戏</button>
<div id="start-screen">
  <h1>🗡️ 忍者切击</h1>
  <p>滑动屏幕切割目标<br>避开炸弹，挑战最高分！</p>
  <button class="btn" onclick="startGame()">开始游戏</button>
</div>

<div id="game-container">
  <canvas id="game-canvas"></canvas>
  <div id="game-ui">
    分数: <span id="score">0</span> | 连击: <span id="combo">0</span> | 最高: <span id="high-score">0</span>
  </div>
  
  <div id="game-over">
    <h2>💥 游戏结束</h2>
    <p>最终得分: <span id="final-score">0</span></p>
    <button class="btn" onclick="restartGame()">再来一次</button>
  </div>
  
  <div class="ad-banner-container">
    <div style="background:#f0f0f0;height:90px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#666;font-size:14px;">广告位</div>
  </div>
</div>

<div class="sponsor-btn" onclick="showSponsor()">☕</div>

  </div>
  <button class="skip-btn" id="skipInterstitial" onclick="closeInterstitial()">跳过广告</button>
</div>


  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script src="../game_core.js"></script>
<script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script>

// ==================== 游戏说明 ====================
// 操作说明: 使用键盘方向键或触屏控制
// 游戏目标: 获得最高分数
// 存档系统: 自动保存最高分到本地
// ==================== 模块说明 ====================
// 1. 游戏初始化模块 - 初始化Canvas和游戏状态
// 2. 游戏逻辑模块 - 处理玩家移动、碰撞检测
// 3. 渲染模块 - 绘制游戏画面和UI
// 4. 音效模块 - 播放游戏音效
// 5. 存档模块 - 管理最高分记录
// ==================== 配置参数 ====================
const GAME_NAME = '忍者切击';

class GameCore {
  static init(options) {
    if (options.highScore) {
      this.highScoreKey = options.highScore;
    }
  }
  
  static getHighScore() {
    return parseInt(localStorage.getItem(this.highScoreKey)) || 0;
  }
  
  static setHighScore(value) {
    const current = this.getHighScore();
    if (value > current) {
      localStorage.setItem(this.highScoreKey, value);
      return true;
    }
    return false;
  }
}

GameCore.init({ highScore: GAME_NAME });

const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const comboEl = document.getElementById('combo');
const highScoreEl = document.getElementById('high-score');
const finalScoreEl = document.getElementById('final-score');

let gameRunning = false;
let score = 0;
let combo = 0;
let targets = [];
let particles = [];
let slices = [];
let isDrawing = false;
let lastPos = { x: 0, y: 0 };

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function startGame() {
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('game-over').style.display = 'none';
  gameRunning = true;
  score = 0;
  combo = 0;
  targets = [];
  particles = [];
  slices = [];
  
  scoreEl.textContent = '0';
  comboEl.textContent = '0';
  highScoreEl.textContent = GameCore.getHighScore();
  
  gameLoop();
  spawnTarget();
}

function restartGame() {
  startGame();
}

function showSponsor() {
  document.getElementById('sponsor-panel').classList.add('show');
}

function hideSponsor() {
  document.getElementById('sponsor-panel').classList.remove('show');
}

function createParticles(x, y, color) {
  for (let i = 0; i < 8; i++) {
    particles.push({
      x: x,
      y: y,
      vx: (Math.random() - 0.5) * 10,
      vy: (Math.random() - 0.5) * 10,
      size: Math.random() * 5 + 2,
      color: color,
      life: 1
    });
  }
}

function spawnTarget() {
  if (!gameRunning) return;
  
  const types = ['fruit', 'bomb'];
  const weights = [0.85, 0.15];
  let rand = Math.random();
  let type = 'fruit';
  
  for (let i = 0; i < weights.length; i++) {
    rand -= weights[i];
    if (rand <= 0) {
      type = types[i];
      break;
    }
  }
  
  const fruits = ['🍎', '🍊', '🍋', '🍇', '🍓', '🍑', '🍉', '🍌'];
  const colors = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#ec4899', '#f43f5e', '#ef4444', '#eab308'];
  
  const target = {
    x: Math.random() * (canvas.width - 100) + 50,
    y: canvas.height + 50,
    type: type,
    size: type === 'bomb' ? 50 : 45,
    velocityY: -(Math.random() * 3 + 6),
    velocityX: (Math.random() - 0.5) * 4,
    rotation: 0,
    rotationSpeed: (Math.random() - 0.5) * 0.1,
    text: type === 'bomb' ? '💣' : fruits[Math.floor(Math.random() * fruits.length)],
    color: type === 'bomb' ? '#374151' : colors[Math.floor(Math.random() * colors.length)],
    sliced: false
  };
  
  targets.push(target);
  
  setTimeout(spawnTarget, 800 + Math.random() * 500);
}

function update() {
  if (!gameRunning) return;
  
  targets.forEach(target => {
    target.y += target.velocityY;
    target.x += target.velocityX;
    target.rotation += target.rotationSpeed;
    target.velocityY += 0.2;
  });
  
  targets = targets.filter(t => t.y < canvas.height + 100 && !t.sliced);
  
  slices.forEach(slice => {
    slice.life -= 0.03;
  });
  
  slices = slices.filter(s => s.life > 0);
  
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.3;
    p.life -= 0.02;
  });
  
  particles = particles.filter(p => p.life > 0);
}

function checkSlice(x1, y1, x2, y2) {
  targets.forEach(target => {
    if (target.sliced) return;
    
    const dx = target.x - x1;
    const dy = target.y - y1;
    const len = Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
    
    if (len === 0) return;
    
    const t = ((dx * (x2 - x1)) + (dy * (y2 - y1))) / (len * len);
    const nearestX = x1 + t * (x2 - x1);
    const nearestY = y1 + t * (y2 - y1);
    
    const dist = Math.sqrt((target.x - nearestX) ** 2 + (target.y - nearestY) ** 2);
    
    if (dist < target.size) {
      target.sliced = true;
      
      if (target.type === 'bomb') {
        createParticles(target.x, target.y, '#f5576c');
        gameOver();
      } else {
        combo++;
        comboEl.textContent = combo;
        const points = 10 * combo;
        score += points;
        scoreEl.textContent = score;
        createParticles(target.x, target.y, target.color);
        
        slices.push({
          x1: target.x - 30,
          y1: target.y,
          x2: target.x + 30,
          y2: target.y,
          life: 0.5
        });
      }
    }
  });
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  ctx.fillStyle = '#16213e';
  for (let i = 0; i < 50; i++) {
    const x = (i * 43 + Date.now() * 0.01) % canvas.width;
    const y = (i * 57 + Date.now() * 0.02) % canvas.height;
    ctx.fillRect(x, y, 2, 2);
  }
  
  targets.forEach(target => {
    ctx.save();
    ctx.translate(target.x, target.y);
    ctx.rotate(target.rotation);
    
    if (target.type === 'bomb') {
      ctx.fillStyle = target.color;
      ctx.beginPath();
      ctx.arc(0, 0, target.size / 2, 0, Math.PI * 2);
      ctx.fill();
    }
    
    ctx.font = target.size + 'px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(target.text, 0, 0);
    
    ctx.restore();
  });
  
  slices.forEach(slice => {
    ctx.globalAlpha = slice.life;
    ctx.strokeStyle = '#f43f5e';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(slice.x1, slice.y1);
    ctx.lineTo(slice.x2, slice.y2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  });
  
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });
  
  ctx.globalAlpha = 1;
  
  if (isDrawing) {
    ctx.strokeStyle = '#f43f5e';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(lastPos.x, lastPos.y);
    ctx.lineTo(lastPos.x, lastPos.y);
    ctx.stroke();
  }
}

function gameLoop() {
  if (!gameRunning) return;
  
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

function gameOver() {
  gameRunning = false;
  finalScoreEl.textContent = score;
  
  if (GameCore.setHighScore(score)) {
    highScoreEl.textContent = score;
  }
  
  document.getElementById('game-over').style.display = 'flex';
}

canvas.addEventListener('mousedown', (e) => {
  isDrawing = true;
  lastPos = { x: e.clientX, y: e.clientY };
});

canvas.addEventListener('mousemove', (e) => {
  if (!isDrawing || !gameRunning) return;
  
  checkSlice(lastPos.x, lastPos.y, e.clientX, e.clientY);
  lastPos = { x: e.clientX, y: e.clientY };
});

canvas.addEventListener('mouseup', () => {
  isDrawing = false;
});

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  isDrawing = true;
  lastPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
});

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (!isDrawing || !gameRunning) return;
  
  checkSlice(lastPos.x, lastPos.y, e.touches[0].clientX, e.touches[0].clientY);
  lastPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
});

canvas.addEventListener('touchend', () => {
  isDrawing = false;
});

// ==================== 错误处理 ====================
function closeInterstitial() {
  try {
    var el = document.getElementById('interstitialAd');
    if (el) el.style.display = 'none';
  } catch (error) {
    console.error('关闭广告失败:', error);
  }
}

// ==================== 音效支持 ====================
var audioCtx = null;
function initAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch (error) {
    console.warn('音频初始化失败:', error);
  }
}
function playSound(freq, dur, type, vol) {
  try {
    if (!audioCtx) return;
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = type || 'square';
    o.frequency.value = freq;
    g.gain.value = vol || 0.15;
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime + dur);
  } catch (error) {
    console.warn('音效播放失败:', error);
  }
}

// ==================== 页面加载处理 ====================
window.addEventListener('load', function() {
  try {
    var loadingScreen = document.getElementById('loading-screen');
    if (loadingScreen) {
      setTimeout(function() {
        loadingScreen.style.display = 'none';
      }, 1500);
    }
  } catch (error) {
    console.error('加载界面处理失败:', error);
  }
});


// 键盘事件支持
document.addEventListener('keydown', function(e) {
  try {
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      if (typeof startGame === 'function' && !gameRunning) {
        startGame();
      }
    }
  } catch (error) {
    console.error('键盘事件处理失败:', error);
  }
});

</script>
<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
</body>
</html>
