<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>滚球游戏</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #141e30 0%, #243b55 100%); min-height: 100vh; overflow: hidden; }
        .game-container { width: 100%; height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 10px; }
        .stat { display: flex; flex-direction: column; align-items: center; color: #fff; }
        .stat-label { font-size: 12px; opacity: 0.8; }
        .stat-value { font-size: 24px; font-weight: bold; color: #ffd700; }
        
        .canvas-container { flex: 1; position: relative; background: rgba(0,0,0,0.3); border-radius: 15px; overflow: hidden; }
        #gameCanvas { width: 100%; height: 100%; display: block; }
        
        .controls { display: flex; gap: 10px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
        .btn { padding: 12px 25px; border: none; border-radius: 25px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #00b09b, #96c93d); color: #fff; }
        .btn-secondary { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; }
        
        .level-info { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: #fff; padding: 10px; border-radius: 10px; font-size: 12px; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">关卡</div>
                <div class="stat-value" id="level">1</div>
            </div>
            <div class="stat">
                <div class="stat-label">得分</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">最高分</div>
                <div class="stat-value" id="highScore">0</div>
            </div>
        </div>
        
        <div class="canvas-container">
            <canvas id="gameCanvas"></canvas>
            <div class="level-info">
                <div>倾斜设备或拖动控制球</div>
                <div>收集星星，避开障碍</div>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" id="btnRestart">🔄 重新开始</button>
            <button class="btn btn-secondary" id="btnNextLevel">➡️ 下一关</button>
        </div>
        
        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let level = 1;
        let score = 0;
        let highScore = parseInt(localStorage.getItem('highscore_滚球游戏') || '0');
        
        let ball = { x: 0, y: 0, vx: 0, vy: 0, radius: 20 };
        let stars = [];
        let obstacles = [];
        let goal = null;
        let particles = [];
        
        let tiltX = 0;
        let tiltY = 0;
        let dragging = false;
        let dragStartX = 0;
        let dragStartY = 0;
        
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            initLevel();
        }
        
        function initLevel() {
            ball.x = 50;
            ball.y = canvas.height - 50;
            ball.vx = 0;
            ball.vy = 0;
            
            stars = [];
            obstacles = [];
            
            const starCount = 5 + level;
            for (let i = 0; i < starCount; i++) {
                stars.push({
                    x: 100 + Math.random() * (canvas.width - 200),
                    y: 50 + Math.random() * (canvas.height - 150),
                    collected: false
                });
            }
            
            const obstacleCount = 3 + level;
            for (let i = 0; i < obstacleCount; i++) {
                const type = Math.random() > 0.5 ? 'rect' : 'circle';
                if (type === 'rect') {
                    obstacles.push({
                        type: 'rect',
                        x: 100 + Math.random() * (canvas.width - 200),
                        y: 50 + Math.random() * (canvas.height - 150),
                        width: 40 + Math.random() * 60,
                        height: 40 + Math.random() * 60
                    });
                } else {
                    obstacles.push({
                        type: 'circle',
                        x: 100 + Math.random() * (canvas.width - 200),
                        y: 50 + Math.random() * (canvas.height - 150),
                        radius: 20 + Math.random() * 30
                    });
                }
            }
            
            goal = {
                x: canvas.width - 80,
                y: 80,
                radius: 30
            };
        }
        
        function updateBall() {
            // 应用倾斜力
            ball.vx += tiltX * 0.5;
            ball.vy += tiltY * 0.5;
            
            // 重力
            ball.vy += 0.2;
            
            // 摩擦力
            ball.vx *= 0.98;
            ball.vy *= 0.98;
            
            // 速度限制
            const maxSpeed = 10;
            ball.vx = Math.max(-maxSpeed, Math.min(maxSpeed, ball.vx));
            ball.vy = Math.max(-maxSpeed, Math.min(maxSpeed, ball.vy));
            
            ball.x += ball.vx;
            ball.y += ball.vy;
            
            // 边界碰撞
            if (ball.x - ball.radius < 0) {
                ball.x = ball.radius;
                ball.vx *= -0.5;
            }
            if (ball.x + ball.radius > canvas.width) {
                ball.x = canvas.width - ball.radius;
                ball.vx *= -0.5;
            }
            if (ball.y - ball.radius < 0) {
                ball.y = ball.radius;
                ball.vy *= -0.5;
            }
            if (ball.y + ball.radius > canvas.height) {
                ball.y = canvas.height - ball.radius;
                ball.vy *= -0.5;
            }
            
            // 障碍物碰撞
            obstacles.forEach(obs => {
                if (obs.type === 'rect') {
                    if (ball.x + ball.radius > obs.x && 
                        ball.x - ball.radius < obs.x + obs.width &&
                        ball.y + ball.radius > obs.y &&
                        ball.y - ball.radius < obs.y + obs.height) {
                        
                        // 简单反弹
                        const centerX = obs.x + obs.width / 2;
                        const centerY = obs.y + obs.height / 2;
                        
                        if (Math.abs(ball.x - centerX) > Math.abs(ball.y - centerY)) {
                            ball.vx *= -0.5;
                            ball.x = ball.x < centerX ? obs.x - ball.radius : obs.x + obs.width + ball.radius;
                        } else {
                            ball.vy *= -0.5;
                            ball.y = ball.y < centerY ? obs.y - ball.radius : obs.y + obs.height + ball.radius;
                        }
                    }
                } else {
                    const dx = ball.x - obs.x;
                    const dy = ball.y - obs.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < ball.radius + obs.radius) {
                        const angle = Math.atan2(dy, dx);
                        ball.x = obs.x + Math.cos(angle) * (ball.radius + obs.radius);
                        ball.y = obs.y + Math.sin(angle) * (ball.radius + obs.radius);
                        
                        const normalX = Math.cos(angle);
                        const normalY = Math.sin(angle);
                        const dotProduct = ball.vx * normalX + ball.vy * normalY;
                        
                        ball.vx = (ball.vx - 2 * dotProduct * normalX) * 0.5;
                        ball.vy = (ball.vy - 2 * dotProduct * normalY) * 0.5;
                    }
                }
            });
            
            // 收集星星
            stars.forEach(star => {
                if (!star.collected) {
                    const dx = ball.x - star.x;
                    const dy = ball.y - star.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < ball.radius + 15) {
                        star.collected = true;
                        score += 10;
                        createSparkle(star.x, star.y);
                        updateStats();
                    }
                }
            });
            
            // 检查到达终点
            const dx = ball.x - goal.x;
            const dy = ball.y - goal.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            
            if (dist < ball.radius + goal.radius) {
                score += 50;
                level++;
                createSparkle(goal.x, goal.y, 30);
                initLevel();
                updateStats();
            }
        }
        
        function createSparkle(x, y, count = 10) {
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 / count) * i;
                const speed = 2 + Math.random() * 2;
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: 2 + Math.random() * 3,
                    color: '#ffd700',
                    life: 1
                });
            }
        }
        
        function updateParticles() {
            particles = particles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.05;
                p.life -= 0.03;
                return p.life > 0;
            });
        }
        
        function drawBall() {
            ctx.fillStyle = '#4facfe';
            ctx.shadowColor = '#4facfe';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            // 高光
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.beginPath();
            ctx.arc(ball.x - ball.radius * 0.3, ball.y - ball.radius * 0.3, ball.radius * 0.3, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function drawStars() {
            stars.forEach(star => {
                if (!star.collected) {
                    ctx.fillStyle = '#ffd700';
                    ctx.shadowColor = '#ffd700';
                    ctx.shadowBlur = 10;
                    
                    // 绘制星星形状
                    ctx.beginPath();
                    for (let i = 0; i < 5; i++) {
                        const angle = (Math.PI * 2 / 5) * i - Math.PI / 2;
                        const outerX = star.x + Math.cos(angle) * 15;
                        const outerY = star.y + Math.sin(angle) * 15;
                        const innerAngle = angle + Math.PI / 5;
                        const innerX = star.x + Math.cos(innerAngle) * 7;
                        const innerY = star.y + Math.sin(innerAngle) * 7;
                        
                        if (i === 0) ctx.moveTo(outerX, outerY);
                        else ctx.lineTo(outerX, outerY);
                        ctx.lineTo(innerX, innerY);
                    }
                    ctx.closePath();
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            });
        }
        
        function drawObstacles() {
            obstacles.forEach(obs => {
                ctx.fillStyle = '#ff6b6b';
                ctx.shadowColor = '#ff6b6b';
                ctx.shadowBlur = 5;
                
                if (obs.type === 'rect') {
                    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                } else {
                    ctx.beginPath();
                    ctx.arc(obs.x, obs.y, obs.radius, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.shadowBlur = 0;
            });
        }
        
        function drawGoal() {
            ctx.fillStyle = '#96ceb4';
            ctx.shadowColor = '#96ceb4';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(goal.x, goal.y, goal.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            // 旋转光环
            ctx.strokeStyle = 'rgba(150, 206, 180, 0.5)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(goal.x, goal.y, goal.radius + 10, 0, Math.PI * 2);
            ctx.stroke();
        }
        
        function drawParticles() {
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }
        
        function updateStats() {
            document.getElementById('level').textContent = level;
            document.getElementById('score').textContent = score;
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('highscore_滚球游戏', highScore);
            }
            document.getElementById('highScore').textContent = highScore;
        }
        
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 绘制网格背景
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 30) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 30) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
            
            drawGoal();
            drawObstacles();
            drawStars();
            updateBall();
            drawBall();
            
            updateParticles();
            drawParticles();
            
            requestAnimationFrame(gameLoop);
        }
        
        // 鼠标/触摸控制
        canvas.addEventListener('mousedown', e => {
            dragging = true;
            const rect = canvas.getBoundingClientRect();
            dragStartX = e.clientX - rect.left;
            dragStartY = e.clientY - rect.top;
        });
        
        canvas.addEventListener('mousemove', e => {
            if (dragging) {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                tiltX = (x - dragStartX) / 50;
                tiltY = (y - dragStartY) / 50;
            }
        });
        
        canvas.addEventListener('mouseup', () => {
            dragging = false;
            tiltX = 0;
            tiltY = 0;
        });
        
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            dragging = true;
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            dragStartX = touch.clientX - rect.left;
            dragStartY = touch.clientY - rect.top;
        }, { passive: false });
        
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            if (dragging) {
                const rect = canvas.getBoundingClientRect();
                const touch = e.touches[0];
                const x = touch.clientX - rect.left;
                const y = touch.clientY - rect.top;
                
                tiltX = (x - dragStartX) / 50;
                tiltY = (y - dragStartY) / 50;
            }
        }, { passive: false });
        
        canvas.addEventListener('touchend', e => {
            e.preventDefault();
            dragging = false;
            tiltX = 0;
            tiltY = 0;
        }, { passive: false });
        
        // 设备倾斜（如果支持）
        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', e => {
                if (e.gamma !== null && e.beta !== null) {
                    tiltX = e.gamma / 30; // 左右倾斜
                    tiltY = (e.beta - 45) / 30; // 前后倾斜（45度为基准）
                }
            });
        }
        
        document.getElementById('btnRestart').addEventListener('click', () => {
            level = 1;
            score = 0;
            particles = [];
            initLevel();
            updateStats();
        });
        
        document.getElementById('btnNextLevel').addEventListener('click', () => {
            if (stars.every(s => s.collected)) {
                level++;
                score += 50;
                initLevel();
                updateStats();
            }
        });
        
        // 初始化
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        document.getElementById('highScore').textContent = highScore;
        gameLoop();
    </script>
</body>
</html>
