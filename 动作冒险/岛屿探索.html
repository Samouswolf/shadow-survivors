    <title>岛屿探索</title>
    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #00b894 0%, #00cec9 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px;
            background: linear-gradient(135deg, #00b894, #00cec9);
            border-radius: 12px;
        }
        .stat {
            text-align: center;
            color: white;
        }
        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }
        .stat-value {
            font-size: 20px;
            font-weight: bold;
        }
        .island-view {
            display: grid;
            gap: 2px;
            background: #74b9ff;
            border-radius: 12px;
            padding: 8px;
            margin-bottom: 15px;
        }
        .cell {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .water { background: #74b9ff; }
        .sand { background: #ffeaa7; }
        .grass { background: #00b894; }
        .forest { background: #2d3436; }
        .mountain { background: #636e72; }
        .cave { background: #2d3436; }
        .player {
            background: #fdcb6e;
            border-radius: 50%;
            animation: bounce 1s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }
        .item {
            animation: glow 1s infinite;
        }
        @keyframes glow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .inventory {
            display: flex;
            gap: 5px;
            justify-content: center;
            margin-bottom: 15px;
            padding: 10px;
            background: #dfe6e9;
            border-radius: 10px;
        }
        .inv-item {
            padding: 5px 10px;
            background: #00b894;
            color: white;
            border-radius: 5px;
            font-size: 14px;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            max-width: 150px;
            margin: 0 auto 15px;
        }
        .ctrl-btn {
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            cursor: pointer;
            background: linear-gradient(135deg, #00b894, #00cec9);
            color: white;
            transition: all 0.2s;
        }
        .ctrl-btn:hover { transform: scale(1.05); }
        .ctrl-btn.empty { background: transparent; }
        .action-btns {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #00b894, #00cec9);
            color: white;
        }
        .btn:hover { transform: translateY(-2px); }
        .message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 20px 40px;
            border-radius: 15px;
            font-size: 18px;
            display: none;
            z-index: 100;
            text-align: center;
        }
        .message.show { display: block; }
        .guide {
            text-align: center;
            color: #636e72;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .ad-banner {
            width: 100%;
            height: 60px;
            background: linear-gradient(135deg, #00b894, #00cec9);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            margin-top: 10px;
            font-size: 14px;
        }

<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">天数</div>
                <div class="stat-value" id="days">1</div>
            </div>
            <div class="stat">
                <div class="stat-label">收集</div>
                <div class="stat-value" id="collected">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">发现</div>
                <div class="stat-value" id="discovered">0</div>
            </div>
        </div>

        <div class="guide">探索岛屿，收集资源，发现秘密地点！</div>

        <div class="inventory" id="inventory"></div>

        <div class="island-view" id="island"></div>

        <div class="controls">
            <div class="ctrl-btn empty"></div>
            <button class="ctrl-btn" id="btnUp">↑</button>
            <div class="ctrl-btn empty"></div>
            <button class="ctrl-btn" id="btnLeft">←</button>
            <button class="ctrl-btn" id="btnDown">↓</button>
            <button class="ctrl-btn" id="btnRight">→</button>
        </div>

        <div class="action-btns">
            <button class="btn btn-primary" id="btnReset">🏝️ 新岛屿</button>
        </div>

        <div class="message" id="message"></div>

        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    <script>
        const ISLAND_SIZE = 10;
        let island = [];
        let playerPos = { x: 5, y: 5 };
        let inventory = [];
        let days = 1;
        let collected = 0;
        let discovered = 0;
        let items = [];
        let secrets = [];
        let movesToday = 0;
        let maxMovesPerDay = 10;

        function generateIsland() {
            island = [];

            // 生成岛屿地形
            for (let y = 0; y < ISLAND_SIZE; y++) {
                island[y] = [];
                for (let x = 0; x < ISLAND_SIZE; x++) {
                    // 中心是陆地，边缘是水
                    const distFromCenter = Math.sqrt(Math.pow(x - 5, 2) + Math.pow(y - 5, 2));
                    if (distFromCenter > 4) {
                        island[y][x] = 'water';
                    } else if (distFromCenter > 3) {
                        island[y][x] = 'sand';
                    } else if (Math.random() < 0.3) {
                        island[y][x] = 'forest';
                    } else if (Math.random() < 0.1) {
                        island[y][x] = 'mountain';
                    } else {
                        island[y][x] = 'grass';
                    }
                }
            }

            // 设置玩家位置
            playerPos = { x: 5, y: 5 };
            island[5][5] = 'grass';

            // 添加物品
            items = [];
            const itemTypes = ['🍎', '🥥', '🪵', '🪨', '🧭', '🗺️', '💎', '🔑'];
            for (let i = 0; i < 8; i++) {
                let attempts = 0;
                while (attempts < 100) {
                    const x = Math.floor(Math.random() * ISLAND_SIZE);
                    const y = Math.floor(Math.random() * ISLAND_SIZE);
                    if (island[y][x] !== 'water' &&
                        !(x === playerPos.x && y === playerPos.y) &&
                        !items.some(item => item.x === x && item.y === y)) {
                        items.push({
                            x, y,
                            type: itemTypes[i],
                            name: ['食物', '椰子', '木材', '石头', '指南针', '地图', '宝石', '钥匙'][i]
                        });
                        break;
                    }
                    attempts++;
                }
            }

            // 添加秘密地点
            secrets = [];
            const secretTypes = ['cave', 'treasure'];
            for (let i = 0; i < 2; i++) {
                let attempts = 0;
                while (attempts < 100) {
                    const x = Math.floor(Math.random() * ISLAND_SIZE);
                    const y = Math.floor(Math.random() * ISLAND_SIZE);
                    if (island[y][x] === 'forest' || island[y][x] === 'mountain') {
                        island[y][x] = secretTypes[i];
                        secrets.push({ x, y, type: secretTypes[i], found: false });
                        break;
                    }
                    attempts++;
                }
            }

            inventory = [];
            days = 1;
            collected = 0;
            discovered = 0;
            movesToday = 0;

            renderIsland();
            renderInventory();
            updateUI();
        }

        function renderIsland() {
            const islandEl = document.getElementById('island');
            islandEl.style.gridTemplateColumns = `repeat(${ISLAND_SIZE}, 40px)`;
            islandEl.innerHTML = '';

            for (let y = 0; y < ISLAND_SIZE; y++) {
                for (let x = 0; x < ISLAND_SIZE; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell ' + island[y][x];

                    if (x === playerPos.x && y === playerPos.y) {
                        cell.classList.remove(island[y][x]);
                        cell.classList.add('player');
                        cell.textContent = '🧍';
                    } else {
                        const item = items.find(i => i.x === x && i.y === y);
                        if (item) {
                            cell.classList.add('item');
                            cell.textContent = item.type;
                        } else if (island[y][x] === 'cave') {
                            cell.textContent = secrets.find(s => s.x === x && s.y === y)?.found ? '🕳️' : '🌲';
                        } else if (island[y][x] === 'treasure') {
                            cell.textContent = secrets.find(s => s.x === x && s.y === y)?.found ? '💰' : '🌲';
                        } else if (island[y][x] === 'water') {
                            cell.textContent = '🌊';
                        } else if (island[y][x] === 'sand') {
                            cell.textContent = '';
                        } else if (island[y][x] === 'forest') {
                            cell.textContent = '🌴';
                        } else if (island[y][x] === 'mountain') {
                            cell.textContent = '⛰️';
                        } else {
                            cell.textContent = '';
                        }
                    }

                    islandEl.appendChild(cell);
                }
            }
        }

        function renderInventory() {
            const invEl = document.getElementById('inventory');
            invEl.innerHTML = '';

            if (inventory.length === 0) {
                invEl.innerHTML = '<span style="color: #636e72;">背包空空</span>';
            } else {
                inventory.forEach(item => {
                    const el = document.createElement('div');
                    el.className = 'inv-item';
                    el.textContent = item.type + ' ' + item.name;
                    invEl.appendChild(el);
                });
            }
        }

        function movePlayer(dx, dy) {
            const newX = playerPos.x + dx;
            const newY = playerPos.y + dy;

            if (newX < 0 || newX >= ISLAND_SIZE || newY < 0 || newY >= ISLAND_SIZE) return;
            if (island[newY][newX] === 'water') {
                showMessage('不能进入水中！');
                return;
            }

            playerPos.x = newX;
            playerPos.y = newY;
            movesToday++;

            // 检查物品
            const itemIndex = items.findIndex(i => i.x === newX && i.y === newY);
            if (itemIndex !== -1) {
                const item = items[itemIndex];
                inventory.push(item);
                items.splice(itemIndex, 1);
                collected++;
                showMessage('收集到 ' + item.name + '！');
            }

            // 检查秘密地点
            const secret = secrets.find(s => s.x === newX && s.y === newY && !s.found);
            if (secret) {
                secret.found = true;
                discovered++;
                if (secret.type === 'cave') {
                    showMessage('发现洞穴！里面有宝藏！');
                    inventory.push({ type: '💎', name: '宝石' });
                    collected++;
                } else {
                    showMessage('发现宝藏！');
                    inventory.push({ type: '💰', name: '金币' });
                    collected++;
                }
            }

            // 每天移动限制
            if (movesToday >= maxMovesPerDay) {
                days++;
                movesToday = 0;
                showMessage('新的一天开始了！');
            }

            renderIsland();
            renderInventory();
            updateUI();

            // 检查是否完成
            if (collected >= 10) {
                showMessage('🎉 探索完成！\n天数: ' + days + '\n收集: ' + collected);
                GameCore.highScore.set('island_game', collected);
            }
        }

        function updateUI() {
            document.getElementById('days').textContent = days;
            document.getElementById('collected').textContent = collected;
            document.getElementById('discovered').textContent = discovered + '/' + secrets.length;
        }

        function showMessage(msg) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 1500);
        }

        function resetGame() {
            generateIsland();
        }

        document.getElementById('btnUp').addEventListener('click', () => movePlayer(0, -1));
        document.getElementById('btnDown').addEventListener('click', () => movePlayer(0, 1));
        document.getElementById('btnLeft').addEventListener('click', () => movePlayer(-1, 0));
        document.getElementById('btnRight').addEventListener('click', () => movePlayer(1, 0));

        document.getElementById('btnReset').addEventListener('click', resetGame);

        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowUp': movePlayer(0, -1); break;
                case 'ArrowDown': movePlayer(0, 1); break;
                case 'ArrowLeft': movePlayer(-1, 0); break;
                case 'ArrowRight': movePlayer(1, 0); break;
            }
        });

        // 初始化
        GameCore.init({ highScore: 'island_game' });
        generateIsland();
    </script>

<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>
<!-- [/BATCH-FIX:responsive-js] -->
<!-- [BATCH-FIX:touch-support] -->
<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>

<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
