<canvas id="gameCanvas"></canvas>
<div id="startScreen" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#0a0a12;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000">

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// 画布尺寸
const BASE_WIDTH = 420;
const BASE_HEIGHT = 700;
canvas.width = BASE_WIDTH;
canvas.height = BASE_HEIGHT;

// 游戏状态
const STATE = {
    MENU: 0,
    MODE_SELECT: 1,
    PLAYING: 2,
    PAUSED: 3,
    GAME_OVER: 4
};

// 游戏模式
const MODE = {
    CLASSIC: 0,
    ARCADE: 1
};

// 游戏变量
let gameState = STATE.MENU;
let gameMode = MODE.CLASSIC;
let score = 0;
let lives = 3;
let combo = 0;
let comboTimer = 0;
let timeLeft = 60;
let highScoreClassic = parseInt(localStorage.getItem('fruitNinja_highClassic')) || 0;
let highScoreArcade = parseInt(localStorage.getItem('fruitNinja_highArcade')) || 0;
let bombFlashTimer = 0;
let missedFlashTimer = 0;
let lastFrameTime = 0;
let gameTime = 0;
let spawnTimer = 0;
let difficulty = 1;
let bestCombo = 0;
let fruitSliced = 0;

// 水果类型
const FRUIT_TYPES = [
    { name: '苹果', score: 1, color: '#ff3333', innerColor: '#ffcccc', size: 28, emoji: '🍎' },
    { name: '西瓜', score: 3, color: '#33cc33', innerColor: '#ff6699', size: 40, emoji: '🍉' },
    { name: '橙子', score: 2, color: '#ff9933', innerColor: '#ffcc66', size: 30, emoji: '🍊' },
    { name: '草莓', score: 2, color: '#cc0033', innerColor: '#ff6666', size: 22, emoji: '🍓' },
    { name: '香蕉', score: 2, color: '#ffcc00', innerColor: '#ffff99', size: 32, emoji: '🍌' },
    { name: '蓝莓', score: 4, color: '#3366cc', innerColor: '#9999ff', size: 18, emoji: '🫐' },
    { name: '桃子', score: 3, color: '#ff9999', innerColor: '#ffcccc', size: 30, emoji: '🍑' }
];

// 水果和炸弹
let fruits = [];
let slicedFruits = [];
let bladeTrail = [];
let particles = [];
let floatingTexts = [];
let screenShake = { x: 0, y: 0, intensity: 0 };

// 输入状态
let isMouseDown = false;
let mouseX = 0;
let mouseY = 0;
let prevMouseX = 0;
let prevMouseY = 0;

// 水果类
class Fruit {
    constructor(type, x, y, vx, vy, isBomb) {
        this.type = type;
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotationSpeed = (Math.random() - 0.5) * 0.15;
        this.size = isBomb ? 30 : type.size;
        this.isBomb = isBomb;
        this.sliced = false;
        this.missed = false;
        this.alpha = 1;
        this.gravity = 0.25;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += this.gravity;
        this.rotation += this.rotationSpeed;

        // 检查是否落出屏幕
        if (this.y > canvas.height + this.size * 2 && !this.sliced) {
            this.missed = true;
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.globalAlpha = this.alpha;

        if (this.isBomb) {
            // 绘制炸弹
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.arc(0, 0, this.size, 0, Math.PI * 2);
            ctx.fill();

            // 炸弹高光
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.beginPath();
            ctx.arc(-this.size * 0.3, -this.size * 0.3, this.size * 0.3, 0, Math.PI * 2);
            ctx.fill();

            // 炸弹引线
            ctx.strokeStyle = '#888';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, -this.size);
            ctx.quadraticCurveTo(this.size * 0.5, -this.size * 1.5, this.size * 0.3, -this.size * 1.8);
            ctx.stroke();

            // 火花
            ctx.fillStyle = '#ff6600';
            ctx.beginPath();
            ctx.arc(this.size * 0.3, -this.size * 1.8, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffcc00';
            ctx.beginPath();
            ctx.arc(this.size * 0.3, -this.size * 1.8, 2, 0, Math.PI * 2);
            ctx.fill();
        } else {
            // 绘制水果
            const t = this.type;

            // 水果主体
            ctx.fillStyle = t.color;
            ctx.beginPath();
            ctx.arc(0, 0, this.size, 0, Math.PI * 2);
            ctx.fill();

            // 水果高光
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.beginPath();
            ctx.arc(-this.size * 0.25, -this.size * 0.25, this.size * 0.4, 0, Math.PI * 2);
            ctx.fill();

            // 水果阴影
            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            ctx.beginPath();
            ctx.arc(this.size * 0.15, this.size * 0.15, this.size * 0.7, 0, Math.PI * 2);
            ctx.fill();

            // 绘制 emoji
            ctx.font = `${this.size * 1.2}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(t.emoji, 0, 2);
        }

        ctx.restore();
    }
}

// 切割水果类
class SlicedFruit {
    constructor(fruit, angle) {
        this.x = fruit.x;
        this.y = fruit.y;
        this.type = fruit.type;
        this.size = fruit.size;
        this.angle = angle;
        this.vx1 = Math.cos(angle) * 3;
        this.vy1 = Math.sin(angle) * 3 - 2;
        this.vx2 = -Math.cos(angle) * 3;
        this.vy2 = -Math.sin(angle) * 3 - 2;
        this.rotation1 = 0;
        this.rotation2 = 0;
        this.alpha = 1;
        this.gravity = 0.3;
        this.life = 60;
    }

    update() {
        this.x += (this.vx1 + this.vx2) * 0.5;
        this.y += (this.vy1 + this.vy2) * 0.5;
        this.vy1 += this.gravity;
        this.vy2 += this.gravity;
        this.rotation1 += 0.1;
        this.rotation2 -= 0.1;
        this.life--;
        this.alpha = this.life / 60;
    }

    draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        const t = this.type;

        // 左半
        ctx.save();
        ctx.translate(this.x + this.vx1 * 5, this.y + this.vy1 * 5);
        ctx.rotate(this.rotation1);
        ctx.beginPath();
        ctx.arc(0, 0, this.size, Math.PI * 0.5, Math.PI * 1.5);
        ctx.fillStyle = t.innerColor;
        ctx.fill();
        ctx.beginPath();
        ctx.arc(0, 0, this.size, Math.PI * 0.5, Math.PI * 1.5);
        ctx.fillStyle = t.color;
        ctx.globalAlpha = this.alpha * 0.6;
        ctx.fill();
        ctx.restore();

        // 右半
        ctx.save();
        ctx.translate(this.x + this.vx2 * 5, this.y + this.vy2 * 5);
        ctx.rotate(this.rotation2);
        ctx.beginPath();
        ctx.arc(0, 0, this.size, Math.PI * 1.5, Math.PI * 0.5);
        ctx.fillStyle = t.innerColor;
        ctx.fill();
        ctx.beginPath();
        ctx.arc(0, 0, this.size, Math.PI * 1.5, Math.PI * 0.5);
        ctx.fillStyle = t.color;
        ctx.globalAlpha = this.alpha * 0.6;
        ctx.fill();
        ctx.restore();

        ctx.restore();
    }
}

// 粒子类
class Particle {
    constructor(x, y, color, size, speed, angle, life) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.size = size;
        this.speed = speed;
        this.angle = angle;
        this.life = life;
        this.maxLife = life;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.gravity = 0.1;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += this.gravity;
        this.life--;
        this.vx *= 0.98;
    }

    draw() {
        const alpha = this.life / this.maxLife;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * alpha, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

// 浮动文字类
class FloatingText {
    constructor(x, y, text, color, size) {
        this.x = x;
        this.y = y;
        this.text = text;
        this.color = color;
        this.size = size;
        this.life = 60;
        this.maxLife = 60;
        this.vy = -2;
    }

    update() {
        this.y += this.vy;
        this.vy *= 0.95;
        this.life--;
    }

    draw() {
        const alpha = this.life / this.maxLife;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = this.color;
        ctx.font = `bold ${this.size}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.text, this.x, this.y);
        ctx.restore();
    }
}

// 生成水果
function spawnFruit() {
    const isBomb = gameMode === MODE.CLASSIC ?
        Math.random() < 0.1 + difficulty * 0.02 :
        Math.random() < 0.08 + difficulty * 0.015;

    const type = FRUIT_TYPES[Math.floor(Math.random() * FRUIT_TYPES.length)];
    const side = Math.random() < 0.5 ? 0 : 1;
    const x = side === 0 ? -20 : canvas.width + 20;
    const y = canvas.height + 20;
    const targetX = canvas.width * 0.3 + Math.random() * canvas.width * 0.4;
    const targetY = canvas.height * 0.15 + Math.random() * canvas.height * 0.2;

    const dx = targetX - x;
    const dy = targetY - y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const speed = 6 + Math.random() * 4 + difficulty * 0.5;

    const vx = (dx / dist) * speed;
    const vy = (dy / dist) * speed - 2;

    const fruit = new Fruit(type, x, y, vx, vy, isBomb);
    fruits.push(fruit);

    // 连续生成多个水果
    if (Math.random() < 0.3 + difficulty * 0.05) {
        setTimeout(() => {
            if (gameState === STATE.PLAYING) {
                const extraType = FRUIT_TYPES[Math.floor(Math.random() * FRUIT_TYPES.length)];
                const extraX = side === 0 ? -20 : canvas.width + 20;
                const extraTargetX = targetX + (Math.random() - 0.5) * 100;
                const extraDx = extraTargetX - extraX;
                const extraDy = targetY - y;
                const extraDist = Math.sqrt(extraDx * extraDx + extraDy * extraDy);
                const extraVx = (extraDx / extraDist) * speed;
                const extraVy = (extraDy / extraDist) * speed - 2;
                fruits.push(new Fruit(extraType, extraX, y, extraVx, extraVy, false));
            }
        }, 100 + Math.random() * 200);
    }
}

// 创建果汁粒子
function createJuiceParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 6;
        const size = 2 + Math.random() * 4;
        const life = 20 + Math.random() * 30;
        particles.push(new Particle(x, y, color, size, speed, angle, life));
    }
}

// 检测切割
function checkSlice(x1, y1, x2, y2) {
    const dx = x2 - x1;
    const dy = y2 - y1;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < 5) return;

    let slicedThisSwipe = 0;

    for (let i = fruits.length - 1; i >= 0; i--) {
        const fruit = fruits[i];
        if (fruit.sliced) continue;

        // 计算点到线段的距离
        const px = fruit.x - x1;
        const py = fruit.y - y1;
        const t = Math.max(0, Math.min(1, (px * dx + py * dy) / (dist * dist)));
        const closestX = x1 + t * dx;
        const closestY = y1 + t * dy;
        const distance = Math.sqrt((fruit.x - closestX) ** 2 + (fruit.y - closestY) ** 2);

        if (distance < fruit.size + 10) {
            if (fruit.isBomb) {
                // 炸弹
                fruit.sliced = true;
                screenShake.intensity = 15;
                bombFlashTimer = 20;

                if (gameMode === MODE.CLASSIC) {
                    lives--;
                    if (lives <= 0) {
                        gameOver();
                        return;
                    }
                } else {
                    timeLeft = Math.max(0, timeLeft - 5);
                }

                // 炸弹爆炸效果
                createJuiceParticles(fruit.x, fruit.y, '#ff3300', 30);
                createJuiceParticles(fruit.x, fruit.y, '#ffcc00', 20);
                floatingTexts.push(new FloatingText(fruit.x, fruit.y - 30, '炸弹!', '#ff3333', 28));
                floatingTexts.push(new FloatingText(fruit.x, fruit.y, '-5秒', '#ff6600', 22));

                fruits.splice(i, 1);
                combo = 0;
            } else {
                // 水果
                fruit.sliced = true;
                slicedThisSwipe++;
                fruitSliced++;
                sfxScore();score += fruit.type.score;
                combo++;
                comboTimer = 60;

                if (combo > bestCombo) bestCombo = combo;

                // 连击加分
                if (combo >= 3) {
                    const bonus = combo * 2;
                    score += bonus;
                    floatingTexts.push(new FloatingText(fruit.x, fruit.y - 50, `${combo}连击! +${bonus}`, '#ffcc00', 24));
                }

                // 切割效果
                const angle = Math.atan2(dy, dx);
                slicedFruits.push(new SlicedFruit(fruit, angle));
                createJuiceParticles(fruit.x, fruit.y, fruit.type.color, 15);
                floatingTexts.push(new FloatingText(fruit.x, fruit.y - 20, `+${fruit.type.score}`, '#ffffff', 18));

                fruits.splice(i, 1);
            }
        }
    }
}

// 游戏结束
function gameOver() {
    gameState = STATE.GAME_OVER;

    if (gameMode === MODE.CLASSIC && score > highScoreClassic) {
        highScoreClassic = score;
        localStorage.setItem('fruitNinja_highClassic', highScoreClassic);
    } else if (gameMode === MODE.ARCADE && score > highScoreArcade) {
        highScoreArcade = score;
        localStorage.setItem('fruitNinja_highArcade', highScoreArcade);
    }
}

// 重置游戏
function resetGame() {
    fruits = [];
    slicedFruits = [];
    bladeTrail = [];
    particles = [];
    floatingTexts = [];
    score = 0;
    lives = 3;
    combo = 0;
    comboTimer = 0;
    timeLeft = 60;
    bombFlashTimer = 0;
    missedFlashTimer = 0;
    difficulty = 1;
    spawnTimer = 0;
    gameTime = 0;
    bestCombo = 0;
    fruitSliced = 0;
    screenShake = { x: 0, y: 0, intensity: 0 };
}

// 绘制背景
function drawBackground() {
    // 深色木质背景
    const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
    gradient.addColorStop(0, '#1a0a00');
    gradient.addColorStop(0.5, '#2a1505');
    gradient.addColorStop(1, '#1a0a00');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 木纹效果
    ctx.strokeStyle = 'rgba(60, 30, 10, 0.3)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 20; i++) {
        const y = i * (canvas.height / 20);
        ctx.beginPath();
        ctx.moveTo(0, y);
        for (let x = 0; x < canvas.width; x += 10) {
            ctx.lineTo(x, y + Math.sin(x * 0.02 + i) * 3);
        }
        ctx.stroke();
    }
}

// 绘制刀光轨迹
function drawBladeTrail() {
    if (bladeTrail.length < 2) return;

    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    for (let i = 1; i < bladeTrail.length; i++) {
        const t = i / bladeTrail.length;
        const alpha = t * 0.8;
        const width = t * 8 + 2;

        ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
        ctx.lineWidth = width;
        ctx.beginPath();
        ctx.moveTo(bladeTrail[i - 1].x, bladeTrail[i - 1].y);
        ctx.lineTo(bladeTrail[i].x, bladeTrail[i].y);
        ctx.stroke();

        // 刀光发光效果
        ctx.strokeStyle = `rgba(200, 220, 255, ${alpha * 0.5})`;
        ctx.lineWidth = width + 4;
        ctx.beginPath();
        ctx.moveTo(bladeTrail[i - 1].x, bladeTrail[i - 1].y);
        ctx.lineTo(bladeTrail[i].x, bladeTrail[i].y);
        ctx.stroke();
    }

    ctx.restore();
}

// 主游戏循环
function gameLoop(timestamp) {
    if (_htmlPaused) {
        requestAnimationFrame(gameLoop);
        return;
    }

    const deltaTime = timestamp - lastFrameTime;
    lastFrameTime = timestamp;

    // 清屏
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 屏幕震动
    if (screenShake.intensity > 0) {
        screenShake.x = (Math.random() - 0.5) * screenShake.intensity;
        screenShake.y = (Math.random() - 0.5) * screenShake.intensity;
        screenShake.intensity *= 0.9;
        if (screenShake.intensity < 0.5) screenShake.intensity = 0;
    }

    ctx.save();
    ctx.translate(screenShake.x, screenShake.y);

    switch (gameState) {
        case STATE.MENU:
            drawMenu();
            break;

        case STATE.MODE_SELECT:
            drawModeSelect();
            break;

        case STATE.PLAYING:
            // 更新游戏时间
            gameTime += deltaTime / 1000;
            difficulty = 1 + Math.floor(gameTime / 30) * 0.3;

            // 街机模式倒计时
            if (gameMode === MODE.ARCADE) {
                timeLeft -= deltaTime / 1000;
                if (timeLeft <= 0) {
                    gameOver();
                }
            }

            // 生成水果
            spawnTimer -= deltaTime;
            if (spawnTimer <= 0) {
                spawnFruit();
                spawnTimer = Math.max(300, 1200 - difficulty * 100);
            }

            // 连击计时
            if (comboTimer > 0) {
                comboTimer--;
                if (comboTimer <= 0) {
                    combo = 0;
                }
            }

            // 更新水果
            for (let i = fruits.length - 1; i >= 0; i--) {
                fruits[i].update();
                if (fruits[i].missed) {
                    if (gameMode === MODE.CLASSIC && !fruits[i].isBomb) {
                        lives--;
                        missedFlashTimer = 15;
                        if (lives <= 0) {
                            gameOver();
                        }
                    }
                    fruits.splice(i, 1);
                }
            }

            // 更新切割水果
            for (let i = slicedFruits.length - 1; i >= 0; i--) {
                slicedFruits[i].update();
                if (slicedFruits[i].life <= 0) {
                    slicedFruits.splice(i, 1);
                }
            }

            // 更新粒子
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                }
            }

            // 更新浮动文字
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                floatingTexts[i].update();
                if (floatingTexts[i].life <= 0) {
                    floatingTexts.splice(i, 1);
                }
            }

            // 更新刀光轨迹
            if (!isMouseDown) {
                bladeTrail = [];
            } else {
                bladeTrail.push({ x: mouseX, y: mouseY });
                if (bladeTrail.length > 20) {
                    bladeTrail.shift();
                }
            }

            // 绘制背景
            drawBackground();

            // 绘制水果
            for (const fruit of fruits) {
                fruit.draw();
            }

            // 绘制切割水果
            for (const sliced of slicedFruits) {
                sliced.draw();
            }

            // 绘制粒子
            for (const particle of particles) {
                particle.draw();
            }

            // 绘制刀光
            drawBladeTrail();

            // 绘制浮动文字
            for (const text of floatingTexts) {
                text.draw();
            }

            // 绘制UI
            drawUI();

            // 炸弹闪烁效果
            if (bombFlashTimer > 0) {
                bombFlashTimer--;
                ctx.fillStyle = `rgba(255, 0, 0, ${bombFlashTimer / 20 * 0.3})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // 漏水果闪烁效果
            if (missedFlashTimer > 0) {
                missedFlashTimer--;
                ctx.fillStyle = `rgba(255, 100, 0, ${missedFlashTimer / 15 * 0.2})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
            break;

        case STATE.GAME_OVER:
            drawBackground();
            for (const fruit of fruits) {
                fruit.draw();
            }
            for (const sliced of slicedFruits) {
                sliced.draw();
            }
            for (const particle of particles) {
                particle.draw();
            }
            drawGameOver();
            break;
    }

    ctx.restore();

    requestAnimationFrame(gameLoop);
}

// 点击处理
function handleClick(x, y) {
    if (gameState === STATE.MENU) {
        // 检查开始按钮
        const btnY = canvas.height * 0.7;
        if (x > canvas.width / 2 - 100 && x < canvas.width / 2 + 100 &&
            y > btnY - 25 && y < btnY + 25) {
            gameState = STATE.MODE_SELECT;
        }
    } else if (gameState === STATE.MODE_SELECT) {
        const classicY = canvas.height * 0.4;
        const arcadeY = canvas.height * 0.6;

        if (x > canvas.width / 2 - 140 && x < canvas.width / 2 + 140) {
            if (y > classicY - 40 && y < classicY + 40) {
                gameMode = MODE.CLASSIC;
                resetGame();
                gameState = STATE.PLAYING;
            } else if (y > arcadeY - 40 && y < arcadeY + 40) {
                gameMode = MODE.ARCADE;
                resetGame();
                gameState = STATE.PLAYING;
            }
        }
    } else if (gameState === STATE.GAME_OVER) {
        const btnY = canvas.height * 0.72;
        if (x > canvas.width / 2 - 100 && x < canvas.width / 2 + 100 &&
            y > btnY - 25 && y < btnY + 25) {
            resetGame();
            gameState = STATE.PLAYING;
        } else if (y > canvas.height * 0.82 && y < canvas.height * 0.88) {
            gameState = STATE.MENU;
        }
    }
}

function resizeCanvas() {
    const ratio = BASE_WIDTH / BASE_HEIGHT;
    let width = window.innerWidth;
    let height = window.innerHeight;

    if (width / height > ratio) {
        width = height * ratio;
    } else {
        height = width / ratio;
    }

    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
}

// roundRect polyfill (旧浏览器兼容)
if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, radii) {
        var r = typeof radii === 'number' ? radii : (Array.isArray(radii) ? radii[0] : 5);
        this.beginPath();
        this.moveTo(x + r, y);
        this.lineTo(x + w - r, y);
        this.quadraticCurveTo(x + w, y, x + w, y + r);
        this.lineTo(x + w, y + h - r);
        this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        this.lineTo(x + r, y + h);
        this.quadraticCurveTo(x, y + h, x, y + h - r);
        this.lineTo(x, y + r);
        this.quadraticCurveTo(x, y, x + r, y);
        this.closePath();
        return this;
    };
}

const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }
function playTone(freq, dur, type='sine', vol=0.3) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}
function sfxClick() { initAudio(); playTone(800, 0.05, 'sine', 0.2); }
function sfxScore() { initAudio(); playTone(523, 0.1); playTone(659, 0.1); }
function sfxWin()   { initAudio(); playTone(523, 0.15); setTimeout(()=>playTone(659, 0.15), 100); setTimeout(()=>playTone(784, 0.2), 200); }
function sfxLose()  { initAudio(); playTone(300, 0.2, 'sawtooth', 0.2); setTimeout(()=>playTone(200, 0.3, 'sawtooth', 0.2), 150); }

</script>
