<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>跳跃忍者</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; overflow: hidden; }
#game-container { position: relative; width: 100%; height: 100vh; }
#game-canvas { display: block; width: 100%; height: 100%; }
#game-ui { position: absolute; top: 20px; left: 20px; color: #fff; font-size: 20px; font-weight: bold; z-index: 10; }
#game-ui span { color: #fbbf24; }
#game-over { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 20; flex-direction: column; align-items: center; justify-content: center; }
#game-over h2 { font-size: 48px; color: #f5576c; margin-bottom: 20px; }
#game-over p { font-size: 24px; color: #fff; margin-bottom: 30px; }
#game-over .btn { padding: 15px 40px; font-size: 20px; background: #6366f1; color: #fff; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
#start-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#start-screen h1 { font-size: 48px; color: #fbbf24; margin-bottom: 20px; text-shadow: 0 0 20px rgba(251,191,36,0.5); }
#start-screen p { color: #aaa; margin-bottom: 40px; font-size: 16px; }
#start-screen .btn { padding: 18px 50px; font-size: 22px; background: linear-gradient(145deg, #fbbf24, #f59e0b); color: #fff; border: none; border-radius: 15px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 20px rgba(251,191,36,0.4); }
#loading-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#loading-screen .loading-icon { width: 60px; height: 60px; border: 4px solid #fbbf24; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#loading-screen p { color: #fbbf24; margin-top: 20px; font-size: 18px; }
.ad-banner-container { position: absolute; bottom: 0; left: 0; width: 100%; padding: 10px; z-index: 10; }
.sponsor-btn { position: fixed; top: 20px; right: 20px; width: 50px; height: 50px; background: rgba(255,165,0,0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; z-index: 100; box-shadow: 0 4px 15px rgba(255,165,0,0.4); }
.sponsor-panel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 200; align-items: center; justify-content: center; }
.sponsor-panel.show { display: flex; }
.sponsor-content { background: #fff; padding: 30px; border-radius: 20px; text-align: center; max-width: 90%; }
.sponsor-content h3 { margin-bottom: 20px; color: #333; }
.sponsor-close { position: absolute; top: 20px; right: 20px; width: 40px; height: 40px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; }
.interstitial-ad { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 999; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
.interstitial-ad .ad-content { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; text-align: center; min-width: 280px; max-width: 400px; }
.interstitial-ad .ad-content p { color: #aaa; font-size: 14px; margin-bottom: 12px; }
.interstitial-ad .skip-btn { padding: 8px 28px; background: rgba(255,215,0,0.15); border: 1px solid rgba(255,215,0,0.3); border-radius: 20px; color: #ffd700; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.2s; }
.interstitial-ad .skip-btn:hover { background: rgba(255,215,0,0.25); }
</style>
</head>
<body>
<div id="start-screen">
  <h1>🥷 跳跃忍者</h1>
  <p>点击屏幕左右切换方向<br>在平台间跳跃，收集金币！</p>
  <button class="btn" onclick="startGame()">开始游戏</button>
</div>

<div id="game-container">
  <canvas id="game-canvas"></canvas>
  <div id="game-ui">
    分数: <span id="score">0</span> | 最高: <span id="high-score">0</span>
  </div>
  
  <div id="game-over">
    <h2>💥 游戏结束</h2>
    <p>最终得分: <span id="final-score">0</span></p>
    <button class="btn" onclick="restartGame()">再来一次</button>
  </div>
  
  <div class="ad-banner-container">
    <div style="background:#f0f0f0;height:90px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#666;font-size:14px;">广告位</div>
  </div>
</div>

<div class="sponsor-btn" onclick="showSponsor()">☕</div>
<div class="sponsor-panel" id="sponsor-panel" onclick="hideSponsor()">
  <div class="sponsor-content" onclick="event.stopPropagation()">
    <h3>支持开发者</h3>
    <p>感谢您的支持！</p>
    <div style="color:#666;font-size:14px;margin-top:10px;">微信赞赏码</div>
  </div>
  <div class="sponsor-close" onclick="hideSponsor()">×</div>
</div>

<div id="loading-screen">
  <div class="loading-icon"></div>
  <p>加载中...</p>
</div>

<div class="interstitial-ad" id="interstitialAd">
  <div class="ad-content">
    <p>📢 赞助商广告</p>
    <div id="interstitialAdSlot" style="min-height:250px;display:flex;align-items:center;justify-content:center;color:#888;font-size:13px;">广告加载中...</div>
  </div>
  <button class="skip-btn" id="skipInterstitial" onclick="closeInterstitial()">跳过广告 ▶</button>
</div>


  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script src="../game_core.js"></script>
<script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script>
// ==================== 游戏常量配置 ====================
const GAME_NAME = '跳跃忍者';

// ==================== 游戏核心组件 ====================
/**
 * GameCore 类 - 提供游戏核心功能支持
 * 包含存档管理、最高分记录等通用功能
 */
class GameCore {
  /**
   * 初始化游戏核心组件
   * @param {Object} options - 配置选项
   * @param {string} options.highScore - 最高分存储键名
   */
  static init(options) {
    if (options && options.highScore) {
      this.highScoreKey = options.highScore;
    }
  }
  
  /**
   * 获取最高分
   * @returns {number} 当前存储的最高分
   */
  static getHighScore() {
    try {
      return parseInt(localStorage.getItem(this.highScoreKey)) || 0;
    } catch (error) {
      console.warn('读取最高分失败:', error);
      return 0;
    }
  }
  
  /**
   * 设置新的最高分
   * @param {number} value - 新分数
   * @returns {boolean} 是否成功更新最高分
   */
  static setHighScore(value) {
    try {
      const current = this.getHighScore();
      if (value > current) {
        localStorage.setItem(this.highScoreKey, value.toString());
        return true;
      }
      return false;
    } catch (error) {
      console.warn('保存最高分失败:', error);
      return false;
    }
  }
}

// 初始化游戏核心组件
GameCore.init({ highScore: GAME_NAME });

// ==================== DOM元素引用 ====================
let canvas, ctx, scoreEl, highScoreEl, finalScoreEl;

/**
 * 初始化DOM元素引用
 * 在页面加载完成后调用
 */
function initDOM() {
  try {
    canvas = document.getElementById('game-canvas');
    ctx = canvas.getContext('2d');
    scoreEl = document.getElementById('score');
    highScoreEl = document.getElementById('high-score');
    finalScoreEl = document.getElementById('final-score');
    
    if (!canvas || !ctx) {
      throw new Error('Canvas元素初始化失败');
    }
  } catch (error) {
    console.error('DOM初始化错误:', error);
    alert('游戏初始化失败，请刷新页面重试');
  }
}

// ==================== 游戏状态变量 ====================
let gameRunning = false;
let score = 0;
let platforms = [];
let coins = [];
let particles = [];

/**
 * 玩家对象定义
 * 包含位置、尺寸、速度等属性
 */
const player = {
  x: 0,
  y: 0,
  width: 30,
  height: 40,
  velocityX: 5,
  velocityY: 0,
  direction: 1,
  color: '#fbbf24'
};

let groundY = 0;
let gameSpeed = 2;

// ==================== 画布处理 ====================
/**
 * 调整画布大小以适应窗口
 * 确保游戏在不同屏幕尺寸下正常显示
 */
function resizeCanvas() {
  try {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    groundY = canvas.height - 150;
  } catch (error) {
    console.error('画布调整失败:', error);
  }
}

// ==================== 游戏流程控制 ====================
/**
 * 开始游戏
 * 重置游戏状态，初始化平台和金币，启动游戏循环
 */
function startGame() {
  try {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('game-over').style.display = 'none';
    gameRunning = true;
    score = 0;
    gameSpeed = 2;
    platforms = [];
    coins = [];
    particles = [];
    
    player.x = canvas.width / 2;
    player.y = groundY - 100;
    player.velocityX = 5;
    player.velocityY = 0;
    player.direction = 1;
    
    platforms.push({ x: 0, y: groundY, width: canvas.width, height: 50 });
    
    for (let i = 0; i < 5; i++) {
      spawnPlatform();
    }
    
    highScoreEl.textContent = GameCore.getHighScore();
    scoreEl.textContent = '0';
    gameLoop();
  } catch (error) {
    console.error('开始游戏失败:', error);
    alert('游戏启动失败，请重试');
  }
}

/**
 * 重新开始游戏
 * 调用startGame重置状态
 */
function restartGame() {
  startGame();
}

// ==================== UI交互 ====================
/**
 * 显示赞助面板
 */
function showSponsor() {
  try {
    document.getElementById('sponsor-panel').classList.add('show');
  } catch (error) {
    console.error('显示赞助面板失败:', error);
  }
}

/**
 * 隐藏赞助面板
 */
function hideSponsor() {
  try {
    document.getElementById('sponsor-panel').classList.remove('show');
  } catch (error) {
    console.error('隐藏赞助面板失败:', error);
  }
}

/**
 * 关闭插屏广告
 */
function closeInterstitial() {
  try {
    document.getElementById('interstitialAd').style.display = 'none';
  } catch (error) {
    console.error('关闭广告失败:', error);
  }
}

// ==================== 游戏逻辑 ====================
/**
 * 玩家跳跃
 * 切换方向并设置垂直速度
 */
function jump() {
  if (gameRunning) {
    player.direction *= -1;
    player.velocityY = -12;
    createParticles(player.x, player.y + player.height, '#fbbf24');
  }
}

/**
 * 创建粒子效果
 * @param {number} x - 粒子生成位置X坐标
 * @param {number} y - 粒子生成位置Y坐标
 * @param {string} color - 粒子颜色
 */
function createParticles(x, y, color) {
  for (let i = 0; i < 6; i++) {
    particles.push({
      x: x,
      y: y,
      vx: (Math.random() - 0.5) * 6,
      vy: Math.random() * -4,
      size: Math.random() * 4 + 2,
      color: color,
      life: 1
    });
  }
}

/**
 * 生成平台
 * 创建随机宽度和位置的平台，并可能在上方生成金币
 */
function spawnPlatform() {
  const minWidth = 80;
  const maxWidth = 150;
  const width = Math.random() * (maxWidth - minWidth) + minWidth;
  const x = Math.random() * (canvas.width - width);
  const lastPlatform = platforms[platforms.length - 1];
  const y = lastPlatform.y - (Math.random() * 80 + 60);
  
  platforms.push({ x, y, width, height: 20, type: 'normal' });
  
  if (Math.random() < 0.4 && platforms.length > 2) {
    coins.push({
      x: x + width / 2,
      y: y - 30,
      size: 15,
      collected: false,
      angle: 0
    });
  }
}

/**
 * 更新游戏状态
 * 处理玩家移动、平台滚动、金币收集、碰撞检测等
 */
function update() {
  if (!gameRunning) return;
  
  score += 0.05;
  scoreEl.textContent = Math.floor(score);
  
  gameSpeed += 0.0005;
  
  player.x += player.velocityX * player.direction;
  player.velocityY += 0.6;
  player.y += player.velocityY;
  
  if (player.x < 0) {
    player.x = canvas.width;
  } else if (player.x > canvas.width) {
    player.x = 0;
  }
  
  let onGround = false;
  platforms.forEach(platform => {
    platform.y += gameSpeed;
    
    if (player.x + player.width > platform.x &&
        player.x < platform.x + platform.width &&
        player.y + player.height >= platform.y &&
        player.y + player.height <= platform.y + platform.height + player.velocityY &&
        player.velocityY >= 0) {
      player.y = platform.y - player.height;
      player.velocityY = 0;
      onGround = true;
    }
  });
  
  platforms = platforms.filter(p => p.y < canvas.height + 100);
  
  if (platforms.length < 6) {
    spawnPlatform();
  }
  
  coins.forEach(coin => {
    coin.y += gameSpeed;
    coin.angle += 0.1;
    
    const dx = player.x + player.width / 2 - coin.x;
    const dy = player.y + player.height / 2 - coin.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    
    if (!coin.collected && dist < 30) {
      coin.collected = true;
      score += 50;
      createParticles(coin.x, coin.y, '#ffd700');
    }
  });
  
  coins = coins.filter(c => !c.collected && c.y < canvas.height + 50);
  
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.2;
    p.life -= 0.02;
  });
  
  particles = particles.filter(p => p.life > 0);
  
  if (player.y > canvas.height + 50) {
    gameOver();
  }
}

/**
 * 绘制游戏画面
 * 渲染背景、平台、金币、玩家、粒子等元素
 */
function draw() {
  try {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.fillStyle = '#1e293b';
    for (let i = 0; i < 50; i++) {
      const x = (i * 37 + Date.now() * 0.02) % canvas.width;
      const y = (i * 53 + Date.now() * 0.03) % canvas.height;
      ctx.fillRect(x, y, 2, 2);
    }
    
    platforms.forEach(platform => {
      const gradient = ctx.createLinearGradient(platform.x, platform.y, platform.x, platform.y + platform.height);
      gradient.addColorStop(0, '#6366f1');
      gradient.addColorStop(1, '#4f46e5');
      ctx.fillStyle = gradient;
      ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
      
      ctx.fillStyle = '#818cf8';
      ctx.fillRect(platform.x, platform.y, platform.width, 3);
    });
    
    coins.forEach(coin => {
      ctx.save();
      ctx.translate(coin.x, coin.y);
      ctx.rotate(coin.angle);
      
      ctx.fillStyle = '#ffd700';
      ctx.beginPath();
      ctx.arc(0, 0, coin.size, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.fillStyle = '#ffed4a';
      ctx.font = 'bold 14px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('¥', 0, 1);
      
      ctx.restore();
    });
    
    ctx.fillStyle = player.color;
    ctx.fillRect(player.x, player.y, player.width, player.height);
    
    ctx.fillStyle = '#fff';
    ctx.fillRect(player.x + 5, player.y + 8, 5, 5);
    ctx.fillRect(player.x + 20, player.y + 8, 5, 5);
    
    ctx.fillStyle = '#f87171';
    ctx.fillRect(player.x + 10, player.y + 20, 10, 3);
    
    particles.forEach(p => {
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    });
    
    ctx.globalAlpha = 1;
  } catch (error) {
    console.error('绘制错误:', error);
  }
}

/**
 * 游戏主循环
 * 使用requestAnimationFrame实现平滑动画
 */
function gameLoop() {
  if (!gameRunning) return;
  
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

/**
 * 游戏结束处理
 * 停止游戏运行，显示结束界面，保存最高分
 */
function gameOver() {
  try {
    gameRunning = false;
    const finalScore = Math.floor(score);
    finalScoreEl.textContent = finalScore;
    
    if (GameCore.setHighScore(finalScore)) {
      highScoreEl.textContent = finalScore;
    }
    
    document.getElementById('game-over').style.display = 'flex';
  } catch (error) {
    console.error('游戏结束处理失败:', error);
  }
}

// ==================== 事件监听 ====================
/**
 * 键盘事件处理
 * 空格键、方向键触发跳跃
 */
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowLeft' || e.code === 'ArrowRight') {
    e.preventDefault();
    if (gameRunning) {
      jump();
    }
  }
});

/**
 * 鼠标点击事件处理
 * 点击画布触发跳跃
 */
canvas.addEventListener('click', () => {
  if (gameRunning) {
    jump();
  }
});

/**
 * 触屏事件处理
 * 触摸画布触发跳跃
 */
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (gameRunning) {
    jump();
  }
});

// ==================== 初始化 ====================
/**
 * 页面加载完成后执行初始化
 */
window.addEventListener('load', () => {
  try {
    initDOM();
    resizeCanvas();
    
    setTimeout(() => {
      document.getElementById('loading-screen').style.display = 'none';
    }, 1500);
  } catch (error) {
    console.error('初始化失败:', error);
  }
});

window.addEventListener('resize', resizeCanvas);
</script>
<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
</body>
</html>
