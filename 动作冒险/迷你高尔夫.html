<canvas id="gc"></canvas>
<script>
(function(){
'use strict';

// ==================== Constants ====================
const c = document.getElementById('gc'), ctx = c.getContext('2d');
const SCREEN = {MENU:0, PLAYING:1, GAMEOVER:2, LEVEL_COMPLETE:3};
const HOLE_RADIUS = 12;
const BALL_RADIUS = 8;
const MAX_POWER = 200;
const FRICTION = 0.985;
const MIN_SPEED = 0.1;
const PAR_STROKE = 3;

// ==================== Game State ====================
let W, H, scale;
let screen = SCREEN.MENU;
let currentLevel = 0;
let totalScore = 0;
let strokes = 0;
let ball = {x:0, y:0, vx:0, vy:0, moving:false};
let hole = {x:0, y:0};
let isDragging = false;
let dragStart = {x:0, y:0};
let dragEnd = {x:0, y:0};
let paused = false;
let levelCompleteTimer = 0;
let particles = [];
let highScore = 0;

// ==================== Audio System ====================
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    switch(type) {
        case 'hit':
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.1);
            break;
        case 'hole':
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.3);
            break;
        case 'wall':
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.05);
            break;
        case 'win':
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523, audioCtx.currentTime);
            osc.frequency.setValueAtTime(659, audioCtx.currentTime + 0.1);
            osc.frequency.setValueAtTime(784, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.4);
            break;
    }
}

// ==================== Level Data ====================
const LEVELS = [
    // Level 1: 直线入门
    {
        name: "直线入门",
        ball: {x: 0.2, y: 0.5},
        hole: {x: 0.8, y: 0.5},
        walls: [],
        obstacles: []
    },
    // Level 2: L形弯道
    {
        name: "L形弯道",
        ball: {x: 0.2, y: 0.3},
        hole: {x: 0.8, y: 0.8},
        walls: [
            {x: 0.5, y: 0.2, w: 0.02, h: 0.5}
        ],
        obstacles: []
    },
    // Level 3: 障碍物挑战
    {
        name: "障碍挑战",
        ball: {x: 0.2, y: 0.5},
        hole: {x: 0.8, y: 0.5},
        walls: [],
        obstacles: [
            {x: 0.5, y: 0.5, r: 30}
        ]
    },
    // Level 4: 双弯道
    {
        name: "双弯道",
        ball: {x: 0.15, y: 0.2},
        hole: {x: 0.85, y: 0.8},
        walls: [
            {x: 0.4, y: 0.1, w: 0.02, h: 0.4},
            {x: 0.6, y: 0.5, w: 0.02, h: 0.4}
        ],
        obstacles: []
    },
    // Level 5: 窄道穿行
    {
        name: "窄道穿行",
        ball: {x: 0.2, y: 0.5},
        hole: {x: 0.8, y: 0.5},
        walls: [
            {x: 0.35, y: 0.2, w: 0.02, h: 0.25},
            {x: 0.35, y: 0.55, w: 0.02, h: 0.25},
            {x: 0.65, y: 0.2, w: 0.02, h: 0.25},
            {x: 0.65, y: 0.55, w: 0.02, h: 0.25}
        ],
        obstacles: []
    },
    // Level 6: 障碍迷宫
    {
        name: "障碍迷宫",
        ball: {x: 0.15, y: 0.15},
        hole: {x: 0.85, y: 0.85},
        walls: [],
        obstacles: [
            {x: 0.3, y: 0.3, r: 25},
            {x: 0.5, y: 0.5, r: 30},
            {x: 0.7, y: 0.3, r: 20},
            {x: 0.3, y: 0.7, r: 20},
            {x: 0.7, y: 0.7, r: 25}
        ]
    },
    // Level 7: 精确击球
    {
        name: "精确击球",
        ball: {x: 0.5, y: 0.85},
        hole: {x: 0.5, y: 0.15},
        walls: [
            {x: 0.3, y: 0.3, w: 0.4, h: 0.02},
            {x: 0.3, y: 0.6, w: 0.4, h: 0.02}
        ],
        obstacles: []
    },
    // Level 8: 最终挑战
    {
        name: "最终挑战",
        ball: {x: 0.1, y: 0.1},
        hole: {x: 0.9, y: 0.9},
        walls: [
            {x: 0.3, y: 0.0, w: 0.02, h: 0.3},
            {x: 0.6, y: 0.4, w: 0.02, h: 0.3},
            {x: 0.3, y: 0.7, w: 0.02, h: 0.3}
        ],
        obstacles: [
            {x: 0.5, y: 0.2, r: 20},
            {x: 0.4, y: 0.5, r: 25},
            {x: 0.7, y: 0.6, r: 20},
            {x: 0.5, y: 0.8, r: 20}
        ]
    }
];

// ==================== Init ====================
function init() {
    resize();
    window.addEventListener('resize', resize);
    c.addEventListener('mousedown', handleMouseDown);
    c.addEventListener('mousemove', handleMouseMove);
    c.addEventListener('mouseup', handleMouseUp);
    c.addEventListener('touchstart', handleTouchStart, {passive:false});
    c.addEventListener('touchmove', handleTouchMove, {passive:false});
    c.addEventListener('touchend', handleTouchEnd, {passive:false});
    document.addEventListener('keydown', handleKeyDown);
    loadHighScore();
    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('pauseBtn').addEventListener('click', togglePause);
    document.getElementById('resumeBtn').addEventListener('click', togglePause);
    document.getElementById('restartBtn').addEventListener('click', restartGame);
    requestAnimationFrame(gameLoop);
}

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    c.width = W;
    c.height = H;
    scale = Math.min(W, H);
}

function loadHighScore() {
    try {
        const s = localStorage.getItem('mini_golf_high');
        if (s) highScore = parseInt(s);
        document.getElementById('highScoreDisplay').textContent = '最高分: ' + highScore;
    } catch(e) {}
}

function saveHighScore() {
    try {
        localStorage.setItem('mini_golf_high', highScore.toString());
    } catch(e) {}
}

// ==================== Game Control ====================
function startGame() {
    initAudio();
    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('pauseBtn').style.display = 'block';
    screen = SCREEN.PLAYING;
    currentLevel = 0;
    totalScore = 0;
    loadLevel(currentLevel);
}

function restartGame() {
    paused = false;
    document.getElementById('pauseScreen').style.display = 'none';
    screen = SCREEN.PLAYING;
    currentLevel = 0;
    totalScore = 0;
    loadLevel(currentLevel);
}

function togglePause() {
    if (screen !== SCREEN.PLAYING && screen !== SCREEN.LEVEL_COMPLETE) return;
    paused = !paused;
    document.getElementById('pauseScreen').style.display = paused ? 'flex' : 'none';
}

function loadLevel(levelIndex) {
    if (levelIndex >= LEVELS.length) {
        screen = SCREEN.GAMEOVER;
        if (totalScore > highScore) {
            highScore = totalScore;
            saveHighScore();
        }
        return;
    }

    const level = LEVELS[levelIndex];
    strokes = 0;
    levelCompleteTimer = 0;
    particles = [];

    // Convert relative positions to absolute
    const margin = 40;
    const playW = W - margin * 2;
    const playH = H - margin * 2 - 60; // Leave space for UI
    const offsetY = 60; // Top margin for UI

    ball.x = margin + level.ball.x * playW;
    ball.y = offsetY + margin + level.ball.y * playH;
    ball.vx = 0;
    ball.vy = 0;
    ball.moving = false;

    hole.x = margin + level.hole.x * playW;
    hole.y = offsetY + margin + level.hole.y * playH;
}

// ==================== Input Handling ====================
function getCanvasPos(clientX, clientY) {
    const rect = c.getBoundingClientRect();
    return {
        x: clientX - rect.left,
        y: clientY - rect.top
    };
}

function handleMouseDown(e) {
    if (screen !== SCREEN.PLAYING || ball.moving || paused) return;
    const pos = getCanvasPos(e.clientX, e.clientY);
    startDrag(pos.x, pos.y);
}

function handleMouseMove(e) {
    if (!isDragging) return;
    const pos = getCanvasPos(e.clientX, e.clientY);
    updateDrag(pos.x, pos.y);
}

function handleMouseUp(e) {
    if (!isDragging) return;
    endDrag();
}

function handleTouchStart(e) {
    e.preventDefault();
    if (screen !== SCREEN.PLAYING || ball.moving || paused) return;
    const touch = e.touches[0];
    const pos = getCanvasPos(touch.clientX, touch.clientY);
    startDrag(pos.x, pos.y);
}

function handleTouchMove(e) {
    e.preventDefault();
    if (!isDragging) return;
    const touch = e.touches[0];
    const pos = getCanvasPos(touch.clientX, touch.clientY);
    updateDrag(pos.x, pos.y);
}

function handleTouchEnd(e) {
    e.preventDefault();
    if (!isDragging) return;
    endDrag();
}

function handleKeyDown(e) {
    if (e.key === 'p' || e.key === 'P') {
        togglePause();
    }
    if (e.key === 'r' || e.key === 'R') {
        if (screen === SCREEN.GAMEOVER) {
            restartGame();
        }
    }
}

function startDrag(x, y) {
    // Check if click is near ball
    const dx = x - ball.x;
    const dy = y - ball.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < 50) {
        isDragging = true;
        dragStart.x = ball.x;
        dragStart.y = ball.y;
        dragEnd.x = x;
        dragEnd.y = y;
    }
}

function updateDrag(x, y) {
    dragEnd.x = x;
    dragEnd.y = y;
}

function endDrag() {
    isDragging = false;
    const dx = dragStart.x - dragEnd.x;
    const dy = dragStart.y - dragEnd.y;
    const dist = Math.sqrt(dx*dx + dy*dy);

    if (dist > 10) {
        const power = Math.min(dist, MAX_POWER) / MAX_POWER;
        const angle = Math.atan2(dy, dx);
        ball.vx = Math.cos(angle) * power * 15;
        ball.vy = Math.sin(angle) * power * 15;
        ball.moving = true;
        strokes++;
        playSound('hit');
    }
}

// ==================== Physics ====================
function updateBall() {
    if (!ball.moving) return;

    ball.x += ball.vx;
    ball.y += ball.vy;

    // Apply friction
    ball.vx *= FRICTION;
    ball.vy *= FRICTION;

    // Wall bouncing (canvas edges)
    const margin = 20;
    const offsetY = 60;

    if (ball.x - BALL_RADIUS < margin) {
        ball.x = margin + BALL_RADIUS;
        ball.vx = -ball.vx * 0.8;
        playSound('wall');
    }
    if (ball.x + BALL_RADIUS > W - margin) {
        ball.x = W - margin - BALL_RADIUS;
        ball.vx = -ball.vx * 0.8;
        playSound('wall');
    }
    if (ball.y - BALL_RADIUS < offsetY + margin) {
        ball.y = offsetY + margin + BALL_RADIUS;
        ball.vy = -ball.vy * 0.8;
        playSound('wall');
    }
    if (ball.y + BALL_RADIUS > H - margin) {
        ball.y = H - margin - BALL_RADIUS;
        ball.vy = -ball.vy * 0.8;
        playSound('wall');
    }

    // Level walls
    const level = LEVELS[currentLevel];
    const playW = W - margin * 2;
    const playH = H - margin * 2 - 60;

    level.walls.forEach(wall => {
        const wx = margin + wall.x * playW;
        const wy = offsetY + margin + wall.y * playH;
        const ww = wall.w * playW;
        const wh = wall.h * playH;

        if (ball.x + BALL_RADIUS > wx && ball.x - BALL_RADIUS < wx + ww &&
            ball.y + BALL_RADIUS > wy && ball.y - BALL_RADIUS < wy + wh) {
            // Determine bounce direction
            const overlapLeft = (ball.x + BALL_RADIUS) - wx;
            const overlapRight = (wx + ww) - (ball.x - BALL_RADIUS);
            const overlapTop = (ball.y + BALL_RADIUS) - wy;
            const overlapBottom = (wy + wh) - (ball.y - BALL_RADIUS);

            const minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);

            if (minOverlap === overlapLeft || minOverlap === overlapRight) {
                ball.vx = -ball.vx * 0.8;
            } else {
                ball.vy = -ball.vy * 0.8;
            }
            playSound('wall');
        }
    });

    // Obstacles
    level.obstacles.forEach(obs => {
        const ox = margin + obs.x * playW;
        const oy = offsetY + margin + obs.y * playH;
        const or = obs.r;

        const dx = ball.x - ox;
        const dy = ball.y - oy;
        const dist = Math.sqrt(dx*dx + dy*dy);

        if (dist < BALL_RADIUS + or) {
            const angle = Math.atan2(dy, dx);
            ball.x = ox + Math.cos(angle) * (BALL_RADIUS + or);
            ball.y = oy + Math.sin(angle) * (BALL_RADIUS + or);

            // Reflect velocity
            const dot = ball.vx * Math.cos(angle) + ball.vy * Math.sin(angle);
            ball.vx = (ball.vx - 2 * dot * Math.cos(angle)) * 0.8;
            ball.vy = (ball.vy - 2 * dot * Math.sin(angle)) * 0.8;
            playSound('wall');
        }
    });

    // Check if ball reached hole
    const hdx = ball.x - hole.x;
    const hdy = ball.y - hole.y;
    const holeDist = Math.sqrt(hdx*hdx + hdy*hdy);

    if (holeDist < HOLE_RADIUS) {
        ball.moving = false;
        ball.x = hole.x;
        ball.y = hole.y;
        playSound('hole');
        createParticles(hole.x, hole.y);
        levelCompleteTimer = 60; // 1 second delay
        screen = SCREEN.LEVEL_COMPLETE;
    }

    // Check if ball stopped
    const speed = Math.sqrt(ball.vx*ball.vx + ball.vy*ball.vy);
    if (speed < MIN_SPEED) {
        ball.vx = 0;
        ball.vy = 0;
        ball.moving = false;
    }
}

// ==================== Particles ====================
function createParticles(x, y) {
    for (let i = 0; i < 20; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 3 + 1;
        particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1.0,
            color: `hsl(${120 + Math.random() * 40}, 100%, ${50 + Math.random() * 30}%)`
        });
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.02;
        if (p.life <= 0) {
            particles.splice(i, 1);
        }
    }
}

// ==================== Rendering ====================
function render() {
    // Clear canvas
    ctx.fillStyle = '#1a3a2a';
    ctx.fillRect(0, 0, W, H);

    if (screen === SCREEN.MENU) return;

    const margin = 20;
    const offsetY = 60;
    const playW = W - margin * 2;
    const playH = H - margin * 2 - 60;

    // Draw grass background
    ctx.fillStyle = '#2d5a3f';
    ctx.fillRect(margin, offsetY + margin, playW, playH);

    // Draw grid pattern
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    for (let x = margin; x <= W - margin; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, offsetY + margin);
        ctx.lineTo(x, H - margin);
        ctx.stroke();
    }
    for (let y = offsetY + margin; y <= H - margin; y += 40) {
        ctx.beginPath();
        ctx.moveTo(margin, y);
        ctx.lineTo(W - margin, y);
        ctx.stroke();
    }

    // Draw walls
    const level = LEVELS[currentLevel];
    ctx.fillStyle = '#8B4513';
    level.walls.forEach(wall => {
        const wx = margin + wall.x * playW;
        const wy = offsetY + margin + wall.y * playH;
        const ww = wall.w * playW;
        const wh = wall.h * playH;
        ctx.fillRect(wx, wy, ww, wh);
        ctx.strokeStyle = '#A0522D';
        ctx.lineWidth = 2;
        ctx.strokeRect(wx, wy, ww, wh);
    });

    // Draw obstacles
    level.obstacles.forEach(obs => {
        const ox = margin + obs.x * playW;
        const oy = offsetY + margin + obs.y * playH;
        ctx.beginPath();
        ctx.arc(ox, oy, obs.r, 0, Math.PI * 2);
        ctx.fillStyle = '#555';
        ctx.fill();
        ctx.strokeStyle = '#777';
        ctx.lineWidth = 2;
        ctx.stroke();
    });

    // Draw hole
    ctx.beginPath();
    ctx.arc(hole.x, hole.y, HOLE_RADIUS, 0, Math.PI * 2);
    ctx.fillStyle = '#111';
    ctx.fill();
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Draw hole flag
    ctx.beginPath();
    ctx.moveTo(hole.x, hole.y);
    ctx.lineTo(hole.x, hole.y - 30);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(hole.x, hole.y - 30);
    ctx.lineTo(hole.x + 15, hole.y - 25);
    ctx.lineTo(hole.x, hole.y - 20);
    ctx.fillStyle = '#f00';
    ctx.fill();

    // Draw ball
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.strokeStyle = '#ccc';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Draw drag line
    if (isDragging) {
        const dx = dragStart.x - dragEnd.x;
        const dy = dragStart.y - dragEnd.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const power = Math.min(dist, MAX_POWER) / MAX_POWER;

        ctx.beginPath();
        ctx.setLineDash([5, 5]);
        ctx.strokeStyle = `rgba(255, ${Math.floor(255 * (1 - power))}, 0, 0.8)`;
        ctx.lineWidth = 3;
        ctx.moveTo(ball.x, ball.y);
        ctx.lineTo(ball.x + dx * 0.5, ball.y + dy * 0.5);
        ctx.stroke();
        ctx.setLineDash([]);

        // Power indicator
        ctx.fillStyle = '#fff';
        ctx.font = '14px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`力度: ${Math.floor(power * 100)}%`, ball.x, ball.y - 20);
    }

    // Draw particles
    particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.fill();
        ctx.globalAlpha = 1;
    });

    // Draw UI
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`关卡: ${currentLevel + 1}/${LEVELS.length} ${LEVELS[currentLevel].name}`, margin, 35);

    ctx.textAlign = 'center';
    ctx.fillText(`杆数: ${strokes}`, W/2, 35);

    ctx.textAlign = 'right';
    ctx.fillText(`总分: ${totalScore}`, W - margin, 35);

    // Par indicator
    ctx.textAlign = 'center';
    ctx.font = '14px sans-serif';
    const parDiff = strokes - PAR_STROKE;
    if (parDiff < 0) {
        ctx.fillStyle = '#4ade80';
        ctx.fillText(`小鸟球! (${parDiff})`, W/2, 55);
    } else if (parDiff === 0) {
        ctx.fillStyle = '#fff';
        ctx.fillText(`标准杆`, W/2, 55);
    } else {
        ctx.fillStyle = '#f87171';
        ctx.fillText(`+${parDiff}`, W/2, 55);
    }

    // Level complete overlay
    if (screen === SCREEN.LEVEL_COMPLETE) {
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = '#4ade80';
        ctx.font = 'bold 36px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('进洞!', W/2, H/2 - 40);

        ctx.fillStyle = '#fff';
        ctx.font = '20px sans-serif';
        ctx.fillText(`杆数: ${strokes}`, W/2, H/2);

        const levelScore = Math.max(0, 100 - (strokes - 1) * 20);
        ctx.fillText(`得分: ${levelScore}`, W/2, H/2 + 30);

        if (levelCompleteTimer <= 0) {
            ctx.fillStyle = '#888';
            ctx.font = '16px sans-serif';
            ctx.fillText('点击继续', W/2, H/2 + 70);
        }
    }

    // Game over screen
    if (screen === SCREEN.GAMEOVER) {
        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = '#4ade80';
        ctx.font = 'bold 48px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('恭喜通关!', W/2, H/2 - 60);

        ctx.fillStyle = '#fff';
        ctx.font = '24px sans-serif';
        ctx.fillText(`总分: ${totalScore}`, W/2, H/2);

        if (totalScore >= highScore) {
            ctx.fillStyle = '#fbbf24';
            ctx.fillText('新纪录!', W/2, H/2 + 35);
        }

        ctx.fillStyle = '#888';
        ctx.font = '16px sans-serif';
        ctx.fillText('按R键重新开始', W/2, H/2 + 70);
    }
}

// ==================== Game Loop ====================
function gameLoop() {
    if (!paused) {
        if (screen === SCREEN.PLAYING) {
            updateBall();
        }
        if (screen === SCREEN.LEVEL_COMPLETE) {
            levelCompleteTimer--;
            if (levelCompleteTimer <= 0) {
                // Wait for click to continue
            }
        }
        updateParticles();
    }
    render();
    requestAnimationFrame(gameLoop);
}

// ==================== Click Handler for Level Complete ====================
c.addEventListener('click', function(e) {
    if (screen === SCREEN.LEVEL_COMPLETE && levelCompleteTimer <= 0) {
        const levelScore = Math.max(0, 100 - (strokes - 1) * 20);
        totalScore += levelScore;
        currentLevel++;
        loadLevel(currentLevel);
        if (screen === SCREEN.GAMEOVER) {
            playSound('win');
        }
    }
    if (screen === SCREEN.GAMEOVER) {
        // Do nothing, use R key
    }
});

// ==================== Start ====================
init();

})();


// ===== 游戏工坊统一广告系统 =====
const GameMonetize = {
	adsterra: { enabled: !/localhost|127\.0\.0\.1/.test(location.hostname) },
	sponsor: { enabled: true, wechatQR: '', alipayQR: '' },
	interstitial: { enabled: true, cooldownMs: 180000, gameCount: 2 },
	_lastInterTime: 0, _deathCount: 0,
	_gameOverDetected: false,
	init() {
		const banner = document.getElementById('adBanner');
		if (banner && this.adsterra.enabled) {
			const s1 = document.createElement('script');
			s1.src = 'https://pl29544740.effectivecpmnetwork.com/de/26/0e/de260e17b6a348e3489772a87b1cedf1.js';
			s1.async = true;
			banner.appendChild(s1);
		}
		const spBtn = document.getElementById('sponsorBtn');
		const spPanel = document.getElementById('sponsorPanel');
		const spClose = document.getElementById('sponsorClose');
		if (spBtn && spPanel && spClose && this.sponsor.enabled) {
			spBtn.onclick = () => { spPanel.style.display = 'flex'; spPanel.style.pointerEvents = 'auto'; };
			spClose.onclick = () => { spPanel.style.display = 'none'; spPanel.style.pointerEvents = 'none'; };
			spPanel.onclick = (e) => { if (e.target === spPanel) { spPanel.style.display = 'none'; spPanel.style.pointerEvents = 'none'; } };
		} else if (spBtn) { spBtn.style.display = 'none'; }
		const skipBtn = document.getElementById('skipInterstitial');
		const interstitial = document.getElementById('interstitialAd');
		if (skipBtn && interstitial) {
			skipBtn.onclick = () => {
				interstitial.style.display = 'none'; interstitial.style.pointerEvents = 'none';
				if (this._reviveCallback) { const cb = this._reviveCallback; this._reviveCallback = null; cb(); }
			};
		}
		// 自动检测游戏结束状态
		this._startGameOverWatcher();
	},
	_startGameOverWatcher() {
		// 检测#restartBtn或包含"重新开始"/"再来一局"的按钮变为可见
		const checkGameOver = () => {
			if (this._gameOverDetected) return;
			// 方法1: 检测#restartBtn可见
			const restartBtn = document.getElementById('restartBtn');
			if (restartBtn && restartBtn.offsetParent !== null && getComputedStyle(restartBtn).display !== 'none') {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
			// 方法2: 检测#gameOverScreen可见
			const goScreen = document.getElementById('gameOverScreen');
			if (goScreen && getComputedStyle(goScreen).display !== 'none') {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
			// 方法3: 检测screen-gameover可见
			const goScreen2 = document.getElementById('screen-gameover');
			if (goScreen2 && !goScreen2.classList.contains('hidden')) {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
		};
		// 每500ms检查一次
		this._goInterval = setInterval(() => {
			checkGameOver();
			// 如果检测到了，等2秒后重置标志，允许下次检测
			if (this._gameOverDetected) {
				setTimeout(() => { this._gameOverDetected = false; }, 2000);
			}
		}, 500);
	},
	requestRevive(callback) {
		this._reviveCallback = callback || null;
		const el = document.getElementById('interstitialAd');
		if (!el) { if (callback) callback(); return; }
		const s2 = document.createElement('script');
		s2.src = 'https://pl29544742.effectivecpmnetwork.com/be/a9/6d/bea96d779c0ee07c2b15613852dd3e70.js';
		s2.async = true;
		document.getElementById('interstitialAdSlot').innerHTML = '';
		document.getElementById('interstitialAdSlot').appendChild(s2);
		el.style.display = 'flex'; el.style.pointerEvents = 'auto';

		setTimeout(() => { const slot = document.getElementById('interstitialAdSlot'); if (slot && slot.innerHTML.includes('加载中')) { slot.innerHTML = '<div style=color:#aaa;font:13px Microsoft YaHei,sans-serif>广告暂时无法加载<br>点击下方按钮继续</div>'; } }, 3000);
		const skipBtn = document.getElementById('skipInterstitial');
		if (skipBtn) {
			skipBtn.textContent = '5 秒后可跳过'; skipBtn.disabled = true;
			let cd = 5;
			const timer = setInterval(() => {
				cd--;
				if (cd <= 0) { clearInterval(timer); skipBtn.textContent = '跳过广告 ▶'; skipBtn.disabled = false; }
				else { skipBtn.textContent = cd + ' 秒后可跳过'; }
			}, 1000);
		}
	},
	onGameOver() {
		this._deathCount++;
		if (!this.interstitial.enabled) return;
		if (this._deathCount < this.interstitial.gameCount) return;
		if (Date.now() - this._lastInterTime < this.interstitial.cooldownMs) return;
		this._lastInterTime = Date.now(); this._deathCount = 0;
		this.requestRevive(null);
	},
};
GameMonetize.init();
