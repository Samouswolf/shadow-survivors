<body>

    <div class="game-guide" style="margin-bottom:15px;padding:10px;background:#fff3f3;border-radius:8px;border:1px solid #ffcccc;">

<canvas id="c"></canvas>
<div id="ui">

<script>
// ==================== CONFIG ====================
const CONFIG = {
    W: 480, H: 720,
    GRAVITY: 0.45,
    PLAYER_RADIUS: 12,
    HOOK_SPEED: 18,
    HOOK_MAX_DIST: 350,
    SWING_FORCE: 0.65,
    BOOST_ON_RELEASE: 1.2,
    SCROLL_SPEED: 3.5,
    OBSTACLE_GAP: 180,
    OBSTACLE_MIN_GAP_X: 120,
    POINT_PER_OBSTACLE: 10,
    DIFFICULTY_INTERVAL: 500,
    PLAYER_MAX_VX: 10,
    PLAYER_MAX_VY: 14,
    ROPE_RENDER_SEGMENTS: 12,
    TRAIL_LENGTH: 15
};

// ==================== CANVAS SETUP ====================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = CONFIG.W, H = CONFIG.H;
const dpr = Math.min(window.devicePixelRatio || 1, 2);

function resize() {
    const s = Math.min(window.innerWidth / CONFIG.W, window.innerHeight / CONFIG.H);
    W = CONFIG.W; H = CONFIG.H;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = (W * s) + 'px';
    canvas.style.height = (H * s) + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener('resize', resize);

// ==================== AUDIO ====================
let audioCtx = null;
function ensureAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playSound(type) {
    ensureAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const t = audioCtx.currentTime;

    switch(type) {
        case 'hook':
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(400, t);
            osc.frequency.exponentialRampToValueAtTime(800, t + 0.1);
            gain.gain.setValueAtTime(0.15, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
            osc.start(t); osc.stop(t + 0.15);
            break;
        case 'release':
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, t);
            osc.frequency.exponentialRampToValueAtTime(300, t + 0.12);
            gain.gain.setValueAtTime(0.12, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
            osc.start(t); osc.stop(t + 0.12);
            break;
        case 'score':
            osc.type = 'square';
            osc.frequency.setValueAtTime(520, t);
            osc.frequency.setValueAtTime(660, t + 0.06);
            osc.frequency.setValueAtTime(880, t + 0.12);
            gain.gain.setValueAtTime(0.08, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
            osc.start(t); osc.stop(t + 0.2);
            break;
        case 'die':
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, t);
            osc.frequency.exponentialRampToValueAtTime(80, t + 0.4);
            gain.gain.setValueAtTime(0.15, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
            osc.start(t); osc.stop(t + 0.4);
            break;
        case 'perfect':
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, t);
            osc.frequency.setValueAtTime(1100, t + 0.05);
            osc.frequency.setValueAtTime(1320, t + 0.1);
            gain.gain.setValueAtTime(0.1, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
            osc.start(t); osc.stop(t + 0.18);
            break;
    }
}

// ==================== GAME STATE ====================
let G = null;
const BEST_KEY = 'hookHero_best';

function getBest() { return parseInt(localStorage.getItem(BEST_KEY) || '0'); }
function setBest(v) { localStorage.setItem(BEST_KEY, Math.max(getBest(), v).toString()); }

function initState() {
    return {
        player: { x: 120, y: H / 2, vx: 0, vy: 0, radius: CONFIG.PLAYER_RADIUS },
        hook: { active: false, x: 0, y: 0, anchorX: 0, anchorY: 0, ropeLen: 0 },
        camera: { x: 0 },
        obstacles: [],
        particles: [],
        trail: [],
        score: 0,
        distance: 0,
        gameOver: false,
        paused: false,
        difficulty: 1,
        obstaclesPassed: 0,
        combo: 0,
        comboTimer: 0,
        shakeX: 0, shakeY: 0, shakeDur: 0
    };
}

// ==================== OBSTACLE GENERATION ====================
function spawnObstacle(x) {
    const gapY = 100 + Math.random() * (H - CONFIG.OBSTACLE_GAP - 200);
    const gapSize = Math.max(100, CONFIG.OBSTACLE_GAP - G.difficulty * 3);
    // top obstacle
    G.obstacles.push({
        x: x, y: 0, w: 50, h: gapY,
        scored: false, isTop: true, gapY: gapY, gapSize: gapSize
    });
    // bottom obstacle
    G.obstacles.push({
        x: x, y: gapY + gapSize, w: 50, h: H - gapY - gapSize,
        scored: false, isTop: false, gapY: gapY, gapSize: gapSize
    });
    // anchor point (where hook can attach)
    if (Math.random() < 0.6 + G.difficulty * 0.03) {
        const ax = x + 25 + (Math.random() - 0.5) * 40;
        const ay = gapY + gapSize / 2 + (Math.random() - 0.5) * gapSize * 0.4;
        G.obstacles.push({
            x: ax, y: ay, w: 0, h: 0, isAnchor: true, r: 6 + Math.random() * 6
        });
    }
}

function generateInitial() {
    for (let i = 0; i < 12; i++) {
        spawnObstacle(400 + i * 280);
    }
}

function generateMore() {
    const rightEdge = G.obstacles.length > 0
        ? Math.max(...G.obstacles.filter(o => !o.isAnchor).map(o => o.x + o.w))
        : G.camera.x + W + 400;
    while (rightEdge < G.camera.x + W * 2.5) {
        const lastX = G.obstacles.filter(o => !o.isAnchor).reduce((mx, o) => Math.max(mx, o.x + o.w), G.camera.x + W);
        const spacing = 220 + Math.random() * 120 - G.difficulty * 2;
        spawnObstacle(lastX + Math.max(160, spacing));
    }
}

// ==================== PARTICLES ====================
function addParticle(x, y, color, count, speed) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = (0.5 + Math.random()) * speed;
        G.particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * spd,
            vy: Math.sin(angle) * spd,
            life: 1,
            decay: 0.02 + Math.random() * 0.03,
            color: color,
            size: 2 + Math.random() * 3
        });
    }
}

// ==================== HOOK MECHANICS ====================
function fireHook(mx, my) {
    if (G.hook.active) return;
    const p = G.player;
    const worldMx = mx + G.camera.x;
    const worldMy = my;

    // Find nearest anchor point
    let bestDist = CONFIG.HOOK_MAX_DIST;
    let bestAnchor = null;
    for (const ob of G.obstacles) {
        if (!ob.isAnchor) continue;
        const d = Math.hypot(ob.x - p.x, ob.y - p.y);
        if (d < bestDist) {
            bestDist = d;
            bestAnchor = ob;
        }
    }

    // Also check if clicking near an obstacle edge
    if (!bestAnchor) {
        for (const ob of G.obstacles) {
            if (ob.isAnchor) continue;
            const cx = ob.x + ob.w / 2;
            const cy = ob.isTop ? ob.h : ob.y;
            const d = Math.hypot(cx - p.x, cy - p.y);
            if (d < bestDist) {
                bestDist = d;
                bestAnchor = { x: cx, y: cy, r: 6, isVirtual: true };
            }
        }
    }

    if (bestAnchor) {
        G.hook.active = true;
        G.hook.anchorX = bestAnchor.x;
        G.hook.anchorY = bestAnchor.y;
        G.hook.x = p.x;
        G.hook.y = p.y;
        G.hook.ropeLen = Math.hypot(bestAnchor.x - p.x, bestAnchor.y - p.y);
        G.hook.anchorRef = bestAnchor;
        playSound('hook');
        addParticle(bestAnchor.x, bestAnchor.y, '#00d4ff', 6, 3);
    }
}

function releaseHook() {
    if (!G.hook.active) return;
    G.hook.active = false;
    // Boost on release
    G.player.vx += G.player.vx * CONFIG.BOOST_ON_RELEASE * 0.1;
    G.player.vy -= 2;
    playSound('release');
    addParticle(G.player.x, G.player.y, '#ffaa00', 4, 2);
}

// ==================== UPDATE ====================
function update(dt) {
    if (G.gameOver || G.paused) return;

    const p = G.player;
    const cam = G.camera;

    // Apply gravity
    p.vy += CONFIG.GRAVITY;

    // Hook swing physics
    if (G.hook.active) {
        const ax = G.hook.anchorX;
        const ay = G.hook.anchorY;
        const dx = p.x - ax;
        const dy = p.y - ay;
        const dist = Math.hypot(dx, dy);

        if (dist > G.hook.ropeLen) {
            // Constrain to rope length
            const nx = dx / dist;
            const ny = dy / dist;
            p.x = ax + nx * G.hook.ropeLen;
            p.y = ay + ny * G.hook.ropeLen;

            // Remove velocity component along rope (keep tangential)
            const dot = p.vx * nx + p.vy * ny;
            if (dot > 0) {
                p.vx -= dot * nx;
                p.vy -= dot * ny;
            }

            // Apply swing force (tangential acceleration)
            const tx = -ny;
            const ty = nx;
            p.vx += tx * CONFIG.SWING_FORCE;
            p.vy += ty * CONFIG.SWING_FORCE * 0.5;
        }

        // Auto release if too far
        if (dist > CONFIG.HOOK_MAX_DIST * 1.2) releaseHook();
    }

    // Horizontal auto-scroll boost
    p.vx = Math.max(p.vx, CONFIG.SCROLL_SPEED * 0.8);

    // Clamp velocity
    p.vx = Math.max(-2, Math.min(CONFIG.PLAYER_MAX_VX, p.vx));
    p.vy = Math.max(-CONFIG.PLAYER_MAX_VY, Math.min(CONFIG.PLAYER_MAX_VY, p.vy));

    // Move player
    p.x += p.vx;
    p.y += p.vy;

    // Camera follow
    const targetCam = p.x - W * 0.3;
    cam.x += (targetCam - cam.x) * 0.08;

    // Distance & difficulty
    G.distance = Math.floor(p.x / 10);
    G.score = G.distance + G.obstaclesPassed * CONFIG.POINT_PER_OBSTACLE;
    G.difficulty = 1 + Math.floor(G.distance / CONFIG.DIFFICULTY_INTERVAL) * 0.5;

    // Trail
    G.trail.push({ x: p.x, y: p.y, life: 1 });
    if (G.trail.length > CONFIG.TRAIL_LENGTH) G.trail.shift();
    for (const t of G.trail) t.life -= 0.06;

    // Combo timer
    if (G.comboTimer > 0) {
        G.comboTimer -= dt;
        if (G.comboTimer <= 0) G.combo = 0;
    }

    // Particles update
    for (let i = G.particles.length - 1; i >= 0; i--) {
        const pt = G.particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life -= pt.decay;
        if (pt.life <= 0) G.particles.splice(i, 1);
    }

    // Shake decay
    if (G.shakeDur > 0) {
        G.shakeDur -= dt;
        G.shakeX = (Math.random() - 0.5) * G.shakeDur * 10;
        G.shakeY = (Math.random() - 0.5) * G.shakeDur * 10;
    } else {
        G.shakeX = 0; G.shakeY = 0;
    }

    // Obstacle collision & scoring
    for (const ob of G.obstacles) {
        if (ob.isAnchor) continue;
        const ox = ob.x;
        const oy = ob.y;
        const ow = ob.w;
        const oh = ob.h;

        // AABB collision with circle
        const closestX = Math.max(ox, Math.min(p.x, ox + ow));
        const closestY = Math.max(oy, Math.min(p.y, oy + oh));
        const cdx = p.x - closestX;
        const cdy = p.y - closestY;
        const cdist = Math.hypot(cdx, cdy);

        if (cdist < p.radius) {
            // Collision - game over
            G.gameOver = true;
            setBest(G.score);
            playSound('die');
            addParticle(p.x, p.y, '#ff4444', 20, 5);
            shakeScreen(0.5);
            showEndScreen();
            return;
        }

        // Scoring: passed obstacle center
        if (!ob.scored && p.x > ox + ow / 2) {
            ob.scored = true;
            if (ob.isTop) {
                G.obstaclesPassed++;
                G.combo++;
                G.comboTimer = 2;
                const bonus = Math.min(G.combo, 10);
                G.score += bonus;
                if (G.combo > 2) {
                    playSound('perfect');
                    addParticle(p.x, p.y, '#ffd700', 8, 3);
                } else {
                    playSound('score');
                }
            }
        }
    }

    // Clean up off-screen obstacles
    G.obstacles = G.obstacles.filter(o => o.x + (o.w || 20) > cam.x - 100);

    // Generate more
    generateMore();

    // Fall off screen = game over
    if (p.y > H + 50 || p.y < -100) {
        G.gameOver = true;
        setBest(G.score);
        playSound('die');
        showEndScreen();
    }

    // Passed left edge = game over
    if (p.x < cam.x - 50) {
        G.gameOver = true;
        setBest(G.score);
        playSound('die');
        showEndScreen();
    }
}

function shakeScreen(dur) { G.shakeDur = dur; }

// ==================== RENDER ====================
function drawRope() {
    if (!G.hook.active) return;
    const p = G.player;
    const hx = G.hook.anchorX - G.camera.x;
    const hy = G.hook.anchorY;
    const px = p.x - G.camera.x;
    const py = p.y;

    ctx.beginPath();
    ctx.strokeStyle = '#00d4ff';
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.8;
    // Draw rope with slight curve
    const segments = CONFIG.ROPE_RENDER_SEGMENTS;
    ctx.moveTo(px, py);
    for (let i = 1; i <= segments; i++) {
        const t = i / segments;
        const rx = px + (hx - px) * t;
        const ry = py + (hy - py) * t;
        const wave = Math.sin(t * Math.PI * 3 + performance.now() * 0.005) * 4 * (1 - t);
        const nx = -(hy - py) / Math.hypot(hx - px, hy - py);
        const ny = (hx - px) / Math.hypot(hx - px, hy - py);
        ctx.lineTo(rx + nx * wave, ry + ny * wave);
    }
    ctx.stroke();

    // Draw hook anchor glow
    ctx.globalAlpha = 0.4 + Math.sin(performance.now() * 0.005) * 0.2;
    ctx.beginPath();
    ctx.arc(hx, hy, 8, 0, Math.PI * 2);
    ctx.fillStyle = '#00d4ff';
    ctx.fill();
    ctx.globalAlpha = 1;
}

function render() {
    ctx.save();
    ctx.translate(G.shakeX, G.shakeY);

    // Background gradient
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0a0a1e');
    grad.addColorStop(0.5, '#16213e');
    grad.addColorStop(1, '#1a1a3e');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Parallax bg stars
    const cam = G.camera;
    ctx.globalAlpha = 0.3;
    for (let i = 0; i < 40; i++) {
        const sx = ((i * 137 + 50) % (W + 200)) - cam.x * 0.15 % (W + 200);
        const sy = ((i * 89 + 30) % H);
        const sr = 1 + (i % 3);
        ctx.beginPath();
        ctx.arc(((sx % (W + 200)) + W + 200) % (W + 200) - 100, sy, sr, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Obstacles
    for (const ob of G.obstacles) {
        const sx = ob.x - cam.x;
        if (ob.isAnchor) {
            // Draw anchor point
            const glow = 0.5 + Math.sin(performance.now() * 0.004 + ob.x) * 0.3;
            ctx.globalAlpha = glow;
            ctx.beginPath();
            ctx.arc(sx, ob.y, ob.r + 4, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0,212,255,0.2)';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(sx, ob.y, ob.r, 0, Math.PI * 2);
            ctx.fillStyle = '#00d4ff';
            ctx.fill();
            ctx.globalAlpha = 1;
            continue;
        }

        // Draw pipe obstacle
        const grad2 = ob.isTop
            ? ctx.createLinearGradient(sx, ob.h - 40, sx, ob.h)
            : ctx.createLinearGradient(sx, ob.y, sx, ob.y + 40);
        grad2.addColorStop(0, '#2d5a4a');
        grad2.addColorStop(1, '#1a3a2e');
        ctx.fillStyle = grad2;
        ctx.fillRect(sx, ob.y, ob.w, ob.h);

        // Border highlight
        ctx.strokeStyle = '#3a7a6a';
        ctx.lineWidth = 2;
        ctx.strokeRect(sx, ob.y, ob.w, ob.h);

        // Edge cap
        if (ob.isTop) {
            ctx.fillStyle = '#3a8a6a';
            ctx.fillRect(sx - 4, ob.h - 8, ob.w + 8, 8);
        } else {
            ctx.fillStyle = '#3a8a6a';
            ctx.fillRect(sx - 4, ob.y, ob.w + 8, 8);
        }
    }

    // Trail
    for (let i = 0; i < G.trail.length; i++) {
        const t = G.trail[i];
        if (t.life <= 0) continue;
        const tx = t.x - cam.x;
        ctx.globalAlpha = t.life * 0.4;
        ctx.beginPath();
        ctx.arc(tx, t.y, G.player.radius * t.life * 0.6, 0, Math.PI * 2);
        ctx.fillStyle = '#00d4ff';
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Rope
    drawRope();

    // Player
    const px = G.player.x - cam.x;
    const py = G.player.y;
    // Glow
    ctx.beginPath();
    ctx.arc(px, py, G.player.radius + 6, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,212,255,0.15)';
    ctx.fill();
    // Body
    ctx.beginPath();
    ctx.arc(px, py, G.player.radius, 0, Math.PI * 2);
    ctx.fillStyle = '#00d4ff';
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.stroke();
    // Eye (direction indicator)
    const eyeAngle = Math.atan2(G.player.vy, G.player.vx);
    const eyeX = px + Math.cos(eyeAngle) * 5;
    const eyeY = py + Math.sin(eyeAngle) * 5;
    ctx.beginPath();
    ctx.arc(eyeX, eyeY, 3, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();

    // Particles
    for (const pt of G.particles) {
        const ppx = pt.x - cam.x;
        ctx.globalAlpha = pt.life;
        ctx.beginPath();
        ctx.arc(ppx, pt.y, pt.size * pt.life, 0, Math.PI * 2);
        ctx.fillStyle = pt.color;
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    // HUD
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('距离: ' + G.distance + 'm', 16, 32);
    ctx.fillText('得分: ' + G.score, 16, 58);
    if (G.combo > 1) {
        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText('连击 x' + G.combo, 16, 80);
    }
    // Best
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = '13px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('最高: ' + getBest(), W - 16, 32);

    // Hook indicator
    if (G.hook.active) {
        ctx.fillStyle = 'rgba(0,212,255,0.6)';
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('已钩住 - 再次点击释放', W / 2, H - 20);
    } else {
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('点击发射钩锁', W / 2, H - 20);
    }

    ctx.restore();
}

// ==================== GAME LOOP ====================
let lastTime = 0;
function loop(time) {
    if (!G) return;
    const dt = Math.min((time - lastTime) / 1000, 0.05);
    lastTime = time;
    update(dt);
    render();
    if (!G.gameOver) requestAnimationFrame(loop);
}

// ==================== SCREEN MANAGEMENT ====================
function showStart() {
    document.getElementById('startScreen').classList.remove('hidden');
    document.getElementById('endScreen').classList.add('hidden');
    document.getElementById('pauseOverlay').classList.add('hidden');
    G = null;
}

function showEndScreen() {
    document.getElementById('finalScore').textContent = '得分: ' + G.score;
    document.getElementById('bestScore').textContent = '最高分: ' + getBest();
    document.getElementById('distInfo').textContent = '飞行距离: ' + G.distance + 'm · 通过障碍: ' + G.obstaclesPassed + '个';
    document.getElementById('endScreen').classList.remove('hidden');
}

function startGame() {
    ensureAudio();
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('endScreen').classList.add('hidden');
    document.getElementById('pauseOverlay').classList.add('hidden');

    G = initState();
    generateInitial();
    lastTime = performance.now();
    requestAnimationFrame(loop);
}

function togglePause() {
    if (!G || G.gameOver) return;
    G.paused = !G.paused;
    document.getElementById('pauseOverlay').classList.toggle('hidden', !G.paused);
    if (!G.paused) {
        lastTime = performance.now();
        requestAnimationFrame(loop);
    }
}

// ==================== INPUT ====================
function getCanvasPos(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width;
    const scaleY = H / rect.height;
    return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
    };
}

// Mouse
canvas.addEventListener('mousedown', (e) => {
    if (!G || G.gameOver || G.paused) return;
    const pos = getCanvasPos(e.clientX, e.clientY);
    if (G.hook.active) {
        releaseHook();
    } else {
        fireHook(pos.x, pos.y);
    }
});

// Touch
canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (!G || G.gameOver || G.paused) return;
    const touch = e.touches[0];
    const pos = getCanvasPos(touch.clientX, touch.clientY);
    if (G.hook.active) {
        releaseHook();
    } else {
        fireHook(pos.x, pos.y);
    }
}, { passive: false });

// Keyboard
document.addEventListener('keydown', (e) => {
    if (e.key === 'p' || e.key === 'P') {
        togglePause();
        return;
    }
    if (!G || G.gameOver || G.paused) return;
    if (e.code === 'Space' || e.key === ' ') {
        e.preventDefault();
        if (G.hook.active) {
            releaseHook();
        } else {
            // Fire towards mouse or right-up
            fireHook(G.player.x + 100, G.player.y - 50);
        }
    }
});

// ==================== INIT ====================
showStart();

		// 每500ms检查一次
		this._goInterval = setInterval(() => {

	onGameOver() {

		if (!this.interstitial.enabled) return;
		if (this._deathCount < this.interstitial.gameCount) return;

		this._lastInterTime = Date.now(); this._deathCount = 0;
		this.requestRevive(null);
	},
};
