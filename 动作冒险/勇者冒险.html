<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>勇者冒险</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; color: #fff; overflow: hidden; }
        
        .game-container { width: 100%; flex: 1; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: #fff; }
        .stats { display: flex; gap: 20px; font-size: 14px; }
        
        .main-area { flex: 1; background: rgba(0,0,0,0.5); border-radius: 15px; overflow: hidden; position: relative; display: flex; flex-direction: column; }
        
        .battle-area { flex: 1; position: relative; }
        
        .player-info { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 10px; }
        .enemy-info { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 10px; }
        
        .hp-bar { width: 150px; height: 15px; background: #333; border-radius: 8px; overflow: hidden; margin: 5px 0; }
        .hp-fill { height: 100%; background: linear-gradient(90deg, #ff6b6b, #4ecdc4); }
        
        .message-area { height: 60px; background: rgba(0,0,0,0.7); padding: 10px; font-size: 14px; overflow-y: auto; }
        
        .actions { display: flex; gap: 10px; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; }
        
        .action-btn { flex: 1; padding: 15px; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; background: rgba(255,255,255,0.2); color: #fff; }
        .action-btn:hover { background: rgba(255,255,255,0.3); }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }
    /* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */
/* [BATCH-FIX:ad-components-css] */
.sponsor-btn{position:fixed;bottom:8px;left:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:2px 6px;border-radius:10px;font:10px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.sponsor-panel.show{display:flex}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.interstitial-ad.show{display:flex}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* [/BATCH-FIX:ad-components-css] */

/* [AD-FIX:responsive] */
@media (max-width:768px){.ad-banner-container{display:none!important}.sponsor-btn{transform:scale(.8);opacity:.6}}
/* [/AD-FIX:responsive] */
</style>
</head>
<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="title">⚔️ 勇者冒险</div>
            <div class="stats">
                <span>🏆 等级: <span id="level">1</span></span>
                <span>💰 金币: <span id="gold">0</span></span>
                <span>✨ 经验: <span id="exp">0</span></span>
            </div>
        </div>
        
        <div class="main-area">
            <div class="battle-area">
                <div class="player-info">
                    <div>🧙 勇者</div>
                    <div class="hp-bar"><div class="hp-fill" id="playerHp"></div></div>
                    <div>HP: <span id="playerHpText">100/100</span></div>
                </div>
                
                <div class="enemy-info">
                    <div id="enemyName">👹 史莱姆</div>
                    <div class="hp-bar"><div class="hp-fill" id="enemyHp"></div></div>
                    <div>HP: <span id="enemyHpText">50/50</span></div>
                </div>
                
                <div id="battleScene" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 48px;">⚔️</div>
            </div>
            
            <div class="message-area" id="messageArea">准备战斗！</div>
        </div>
        
        <div class="actions">
            <button class="action-btn" onclick="attack()">⚔️ 攻击</button>
            <button class="action-btn" onclick="skill()">✨ 技能</button>
            <button class="action-btn" onclick="heal()">❤️ 治疗</button>
            <button class="action-btn" onclick="run()">🏃 逃跑</button>
        </div>
    </div>
    
    

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="../game_core.js"></script>
    <script>
        const GAME_NAME = '勇者冒险';
        GameCore.init({ highScore: GAME_NAME });
        
        let player = {
            level: 1,
            hp: 100,
            maxHp: 100,
            attack: 15,
            defense: 5,
            gold: 0,
            exp: 0,
            skillCooldown: 0
        };
        
        let enemy = null;
        let gameState = 'battle';
        
        const enemies = [
            { name: '👹 史莱姆', hp: 50, maxHp: 50, attack: 8, reward: 10 },
            { name: '🐉 幼龙', hp: 80, maxHp: 80, attack: 15, reward: 25 },
            { name: '🧛 吸血鬼', hp: 120, maxHp: 120, attack: 20, reward: 40 },
            { name: '👿 恶魔', hp: 180, maxHp: 180, attack: 30, reward: 60 },
            { name: '👑 魔王', hp: 300, maxHp: 300, attack: 45, reward: 100 }
        ];
        
        function initGame() {
            spawnEnemy();
            updateUI();
        }
        
        function spawnEnemy() {
            const enemyIndex = Math.min(Math.floor(player.level / 2), enemies.length - 1);
            const template = enemies[enemyIndex];
            enemy = { ...template };
            updateUI();
            addMessage(`遭遇了 ${enemy.name}！`);
        }
        
        function updateUI() {
            document.getElementById('level').textContent = player.level;
            document.getElementById('gold').textContent = player.gold;
            document.getElementById('exp').textContent = player.exp;
            
            document.getElementById('playerHpText').textContent = `${player.hp}/${player.maxHp}`;
            document.getElementById('playerHp').style.width = `${(player.hp / player.maxHp) * 100}%`;
            
            if (enemy) {
                document.getElementById('enemyName').textContent = enemy.name;
                document.getElementById('enemyHpText').textContent = `${enemy.hp}/${enemy.maxHp}`;
                document.getElementById('enemyHp').style.width = `${(enemy.hp / enemy.maxHp) * 100}%`;
            }
            
            GameCore.highScore.set(GAME_NAME, player.level);
        }
        
        function addMessage(msg) {
            const area = document.getElementById('messageArea');
            area.textContent = msg;
        }
        
        function attack() {
            if (gameState !== 'battle' || !enemy) return;
            
            const damage = Math.max(1, player.attack - enemy.attack / 2);
            enemy.hp -= damage;
            addMessage(`你对 ${enemy.name} 造成了 ${damage} 点伤害！`);
            
            updateUI();
            
            if (enemy.hp <= 0) {
                victory();
            } else {
                setTimeout(enemyTurn, 500);
            }
        }
        
        function skill() {
            if (gameState !== 'battle' || !enemy) return;
            
            const now = Date.now();
            if (now - player.skillCooldown < 5000) {
                addMessage('技能冷却中！');
                return;
            }
            
            const damage = player.attack * 2;
            enemy.hp -= damage;
            player.skillCooldown = now;
            addMessage(`✨ 释放技能！对 ${enemy.name} 造成了 ${damage} 点伤害！`);
            
            updateUI();
            
            if (enemy.hp <= 0) {
                victory();
            } else {
                setTimeout(enemyTurn, 500);
            }
        }
        
        function heal() {
            if (gameState !== 'battle' || !enemy) return;
            
            const healAmount = Math.floor(player.maxHp * 0.3);
            player.hp = Math.min(player.maxHp, player.hp + healAmount);
            addMessage(`❤️ 治疗了 ${healAmount} 点生命值！`);
            
            updateUI();
            setTimeout(enemyTurn, 500);
        }
        
        function run() {
            if (gameState !== 'battle' || !enemy) return;
            
            if (Math.random() > 0.5) {
                addMessage('🏃 成功逃跑！');
                spawnEnemy();
            } else {
                addMessage('逃跑失败！');
                setTimeout(enemyTurn, 500);
            }
        }
        
        function enemyTurn() {
            if (!enemy || enemy.hp <= 0) return;
            
            const damage = Math.max(1, enemy.attack - player.defense);
            player.hp -= damage;
            addMessage(`${enemy.name} 对你造成了 ${damage} 点伤害！`);
            
            updateUI();
            
            if (player.hp <= 0) {
                gameOver();
            }
        }
        
        function victory() {
            addMessage(`🎉 击败了 ${enemy.name}！获得 ${enemy.reward} 金币！`);
            player.gold += enemy.reward;
            player.exp += enemy.reward * 2;
            
            checkLevelUp();
            updateUI();
            
            setTimeout(() => {
                spawnEnemy();
            }, 1500);
        }
        
        function checkLevelUp() {
            const expNeeded = player.level * 100;
            if (player.exp >= expNeeded) {
                player.exp -= expNeeded;
                player.level++;
                player.maxHp += 20;
                player.hp = player.maxHp;
                player.attack += 5;
                player.defense += 2;
                addMessage(`🏆 升级了！当前等级: ${player.level}`);
            }
        }
        
        function gameOver() {
            gameState = 'gameover';
            addMessage('💀 你被击败了！');
            GameCore.hints.show('游戏结束！');
            
            setTimeout(() => {
                player = {
                    level: 1,
                    hp: 100,
                    maxHp: 100,
                    attack: 15,
                    defense: 5,
                    gold: 0,
                    exp: 0,
                    skillCooldown: 0
                };
                gameState = 'battle';
                spawnEnemy();
                addMessage('复活！继续冒险！');
            }, 2000);
        }
        
        initGame();
        GameCore.touch.enableAllButtons();
    </script>
<!-- [BATCH-FIX:responsive-js] -->
<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>
<!-- [/BATCH-FIX:responsive-js] -->
<!-- [BATCH-FIX:touch-support] -->
<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>
<!-- [/BATCH-FIX:touch-support] -->

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
