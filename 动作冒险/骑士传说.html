<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>骑士传说</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; color: #fff; overflow: hidden; }
        
        .game-container { width: 100%; flex: 1; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: #fff; }
        .stats { display: flex; gap: 20px; font-size: 14px; }
        
        .main-area { flex: 1; background: rgba(0,0,0,0.5); border-radius: 15px; overflow: hidden; position: relative; }
        
        .knight-display { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 80px; }
        
        .status-panel { position: absolute; bottom: 20px; left: 0; right: 0; display: flex; justify-content: center; gap: 30px; }
        
        .status-item { text-align: center; }
        .status-bar { width: 100px; height: 15px; background: #333; border-radius: 8px; overflow: hidden; margin-top: 5px; }
        .status-fill { height: 100%; background: linear-gradient(90deg, #ff6b6b, #4ecdc4); }
        
        .actions { display: flex; gap: 10px; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; }
        
        .action-btn { flex: 1; padding: 15px; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; background: rgba(255,255,255,0.2); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="title">🛡️ 骑士传说</div>
            <div class="stats">
                <span>🏆 称号: <span id="title">见习骑士</span></span>
                <span>⚔️ 力量: <span id="strength">10</span></span>
                <span>🛡️ 防御: <span id="defense">5</span></span>
            </div>
        </div>
        
        <div class="main-area">
            <div class="knight-display" id="knightDisplay">🛡️</div>
            
            <div class="status-panel">
                <div class="status-item">
                    <div>❤️ 生命</div>
                    <div class="status-bar"><div class="status-fill" id="hpBar"></div></div>
                    <div id="hpText">100/100</div>
                </div>
                <div class="status-item">
                    <div>⭐ 声望</div>
                    <div class="status-bar"><div class="status-fill" id="fameBar"></div></div>
                    <div id="fameText">0/100</div>
                </div>
                <div class="status-item">
                    <div>💰 荣誉</div>
                    <div class="status-bar"><div class="status-fill" id="honorBar"></div></div>
                    <div id="honorText">0/100</div>
                </div>
            </div>
            
            <div id="message" style="position: absolute; top: 20px; left: 50%; transform: translateX(-50%); font-size: 18px;">准备好成为传奇骑士了吗？</div>
        </div>
        
        <div class="actions">
            <button class="action-btn" onclick="train()">💪 训练</button>
            <button class="action-btn" onclick="battle()">⚔️ 决斗</button>
            <button class="action-btn" onclick="quest()">📜 任务</button>
            <button class="action-btn" onclick="rest()">😴 休息</button>
        </div>
    </div>
    
    <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>

    <script src="game_core.js"></script>
    <script>
        const GAME_NAME = '骑士传说';
        GameCore.init({ highScore: GAME_NAME });
        
        let knight = {
            hp: 100,
            maxHp: 100,
            strength: 10,
            defense: 5,
            fame: 0,
            honor: 0,
            level: 1
        };
        
        const titles = [
            { name: '见习骑士', minFame: 0 },
            { name: '正式骑士', minFame: 50 },
            { name: '银盾骑士', minFame: 150 },
            { name: '金剑骑士', minFame: 300 },
            { name: '皇家骑士', minFame: 500 },
            { name: '传奇骑士', minFame: 1000 }
        ];
        
        const enemies = [
            { name: '强盗', strength: 8, reward: 10 },
            { name: '野兽', strength: 12, reward: 15 },
            { name: '黑骑士', strength: 20, reward: 30 },
            { name: '恶龙', strength: 35, reward: 50 },
            { name: '魔王', strength: 50, reward: 100 }
        ];
        
        const quests = [
            { name: '护送商队', difficulty: 1, reward: { fame: 10, honor: 5 }, description: '保护商队安全通过森林' },
            { name: '清除强盗', difficulty: 2, reward: { fame: 20, honor: 10 }, description: '消灭森林中的强盗团伙' },
            { name: '救援公主', difficulty: 3, reward: { fame: 50, honor: 30 }, description: '从恶龙手中救出公主' },
            { name: '讨伐魔王', difficulty: 5, reward: { fame: 100, honor: 50 }, description: '进入魔界讨伐魔王' }
        ];
        
        function initGame() {
            updateUI();
        }
        
        function updateUI() {
            const title = titles.slice().reverse().find(t => knight.fame >= t.minFame);
            document.getElementById('title').textContent = title ? title.name : titles[0].name;
            document.getElementById('strength').textContent = knight.strength;
            document.getElementById('defense').textContent = knight.defense;
            
            document.getElementById('hpText').textContent = `${knight.hp}/${knight.maxHp}`;
            document.getElementById('hpBar').style.width = `${(knight.hp / knight.maxHp) * 100}%`;
            
            document.getElementById('fameText').textContent = `${knight.fame}`;
            document.getElementById('fameBar').style.width = `${Math.min(100, (knight.fame / 100) * 10)}%`;
            
            document.getElementById('honorText').textContent = `${knight.honor}`;
            document.getElementById('honorBar').style.width = `${Math.min(100, (knight.honor / 100) * 10)}%`;
            
            GameCore.highScore.set(GAME_NAME, knight.fame);
        }
        
        function setMessage(msg) {
            document.getElementById('message').textContent = msg;
        }
        
        function train() {
            if (knight.hp < 20) {
                setMessage('体力不足！需要休息！');
                return;
            }
            
            knight.hp -= 20;
            knight.strength += 2;
            knight.defense += 1;
            
            setMessage('💪 经过刻苦训练，力量和防御都提升了！');
            updateUI();
        }
        
        function battle() {
            if (knight.hp < 30) {
                setMessage('体力不足！需要休息！');
                return;
            }
            
            const enemyIndex = Math.min(Math.floor(knight.fame / 50), enemies.length - 1);
            const enemy = enemies[enemyIndex];
            
            const playerDamage = Math.max(1, knight.strength - enemy.strength / 3);
            const enemyDamage = Math.max(1, enemy.strength - knight.defense);
            
            knight.hp -= enemyDamage;
            
            if (playerDamage > Math.random() * 10) {
                knight.fame += enemy.reward;
                knight.honor += Math.floor(enemy.reward / 2);
                setMessage(`⚔️ 战胜了 ${enemy.name}！获得 ${enemy.reward} 声望！`);
            } else {
                setMessage(`⚔️ 与 ${enemy.name} 战斗失败，受到了 ${enemyDamage} 点伤害！`);
            }
            
            checkLevelUp();
            updateUI();
        }
        
        function quest() {
            if (knight.hp < 40) {
                setMessage('体力不足！需要休息！');
                return;
            }
            
            const questIndex = Math.min(Math.floor(knight.fame / 100), quests.length - 1);
            const quest = quests[questIndex];
            
            knight.hp -= 30;
            
            if (knight.strength + knight.defense > quest.difficulty * 10 + Math.random() * 20) {
                knight.fame += quest.reward.fame;
                knight.honor += quest.reward.honor;
                setMessage(`📜 完成任务「${quest.name}」！获得 ${quest.reward.fame} 声望和 ${quest.reward.honor} 荣誉！`);
            } else {
                setMessage(`📜 任务「${quest.name}」失败了...`);
            }
            
            checkLevelUp();
            updateUI();
        }
        
        function rest() {
            const restore = Math.floor(knight.maxMana ? knight.maxMana * 0.5 : knight.maxHp * 0.5);
            knight.hp = Math.min(knight.maxHp, knight.hp + restore);
            
            setMessage(`😴 休息恢复了 ${restore} 点体力！`);
            updateUI();
        }
        
        function checkLevelUp() {
            const levelThreshold = knight.level * 100;
            if (knight.fame >= levelThreshold) {
                knight.level++;
                knight.maxHp += 20;
                knight.hp = knight.maxHp;
                setMessage(`🏆 晋升了！当前称号: ${titles.find(t => knight.fame >= t.minFame)?.name}`);
            }
        }
        
        initGame();
        GameCore.touch.enableAllButtons();
    </script>
</body>
</html>
