<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>骑士传说</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; color: #fff; overflow: hidden; }
        
        .game-container { width: 100%; flex: 1; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: #fff; }
        .stats { display: flex; gap: 20px; font-size: 14px; }
        
        .main-area { flex: 1; background: rgba(0,0,0,0.5); border-radius: 15px; overflow: hidden; position: relative; }
        
        .knight-display { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 80px; }
        
        .status-panel { position: absolute; bottom: 20px; left: 0; right: 0; display: flex; justify-content: center; gap: 30px; }
        
        .status-item { text-align: center; }
        .status-bar { width: 100px; height: 15px; background: #333; border-radius: 8px; overflow: hidden; margin-top: 5px; }
        .status-fill { height: 100%; background: linear-gradient(90deg, #ff6b6b, #4ecdc4); }
        
        .actions { display: flex; gap: 10px; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; }
        
        .action-btn { flex: 1; padding: 15px; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; background: rgba(255,255,255,0.2); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }
    /* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */
/* [BATCH-FIX:ad-components-css] */
.sponsor-btn{position:fixed;bottom:8px;left:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:2px 6px;border-radius:10px;font:10px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.sponsor-panel.show{display:flex}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.interstitial-ad.show{display:flex}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* [/BATCH-FIX:ad-components-css] */

/* [AD-FIX:responsive] */
@media (max-width:768px){.ad-banner-container{display:none!important}.sponsor-btn{transform:scale(.8);opacity:.6}}
/* [/AD-FIX:responsive] */
</style>
</head>
<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="title">🛡️ 骑士传说</div>
            <div class="stats">
                <span>🏆 称号: <span id="title">见习骑士</span></span>
                <span>⚔️ 力量: <span id="strength">10</span></span>
                <span>🛡️ 防御: <span id="defense">5</span></span>
            </div>
        </div>
        
        <div class="main-area">
            <div class="knight-display" id="knightDisplay">🛡️</div>
            
            <div class="status-panel">
                <div class="status-item">
                    <div>❤️ 生命</div>
                    <div class="status-bar"><div class="status-fill" id="hpBar"></div></div>
                    <div id="hpText">100/100</div>
                </div>
                <div class="status-item">
                    <div>⭐ 声望</div>
                    <div class="status-bar"><div class="status-fill" id="fameBar"></div></div>
                    <div id="fameText">0/100</div>
                </div>
                <div class="status-item">
                    <div>💰 荣誉</div>
                    <div class="status-bar"><div class="status-fill" id="honorBar"></div></div>
                    <div id="honorText">0/100</div>
                </div>
            </div>
            
            <div id="message" style="position: absolute; top: 20px; left: 50%; transform: translateX(-50%); font-size: 18px;">准备好成为传奇骑士了吗？</div>
        </div>
        
        <div class="actions">
            <button class="action-btn" onclick="train()">💪 训练</button>
            <button class="action-btn" onclick="battle()">⚔️ 决斗</button>
            <button class="action-btn" onclick="quest()">📜 任务</button>
            <button class="action-btn" onclick="rest()">😴 休息</button>
        </div>
    </div>
    
    

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="../game_core.js"></script>
    <script>
        const GAME_NAME = '骑士传说';
        GameCore.init({ highScore: GAME_NAME });
        
        let knight = {
            hp: 100,
            maxHp: 100,
            strength: 10,
            defense: 5,
            fame: 0,
            honor: 0,
            level: 1
        };
        
        const titles = [
            { name: '见习骑士', minFame: 0 },
            { name: '正式骑士', minFame: 50 },
            { name: '银盾骑士', minFame: 150 },
            { name: '金剑骑士', minFame: 300 },
            { name: '皇家骑士', minFame: 500 },
            { name: '传奇骑士', minFame: 1000 }
        ];
        
        const enemies = [
            { name: '强盗', strength: 8, reward: 10 },
            { name: '野兽', strength: 12, reward: 15 },
            { name: '黑骑士', strength: 20, reward: 30 },
            { name: '恶龙', strength: 35, reward: 50 },
            { name: '魔王', strength: 50, reward: 100 }
        ];
        
        const quests = [
            { name: '护送商队', difficulty: 1, reward: { fame: 10, honor: 5 }, description: '保护商队安全通过森林' },
            { name: '清除强盗', difficulty: 2, reward: { fame: 20, honor: 10 }, description: '消灭森林中的强盗团伙' },
            { name: '救援公主', difficulty: 3, reward: { fame: 50, honor: 30 }, description: '从恶龙手中救出公主' },
            { name: '讨伐魔王', difficulty: 5, reward: { fame: 100, honor: 50 }, description: '进入魔界讨伐魔王' }
        ];
        
        function initGame() {
            updateUI();
        }
        
        function updateUI() {
            const title = titles.slice().reverse().find(t => knight.fame >= t.minFame);
            document.getElementById('title').textContent = title ? title.name : titles[0].name;
            document.getElementById('strength').textContent = knight.strength;
            document.getElementById('defense').textContent = knight.defense;
            
            document.getElementById('hpText').textContent = `${knight.hp}/${knight.maxHp}`;
            document.getElementById('hpBar').style.width = `${(knight.hp / knight.maxHp) * 100}%`;
            
            document.getElementById('fameText').textContent = `${knight.fame}`;
            document.getElementById('fameBar').style.width = `${Math.min(100, (knight.fame / 100) * 10)}%`;
            
            document.getElementById('honorText').textContent = `${knight.honor}`;
            document.getElementById('honorBar').style.width = `${Math.min(100, (knight.honor / 100) * 10)}%`;
            
            GameCore.highScore.set(GAME_NAME, knight.fame);
        }
        
        function setMessage(msg) {
            document.getElementById('message').textContent = msg;
        }
        
        function train() {
            if (knight.hp < 20) {
                setMessage('体力不足！需要休息！');
                return;
            }
            
            knight.hp -= 20;
            knight.strength += 2;
            knight.defense += 1;
            
            setMessage('💪 经过刻苦训练，力量和防御都提升了！');
            updateUI();
        }
        
        function battle() {
            if (knight.hp < 30) {
                setMessage('体力不足！需要休息！');
                return;
            }
            
            const enemyIndex = Math.min(Math.floor(knight.fame / 50), enemies.length - 1);
            const enemy = enemies[enemyIndex];
            
            const playerDamage = Math.max(1, knight.strength - enemy.strength / 3);
            const enemyDamage = Math.max(1, enemy.strength - knight.defense);
            
            knight.hp -= enemyDamage;
            
            if (playerDamage > Math.random() * 10) {
                knight.fame += enemy.reward;
                knight.honor += Math.floor(enemy.reward / 2);
                setMessage(`⚔️ 战胜了 ${enemy.name}！获得 ${enemy.reward} 声望！`);
            } else {
                setMessage(`⚔️ 与 ${enemy.name} 战斗失败，受到了 ${enemyDamage} 点伤害！`);
            }
            
            checkLevelUp();
            updateUI();
        }
        
        function quest() {
            if (knight.hp < 40) {
                setMessage('体力不足！需要休息！');
                return;
            }
            
            const questIndex = Math.min(Math.floor(knight.fame / 100), quests.length - 1);
            const quest = quests[questIndex];
            
            knight.hp -= 30;
            
            if (knight.strength + knight.defense > quest.difficulty * 10 + Math.random() * 20) {
                knight.fame += quest.reward.fame;
                knight.honor += quest.reward.honor;
                setMessage(`📜 完成任务「${quest.name}」！获得 ${quest.reward.fame} 声望和 ${quest.reward.honor} 荣誉！`);
            } else {
                setMessage(`📜 任务「${quest.name}」失败了...`);
            }
            
            checkLevelUp();
            updateUI();
        }
        
        function rest() {
            const restore = Math.floor(knight.maxMana ? knight.maxMana * 0.5 : knight.maxHp * 0.5);
            knight.hp = Math.min(knight.maxHp, knight.hp + restore);
            
            setMessage(`😴 休息恢复了 ${restore} 点体力！`);
            updateUI();
        }
        
        function checkLevelUp() {
            const levelThreshold = knight.level * 100;
            if (knight.fame >= levelThreshold) {
                knight.level++;
                knight.maxHp += 20;
                knight.hp = knight.maxHp;
                setMessage(`🏆 晋升了！当前称号: ${titles.find(t => knight.fame >= t.minFame)?.name}`);
            }
        }
        
        initGame();
        GameCore.touch.enableAllButtons();
    </script>
<!-- [BATCH-FIX:responsive-js] -->
<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>
<!-- [/BATCH-FIX:responsive-js] -->
<!-- [BATCH-FIX:touch-support] -->
<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>
<!-- [/BATCH-FIX:touch-support] -->

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
