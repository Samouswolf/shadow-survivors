  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;

<script src="../game_core.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px;
            background: linear-gradient(135deg, #3498db, #2980b9);
            border-radius: 12px;
        }
        .stat {
            text-align: center;
            color: white;
        }
        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }
        .stat-value {
            font-size: 20px;
            font-weight: bold;
        }
        .space-view {
            position: relative;
            height: 300px;
            background: linear-gradient(135deg, #0c0c0c, #1a1a2e);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        .ship {
            position: absolute;
            width: 40px;
            height: 40px;
            font-size: 30px;
            transition: all 0.1s;
            z-index: 10;
        }
        .planet {
            position: absolute;
            font-size: 40px;
            cursor: pointer;
            transition: all 0.2s;
            z-index: 5;
        }
        .planet:hover {
            transform: scale(1.2);
        }
        .asteroid {
            position: absolute;
            font-size: 25px;
            z-index: 5;
        }
        .resource {
            position: absolute;
            font-size: 20px;
            z-index: 5;
            animation: float 2s infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .energy-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            padding: 10px;
            background: #3498db;
            border-radius: 10px;
        }
        .energy-label {
            color: white;
            font-weight: bold;
        }
        .energy-fill {
            flex: 1;
            height: 20px;
            background: #2c3e50;
            border-radius: 10px;
            overflow: hidden;
        }
        .energy-inner {
            height: 100%;
            background: linear-gradient(90deg, #f39c12, #e67e22);
            transition: width 0.3s;
        }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 20px 40px;
            border-radius: 15px;
            font-size: 18px;
            display: none;
            z-index: 100;
            text-align: center;
        }
        .message.show { display: block; }
        .guide {
            text-align: center;
            color: #636e72;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .ad-banner {
            width: 100%;
            height: 60px;
            background: linear-gradient(135deg, #3498db, #2980b9);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            margin-top: 10px;
            font-size: 14px;
        }

<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">星球</div>
                <div class="stat-value" id="planets">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">资源</div>
                <div class="stat-value" id="resources">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">距离</div>
                <div class="stat-value" id="distance">0</div>
            </div>
        </div>

        <div class="energy-bar">
            <div class="energy-label">能量</div>
            <div class="energy-fill">
                <div class="energy-inner" id="energyBar" style="width: 100%"></div>
            </div>
        </div>

        <div class="guide">点击星球探索，收集资源，躲避陨石！</div>

        <div class="space-view" id="spaceView"></div>

        <div class="controls">
            <button class="btn btn-primary" id="btnReset">🚀 新探险</button>
        </div>

        <div class="message" id="message"></div>

        
    </div>

    <script>
        let shipPos = { x: 250, y: 150 };
        let energy = 100;
        let planetsVisited = 0;
        let resourcesCollected = 0;
        let distance = 0;
        let planets = [];
        let asteroids = [];
        let resources = [];
        let gameOver = false;
        let moveInterval = null;

        function initSpace() {
            const view = document.getElementById('spaceView');
            view.innerHTML = '';

            // 添加星星背景
            for (let i = 0; i < 50; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 2 + 's';
                view.appendChild(star);
            }

            // 添加飞船
            const ship = document.createElement('div');
            ship.className = 'ship';
            ship.id = 'ship';
            ship.textContent = '🚀';
            ship.style.left = shipPos.x + 'px';
            ship.style.top = shipPos.y + 'px';
            view.appendChild(ship);

            // 添加星球
            planets = [];
            for (let i = 0; i < 5; i++) {
                const planet = document.createElement('div');
                planet.className = 'planet';
                planet.textContent = ['🌍', '🌙', '🔴', '🟠', '🟡'][i];
                planet.style.left = 50 + Math.random() * 400 + 'px';
                planet.style.top = 50 + Math.random() * 200 + 'px';
                planet.dataset.index = i;
                planet.addEventListener('click', () => visitPlanet(i));
                view.appendChild(planet);
                planets.push({
                    el: planet,
                    visited: false,
                    resources: 20 + Math.floor(Math.random() * 30)
                });
            }

            // 添加陨石
            asteroids = [];
            for (let i = 0; i < 3; i++) {
                const asteroid = document.createElement('div');
                asteroid.className = 'asteroid';
                asteroid.textContent = '☄️';
                asteroid.style.left = Math.random() * 450 + 'px';
                asteroid.style.top = Math.random() * 250 + 'px';
                view.appendChild(asteroid);
                asteroids.push({
                    el: asteroid,
                    dx: (Math.random() - 0.5) * 4,
                    dy: (Math.random() - 0.5) * 4
                });
            }

            // 添加资源
            resources = [];
            for (let i = 0; i < 5; i++) {
                const resource = document.createElement('div');
                resource.className = 'resource';
                resource.textContent = '💎';
                resource.style.left = Math.random() * 450 + 'px';
                resource.style.top = Math.random() * 250 + 'px';
                resource.addEventListener('click', () => collectResource(i));
                view.appendChild(resource);
                resources.push({ el: resource, collected: false });
            }

            shipPos = { x: 250, y: 150 };
            energy = 100;
            planetsVisited = 0;
            resourcesCollected = 0;
            distance = 0;
            gameOver = false;

            if (moveInterval) clearInterval(moveInterval);
            moveInterval = setInterval(updateAsteroids, 50);

            updateUI();
        }

        function updateAsteroids() {
            if (gameOver) return;

            asteroids.forEach(asteroid => {
                let x = parseFloat(asteroid.el.style.left);
                let y = parseFloat(asteroid.el.style.top);

                x += asteroid.dx;
                y += asteroid.dy;

                if (x < 0 || x > 450) asteroid.dx *= -1;
                if (y < 0 || y > 250) asteroid.dy *= -1;

                asteroid.el.style.left = x + 'px';
                asteroid.el.style.top = y + 'px';

                // 检查碰撞
                const dx = Math.abs(x - shipPos.x);
                const dy = Math.abs(y - shipPos.y);
                if (dx < 30 && dy < 30) {
                    energy -= 20;
                    showMessage('撞击陨石！-20能量');
                    if (energy <= 0) {
                        gameOver = true;
                        clearInterval(moveInterval);
                        showMessage('能量耗尽！\n星球: ' + planetsVisited + '\n资源: ' + resourcesCollected);
                    }
                    updateUI();
                }
            });
        }

        function visitPlanet(index) {
            if (gameOver) return;
            if (planets[index].visited) {
                showMessage('已探索过此星球');
                return;
            }

            const planet = planets[index];
            const px = parseFloat(planet.el.style.left);
            const py = parseFloat(planet.el.style.top);

            // 移动飞船
            shipPos.x = px;
            shipPos.y = py;
            document.getElementById('ship').style.left = shipPos.x + 'px';
            document.getElementById('ship').style.top = shipPos.y + 'px';

            energy -= 10;
            distance += 50;
            planetsVisited++;
            resourcesCollected += planet.resources;
            planet.visited = true;
            planet.el.style.opacity = '0.5';

            showMessage('探索星球！+' + planet.resources + '资源');

            if (planetsVisited >= 5) {
                gameOver = true;
                clearInterval(moveInterval);
                showMessage('🎉 探险完成！\n资源: ' + resourcesCollected);
                GameCore.highScore.set('space_game', resourcesCollected);
            }

            updateUI();
        }

        function collectResource(index) {
            if (gameOver) return;
            if (resources[index].collected) return;

            const resource = resources[index];
            const rx = parseFloat(resource.el.style.left);
            const ry = parseFloat(resource.el.style.top);

            shipPos.x = rx;
            shipPos.y = ry;
            document.getElementById('ship').style.left = shipPos.x + 'px';
            document.getElementById('ship').style.top = shipPos.y + 'px';

            resourcesCollected += 10;
            distance += 20;
            resource.collected = true;
            resource.el.style.display = 'none';

            showMessage('收集资源！+10');

            updateUI();
        }

        function updateUI() {
            document.getElementById('planets').textContent = planetsVisited + '/5';
            document.getElementById('resources').textContent = resourcesCollected;
            document.getElementById('distance').textContent = distance;
            document.getElementById('energyBar').style.width = energy + '%';
        }

        function showMessage(msg) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 1500);
        }

        function resetGame() {
            initSpace();
        }

        document.getElementById('btnReset').addEventListener('click', resetGame);

        // 键盘控制飞船移动
        document.addEventListener('keydown', (e) => {
            if (gameOver) return;
            const step = 20;
            switch (e.key) {
                case 'ArrowUp':
                    shipPos.y = Math.max(0, shipPos.y - step);
                    break;
                case 'ArrowDown':
                    shipPos.y = Math.min(260, shipPos.y + step);
                    break;
                case 'ArrowLeft':
                    shipPos.x = Math.max(0, shipPos.x - step);
                    break;
                case 'ArrowRight':
                    shipPos.x = Math.min(460, shipPos.x + step);
                    break;
            }
            document.getElementById('ship').style.left = shipPos.x + 'px';
            document.getElementById('ship').style.top = shipPos.y + 'px';
            distance += 5;
            energy -= 1;
            updateUI();
        });

        // 初始化
        GameCore.init({ highScore: 'space_game' });
        initSpace();
    </script>

<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>
<!-- [/BATCH-FIX:responsive-js] -->
<!-- [BATCH-FIX:touch-support] -->
<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>
<!-- [/BATCH-FIX:touch-support] -->

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
