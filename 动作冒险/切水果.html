<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;font-family:"Microsoft YaHei","PingFang SC",sans-serif}
body{background:#1a0a00}
#gameContainer{position:relative;width:100%;height:100%;max-width:600px;margin:0 auto}
canvas{display:block;width:100%;height:100%}
#uiLayer{position:absolute;top:0;left:0;right:0;pointer-events:none;z-index:10}

#comboDisplay{position:absolute;top:48px;left:50%;transform:translateX(-50%);color:#ffd700;font-size:20px;font-weight:bold;text-shadow:0 0 12px rgba(255,215,0,.8);opacity:0;transition:opacity .15s}
#comboDisplay.show{opacity:1}
#comboDisplay .combo-count{font-size:32px;display:block;text-align:center}
#livesDisplay{position:absolute;top:16px;right:16px;display:flex;gap:4px}
#livesDisplay .heart{font-size:24px;transition:transform .3s,opacity .3s}
#livesDisplay .heart.lost{transform:scale(0);opacity:0}
#timerDisplay{position:absolute;top:16px;right:16px;color:#fff;font-size:26px;font-weight:bold;text-shadow:0 2px 6px rgba(0,0,0,.6)}
#timerDisplay.warning{color:#ff4444;animation:pulse .5s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
#menuOverlay{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(20,5,0,.92),rgba(10,2,0,.97))}

.mode-btn:hover{background:rgba(255,215,0,.15);border-color:rgba(255,215,0,.6);transform:scale(1.03)}
.mode-btn .mode-desc{display:block;font-size:11px;color:#aaa;font-weight:normal;margin-top:4px;letter-spacing:0}
#gameOverOverlay{position:absolute;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.88)}
#gameOverOverlay h2{font-size:36px;color:#ff4444;margin-bottom:8px;text-shadow:0 0 20px rgba(255,0,0,.5)}

#gameOverOverlay .best-score{font-size:16px;color:#aaa;margin-bottom:8px}
#gameOverOverlay .stats{color:#ccc;font-size:14px;margin-bottom:20px;text-align:center;line-height:1.8}
#gameOverOverlay .restart-btn{width:200px;padding:12px 0;border:2px solid rgba(255,215,0,.4);border-radius:28px;background:rgba(255,215,0,.1);color:#ffd700;font-size:16px;font-weight:bold;cursor:pointer;transition:all .25s;letter-spacing:2px}
#gameOverOverlay .restart-btn:hover{background:rgba(255,215,0,.2);transform:scale(1.05)}

.start-screen{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.88);gap:20px;pointer-events:auto}

.start-screen .start-btn{padding:14px 56px;background:linear-gradient(135deg,#667eea,#764ba2);border:none;border-radius:30px;color:#fff;font-size:20px;font-weight:700;cursor:pointer;transition:.2s;letter-spacing:2px;box-shadow:0 6px 30px rgba(102,126,234,.4);animation:startPulse 2s ease-in-out infinite}

.start-screen .keys-hint{color:#555;font-size:12px;text-align:center;padding:0 20px;line-height:1.8}
/* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}

@media (max-width:768px){.ad-banner-container{display:none!important}.sponsor-btn{transform:scale(.8);opacity:.6}}
/* [/AD-FIX:responsive] */
</style>

<script>
// ==================== 游戏主逻辑 ====================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let W, H, scale;
let gameState = 'menu'; // menu | playing | over
let gameMode = 'classic'; // classic | timed
let score = 0;
let lives = 3;
let timeLeft = 60;
let timerInterval = null;
let fruits = [];
let particles = [];
let bladeTrail = [];
let isSwiping = false;
let swipeStart = null;
let currentCombo = 0;
let maxCombo = 0;
let totalFruitsCut = 0;
let bestScore = parseInt(localStorage.getItem('fruitNinja_best') || '0');
let lastSpawnTime = 0;
let spawnInterval = 800;
let gameStartTime = 0;
let missedFruits = 0;
let animFrame;

// 水果定义
const fruitTypes = [
    { name: '西瓜', color: '#2d8a4e', innerColor: '#ff3b3b', radius: 40, points: 1, emoji: '🍉' },
    { name: '苹果', color: '#e74c3c', innerColor: '#fffde7', radius: 30, points: 1, emoji: '🍎' },
    { name: '橙子', color: '#ff9800', innerColor: '#ffe0b2', radius: 28, points: 1, emoji: '🍊' },
    { name: '香蕉', color: '#fdd835', innerColor: '#fff9c4', radius: 25, points: 2, emoji: '🍌' },
    { name: '猕猴桃', color: '#795548', innerColor: '#8bc34a', radius: 26, points: 2, emoji: '🥝' },
    { name: '菠萝', color: '#f9a825', innerColor: '#fff176', radius: 32, points: 3, emoji: '🍍' },
];

// 炸弹
const bombDef = { name: '炸弹', color: '#1a1a1a', innerColor: '#333', radius: 30, points: 0, emoji: '💣', isBomb: true };

function resize() {
    const container = document.getElementById('gameContainer');
    const rect = container.getBoundingClientRect();
    W = rect.width;
    H = rect.height;
    canvas.width = W * (window.devicePixelRatio || 1);
    canvas.height = H * (window.devicePixelRatio || 1);
    scale = (window.devicePixelRatio || 1);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(scale, scale);
}

window.addEventListener('resize', resize);

// ==================== 绘制函数 ====================

function drawWoodBackground() {
    // 深色木纹
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#3e1f0d');
    grad.addColorStop(0.3, '#4a2512');
    grad.addColorStop(0.6, '#3a1a08');
    grad.addColorStop(1, '#2a0f04');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // 木纹纹理
    ctx.globalAlpha = 0.06;
    for (let y = 0; y < H; y += 4) {
        ctx.strokeStyle = Math.random() > 0.5 ? '#000' : '#fff';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, y + Math.sin(y * 0.05) * 3);
        for (let x = 0; x < W; x += 20) {
            ctx.lineTo(x, y + Math.sin(x * 0.02 + y * 0.05) * 3);
        }
        ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // 顶部底部渐变暗角
    const topGrad = ctx.createLinearGradient(0, 0, 0, H * 0.25);
    topGrad.addColorStop(0, 'rgba(0,0,0,0.5)');
    topGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = topGrad;
    ctx.fillRect(0, 0, W, H * 0.25);

    const botGrad = ctx.createLinearGradient(0, H * 0.75, 0, H);
    botGrad.addColorStop(0, 'rgba(0,0,0,0)');
    botGrad.addColorStop(1, 'rgba(0,0,0,0.5)');
    ctx.fillStyle = botGrad;
    ctx.fillRect(0, H * 0.75, W, H * 0.25);
}

function drawFruit(f) {
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.rotation);

    const r = f.radius;

    if (f.isBomb) {
        // 炸弹
        const bombGrad = ctx.createRadialGradient(-r * 0.2, -r * 0.2, r * 0.1, 0, 0, r);
        bombGrad.addColorStop(0, '#555');
        bombGrad.addColorStop(0.7, '#1a1a1a');
        bombGrad.addColorStop(1, '#000');
        ctx.fillStyle = bombGrad;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#444';
        ctx.lineWidth = 2;
        ctx.stroke();

        // 高光
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.beginPath();
        ctx.arc(-r * 0.25, -r * 0.35, r * 0.3, 0, Math.PI * 2);
        ctx.fill();

        // 引信
        ctx.strokeStyle = '#8d6e63';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, -r);
        ctx.quadraticCurveTo(r * 0.6, -r * 1.8, r * 0.3, -r * 2);
        ctx.stroke();

        // 火花
        const sparkTime = Date.now() / 100;
        ctx.fillStyle = '#ff6600';
        ctx.beginPath();
        ctx.arc(r * 0.3 + Math.sin(sparkTime) * 4, -r * 2 + Math.cos(sparkTime) * 3, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffcc00';
        ctx.beginPath();
        ctx.arc(r * 0.3 + Math.sin(sparkTime + 1) * 3, -r * 2 + Math.cos(sparkTime + 1) * 2, 2.5, 0, Math.PI * 2);
        ctx.fill();

        // ⚠️ 符号
        ctx.fillStyle = '#ff4444';
        ctx.font = `bold ${r * 0.9}px "Microsoft YaHei"`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('✕', 0, 0);

        ctx.restore();
        return;
    }

    // 水果主体
    const grad = ctx.createRadialGradient(-r * 0.15, -r * 0.25, r * 0.1, 0, 0, r);
    grad.addColorStop(0, f.innerColor);
    grad.addColorStop(0.85, f.color);
    grad.addColorStop(1, darkenColor(f.color));
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();

    // 高光
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.beginPath();
    ctx.arc(-r * 0.2, -r * 0.3, r * 0.35, 0, Math.PI * 2);
    ctx.fill();

    // 细节绘制
    if (f.type === '西瓜') {
        // 西瓜条纹
        ctx.strokeStyle = 'rgba(0,0,0,0.15)';
        ctx.lineWidth = r * 0.12;
        for (let i = 0; i < 4; i++) {
            const angle = (i / 4) * Math.PI * 2;
            ctx.beginPath();
            ctx.arc(0, 0, r * 0.7, angle, angle + 0.5);
            ctx.stroke();
        }
        // 西瓜籽
        ctx.fillStyle = '#1a1a1a';
        for (let i = 0; i < 5; i++) {
            const a = (i / 5) * Math.PI * 2 + 0.3;
            ctx.save();
            ctx.translate(Math.cos(a) * r * 0.4, Math.sin(a) * r * 0.4);
            ctx.rotate(a);
            ctx.fillRect(-2, -4, 4, 8);
            ctx.restore();
        }
    } else if (f.type === '苹果') {
        // 苹果梗+叶子
        ctx.strokeStyle = '#5d4037';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, -r * 0.9);
        ctx.lineTo(0, -r * 1.3);
        ctx.stroke();
        ctx.fillStyle = '#4caf50';
        ctx.beginPath();
        ctx.ellipse(r * 0.25, -r * 1.1, r * 0.3, r * 0.15, 0.3, 0, Math.PI * 2);
        ctx.fill();
    } else if (f.type === '橙子') {
        // 橙子纹理点
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        for (let i = 0; i < 8; i++) {
            const a = (i / 8) * Math.PI * 2;
            ctx.beginPath();
            ctx.arc(Math.cos(a) * r * 0.5, Math.sin(a) * r * 0.5, r * 0.08, 0, Math.PI * 2);
            ctx.fill();
        }
        // 顶部小凹
        ctx.fillStyle = '#4caf50';
        ctx.beginPath();
        ctx.arc(0, -r * 0.85, r * 0.2, 0, Math.PI * 2);
        ctx.fill();
    } else if (f.type === '香蕉') {
        // 香蕉用弧形绘制 - 重新绘制覆盖圆形
        ctx.fillStyle = '#fdd835';
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(0,0,0,0.08)';
        ctx.beginPath();
        ctx.arc(0, r * 0.15, r * 0.6, 0, Math.PI);
        ctx.fill();
        // 香蕉尖
        ctx.fillStyle = '#8d6e63';
        ctx.beginPath();
        ctx.arc(0, -r * 0.8, r * 0.15, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#5d4037';
        ctx.beginPath();
        ctx.arc(0, r * 0.8, r * 0.12, 0, Math.PI * 2);
        ctx.fill();
    } else if (f.type === '猕猴桃') {
        // 猕猴桃绒毛感
        ctx.fillStyle = 'rgba(139,195,74,0.3)';
        ctx.beginPath();
        ctx.arc(0, 0, r - 2, 0, Math.PI * 2);
        ctx.fill();
        // 中心白点
        ctx.fillStyle = '#f5f5dc';
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.3, 0, Math.PI * 2);
        ctx.fill();
        // 种子放射线
        ctx.strokeStyle = 'rgba(0,0,0,0.2)';
        ctx.lineWidth = 1;
        for (let i = 0; i < 8; i++) {
            const a = (i / 8) * Math.PI * 2;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(Math.cos(a) * r * 0.7, Math.sin(a) * r * 0.7);
            ctx.stroke();
        }
    } else if (f.type === '菠萝') {
        // 菠萝菱形纹理
        ctx.strokeStyle = 'rgba(0,0,0,0.15)';
        ctx.lineWidth = 1;
        for (let y = -r * 0.6; y < r * 0.6; y += r * 0.25) {
            ctx.beginPath();
            ctx.moveTo(-r * 0.7, y);
            ctx.lineTo(r * 0.7, y);
            ctx.stroke();
        }
        for (let x = -r * 0.5; x < r * 0.5; x += r * 0.25) {
            ctx.beginPath();
            const angle = 0.5;
            ctx.moveTo(x, -r * 0.7);
            ctx.lineTo(x + r * 0.3, r * 0.7);
            ctx.stroke();
        }
        // 菠萝冠
        ctx.fillStyle = '#4caf50';
        ctx.beginPath();
        ctx.ellipse(0, -r * 0.8, r * 0.5, r * 0.4, 0, Math.PI, Math.PI * 2);
        ctx.fill();
        for (let i = -1; i <= 1; i++) {
            ctx.beginPath();
            ctx.ellipse(i * r * 0.25, -r * 1.05, r * 0.2, r * 0.35, 0, Math.PI, Math.PI * 2);
            ctx.fill();
        }
    }

    ctx.restore();
}

function darkenColor(hex) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    const factor = 0.55;
    return '#' + [r, g, b].map(c => Math.floor(c * factor).toString(16).padStart(2, '0')).join('');
}

function drawBladeTrail() {
    if (bladeTrail.length < 2) return;

    for (let i = 1; i < bladeTrail.length; i++) {
        const p0 = bladeTrail[i - 1];
        const p1 = bladeTrail[i];
        const alpha = i / bladeTrail.length;
        const width = alpha * 6 + 1;

        // 发光外层
        ctx.strokeStyle = `rgba(255,255,255,${alpha * 0.3})`;
        ctx.lineWidth = width + 6;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(p0.x, p0.y);
        ctx.lineTo(p1.x, p1.y);
        ctx.stroke();

        // 内层刀光
        ctx.strokeStyle = `rgba(255,255,255,${alpha * 0.9})`;
        ctx.lineWidth = width;
        ctx.beginPath();
        ctx.moveTo(p0.x, p0.y);
        ctx.lineTo(p1.x, p1.y);
        ctx.stroke();

        // 核心
        ctx.strokeStyle = `rgba(255,240,200,${alpha})`;
        ctx.lineWidth = width * 0.5;
        ctx.beginPath();
        ctx.moveTo(p0.x, p0.y);
        ctx.lineTo(p1.x, p1.y);
        ctx.stroke();
    }
}

function drawParticles() {
    for (const p of particles) {
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();

        // 小光晕
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * 0.4, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

// ==================== 游戏逻辑 ====================

function spawnFruit() {
    const margin = 60;
    const x = margin + Math.random() * (W - margin * 2);
    const isBomb = Math.random() < 0.08;

    let typeData;
    if (isBomb) {
        typeData = bombDef;
    } else {
        // 加权随机
        const weights = [3, 3, 3, 2, 2, 1.5];
        const total = weights.reduce((a, b) => a + b, 0);
        let r = Math.random() * total;
        let idx = 0;
        for (let i = 0; i < weights.length; i++) {
            r -= weights[i];
            if (r <= 0) { idx = i; break; }
        }
        typeData = fruitTypes[idx];
    }

    // 速度计算：确保能达到屏幕中上部
    const targetY = H * 0.15 + Math.random() * H * 0.3;
    const dy = H - targetY;
    const vy = -Math.sqrt(2 * 600 * dy); // v² = 2gh, g≈600
    const vx = (Math.random() - 0.5) * 400;

    const fruit = {
        x: x,
        y: H + typeData.radius,
        vx: vx,
        vy: vy,
        radius: typeData.radius * (0.85 + Math.random() * 0.3),
        rotation: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 6,
        color: typeData.color,
        innerColor: typeData.innerColor,
        type: typeData.name,
        points: typeData.points,
        isBomb: !!typeData.isBomb,
        cut: false,
        missed: false,
    };

    fruits.push(fruit);
}

function spawnWave() {
    const count = 2 + Math.floor(Math.random() * 3);
    const delay = 0;
    for (let i = 0; i < count; i++) {
        setTimeout(() => {
            if (gameState === 'playing') spawnFruit();
        }, i * 150);
    }
}

function cutFruit(fruit) {
    if (fruit.cut) return;
    fruit.cut = true;

    if (fruit.isBomb) {
        // 炸弹爆炸
        explodeBomb(fruit);
        if (gameMode === 'classic') {
            lives--;
            updateLives();
            if (lives <= 0) {
                endGame();
                return;
            }
        } else {
            score = Math.max(0, score - 10);
            updateScore();
        }
        // 屏幕震动
        shakeScreen();
        return;
    }

    currentCombo++;
    totalFruitsCut++;
    if (currentCombo > maxCombo) maxCombo = currentCombo;

    // 连击加分
    let points = fruit.points;
    if (currentCombo >= 2) {
        points += currentCombo - 1;
    }
    score += points;
    updateScore();

    // 显示连击
    if (currentCombo >= 3) {
        showCombo();
    }

    // 果汁粒子
    spawnJuiceParticles(fruit);
}

function explodeBomb(fruit) {
    // 爆炸粒子
    for (let i = 0; i < 30; i++) {
        const angle = (i / 30) * Math.PI * 2;
        const speed = 100 + Math.random() * 250;
        particles.push({
            x: fruit.x,
            y: fruit.y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            size: 3 + Math.random() * 5,
            color: Math.random() > 0.5 ? '#ff4400' : '#ffaa00',
            life: 0.6 + Math.random() * 0.4,
            maxLife: 0.6 + Math.random() * 0.4,
        });
    }
    // 烟圈
    for (let i = 0; i < 15; i++) {
        particles.push({
            x: fruit.x + (Math.random() - 0.5) * 20,
            y: fruit.y + (Math.random() - 0.5) * 20,
            vx: (Math.random() - 0.5) * 60,
            vy: -30 + (Math.random() - 0.5) * 40,
            size: 8 + Math.random() * 15,
            color: '#555',
            life: 0.8 + Math.random() * 0.5,
            maxLife: 0.8 + Math.random() * 0.5,
        });
    }
}

function spawnJuiceParticles(fruit) {
    const count = 12 + Math.floor(Math.random() * 8);
    const juiceColor = fruit.innerColor;
    for (let i = 0; i < count; i++) {
        const angle = (i / count) * Math.PI * 2 + Math.random() * 0.5;
        const speed = 80 + Math.random() * 200;
        particles.push({
            x: fruit.x,
            y: fruit.y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 100,
            size: 2 + Math.random() * 4,
            color: juiceColor,
            life: 0.5 + Math.random() * 0.5,
            maxLife: 0.5 + Math.random() * 0.5,
        });
    }
    // 果汁飞溅
    for (let i = 0; i < 5; i++) {
        const angle = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI;
        const speed = 150 + Math.random() * 300;
        particles.push({
            x: fruit.x,
            y: fruit.y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            size: 3 + Math.random() * 5,
            color: juiceColor,
            life: 0.3 + Math.random() * 0.3,
            maxLife: 0.3 + Math.random() * 0.3,
        });
    }
}

function shakeScreen() {
    const container = document.getElementById('gameContainer');
    container.style.transform = 'translateX(-4px)';
    setTimeout(() => { container.style.transform = 'translateX(4px)'; }, 50);
    setTimeout(() => { container.style.transform = 'translateX(-3px)'; }, 100);

function showCombo() {

function updateScore() {

// ==================== 碰撞检测 ====================

function lineCircleIntersect(x1, y1, x2, y2, cx, cy, r) {
    const dx = x2 - x1;
    const dy = y2 - y1;
    const fx = x1 - cx;
    const fy = y1 - cy;

    const a = dx * dx + dy * dy;
    const b = 2 * (fx * dx + fy * dy);
    const c = fx * fx + fy * fy - r * r;

    let discriminant = b * b - 4 * a * c;
    if (discriminant < 0) return false;

    discriminant = Math.sqrt(discriminant);
    const t1 = (-b - discriminant) / (2 * a);
    const t2 = (-b + discriminant) / (2 * a);

    return (t1 >= 0 && t1 <= 1) || (t2 >= 0 && t2 <= 1) || (t1 < 0 && t2 > 1);
}

function checkCut() {
    if (bladeTrail.length < 2) return;

    let cutInThisSwipe = 0;

    for (let i = 1; i < bladeTrail.length; i++) {
        const p0 = bladeTrail[i - 1];
        const p1 = bladeTrail[i];

        for (const fruit of fruits) {
            if (fruit.cut || fruit.missed) continue;
            if (lineCircleIntersect(p0.x, p0.y, p1.x, p1.y, fruit.x, fruit.y, fruit.radius)) {
                cutFruit(fruit);
                cutInThisSwipe++;
            }
        }
    }

    if (cutInThisSwipe === 0 && isSwiping) {
        // 没有切到任何东西，重置连击
        currentCombo = 0;
    }
}

// ==================== 输入处理 ====================

function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    if (e.touches) {
        return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
    }
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

canvas.addEventListener('mousedown', (e) => {
    if (gameState !== 'playing') return;
    isSwiping = true;
    bladeTrail = [];
    const pos = getPos(e);
    bladeTrail.push(pos);
    currentCombo = 0;
});

canvas.addEventListener('mousemove', (e) => {
    if (!isSwiping || gameState !== 'playing') return;
    const pos = getPos(e);
    bladeTrail.push(pos);
    if (bladeTrail.length > 30) bladeTrail.shift();
    checkCut();
});

canvas.addEventListener('mouseup', () => {
    isSwiping = false;
    currentCombo = 0;
});

canvas.addEventListener('mouseleave', () => {
    isSwiping = false;
    currentCombo = 0;
});

canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (gameState !== 'playing') return;
    isSwiping = true;
    bladeTrail = [];
    const pos = getPos(e);
    bladeTrail.push(pos);
    currentCombo = 0;
});

canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (!isSwiping || gameState !== 'playing') return;
    const pos = getPos(e);

    checkCut();
});

canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    isSwiping = false;
    currentCombo = 0;
});

// ==================== 游戏循环 ====================

function update(dt) {
    if (gameState !== 'playing') return;

    // 更新水果
    for (const fruit of fruits) {
        if (fruit.cut || fruit.missed) continue;
        fruit.vy += 600 * dt; // 重力
        fruit.x += fruit.vx * dt;
        fruit.y += fruit.vy * dt;
        fruit.rotation += fruit.rotSpeed * dt;

        // 检查是否掉出屏幕
        if (fruit.y > H + fruit.radius * 2) {
            fruit.missed = true;
            if (!fruit.isBomb) {
                missedFruits++;
                if (gameMode === 'classic' && missedFruits >= 3) {
                    // 经典模式漏掉3个水果失去一条命
                    missedFruits = 0;
                    lives--;
                    updateLives();
                    if (lives <= 0) {
                        endGame();
                        return;
                    }
                }
            }
        }
    }

    // 计时模式
    if (gameMode === 'timed') {
        timeLeft -= dt;
        updateTimer();
        if (timeLeft <= 0) {
            timeLeft = 0;
            endGame();
            return;
        }
    }

    // 更新粒子
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 300 * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // 清理已切/已掉的水果
    fruits = fruits.filter(f => !f.cut && !f.missed);

    // 刀光衰减
    if (!isSwiping && bladeTrail.length > 0) {
        bladeTrail.shift();
        if (bladeTrail.length < 2) bladeTrail = [];
    }

    // 生成水果
    const now = Date.now();
    if (now - lastSpawnTime > spawnInterval) {
        spawnWave();
        lastSpawnTime = now;
        spawnInterval = 500 + Math.random() * 700;
    }
}

function render() {
    ctx.clearRect(0, 0, W, H);
    drawWoodBackground();

    // 绘制水果
    for (const fruit of fruits) {
        drawFruit(fruit);
    }

    // 绘制刀光
    drawBladeTrail();

    // 绘制粒子
    drawParticles();
}

function gameLoop(timestamp) {
    if (!animFrame) return;
    const dt = Math.min((timestamp - (gameLoop._lastTime || timestamp)) / 1000, 0.05);
    gameLoop._lastTime = timestamp;

    update(dt);
    render();

    animFrame = requestAnimationFrame(gameLoop);
}
gameLoop._lastTime = 0;

// ==================== 游戏流程 ====================

function startGame(mode) {
    gameMode = mode;
    gameState = 'playing';
    score = 0;
    lives = 3;
    timeLeft = 60;
    currentCombo = 0;
    maxCombo = 0;
    totalFruitsCut = 0;
    missedFruits = 0;
    fruits = [];
    particles = [];
    bladeTrail = [];
    isSwiping = false;
    lastSpawnTime = Date.now();
    gameStartTime = Date.now();

    updateScore();
    document.getElementById('scoreDisplay').textContent = '0';

    if (mode === 'classic') {
        document.getElementById('livesDisplay').style.display = 'flex';
        document.getElementById('timerDisplay').style.display = 'none';
        updateLives();
    } else {
        document.getElementById('livesDisplay').style.display = 'none';
        document.getElementById('timerDisplay').style.display = 'block';
        document.getElementById('timerDisplay').classList.remove('warning');
        updateTimer();
    }

    document.getElementById('menuOverlay').style.display = 'none';
    document.getElementById('gameOverOverlay').style.display = 'none';

    // 初始一波水果
    setTimeout(() => spawnWave(), 300);
    setTimeout(() => spawnWave(), 800);

    // 启动循环
    if (!animFrame) {
        animFrame = requestAnimationFrame(gameLoop);
    }
}

function endGame() {
    gameState = 'over';

    if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
    }

    if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('fruitNinja_best', bestScore);
    }

    document.getElementById('finalScore').textContent = score;
    document.getElementById('bestScoreText').textContent = '最高分: ' + bestScore;
    document.getElementById('bestCombo').textContent = maxCombo;
    document.getElementById('totalFruits').textContent = totalFruitsCut;
    document.getElementById('gameOverOverlay').style.display = 'flex';

    if (gameMode === 'classic') {
        document.getElementById('gameOverTitle').textContent = '💀 游戏结束';
    } else {
        document.getElementById('gameOverTitle').textContent = '⏰ 时间到!';
    }

    // 显示插屏广告
    if (typeof showInterstitialAd === 'function') {
        setTimeout(() => showInterstitialAd(), 500);
    }
}

function restartGame() {
    endGame();
    setTimeout(() => startGame(gameMode), 100);
}

function backToMenu() {
    gameState = 'menu';
    fruits = [];
    particles = [];
    bladeTrail = [];
    document.getElementById('menuOverlay').style.display = 'flex';
    document.getElementById('gameOverOverlay').style.display = 'none';
    document.getElementById('livesDisplay').style.display = 'none';
    document.getElementById('timerDisplay').style.display = 'none';
    document.getElementById('comboDisplay').classList.remove('show');
    document.getElementById('scoreDisplay').textContent = '0';
    document.getElementById('startScreen').classList.remove('hidden');
    if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
    }
}
