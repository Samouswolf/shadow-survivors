        function playSound(freq = 440, duration = 0.1) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

<script>
// ==================== 赛车对战 - 核心引擎 ====================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// --- 响应式尺寸 ---
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// --- 世界常量 ---
const WORLD_W = 2000, WORLD_H = 1400;
const TRACK_HALF = 70;
const LAP_TOTAL = 3;
const CAR_COUNT = 4;

// --- 赛道中心路径 ---
const trackPath = [
  {x:400,y:700},{x:420,y:620},{x:500,y:520},{x:620,y:440},
  {x:780,y:380},{x:950,y:340},{x:1120,y:340},{x:1300,y:380},
  {x:1450,y:460},{x:1550,y:560},{x:1600,y:680},{x:1580,y:800},
  {x:1500,y:920},{x:1360,y:1000},{x:1180,y:1040},{x:1000,y:1060},
  {x:820,y:1040},{x:660,y:980},{x:520,y:900},{x:430,y:800},{x:400,y:700}
];

// 赛道段缓存
const trackSegments = [];
for (let i = 0; i < trackPath.length; i++) {
  const p1 = trackPath[i];
  const p2 = trackPath[(i + 1) % trackPath.length];
  const dx = p2.x - p1.x, dy = p2.y - p1.y;
  const len = Math.sqrt(dx * dx + dy * dy);
  trackSegments.push({p1, p2, dx, dy, len, nx: -dy / len, ny: dx / len});
}

// 计算点到赛道最近距离
function distToTrack(px, py) {
  let minDist = Infinity, closestSeg = null, closestT = 0;
  for (const seg of trackSegments) {
    const ex = px - seg.p1.x, ey = py - seg.p1.y;
    let t = (ex * seg.dx + ey * seg.dy) / (seg.len * seg.len);
    t = Math.max(0, Math.min(1, t));
    const cx = seg.p1.x + t * seg.dx, cy = seg.p1.y + t * seg.dy;
    const d = Math.sqrt((px - cx) ** 2 + (py - cy) ** 2);
    if (d < minDist) { minDist = d; closestSeg = seg; closestT = t; }
  }
  return {dist: minDist, seg: closestSeg, t: closestT};
}

// 获取赛道上某点的前进方向
function trackDirAt(px, py) {
  const r = distToTrack(px, py);
  if (!r.seg) return 0;
  return Math.atan2(r.seg.dy, r.seg.dx);
}

// --- 道具位置 ---
const itemPositions = [];
for (let i = 0; i < trackPath.length; i += 2) {
  const p = trackPath[i];
  const off = (i % 4 === 0) ? 30 : -30;
  const seg = trackSegments[i];
  itemPositions.push({
    x: p.x + seg.nx * off,
    y: p.y + seg.ny * off,
    active: true,
    type: null
  });
}

// 道具类型
const ITEMS = ['boost', 'missile', 'mine', 'shield'];
const ITEM_ICONS = {boost:'⚡', missile:'🚀', mine:'💣', shield:'🛡️'};
const ITEM_COLORS = {boost:'#ff0', missile:'#f44', mine:'#f80', shield:'#0ff'};

// --- 粒子系统 ---
const particles = [];
function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 1 + Math.random() * 3;
    particles.push({
      x, y, vx: Math.cos(a) * s * 2, vy: Math.sin(a) * s * 2,
      life: 0.4 + Math.random() * 0.6, maxLife: 0.4 + Math.random() * 0.6,
      color, size: 1 + Math.random() * 2
    });
  }
}

// --- 轮胎痕迹 ---
const tireMarks = [];
function addTireMark(x, y, angle) {
  tireMarks.push({x, y, angle, life: 2.5, maxLife: 2.5});
  if (tireMarks.length > 200) tireMarks.shift();
}

// --- 汽车类 ---
class Car {
  constructor(x, y, angle, color, name, isPlayer, aiLevel) {
    this.x = x; this.y = y;
    this.angle = angle; // 车头朝向
    this.vx = 0; this.vy = 0;
    this.speed = 0;
    this.color = color;
    this.name = name;
    this.isPlayer = isPlayer;
    this.aiLevel = aiLevel || 0.7;

    this.width = 16; this.height = 30;
    this.maxSpeed = 380 + (isPlayer ? 20 : Math.random() * 30);
    this.acceleration = 420;
    this.braking = 500;
    this.friction = 0.96;
    this.turnSpeed = 3.2;
    this.driftFactor = 0;

    this.lap = 0;
    this.checkpoint = 0;
    this.finished = false;
    this.finishTime = 0;

    this.item = null;
    this.itemCooldown = 0;

    this.shieldActive = false;
    this.shieldTimer = 0;
    this.boostActive = false;
    this.boostTimer = 0;
    this.stunned = false;
    this.stunTimer = 0;

    // AI 数据
    this.aiTargetIdx = 0;
    this.aiWander = 0;
    this.aiThrottle = 1;
  }

  getVelocityAngle() {
    if (Math.abs(this.vx) < 0.5 && Math.abs(this.vy) < 0.5) return this.angle;
    return Math.atan2(this.vy, this.vx);
  }

  update(dt, input) {
    if (this.finished) return;
    if (this.stunned) {
      this.stunTimer -= dt;
      if (this.stunTimer <= 0) this.stunned = false;
      this.vx *= 0.93;
      this.vy *= 0.93;
    }

    // 道具计时器
    if (this.boostActive) {
      this.boostTimer -= dt;
      if (this.boostTimer <= 0) this.boostActive = false;
    }
    if (this.shieldActive) {
      this.shieldTimer -= dt;
      if (this.shieldTimer <= 0) this.shieldActive = false;
    }
    if (this.itemCooldown > 0) this.itemCooldown -= dt;

    const currentMaxSpeed = this.boostActive ? this.maxSpeed * 1.6 : this.maxSpeed;
    const currentAccel = this.boostActive ? this.acceleration * 1.4 : this.acceleration;

    if (this.isPlayer) {
      // 玩家输入
      if (input.accel) {
        this.speed += currentAccel * dt;
      }
      if (input.brake) {
        this.speed -= this.braking * dt;
      }
      if (input.left) {
        this.angle -= this.turnSpeed * dt * (1 + Math.abs(this.speed) / this.maxSpeed * 0.5);
      }
      if (input.right) {
        this.angle += this.turnSpeed * dt * (1 + Math.abs(this.speed) / this.maxSpeed * 0.5);
      }
    } else {
      // AI 控制
      this.aiUpdate(dt);
    }

    // 摩擦
    if (!input.accel && !input.brake && this.isPlayer) {
      this.speed *= Math.pow(this.friction, dt * 60);
    }
    if (!this.isPlayer && !this.aiThrottle) {
      this.speed *= Math.pow(this.friction, dt * 60);
    }

    // 限速
    this.speed = Math.max(-currentMaxSpeed * 0.3, Math.min(currentMaxSpeed, this.speed));

    // 漂移因子
    const velAngle = this.getVelocityAngle();
    let angleDiff = this.angle - velAngle;
    while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
    while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
    this.driftFactor = angleDiff;

    // 速度方向混合（漂移感）
    const driftStrength = Math.abs(angleDiff) * 0.15;
    const forwardX = Math.cos(this.angle);
    const forwardY = Math.sin(this.angle);
    const velDirX = Math.cos(velAngle);
    const velDirY = Math.sin(velAngle);

    this.vx = velDirX * Math.abs(this.speed) * (1 - driftStrength) + forwardX * this.speed * driftStrength;
    this.vy = velDirY * Math.abs(this.speed) * (1 - driftStrength) + forwardY * this.speed * driftStrength;

    if (this.speed < 0) {
      this.vx = -this.vx;
      this.vy = -this.vy;
    }

    // 移动
    this.x += this.vx * dt;
    this.y += this.vy * dt;

    // 赛道边界检测
    const trackInfo = distToTrack(this.x, this.y);
    if (trackInfo.dist > TRACK_HALF && trackInfo.seg) {
      // 推回赛道
      const cx = trackInfo.seg.p1.x + trackInfo.t * trackInfo.seg.dx;
      const cy = trackInfo.seg.p1.y + trackInfo.t * trackInfo.seg.dy;
      const pushX = (this.x - cx) / trackInfo.dist * TRACK_HALF;
      const pushY = (this.y - cy) / trackInfo.dist * TRACK_HALF;
      this.x = cx + pushX;
      this.y = cy + pushY;
      // 减速
      this.speed *= 0.85;
      this.vx *= 0.7;
      this.vy *= 0.7;
    }

    // 漂移痕迹
    if (Math.abs(this.driftFactor) > 0.3 && Math.abs(this.speed) > 80) {
      addTireMark(this.x, this.y, this.angle);
    }

    // 检查道具拾取
    this.checkItemPickup();

    // 检查点检测
    this.checkCheckpoint();

    // 世界边界
    this.x = Math.max(0, Math.min(WORLD_W, this.x));
    this.y = Math.max(0, Math.min(WORLD_H, this.y));
  }

  aiUpdate(dt) {
    // 找到目标路径点
    const target = trackPath[this.aiTargetIdx];
    const dx = target.x - this.x, dy = target.y - this.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < 80) {
      this.aiTargetIdx = (this.aiTargetIdx + 1) % trackPath.length;
    }

    const targetAngle = Math.atan2(dy, dx);
    let angleDiff = targetAngle - this.angle;
    while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
    while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;

    // 转向
    this.angle += Math.sign(angleDiff) * Math.min(Math.abs(angleDiff), this.turnSpeed * this.aiLevel * dt * 3);

    // 速度管理 - 弯道减速
    const curveFactor = Math.abs(angleDiff);
    const speedTarget = this.maxSpeed * (1 - curveFactor * 0.25);

    if (this.speed < speedTarget) {
      this.speed += this.acceleration * this.aiLevel * dt;
    } else {
      this.speed += (speedTarget - this.speed) * 2 * dt;
    }

    // AI 随机波动
    this.aiWander += (Math.random() - 0.5) * dt * 2;
    this.aiWander = Math.max(-0.6, Math.min(0.6, this.aiWander));
    this.angle += this.aiWander * dt * 0.5;

    // AI 使用道具
    if (this.item && this.itemCooldown <= 0) {
      if (this.item === 'boost' && this.speed < this.maxSpeed * 0.8) {
        this.useItem();
      } else if (this.item === 'shield' && this.shieldTimer <= 0) {
        this.useItem();
      } else if (this.item === 'missile' && Math.random() < 0.003) {
        this.useItem();
      } else if (this.item === 'mine' && Math.random() < 0.002) {
        this.useItem();
      }
    }
  }

  checkItemPickup() {
    for (const ip of itemPositions) {
      if (!ip.active) continue;
      const dx = this.x - ip.x, dy = this.y - ip.y;
      if (dx * dx + dy * dy < 35 * 35) {
        ip.active = false;
        this.item = ip.type || ITEMS[Math.floor(Math.random() * ITEMS.length)];
        this.itemCooldown = 0;
        spawnParticles(ip.x, ip.y, ITEM_COLORS[this.item], 12);
        // 重新生成
        setTimeout(() => {
          ip.active = true;
          ip.type = ITEMS[Math.floor(Math.random() * ITEMS.length)];
        }, 4000 + Math.random() * 4000);
      }
    }
  }

  useItem() {
    if (!this.item || this.itemCooldown > 0) return;
    const item = this.item;
    this.item = null;
    this.itemCooldown = 0.5;

    switch (item) {
      case 'boost':
        this.boostActive = true;
        this.boostTimer = 2.5;
        this.speed = Math.max(this.speed, this.maxSpeed * 1.2);
        spawnParticles(this.x, this.y, '#ff0', 20);
        break;
      case 'shield':
        this.shieldActive = true;
        this.shieldTimer = 5;
        spawnParticles(this.x, this.y, '#0ff', 15);
        break;
      case 'missile':
        this.fireMissile();
        break;
      case 'mine':
        this.dropMine();
        break;
    }
  }

  fireMissile() {
    const mx = this.x + Math.cos(this.angle) * 30;
    const my = this.y + Math.sin(this.angle) * 30;
    const ms = 600;
    missiles.push({
      x: mx, y: my,
      vx: Math.cos(this.angle) * ms, vy: Math.sin(this.angle) * ms,
      owner: this, life: 2.5
    });
  }

  dropMine() {
    const mx = this.x - Math.cos(this.angle) * 30;
    const my = this.y - Math.sin(this.angle) * 30;
    mines.push({x: mx, y: my, life: 8, owner: this});
  }

  checkCheckpoint() {
    // 终点线检测（赛道起点段）
    const seg = trackSegments[0];
    const ex = this.x - seg.p1.x, ey = this.y - seg.p1.y;
    const t = (ex * seg.dx + ey * seg.dy) / (seg.len * seg.len);
    if (t >= 0 && t <= 1) {
      const perpDist = Math.abs(ex * seg.nx + ey * seg.ny);
      if (perpDist < TRACK_HALF) {
        // 检查是否向前移动
        const dot = this.vx * seg.dx + this.vy * seg.dy;
        if (dot > 0 && this.checkpoint === trackPath.length - 1) {
          this.lap++;
          this.checkpoint = 0;
          if (this.lap >= LAP_TOTAL && !this.finished) {
            this.finished = true;
            this.finishTime = gameTime;
            finishOrder.push(this);
          }
        }
      }
    }
    // 检查点推进
    for (let i = 0; i < trackPath.length; i++) {
      const cp = trackPath[i];
      const d = Math.sqrt((this.x - cp.x) ** 2 + (this.y - cp.y) ** 2);
      if (d < 50 && i === (this.checkpoint + 1) % trackPath.length) {
        this.checkpoint = i;
      }
    }
  }

  draw(ctx, camX, camY, scale) {
    const sx = (this.x - camX) * scale + canvas.width / 2;
    const sy = (this.y - camY) * scale + canvas.height / 2;

    // 视口裁剪
    if (sx < -60 || sx > canvas.width + 60 || sy < -60 || sy > canvas.height + 60) return;

    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(this.angle);

    // 护盾光环
    if (this.shieldActive) {
      ctx.beginPath();
      ctx.arc(0, 0, 22, 0, Math.PI * 2);
      ctx.strokeStyle = '#0ff';
      ctx.lineWidth = 3;
      ctx.shadowColor = '#0ff';
      ctx.shadowBlur = 12;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    // 加速效果
    if (this.boostActive) {
      ctx.beginPath();
      ctx.moveTo(-10, -20);
      ctx.lineTo(0, -38);
      ctx.lineTo(10, -20);
      ctx.fillStyle = '#ff0';
      ctx.shadowColor = '#ff0';
      ctx.shadowBlur = 8;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // 车身
    const w = this.width, h = this.height;
    ctx.fillStyle = this.color;
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.roundRect(-w/2, -h/2, w, h, 4);
    ctx.fill();

    // 车窗
    ctx.fillStyle = 'rgba(0,0,0,.6)';
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.roundRect(-w/2+3, -h/2+8, w-6, h*0.4, 3);
    ctx.fill();

    // 车灯
    ctx.fillStyle = '#f44';
    ctx.beginPath();
    ctx.arc(-w/2+3, -h/2+2, 3, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(w/2-3, -h/2+2, 3, 0, Math.PI*2);
    ctx.fill();

    // 尾灯
    ctx.fillStyle = '#f00';
    ctx.beginPath();
    ctx.arc(-w/2+3, h/2-2, 2.5, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(w/2-3, h/2-2, 2.5, 0, Math.PI*2);
    ctx.fill();

    // 玩家标记
    if (this.isPlayer) {
      ctx.fillStyle = '#fff';
      ctx.shadowColor = '#fff';
      ctx.shadowBlur = 4;
      ctx.beginPath();
      ctx.arc(0, -h/2-5, 3, 0, Math.PI*2);
      ctx.fill();
    }

    ctx.shadowBlur = 0;
    ctx.restore();
  }
}

// --- 全局状态 ---
let cars = [];
let missiles = [];
let mines = [];
let gameTime = 0;
let finishOrder = [];
let gameState = 'waiting'; // waiting, countdown, racing, finishing, finished
let countdownTimer = 0;
let raceStarted = false;
let endRaceTimeout = null;

// 输入状态
const input = {accel:false, brake:false, left:false, right:false, useItem:false};

// --- 摄像机 ---
let cameraX = 0, cameraY = 0;

function updateCamera(playerCar) {
  const targetX = playerCar.x - canvas.width / 2 / getScale();
  const targetY = playerCar.y - canvas.height / 2 / getScale();
  cameraX += (targetX - cameraX) * 0.08;
  cameraY += (targetY - cameraY) * 0.08;
}

function getScale() {
  const minDim = Math.min(canvas.width, canvas.height);
  return minDim / 700;
}

// --- 初始化赛车 ---
function initCars() {
  cars = [];
  missiles = [];
  mines = [];
  finishOrder = [];
  gameTime = 0;
  raceStarted = false;

  const startP = trackPath[0];
  const startAngle = Math.atan2(trackSegments[0].dy, trackSegments[0].dx);

  const carDefs = [
    {name:'玩家', color:'#0ff', isPlayer:true, ai:0},
    {name:'飓风', color:'#f44', isPlayer:false, ai:0.82},
    {name:'闪电', color:'#ff0', isPlayer:false, ai:0.78},
    {name:'幻影', color:'#f0f', isPlayer:false, ai:0.75}
  ];

  for (let i = 0; i < carDefs.length; i++) {
    const d = carDefs[i];
    const offsetX = (i - 1.5) * 45;
    const seg = trackSegments[0];
    const sx = startP.x + seg.nx * offsetX;
    const sy = startP.y + seg.ny * offsetX;
    cars.push(new Car(sx, sy, startAngle, d.color, d.name, d.isPlayer, d.ai));
  }

  // 重置道具
  for (const ip of itemPositions) {
    ip.active = true;
    ip.type = ITEMS[Math.floor(Math.random() * ITEMS.length)];
  }
}

// --- 碰撞检测 ---
function handleCollisions() {
  for (let i = 0; i < cars.length; i++) {
    for (let j = i + 1; j < cars.length; j++) {
      const a = cars[i], b = cars[j];
      const dx = a.x - b.x, dy = a.y - b.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const minDist = 28;

      if (dist < minDist && dist > 0) {
        // 分离
        const overlap = minDist - dist;
        const nx = dx / dist, ny = dy / dist;
        a.x += nx * overlap * 0.5;
        a.y += ny * overlap * 0.5;
        b.x -= nx * overlap * 0.5;
        b.y -= ny * overlap * 0.5;

        // 速度交换
        const relVx = a.vx - b.vx, relVy = a.vy - b.vy;
        const relVn = relVx * nx + relVy * ny;
        if (relVn > 0) {
          const impulse = relVn * 0.5;
          a.vx -= nx * impulse;
          a.vy -= ny * impulse;
          b.vx += nx * impulse;
          b.vy += ny * impulse;
          a.speed *= 0.85;
          b.speed *= 0.85;
          spawnParticles((a.x + b.x) / 2, (a.y + b.y) / 2, '#fff', 8);
        }
      }
    }
  }

  // 导弹碰撞
  for (let m = missiles.length - 1; m >= 0; m--) {
    const missile = missiles[m];
    for (const car of cars) {
      if (car === missile.owner) continue;
      if (car.shieldActive) continue;
      const dx = missile.x - car.x, dy = missile.y - car.y;
      if (dx * dx + dy * dy < 25 * 25) {
        car.stunned = true;
        car.stunTimer = 1.2;
        car.speed *= 0.4;
        car.vx *= 0.3;
        car.vy *= 0.3;
        spawnParticles(missile.x, missile.y, '#f80', 20);
        missiles.splice(m, 1);
        break;
      }
    }
  }

  // 地雷碰撞
  for (let m = mines.length - 1; m >= 0; m--) {
    const mine = mines[m];
    for (const car of cars) {
      if (car === mine.owner) continue;
      const dx = mine.x - car.x, dy = mine.y - car.y;
      if (dx * dx + dy * dy < 30 * 30) {
        car.stunned = true;
        car.stunTimer = 0.8;
        car.speed *= 0.5;
        spawnParticles(mine.x, mine.y, '#f80', 25);
        mines.splice(m, 1);
        break;
      }
    }
  }
}

// --- 更新导弹 ---
function updateMissiles(dt) {
  for (let i = missiles.length - 1; i >= 0; i--) {
    const m = missiles[i];
    m.x += m.vx * dt;
    m.y += m.vy * dt;
    m.life -= dt;
    if (m.life <= 0 || m.x < 0 || m.x > WORLD_W || m.y < 0 || m.y > WORLD_H) {
      missiles.splice(i, 1);
    }
  }
  // 地雷寿命
  for (let i = mines.length - 1; i >= 0; i--) {
    mines[i].life -= dt;
    if (mines[i].life <= 0) mines.splice(i, 1);
  }
}

// --- 排名计算 ---
function getRankings() {
  const ranked = [...cars].sort((a, b) => {
    if (a.finished && b.finished) return a.finishTime - b.finishTime;
    if (a.finished) return -1;
    if (b.finished) return 1;
    if (a.lap !== b.lap) return b.lap - a.lap;
    return b.checkpoint - a.checkpoint;
  });
  return ranked;
}

// --- 渲染 ---
function drawTrack(camX, camY, scale) {
  // 草地背景
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.translate(canvas.width / 2, canvas.height / 2);
  ctx.scale(scale, scale);
  ctx.translate(-camX, -camY);

  // 赛道外区域
  ctx.fillStyle = '#0a0f14';
  ctx.fillRect(0, 0, WORLD_W, WORLD_H);

  // 赛道地面
  ctx.strokeStyle = '#1a1a2e';
  ctx.lineWidth = TRACK_HALF * 2 + 20;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(trackPath[0].x, trackPath[0].y);
  for (let i = 1; i < trackPath.length; i++) ctx.lineTo(trackPath[i].x, trackPath[i].y);
  ctx.closePath();
  ctx.stroke();

  // 赛道主路面
  const grad = ctx.createLinearGradient(0, 300, 0, 1100);
  grad.addColorStop(0, '#1a1a30');
  grad.addColorStop(0.5, '#1e1e38');
  grad.addColorStop(1, '#1a1a30');
  ctx.strokeStyle = grad;
  ctx.lineWidth = TRACK_HALF * 2;
  ctx.beginPath();
  ctx.moveTo(trackPath[0].x, trackPath[0].y);
  for (let i = 1; i < trackPath.length; i++) ctx.lineTo(trackPath[i].x, trackPath[i].y);
  ctx.closePath();
  ctx.stroke();

  // 赛道边线（霓虹）
  for (let side = -1; side <= 1; side += 2) {
    ctx.strokeStyle = side < 0 ? '#0ff' : '#f0f';
    ctx.lineWidth = 3;
    ctx.shadowColor = ctx.strokeStyle;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    for (let i = 0; i < trackPath.length; i++) {
      const seg = trackSegments[i];
      const ox = seg.nx * TRACK_HALF * side;
      const oy = seg.ny * TRACK_HALF * side;
      if (i === 0) ctx.moveTo(seg.p1.x + ox, seg.p1.y + oy);
      ctx.lineTo(seg.p2.x + ox, seg.p2.y + oy);
    }
    ctx.closePath();
    ctx.stroke();
  }
  ctx.shadowBlur = 0;

  // 中间虚线
  ctx.strokeStyle = 'rgba(255,255,255,.15)';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([20, 25]);
  ctx.beginPath();
  ctx.moveTo(trackPath[0].x, trackPath[0].y);
  for (let i = 1; i < trackPath.length; i++) ctx.lineTo(trackPath[i].x, trackPath[i].y);
  ctx.closePath();
  ctx.stroke();
  ctx.setLineDash([]);

  // 起点/终点线
  const seg0 = trackSegments[0];
  const midX = (seg0.p1.x + seg0.p2.x) / 2;
  const midY = (seg0.p1.y + seg0.p2.y) / 2;
  ctx.save();
  ctx.translate(midX, midY);
  ctx.rotate(Math.atan2(seg0.dy, seg0.dx));
  for (let i = -TRACK_HALF; i < TRACK_HALF; i += 14) {
    ctx.fillStyle = i % 28 < 14 ? '#fff' : '#111';
    ctx.fillRect(-2, i, 4, 14);
  }
  ctx.restore();

  // 道具点
  for (const ip of itemPositions) {
    if (!ip.active) continue;
    const t = ip.type || 'boost';
    const col = ITEM_COLORS[t] || '#ff0';
    // 旋转盒子
    const time = gameTime * 3;
    ctx.save();
    ctx.translate(ip.x, ip.y);
    ctx.rotate(time * 0.5);
    ctx.fillStyle = col;
    ctx.shadowColor = col;
    ctx.shadowBlur = 10;
    ctx.fillRect(-10, -10, 20, 20);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#000';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(ITEM_ICONS[t] || '?', 0, 1);
    ctx.restore();
  }

  // 地雷
  for (const mine of mines) {
    ctx.fillStyle = '#f44';
    ctx.shadowColor = '#f44';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(mine.x, mine.y, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('💣', mine.x, mine.y + 3);
  }

  // 导弹
  for (const m of missiles) {
    ctx.fillStyle = '#f80';
    ctx.shadowColor = '#f80';
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(m.x, m.y, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    // 尾焰
    ctx.strokeStyle = '#ff0';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(m.x, m.y);
    ctx.lineTo(m.x - m.vx * 0.02, m.y - m.vy * 0.02);
    ctx.stroke();
  }

  // 轮胎痕迹
  for (const tm of tireMarks) {
    ctx.fillStyle = `rgba(30,30,30,${tm.life / tm.maxLife * 0.5})`;
    ctx.fillRect(tm.x - 1, tm.y - 3, 2, 6);
  }

  // 粒子
  for (const p of particles) {
    const alpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.globalAlpha = alpha;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  ctx.restore();
}

function drawMinimap(camX, camY, scale) {
  const mmW = 140, mmH = 100;
  const mmX = canvas.width - mmW - 8, mmY = 8;
  const mmScale = mmW / WORLD_W;

  ctx.fillStyle = 'rgba(0,0,0,.7)';
  ctx.strokeStyle = 'rgba(0,255,255,.3)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.roundRect(mmX, mmY, mmW, mmH, 6);
  ctx.fill();
  ctx.stroke();

  ctx.save();
  ctx.translate(mmX, mmY);
  ctx.scale(mmScale, mmScale * (mmH / WORLD_H));

  // 赛道
  ctx.strokeStyle = 'rgba(255,255,255,.25)';
  ctx.lineWidth = TRACK_HALF * 2 / mmScale;
  ctx.beginPath();
  ctx.moveTo(trackPath[0].x, trackPath[0].y);
  for (let i = 1; i < trackPath.length; i++) ctx.lineTo(trackPath[i].x, trackPath[i].y);
  ctx.closePath();
  ctx.stroke();

  // 赛车
  for (const car of cars) {
    ctx.fillStyle = car.isPlayer ? '#fff' : car.color;
    ctx.beginPath();
    ctx.arc(car.x, car.y, 8 / mmScale, 0, Math.PI * 2);
    ctx.fill();
    if (car.isPlayer) {
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2 / mmScale;
      ctx.stroke();
    }
  }

  // 视口框
  const vw = canvas.width / scale, vh = canvas.height / scale;
  ctx.strokeStyle = 'rgba(255,255,255,.5)';
  ctx.lineWidth = 2 / mmScale;
  ctx.strokeRect(camX, camY, vw, vh);

  ctx.restore();
}

// --- 游戏循环 ---
let lastTime = 0;

function gameLoop(timestamp) {
  requestAnimationFrame(gameLoop);

  if (lastTime === 0) { lastTime = timestamp; return; }
  let dt = (timestamp - lastTime) / 1000;
  lastTime = timestamp;
  if (dt > 0.1) dt = 0.1; // 防止大帧跳跃

  if (gameState === 'countdown') {
    countdownTimer -= dt;
    const numEl = document.getElementById('countdownNum');
    const cd = document.getElementById('countdown');
    const n = Math.ceil(countdownTimer);
    if (n > 0 && n <= 3) {
      numEl.textContent = n;
      numEl.style.animation = 'none';
      void numEl.offsetWidth;
      numEl.style.animation = 'pulse .6s ease-out';
    }
    if (countdownTimer <= 0) {
      cd.style.display = 'none';
      gameState = 'racing';
      raceStarted = true;
    }
  }

  if (gameState === 'racing') {
    gameTime += dt;

    // 更新粒子
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }

    // 更新轮胎痕迹
    for (const tm of tireMarks) tm.life -= dt;
    for (let i = tireMarks.length - 1; i >= 0; i--) {
      if (tireMarks[i].life <= 0) tireMarks.splice(i, 1);
    }

    // 更新赛车
    const playerCar = cars.find(c => c.isPlayer);
    for (const car of cars) car.update(dt, input);

    // 道具使用
    if (input.useItem && playerCar && playerCar.item && playerCar.itemCooldown <= 0) {
      playerCar.useItem();
      input.useItem = false;
    }

    // 碰撞
    handleCollisions();
    updateMissiles(dt);

    // 摄像机
    if (playerCar) updateCamera(playerCar);

    // 检查比赛结束
    if (gameState === 'racing' && (finishOrder.length >= CAR_COUNT || (playerCar && playerCar.finished))) {
      gameState = 'finishing';
      const delay = finishOrder.length >= CAR_COUNT ? 1500 : 3000;
      endRaceTimeout = setTimeout(() => { if (gameState === 'finishing') endRace(); }, delay);
    }

    // 更新HUD
    if (playerCar) {
      const rankings = getRankings();
      const playerRank = rankings.indexOf(playerCar) + 1;
      document.getElementById('lapDisplay').textContent = `圈数 ${Math.min(playerCar.lap + 1, LAP_TOTAL)}/${LAP_TOTAL}`;
      document.getElementById('speedDisplay').textContent = `速度 ${Math.round(Math.abs(playerCar.speed) * 0.8)} km/h`;
      document.getElementById('posDisplay').textContent = `排名 ${playerRank}/${CAR_COUNT}`;
      document.getElementById('itemDisplay').textContent = `道具 ${playerCar.item ? ITEM_ICONS[playerCar.item] + ' ' + ITEMS_MAP[playerCar.item] : '无'}`;
    }
  }

  // 渲染
  const scale = getScale();
  drawTrack(cameraX, cameraY, scale);

  // 赛车
  for (const car of cars) {
    car.draw(ctx, cameraX, cameraY, scale);
  }

  // 小地图
  drawMinimap(cameraX, cameraY, scale);
}

const ITEMS_MAP = {boost:'加速', missile:'导弹', mine:'地雷', shield:'护盾'};

function endRace() {
  gameState = 'finished';
  if (endRaceTimeout) { clearTimeout(endRaceTimeout); endRaceTimeout = null; }
  const rankings = getRankings();
  const rankEl = document.getElementById('rankings');
  rankEl.innerHTML = '';
  const rankNames = ['🥇', '🥈', '🥉', '4️⃣'];

  for (let i = 0; i < rankings.length; i++) {
    const car = rankings[i];
    const row = document.createElement('div');
    row.className = 'rank-row' + (car.isPlayer ? ' player-rank' : '');
    row.innerHTML = `
      <span class="rank-num">${rankNames[i]}</span>
      <span class="rank-color" style="background:${car.color};box-shadow:0 0 6px ${car.color}"></span>
      <span>${car.name}</span>
      <span style="margin-left:auto;color:#888;font-size:13px">${car.finished ? (car.finishTime).toFixed(1) + 's' : 'DNF'}</span>
    `;
    rankEl.appendChild(row);
  }

  const playerCar = cars.find(c => c.isPlayer);
  const playerRank = rankings.indexOf(playerCar) + 1;
  document.getElementById('resultTitle').textContent =
    playerRank === 1 ? '🏆 冠军！' : playerRank === 2 ? '🥈 第二名' : playerRank === 3 ? '🥉 第三名' : '继续加油！';

  document.getElementById('result-overlay').style.display = 'flex';
  showInterstitialAd();
}

function startRace() {
  if (endRaceTimeout) { clearTimeout(endRaceTimeout); endRaceTimeout = null; }
  document.getElementById('start-overlay').style.display = 'none';
  document.getElementById('result-overlay').style.display = 'none';
  initCars();
  const cd = document.getElementById('countdown');
  cd.style.display = 'flex';
  countdownTimer = 3.5;
  gameState = 'countdown';
  cameraX = trackPath[0].x - canvas.width / 2 / getScale();
  cameraY = trackPath[0].y - canvas.height / 2 / getScale();
  finishOrder = [];
}

// --- 输入处理 ---
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  keys[e.code] = true;
  updateInputFromKeys();
  if (e.key === ' ' || e.key === 'Spacebar') {
    e.preventDefault();
    input.useItem = true;
  }
});
window.addEventListener('keyup', e => {
  keys[e.key] = false;
  keys[e.code] = false;
  updateInputFromKeys();
});

function updateInputFromKeys() {
  input.accel = !!(keys['w'] || keys['W'] || keys['ArrowUp']);
  input.brake = !!(keys['s'] || keys['S'] || keys['ArrowDown']);
  input.left = !!(keys['a'] || keys['A'] || keys['ArrowLeft']);
  input.right = !!(keys['d'] || keys['D'] || keys['ArrowRight']);
}

// 触屏按钮
function setupTouchBtn(id, prop) {
  const btn = document.getElementById(id);
  if (!btn) return;
  btn.addEventListener('pointerdown', e => { e.preventDefault(); input[prop] = true; btn.classList.add('active'); });
  btn.addEventListener('pointerup', e => { e.preventDefault(); input[prop] = false; btn.classList.remove('active'); });
  btn.addEventListener('pointerleave', e => { input[prop] = false; btn.classList.remove('active'); });
  btn.addEventListener('pointercancel', e => { input[prop] = false; btn.classList.remove('active'); });
}
setupTouchBtn('btnAccel', 'accel');
setupTouchBtn('btnBrake', 'brake');
setupTouchBtn('btnLeft', 'left');
setupTouchBtn('btnRight', 'right');

const btnItem = document.getElementById('btnItem');
if (btnItem) {
  btnItem.addEventListener('pointerdown', e => {
    e.preventDefault();
    input.useItem = true;
    btnItem.classList.add('active');
    setTimeout(() => btnItem.classList.remove('active'), 150);
  });
}

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq = 440, duration = 0.1) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }
