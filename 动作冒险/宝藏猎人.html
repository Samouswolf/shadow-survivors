<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>宝藏猎人</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #2d1b4e 0%, #4a2c7a 50%, #6b3fa0 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; color: #fff; }
        
        .game-container { width: 100%; flex: 1; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: #ffd700; }
        .stats { display: flex; gap: 20px; font-size: 14px; }
        
        .grid-area { flex: 1; display: flex; justify-content: center; align-items: center; margin-bottom: 15px; }
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        .cell { width: 50px; height: 50px; border-radius: 10px; background: rgba(255,255,255,0.1); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .cell.revealed { background: rgba(255,255,255,0.3); }
        .cell.trap { background: #ff6b6b; }
        .cell.treasure { background: #ffd700; }
        
        .message { text-align: center; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 10px; margin-bottom: 15px; font-size: 16px; }
        
        .controls { display: flex; justify-content: center; gap: 15px; }
        .control-btn { padding: 10px 20px; border: none; border-radius: 10px; font-size: 14px; cursor: pointer; background: rgba(255,255,255,0.2); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="title">💎 宝藏猎人</div>
            <div class="stats">
                <span>💰 宝藏: <span id="treasures">0</span></span>
                <span>💀 陷阱: <span id="traps">0</span></span>
                <span>🔢 剩余: <span id="remaining">20</span></span>
            </div>
        </div>
        
        <div class="message" id="message">点击格子寻找宝藏！小心陷阱！</div>
        
        <div class="grid-area">
            <div class="grid" id="grid"></div>
        </div>
        
        <div class="controls">
            <button class="control-btn" onclick="resetGame()">🔄 重新开始</button>
        </div>
    </div>
    
    <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <script>
        const GAME_NAME = '宝藏猎人';
        GameCore.init({ highScore: GAME_NAME });
        
        const gridSize = 5;
        const totalCells = gridSize * gridSize;
        const trapCount = 5;
        const treasureCount = 3;
        
        let grid = [];
        let treasuresFound = 0;
        let trapsHit = 0;
        let remainingCells = totalCells;
        
        function initGame() {
            grid = [];
            for (let i = 0; i < totalCells; i++) {
                grid.push({ type: 'empty', revealed: false });
            }
            
            for (let i = 0; i < trapCount; i++) {
                let pos;
                do {
                    pos = Math.floor(Math.random() * totalCells);
                } while (grid[pos].type !== 'empty');
                grid[pos].type = 'trap';
            }
            
            for (let i = 0; i < treasureCount; i++) {
                let pos;
                do {
                    pos = Math.floor(Math.random() * totalCells);
                } while (grid[pos].type !== 'empty');
                grid[pos].type = 'treasure';
            }
            
            treasuresFound = 0;
            trapsHit = 0;
            remainingCells = totalCells;
            
            renderGrid();
            updateUI();
        }
        
        function updateUI() {
            document.getElementById('treasures').textContent = treasuresFound;
            document.getElementById('traps').textContent = trapsHit;
            document.getElementById('remaining').textContent = remainingCells;
            
            GameCore.highScore.set(GAME_NAME, treasuresFound);
        }
        
        function renderGrid() {
            const gridEl = document.getElementById('grid');
            gridEl.innerHTML = '';
            
            grid.forEach((cell, index) => {
                const el = document.createElement('div');
                el.className = 'cell';
                
                if (cell.revealed) {
                    el.classList.add('revealed');
                    if (cell.type === 'trap') {
                        el.classList.add('trap');
                        el.textContent = '💀';
                    } else if (cell.type === 'treasure') {
                        el.classList.add('treasure');
                        el.textContent = '💎';
                    } else {
                        el.textContent = '⬜';
                    }
                } else {
                    el.textContent = '❓';
                }
                
                el.onclick = () => handleCellClick(index);
                gridEl.appendChild(el);
            });
        }
        
        function handleCellClick(index) {
            const cell = grid[index];
            if (cell.revealed) return;
            
            cell.revealed = true;
            remainingCells--;
            
            if (cell.type === 'trap') {
                trapsHit++;
                GameCore.hints.show('💀 触发陷阱！');
                document.getElementById('message').textContent = '哎呀！触发了陷阱！';
            } else if (cell.type === 'treasure') {
                treasuresFound++;
                GameCore.hints.show('💎 发现宝藏！');
                document.getElementById('message').textContent = '恭喜！发现了宝藏！';
                
                if (treasuresFound === treasureCount) {
                    document.getElementById('message').textContent = '🎉 恭喜你找到了所有宝藏！';
                }
            } else {
                document.getElementById('message').textContent = '这里什么都没有...';
            }
            
            renderGrid();
            updateUI();
        }
        
        function resetGame() {
            initGame();
            document.getElementById('message').textContent = '点击格子寻找宝藏！小心陷阱！';
        }
        
        initGame();
        GameCore.touch.enableAllButtons();
    </script>
</body>
</html>
