<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>赛车竞速</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #2d1b4e 0%, #4a2c7a 50%, #6b3fa0 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; color: #fff; overflow: hidden; }
        
        .game-container { width: 100%; flex: 1; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: #ff6b6b; }
        .stats { display: flex; gap: 20px; font-size: 14px; }
        
        .canvas-area { flex: 1; background: rgba(0,0,0,0.5); border-radius: 15px; overflow: hidden; position: relative; }
        canvas { width: 100%; height: 100%; }
        
        .controls { display: flex; justify-content: center; gap: 15px; margin-top: 15px; }
        .control-btn { padding: 15px 30px; border: none; border-radius: 15px; font-size: 18px; font-weight: bold; cursor: pointer; background: rgba(255,255,255,0.2); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }
    /* [BATCH-FIX:ad-components-css] */

.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.sponsor-panel.show{display:flex}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.interstitial-ad.show{display:flex}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* [/BATCH-FIX:ad-components-css] */

/* [AD-FIX:responsive] */
@media (max-width:768px){.ad-banner-container{display:none!important}.sponsor-btn{transform:scale(.8);opacity:.6}}
/* [/AD-FIX:responsive] */
</style>
</head>
<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="title">🏎️ 赛车竞速</div>
            <div class="stats">
                <span>⏱️ 时间: <span id="time">0</span></span>
                <span>🏁 圈数: <span id="laps">0</span></span>
                <span>💨 速度: <span id="speed">0</span></span>
            </div>
        </div>
        
        <div class="canvas-area">
            <canvas id="gameCanvas"></canvas>
        </div>
        
        <div class="controls">
            <button class="control-btn" onclick="turnLeft()">⬅️ 左转</button>
            <button class="control-btn" onclick="accelerate()">⬆️ 加速</button>
            <button class="control-btn" onclick="brake()">⬇️ 刹车</button>
            <button class="control-btn" onclick="turnRight()">➡️ 右转</button>
        </div>
    </div>
    
    

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <script>
        const GAME_NAME = '赛车竞速';
        GameCore.init({ highScore: GAME_NAME });
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let gameRunning = true;
        let time = 0;
        let laps = 0;
        let player = { x: 0, y: 0, angle: 0, speed: 0 };
        let waypoints = [];
        let currentWaypoint = 0;
        let trackOffset = 0;
        
        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            initTrack();
        }
        
        function initTrack() {
            waypoints = [];
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = Math.min(centerX, centerY) - 50;
            
            for (let i = 0; i < 360; i += 10) {
                const angle = (i * Math.PI) / 180;
                const r = radius * (0.8 + Math.sin(i * 0.1) * 0.2);
                waypoints.push({
                    x: centerX + Math.cos(angle) * r,
                    y: centerY + Math.sin(angle) * r
                });
            }
            
            player.x = waypoints[0].x;
            player.y = waypoints[0].y;
            player.angle = Math.PI / 2;
            player.speed = 0;
        }
        
        function initGame() {
            resizeCanvas();
            gameRunning = true;
            time = 0;
            laps = 0;
            currentWaypoint = 0;
            trackOffset = 0;
            updateUI();
            gameLoop();
        }
        
        function updateUI() {
            document.getElementById('time').textContent = time.toFixed(1);
            document.getElementById('laps').textContent = laps;
            document.getElementById('speed').textContent = Math.floor(player.speed * 10);
            
            GameCore.highScore.set(GAME_NAME, laps);
        }
        
        function accelerate() {
            player.speed = Math.min(8, player.speed + 0.5);
        }
        
        function brake() {
            player.speed = Math.max(0, player.speed - 0.5);
        }
        
        function turnLeft() {
            player.angle -= 0.1;
        }
        
        function turnRight() {
            player.angle += 0.1;
        }
        
        function update() {
            if (!gameRunning) return;
            
            time += 0.05;
            
            player.x += Math.sin(player.angle) * player.speed;
            player.y -= Math.cos(player.angle) * player.speed;
            
            const wp = waypoints[currentWaypoint];
            const dx = player.x - wp.x;
            const dy = player.y - wp.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            
            if (dist < 30) {
                currentWaypoint++;
                if (currentWaypoint >= waypoints.length) {
                    currentWaypoint = 0;
                    laps++;
                    GameCore.hints.show(`🏁 完成第${laps}圈！`);
                }
            }
            
            const trackWidth = 80;
            const prevWp = waypoints[currentWaypoint - 1] || waypoints[waypoints.length - 1];
            const nextWp = waypoints[currentWaypoint];
            
            const trackAngle = Math.atan2(nextWp.y - prevWp.y, nextWp.x - prevWp.x);
            const perpAngle = trackAngle + Math.PI / 2;
            
            const leftX = nextWp.x + Math.cos(perpAngle) * trackWidth / 2;
            const leftY = nextWp.y + Math.sin(perpAngle) * trackWidth / 2;
            const rightX = nextWp.x - Math.cos(perpAngle) * trackWidth / 2;
            const rightY = nextWp.y - Math.sin(perpAngle) * trackWidth / 2;
            
            const dl = Math.abs((player.y - prevWp.y) * (leftX - prevWp.x) - (player.x - prevWp.x) * (leftY - prevWp.y)) /
                       Math.sqrt(Math.pow(leftX - prevWp.x, 2) + Math.pow(leftY - prevWp.y, 2));
            const dr = Math.abs((player.y - prevWp.y) * (rightX - prevWp.x) - (player.x - prevWp.x) * (rightY - prevWp.y)) /
                       Math.sqrt(Math.pow(rightX - prevWp.x, 2) + Math.pow(rightY - prevWp.y, 2));
            
            if (dl < trackWidth / 2 || dr < trackWidth / 2) {
                player.speed *= 0.95;
            }
            
            trackOffset += player.speed * 0.5;
            
            updateUI();
        }
        
        function render() {
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = '#4a7c23';
            ctx.lineWidth = 80;
            ctx.lineCap = 'round';
            ctx.beginPath();
            waypoints.forEach((wp, i) => {
                if (i === 0) ctx.moveTo(wp.x, wp.y);
                else ctx.lineTo(wp.x, wp.y);
            });
            ctx.closePath();
            ctx.stroke();
            
            ctx.strokeStyle = '#ffd700';
            ctx.lineWidth = 5;
            ctx.beginPath();
            waypoints.forEach((wp, i) => {
                if (i === 0) ctx.moveTo(wp.x, wp.y);
                else ctx.lineTo(wp.x, wp.y);
            });
            ctx.closePath();
            ctx.stroke();
            
            ctx.fillStyle = '#ff6b6b';
            ctx.beginPath();
            ctx.arc(waypoints[currentWaypoint].x, waypoints[currentWaypoint].y, 15, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle);
            
            ctx.fillStyle = '#ff6b6b';
            ctx.fillRect(-15, -25, 30, 50);
            
            ctx.fillStyle = '#fff';
            ctx.fillRect(-8, -20, 16, 30);
            
            ctx.fillStyle = '#000';
            ctx.fillRect(-5, -15, 10, 20);
            
            ctx.fillStyle = '#444';
            ctx.beginPath();
            ctx.arc(-15, 25, 8, 0, Math.PI * 2);
            ctx.arc(15, 25, 8, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.restore();
            
            ctx.fillStyle = 'rgba(255,255,255,0.1)';
            for (let i = 0; i < 100; i++) {
                const x = ((i * 50 + trackOffset) % canvas.width);
                const y = canvas.height * 0.3 + Math.sin(i * 0.5) * 10;
                ctx.fillRect(x, y, 40, 2);
            }
        }
        
        function gameLoop() {
            update();
            render();
            
            if (gameRunning) {
                requestAnimationFrame(gameLoop);
            }
        }
        
        window.addEventListener('resize', resizeCanvas);
        initGame();
        GameCore.touch.enableAllButtons();
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') accelerate();
            if (e.key === 'ArrowDown') brake();
            if (e.key === 'ArrowLeft') turnLeft();
            if (e.key === 'ArrowRight') turnRight();
        });
    </script>
<!-- [BATCH-FIX:touch-support] -->
<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>
<!-- [/BATCH-FIX:touch-support] -->

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
