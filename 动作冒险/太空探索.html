<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>太空探索</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; color: #fff; overflow: hidden; }
        
        .game-container { width: 100%; flex: 1; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: #4ecdc4; }
        .stats { display: flex; gap: 20px; font-size: 14px; }
        
        .canvas-area { flex: 1; background: rgba(0,0,0,0.5); border-radius: 15px; overflow: hidden; position: relative; }
        canvas { width: 100%; height: 100%; }
        
        .controls { display: flex; justify-content: center; gap: 15px; margin-top: 15px; }
        .control-btn { padding: 15px 30px; border: none; border-radius: 15px; font-size: 18px; font-weight: bold; cursor: pointer; background: rgba(255,255,255,0.2); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }
    /* [BATCH-FIX:ad-components-css] */
.sponsor-btn{position:fixed;bottom:8px;left:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:2px 6px;border-radius:10px;font:10px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.sponsor-panel.show{display:flex}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.interstitial-ad.show{display:flex}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* [/BATCH-FIX:ad-components-css] */

/* [AD-FIX:responsive] */
@media (max-width:768px){.ad-banner-container{display:none!important}.sponsor-btn{transform:scale(.8);opacity:.6}}
/* [/AD-FIX:responsive] */
</style>
</head>
<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="title">🚀 太空探索</div>
            <div class="stats">
                <span>⛽ 燃料: <span id="fuel">100</span></span>
                <span>⭐ 星星: <span id="stars">0</span></span>
                <span>🌌 距离: <span id="distance">0</span></span>
            </div>
        </div>
        
        <div class="canvas-area">
            <canvas id="gameCanvas"></canvas>
        </div>
        
        <div class="controls">
            <button class="control-btn" onclick="moveUp()">⬆️ 向上</button>
            <button class="control-btn" onclick="moveDown()">⬇️ 向下</button>
            <button class="control-btn" onclick="moveLeft()">⬅️ 向左</button>
            <button class="control-btn" onclick="moveRight()">➡️ 向右</button>
        </div>
    </div>
    
    

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <script>
        const GAME_NAME = '太空探索';
        GameCore.init({ highScore: GAME_NAME });
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let gameRunning = true;
        let fuel = 100;
        let stars = 0;
        let distance = 0;
        let player = { x: 0, y: 0, width: 40, height: 50 };
        let asteroids = [];
        let starItems = [];
        let particles = [];
        
        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            player.x = canvas.width / 2 - player.width / 2;
            player.y = canvas.height / 2 - player.height / 2;
        }
        
        function initGame() {
            resizeCanvas();
            gameRunning = true;
            fuel = 100;
            stars = 0;
            distance = 0;
            player = { x: canvas.width / 2 - 20, y: canvas.height / 2 - 25, width: 40, height: 50 };
            asteroids = [];
            starItems = [];
            particles = [];
            updateUI();
            gameLoop();
        }
        
        function updateUI() {
            document.getElementById('fuel').textContent = Math.floor(fuel);
            document.getElementById('stars').textContent = stars;
            document.getElementById('distance').textContent = Math.floor(distance);
            
            GameCore.highScore.set(GAME_NAME, stars);
        }
        
        function moveUp() {
            if (player.y > 0 && fuel > 0) {
                player.y -= 15;
                fuel -= 0.5;
                createParticles(player.x + player.width / 2, player.y + player.height, '#4ecdc4');
            }
        }
        
        function moveDown() {
            if (player.y < canvas.height - player.height && fuel > 0) {
                player.y += 15;
                fuel -= 0.5;
                createParticles(player.x + player.width / 2, player.y, '#4ecdc4');
            }
        }
        
        function moveLeft() {
            if (player.x > 0 && fuel > 0) {
                player.x -= 15;
                fuel -= 0.5;
                createParticles(player.x + player.width, player.y + player.height / 2, '#4ecdc4');
            }
        }
        
        function moveRight() {
            if (player.x < canvas.width - player.width && fuel > 0) {
                player.x += 15;
                fuel -= 0.5;
                createParticles(player.x, player.y + player.height / 2, '#4ecdc4');
            }
        }
        
        function createParticles(x, y, color) {
            for (let i = 0; i < 5; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 0.5) * 5,
                    life: 1,
                    color: color
                });
            }
        }
        
        function generateAsteroid() {
            const size = 20 + Math.random() * 40;
            asteroids.push({
                x: canvas.width + size,
                y: Math.random() * (canvas.height - size),
                size: size,
                speed: 2 + Math.random() * 3,
                rotation: Math.random() * Math.PI * 2,
                rotationSpeed: (Math.random() - 0.5) * 0.1
            });
        }
        
        function generateStar() {
            starItems.push({
                x: canvas.width + 20,
                y: Math.random() * (canvas.height - 40),
                size: 20,
                speed: 2 + Math.random() * 2
            });
        }
        
        function update() {
            if (!gameRunning) return;
            
            distance += 0.5;
            fuel -= 0.05;
            
            if (fuel <= 0) {
                fuel = 0;
                gameOver();
                return;
            }
            
            asteroids.forEach(asteroid => {
                asteroid.x -= asteroid.speed;
                asteroid.rotation += asteroid.rotationSpeed;
            });
            
            starItems.forEach(star => {
                star.x -= star.speed;
            });
            
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
            });
            
            asteroids = asteroids.filter(a => a.x + a.size > -50);
            starItems = starItems.filter(s => s.x + s.size > -50);
            particles = particles.filter(p => p.life > 0);
            
            if (Math.random() < 0.02) {
                generateAsteroid();
            }
            
            if (Math.random() < 0.01) {
                generateStar();
            }
            
            asteroids.forEach(asteroid => {
                const dx = (player.x + player.width / 2) - (asteroid.x + asteroid.size / 2);
                const dy = (player.y + player.height / 2) - (asteroid.y + asteroid.size / 2);
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < asteroid.size / 2 + player.width / 2) {
                    createParticles(player.x + player.width / 2, player.y + player.height / 2, '#ff6b6b');
                    gameOver();
                }
            });
            
            starItems.forEach(star => {
                const dx = (player.x + player.width / 2) - (star.x + star.size / 2);
                const dy = (player.y + player.height / 2) - (star.y + star.size / 2);
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < star.size / 2 + player.width / 2) {
                    star.x = -100;
                    stars += 10;
                    fuel = Math.min(100, fuel + 20);
                    createParticles(star.x + star.size / 2, star.y + star.size / 2, '#ffd700');
                }
            });
            
            updateUI();
        }
        
        function render() {
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < 50; i++) {
                const x = (i * 37 + distance * 0.1) % canvas.width;
                const y = (i * 53) % canvas.height;
                const size = (Math.sin(i) + 1) * 1.5;
                ctx.fillStyle = `rgba(255, 255, 255, ${0.3 + Math.sin(i + distance * 0.01) * 0.2})`;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
            }
            
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
            
            ctx.fillStyle = '#4ecdc4';
            ctx.fillRect(player.x + 10, player.y + 10, 20, 30);
            ctx.fillStyle = '#3d9a94';
            ctx.beginPath();
            ctx.moveTo(player.x, player.y + 25);
            ctx.lineTo(player.x + player.width, player.y + 25);
            ctx.lineTo(player.x + player.width / 2, player.y);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.fillRect(player.x + 15, player.y + 15, 10, 15);
            
            asteroids.forEach(asteroid => {
                ctx.save();
                ctx.translate(asteroid.x + asteroid.size / 2, asteroid.y + asteroid.size / 2);
                ctx.rotate(asteroid.rotation);
                ctx.fillStyle = '#666';
                ctx.beginPath();
                for (let i = 0; i < 8; i++) {
                    const angle = (i / 8) * Math.PI * 2;
                    const r = asteroid.size / 2 * (0.7 + Math.sin(i * 3) * 0.3);
                    if (i === 0) ctx.moveTo(Math.cos(angle) * r, Math.sin(angle) * r);
                    else ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
                }
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            });
            
            starItems.forEach(star => {
                ctx.fillStyle = '#ffd700';
                ctx.beginPath();
                const spikes = 5;
                const outerRadius = star.size / 2;
                const innerRadius = star.size / 4;
                for (let i = 0; i < spikes * 2; i++) {
                    const radius = i % 2 === 0 ? outerRadius : innerRadius;
                    const angle = (i / (spikes * 2)) * Math.PI * 2 - Math.PI / 2;
                    const x = star.x + star.size / 2 + Math.cos(angle) * radius;
                    const y = star.y + star.size / 2 + Math.sin(angle) * radius;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.fill();
            });
        }
        
        function gameLoop() {
            update();
            render();
            
            if (gameRunning) {
                requestAnimationFrame(gameLoop);
            }
        }
        
        function gameOver() {
            gameRunning = false;
            GameCore.hints.show('💥 游戏结束！');
            
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#fff';
            ctx.font = '30px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('游戏结束', canvas.width / 2, canvas.height / 2 - 20);
            ctx.font = '20px Arial';
            ctx.fillText(`星星: ${stars}`, canvas.width / 2, canvas.height / 2 + 20);
        }
        
        window.addEventListener('resize', resizeCanvas);
        initGame();
        GameCore.touch.enableAllButtons();
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') moveUp();
            if (e.key === 'ArrowDown') moveDown();
            if (e.key === 'ArrowLeft') moveLeft();
            if (e.key === 'ArrowRight') moveRight();
        });
    </script>
<!-- [BATCH-FIX:touch-support] -->
<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>
<!-- [/BATCH-FIX:touch-support] -->

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
