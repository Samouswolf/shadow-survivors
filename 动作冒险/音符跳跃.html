<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>音符跳跃</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; color: #fff; overflow: hidden; }
        
        .game-container { width: 100%; flex: 1; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: #fff; }
        .stats { display: flex; gap: 20px; font-size: 14px; }
        
        .main-area { flex: 1; background: rgba(0,0,0,0.5); border-radius: 15px; overflow: hidden; position: relative; }
        
        .platforms { position: absolute; bottom: 0; left: 0; right: 0; height: 100%; }
        
        .platform { position: absolute; width: 80px; height: 20px; background: #4ecdc4; border-radius: 10px; }
        
        .player { position: absolute; width: 40px; height: 40px; background: #ff6b6b; border-radius: 50%; }
        
        .score-display { position: absolute; top: 20px; left: 20px; font-size: 32px; font-weight: bold; color: #ffd700; }
        
        .combo-display { position: absolute; top: 20px; right: 20px; font-size: 24px; color: #4ecdc4; }
        
        .actions { display: flex; gap: 10px; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; }
        
        .action-btn { flex: 1; padding: 15px; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; background: rgba(255,255,255,0.2); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="title">🎤 音符跳跃</div>
            <div class="stats">
                <span>⭐ 完美: <span id="perfect">0</span></span>
                <span>✅ 连击: <span id="combo">0</span></span>
            </div>
        </div>
        
        <div class="main-area">
            <div class="score-display" id="score">0</div>
            <div class="combo-display" id="comboText">COMBO: 0</div>
            
            <div class="platforms" id="platforms">
                <div class="platform" style="left: 10%; bottom: 50px;"></div>
                <div class="platform" style="left: 30%; bottom: 120px;"></div>
                <div class="platform" style="left: 50%; bottom: 190px;"></div>
                <div class="platform" style="left: 70%; bottom: 260px;"></div>
                <div class="platform" style="left: 40%; bottom: 330px;"></div>
            </div>
            
            <div class="player" id="player" style="left: 8%; bottom: 70px;"></div>
        </div>
        
        <div class="actions">
            <button class="action-btn" onclick="jumpLeft()">⬅️ 左跳</button>
            <button class="action-btn" onclick="jumpRight()">➡️ 右跳</button>
        </div>
    </div>
    
    <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>

    <script src="game_core.js"></script>
    <script>
        const GAME_NAME = '音符跳跃';
        GameCore.init({ highScore: GAME_NAME });
        
        let score = 0;
        let combo = 0;
        let perfect = 0;
        let playerX = 8;
        let playerY = 70;
        let jumpVelocity = 0;
        let gravity = 0.8;
        let isJumping = false;
        let platforms = [];
        let gameRunning = true;
        
        function initGame() {
            updateUI();
            initPlatforms();
            gameLoop();
        }
        
        function initPlatforms() {
            platforms = [
                { x: 10, y: 50, width: 80 },
                { x: 30, y: 120, width: 80 },
                { x: 50, y: 190, width: 80 },
                { x: 70, y: 260, width: 80 },
                { x: 40, y: 330, width: 80 },
                { x: 60, y: 400, width: 80 },
                { x: 25, y: 470, width: 80 },
                { x: 55, y: 540, width: 80 }
            ];
        }
        
        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('perfect').textContent = perfect;
            document.getElementById('combo').textContent = combo;
            document.getElementById('comboText').textContent = `COMBO: ${combo}`;
            
            GameCore.highScore.set(GAME_NAME, score);
        }
        
        function jumpLeft() {
            if (!isJumping) {
                playerX = Math.max(5, playerX - 15);
                jumpVelocity = 15;
                isJumping = true;
            }
        }
        
        function jumpRight() {
            if (!isJumping) {
                playerX = Math.min(85, playerX + 15);
                jumpVelocity = 15;
                isJumping = true;
            }
        }
        
        function update() {
            if (!gameRunning) return;
            
            jumpVelocity -= gravity;
            playerY += jumpVelocity;
            
            if (playerY <= 0) {
                playerY = 0;
                jumpVelocity = 0;
                isJumping = false;
                
                score += 100;
                combo++;
                perfect++;
                GameCore.hints.show('PERFECT!');
                
                spawnNewPlatform();
                updateUI();
            }
            
            platforms.forEach(platform => {
                platform.y -= 3;
                
                if (platform.y < -50) {
                    platform.y = 600;
                    platform.x = Math.random() * 70 + 10;
                }
            });
            
            platforms.forEach(platform => {
                if (!isJumping && playerY >= platform.y && playerY <= platform.y + 30 &&
                    playerX >= platform.x && playerX <= platform.x + 10) {
                    jumpVelocity = 15;
                    isJumping = true;
                    
                    score += 50;
                    combo++;
                    updateUI();
                }
            });
            
            if (playerY > 500) {
                gameOver();
            }
        }
        
        function spawnNewPlatform() {
            platforms.push({
                x: Math.random() * 70 + 10,
                y: 600,
                width: 80
            });
        }
        
        function render() {
            const player = document.getElementById('player');
            player.style.left = `${playerX}%`;
            player.style.bottom = `${playerY}px`;
            
            const platformContainer = document.getElementById('platforms');
            platformContainer.innerHTML = '';
            
            platforms.forEach(platform => {
                const p = document.createElement('div');
                p.className = 'platform';
                p.style.left = `${platform.x}%`;
                p.style.bottom = `${platform.y}px`;
                platformContainer.appendChild(p);
            });
        }
        
        function gameLoop() {
            update();
            render();
            
            if (gameRunning) {
                requestAnimationFrame(gameLoop);
            }
        }
        
        function gameOver() {
            gameRunning = false;
            GameCore.hints.show(`游戏结束！最终得分: ${score}`);
        }
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') jumpLeft();
            if (e.key === 'ArrowRight') jumpRight();
        });
        
        initGame();
        GameCore.touch.enableAllButtons();
    </script>
</body>
</html>
