// ============ 游戏变量 ============
let gameState = STATE.MENU;
let currentLevel = 0;
let bike = {
    x: 100, y: GROUND_Y - BIKE_HEIGHT,
    vx: 0, vy: 0,
    angle: 0,
    wheelAngle: 0,
    onGround: true,
    alive: true
};
let camera = {x: 0, y: 0};
let obstacles = [];
let stars = [];
let collectedStars = 0;
let totalStars = 0;
let distance = 0;
let levelLength = 0;
let timer = 0;
let score = 0;
let totalScore = 0;
let highScore = parseInt(localStorage.getItem('moto_highScore')) || 0;
let particles = [];
let animTimer = 0;
let hintMessage = ''; // 提示消息
let hintTimer = 0;    // 提示显示时间
let menuAnim = 0;
let shakeTimer = 0;
let shakeIntensity = 0;
let keys = {};
let terrain = [];
let clouds = [];
let mountains = [];

// ============ 音效系统 ============
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playTone(freq, duration, type, volume) {
    if (!audioCtx) return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(volume || 0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
}

function playEngine() { playTone(80 + Math.abs(bike.vx) * 10, 0.1, 'sawtooth', 0.05); }
function playStar() { playTone(880, 0.2, 'sine', 0.2); setTimeout(() => playTone(1100, 0.15, 'sine', 0.15), 100); }
function playCrash() { playTone(150, 0.3, 'sawtooth', 0.2); setTimeout(() => playTone(100, 0.4, 'sawtooth', 0.15), 200); }
function playComplete() { playTone(523, 0.2, 'sine', 0.2); setTimeout(() => playTone(659, 0.2, 'sine', 0.2), 150); setTimeout(() => playTone(784, 0.3, 'sine', 0.25), 300); }
function playClick() { playTone(500, 0.08, 'square', 0.08); }
function playJump() { playTone(400, 0.15, 'sine', 0.15); setTimeout(() => playTone(600, 0.1, 'sine', 0.1), 80); }

// ============ 粒子系统 ============
function addParticles(x, y, color, count, speedMult) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = (1 + Math.random() * 3) * (speedMult || 1);
        particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 1,
            life: 1,
            decay: 0.02 + Math.random() * 0.03,
            size: 2 + Math.random() * 4,
            color: color
        });
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.05;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function drawParticles() {
    particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x - camera.x, p.y - camera.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;
}

// ============ 地形生成 ============
function generateTerrain() {
    terrain = [];
    for (let x = 0; x < levelLength + 500; x += 10) {
        let y = GROUND_Y;
        // 添加小起伏
        y += Math.sin(x * 0.01) * 10;
        y += Math.sin(x * 0.005) * 5;
        terrain.push({x: x, y: y});
    }
}

function generateDecorations() {
    clouds = [];
    mountains = [];

    // 云朵
    for (let i = 0; i < 20; i++) {
        clouds.push({
            x: Math.random() * (levelLength + 1000),
            y: 50 + Math.random() * 150,
            w: 60 + Math.random() * 80,
            h: 20 + Math.random() * 30,
            speed: 0.2 + Math.random() * 0.3
        });
    }

    // 山脉
    for (let i = 0; i < 15; i++) {
        mountains.push({
            x: i * 300 + Math.random() * 200,
            h: 100 + Math.random() * 150,
            w: 200 + Math.random() * 150
        });
    }
}

// ============ 关卡初始化 ============
function initLevel(idx) {
    const level = LEVELS[idx];
    levelLength = level.length;

    bike = {
        x: 100, y: GROUND_Y - BIKE_HEIGHT,
        vx: 0, vy: 0,
        angle: 0,
        wheelAngle: 0,
        onGround: true,
        alive: true
    };

    camera = {x: 0, y: 0};
    obstacles = level.obstacles.map(o => ({...o}));
    stars = level.stars.map(s => ({...s, collected: false}));
    collectedStars = 0;
    totalStars = stars.length;
    distance = 0;
    timer = 0;
    score = 0;
    particles = [];

    generateTerrain();
    generateDecorations();
}

function getTerrainY(x) {
    const idx = Math.floor(x / 10);
    if (idx < 0 || idx >= terrain.length - 1) return GROUND_Y;
    const t1 = terrain[idx];
    const t2 = terrain[idx + 1];
    const blend = (x - t1.x) / 10;
    return t1.y + (t2.y - t1.y) * blend;
}

// ============ 碰撞检测 ============
function checkCollisions() {
    // 地面碰撞
    const terrainY = getTerrainY(bike.x + BIKE_WIDTH / 2);
    if (bike.y + BIKE_HEIGHT >= terrainY) {
        bike.y = terrainY - BIKE_HEIGHT;
        bike.vy = 0;
        bike.onGround = true;

        // 检查倾斜角度 - 放宽限制，允许更大的倾斜角度
        if (Math.abs(bike.angle) > MAX_TILT * 2.5) {
            bike.alive = false;
            playCrash();
            addParticles(bike.x + BIKE_WIDTH / 2, bike.y + BIKE_HEIGHT, COLORS.bike, 20, 2);
            shakeTimer = 15;
            shakeIntensity = 8;
        }
    } else {
        bike.onGround = false;
    }

    // 障碍物碰撞
    obstacles.forEach(o => {
        if (o.type === 'gap') return;

        const ox = o.x;
        const oy = o.y;
        const ow = o.w;
        const oh = o.h;

        // 简化碰撞检测
        if (bike.x + BIKE_WIDTH > ox && bike.x < ox + ow &&
            bike.y + BIKE_HEIGHT > oy && bike.y < oy + oh) {
            if (o.type === 'ramp') {
                // 斜坡：给予向上推力
                if (bike.vx > 2) {
                    bike.vy = -bike.vx * 0.8;
                    playJump();
                    addParticles(bike.x + BIKE_WIDTH / 2, bike.y + BIKE_HEIGHT, COLORS.ramp, 8);
                } else {
                    // 速度不够，显示提示
                    if (hintTimer <= 0) {
                        hintMessage = '↑ 按住油门加速！';
                        hintTimer = 120;
                    }
                }
            } else {
                // 碰撞
                bike.alive = false;
                playCrash();
                addParticles(bike.x + BIKE_WIDTH / 2, bike.y + BIKE_HEIGHT / 2, COLORS.bike, 25, 2);
                shakeTimer = 15;
                shakeIntensity = 10;
            }
        }
    });

    // 断崖检测
    obstacles.forEach(o => {
        if (o.type === 'gap') {
            if (bike.x + BIKE_WIDTH > o.x && bike.x < o.x + o.w) {
                const gapTerrainY = GROUND_Y + 200; // 断崖深度
                if (bike.y + BIKE_HEIGHT > gapTerrainY) {
                    bike.alive = false;
                    playCrash();
                }
            }
        }
    });

    // 星星收集
    stars.forEach(s => {
        if (!s.collected) {
            const dist = Math.hypot(bike.x + BIKE_WIDTH / 2 - s.x, bike.y + BIKE_HEIGHT / 2 - s.y);
            if (dist < 30) {
                s.collected = true;
                collectedStars++;
                score += 100;
                playStar();
                addParticles(s.x, s.y, COLORS.star, 12);
            }
        }
    });

    // 终点检测
    if (distance >= levelLength) {
        const timeBonus = Math.max(0, (LEVELS[currentLevel].targetTime - timer) * 10);
        const starsBonus = collectedStars * 50;
        score += timeBonus + starsBonus + 500;
        totalScore += score;
        gameState = STATE.LEVEL_COMPLETE;
        playComplete();
    }
}

// ============ 更新逻辑 ============
function update(dt) {
    if (!bike.alive) return;

    timer += dt;

    // 加速/刹车
    if (keys['ArrowUp'] || keys['w'] || keys['W'] || keys[' ']) {
        bike.vx = Math.min(bike.vx + ACCELERATION, MAX_SPEED);
        playEngine();
    } else if (keys['ArrowDown'] || keys['s'] || keys['S']) {
        bike.vx = Math.max(bike.vx - BRAKE_FORCE, 0);
    } else {
        // 自然减速
        bike.vx = Math.max(bike.vx - 0.05, 0);
    }

    // 倾斜控制
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
        bike.angle = Math.max(bike.angle - TILT_SPEED, -MAX_TILT);
    } else if (keys['ArrowRight'] || keys['d'] || keys['D']) {
        bike.angle = Math.min(bike.angle + TILT_SPEED, MAX_TILT);
    } else {
        // 自动回正
        if (bike.angle > 0) bike.angle = Math.max(bike.angle - TILT_SPEED * 0.5, 0);
        else bike.angle = Math.min(bike.angle + TILT_SPEED * 0.5, 0);
    }

    // 重力
    if (!bike.onGround) {
        bike.vy += GRAVITY;
    }

    // 移动
    bike.x += bike.vx;
    bike.y += bike.vy;

    // 车轮旋转
    bike.wheelAngle += bike.vx * 0.2;

    // 更新距离
    distance = bike.x - 100;

    // 更新相机
    camera.x = bike.x - BASE_WIDTH / 3;
    camera.y = Math.min(0, bike.y - BASE_HEIGHT / 2);

    // 边界检测
    if (bike.x < 0) bike.x = 0;

    // 检查碰撞
    checkCollisions();

    // 尘土粒子
    if (bike.onGround && bike.vx > 1) {
        if (Math.random() > 0.7) {
            addParticles(bike.x + BIKE_WIDTH / 2, bike.y + BIKE_HEIGHT, '#8a7a6a', 2, 0.5);
        }
    }
}

// ============ 绘制函数 ============
function drawSky() {
    const gradient = ctx.createLinearGradient(0, 0, 0, BASE_HEIGHT);
    gradient.addColorStop(0, COLORS.sky[0]);
    gradient.addColorStop(0.5, COLORS.sky[1]);
    gradient.addColorStop(1, COLORS.sky[2]);
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, BASE_WIDTH, BASE_HEIGHT);

    // 星星（夜间效果）
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    for (let i = 0; i < 50; i++) {
        const x = (i * 137 + 50) % BASE_WIDTH;
        const y = (i * 89 + 30) % (BASE_HEIGHT / 2);
        ctx.beginPath();
        ctx.arc(x, y, 1, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawMountains() {
    mountains.forEach(m => {
        const screenX = m.x - camera.x * 0.3;
        if (screenX > -m.w && screenX < BASE_WIDTH + m.w) {
            ctx.fillStyle = COLORS.mountain;
            ctx.beginPath();
            ctx.moveTo(screenX - m.w / 2, GROUND_Y - camera.y);
            ctx.lineTo(screenX, GROUND_Y - m.h - camera.y);
            ctx.lineTo(screenX + m.w / 2, GROUND_Y - camera.y);
            ctx.closePath();
            ctx.fill();

            // 山顶雪
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.beginPath();
            ctx.moveTo(screenX - m.w / 6, GROUND_Y - m.h * 0.7 - camera.y);
            ctx.lineTo(screenX, GROUND_Y - m.h - camera.y);
            ctx.lineTo(screenX + m.w / 6, GROUND_Y - m.h * 0.7 - camera.y);
            ctx.closePath();
            ctx.fill();
        }
    });
}

function drawClouds() {
    clouds.forEach(c => {
        const screenX = c.x - camera.x * 0.2;
        if (screenX > -c.w && screenX < BASE_WIDTH + c.w) {
            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            ctx.beginPath();
            ctx.ellipse(screenX, c.y, c.w / 2, c.h / 2, 0, 0, Math.PI * 2);
            ctx.fill();
        }
    });
}

function drawTerrain() {
    // 道路
    ctx.fillStyle = COLORS.road;
    ctx.beginPath();
    ctx.moveTo(0 - camera.x, GROUND_Y + 100 - camera.y);

    for (let x = Math.max(0, camera.x - 50); x < Math.min(levelLength + 200, camera.x + BASE_WIDTH + 50); x += 20) {
        const ty = getTerrainY(x);
        ctx.lineTo(x - camera.x, ty - camera.y);
    }

    ctx.lineTo(BASE_WIDTH + 50, BASE_HEIGHT + 50);
    ctx.lineTo(-50, BASE_HEIGHT + 50);
    ctx.closePath();
    ctx.fillStyle = COLORS.ground;
    ctx.fill();

    // 草地
    ctx.fillStyle = COLORS.grass;
    ctx.beginPath();
    ctx.moveTo(0 - camera.x, GROUND_Y + 5 - camera.y);

    for (let x = Math.max(0, camera.x - 50); x < Math.min(levelLength + 200, camera.x + BASE_WIDTH + 50); x += 20) {
        const ty = getTerrainY(x);
        ctx.lineTo(x - camera.x, ty - 5 - camera.y);
    }

    ctx.lineTo(BASE_WIDTH + 50, GROUND_Y + 10 - camera.y);
    ctx.lineTo(-50, GROUND_Y + 10 - camera.y);
    ctx.closePath();
    ctx.fill();

    // 路面标线
    ctx.strokeStyle = COLORS.roadLine;
    ctx.lineWidth = 3;
    ctx.setLineDash([20, 20]);
    ctx.beginPath();
    for (let x = Math.max(0, camera.x - 50); x < Math.min(levelLength + 200, camera.x + BASE_WIDTH + 50); x += 20) {
        const ty = getTerrainY(x) - 5;
        if (x === Math.max(0, camera.x - 50)) ctx.moveTo(x - camera.x, ty - camera.y);
        else ctx.lineTo(x - camera.x, ty - camera.y);
    }
    ctx.stroke();
    ctx.setLineDash([]);
}

function drawObstacles() {
    obstacles.forEach(o => {
        const screenX = o.x - camera.x;
        const screenY = (o.y || GROUND_Y) - camera.y;

        if (screenX < -100 || screenX > BASE_WIDTH + 100) return;

        if (o.type === 'rock') {
            ctx.fillStyle = COLORS.obstacle;
            ctx.beginPath();
            ctx.moveTo(screenX, screenY + o.h);
            ctx.lineTo(screenX + o.w * 0.3, screenY);
            ctx.lineTo(screenX + o.w * 0.7, screenY);
            ctx.lineTo(screenX + o.w, screenY + o.h);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.beginPath();
            ctx.moveTo(screenX + o.w * 0.3, screenY + 5);
            ctx.lineTo(screenX + o.w * 0.5, screenY);
            ctx.lineTo(screenX + o.w * 0.6, screenY + o.h * 0.5);
            ctx.closePath();
            ctx.fill();
        } else if (o.type === 'ramp') {
            ctx.fillStyle = COLORS.ramp;
            ctx.beginPath();
            ctx.moveTo(screenX, screenY + o.h);
            ctx.lineTo(screenX + o.w, screenY);
            ctx.lineTo(screenX + o.w, screenY + o.h);
            ctx.closePath();
            ctx.fill();

            // 斜坡条纹
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 2;
            for (let i = 0; i < o.w; i += 15) {
                ctx.beginPath();
                ctx.moveTo(screenX + i, screenY + o.h);
                ctx.lineTo(screenX + i + o.h, screenY);
                ctx.stroke();
            }
        } else if (o.type === 'gap') {
            // 断崖
            ctx.fillStyle = '#1a0a0a';
            ctx.fillRect(screenX, GROUND_Y - camera.y, o.w, 300);

            // 断崖边缘
            ctx.fillStyle = COLORS.ground;
            ctx.fillRect(screenX - 5, GROUND_Y - camera.y - 10, 10, 20);
            ctx.fillRect(screenX + o.w - 5, GROUND_Y - camera.y - 10, 10, 20);
        }
    });
}

function drawStars() {
    stars.forEach(s => {
        if (s.collected) return;

        const screenX = s.x - camera.x;
        const screenY = s.y - camera.y;

        if (screenX < -30 || screenX > BASE_WIDTH + 30) return;

        const pulse = Math.sin(animTimer * 0.08) * 0.3 + 0.7;

        // 光晕
        const gradient = ctx.createRadialGradient(screenX, screenY, 0, screenX, screenY, 20);
        gradient.addColorStop(0, COLORS.starGlow);
        gradient.addColorStop(1, 'transparent');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(screenX, screenY, 20 * pulse, 0, Math.PI * 2);
        ctx.fill();

        // 星星
        ctx.fillStyle = COLORS.star;
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
            const angle = (i * 4 * Math.PI / 5) - Math.PI / 2;
            const x = screenX + Math.cos(angle) * 10;
            const y = screenY + Math.sin(angle) * 10;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fill();
    });
}

function drawBike() {
    if (!bike.alive) return;

    const screenX = bike.x - camera.x;
    const screenY = bike.y - camera.y;

    ctx.save();
    ctx.translate(screenX + BIKE_WIDTH / 2, screenY + BIKE_HEIGHT);
    ctx.rotate(bike.angle);

    // 车身
    ctx.fillStyle = COLORS.bike;
    ctx.fillRect(-BIKE_WIDTH / 2, -BIKE_HEIGHT, BIKE_WIDTH, BIKE_HEIGHT);

    // 车身装饰
    ctx.fillStyle = COLORS.bikeDark;
    ctx.fillRect(-BIKE_WIDTH / 2 + 5, -BIKE_HEIGHT + 5, BIKE_WIDTH - 10, 5);

    // 骑手
    ctx.fillStyle = '#4a4a4a';
    ctx.fillRect(-5, -BIKE_HEIGHT - 20, 10, 15);
    ctx.fillStyle = '#6a6a6a';
    ctx.beginPath();
    ctx.arc(0, -BIKE_HEIGHT - 25, 8, 0, Math.PI * 2);
    ctx.fill();

    // 后轮
    ctx.save();
    ctx.translate(-BIKE_WIDTH / 2 + 10, 0);
    ctx.rotate(bike.wheelAngle);
    ctx.fillStyle = COLORS.wheel;
    ctx.beginPath();
    ctx.arc(0, 0, WHEEL_RADIUS, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = COLORS.wheelHub;
    ctx.beginPath();
    ctx.arc(0, 0, 4, 0, Math.PI * 2);
    ctx.fill();
    // 轮辐
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 1;
    for (let i = 0; i < 4; i++) {
        const a = i * Math.PI / 2;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(a) * WHEEL_RADIUS, Math.sin(a) * WHEEL_RADIUS);
        ctx.stroke();
    }
    ctx.restore();

    // 前轮
    ctx.save();
    ctx.translate(BIKE_WIDTH / 2 - 10, 0);
    ctx.rotate(bike.wheelAngle);
    ctx.fillStyle = COLORS.wheel;
    ctx.beginPath();
    ctx.arc(0, 0, WHEEL_RADIUS, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = COLORS.wheelHub;
    ctx.beginPath();
    ctx.arc(0, 0, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#555';
    for (let i = 0; i < 4; i++) {
        const a = i * Math.PI / 2;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(a) * WHEEL_RADIUS, Math.sin(a) * WHEEL_RADIUS);
        ctx.stroke();
    }
    ctx.restore();

    ctx.restore();
}

function calculateStars() {
    const level = LEVELS[currentLevel];
    if (timer <= level.starTimes[0]) return 3;
    if (timer <= level.starTimes[1]) return 2;
    if (timer <= level.starTimes[2]) return 1;
    return 0;
}

// ============ 交互处理 ============
function handleTap(x, y) {
    initAudio();
    playClick();

    if (gameState === STATE.MENU) {
        if (x > BASE_WIDTH / 2 - 80 && x < BASE_WIDTH / 2 + 80 && y > 360 && y < 425) {
            gameState = STATE.PLAYING;
            currentLevel = 0;
            totalScore = 0;
            initLevel(0);
            return;
        }

        for (let i = 0; i < LEVELS.length; i++) {
            const lx = BASE_WIDTH / 2 - 150 + (i % 3) * 100;
            const ly = 530 + Math.floor(i / 3) * 50;
            if (x > lx - 40 && x < lx + 40 && y > ly - 15 && y < ly + 15) {
                gameState = STATE.PLAYING;
                currentLevel = i;
                totalScore = 0;
                initLevel(i);
                return;
            }
        }
        return;
    }

    if (gameState === STATE.PAUSED) {
        if (x > BASE_WIDTH / 2 - 50 && x < BASE_WIDTH / 2 + 50 && y > 340 && y < 375) {
            gameState = STATE.PLAYING;
        }
        return;
    }

    if (gameState === STATE.LEVEL_COMPLETE) {
        if (x > BASE_WIDTH / 2 - 60 && x < BASE_WIDTH / 2 + 60 && y > 420 && y < 460) {
            if (currentLevel < LEVELS.length - 1) {
                currentLevel++;
                initLevel(currentLevel);
                gameState = STATE.PLAYING;
            } else {
                gameState = STATE.MENU;
                if (totalScore > highScore) {
                    highScore = totalScore;
                    localStorage.setItem('moto_highScore', highScore);
                }
            }
        }
        return;
    }

    if (gameState === STATE.GAME_OVER) {
        if (x > BASE_WIDTH / 2 - 60 && x < BASE_WIDTH / 2 + 60 && y > 390 && y < 430) {
            initLevel(currentLevel);
            gameState = STATE.PLAYING;
        }
        return;
    }

    if (gameState !== STATE.PLAYING) return;

    // 底部按钮检测
    if (y > BASE_HEIGHT - 55) {
        // 刹车
        if (x > 10 && x < 80) {
            keys['ArrowDown'] = true;
            return;
        }
        // 油门
        if (x > BASE_WIDTH - 80 && x < BASE_WIDTH - 10) {
            keys['ArrowUp'] = true;
            return;
        }
        // 左倾
        if (x > 100 && x < 160) {
            keys['ArrowLeft'] = true;
            return;
        }
        // 右倾
        if (x > BASE_WIDTH - 160 && x < BASE_WIDTH - 100) {
            keys['ArrowRight'] = true;
            return;
        }
        // 暂停
        if (x > BASE_WIDTH / 2 - 25 && x < BASE_WIDTH / 2 + 25) {
            gameState = STATE.PAUSED;
            return;
        }
    }
}

function handleRelease() {
    keys['ArrowUp'] = false;
    keys['ArrowDown'] = false;
    keys['ArrowLeft'] = false;
    keys['ArrowRight'] = false;
}

// ============ 事件监听 ============
canvas.addEventListener('mousedown', e => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = BASE_WIDTH / rect.width;
    const scaleY = BASE_HEIGHT / rect.height;
    handleTap((e.clientX - rect.left) * scaleX, (e.clientY - rect.top) * scaleY);
});

canvas.addEventListener('mouseup', handleRelease);

canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    const scaleX = BASE_WIDTH / rect.width;
    const scaleY = BASE_HEIGHT / rect.height;
    handleTap((touch.clientX - rect.left) * scaleX, (touch.clientY - rect.top) * scaleY);
});

canvas.addEventListener('touchend', e => {
    e.preventDefault();
    handleRelease();
});

document.addEventListener('keydown', e => {
    keys[e.key] = true;

    if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
        if (gameState === STATE.PLAYING) {
            gameState = STATE.PAUSED;
        } else if (gameState === STATE.PAUSED) {
            gameState = STATE.PLAYING;
        }
    }

    if (e.key === 'r' || e.key === 'R') {
        if (gameState === STATE.PLAYING) {
            initLevel(currentLevel);
        }
    }
});

document.addEventListener('keyup', e => {
    keys[e.key] = false;
});

// ============ 响应式 ============
function resize() {
    const maxW = window.innerWidth;
    const maxH = window.innerHeight;
    const scale = Math.min(maxW / BASE_WIDTH, maxH / BASE_HEIGHT);
    canvas.style.width = (BASE_WIDTH * scale) + 'px';
    canvas.style.height = (BASE_HEIGHT * scale) + 'px';
}
window.addEventListener('resize', resize);
resize();

// ============ 游戏循环 ============
let lastTime = 0;
function gameLoop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;
    animTimer++;
    
    // 更新提示计时器
    if (hintTimer > 0) hintTimer--;

    let didShakeSave = false;
    if (shakeTimer > 0) {
        shakeTimer--;
        ctx.save();
        didShakeSave = true;
        ctx.translate(
            (Math.random() - 0.5) * shakeIntensity,
            (Math.random() - 0.5) * shakeIntensity
        );
    }

    ctx.fillStyle = COLORS.dark;
    ctx.fillRect(0, 0, BASE_WIDTH, BASE_HEIGHT);

    if (gameState === STATE.MENU) {
        drawMenu();
    } else {
        drawSky();
        drawClouds();
        drawMountains();
        drawTerrain();
        drawObstacles();
        drawStars();
        drawBike();
        drawParticles();
        updateParticles();

        if (gameState === STATE.PLAYING) {
            update(dt);
            drawUI();

            if (!bike.alive) {
                gameState = STATE.GAME_OVER;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('moto_highScore', highScore);
                }
            }
        } else if (gameState === STATE.PAUSED) {
            drawUI();
            drawPaused();
        } else if (gameState === STATE.LEVEL_COMPLETE) {
            drawUI();
            drawLevelComplete();
        } else if (gameState === STATE.GAME_OVER) {
            drawUI();
            drawGameOver();
        }
    }

    if (didShakeSave) {
        ctx.restore();
    }

    requestAnimationFrame(gameLoop);
}

// ============ 启动 ============
requestAnimationFrame(gameLoop);


// ===== 游戏工坊统一广告系统 =====
const GameMonetize = {
	adsterra: { enabled: !/localhost|127\.0\.0\.1/.test(location.hostname) },
	sponsor: { enabled: true, wechatQR: '', alipayQR: '' },
	interstitial: { enabled: true, cooldownMs: 180000, gameCount: 2 },
	_lastInterTime: 0, _deathCount: 0,
	_gameOverDetected: false,
	init() {
		const banner = document.getElementById('adBanner');
		if (banner && this.adsterra.enabled) {
			const s1 = document.createElement('script');
			s1.src = 'https://pl29544740.effectivecpmnetwork.com/de/26/0e/de260e17b6a348e3489772a87b1cedf1.js';
			s1.async = true;
			banner.appendChild(s1);
		}
		const spBtn = document.getElementById('sponsorBtn');
		const spPanel = document.getElementById('sponsorPanel');
		const spClose = document.getElementById('sponsorClose');
		if (spBtn && spPanel && spClose && this.sponsor.enabled) {
			spBtn.onclick = () => { spPanel.style.display = 'flex'; spPanel.style.pointerEvents = 'auto'; };
			spClose.onclick = () => { spPanel.style.display = 'none'; spPanel.style.pointerEvents = 'none'; };
			spPanel.onclick = (e) => { if (e.target === spPanel) { spPanel.style.display = 'none'; spPanel.style.pointerEvents = 'none'; } };
		} else if (spBtn) { spBtn.style.display = 'none'; }
		const skipBtn = document.getElementById('skipInterstitial');
		const interstitial = document.getElementById('interstitialAd');
		if (skipBtn && interstitial) {
			skipBtn.onclick = () => {
				interstitial.style.display = 'none'; interstitial.style.pointerEvents = 'none';
				if (this._reviveCallback) { const cb = this._reviveCallback; this._reviveCallback = null; cb(); }
			};
		}
		// 自动检测游戏结束状态
		this._startGameOverWatcher();
	},
	_startGameOverWatcher() {
		// 检测#restartBtn或包含"重新开始"/"再来一局"的按钮变为可见
		const checkGameOver = () => {
			if (this._gameOverDetected) return;
			// 方法1: 检测#restartBtn可见
			const restartBtn = document.getElementById('restartBtn');
			if (restartBtn && restartBtn.offsetParent !== null && getComputedStyle(restartBtn).display !== 'none') {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
			// 方法2: 检测#gameOverScreen可见
			const goScreen = document.getElementById('gameOverScreen');
			if (goScreen && getComputedStyle(goScreen).display !== 'none') {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
			// 方法3: 检测screen-gameover可见
			const goScreen2 = document.getElementById('screen-gameover');
			if (goScreen2 && !goScreen2.classList.contains('hidden')) {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
		};
		// 每500ms检查一次
		this._goInterval = setInterval(() => {
			checkGameOver();
			// 如果检测到了，等2秒后重置标志，允许下次检测
			if (this._gameOverDetected) {
				setTimeout(() => { this._gameOverDetected = false; }, 2000);
			}
		}, 500);
	},
	requestRevive(callback) {
		this._reviveCallback = callback || null;
		const el = document.getElementById('interstitialAd');
		if (!el) { if (callback) callback(); return; }
		const s2 = document.createElement('script');
		s2.src = 'https://pl29544742.effectivecpmnetwork.com/be/a9/6d/bea96d779c0ee07c2b15613852dd3e70.js';
		s2.async = true;
		document.getElementById('interstitialAdSlot').innerHTML = '';
		document.getElementById('interstitialAdSlot').appendChild(s2);
		el.style.display = 'flex'; el.style.pointerEvents = 'auto';

		setTimeout(() => { const slot = document.getElementById('interstitialAdSlot'); if (slot && slot.innerHTML.includes('加载中')) { slot.innerHTML = '<div style=color:#aaa;font:13px Microsoft YaHei,sans-serif>广告暂时无法加载<br>点击下方按钮继续</div>'; } }, 3000);
		const skipBtn = document.getElementById('skipInterstitial');
		if (skipBtn) {
			skipBtn.textContent = '5 秒后可跳过'; skipBtn.disabled = true;
			let cd = 5;
			const timer = setInterval(() => {
				cd--;
				if (cd <= 0) { clearInterval(timer); skipBtn.textContent = '跳过广告 ▶'; skipBtn.disabled = false; }
				else { skipBtn.textContent = cd + ' 秒后可跳过'; }
			}, 1000);
		}
	},
	onGameOver() {
		this._deathCount++;
		if (!this.interstitial.enabled) return;
		if (this._deathCount < this.interstitial.gameCount) return;
		if (Date.now() - this._lastInterTime < this.interstitial.cooldownMs) return;
		this._lastInterTime = Date.now(); this._deathCount = 0;
		this.requestRevive(null);
	},
};
GameMonetize.init();
</script>
