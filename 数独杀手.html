// ==================== Achievement System ====================
const ACHIEVEMENTS = [

    {id:'speed_demon', name:'闪电之速', desc:'10分钟内通关中等难度', icon:'⚡', check:()=>false},
    {id:'perfectionist', name:'完美主义', desc:'零错误通关困难难度', icon:'💎', check:()=>false},
    {id:'cage_master', name:'区域大师', desc:'完成50个区域', icon:'🎯', check:()=>false},
    {id:'hint_free', name:'独立思考', desc:'不使用提示通关', icon:'🧠', check:()=>false},

    {id:'speed_5', name:'疾风步', desc:'5分钟内通关简单难度', icon:'🌪️', check:()=>false},
    {id:'marathon', name:'马拉松', desc:'累计游戏时间超过1小时', icon:'🏃', check:()=>false},

let unlockedAchievements = new Set();

// ==================== Difficulty Presets ====================
const DIFF_PRESETS = [

    },

        name: '困难', desc: '极限烧脑体验', color: '#dd4444',
        removeCount: 50, mistakeAllow: 2, hintAllow: 1, timeBonus: 5, scoreMult: 2.5,
        rules: '最少已知数 + 零容错'
    }
];

// ==================== Cage Color Themes ====================
const CAGE_THEMES = {
    pastel: [
        'rgba(255,182,193,0.1)', 'rgba(176,224,230,0.1)', 'rgba(144,238,144,0.1)',
        'rgba(255,218,185,0.1)', 'rgba(221,160,221,0.1)', 'rgba(135,206,235,0.1)',
        'rgba(255,255,186,0.1)', 'rgba(176,196,222,0.1)', 'rgba(255,228,196,0.1)'
    ],
    neon: [
        'rgba(255,0,128,0.12)', 'rgba(0,255,255,0.12)', 'rgba(128,0,255,0.12)',
        'rgba(255,255,0,0.12)', 'rgba(0,255,128,0.12)', 'rgba(255,128,0,0.12)',
        'rgba(0,128,255,0.12)', 'rgba(255,0,64,0.12)', 'rgba(64,255,0,0.12)'
    ],
    ocean: [
        'rgba(0,105,148,0.1)', 'rgba(0,150,136,0.1)', 'rgba(33,150,243,0.1)',

    ]
};
let currentTheme = 'pastel';

// ==================== Game State ====================
let W, H, cellSize, gridX, gridY, gridPx;
let screen = SCREEN.MENU;
let difficulty = 1; // 0=easy,1=medium,2=hard
let board = [];      // 9x9 solution
let puzzle = [];     // 9x9 puzzle (0=empty)
let player = [];     // 9x9 player input
let notes = [];      // 9x9 [9]bool pencil marks
let cages = [];      // [{cells:[[r,c],...], sum:N}]
let selected = null; // {r,c}
let hover = null;
let timer = 0;
let timerStart = 0;
let score = 0;
let mistakes = 0;
let maxMistakes = 3;
let paused = false;
let completedRows = new Set();
let completedCols = new Set();
let completedBoxes = new Set();
let animCells = [];   // [{r,c,color,alpha,decay}]
let particles = [];
let noteMode = false;
let highScores = {};
let undoStack = [];
let showComplete = false;
let completeAnimT = 0;

// ==================== Background Stars ====================
function initStars() {
    bgStars = [];
    for(let i=0;i<60;i++) {
        bgStars.push({
            x: Math.random()*W,
            y: Math.random()*H,
            size: Math.random()*2+0.5,
            speed: Math.random()*0.3+0.05,
            alpha: Math.random()*0.6+0.1,
            twinkle: Math.random()*Math.PI*2
        });
    }
}

function renderStars() {
    for(const s of bgStars) {
        s.twinkle += 0.02;
        const a = s.alpha * (0.5+0.5*Math.sin(s.twinkle));
        ctx.fillStyle = `rgba(180,180,255,${a})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
        ctx.fill();
        s.y += s.speed;
        if(s.y > H+5) { s.y = -5; s.x = Math.random()*W; }
    }
}

// ==================== Achievement System ====================

    if(ach) {
        achievementNotif = ach;
        achievementNotifTimer = 180;
    }
    saveAchievements();
}

function checkAchievements() {
    if(historyStats.gamesWon >= 1) unlockAchievement('first_win');
    if(historyStats.totalTime >= 3600000) unlockAchievement('marathon');
    if(unlockedAchievements.size >= ACHIEVEMENTS.length-1) unlockAchievement('collector');
}

// ==================== Combo System ====================
function updateCombo() {

    if(now - lastPlaceTime < 3000) {
        comboCount++;
        comboTimer = 120;
    } else {
        comboCount = 1;

    }

}

// ==================== Ad System ====================
function initAdSystem() {

    document.getElementById('sponsorBtn').addEventListener('click', () => {

    });

// ==================== Killer Sudoku Generator ====================
function shuffle(arr) {
    for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
    return arr;
}

function generateSolution() {
    const grid = Array.from({length:9},()=>Array(9).fill(0));
    const base = [1,2,3,4,5,6,7,8,9];

    function isValid(g,r,c,n) {
        for(let i=0;i<9;i++) if(g[r][i]===n||g[i][c]===n) return false;
        const br=Math.floor(r/3)*3, bc=Math.floor(c/3)*3;
        for(let i=br;i<br+3;i++) for(let j=bc;j<bc+3;j++) if(g[i][j]===n) return false;
        return true;
    }

    function solve(g) {
        for(let r=0;r<9;r++) for(let c=0;c<9;c++) {
            if(g[r][c]===0) {
                const nums = shuffle([...base]);
                for(const n of nums) {
                    if(isValid(g,r,c,n)) {
                        g[r][c]=n;
                        if(solve(g)) return true;
                        g[r][c]=0;
                    }
                }
                return false;
            }
        }
        return true;
    }

    solve(grid);
    return grid;
}

function generateCages(sol) {
    const cageMap = Array.from({length:9},()=>Array(9).fill(-1));
    const cagesList = [];
    let cageId = 0;
    const visited = Array.from({length:9},()=>Array(9).fill(false));
    const dirs = [[0,1],[1,0],[0,-1],[-1,0]];

    // Start from random cells and grow cages
    const allCells = [];
    for(let r=0;r<9;r++) for(let c=0;c<9;c++) allCells.push([r,c]);
    shuffle(allCells);

    for(const [sr,sc] of allCells) {
        if(visited[sr][sc]) continue;
        const targetSize = Math.floor(Math.random()*3)+1; // 1-3 cells
        const cells = [[sr,sc]];
        visited[sr][sc] = true;

        // Grow cage
        while(cells.length < targetSize) {
            const last = cells[cells.length-1];
            const neighbors = [];
            for(const [dr,dc] of dirs) {
                const nr=last[0]+dr, nc=last[1]+dc;
                if(nr>=0&&nr<9&&nc>=0&&nc<9&&!visited[nr][nc]) neighbors.push([nr,nc]);
            }
            if(neighbors.length===0) break;
            const [nr,nc] = neighbors[Math.floor(Math.random()*neighbors.length)];
            cells.push([nr,nc]);
            visited[nr][nc] = true;
        }

        let sum = 0;
        for(const [r,c] of cells) sum += sol[r][c];
        for(const [r,c] of cells) cageMap[r][c] = cageId;
        cagesList.push({cells, sum});
        cageId++;
    }

    // Handle any remaining unvisited cells by merging into neighbors
    for(let r=0;r<9;r++) for(let c=0;c<9;c++) {
        if(!visited[r][c]) {
            for(const [dr,dc] of dirs) {
                const nr=r+dr, nc=c+dc;
                if(nr>=0&&nr<9&&nc>=0&&nc<9&&visited[nr][nc]) {
                    const cid = cageMap[nr][nc];
                    cagesList[cid].cells.push([r,c]);
                    cagesList[cid].sum += sol[r][c];
                    cageMap[r][c] = cid;
                    visited[r][c] = true;
                    break;
                }
            }
        }
    }

    return cagesList;
}

function generatePuzzle(sol, diff) {
    const p = sol.map(r=>[...r]);
    // Remove cells based on difficulty
    let remove;
    if(diff===0) remove = 35;
    else if(diff===1) remove = 45;
    else remove = 52;

    const cells = [];
    for(let r=0;r<9;r++) for(let c=0;c<9;c++) cells.push([r,c]);
    shuffle(cells);

    for(let i=0;i<remove&&i<cells.length;i++) {
        const [r,c] = cells[i];
        p[r][c] = 0;
    }
    return p;
}

function initGame(diff) {
    difficulty = diff;
    selectedPreset = DIFF_PRESETS[diff];
    maxMistakes = selectedPreset.mistakeAllow;
    maxHints = selectedPreset.hintAllow;
    board = generateSolution();
    cages = generateCages(board);
    puzzle = generatePuzzle(board, diff);
    player = puzzle.map(r=>[...r]);
    notes = Array.from({length:9},()=>Array.from({length:9},()=>Array(9).fill(false)));
    selected = null;
    timer = 0;
    timerStart = Date.now();
    score = 0;
    mistakes = 0;
    paused = false;
    completedRows.clear();
    completedCols.clear();
    completedBoxes.clear();
    animCells = [];
    particles = [];
    noteMode = false;
    undoStack = [];
    showComplete = false;
    completeAnimT = 0;
    hintCount = 0;
    comboCount = 0;
    comboTimer = 0;
    showHintGlow = false;
    hintGlowCell = null;
    screen = SCREEN.PLAYING;
    historyStats.gamesPlayed++;
    saveAchievements();
    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('pauseBtn').style.display = 'block';
}

// ==================== Scoring ====================
function calcScore() {
    let s = 0;
    const mult = selectedPreset ? selectedPreset.scoreMult : 1;
    // Base score for each filled cell
    for(let r=0;r<9;r++) for(let c=0;c<9;c++) {
        if(player[r][c]!==0 && puzzle[r][c]===0) s += 10;
    }
    // Bonus for completed rows/cols/boxes
    s += completedRows.size * 50;
    s += completedCols.size * 50;
    s += completedBoxes.size * 50;
    // Time bonus
    const mins = timer/60000;
    const timeBonus = selectedPreset ? selectedPreset.timeBonus : 10;
    if(mins < timeBonus) s += Math.floor((timeBonus-mins)*20);
    // Difficulty bonus
    s += difficulty * 200;
    // Mistake penalty
    s -= mistakes * 30;
    // Hint penalty
    s -= hintCount * 50;
    // Combo bonus
    if(comboTimer > 0 && comboCount > 1) {
        s += comboCount * 5;
    }
    // Apply difficulty multiplier
    s = Math.floor(s * mult);
    return Math.max(0, s);
}

function checkCompletion() {
    // Check rows
    for(let r=0;r<9;r++) {
        if(completedRows.has(r)) continue;
        const row = new Set();
        let full = true;
        for(let c=0;c<9;c++) {
            if(player[r][c]===0) {full=false;break;}
            row.add(player[r][c]);
        }
        if(full && row.size===9) {
            completedRows.add(r);
            spawnRowColAnim(r, 'row');
        }
    }
    // Check cols
    for(let c=0;c<9;c++) {
        if(completedCols.has(c)) continue;
        const col = new Set();
        let full = true;
        for(let r=0;r<9;r++) {
            if(player[r][c]===0) {full=false;break;}
            col.add(player[r][c]);
        }
        if(full && col.size===9) {
            completedCols.add(c);
            spawnRowColAnim(c, 'col');
        }
    }
    // Check 3x3 boxes
    for(let br=0;br<3;br++) for(let bc=0;bc<3;bc++) {
        const bi = br*3+bc;
        if(completedBoxes.has(bi)) continue;
        const box = new Set();
        let full = true;
        for(let r=br*3;r<br*3+3;r++) for(let c=bc*3;c<bc*3+3;c++) {
            if(player[r][c]===0) {full=false;break;}
            box.add(player[r][c]);
        }
        if(!full) continue;
        if(box.size===9) {
            completedBoxes.add(bi);
            spawnBoxAnim(br,bc);
        }
    }
    // Check win
    for(let r=0;r<9;r++) for(let c=0;c<9;c++) {
        if(player[r][c]!==board[r][c]) return;
    }
    // WIN!
    timer = Date.now() - timerStart;
    score = calcScore();
    screen = SCREEN.GAMEOVER;
    showComplete = true;
    completeAnimT = 0;
    historyStats.gamesWon++;
    const elapsed = timer;
    if(!historyStats.bestTimes[difficulty] || elapsed < historyStats.bestTimes[difficulty]) {
        historyStats.bestTimes[difficulty] = elapsed;
    }
    historyStats.totalTime += elapsed;
    saveHighScore();
    saveAchievements();
    checkAchievements();
    // Check specific achievements
    if(difficulty===1 && elapsed < 600000) unlockAchievement('speed_demon');
    if(difficulty===2 && mistakes===0) unlockAchievement('perfectionist');
    if(hintCount===0) unlockAchievement('hint_free');
    if(noteMode) unlockAchievement('note_taker');
    if(difficulty===0 && elapsed < 300000) unlockAchievement('speed_5');
    spawnWinParticles();
    // Show interstitial ad after a delay
    if(Date.now() - lastInterAd > 120000) {
        lastInterAd = Date.now();
        setTimeout(showInterstitialAd, 2000);
    }
}

function spawnRowColAnim(idx, type) {
    for(let i=0;i<9;i++) {
        const r = type==='row'?idx:i;
        const c = type==='row'?i:idx;
        animCells.push({r,c,color:'#ff6b9d',alpha:0.8,decay:0.015});
    }
    // Particles
    for(let i=0;i<15;i++) {
        const px = type==='row' ? gridX + Math.random()*gridPx : gridX + c*cellSize + cellSize/2;
        const py = type==='row' ? gridY + r*cellSize + cellSize/2 : gridY + Math.random()*gridPx;
        particles.push({x:type==='col'?gridX+idx*cellSize+cellSize/2:Math.random()*gridPx+gridX, y:type==='row'?gridY+idx*cellSize+cellSize/2:Math.random()*gridPx+gridY, vx:(Math.random()-0.5)*3, vy:(Math.random()-0.5)*3-1, life:60, color:'#ff6b9d', size:Math.random()*4+2});
    }
}

function spawnBoxAnim(br,bc) {
    for(let r=br*3;r<br*3+3;r++) for(let c=bc*3;c<bc*3+3;c++) {
        animCells.push({r,c,color:'#bb88ff',alpha:0.8,decay:0.015});
    }
    for(let i=0;i<20;i++) {
        particles.push({x:gridX+(bc*3+1.5)*cellSize+(Math.random()-0.5)*cellSize*2, y:gridY+(br*3+1.5)*cellSize+(Math.random()-0.5)*cellSize*2, vx:(Math.random()-0.5)*4, vy:(Math.random()-0.5)*4-1, life:80, color:'#bb88ff', size:Math.random()*5+2});

}

function spawnWinParticles() {
    for(let i=0;i<80;i++) {
        particles.push({
            x: W/2 + (Math.random()-0.5)*200,
            y: H/2,
            vx: (Math.random()-0.5)*8,
            vy: -Math.random()*8-2,
            life: 120 + Math.random()*60,

        });

}

function spawnPlaceParticles(r,c) {
    for(let i=0;i<8;i++) {
        particles.push({
            x: gridX + c*cellSize + cellSize/2,
            y: gridY + r*cellSize + cellSize/2,
            vx: (Math.random()-0.5)*3,
            vy: (Math.random()-0.5)*3,

            size: Math.random()*3+1

// ==================== Save/Load ====================
function loadHighScores() {
    try {
        const s = localStorage.getItem('killerSudoku_scores');
        if(s) highScores = JSON.parse(s);
    } catch(e){}
}

function saveHighScore() {
    try {
        const key = 'diff'+difficulty;
        if(!highScores[key] || score > highScores[key]) {
            highScores[key] = score;
        }
        localStorage.setItem('killerSudoku_scores', JSON.stringify(highScores));
    } catch(e){}
}

// ==================== Input ====================
function getCell(x,y) {
    const c_col = Math.floor((x-gridX)/cellSize);
    const c_row = Math.floor((y-gridY)/cellSize);
    if(c_row>=0&&c_row<9&&c_col>=0&&c_col<9) return {r:c_row,c:c_col};
    return null;
}

function getNumBtn(x,y) {
    // Number buttons are rendered below the grid
    const btnY = gridY + gridPx + 15;
    const btnSize = Math.min(cellSize*0.9, (W-40)/11);
    const startX = (W - btnSize*10.5)/2;
    for(let i=0;i<10;i++) {
        const bx = startX + i*(btnSize+btnSize*0.05);
        if(x>=bx && x<=bx+btnSize && y>=btnY && y<=btnY+btnSize) {
            return i; // 0=erase, 1-9=number
        }
    }
    // Note mode toggle
    const noteY = btnY + btnSize + 10;
    if(x>=startX && x<=startX+btnSize*2 && y>=noteY && y<=noteY+btnSize*0.8) return 'note';
    // Hint button
    if(x>=startX+btnSize*2.5 && x<=startX+btnSize*4.5 && y>=noteY && y<=noteY+btnSize*0.8) return 'hint';
    // Undo button
    if(x>=startX+btnSize*5 && x<=startX+btnSize*7 && y>=noteY && y<=noteY+btnSize*0.8) return 'undo';
    return null;
}

function handleClick(e) {
    const rect = c.getBoundingClientRect();
    const x = (e.clientX-rect.left)*(W/rect.width);
    const y = (e.clientY-rect.top)*(H/rect.height);
    handleInput(x,y);
}

function handleTouch(e) {
    e.preventDefault();
    const t = e.touches[0];
    const rect = c.getBoundingClientRect();
    const x = (t.clientX-rect.left)*(W/rect.width);
    const y = (t.clientY-rect.top)*(H/rect.height);
    handleInput(x,y);
}

function handleMove(e) {
    if(screen!==SCREEN.PLAYING) return;
    const rect = c.getBoundingClientRect();
    const x = (e.clientX-rect.left)*(W/rect.width);
    const y = (e.clientY-rect.top)*(H/rect.height);
    hover = getCell(x,y);
}

function handleInput(x,y) {
    if(screen===SCREEN.MENU) {
        // Check difficulty buttons
        const btnW = Math.min(260, W*0.65);
        const btnH = 54;
        const btnsY = H*0.45;
        for(let i=0;i<3;i++) {
            const bx = W/2-btnW/2;
            const by = btnsY + i*(btnH+14);
            if(x>=bx&&x<=bx+btnW&&y>=by&&y<=by+btnH) {
                initGame(i);
                return;
            }
        }
        // Check settings button
        const smallBtnW = Math.min(120, W*0.25);
        const smallBtnH = 36;
        const statsY = btnsY + 3*(btnH+14) + 20 + 70;
        const smallBtnY = statsY + 20;
        if(x>=W/2-smallBtnW-10&&x<=W/2-10&&y>=smallBtnY&&y<=smallBtnY+smallBtnH) {
            screen = SCREEN.SETTINGS;
            return;
        }
        // Check achievements button
        if(x>=W/2+10&&x<=W/2+10+smallBtnW&&y>=smallBtnY&&y<=smallBtnY+smallBtnH) {
            screen = SCREEN.ACHIEVEMENTS;
            return;
        }
        return;
    }
    if(screen===SCREEN.SETTINGS) {
        // Check toggles
        const startY = 100;
        const lineH = 50;
        const toggles = ['autoRemoveNotes','highlightConflicts','showCageSums'];
        for(let i=0;i<toggles.length;i++) {
            const y2 = startY + i*lineH;
            if(x>=W*0.1&&x<=W*0.9&&y>=y2&&y<=y2+lineH-8) {
                if(toggles[i]==='autoRemoveNotes') autoRemoveNotes=!autoRemoveNotes;
                else if(toggles[i]==='highlightConflicts') highlightConflicts=!highlightConflicts;
                else if(toggles[i]==='showCageSums') showCageSums=!showCageSums;
                return;
            }
        }
        // Check theme selector
        const themeY = startY + toggles.length*lineH + 10;
        const themeW = Math.min(100, W*0.22);
        const themes = ['pastel','neon','ocean'];
        for(let i=0;i<3;i++) {
            const tx = W/2 - (3*themeW+20)/2 + i*(themeW+10);
            if(x>=tx&&x<=tx+themeW&&y>=themeY+10&&y<=themeY+46) {
                currentTheme = themes[i];
                return;
            }
        }
        // Back button
        if(x>=W/2-80&&x<=W/2+80&&y>=H-80&&y<=H-36) {
            screen = SCREEN.MENU;
            return;
        }
        return;
    }
    if(screen===SCREEN.ACHIEVEMENTS) {
        // Back button
        if(x>=W/2-80&&x<=W/2+80&&y>=H-70&&y<=H-26) {
            screen = SCREEN.MENU;
            return;
        }
        return;
    }
    if(screen===SCREEN.GAMEOVER) {
        // Check restart
        const btnW = 180, btnH = 48;
        if(x>=W/2-btnW/2&&x<=W/2+btnW/2&&y>=H/2+100&&y<=H/2+100+btnH) {
            document.getElementById('startScreen').style.display = 'flex';
            screen = SCREEN.MENU;
            return;
        }
        return;
    }
    if(paused) return;

    // Check number buttons
    const numBtn = getNumBtn(x,y);
    if(numBtn !== null) {
        if(numBtn === 'note') {
            noteMode = !noteMode;
            return;
        }
        if(numBtn === 'hint') {
            useHint();
            return;
        }
        if(numBtn === 'undo') {
            undo();
            return;
        }
        if(selected && puzzle[selected.r][selected.c]===0) {
            placeNumber(selected.r, selected.c, numBtn);
        }
        return;
    }

    // Check grid click
    const cell = getCell(x,y);
    if(cell) {
        selected = cell;
    }
}

function placeNumber(r,c,n) {
    // Save undo state
    undoStack.push({r,c,prev:player[r][c],prevNotes:[...notes[r][c]]});

    if(noteMode && n!==0) {
        // Toggle note
        notes[r][c][n-1] = !notes[r][c][n-1];
        if(player[r][c]!==0) {
            player[r][c] = 0;
        }
        return;
    }

    // Place number
    if(n === player[r][c]) return; // Same number, do nothing

    const old = player[r][c];
    player[r][c] = n;
    notes[r][c] = Array(9).fill(false);

    // Clear notes for this number in same row/col/box
    if(n!==0) {
        for(let i=0;i<9;i++) {
            notes[r][i][n-1] = false;
            notes[i][c][n-1] = false;
        }
        const br=Math.floor(r/3)*3, bc=Math.floor(c/3)*3;
        for(let i=br;i<br+3;i++) for(let j=bc;j<bc+3;j++) notes[i][j][n-1]=false;
    }

    // Check if correct
    if(n!==0 && n!==board[r][c]) {
        mistakes++;
        comboCount = 0;
        animCells.push({r,c,color:'#ff3333',alpha:1,decay:0.02});
        // Shake effect via particles
        for(let i=0;i<8;i++) {
            particles.push({x:gridX+c*cellSize+cellSize/2, y:gridY+r*cellSize+cellSize/2, vx:(Math.random()-0.5)*5, vy:(Math.random()-0.5)*5, life:25, color:'#ff3333', size:3});
        }
        if(mistakes >= maxMistakes) {
            timer = Date.now()-timerStart;
            score = calcScore();
            historyStats.totalTime += timer;
            saveAchievements();
            screen = SCREEN.GAMEOVER;
            showComplete = false;
        }
        return;
    }

    if(n!==0) {
        updateCombo();
        spawnPlaceParticles(r,c);
        // Auto-remove notes for this number in same row/col/box if enabled
        if(autoRemoveNotes) {
            for(let i=0;i<9;i++) {
                notes[r][i][n-1] = false;
                notes[i][c][n-1] = false;
            }
            const br2=Math.floor(r/3)*3, bc2=Math.floor(c/3)*3;
            for(let i=br2;i<br2+3;i++) for(let j=bc2;j<bc2+3;j++) notes[i][j][n-1]=false;
        }
        checkCompletion();
    }
}

function useHint() {
    if(hintCount >= maxHints || !selected) return;
    if(puzzle[selected.r][selected.c]!==0) return;
    if(player[selected.r][selected.c] === board[selected.r][selected.c]) return;

    undoStack.push({r:selected.r,c:selected.c,prev:player[selected.r][selected.c],prevNotes:[...notes[selected.r][selected.c]]});
    player[selected.r][selected.c] = board[selected.r][selected.c];
    notes[selected.r][selected.c] = Array(9).fill(false);
    hintCount++;
    spawnPlaceParticles(selected.r, selected.c);
    animCells.push({r:selected.r,c:selected.c,color:'#66ffaa',alpha:0.9,decay:0.012});
    checkCompletion();
}

function undo() {
    if(undoStack.length===0) return;
    const s = undoStack.pop();
    player[s.r][s.c] = s.prev;
    notes[s.r][s.c] = s.prevNotes;
}

function handleKeyDown(e) {
    if(screen!==SCREEN.PLAYING || paused) return;
    const key = e.key;
    if(key>='1'&&key<='9'&&selected) {
        placeNumber(selected.r, selected.c, parseInt(key));
        e.preventDefault();
    }
    if((key==='Backspace'||key==='Delete'||key==='0')&&selected) {
        placeNumber(selected.r, selected.c, 0);
        e.preventDefault();
    }
    if(key==='n'||key==='N') noteMode=!noteMode;
    if(key==='h'||key==='H') useHint();
    if(key==='z'&&e.ctrlKey) {undo();e.preventDefault();}
    if(key==='ArrowUp'&&selected) {selected={r:Math.max(0,selected.r-1),c:selected.c};e.preventDefault();}
    if(key==='ArrowDown'&&selected) {selected={r:Math.min(8,selected.r+1),c:selected.c};e.preventDefault();}
    if(key==='ArrowLeft'&&selected) {selected={r:selected.r,c:Math.max(0,selected.c-1)};e.preventDefault();}
    if(key==='ArrowRight'&&selected) {selected={r:selected.r,c:Math.min(8,selected.c+1)};e.preventDefault();}
}

// ==================== Resize ====================
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    c.width = W;
    c.height = H;

    // Calculate grid size
    const maxGridH = H - 200; // Leave room for UI below
    const maxGridW = W - 20;
    gridPx = Math.min(maxGridW, maxGridH, 500);
    cellSize = gridPx / 9;
    gridX = (W - gridPx) / 2;
    gridY = 60; // Top margin
}

// ==================== Render ====================
function render() {
    // Background gradient
    const grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0, COLORS.gradTop);
    grad.addColorStop(1, COLORS.gradBot);
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);

    // Background stars
    renderStars();

    if(screen===SCREEN.MENU) {
        renderMenu();
        // Achievement notification overlay
        if(achievementNotif && achievementNotifTimer > 0) {
            renderAchievementNotif();
        }
        return;
    }

    if(screen===SCREEN.SETTINGS) {
        renderSettings();
        return;
    }

    if(screen===SCREEN.ACHIEVEMENTS) {
        renderAchievementsScreen();
        return;
    }

    // HUD
    renderHUD();

    // Grid
    renderGrid();

    // Animations
    renderAnimCells();

    // Particles
    renderParticles();

    // Number buttons
    renderNumBtns();

    // Hint glow
    if(showHintGlow && hintGlowCell) {
        hintGlowTimer--;
        const alpha = 0.3 + 0.2*Math.sin(hintGlowTimer*0.1);
        ctx.fillStyle = `rgba(102,255,170,${alpha})`;
        ctx.fillRect(gridX+hintGlowCell.c*cellSize, gridY+hintGlowCell.r*cellSize, cellSize, cellSize);
        if(hintGlowTimer <= 0) showHintGlow = false;
    }

    // Game over
    if(screen===SCREEN.GAMEOVER) {
        renderGameOver();
    }

    // Achievement notification overlay
    if(achievementNotif && achievementNotifTimer > 0) {
        renderAchievementNotif();
    }
}

function renderAchievementNotif() {
    achievementNotifTimer--;
    const alpha = Math.min(1, achievementNotifTimer/30);
    const slideY = achievementNotifTimer > 150 ? (180-achievementNotifTimer)*3 : 0;

    ctx.fillStyle = `rgba(0,0,0,${alpha*0.7})`;
    ctx.fillRect(0, 0, W, H);

    const boxW = Math.min(300, W*0.8);
    const boxH = 80;
    const boxX = W/2-boxW/2;
    const boxY = 60+slideY;

    ctx.fillStyle = `rgba(30,20,50,${alpha*0.95})`;
    ctx.strokeStyle = `rgba(255,215,0,${alpha*0.6})`;
    ctx.lineWidth = 2;
    roundRect(boxX, boxY, boxW, boxH, 12);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = `rgba(255,215,0,${alpha})`;
    ctx.font = `bold ${Math.min(22,W*0.05)}px "Microsoft YaHei",sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('成就解锁!', W/2, boxY+28);

    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.font = `${Math.min(14,W*0.032)}px "Microsoft YaHei",sans-serif`;
    ctx.fillText(`${achievementNotif.icon} ${achievementNotif.name}`, W/2, boxY+52);
    ctx.fillStyle = `rgba(180,180,200,${alpha*0.8})`;
    ctx.font = `${Math.min(12,W*0.026)}px "Microsoft YaHei",sans-serif`;
    ctx.fillText(achievementNotif.desc, W/2, boxY+70);

    if(achievementNotifTimer <= 0) achievementNotif = null;
}

function renderSettings() {
    ctx.fillStyle = '#ff6b9d';
    ctx.font = `bold ${Math.min(32,W*0.07)}px "Microsoft YaHei",sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('设置', W/2, 60);

    const startY = 100;
    const lineH = 50;
    const settings = [
        {label:'自动移除笔记', key:'autoRemoveNotes', desc:'放置数字后自动清除同行列笔记'},
        {label:'高亮冲突', key:'highlightConflicts', desc:'高亮显示有冲突的单元格'},
        {label:'显示区域和', key:'showCageSums', desc:'在左上角显示区域目标和'},
    ];

    for(let i=0;i<settings.length;i++) {
        const s = settings[i];
        const y = startY + i*lineH;
        const val = eval(s.key);

        // Toggle background
        ctx.fillStyle = val ? 'rgba(102,255,170,0.1)' : 'rgba(255,80,80,0.1)';
        ctx.strokeStyle = val ? 'rgba(102,255,170,0.3)' : 'rgba(255,80,80,0.3)';
        ctx.lineWidth = 1;
        roundRect(W*0.1, y, W*0.8, lineH-8, 8);
        ctx.fill();
        ctx.stroke();

        // Label
        ctx.fillStyle = '#ddd';
        ctx.font = `${Math.min(16,W*0.038)}px "Microsoft YaHei",sans-serif`;
        ctx.textAlign = 'left';
        ctx.fillText(s.label, W*0.15, y+22);

        // Description
        ctx.fillStyle = '#888';
        ctx.font = `${Math.min(11,W*0.025)}px "Microsoft YaHei",sans-serif`;
        ctx.fillText(s.desc, W*0.15, y+38);

        // Toggle indicator
        ctx.fillStyle = val ? '#66ffaa' : '#ff6666';
        ctx.font = `bold ${Math.min(16,W*0.038)}px "Microsoft YaHei",sans-serif`;
        ctx.textAlign = 'right';
        ctx.fillText(val ? 'ON' : 'OFF', W*0.88, y+28);
    }

    // Cage theme selector
    const themeY = startY + settings.length*lineH + 10;
    ctx.fillStyle = '#aaa';
    ctx.font = `${Math.min(14,W*0.032)}px "Microsoft YaHei",sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('区域配色', W/2, themeY);

    const themes = ['pastel','neon','ocean'];
    const themeNames = ['柔和','霓虹','海洋'];
    const themeW = Math.min(100, W*0.22);
    for(let i=0;i<3;i++) {
        const tx = W/2 - (3*themeW+20)/2 + i*(themeW+10);
        const active = currentTheme === themes[i];
        ctx.fillStyle = active ? 'rgba(255,255,255,0.15)' : 'rgba(255,255,255,0.05)';
        ctx.strokeStyle = active ? '#ff6b9d' : '#555';
        ctx.lineWidth = active ? 2 : 1;
        roundRect(tx, themeY+10, themeW, 36, 8);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = active ? '#ff6b9d' : '#888';
        ctx.font = `${Math.min(14,W*0.032)}px "Microsoft YaHei",sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText(themeNames[i], tx+themeW/2, themeY+33);
    }

    // Back button
    const backY = H - 80;
    ctx.fillStyle = 'rgba(255,107,157,0.15)';
    ctx.strokeStyle = '#ff6b9d';
    ctx.lineWidth = 2;
    roundRect(W/2-80, backY, 160, 44, 10);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.min(16,W*0.038)}px "Microsoft YaHei",sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('返回', W/2, backY+28);
}

function renderAchievementsScreen() {
    ctx.fillStyle = '#ddaa44';
    ctx.font = `bold ${Math.min(32,W*0.07)}px "Microsoft YaHei",sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('成就系统', W/2, 55);

    ctx.fillStyle = '#888';
    ctx.font = `${Math.min(13,W*0.03)}px "Microsoft YaHei",sans-serif`;
    ctx.fillText(`已解锁 ${unlockedAchievements.size}/${ACHIEVEMENTS.length}`, W/2, 80);

    const itemH = 60;

        const y = startY + i*itemH;
        const unlocked = unlockedAchievements.has(ach.id);

        ctx.fillStyle = unlocked ? 'rgba(255,215,0,0.08)' : 'rgba(255,255,255,0.03)';
        ctx.strokeStyle = unlocked ? 'rgba(255,215,0,0.3)' : 'rgba(255,255,255,0.1)';
        ctx.lineWidth = 1;
        roundRect(W*0.08, y, W*0.84, itemH-6, 8);

        ctx.stroke();

        // Icon
        ctx.fillStyle = unlocked ? '#fff' : '#555';
        ctx.font = `${Math.min(28,W*0.06)}px "Microsoft YaHei",sans-serif`;
        ctx.textAlign = 'left';
        ctx.fillText(ach.icon, W*0.12, y+32);

        // Name
        ctx.fillStyle = unlocked ? '#ffd700' : '#666';
        ctx.font = `bold ${Math.min(15,W*0.034)}px "Microsoft YaHei",sans-serif`;
        ctx.fillText(ach.name, W*0.2, y+22);

        // Description
        ctx.fillStyle = unlocked ? '#aaa' : '#555';
        ctx.font = `${Math.min(12,W*0.026)}px "Microsoft YaHei",sans-serif`;
        ctx.fillText(ach.desc, W*0.2, y+40);

        // Status
        if(unlocked) {
            ctx.fillStyle = '#66ffaa';
            ctx.font = `bold ${Math.min(13,W*0.028)}px "Microsoft YaHei",sans-serif`;
            ctx.textAlign = 'right';
            ctx.fillText('已解锁', W*0.88, y+30);
        }
    }

    // Back button
    const backY = H - 70;
    ctx.fillStyle = 'rgba(255,107,157,0.15)';
    ctx.strokeStyle = '#ff6b9d';
    ctx.lineWidth = 2;
    roundRect(W/2-80, backY, 160, 44, 10);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.min(16,W*0.038)}px "Microsoft YaHei",sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('返回', W/2, backY+28);
}

function renderMenu() {
    menuAnimT += 0.015;

    // Title with glow
    const titleSize = Math.min(52, W*0.11);
    ctx.save();
    ctx.shadowColor = '#ff6b9d';
    ctx.shadowBlur = 20 + Math.sin(menuAnimT*2)*8;
    ctx.fillStyle = '#ff6b9d';
    ctx.font = `bold ${titleSize}px "Microsoft YaHei",sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('数独杀手', W/2, H*0.2);
    ctx.restore();

    ctx.fillStyle = '#8888aa';
    ctx.font = `${Math.min(15,W*0.035)}px "Microsoft YaHei",sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('Killer Sudoku — 区域求和 × 数独逻辑', W/2, H*0.2+35);

    // Decorative grid animation
    const decoSize = Math.min(120, W*0.25);
    const decoX = W/2 - decoSize/2;
    const decoY = H*0.2+55;
    ctx.strokeStyle = 'rgba(255,107,157,0.15)';
    ctx.lineWidth = 1;
    for(let i=0;i<=3;i++) {
        const off = Math.sin(menuAnimT+i)*2;
        ctx.beginPath();
        ctx.moveTo(decoX+i*decoSize/3+off, decoY);
        ctx.lineTo(decoX+i*decoSize/3+off, decoY+decoSize);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(decoX, decoY+i*decoSize/3+off);
        ctx.lineTo(decoX+decoSize, decoY+i*decoSize/3+off);
        ctx.stroke();
    }

    // Difficulty buttons
    const btnW = Math.min(260, W*0.65);
    const btnH = 54;
    const btnsY = H*0.45;

    for(let i=0;i<3;i++) {
        const preset = DIFF_PRESETS[i];
        const bx = W/2-btnW/2;
        const by = btnsY + i*(btnH+14);
        const hoverScale = 1.0;

        // Button background
        ctx.fillStyle = preset.color+'18';
        ctx.strokeStyle = preset.color+'aa';
        ctx.lineWidth = 2;
        roundRect(bx,by,btnW,btnH,14);
        ctx.fill();
        ctx.stroke();

        // Difficulty name
        ctx.fillStyle = preset.color;
        ctx.font = `bold ${Math.min(20,W*0.048)}px "Microsoft YaHei",sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText(preset.name, W/2, by+btnH/2-4);

        // Description
        ctx.fillStyle = '#888';
        ctx.font = `${Math.min(12,W*0.028)}px "Microsoft YaHei",sans-serif`;
        ctx.fillText(preset.desc + ' | ' + preset.rules, W/2, by+btnH/2+16);
    }

    // Bottom section: Stats & High scores
    const bottomY = btnsY + 3*(btnH+14) + 20;

    // High scores
    ctx.fillStyle = '#555';
    ctx.font = `${Math.min(12,W*0.028)}px "Microsoft YaHei",sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('最高分记录', W/2, bottomY);

    for(let i=0;i<3;i++) {
        const key = 'diff'+i;
        const s = highScores[key]||0;
        const bestT = historyStats.bestTimes[i];
        ctx.fillStyle = DIFF_PRESETS[i].color+'88';
        let timeStr = bestT ? `${Math.floor(bestT/60000)}:${String(Math.floor((bestT%60000)/1000)).padStart(2,'0')}` : '--:--';
        ctx.fillText(`${DIFF_PRESETS[i].name}: ${s}分 | 最佳: ${timeStr}`, W/2, bottomY+18+i*18);
    }

    // Stats
    const statsY = bottomY + 70;
    ctx.fillStyle = '#555';
    ctx.fillText(`总游戏: ${historyStats.gamesPlayed} | 胜利: ${historyStats.gamesWon}`, W/2, statsY);

    // Settings & Achievements buttons
    const smallBtnW = Math.min(120, W*0.25);
    const smallBtnH = 36;
    const smallBtnY = statsY + 20;

    // Settings button
    ctx.fillStyle = 'rgba(100,100,200,0.12)';
    ctx.strokeStyle = 'rgba(100,100,200,0.4)';
    ctx.lineWidth = 1;
    roundRect(W/2-smallBtnW-10, smallBtnY, smallBtnW, smallBtnH, 8);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#8888cc';
    ctx.font = `${Math.min(13,W*0.03)}px "Microsoft YaHei",sans-serif`;
    ctx.fillText('设置', W/2-smallBtnW/2-10, smallBtnY+smallBtnH/2+4);

    // Achievements button
    ctx.fillStyle = 'rgba(255,215,0,0.12)';
    ctx.strokeStyle = 'rgba(255,215,0,0.4)';
    ctx.lineWidth = 1;
    roundRect(W/2+10, smallBtnY, smallBtnW, smallBtnH, 8);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#ddaa44';
    ctx.fillText('成就', W/2+smallBtnW/2+10, smallBtnY+smallBtnH/2+4);

    // Achievements notif badge
    if(unlockedAchievements.size > 0) {
        ctx.fillStyle = '#ff6b9d';
        ctx.beginPath();
        ctx.arc(W/2+10+smallBtnW-8, smallBtnY+8, 8, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = `bold 10px sans-serif`;
        ctx.fillText(unlockedAchievements.size, W/2+10+smallBtnW-8, smallBtnY+12);
    }
}

function renderHUD() {
    // Top bar background
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(0,0,W,52);

    // Timer
    const elapsed = screen===SCREEN.GAMEOVER ? timer : Date.now()-timerStart;
    const mins = Math.floor(elapsed/60000);
    const secs = Math.floor((elapsed%60000)/1000);

    ctx.fillStyle = '#8888cc';
    ctx.font = `${Math.min(15,W*0.035)}px "Microsoft YaHei",sans-serif`;
    ctx.textAlign = 'left';
    ctx.fillText(`${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`, 15, 22);

    // Mistakes with hearts
    ctx.textAlign = 'center';
    let heartsStr = '';
    for(let i=0;i<maxMistakes;i++) {
        heartsStr += i<mistakes ? '♡' : '♥';
    }
    ctx.fillStyle = mistakes>=maxMistakes-1?'#ff4444':'#ff6b9d';
    ctx.font = `${Math.min(16,W*0.038)}px "Microsoft YaHei",sans-serif`;
    ctx.fillText(heartsStr, W/2, 22);

    // Score
    ctx.fillStyle = '#66ddff';
    ctx.textAlign = 'right';
    ctx.font = `${Math.min(15,W*0.035)}px "Microsoft YaHei",sans-serif`;
    ctx.fillText(`${calcScore()}`, W-15, 22);

    // Second row: Mode indicators
    ctx.font = `${Math.min(12,W*0.028)}px "Microsoft YaHei",sans-serif`;

    // Note mode
    if(noteMode) {
        ctx.fillStyle = '#ffdd66';
        ctx.textAlign = 'left';
        ctx.fillText('笔记', 15, 42);
    }

    // Hints
    ctx.fillStyle = '#66ffaa';
    ctx.textAlign = 'left';
    const hintX = noteMode ? 50 : 15;
    ctx.fillText(`提示:${maxHints-hintCount}`, hintX, 42);

    // Combo indicator
    if(comboTimer > 0 && comboCount > 1) {
        comboTimer--;
        ctx.fillStyle = `rgba(255,221,102,${Math.min(1,comboTimer/60)})`;
        ctx.textAlign = 'right';
        ctx.font = `bold ${Math.min(18,W*0.04)}px "Microsoft YaHei",sans-serif`;
        ctx.fillText(`${comboCount}连击!`, W-15, 42);
    }

    // Difficulty badge
    if(selectedPreset) {
        ctx.fillStyle = selectedPreset.color+'44';
        ctx.strokeStyle = selectedPreset.color+'88';
        ctx.lineWidth = 1;
        roundRect(W/2-30, 32, 60, 16, 4);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = selectedPreset.color;
        ctx.font = `bold ${Math.min(11,W*0.025)}px "Microsoft YaHei",sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText(selectedPreset.name, W/2, 44);
    }
}

function renderGrid() {
    // Draw cage backgrounds first
    const cageColors = [
        'rgba(255,107,157,0.08)', 'rgba(187,136,255,0.08)', 'rgba(102,221,255,0.08)',
        'rgba(255,221,102,0.08)', 'rgba(102,255,170,0.08)', 'rgba(255,170,102,0.08)',
        'rgba(170,102,255,0.08)', 'rgba(102,255,255,0.08)', 'rgba(255,102,170,0.08)'
    ];
    for(let i=0;i<cages.length;i++) {
        const cage = cages[i];
        ctx.fillStyle = cageColors[i%cageColors.length];
        for(const [r,c] of cage.cells) {
            ctx.fillRect(gridX+c*cellSize, gridY+r*cellSize, cellSize, cellSize);
        }
    }

    // Draw cells
    for(let r=0;r<9;r++) for(let c=0;c<9;c++) {
        const x = gridX+c*cellSize;
        const y = gridY+r*cellSize;

        // Selected highlight
        if(selected && selected.r===r && selected.c===c) {
            ctx.fillStyle = COLORS.cellSelect;
            ctx.fillRect(x,y,cellSize,cellSize);
        } else if(selected && (selected.r===r || selected.c===c)) {
            ctx.fillStyle = 'rgba(100,80,200,0.08)';
            ctx.fillRect(x,y,cellSize,cellSize);
        } else if(selected && Math.floor(selected.r/3)===Math.floor(r/3) && Math.floor(selected.c/3)===Math.floor(c/3)) {
            ctx.fillStyle = 'rgba(100,80,200,0.05)';
            ctx.fillRect(x,y,cellSize,cellSize);
        }

        // Hover
        if(hover && hover.r===r && hover.c===c && !selected) {
            ctx.fillStyle = COLORS.cellHover;
            ctx.fillRect(x,y,cellSize,cellSize);
        }

        // Error flash
        if(player[r][c]!==0 && puzzle[r][c]===0 && player[r][c]!==board[r][c]) {
            ctx.fillStyle = 'rgba(255,50,50,0.15)';
            ctx.fillRect(x,y,cellSize,cellSize);
        }

        // Numbers
        if(player[r][c]!==0) {
            if(puzzle[r][c]!==0) {
                // Given number
                ctx.fillStyle = COLORS.numGiven;
                ctx.font = `bold ${cellSize*0.55}px "Microsoft YaHei",sans-serif`;
            } else if(player[r][c]!==board[r][c]) {
                ctx.fillStyle = '#ff4444';
                ctx.font = `${cellSize*0.5}px "Microsoft YaHei",sans-serif`;
            } else {
                ctx.fillStyle = COLORS.num;
                ctx.font = `${cellSize*0.5}px "Microsoft YaHei",sans-serif`;
            }
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(player[r][c], x+cellSize/2, y+cellSize/2+1);
        } else {
            // Notes
            const n = notes[r][c];
            let hasNotes = false;
            for(let k=0;k<9;k++) if(n[k]) {hasNotes=true;break;}
            if(hasNotes) {
                ctx.fillStyle = COLORS.numNote;
                ctx.font = `${cellSize*0.22}px "Microsoft YaHei",sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                for(let k=0;k<9;k++) {
                    if(n[k]) {
                        const nr = Math.floor(k/3);
                        const nc = k%3;
                        const nx = x + (nc+0.5)*cellSize/1.5 + cellSize*0.17;
                        const ny = y + (nr+0.5)*cellSize/1.5 + cellSize*0.17;
                        ctx.fillText(k+1, nx, ny);
                    }
                }
            }
        }
    }

    // Draw cage sum labels
    if(showCageSums) {
        ctx.font = `bold ${cellSize*0.2}px "Microsoft YaHei",sans-serif`;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        for(const cage of cages) {
            if(cage.cells.length===0) continue;
            // Find top-left cell of cage
            let minR=9,minC=9;
            for(const [r,c] of cage.cells) {
                if(r<minR||(r===minR&&c<minC)) {minR=r;minC=c;}
            }
            const cx = gridX+minC*cellSize+2;
            const cy = gridY+minR*cellSize+2;
            ctx.fillStyle = 'rgba(187,136,255,0.7)';
            ctx.fillText(cage.sum, cx, cy);
        }
    }

    // Conflict highlighting
    if(highlightConflicts && selected) {
        const sv = player[selected.r][selected.c];
        if(sv !== 0) {
            for(let r=0;r<9;r++) for(let c=0;c<9;c++) {
                if(r===selected.r && c===selected.c) continue;
                if(player[r][c] === sv) {
                    // Same row, col, or box?
                    const sameRow = r===selected.r;
                    const sameCol = c===selected.c;
                    const sameBox = Math.floor(r/3)===Math.floor(selected.r/3) && Math.floor(c/3)===Math.floor(selected.c/3);
                    if(sameRow || sameCol || sameBox) {
                        ctx.fillStyle = 'rgba(255,50,50,0.12)';
                        ctx.fillRect(gridX+c*cellSize, gridY+r*cellSize, cellSize, cellSize);
                        ctx.strokeStyle = 'rgba(255,50,50,0.3)';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(gridX+c*cellSize+1, gridY+r*cellSize+1, cellSize-2, cellSize-2);
                    }
                }
            }
        }
    }

    // Draw grid lines
    ctx.strokeStyle = COLORS.grid;
    ctx.lineWidth = 0.5;
    for(let i=0;i<=9;i++) {
        ctx.beginPath();
        ctx.moveTo(gridX+i*cellSize, gridY);
        ctx.lineTo(gridX+i*cellSize, gridY+gridPx);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(gridX, gridY+i*cellSize);
        ctx.lineTo(gridX+gridPx, gridY+i*cellSize);
        ctx.stroke();
    }
    // Bold 3x3 lines
    ctx.strokeStyle = COLORS.gridBold;
    ctx.lineWidth = 2;
    for(let i=0;i<=3;i++) {
        ctx.beginPath();
        ctx.moveTo(gridX+i*cellSize*3, gridY);
        ctx.lineTo(gridX+i*cellSize*3, gridY+gridPx);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(gridX, gridY+i*cellSize*3);
        ctx.lineTo(gridX+gridPx, gridY+i*cellSize*3);
        ctx.stroke();
    }
    // Outer border
    ctx.strokeStyle = '#6a6a9a';
    ctx.lineWidth = 3;
    ctx.strokeRect(gridX, gridY, gridPx, gridPx);
}

function renderAnimCells() {
    for(let i=animCells.length-1;i>=0;i--) {
        const a = animCells[i];
        ctx.fillStyle = a.color + Math.floor(a.alpha*255).toString(16).padStart(2,'0');
        ctx.fillRect(gridX+a.c*cellSize, gridY+a.r*cellSize, cellSize, cellSize);
        a.alpha -= a.decay;
        if(a.alpha<=0) animCells.splice(i,1);
    }
}

function renderParticles() {
    for(let i=particles.length-1;i>=0;i--) {
        const p = particles[i];
        ctx.fillStyle = p.color + Math.floor((p.life/120)*255).toString(16).padStart(2,'0');
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size*(p.life/120), 0, Math.PI*2);
        ctx.fill();
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.05;
        p.life--;
        if(p.life<=0) particles.splice(i,1);
    }
}

function renderNumBtns() {
    const btnY = gridY + gridPx + 15;
    const btnSize = Math.min(cellSize*0.9, (W-40)/11);
    const startX = (W - btnSize*10.5)/2;

    for(let i=0;i<10;i++) {
        const bx = startX + i*(btnSize+btnSize*0.05);
        ctx.fillStyle = i===0?'rgba(255,80,80,0.15)':'rgba(100,100,200,0.12)';
        ctx.strokeStyle = i===0?'rgba(255,80,80,0.4)':'rgba(100,100,200,0.3)';
        ctx.lineWidth = 1;
        roundRect(bx,btnY,btnSize,btnSize,8);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = i===0?'#ff6666':'#ccccee';
        ctx.font = `bold ${btnSize*0.5}px "Microsoft YaHei",sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(i===0?'✕':i, bx+btnSize/2, btnY+btnSize/2);
    }

    // Note / Hint / Undo buttons
    const toolY = btnY + btnSize + 10;
    const toolH = btnSize*0.7;
    const labels = ['📝 笔记','💡 提示','↩ 撤销'];
    const colors = [noteMode?'#ffdd66':'#888','#66ffaa','#88aaff'];
    const widths = [2,2,2];

    let tx = startX;
    for(let i=0;i<3;i++) {
        const tw = btnSize*widths[i]+(widths[i]-1)*btnSize*0.05;
        ctx.fillStyle = colors[i]+'22';
        ctx.strokeStyle = colors[i]+'66';
        ctx.lineWidth = 1;
        roundRect(tx,toolY,tw,toolH,6);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = colors[i];
        ctx.font = `bold ${Math.min(14,toolH*0.5)}px "Microsoft YaHei",sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(labels[i], tx+tw/2, toolY+toolH/2);
        tx += tw + btnSize*0.15;
    }
}

function renderGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(0,0,W,H);

    ctx.textAlign = 'center';
    if(showComplete) {
        ctx.fillStyle = '#66ffaa';
        ctx.font = `bold ${Math.min(42,W*0.1)}px "Microsoft YaHei",sans-serif`;
        ctx.fillText('恭喜通关!', W/2, H/2-60);
    } else {
        ctx.fillStyle = '#ff4444';
        ctx.font = `bold ${Math.min(42,W*0.1)}px "Microsoft YaHei",sans-serif`;
        ctx.fillText('游戏结束', W/2, H/2-60);
    }

    ctx.fillStyle = '#ddd';
    ctx.font = `${Math.min(18,W*0.045)}px "Microsoft YaHei",sans-serif`;
    const elapsed = timer;
    const mins = Math.floor(elapsed/60000);
    const secs = Math.floor((elapsed%60000)/1000);
    ctx.fillText(`用时: ${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`, W/2, H/2-15);
    ctx.fillText(`得分: ${score}`, W/2, H/2+15);
    ctx.fillText(`错误: ${mistakes}/${maxMistakes}`, W/2, H/2+45);

    // High score
    const key = 'diff'+difficulty;
    if(score===(highScores[key]||0) && score>0) {
        ctx.fillStyle = '#ffdd66';
        ctx.font = `bold ${Math.min(16,W*0.04)}px "Microsoft YaHei",sans-serif`;
        ctx.fillText('新纪录!', W/2, H/2+75);
    }

    // Restart button
    const btnW=180, btnH=48;
    ctx.fillStyle = 'rgba(255,107,157,0.15)';
    ctx.strokeStyle = '#ff6b9d';
    ctx.lineWidth = 2;
    roundRect(W/2-btnW/2, H/2+100, btnW, btnH, 12);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.min(18,W*0.045)}px "Microsoft YaHei",sans-serif`;
    ctx.fillText('返回菜单', W/2, H/2+124);
}

function roundRect(x,y,w,h,r) {
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
}

// ==================== Game Loop ====================
function gameLoop() {
    render();
    requestAnimationFrame(gameLoop);
}

// ==================== Init ====================
function init() {
    resize();
    initStars();
    window.addEventListener('resize', () => { resize(); initStars(); });
    c.addEventListener('click', handleClick);
    c.addEventListener('mousemove', handleMove);
    c.addEventListener('touchstart', handleTouch, {passive:false});
    document.addEventListener('keydown', handleKeyDown);
    loadHighScores();
    loadAchievements();
    initAdSystem();

    // Pause button
    document.getElementById('pauseBtn').addEventListener('click', () => {
        paused = true;
        document.getElementById('pauseScreen').style.display = 'flex';
    });
    document.getElementById('resumeBtn').addEventListener('click', () => {
        paused = false;
        document.getElementById('pauseScreen').style.display = 'none';
    });
    document.getElementById('restartBtn').addEventListener('click', () => {
        paused = false;
        document.getElementById('pauseScreen').style.display = 'none';
        document.getElementById('startScreen').style.display = 'flex';
        screen = SCREEN.MENU;
    });

    gameLoop();
}

init();
})();
</script>
