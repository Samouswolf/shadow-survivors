<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>水族馆馆长</title>
<script src="../game_core.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: linear-gradient(180deg, #001830 0%, #003355 60%, #001830 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; font-family: "Microsoft YaHei", sans-serif; }
#wrap { position: relative; }
canvas { border: 3px solid #2dd4bf; border-radius: 16px; box-shadow: 0 0 40px rgba(45,212,191,0.3), inset 0 0 60px rgba(0,100,150,0.3); display: block; max-width: 100%; height: auto; cursor: pointer; }
#startScreen { position: fixed; inset: 0; background: rgba(0,15,35,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
#startScreen h1 { font-size: 52px; color: #2dd4bf; margin-bottom: 14px; text-shadow: 0 0 20px rgba(45,212,191,0.5); }
#startScreen .sub { color: #94e8e0; font-size: 17px; margin-bottom: 30px; }
.fish-row { display: flex; gap: 14px; margin-bottom: 28px; flex-wrap: wrap; justify-content: center; padding: 0 18px; }
.fc { background: rgba(45,212,191,0.08); border: 2px solid #0e7490; border-radius: 14px; padding: 16px 12px; text-align: center; width: 120px; cursor: pointer; transition: 0.25s; }
.fc:hover { background: rgba(45,212,191,0.2); transform: translateY(-3px); }
.fc.selected { border-color: #2dd4bf; box-shadow: 0 0 16px rgba(45,212,191,0.6); background: rgba(45,212,191,0.15); }
.fc-emoji { font-size: 44px; margin-bottom: 4px; }
.fc-name { color: #fff; font-weight: bold; font-size: 14px; margin-bottom: 3px; }
.fc-desc { color: #67e8f9; font-size: 11px; }
#start-game-btn { padding: 14px 52px; font-size: 20px; background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%); color: #fff; border: none; border-radius: 28px; font-weight: bold; cursor: pointer; box-shadow: 0 5px 20px rgba(6,182,212,0.4); }
.help { color: #94e8e0; font-size: 12px; line-height: 1.8; margin-top: 22px; max-width: 420px; text-align: center; background: rgba(0,0,0,0.25); padding: 12px 18px; border-radius: 10px; }
#fishBook { position: fixed; inset: 0; background: rgba(0,15,35,0.96); z-index: 500; display: none; flex-direction: column; align-items: center; padding: 20px; overflow-y: auto; }
#fishBook h2 { color: #2dd4bf; font-size: 32px; margin: 14px 0 18px; }
.fb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; max-width: 640px; width: 100%; padding: 8px; }
.fb { background: rgba(45,212,191,0.06); border: 2px solid rgba(14,116,144,0.4); border-radius: 12px; padding: 12px 8px; text-align: center; }
.fb.locked { opacity: 0.35; filter: grayscale(80%); }
.fb.unlocked { border-color: #0e7490; }
.fb-e { font-size: 38px; margin-bottom: 3px; }
.fb-n { color: #fff; font-size: 13px; font-weight: bold; }
.fb-s { color: #67e8f9; font-size: 10px; margin-top: 2px; }
.cb { margin-top: 20px; padding: 10px 28px; background: #0891b2; color: #fff; border: none; border-radius: 18px; cursor: pointer; font-size: 15px; font-weight: bold; }
/* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */
/* [BATCH-FIX:ad-components-css] */
.sponsor-btn{position:fixed;bottom:8px;left:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:2px 6px;border-radius:10px;font:10px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.sponsor-panel.show{display:flex}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.interstitial-ad.show{display:flex}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* [/BATCH-FIX:ad-components-css] */

/* [AD-FIX:responsive] */
@media (max-width:768px){.ad-banner-container{display:none!important}.sponsor-btn{transform:scale(.8);opacity:.6}}
/* [/AD-FIX:responsive] */
</style>
</head>
<body>
<div id="wrap">
  <canvas id="gameCanvas" width="900" height="640"></canvas>
</div>
<div id="startScreen">
  <h1>🐠 水族馆馆长 🐡</h1>
  <div class="sub">饲养各类鱼类，打造梦幻水族馆，收集图鉴！</div>
  <div class="fish-row" id="fishSelect">
    <div class="fc selected" data-f="0"><div class="fc-emoji">🐟</div><div class="fc-name">金鱼</div><div class="fc-desc">入门首选</div></div>
    <div class="fc" data-f="1"><div class="fc-emoji">🐠</div><div class="fc-name">热带鱼</div><div class="fc-desc">色彩缤纷</div></div>
    <div class="fc" data-f="2"><div class="fc-emoji">🐡</div><div class="fc-name">河豚</div><div class="fc-desc">圆滚滚</div></div>
    <div class="fc" data-f="3"><div class="fc-emoji">🦈</div><div class="fc-name">鲨鱼</div><div class="fc-desc">霸气王者</div></div>
  </div>
  <button id="start-game-btn">开馆！</button>
  <div class="help">
    🎮 操作：鼠标/触屏点击喂食与操作<br>
    🥫 投喂饲料保持鱼儿饱食 ｜ 💧 换水保持水质<br>
    🎨 装饰水族箱 ｜ 💰 出售小鱼获得金币<br>
    ⌨️ 1-6: 快捷操作 ｜ C: 图鉴 ｜ ESC: 菜单
  </div>
</div>
<div id="fishBook">
  <h2>📖 海洋图鉴</h2>
  <div class="fb-grid" id="fbGrid"></div>
  <button class="cb" id="closeFB">关闭图鉴</button>
</div>

<script>
const STATE_MENU = 0;
const STATE_AQUARIUM = 1;
const STATE_SHOP = 2;
const STATE_COLLECTION = 3;

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = 900, H = 640;

if (!ctx.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r) {
    r = Math.min(r, w/2, h/2);
    this.beginPath();
    this.moveTo(x+r,y); this.arcTo(x+w,y,x+w,y+h,r);
    this.arcTo(x+w,y+h,x,y+h,r); this.arcTo(x,y+h,x,y,r);
    this.arcTo(x,y,x+w,y,r); this.closePath();
  };
}

const audioCtx = new (window.AudioContext||window.webkitAudioContext)();
function sfx(f,d,t,v) {
  try {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = t||'sine'; o.frequency.value = f;
    g.gain.setValueAtTime((v||0.06), audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+d);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+d);
  } catch(e){}
}

const FISH_TYPES = [
  { n:'金鱼', e:'🐟', c1:'#ffa500', c2:'#ff6347', sp:1.2, sz:1.0, pr:0, hp:100, fd:3, hb:1, val:15, desc:'常见淡水鱼' },
  { n:'热带鱼', e:'🐠', c1:'#00ced1', c2:'#ff69b4', sp:1.8, sz:0.9, pr:0, hp:100, fd:3, hb:1, val:20, desc:'色彩艳丽' },
  { n:'河豚', e:'🐡', c1:'#f5deb3', c2:'#daa520', sp:0.8, sz:1.1, pr:0, hp:100, fd:4, hb:0.8, val:30, desc:'受惊膨胀' },
  { n:'鲨鱼', e:'🦈', c1:'#708090', c2:'#4682b4', sp:2.2, sz:1.8, pr:80, hp:150, fd:8, hb:0.6, val:120, desc:'海洋霸主' },
  { n:'小丑鱼', e:'🐠', c1:'#ff4500', c2:'#ffd700', sp:1.6, sz:0.8, pr:50, hp:90, fd:2, hb:1.1, val:40, desc:'海葵小伙伴' },
  { n:'水母', e:'🪼', c1:'#e6e6fa', c2:'#dda0dd', sp:0.6, sz:1.0, pr:100, hp:70, fd:1, hb:0.9, val:65, desc:'梦幻透明' },
  { n:'海龟', e:'🐢', c1:'#2e8b57', c2:'#8b4513', sp:0.5, sz:1.4, pr:150, hp:200, fd:5, hb:0.5, val:180, desc:'长寿吉祥' },
  { n:'章鱼', e:'🐙', c1:'#8b008b', c2:'#9932cc', sp:1.0, sz:1.2, pr:200, hp:120, fd:6, hb:0.8, val:160, desc:'聪明八爪' },
  { n:'鲸鱼', e:'🐋', c1:'#4682b4', c2:'#1e3a5f', sp:0.9, sz:2.4, pr:500, hp:300, fd:15, hb:0.4, val:600, desc:'海洋巨人' },
  { n:'螃蟹', e:'🦀', c1:'#ff4500', c2:'#b22222', sp:0.7, sz:0.9, pr:60, hp:110, fd:3, hb:0.6, val:45, desc:'横行霸道' },
  { n:'海马', e:'🐴', c1:'#ffa07a', c2:'#ff7f50', sp:0.8, sz:0.8, pr:90, hp:80, fd:2, hb:1.0, val:60, desc:'优雅直立' },
  { n:'龙虾', e:'🦞', c1:'#dc143c', c2:'#8b0000', sp:0.9, sz:1.0, pr:130, hp:140, fd:5, hb:0.7, val:150, desc:'威武铠甲' },
  { n:'海豚', e:'🐬', c1:'#87ceeb', c2:'#4169e1', sp:2.0, sz:1.6, pr:320, hp:180, fd:10, hb:1.0, val:380, desc:'聪明友善' },
  { n:'魔鬼鱼', e:'🦂', c1:'#2f4f4f', c2:'#000000', sp:1.4, sz:1.5, pr:240, hp:160, fd:7, hb:0.7, val:280, desc:'优雅飞行' },
  { n:'灯笼鱼', e:'🐟', c1:'#1a1a2e', c2:'#ffa500', sp:1.0, sz:0.9, pr:180, hp:100, fd:4, hb:0.9, val:140, desc:'深海发光' },
];

const FOODS = [
  { n:'普通鱼食', e:'🫘', p:2, s:10, hb:0.8 },
  { n:'高级鱼食', e:'🫧', p:5, s:25, hb:1.0 },
  { n:'活虾饵料', e:'🦐', p:10, s:45, hb:1.2 },
  { n:'海藻片', e:'🌿', p:6, s:15, wq:5 },
];

const DECORATIONS = [
  { id:'coral1', n:'红珊瑚', e:'🪸', p:30 },
  { id:'coral2', n:'蓝珊瑚', e:'🪸', p:40 },
  { id:'rock', n:'假山石', e:'🪨', p:20 },
  { id:'plant', n:'水草', e:'🌿', p:15 },
  { id:'castle', n:'小城堡', e:'🏰', p:80 },
  { id:'treasure', n:'宝箱', e:'💎', p:100 },
  { id:'shell', n:'贝壳堆', e:'🐚', p:25 },
  { id:'anchor', n:'船锚', e:'⚓', p:60 },
];

let gameState = STATE_MENU;
let selFish = 0;
let G = {};

function initGame(fi) {
  const f = FISH_TYPES[fi];
  G = {
    fishes: [{
      typeIdx: fi,
      x: W/2 + (Math.random()-0.5)*200,
      y: 250 + Math.random()*200,
      vx: (Math.random()<0.5?-1:1)*f.sp,
      vy: (Math.random()-0.5)*f.sp*0.5,
      size: f.sz,
      hp: f.hp, maxHp: f.hp,
      hunger: 85, clean: 85, happy: 80,
      age: 0, stage: 0,
      angle: 0, turnT: 0,
      bob: Math.random()*10,
      flashT: 0,
      breedingReady: false,
      id: Math.random().toString(36).slice(2),
    }],
    foods: [],
    bubbles: [],
    particles: [],
    floats: [],
    coins: 120,
    totalCoins: Storage.load('aqua_total', 0),
    waterQuality: 85,
    temperature: 24,
    oxygen: 90,
    day: 1, dayT: 0, dayL: 1500,
    time: 0,
    unlockedFish: Storage.load('aqua_unlocked', [0,1,2,3]),
    unlockedDecor: Storage.load('aqua_decor', []),
    decorOwned: Storage.load('aqua_decorOwned', {}),
    decorPlacements: Storage.load('aqua_decorPlaced', []),
    highScore: Storage.load('aqua_high', 0),
    breedTimer: 600,
    actions: [
      {k:'feed1',n:'普通鱼食',ic:'🫘',x:20,y:555,w:120,h:38,c:'#f59e0b',key:'1',price:2},
      {k:'feed2',n:'高级鱼食',ic:'🫧',x:150,y:555,w:120,h:38,c:'#10b981',key:'2',price:5},
      {k:'feed3',n:'活虾饵料',ic:'🦐',x:280,y:555,w:120,h:38,c:'#ef4444',key:'3',price:10},
      {k:'clean',n:'换水清洁',ic:'💧',x:410,y:555,w:120,h:38,c:'#3b82f6',key:'4',price:8},
      {k:'oxygen',n:'充氧',ic:'💨',x:540,y:555,w:120,h:38,c:'#06b6d4',key:'5'},
      {k:'sell',n:'出售鱼',ic:'💰',x:670,y:555,w:100,h:38,c:'#8b5cf6',key:'6'},
      {k:'shop',n:'商店',ic:'🛒',x:20,y:600,w:200,h:30,c:'#ec4899',key:'S'},
      {k:'book',n:'图鉴',ic:'📖',x:240,y:600,w:200,h:30,c:'#14b8a6',key:'C'},
      {k:'breed',n:'繁殖',ic:'💕',x:460,y:600,w:200,h:30,c:'#f43f5e',key:'B'},
      {k:'light',n:'灯光',ic:'💡',x:680,y:600,w:200,h:30,c:'#eab308',key:'L'},
    ],
    cds: {},
    selectedFish: 0,
    lightMode: 'day',
    lightT: 0,
  };
  for (let i=0;i<18;i++) {
    G.bubbles.push({
      x: Math.random()*W, y: H+Math.random()*H,
      r: 2+Math.random()*5, s: 0.3+Math.random()*0.8,
      sway: Math.random()*Math.PI*2,
    });
  }
  if (G.decorPlacements.length===0) {
    G.decorPlacements = [
      {id:'plant',x:120,y:500},{id:'plant',x:780,y:490},
      {id:'rock',x:350,y:520},{id:'coral1',x:550,y:505},
    ];
  }
  gameState = STATE_AQUARIUM;
}

function saveGame() {
  Storage.save('aqua_total', G.totalCoins);
  Storage.save('aqua_unlocked', G.unlockedFish);
  Storage.save('aqua_decor', G.unlockedDecor);
  Storage.save('aqua_decorOwned', G.decorOwned);
  Storage.save('aqua_decorPlaced', G.decorPlacements);
  Storage.save('aqua_high', G.highScore);
}

function addF(x,y,c,t,vy) { G.particles.push({x,y,vx:(Math.random()-0.5)*2,vy:vy||-2,life:45,c,t}); }
function addFt(x,y,t,c) { G.floats.push({x,y,t,c:c||'#fff',life:60,vy:-1}); }

function updateGame() {
  if (gameState !== STATE_AQUARIUM) return;
  G.time++;
  G.dayT++;
  if (G.dayT >= G.dayL) {
    G.dayT = 0; G.day++;
    let daily = 20;
    G.fishes.forEach(f => { daily += Math.floor(FISH_TYPES[f.typeIdx].val * 0.02); });
    G.coins += daily;
    G.totalCoins += G.coins;
    addFt(W/2, 90, '☀️ 第'+G.day+'天 +'+daily+'💰', '#ffd700');
    checkUnlocks();
    saveGame();
  }
  if (G.time%100===0) {
    G.waterQuality = Math.max(0, G.waterQuality - 0.8);
    G.oxygen = Math.max(0, G.oxygen - 0.6);
    if (G.waterQuality<40 || G.oxygen<40) G.fishes.forEach(f => f.happy = Math.max(0, f.happy-0.5));
  }
  G.fishes.forEach((fsh, idx) => {
    const ft = FISH_TYPES[fsh.typeIdx];
    if (G.time%90===0) {
      fsh.hunger = Math.max(0, fsh.hunger - 1.2);
      if (fsh.hunger<30) fsh.happy = Math.max(0, fsh.happy - 0.6);
      if (fsh.hunger<10) { fsh.hp = Math.max(0, fsh.hp - 0.5); fsh.flashT = 30; }
      if (G.waterQuality<50) { fsh.clean = Math.max(0, fsh.clean - 0.8); }
      if (G.waterQuality>60 && G.oxygen>60 && fsh.hunger>40) {
        fsh.happy = Math.min(100, fsh.happy + 0.15);
      }
    }
    fsh.turnT--;
    if (fsh.turnT<=0 || fsh.x<50 || fsh.x>W-50) {
      fsh.vx = (Math.random()<0.5?-1:1) * (0.5 + Math.random()) * ft.sp;
      fsh.vy = (Math.random()-0.5) * ft.sp * 0.8;
      fsh.turnT = 60 + Math.random()*180;
    }
    if (fsh.y<130) fsh.vy = Math.abs(fsh.vy)*0.7 + 0.3;
    if (fsh.y>520) fsh.vy = -Math.abs(fsh.vy)*0.7 - 0.3;
    fsh.x += fsh.vx;
    fsh.y += fsh.vy * 0.5;
    fsh.x = Math.max(40, Math.min(W-40, fsh.x));
    fsh.y = Math.max(140, Math.min(530, fsh.y));
    fsh.angle = Math.atan2(fsh.vy, fsh.vx);
    fsh.bob += 0.08;
    if (fsh.flashT>0) fsh.flashT--;
    fsh.age += 0.02;
    if (fsh.hp>ft.hp*0.5 && fsh.age>5 && G.waterQuality>70) fsh.breedingReady = true;
    if (fsh.hp<=0) {
      addFt(fsh.x, fsh.y, '💀 损失一条'+ft.n, '#e74c3c');
      addF(fsh.x, fsh.y, '#888', '💔');
    }
  });
  G.fishes = G.fishes.filter(f => f.hp > 0);
  G.breedTimer--;
  if (G.breedTimer <= 0) {
    tryBreed();
    G.breedTimer = 800 + Math.random()*800;
  }
  for (let i=G.foods.length-1;i>=0;i--) {
    const fd = G.foods[i];
    fd.vy += 0.05;
    fd.y += fd.vy;
    fd.x += Math.sin(fd.sway)*0.3;
    fd.sway += 0.05;
    if (fd.y > 520) fd.y = 520;
    let eaten = false;
    G.fishes.forEach(fsh => {
      if (eaten) return;
      const dx = fd.x - fsh.x, dy = fd.y - fsh.y;
      if (Math.sqrt(dx*dx+dy*dy) < 30*fsh.size + 10 && fsh.hunger < 95) {
        const ft = FISH_TYPES[fsh.typeIdx];
        fsh.hunger = Math.min(100, fsh.hunger + fd.s);
        fsh.happy = Math.min(100, fsh.happy + fd.hb * 2);
        fsh.hp = Math.min(ft.hp, fsh.hp + 1);
        addF(fd.x, fd.y, '#fff', fd.e);
        addFt(fd.x, fd.y-20, '+'+fd.s+' 饱食', '#22c55e');
        sfx(800+Math.random()*100, 0.05, 'sine', 0.04);
        eaten = true;
      }
    });
    if (eaten) { G.foods.splice(i,1); continue; }
    fd.life--;
    if (fd.life<=0) {
      G.waterQuality = Math.max(0, G.waterQuality - 0.3);
      G.foods.splice(i,1);
    }
  }
  G.bubbles.forEach(b => {
    b.y -= b.s;
    b.x += Math.sin(b.sway)*0.4;
    b.sway += 0.04;
    if (b.y < 100) {
      b.y = H+Math.random()*30;
      b.x = Math.random()*W;
      b.r = 2+Math.random()*5;
      b.s = 0.3+Math.random()*0.8;
    }
  });
  for (let i=G.particles.length-1;i>=0;i--) {
    const p = G.particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.life--;
    if (p.life<=0) G.particles.splice(i,1);
  }
  for (let i=G.floats.length-1;i>=0;i--) {
    const ft2 = G.floats[i];
    ft2.y += ft2.vy; ft2.life--;
    if (ft2.life<=0) G.floats.splice(i,1);
  }
  for (let k in G.cds) G.cds[k] = Math.max(0, G.cds[k]-1);
  G.lightT++;
  G.highScore = Math.max(G.highScore, G.totalCoins + G.fishes.length*10 + G.day*5);
}

function tryBreed() {
  const adults = G.fishes.filter(f => f.breedingReady && f.hp>60);
  if (adults.length<2) return;
  if (G.fishes.length >= 18) return;
  const typeCount = {};
  adults.forEach(f => { typeCount[f.typeIdx] = (typeCount[f.typeIdx]||0)+1; });
  for (let t in typeCount) {
    if (typeCount[t] >= 2 && Math.random() < 0.55) {
      const t0 = parseInt(t);
      const ft = FISH_TYPES[t0];
      G.fishes.push({
        typeIdx: t0,
        x: W/2 + (Math.random()-0.5)*300,
        y: 250 + Math.random()*200,
        vx: (Math.random()<0.5?-1:1)*ft.sp*0.8,
        vy: (Math.random()-0.5)*ft.sp*0.5,
        size: ft.sz*0.6,
        hp: ft.hp*0.4, maxHp: ft.hp,
        hunger: 90, clean: 90, happy: 95,
        age: 0, stage: 0,
        angle: 0, turnT: 100,
        bob: Math.random()*10, flashT: 0,
        breedingReady: false,
        id: Math.random().toString(36).slice(2),
      });
      addFt(W/2, 200, '🎉 繁殖成功！新增'+ft.n, '#ec4899');
      addF(W/2, 230, '#ec4899', '💕');
      sfx(880, 0.2, 'triangle', 0.06);
      return;
    }
  }
}

function checkUnlocks() {
  const need = [0,0,0,0, 200, 500, 1000, 1800, 4000, 350, 700, 1400, 2800, 2200, 1600];
  for (let i=0;i<FISH_TYPES.length;i++) {
    if (G.unlockedFish.indexOf(i)<0 && G.totalCoins>=need[i]) {
      G.unlockedFish.push(i);
      addFt(W/2, 280, '🎊 解锁鱼种: '+FISH_TYPES[i].n, '#2dd4bf');
      sfx(950, 0.3, 'sine', 0.08);
    }
  }
}

function drawWater() {
  let g = ctx.createLinearGradient(0,110,0,H);
  if (G.lightMode==='day') {
    g.addColorStop(0, 'rgba(0,180,220,0.35)');
    g.addColorStop(0.5, 'rgba(0,120,180,0.45)');
    g.addColorStop(1, 'rgba(0,60,120,0.55)');
  } else if (G.lightMode==='night') {
    g.addColorStop(0, 'rgba(15,25,70,0.6)');
    g.addColorStop(0.5, 'rgba(5,15,50,0.7)');
    g.addColorStop(1, 'rgba(0,5,30,0.8)');
  } else {
    g.addColorStop(0, 'rgba(50,0,80,0.45)');
    g.addColorStop(0.5, 'rgba(80,0,100,0.5)');
    g.addColorStop(1, 'rgba(30,0,60,0.65)');
  }
  ctx.fillStyle = g;
  ctx.fillRect(0,110,W,H-110);
  if (G.lightMode==='day') {
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    for (let i=0;i<8;i++) {
      const x = 100 + i*110 + Math.sin(G.time*0.005+i)*15;
      ctx.beginPath();
      ctx.moveTo(x, 110);
      ctx.lineTo(x+50, 110);
      ctx.lineTo(x+120, H);
      ctx.lineTo(x+70, H);
      ctx.closePath(); ctx.fill();
    }
  }
  ctx.strokeStyle = G.lightMode==='day' ? 'rgba(255,255,255,0.15)' : 'rgba(100,150,255,0.15)';
  ctx.lineWidth = 1;
  for (let i=0;i<5;i++) {
    const yy = 200 + i*80 + Math.sin(G.time*0.02+i)*15;
    ctx.beginPath();
    for (let x=0;x<W;x+=20) {
      const yv = yy + Math.sin(x*0.01 + G.time*0.015 + i)*8;
      if (x===0) ctx.moveTo(x,yv); else ctx.lineTo(x,yv);
    }
    ctx.stroke();
  }
}

function drawTank() {
  let g = ctx.createLinearGradient(0,0,0,110);
  g.addColorStop(0, '#002035'); g.addColorStop(1, '#004060');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,110);
  ctx.fillStyle = '#001828';
  ctx.fillRect(0, H-50, W, 50);
  ctx.fillStyle = '#f5deb3';
  for (let x=0;x<W;x+=14) {
    const hh = 8 + (Math.sin(x*0.2)+1)*4;
    ctx.fillRect(x, H-50, 10, hh);
    ctx.fillStyle = ctx.fillStyle==='#f5deb3' ? '#deb887' : '#f5deb3';
  }
  ctx.strokeStyle = '#2dd4bf';
  ctx.lineWidth = 6;
  ctx.strokeRect(3, 3, W-6, H-6);
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(45,212,191,0.3)';
  ctx.strokeRect(12, 12, W-24, H-24);
  if (G.lightMode==='party') {
    ctx.globalAlpha = 0.08 + Math.sin(G.time*0.08)*0.04;
    ['#ff0080','#00ff80','#8000ff','#ff8000'].forEach((c,i) => {
      ctx.fillStyle = c;
      ctx.fillRect(i*W/4, 110, W/4, H-160);
    });
    ctx.globalAlpha = 1;
  }
  G.decorPlacements.forEach(d => {

    if (d.id==='coral1'||d.id==='coral2') {

      ctx.fillText('🪸', 0, 0);

}

function drawBubbles() {

function drawFishes() {
  G.fishes.forEach((fsh,idx) => {
    const ft = FISH_TYPES[fsh.typeIdx];
    ctx.save();
    ctx.translate(fsh.x, fsh.y + Math.sin(fsh.bob)*3);
    const f2 = fsh.vx < 0 ? -1 : 1;
    ctx.scale(f2, 1);
    ctx.rotate(fsh.vx<0 ? Math.PI - fsh.angle : fsh.angle);
    const sz = 28 * fsh.size;
    if (fsh.flashT>0 && fsh.flashT%8<4) ctx.globalAlpha = 0.4;
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath(); ctx.ellipse(0, sz*0.9, sz*0.9, sz*0.2, 0, 0, Math.PI*2); ctx.fill();
    let grad = ctx.createRadialGradient(-sz*0.2, 0, sz*0.2, 0, 0, sz);
    grad.addColorStop(0, ft.c1);
    grad.addColorStop(1, ft.c2);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(0, 0, sz*1.1, sz*0.6, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(sz*0.8, 0);
    ctx.lineTo(sz*1.5, -sz*0.6);
    ctx.lineTo(sz*1.4, 0);
    ctx.lineTo(sz*1.5, sz*0.6);
    ctx.closePath();
    ctx.fill();
    const w = Math.sin(G.time*0.25+idx)*sz*0.4;
    ctx.beginPath();
    ctx.moveTo(-sz*0.3, 0);
    ctx.lineTo(-sz*0.9, -sz*0.5 + w);
    ctx.lineTo(-sz*0.85, 0);
    ctx.lineTo(-sz*0.9, sz*0.5 - w);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.1)';
    for (let sc=-1;sc<=1;sc++) {
      ctx.beginPath();
      ctx.moveTo(0, -sz*0.3 + sc*sz*0.3);
      ctx.quadraticCurveTo(sz*0.3, sc*sz*0.15, 0, sz*0.3 + sc*sz*0.3);
      ctx.fill();
    }
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(sz*0.5, -sz*0.18, sz*0.2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(sz*0.55, -sz*0.18, sz*0.11, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(sz*0.6, -sz*0.22, sz*0.04, 0, Math.PI*2); ctx.fill();
    if (ft.n==='河豚' && (fsh.hunger<20 || fsh.flashT>30)) {
      for (let i=0;i<10;i++) {
        const a = i/10*Math.PI*2;
        ctx.fillStyle = ft.c2;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a)*sz*1.1, Math.sin(a)*sz*0.7);
        ctx.lineTo(Math.cos(a)*sz*1.4, Math.sin(a)*sz*0.9);
        ctx.lineTo(Math.cos(a+0.15)*sz*1.1, Math.sin(a+0.15)*sz*0.7);
        ctx.closePath(); ctx.fill();
      }
    }
    ctx.restore();
    if (idx === G.selectedFish) {
      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 2;
      ctx.setLineDash([4,4]);
      ctx.beginPath();
      ctx.arc(fsh.x, fsh.y, 38*fsh.size, 0, Math.PI*2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#ffd700';
      ctx.font = '12px "Microsoft YaHei"';
      ctx.textAlign = 'center';
      ctx.fillText('【选中】'+ft.n, fsh.x, fsh.y-55);
    }
    if (fsh.hunger<25) {
      ctx.font = '18px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('😫', fsh.x, fsh.y-40);
    }
    if (fsh.breedingReady) {
      ctx.font = '14px Arial';
      ctx.fillText('💕', fsh.x+20, fsh.y-30);
    }
  });
}

function render() {
  if (gameState === STATE_MENU) { ctx.fillStyle = '#001a33'; ctx.fillRect(0,0,W,H); return; }
  ctx.fillStyle = '#001525';
  ctx.fillRect(0,0,W,H);
  drawTank();
  drawWater();
  drawBubbles();
  drawFishes();
  drawFoods();
  drawEffects();
  drawHUD();
  drawButtons();
  if (gameState === STATE_SHOP) drawShop();
}

function doAct(k) {
  if (G.cds[k] > 0) return;
  if (k==='feed1'||k==='feed2'||k==='feed3') {
    const idx = parseInt(k.slice(-1))-1;
    const fd0 = FOODS[idx];
    if (G.coins >= fd0.p) {
      G.coins -= fd0.p;
      const n = 3 + idx*2;
      for (let i=0;i<n;i++) {
        G.foods.push({
          x: 200 + Math.random()*(W-400),
          y: 130 + Math.random()*30,
          vy: 0.3 + Math.random()*0.3,
          sway: Math.random()*Math.PI*2,
          e: fd0.e, s: fd0.s, hb: fd0.hb, life: 600,
        });
      }
      if (fd0.wq) G.waterQuality = Math.min(100, G.waterQuality+fd0.wq);
      addFt(W/2, 160, '投喂 '+fd0.n+'!', '#f59e0b');
      sfx(700, 0.08);
      G.cds[k] = 40;
    } else addFt(W/2, 330, '金币不足!', '#e74c3c');
  } else if (k==='clean') {
    if (G.coins >= 8) {
      G.coins -= 8;
      G.waterQuality = Math.min(100, G.waterQuality + 35);
      G.fishes.forEach(f => f.clean = Math.min(100, f.clean + 25));
      for (let i=0;i<30;i++) {
        addF(100+Math.random()*(W-200), 150+Math.random()*400, '#3b82f6', '✨');
      }
      addFt(W/2, 180, '换水！水质+35', '#3b82f6');
      sfx(520, 0.15, 'triangle');
      G.cds[k] = 240;
    } else addFt(W/2,330,'金币不足!','#e74c3c');
  } else if (k==='oxygen') {
    G.oxygen = Math.min(100, G.oxygen + 25);
    G.fishes.forEach(f => f.happy = Math.min(100, f.happy + 3));
    for (let i=0;i<20;i++) {
      G.bubbles.push({
        x: 100+Math.random()*(W-200), y: H-60,
        r: 3+Math.random()*5, s: 0.8+Math.random()*1.2, sway: Math.random()*Math.PI*2
      });
    }
    addFt(W/2, 180, '充氧！溶氧+25', '#06b6d4');
    sfx(600, 0.1, 'sine', 0.06);
    G.cds[k] = 180;
  } else if (k==='sell') {
    const f = G.fishes[G.selectedFish];
    if (f && G.fishes.length>1) {
      const ft = FISH_TYPES[f.typeIdx];
      const ageM = Math.min(2.0, 0.5 + f.age/20);
      const val = Math.floor(ft.val * ageM * (f.hp/f.maxHp));
      G.coins += val;
      G.fishes.splice(G.selectedFish, 1);
      G.selectedFish = Math.min(G.selectedFish, G.fishes.length-1);
      addFt(W/2, 280, '💰 出售 '+ft.n+' 获得 '+val+' 金币', '#22c55e');
      sfx(900, 0.12, 'square', 0.05);
    } else if (G.fishes.length<=1) addFt(W/2,330,'至少保留一条鱼!','#e74c3c');
    else addFt(W/2,330,'请先选中一条鱼(点击鱼)','#f59e0b');
  } else if (k==='shop') { gameState = STATE_SHOP; sfx(500,0.08); }
  else if (k==='book') { gameState = STATE_COLLECTION; showBook(); sfx(650,0.1); }
  else if (k==='breed') {
    if (G.fishes.filter(f=>f.breedingReady).length>=2) {
      G.breedTimer = 50;
      addFt(W/2,330,'💕 促进繁殖！','#ec4899');
      sfx(760, 0.15, 'sine', 0.06);
      G.cds[k] = 500;
    } else addFt(W/2,330,'需至少2条成熟且健康的鱼！','#e74c3c');
  } else if (k==='light') {
    G.lightMode = G.lightMode==='day' ? 'night' : (G.lightMode==='night' ? 'party' : 'day');
    addFt(W/2, 100, G.lightMode==='day'?'☀️ 日光模式':G.lightMode==='night'?'🌙 夜光模式':'🎊 派对模式', '#ffd700');
    sfx(600, 0.1, 'triangle', 0.05);
  }
}

function showBook() {
  const el = document.getElementById('fishBook');
  el.style.display = 'flex';
  const grid = document.getElementById('fbGrid');
  grid.innerHTML = '';
  FISH_TYPES.forEach((ft,i) => {
    const u = G.unlockedFish.indexOf(i)>=0;
    const need = [0,0,0,0,200,500,1000,1800,4000,350,700,1400,2800,2200,1600];
    const di = document.createElement('div');
    di.className = 'fb '+(u?'unlocked':'locked');
    di.innerHTML = '<div class="fb-e">'+(u?ft.e:'🔒')+'</div>'+
      '<div class="fb-n">'+(u?ft.n:'???')+'</div>'+
      '<div class="fb-s">'+(u?ft.desc+' 💰'+ft.val:'累计'+need[i]+'💰解锁')+'</div>';
    grid.appendChild(di);
  });
}

function clickCanvas(pos) {
  if (gameState === STATE_MENU) return;
  if (gameState === STATE_SHOP) {
    if (G._sb && pos.x>=G._sb.x&&pos.x<=G._sb.x+G._sb.w&&pos.y>=G._sb.y&&pos.y<=G._sb.y+G._sb.h) { gameState = STATE_AQUARIUM; sfx(500,0.08); return; }
    G.shopBtns.forEach(b => {
      if (pos.x>=b.x&&pos.x<=b.x+b.w&&pos.y>=b.y&&pos.y<=b.y+b.h && b.canBuy) {
        if (b.type==='fish') {
          G.coins -= b.price;
          const ft = FISH_TYPES[b.idx];
          G.fishes.push({
            typeIdx: b.idx,
            x: W/2 + (Math.random()-0.5)*200,
            y: 260 + Math.random()*200,
            vx: (Math.random()<0.5?-1:1)*ft.sp,
            vy: (Math.random()-0.5)*ft.sp*0.5,
            size: ft.sz, hp: ft.hp, maxHp: ft.hp,
            hunger: 90, clean: 90, happy: 90,
            age: 3, stage: 1, angle: 0, turnT: 100,
            bob: Math.random()*10, flashT: 0, breedingReady: false,
            id: Math.random().toString(36).slice(2),
          });
          if (G.unlockedFish.indexOf(b.idx)<0) G.unlockedFish.push(b.idx);
          addFt(W/2, 200, '🎉 新鱼入缸: '+ft.n, '#2dd4bf');
          saveGame();
          sfx(900,0.2,'sine',0.08);
        } else if (b.type==='decor') {
          G.coins -= b.price;
          if (!G.decorOwned[b.id]) G.decorOwned[b.id] = 0;
          G.decorOwned[b.id]++;
          G.decorPlacements.push({ id:b.id, x:150+Math.random()*(W-300), y:480+Math.random()*40 });
          addFt(W/2, 240, '🏺 购置装饰: '+b.name, '#ec4899');
          saveGame();
          sfx(780,0.15);
        }
      }
    });
    return;
  }
  G.actions.forEach(a => {
    if (pos.x>=a.x&&pos.x<=a.x+a.w&&pos.y>=a.y&&pos.y<=a.y+a.h) doAct(a.k);
  });
  if (gameState === STATE_AQUARIUM) {
    for (let i=G.fishes.length-1;i>=0;i--) {
      const f = G.fishes[i];
      const dx = pos.x - f.x, dy = pos.y - f.y;
      if (Math.sqrt(dx*dx+dy*dy) < 40*f.size) {
        G.selectedFish = i;
        f.happy = Math.min(100, f.happy + 3);
        addF(f.x, f.y-20, '#ec4899', '💕');
        addFt(f.x, f.y-50, '+3 心情', '#ec4899');
        sfx(760, 0.08, 'triangle');
        return;
      }
    }
    if (pos.y > 130 && pos.y < 520) {
      if (G.coins >= FOODS[0].p) {
        G.coins -= FOODS[0].p;
        for (let i=0;i<3;i++) {
          G.foods.push({
            x: pos.x + (Math.random()-0.5)*50,
            y: pos.y - 100,
            vy: 0.3, sway: Math.random()*Math.PI*2,
            e: FOODS[0].e, s: FOODS[0].s, hb: FOODS[0].hb, life: 600,
          });
        }
        addFt(pos.x, pos.y-80, '-2💰 投喂', '#f59e0b');
      }
    }
  }
}

function getPos(e) {
  const r = canvas.getBoundingClientRect();
  const sx = W/r.width, sy = H/r.height;
  const cx = e.touches ? e.touches[0].clientX : (e.changedTouches?e.changedTouches[0].clientX:e.clientX);
  const cy = e.touches ? e.touches[0].clientY : (e.changedTouches?e.changedTouches[0].clientY:e.clientY);
  return { x:(cx-r.left)*sx, y:(cy-r.top)*sy };
}
canvas.addEventListener('click', e => clickCanvas(getPos(e)));
canvas.addEventListener('touchend', e => { if(e.changedTouches) clickCanvas({...getPos(e)}); }, { passive:true });

document.addEventListener('keydown', e => {
  if (gameState===STATE_MENU) return;
  if (e.key==='Escape') {
    if (gameState===STATE_SHOP) gameState=STATE_AQUARIUM;
    else if (gameState===STATE_COLLECTION) { document.getElementById('fishBook').style.display='none'; gameState=STATE_AQUARIUM; }
    sfx(500,0.06);
  }
  if (gameState===STATE_AQUARIUM) {
    if (e.key==='1') doAct('feed1');
    if (e.key==='2') doAct('feed2');
    if (e.key==='3') doAct('feed3');
    if (e.key==='4') doAct('clean');
    if (e.key==='5') doAct('oxygen');
    if (e.key==='6') doAct('sell');
    if (e.key==='s'||e.key==='S') doAct('shop');
    if (e.key==='c'||e.key==='C') { gameState=STATE_COLLECTION; showBook(); }
    if (e.key==='b'||e.key==='B') doAct('breed');
    if (e.key==='l'||e.key==='L') doAct('light');
    if (e.key==='ArrowLeft') G.selectedFish = (G.selectedFish-1+G.fishes.length)%G.fishes.length;
    if (e.key==='ArrowRight') G.selectedFish = (G.selectedFish+1)%G.fishes.length;
  }
});

document.querySelectorAll('.fc').forEach(c => {
  c.addEventListener('click', () => {
    document.querySelectorAll('.fc').forEach(x=>x.classList.remove('selected'));
    c.classList.add('selected');
    selFish = parseInt(c.dataset.f);
    sfx(550, 0.08);
  });
});

document.getElementById('start-game-btn').addEventListener('click', () => {
  try { audioCtx.resume(); } catch(e){}
  document.getElementById('startScreen').style.display='none';
  initGame(selFish);
  sfx(850, 0.3, 'sine');
});

document.getElementById('closeFB').addEventListener('click', () => {
  document.getElementById('fishBook').style.display='none';
  gameState = STATE_AQUARIUM;
});

let tm = 0;
function step() {
  updateGame();
  render();
  tm = setTimeout(step, 16);
}
step();

window.addEventListener('beforeunload', saveGame);
setInterval(saveGame, 25000);

GameCore.init({ touch: false });
</script>

    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;

      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';

        c.width = pw;

      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {

<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>

<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
