<body>

<button id="start-game-btn" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:20px 40px;font-size:20px;background:#ff9800;color:white;border:none;border-radius:12px;cursor:pointer;z-index:999;font-weight:bold;">开始游戏</button>

<canvas id="c"></canvas>

<script>
if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
</script>
<script src="../game_core.js"></script>
<script>
(function(){
"use strict";

const W=480,H=720;
const GAME_TIME=120;

const ACHIEVEMENTS=[
    {id:'first_buy',name:'初次购兔',desc:'购买第1只兔子',icon:'🐰',unlocked:false},
    {id:'first_breed',name:'初次繁殖',desc:'成功繁殖第1窝小兔',icon:'💕',unlocked:false},
    {id:'breed_10',name:'繁殖大师',desc:'累计繁殖10只兔子',icon:'🐇',need:10,unlocked:false},
    {id:'sell_20',name:'销售能手',desc:'累计卖出20只兔子',icon:'💰',need:20,unlocked:false},
    {id:'rich',name:'小富翁',desc:'金币达到500',icon:'💎',need:500,unlocked:false},
    {id:'full_cage',name:'兔舍爆满',desc:'同时拥有9只兔子',icon:'🏠',unlocked:false},
    {id:'up_all',name:'满级农场',desc:'完成全部3项升级',icon:'⚡',unlocked:false},
    {id:'no_sick',name:'健康农场',desc:'一局中零生病死亡',icon:'💪',unlocked:false}
];

let audioCtx=null;
function initAudio(){
    if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
}
function playTone(freq,dur,type,vol){
    if(!audioCtx)return;
    try{
        const o=audioCtx.createOscillator();
        const g=audioCtx.createGain();
        o.type=type||'sine';
        o.frequency.value=freq;
        g.gain.value=vol||0.12;
        g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
        o.connect(g);g.connect(audioCtx.destination);
        o.start();o.stop(audioCtx.currentTime+dur);
    }catch(e){}
}
function sfxBuy(){playTone(650,0.08,'sine',0.13)}
function sfxFeed(){playTone(800,0.06,'sine',0.12);setTimeout(()=>playTone(1000,0.08,'sine',0.1),60)}
function sfxWater(){playTone(1200,0.05,'triangle',0.08);setTimeout(()=>playTone(1400,0.08,'triangle',0.06),40)}
function sfxBreed(){playTone(500,0.1,'sine',0.12);setTimeout(()=>playTone(650,0.1,'sine',0.1),100);setTimeout(()=>playTone(800,0.15,'sine',0.12),200)}
function sfxBorn(){playTone(900,0.06,'sine',0.12);setTimeout(()=>playTone(1200,0.08,'sine',0.1),50)}
function sfxSell(){playTone(700,0.08,'sine',0.12);setTimeout(()=>playTone(900,0.06,'sine',0.1),80)}
function sfxHeal(){playTone(520,0.1,'triangle',0.1);setTimeout(()=>playTone(780,0.15,'triangle',0.1),100)}
function sfxUpgrade(){playTone(440,0.08,'sine',0.15);setTimeout(()=>playTone(550,0.08,'sine',0.15),80);setTimeout(()=>playTone(660,0.08,'sine',0.15),160);setTimeout(()=>playTone(880,0.18,'sine',0.15),240)}
function sfxBad(){playTone(200,0.2,'square',0.12)}
function sfxBuzzer(){playTone(150,0.4,'sawtooth',0.18)}
function sfxBtn(){playTone(600,0.06,'sine',0.1)}
function sfxAchievement(){playTone(523,0.08,'sine',0.15);setTimeout(()=>playTone(659,0.08,'sine',0.15),90);setTimeout(()=>playTone(784,0.12,'sine',0.15),180);setTimeout(()=>playTone(1047,0.2,'sine',0.15),270)}
function sfxRain(){playTone(100+Math.random()*200,0.02,'sawtooth',0.03)}
function sfxThunder(){playTone(60,0.3,'sawtooth',0.2);setTimeout(()=>playTone(80,0.4,'sawtooth',0.15),200)}

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let scale=1;
function resize(){
    const r=W/H;
    let cw=window.innerWidth,ch=window.innerHeight;
    if(cw/ch>r){ch=cw/r}else{cw=ch*r}
    canvas.width=cw;canvas.height=ch;
    scale=cw/W;
    ctx.setTransform(scale,0,0,scale,0,0);
}
window.addEventListener('resize',resize);resize();

let _bid=0;
function createRabbit(slot){
    const genders=['male','female'];
    const colors=[{name:'白兔',c:'#fff',e:'#ffe0e0'},{name:'灰兔',c:'#bdbdbd',e:'#9e9e9e'},{name:'棕兔',c:'#a1887f',e:'#8d6e63'},{name:'黑兔',c:'#424242',e:'#616161'},{name:'花兔',c:'#fff59d',e:'#fff176'}];
    const co=colors[Math.floor(Math.random()*colors.length)];
    const moods=['idle','eat','sleep','jump','groom'];
    const r={
        id:++_bid,gender:genders[Math.floor(Math.random()*2)],
        color:co,health:80+Math.random()*20,weight:600+Math.random()*400,
        age:0,hunger:80,sick:false,sickTimer:0,
        slot:slot,x:0,y:0,animTimer:Math.random()*100,
        inBreed:false,breedPartner:null,breedTimer:0,breeding:false,babies:0,
        mood:moods[Math.floor(Math.random()*moods.length)],moodTimer:0,
        blink:Math.random()*100,yawn:0,bounce:0
    };
    r.x=slot?slot.x:0;r.y=slot?slot.y:0;
    return r;
}

const WEATHERS=['sunny','cloudy','rainy','sunset'];
const WEATHER_NAMES={sunny:'☀️晴天',cloudy:'☁️多云',rainy:'🌧️雨天',sunset:'🌇黄昏'};

const G={
    state:STATE_MENU,score:0,highScore:0,timeLeft:GAME_TIME*60,
    coins:200,
    cageSlots:[],cageCount:6,
    food:50,foodMax:100,
    water:100,waterMax:100,waterTimer:15*60,
    rabbits:[],
    breedingZone:{x:150,y:500,w:180,h:70},
    breedingQueue:[],breedingActive:false,breedProgress:0,breedM:null,breedF:null,babiesToSpawn:[],
    foodSaleTimer:0,foodSaleActive:false,
    sickEventTimer:300+Math.random()*600,sickDeathsThisGame:0,
    totalSold:0,totalBreed:0,upgradeLevel:0,
    particles:[],popups:[],btnRects:{},
    dragging:null,dragStart:null,
    keys:{},paused:false,
    upgradeMenu:false,
    achievements:ACHIEVEMENTS.map(a=>({...a})),achievementQueue:[],
    weather:'sunny',weatherTimer:0,clouds:[],rainDrops:[],butterflies:[],flowers:[],
    tutorialStep:0,tutorialTimer:0,showTutorial:true,
    carrotDrops:[],grassSway:0,
    achPanel:false,hoverRabbit:null
};

G.highScore=parseInt(Storage.load('tznc_highscore','0'));

for(let i=0;i<8;i++){
    G.clouds.push({x:Math.random()*W,y:30+Math.random()*80,s:0.7+Math.random()*0.8,spd:0.05+Math.random()*0.05});
}
for(let i=0;i<12;i++){
    G.butterflies.push({x:Math.random()*W,y:180+Math.random()*350,phase:Math.random()*Math.PI*2,spd:0.4+Math.random()*0.5,color:['#e91e63','#9c27b0','#ff9800','#4caf50'][Math.floor(Math.random()*4)]});
}
for(let i=0;i<18;i++){
    G.flowers.push({x:40+Math.random()*(W-80),y:560+Math.random()*30,color:['#e91e63','#ffeb3b','#f44336','#fff','#ba68c8'][Math.floor(Math.random()*5)],size:3+Math.random()*3});
}

function initCages(){
    G.cageSlots=[];
    const cols=3,rows=2;
    const sx=30,sy=170,sw=135,sh=150,gap=15;
    for(let r=0;r<rows;r++){
        for(let c=0;c<cols;c++){
            const idx=r*cols+c;
            if(idx>=G.cageCount)continue;
            G.cageSlots.push({
                x:sx+c*(sw+gap),y:sy+r*(sh+gap),w:sw,h:sh,
                id:idx,rabbit:null
            });
        }
    }
}

function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
}

function drawBtn(ctx,x,y,w,h,text,name,color,sub){
    G.btnRects[name]={x:x,y:y,w:w,h:h};
    ctx.fillStyle=color||'#ff9800';
    ctx.strokeStyle='rgba(255,255,255,0.5)';
    ctx.lineWidth=2;
    roundRect(ctx,x,y,w,h,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#fff';
    ctx.font='bold 15px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(text,x+w/2,y+h/2-(sub?6:0));
    if(sub){
        ctx.font='10px "Microsoft YaHei"';
        ctx.fillStyle='rgba(255,255,255,0.85)';
        ctx.fillText(sub,x+w/2,y+h/2+12);
    }
    ctx.textBaseline='alphabetic';ctx.textAlign='left';
}
function hitBtn(p,name){
    const r=G.btnRects[name];
    return r&&p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;
}
function getPos(e){
    const rect=canvas.getBoundingClientRect();
    const t=e.touches?e.touches[0]:(e.changedTouches?e.changedTouches[0]:e);
    if(!t)return{x:0,y:0};
    return{x:(t.clientX-rect.left)/scale,y:(t.clientY-rect.top)/scale};
}
function addParticle(x,y,color,text,vy,size){
    G.particles.push({x:x,y:y,vx:(Math.random()-0.5)*3,vy:vy||-2,life:40,maxLife:40,color:color,text:text,size:size||3+Math.random()*3});
}
function addPopup(x,y,text,color){
    G.popups.push({x:x,y:y,text:text,color:color||'#fff',life:50,maxLife:50,vy:-1.2});
}
function updateParticles(){
    for(let i=G.particles.length-1;i>=0;i--){
        const p=G.particles[i];
        p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life--;
        if(p.life<=0)G.particles.splice(i,1);
    }
    for(let i=G.popups.length-1;i>=0;i--){
        const p=G.popups[i];
        p.y+=p.vy;p.life--;
        if(p.life<=0)G.popups.splice(i,1);
    }
}
function drawParticles(ctx){
    for(const p of G.particles){
        ctx.globalAlpha=p.life/p.maxLife;
        if(p.text){
            ctx.fillStyle=p.color;
            ctx.font='bold 16px Arial';ctx.textAlign='center';
            ctx.fillText(p.text,p.x,p.y);ctx.textAlign='left';
        }else{
            ctx.fillStyle=p.color;
            ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
        }
    }
    ctx.globalAlpha=1;
    for(const p of G.popups){
        ctx.globalAlpha=p.life/p.maxLife;
        ctx.fillStyle=p.color;
        ctx.font='bold 15px "Microsoft YaHei"';ctx.textAlign='center';
        ctx.fillText(p.text,p.x,p.y);ctx.textAlign='left';
    }
    ctx.globalAlpha=1;
}
function unlockAchievement(id){
    const a=G.achievements.find(x=>x.id===id);
    if(!a||a.unlocked)return;
    a.unlocked=true;
    G.achievementQueue.push(a);
    sfxAchievement();
    G.score+=50;
    for(let i=0;i<15;i++){
        const ang=Math.random()*Math.PI*2;
        addParticle(W/2,250,'#ffd700','✨',Math.cos(ang)*2,Math.sin(ang)*2-1,3);
    }
}
function checkAchievements(){
    if(G.rabbits.length>=1)unlockAchievement('first_buy');
    if(G.totalBreed>=1)unlockAchievement('first_breed');
    if(G.totalBreed>=10)unlockAchievement('breed_10');
    if(G.totalSold>=20)unlockAchievement('sell_20');
    if(G.coins>=500)unlockAchievement('rich');
    if(G.cageCount>=9&&G.rabbits.length>=9)unlockAchievement('full_cage');
    if(G.cageCount>=9&&G.foodMax>=300&&G.upgradeLevel>=3)unlockAchievement('up_all');
}

window.addEventListener('keydown',function(e){
    G.keys[e.key.toLowerCase()]=true;
    if(e.key===' '||e.key==='Enter'){
        e.preventDefault();initAudio();
        if(G.state===STATE_MENU){startGame();return}
        if(G.state===STATE_OVER){startGame();return}
    }
    if(e.key==='Escape'){
        if(G.state===STATE_PLAYING)togglePause();
        else if(G.upgradeMenu)G.upgradeMenu=false;
    }
    if(G.state===STATE_PLAYING&&!G.paused){
        if(e.key==='1'){buyRabbit()}
        if(e.key==='2'){feedAll()}
        if(e.key==='3'){addWater()}
        if(e.key==='4'){G.upgradeMenu=!G.upgradeMenu;sfxBtn()}
        if(e.key==='5'){sellAllRabbits()}
        if(e.key==='6'){G.achPanel=!G.achPanel;sfxBtn()}
    }
    initAudio();
});
window.addEventListener('keyup',function(e){G.keys[e.key.toLowerCase()]=false});

function handlePointerDown(e){
    initAudio();
    const p=getPos(e);
    if(G.state===STATE_MENU){if(hitBtn(p,'start')){startGame();return}}
    else if(G.state===STATE_OVER){
        if(hitBtn(p,'restart')){startGame();return}
        if(hitBtn(p,'menu')){G.state=STATE_MENU;return}
    }else if(G.state===STATE_PAUSE){
        if(hitBtn(p,'resume')){togglePause();return}
        if(hitBtn(p,'quit')){G.state=STATE_MENU;return}
    }else if(G.state===STATE_PLAYING&&!G.paused){
        if(G.showTutorial&&G.tutorialStep<5){
            G.tutorialStep++;G.tutorialTimer=0;
            if(G.tutorialStep>=5)G.showTutorial=false;
            sfxBtn();return;
        }
        if(G.achPanel){
            if(hitBtn(p,'achClose')){G.achPanel=false;sfxBtn();return}
            return;
        }
        if(G.upgradeMenu){
            if(hitBtn(p,'up1')){tryUpgrade(1);return}
            if(hitBtn(p,'up2')){tryUpgrade(2);return}
            if(hitBtn(p,'up3')){tryUpgrade(3);return}
            if(hitBtn(p,'upClose')){G.upgradeMenu=false;sfxBtn();return}
        }
        if(hitBtn(p,'achBtn')){G.achPanel=!G.achPanel;sfxBtn();return}
        if(hitBtn(p,'buyBtn')){buyRabbit();return}
        if(hitBtn(p,'feedBtn')){feedAll();return}
        if(hitBtn(p,'waterBtn')){addWater();return}
        if(hitBtn(p,'upBtn')){G.upgradeMenu=!G.upgradeMenu;sfxBtn();return}
        if(hitBtn(p,'sellAll')){sellAllRabbits();return}
        for(const r of G.rabbits){
            const dx=p.x-r.x,dy=p.y-r.y;
            if(Math.hypot(dx,dy)<35){
                G.dragging=r;G.dragStart={x:p.x,y:p.y};
                return;
            }
        }
    }
}
function handlePointerMove(e){
    const p=getPos(e);
    checkHoverInfo(p);
    if(G.state!==STATE_PLAYING||G.paused||!G.dragging)return;
    G.dragging.x=p.x;G.dragging.y=p.y;
}
function handlePointerUp(e){
    const p=getPos(e);
    if(G.dragging){
        const r=G.dragging;
        const bz=G.breedingZone;
        if(p.x>bz.x&&p.x<bz.x+bz.w&&p.y>bz.y&&p.y<bz.y+bz.h){
            addToBreeding(r);
        }else{
            let placed=false;
            for(const s of G.cageSlots){
                if(!s.rabbit&&p.x>s.x+5&&p.x<s.x+s.w-5&&p.y>s.y+5&&p.y<s.y+s.h-5){
                    for(const s2 of G.cageSlots){if(s2.rabbit===r)s2.rabbit=null;}
                    s.rabbit=r;r.slot=s;
                    r.x=s.x+s.w/2;r.y=s.y+s.h/2;
                    placed=true;break;
                }
            }
            if(!placed){
                if(r.slot){r.x=r.slot.x+r.slot.w/2;r.y=r.slot.y+r.slot.h/2;}
            }
        }
        if(r.sick){
            for(const s of G.cageSlots){
                if(p.x>s.x+5&&p.x<s.x+s.w-5&&p.y>s.y+5&&p.y<s.y+s.h-5&&!s.rabbit){
                    if(G.coins>=20){
                        G.coins-=20;r.sick=false;r.health=80;
                        addPopup(r.x,r.y-40,'💊 治愈! -20金','#4caf50');sfxHeal();
                    }else{
                        addPopup(p.x,p.y,'金币不够治病!','#ff5252');
                    }
                }
            }
        }
    }
    G.dragging=null;G.dragStart=null;
}

function buyRabbit(){
    let emptySlot=null;
    for(const s of G.cageSlots){if(!s.rabbit){emptySlot=s;break;}}
    if(!emptySlot){addPopup(W/2,100,'兔舍已满! 升级扩笼','#ff5252');sfxBad();return;}
    if(G.coins<50){addPopup(W/2,100,'金币不足! (需50金)','#ff5252');sfxBad();return;}
    G.coins-=50;
    const r=createRabbit(emptySlot);
    r.x=emptySlot.x+emptySlot.w/2;r.y=emptySlot.y+emptySlot.h/2;
    emptySlot.rabbit=r;
    G.rabbits.push(r);
    addPopup(r.x,r.y-40,'🐰 新兔子! -50金','#ff9800');
    for(let i=0;i<6;i++)addParticle(r.x+(Math.random()-0.5)*30,r.y,r.color.c,null,-2-Math.random()*2,4);
    sfxBuy();
    checkAchievements();
}
function feedAll(){
    if(G.rabbits.length===0){addPopup(W/2,100,'还没有兔子!','#ff5252');return;}
    const cost=(G.foodSaleActive?5:10)*G.rabbits.length;
    if(G.food<G.rabbits.length){addPopup(W/2,100,'饲料不足!','#ff5252');sfxBad();return;}
    if(G.coins<cost){addPopup(W/2,100,'金币不足! (需'+cost+'金)','#ff5252');sfxBad();return;}
    G.coins-=cost;G.food-=G.rabbits.length;
    for(const r of G.rabbits){
        r.hunger=Math.min(100,r.hunger+30);
        r.weight=Math.min(2000,r.weight+10);
        r.mood='eat';r.moodTimer=90;
        G.carrotDrops.push({x:r.x+(Math.random()-0.5)*20,y:r.y-20,vy:-2,vx:(Math.random()-0.5),life:30,carrot:true});
        addParticle(r.x,r.y-20,'#8bc34a','🥕',-1.5);
    }
    addPopup(W/2,140,'🥕 全体喂食! -'+cost+'金','#8bc34a');
    sfxFeed();
}
function addWater(){
    G.water=G.waterMax;G.waterTimer=15*60;
    addPopup(W/2,100,'💧 饮水槽加满!','#03a9f4');sfxWater();
    for(let i=0;i<12;i++){
        const bx=160+Math.random()*90,by=615;
        G.particles.push({x:bx,y:by,vx:(Math.random()-0.5)*2,vy:-2-Math.random(),life:30,maxLife:30,color:'#4fc3f7',text:'',size:2+Math.random()*2});
    }
}
function addToBreeding(r){
    if(G.breedingQueue.includes(r))return;
    if(r.sick){addPopup(r.x,r.y-30,'生病不能配种!','#ff5252');sfxBad();return;}
    if(r.hunger<40){addPopup(r.x,r.y-30,'太饿了不能配种!','#ff5252');sfxBad();return;}
    if(G.breedingQueue.length>=2){addPopup(r.x,r.y-30,'配种区已满!','#ff5252');sfxBad();return;}
    for(const s of G.cageSlots){if(s.rabbit===r)s.rabbit=null;}
    r.inBreed=true;
    G.breedingQueue.push(r);
    r.x=G.breedingZone.x+40+(G.breedingQueue.length-1)*100;
    r.y=G.breedingZone.y+G.breedingZone.h/2;
    r.mood='jump';r.moodTimer=120;r.bounce=0;
    addPopup(r.x,r.y-30,'💕 进入配种区','#e91e63');
    sfxBreed();
    if(G.breedingQueue.length===2){
        const a=G.breedingQueue[0],b=G.breedingQueue[1];
        if(a.gender!==b.gender){
            G.breedM=a.gender==='male'?a:b;
            G.breedF=a.gender==='female'?a:b;
            G.breedingActive=true;G.breedProgress=0;
        }else{
            addPopup(W/2,540,'同性不能繁殖!','#ff5252');sfxBad();
        }
    }
}
function tryUpgrade(type){
    if(type===1){
        if(G.coins<300){addPopup(W/2,300,'金币不足! (需300)','#ff5252');sfxBad();return}
        if(G.cageCount>=9){addPopup(W/2,300,'兔舍已到上限!','#ff5252');return;}
        G.coins-=300;G.cageCount++;
        initCages();
        let i=0;
        for(const s of G.cageSlots){
            if(i<G.rabbits.length&&!s.rabbit){
                s.rabbit=G.rabbits[i];
                G.rabbits[i].slot=s;
                G.rabbits[i].x=s.x+s.w/2;
                G.rabbits[i].y=s.y+s.h/2;
                i++;
            }
        }
        addPopup(W/2,200,'🔧 新增兔舍! +1位','#9c27b0');sfxUpgrade();
    }else if(type===2){
        if(G.coins<300){addPopup(W/2,300,'金币不足! (需300)','#ff5252');sfxBad();return}
        if(G.foodMax>=300){addPopup(W/2,300,'仓库已到上限!','#ff5252');return;}
        G.coins-=300;G.foodMax+=100;G.food+=50;
        addPopup(W/2,200,'📦 仓库扩大! +100容量','#9c27b0');sfxUpgrade();
    }else if(type===3){
        if(G.coins<300){addPopup(W/2,300,'金币不足! (需300)','#ff5252');sfxBad();return}
        if(G.upgradeLevel>=3){addPopup(W/2,300,'繁殖已加速到上限!','#ff5252');return;}
        G.coins-=300;G.upgradeLevel++;
        addPopup(W/2,200,'⚡ 繁殖加速! 等级+'+G.upgradeLevel,'#9c27b0');sfxUpgrade();
    }
    checkAchievements();
}
function sellRabbit(r){
    const value=40+Math.floor(r.weight/50)+(r.sick?-15:0);
    G.coins+=value;G.totalSold++;
    G.score+=value;
    for(const s of G.cageSlots){if(s.rabbit===r)s.rabbit=null;}
    const idx=G.rabbits.indexOf(r);if(idx>=0)G.rabbits.splice(idx,1);
    const qi=G.breedingQueue.indexOf(r);if(qi>=0)G.breedingQueue.splice(qi,1);
    addPopup(r.x,r.y-30,'💰 卖出! +'+value+'金','#ffd700');
    sfxSell();
    checkAchievements();
}
function sellAllRabbits(){
    const toSell=G.rabbits.slice();
    if(toSell.length===0){addPopup(W/2,100,'没有兔子可卖!','#ff5252');return;}
    for(const r of toSell)sellRabbit(r);
}

function updateWeather(){
    G.weatherTimer++;
    if(G.weatherTimer>25*60){
        G.weatherTimer=0;
        const cur=WEATHERS.indexOf(G.weather);
        G.weather=WEATHERS[(cur+1)%WEATHERS.length];
        if(G.weather==='rainy'){
            G.rainDrops=[];
            for(let i=0;i<80;i++)G.rainDrops.push({x:Math.random()*W,y:Math.random()*H,spd:6+Math.random()*4});
            sfxThunder();
        }
        addPopup(W/2,108,'天气变化: '+WEATHER_NAMES[G.weather],'#90caf9');
    }
    if(G.weather==='rainy'){
        for(const d of G.rainDrops){
            d.y+=d.spd;d.x-=1;
            if(d.y>H){d.y=-20;d.x=Math.random()*W;}
        }
        if(Math.random()<0.1)sfxRain();
        if(G.rabbits.length>0&&Math.random()<0.005){
            const r=G.rabbits[Math.floor(Math.random()*G.rabbits.length)];
            r.health=Math.max(0,r.health-0.5);
        }
    }
    if(G.weather==='sunny'){
        for(const r of G.rabbits)if(!r.sick&&Math.random()<0.01)r.health=Math.min(100,r.health+0.2);
    }
    for(const c of G.clouds){
        c.x+=c.spd*(G.weather==='rainy'?0.3:1);
        if(c.x>W+60)c.x=-60;
    }
}

function update(){
    if(G.state!==STATE_PLAYING||G.paused)return;
    G.timeLeft--;
    if(G.timeLeft<=0){endGame();return}
    if(G.showTutorial)G.tutorialTimer++;
    G.grassSway+=0.05;
    G.waterTimer--;
    if(G.waterTimer<=0){G.water=Math.max(0,G.water-15);G.waterTimer=5*60;
        if(G.water<=0)addPopup(W/2,100,'⚠ 饮水槽空了!','#03a9f4');
    }
    if(G.foodSaleActive){G.foodSaleTimer--;if(G.foodSaleTimer<=0){G.foodSaleActive=false;addPopup(W/2,100,'促销结束','#9e9e9e');}}
    else{G.foodSaleTimer--;if(G.foodSaleTimer<=0){G.foodSaleActive=true;G.foodSaleTimer=20*60;addPopup(W/2,100,'🎊 饲料半价20秒!','#4caf50');sfxBtn();}}
    G.sickEventTimer--;
    if(G.sickEventTimer<=0&&G.rabbits.length>0){
        const healthyR=G.rabbits.filter(r=>!r.sick);
        if(healthyR.length>0){
            const r=healthyR[Math.floor(Math.random()*healthyR.length)];
            if(r.health<60||Math.random()<0.4){
                r.sick=true;r.sickTimer=0;
                addPopup(r.x,r.y-40,'🤒 兔子生病了! 拖到空笼+20金治疗','#ff5252');
                sfxBad();
            }
        }
        G.sickEventTimer=350+Math.random()*450;
    }
    updateWeather();
    for(let i=G.butterflies.length-1;i>=0;i--){
        const b=G.butterflies[i];
        b.phase+=0.08;
        b.x+=Math.sin(b.phase)*b.spd;
        b.y+=Math.cos(b.phase*0.7)*0.6;
        if(b.x<-20)b.x=W+20;if(b.x>W+20)b.x=-20;
        if(b.y<160)b.y=160;if(b.y>540)b.y=540;
    }
    for(let i=G.carrotDrops.length-1;i>=0;i--){
        const d=G.carrotDrops[i];
        d.x+=d.vx;d.y+=d.vy;d.vy+=0.2;d.life--;
        if(d.life<=0)G.carrotDrops.splice(i,1);
    }
    for(let i=G.rabbits.length-1;i>=0;i--){
        const r=G.rabbits[i];
        r.age++;r.animTimer++;r.blink++;r.moodTimer--;
        if(r.moodTimer<=0){
            const moods=['idle','idle','idle','groom','jump','sleep'];
            r.mood=moods[Math.floor(Math.random()*moods.length)];
            r.moodTimer=60+Math.random()*120;
            r.bounce=0;r.yawn=0;
        }
        if(r.mood==='jump'){r.bounce+=0.2;}
        if(r.blink>150)r.blink=0;
        if(r.age%180===0){r.hunger=Math.max(0,r.hunger-4);r.health-=G.water<30?2:0.5;}
        if(r.hunger<30||G.water<20){r.health=Math.max(0,r.health-0.3);}
        if(r.sick){r.sickTimer++;r.health=Math.max(0,r.health-0.5);
            if(r.sickTimer>600){sellRabbit(r);G.sickDeathsThisGame++;addPopup(W/2,200,'💀 一只兔子病死了...','#ff5252');sfxBad();continue;}
        }
        if(r.health<=0){sellRabbit(r);G.sickDeathsThisGame++;addPopup(W/2,200,'💀 一只兔子病死了...','#ff5252');sfxBad();continue;}
        if(!G.dragging||G.dragging!==r){
            if(!r.inBreed&&r.slot){
                r.x=r.slot.x+r.slot.w/2+Math.sin(r.animTimer*0.05+r.id)*8;
                r.y=r.slot.y+r.slot.h/2+Math.cos(r.animTimer*0.07+r.id)*6-(r.mood==='jump'?Math.abs(Math.sin(r.bounce))*10:0);
            }else if(r.inBreed){
                r.y=G.breedingZone.y+G.breedingZone.h/2+Math.sin(r.animTimer*0.1)*4-(r.mood==='jump'?Math.abs(Math.sin(r.bounce))*8:0);
            }
        }
    }
    if(G.breedingActive&&G.breedM&&G.breedF){
        const speed=1+G.upgradeLevel*0.5;
        G.breedProgress+=speed;
        if(G.breedProgress>=30*60){
            const litter=2+Math.floor(Math.random()*4);
            addPopup(W/2,520,'🎊 生了'+litter+'只小兔!','#e91e63');
            sfxBorn();
            G.totalBreed+=litter;G.score+=litter*20;
            for(let i=0;i<litter;i++){
                G.babiesToSpawn.push({
                    gender:Math.random()<0.5?'male':'female',
                    timer:30+i*15,
                    color:G.breedF.color
                });
            }
            G.breedM.hunger=Math.max(0,G.breedM.hunger-20);
            G.breedF.hunger=Math.max(0,G.breedF.hunger-20);
            for(const r of G.breedingQueue){r.inBreed=false;
                let placed=false;
                for(const s of G.cageSlots){
                    if(!s.rabbit){
                        s.rabbit=r;r.slot=s;
                        r.x=s.x+s.w/2;r.y=s.y+s.h/2;placed=true;break;
                    }
                }
                if(!placed){r.x=G.breedingZone.x+90;r.y=G.breedingZone.y-30;}
            }
            G.breedingQueue=[];G.breedingActive=false;G.breedProgress=0;
            G.breedM=null;G.breedF=null;
            checkAchievements();
        }
    }
    for(let i=G.babiesToSpawn.length-1;i>=0;i--){
        const b=G.babiesToSpawn[i];b.timer--;
        if(b.timer<=0){
            let empty=null;
            for(const s of G.cageSlots){if(!s.rabbit){empty=s;break;}}
            if(empty){
                const colors=[{name:'白兔',c:'#fff',e:'#ffe0e0'},{name:'灰兔',c:'#bdbdbd',e:'#9e9e9e'},{name:'棕兔',c:'#a1887f',e:'#8d6e63'}];
                const co=colors[Math.floor(Math.random()*colors.length)];
                const r={id:++_bid,gender:b.gender,color:co,health:90,weight:400,age:0,hunger:90,
                    sick:false,sickTimer:0,slot:empty,
                    x:empty.x+empty.w/2,y:empty.y+empty.h/2,animTimer:Math.random()*100,
                    inBreed:false,breedPartner:null,breedTimer:0,breeding:false,babies:0,
                    mood:'idle',moodTimer:90,blink:0,yawn:0,bounce:0};
                empty.rabbit=r;G.rabbits.push(r);
                for(let j=0;j<8;j++)addParticle(r.x,r.y,r.color.c,null,-2-Math.random(),3);
                addPopup(r.x,r.y-35,'🐰 小兔+1','#e91e63');
            }
            G.babiesToSpawn.splice(i,1);
        }
    }
    checkAchievements();
    updateParticles();
}

function drawRabbit(ctx,r,small){
    const s=small?0.6:1;
    const blinkOn=r.blink>140&&r.blink<148;
    const by=r.mood==='sleep'?2:0;
    ctx.save();ctx.translate(r.x,r.y+by);ctx.scale(s,s);
    ctx.fillStyle='rgba(0,0,0,0.2)';
    ctx.beginPath();ctx.ellipse(0,28,22,5,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=r.color.c;
    const earRot=r.mood==='sleep'?0.4:0;
    ctx.save();ctx.translate(-14,-28);ctx.rotate(-0.2+earRot);
    ctx.beginPath();ctx.ellipse(0,0,6,16,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=r.color.e;ctx.beginPath();ctx.ellipse(0,0,3,11,0,0,Math.PI*2);ctx.fill();
    ctx.restore();
    ctx.save();ctx.translate(14,-28);ctx.rotate(0.2-earRot);
    ctx.beginPath();ctx.ellipse(0,0,6,16,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=r.color.e;ctx.beginPath();ctx.ellipse(0,0,3,11,0,0,Math.PI*2);ctx.fill();
    ctx.restore();
    ctx.fillStyle=r.color.c;
    ctx.beginPath();ctx.ellipse(0,0,25,22,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(0,-12,18,0,Math.PI*2);ctx.fill();
    if(r.mood==='groom'){
        ctx.fillStyle=r.color.c;
        const ga=r.animTimer*0.3;
        ctx.beginPath();ctx.arc(Math.cos(ga)*18,-18+Math.sin(ga)*6,5,0,Math.PI*2);ctx.fill();
    }
    if(r.mood==='sleep'||blinkOn){
        ctx.strokeStyle='#555';ctx.lineWidth=2;ctx.lineCap='round';
        ctx.beginPath();ctx.moveTo(-12,-15);ctx.quadraticCurveTo(-8,-12,-4,-15);ctx.stroke();
        ctx.beginPath();ctx.moveTo(4,-15);ctx.quadraticCurveTo(8,-12,12,-15);ctx.stroke();
    }else{
        ctx.fillStyle=r.gender==='male'?'#2196f3':'#e91e63';
        ctx.beginPath();ctx.arc(-8,-14,2.5,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.arc(8,-14,2.5,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-7,-15,0.9,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.arc(9,-15,0.9,0,Math.PI*2);ctx.fill();
    }
    ctx.fillStyle='#ff8a80';ctx.beginPath();ctx.arc(0,-6,2.5,0,Math.PI*2);ctx.fill();
    if(r.yawn>0||r.mood==='sleep'){
        ctx.fillStyle='#c62828';
        ctx.beginPath();ctx.ellipse(0,-1,3,r.yawn>0?r.yawn:3,0,0,Math.PI*2);ctx.fill();
    }
    ctx.strokeStyle='#666';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(-10,-4);ctx.lineTo(-20,-2);ctx.moveTo(-10,-2);ctx.lineTo(-20,0);ctx.moveTo(-10,0);ctx.lineTo(-20,2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(10,-4);ctx.lineTo(20,-2);ctx.moveTo(10,-2);ctx.lineTo(20,0);ctx.moveTo(10,0);ctx.lineTo(20,2);ctx.stroke();
    ctx.fillStyle=r.color.c;
    const legOff=r.mood==='jump'?Math.sin(r.bounce)*4:0;
    ctx.beginPath();ctx.arc(-10,22+legOff,5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(10,22-legOff,5,0,Math.PI*2);ctx.fill();
    if(r.mood==='eat'){
        ctx.font='14px Arial';ctx.textAlign='center';
        ctx.fillText('🥕',20,-8);
    }
    if(r.sick){
        ctx.font='20px Arial';ctx.textAlign='center';
        ctx.fillText('🤒',0,-48);
    }
    if(r.mood==='sleep'){
        ctx.font='14px Arial';ctx.textAlign='center';ctx.fillStyle='#7986cb';
        ctx.fillText('💤',20,-44);
    }
    ctx.fillStyle=r.hunger<30?'#ff5252':'#fff';
    ctx.font='12px Arial';ctx.textAlign='center';
    ctx.fillText((r.gender==='male'?'♂':'♀'),0,-46);
    ctx.textAlign='left';
    ctx.restore();
}

function drawButterflies(ctx){
    for(const b of G.butterflies){
        const flap=Math.abs(Math.sin(b.phase*2));
        ctx.save();ctx.translate(b.x,b.y);
        ctx.fillStyle=b.color;ctx.globalAlpha=0.85;
        ctx.beginPath();ctx.ellipse(-4*flap,0,6*flap+2,4,0,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.ellipse(4*flap,0,6*flap+2,4,0,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#333';
        ctx.beginPath();ctx.ellipse(0,0,1.5,4,0,0,Math.PI*2);ctx.fill();
        ctx.restore();
    }
    ctx.globalAlpha=1;
}
function drawFlowers(ctx){
    for(const f of G.flowers){
        const sway=Math.sin(G.grassSway+f.x*0.02)*2;
        ctx.strokeStyle='#388e3c';ctx.lineWidth=1.5;
        ctx.beginPath();ctx.moveTo(f.x,f.y+10);ctx.lineTo(f.x+sway,f.y+2);ctx.stroke();
        ctx.fillStyle=f.color;
        for(let i=0;i<5;i++){
            const a=(i/5)*Math.PI*2;
            ctx.beginPath();ctx.arc(f.x+sway+Math.cos(a)*f.size,f.y+Math.sin(a)*f.size,f.size*0.7,0,Math.PI*2);ctx.fill();
        }
        ctx.fillStyle='#ffeb3b';
        ctx.beginPath();ctx.arc(f.x+sway,f.y,f.size*0.6,0,Math.PI*2);ctx.fill();
    }
}
function drawCloud(ctx,cx,cy,s,color){
    ctx.fillStyle=color;ctx.globalAlpha=G.weather==='sunny'?0.95:0.75;
    ctx.beginPath();
    ctx.arc(cx,cy,15*s,0,Math.PI*2);
    ctx.arc(cx+15*s,cy-5*s,18*s,0,Math.PI*2);
    ctx.arc(cx+35*s,cy,16*s,0,Math.PI*2);
    ctx.arc(cx+20*s,cy+8*s,14*s,0,Math.PI*2);
    ctx.fill();
    ctx.globalAlpha=1;
}

function drawScene(ctx){
    let topColor,botColor;
    switch(G.weather){
        case 'sunny':topColor='#81c784';botColor='#a5d6a7';break;
        case 'cloudy':topColor='#90a4ae';botColor='#b0bec5';break;
        case 'rainy':topColor='#546e7a';botColor='#78909c';break;
        case 'sunset':topColor='#ff8a65';botColor='#ffab91';break;
    }
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,topColor);g.addColorStop(0.5,botColor);g.addColorStop(1,'#c5e1a5');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    if(G.weather==='sunset'){
        ctx.fillStyle='rgba(255,112,67,0.4)';
        ctx.beginPath();ctx.arc(W-80,80,50,0,Math.PI*2);ctx.fill();
    }else if(G.weather==='sunny'){
        ctx.fillStyle='#ffeb3b';ctx.globalAlpha=0.9;
        ctx.beginPath();ctx.arc(70,60,32,0,Math.PI*2);ctx.fill();
        ctx.globalAlpha=0.3;
        for(let i=0;i<10;i++){
            const a=(i/10)*Math.PI*2;
            ctx.strokeStyle='#ffd54f';ctx.lineWidth=3;
            ctx.beginPath();ctx.moveTo(70+Math.cos(a)*40,60+Math.sin(a)*40);
            ctx.lineTo(70+Math.cos(a)*52,60+Math.sin(a)*52);ctx.stroke();
        }
        ctx.globalAlpha=1;
    }
    for(const c of G.clouds)drawCloud(ctx,c.x,c.y,c.s,G.weather==='rainy'?'#607d8b':(G.weather==='sunset'?'#ffccbc':'#fff'));
    if(G.weather==='rainy'){
        ctx.strokeStyle='#81d4fa';ctx.lineWidth=1.2;ctx.globalAlpha=0.65;
        for(const d of G.rainDrops){
            ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(d.x-2,d.y+10);ctx.stroke();
        }
        ctx.globalAlpha=1;
    }
    drawFlowers(ctx);
    ctx.fillStyle='rgba(139,119,101,0.15)';
    for(let i=0;i<30;i++){
        const x=(i*83+G.timeLeft*0.3)%W,y=200+(i*47)%(H-200);
        ctx.beginPath();ctx.arc(x,y,3+(i%3),0,Math.PI*2);ctx.fill();
    }
    ctx.fillStyle='#5d4037';
    roundRect(ctx,15,155,G.cageCount<=6?W-30:W-30,340,14);ctx.fill();
    for(const s of G.cageSlots){
        const ix=s.x,iy=s.y,iw=s.w,ih=s.h;
        ctx.fillStyle='#d7ccc8';
        roundRect(ctx,ix,iy,iw,ih,10);ctx.fill();
        ctx.fillStyle='rgba(139,195,74,0.08)';
        for(let gy=iy+8;gy<iy+ih-8;gy+=6){
            for(let gx=ix+8;gx<ix+iw-8;gx+=10){
                if((gx+gy)%17<3){
                    ctx.fillRect(gx,gy+Math.sin(G.grassSway+gx*0.05)*1,1,4);
                }
            }
        }
        ctx.strokeStyle='#6d4c41';ctx.lineWidth=2;
        roundRect(ctx,ix,iy,iw,ih,10);ctx.stroke();
        ctx.strokeStyle='rgba(109,76,65,0.4)';ctx.lineWidth=1;
        for(let xi=ix+12;xi<ix+iw-5;xi+=14){ctx.beginPath();ctx.moveTo(xi,iy+5);ctx.lineTo(xi,iy+ih-5);ctx.stroke();}
        for(let yi=iy+12;yi<iy+ih-5;yi+=14){ctx.beginPath();ctx.moveTo(ix+5,yi);ctx.lineTo(ix+iw-5,yi);ctx.stroke();}
        ctx.fillStyle='#5d4037';ctx.font='bold 11px "Microsoft YaHei"';
        ctx.textAlign='center';
        ctx.fillText('兔舍#'+(s.id+1),ix+iw/2,iy+ih-4);
        ctx.textAlign='left';
    }
    drawButterflies(ctx);
    const bz=G.breedingZone;
    ctx.fillStyle=G.breedingActive?'rgba(233,30,99,0.25)':'rgba(255,152,0,0.2)';
    roundRect(ctx,bz.x,bz.y,bz.w,bz.h,12);ctx.fill();
    ctx.fillStyle='rgba(255,193,7,0.12)';
    for(let i=0;i<15;i++){
        ctx.beginPath();ctx.arc(bz.x+20+Math.random()*(bz.w-40),bz.y+20+Math.random()*(bz.h-40),2+Math.random()*3,0,Math.PI*2);ctx.fill();
    }
    ctx.strokeStyle=G.breedingActive?'#e91e63':'#ff9800';ctx.lineWidth=3;ctx.setLineDash(G.breedingActive?[]:[6,4]);
    roundRect(ctx,bz.x,bz.y,bz.w,bz.h,12);ctx.stroke();ctx.setLineDash([]);
    ctx.font='bold 14px "Microsoft YaHei"';ctx.fillStyle=G.breedingActive?'#c2185b':'#e65100';
    ctx.textAlign='center';
    ctx.fillText('💕 配种区 (拖2只异性兔子)',bz.x+bz.w/2,bz.y-8);
    if(G.breedingActive){
        ctx.fillStyle='rgba(0,0,0,0.3)';
        roundRect(ctx,bz.x+15,bz.y+bz.h-16,bz.w-30,10,5);ctx.fill();
        ctx.fillStyle='#e91e63';
        roundRect(ctx,bz.x+15,bz.y+bz.h-16,(bz.w-30)*(G.breedProgress/(30*60)),10,5);ctx.fill();
        ctx.font='10px Arial';ctx.fillStyle='#fff';
        ctx.textAlign='center';ctx.fillText(Math.ceil(G.breedProgress/60)+'/30s',bz.x+bz.w/2,bz.y+bz.h-7);
    }
    ctx.textAlign='left';
    ctx.fillStyle='#ffe082';
    roundRect(ctx,20,595,110,40,10);ctx.fill();
    ctx.strokeStyle='#ff8f00';ctx.lineWidth=2;roundRect(ctx,20,595,110,40,10);ctx.stroke();
    ctx.fillStyle='#5d4037';ctx.font='12px "Microsoft YaHei"';
    ctx.textAlign='center';
    ctx.fillText('🥕 饲料仓',75,612);
    ctx.fillStyle='#333';ctx.fillRect(32,620,86,8);
    ctx.fillStyle='#8bc34a';ctx.fillRect(32,620,86*(G.food/G.foodMax),8);
    ctx.font='9px Arial';ctx.fillStyle='#fff';ctx.textAlign='right';
    ctx.fillText(G.food+'/'+G.foodMax,115,627);
    ctx.fillStyle='#b3e5fc';
    roundRect(ctx,150,595,110,40,10);ctx.fill();
    ctx.strokeStyle='#0277bd';ctx.lineWidth=2;roundRect(ctx,150,595,110,40,10);ctx.stroke();
    ctx.fillStyle='#01579b';ctx.font='12px "Microsoft YaHei"';
    ctx.textAlign='center';
    ctx.fillText('💧 饮水槽',205,612);
    ctx.fillStyle='#333';ctx.fillRect(162,620,86,8);
    ctx.fillStyle='#03a9f4';ctx.fillRect(162,620,86*(G.water/G.waterMax),8);
    ctx.font='9px Arial';ctx.fillStyle='#fff';ctx.textAlign='right';
    ctx.fillText(G.water+'/'+G.waterMax,245,627);
    if(G.foodSaleActive){
        ctx.fillStyle='#ff5252';ctx.font='bold 12px "Microsoft YaHei"';
        ctx.textAlign='center';
        ctx.fillText('🎊 饲料半价中!',75,588);
    }
    ctx.textAlign='left';
    for(const d of G.carrotDrops){
        ctx.globalAlpha=d.life/30;
        ctx.font='16px Arial';ctx.fillText('🥕',d.x,d.y);
    }
    ctx.globalAlpha=1;
}

function drawAchievementToast(ctx){
    if(G.achievementQueue.length===0)return;
    const a=G.achievementQueue[0];
    const t=G.achievementQueue._t||0;
    G.achievementQueue._t=t+1;
    let alpha=1;
    if(t<20)alpha=t/20;
    if(t>160)alpha=Math.max(0,(180-t)/20);
    if(t>180){G.achievementQueue.shift();G.achievementQueue._t=0;return;}
    ctx.globalAlpha=alpha;
    const y=130+Math.sin(t*0.15)*3;
    ctx.fillStyle='rgba(255,215,0,0.95)';
    roundRect(ctx,W/2-140,y,280,46,10);ctx.fill();
    ctx.strokeStyle='#ff8f00';ctx.lineWidth=2;
    roundRect(ctx,W/2-140,y,280,46,10);ctx.stroke();
    ctx.font='bold 15px "Microsoft YaHei"';ctx.fillStyle='#5d4037';ctx.textAlign='center';
    ctx.fillText('🏆 成就解锁: '+a.icon+' '+a.name,W/2,y+22);
    ctx.font='10px "Microsoft YaHei"';ctx.fillStyle='#6d4c41';
    ctx.fillText(a.desc+'  +50分',W/2,y+38);
    ctx.textAlign='left';
    ctx.globalAlpha=1;
}

function checkHoverInfo(p){
    G.hoverRabbit=null;
    if(G.state!==STATE_PLAYING)return;
    for(const r of G.rabbits){
        const dx=p.x-r.x,dy=p.y-r.y;
        if(Math.hypot(dx,dy)<40){G.hoverRabbit=r;break;}
    }
}

function drawMenu(ctx){
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#5d4037');g.addColorStop(1,'#3e2723');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(139,195,74,0.1)';

        ctx.beginPath();ctx.arc(Math.random()*W,Math.random()*H,2+Math.random()*3,0,Math.PI*2);ctx.fill();
    }
    for(const f of G.flowers){
        const sway=Math.sin(G.grassSway+f.x*0.02)*2;
        ctx.fillStyle=f.color;ctx.globalAlpha=0.5;
        for(let i=0;i<5;i++){
            const a=(i/5)*Math.PI*2;

        }
        ctx.globalAlpha=1;
    }
    ctx.save();ctx.translate(W/2,210);
    const sc=1.6+Math.sin(Date.now()/500)*0.06;ctx.scale(sc,sc);
    ctx.font='80px Arial';ctx.textAlign='center';ctx.fillText('🐰🐇',0,0);
    ctx.restore();
    ctx.fillStyle='#ffcc80';ctx.font='bold 46px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.fillText('兔子农场',W/2,310);
    ctx.fillStyle='#fff';ctx.font='18px "Microsoft YaHei"';
    ctx.fillText('120秒内繁殖尽可能多的兔子!',W/2,340);
    ctx.fillStyle='#ffd700';ctx.font='bold 17px "Microsoft YaHei"';
    ctx.fillText('🌟 最高分: '+G.highScore,W/2,375);
    drawBtn(ctx,W/2-100,405,200,60,'开始经营','start','#ff9800');
    ctx.fillStyle='#fff';ctx.font='13px "Microsoft YaHei"';
    let yy=490;
    const tips=['📋 玩法说明：','• 花50金币购买兔子(随机性别)','• 每15秒需加水,喂食每只10金(促销半价)','• 拖1雄1雌兔子到【配种区】繁殖','• 小兔可长大卖出,生病要花20金治疗','• 花300金升级:扩笼/扩仓/加速繁殖','• 天气变化: 晴天恢复健康 雨天可能生病','• 最终得分:金币+兔子总数价值+成就'];
    for(const t of tips){ctx.fillText(t,W/2,yy);yy+=20;}
    ctx.fillStyle='#ffd700';ctx.font='bold 12px "Microsoft YaHei"';
    ctx.fillText('空格/回车=开始  Esc=暂停  1/2/3/4/5=快捷  鼠标拖动兔子',W/2,yy+15);
    ctx.textAlign='left';
}

function drawPause(ctx){
    ctx.fillStyle='rgba(0,0,0,0.78)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 48px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.fillText('⏸ 暂停中',W/2,H/2-60);
    drawBtn(ctx,W/2-90,H/2-20,180,55,'▶ 继续游戏','resume','#ff9800');
    drawBtn(ctx,W/2-70,H/2+50,140,45,'← 返回菜单','quit','#757575');
    ctx.textAlign='left';
}

function drawGameOver(ctx){
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#5d4037');g.addColorStop(1,'#3e2723');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fillRect(0,0,W,H);
    const isNew=G.score>=G.highScore&&G.score>0;
    ctx.fillStyle=isNew?'#ffd700':'#fff';ctx.font='bold 40px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.fillText(isNew?'🎉 新纪录!':'⏱ 时间到!',W/2,100);
    ctx.font='55px Arial';ctx.fillText('🐰',W/2,170);
    ctx.fillStyle='#fff';ctx.font='bold 20px "Microsoft YaHei"';
    ctx.fillText('本期农场经营总结',W/2,210);
    ctx.fillStyle='rgba(255,255,255,0.1)';
    roundRect(ctx,35,235,W-70,240,14);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=2;
    roundRect(ctx,35,235,W-70,240,14);ctx.stroke();
    let yy=265;
    ctx.fillStyle='#ddd';ctx.font='14px "Microsoft YaHei"';ctx.textAlign='left';
    const stats=[
        ['🐰 现有兔子数',G.rabbits.length+'只'],
        ['💰 剩余金币',G.coins+'金'],
        ['🛒 累计卖出',G.totalSold+'只'],
        ['💕 成功繁殖',G.totalBreed+'只'],
        ['⚡ 升级等级','Lv.'+G.upgradeLevel],
        ['🤒 生病死亡',G.sickDeathsThisGame+'只'],
        ['🏆 解锁成就',G.achievements.filter(a=>a.unlocked).length+'/'+G.achievements.length]
    ];
    for(const [k,v] of stats){
        ctx.fillStyle='#bbb';ctx.fillText(k,60,yy);
        ctx.fillStyle='#fff';ctx.textAlign='right';ctx.fillText(v,W-60,yy);
        ctx.textAlign='left';yy+=22;
    }
    yy+=8;
    ctx.fillStyle='#888';ctx.font='11px "Microsoft YaHei"';ctx.fillText('已解锁成就:',60,yy);yy+=16;
    let acc=60;
    for(const a of G.achievements){
        if(a.unlocked){
            ctx.font='14px Arial';ctx.fillStyle='#ffd700';
            ctx.fillText(a.icon,acc,yy+4);
            acc+=18;
        }
    }
    yy+=18;
    ctx.fillStyle='#ffd700';ctx.font='bold 32px Arial';ctx.textAlign='center';
    ctx.fillText('总分: '+G.score,W/2,yy+12);
    yy+=45;
    ctx.fillStyle='#aaa';ctx.font='13px "Microsoft YaHei"';
    ctx.fillText('历史最高: '+G.highScore,W/2,yy+5);
    drawBtn(ctx,W/2-95,yy+25,190,55,'🔄 再玩一次','restart','#ff9800');
    drawBtn(ctx,W/2-80,yy+90,160,45,'🏠 返回菜单','menu','#757575');
    ctx.textAlign='left';
}

function draw(){
    switch(G.state){
        case STATE_MENU:drawMenu(ctx);break;
        case STATE_PLAYING:
            drawScene(ctx);
            drawFarmDecorations(ctx);
            for(const r of G.rabbits)if(!G.dragging||G.dragging!==r)drawRabbit(ctx,r);
            if(G.dragging)drawRabbit(ctx,G.dragging);
            drawParticles(ctx);
            drawRabbitInfoTip(ctx);
            drawHUD(ctx);
            drawActionBtns(ctx);
            drawAchievementToast(ctx);
            drawTutorial(ctx);
            drawAchievementPanel(ctx);
            break;
        case STATE_PAUSE:
            drawScene(ctx);
            drawFarmDecorations(ctx);
            for(const r of G.rabbits)drawRabbit(ctx,r);
            drawHUD(ctx);
            drawActionBtns(ctx);
            drawPause(ctx);
            break;
        case STATE_OVER:drawGameOver(ctx);break;
    }
}

setInterval(function(){update();draw();},16);

const _sbtn=document.getElementById('start-game-btn');
_sbtn.addEventListener('click',function(){initAudio();startGame();this.style.display='none';});

})();
</script>

      c.style.maxWidth = '100%';

        c.width = pw;

    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {

  }

})();

<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
