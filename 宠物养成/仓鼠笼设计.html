<body>

<button id="start-game-btn" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:20px 40px;font-size:20px;background:#ff9800;color:white;border:none;border-radius:12px;cursor:pointer;z-index:999;font-weight:bold;">开始游戏</button>

<canvas id="c"></canvas>

<script>
if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
</script>
<script src="../game_core.js"></script>
<script>
(function(){
"use strict";

const W=480,H=720;
const PREP_TIME=120;
const RUN_TIME=20;
const GRID_COLS=8,GRID_ROWS=6;
const CELL=52;
const GRID_X=165,GRID_Y=170;

const FURNITURE_TYPES=[
    {id:0,name:'跑轮',icon:'🎡',price:60,happiness:25,color:'#e91e63',size:{w:1,h:1},tag:'wheel',desc:'仓鼠最爱运动'},
    {id:1,name:'隧道',icon:'🕳️',price:50,happiness:20,color:'#795548',size:{w:1,h:1},tag:'tunnel',desc:'钻来钻去真有趣'},
    {id:2,name:'木屋',icon:'🏠',price:80,happiness:30,color:'#5d4037',size:{w:2,h:1},tag:'house',desc:'温暖的小窝'},
    {id:3,name:'吊床',icon:'🛏️',price:55,happiness:22,color:'#9c27b0',size:{w:1,h:1},tag:'bed',desc:'柔软的休息地'},
    {id:4,name:'食盆',icon:'🍽️',price:30,happiness:15,color:'#ff9800',size:{w:1,h:1},tag:'food',desc:'(必需品)美味食物'},
    {id:5,name:'水壶',icon:'🚰',price:30,happiness:15,color:'#2196f3',size:{w:1,h:1},tag:'water',desc:'(必需品)饮用水'},
    {id:6,name:'秋千',icon:'🎠',price:70,happiness:28,color:'#4caf50',size:{w:1,h:1},tag:'swing',desc:'摇来摇去好惬意'},
    {id:7,name:'浴室',icon:'🛁',price:45,happiness:18,color:'#00bcd4',size:{w:1,h:1},tag:'bath',desc:'仓鼠爱清洁'}
];

const ACHIEVEMENTS=[
    {id:'first_design',name:'初次设计',desc:'完成第一份仓鼠笼设计',icon:'✨',unlocked:false},
    {id:'budget_master',name:'预算大师',desc:'剩余预算≥200金同时完成',icon:'💰',need:200,unlocked:false},
    {id:'furniture_full',name:'满满当当',desc:'放置≥12件家具',icon:'🏠',need:12,unlocked:false},
    {id:'flow_perfect',name:'动线大师',desc:'两项动线规则全部符合',icon:'📐',unlocked:false},
    {id:'happy_ham',name:'幸福仓鼠',desc:'仓鼠幸福度≥200',icon:'🐹',need:200,unlocked:false},
    {id:'visitor_pro',name:'访问达人',desc:'仓鼠累计访问≥15次',icon:'🚶',need:15,unlocked:false},
    {id:'all_tags',name:'家具收藏家',desc:'8种家具各至少1件',icon:'🎁',unlocked:false},
    {id:'record_break',name:'打破纪录',desc:'达成新的最高分',icon:'🏆',unlocked:false}
];

const TIMES=['day','sunset','night'];
const TIME_NAMES={day:'☀️白天',sunset:'🌇黄昏',night:'🌙夜晚'};

let audioCtx=null;
function initAudio(){
    if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
}
function playTone(freq,dur,type,vol){
    if(!audioCtx)return;
    try{
        const o=audioCtx.createOscillator();
        const g=audioCtx.createGain();
        o.type=type||'sine';
        o.frequency.value=freq;
        g.gain.value=vol||0.1;
        g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
        o.connect(g);g.connect(audioCtx.destination);
        o.start();o.stop(audioCtx.currentTime+dur);
    }catch(e){}
}
function sfxBuy(){playTone(700,0.08,'sine',0.12)}
function sfxPlace(){playTone(500,0.06,'sine',0.15);setTimeout(()=>playTone(800,0.06,'sine',0.12),50)}
function sfxRemove(){playTone(350,0.1,'square',0.1)}
function sfxRun(){playTone(900,0.04,'triangle',0.08)}
function sfxUse(){playTone(600,0.05,'sine',0.1);setTimeout(()=>playTone(900,0.08,'sine',0.1),60)}
function sfxCheck(){playTone(520,0.06,'sine',0.15);setTimeout(()=>playTone(780,0.12,'sine',0.15),80)}
function sfxBuzzer(){playTone(150,0.4,'sawtooth',0.18)}
function sfxBtn(){playTone(600,0.06,'sine',0.1)}
function sfxBad(){playTone(220,0.18,'square',0.12)}
function sfxAchievement(){playTone(523,0.08,'sine',0.15);setTimeout(()=>playTone(659,0.08,'sine',0.15),90);setTimeout(()=>playTone(784,0.12,'sine',0.15),180);setTimeout(()=>playTone(1047,0.2,'sine',0.15),270)}
function sfxEat(){playTone(300,0.03,'square',0.08);setTimeout(()=>playTone(250,0.03,'square',0.07),50)}
function sfxBath(){for(let i=0;i<5;i++)setTimeout(()=>playTone(1500+Math.random()*500,0.02,'sine',0.05),i*30)}
function sfxSleep(){playTone(180,0.1,'sine',0.06);setTimeout(()=>playTone(150,0.15,'sine',0.05),120)}

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let scale=1;
function resize(){
    const r=W/H;
    let cw=window.innerWidth,ch=window.innerHeight;
    if(cw/ch>r){ch=cw/r}else{cw=ch*r}
    canvas.width=cw;canvas.height=ch;
    scale=cw/W;
    ctx.setTransform(scale,0,0,scale,0,0);
}
window.addEventListener('resize',resize);resize();

let _fid=0;
function createFurniture(typeId,gx,gy){
    const t=FURNITURE_TYPES[typeId];
    return{id:++_fid,typeId:typeId,type:t,gx:gx,gy:gy,used:0,hover:false,anim:0};
}

const G={
    state:STATE_MENU,score:0,highScore:0,timeLeft:PREP_TIME*60,
    phase:'prep',
    budget:500,budgetLeft:500,
    grid:[],placed:[],
    selected:null,
    dragging:null,dragOffset:null,
    hamster:{x:0,y:0,tx:0,ty:0,facing:1,step:0,using:null,useTimer:0,target:null,mood:0,happy:0,
            totalVisits:0,visited:{},path:[]},
    particles:[],popups:[],btnRects:{},
    keys:{},paused:false,
    happyScore:0,detailScore:null,
    bestLayout:Storage.load('cslj_bestlayout','0'),
    achievements:ACHIEVEMENTS.map(a=>({...a})),achievementQueue:[],
    timeOfDay:'day',timeTimer:0,
    shavings:[],sparkles:[],bubbles:[],hearts:[],zzzs:[],
    achPanel:false,tutorialStep:0,showTutorial:true,tutorialTimer:0,
    wheelSpins:0,swingSwings:0,tunnelDigs:0,naps:0,meals:0,drinks:0,bathCount:0
};

for(let i=0;i<30;i++)G.shavings.push({x:Math.random()*(GRID_COLS*CELL)+GRID_X,y:Math.random()*(GRID_ROWS*CELL)+GRID_Y,col:['#fff3e0','#ffe0b2','#ffcc80'][Math.floor(Math.random()*3)],s:1+Math.random()*2});
for(let i=0;i<18;i++)G.sparkles.push({x:GRID_X+Math.random()*GRID_COLS*CELL,y:GRID_Y+Math.random()*GRID_ROWS*CELL,phase:Math.random()*Math.PI*2,col:['#ffd700','#ff9800','#e91e63','#9c27b0'][Math.floor(Math.random()*4)]});

G.highScore=parseInt(Storage.load('cslj_highscore','0'));

function initGrid(){
    G.grid=[];
    for(let r=0;r<GRID_ROWS;r++){
        G.grid[r]=[];
        for(let c=0;c<GRID_COLS;c++)G.grid[r][c]=null;
    }
}

function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
}
function drawBtn(ctx,x,y,w,h,text,name,color,sub){
    G.btnRects[name]={x:x,y:y,w:w,h:h};
    ctx.fillStyle=color||'#ff9800';
    ctx.strokeStyle='rgba(255,255,255,0.5)';
    ctx.lineWidth=2;
    roundRect(ctx,x,y,w,h,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#fff';
    ctx.font='bold 14px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(text,x+w/2,y+h/2-(sub?6:0));
    if(sub){ctx.font='10px "Microsoft YaHei"';ctx.fillStyle='rgba(255,255,255,0.85)';ctx.fillText(sub,x+w/2,y+h/2+12);}
    ctx.textBaseline='alphabetic';ctx.textAlign='left';
}
function hitBtn(p,name){
    const r=G.btnRects[name];
    return r&&p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;
}
function getPos(e){
    const rect=canvas.getBoundingClientRect();
    const t=e.touches?e.touches[0]:(e.changedTouches?e.changedTouches[0]:e);
    if(!t)return{x:0,y:0};
    return{x:(t.clientX-rect.left)/scale,y:(t.clientY-rect.top)/scale};
}
function addParticle(x,y,color,text,vy,size){
    G.particles.push({x:x,y:y,vx:(Math.random()-0.5)*3.5,vy:vy||-2,life:40,maxLife:40,color:color,text:text,size:size||3+Math.random()*3});
}
function addPopup(x,y,text,color){
    G.popups.push({x:x,y:y,text:text,color:color||'#fff',life:55,maxLife:55,vy:-1.1});
}
function updateParticles(){
    for(let i=G.particles.length-1;i>=0;i--){
        const p=G.particles[i];
        p.x+=p.vx;p.y+=p.vy;p.vy+=0.13;p.life--;
        if(p.life<=0)G.particles.splice(i,1);
    }
    for(let i=G.popups.length-1;i>=0;i--){
        const p=G.popups[i];
        p.y+=p.vy;p.life--;
        if(p.life<=0)G.popups.splice(i,1);
    }
}
function drawParticles(ctx){
    for(const p of G.particles){
        ctx.globalAlpha=p.life/p.maxLife;
        if(p.text){ctx.fillStyle=p.color;ctx.font='bold 15px Arial';ctx.textAlign='center';ctx.fillText(p.text,p.x,p.y);ctx.textAlign='left';}
        else{ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();}
    }
    ctx.globalAlpha=1;
    for(const p of G.popups){
        ctx.globalAlpha=p.life/p.maxLife;
        ctx.fillStyle=p.color;
        ctx.font='bold 15px "Microsoft YaHei"';ctx.textAlign='center';
        ctx.fillText(p.text,p.x,p.y);ctx.textAlign='left';
    }
    ctx.globalAlpha=1;
}
function getCellAt(x,y){
    const gx=Math.floor((x-GRID_X)/CELL);
    const gy=Math.floor((y-GRID_Y)/CELL);
    if(gx<0||gx>=GRID_COLS||gy<0||gy>=GRID_ROWS)return null;
    return{gx:gx,gy:gy};
}
function canPlace(typeId,gx,gy){
    const t=FURNITURE_TYPES[typeId];
    const w=t.size.w,h=t.size.h;
    if(gx<0||gy<0||gx+w>GRID_COLS||gy+h>GRID_ROWS)return false;
    for(let r=gy;r<gy+h;r++)for(let c=gx;c<gx+w;c++)if(G.grid[r][c]!==null)return false;
    return true;
}
function placeFurniture(typeId,gx,gy){
    const t=FURNITURE_TYPES[typeId];
    if(!canPlace(typeId,gx,gy))return false;
    if(G.budgetLeft<t.price){addPopup(W/2,100,'预算不足!','#ff5252');sfxBad();return false;}
    const f=createFurniture(typeId,gx,gy);
    for(let r=gy;r<gy+t.size.h;r++)for(let c=gx;c<gx+t.size.w;c++)G.grid[r][c]=f;
    G.placed.push(f);
    G.budgetLeft-=t.price;
    const cx=GRID_X+gx*CELL+(t.size.w*CELL)/2,cy=GRID_Y+gy*CELL+(t.size.h*CELL)/2;
    for(let i=0;i<8;i++)addParticle(cx,cy,t.color,null,-1.5-Math.random()*2,3);
    addPopup(cx,cy-20,'+'+t.name,t.color);
    sfxPlace();return true;
}
function removeFurniture(f){
    const t=f.type;
    for(let r=f.gy;r<f.gy+t.size.h;r++)for(let c=f.gx;c<f.gx+t.size.w;c++)G.grid[r][c]=null;
    const idx=G.placed.indexOf(f);if(idx>=0)G.placed.splice(idx,1);
    const refund=Math.floor(t.price*0.7);
    G.budgetLeft+=refund;
    const cx=GRID_X+f.gx*CELL+(t.size.w*CELL)/2,cy=GRID_Y+f.gy*CELL+(t.size.h*CELL)/2;
    addPopup(cx,cy-20,'-'+t.name+' +'+refund+'金(70%)','#ff9800');
    sfxRemove();
}
function checkFlowLines(){
    let ok=true;
    const food=G.placed.find(f=>f.type.tag==='food');
    const water=G.placed.find(f=>f.type.tag==='water');
    const wheel=G.placed.find(f=>f.type.tag==='wheel');
    const house=G.placed.find(f=>f.type.tag==='house');
    let c1=false,c2=false;
    if(food&&water){
        const dx=Math.abs(food.gx-water.gx),dy=Math.abs(food.gy-water.gy);
        if(Math.max(dx,dy)<=2)c1=true;
    }
    if(wheel&&house){
        const dx=Math.abs(wheel.gx-house.gx),dy=Math.abs(wheel.gy-house.gy);
        if(Math.max(dx,dy)<=3)c2=true;
    }
    return{c1:c1,c2:c2,hasFood:!!food,hasWater:!!water};
}

function unlockAchievement(id){
    const a=G.achievements.find(x=>x.id===id);
    if(!a||a.unlocked)return;
    a.unlocked=true;G.achievementQueue.push(a);sfxAchievement();G.score+=50;
    for(let i=0;i<15;i++){const ang=Math.random()*Math.PI*2;addParticle(W/2,250,'#ffd700','✨',Math.cos(ang)*2,Math.sin(ang)*2-1,3);}
}
function checkAchievements(){
    if(G.phase==='run'||G.state===STATE_OVER){
        unlockAchievement('first_design');
        if(G.budgetLeft>=200)unlockAchievement('budget_master');
        if(G.placed.length>=12)unlockAchievement('furniture_full');
        const fl=checkFlowLines();if(fl.c1&&fl.c2)unlockAchievement('flow_perfect');
        if(G.hamster.happy>=200)unlockAchievement('happy_ham');
        if(G.hamster.totalVisits>=15)unlockAchievement('visitor_pro');
        const tagSet=new Set(G.placed.map(f=>f.type.tag));
        if(tagSet.size>=FURNITURE_TYPES.length)unlockAchievement('all_tags');
    }
}

window.addEventListener('keydown',function(e){
    G.keys[e.key.toLowerCase()]=true;
    if(e.key===' '||e.key==='Enter'){
        e.preventDefault();initAudio();
        if(G.state===STATE_MENU){startGame();return}
        if(G.state===STATE_OVER){startGame();return}
        if(G.state===STATE_PLAYING&&G.phase==='prep'){startRunPhase();return}
    }
    if(e.key==='Escape'){
        if(G.state===STATE_PLAYING)togglePause();
        else if(G.achPanel)G.achPanel=false;
    }
    if(G.state===STATE_PLAYING&&!G.paused&&G.phase==='prep'){
        const n=parseInt(e.key);
        if(n>=1&&n<=8){tryBuy(n-1)}
        if(e.key.toLowerCase()==='r'){startRunPhase()}
        if(e.key==='2'){G.achPanel=!G.achPanel;sfxBtn();}
    }
    initAudio();
});
window.addEventListener('keyup',function(e){G.keys[e.key.toLowerCase()]=false});

function handlePointerDown(e){
    initAudio();
    const p=getPos(e);
    if(G.state===STATE_MENU){if(hitBtn(p,'start')){startGame();return}}
    else if(G.state===STATE_OVER){
        if(hitBtn(p,'restart')){startGame();return}
        if(hitBtn(p,'menu')){G.state=STATE_MENU;return}
    }else if(G.state===STATE_PAUSE){
        if(hitBtn(p,'resume')){togglePause();return}
        if(hitBtn(p,'quit')){G.state=STATE_MENU;return}
    }else if(G.state===STATE_PLAYING&&!G.paused){
        if(G.showTutorial&&G.tutorialStep<6){
            G.tutorialStep++;G.tutorialTimer=0;if(G.tutorialStep>=6)G.showTutorial=false;
            sfxBtn();return;
        }
        if(G.achPanel){if(hitBtn(p,'achClose')){G.achPanel=false;sfxBtn();return}return;}
        if(hitBtn(p,'achBtn')){G.achPanel=!G.achPanel;sfxBtn();return;}
        if(G.phase==='prep'){
            if(hitBtn(p,'runNow')){startRunPhase();return}
            if(hitBtn(p,'clearAll')){clearAll();return}
            for(let i=0;i<FURNITURE_TYPES.length;i++){
                if(hitBtn(p,'item_'+i)){tryBuy(i);return}
            }
            for(const f of G.placed){
                const t=f.type;
                const x=GRID_X+f.gx*CELL,y=GRID_Y+f.gy*CELL;
                const w=t.size.w*CELL,h=t.size.h*CELL;
                if(p.x>=x&&p.x<=x+w&&p.y>=y&&p.y<=y+h){
                    G.dragging=f;
                    G.dragOffset={x:p.x-x,y:p.y-y};
                    removeFurniture(f);
                    return;
                }
            }
            if(G.selected!==null){
                const cell=getCellAt(p.x,p.y);
                if(cell)placeFurniture(G.selected,cell.gx,cell.gy);
                G.selected=null;
            }
        }
    }
}
function handlePointerMove(e){
    if(G.state!==STATE_PLAYING||G.paused)return;
    const p=getPos(e);
    if(G.dragging){
        const t=G.dragging.type;
        G.dragging.gx=Math.floor((p.x-G.dragOffset.x-GRID_X)/CELL);
        G.dragging.gy=Math.floor((p.y-G.dragOffset.y-GRID_Y)/CELL);
    }
}
function handlePointerUp(e){
    if(G.dragging){
        const f=G.dragging;
        const ok=canPlace(f.typeId,f.gx,f.gy);
        if(ok&&G.budgetLeft>=f.type.price){
            const t=f.type;
            for(let r=f.gy;r<f.gy+t.size.h;r++)for(let c=f.gx;c<f.gx+t.size.w;c++)G.grid[r][c]=f;
            G.placed.push(f);
            G.budgetLeft-=t.price;
            sfxPlace();
            for(let i=0;i<8;i++){
                const cx=GRID_X+f.gx*CELL+(t.size.w*CELL)/2,cy=GRID_Y+f.gy*CELL+(t.size.h*CELL)/2;
                addParticle(cx,cy,t.color,null,-1.5-Math.random()*2,3);
            }
        }else{
            if(!ok)addPopup(GRID_X+GRID_COLS*CELL/2,GRID_Y-10,'无法放置，返还(70%)','#ff5252');
        }
        G.dragging=null;G.dragOffset=null;
    }
}

canvas.addEventListener('mousedown',handlePointerDown);
canvas.addEventListener('mousemove',handlePointerMove);
canvas.addEventListener('mouseup',handlePointerUp);
canvas.addEventListener('mouseleave',handlePointerUp);
canvas.addEventListener('touchstart',function(e){e.preventDefault();handlePointerDown(e)},{passive:false});
canvas.addEventListener('touchmove',function(e){e.preventDefault();handlePointerMove(e)},{passive:false});
canvas.addEventListener('touchend',function(e){e.preventDefault();handlePointerUp(e)},{passive:false});

function tryBuy(i){
    if(G.phase!=='prep')return;
    if(G.budgetLeft<FURNITURE_TYPES[i].price){
        addPopup(W/2,100,'预算不足!','#ff5252');sfxBad();return;
    }
    G.selected=i;
    addPopup(W/2,100,'已选: '+FURNITURE_TYPES[i].name+', 点击笼子放置',FURNITURE_TYPES[i].color);
    sfxBuy();
}
function clearAll(){
    const refund=G.placed.reduce((s,f)=>s+Math.floor(f.type.price*0.7),0);
    for(const f of G.placed.slice())removeFurniture(f);
    G.budgetLeft=G.budgetLeft;
    if(G.placed.length===0){
        G.budgetLeft=G.budget;
    }else{
        G.budgetLeft+=refund;
    }
    G.placed=[];
    initGrid();
    G.budgetLeft=G.budget;
    addPopup(W/2,110,'已清空! 预算重置','#ff9800');
    sfxBtn();
}

function startRunPhase(){
    if(G.placed.length<5){addPopup(W/2,110,'至少放置5件家具!','#ff5252');sfxBad();return;}
    const flow=checkFlowLines();
    if(!flow.hasFood){addPopup(W/2,110,'缺少食盆!','#ff5252');sfxBad();return;}
    if(!flow.hasWater){addPopup(W/2,110,'缺少水壶!','#ff5252');sfxBad();return;}
    G.phase='run';G.timeLeft=RUN_TIME*60;
    const startF=G.placed[0];
    const t=startF.type;
    G.hamster.x=GRID_X+startF.gx*CELL+(t.size.w*CELL)/2;
    G.hamster.y=GRID_Y+startF.gy*CELL+(t.size.h*CELL)/2;
    G.hamster.tx=G.hamster.x;G.hamster.ty=G.hamster.y;
    G.hamster.visited={};G.hamster.totalVisits=0;
    addPopup(W/2,150,'🐹 仓鼠出笼啦!','#ff9800');
    sfxCheck();
}
function pickNextTarget(){
    if(G.placed.length===0)return null;
    const h=G.hamster;
    const candidates=G.placed.filter(f=>!h.using||h.using.id!==f.id);
    return candidates[Math.floor(Math.random()*candidates.length)];
}

function startGame(){
    initAudio();
    G.state=STATE_PLAYING;G.score=0;
    G.timeLeft=PREP_TIME*60;G.phase='prep';
    G.budget=500;G.budgetLeft=500;
    initGrid();G.placed=[];G.selected=null;
    G.dragging=null;G.dragOffset=null;
    G.hamster={x:0,y:0,tx:0,ty:0,facing:1,step:0,using:null,useTimer:0,target:null,mood:0,happy:0,totalVisits:0,visited:{},path:[]};
    G.particles=[];G.popups=[];G.paused=false;G.detailScore=null;
    G.achievements=ACHIEVEMENTS.map(a=>({...a}));G.achievementQueue=[];
    G.timeOfDay='day';G.timeTimer=0;G.bubbles=[];G.hearts=[];G.zzzs=[];
    G.achPanel=false;G.tutorialStep=0;G.showTutorial=true;G.tutorialTimer=0;
    G.wheelSpins=0;G.swingSwings=0;G.tunnelDigs=0;G.naps=0;G.meals=0;G.drinks=0;G.bathCount=0;
    sfxBtn();
}
function endGame(){
    G.state=STATE_OVER;
    const flow=checkFlowLines();
    const countBonus=G.placed.length*10;
    const budgetBonus=G.budgetLeft*1;
    const visitBonus=G.hamster.totalVisits*5;
    const flowBonus=((flow.c1?100:0)+(flow.c2?100:0));
    const hamHappyBonus=G.hamster.happy;
    G.score=Math.floor(countBonus+budgetBonus+visitBonus+flowBonus+hamHappyBonus*3);
    G.detailScore={countBonus,budgetBonus,visitBonus,flowBonus,hamHappyBonus,c1:flow.c1,c2:flow.c2};
    const wasNew=G.score>G.highScore;
    if(G.score>G.highScore){
        G.highScore=G.score;Storage.save('cslj_highscore',G.highScore);
        Storage.save('cslj_bestlayout',String(Date.now()));
    }
    checkAchievements();
    if(wasNew)unlockAchievement('record_break');
    sfxBuzzer();
}
function togglePause(){
    G.paused=!G.paused;
    if(G.paused)G.state=STATE_PAUSE;else G.state=STATE_PLAYING;
    sfxBtn();
}

function update(){
    if(G.state!==STATE_PLAYING||G.paused)return;
    G.timeLeft--;
    if(G.showTutorial)G.tutorialTimer++;
    if(G.timeLeft<=0){
        if(G.phase==='prep'){startRunPhase();return}
        else{endGame();return}
    }
    G.timeTimer++;
    if(G.phase==='run'&&G.timeTimer>7*60){
        G.timeTimer=0;
        const cur=TIMES.indexOf(G.timeOfDay);
        G.timeOfDay=TIMES[(cur+1)%TIMES.length];
        addPopup(W/2,155,'时间变化: '+TIME_NAMES[G.timeOfDay],'#90caf9');
    }
    for(const s of G.sparkles)s.phase+=0.05;
    for(let i=G.bubbles.length-1;i>=0;i--){const b=G.bubbles[i];b.y-=0.8;b.x+=Math.sin(b.life*0.1)*0.3;b.life--;if(b.life<=0)G.bubbles.splice(i,1);}
    for(let i=G.hearts.length-1;i>=0;i--){const b=G.hearts[i];b.y-=0.9;b.x+=Math.sin(b.life*0.08)*0.4;b.life--;if(b.life<=0)G.hearts.splice(i,1);}
    for(let i=G.zzzs.length-1;i>=0;i--){const b=G.zzzs[i];b.y-=0.5;b.x+=0.2;b.life--;if(b.life<=0)G.zzzs.splice(i,1);}
    if(G.phase==='run'){
        const h=G.hamster;
        h.step+=0.2;
        if(h.using){
            h.useTimer--;
            h.using.anim++;
            if(h.useTimer%15===0){
                h.happy+=h.using.type.happiness*0.1;
                const t=h.using.type;
                const cx=GRID_X+h.using.gx*CELL+(t.size.w*CELL)/2,cy=GRID_Y+h.using.gy*CELL+(t.size.h*CELL)/2;
                for(let i=0;i<3;i++)addParticle(cx,cy-10,t.color,'✨',-2-Math.random(),2);
                if(t.tag==='food'){sfxEat();G.meals++;if(Math.random()<0.5)G.hearts.push({x:cx,y:cy-10,life:45,maxLife:45});}
                else if(t.tag==='water'){G.drinks++;if(Math.random()<0.4)G.bubbles.push({x:cx,y:cy,life:40,maxLife:40,col:'#4fc3f7'});}
                else if(t.tag==='bath'){sfxBath();G.bathCount++;for(let k=0;k<2;k++)G.bubbles.push({x:cx+(Math.random()-0.5)*20,y:cy+(Math.random()-0.5)*10,life:45,maxLife:45,col:'#81d4fa'});}
                else if(t.tag==='house'||t.tag==='bed'){sfxSleep();G.naps++;if(Math.random()<0.5)G.zzzs.push({x:cx+10,y:cy-12,life:55,maxLife:55});}
                else if(t.tag==='wheel'){G.wheelSpins++;}
                else if(t.tag==='swing'){G.swingSwings++;}
                else if(t.tag==='tunnel'){G.tunnelDigs++;}
                else sfxUse();
            }
            if(h.useTimer<=0){h.using.used++;h.using=null;}
        }else{
            const dx=h.tx-h.x,dy=h.ty-h.y;
            const d=Math.hypot(dx,dy);
            if(d>4){
                const spd=2.2;
                h.x+=dx/d*spd;h.y+=dy/d*spd;
                h.facing=dx>0?1:-1;
                if(Math.random()<0.1)sfxRun();
            }else{
                if(!h.target){
                    h.target=pickNextTarget();
                    if(h.target){
                        const t=h.target.type;
                        h.tx=GRID_X+h.target.gx*CELL+(t.size.w*CELL)/2;
                        h.ty=GRID_Y+h.target.gy*CELL+(t.size.h*CELL)/2;
                    }
                }else{
                    const t=h.target.type;
                    const cx=GRID_X+h.target.gx*CELL+(t.size.w*CELL)/2;
                    const cy=GRID_Y+h.target.gy*CELL+(t.size.h*CELL)/2;
                    if(Math.hypot(h.x-cx,h.y-cy)<10){
                        const key=h.target.id;
                        if(!h.visited[key]){h.visited[key]=0;h.totalVisits++;}
                        h.visited[key]++;
                        h.happy+=t.happiness*0.05;
                        h.using=h.target;h.useTimer=45+Math.floor(Math.random()*30);
                        h.target=null;
                    }else{h.target=null;}
                }
            }
        }
    }
    for(const f of G.placed)f.anim++;
    updateParticles();
    checkAchievements();
}

function drawEnvFX(ctx){
    if(G.timeOfDay!=='day'){
        let ovCol=G.timeOfDay==='sunset'?'rgba(255,112,67,0.22)':'rgba(26,35,126,0.5)';
        ctx.fillStyle=ovCol;ctx.fillRect(GRID_X,GRID_Y,GRID_COLS*CELL,GRID_ROWS*CELL);
    }
    for(const sh of G.shavings){
        ctx.fillStyle=sh.col;ctx.globalAlpha=0.7;
        ctx.beginPath();ctx.arc(sh.x,sh.y,sh.s,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
    for(const s of G.sparkles){
        const g=0.35+Math.abs(Math.sin(s.phase))*0.65;
        ctx.globalAlpha=g;ctx.fillStyle=s.col;
        ctx.beginPath();ctx.arc(s.x,s.y,1.8,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
    for(const b of G.bubbles){
        ctx.globalAlpha=b.life/(b.maxLife||45);
        ctx.fillStyle=b.col||'#4fc3f7';
        ctx.beginPath();ctx.arc(b.x,b.y,3+(1-b.life/45)*2,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.lineWidth=1;ctx.stroke();
    }
    ctx.globalAlpha=1;
    for(const h of G.hearts){
        ctx.globalAlpha=h.life/(h.maxLife||45);
        ctx.fillStyle='#e91e63';ctx.font='bold 16px Arial';ctx.textAlign='center';
        ctx.fillText('💕',h.x,h.y);ctx.textAlign='left';
    }
    ctx.globalAlpha=1;
    for(const z of G.zzzs){
        ctx.globalAlpha=z.life/(z.maxLife||55);
        ctx.fillStyle='#90caf9';ctx.font='bold 15px Arial';
        ctx.fillText('💤',z.x,z.y);
    }
    ctx.globalAlpha=1;
}

function drawCage(ctx){
    const w=GRID_COLS*CELL,h=GRID_ROWS*CELL;

    roundRect(ctx,GRID_X-10,GRID_Y-10,w+20,h+20,14);ctx.fill();
    ctx.strokeStyle='#6d4c41';ctx.lineWidth=4;
    roundRect(ctx,GRID_X-10,GRID_Y-10,w+20,h+20,14);ctx.stroke();
    ctx.fillStyle='#fffde7';
    ctx.fillRect(GRID_X,GRID_Y,w,h);
    for(let r=0;r<GRID_ROWS;r++){
        for(let c=0;c<GRID_COLS;c++){
            const x=GRID_X+c*CELL,y=GRID_Y+r*CELL;
            ctx.strokeStyle='rgba(121,85,72,0.25)';ctx.lineWidth=1;
            ctx.strokeRect(x,y,CELL,CELL);

                ctx.fillStyle='rgba(255,241,118,0.2)';
                ctx.fillRect(x+2,y+2,CELL-4,CELL-4);

        ctx.fillStyle='#ff8a80';ctx.beginPath();ctx.arc(26,-6,2,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(18,-10,0.8,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#ffd180';
        ctx.beginPath();ctx.arc(11,-18,5,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.arc(22,-20,5,0,Math.PI*2);ctx.fill();

    ctx.textAlign='left';
    ctx.fillText((flow.c1?'✅':'⚠️')+' 食盆水壶距离≤2格 ('+((flow.hasFood&&flow.hasWater)?(flow.c1?'符合':'不符合'):'缺少')+')',GRID_X-3,GRID_Y-20);

    ctx.fillStyle=(flow.hasFood&&flow.hasWater)?'#4caf50':'#ff5252';
    ctx.font='bold 11px "Microsoft YaHei"';
    ctx.fillText((flow.hasFood?'🍽✓':'🍽✗')+' '+(flow.hasWater?'🚰✓':'🚰✗'),20,70);
    drawBtn(ctx,245,18,40,26,'🏆','achBtn','#ffc107','[2]');
    const secs=Math.ceil(G.timeLeft/60);
    ctx.textAlign='right';
    ctx.fillStyle=secs<=15?'#ff5252':'#fff';ctx.font='bold 26px Arial';
    ctx.fillText((G.phase==='prep'?'设计⏱':'运行⏱')+secs+'s',W-20,38);
    ctx.fillStyle=G.phase==='prep'?'#81c784':'#ffcc80';ctx.font='bold 12px "Microsoft YaHei"';
    ctx.fillText(G.phase==='prep'?'设计阶段 | '+TIME_NAMES[G.timeOfDay]:'仓鼠运行中 | '+TIME_NAMES[G.timeOfDay],W-20,58);
    if(G.phase==='run'){
        ctx.fillStyle='#4caf50';ctx.font='bold 11px "Microsoft YaHei"';
        ctx.fillText('访问: '+G.hamster.totalVisits+' 幸福: '+Math.floor(G.hamster.happy),W-20,76);
    }else{
        ctx.fillStyle='#90caf9';ctx.font='11px "Microsoft YaHei"';
        const uniq=new Set(G.placed.map(f=>f.type.tag)).size;
        ctx.fillText('家具种类: '+uniq+'/8',W-20,76);
    }
    ctx.fillStyle='#90caf9';ctx.font='12px "Microsoft YaHei"';
    ctx.fillText('最高分: '+G.highScore,170,32);
    ctx.textAlign='left';
}

function drawActionBtns(ctx){
    if(G.phase==='prep'){
        drawBtn(ctx,162,H-85,145,48,'▶ 开始运行\n(R/空格)','runNow','#4caf50',G.placed.length+'/5 件');
        drawBtn(ctx,317,H-85,145,48,'🗑 清空重置','clearAll','#f44336','预算返还');
    }else if(G.phase==='run'){
        ctx.fillStyle='rgba(76,175,80,0.3)';
        roundRect(ctx,162,H-85,W-170,48,8);ctx.fill();
        ctx.fillStyle='#fff';ctx.font='bold 14px "Microsoft YaHei"';
        ctx.textAlign='center';
        ctx.fillText('🐹 仓鼠活动中... 剩余: '+Math.ceil(G.timeLeft/60)+'秒',W/2,H-60);
        ctx.textAlign='left';
    }
}

function drawAchievementToast(ctx){
    if(G.achievementQueue.length===0)return;
    const a=G.achievementQueue[0];
    const t=G.achievementQueue._t||0;
    G.achievementQueue._t=t+1;
    let alpha=1;
    if(t<20)alpha=t/20;
    if(t>160)alpha=Math.max(0,(180-t)/20);
    if(t>180){G.achievementQueue.shift();G.achievementQueue._t=0;return;}
    ctx.globalAlpha=alpha;
    const y=108+Math.sin(t*0.15)*3;
    ctx.fillStyle='rgba(255,215,0,0.95)';
    roundRect(ctx,W/2-145,y,290,46,10);ctx.fill();
    ctx.strokeStyle='#ff8f00';ctx.lineWidth=2;
    roundRect(ctx,W/2-145,y,290,46,10);ctx.stroke();
    ctx.font='bold 15px "Microsoft YaHei"';ctx.fillStyle='#4a148c';ctx.textAlign='center';
    ctx.fillText('🏆 成就解锁: '+a.icon+' '+a.name,W/2,y+22);
    ctx.font='10px "Microsoft YaHei"';ctx.fillStyle='#6a1b9a';
    ctx.fillText(a.desc+'  +50分',W/2,y+38);
    ctx.textAlign='left';
    ctx.globalAlpha=1;
}

function drawAchPanel(ctx){
    if(!G.achPanel)return;
    ctx.fillStyle='rgba(0,0,0,0.92)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(74,20,140,0.98)';
    roundRect(ctx,20,60,W-40,H-140,16);ctx.fill();
    ctx.strokeStyle='#ffd700';ctx.lineWidth=3;
    roundRect(ctx,20,60,W-40,H-140,16);ctx.stroke();
    ctx.fillStyle='#ffd700';ctx.font='bold 26px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.fillText('🏆 成就列表',W/2,100);
    const unlocked=G.achievements.filter(a=>a.unlocked).length;
    ctx.fillStyle='#fff';ctx.font='14px "Microsoft YaHei"';
    ctx.fillText('已解锁: '+unlocked+' / '+G.achievements.length+'   按2键或Esc关闭',W/2,125);
    let yy=150;
    for(const a of G.achievements){
        const x=40,w=W-80,h=54;
        ctx.fillStyle=a.unlocked?'rgba(255,215,0,0.2)':'rgba(150,150,150,0.1)';
        roundRect(ctx,x,yy,w,h,8);ctx.fill();
        ctx.strokeStyle=a.unlocked?'#ffd700':'#666';ctx.lineWidth=1.5;
        roundRect(ctx,x,yy,w,h,8);ctx.stroke();
        ctx.globalAlpha=a.unlocked?1:0.4;
        ctx.font='28px Arial';ctx.textAlign='left';
        ctx.fillText(a.unlocked?a.icon:'🔒',x+14,yy+38);
        ctx.globalAlpha=1;
        ctx.fillStyle=a.unlocked?'#fff':'#888';
        ctx.font='bold 14px "Microsoft YaHei"';
        ctx.fillText(a.name,x+56,yy+22);
        ctx.fillStyle=a.unlocked?'#bbb':'#666';
        ctx.font='11px "Microsoft YaHei"';
        let prog=a.desc;
        if(a.need){
            let cur=0;
            if(a.id==='budget_master')cur=G.budgetLeft;
            else if(a.id==='furniture_full')cur=G.placed.length;
            else if(a.id==='happy_ham')cur=Math.floor(G.hamster.happy);
            else if(a.id==='visitor_pro')cur=G.hamster.totalVisits;
            prog+=' ('+Math.min(cur,a.need)+'/'+a.need+')';
        }
        ctx.fillText(prog,x+56,yy+40);
        yy+=62;
    }
    drawBtn(ctx,W/2-70,H-105,140,45,'关闭成就','achClose','#ffc107');
    ctx.textAlign='left';
}

function drawTutorial(ctx){
    if(!G.showTutorial||G.tutorialStep>=6)return;
    const tips=[
        {x:W/2,y:140,text:'左侧🛒商店点选家具 → 笼子点击放置',col:'#ff9800'},
        {x:W/2,y:140,text:'1~8数字键也能购买对应家具',col:'#2196f3'},
        {x:W/2,y:140,text:'拖动已放置家具可移动; 70%退款',col:'#e91e63'},
        {x:W/2,y:140,text:'必须有食盆🍽 + 水壶🚰 且至少5件家具',col:'#4caf50'},
        {x:W/2,y:140,text:'动线规则: 食水≤2格 +100, 轮屋≤3格 +100分',col:'#9c27b0'},
        {x:W/2,y:140,text:'▶ 开始运行: 仓鼠使用家具次数×幸福度=总分',col:'#f44336'}
    ];
    const tip=tips[G.tutorialStep];
    ctx.save();ctx.globalAlpha=0.95;
    ctx.fillStyle='rgba(0,0,0,0.85)';
    roundRect(ctx,tip.x-190,tip.y-42,380,40,8);ctx.fill();
    ctx.strokeStyle=tip.col;ctx.lineWidth=2;
    roundRect(ctx,tip.x-190,tip.y-42,380,40,8);ctx.stroke();
    ctx.font='bold 12px "Microsoft YaHei"';ctx.fillStyle='#fff';ctx.textAlign='center';
    ctx.fillText('💡 教学 '+(G.tutorialStep+1)+'/6: '+tip.text,tip.x,tip.y-18);
    ctx.font='9px "Microsoft YaHei"';ctx.fillStyle=tip.col;
    ctx.fillText('(点击屏幕继续下一条 →)',tip.x,tip.y-6);
    ctx.restore();ctx.globalAlpha=1;
}

function drawMenu(ctx){
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#4a148c');g.addColorStop(0.5,'#7b1fa2');g.addColorStop(1,'#ff6f00');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.save();ctx.translate(W/2,210);
    const sc=1.5+Math.sin(Date.now()/500)*0.05;ctx.scale(sc,sc);
    ctx.font='85px Arial';ctx.textAlign='center';ctx.fillText('🐹🎡🏠',0,0);
    ctx.restore();
    ctx.fillStyle='#ffd180';ctx.font='bold 44px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.fillText('仓鼠笼设计',W/2,310);
    ctx.fillStyle='#fff';ctx.font='18px "Microsoft YaHei"';
    ctx.fillText('用500金币打造最幸福的仓鼠笼!',W/2,340);
    ctx.fillStyle='#ffd700';ctx.font='bold 16px "Microsoft YaHei"';
    ctx.fillText('🌟 最高分: '+G.highScore+'  最佳布局ID: '+G.bestLayout,W/2,375);
    drawBtn(ctx,W/2-100,405,200,60,'开始设计','start','#ff9800');
    ctx.fillStyle='#fff';ctx.font='13px "Microsoft YaHei"';
    let yy=490;
    const tips=[
        '📋 玩法说明：',
        '• 120秒设计阶段: 左侧商店点选 → 笼子点击放置',
        '• 笼子8列×6行网格, 部分家具占2×1格',
        '• 8种家具: 跑轮/隧道/木屋/吊床/食盆/水壶/秋千/浴室',
        '• 必须有食盆+水壶, 至少放5件家具',
        '• 动线规则: 食盆水壶≤2格 +100分; 跑轮木屋≤3格 +100分',
        '• 点击已放置家具可拖动; 70%退款(清空100%)',
        '• 20秒运行阶段: 仓鼠随机使用家具, 次数×幸福度=总分'
    ];
    for(const t of tips){ctx.fillText(t,W/2,yy);yy+=20;}
    ctx.fillStyle='#ffd700';ctx.font='bold 12px "Microsoft YaHei"';
    ctx.fillText('空格/回车=开始/运行  Esc=暂停  1~8=购买',W/2,yy+12);
    ctx.textAlign='left';
}

function drawPause(ctx){
    ctx.fillStyle='rgba(0,0,0,0.8)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 48px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.fillText('⏸ 暂停中',W/2,H/2-60);
    drawBtn(ctx,W/2-90,H/2-20,180,55,'▶ 继续','resume','#ff9800');
    drawBtn(ctx,W/2-70,H/2+50,140,45,'← 返回菜单','quit','#757575');
    ctx.textAlign='left';
}

function drawGameOver(ctx){
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#4a148c');g.addColorStop(1,'#ff6f00');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fillRect(0,0,W,H);
    const isNew=G.score>=G.highScore&&G.score>0;
    ctx.fillStyle=isNew?'#ffd700':'#fff';ctx.font='bold 40px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.fillText(isNew?'🎉 新纪录!':'⏱ 完成!',W/2,95);
    ctx.font='55px Arial';ctx.fillText('🐹',W/2,165);
    ctx.fillStyle='#fff';ctx.font='bold 20px "Microsoft YaHei"';
    ctx.fillText('幸福仓鼠笼 最终评分',W/2,200);
    ctx.fillStyle='rgba(255,255,255,0.1)';
    roundRect(ctx,35,220,W-70,250,14);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=2;
    roundRect(ctx,35,220,W-70,250,14);ctx.stroke();
    let yy=250;const ds=G.detailScore;
    ctx.fillStyle='#ddd';ctx.font='14px "Microsoft YaHei"';ctx.textAlign='left';
    const rows=ds?[
        ['🏠 家具件数 ('+G.placed.length+'×10)','+'+ds.countBonus],
        ['💰 预算剩余 '+G.budgetLeft+'金','+'+ds.budgetBonus],
        ['🐹 仓鼠访问次数 ('+G.hamster.totalVisits+'×5)','+'+ds.visitBonus],
        [(ds.c1?'✅':'❌')+' 动线1: 食盆水壶≤2格 (100)',(ds.c1?'+100':'+0')],
        [(ds.c2?'✅':'❌')+' 动线2: 跑轮木屋≤3格 (100)',(ds.c2?'+100':'+0')],
        ['💕 仓鼠幸福度 (×3)','+'+Math.floor(ds.hamHappyBonus*3)]
    ]:[];
    for(const [k,v] of rows){
        ctx.fillStyle='#bbb';ctx.fillText(k,55,yy);
        ctx.fillStyle='#fff';ctx.textAlign='right';ctx.fillText(v,W-55,yy);
        ctx.textAlign='left';yy+=22;
    }
    yy+=12;
    ctx.fillStyle='#ffd700';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText('幸福总分: '+G.score,W/2,yy+15);
    yy+=50;
    ctx.fillStyle='#aaa';ctx.font='13px "Microsoft YaHei"';
    ctx.fillText('历史最高: '+G.highScore,W/2,yy+5);
    drawBtn(ctx,W/2-95,yy+22,190,55,'🔄 重新设计','restart','#ff9800');
    drawBtn(ctx,W/2-80,yy+87,160,45,'🏠 返回菜单','menu','#757575');
    ctx.textAlign='left';
}

function draw(){
    switch(G.state){
        case STATE_MENU:drawMenu(ctx);break;
        case STATE_PLAYING:
            drawHUD(ctx);
            drawShop(ctx);
            drawCage(ctx);
            drawParticles(ctx);
            drawActionBtns(ctx);
            break;
        case STATE_PAUSE:
            drawHUD(ctx);drawShop(ctx);drawCage(ctx);drawActionBtns(ctx);
            drawPause(ctx);
            break;
        case STATE_OVER:drawGameOver(ctx);break;
    }
}

setInterval(function(){update();draw();},16);

const _sbtn=document.getElementById('start-game-btn');
_sbtn.addEventListener('click',function(){initAudio();startGame();this.style.display='none';});

})();
</script>

      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;

      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {

  } else {

})();

<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
