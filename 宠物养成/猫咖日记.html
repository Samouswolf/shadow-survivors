<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>猫咖日记</title>
<script src="../game_core.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: linear-gradient(135deg, #2d1b3d 0%, #1a1028 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; font-family: "Microsoft YaHei", sans-serif; }
#gameContainer { position: relative; }
canvas { border: 3px solid #ff9fcf; border-radius: 16px; box-shadow: 0 0 40px rgba(255,159,207,0.3); display: block; max-width: 100%; height: auto; cursor: pointer; }
#uiLayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
.btn { pointer-events: auto; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; }
.btn:hover { transform: scale(1.05); }
.btn:active { transform: scale(0.95); }
#startScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(20,10,30,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
#startScreen h1 { font-size: 56px; color: #ffb6d9; margin-bottom: 16px; text-shadow: 0 0 20px rgba(255,182,217,0.5); }
#startScreen .subtitle { color: #d4a5c0; font-size: 18px; margin-bottom: 40px; }
.cat-row { display: flex; gap: 20px; margin-bottom: 40px; flex-wrap: wrap; justify-content: center; padding: 0 20px; }
.cat-card { background: rgba(255,182,217,0.1); border: 2px solid #ff9fcf; border-radius: 16px; padding: 20px; text-align: center; width: 130px; cursor: pointer; transition: all 0.3s; }
.cat-card:hover { background: rgba(255,182,217,0.25); transform: translateY(-4px); box-shadow: 0 8px 24px rgba(255,159,207,0.3); }
.cat-card.selected { border-color: #fff; box-shadow: 0 0 20px #fff; background: rgba(255,255,255,0.1); }
.cat-emoji { font-size: 48px; margin-bottom: 8px; }
.cat-name { color: #fff; font-weight: bold; margin-bottom: 4px; }
.cat-desc { color: #d4a5c0; font-size: 12px; }
#start-game-btn { padding: 16px 56px; font-size: 22px; background: linear-gradient(135deg, #ff7eb6 0%, #ff4d9d 100%); color: white; border: none; border-radius: 30px; cursor: pointer; font-weight: bold; box-shadow: 0 6px 24px rgba(255,77,157,0.4); pointer-events: auto; }
#collection-panel { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10,5,20,0.95); z-index: 500; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
#collection-panel h2 { color: #ffb6d9; font-size: 36px; margin-bottom: 20px; }
.collection-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; max-width: 600px; max-height: 60vh; overflow-y: auto; padding: 10px; }
.collect-item { background: rgba(255,255,255,0.05); border: 2px solid rgba(255,182,217,0.3); border-radius: 12px; padding: 12px; text-align: center; }
.collect-item.locked { opacity: 0.4; filter: grayscale(100%); }
.collect-item.unlocked { border-color: #ff9fcf; }
.collect-emoji { font-size: 36px; margin-bottom: 4px; }
.collect-name { color: #fff; font-size: 12px; }
.close-collection { margin-top: 20px; padding: 10px 30px; background: #ff7eb6; color: white; border: none; border-radius: 20px; cursor: pointer; font-size: 16px; }
/* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */
/* [BATCH-FIX:ad-components-css] */
.sponsor-btn{position:fixed;top:44px;right:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:3px 9px;border-radius:10px;font:11px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.sponsor-panel.show{display:flex}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.interstitial-ad.show{display:flex}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* [/BATCH-FIX:ad-components-css] */
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="gameCanvas" width="900" height="650"></canvas>
  <div id="uiLayer"></div>
</div>
<div id="startScreen">
  <h1>🐾 猫咖日记 🐾</h1>
  <div class="subtitle">经营你的专属猫咪咖啡馆，收集可爱猫咪！</div>
  <div class="cat-row" id="catSelect">
    <div class="cat-card selected" data-cat="0"><div class="cat-emoji">🐱</div><div class="cat-name">橘猫</div><div class="cat-desc">活泼贪吃</div></div>
    <div class="cat-card" data-cat="1"><div class="cat-emoji">😺</div><div class="cat-name">英短</div><div class="cat-desc">安静优雅</div></div>
    <div class="cat-card" data-cat="2"><div class="cat-emoji">😸</div><div class="cat-name">布偶</div><div class="cat-desc">温柔粘人</div></div>
    <div class="cat-card" data-cat="3"><div class="cat-emoji">😻</div><div class="cat-name">暹罗</div><div class="cat-desc">聪明好奇</div></div>
  </div>
  <button id="start-game-btn">开始经营</button>
</div>
<div id="collection-panel">
  <h2>📚 猫咪图鉴</h2>
  <div class="collection-grid" id="collectionGrid"></div>
  <button class="close-collection" id="closeCollectionBtn">关闭图鉴</button>
</div>

<script>
const STATE_MENU = 0;
const STATE_PLAYING = 1;
const STATE_SERVING = 2;
const STATE_COLLECTION = 3;

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = 900, H = 650;

if (!ctx.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    r = Math.min(r, w/2, h/2);
    this.beginPath();
    this.moveTo(x+r, y);
    this.arcTo(x+w, y, x+w, y+h, r);
    this.arcTo(x+w, y+h, x, y+h, r);
    this.arcTo(x, y+h, x, y, r);
    this.arcTo(x, y, x+w, y, r);
    this.closePath();
  };
}

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playTone(freq, dur, type, vol) {
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime((vol||0.08), audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}

const CAT_TYPES = [
  { name:'橘猫', emoji:'🐱', color:'#f4a460', personality:'活泼', baseHappiness:70 },
  { name:'英短', emoji:'😺', color:'#b0c4de', personality:'安静', baseHappiness:80 },
  { name:'布偶', emoji:'😸', color:'#ffe4e1', personality:'温柔', baseHappiness:75 },
  { name:'暹罗', emoji:'😻', color:'#deb887', personality:'聪明', baseHappiness:65 },
  { name:'三花', emoji:'🙀', color:'#ffd700', personality:'调皮', baseHappiness:60 },
  { name:'黑猫', emoji:'🐈‍⬛', color:'#444', personality:'神秘', baseHappiness:72 },
  { name:'加菲', emoji:'😹', color:'#daa520', personality:'慵懒', baseHappiness:85 },
  { name:'狸花', emoji:'😽', color:'#8b7355', personality:'机灵', baseHappiness:68 },
  { name:'波斯', emoji:'😼', color:'#f5f5dc', personality:'高贵', baseHappiness:78 },
  { name:'缅因', emoji:'🐈', color:'#cd853f', personality:'霸气', baseHappiness:66 },
];

const CUSTOMER_EMOJIS = ['👩','👨','👧','👦','👵','👴','🧑','👱','🧔','👸'];
const DRINKS = [
  { name:'拿铁咖啡', emoji:'☕', price:18, prepTime:120 },
  { name:'抹茶拿铁', emoji:'🍵', price:22, prepTime:150 },
  { name:'草莓奶昔', emoji:'🥤', price:25, prepTime:180 },
  { name:'柠檬红茶', emoji:'🧋', price:16, prepTime:100 },
  { name:'热可可', emoji:'🍫', price:20, prepTime:140 },
];
const CAT_FOODS = [
  { name:'小鱼干', emoji:'🐟', price:5, happiness:15, hunger:20 },
  { name:'猫粮', emoji:'🥫', price:8, happiness:10, hunger:30 },
  { name:'猫罐头', emoji:'🍱', price:15, happiness:25, hunger:40 },
  { name:'猫薄荷', emoji:'🌿', price:12, happiness:35, hunger:5 },
];

let gameState = STATE_MENU;
let selectedCatIdx = 0;
let G = {};

function initGame(startCatIdx) {
  G = {
    cats: [{
      typeIdx: startCatIdx,
      name: CAT_TYPES[startCatIdx].name,
      happiness: CAT_TYPES[startCatIdx].baseHappiness,
      hunger: 80,
      energy: 90,
      x: 450, y: 420,
      targetX: 450, targetY: 420,
      anim: 'idle', animTimer: 0, bounceY: 0, facing: 1,
      affection: 0
    }],
    customers: [],
    orders: [],
    drinks: [],
    coins: 100,
    reputation: 50,
    day: 1,
    dayTimer: 0,
    dayLength: 2400,
    time: 0,
    particles: [],
    floatTexts: [],
    unlockedCats: Storage.load('catCafe_unlocked', [0]),
    totalCats: Storage.load('catCafe_total', 1),
    highScore: Storage.load('catCafe_highscore', 0),
    spawnTimer: 180,
    selectedCat: 0,
    uiButtons: [],
    drinkQueue: [],
    currentPrep: null,
    prepTimer: 0,
  };
  const saved = Storage.load('catCafe_save', null);
  if (saved) {
    try {
      G.coins = saved.coins || G.coins;
      G.reputation = saved.reputation || G.reputation;
      G.day = saved.day || G.day;
      G.unlockedCats = saved.unlockedCats || G.unlockedCats;
    } catch(e) {}
  }
  gameState = STATE_PLAYING;
}

function saveGame() {
  Storage.save('catCafe_save', {
    coins: G.coins,
    reputation: G.reputation,
    day: G.day,
    unlockedCats: G.unlockedCats,
  });
  Storage.save('catCafe_unlocked', G.unlockedCats);
  Storage.save('catCafe_total', G.totalCats);
  Storage.save('catCafe_highscore', G.highScore);
}

function addParticle(x, y, color, text, vy) {
  G.particles.push({ x, y, vx:(Math.random()-0.5)*2, vy:vy||-2, life:50, color, text });
}
function addFloatText(x, y, text, color) {
  G.floatTexts.push({ x, y, text, color:color||'#fff', life:60, vy:-1 });
}

function spawnCustomer() {
  if (G.customers.length >= 4) return;
  const emoji = CUSTOMER_EMOJIS[Math.floor(Math.random()*CUSTOMER_EMOJIS.length)];
  const drinkIdx = Math.floor(Math.random()*DRINKS.length);
  const customer = {
    emoji, drinkIdx,
    x: -50, y: 180 + Math.floor(Math.random()*3)*90,
    targetX: 150 + G.customers.length * 40,
    patience: 600,
    maxPatience: 600,
    served: false,
    leaving: false,
  };
  G.customers.push(customer);
}

function updateCats() {
  G.cats.forEach((cat, idx) => {
    if (G.time % 120 === 0) {
      cat.hunger = Math.max(0, cat.hunger - 1);
      cat.energy = Math.max(0, cat.energy - 1);
      if (cat.hunger < 30 || cat.energy < 30) {
        cat.happiness = Math.max(0, cat.happiness - 1);
      }
    }
    if (G.time % 60 === 0 && cat.happiness > 50) {
      G.reputation = Math.min(100, G.reputation + 0.1);
    }
    if (G.time % 200 === 0 && idx === G.selectedCat) {
      cat.targetX = 250 + Math.random() * 500;
      cat.targetY = 380 + Math.random() * 120;
    }
    const dx = cat.targetX - cat.x, dy = cat.targetY - cat.y;
    const d = Math.sqrt(dx*dx + dy*dy);
    if (d > 2) {
      cat.x += (dx/d) * 0.6;
      cat.y += (dy/d) * 0.6;
      cat.facing = dx > 0 ? 1 : -1;
    }
    cat.bounceY = Math.sin(G.time*0.08 + idx) * 3;
    if (cat.animTimer > 0) {
      cat.animTimer--;
      if (cat.animTimer <= 0) cat.anim = 'idle';
    }
    cat.affection = Math.min(100, cat.affection + 0.01);
  });
}

function updateCustomers() {
  G.customers.forEach((c, i) => {
    if (!c.leaving) {
      if (c.x < c.targetX) c.x += 1.5;
      c.patience--;
      if (c.patience <= 0 && !c.served) {
        c.leaving = true;
        G.reputation = Math.max(0, G.reputation - 3);
        addFloatText(c.x, c.y, '😤 -3', '#ff6b6b');
      }
      if (c.served) {
        c.leaving = true;
      }
    } else {
      c.x += 2;
    }
  });
  G.customers = G.customers.filter(c => c.x < W + 100);
}

function updateDrinks() {
  if (G.currentPrep) {
    G.prepTimer++;
    if (G.prepTimer >= G.currentPrep.prepTime) {
      G.drinks.push({
        drinkIdx: G.currentPrep.drinkIdx,
        x: 500, y: 280,
        targetX: 700 + G.drinks.length*50, targetY: 550,
        ready: true,
      });
      G.currentPrep = null;
      G.prepTimer = 0;
    }
  }
  G.drinks.forEach(d => {
    const dx = d.targetX - d.x, dy = d.targetY - d.y;
    const dist = Math.sqrt(dx*dx+dy*dy);
    if (dist > 2) {
      d.x += (dx/dist)*2;
      d.y += (dy/dist)*2;
    }
  });
}

function updateParticles() {
  for (let i=G.particles.length-1; i>=0; i--) {
    const p = G.particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.life--;
    if (p.life <= 0) G.particles.splice(i,1);
  }
  for (let i=G.floatTexts.length-1; i>=0; i--) {
    const f = G.floatTexts[i];
    f.y += f.vy; f.life--;
    if (f.life <= 0) G.floatTexts.splice(i,1);
  }
}

function tryUnlockCat() {
  const available = [];
  for (let i=0; i<CAT_TYPES.length; i++) {
    if (G.unlockedCats.indexOf(i) === -1) available.push(i);
  }
  if (available.length === 0) return;
  if (G.coins >= 300 && G.reputation >= 70 && Math.random() < 0.15) {
    const idx = available[Math.floor(Math.random()*available.length)];
    G.unlockedCats.push(idx);
    G.coins -= 200;
    G.cats.push({
      typeIdx: idx, name: CAT_TYPES[idx].name,
      happiness: CAT_TYPES[idx].baseHappiness,
      hunger: 75, energy: 85,
      x: 450, y: 420, targetX: 450, targetY: 420,
      anim:'idle', animTimer:0, bounceY:0, facing:1, affection:0,
    });
    G.totalCats = Math.max(G.totalCats, G.unlockedCats.length);
    addFloatText(W/2, 200, '🎉 新猫咪解锁: '+CAT_TYPES[idx].name+'!', '#ffd700');
    playTone(800, 0.3, 'sine', 0.1);
    saveGame();
  }
}

function updateGame() {
  G.time++;
  G.dayTimer++;
  if (G.dayTimer >= G.dayLength) {
    G.dayTimer = 0;
    G.day++;
    G.coins += 20 + G.cats.length * 10;
    addFloatText(W/2, 100, '☀️ 第'+G.day+'天 奖励 +'+(20+G.cats.length*10), '#ffd700');
    tryUnlockCat();
    saveGame();
  }
  G.spawnTimer--;
  if (G.spawnTimer <= 0) {
    spawnCustomer();
    G.spawnTimer = 240 + Math.floor(Math.random()*180);
  }
  if (G.reputation >= 100) G.highScore = Math.max(G.highScore, G.day*100 + G.coins);
  updateCats();
  updateCustomers();
  updateDrinks();
  updateParticles();
}

function drawBackground() {
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0, '#3d2a4d');
  grad.addColorStop(1, '#2a1a38');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#4a3558';
  ctx.fillRect(0, 0, W, 80);
  ctx.fillStyle = '#5a4568';
  ctx.fillRect(0, 80, W, 40);
  for (let i=0; i<5; i++) {
    ctx.fillStyle = '#6b8cae';
    ctx.fillRect(80+i*160, 20, 100, 80);
    ctx.strokeStyle = '#8bacce'; ctx.lineWidth = 3;
    ctx.strokeRect(80+i*160, 20, 100, 80);
    ctx.beginPath(); ctx.moveTo(130+i*160,20); ctx.lineTo(130+i*160,100); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(80+i*160,60); ctx.lineTo(180+i*160,60); ctx.stroke();
  }
  ctx.fillStyle = '#8b6f4e';
  ctx.fillRect(0, 500, W, H-500);
  ctx.fillStyle = '#7a5f3e';
  for (let x=0; x<W; x+=60) ctx.fillRect(x, 500, 1, H-500);
  ctx.fillStyle = '#654321';
  ctx.fillRect(120, 240, 560, 10);
  ctx.fillStyle = '#8b6f4e';
  ctx.fillRect(140, 250, 520, 60);
  ctx.fillStyle = '#a0522d';
  ctx.fillRect(160, 310, 40, 120);
  ctx.fillRect(640, 310, 40, 120);
  ctx.fillStyle = '#c9a66b';
  ctx.fillRect(700, 280, 180, 150);
  ctx.strokeStyle = '#8b6f4e'; ctx.lineWidth = 3;
  ctx.strokeRect(700, 280, 180, 150);
  ctx.fillStyle = '#3d2a4d';
  ctx.font = 'bold 18px "Microsoft YaHei"';
  ctx.textAlign = 'center';
  ctx.fillText('🍰 甜品柜', 790, 360);
}

function drawCats() {
  G.cats.forEach((cat, idx) => {
    const ct = CAT_TYPES[cat.typeIdx];
    const size = 36;
    ctx.save();
    ctx.translate(cat.x, cat.y + cat.bounceY);
    ctx.scale(cat.facing, 1);
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(0, size+8, size*0.8, 6, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = ct.color;
    ctx.beginPath(); ctx.arc(0, 0, size, 0, Math.PI*2); ctx.fill();
    if (idx === G.selectedCat) {
      ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, size+6, 0, Math.PI*2); ctx.stroke();
    }
    ctx.font = (size*1.3)+'px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(ct.emoji, 0, size*0.45);
    ctx.restore();
    if (cat.hunger < 30 || cat.happiness < 30) {
      ctx.fillStyle = 'rgba(255,100,100,0.9)';
      ctx.font = '20px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(cat.hunger<30?'😿':'😾', cat.x, cat.y - size - 10);
    }
    ctx.fillStyle = '#fff';
    ctx.font = '11px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.fillText(ct.name, cat.x, cat.y + size + 25);
  });
}

function drawCustomers() {
  G.customers.forEach(c => {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(0, 50, 25, 5, 0, 0, Math.PI*2); ctx.fill();
    ctx.font = '48px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(c.emoji, 0, 35);
    const drink = DRINKS[c.drinkIdx];
    ctx.font = '22px Arial';
    ctx.fillText(drink.emoji, 0, -5);
    const pct = c.patience / c.maxPatience;
    ctx.fillStyle = '#333';
    ctx.fillRect(-25, -35, 50, 6);
    ctx.fillStyle = pct > 0.5 ? '#4caf50' : pct > 0.25 ? '#ff9800' : '#f44336';
    ctx.fillRect(-25, -35, 50*pct, 6);
    ctx.restore();
  });
}

function drawDrinks() {
  if (G.currentPrep) {
    const drink = DRINKS[G.currentPrep.drinkIdx];
    const pct = G.prepTimer / G.currentPrep.prepTime;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.beginPath(); ctx.roundRect(560, 170, 200, 60, 10); ctx.fill();
    ctx.font = '28px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(drink.emoji, 595, 212);
    ctx.font = '13px "Microsoft YaHei"';
    ctx.fillStyle = '#fff';
    ctx.fillText(drink.name, 670, 195);
    ctx.fillStyle = '#555';
    ctx.fillRect(610, 208, 130, 10);
    ctx.fillStyle = '#ff9fcf';
    ctx.fillRect(610, 208, 130*pct, 10);
  }
  G.drinks.forEach((d, i) => {
    const drink = DRINKS[d.drinkIdx];
    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.fillStyle = 'rgba(255,159,207,0.15)';
    ctx.beginPath(); ctx.roundRect(-30, -40, 60, 70, 8); ctx.fill();
    ctx.font = '38px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(drink.emoji, 0, 10);
    ctx.font = '11px "Microsoft YaHei"';
    ctx.fillStyle = '#fff';
    ctx.fillText('💰'+drink.price, 0, 38);
    ctx.restore();
  });
}

function drawHUD() {
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.beginPath(); ctx.roundRect(10, 10, 340, 90, 10); ctx.fill();
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 16px "Microsoft YaHei"';

  ctx.fillText('💰 '+G.coins, 25, 35);

  ctx.fillStyle = '#87ceeb';
  ctx.fillText('📅 第'+G.day+'天', 260, 35);
  const pct = G.dayTimer / G.dayLength;
  ctx.fillStyle = '#333';
  ctx.fillRect(25, 50, 300, 10);
  ctx.fillStyle = pct < 0.3 ? '#f44336' : pct < 0.7 ? '#ff9800' : '#4caf50';
  ctx.fillRect(25, 50, 300*pct, 10);
  ctx.fillStyle = '#aaa';
  ctx.font = '11px "Microsoft YaHei"';
  ctx.fillText('猫咪: '+G.cats.length+'只  |  顾客: '+G.customers.length+'人  |  图鉴: '+G.unlockedCats.length+'/'+CAT_TYPES.length, 25, 82);

  const cat = G.cats[G.selectedCat];
  if (cat) {
    const ct = CAT_TYPES[cat.typeIdx];
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.beginPath(); ctx.roundRect(W-260, 10, 250, 110, 10); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px "Microsoft YaHei"';

    bar(W-245, 75, 220, cat.hunger, '#f4a460', '饱食', '🍖');

    ctx.fillText(a.sub, a.x+a.w/2+15, a.y+50);
    G.uiButtons.push({ ...a, action: a.name });
  });
}

function drawSubMenu(type) {
  if (type === 'drink') {
    ctx.fillStyle = 'rgba(0,0,0,0.85)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ff9fcf';
    ctx.font = 'bold 28px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.fillText('☕ 选择要制作的饮品', W/2, 100);
    DRINKS.forEach((d, i) => {
      const x = 100 + (i%3)*250, y = 180 + Math.floor(i/3)*180;
      ctx.fillStyle = '#6f4e7c';
      ctx.beginPath(); ctx.roundRect(x, y, 220, 140, 14); ctx.fill();
      ctx.strokeStyle = '#ff9fcf'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.roundRect(x, y, 220, 140, 14); ctx.stroke();
      ctx.font = '64px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(d.emoji, x+110, y+70);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 16px "Microsoft YaHei"';
      ctx.fillText(d.name, x+110, y+105);
      ctx.fillStyle = '#ffd700';
      ctx.font = '14px Arial';
      ctx.fillText('💰 '+d.price+' | ⏱ '+Math.floor(d.prepTime/60)+'秒', x+110, y+128);
      G.uiButtons.push({ x, y, w:220, h:140, action:'makeDrink_'+i });
    });
    ctx.fillStyle = '#555';
    ctx.beginPath(); ctx.roundRect(W/2-70, H-90, 140, 50, 10); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px "Microsoft YaHei"';
    ctx.fillText('返回 [ESC]', W/2, H-58);
    G.uiButtons.push({ x:W/2-70, y:H-90, w:140, h:50, action:'back' });
  }
  if (type === 'food') {
    ctx.fillStyle = 'rgba(0,0,0,0.85)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#f4a460';
    ctx.font = 'bold 28px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.fillText('🐟 选择猫粮 (当前金币: '+G.coins+')', W/2, 100);
    CAT_FOODS.forEach((f, i) => {
      const x = 100 + (i%2)*350, y = 180 + Math.floor(i/2)*180;
      const canBuy = G.coins >= f.price;
      ctx.fillStyle = canBuy ? '#8b5a3c' : '#444';
      ctx.beginPath(); ctx.roundRect(x, y, 320, 140, 14); ctx.fill();
      ctx.strokeStyle = canBuy ? '#f4a460' : '#666'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.roundRect(x, y, 320, 140, 14); ctx.stroke();
      ctx.font = '64px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(f.emoji, x+70, y+80);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 18px "Microsoft YaHei"';
      ctx.fillText(f.name, x+190, y+60);
      ctx.fillStyle = canBuy ? '#ffd700' : '#888';
      ctx.font = '14px Arial';
      ctx.fillText('💰 '+f.price, x+190, y+85);
      ctx.fillStyle = canBuy ? '#9fe8a0' : '#888';
      ctx.font = '12px "Microsoft YaHei"';
      ctx.fillText('心情 +'+f.happiness+' | 饱食 +'+f.hunger, x+190, y+112);
      if (canBuy) G.uiButtons.push({ x, y, w:320, h:140, action:'feedCat_'+i });
    });
    ctx.fillStyle = '#555';
    ctx.beginPath(); ctx.roundRect(W/2-70, H-90, 140, 50, 10); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px "Microsoft YaHei"';
    ctx.fillText('返回 [ESC]', W/2, H-58);
    G.uiButtons.push({ x:W/2-70, y:H-90, w:140, h:50, action:'back' });

}

function drawCollection() {
  ctx.fillStyle = 'rgba(10,5,20,0.95)';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#ffb6d9';
  ctx.font = 'bold 36px "Microsoft YaHei"';
  ctx.textAlign = 'center';
  ctx.fillText('📚 猫咪图鉴 ('+G.unlockedCats.length+'/'+CAT_TYPES.length+')', W/2, 80);
  CAT_TYPES.forEach((ct, i) => {
    const x = 60 + (i%5)*160, y = 140 + Math.floor(i/5)*200;
    const unlocked = G.unlockedCats.indexOf(i) !== -1;
    ctx.fillStyle = unlocked ? 'rgba(255,182,217,0.1)' : 'rgba(100,100,100,0.1)';
    ctx.beginPath(); ctx.roundRect(x, y, 140, 170, 14); ctx.fill();
    ctx.strokeStyle = unlocked ? '#ff9fcf' : '#555'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(x, y, 140, 170, 14); ctx.stroke();
    if (unlocked) {
      ctx.font = '64px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(ct.emoji, x+70, y+75);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 16px "Microsoft YaHei"';
      ctx.fillText(ct.name, x+70, y+110);
      ctx.fillStyle = '#d4a5c0';
      ctx.font = '12px "Microsoft YaHei"';
      ctx.fillText('性格: '+ct.personality, x+70, y+132);
      ctx.fillStyle = '#87ceeb';
      ctx.fillText('初始心情: '+ct.baseHappiness, x+70, y+152);
    } else {
      ctx.font = '64px Arial';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#555';
      ctx.fillText('❓', x+70, y+75);
      ctx.fillStyle = '#888';
      ctx.font = 'bold 16px "Microsoft YaHei"';
      ctx.fillText('???', x+70, y+110);
      ctx.fillStyle = '#666';
      ctx.font = '12px "Microsoft YaHei"';
      ctx.fillText('未解锁', x+70, y+132);
      ctx.fillText('高声望+300💰', x+70, y+152);
    }
  });
  ctx.fillStyle = '#ff7eb6';
  ctx.beginPath(); ctx.roundRect(W/2-90, H-80, 180, 55, 12); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 18px "Microsoft YaHei"';
  ctx.fillText('关闭图鉴 [ESC]', W/2, H-45);
  G.uiButtons.push({ x:W/2-90, y:H-80, w:180, h:55, action:'closeCollection' });
}

function render() {
  if (gameState === STATE_MENU) {
    ctx.fillStyle = '#1a1028';
    ctx.fillRect(0,0,W,H);
    return;
  }
  drawBackground();
  drawCustomers();
  drawCats();
  drawDrinks();
  drawHUD();
  drawActionButtons();
  G.particles.forEach(p => {
    ctx.globalAlpha = p.life/50;
    ctx.fillStyle = p.color;
    ctx.font = '16px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(p.text, p.x, p.y);
  });
  ctx.globalAlpha = 1;
  G.floatTexts.forEach(f => {
    ctx.globalAlpha = f.life/60;
    ctx.fillStyle = f.color;
    ctx.font = 'bold 18px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.fillText(f.text, f.x, f.y);
  });
  ctx.globalAlpha = 1;
  if (gameState === STATE_SERVING) drawSubMenu(G.subMenuType);
  if (gameState === STATE_COLLECTION) drawCollection();
}

let subMenuType = null;
function handleCanvasClick(pos) {
  if (gameState === STATE_MENU) return;
  if (gameState === STATE_PLAYING) {
    G.uiButtons.forEach(b => {
      if (pos.x>=b.x && pos.x<=b.x+b.w && pos.y>=b.y && pos.y<=b.y+b.h) {
        playTone(500, 0.08, 'sine');
        executeAction(b.action);
      }
    });
    for (let ci=G.cats.length-1; ci>=0; ci--) {
      const cat = G.cats[ci];
      const dx=pos.x-cat.x, dy=pos.y-cat.y;
      if (Math.sqrt(dx*dx+dy*dy) < 44) {
        G.selectedCat = ci;
        cat.happiness = Math.min(100, cat.happiness + 3);
        cat.anim = 'happy'; cat.animTimer = 40;
        addParticle(cat.x, cat.y-30, '#ff9fcf', '💕');
        addFloatText(cat.x, cat.y-50, '+3 心情', '#ff9fcf');
        playTone(700, 0.1, 'sine');
        break;
      }
    }
    for (let di=G.drinks.length-1; di>=0; di--) {
      const d = G.drinks[di];
      const dx=pos.x-d.x, dy=pos.y-d.y;
      if (Math.abs(dx)<40 && Math.abs(dy)<50) {
        const drink = DRINKS[d.drinkIdx];
        let served = false;
        G.customers.forEach(c => {
          if (!c.served && !c.leaving && c.drinkIdx === d.drinkIdx) {
            c.served = true;
            G.coins += drink.price;
            G.reputation = Math.min(100, G.reputation + 1);
            addFloatText(c.x, c.y-30, '💰+'+drink.price+' ⭐+1', '#ffd700');
            addParticle(c.x, c.y, '#fff', '😊');
            playTone(900, 0.15, 'sine');
            served = true;
          }
        });
        if (served) { G.drinks.splice(di,1); }
        else { addFloatText(d.x, d.y-20, '没有匹配订单!', '#ff6b6b'); }
        break;
      }
    }
  } else {
    G.uiButtons.forEach(b => {
      if (pos.x>=b.x && pos.x<=b.x+b.w && pos.y>=b.y && pos.y<=b.y+b.h) {
        playTone(500, 0.08, 'sine');
        executeAction(b.action);
      }
    });
  }
}

function executeAction(action) {
  if (action === '制作饮品') { gameState = STATE_SERVING; subMenuType = 'drink'; G.subMenuType = 'drink'; return; }
  if (action === '喂猫') { gameState = STATE_SERVING; subMenuType = 'food'; G.subMenuType = 'food'; return; }
  if (action === '陪玩') {
    const cat = G.cats[G.selectedCat];
    if (cat && cat.energy >= 15) {
      cat.happiness = Math.min(100, cat.happiness + 20);
      cat.energy = Math.max(0, cat.energy - 15);
      cat.anim = 'happy'; cat.animTimer = 90;
      addParticle(cat.x, cat.y-30, '#fff', '🎾');
      addParticle(cat.x-20, cat.y-20, '#ff9fcf', '✨');
      addParticle(cat.x+20, cat.y-25, '#ffd700', '✨');
      addFloatText(cat.x, cat.y-60, '+20 心情', '#ff9fcf');
      playTone(750, 0.2, 'triangle');
    } else {
      addFloatText(W/2, 300, '精力不足!', '#ff6b6b');
    }
    return;
  }
  if (action === '休息') {
    const cat = G.cats[G.selectedCat];
    if (cat) {
      cat.energy = Math.min(100, cat.energy + 30);
      cat.hunger = Math.max(0, cat.hunger - 5);
      addParticle(cat.x, cat.y-30, '#87ceeb', '💤');
      addFloatText(cat.x, cat.y-60, '+30 精力', '#87ceeb');
      playTone(400, 0.2, 'sine');
    }
    return;
  }
  if (action === '图鉴') { gameState = STATE_COLLECTION; showCollectionPanel(); return; }
  if (action === '切换猫咪') {
    G.selectedCat = (G.selectedCat + 1) % G.cats.length;
    playTone(600, 0.1, 'sine');
    return;
  }
  if (action.indexOf('makeDrink_') === 0) {
    const idx = parseInt(action.split('_')[1]);
    if (!G.currentPrep) {
      G.currentPrep = { drinkIdx: idx, prepTime: DRINKS[idx].prepTime };
      G.prepTimer = 0;
      gameState = STATE_PLAYING;
      addFloatText(W/2, 250, '开始制作: '+DRINKS[idx].name, '#ff9fcf');
    } else {
      addFloatText(W/2, 250, '请等待当前饮品完成!', '#ff6b6b');
    }
    return;
  }
  if (action.indexOf('feedCat_') === 0) {
    const idx = parseInt(action.split('_')[1]);
    const food = CAT_FOODS[idx];
    const cat = G.cats[G.selectedCat];
    if (G.coins >= food.price && cat) {
      G.coins -= food.price;
      cat.hunger = Math.min(100, cat.hunger + food.hunger);
      cat.happiness = Math.min(100, cat.happiness + food.happiness);
      cat.anim = 'eat'; cat.animTimer = 60;
      addParticle(cat.x, cat.y-30, '#fff', food.emoji);
      addFloatText(cat.x, cat.y-60, '-'+food.price+'💰 +饱食+心情', '#f4a460');
      playTone(650, 0.15, 'sine');
    }
    return;
  }
  if (action === 'back' || action === 'closeCollection') {
    gameState = STATE_PLAYING;
    return;
  }
}

function showCollectionPanel() {
  document.getElementById('collection-panel').style.display = 'flex';
  const grid = document.getElementById('collectionGrid');
  grid.innerHTML = '';
  CAT_TYPES.forEach((ct, i) => {
    const unlocked = G.unlockedCats.indexOf(i) !== -1;
    const el = document.createElement('div');
    el.className = 'collect-item ' + (unlocked ? 'unlocked' : 'locked');
    el.innerHTML = '<div class="collect-emoji">'+(unlocked?ct.emoji:'❓')+'</div><div class="collect-name">'+(unlocked?ct.name:'???')+'</div>';
    grid.appendChild(el);
  });
}
document.getElementById('closeCollectionBtn').addEventListener('click', () => {
  document.getElementById('collection-panel').style.display = 'none';
  gameState = STATE_PLAYING;
});

function getCanvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  const sx = W/rect.width, sy = H/rect.height;
  const cx = e.touches ? e.touches[0].clientX : e.clientX;
  const cy = e.touches ? e.touches[0].clientY : e.clientY;
  return { x:(cx-rect.left)*sx, y:(cy-rect.top)*sy };
}

canvas.addEventListener('click', (e) => { handleCanvasClick(getCanvasPos(e)); });
canvas.addEventListener('touchend', (e) => {
  if (e.changedTouches) {
    handleCanvasClick({
      clientX: e.changedTouches[0].clientX,
      clientY: e.changedTouches[0].clientY,
      ...getCanvasPos({ clientX: e.changedTouches[0].clientX, clientY: e.changedTouches[0].clientY })
    });
  }
}, { passive: true });

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (gameState === STATE_SERVING || gameState === STATE_COLLECTION) {
      document.getElementById('collection-panel').style.display = 'none';
      gameState = STATE_PLAYING;
    }
  }
  if (e.key === 'ArrowLeft' && gameState === STATE_PLAYING) {
    G.selectedCat = (G.selectedCat - 1 + G.cats.length) % G.cats.length;
    playTone(600, 0.08, 'sine');
  }
  if (e.key === 'ArrowRight' && gameState === STATE_PLAYING) {
    G.selectedCat = (G.selectedCat + 1) % G.cats.length;
    playTone(600, 0.08, 'sine');
  }
  if (gameState === STATE_PLAYING) {
    if (e.key === '1') executeAction('制作饮品');
    if (e.key === '2') executeAction('喂猫');
    if (e.key === '3') executeAction('陪玩');
    if (e.key === '4') executeAction('休息');
    if (e.key === '5') { gameState = STATE_COLLECTION; showCollectionPanel(); }
    if (e.key === '6') executeAction('切换猫咪');
  }
});

document.querySelectorAll('.cat-card').forEach(card => {
  card.addEventListener('click', () => {
    document.querySelectorAll('.cat-card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    selectedCatIdx = parseInt(card.dataset.cat);
    playTone(550, 0.1, 'sine');
  });
});

document.getElementById('start-game-btn').addEventListener('click', () => {
  try { audioCtx.resume(); } catch(e) {}
  document.getElementById('startScreen').style.display = 'none';
  initGame(selectedCatIdx);
  playTone(800, 0.3, 'sine');
});

let loopTimer = 0;
function gameStep() {
  if (gameState === STATE_PLAYING) updateGame();
  render();
  loopTimer = setTimeout(gameStep, 16);
}
gameStep();

window.addEventListener('beforeunload', saveGame);
setInterval(saveGame, 30000);

GameCore.init({ touch: false });
</script>

    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>

<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
