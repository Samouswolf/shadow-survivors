<body>

<button id="start-game-btn" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:20px 40px;font-size:20px;background:#e91e63;color:white;border:none;border-radius:12px;cursor:pointer;z-index:999;font-weight:bold;display:none;">开始游戏</button>

<canvas id="c"></canvas>

<script>
if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
</script>
<script src="../game_core.js"></script>
<script>
(function(){
"use strict";

const W=480,H=720;
const GAME_TIME=90;

const STEP_NAMES=['淋湿','涂浴液','冲洗','吹干','剪毛','修剪指甲','扎蝴蝶结'];
const STEP_ICONS=['💧','🧴','🚿','💨','✂️','🔧','🎀'];
const STEP_COLORS=['#03a9f4','#9c27b0','#2196f3','#ff9800','#795548','#9e9e9e','#e91e63'];

const ORDER_TEMPLATES=[
    {level:'简单',steps:2,baseReward:80,timeMul:1.0,color:'#4caf50'},
    {level:'中等',steps:4,baseReward:150,timeMul:1.4,color:'#ff9800'},
    {level:'复杂',steps:7,baseReward:300,timeMul:2.0,color:'#f44336'}
];

const PET_TYPES=[
    {name:'金毛',emoji:'🐕',color:'#d7ccc8',customer:'👩',greet:'帮我家狗狗美美哒!'},
    {name:'泰迪',emoji:'🐩',color:'#a1887f',customer:'👨',greet:'我家小泰迪想要造型~'},
    {name:'英短',emoji:'🐱',color:'#b0bec5',customer:'👧',greet:'喵主子要洗澡啦!'},
    {name:'布偶',emoji:'😻',color:'#ffe0b2',customer:'👵',greet:'猫咪美容就拜托了'},
    {name:'哈士奇',emoji:'🐺',color:'#cfd8dc',customer:'🧑',greet:'二哈洗澡挑战!'},
    {name:'柯基',emoji:'🐶',color:'#ffcc80',customer:'👦',greet:'小短腿也要美美的'}
];

let audioCtx=null;
function initAudio(){
    if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
}
function playTone(freq,dur,type,vol){
    if(!audioCtx)return;
    try{
        const o=audioCtx.createOscillator();
        const g=audioCtx.createGain();
        o.type=type||'sine';
        o.frequency.value=freq;
        g.gain.value=vol||0.1;
        g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
        o.connect(g);g.connect(audioCtx.destination);
        o.start();o.stop(audioCtx.currentTime+dur);
    }catch(e){}
}
function sfxWet(){playTone(400,0.1,'sine',0.15);setTimeout(()=>playTone(300,0.15,'sine',0.12),80)}
function sfxSoap(){playTone(800,0.06,'triangle',0.12);setTimeout(()=>playTone(1000,0.08,'triangle',0.1),60)}
function sfxRinse(){for(let i=0;i<3;i++)setTimeout(()=>playTone(600+i*80,0.05,'sine',0.08),i*40)}
function sfxDry(){playTone(200,0.2,'sawtooth',0.08)}
function sfxClip(){playTone(1200,0.04,'square',0.12);setTimeout(()=>playTone(900,0.06,'square',0.1),40)}
function sfxNail(){playTone(1500,0.03,'square',0.1);setTimeout(()=>playTone(1200,0.03,'square',0.08),30)}
function sfxBow(){playTone(700,0.05,'sine',0.12);setTimeout(()=>playTone(900,0.05,'sine',0.12),50);setTimeout(()=>playTone(1100,0.1,'sine',0.12),100)}
function sfxBell(){playTone(1000,0.08,'sine',0.15);setTimeout(()=>playTone(1300,0.15,'sine',0.12),80)}
function sfxStar(){playTone(523,0.06,'sine',0.15);setTimeout(()=>playTone(659,0.06,'sine',0.15),70);setTimeout(()=>playTone(784,0.12,'sine',0.15),140)}
function sfxAngry(){playTone(200,0.15,'sawtooth',0.13)}
function sfxBuzzer(){playTone(150,0.4,'sawtooth',0.18)}
function sfxBtn(){playTone(600,0.06,'sine',0.1)}
function sfxBad(){playTone(220,0.18,'square',0.12)}

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let scale=1;
function resize(){
    const r=W/H;
    let cw=window.innerWidth,ch=window.innerHeight;
    if(cw/ch>r){ch=cw/r}else{cw=ch*r}
    canvas.width=cw;canvas.height=ch;
    scale=cw/W;
    ctx.setTransform(scale,0,0,scale,0,0);
}
window.addEventListener('resize',resize);resize();

let _oid=0;
function createOrder(){
    const lv=Math.random()<0.35?0:(Math.random()<0.6?1:2);
    const ot=ORDER_TEMPLATES[lv];
    const pt=PET_TYPES[Math.floor(Math.random()*PET_TYPES.length)];
    const stepList=[];
    for(let i=0;i<ot.steps;i++)stepList.push(i);
    if(ot.steps>=5&&Math.random()<0.5)stepList.push(6);
    stepList.sort((a,b)=>a-b);
    _oid++;
    return{
        id:_oid,level:lv,template:ot,pet:pt,
        steps:stepList,stepIndex:0,stepProgress:0,stepMax:100,
        patience:100,patienceMax:ot.steps*35*ot.timeMul,
        completed:false,stars:0,earned:0,
        enterTime:Date.now(),lastStepTime:Date.now(),
        stepQualities:[]
    };
}

const G={
    state:STATE_MENU,score:0,highScore:0,timeLeft:GAME_TIME*60,
    coins:0,ordersDone:0,ordersFailed:0,totalStars:0,
    currentOrder:null,nextOrderTimer:90,
    queue:[],maxQueue:3,
    activeStepMode:null,activeProgress:0,
    stepActionTimer:0,stepLastPos:null,
    particles:[],popups:[],btnRects:{},
    keys:{},paused:false,
    isDragging:false,dragStart:null,
    stepClicks:0,quickClicks:0
};

G.highScore=parseInt(Storage.load('cwmrd_highscore','0'));

function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
}
function drawBtn(ctx,x,y,w,h,text,name,color,sub){
    G.btnRects[name]={x:x,y:y,w:w,h:h};
    ctx.fillStyle=color||'#e91e63';
    ctx.strokeStyle='rgba(255,255,255,0.5)';
    ctx.lineWidth=2;
    roundRect(ctx,x,y,w,h,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#fff';
    ctx.font='bold 14px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(text,x+w/2,y+h/2-(sub?6:0));
    if(sub){ctx.font='10px "Microsoft YaHei"';ctx.fillStyle='rgba(255,255,255,0.85)';ctx.fillText(sub,x+w/2,y+h/2+12);}
    ctx.textBaseline='alphabetic';ctx.textAlign='left';
}
function hitBtn(p,name){
    const r=G.btnRects[name];
    return r&&p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;
}
function getPos(e){
    const rect=canvas.getBoundingClientRect();
    const t=e.touches?e.touches[0]:(e.changedTouches?e.changedTouches[0]:e);
    if(!t)return{x:0,y:0};
    return{x:(t.clientX-rect.left)/scale,y:(t.clientY-rect.top)/scale};
}
function addParticle(x,y,color,text,vy,size){
    G.particles.push({x:x,y:y,vx:(Math.random()-0.5)*3.5,vy:vy||-2,life:40,maxLife:40,color:color,text:text,size:size||3+Math.random()*3});
}
function addPopup(x,y,text,color){
    G.popups.push({x:x,y:y,text:text,color:color||'#fff',life:55,maxLife:55,vy:-1.1});
}
function updateParticles(){
    for(let i=G.particles.length-1;i>=0;i--){
        const p=G.particles[i];
        p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life--;
        if(p.life<=0)G.particles.splice(i,1);
    }
    for(let i=G.popups.length-1;i>=0;i--){
        const p=G.popups[i];
        p.y+=p.vy;p.life--;
        if(p.life<=0)G.popups.splice(i,1);
    }
}
function drawParticles(ctx){
    for(const p of G.particles){
        ctx.globalAlpha=p.life/p.maxLife;
        if(p.text){ctx.fillStyle=p.color;ctx.font='bold 16px Arial';ctx.textAlign='center';ctx.fillText(p.text,p.x,p.y);ctx.textAlign='left';}
        else{ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();}
    }
    ctx.globalAlpha=1;
    for(const p of G.popups){
        ctx.globalAlpha=p.life/p.maxLife;
        ctx.fillStyle=p.color;
        ctx.font='bold 15px "Microsoft YaHei"';ctx.textAlign='center';
        ctx.fillText(p.text,p.x,p.y);ctx.textAlign='left';
    }
    ctx.globalAlpha=1;
}

function stepSfx(idx){
    switch(idx){
        case 0:sfxWet();break;case 1:sfxSoap();break;case 2:sfxRinse();break;case 3:sfxDry();break;
        case 4:sfxClip();break;case 5:sfxNail();break;case 6:sfxBow();break;
    }
}

window.addEventListener('keydown',function(e){
    G.keys[e.key.toLowerCase()]=true;
    if(e.key===' '||e.key==='Enter'){
        e.preventDefault();initAudio();
        if(G.state===STATE_MENU){startGame();return}
        if(G.state===STATE_OVER){startGame();return}
    }
    if(e.key==='Escape'){
        if(G.state===STATE_PLAYING)togglePause();
    }
    if(G.state===STATE_PLAYING&&!G.paused){
        if(G.currentOrder){
            const n=parseInt(e.key);
            if(n>=1&&n<=7){
                const o=G.currentOrder;
                const st=o.steps[o.stepIndex];
                if(st===n-1)doStepAction();
            }
        }
    }
    initAudio();
});
window.addEventListener('keyup',function(e){G.keys[e.key.toLowerCase()]=false});

function doStepAction(){
    const o=G.currentOrder;if(!o)return;
    const st=o.steps[o.stepIndex];
    stepSfx(st);
    const petX=W/2,petY=360;
    if(st===0)for(let i=0;i<4;i++)addParticle(petX+(Math.random()-0.5)*50,petY+(Math.random()-0.5)*30,'#03a9f4','💧',-1);
    if(st===1)for(let i=0;i<4;i++)addParticle(petX+(Math.random()-0.5)*50,petY+(Math.random()-0.5)*30,'#ba68c8','🫧',-1.2);
    if(st===2)for(let i=0;i<4;i++)addParticle(petX+(Math.random()-0.5)*60,petY-40,'#2196f3','💦',0.5+Math.random());
    if(st===3)for(let i=0;i<4;i++)addParticle(petX+30,petY+(Math.random()-0.5)*40,'#ff9800','💨',1);
    if(st===4)for(let i=0;i<4;i++)addParticle(petX+(Math.random()-0.5)*40,petY-10,'#8d6e63','✂️',-0.8);
    if(st===5)for(let i=0;i<2;i++)addParticle(petX,petY+20,'#9e9e9e','✨',-1);
    if(st===6)for(let i=0;i<6;i++)addParticle(petX+(Math.random()-0.5)*40,petY-20,'#e91e63','✨',-1.5-Math.random());
    let prog=8+Math.random()*6;
    if(G.stepClicks>2)prog*=0.9;
    if(G.quickClicks>3)prog*=0.8;
    o.stepProgress=Math.min(o.stepMax,o.stepProgress+prog);
    G.stepClicks++;
    o.lastStepTime=Date.now();
    if(o.stepProgress>=o.stepMax)finishCurrentStep();
}

function handlePointerDown(e){
    initAudio();
    const p=getPos(e);
    if(G.state===STATE_MENU){if(hitBtn(p,'start')){startGame();return}}
    else if(G.state===STATE_OVER){
        if(hitBtn(p,'restart')){startGame();return}
        if(hitBtn(p,'menu')){G.state=STATE_MENU;return}
    }else if(G.state===STATE_PAUSE){
        if(hitBtn(p,'resume')){togglePause();return}
        if(hitBtn(p,'quit')){G.state=STATE_MENU;return}
    }else if(G.state===STATE_PLAYING&&!G.paused){
        if(G.currentOrder){
            const o=G.currentOrder;
            const petX=W/2,petY=360;
            const d=Math.hypot(p.x-petX,p.y-petY);
            if(d<70){
                doStepAction();
                G.isDragging=true;G.dragStart=p;
                G.stepLastPos=p;
                return;
            }
            for(let i=0;i<o.steps.length;i++){
                if(hitBtn(p,'step_'+i)){
                    if(i===o.stepIndex)doStepAction();
                    else if(i<o.stepIndex){addPopup(p.x,p.y,'已完成!','#9e9e9e');}
                    else{addPopup(p.x,p.y,'还没到这一步!','#ff9800');sfxBad();}
                    return;
                }
            }
            if(hitBtn(p,'acceptBtn')){acceptNextOrder();return}
            if(hitBtn(p,'skipBtn')){skipOrder();return}
        }else{
            if(hitBtn(p,'acceptBtn')){acceptNextOrder();return}
        }
    }
}
function handlePointerMove(e){
    if(G.state!==STATE_PLAYING||G.paused)return;
    const p=getPos(e);
    if(G.isDragging&&G.currentOrder&&G.stepLastPos){
        const dx=p.x-G.stepLastPos.x,dy=p.y-G.stepLastPos.y;
        const dist=Math.hypot(dx,dy);
        if(dist>6){
            G.stepClicks++;
            const o=G.currentOrder;
            const st=o.steps[o.stepIndex];
            if(st===1||st===0||st===2)stepSfx(st);
            o.stepProgress=Math.min(o.stepMax,o.stepProgress+dist*0.1);
            if(o.stepProgress>=o.stepMax)finishCurrentStep();
            G.stepLastPos=p;
        }
    }
}
function handlePointerUp(e){
    G.isDragging=false;G.dragStart=null;G.stepLastPos=null;
    if(G.stepClicks>=4){setTimeout(()=>{G.stepClicks=0;},800);}
}

canvas.addEventListener('mousedown',handlePointerDown);
canvas.addEventListener('mousemove',handlePointerMove);
canvas.addEventListener('mouseup',handlePointerUp);
canvas.addEventListener('mouseleave',handlePointerUp);
canvas.addEventListener('touchstart',function(e){e.preventDefault();handlePointerDown(e)},{passive:false});
canvas.addEventListener('touchmove',function(e){e.preventDefault();handlePointerMove(e)},{passive:false});
canvas.addEventListener('touchend',function(e){e.preventDefault();handlePointerUp(e)},{passive:false});

function finishCurrentStep(){
    const o=G.currentOrder;if(!o)return;
    const pct=o.stepProgress/o.stepMax;
    let q=3;
    if(pct>1.1||G.stepClicks>15)q=1;
    else if(pct<0.95)q=2;
    if(o.patience<60)q=Math.min(q,2);
    if(o.patience<30)q=Math.min(q,1);
    o.stepQualities.push(q);
    o.stepIndex++;
    o.stepProgress=0;
    G.stepClicks=0;
    sfxBell();
    if(o.stepIndex>=o.steps.length){
        finishOrder(o,q);
    }else{
        addPopup(W/2,280,'✅ '+STEP_NAMES[o.steps[o.stepIndex-1]]+'完成! 下一步:'+STEP_NAMES[o.steps[o.stepIndex]],STEP_COLORS[o.steps[o.stepIndex-1]]);
    }
}
function finishOrder(o,lastQ){
    const avgQ=o.stepQualities.length>0?(o.stepQualities.reduce((a,b)=>a+b,0)/o.stepQualities.length):2;
    let stars=1;
    if(avgQ>=2.3)stars=2;
    if(avgQ>=2.85&&o.patience>40)stars=3;
    let pay=Math.floor(o.template.baseReward*(stars/3));
    if(o.patience<20)pay=Math.floor(pay*0.8);
    G.coins+=pay;G.score+=pay+stars*20;G.totalStars+=stars;
    G.ordersDone++;
    for(let i=0;i<stars;i++)setTimeout(()=>{sfxStar();addPopup(W/2+i*25-25,300,'⭐','#ffd700');},i*200);
    addPopup(W/2,240,'🎉 '+o.pet.name+'美容完成! '+stars+'星 +'+pay+'金','#4caf50');
    G.currentOrder=null;
    if(G.queue.length>0){
        setTimeout(()=>{
            if(G.queue.length>0){G.currentOrder=G.queue.shift();}
        },800);
    }
}
function skipOrder(){
    if(!G.currentOrder)return;
    G.ordersFailed++;
    G.score=Math.max(0,G.score-40);
    addPopup(W/2,240,'❌ 放弃订单 -40分','#f44336');
    sfxAngry();
    G.currentOrder=null;
    if(G.queue.length>0){G.currentOrder=G.queue.shift();}
}
function acceptNextOrder(){
    if(G.queue.length===0){addPopup(W/2,150,'暂无顾客,稍等片刻...','#ff9800');return;}
    if(G.currentOrder){addPopup(W/2,150,'请先完成当前订单!','#f44336');sfxBad();return;}
    G.currentOrder=G.queue.shift();
    addPopup(W/2,200,'🛎 新订单来啦! '+G.currentOrder.pet.name+' '+G.currentOrder.template.level,'#ff9800');
    sfxBell();
}

function startGame(){
    initAudio();
    G.state=STATE_PLAYING;G.score=0;G.timeLeft=GAME_TIME*60;
    G.coins=0;G.ordersDone=0;G.ordersFailed=0;G.totalStars=0;
    G.currentOrder=null;G.nextOrderTimer=40;G.queue=[];
    G.particles=[];G.popups=[];G.paused=false;
    G.stepClicks=0;G.quickClicks=0;
    sfxBtn();
}
function endGame(){
    G.state=STATE_OVER;
    if(G.score>G.highScore){G.highScore=G.score;Storage.save('cwmrd_highscore',G.highScore);}
    sfxBuzzer();
}
function togglePause(){
    G.paused=!G.paused;
    if(G.paused)G.state=STATE_PAUSE;else G.state=STATE_PLAYING;
    sfxBtn();
}

function update(){
    if(G.state!==STATE_PLAYING||G.paused)return;
    G.timeLeft--;
    if(G.timeLeft<=0){endGame();return}
    G.nextOrderTimer--;
    if(G.nextOrderTimer<=0&&(G.queue.length+1)<=G.maxQueue&&!G.currentOrder){
        const o=createOrder();
        if(G.queue.length<G.maxQueue&&!G.currentOrder&&G.queue.length===0){
            G.currentOrder=o;
            addPopup(W/2,200,'🛎 新顾客: '+o.pet.name+' ('+o.template.level+')','#ff9800');
            sfxBell();
        }else if(G.queue.length<G.maxQueue){
            G.queue.push(o);
            addPopup(W-60,300,'👥 排队+1','#9c27b0');
        }
        G.nextOrderTimer=240+Math.floor(Math.random()*180);
    }
    if(G.currentOrder){
        const o=G.currentOrder;
        o.patience-=0.08+(o.steps.length>4?0.04:0);
        if(o.patience<40&&Math.random()<0.01)sfxAngry();
        if(o.patience<=0){
            G.ordersFailed++;G.score=Math.max(0,G.score-50);
            addPopup(W/2,240,'😡 顾客走了! -50分','#f44336');
            sfxAngry();
            G.currentOrder=null;
            if(G.queue.length>0)G.currentOrder=G.queue.shift();
        }
    }
    updateParticles();
}

function drawPet(ctx,o,dirty,soaped){
    const px=W/2,py=360;
    const bob=Math.sin(Date.now()/500)*2;
    ctx.save();ctx.translate(px,py+bob);
    ctx.fillStyle='rgba(0,0,0,0.25)';
    ctx.beginPath();ctx.ellipse(0,80,55,8,0,0,Math.PI*2);ctx.fill();
    if(soaped){
        ctx.fillStyle='rgba(206,147,216,0.7)';
        for(let i=0;i<12;i++){
            ctx.beginPath();ctx.arc((Math.random()-0.5)*80,20+(Math.random()-0.5)*60,8+Math.random()*12,0,Math.PI*2);ctx.fill();
        }
    }
    if(dirty){
        ctx.fillStyle='rgba(109,76,65,0.5)';
        for(let i=0;i<8;i++){
            ctx.beginPath();ctx.arc((Math.random()-0.5)*70,20+(Math.random()-0.5)*60,4+Math.random()*6,0,Math.PI*2);ctx.fill();
        }
    }
    ctx.scale(1.5,1.5);
    ctx.font='55px Arial';ctx.textAlign='center';
    ctx.fillText(o.pet.emoji,0,30);
    ctx.restore();
    if(!o.completed&&o.patience<60){
        ctx.font='24px Arial';ctx.textAlign='center';
        ctx.fillText((o.patience<30?'😡':'😠'),px+40,py-50);
    }
    ctx.textAlign='left';
    let wet=false,soap=false;
    const si=o.stepIndex;
    for(let i=0;i<si;i++){
        if(o.steps[i]===0)wet=true;
        if(o.steps[i]===1)soap=true;
        if(o.steps[i]===2){wet=true;soap=false;}
    }
}

function drawScene(ctx){
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#f8bbd0');g.addColorStop(0.45,'#fce4ec');g.addColorStop(0.7,'#fff3e0');g.addColorStop(1,'#ffe0b2');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(233,30,99,0.08)';
    for(let i=0;i<20;i++){
        ctx.beginPath();ctx.arc(((i*137)%W),((i*89)%(H-80)),4+(i%3)*2,0,Math.PI*2);ctx.fill();
    }
    ctx.fillStyle='#d7ccc8';
    ctx.fillRect(0,H-100,W,100);
    ctx.fillStyle='#bcaaa4';
    for(let x=0;x<W;x+=30)ctx.fillRect(x,H-100,1,100);
    ctx.fillStyle='#f8bbd0';
    roundRect(ctx,40,210,W-80,330,18);ctx.fill();
    ctx.strokeStyle='#ec407a';ctx.lineWidth=3;
    roundRect(ctx,40,210,W-80,330,18);ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold 13px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.fillText('✂️ 美容台 ✂️',W/2,232);
    ctx.textAlign='left';
    ctx.fillStyle='#fff';
    roundRect(ctx,80,560,W-160,40,12);ctx.fill();
    ctx.strokeStyle='#bdbdbd';ctx.lineWidth=2;
    roundRect(ctx,80,560,W-160,40,12);ctx.stroke();
    ctx.font='11px "Microsoft YaHei"';ctx.fillStyle='#757575';
    ctx.textAlign='center';ctx.fillText('💈 宠物美容店 · 点击或拖动宠物进行操作 💈',W/2,585);
    ctx.textAlign='left';
    ctx.fillStyle='#c8a2c8';
    for(let i=0;i<5;i++){
        ctx.fillRect(50+i*5,208,2,5);
        ctx.fillRect(W-60+i*5,208,2,5);
    }
}

function drawCustomer(ctx,o,x,y,side){
    if(!o)return;
    ctx.save();ctx.translate(x,y);
    ctx.font='50px Arial';ctx.textAlign='center';
    ctx.fillText(o.pet.customer,0,0);
    ctx.font='18px Arial';ctx.fillText(o.pet.emoji,0,25);
    ctx.fillStyle=o.template.color;
    roundRect(ctx,-45,36,90,22,8);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 10px "Microsoft YaHei"';
    ctx.fillText(o.template.level+'订单',0,51);
    ctx.fillStyle='rgba(0,0,0,0.6)';
    roundRect(ctx,-50,-72,100,20,5);ctx.fill();
    ctx.fillStyle=o.patience>60?'#4caf50':o.patience>30?'#ff9800':'#f44336';
    roundRect(ctx,-48,-70,96*(o.patience/o.patienceMax),16,4);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 9px Arial';
    ctx.fillText('耐心'+Math.floor(o.patience)+'%',0,-58);
    ctx.restore();
}

function drawOrderPanel(ctx){
    const o=G.currentOrder;
    ctx.fillStyle='rgba(0,0,0,0.78)';
    roundRect(ctx,8,8,W-16,130,10);ctx.fill();
    if(o){
        drawCustomer(ctx,o,60,72,-1);
        ctx.fillStyle='#fff';ctx.font='bold 15px "Microsoft YaHei"';
        ctx.fillText(o.pet.customer+' · '+o.pet.name,120,28);
        ctx.fillStyle=o.template.color;ctx.font='bold 12px "Microsoft YaHei"';
        ctx.fillText('【'+o.template.level+'】'+o.steps.length+'步 · 基础'+o.template.baseReward+'金',120,46);
        ctx.fillStyle='#ffd700';ctx.font='bold 12px Arial';
        ctx.fillText('💰 '+G.coins,120,66);
        const boxX=120,boxY=78,sw=44,sh=42,gap=4;
        for(let i=0;i<o.steps.length;i++){
            const x=boxX+i*(sw+gap);
            const done=i<o.stepIndex;
            const cur=i===o.stepIndex;
            ctx.fillStyle=done?'#4caf50':cur?STEP_COLORS[o.steps[i]]:'#333';
            roundRect(ctx,x,boxY,sw,sh,6);ctx.fill();
            ctx.strokeStyle=cur?'#ffd700':'rgba(255,255,255,0.3)';ctx.lineWidth=cur?2:1;
            roundRect(ctx,x,boxY,sw,sh,6);ctx.stroke();
            ctx.font='18px Arial';ctx.textAlign='center';ctx.fillStyle='#fff';
            ctx.fillText(STEP_ICONS[o.steps[i]],x+sw/2,boxY+sh/2+4);
            if(done){
                ctx.fillStyle='#ffd700';ctx.font='10px Arial';
                ctx.fillText('✓'+(o.stepQualities[i]?'★'.repeat(o.stepQualities[i]):''),x+sw/2,boxY+sh-3);
            }else if(cur){
                ctx.fillStyle='#333';ctx.fillRect(x+3,boxY-10,sw-6,5);
                ctx.fillStyle='#ffd700';ctx.fillRect(x+3,boxY-10,(sw-6)*(o.stepProgress/o.stepMax),5);
            }
            ctx.textAlign='left';
            G.btnRects['step_'+i]={x,y:boxY,w:sw,h:sh};
        }
        ctx.fillStyle='#aaa';ctx.font='11px "Microsoft YaHei"';
        if(o.stepIndex<o.steps.length){
            ctx.fillText('下一步: '+STEP_ICONS[o.steps[o.stepIndex]]+STEP_NAMES[o.steps[o.stepIndex]]+' (点击/滑动宠物)',boxX,130);
        }
    }else{
        ctx.fillStyle='#fff';ctx.font='bold 16px "Microsoft YaHei"';
        ctx.fillText('🛎 等待顾客光临...',20,32);
        ctx.fillStyle='#ffd700';ctx.font='bold 13px Arial';
        ctx.fillText('💰 金币: '+G.coins,20,54);
        ctx.fillStyle='#aaa';ctx.font='12px "Microsoft YaHei"';
        ctx.fillText('排队中: '+G.queue.length+'/'+G.maxQueue,20,76);
        ctx.fillText('完成: '+G.ordersDone+'单  失败: '+G.ordersFailed+'单  总星: '+G.totalStars,20,96);
    }
    const secs=Math.ceil(G.timeLeft/60);
    ctx.textAlign='right';
    ctx.fillStyle=secs<=20?'#ff5252':'#fff';ctx.font='bold 26px Arial';
    ctx.fillText('⏱ '+secs+'s',W-20,36);
    ctx.fillStyle='#90caf9';ctx.font='11px "Microsoft YaHei"';
    ctx.fillText('最高分: '+G.highScore,W-20,58);
    ctx.fillStyle='#c5e1a5';
    ctx.fillText('⭐总星: '+G.totalStars,W-20,78);
    ctx.textAlign='left';
}

function drawStepProgress(ctx,o){
    if(!o||o.stepIndex>=o.steps.length)return;
    const st=o.steps[o.stepIndex];
    const cx=W/2,cy=510;
    ctx.fillStyle=STEP_COLORS[st];
    roundRect(ctx,cx-160,cy-22,320,44,10);ctx.fill();
    ctx.fillStyle='rgba(0,0,0,0.4)';
    roundRect(ctx,cx-155,cy-5,310,22,5);ctx.fill();
    ctx.fillStyle='#fff';
    roundRect(ctx,cx-155,cy-5,310*(o.stepProgress/o.stepMax),22,5);ctx.fill();
    ctx.font='20px Arial';ctx.textAlign='center';ctx.fillStyle='#fff';
    ctx.fillText(STEP_ICONS[st]+' '+STEP_NAMES[st]+'  '+Math.floor(o.stepProgress)+'%',cx,cy+11);
    ctx.textAlign='left';
}

function drawQueue(ctx){
    let qy=155;
    for(let i=0;i<G.queue.length;i++){
        const o=G.queue[i];
        ctx.fillStyle='rgba(156,39,176,0.85)';
        roundRect(ctx,W-92,qy,84,28,8);ctx.fill();
        ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=1;
        roundRect(ctx,W-92,qy,84,28,8);ctx.stroke();
        ctx.font='15px Arial';ctx.textAlign='center';ctx.fillStyle='#fff';
        ctx.fillText(o.pet.customer+o.pet.emoji+' '+o.template.level,W-50,qy+20);
        ctx.textAlign='left';
        qy+=34;
    }
}

function drawActionBtns(ctx){
    if(!G.currentOrder){
        drawBtn(ctx,W/2-90,H-60,180,45,G.queue.length>0?'🛎 接下一位顾客':'⏳ 等待中...','acceptBtn',G.queue.length>0?'#4caf50':'#78909c','排队:'+G.queue.length+'/'+G.maxQueue);
    }else{
        const o=G.currentOrder;
        const st=o.steps[o.stepIndex];
        drawBtn(ctx,12,H-60,110,45,STEP_ICONS[st]+STEP_NAMES[st],'stepSelf',STEP_COLORS[st],'点击宠物操作');
        drawBtn(ctx,358,H-60,110,45,'❌ 放弃','skipBtn','#757575','-40分');
    }
}

function drawMenu(ctx){
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#ad1457');g.addColorStop(0.5,'#c2185b');g.addColorStop(1,'#ef6c00');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.save();ctx.translate(W/2,210);
    const sc=1.5+Math.sin(Date.now()/500)*0.05;ctx.scale(sc,sc);
    ctx.font='80px Arial';ctx.textAlign='center';ctx.fillText('🐩✂️🐱',0,0);
    ctx.restore();
    ctx.fillStyle='#fff';ctx.font='bold 44px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.fillText('宠物美容店',W/2,310);
    ctx.fillStyle='#ffd180';ctx.font='18px "Microsoft YaHei"';
    ctx.fillText('90秒内完成4位顾客的宠物美容!',W/2,340);
    ctx.fillStyle='#ffd700';ctx.font='bold 16px "Microsoft YaHei"';
    ctx.fillText('🌟 最高分: '+G.highScore,W/2,375);
    drawBtn(ctx,W/2-100,405,200,60,'开始营业','start','#e91e63');
    ctx.fillStyle='#fff';ctx.font='13px "Microsoft YaHei"';
    let yy=490;
    const tips=[
        '📋 玩法说明：',
        '• 每单有简单(2步)/中等(4步)/复杂(7步) 3级',
        '• 步骤: 淋湿→浴液→冲洗→吹干→剪毛→指甲→蝴蝶结',
        '• 点击或拖动宠物完成当前步骤, 进度条满即可',
        '• 耐心条下降越快,星级越低,顾客走了扣分',
        '• 最终星级: ★★★完美/★★一般/★差评 → 报酬不同',
        '• 中途不耐烦(太久不操作)扣20%报酬'
    ];
    for(const t of tips){ctx.fillText(t,W/2,yy);yy+=20;}
    ctx.fillStyle='#ffd700';ctx.font='bold 12px "Microsoft YaHei"';
    ctx.fillText('空格/回车=开始  Esc=暂停',W/2,yy+12);
    ctx.textAlign='left';
}

function drawPause(ctx){
    ctx.fillStyle='rgba(0,0,0,0.82)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 48px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.fillText('⏸ 暂停中',W/2,H/2-60);
    drawBtn(ctx,W/2-90,H/2-20,180,55,'▶ 继续营业','resume','#e91e63');
    drawBtn(ctx,W/2-70,H/2+50,140,45,'← 返回菜单','quit','#757575');
    ctx.textAlign='left';
}

function drawGameOver(ctx){
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#ad1457');g.addColorStop(1,'#ef6c00');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fillRect(0,0,W,H);
    const isNew=G.score>=G.highScore&&G.score>0;
    ctx.fillStyle=isNew?'#ffd700':'#fff';ctx.font='bold 40px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.fillText(isNew?'🎉 新纪录!':'⏱ 打烊!',W/2,100);
    ctx.font='55px Arial';ctx.fillText('🏪',W/2,170);
    ctx.fillStyle='#fff';ctx.font='bold 20px "Microsoft YaHei"';
    ctx.fillText('今日营业报表',W/2,210);
    ctx.fillStyle='rgba(255,255,255,0.1)';
    roundRect(ctx,40,230,W-80,240,14);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=2;
    roundRect(ctx,40,230,W-80,240,14);ctx.stroke();
    let yy=260;
    ctx.fillStyle='#ddd';ctx.font='14px "Microsoft YaHei"';ctx.textAlign='left';
    const rows=[
        ['💇 完成订单',G.ordersDone+'单'],
        ['😡 失败订单',G.ordersFailed+'单'],
        ['⭐ 累计星星',G.totalStars+' 颗'],
        ['💰 营业金币',G.coins+'金'],
        ['📊 成功率',G.ordersDone+G.ordersFailed>0?Math.floor(G.ordersDone/(G.ordersDone+G.ordersFailed)*100):0+'%'],
        ['🏆 额外得分','⭐×20 = '+(G.totalStars*20)],
    ];
    for(const [k,v] of rows){
        ctx.fillStyle='#bbb';ctx.fillText(k,60,yy);
        ctx.fillStyle='#fff';ctx.textAlign='right';ctx.fillText(v,W-60,yy);
        ctx.textAlign='left';yy+=24;
    }
    yy+=12;
    ctx.fillStyle='#ffd700';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText('总分: '+G.score,W/2,yy+10);
    yy+=45;
    ctx.fillStyle='#aaa';ctx.font='13px "Microsoft YaHei"';
    ctx.fillText('历史最高: '+G.highScore,W/2,yy+5);
    drawBtn(ctx,W/2-95,yy+22,190,55,'🔄 再玩一次','restart','#e91e63');
    drawBtn(ctx,W/2-80,yy+87,160,45,'🏠 返回菜单','menu','#757575');
    ctx.textAlign='left';
}

function draw(){
    switch(G.state){
        case STATE_MENU:drawMenu(ctx);break;
        case STATE_PLAYING:
            drawScene(ctx);
            if(G.currentOrder){
                drawPet(ctx,G.currentOrder);
                drawStepProgress(ctx,G.currentOrder);
            }
            drawParticles(ctx);
            drawOrderPanel(ctx);
            drawQueue(ctx);
            drawActionBtns(ctx);
            break;
        case STATE_PAUSE:
            drawScene(ctx);
            if(G.currentOrder)drawPet(ctx,G.currentOrder);
            drawOrderPanel(ctx);drawActionBtns(ctx);
            drawPause(ctx);
            break;
        case STATE_OVER:drawGameOver(ctx);break;
    }
}

setInterval(function(){update();draw();},16);

const _sbtn=document.getElementById('start-game-btn');
_sbtn.addEventListener('click',function(){initAudio();startGame();this.style.display='none';});

})();

    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
