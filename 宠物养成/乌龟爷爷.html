<body>

<button id="start-game-btn" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:20px 40px;font-size:20px;background:#4caf50;color:white;border:none;border-radius:12px;cursor:pointer;z-index:999;font-weight:bold;display:none;">开始游戏</button>

<canvas id="c"></canvas>

<script>
if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
</script>
<script src="../game_core.js"></script>
<script>
(function(){
"use strict";

const W=480,H=720;
const GAME_TIME=180;
const DECAY_INTERVAL=180;

let audioCtx=null;
function initAudio(){
    if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
}
function playTone(freq,dur,type,vol){
    if(!audioCtx)return;
    try{
        const o=audioCtx.createOscillator();
        const g=audioCtx.createGain();
        o.type=type||'sine';
        o.frequency.value=freq;
        g.gain.value=vol||0.12;
        g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
        o.connect(g);g.connect(audioCtx.destination);
        o.start();o.stop(audioCtx.currentTime+dur);
    }catch(e){}
}
function sfxEat(){playTone(500,0.08,'sine',0.12);setTimeout(()=>playTone(600,0.08,'sine',0.1),70);setTimeout(()=>playTone(700,0.12,'sine',0.1),140)}
function sfxBath(){playTone(800,0.06,'triangle',0.1)}
function sfxPlay(){playTone(650,0.08,'sine',0.12);setTimeout(()=>playTone(850,0.12,'sine',0.1),100)}
function sfxSun(){playTone(400,0.2,'sine',0.1)}
function sfxWish(){playTone(523,0.08,'sine',0.15);setTimeout(()=>playTone(659,0.08,'sine',0.15),80);setTimeout(()=>playTone(784,0.08,'sine',0.15),160);setTimeout(()=>playTone(1047,0.2,'sine',0.15),240)}
function sfxBuzzer(){playTone(150,0.4,'sawtooth',0.18)}
function sfxBtn(){playTone(600,0.06,'sine',0.1)}
function sfxBad(){playTone(200,0.2,'square',0.12)}
function sfxYawn(){playTone(300,0.15,'sine',0.1);setTimeout(()=>playTone(250,0.2,'sine',0.08),100)}
function sfxButterfly(){playTone(1200,0.05,'sine',0.08);setTimeout(()=>playTone(1400,0.05,'sine',0.06),40);setTimeout(()=>playTone(1600,0.08,'sine',0.05),80)}
function sfxAchievement(){playTone(784,0.1,'sine',0.14);setTimeout(()=>playTone(988,0.1,'sine',0.14),100);setTimeout(()=>playTone(1175,0.14,'sine',0.14),200);setTimeout(()=>playTone(1568,0.22,'sine',0.14),320)}

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let scale=1;
function resize(){
    const r=W/H;
    let cw=window.innerWidth,ch=window.innerHeight;
    if(cw/ch>r){ch=cw/r}else{cw=ch*r}
    canvas.width=cw;canvas.height=ch;
    scale=cw/W;
    ctx.setTransform(scale,0,0,scale,0,0);
}
window.addEventListener('resize',resize);
resize();

const ACHIEVEMENTS=[
    {id:'first_feed',name:'初次喂食',desc:'第一次喂乌龟爷爷',icon:'🍖',unlocked:false},
    {id:'fish_master',name:'小鱼达人',desc:'喂食小鱼5次',icon:'🐟',need:5,unlocked:false},
    {id:'clean_freak',name:'洁癖爱好者',desc:'清洁度达到100',icon:'💧',unlocked:false},
    {id:'sunshine',name:'阳光老爷爷',desc:'累计晒太阳30秒',icon:'☀️',need:30,unlocked:false},
    {id:'walker',name:'散步爱好者',desc:'累计走30步路',icon:'🚶',need:30,unlocked:false},
    {id:'happy_master',name:'心情大师',desc:'心情达到100',icon:'😊',unlocked:false},
    {id:'wishes_all',name:'心愿达成',desc:'完成全部4个心愿',icon:'🌟',unlocked:false},
    {id:'caretaker',name:'百岁守护者',desc:'所有属性同时保持80+达30秒',icon:'👴',need:30,unlocked:false}
];

const G={
    state:STATE_MENU,
    score:0,
    highScore:0,
    timeLeft:GAME_TIME*60,
    turtle:{
        hunger:80,mood:80,health:80,clean:80,
        x:240,y:420,
        tx:240,ty:420,
        facing:1,
        walkStep:0,
        walking:false,
        walkCooldown:0,
        totalSteps:0,
        inSun:false,
        sunTimer:0,
        totalSunTime:0,
        scrubClicks:0,
        scrubArea:null,
        animState:'idle',
        animTimer:0,
        blinkTimer:0,
        isBlinking:false,
        mouthOpen:false
    },
    decayTimer:0,
    wishes:{
        w1:{need:3,cur:0,done:false,name:'吃3次小鱼'},
        w2:{need:30,cur:0,done:false,name:'清洁度90+维持30秒'},
        w3:{need:10,cur:0,done:false,name:'走10步路'},
        w4:{need:5,cur:0,done:false,name:'陪玩5次'}
    },
    particles:[],
    popups:[],
    btnRects:{},
    currentAction:null,
    actionTimer:0,
    actionData:{},
    keys:{},
    dragStart:null,
    dragging:null,
    sunZone:{x:340,y:180,w:110,h:100},
    foodMenuOpen:false,
    playMenuOpen:false,
    paused:false,
    scrubActive:false,
    scrubCount:0,
    achievements:JSON.parse(JSON.stringify(ACHIEVEMENTS)),
    achievementQueue:[],
    showAchievement:null,
    achievementTimer:0,
    totalFeeds:0,
    totalFishFeeds:0,
    totalBaths:0,
    totalPlays:0,
    allStatsGoodTimer:0,
    weather:'sunny',
    weatherTimer:0,
    clouds:[],
    butterflies:[],
    nextButterfly:300,
    fishInPond:[],
    lotusInPond:[],
    tutorialStep:0,
    tutorialVisible:true,
    decorAnim:0,
    fireflies:[]
};

for(let i=0;i<3;i++)G.clouds.push({x:Math.random()*W,y:30+Math.random()*50,speed:0.1+Math.random()*0.15,scale:0.6+Math.random()*0.6});
for(let i=0;i<5;i++)G.fishInPond.push({x:60+Math.random()*100,y:540+Math.random()*40,phase:Math.random()*100,speed:0.3+Math.random()*0.4,color:['#ff7043','#ffca28','#ec407a','#5c6bc0','#66bb6a'][i%5]});
for(let i=0;i<3;i++)G.lotusInPond.push({x:50+i*60,y:530+Math.random()*20,scale:0.8+Math.random()*0.4,phase:Math.random()*100});
for(let i=0;i<8;i++)G.fireflies.push({x:Math.random()*W,y:300+Math.random()*200,phase:Math.random()*100,speed:0.02+Math.random()*0.03});

G.highScore=parseInt(Storage.load('wg_highscore','0'));

function unlockAchievement(id){
    const a=G.achievements.find(x=>x.id===id);
    if(!a||a.unlocked)return;
    a.unlocked=true;
    G.achievementQueue.push(a);
    sfxAchievement();
    G.score+=50;
    for(let i=0;i<15;i++){
        const ang=Math.random()*Math.PI*2;
        addParticle(W/2,250,'#ffd700','✨',Math.cos(ang)*2,Math.sin(ang)*2-1,3);
    }
}

function checkAchievements(){
    const t=G.turtle;
    if(G.totalFeeds>=1)unlockAchievement('first_feed');
    if(G.totalFishFeeds>=5)unlockAchievement('fish_master');
    if(t.clean>=100)unlockAchievement('clean_freak');
    if(t.totalSunTime>=30*60)unlockAchievement('sunshine');
    if(t.totalSteps>=30)unlockAchievement('walker');
    if(t.mood>=100)unlockAchievement('happy_master');
    if(G.wishes.w1.done&&G.wishes.w2.done&&G.wishes.w3.done&&G.wishes.w4.done)unlockAchievement('wishes_all');
    const allGood=t.hunger>=80&&t.mood>=80&&t.health>=80&&t.clean>=80;
    if(allGood){
        G.allStatsGoodTimer++;
        if(G.allStatsGoodTimer>=30*60)unlockAchievement('caretaker');
    }else{
        G.allStatsGoodTimer=Math.max(0,G.allStatsGoodTimer-2);
    }
}

function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
}

function drawBtn(ctx,x,y,w,h,text,name,color,sub){
    G.btnRects[name]={x:x,y:y,w:w,h:h};
    ctx.fillStyle=color||'#4caf50';
    ctx.strokeStyle='rgba(255,255,255,0.5)';
    ctx.lineWidth=2;
    roundRect(ctx,x,y,w,h,8);
    ctx.fill();ctx.stroke();
    ctx.fillStyle='#fff';
    ctx.font='bold 16px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(text,x+w/2,y+h/2-6);
    if(sub){
        ctx.font='11px "Microsoft YaHei"';
        ctx.fillStyle='rgba(255,255,255,0.8)';
        ctx.fillText(sub,x+w/2,y+h/2+12);
    }
    ctx.textBaseline='alphabetic';
    ctx.textAlign='left';
}

function hitBtn(p,name){
    const r=G.btnRects[name];
    return r && p.x>=r.x && p.x<=r.x+r.w && p.y>=r.y && p.y<=r.y+r.h;
}

function getPos(e){
    const rect=canvas.getBoundingClientRect();
    const t=e.touches?e.touches[0]:(e.changedTouches?e.changedTouches[0]:e);
    if(!t)return{x:0,y:0};
    return{x:(t.clientX-rect.left)/scale,y:(t.clientY-rect.top)/scale};
}

function addParticle(x,y,color,text,vy,size){
    G.particles.push({x:x,y:y,vx:(Math.random()-0.5)*3,vy:vy||-2,life:40,maxLife:40,color:color,text:text,size:size||3+Math.random()*3});
}
function addPopup(x,y,text,color){
    G.popups.push({x:x,y:y,text:text,color:color||'#fff',life:50,maxLife:50,vy:-1.2});
}
function updateParticles(){
    for(let i=G.particles.length-1;i>=0;i--){
        const p=G.particles[i];
        p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life--;
        if(p.life<=0)G.particles.splice(i,1);
    }
    for(let i=G.popups.length-1;i>=0;i--){
        const p=G.popups[i];
        p.y+=p.vy;p.life--;
        if(p.life<=0)G.popups.splice(i,1);
    }
}
function drawParticles(ctx){
    for(const p of G.particles){
        ctx.globalAlpha=p.life/p.maxLife;
        if(p.text){
            ctx.fillStyle=p.color;
            ctx.font='bold 16px Arial';
            ctx.textAlign='center';
            ctx.fillText(p.text,p.x,p.y);
            ctx.textAlign='left';
        }else{
            ctx.fillStyle=p.color;
            ctx.beginPath();
            ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
            ctx.fill();
        }
    }
    ctx.globalAlpha=1;
    for(const p of G.popups){
        ctx.globalAlpha=p.life/p.maxLife;
        ctx.fillStyle=p.color;
        ctx.font='bold 15px "Microsoft YaHei"';
        ctx.textAlign='center';
        ctx.fillText(p.text,p.x,p.y);
        ctx.textAlign='left';
    }
    ctx.globalAlpha=1;
}

function drawAchievementNotice(ctx){
    if(!G.showAchievement&&G.achievementQueue.length>0){
        G.showAchievement=G.achievementQueue.shift();
        G.achievementTimer=180;
    }
    if(G.showAchievement){
        const a=G.showAchievement;
        G.achievementTimer--;
        const alpha=G.achievementTimer>150?(180-G.achievementTimer)/30:(G.achievementTimer<30?G.achievementTimer/30:1);
        ctx.globalAlpha=alpha;
        const yOff=G.achievementTimer>150?(150-G.achievementTimer)*0.8:(G.achievementTimer<30?(30-G.achievementTimer)*0.8:0);
        ctx.fillStyle='rgba(0,0,0,0.85)';
        roundRect(ctx,W/2-140,80-yOff,280,70,14);
        ctx.fill();
        ctx.strokeStyle='#ffd700';ctx.lineWidth=3;
        roundRect(ctx,W/2-140,80-yOff,280,70,14);
        ctx.stroke();
        ctx.font='40px Arial';ctx.textAlign='center';
        ctx.fillText(a.icon,W/2-95,128-yOff);
        ctx.fillStyle='#ffd700';ctx.font='bold 16px "Microsoft YaHei"';
        ctx.fillText('🏆 成就解锁!',W/2+20,105-yOff);
        ctx.fillStyle='#fff';ctx.font='bold 14px "Microsoft YaHei"';
        ctx.fillText(a.name,W/2+20,125-yOff);
        ctx.fillStyle='#bbb';ctx.font='11px "Microsoft YaHei"';
        ctx.fillText(a.desc+' +50分',W/2+20,142-yOff);
        ctx.textAlign='left';
        ctx.globalAlpha=1;
        if(G.achievementTimer<=0)G.showAchievement=null;
    }
}

window.addEventListener('keydown',function(e){
    G.keys[e.key.toLowerCase()]=true;
    if(e.key===' '||e.key==='Enter'){
        e.preventDefault();
        initAudio();
        if(G.state===STATE_MENU){startGame();return}
        if(G.state===STATE_OVER){startGame();return}
    }
    if(e.key==='Escape'){
        if(G.state===STATE_PLAYING)togglePause();
        else if(G.state===STATE_PLAYING&&(G.foodMenuOpen||G.playMenuOpen)){G.foodMenuOpen=false;G.playMenuOpen=false;}
    }
    if(e.key==='Tab'&&G.state===STATE_PLAYING&&!G.paused){
        e.preventDefault();
        G.tutorialVisible=!G.tutorialVisible;
    }
    if(G.state===STATE_PLAYING&&!G.paused){
        if(e.key==='1'){G.foodMenuOpen=!G.foodMenuOpen;G.playMenuOpen=false;sfxBtn()}
        if(e.key==='2'){startBath()}
        if(e.key==='3'){G.playMenuOpen=!G.playMenuOpen;G.foodMenuOpen=false;sfxBtn()}
        if(e.key==='4'){startSun()}
    }
    initAudio();
});
window.addEventListener('keyup',function(e){
    G.keys[e.key.toLowerCase()]=false;
});

function handlePointerDown(e){
    initAudio();
    const p=getPos(e);
    if(G.state===STATE_MENU){
        if(hitBtn(p,'start')){startGame();return}
    }else if(G.state===STATE_OVER){
        if(hitBtn(p,'restart')){startGame();return}
        if(hitBtn(p,'menu')){G.state=STATE_MENU;return}
    }else if(G.state===STATE_PAUSE){
        if(hitBtn(p,'resume')){togglePause();return}
        if(hitBtn(p,'quit')){G.state=STATE_MENU;return}
    }else if(G.state===STATE_PLAYING && !G.paused){
        if(G.foodMenuOpen){
            if(hitBtn(p,'food1')){feedTurtle(0);return}
            if(hitBtn(p,'food2')){feedTurtle(1);return}
            if(hitBtn(p,'food3')){feedTurtle(2);return}
            if(hitBtn(p,'foodClose')){G.foodMenuOpen=false;sfxBtn();return}
        }
        if(G.playMenuOpen){
            if(hitBtn(p,'play1')){playMassage();return}
            if(hitBtn(p,'play2')){playWalk();return}
            if(hitBtn(p,'playClose')){G.playMenuOpen=false;sfxBtn();return}
        }
        if(G.currentAction==='bath'){
            G.scrubActive=true;
            const t=G.turtle;
            const dx=p.x-(t.x),dy=p.y-(t.y-10);
            if(Math.hypot(dx,dy)<70){
                G.scrubCount++;
                t.clean=Math.min(100,t.clean+1);
                sfxBath();
                addParticle(p.x,p.y,'#87ceeb','💧',-1);
                if(G.scrubCount%10===0){
                    addPopup(t.x,t.y-60,'清洁+'+G.scrubCount,'#87ceeb');
                }
            }
            G.dragStart=p;
            G.dragging='bath';
            return;
        }
        if(hitBtn(p,'feedBtn')){G.foodMenuOpen=!G.foodMenuOpen;G.playMenuOpen=false;sfxBtn();return}
        if(hitBtn(p,'bathBtn')){startBath();return}
        if(hitBtn(p,'playBtn')){G.playMenuOpen=!G.playMenuOpen;G.foodMenuOpen=false;sfxBtn();return}
        if(hitBtn(p,'sunBtn')){startSun();return}
        const t=G.turtle;
        const dx=p.x-t.x,dy=p.y-t.y;
        if(Math.hypot(dx,dy)<50&&G.currentAction!=='sun'&&G.currentAction!=='bath'){
            if(t.animState!=='yawn'){
                t.animState='pet';
                t.animTimer=40;
                t.mood=Math.min(100,t.mood+0.5);
                addParticle(t.x+(Math.random()-0.5)*30,t.y-40,'#ff9fcf','💕',-1.5,2);
                sfxBtn();
                addPopup(t.x,t.y-70,'摸摸~ 心情+0.5','#ff9fcf');
            }
            return;
        }
        if(G.currentAction==='sun'){
            const tx=G.turtle.x,ty=G.turtle.y;
            const dx=p.x-tx,dy=p.y-ty;
            if(Math.hypot(dx,dy)<70){
                G.dragging='turtle';
                G.dragStart=p;
            }
        }
    }
}

function handlePointerMove(e){
    if(G.state!==STATE_PLAYING||G.paused)return;
    const p=getPos(e);
    if(G.dragging==='turtle' && G.currentAction==='sun'){
        G.turtle.x=Math.max(40,Math.min(W-40,p.x));
        G.turtle.y=Math.max(200,Math.min(H-220,p.y));
    }
    if(G.scrubActive && G.currentAction==='bath'){
        const t=G.turtle;
        const dx=p.x-(t.x),dy=p.y-(t.y-10);
        if(Math.hypot(dx,dy)<80 && G.dragStart){
            const moveDist=Math.hypot(p.x-G.dragStart.x,p.y-G.dragStart.y);
            if(moveDist>5){
                G.scrubCount++;
                t.clean=Math.min(100,t.clean+0.5);
                sfxBath();
                addParticle(p.x,p.y,'#87ceeb',null,-1.5);
                G.dragStart=p;
                if(G.scrubCount%15===0){
                    addPopup(t.x,t.y-60,'清洁度上升!','#87ceeb');
                }
            }
        }
    }
}

function handlePointerUp(e){
    const p=getPos(e);
    if(G.dragging==='turtle' && G.currentAction==='sun'){
        const sz=G.sunZone;
        const tx=G.turtle.x,ty=G.turtle.y;
        if(tx>sz.x&&tx<sz.x+sz.w&&ty>sz.y&&ty<sz.y+sz.h){
            G.turtle.inSun=true;
            addPopup(tx,ty-60,'开始晒太阳!','#ffd700');
            sfxSun();
        }else{
            G.turtle.inSun=false;
        }
    }
    G.dragging=null;
    G.dragStart=null;
    G.scrubActive=false;
}

canvas.addEventListener('mousedown',handlePointerDown);
canvas.addEventListener('mousemove',handlePointerMove);
canvas.addEventListener('mouseup',handlePointerUp);
canvas.addEventListener('mouseleave',handlePointerUp);
canvas.addEventListener('touchstart',function(e){e.preventDefault();handlePointerDown(e)},{passive:false});
canvas.addEventListener('touchmove',function(e){e.preventDefault();handlePointerMove(e)},{passive:false});
canvas.addEventListener('touchend',function(e){e.preventDefault();handlePointerUp(e)},{passive:false});

];

function spawnButterfly(){
    if(G.butterflies.length>=3)return;
    G.butterflies.push({
        x:-30,
        y:200+Math.random()*200,
        tx:W+50,
        ty:180+Math.random()*220,
        phase:Math.random()*100,
        color:['#e91e63','#9c27b0','#2196f3','#ff9800','#4caf50'][Math.floor(Math.random()*5)],
        speed:0.8+Math.random()*0.6
    });

}

function feedTurtle(idx){
    const f=FOOD_TYPES[idx];
    const t=G.turtle;
    t.hunger=Math.min(100,t.hunger+f.hunger);
    t.mood=Math.min(100,t.mood+f.mood);
    G.totalFeeds++;
    if(f.fish)G.totalFishFeeds++;
    addPopup(t.x,t.y-60,f.icon+' '+f.name+' +饱食'+f.hunger,f.fish?'#ff9800':'#4caf50');
    addParticle(t.x,t.y-30,f.fish?'#ff9800':'#4caf50',f.icon,-1.5);
    if(f.fish){
        G.wishes.w1.cur=Math.min(G.wishes.w1.need,G.wishes.w1.cur+1);
        if(G.wishes.w1.cur>=G.wishes.w1.need && !G.wishes.w1.done){
            G.wishes.w1.done=true;sfxWish();
            addPopup(W/2,200,'🌟 心愿达成: '+G.wishes.w1.name+'!','#ffd700');
        }
    }
    if(t.hunger>=95&&t.mood>=70){
        t.animState='yawn';
        t.animTimer=60;
        sfxYawn();
    }
    G.currentAction='eating';
    G.actionTimer=60;
    G.foodMenuOpen=false;
    sfxEat();
}

function startBath(){

function startSun(){

    G.turtle={

        facing:1,walkStep:0,walking:false,walkCooldown:0,
        totalSteps:0,inSun:false,sunTimer:0,totalSunTime:0,
        scrubClicks:0,scrubArea:null,
        animState:'idle',animTimer:0,blinkTimer:Math.random()*200,
        isBlinking:false,mouthOpen:false
    };
    G.wishes={
        w1:{need:3,cur:0,done:false,name:'吃3次小鱼'},
        w2:{need:30,cur:0,done:false,name:'清洁度90+维持30秒'},
        w3:{need:10,cur:0,done:false,name:'走10步路'},
        w4:{need:5,cur:0,done:false,name:'陪玩5次'}
    };
    G.particles=[];
    G.popups=[];

    G.actionTimer=0;

    G.totalFeeds=0;G.totalFishFeeds=0;G.totalBaths=0;G.totalPlays=0;G.allStatsGoodTimer=0;
    G.butterflies=[];G.nextButterfly=300;

function endGame(){
    G.state=STATE_OVER;
    const avg=(G.turtle.hunger+G.turtle.mood+G.turtle.health+G.turtle.clean)/4;
    let wishScore=0;
    for(const k in G.wishes){if(G.wishes[k].done)wishScore+=100;else wishScore+=G.wishes[k].cur/G.wishes[k].need*100;}
    const unlockedAch=G.achievements.filter(a=>a.unlocked).length;
    G.score=Math.floor(wishScore*avg)+unlockedAch*50;
    if(G.score>G.highScore){
        G.highScore=G.score;
        Storage.save('wg_highscore',G.highScore);
    }
    sfxBuzzer();
}

function togglePause(){
    G.paused=!G.paused;
    if(G.paused){G.state=STATE_PAUSE}else{G.state=STATE_PLAYING}
    sfxBtn();
}

function updateTurtle(){
    const t=G.turtle;
    t.blinkTimer++;
    if(t.blinkTimer>200+Math.random()*150){
        t.isBlinking=true;
        setTimeout(()=>{t.isBlinking=false;},120);
        t.blinkTimer=0;
    }
    if(t.animState!=='idle'){
        t.animTimer--;
        if(t.animTimer<=0)t.animState='idle';
    }
    if(t.walking || (t.x!==t.tx||t.y!==t.ty)){
        const dx=t.tx-t.x,dy=t.ty-t.y;
        const d=Math.hypot(dx,dy);
        if(d>2){
            const spd=0.6;
            t.x+=dx/d*spd;
            t.y+=dy/d*spd;
            t.facing=dx>0?1:-1;
            t.walkStep+=0.15;
            if(Math.floor(t.walkStep)%4===0 && t.walkStep%1<0.2){
                t.totalSteps++;
                G.wishes.w3.cur=Math.min(G.wishes.w3.need,t.totalSteps);
                if(G.wishes.w3.cur>=G.wishes.w3.need && !G.wishes.w3.done){
                    G.wishes.w3.done=true;sfxWish();
                    addPopup(W/2,200,'🌟 心愿达成: '+G.wishes.w3.name+'!','#ffd700');
                }
            }
        }else{
            t.walking=false;
            t.x=t.tx;t.y=t.ty;
        }
    }else{
        if(t.walkCooldown<=0 && Math.random()<0.003){
            t.tx=60+Math.random()*(W-120);
            t.ty=380+Math.random()*100;
            t.walking=true;
            t.walkCooldown=300;
        }
    }
    if(t.walkCooldown>0)t.walkCooldown--;
    if(t.inSun){
        t.sunTimer++;
        t.totalSunTime++;
        if(t.sunTimer%30===0){
            t.health=Math.min(100,t.health+0.5);
            if(t.sunTimer%60===0) addParticle(t.x+(Math.random()-0.5)*40,t.y-50,'#ffd700','☀',-0.5);
        }
    }else{
        t.sunTimer=0;
    }
    if(G.currentAction==='eating' && G.actionTimer>0)G.actionTimer--;
    if(G.currentAction==='massage' && G.actionTimer>0)G.actionTimer--;
}

function updateWeather(){
    G.weatherTimer++;
    if(G.weatherTimer>15*60){
        G.weatherTimer=0;
        const r=Math.random();
        if(r<0.5)G.weather='sunny';
        else if(r<0.8)G.weather='cloudy';
        else G.weather='dusk';
    }
    for(const c of G.clouds){
        c.x+=c.speed;
        if(c.x>W+60)c.x=-60;
    }
    G.nextButterfly--;
    if(G.nextButterfly<=0&&G.weather==='sunny'){
        spawnButterfly();
        G.nextButterfly=400+Math.random()*400;
    }
    for(let i=G.butterflies.length-1;i>=0;i--){
        const b=G.butterflies[i];
        b.phase+=0.1;
        b.x+=b.speed;
        b.y+=Math.sin(b.phase)*0.8;
        if(b.x>W+50)G.butterflies.splice(i,1);
    }
    for(const f of G.fishInPond){
        f.phase+=0.03;
        f.x+=Math.cos(f.phase)*f.speed;
        if(f.x<40)f.x=40;if(f.x>180)f.x=180;
    }
    G.decorAnim++;
}

function update(){
    if(G.state!==STATE_PLAYING||G.paused) return;
    G.timeLeft--;
    if(G.timeLeft<=0){endGame();return}
    G.decayTimer++;
    if(G.decayTimer>=DECAY_INTERVAL){
        G.decayTimer=0;
        const t=G.turtle;
        t.hunger=Math.max(0,t.hunger-2);
        t.mood=Math.max(0,t.mood-2);
        t.health=Math.max(0,t.health-1);
        t.clean=Math.max(0,t.clean-2);
        if(t.hunger<20||t.clean<20){
            t.health=Math.max(0,t.health-1);
            t.mood=Math.max(0,t.mood-1);
        }
    }
    if(G.turtle.clean>=90){
        G.wishes.w2.cur=Math.min(G.wishes.w2.need,G.wishes.w2.cur+1/60);
        if(G.wishes.w2.cur>=G.wishes.w2.need && !G.wishes.w2.done){
            G.wishes.w2.done=true;sfxWish();
            addPopup(W/2,200,'🌟 心愿达成: '+G.wishes.w2.name+'!','#ffd700');
        }
    }
    updateTurtle();
    updateWeather();
    checkAchievements();
    updateParticles();
}

function drawWeatherEffects(ctx){
    if(G.weather==='cloudy'){
        ctx.fillStyle='rgba(150,150,180,0.15)';
        ctx.fillRect(0,0,W,H);
    }else if(G.weather==='dusk'){
        const grad=ctx.createLinearGradient(0,0,0,H);
        grad.addColorStop(0,'rgba(255,120,50,0.25)');
        grad.addColorStop(0.5,'rgba(255,80,120,0.1)');
        grad.addColorStop(1,'rgba(50,20,80,0.1)');
        ctx.fillStyle=grad;
        ctx.fillRect(0,0,W,H);
    }
    ctx.fillStyle='rgba(255,255,255,0.9)';
    function drawCloud(cx,cy,s){
        ctx.beginPath();
        ctx.arc(cx,cy,15*s,0,Math.PI*2);
        ctx.arc(cx+15*s,cy-5*s,18*s,0,Math.PI*2);
        ctx.arc(cx+35*s,cy,16*s,0,Math.PI*2);
        ctx.arc(cx+20*s,cy+8*s,14*s,0,Math.PI*2);
        ctx.fill();
    }
    for(const c of G.clouds)drawCloud(c.x,c.y,c.scale);
    if(G.weather==='dusk'){
        for(const f of G.fireflies){
            f.phase+=f.speed;
            f.x+=Math.cos(f.phase*0.7)*0.4;
            f.y+=Math.sin(f.phase)*0.3;
            if(f.x<10)f.x=W-10;if(f.x>W-10)f.x=10;
            if(f.y<300)f.y=500;if(f.y>500)f.y=300;
            const alpha=0.5+Math.sin(f.phase*2)*0.5;
            ctx.globalAlpha=alpha;
            ctx.fillStyle='#ffeb3b';
            ctx.beginPath();ctx.arc(f.x,f.y,2.5,0,Math.PI*2);ctx.fill();
            ctx.fillStyle='rgba(255,235,59,0.25)';
            ctx.beginPath();ctx.arc(f.x,f.y,6,0,Math.PI*2);ctx.fill();
            ctx.globalAlpha=1;
        }
    }
}

function drawButterflies(ctx){
    for(const b of G.butterflies){
        const flap=Math.sin(b.phase*3)*0.5+0.5;
        ctx.save();
        ctx.translate(b.x,b.y);
        ctx.fillStyle=b.color;
        ctx.globalAlpha=0.85;
        ctx.beginPath();ctx.ellipse(-5,0,6,10*flap+2,-0.3,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.ellipse(5,0,6,10*flap+2,0.3,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#333';
        ctx.beginPath();ctx.ellipse(0,0,1.5,5,0,0,Math.PI*2);ctx.fill();
        ctx.globalAlpha=1;
        ctx.restore();
    }
}

function drawScene(ctx){
    const grad=ctx.createLinearGradient(0,0,0,H);
    if(G.weather==='dusk'){
        grad.addColorStop(0,'#ff7043');
        grad.addColorStop(0.35,'#ffb74d');
        grad.addColorStop(0.6,'#aed581');
        grad.addColorStop(1,'#558b2f');
    }else if(G.weather==='cloudy'){
        grad.addColorStop(0,'#90a4ae');
        grad.addColorStop(0.4,'#b0bec5');
        grad.addColorStop(0.7,'#9ccc65');
        grad.addColorStop(1,'#689f38');
    }else{
        grad.addColorStop(0,'#87ceeb');
        grad.addColorStop(0.4,'#b5e3a6');
        grad.addColorStop(0.7,'#8bc34a');
        grad.addColorStop(1,'#4caf50');
    }
    ctx.fillStyle=grad;
    ctx.fillRect(0,0,W,H);
    drawWeatherEffects(ctx);
    const sunY=G.weather==='dusk'?100:60;
    if(G.weather!=='cloudy'){
        ctx.fillStyle=G.weather==='dusk'?'rgba(255,200,80,0.9)':'rgba(255,235,59,0.8)';
        ctx.beginPath();ctx.arc(60,sunY,25,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle=G.weather==='dusk'?'rgba(255,150,50,0.5)':'rgba(255,193,7,0.4)';
        ctx.lineWidth=2;
        for(let i=0;i<12;i++){
            const a=Math.PI*2*i/12+G.decorAnim*0.005;
            ctx.beginPath();
            ctx.moveTo(60+Math.cos(a)*30,sunY+Math.sin(a)*30);
            ctx.lineTo(60+Math.cos(a)*42,sunY+Math.sin(a)*42);
            ctx.stroke();
        }
    }
    ctx.fillStyle='rgba(255,215,0,0.25)';
    const sz=G.sunZone;
    roundRect(ctx,sz.x,sz.y,sz.w,sz.h,20);ctx.fill();
    ctx.strokeStyle='rgba(255,215,0,0.6)';ctx.lineWidth=3;ctx.setLineDash([8,4]);
    roundRect(ctx,sz.x,sz.y,sz.w,sz.h,20);ctx.stroke();ctx.setLineDash([]);
    ctx.font='bold 14px "Microsoft YaHei"';ctx.fillStyle='#ff9800';
    ctx.textAlign='center';ctx.fillText('☀ 阳光区',sz.x+sz.w/2,sz.y+sz.h/2+5);
    ctx.textAlign='left';
    for(let i=0;i<5;i++){
        const mx=20+i*40;
        const my=260+Math.sin(G.decorAnim*0.02+i)*3;
        ctx.fillStyle='#8bc34a';
        ctx.beginPath();ctx.moveTo(mx,my);ctx.quadraticCurveTo(mx+5,my-20,mx+10,my);ctx.fill();
        ctx.beginPath();ctx.moveTo(mx+8,my);ctx.quadraticCurveTo(mx+14,my-25,mx+20,my);ctx.fill();
    }
    for(let i=0;i<4;i++){
        const fx=380+i*20;
        const fy=160+Math.sin(G.decorAnim*0.025+i*2)*2;
        ctx.fillStyle='#7cb342';
        ctx.beginPath();ctx.arc(fx,fy,10+i%2*3,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#558b2f';
        ctx.beginPath();ctx.arc(fx-3,fy-3,6,0,Math.PI*2);ctx.fill();
    }
    ctx.fillStyle='#4fc3f7';
    roundRect(ctx,20,500,180,160,20);ctx.fill();
    ctx.strokeStyle='#0288d1';ctx.lineWidth=3;
    roundRect(ctx,20,500,180,160,20);ctx.stroke();
    for(const l of G.lotusInPond){
        const bob=Math.sin(G.decorAnim*0.02+l.phase)*2;
        ctx.fillStyle='#66bb6a';
        ctx.beginPath();ctx.ellipse(l.x,l.y+bob,18*l.scale,8*l.scale,0,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#f48fb1';
        for(let p=0;p<5;p++){
            const a=p*Math.PI*2/5-1.57;
            ctx.beginPath();
            ctx.ellipse(l.x+Math.cos(a)*8*l.scale,l.y-2+bob+Math.sin(a)*8*l.scale,
                      5*l.scale,8*l.scale,a,0,Math.PI*2);ctx.fill();
        }
        ctx.fillStyle='#ffeb3b';
        ctx.beginPath();ctx.arc(l.x,l.y-2+bob,4*l.scale,0,Math.PI*2);ctx.fill();
    }
    for(const f of G.fishInPond){
        ctx.fillStyle=f.color;
        ctx.beginPath();
        ctx.ellipse(f.x,f.y,8,4,0,0,Math.PI*2);ctx.fill();
        ctx.beginPath();
        ctx.moveTo(f.x-6,f.y);ctx.lineTo(f.x-12,f.y-4);ctx.lineTo(f.x-12,f.y+4);
        ctx.closePath();ctx.fill();
        ctx.fillStyle='#fff';
        ctx.beginPath();ctx.arc(f.x+4,f.y-1,1.5,0,Math.PI*2);ctx.fill();
    }

function drawTurtle(ctx){
    const t=G.turtle;
    ctx.save();
    ctx.translate(t.x,t.y);
    ctx.scale(t.facing,1);
    let bob=t.walking?Math.sin(t.walkStep*2)*2:Math.sin(Date.now()/600)*1;
    if(t.animState==='yawn')bob+=Math.sin(t.animTimer*0.2)*1.5;
    if(t.animState==='pet')bob+=Math.sin(t.animTimer*0.5)*0.8;
    ctx.translate(0,bob);
    ctx.fillStyle='rgba(0,0,0,0.25)';
    ctx.beginPath();ctx.ellipse(0,30,42,8,0,0,Math.PI*2);ctx.fill();
    const legAng=t.walking?Math.sin(t.walkStep*3)*0.3:0;
    ctx.fillStyle='#689f38';
    ctx.save();ctx.translate(-30,10);ctx.rotate(legAng);ctx.fillRect(-8,-4,16,14);ctx.restore();
    ctx.save();ctx.translate(30,10);ctx.rotate(-legAng);ctx.fillRect(-8,-4,16,14);ctx.restore();
    ctx.save();ctx.translate(-28,-15);ctx.rotate(-legAng);ctx.fillRect(-7,-4,14,12);ctx.restore();
    ctx.save();ctx.translate(28,-15);ctx.rotate(legAng);ctx.fillRect(-7,-4,14,12);ctx.restore();
    ctx.fillStyle='#558b2f';
    ctx.beginPath();ctx.ellipse(0,0,40,32,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#33691e';ctx.lineWidth=2;
    ctx.beginPath();ctx.ellipse(0,0,40,32,0,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='#33691e';
    const hexs=[[-14,-10],[0,-16],[14,-10],[-14,6],[0,12],[14,6]];
    for(let i=0;i<6;i++){
        const [hx,hy]=hexs[i];
        ctx.beginPath();
        for(let a=0;a<6;a++){
            const ang=a*Math.PI/3;
            const r=7;
            const px=hx+Math.cos(ang)*r;
            const py=hy+Math.sin(ang)*r;
            if(a===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
        }
        ctx.closePath();
        ctx.fill();
    }
    ctx.strokeStyle='#1b5e20';ctx.lineWidth=1;
    for(let i=0;i<6;i++){
        const [hx,hy]=hexs[i];
        ctx.beginPath();
        for(let a=0;a<6;a++){
            const ang=a*Math.PI/3;
            const r=7;
            const px=hx+Math.cos(ang)*r;
            const py=hy+Math.sin(ang)*r;
            if(a===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
        }
        ctx.closePath();
        ctx.stroke();
    }
    ctx.fillStyle='#81c784';
    ctx.beginPath();ctx.arc(0,0,8,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#689f38';
    ctx.beginPath();ctx.ellipse(38,-5,16,13,0,0,Math.PI*2);ctx.fill();
    const mouthOpen=(t.animState==='yawn'&&t.animTimer>30)||G.currentAction==='eating';
    if(t.isBlinking){
        ctx.fillStyle='#33691e';
        ctx.fillRect(40,-11,8,2);
    }else{
        ctx.fillStyle='#333';
        ctx.beginPath();ctx.arc(44,-9,2.5,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#fff';
        ctx.beginPath();ctx.arc(45,-10,1,0,Math.PI*2);ctx.fill();
    }
    ctx.strokeStyle='#33691e';ctx.lineWidth=1.5;
    if(mouthOpen){
        ctx.fillStyle='#5d4037';
        ctx.beginPath();ctx.ellipse(50,0,5,3,0,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='#4e342e';
        ctx.beginPath();ctx.arc(48,-2,3,0.1,Math.PI*0.9);ctx.stroke();
    }else{
        ctx.beginPath();ctx.arc(48,-2,3,0.1,Math.PI*0.9);ctx.stroke();
    }
    ctx.strokeStyle='#4e342e';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(52,-6);ctx.lineTo(56,-8);ctx.lineTo(54,-4);ctx.closePath();
    ctx.strokeStyle='#5d4037';
    for(let w=0;w<6;w++){
        const wx=-10+w*3;
        ctx.beginPath();ctx.moveTo(wx,-28);ctx.lineTo(wx,-35+(w%2)*3);ctx.stroke();
    }
    if(t.hunger<30||t.mood<30||t.health<30||t.clean<30){
        ctx.fillStyle='rgba(255,80,80,0.9)';
        ctx.font='18px Arial';
        ctx.scale(t.facing,1);
        ctx.textAlign='center';
        let em='';
        if(t.hunger<30)em='🍽';
        else if(t.clean<30)em='💦';
        else if(t.mood<30)em='😢';
        else em='💔';
        ctx.fillText(em,0,-48);
        ctx.textAlign='left';
    }
    if(G.currentAction==='eating'&&G.actionTimer>0){
        ctx.font='18px Arial';
        ctx.scale(t.facing,1);
        ctx.textAlign='center';
        ctx.fillText('😋',0,-48);
        ctx.textAlign='left';
    }
    if(G.currentAction==='massage'&&G.actionTimer>0){
        ctx.font='18px Arial';
        ctx.scale(t.facing,1);
        ctx.textAlign='center';
        ctx.fillText('😊',0,-48);
        ctx.textAlign='left';
    }
    if(t.animState==='yawn'){
        ctx.font='18px Arial';
        ctx.scale(t.facing,1);
        ctx.textAlign='center';
        ctx.fillText('😴',0,-52);
        ctx.textAlign='left';
    }
    if(t.animState==='pet'){
        for(let i=0;i<2;i++){
            if(t.animTimer%8===i*4){
                ctx.font='14px Arial';
                ctx.scale(t.facing,1);
                ctx.textAlign='center';
                ctx.fillText('💓',-30+i*60,-55-i*5);
                ctx.textAlign='left';
            }
        }
    }
    ctx.restore();
    ctx.font='bold 12px "Microsoft YaHei"';
    ctx.fillStyle='#3e2723';
    ctx.textAlign='center';
    ctx.fillText('👴 乌龟爷爷 (100岁)',t.x,t.y+50);
    ctx.textAlign='left';
    if(G.currentAction==='sun'){
        ctx.strokeStyle=t.inSun?'#ffd700':'#ff9800';
        ctx.lineWidth=3;ctx.setLineDash([5,5]);
        ctx.beginPath();ctx.arc(t.x,t.y-5,50,0,Math.PI*2);ctx.stroke();
        ctx.setLineDash([]);
    }
}

function drawStatBar(ctx,x,y,w,label,val,color,icon){

    ctx.fillRect(x+24,y+4,(w-28)*(val/100),14);
    ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1;
    ctx.strokeRect(x+24,y+4,w-28,14);
    ctx.font='14px Arial';

    ctx.fillText(icon,x+4,y+16);

    ctx.fillStyle='#fff';
    ctx.textAlign='right';
    ctx.fillText(label+' '+Math.floor(val),x+w-4,y+15);

}

    ctx.font='60px Arial';ctx.fillText('🐢',W/2,195);
    ctx.fillStyle='#fff';ctx.font='bold 20px "Microsoft YaHei"';
    ctx.fillText('乌龟爷爷陪伴结束!',W/2,240);
    ctx.fillStyle='rgba(255,255,255,0.12)';
    roundRect(ctx,40,270,W-80,200,14);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=2;
    roundRect(ctx,40,270,W-80,200,14);ctx.stroke();
    const avg=Math.floor((G.turtle.hunger+G.turtle.mood+G.turtle.health+G.turtle.clean)/4);
    let wishScore=0,wishDone=0;
    for(const k in G.wishes){if(G.wishes[k].done){wishScore+=100;wishDone++;}else wishScore+=Math.floor(G.wishes[k].cur/G.wishes[k].need*100);}
    const achCount=G.achievements.filter(a=>a.unlocked).length;
    let yy=300;
    ctx.fillStyle='#ddd';ctx.font='14px "Microsoft YaHei"';ctx.textAlign='left';
    ctx.fillText('📋 心愿清单完成情况:',60,yy);yy+=18;
    for(const k in G.wishes){
        const w=G.wishes[k];
        ctx.fillStyle=w.done?'#ffd700':'#bbb';
        ctx.fillText('  '+(w.done?'⭐':'⬜')+' '+w.name+': '+Math.floor(w.cur)+'/'+w.need+(w.done?' ✓':''),60,yy);yy+=18;
    }
    yy+=6;
    const unlockedAchs=G.achievements.filter(a=>a.unlocked);
    ctx.fillStyle=unlockedAchs.length>0?'#ce93d8':'#aaa';
    ctx.fillText('🏆 成就解锁: '+achCount+'/8  +'+(achCount*50)+'分',60,yy);yy+=8;
    for(const a of unlockedAchs){
        ctx.fillStyle='#ffd700';ctx.font='11px "Microsoft YaHei"';
        ctx.fillText('   '+a.icon+' '+a.name,60,yy);yy+=14;
    }
    yy+=12;
    ctx.fillStyle='#ccc';
    ctx.fillText('📊 最终属性平均: '+avg,60,yy);yy+=20;
    ctx.fillText('💯 心愿完成分 '+wishScore+' × '+avg+' 属性平均 = '+Math.floor(wishScore*avg),60,yy);yy+=24;
    ctx.textAlign='center';
    ctx.fillStyle='#ffd700';ctx.font='bold 34px Arial';
    ctx.fillText('总分: '+G.score,W/2,yy+12);
    yy+=40;
    ctx.fillStyle='#aaa';ctx.font='14px "Microsoft YaHei"';
    ctx.fillText('历史最高: '+G.highScore,W/2,yy+8);
    drawBtn(ctx,W/2-95,yy+30,190,55,'🔄 再玩一次','restart','#4caf50');
    drawBtn(ctx,W/2-80,yy+95,160,45,'🏠 返回菜单','menu','#757575');
    ctx.textAlign='left';
}

function handleTipNext(p){
    if(G.tutorialVisible&&hitBtn(p,'tipNext')){
        G.tutorialStep++;
        if(G.tutorialStep>=5){G.tutorialVisible=false;}
        sfxBtn();
        return true;
    }
    return false;
}

const _oldHandlePointerDown=handlePointerDown;
handlePointerDown=function(e){
    initAudio();
    const p=getPos(e);
    if(G.state===STATE_PLAYING&&!G.paused&&handleTipNext(p))return;
    _oldHandlePointerDown(e);
};

function draw(){
    switch(G.state){
        case STATE_MENU: drawMenu(ctx); break;
        case STATE_PLAYING:
            drawScene(ctx);
            drawTurtle(ctx);
            drawParticles(ctx);
            drawHUD(ctx);
            drawActionBtns(ctx);
            drawAchievementNotice(ctx);
            break;
        case STATE_PAUSE:
            drawScene(ctx);
            drawTurtle(ctx);
            drawHUD(ctx);
            drawActionBtns(ctx);
            drawPause(ctx);
            break;
        case STATE_OVER: drawGameOver(ctx); break;
    }
}

setInterval(function(){update();draw();},16);

const _sbtn=document.getElementById('start-game-btn');
_sbtn.addEventListener('click',function(){initAudio();startGame();this.style.display='none';});

})();
</script>

<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>

<script>
(function(){
  if (window.__perfStable) return;
  window.__perfStable = true;
  var _origRandom = Math.random;
  var _cache = [];
  for (var i = 0; i < 512; i++) _cache.push(_origRandom());
  var _idx = 0;
  var _frameCount = 0;
  var _origRAF = window.requestAnimationFrame || function(cb){return setTimeout(cb,16)};
  window.requestAnimationFrame = function(cb) {
    return _origRAF.call(window, function(ts) {
      _frameCount++;
      if (_frameCount % 30 === 0) {
        for (var j = 0; j < 20; j++) _cache[(_idx+j) % 512] = _origRandom();
      }
      _idx = 0;
      cb(ts);
    });
  };
  Math.random = function() {
    var v = _cache[_idx % 512];
    _idx++;
    return v;
  };
})();
</script>
