<button id="start-game-btn" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:20px 40px;font-size:20px;background:#4caf50;color:white;border:none;border-radius:12px;cursor:pointer;z-index:999;font-weight:bold;">开始游戏</button>

<canvas id="c"></canvas>

<script>
if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
</script>
<script src="../game_core.js"></script>
<script>
(function(){
"use strict";

const W=480,H=720;
const GAME_TIME=90;
const FRAME_W=100,FRAME_H=80;

const BIRD_SPECIES=[
    {id:0,name:'麻雀',emoji:'🐦',rarity:'常见',score:5,color:'#a1887f',prob:28,call:[220,8,15]},
    {id:1,name:'白头鹎',emoji:'🐤',rarity:'常见',score:8,color:'#ffeb3b',prob:24,call:[330,1,10]},
    {id:2,name:'啄木鸟',emoji:'🐥',rarity:'少见',score:15,color:'#ff7043',prob:15,call:[440,1,12]},
    {id:3,name:'画眉',emoji:'🦜',rarity:'少见',score:15,color:'#8d6e63',prob:15,call:[392,2,10]},
    {id:4,name:'翠鸟',emoji:'🦅',rarity:'稀有',score:30,color:'#00acc1',prob:12,rare:true,call:[660,0.5,12]},
    {id:5,name:'猫头鹰',emoji:'🦉',rarity:'极稀有',score:60,color:'#795548',prob:6,rare:true,superRare:true,call:[180,0.6,10]}
];

const ACHIEVEMENTS=[
    {id:'first_shot',name:'首次拍摄',desc:'成功拍到第1只鸟',icon:'📷',unlocked:false},
    {id:'sparrow_lover',name:'麻雀专家',desc:'累计拍5次麻雀',icon:'🐦',need:5,unlocked:false},
    {id:'rare_hunter',name:'稀有猎手',desc:'首次拍到稀有鸟(翠鸟/猫头鹰)',icon:'💎',unlocked:false},
    {id:'fast_shooter',name:'快手摄影师',desc:'30秒内拍到5只鸟',icon:'⚡',unlocked:false,timerBased:true,need:5,unlocked:false},
    {id:'full_dex',name:'图鉴大师',desc:'图鉴集齐全部6种鸟类',icon:'📚',unlocked:false},
    {id:'photo_20',name:'摄影达人',desc:'累计拍摄20张照片',icon:'🎞️',need:20,unlocked:false},
    {id:'no_scare',name:'不惊大师',desc:'一局中从未吓跑任何稀有鸟',icon:'🤫',unlocked:false},
    {id:'perfect',name:'完美观察',desc:'单局得分≥300+',icon:'🏆',need:300,unlocked:false}
];

const WEATHERS=['morning','noon','sunset','night'];
const WEATHER_NAMES={morning:'🌄清晨',noon:'☀️正午',sunset:'🌇黄昏',night:'🌙夜晚'};

let audioCtx=null;
function initAudio(){
    if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
}
function playTone(freq,dur,type,vol){
    if(!audioCtx)return;
    try{
        const o=audioCtx.createOscillator();
        const g=audioCtx.createGain();
        o.type=type||'sine';
        o.frequency.value=freq;
        g.gain.value=vol||0.1;
        g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
        o.connect(g);g.connect(audioCtx.destination);
        o.start();o.stop(audioCtx.currentTime+dur);
    }catch(e){}
}
function sfxShutter(){playTone(100,0.05,'square',0.18);setTimeout(()=>playTone(800,0.04,'sine',0.12),30)}
function sfxShot(){playTone(500,0.08,'sine',0.15);setTimeout(()=>playTone(800,0.12,'sine',0.15),100)}
function sfxRare(){playTone(400,0.06,'sine',0.15);setTimeout(()=>playTone(600,0.06,'sine',0.15),60);setTimeout(()=>playTone(900,0.1,'sine',0.15),120);setTimeout(()=>playTone(1200,0.2,'sine',0.15),200)}
function sfxScare(){playTone(1500,0.04,'sawtooth',0.12);setTimeout(()=>playTone(800,0.08,'sawtooth',0.1),40)}
function sfxBuzzer(){playTone(150,0.4,'sawtooth',0.18)}
function sfxBtn(){playTone(600,0.06,'sine',0.1)}
function sfxBad(){playTone(220,0.18,'square',0.1)}
function sfxChirp(sp){
    if(!sp||!sp.call)return;
    const [freq,reps,dur]=sp.call;
    for(let i=0;i<reps;i++){setTimeout(()=>playTone(freq+Math.random()*40,dur/60,'sine',0.07),i*80);}
}
function sfxAchievement(){playTone(523,0.08,'sine',0.15);setTimeout(()=>playTone(659,0.08,'sine',0.15),90);setTimeout(()=>playTone(784,0.12,'sine',0.15),180);setTimeout(()=>playTone(1047,0.2,'sine',0.15),270)}
function sfxZoom(){playTone(300,0.05,'sine',0.08);setTimeout(()=>playTone(500,0.05,'sine',0.06),40)}
function sfxFeed(){playTone(440,0.05,'sine',0.1);setTimeout(()=>playTone(330,0.05,'sine',0.08),40);setTimeout(()=>playTone(220,0.08,'sine',0.06),80)}
function sfxFish(){playTone(660,0.03,'triangle',0.06)}
function sfxCombo(){playTone(523,0.04,'sine',0.1);setTimeout(()=>playTone(659,0.04,'sine',0.1),40);setTimeout(()=>playTone(784,0.08,'sine',0.12),80)}

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let scale=1;
function resize(){
    const r=W/H;
    let cw=window.innerWidth,ch=window.innerHeight;
    if(cw/ch>r){ch=cw/r}else{cw=ch*r}
    canvas.width=cw;canvas.height=ch;
    scale=cw/W;
    ctx.setTransform(scale,0,0,scale,0,0);
}
window.addEventListener('resize',resize);resize();

const PERCH_POINTS=[
    {x:100,y:280,name:'tree1'},{x:115,y:330,name:'tree1'},
    {x:260,y:250,name:'tree2'},{x:280,y:310,name:'tree2'},
    {x:400,y:290,name:'tree3'},{x:410,y:340,name:'tree3'},
    {x:140,y:440,name:'feeder1'},
    {x:380,y:460,name:'feeder2'},
    {x:240,y:540,name:'pond'}
];

const G={
    state:STATE_MENU,score:0,highScore:0,timeLeft:GAME_TIME*60,
    crossX:W/2,crossY:H/2-80,crossVX:0,crossVY:0,
    birds:[],nextSpawn:3*60,
    battery:100,lastShot:0,
    pokedex:[],photos:[],
    flash:0,flashColor:'#fff',
    particles:[],popups:[],btnRects:{},
    keys:{},paused:false,shotCooldown:0,
    dragStart:null,isDragging:false,lastPos:null,
    bonusClaimed:false,
    achievements:ACHIEVEMENTS.map(a=>({...a})),achievementQueue:[],
    weather:'morning',weatherTimer:0,clouds:[],butterflies:[],fireflies:[],leaves:[],sunMoonX:80,
    zoom:1,zoomTarget:1,
    dexPanel:false,achPanel:false,galleryPanel:false,
    tutorialStep:0,tutorialTimer:0,showTutorial:true,
    sparrowCount:0,photoCount:0,rarePhotos:0,shotsIn30s:0,shot30Timer:0,scaredRare:false,
    dexEntry:null,chirpNotes:[],
    _menuDex:false,_menuAch:false,
    feeders:[{id:0,x:140,y:440,food:0,maxFood:5},{id:1,x:380,y:460,food:0,maxFood:5}],
    feedingMode:false,feedBtnCooldown:0,
    groupBonusCount:0,perfectShots:0,goodShots:0,normalShots:0,
    perchHistory:[],birdCombo:0,lastBirdTime:0,
    pondFish:[],waterRipples:[]
};
for(let i=0;i<6;i++){G.pondFish.push({x:210+Math.random()*60,y:550+Math.random()*20,phase:Math.random()*Math.PI*2,spd:0.4+Math.random()*0.4,col:['#ff9800','#f44336','#e91e63','#00bcd4'][Math.floor(Math.random()*4)]});}

G.highScore=parseInt(Storage.load('nsgc_highscore','0'));
const savedPokedex=Storage.load('nsgc_pokedex',null);
if(savedPokedex)try{G.pokedex=JSON.parse(savedPokedex)}catch(e){}

function savePokedex(){Storage.save('nsgc_pokedex',JSON.stringify(G.pokedex))}

for(let i=0;i<7;i++){
    G.clouds.push({x:Math.random()*W,y:30+Math.random()*90,s:0.6+Math.random()*0.8,spd:0.03+Math.random()*0.04});
}
for(let i=0;i<10;i++){
    G.butterflies.push({x:Math.random()*W,y:250+Math.random()*250,phase:Math.random()*Math.PI*2,spd:0.3+Math.random()*0.4,color:['#e91e63','#9c27b0','#ff9800','#4caf50','#00bcd4'][Math.floor(Math.random()*5)]});
}
for(let i=0;i<14;i++){
    G.fireflies.push({x:Math.random()*W,y:250+Math.random()*250,phase:Math.random()*Math.PI*2,spd:0.2+Math.random()*0.3,blink:Math.random()});
}
for(let i=0;i<12;i++){
    G.leaves.push({x:Math.random()*W,y:150+Math.random()*400,vy:0.3+Math.random()*0.5,vx:-0.5+Math.random(),rot:Math.random()*Math.PI*2,vr:-0.02+Math.random()*0.04,color:['#ff9800','#f44336','#8bc34a','#ffeb3b','#795548'][Math.floor(Math.random()*5)]});
}

function unlockAchievement(id){
    const a=G.achievements.find(x=>x.id===id);
    if(!a||a.unlocked)return;
    a.unlocked=true;G.achievementQueue.push(a);sfxAchievement();G.score+=50;
    for(let i=0;i<15;i++){const ang=Math.random()*Math.PI*2;addParticle(W/2,250,'#ffd700','✨',Math.cos(ang)*2,Math.sin(ang)*2-1,3);}
}
function checkAchievements(){
    if(G.photos.length>=1)unlockAchievement('first_shot');
    if(G.sparrowCount>=5)unlockAchievement('sparrow_lover');
    if(G.rarePhotos>=1)unlockAchievement('rare_hunter');
    if(G.shotsIn30s>=5)unlockAchievement('fast_shooter');
    if(G.pokedex.length>=BIRD_SPECIES.length)unlockAchievement('full_dex');
    if(G.photoCount>=20)unlockAchievement('photo_20');
    if(G.score>=300)unlockAchievement('perfect');
}

function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
}
function drawBtn(ctx,x,y,w,h,text,name,color,sub){
    G.btnRects[name]={x:x,y:y,w:w,h:h};
    ctx.fillStyle=color||'#4caf50';
    ctx.strokeStyle='rgba(255,255,255,0.5)';
    ctx.lineWidth=2;
    roundRect(ctx,x,y,w,h,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#fff';
    ctx.font='bold 15px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(text,x+w/2,y+h/2-(sub?6:0));
    if(sub){ctx.font='10px "Microsoft YaHei"';ctx.fillStyle='rgba(255,255,255,0.85)';ctx.fillText(sub,x+w/2,y+h/2+12);}
    ctx.textBaseline='alphabetic';ctx.textAlign='left';
}
function hitBtn(p,name){
    const r=G.btnRects[name];
    return r&&p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;
}
function getPos(e){
    const rect=canvas.getBoundingClientRect();
    const t=e.touches?e.touches[0]:(e.changedTouches?e.changedTouches[0]:e);
    if(!t)return{x:0,y:0};
    return{x:(t.clientX-rect.left)/scale,y:(t.clientY-rect.top)/scale};
}
function addParticle(x,y,color,text,vy,size){
    G.particles.push({x:x,y:y,vx:(Math.random()-0.5)*4,vy:vy||-2,life:35,maxLife:35,color:color,text:text,size:size||3+Math.random()*3});
}
function addPopup(x,y,text,color){
    G.popups.push({x:x,y:y,text:text,color:color||'#fff',life:55,maxLife:55,vy:-1.1});
}
function updateParticles(){
    for(let i=G.particles.length-1;i>=0;i--){
        const p=G.particles[i];
        p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life--;
        if(p.life<=0)G.particles.splice(i,1);
    }
    for(let i=G.popups.length-1;i>=0;i--){
        const p=G.popups[i];
        p.y+=p.vy;p.life--;
        if(p.life<=0)G.popups.splice(i,1);
    }
}
function drawParticles(ctx){
    for(const p of G.particles){
        ctx.globalAlpha=p.life/p.maxLife;
        if(p.text){ctx.fillStyle=p.color;ctx.font='bold 16px Arial';ctx.textAlign='center';ctx.fillText(p.text,p.x,p.y);ctx.textAlign='left';}
        else{ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();}
    }
    ctx.globalAlpha=1;
    for(const p of G.popups){
        ctx.globalAlpha=p.life/p.maxLife;
        ctx.fillStyle=p.color;ctx.font='bold 15px "Microsoft YaHei"';ctx.textAlign='center';
        ctx.fillText(p.text,p.x,p.y);ctx.textAlign='left';
    }
    ctx.globalAlpha=1;
}

window.addEventListener('keydown',function(e){
    G.keys[e.key.toLowerCase()]=true;
    if(e.key===' '||e.key==='Enter'){
        e.preventDefault();initAudio();
        if(G.state===STATE_MENU){startGame();return}
        if(G.state===STATE_OVER){startGame();return}
        if(G.state===STATE_PLAYING&&!G.paused){tryShoot();return}
    }
    if(e.key==='Escape'){
        if(G.state===STATE_PLAYING)togglePause();
        else if(G.dexPanel)G.dexPanel=false;
        else if(G.achPanel)G.achPanel=false;
        else if(G.galleryPanel)G.galleryPanel=false;
    }
    if(G.state===STATE_PLAYING&&!G.paused){
        if(e.key==='z'||e.key==='Z'){G.zoomTarget=G.zoomTarget>1.2?1:1.6;sfxZoom();}
        if(e.key==='x'||e.key==='X'){G.zoomTarget=1;sfxZoom();}
        if(e.key==='1'){G.dexPanel=!G.dexPanel;G.achPanel=false;G.galleryPanel=false;sfxBtn();}
        if(e.key==='2'){G.achPanel=!G.achPanel;G.dexPanel=false;G.galleryPanel=false;sfxBtn();}
        if(e.key==='3'){G.galleryPanel=!G.galleryPanel;G.dexPanel=false;G.achPanel=false;sfxBtn();}
        if(e.key==='f'||e.key==='F'){tryFeed();}
    }
    initAudio();
});
window.addEventListener('keyup',function(e){G.keys[e.key.toLowerCase()]=false});

function handlePointerDown(e){
    initAudio();
    const p=getPos(e);
    if(G.state===STATE_MENU){
        if(hitBtn(p,'start')){startGame();return}
        if(hitBtn(p,'menuDex')){G._menuDex=true;G._menuAch=false;sfxBtn();return}
        if(hitBtn(p,'menuAch')){G._menuAch=true;G._menuDex=false;sfxBtn();return}
        if(G._menuDex){if(hitBtn(p,'dexClose')){G._menuDex=false;sfxBtn();return}return;}
        if(G._menuAch){if(hitBtn(p,'achClose')){G._menuAch=false;sfxBtn();return}return;}
    }else if(G.state===STATE_OVER){
        if(hitBtn(p,'restart')){startGame();return}
        if(hitBtn(p,'menu')){G.state=STATE_MENU;return}
    }else if(G.state===STATE_PAUSE){
        if(hitBtn(p,'resume')){togglePause();return}
        if(hitBtn(p,'quit')){G.state=STATE_MENU;return}
    }else if(G.state===STATE_PLAYING&&!G.paused){
        if(G.showTutorial&&G.tutorialStep<6){
            G.tutorialStep++;G.tutorialTimer=0;
            if(G.tutorialStep>=6)G.showTutorial=false;
            sfxBtn();return;
        }
        if(G.dexPanel){if(hitBtn(p,'dexClose')){G.dexPanel=false;sfxBtn();return}return;}
        if(G.achPanel){if(hitBtn(p,'achClose')){G.achPanel=false;sfxBtn();return}return;}
        if(G.galleryPanel){if(hitBtn(p,'galClose')){G.galleryPanel=false;sfxBtn();return}return;}
        if(hitBtn(p,'dexBtn')){G.dexPanel=!G.dexPanel;G.achPanel=false;G.galleryPanel=false;sfxBtn();return}
        if(hitBtn(p,'achBtn')){G.achPanel=!G.achPanel;G.dexPanel=false;G.galleryPanel=false;sfxBtn();return}
        if(hitBtn(p,'galBtn')){G.galleryPanel=!G.galleryPanel;G.dexPanel=false;G.achPanel=false;sfxBtn();return}
        if(hitBtn(p,'zoomIn')){G.zoomTarget=G.zoomTarget>1.3?1:1.6;sfxZoom();return}
        if(hitBtn(p,'zoomOut')){G.zoomTarget=1;sfxZoom();return}
        if(hitBtn(p,'feedBtn')){tryFeed();return}
        G.dragStart=p;G.isDragging=true;G.lastPos=p;
    }
}
function handlePointerMove(e){
    if(G.state!==STATE_PLAYING||G.paused)return;
    const p=getPos(e);
    if(G.isDragging&&G.lastPos){
        const dx=p.x-G.lastPos.x,dy=p.y-G.lastPos.y;
        const dist=Math.hypot(dx,dy);
        if(dist>20){
            for(const b of G.birds){
                if(b.perched&&b.species.rare&&!b.scared){
                    b.scared=true;b.perched=false;
                    b.tx=W+100;b.ty=b.y-50;
                    addPopup(b.x,b.y-20,'😱 吓跑了!','#ff5252');sfxScare();
                }
            }
        }
        G.crossX+=dx;G.crossY+=dy;
        G.crossX=Math.max(40,Math.min(W-40,G.crossX));
        G.crossY=Math.max(140,Math.min(H-180,G.crossY));
        G.lastPos=p;
    }
}
function handlePointerUp(e){
    const p=getPos(e);
    if(G.state===STATE_PLAYING&&!G.paused&&G.isDragging){
        const d=G.dragStart?Math.hypot(p.x-G.dragStart.x,p.y-G.dragStart.y):0;
        if(d<8){tryShoot();}
    }
    G.isDragging=false;G.dragStart=null;G.lastPos=null;
}

canvas.addEventListener('mousedown',handlePointerDown);
canvas.addEventListener('mousemove',handlePointerMove);
canvas.addEventListener('mouseup',handlePointerUp);
canvas.addEventListener('mouseleave',handlePointerUp);
canvas.addEventListener('touchstart',function(e){e.preventDefault();handlePointerDown(e)},{passive:false});
canvas.addEventListener('touchmove',function(e){e.preventDefault();handlePointerMove(e)},{passive:false});
canvas.addEventListener('touchend',function(e){e.preventDefault();handlePointerUp(e)},{passive:false});

function spawnBird(){
    let pool=BIRD_SPECIES.slice();
    if(G.weather==='night'){
        pool=BIRD_SPECIES.slice();
        pool[5].prob=30;pool[0].prob=10;pool[4].prob=18;
    }else if(G.weather==='morning'){
        pool[0].prob=35;pool[1].prob=30;
    }
    const total=pool.reduce((s,b)=>s+b.prob,0);
    let r=Math.random()*total,acc=0,selected=null;
    for(const s of pool){acc+=s.prob;if(r<=acc){selected=s;break;}}
    if(!selected)selected=BIRD_SPECIES[0];
    const validPerches=PERCH_POINTS.filter(p=>{
        if(G.weather==='night'&&selected.id===5)return p.name==='tree1'||p.name==='tree2'||p.name==='tree3';
        return true;
    });
    let perchWeights=[];
    for(const p of validPerches){
        let w=1;
        for(const f of G.feeders){if(f.food>0&&Math.abs(p.x-f.x)<40&&Math.abs(p.y-f.y)<40){w=1+f.food*1.8;}}
        if(p.name==='pond'&&(selected.id===1||selected.id===4))w*=1.5;
        perchWeights.push(w);
    }
    const tw=perchWeights.reduce((s,x)=>s+x,0);
    let rr=Math.random()*tw,perchIdx=0; acc=0;
    for(let i=0;i<perchWeights.length;i++){acc+=perchWeights[i];if(rr<=acc){perchIdx=i;break;}}
    const perch=validPerches[perchIdx];
    const fromLeft=Math.random()<0.5;
    const b={
        species:selected,
        x:fromLeft?-40:W+40,
        y:perch.y-40,
        tx:perch.x,ty:perch.y,
        flying:true,perched:false,
        perchTime:(4+Math.random()*6)*60,
        timer:0,
        flap:0,scared:false,
        id:Math.random(),
        fromLeft:fromLeft,
        inFrame:false
    };
    G.birds.push(b);
}

function tryFeed(){
    if(G.feedBtnCooldown>0){addPopup(W/2,150,'⏳ 投喂冷却中!','#ff9800');sfxBad();return;}
    let fed=false;
    for(const f of G.feeders){
        if(f.food<f.maxFood){f.food++;fed=true;
            addPopup(f.x,f.y-10,'🌾 +1鸟食','#8bc34a');
            for(let i=0;i<5;i++)addParticle(f.x+(Math.random()-0.5)*20,f.y-5,'#ffcc80','🌾',-1.5-Math.random()*1,3);
        }
    }
    if(fed){G.feedBtnCooldown=30;sfxFeed();G.nextSpawn=Math.max(30,G.nextSpawn-60);
        G.waterRipples.push({x:240,y:555,r:3,maxR:60,a:1});
    }else{addPopup(W/2,150,'喂食器已满!','#ff9800');sfxBad();}
}

function tryShoot(){
    if(G.shotCooldown>0){addPopup(G.crossX,G.crossY-40,'⏳ 相机冷却中!','#ff9800');sfxBad();return;}
    if(G.battery<10){addPopup(G.crossX,G.crossY-40,'🔋 电量不足!','#ff5252');sfxBad();return;}
    G.shotCooldown=8;G.battery-=10;G.lastShot=0;
    G.flash=8;G.flashColor='rgba(255,255,255,0.75)';
    sfxShutter();
    let hitBird=null,bestDist=9999;
    for(const b of G.birds){
        if(!b.perched||b.scared)continue;
        const dx=b.x-G.crossX,dy=b.y-20-G.crossY;
        if(Math.abs(dx)<FRAME_W/2-6&&Math.abs(dy)<FRAME_H/2-6){
            const dist=Math.hypot(dx,dy);
            if(dist<bestDist){bestDist=dist;hitBird=b;}
        }
    }
    if(hitBird){
        const sp=hitBird.species;
        let quality=1;
        const frameCenter=Math.hypot(hitBird.x-G.crossX,(hitBird.y-20)-G.crossY);
        if(frameCenter<15)quality=1.5;
        else if(frameCenter<30)quality=1.2;
        if(quality>=1.5)G.perfectShots++;
        else if(quality>=1.2)G.goodShots++;
        else G.normalShots++;
        const nowTime=GAME_TIME*60-G.timeLeft;
        if(nowTime-G.lastBirdTime<8*60){G.birdCombo++;if(G.birdCombo>=3){sfxCombo();}}
        else G.birdCombo=1;
        G.lastBirdTime=nowTime;
        let comboMult=1;
        if(G.birdCombo>=5)comboMult=1.5;
        else if(G.birdCombo>=3)comboMult=1.2;
        let addScore=Math.floor(sp.score*quality*comboMult);
        G.score+=addScore;G.photoCount++;G.shotsIn30s++;
        if(sp.id===0)G.sparrowCount++;
        if(sp.rare)G.rarePhotos++;
        G.photos.push({species:sp.id,x:hitBird.x,y:hitBird.y,t:Date.now(),q:quality,c:G.birdCombo});
        const already=G.pokedex.indexOf(sp.id)>=0;
        const qText=quality>=1.5?'★★★完美':quality>=1.2?'★★良好':'★一般';
        const qColor=quality>=1.5?'#ffd700':quality>=1.2?'#90caf9':'#e0e0e0';
        const comboText=comboMult>1?'  x'+comboMult.toFixed(1)+'连击!':'';
        if(!already){
            G.pokedex.push(sp.id);savePokedex();
            addPopup(hitBird.x,hitBird.y-40,'📚 新图鉴! +'+addScore+' '+qText+comboText,sp.color);
            if(sp.rare||sp.superRare)sfxRare();
            if(G.pokedex.length>=BIRD_SPECIES.length&&!G.bonusClaimed){
                G.score+=300;G.bonusClaimed=true;
                addPopup(W/2,200,'🏆 图鉴集齐! +300分','#ffd700');sfxRare();
            }
        }else{
            addPopup(hitBird.x,hitBird.y-40,'📷 '+sp.name+'! +'+addScore+' '+qText+comboText,qColor);
        }
        sfxShot();
        for(let i=0;i<12;i++)addParticle(hitBird.x,hitBird.y-20,sp.color,'✨',-1.5-Math.random()*2,3);
        for(let i=0;i<quality>=1.5?12:6;i++)addParticle(hitBird.x,hitBird.y-20,qColor,'⭐',-2-Math.random()*2,3);
        hitBird.perched=false;hitBird.scared=true;
        hitBird.tx=hitBird.x<W/2?-50:W+50;hitBird.ty=hitBird.y-80;
        checkAchievements();
    }else{
        addPopup(G.crossX,G.crossY-40,'❌ 没拍到','#9e9e9e');sfxBad();
    }
}

function startGame(){
    initAudio();
    G.state=STATE_PLAYING;G.score=0;G.timeLeft=GAME_TIME*60;
    G.crossX=W/2;G.crossY=H/2;
    G.birds=[];G.nextSpawn=2*60;G.battery=100;
    G.flash=0;G.particles=[];G.popups=[];
    G.paused=false;G.shotCooldown=0;G.bonusClaimed=false;
    G.photos=[];G.zoom=1;G.zoomTarget=1;
    G.achievements=ACHIEVEMENTS.map(a=>({...a}));G.achievementQueue=[];
    G.weather='morning';G.weatherTimer=0;G.sunMoonX=80;
    G.dexPanel=false;G.achPanel=false;G.galleryPanel=false;
    G.tutorialStep=0;G.tutorialTimer=0;G.showTutorial=true;
    G.sparrowCount=0;G.photoCount=0;G.rarePhotos=0;G.shotsIn30s=0;G.shot30Timer=30*60;G.scaredRare=false;
    G.dexEntry=null;G.chirpNotes=[];
    G.feeders=[{id:0,x:140,y:440,food:0,maxFood:5},{id:1,x:380,y:460,food:0,maxFood:5}];
    G.feedingMode=false;G.feedBtnCooldown=0;
    G.groupBonusCount=0;G.perfectShots=0;G.goodShots=0;G.normalShots=0;
    G.perchHistory=[];G.birdCombo=0;G.lastBirdTime=-99999;

}
function endGame(){
    G.state=STATE_OVER;
    if(!G.scaredRare)unlockAchievement('no_scare');
    if(G.score>G.highScore){G.highScore=G.score;Storage.save('nsgc_highscore',G.highScore);}

}
function togglePause(){
    G.paused=!G.paused;
    if(G.paused)G.state=STATE_PAUSE;else G.state=STATE_PLAYING;
    sfxBtn();
}

function updateWeather(){
    G.weatherTimer++;G.sunMoonX=Math.min(400,80+G.weatherTimer*0.2);
    if(G.weatherTimer>25*60){
        G.weatherTimer=0;G.sunMoonX=80;
        const cur=WEATHERS.indexOf(G.weather);
        G.weather=WEATHERS[(cur+1)%WEATHERS.length];
        addPopup(W/2,120,'时间流逝: '+WEATHER_NAMES[G.weather],'#90caf9');
        if(G.weather==='night'){for(let i=0;i<14;i++){G.fireflies[i].x=Math.random()*W;G.fireflies[i].y=250+Math.random()*250;}}
    }
    for(const c of G.clouds){c.x+=c.spd;if(c.x>W+60)c.x=-60;}
    for(const b of G.butterflies){
        if(G.weather==='night')continue;
        b.phase+=0.07;b.x+=Math.sin(b.phase)*b.spd;b.y+=Math.cos(b.phase*0.6)*0.5;
        if(b.x<-20)b.x=W+20;if(b.x>W+20)b.x=-20;
        if(b.y<240)b.y=240;if(b.y>500)b.y=500;
    }
    for(const f of G.fireflies){
        if(G.weather!=='night')continue;
        f.phase+=0.05;f.blink+=0.05;
        f.x+=Math.sin(f.phase)*f.spd;f.y+=Math.cos(f.phase*0.7)*0.3;
        if(f.x<-20)f.x=W+20;if(f.x>W+20)f.x=-20;
    }
    for(const l of G.leaves){
        l.x+=l.vx;l.y+=l.vy;l.rot+=l.vr;
        if(l.y>H){l.y=-20;l.x=Math.random()*W;}
        if(l.x<-20)l.x=W+20;if(l.x>W+20)l.x=-20;
    }
    for(const fish of G.pondFish){
        fish.phase+=0.05;
        fish.x+=Math.cos(fish.phase)*fish.spd*0.5;
        fish.y+=Math.sin(fish.phase*0.7)*0.2;
        if(fish.x<200)fish.x=200;if(fish.x>280)fish.x=280;
        if(fish.y<545)fish.y=545;if(fish.y>565)fish.y=565;
        if(Math.random()<0.008){G.waterRipples.push({x:fish.x,y:fish.y,r:2,maxR:22,a:1});sfxFish();}
    }
    for(let i=G.waterRipples.length-1;i>=0;i--){
        const wr=G.waterRipples[i];
        wr.r+=0.6;wr.a-=0.018;
        if(wr.a<=0||wr.r>=wr.maxR)G.waterRipples.splice(i,1);
    }
    for(const f of G.feeders){
        if(f.food>0&&G.birds.length>0&&Math.random()<0.004){
            for(const b of G.birds){
                if(b.perched&&Math.abs(b.x-f.x)<60&&Math.abs(b.y-f.y)<60&&Math.random()<0.5){
                    f.food=Math.max(0,f.food-1);
                    addParticle(f.x,f.y-5,'#ffcc80','🌾',-1,3);
                    break;
                }
            }
        }
    }
}

function update(){
    if(G.state!==STATE_PLAYING||G.paused)return;
    G.timeLeft--;
    if(G.timeLeft<=0){endGame();return}
    if(G.showTutorial)G.tutorialTimer++;
    if(G.shot30Timer>0){G.shot30Timer--;if(G.shot30Timer<=0){G.shotsIn30s=0;G.shot30Timer=30*60;}}
    if(G.shotCooldown>0)G.shotCooldown--;
    if(G.feedBtnCooldown>0)G.feedBtnCooldown--;
    if(G.lastShot<9999)G.lastShot++;
    if(G.battery<100&&G.lastShot>5*60)G.battery=Math.min(100,G.battery+0.5);
    if(G.flash>0)G.flash--;
    G.zoom+=(G.zoomTarget-G.zoom)*0.08;
    G.nextSpawn--;
    if(G.nextSpawn<=0){
        if(G.birds.filter(b=>b.perched).length<3)spawnBird();
        G.nextSpawn=(3+Math.random()*5)*60;
    }
    const spdX=(G.keys['arrowleft']||G.keys['a']?-3.5:0)+(G.keys['arrowright']||G.keys['d']?3.5:0);
    const spdY=(G.keys['arrowup']||G.keys['w']?-3.5:0)+(G.keys['arrowdown']||G.keys['s']?3.5:0);
    if(Math.abs(spdX)+Math.abs(spdY)>2){
        for(const b of G.birds){
            if(b.perched&&b.species.rare&&!b.scared){
                b.scared=true;b.perched=false;G.scaredRare=true;
                b.tx=W+100;b.ty=b.y-50;
                addPopup(b.x,b.y-20,'😱 吓跑了!','#ff5252');sfxScare();
            }
        }
    }
    G.crossX+=spdX;G.crossY+=spdY;
    G.crossX=Math.max(40,Math.min(W-40,G.crossX));
    G.crossY=Math.max(140,Math.min(H-180,G.crossY));
    updateWeather();
    for(let i=G.chirpNotes.length-1;i>=0;i--){
        const n=G.chirpNotes[i];n.timer++;n.y-=0.6;
        if(n.timer>45)G.chirpNotes.splice(i,1);
    }
    for(let i=G.birds.length-1;i>=0;i--){
        const b=G.birds[i];b.timer++;b.flap+=0.3;
        if(b.perched&&Math.random()<0.003){
            sfxChirp(b.species);
            G.chirpNotes.push({x:b.x+(Math.random()-0.5)*20,y:b.y-35,timer:0,text:['♪','♫','♬','🎵'][Math.floor(Math.random()*4)],color:b.species.color});
        }
        const frameLeft=G.crossX-FRAME_W/2,frameTop=G.crossY-FRAME_H/2;
        b.inFrame=b.perched&&(b.x>frameLeft&&b.x<frameLeft+FRAME_W&&(b.y-20)>frameTop&&(b.y-20)<frameTop+FRAME_H);
        if(b.flying){
            const dx=b.tx-b.x,dy=b.ty-b.y;
            const d=Math.hypot(dx,dy);
            if(d>4){b.x+=dx/d*2.5;b.y+=dy/d*2.5;}
            else{b.x=b.tx;b.y=b.ty;b.flying=false;b.perched=true;b.timer=0;}
        }else if(b.perched){
            b.y=b.ty+Math.sin(b.timer*0.05)*1.5;
            b.perchTime--;
            if(b.perchTime<=0||b.scared){b.perched=false;b.flying=true;
                b.tx=b.x<W/2?-50:W+50;b.ty=b.y-60-Math.random()*40;}
        }else{
            const dx=b.tx-b.x,dy=b.ty-b.y;
            const d=Math.hypot(dx,dy);
            if(d>4){b.x+=dx/d*3;b.y+=dy/d*3;}
            else if(b.x<-60||b.x>W+60){G.birds.splice(i,1);continue;}
        }
    }
    updateParticles();checkAchievements();
}

function drawCloud(ctx,cx,cy,s,color){
    ctx.fillStyle=color;ctx.globalAlpha=G.weather==='night'?0.4:(G.weather==='sunset'?0.9:0.85);
    ctx.beginPath();
    ctx.arc(cx,cy,15*s,0,Math.PI*2);
    ctx.arc(cx+15*s,cy-5*s,18*s,0,Math.PI*2);
    ctx.arc(cx+35*s,cy,16*s,0,Math.PI*2);
    ctx.arc(cx+20*s,cy+8*s,14*s,0,Math.PI*2);
    ctx.fill();
    ctx.globalAlpha=1;
}

function drawButterflies(ctx){
    if(G.weather==='night')return;
    for(const b of G.butterflies){
        const flap=Math.abs(Math.sin(b.phase*2));
        ctx.save();ctx.translate(b.x,b.y);
        ctx.fillStyle=b.color;ctx.globalAlpha=0.85;
        ctx.beginPath();ctx.ellipse(-4*flap,0,6*flap+2,4,0,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.ellipse(4*flap,0,6*flap+2,4,0,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#333';
        ctx.beginPath();ctx.ellipse(0,0,1.5,4,0,0,Math.PI*2);ctx.fill();
        ctx.restore();
    }
    ctx.globalAlpha=1;
}

function drawFireflies(ctx){
    if(G.weather!=='night')return;
    for(const f of G.fireflies){
        const glow=0.4+Math.abs(Math.sin(f.blink))*0.6;
        ctx.globalAlpha=glow;
        ctx.fillStyle='#ffeb3b';
        ctx.shadowColor='#ffeb3b';ctx.shadowBlur=8;
        ctx.beginPath();ctx.arc(f.x,f.y,2.2,0,Math.PI*2);ctx.fill();
        ctx.shadowBlur=0;
    }
    ctx.globalAlpha=1;
}

function drawLeaves(ctx){
    for(const l of G.leaves){
        ctx.save();ctx.translate(l.x,l.y);ctx.rotate(l.rot);
        ctx.fillStyle=l.color;ctx.globalAlpha=0.8;
        ctx.beginPath();ctx.ellipse(0,0,5,2.5,0,0,Math.PI*2);ctx.fill();
        ctx.restore();
    }
    ctx.globalAlpha=1;
}

function drawScene(ctx){
    let topColor,midColor,botColor,sunMoonColor;
    switch(G.weather){
        case 'morning':topColor='#ffccbc';midColor='#b3e5fc';botColor='#a5d6a7';sunMoonColor='#fff176';break;
        case 'noon':topColor='#81d4fa';midColor='#b3e5fc';botColor='#a5d6a7';sunMoonColor='#ffeb3b';break;
        case 'sunset':topColor='#ff8a65';midColor='#ffab91';botColor='#c5e1a5';sunMoonColor='#ff7043';break;
        case 'night':topColor='#0d1b3d';midColor='#1a237e';botColor='#1b5e20';sunMoonColor='#e0e0e0';break;
    }
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,topColor);g.addColorStop(0.35,midColor);g.addColorStop(0.55,'#c8e6c9');
    g.addColorStop(0.75,botColor);g.addColorStop(1,G.weather==='night'?'#0d2818':'#558b2f');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    if(G.weather==='night'){
        ctx.fillStyle='#fff';
        for(let i=0;i<35;i++){
            const sx=((i*83+G.timeLeft)%W),sy=(i*47)%300;
            ctx.globalAlpha=0.3+Math.abs(Math.sin((Date.now()+i*300)/500))*0.7;
            ctx.beginPath();ctx.arc(sx,sy,0.8+(i%3)*0.4,0,Math.PI*2);ctx.fill();
        }
        ctx.globalAlpha=1;
    }
    ctx.fillStyle=sunMoonColor;ctx.globalAlpha=G.weather==='night'?0.95:0.9;
    ctx.beginPath();ctx.arc(G.sunMoonX,75,G.weather==='night'?24:32,0,Math.PI*2);ctx.fill();
    if(G.weather==='noon'){
        ctx.globalAlpha=0.3;ctx.strokeStyle='#ffd54f';ctx.lineWidth=3;
        for(let i=0;i<12;i++){
            const a=(i/12)*Math.PI*2;
            ctx.beginPath();ctx.moveTo(G.sunMoonX+Math.cos(a)*40,75+Math.sin(a)*40);
            ctx.lineTo(G.sunMoonX+Math.cos(a)*52,75+Math.sin(a)*52);ctx.stroke();
        }
    }
    ctx.globalAlpha=1;
    for(const c of G.clouds)drawCloud(ctx,c.x,c.y,c.s,G.weather==='night'?'#303f9f':(G.weather==='sunset'?'#ffccbc':'#fff'));
    drawLeaves(ctx);

function drawBird(ctx,b){
    ctx.save();ctx.translate(b.x,b.y-20);
    const s=b.facingLeft?-1:1;
    if(!b.fromLeft)ctx.scale(-1,1);
    if(b.perched){
        ctx.fillStyle='rgba(0,0,0,0.25)';
        ctx.beginPath();ctx.ellipse(0,22,14,3,0,0,Math.PI*2);ctx.fill();
    }
    const sp=b.species;
    ctx.fillStyle=sp.color;
    const flapY=b.perched?0:Math.sin(b.flap)*5;
    ctx.beginPath();ctx.ellipse(0,0,18,13,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(10,-5,10,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=sp.color;
    ctx.beginPath();ctx.arc(10,-7,7,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#333';ctx.beginPath();ctx.arc(14,-9,1.8,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffb300';
    ctx.beginPath();ctx.moveTo(18,-5);ctx.lineTo(27,-3);ctx.lineTo(18,-1);ctx.closePath();ctx.fill();
    ctx.fillStyle=sp.color;
    ctx.beginPath();ctx.ellipse(-3,-8+flapY,11,5,-0.4,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(0,10,3,6,0.2,0,Math.PI*2);ctx.fill();
    if(sp.id===5){
        ctx.fillStyle=sp.color;
        ctx.beginPath();ctx.moveTo(6,-15);ctx.lineTo(2,-23);ctx.lineTo(10,-18);ctx.closePath();ctx.fill();
        ctx.beginPath();ctx.moveTo(14,-15);ctx.lineTo(18,-23);ctx.lineTo(10,-18);ctx.closePath();ctx.fill();
    }
    if(sp.id===4){
        ctx.fillStyle='#00838f';
        ctx.beginPath();ctx.moveTo(-15,0);ctx.lineTo(-22,3);ctx.lineTo(-15,6);ctx.closePath();ctx.fill();
    }
    if(b.perched){
        ctx.strokeStyle='#5d4037';ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(-2,12);ctx.lineTo(-2,22);ctx.stroke();
        ctx.beginPath();ctx.moveTo(2,12);ctx.lineTo(2,22);ctx.stroke();
    }
    if(b.species.rare&&b.perched&&!b.scared){
        ctx.globalAlpha=0.4+Math.sin(Date.now()/150)*0.3;
        ctx.fillStyle=b.species.superRare?'#9c27b0':'#ff9800';
        ctx.font='bold 10px "Microsoft YaHei"';ctx.textAlign='center';
        ctx.fillText((b.species.superRare?'★★★':'★★')+b.species.rarity,0,-30);
    }
    ctx.restore();
    if(b.inFrame){
        ctx.strokeStyle='#ff5252';ctx.lineWidth=2;
        ctx.beginPath();ctx.arc(b.x,b.y-20,22,0,Math.PI*2);ctx.stroke();
        ctx.fillStyle='#ff5252';ctx.font='bold 11px Arial';ctx.textAlign='center';
        ctx.fillText('🎯 OK',b.x,b.y-48);ctx.textAlign='left';
    }
}

    const a=G.achievementQueue[0];

    let alpha=1;
    if(t<20)alpha=t/20;
    if(t>160)alpha=Math.max(0,(180-t)/20);

    ctx.globalAlpha=alpha;
    const y=118+Math.sin(t*0.15)*3;

    const cols=4,rows=Math.ceil(Math.min(20,G.photos.length)/cols);
    const cellW=100,cellH=82,gap=8;
    const startX=(W-(cols*(cellW+gap)-gap))/2;
    let drawn=0;
    for(let r=0;r<rows;r++){
        for(let c=0;c<cols;c++){
            const idx=r*cols+c;
            if(idx>=G.photos.length||idx>=20)break;
            const ph=G.photos[G.photos.length-1-idx];
            const x=startX+c*(cellW+gap),y=145+r*(cellH+gap);
            const sp=BIRD_SPECIES[ph.species];
            ctx.fillStyle=sp?sp.color:'#888';
            roundRect(ctx,x,y,cellW,cellH,6);ctx.fill();
            ctx.fillStyle='rgba(0,0,0,0.35)';
            roundRect(ctx,x,y,cellW,cellH,6);ctx.fill();
            ctx.font='32px Arial';ctx.textAlign='center';
            ctx.fillText(sp?sp.emoji:'❓',x+cellW/2,y+cellH/2+4);
            ctx.font='bold 10px "Microsoft YaHei"';ctx.fillStyle='#fff';
            ctx.fillText(sp?sp.name:'未知',x+cellW/2,y+cellH-6);
            ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='9px Arial';
            ctx.fillText('#'+(G.photos.length-idx),x+8,y+12);
            drawn++;
        }
    }
    if(G.photos.length===0){
        ctx.fillStyle='#bbb';ctx.font='15px "Microsoft YaHei"';ctx.textAlign='center';
        ctx.fillText('📷 还没有任何照片, 开始观察拍摄吧!',W/2,H/2);
    }
    ctx.textAlign='center';ctx.fillStyle='#ffcdd2';ctx.font='11px "Microsoft YaHei"';
    ctx.fillText('仅显示最近20张  |  共'+G.photos.length+'张',W/2,H-112);
    drawBtn(ctx,W/2-70,H-105,140,45,'关闭画廊','galClose','#e53935');
    ctx.textAlign='left';
}

function drawMenu(ctx){
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#1a237e');g.addColorStop(0.5,'#283593');g.addColorStop(1,'#1b5e20');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';
    for(let i=0;i<55;i++){
        const sx=(i*83+Date.now()/30)%W,sy=(i*53)%280;
        ctx.globalAlpha=0.25+Math.abs(Math.sin((Date.now()+i*300)/500))*0.75;
        ctx.beginPath();ctx.arc(sx,sy,0.6+(i%3)*0.5,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
    const demoClouds=[{x:60,y:130,s:1,col:'#fff'},{x:280,y:90,s:1.1,col:'#e3f2fd'},{x:400,y:160,s:0.8,col:'#bbdefb'}];
    for(const c of demoClouds)drawCloud(ctx,c.x+Math.sin(Date.now()/1500+c.y)*5,c.y,c.s,c.col);
    ctx.save();
    ctx.fillStyle='#1b5e20';ctx.beginPath();ctx.arc(100,460,55,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(260,440,62,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(410,460,50,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#5d4037';ctx.fillRect(92,460,16,80);ctx.fillRect(252,440,18,95);ctx.fillRect(402,460,14,78);
    const birdsFly=[
        {emoji:'🐦',x:130,y:330,dx:0.6},{emoji:'🦜',x:320,y:290,dx:-0.5},{emoji:'🦉',x:220,y:250,dx:0.3}
    ];
    for(let i=0;i<birdsFly.length;i++){
        const bf=birdsFly[i];
        const bx=bf.x+Math.sin(Date.now()/700+i)*35;
        const by=bf.y+Math.cos(Date.now()/500+i*1.3)*12;
        ctx.font='28px Arial';ctx.textAlign='center';
        ctx.fillText(bf.emoji,bx,by);
    }
    ctx.textAlign='left';
    ctx.restore();
    ctx.save();ctx.translate(W/2,210);
    const sc=1.5+Math.sin(Date.now()/500)*0.05;ctx.scale(sc,sc);
    ctx.font='80px Arial';ctx.textAlign='center';
    ctx.fillText('🐦🦜🦉',0,0);
    ctx.restore();
    ctx.fillStyle='#81c784';ctx.font='bold 44px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.fillText('鸟舍观察',W/2,310);
    ctx.fillStyle='#fff';ctx.font='17px "Microsoft YaHei"';
    ctx.fillText('90秒内拍到尽可能多的珍稀鸟类!',W/2,340);
    ctx.fillStyle='#ffd700';ctx.font='bold 16px "Microsoft YaHei"';
    ctx.fillText('🌟 最高分: '+G.highScore+'  图鉴: '+G.pokedex.length+'/'+BIRD_SPECIES.length,W/2,375);
    drawBtn(ctx,W/2-100,400,200,60,'开始观察','start','#4caf50');
    drawBtn(ctx,W/2-100,470,95,38,'📚 图鉴','menuDex','#2196f3');
    drawBtn(ctx,W/2+5,470,95,38,'🏆 成就','menuAch','#ffc107');
    if(G._menuDex){
        ctx.fillStyle='rgba(0,0,0,0.92)';ctx.fillRect(0,0,W,H);
        drawDexPanel(ctx);
    }else if(G._menuAch){
        ctx.fillStyle='rgba(0,0,0,0.92)';ctx.fillRect(0,0,W,H);
        drawAchPanel(ctx);
    }
    ctx.fillStyle='#fff';ctx.font='13px "Microsoft YaHei"';
    let yy=525;
    const tips=['📋 玩法说明：','• 移动相机十字准星瞄准鸟类','• 点击/空格/Enter按快门拍鸟','• 相机取景框内才算拍到','• 移动太快会吓跑稀有鸟(翠鸟/猫头鹰)','• 每张照片耗电10%,等待5秒回满','• 集齐6种图鉴可获得300分奖励!'];
    for(const t of tips){ctx.fillText(t,W/2,yy);yy+=20;}
    ctx.fillStyle='#ffd700';ctx.font='bold 12px "Microsoft YaHei"';
    ctx.fillText('空格/回车=快门  Esc=暂停  Z/X=变焦  1/2/3=图鉴/成就/画廊',W/2,yy+15);
    ctx.textAlign='left';
}

function drawPause(ctx){
    ctx.fillStyle='rgba(0,0,0,0.8)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 48px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.fillText('⏸ 暂停中',W/2,H/2-80);
    ctx.fillStyle='#bbb';ctx.font='13px "Microsoft YaHei"';
    const pauseTips=[
        '📷 当前得分: +'+G.score,
        '🔋 电量: '+Math.floor(G.battery)+'%  |  图鉴: '+G.pokedex.length+'/'+BIRD_SPECIES.length,
        '🖼 已拍摄: '+G.photos.length+'张  |  稀有: '+G.rarePhotos+'张',
        '🌾 喂食器: Lv'+G.feeders[0].food+'/5 | Rv'+G.feeders[1].food+'/5   连击: x'+G.birdCombo,
        '',
        '操作提示: 空格/回车=快门  Esc=继续/暂停',
        '方向键/WASD=移动准星  Z/X=变焦  F=投喂',
        '拖动屏幕=移动准星',
        '1=图鉴  2=成就  3=照片画廊'
    ];
    let yy=H/2-35;
    for(const t of pauseTips){ctx.fillText(t,W/2,yy);yy+=18;}
    drawBtn(ctx,W/2-90,yy+10,180,55,'▶ 继续观察','resume','#4caf50');
    drawBtn(ctx,W/2-70,yy+75,140,45,'← 返回菜单','quit','#757575');
    ctx.textAlign='left';
}

function drawGameOver(ctx){
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#1a237e');g.addColorStop(1,'#1b5e20');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';
    for(let i=0;i<40;i++){
        const sx=(i*87)%W,sy=(i*53)%300;
        ctx.globalAlpha=0.2+Math.abs(Math.sin((Date.now()+i*300)/500))*0.5;
        ctx.beginPath();ctx.arc(sx,sy,0.5+(i%3)*0.4,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
    const isNew=G.score>=G.highScore&&G.score>0;
    ctx.fillStyle=isNew?'#ffd700':'#fff';ctx.font='bold 40px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.fillText(isNew?'🎉 新纪录!':'⏱ 时间到!',W/2,80);
    ctx.font='55px Arial';ctx.fillText('📷',W/2,145);
    ctx.fillStyle='#fff';ctx.font='bold 20px "Microsoft YaHei"';
    ctx.fillText('本期观察报告',W/2,180);
    ctx.fillStyle='rgba(255,255,255,0.1)';
    roundRect(ctx,30,200,W-60,290,14);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=2;
    roundRect(ctx,30,200,W-60,290,14);ctx.stroke();
    let yy=230;
    ctx.fillStyle='#ddd';ctx.font='14px "Microsoft YaHei"';ctx.textAlign='left';
    ctx.fillText('📚 图鉴收集:',50,yy);yy+=20;
    for(let i=0;i<BIRD_SPECIES.length;i++){
        const sp=BIRD_SPECIES[i];const found=G.pokedex.indexOf(sp.id)>=0;
        ctx.fillStyle=found?'#ffd700':'#888';ctx.font='12px "Microsoft YaHei"';
        ctx.fillText('  '+(found?sp.emoji:'❓')+' '+sp.name+' ('+sp.rarity+' +'+sp.score+') '+(found?'✓':'×'),50,yy);
        yy+=16;
    }
    yy+=8;
    const baseScore=G.score-(G.bonusClaimed?300:0);
    const achBonus=(G.achievements.filter(a=>a.unlocked).length)*50;
    const realBase=baseScore-achBonus;
    ctx.fillStyle='#ccc';ctx.font='13px "Microsoft YaHei"';
    ctx.fillText('📷 拍摄得分: '+Math.max(0,realBase),50,yy);yy+=18;
    ctx.fillText('🎞 照片数量: '+G.photos.length+'张 (其中稀有鸟 '+G.rarePhotos+' 张)',50,yy);yy+=18;
    ctx.fillText('🐦 麻雀拍摄: '+G.sparrowCount+'只',50,yy);yy+=18;
    ctx.fillStyle=G.perfectShots>0?'#ffd700':'#ccc';
    ctx.fillText('★★★完美: '+G.perfectShots+'张',50,yy);yy+=18;
    ctx.fillStyle=G.goodShots>0?'#90caf9':'#ccc';
    ctx.fillText('★★良好: '+G.goodShots+'张',50,yy);yy+=18;
    ctx.fillStyle='#ccc';
    ctx.fillText('★一般: '+G.normalShots+'张',50,yy);yy+=18;
    ctx.fillText('🏆 成就奖励: +'+achBonus+' ('+G.achievements.filter(a=>a.unlocked).length+'/'+G.achievements.length+')',50,yy);yy+=18;
    ctx.fillText('📚 图鉴奖励: '+(G.bonusClaimed?'+300':'未达成'),50,yy);yy+=18;
    ctx.fillStyle='#ffd700';ctx.font='bold 14px "Microsoft YaHei"';
    ctx.fillText('🎯 图鉴进度: '+G.pokedex.length+'/'+BIRD_SPECIES.length,50,yy);yy+=20;
    ctx.textAlign='center';
    ctx.fillStyle='#ffd700';ctx.font='bold 34px Arial';
    ctx.fillText('总分: '+G.score,W/2,yy+8);
    yy+=45;
    ctx.fillStyle='#aaa';ctx.font='13px "Microsoft YaHei"';
    ctx.fillText('历史最高: '+G.highScore,W/2,yy+5);
    drawBtn(ctx,W/2-95,yy+22,190,55,'🔄 再玩一次','restart','#4caf50');
    drawBtn(ctx,W/2-80,yy+87,160,45,'🏠 返回菜单','menu','#757575');
    ctx.textAlign='left';
}

function draw(){
    switch(G.state){
        case STATE_MENU:drawMenu(ctx);break;
        case STATE_PLAYING:
            drawScene(ctx);
            for(const b of G.birds)drawBird(ctx,b);
            drawChirpNotes(ctx);
            drawCrosshair(ctx);
            drawParticles(ctx);
            drawHUD(ctx);
            drawAchievementToast(ctx);
            drawTutorial(ctx);
            drawDexPanel(ctx);
            drawAchPanel(ctx);
            drawGalleryPanel(ctx);
            if(G.flash>0){ctx.fillStyle=G.flashColor;ctx.globalAlpha=G.flash/8;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
            break;
        case STATE_PAUSE:
            drawScene(ctx);
            for(const b of G.birds)drawBird(ctx,b);
            drawCrosshair(ctx);drawHUD(ctx);
            drawPause(ctx);
            break;
        case STATE_OVER:drawGameOver(ctx);break;
    }
}

setInterval(function(){update();draw();},16);

const _sbtn=document.getElementById('start-game-btn');
_sbtn.addEventListener('click',function(){initAudio();startGame();this.style.display='none';});

})();
</script>

  function batchResizeCanvas() {

    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>

<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
