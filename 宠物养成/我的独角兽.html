<body>

<button id="start-game-btn" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:20px 40px;font-size:20px;background:#9c27b0;color:white;border:none;border-radius:12px;cursor:pointer;z-index:999;font-weight:bold;display:none;">开始游戏</button>

<canvas id="c"></canvas>

<script>
if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
</script>
<script src="../game_core.js"></script>
<script>
(function(){
"use strict";

const W=480,H=720;
const GAME_TIME=180;

const FOODS=[
    {id:0,name:'彩虹糖',icon:'🍬',mood:10,energy:5,magic:0,color:'#e91e63'},
    {id:1,name:'仙苹果',icon:'🍎',mood:8,energy:12,magic:2,color:'#f44336'},
    {id:2,name:'魔法仙露',icon:'🧪',mood:5,energy:3,magic:15,color:'#7c4dff'}
];

const MAGICS=[
    {id:0,name:'彩虹术',icon:'🌈',reqLv:1,desc:'治愈心情+魔力'},
    {id:1,name:'治愈术',icon:'💚',reqLv:2,desc:'恢复所有状态'},
    {id:2,name:'飞翔术',icon:'🪽',reqLv:3,desc:'飞行加速成长'},
    {id:3,name:'水晶术',icon:'💎',reqLv:4,desc:'魔法结晶提升'},
    {id:4,name:'流星术',icon:'☄️',reqLv:6,desc:'召唤流星许愿'},
    {id:5,name:'时光术',icon:'⏳',reqLv:8,desc:'暂停时间消耗'}
];

const DECORATIONS=[
    {id:0,name:'金花角饰',icon:'👑',price:0,slot:'head',color:'#ffd700'},
    {id:1,name:'粉蝴蝶结',icon:'🎀',price:0,slot:'neck',color:'#f06292'},
    {id:2,name:'彩带披风',icon:'🎗️',price:0,slot:'back',color:'#ba68c8'},
    {id:3,name:'星星贴纸',icon:'⭐',price:0,slot:'body',color:'#ffeb3b'},
    {id:4,name:'蓝宝项链',icon:'💠',price:0,slot:'neck',color:'#4fc3f7'},
    {id:5,name:'月亮发卡',icon:'🌙',price:0,slot:'head',color:'#90a4ae'},
    {id:6,name:'爱心徽章',icon:'❤️',price:0,slot:'body',color:'#ef5350'},
    {id:7,name:'水晶坠饰',icon:'🔮',price:0,slot:'head',color:'#ab47bc'},
    {id:8,name:'羽毛披风',icon:'🪶',price:0,slot:'back',color:'#f8bbd0'},
    {id:9,name:'铃铛项圈',icon:'🔔',price:0,slot:'neck',color:'#ffb74d'}
];

let audioCtx=null;
function initAudio(){
    if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
}
function playTone(freq,dur,type,vol){
    if(!audioCtx)return;
    try{
        const o=audioCtx.createOscillator();
        const g=audioCtx.createGain();
        o.type=type||'sine';
        o.frequency.value=freq;
        g.gain.value=vol||0.1;
        g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
        o.connect(g);g.connect(audioCtx.destination);
        o.start();o.stop(audioCtx.currentTime+dur);
    }catch(e){}
}
function sfxEat(){playTone(700,0.08,'sine',0.12);setTimeout(()=>playTone(900,0.1,'sine',0.1),80)}
function sfxBath(){for(let i=0;i<3;i++)setTimeout(()=>playTone(1000+i*80,0.05,'triangle',0.08),i*40)}
function sfxSleep(){playTone(300,0.2,'sine',0.08);setTimeout(()=>playTone(250,0.25,'sine',0.07),150)}
function sfxTrain(){playTone(500,0.08,'square',0.1);setTimeout(()=>playTone(800,0.06,'square',0.09),50)}
function sfxMagic(){playTone(523,0.07,'sine',0.12);setTimeout(()=>playTone(659,0.07,'sine',0.12),70);setTimeout(()=>playTone(784,0.07,'sine',0.12),140);setTimeout(()=>playTone(1047,0.18,'sine',0.12),210)}
function sfxLevelUp(){playTone(440,0.1,'sine',0.13);setTimeout(()=>playTone(554,0.1,'sine',0.13),100);setTimeout(()=>playTone(659,0.1,'sine',0.13),200);setTimeout(()=>playTone(880,0.25,'sine',0.14),300)}
function sfxUnlock(){playTone(784,0.1,'sine',0.15);setTimeout(()=>playTone(1175,0.2,'sine',0.15),120)}
function sfxBow(){playTone(900,0.06,'sine',0.12);setTimeout(()=>playTone(1200,0.1,'sine',0.1),80)}
function sfxBuzzer(){playTone(150,0.4,'sawtooth',0.18)}
function sfxBtn(){playTone(600,0.06,'sine',0.1)}
function sfxBad(){playTone(220,0.18,'square',0.12)}

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let scale=1;
function resize(){
    const r=W/H;
    let cw=window.innerWidth,ch=window.innerHeight;
    if(cw/ch>r){ch=cw/r}else{cw=ch*r}
    canvas.width=cw;canvas.height=ch;
    scale=cw/W;
    ctx.setTransform(scale,0,0,scale,0,0);
}
window.addEventListener('resize',resize);resize();

const G={
    state:STATE_MENU,score:0,highScore:0,timeLeft:GAME_TIME*60,
    unicorn:{
        mood:80,energy:80,magic:50,
        level:1,exp:0,expMax:100,
        x:W/2,y:420,bob:0,rot:0,color:'#fff',
        training:false,trainTimer:0,trainHits:0,trainMiss:0,trainTarget:0,
        sleeping:false,sleepTimer:0,
        washing:false,washCount:0,
        activeMagic:null,magicAnim:0,
        decors:new Set()
    },
    magicProgress:[0,0,0,0,0,0],
    magicUnlocked:[false,false,false,false,false,false],
    activeMenu:null,foodMenu:false,magicMenu:false,decorMenu:false,
    particles:[],popups:[],btnRects:{},
    keys:{},paused:false,
    isDragging:false,dragStart:null,lastPos:null,
    sparkleTimer:0,stars:[],
    bestLevel:parseInt(Storage.load('djs_level','1')),
    savedMagic:Storage.load('djs_magic','0,0,0,0,0,0').split(',').map(n=>parseInt(n)||0)
};
try{G.magicUnlocked=G.savedMagic.map(v=>v>=5)}catch(e){}
G.highScore=parseInt(Storage.load('djs_highscore','0'));
for(let i=0;i<30;i++)G.stars.push({x:Math.random()*W,y:Math.random()*H/2,s:0.5+Math.random()*2,ph:Math.random()*100});

function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
}
function drawBtn(ctx,x,y,w,h,text,name,color,sub){
    G.btnRects[name]={x:x,y:y,w:w,h:h};
    ctx.fillStyle=color||'#9c27b0';
    ctx.strokeStyle='rgba(255,255,255,0.5)';
    ctx.lineWidth=2;
    roundRect(ctx,x,y,w,h,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#fff';
    ctx.font='bold 14px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(text,x+w/2,y+h/2-(sub?6:0));
    if(sub){ctx.font='10px "Microsoft YaHei"';ctx.fillStyle='rgba(255,255,255,0.85)';ctx.fillText(sub,x+w/2,y+h/2+12);}
    ctx.textBaseline='alphabetic';ctx.textAlign='left';
}
function hitBtn(p,name){
    const r=G.btnRects[name];
    return r&&p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;
}
function getPos(e){
    const rect=canvas.getBoundingClientRect();
    const t=e.touches?e.touches[0]:(e.changedTouches?e.changedTouches[0]:e);
    if(!t)return{x:0,y:0};
    return{x:(t.clientX-rect.left)/scale,y:(t.clientY-rect.top)/scale};
}
function addParticle(x,y,color,text,vy,size){
    G.particles.push({x:x,y:y,vx:(Math.random()-0.5)*4,vy:vy||-2,life:40,maxLife:40,color:color,text:text,size:size||3+Math.random()*3});
}
function addPopup(x,y,text,color){
    G.popups.push({x:x,y:y,text:text,color:color||'#fff',life:55,maxLife:55,vy:-1.1});
}
function updateParticles(){
    for(let i=G.particles.length-1;i>=0;i--){
        const p=G.particles[i];
        p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life--;
        if(p.life<=0)G.particles.splice(i,1);
    }
    for(let i=G.popups.length-1;i>=0;i--){
        const p=G.popups[i];
        p.y+=p.vy;p.life--;
        if(p.life<=0)G.popups.splice(i,1);
    }
}
function drawParticles(ctx){
    for(const p of G.particles){
        ctx.globalAlpha=p.life/p.maxLife;
        if(p.text){ctx.fillStyle=p.color;ctx.font='bold 16px Arial';ctx.textAlign='center';ctx.fillText(p.text,p.x,p.y);ctx.textAlign='left';}
        else{ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();}
    }
    ctx.globalAlpha=1;
    for(const p of G.popups){
        ctx.globalAlpha=p.life/p.maxLife;
        ctx.fillStyle=p.color;
        ctx.font='bold 15px "Microsoft YaHei"';ctx.textAlign='center';
        ctx.fillText(p.text,p.x,p.y);ctx.textAlign='left';
    }
    ctx.globalAlpha=1;
}

window.addEventListener('keydown',function(e){
    G.keys[e.key.toLowerCase()]=true;
    if(e.key===' '||e.key==='Enter'){
        e.preventDefault();initAudio();
        if(G.state===STATE_MENU){startGame();return}
        if(G.state===STATE_OVER){startGame();return}
        if(G.state===STATE_PLAYING&&!G.paused&&G.unicorn.training)hitTrainTarget();
    }
    if(e.key==='Escape'){
        if(G.state===STATE_PLAYING)togglePause();
        else{G.foodMenu=false;G.magicMenu=false;G.decorMenu=false;G.activeMenu=null;}
    }
    if(G.state===STATE_PLAYING&&!G.paused){
        if(e.key==='1'){G.foodMenu=!G.foodMenu;G.magicMenu=false;G.decorMenu=false;G.activeMenu=G.foodMenu?'food':null;sfxBtn()}
        if(e.key==='2'){startBath()}
        if(e.key==='3'){startSleep()}
        if(e.key==='4'){startTraining()}
        if(e.key==='5'){G.magicMenu=!G.magicMenu;G.foodMenu=false;G.decorMenu=false;G.activeMenu=G.magicMenu?'magic':null;sfxBtn()}
        if(e.key==='6'){G.decorMenu=!G.decorMenu;G.foodMenu=false;G.magicMenu=false;G.activeMenu=G.decorMenu?'decor':null;sfxBtn()}
    }
    initAudio();
});
window.addEventListener('keyup',function(e){G.keys[e.key.toLowerCase()]=false});

function handlePointerDown(e){
    initAudio();
    const p=getPos(e);
    if(G.state===STATE_MENU){if(hitBtn(p,'start')){startGame();return}}
    else if(G.state===STATE_OVER){
        if(hitBtn(p,'restart')){startGame();return}
        if(hitBtn(p,'menu')){G.state=STATE_MENU;return}
    }else if(G.state===STATE_PAUSE){
        if(hitBtn(p,'resume')){togglePause();return}
        if(hitBtn(p,'quit')){G.state=STATE_MENU;return}
    }else if(G.state===STATE_PLAYING&&!G.paused){
        if(G.foodMenu){
            for(let i=0;i<FOODS.length;i++){if(hitBtn(p,'food_'+i)){feed(i);return}}
            if(hitBtn(p,'fmClose')){G.foodMenu=false;G.activeMenu=null;sfxBtn();return}
        }
        if(G.magicMenu){
            for(let i=0;i<MAGICS.length;i++){if(hitBtn(p,'magic_'+i)){tryMagic(i);return}}
            if(hitBtn(p,'mgClose')){G.magicMenu=false;G.activeMenu=null;sfxBtn();return}
        }
        if(G.decorMenu){
            for(let i=0;i<DECORATIONS.length;i++){if(hitBtn(p,'decor_'+i)){toggleDecor(i);return}}
            if(hitBtn(p,'dcClose')){G.decorMenu=false;G.activeMenu=null;sfxBtn();return}
        }
        if(G.unicorn.training){hitTrainTargetAt(p);return}
        if(hitBtn(p,'foodBtn')){G.foodMenu=!G.foodMenu;G.magicMenu=false;G.decorMenu=false;G.activeMenu=G.foodMenu?'food':null;sfxBtn();return}
        if(hitBtn(p,'bathBtn')){startBath();return}
        if(hitBtn(p,'sleepBtn')){startSleep();return}
        if(hitBtn(p,'trainBtn')){startTraining();return}
        if(hitBtn(p,'magicBtn')){G.magicMenu=!G.magicMenu;G.foodMenu=false;G.decorMenu=false;G.activeMenu=G.magicMenu?'magic':null;sfxBtn();return}
        if(hitBtn(p,'decorBtn')){G.decorMenu=!G.decorMenu;G.foodMenu=false;G.magicMenu=false;G.activeMenu=G.decorMenu?'decor':null;sfxBtn();return}
        const u=G.unicorn;
        if(Math.hypot(p.x-u.x,p.y-u.y)<100){
            if(u.washing){
                G.isDragging=true;G.dragStart=p;G.lastPos=p;
                u.washCount++;
                u.mood=Math.min(100,u.mood+0.3);
                for(let i=0;i<2;i++)addParticle(p.x,p.y,'#81d4fa','✨',-1.2-Math.random(),3);
                sfxBath();
            }else if(u.sleeping){
                addPopup(u.x,u.y-80,'嘘...独角兽正在睡觉','#7986cb');
            }else{
                u.mood=Math.min(100,u.mood+0.5);
                addParticle(u.x+(Math.random()-0.5)*30,u.y-40+(Math.random()-0.5)*20,'#ff80ab','💕',-1.5,2);
                sfxBtn();
            }
        }
    }
}
function handlePointerMove(e){
    if(G.state!==STATE_PLAYING||G.paused)return;
    const p=getPos(e);
    if(G.isDragging&&G.unicorn.washing&&G.lastPos){
        const dx=p.x-G.lastPos.x,dy=p.y-G.lastPos.y;
        if(Math.hypot(dx,dy)>4){
            G.unicorn.washCount++;
            G.unicorn.mood=Math.min(100,G.unicorn.mood+0.15);
            G.unicorn.magic=Math.min(100,G.unicorn.magic+0.05);
            for(let i=0;i<2;i++)addParticle(p.x,p.y,'#b3e5fc','✨',-1,3);
            sfxBath();G.lastPos=p;
        }
    }
}
function handlePointerUp(e){
    G.isDragging=false;G.dragStart=null;G.lastPos=null;
}

canvas.addEventListener('mousedown',handlePointerDown);
canvas.addEventListener('mousemove',handlePointerMove);
canvas.addEventListener('mouseup',handlePointerUp);
canvas.addEventListener('mouseleave',handlePointerUp);
canvas.addEventListener('touchstart',function(e){e.preventDefault();handlePointerDown(e)},{passive:false});
canvas.addEventListener('touchmove',function(e){e.preventDefault();handlePointerMove(e)},{passive:false});
canvas.addEventListener('touchend',function(e){e.preventDefault();handlePointerUp(e)},{passive:false});

function feed(idx){
    const f=FOODS[idx];const u=G.unicorn;
    u.mood=Math.min(100,u.mood+f.mood);
    u.energy=Math.min(100,u.energy+f.energy);
    u.magic=Math.min(100,u.magic+f.magic);
    addExp(f.mood+f.energy+f.magic);
    for(let i=0;i<8;i++)addParticle(u.x+(Math.random()-0.5)*40,u.y-40+Math.random()*20,f.color,f.icon,-1.2-Math.random(),3);
    addPopup(u.x,u.y-80,f.icon+' '+f.name+' +状态',f.color);
    sfxEat();G.foodMenu=false;G.activeMenu=null;
}
function startBath(){
    const u=G.unicorn;
    if(u.training){addPopup(W/2,160,'训练中无法洗澡!','#f44336');return}
    u.washing=true;u.washCount=0;
    addPopup(u.x,u.y-90,'🛁 拖动独角兽洗澡!','#29b6f6');
    sfxBath();

function startSleep(){

    u.sleeping=true;u.sleepTimer=240;

}
function startTraining(){
    const u=G.unicorn;

    if(u.training)return;

    addPopup(W/2,160,'🎯 跳跃训练! 点击绿块或空格通过','#66bb6a');
    sfxTrain();
    u.energy=Math.max(0,u.energy-20);

function hitTrainTarget(){hitTrainTargetAt({x:G.unicorn.trainTarget,y:560})}
function hitTrainTargetAt(p){
    const u=G.unicorn;
    const dx=Math.abs(p.x-u.trainTarget);
    if(dx<60){
        u.trainHits++;
        addExp(15);
        addPopup(W/2,580,'✅ 命中! +经验','#4caf50');
        sfxTrain();
        for(let i=0;i<6;i++)addParticle(u.trainTarget,560,'#81c784','✨',-2-Math.random(),3);
    }else{
        u.trainMiss++;
        addPopup(W/2,580,'❌ 未命中','#f44336');sfxBad();
    }
    u.trainTarget=40+Math.floor(Math.random()*(W-80));
}
function tryMagic(idx){
    const m=MAGICS[idx];const u=G.unicorn;
    if(u.level<m.reqLv){addPopup(W/2,150,'需要Lv.'+m.reqLv+'才能练习此魔法!','#ff5252');sfxBad();return}
    if(u.magic<10){addPopup(W/2,150,'魔力不足(需10)!','#ff5252');sfxBad();return}
    u.magic-=10;
    G.magicProgress[idx]++;
    sfxMagic();
    for(let i=0;i<10;i++){
        const a=Math.random()*Math.PI*2;
        addParticle(u.x,u.y-50,'#ab47bc',null,Math.cos(a)*2,Math.sin(a)*2-1,4);
    }
    addPopup(u.x,u.y-90,'✨ 练习'+m.name+' ('+G.magicProgress[idx]+'/5)','#ba68c8');
    if(G.magicProgress[idx]>=5&&!G.magicUnlocked[idx]){
        G.magicUnlocked[idx]=true;sfxUnlock();
        addPopup(W/2,180,'🎉 解锁新魔法: '+m.name+'!','#ffd700');
        Storage.save('djs_magic',G.magicProgress.map(v=>Math.max(v,5)).join(','));
    }
    if(idx===0){u.mood=Math.min(100,u.mood+15);u.magic=Math.min(100,u.magic+5)}
    if(idx===1){u.mood=Math.min(100,u.mood+10);u.energy=Math.min(100,u.energy+10);u.magic=Math.min(100,u.magic+10)}
    if(idx===2){addExp(30)}
    if(idx===3){u.magic=Math.min(100,u.magic+20)}
    if(idx===4){for(let i=0;i<5;i++)addPopup(W/2+Math.random()*80-40,200+i*22,'🌟 +运气','#ffd700');addExp(50)}
    if(idx===5){u.energy=Math.min(100,u.energy+15);u.mood=Math.min(100,u.mood+10)}
    G.magicMenu=false;G.activeMenu=null;
}
function toggleDecor(idx){
    const d=DECORATIONS[idx];const u=G.unicorn;
    if(u.decors.has(idx)){
        u.decors.delete(idx);addPopup(W/2,150,'- 卸下'+d.name,d.color);
    }else{
        u.decors.add(idx);addPopup(W/2,150,'✨ 装扮'+d.name,d.color);sfxBow();
    }
    addExp(5);
}
function addExp(v){
    const u=G.unicorn;
    u.exp+=v;
    while(u.exp>=u.expMax){
        u.exp-=u.expMax;
        u.level++;u.expMax=80+u.level*30;
        sfxLevelUp();
        addPopup(u.x,u.y-120,'🎊 升级到 Lv.'+u.level+'!','#ffd700');
        for(let i=0;i<20;i++){
            const a=Math.random()*Math.PI*2;
            addParticle(u.x,u.y-50,'#ffd700','✨',Math.cos(a)*3-1,Math.sin(a)*3-1,3);
        }
        if(u.level>G.bestLevel){
            G.bestLevel=u.level;
            Storage.save('djs_level',String(u.level));
        }
    }
}

function startGame(){
    initAudio();
    G.state=STATE_PLAYING;G.score=0;G.timeLeft=GAME_TIME*60;
    const u=G.unicorn;
    u.mood=80;u.energy=80;u.magic=50;
    u.level=1;u.exp=0;u.expMax=100;
    u.x=W/2;u.y=420;u.bob=0;u.rot=0;u.color='#fff';
    u.training=false;u.trainTimer=0;u.trainHits=0;u.trainMiss=0;
    u.sleeping=false;u.sleepTimer=0;u.washing=false;u.washCount=0;
    u.activeMagic=null;u.magicAnim=0;u.decors=new Set();
    G.magicProgress=[0,0,0,0,0,0];
    G.magicUnlocked=[false,false,false,false,false,false];
    try{G.magicUnlocked=G.savedMagic.map(v=>v>=5)}catch(e){}
    G.foodMenu=false;G.magicMenu=false;G.decorMenu=false;G.activeMenu=null;
    G.particles=[];G.popups=[];G.paused=false;G.isDragging=false;
    sfxBtn();
}
function endGame(){
    G.state=STATE_OVER;
    const u=G.unicorn;
    const unlockedCount=G.magicUnlocked.filter(v=>v).length;
    const decorCount=u.decors.size;
    const stateSum=u.mood+u.energy+u.magic;
    G.score=u.level*100+unlockedCount*150+decorCount*20+Math.floor(stateSum);
    if(G.score>G.highScore){
        G.highScore=G.score;Storage.save('djs_highscore',G.highScore);
    }
    sfxBuzzer();
}
function togglePause(){
    G.paused=!G.paused;
    if(G.paused)G.state=STATE_PAUSE;else G.state=STATE_PLAYING;
    sfxBtn();
}

function update(){
    if(G.state!==STATE_PLAYING||G.paused)return;
    G.timeLeft--;
    if(G.timeLeft<=0){endGame();return}
    const u=G.unicorn;
    if(G.timeLeft%120===0){
        u.mood=Math.max(0,u.mood-2);
        u.energy=Math.max(0,u.energy-2);
        u.magic=Math.max(0,u.magic-1);
    }
    if(u.mood<20||u.energy<20){u.magic=Math.max(0,u.magic-0.05)}
    u.bob+=0.05;
    u.x=W/2+Math.sin(Date.now()/2000)*15;
    if(u.training){
        u.trainTimer--;
        if(u.trainTimer<=0||u.trainMiss>=5){
            u.training=false;
            addPopup(W/2,160,'训练结束! 命中'+u.trainHits+'/'+(u.trainHits+u.trainMiss),'#8bc34a');
        }
    }
    if(u.sleeping){
        u.sleepTimer--;u.energy=Math.min(100,u.energy+0.5);
        if(G.timeLeft%30===0)addParticle(u.x+20+Math.random()*20,u.y-60,'#9fa8da','💤',-0.8,2);
        if(u.sleepTimer<=0){u.sleeping=false;addPopup(u.x,u.y-80,'☀ 睡醒啦! 能量恢复~','#7986cb');}
    }
    if(u.washing&&G.timeLeft%60===0){
        u.energy=Math.max(0,u.energy-0.3);
    }
    G.sparkleTimer++;
    if(G.sparkleTimer>20){
        G.sparkleTimer=0;
        addParticle(50+Math.random()*(W-100),120+Math.random()*200,Math.random()<0.3?'#ffd700':'#ce93d8','✨',-0.5-Math.random()*0.5,1.5+Math.random());
    }
    for(const s of G.stars){s.ph+=0.01;s.y+=0.05;if(s.y>H/2){s.y=Math.random()*50;s.x=Math.random()*W}}
    updateParticles();
}

function drawUnicorn(ctx){

    ctx.fillStyle='rgba(255,255,255,0.1)';

        ctx.beginPath();ctx.arc(0,-10,95,0,Math.PI*2);ctx.fill();
    }
    ctx.fillStyle=u.color;
    ctx.beginPath();ctx.ellipse(-15,10,52,35,-0.1,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(30,-15,42,38,0.2,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#e1bee7';ctx.lineWidth=3;
    const tailPts=[];
    for(let i=0;i<6;i++){
        const t=i/5;

    }

        ctx.strokeStyle=tailPts[i].c;ctx.lineWidth=10-i;ctx.lineCap='round';
        ctx.beginPath();ctx.moveTo(tailPts[i].x,tailPts[i].y);
        ctx.quadraticCurveTo(tailPts[i].x-20,(tailPts[i].y+tailPts[i+1].y)/2+Math.sin(u.bob+i)*5,tailPts[i+1].x,tailPts[i+1].y);ctx.stroke();
    }
    ctx.strokeStyle='#f8bbd0';ctx.lineWidth=9;ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(-58,-5);
    for(let i=1;i<=7;i++){

    }
    ctx.stroke();
    const mh=['#f44336','#ff9800','#ffeb3b','#4caf50','#2196f3','#9c27b0'];
    for(let i=0;i<6;i++){
        ctx.fillStyle=mh[i];
        ctx.beginPath();
        const hx=15+i*5,hy=-60-i*3;
        ctx.moveTo(hx-3,hy+15);ctx.lineTo(hx,hy);ctx.lineTo(hx+3,hy+15);ctx.closePath();ctx.fill();
    }
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.moveTo(30,-40);ctx.lineTo(38,-80);ctx.lineTo(46,-40);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#ffd700';ctx.lineWidth=2;ctx.stroke();
    if(u.decors.has(0)){ctx.font='22px Arial';ctx.textAlign='center';ctx.fillText('👑',38,-65);}
    if(u.decors.has(5)){ctx.font='18px Arial';ctx.textAlign='center';ctx.fillText('🌙',22,-50);}
    if(u.decors.has(7)){ctx.font='18px Arial';ctx.textAlign='center';ctx.fillText('🔮',44,-48);}
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.ellipse(-8,-28,12,10,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(10,-25,12,10,0,0,Math.PI*2);ctx.fill();
    if(u.sleeping){
        ctx.strokeStyle='#333';ctx.lineWidth=2;ctx.lineCap='round';
        ctx.beginPath();ctx.moveTo(-14,-28);ctx.quadraticCurveTo(-8,-25,-2,-28);ctx.stroke();
        ctx.beginPath();ctx.moveTo(4,-25);ctx.quadraticCurveTo(10,-22,16,-25);ctx.stroke();
    }else{
        ctx.fillStyle='#333';
        ctx.beginPath();ctx.arc(-8,-28+face,3,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.arc(10,-25+face,3,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#fff';
        ctx.beginPath();ctx.arc(-7,-29+face,1.2,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.arc(11,-26+face,1.2,0,Math.PI*2);ctx.fill();
    }
    ctx.fillStyle='#f06292';
    ctx.beginPath();ctx.ellipse(28,-12,5,3,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(240,98,146,0.4)';
    ctx.beginPath();ctx.arc(-16,-12,5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(18,-10,5,0,Math.PI*2);ctx.fill();
    if(u.decors.has(4)){ctx.font='18px Arial';ctx.textAlign='center';ctx.fillText('💠',8,0);}
    if(u.decors.has(6)){ctx.font='16px Arial';ctx.textAlign='center';ctx.fillText('❤️',-20,20);}
    if(u.decors.has(3)){ctx.font='16px Arial';ctx.textAlign='center';ctx.fillText('⭐',10,28);}

    }

        ctx.fillStyle='rgba(121,134,192,0.25)';
        ctx.beginPath();ctx.arc(bx,by-20,110,0,Math.PI*2);ctx.fill();

    }
    if(G.magicMenu){
        ctx.fillStyle='rgba(0,0,0,0.88)';ctx.fillRect(0,155,W,420);
        ctx.fillStyle='#ab47bc';ctx.font='bold 22px "Microsoft YaHei"';
        ctx.textAlign='center';ctx.fillText('✨ 魔法学习 (每次消耗10魔力)',W/2,190);ctx.textAlign='left';
        for(let i=0;i<MAGICS.length;i++){
            const m=MAGICS[i];const u=G.unicorn;
            const okLv=u.level>=m.reqLv;const prog=G.magicProgress[i];
            const done=G.magicUnlocked[i];
            drawBtn(ctx,20,208+i*58,W-40,50,
                (done?'🎉':'✨')+' '+m.icon+' '+m.name+' (Lv.'+m.reqLv+' req) ['+Math.min(prog,5)+'/5]',
                'magic_'+i,!okLv?'#555':done?'#689f38':(prog>=5?'#673ab7':'#ab47bc'),
                m.desc+(done?' 已解锁':'')
            );
        }
        drawBtn(ctx,W/2-60,562,120,40,'关 闭','mgClose','#757575');
    }
    if(G.decorMenu){
        ctx.fillStyle='rgba(0,0,0,0.88)';ctx.fillRect(0,155,W,420);
        ctx.fillStyle='#f06292';ctx.font='bold 22px "Microsoft YaHei"';
        ctx.textAlign='center';ctx.fillText('🎀 装扮独角兽 (点击切换, 当前: '+G.unicorn.decors.size+')',W/2,190);ctx.textAlign='left';
        for(let i=0;i<DECORATIONS.length;i++){
            const d=DECORATIONS[i];const on=G.unicorn.decors.has(i);
            const x=20+(i%2)*225,y=208+Math.floor(i/2)*60;
            drawBtn(ctx,x,y,215,52,
                (on?'✅':'⬜')+' '+d.icon+' '+d.name+' ['+d.slot+']',
                'decor_'+i,on?d.color:'#616161','点击装扮/卸下'
            );
        }
        drawBtn(ctx,W/2-60,562,120,40,'关 闭','dcClose','#757575');
    }
}

function drawActionBtns(ctx){
    drawBtn(ctx,8,H-88,72,75,'🍽 喂食','foodBtn','#e91e63','[1] 3种食物');
    drawBtn(ctx,88,H-88,72,75,'🛁 洗澡','bathBtn','#29b6f6','[2] 拖擦身');
    drawBtn(ctx,168,H-88,72,75,'💤 睡觉','sleepBtn','#5c6bc0','[3] +能量');
    drawBtn(ctx,248,H-88,72,75,'🎯 训练','trainBtn','#43a047','[4] 升级');
    drawBtn(ctx,328,H-88,72,75,'✨ 魔法','magicBtn','#8e24aa','[5] 6种');
    drawBtn(ctx,408,H-88,64,75,'🎀 装扮','decorBtn','#ec407a','[6] 10种');
}

function drawMenu(ctx){
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#4a148c');g.addColorStop(0.5,'#7b1fa2');g.addColorStop(1,'#ad1457');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    for(let i=0;i<40;i++){
        ctx.fillStyle=`hsla(${300+Math.random()*60},70%,80%,${0.1+Math.random()*0.25})`;
        const sx=Math.random()*W,sy=Math.random()*H;
        ctx.beginPath();ctx.arc(sx,sy,2+Math.random()*3,0,Math.PI*2);ctx.fill();
    }
    ctx.save();ctx.translate(W/2,220);
    const sc=1.6+Math.sin(Date.now()/500)*0.06;ctx.scale(sc,sc);
    ctx.font='85px Arial';ctx.textAlign='center';ctx.fillText('🦄🌈✨',0,0);
    ctx.restore();
    ctx.fillStyle='#f8bbd0';ctx.font='bold 46px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.fillText('我的独角兽',W/2,325);
    ctx.fillStyle='#fff';ctx.font='18px "Microsoft YaHei"';
    ctx.fillText('180秒魔法养宠之旅!',W/2,355);
    ctx.fillStyle='#ffd700';ctx.font='bold 16px "Microsoft YaHei"';
    ctx.fillText('🌟 最高分: '+G.highScore+'  最佳等级: Lv.'+G.bestLevel,W/2,390);
    drawBtn(ctx,W/2-100,415,200,60,'开始养成','start','#9c27b0');
    ctx.fillStyle='#fff';ctx.font='13px "Microsoft YaHei"';
    let yy=500;
    const tips=[
        '📋 玩法说明：',
        '• 三条属性: 心情/能量/魔力 会随时间下降',
        '• [喂食] 3种魔法食物加不同属性',
        '• [洗澡] 拖擦独角兽清洁+心情',
        '• [睡觉] 快速恢复能量',
        '• [训练] 点击跳跃, 累积经验升级',
        '• [魔法] 6种魔法, 每种练习5次解锁(等级限制)',
        '• [装扮] 10种装饰, 每件+装饰度',
        '• 得分 = 等级×100 + 魔法×150 + 装扮×20 + 状态和'
    ];
    for(const t of tips){ctx.fillText(t,W/2,yy);yy+=18;}
    ctx.fillStyle='#ffd700';ctx.font='bold 12px "Microsoft YaHei"';
    ctx.fillText('空格/回车=训练  Esc=暂停  1~6=快捷键',W/2,yy+10);
    ctx.textAlign='left';
}

function drawPause(ctx){
    ctx.fillStyle='rgba(0,0,0,0.82)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 48px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.fillText('⏸ 暂停中',W/2,H/2-60);
    drawBtn(ctx,W/2-90,H/2-20,180,55,'▶ 继续养成','resume','#9c27b0');
    drawBtn(ctx,W/2-70,H/2+50,140,45,'← 返回菜单','quit','#757575');
    ctx.textAlign='left';
}

function drawGameOver(ctx){
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#4a148c');g.addColorStop(1,'#ad1457');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fillRect(0,0,W,H);
    const u=G.unicorn;
    const isNew=G.score>=G.highScore&&G.score>0;
    ctx.fillStyle=isNew?'#ffd700':'#fff';ctx.font='bold 40px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.fillText(isNew?'🎉 新纪录!':'✨ 养成结束!',W/2,100);
    ctx.font='55px Arial';ctx.fillText('🦄🌈',W/2,170);
    ctx.fillStyle='#fff';ctx.font='bold 20px "Microsoft YaHei"';
    ctx.fillText('独角兽养成报告',W/2,210);
    ctx.fillStyle='rgba(255,255,255,0.1)';
    roundRect(ctx,40,230,W-80,255,14);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=2;
    roundRect(ctx,40,230,W-80,255,14);ctx.stroke();
    let yy=260;
    ctx.fillStyle='#ddd';ctx.font='14px "Microsoft YaHei"';ctx.textAlign='left';
    const magicCount=G.magicUnlocked.filter(v=>v).length;
    const decorCount=u.decors.size;
    const stateSum=u.mood+u.energy+u.magic;
    const rows=[
        ['🏆 最终等级','Lv.'+u.level+' × 100 = '+u.level*100],
        ['✨ 解锁魔法数',magicCount+' × 150 = '+magicCount*150],
        ['🎀 装扮件数',decorCount+' × 20 = '+decorCount*20],
        ['💕 心情能量魔力合计',Math.floor(u.mood)+'+'+Math.floor(u.energy)+'+'+Math.floor(u.magic)+' = '+Math.floor(stateSum)],
    ];
    for(let i=0;i<rows.length;i++){
        const [k,v]=rows[i];
        ctx.fillStyle=i===0?'#ffd700':'#bbb';ctx.fillText(k,60,yy);
        ctx.fillStyle='#fff';ctx.textAlign='right';ctx.fillText(v,W-60,yy);
        ctx.textAlign='left';yy+=30;
    }
    yy+=6;
    ctx.fillStyle='#fff';ctx.font='12px "Microsoft YaHei"';
    ctx.fillText('  6种魔法详情:',60,yy);yy+=18;
    for(let i=0;i<MAGICS.length;i++){
        const m=MAGICS[i];
        const ok=G.magicUnlocked[i];const prog=G.magicProgress[i];
        ctx.fillStyle=ok?'#ce93d8':'#888';
        ctx.fillText('  '+m.icon+' '+m.name+': '+(ok?'✓已解锁 ('+Math.max(prog,5)+'/5)':prog+'/5'),60,yy);yy+=16;
    }
    yy+=8;
    ctx.fillStyle='#ffd700';ctx.font='bold 32px Arial';ctx.textAlign='center';
    ctx.fillText('总分: '+G.score,W/2,yy+15);
    yy+=48;
    ctx.fillStyle='#aaa';ctx.font='13px "Microsoft YaHei"';
    ctx.fillText('历史最高: '+G.highScore+'  最佳等级: Lv.'+G.bestLevel,W/2,yy+4);
    drawBtn(ctx,W/2-95,yy+20,190,55,'🔄 再养一次','restart','#9c27b0');
    drawBtn(ctx,W/2-80,yy+85,160,45,'🏠 返回菜单','menu','#757575');
    ctx.textAlign='left';
}

function draw(){
    switch(G.state){
        case STATE_MENU:drawMenu(ctx);break;
        case STATE_PLAYING:
            drawScene(ctx);
            drawUnicorn(ctx);
            drawParticles(ctx);
            drawHUD(ctx);
            drawMenus(ctx);
            drawActionBtns(ctx);
            break;
        case STATE_PAUSE:
            drawScene(ctx);drawUnicorn(ctx);drawHUD(ctx);drawActionBtns(ctx);
            drawPause(ctx);
            break;
        case STATE_OVER:drawGameOver(ctx);break;
    }
}

setInterval(function(){update();draw();},16);

const _sbtn=document.getElementById('start-game-btn');
_sbtn.addEventListener('click',function(){initAudio();startGame();this.style.display='none';});

})();
</script>

<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>

<script>
(function(){
  if (window.__perfStable) return;
  window.__perfStable = true;
  var _origRandom = Math.random;
  var _cache = [];
  for (var i = 0; i < 512; i++) _cache.push(_origRandom());
  var _idx = 0;
  var _frameCount = 0;
  var _origRAF = window.requestAnimationFrame || function(cb){return setTimeout(cb,16)};
  window.requestAnimationFrame = function(cb) {
    return _origRAF.call(window, function(ts) {
      _frameCount++;
      if (_frameCount % 30 === 0) {
        for (var j = 0; j < 20; j++) _cache[(_idx+j) % 512] = _origRandom();
      }
      _idx = 0;
      cb(ts);
    });
  };
  Math.random = function() {
    var v = _cache[_idx % 512];
    _idx++;
    return v;
  };
})();
</script>
