<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>遛狗大作战</title>
<script src="../game_core.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: linear-gradient(180deg, #87ceeb 0%, #e0f6ff 50%, #90ee90 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; font-family: "Microsoft YaHei", sans-serif; }
#gameContainer { position: relative; }
canvas { border: 3px solid #4a90a4; border-radius: 16px; box-shadow: 0 0 30px rgba(74,144,164,0.3); display: block; max-width: 100%; height: auto; cursor: pointer; }
#startScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(20,40,60,0.92); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
#startScreen h1 { font-size: 52px; color: #ffd700; margin-bottom: 16px; text-shadow: 2px 2px 8px rgba(0,0,0,0.5); }
#startScreen .subtitle { color: #cfe8f0; font-size: 18px; margin-bottom: 36px; }
.dog-row { display: flex; gap: 16px; margin-bottom: 32px; flex-wrap: wrap; justify-content: center; padding: 0 20px; }
.dog-card { background: rgba(255,255,255,0.08); border: 2px solid #6ab8d0; border-radius: 14px; padding: 18px 14px; text-align: center; width: 120px; cursor: pointer; transition: all 0.25s; }
.dog-card:hover { background: rgba(255,255,255,0.18); transform: translateY(-3px); box-shadow: 0 6px 18px rgba(106,184,208,0.35); }
.dog-card.selected { border-color: #ffd700; box-shadow: 0 0 18px rgba(255,215,0,0.5); background: rgba(255,215,0,0.08); }
.dog-emoji { font-size: 44px; margin-bottom: 6px; }
.dog-name { color: #fff; font-weight: bold; margin-bottom: 3px; font-size: 14px; }
.dog-desc { color: #9fc6d4; font-size: 11px; }
#start-game-btn { padding: 14px 52px; font-size: 20px; background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%); color: white; border: none; border-radius: 28px; cursor: pointer; font-weight: bold; box-shadow: 0 5px 20px rgba(243,156,18,0.4); }
.help-box { color: #cfe8f0; font-size: 13px; line-height: 1.8; margin-top: 20px; text-align: center; max-width: 420px; background: rgba(0,0,0,0.2); padding: 14px 20px; border-radius: 10px; }
#dog-panel { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,25,35,0.96); z-index: 500; display: none; flex-direction: column; align-items: center; justify-content: flex-start; padding: 20px; overflow-y: auto; }
#dog-panel h2 { color: #ffd700; font-size: 30px; margin: 12px 0 18px; }
.dog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; max-width: 620px; width: 100%; padding: 10px; }
.dg-item { background: rgba(255,255,255,0.06); border: 2px solid rgba(106,184,208,0.3); border-radius: 12px; padding: 12px 8px; text-align: center; }
.dg-item.locked { opacity: 0.35; filter: grayscale(80%); }
.dg-item.unlocked { border-color: #6ab8d0; }
.dg-emoji { font-size: 38px; margin-bottom: 4px; }
.dg-name { color: #fff; font-size: 13px; font-weight: bold; }
.dg-stats { color: #9fc6d4; font-size: 10px; margin-top: 2px; }
.close-panel { margin: 20px 0; padding: 10px 30px; background: #e67e22; color: white; border: none; border-radius: 20px; cursor: pointer; font-size: 15px; font-weight: bold; }
/* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */
/* [BATCH-FIX:ad-components-css] */
.sponsor-btn{position:fixed;bottom:8px;left:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:2px 6px;border-radius:10px;font:10px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.sponsor-panel.show{display:flex}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.interstitial-ad.show{display:flex}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* [/BATCH-FIX:ad-components-css] */

/* [AD-FIX:responsive] */
@media (max-width:768px){.ad-banner-container{display:none!important}.sponsor-btn{transform:scale(.8);opacity:.6}}
/* [/AD-FIX:responsive] */
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="gameCanvas" width="900" height="640"></canvas>
</div>
<div id="startScreen">
  <h1>🐕 遛狗大作战 🏃</h1>
  <div class="subtitle">带狗狗散步，收集物品，解锁品种！</div>
  <div class="dog-row" id="dogSelect">
    <div class="dog-card selected" data-dog="0"><div class="dog-emoji">🐕</div><div class="dog-name">金毛</div><div class="dog-desc">速度均衡</div></div>
    <div class="dog-card" data-dog="1"><div class="dog-emoji">🐩</div><div class="dog-name">贵宾</div><div class="dog-desc">敏捷灵巧</div></div>
    <div class="dog-card" data-dog="2"><div class="dog-emoji">🦮</div><div class="dog-name">拉布拉多</div><div class="dog-desc">体力充沛</div></div>
    <div class="dog-card" data-dog="3"><div class="dog-emoji">🐕‍🦺</div><div class="dog-name">哈士奇</div><div class="dog-desc">活力爆表</div></div>
  </div>
  <button id="start-game-btn">出发遛狗！</button>
  <div class="help-box">
    🎮 操作说明<br>
    ⌨️ 方向键 / WASD 移动，空格键让狗狗跳跃<br>
    🖱️ 点击屏幕或拖拽也可控制方向<br>
    📱 移动端：左右半屏滑动控制<br>
    🎯 收集💩(清理)、🥏(飞盘)、🦴(骨头)、💧(水) 得分<br>
    ⚠️ 避开🚧障碍物和🕳️陷阱！
  </div>
</div>
<div id="dog-panel">
  <h2>📖 狗狗图鉴</h2>
  <div class="dog-grid" id="dogGrid"></div>
  <button class="close-panel" id="closeDogPanel">关闭图鉴</button>
</div>

<script>
const STATE_MENU = 0;
const STATE_WALKING = 1;
const STATE_PAUSED = 2;
const STATE_DOGBOOK = 3;

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = 900, H = 640;

if (!ctx.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r) {
    r = Math.min(r, w/2, h/2);
    this.beginPath();
    this.moveTo(x+r,y); this.arcTo(x+w,y,x+w,y+h,r);
    this.arcTo(x+w,y+h,x,y+h,r); this.arcTo(x,y+h,x,y,r);
    this.arcTo(x,y,x+w,y,r); this.closePath();
  };
}

const audioCtx = new (window.AudioContext||window.webkitAudioContext)();
function sfx(f,d,t,v) {
  try {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = t||'sine'; o.frequency.value = f;
    g.gain.setValueAtTime((v||0.07), audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+d);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+d);
  } catch(e){}
}

const DOG_BREEDS = [
  { name:'金毛', emoji:'🐕', color:'#d4a574', speed:3.2, jump:13, stamina:100, desc:'温顺友善' },
  { name:'贵宾', emoji:'🐩', color:'#a0a0a0', speed:3.8, jump:15, stamina:90, desc:'聪明活泼' },
  { name:'拉布拉多', emoji:'🦮', color:'#f4d03f', speed:3.4, jump:12, stamina:120, desc:'忠诚可靠' },
  { name:'哈士奇', emoji:'🐕‍🦺', color:'#85929e', speed:4.0, jump:14, stamina:110, desc:'精力旺盛' },
  { name:'柴犬', emoji:'🐶', color:'#e67e22', speed:3.6, jump:14, stamina:95, desc:'独立傲娇' },
  { name:'边牧', emoji:'🐕', color:'#2c3e50', speed:4.2, jump:16, stamina:105, desc:'智商第一' },
  { name:'斗牛犬', emoji:'🐶', color:'#935116', speed:2.6, jump:10, stamina:130, desc:'憨厚可爱' },
  { name:'萨摩耶', emoji:'🐩', color:'#ecf0f1', speed:3.3, jump:13, stamina:100, desc:'微笑天使' },
  { name:'吉娃娃', emoji:'🐕', color:'#a04000', speed:3.5, jump:17, stamina:80, desc:'小巧玲珑' },
  { name:'藏獒', emoji:'🦮', color:'#6e2c00', speed:2.8, jump:9, stamina:140, desc:'霸气威猛' },
  { name:'比熊', emoji:'🐩', color:'#fdfefe', speed:3.1, jump:12, stamina:92, desc:'棉花糖' },
  { name:'腊肠', emoji:'🐶', color:'#784212', speed:3.0, jump:11, stamina:98, desc:'小短腿' },
];

const ITEM_TYPES = [
  { type:'poop', emoji:'💩', score:-5, label:'便便(清理+5)' },
  { type:'frisbee', emoji:'🥏', score:15, label:'飞盘' },
  { type:'bone', emoji:'🦴', score:20, label:'骨头' },
  { type:'water', emoji:'💧', score:8, stamina:20, label:'水(+体力)' },
  { type:'treat', emoji:'🍖', score:25, stamina:10, label:'肉干' },
  { type:'ball', emoji:'🎾', score:12, label:'网球' },
];

const OBSTACLE_TYPES = [
  { type:'cone', emoji:'🚧', damage:10 },
  { type:'pit', emoji:'🕳️', damage:25 },
  { type:'mud', emoji:'💩', damage:5, slow:true },
  { type:'bike', emoji:'🚲', damage:15 },
];

let gameState = STATE_MENU;
let selectedDogIdx = 0;
let G = {};

function initGame(dogIdx) {
  const breed = DOG_BREEDS[dogIdx];
  G = {
    dog: {
      breedIdx: dogIdx,
      x: 200, y: 440,
      vx: 0, vy: 0,
      onGround: true,
      speed: breed.speed,
      jumpPower: breed.jump,
      stamina: breed.stamina,
      maxStamina: breed.stamina,
      happiness: 80,
      bounce: 0,
      facing: 1,
      animFrame: 0,
    },
    player: { x: 150, y: 430, targetX: 150, vx: 0, walkFrame: 0 },
    camera: { x: 0, y: 0 },
    items: [],
    obstacles: [],
    clouds: [],
    trees: [],
    flowers: [],
    spawnTimer: 80,
    distance: 0,
    score: 0,
    coins: 0,
    totalCoins: Storage.load('walkDog_coins', 0),
    highScore: Storage.load('walkDog_highscore', 0),
    unlocked: Storage.load('walkDog_unlocked', [0,1,2,3]),
    walks: Storage.load('walkDog_walks', 0),
    walkCount: 0,
    time: 0,
    floatTexts: [],
    particles: [],
    trail: [],
    keys: {},
    paused: false,
    bgOffset: 0,
    weather: Math.random() < 0.2 ? 'rain' : 'sunny',
    gameOver: false,
    comboCount: 0,
    comboTimer: 0,
  };
  for (let i=0;i<10;i++) G.clouds.push({ x: Math.random()*W*2, y: 30+Math.random()*120, s:0.4+Math.random()*0.5 });
  for (let i=0;i<30;i++) G.trees.push({ x: i*220+Math.random()*100, y: 340, s:0.8+Math.random()*0.5 });
  for (let i=0;i<80;i++) G.flowers.push({ x: Math.random()*W*5, y: 520+Math.random()*50, c: ['#ff6b9d','#ffd93d','#6bcb77','#4d96ff'][Math.floor(Math.random()*4)] });
  gameState = STATE_WALKING;
}

function saveProgress() {
  Storage.save('walkDog_coins', G.totalCoins);
  Storage.save('walkDog_highscore', G.highScore);
  Storage.save('walkDog_unlocked', G.unlocked);
  Storage.save('walkDog_walks', G.walks);
}

function addFloat(x,y,t,c) { G.floatTexts.push({x,y,t,c:c||'#fff',life:50,vy:-1.2}); }
function addParticle(x,y,c,t) { G.particles.push({x,y,vx:(Math.random()-0.5)*3,vy:-2-Math.random()*2,life:40,c,t}); }

function spawnEntity() {
  if (Math.random() < 0.65) {
    const t = ITEM_TYPES[Math.floor(Math.random()*ITEM_TYPES.length)];
    G.items.push({
      ...t,
      x: G.camera.x + W + 50 + Math.random()*200,
      y: 380 + Math.random()*120,
      bob: Math.random()*Math.PI*2,
      collected: false,
    });
  } else {
    const t = OBSTACLE_TYPES[Math.floor(Math.random()*OBSTACLE_TYPES.length)];
    G.obstacles.push({
      ...t,
      x: G.camera.x + W + 80 + Math.random()*150,
      y: t.type==='pit' ? 480 : 470,
    });
  }
}

function updateGame() {
  if (gameState !== STATE_WALKING || G.gameOver || G.paused) return;
  G.time++;
  G.bgOffset += 0.3;
  const d = G.dog;
  const p = G.player;
  let moveX = 0;
  if (G.keys['ArrowLeft']||G.keys['a']||G.keys['A']) moveX -= 1;
  if (G.keys['ArrowRight']||G.keys['d']||G.keys['D']) moveX += 1;
  if (G.keys['ArrowUp']||G.keys['w']||G.keys['W']||G.keys[' ']) {
    if (d.onGround && d.stamina >= 10) {
      d.vy = -d.jumpPower;
      d.onGround = false;
      d.stamina -= 8;
      sfx(650, 0.15, 'square', 0.05);
      addParticle(d.x, d.y+20, '#fff', '💨');
    }
  }
  if (moveX !== 0) d.stamina = Math.max(0, d.stamina - 0.1);
  let speedMod = 1;
  if (d.stamina < 20) speedMod = 0.5;
  d.vx = moveX * d.speed * speedMod;
  if (d.vx !== 0) d.facing = d.vx > 0 ? 1 : -1;
  d.vy += 0.6;
  d.x += d.vx + 1.2;
  d.y += d.vy;
  const groundY = 470;
  if (d.y >= groundY) {
    d.y = groundY;
    d.vy = 0;
    d.onGround = true;
  }
  if (d.x < G.camera.x + 60) d.x = G.camera.x + 60;
  d.bounce = Math.abs(d.vx) > 0.1 ? Math.sin(G.time*0.3)*3 : Math.sin(G.time*0.08)*1.5;
  d.animFrame = (d.animFrame + (Math.abs(d.vx)>0.1?0.2:0.05)) % 4;
  if (d.stamina < d.maxStamina && G.time%60===0) d.stamina = Math.min(d.maxStamina, d.stamina+1);
  if (Math.abs(d.vx) > 0.1) d.happiness = Math.min(100, d.happiness + 0.02);
  else d.happiness = Math.max(0, d.happiness - 0.01);
  p.targetX = d.x - 50;
  p.vx = (p.targetX - p.x) * 0.1;
  p.x += p.vx;
  p.walkFrame += Math.abs(p.vx) * 0.08;
  G.trail.push({ x:d.x, y:d.y+15, life: 30 });
  if (G.trail.length > 40) G.trail.shift();
  G.trail.forEach(t => t.life--);
  G.trail = G.trail.filter(t => t.life > 0);
  const camTarget = d.x - W*0.35;
  G.camera.x += (camTarget - G.camera.x) * 0.08;
  if (G.camera.x < 0) G.camera.x = 0;
  G.distance = Math.floor(G.camera.x / 10);
  G.spawnTimer--;
  if (G.spawnTimer <= 0) {
    spawnEntity();
    G.spawnTimer = 55 + Math.floor(Math.random()*55);
  }
  G.items.forEach(it => {
    if (it.collected) return;
    it.bob += 0.1;
    const dx = d.x - it.x, dy = d.y + 20 - it.y;
    if (Math.sqrt(dx*dx+dy*dy) < 42) {
      it.collected = true;
      if (it.type === 'poop') {
        G.score += 5; G.coins += 2;
        addFloat(it.x, it.y-20, '+5 清理+2💰', '#6bcb77');
        addParticle(it.x, it.y, '#6bcb77', '✨');
        sfx(800, 0.1, 'triangle');
      } else {
        let pts = it.score;
        G.comboCount++; G.comboTimer = 120;
        if (G.comboCount >= 3) {
          pts = Math.floor(pts * (1 + G.comboCount*0.1));
          addFloat(d.x, d.y-80, '🔥 连击 x'+G.comboCount, '#ff6b6b');
        }
        G.score += pts;
        G.coins += Math.floor(pts/5);
        if (it.stamina) d.stamina = Math.min(d.maxStamina, d.stamina + it.stamina);
        d.happiness = Math.min(100, d.happiness + 2);
        addFloat(it.x, it.y-20, '+'+pts+' '+(it.stamina?'⚡+':'')+it.stamina, it.type==='water'?'#4d96ff':'#ffd93d');
        addParticle(it.x, it.y, '#ffd700', it.emoji);
        sfx(900+G.comboCount*30, 0.08, 'square', 0.05);
      }
    }
  });
  G.items = G.items.filter(it => !it.collected && it.x > G.camera.x - 100);
  G.obstacles.forEach(o => {
    const dx = d.x - o.x, dy = d.y + 15 - o.y;
    if (Math.sqrt(dx*dx+dy*dy) < 38) {
      d.stamina = Math.max(0, d.stamina - o.damage);
      d.happiness = Math.max(0, d.happiness - o.damage*0.5);
      G.score = Math.max(0, G.score - Math.floor(o.damage/2));
      G.comboCount = 0;
      addFloat(d.x, d.y-50, '-'+o.damage+'⚡', '#ff4444');
      addParticle(d.x, d.y, '#ff4444', '💥');
      sfx(150, 0.2, 'sawtooth', 0.06);
      o.x = -99999;
      if (d.stamina <= 0) endWalk();
    }
  });
  G.obstacles = G.obstacles.filter(o => o.x > G.camera.x - 100);
  G.clouds.forEach(c => { c.x += c.s * 0.3; if (c.x > G.camera.x + W + 200) c.x = G.camera.x - 200; });
  if (G.comboTimer > 0) G.comboTimer--;
  else G.comboCount = 0;
  for (let i=G.floatTexts.length-1;i>=0;i--) {
    G.floatTexts[i].y += G.floatTexts[i].vy;
    G.floatTexts[i].life--;
    if (G.floatTexts[i].life<=0) G.floatTexts.splice(i,1);
  }
  for (let i=G.particles.length-1;i>=0;i--) {
    const pt = G.particles[i];
    pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.08; pt.life--;
    if (pt.life<=0) G.particles.splice(i,1);
  }
  if (G.happiness < 20 || G.distance >= 3000) endWalk();
}

function endWalk() {
  if (G.gameOver) return;
  G.gameOver = true;
  G.walks++;
  G.walkCount++;
  G.totalCoins += G.coins;
  G.highScore = Math.max(G.highScore, G.score);
  tryUnlock();
  saveProgress();
  sfx(500, 0.4, 'sine');
}

function tryUnlock() {
  const left = [];
  for (let i=0;i<DOG_BREEDS.length;i++) if (G.unlocked.indexOf(i)===-1) left.push(i);
  if (left.length === 0) return;
  const need = [0,0,0,0, 200, 500, 800, 1200, 1800, 2500, 3500, 5000];
  left.forEach(i => {
    if (G.totalCoins >= need[i] && G.unlocked.indexOf(i) === -1) {
      G.unlocked.push(i);
      addFloat(W/2, 200, '🎉 解锁: '+DOG_BREEDS[i].name, '#ffd700');
    }
  });
}

function drawBackground() {
  const sky = ctx.createLinearGradient(0,0,0,500);
  if (G.weather === 'rain') {
    sky.addColorStop(0, '#5d6d7e');
    sky.addColorStop(1, '#85929e');
  } else {
    sky.addColorStop(0, '#87ceeb');
    sky.addColorStop(1, '#d4effc');
  }
  ctx.fillStyle = sky;
  ctx.fillRect(0,0,W,520);
  if (G.weather !== 'rain') {
    ctx.fillStyle = '#ffd93d';
    ctx.beginPath(); ctx.arc(780, 90, 45, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 0.3;
    ctx.beginPath(); ctx.arc(780, 90, 65, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.save();
  ctx.translate(-G.camera.x*0.2, 0);
  G.clouds.forEach(c => {
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    const sz = 35*c.s;
    ctx.beginPath();
    ctx.arc(c.x, c.y, sz, 0, Math.PI*2);
    ctx.arc(c.x+sz, c.y+5, sz*0.8, 0, Math.PI*2);
    ctx.arc(c.x-sz, c.y+5, sz*0.7, 0, Math.PI*2);
    ctx.arc(c.x+sz*0.5, c.y-sz*0.4, sz*0.6, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.restore();
  ctx.save();
  ctx.translate(-G.camera.x*0.4, 0);
  ctx.fillStyle = '#a3d977';
  ctx.beginPath();
  ctx.moveTo(-20, 500);
  for (let x=-20; x<=W+G.camera.x+100; x+=40) {
    ctx.lineTo(x, 420 + Math.sin(x*0.01)*25 + Math.sin(x*0.03)*15);
  }
  ctx.lineTo(W+G.camera.x+100, 500);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.translate(-G.camera.x*0.7, 0);
  ctx.fillStyle = '#7dcea0';
  ctx.beginPath();
  ctx.moveTo(-20, 520);
  for (let x=-20; x<=W+G.camera.x+100; x+=30) {
    ctx.lineTo(x, 450 + Math.sin(x*0.02+1)*20 + Math.sin(x*0.05)*10);
  }
  ctx.lineTo(W+G.camera.x+100, 520);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.translate(-G.camera.x, 0);
  G.trees.forEach(t => {
    ctx.fillStyle = '#6d4c2a';
    ctx.fillRect(t.x-8, t.y, 16, 130*t.s);
    ctx.fillStyle = '#2e7d32';
    ctx.beginPath(); ctx.arc(t.x, t.y-10, 45*t.s, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#388e3c';
    ctx.beginPath(); ctx.arc(t.x-15, t.y+10, 30*t.s, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(t.x+15, t.y+5, 32*t.s, 0, Math.PI*2); ctx.fill();
  });
  G.flowers.forEach(f => {
    ctx.fillStyle = f.c;
    for (let i=0;i<5;i++) {
      const a = (i/5)*Math.PI*2;
      ctx.beginPath(); ctx.arc(f.x+Math.cos(a)*4, f.y+Math.sin(a)*4, 3.5, 0, Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = '#ffd93d';
    ctx.beginPath(); ctx.arc(f.x, f.y, 2.5, 0, Math.PI*2); ctx.fill();
  });
  ctx.fillStyle = '#58d68d';
  ctx.fillRect(-G.camera.x, 500, W*3, H-500);
  ctx.fillStyle = '#48c97d';
  for (let x=-G.camera.x%50; x<W; x+=50) {
    ctx.fillRect(x, 500, 1, H-500);
  }
  ctx.fillStyle = 'rgba(139,90,43,0.6)';
  ctx.fillRect(-G.camera.x, 555, W*3, 3);
  if (G.weather === 'rain') {
    ctx.strokeStyle = 'rgba(150,200,255,0.5)';
    ctx.lineWidth = 1;
    for (let i=0;i<80;i++) {
      const rx = (i*73 + G.time*8) % W;
      const ry = ((i*137 + G.time*14) % 500);
      ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(rx-3, ry+12); ctx.stroke();
    }
  }
  ctx.restore();
}

function drawTrail() {
  ctx.save();
  ctx.translate(-G.camera.x, 0);
  G.trail.forEach(t => {
    ctx.globalAlpha = (t.life/30)*0.3;
    ctx.fillStyle = '#c9a66b';
    ctx.beginPath(); ctx.arc(t.x, t.y, 5, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawDog() {
  const d = G.dog;
  const breed = DOG_BREEDS[d.breedIdx];
  ctx.save();
  ctx.translate(d.x - G.camera.x, d.y + d.bounce);
  ctx.scale(d.facing, 1);
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(0, 35, 30, 5, 0, 0, Math.PI*2); ctx.fill();
  const size = 34;
  const legOff = Math.sin(d.animFrame*Math.PI)*4;
  ctx.fillStyle = breed.color;
  ctx.fillRect(-size*0.7, 10, size*0.25, 22-legOff);
  ctx.fillRect(size*0.45, 10, size*0.25, 22+legOff);
  ctx.beginPath();
  ctx.ellipse(0, -5, size*0.9, size*0.55, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(size*0.65, -size*0.35, size*0.55, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = breed.color;
  ctx.beginPath();
  ctx.ellipse(size*0.35, -size*0.7, size*0.22, size*0.3, -0.4, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(size*0.85, -size*0.65, size*0.2, size*0.28, 0.3, 0, Math.PI*2);
  ctx.fill();
  ctx.font = (size*1.3)+'px Arial';
  ctx.textAlign = 'center';
  ctx.fillText(breed.emoji, size*0.55, 5);
  ctx.strokeStyle = breed.color;
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-size*0.8, -size*0.2);
  const wag = Math.sin(G.time*0.4)*8;
  ctx.quadraticCurveTo(-size*1.2, -size*0.6+wag, -size*1.1, -size*0.9+wag);
  ctx.stroke();
  ctx.restore();
  if (d.stamina < 25) {
    ctx.font = '20px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(d.stamina < 10 ? '😵' : '🥵', d.x - G.camera.x, d.y - 55 + d.bounce);
  }
}

function drawPlayer() {
  const p = G.player;
  ctx.save();
  ctx.translate(p.x - G.camera.x, p.y + Math.sin(p.walkFrame)*2);
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(0, 30, 20, 4, 0, 0, Math.PI*2); ctx.fill();
  const bob = Math.abs(p.vx)>0.3 ? Math.sin(p.walkFrame*2)*3 : 0;
  ctx.translate(0, bob);
  ctx.fillStyle = '#3498db';
  ctx.fillRect(-12, -5, 24, 30);
  ctx.fillStyle = '#f5cba7';
  ctx.beginPath(); ctx.arc(0, -18, 13, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#5d4037';
  ctx.beginPath(); ctx.arc(0, -24, 11, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#2c3e50';
  const legSwing = Math.sin(p.walkFrame*2)*5;
  ctx.fillRect(-10, 22, 8, 14+legSwing);
  ctx.fillRect(2, 22, 8, 14-legSwing);
  ctx.strokeStyle = '#6d4c2a';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(10, 5);
  ctx.lineTo(40, -10);
  ctx.stroke();
  ctx.restore();
}

function drawEntities() {
  ctx.save();
  ctx.translate(-G.camera.x, 0);
  G.items.forEach(it => {
    if (it.collected) return;
    const by = Math.sin(it.bob)*5;
    ctx.save();
    ctx.translate(it.x, it.y + by);
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = it.type==='poop' ? '#6d4c2a' : it.type==='water' ? '#4d96ff' : '#ffd93d';
    ctx.beginPath(); ctx.ellipse(0, 25, 18, 4, 0, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.font = '32px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(it.emoji, 0, 10);
    ctx.restore();
  });
  G.obstacles.forEach(o => {
    ctx.save();
    ctx.translate(o.x, o.y);
    ctx.font = o.type==='pit' ? '50px Arial' : '40px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(o.emoji, 0, o.type==='pit' ? 0 : 12);
    ctx.restore();
  });
  ctx.restore();
}

function drawHUD() {
  ctx.fillStyle = 'rgba(20,40,60,0.75)';
  ctx.beginPath(); ctx.roundRect(10, 10, 320, 110, 10); ctx.fill();
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 16px "Microsoft YaHei"';
  ctx.textAlign = 'left';
  ctx.fillText('🏆 分数: '+G.score, 24, 35);
  ctx.fillStyle = '#87ceeb';
  ctx.fillText('📍 距离: '+G.distance+'m', 160, 35);
  ctx.fillStyle = '#f39c12';
  ctx.fillText('💰 本局: '+G.coins+' | 总: '+G.totalCoins, 24, 56);
  ctx.fillStyle = '#aaa';
  ctx.font = '11px "Microsoft YaHei"';
  ctx.fillText('最高: '+G.highScore+' | 散步次数: '+G.walks, 24, 74);
  if (G.comboCount >= 2) {
    ctx.fillStyle = '#ff6b6b';
    ctx.font = 'bold 14px "Microsoft YaHei"';
    ctx.fillText('🔥 连击 x'+G.comboCount, 24, 95);
  }
  const d = G.dog;
  ctx.fillStyle = 'rgba(20,40,60,0.75)';
  ctx.beginPath(); ctx.roundRect(W-280, 10, 270, 110, 10); ctx.fill();
  const breed = DOG_BREEDS[d.breedIdx];
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px "Microsoft YaHei"';
  ctx.textAlign = 'left';
  ctx.fillText(breed.emoji+' '+breed.name+' | '+breed.desc, W-268, 33);
  function bar(x,y,w,v,m,c,l,ic) {
    ctx.fillStyle = '#222'; ctx.fillRect(x,y,w,12);
    ctx.fillStyle = c; ctx.fillRect(x,y,w*(v/m),12);
    ctx.fillStyle = '#fff'; ctx.font = '10px Arial';
    ctx.fillText(ic+' '+l+':'+Math.floor(v), x+4, y+10);
  }
  bar(W-268, 46, 246, d.stamina, d.maxStamina, '#2ecc71', '体力', '⚡');
  bar(W-268, 64, 246, d.happiness, 100, '#ff6b9d', '心情', '💖');
  bar(W-268, 82, 246, d.speed*20, 100, '#3498db', '速度', '🏃');
  bar(W-268, 100, 246, G.distance, 3000, '#9b59b6', '进度', '📍');
  ctx.fillStyle = 'rgba(20,40,60,0.75)';
  ctx.beginPath(); ctx.roundRect(W/2-100, 10, 200, 40, 10); ctx.fill();
  ctx.fillStyle = G.weather==='rain' ? '#87ceeb' : '#ffd93d';
  ctx.font = 'bold 14px "Microsoft YaHei"';
  ctx.textAlign = 'center';
  ctx.fillText((G.weather==='rain'?'🌧️ 雨天散步':'☀️ 好天气')+' | 图鉴[B]', W/2, 36);
  const btns = [
    { x:10, y:H-65, w:110, h:55, ic:'⏸', n:'暂停', k:'ESC/P', c:'#555' },
    { x:130, y:H-65, w:110, h:55, ic:'📖', n:'图鉴', k:'B', c:'#e67e22' },
    { x:W-240, y:H-65, w:110, h:55, ic:'🏠', n:'结束', k:'E', c:'#c0392b' },
    { x:W-120, y:H-65, w:110, h:55, ic:'🔄', n:'重来', k:'R', c:'#27ae60' },
  ];
  btns.forEach(b => {
    ctx.fillStyle = b.c;
    ctx.beginPath(); ctx.roundRect(b.x,b.y,b.w,b.h,10); ctx.fill();
    ctx.font = '22px Arial'; ctx.textAlign='center'; ctx.fillStyle='#fff';
    ctx.fillText(b.ic, b.x+28, b.y+36);
    ctx.font = 'bold 12px "Microsoft YaHei"';
    ctx.fillText(b.n, b.x+b.w/2+15, b.y+24);
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.font = '10px "Microsoft YaHei"';
    ctx.fillText(b.k, b.x+b.w/2+15, b.y+44);
  });
  G._btns = btns;
}

function drawEffects() {
  ctx.save();
  ctx.translate(-G.camera.x, 0);
  G.particles.forEach(p => {
    ctx.globalAlpha = p.life/40;
    ctx.fillStyle = p.c;
    ctx.font = '16px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(p.t, p.x, p.y);
  });
  ctx.globalAlpha = 1;
  G.floatTexts.forEach(f => {
    ctx.globalAlpha = Math.min(1, f.life/30);
    ctx.fillStyle = f.c;
    ctx.font = 'bold 16px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.fillText(f.t, f.x, f.y);
  });
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawGameOver() {
  if (!G.gameOver) return;
  ctx.fillStyle = 'rgba(15,25,35,0.85)';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 44px "Microsoft YaHei"';
  ctx.textAlign = 'center';
  ctx.fillText('🐕 散步结束！', W/2, 150);
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.beginPath(); ctx.roundRect(W/2-200, 190, 400, 280, 16); ctx.fill();
  ctx.strokeStyle = '#6ab8d0'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(W/2-200, 190, 400, 280, 16); ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 20px "Microsoft YaHei"';
  ctx.fillText('🏆 分数: '+G.score+'  |  📏 距离: '+G.distance+'m', W/2, 240);
  ctx.fillStyle = '#ffd700';
  ctx.fillText('💰 获得金币: +'+G.coins, W/2, 275);
  ctx.fillStyle = '#87ceeb';
  ctx.fillText('💖 狗狗心情: '+Math.floor(G.dog.happiness)+'  |  ⚡ 体力: '+Math.floor(G.dog.stamina), W/2, 305);
  ctx.fillStyle = '#aaa';
  ctx.fillText('📖 已解锁品种: '+G.unlocked.length+'/'+DOG_BREEDS.length, W/2, 340);
  ctx.fillStyle = '#6bcb77';
  ctx.fillText('🏅 历史最高: '+G.highScore+'  |  累计散步: '+G.walks+'次', W/2, 370);
  if (G.score === G.highScore && G.score > 0) {
    ctx.fillStyle = '#ff6b6b';
    ctx.font = 'bold 22px "Microsoft YaHei"';
    ctx.fillText('🎉 新纪录！', W/2, 405);
  }
  ctx.fillStyle = '#f39c12';
  ctx.beginPath(); ctx.roundRect(W/2-110, 430, 220, 55, 12); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 20px "Microsoft YaHei"';
  ctx.fillText('🔄 再遛一次 (R)', W/2, 465);
  G._restartBtn = { x:W/2-110, y:430, w:220, h:55 };
}

function render() {
  if (gameState === STATE_MENU) { ctx.fillStyle = '#123'; ctx.fillRect(0,0,W,H); return; }
  drawBackground();
  drawTrail();
  drawEntities();
  drawDog();
  drawPlayer();
  drawEffects();
  drawHUD();
  if (G.gameOver) drawGameOver();
  if (G.paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 48px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.fillText('⏸ 暂停中', W/2, H/2-30);
    ctx.fillStyle = '#fff';
    ctx.font = '18px "Microsoft YaHei"';
    ctx.fillText('按 ESC / P 继续', W/2, H/2+20);
  }
}

function handleAction(action) {
  if (action === '暂停') { G.paused = !G.paused; sfx(500,0.08); }
  else if (action === '图鉴') { gameState = STATE_DOGBOOK; showDogBook(); sfx(600,0.1); }
  else if (action === '结束') { if (!G.gameOver) endWalk(); }
  else if (action === '重来') { restartGame(); }
}

function restartGame() {
  initGame(selectedDogIdx);
  sfx(800, 0.2, 'sine');
}

function showDogBook() {
  const panel = document.getElementById('dog-panel');
  panel.style.display = 'flex';
  const grid = document.getElementById('dogGrid');
  grid.innerHTML = '';
  DOG_BREEDS.forEach((b, i) => {
    const unlocked = G.unlocked.indexOf(i) !== -1;
    const need = [0,0,0,0,200,500,800,1200,1800,2500,3500,5000][i];
    const el = document.createElement('div');
    el.className = 'dg-item ' + (unlocked ? 'unlocked' : 'locked');
    el.innerHTML = '<div class="dg-emoji">'+(unlocked?b.emoji:'🔒')+'</div>'+
      '<div class="dg-name">'+(unlocked?b.name:'???')+'</div>'+
      '<div class="dg-stats">'+(unlocked ? ('速度'+b.speed+' 跳'+b.jump+' 体'+b.stamina) : ('累计'+need+'💰解锁'))+'</div>';
    grid.appendChild(el);
  });
}

function clickCanvas(pos) {
  if (gameState === STATE_MENU) return;
  if (G.gameOver) {
    const r = G._restartBtn;
    if (r && pos.x>=r.x&&pos.x<=r.x+r.w&&pos.y>=r.y&&pos.y<=r.y+r.h) restartGame();
    return;
  }
  if (G.paused) { G.paused = false; return; }
  (G._btns||[]).forEach(b => {
    if (pos.x>=b.x&&pos.x<=b.x+b.w&&pos.y>=b.y&&pos.y<=b.y+b.h) handleAction(b.n);
  });
  if (gameState === STATE_WALKING) {
    const d = G.dog;
    if (pos.y < H*0.5) {
      if (d.onGround && d.stamina >= 10) {
        d.vy = -d.jumpPower;
        d.onGround = false;
        d.stamina -= 8;
        sfx(650,0.15,'square',0.05);
      }
    } else {
      const dir = pos.x < W/2 ? -1 : 1;
      G.keys['ArrowRight'] = dir > 0;
      G.keys['ArrowLeft'] = dir < 0;
      setTimeout(() => { G.keys['ArrowRight']=false; G.keys['ArrowLeft']=false; }, 300);
    }
  }
}

function getPos(e) {
  const r = canvas.getBoundingClientRect();
  const sx = W/r.width, sy = H/r.height;
  const cx = e.touches ? e.touches[0].clientX : (e.changedTouches ? e.changedTouches[0].clientX : e.clientX);
  const cy = e.touches ? e.touches[0].clientY : (e.changedTouches ? e.changedTouches[0].clientY : e.clientY);
  return { x:(cx-r.left)*sx, y:(cy-r.top)*sy };
}

canvas.addEventListener('click', e => clickCanvas(getPos(e)));
canvas.addEventListener('touchend', e => {
  if (e.changedTouches) clickCanvas({ ...getPos(e) });
}, { passive: true });

let touchStartX = null, touchStartY = null;
canvas.addEventListener('touchstart', e => {
  if (e.touches && e.touches[0]) {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }
}, { passive: true });
canvas.addEventListener('touchmove', e => {
  if (touchStartX !== null && e.touches && e.touches[0]) {
    const dx = e.touches[0].clientX - touchStartX;
    G.keys['ArrowRight'] = dx > 20;
    G.keys['ArrowLeft'] = dx < -20;
  }
}, { passive: true });

document.addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].indexOf(e.key)>=0) e.preventDefault();
  G.keys[e.key] = true;
  if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
    if (gameState === STATE_WALKING) { G.paused = !G.paused; sfx(500,0.08); }
    else if (gameState === STATE_DOGBOOK) { document.getElementById('dog-panel').style.display='none'; gameState = STATE_WALKING; }
  }
  if (e.key === 'b' || e.key === 'B') {
    if (gameState === STATE_WALKING) { gameState = STATE_DOGBOOK; showDogBook(); sfx(600,0.1); }
  }
  if ((e.key === 'r' || e.key === 'R') && G.gameOver) restartGame();
  if ((e.key === 'e' || e.key === 'E') && !G.gameOver && gameState === STATE_WALKING) endWalk();
});
document.addEventListener('keyup', e => { G.keys[e.key] = false; });

document.querySelectorAll('.dog-card').forEach(card => {
  card.addEventListener('click', () => {
    document.querySelectorAll('.dog-card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    selectedDogIdx = parseInt(card.dataset.dog);
    sfx(550,0.08);
  });
});

document.getElementById('start-game-btn').addEventListener('click', () => {
  try { audioCtx.resume(); } catch(e){}
  document.getElementById('startScreen').style.display = 'none';
  initGame(selectedDogIdx);
  sfx(800,0.3,'sine');
});

document.getElementById('closeDogPanel').addEventListener('click', () => {
  document.getElementById('dog-panel').style.display = 'none';
  gameState = STATE_WALKING;
});

let stepTimer = 0;
function step() {
  updateGame();
  render();
  stepTimer = setTimeout(step, 16);
}
step();

window.addEventListener('beforeunload', saveProgress);
setInterval(saveProgress, 20000);

GameCore.init({ touch: false });
</script>

        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {

  window.batchResizeCanvas = batchResizeCanvas;

<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
