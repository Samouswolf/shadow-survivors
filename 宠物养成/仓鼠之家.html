<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仓鼠之家</title>
<script src="../game_core.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: linear-gradient(135deg, #fff5e6 0%, #ffe4c4 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; font-family: "Microsoft YaHei", sans-serif; }
#gameContainer { position: relative; }
canvas { border: 4px solid #c68642; border-radius: 18px; box-shadow: 0 8px 30px rgba(198,134,66,0.35); display: block; max-width: 100%; height: auto; cursor: pointer; }
#startScreen { position: fixed; inset: 0; background: rgba(100,60,20,0.92); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
#startScreen h1 { font-size: 54px; color: #ffd28a; margin-bottom: 14px; text-shadow: 3px 3px 0 rgba(0,0,0,0.3); }
#startScreen .sub { color: #f5deb3; font-size: 17px; margin-bottom: 32px; }
.ham-row { display: flex; gap: 14px; margin-bottom: 28px; flex-wrap: wrap; justify-content: center; padding: 0 18px; }
.ham-card { background: rgba(255,220,170,0.08); border: 2px solid #d2a679; border-radius: 14px; padding: 16px 12px; text-align: center; width: 118px; cursor: pointer; transition: 0.25s; }
.ham-card:hover { background: rgba(255,220,170,0.2); transform: translateY(-3px); }
.ham-card.selected { border-color: #ffd700; box-shadow: 0 0 18px rgba(255,215,0,0.6); background: rgba(255,215,0,0.1); }
.ham-emoji { font-size: 42px; margin-bottom: 4px; }
.ham-name { color: #fff; font-size: 14px; font-weight: bold; margin-bottom: 3px; }
.ham-desc { color: #deb887; font-size: 11px; }
#start-game-btn { padding: 14px 50px; font-size: 20px; background: linear-gradient(135deg, #e67e22 0%, #d35400 100%); color: #fff; border: none; border-radius: 26px; font-weight: bold; cursor: pointer; box-shadow: 0 5px 20px rgba(211,84,0,0.4); }
.help-tip { color: #deb887; font-size: 12px; line-height: 1.8; margin-top: 22px; max-width: 400px; text-align: center; background: rgba(0,0,0,0.2); padding: 12px 18px; border-radius: 10px; }
#collection-layer { position: fixed; inset: 0; background: rgba(60,40,10,0.96); z-index: 500; display: none; flex-direction: column; align-items: center; padding: 20px; overflow-y: auto; }
#collection-layer h2 { color: #ffd700; font-size: 32px; margin: 14px 0 18px; }
.cage-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; max-width: 640px; width: 100%; padding: 8px; }
.ci { background: rgba(255,220,170,0.06); border: 2px solid rgba(210,166,121,0.35); border-radius: 12px; padding: 12px 8px; text-align: center; }
.ci.locked { opacity: 0.35; filter: grayscale(70%); }
.ci.unlocked { border-color: #d2a679; }
.ci-emoji { font-size: 38px; margin-bottom: 3px; }
.ci-n { color: #fff; font-size: 13px; font-weight: bold; }
.ci-s { color: #c9a66b; font-size: 10px; margin-top: 2px; }
.btn-close { margin-top: 20px; padding: 10px 28px; background: #d35400; color: #fff; border: none; border-radius: 18px; cursor: pointer; font-size: 15px; font-weight: bold; }
/* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */
/* [BATCH-FIX:ad-components-css] */
.sponsor-btn{position:fixed;top:44px;right:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:3px 9px;border-radius:10px;font:11px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.sponsor-panel.show{display:flex}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.interstitial-ad.show{display:flex}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* [/BATCH-FIX:ad-components-css] */
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="gameCanvas" width="900" height="640"></canvas>
</div>
<div id="startScreen">
  <h1>🐹 仓鼠之家 🏠</h1>
  <div class="sub">布置仓鼠笼，照顾小仓鼠，收集装饰家具！</div>
  <div class="ham-row" id="hamSelect">
    <div class="ham-card selected" data-h="0"><div class="ham-emoji">🐹</div><div class="ham-name">金丝熊</div><div class="ham-desc">活泼好动</div></div>
    <div class="ham-card" data-h="1"><div class="ham-emoji">🐹</div><div class="ham-name">银狐</div><div class="ham-desc">乖巧可爱</div></div>
    <div class="ham-card" data-h="2"><div class="ham-emoji">🐹</div><div class="ham-name">紫仓</div><div class="ham-desc">安静温和</div></div>
    <div class="ham-card" data-h="3"><div class="ham-emoji">🐹</div><div class="ham-name">布丁</div><div class="ham-desc">贪吃贪睡</div></div>
  </div>
  <button id="start-game-btn">入住仓鼠！</button>
  <div class="help-tip">
    🎮 操作：鼠标点击 / 触屏点击<br>
    🍎 喂食、💧 喂水、🛏️ 让它睡觉、🎡 滚轮运动<br>
    ⌨️ 1-6: 快捷操作 ｜ C: 图鉴 ｜ ESC: 菜单
  </div>
</div>
<div id="collection-layer">
  <h2>🏺 家具图鉴</h2>
  <div class="cage-grid" id="cageGrid"></div>
  <button class="btn-close" id="closeCollect">关闭图鉴</button>
</div>

<script>
const STATE_MENU = 0;
const STATE_CARE = 1;
const STATE_SHOP = 2;
const STATE_COLLECTION = 3;

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = 900, H = 640;

if (!ctx.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r) {
    r = Math.min(r, w/2, h/2);
    this.beginPath();
    this.moveTo(x+r,y); this.arcTo(x+w,y,x+w,y+h,r);
    this.arcTo(x+w,y+h,x,y+h,r); this.arcTo(x,y+h,x,y,r);
    this.arcTo(x,y,x+w,y,r); this.closePath();
  };
}

const audioCtx = new (window.AudioContext||window.webkitAudioContext)();
function sfx(f,d,t,v) {
  try {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = t||'sine'; o.frequency.value = f;
    g.gain.setValueAtTime((v||0.06), audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+d);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+d);
  } catch(e){}
}

const HAMSTERS = [
  { name:'金丝熊', fur:'#f4c27e', belly:'#fff0dc', eye:'#3d2314', trait:'活泼', base: { hunger:70, thirst:70, energy:85, happy:80 } },
  { name:'银狐', fur:'#e8e8e8', belly:'#ffffff', eye:'#2a2a2a', trait:'乖巧', base: { hunger:75, thirst:75, energy:80, happy:82 } },
  { name:'紫仓', fur:'#c9a7dc', belly:'#f0e4fa', eye:'#4a2e5a', trait:'安静', base: { hunger:72, thirst:72, energy:75, happy:85 } },
  { name:'布丁', fur:'#ffeaa7', belly:'#fff9e6', eye:'#5d4e37', trait:'贪吃', base: { hunger:55, thirst:70, energy:90, happy:78 } },
  { name:'三线', fur:'#a0826d', belly:'#f5e6d3', eye:'#3d2b1f', trait:'机敏', base: { hunger:68, thirst:70, energy:88, happy:75 } },
  { name:'奶茶', fur:'#d4b896', belly:'#f2e3cf', eye:'#4d3a2a', trait:'温顺', base: { hunger:74, thirst:74, energy:78, happy:83 } },
  { name:'花仓', fur:'#e5a46a', belly:'#fff3e0', eye:'#3a2514', trait:'好奇', base: { hunger:65, thirst:68, energy:92, happy:80 } },
  { name:'琥珀', fur:'#e6b06b', belly:'#fef1dc', eye:'#5a3a1e', trait:'憨厚', base: { hunger:60, thirst:72, energy:82, happy:86 } },
];

const FURNITURES = [
  { id:'wheel', name:'跑轮', emoji:'🎡', price:0, size:[100,110], desc:'仓鼠最爱，消耗精力' },
  { id:'house', name:'小木屋', emoji:'🏠', price:0, size:[90,80], desc:'睡觉休息恢复体力' },
  { id:'bowl', name:'食盆', emoji:'🥣', price:0, size:[50,30], desc:'放粮食喂仓鼠' },
  { id:'bottle', name:'水壶', emoji:'🍼', price:0, size:[30,70], desc:'自动喂水' },
  { id:'tube', name:'隧道', emoji:'🧻', price:50, size:[110,55], desc:'藏起来玩，增加快乐' },
  { id:'platform', name:'平台', emoji:'🪵', price:80, size:[120,25], desc:'登高望远，探索乐趣' },
  { id:'swing', name:'秋千', emoji:'🎠', price:120, size:[70,90], desc:'荡秋千，快乐满满' },
  { id:'sandbox', name:'沙浴盆', emoji:'🛁', price:90, size:[90,45], desc:'洗澡清洁，保持健康' },
  { id:'hammock', name:'吊床', emoji:'🛏️', price:150, size:[100,45], desc:'舒服休憩，精力恢复快' },
  { id:'ball', name:'跑球', emoji:'⚽', price:180, size:[70,70], desc:'到处探索，超级快乐' },
  { id:'ladder', name:'爬梯', emoji:'🪜', price:60, size:[35,100], desc:'锻炼攀爬能力' },
  { id:'maze', name:'迷宫', emoji:'🧩', price:250, size:[130,90], desc:'消耗精力，智力提升' },
  { id:'nest', name:'棉花窝', emoji:'☁️', price:70, size:[80,55], desc:'温暖舒适，睡觉质量+50%' },
  { id:'tree', name:'小树枝', emoji:'🌿', price:40, size:[45,90], desc:'磨牙啃咬，牙齿健康' },
  { id:'tower', name:'瞭望塔', emoji:'🗼', price:220, size:[70,130], desc:'站得高看得远' },
];

const FOODS = [
  { n:'葵花籽', e:'🌻', p:3, h:12, t:0, hp:3 },
  { n:'小米', e:'🌾', p:5, h:20, t:0, hp:2 },
  { n:'胡萝卜', e:'🥕', p:4, h:15, t:5, hp:5 },
  { n:'苹果块', e:'🍎', p:6, h:12, t:10, hp:8 },
  { n:'面包虫', e:'🐛', p:10, h:30, t:0, hp:15 },
  { n:'奶酪', e:'🧀', p:8, h:22, t:0, hp:10 },
];

let gameState = STATE_MENU;
let selHam = 0;
let G = {};

function initGame(hi) {
  const base = HAMSTERS[hi].base;
  G = {
    hamster: {
      typeIdx: hi,
      x: 450, y: 380, tx: 450, ty: 380,
      hunger: base.hunger, thirst: base.thirst, energy: base.energy, happy: base.happy,
      clean: 85, weight: 35, intel: 1,
      facing: 1, bounce: 0, anim: 'idle', animT: 0,
      inFurniture: null, insideT: 0,
      speed: 1.6, dayAge: 0, exp: 0,
    },
    coins: 80,
    totalCoins: Storage.load('hamHome_total', 0),
    highHappy: Storage.load('hamHome_highHappy', 0),
    unlocked: Storage.load('hamHome_unlocked', [0,1,2,3,4,5,6,7]),
    furnitureUnlocked: Storage.load('hamHome_fur', ['wheel','house','bowl','bottle']),
    ownedFurniture: Storage.load('hamHome_owned', { wheel:{x:700,y:370}, house:{x:120,y:410}, bowl:{x:300,y:470}, bottle:{x:500,y:350} }),
    placed: [],
    day: 1, dayT: 0, dayL: 1800,
    time: 0,
    particles: [], floats: [],
    bowlFood: 30, bottleWater: 60,
    shopItems: [], selFurn: null, dragging: null,
    selectedTool: null,
    actions: [
      {k:'feed',n:'喂食',ic:'🍎',x:20,y:560,w:110,h:65,c:'#e67e22'},
      {k:'water',n:'喂水',ic:'💧',x:140,y:560,w:110,h:65,c:'#3498db'},
      {k:'pet',n:'抚摸',ic:'✋',x:260,y:560,w:110,h:65,c:'#e84393'},
      {k:'play',n:'玩耍',ic:'🎾',x:380,y:560,w:110,h:65,c:'#27ae60'},
      {k:'clean',n:'清洁',ic:'🧹',x:500,y:560,w:110,h:65,c:'#8e44ad'},
      {k:'sleep',n:'睡觉',ic:'💤',x:620,y:560,w:110,h:65,c:'#5d6d7e'},
      {k:'shop',n:'商店',ic:'🛒',x:740,y:560,w:140,h:30,c:'#c0392b'},
      {k:'book',n:'图鉴',ic:'📖',x:740,y:595,w:140,h:30,c:'#7d3c98'},
    ],
    cooldowns: { feed:0, water:0, pet:0, play:0, clean:0, sleep:0 },
    weather: Math.random()<0.2 ? 'rain' : (Math.random()<0.3 ? 'night' : 'sunny'),
  };
  rebuildPlaced();
  gameState = STATE_CARE;
}

function rebuildPlaced() {
  G.placed = [];
  for (let k in G.ownedFurniture) {
    const f = FURNITURES.find(x=>x.id===k);
    if (f) G.placed.push({ ...f, ...G.ownedFurniture[k], id:k });
  }
}

function saveGame() {
  Storage.save('hamHome_total', G.totalCoins);
  Storage.save('hamHome_highHappy', G.highHappy);
  Storage.save('hamHome_unlocked', G.unlocked);
  Storage.save('hamHome_fur', G.furnitureUnlocked);
  Storage.save('hamHome_owned', G.ownedFurniture);
}

function addF(x,y,c,t,vy) { G.particles.push({x,y,vx:(Math.random()-0.5)*2,vy:vy||-2,life:45,c,t}); }
function addFt(x,y,t,c) { G.floats.push({x,y,t,c:c||'#fff',life:55,vy:-1}); }

function updateHamster() {
  const h = G.hamster;
  G.time++;
  G.dayT++;
  if (G.dayT >= G.dayL) {
    G.dayT = 0; G.day++;
    G.coins += 15 + Math.floor(h.happy/8);
    G.totalCoins += G.coins;
    G.highHappy = Math.max(G.highHappy, Math.floor(h.happy));
    addFt(W/2, 100, '☀️ 第'+G.day+'天 +'+(15+Math.floor(h.happy/8))+'💰', '#ffd700');
    tryUnlockHam();
    saveGame();
  }
  if (G.time % 90 === 0) {
    h.hunger = Math.max(0, h.hunger - 1);
    h.thirst = Math.max(0, h.thirst - 1.2);
    if (h.inFurniture !== 'house' && h.inFurniture !== 'nest' && h.inFurniture !== 'hammock')
      h.energy = Math.max(0, h.energy - 0.4);
    if (h.inFurniture !== 'sandbox')
      h.clean = Math.max(0, h.clean - 0.3);
    if (h.hunger<25 || h.thirst<25 || h.clean<25 || h.energy<15)
      h.happy = Math.max(0, h.happy - 0.6);
    else if (h.happy < 95) h.happy = Math.min(100, h.happy + 0.1);
  }
  if (G.bowlFood>0 && h.hunger<70 && G.time%150===0 && !h.inFurniture) {
    const bowl = G.placed.find(p=>p.id==='bowl');
    if (bowl && Math.abs(h.x-bowl.x)<80) {
      G.bowlFood--;
      h.hunger = Math.min(100, h.hunger + 8);
      addF(h.x,h.y-20,'#e67e22','😋');
    }
  }
  if (G.bottleWater>0 && h.thirst<70 && G.time%120===0 && !h.inFurniture) {
    const bot = G.placed.find(p=>p.id==='bottle');
    if (bot && Math.abs(h.x-bot.x)<70) {
      G.bottleWater--;
      h.thirst = Math.min(100, h.thirst + 6);
      addF(h.x,h.y-20,'#3498db','💧');
    }
  }
  for (let k in G.cooldowns) G.cooldowns[k] = Math.max(0, G.cooldowns[k]-1);
  if (!h.inFurniture && G.time % 160 === 0) {
    const targets = [];
    G.placed.forEach(p => {
      if (['wheel','tube','swing','sandbox','ball','maze','tower','platform'].indexOf(p.id)>=0) {
        if (p.id==='wheel' && h.energy>35) targets.push({x:p.x, y:p.y+20, enter:p.id});
        if (p.id==='tube' && h.happy<80) targets.push({x:p.x, y:p.y, enter:p.id});
        if (p.id==='sandbox' && h.clean<60) targets.push({x:p.x, y:p.y+10, enter:p.id});
        if (p.id==='house' && h.energy<50) targets.push({x:p.x, y:p.y, enter:p.id});
        if (p.id==='nest' && h.energy<60) targets.push({x:p.x, y:p.y, enter:p.id});
        if (p.id==='hammock' && h.energy<55) targets.push({x:p.x, y:p.y, enter:p.id});
      }
    });
    if (targets.length>0 && Math.random()<0.6) {
      const t = targets[Math.floor(Math.random()*targets.length)];
      h.tx = t.x; h.ty = t.y; h._enterId = t.enter;
    } else {
      h.tx = 150 + Math.random()*620;
      h.ty = 380 + Math.random()*90;
      h._enterId = null;
    }
  }
  if (h.inFurniture) {
    h.insideT++;
    if (h.inFurniture==='wheel') {
      if (h.insideT%20===0) { h.energy = Math.max(0,h.energy-1); h.happy = Math.min(100,h.happy+0.5); h.exp++; h.intel += 0.002; }
      if (h.energy<25 || h.insideT>300+Math.random()*200) leaveFurn();
    } else if (['house','nest','hammock'].indexOf(h.inFurniture)>=0) {
      const bonus = h.inFurniture==='nest'?1.5:1;
      if (h.insideT%18===0) h.energy = Math.min(100, h.energy + 0.8*bonus);
      if (h.energy>=99 || h.insideT>420) leaveFurn();
    } else if (h.inFurniture==='tube') {
      if (h.insideT%12===0) h.happy = Math.min(100, h.happy+0.4);
      if (h.insideT>180) leaveFurn();
    } else if (h.inFurniture==='sandbox') {
      if (h.insideT%20===0) { h.clean = Math.min(100, h.clean+2); h.happy = Math.min(100,h.happy+0.2); }
      if (h.clean>=98 || h.insideT>240) leaveFurn();
    } else if (h.inFurniture==='maze') {
      if (h.insideT%25===0) { h.energy=Math.max(0,h.energy-1); h.intel+=0.01; h.happy=Math.min(100,h.happy+0.3); }
      if (h.energy<20 || h.insideT>360) leaveFurn();
    } else if (h.inFurniture==='ball') {
      h.tx = 180 + Math.sin(G.time*0.03)*250;
      h.x += (h.tx-h.x)*0.08;
      if (h.insideT%15===0) { h.happy=Math.min(100,h.happy+0.5); h.energy=Math.max(0,h.energy-0.5); }
      if (h.insideT>220) leaveFurn();
    } else if (h.insideT>150) {
      leaveFurn();
    }
  } else {
    const dx = h.tx - h.x, dy = h.ty - h.y;
    const d = Math.sqrt(dx*dx+dy*dy);
    if (d > 3) {
      h.x += (dx/d) * h.speed;
      h.y += (dy/d) * h.speed * 0.6;
      h.facing = dx>0 ? 1 : -1;
    } else if (h._enterId) {
      enterFurn(h._enterId);
      h._enterId = null;
    }
    h.x = Math.max(90, Math.min(W-90, h.x));
    h.y = Math.max(340, Math.min(500, h.y));
  }
  h.bounce = Math.sin(G.time*0.1) * (h.inFurniture==='wheel' ? 10 : (h.inFurniture ? 3 : 2.5));
  if (h.animT>0) { h.animT--; if (h.animT<=0) h.anim='idle'; }
  if (G.time%300===0 && h.happy>65) { h.weight += 0.1; h.dayAge++; }
  for (let i=G.particles.length-1;i>=0;i--) {
    const p = G.particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.06; p.life--;
    if (p.life<=0) G.particles.splice(i,1);
  }
  for (let i=G.floats.length-1;i>=0;i--) {
    const f = G.floats[i];
    f.y += f.vy; f.life--;
    if (f.life<=0) G.floats.splice(i,1);
  }
  if (h.happy>90) G.highHappy = Math.max(G.highHappy, Math.floor(h.happy));
}

function enterFurn(id) {
  G.hamster.inFurniture = id;
  G.hamster.insideT = 0;
  const p = G.placed.find(pp=>pp.id===id);
  if (p) { G.hamster.x = p.x; G.hamster.y = p.y + (id==='wheel'?10:0); }
  sfx(550,0.1);
}
function leaveFurn() {
  G.hamster.inFurniture = null;
  G.hamster.insideT = 0;
  G.hamster.tx = 150+Math.random()*600;
  G.hamster.ty = 390+Math.random()*90;
}

function tryUnlockHam() {
  for (let i=0;i<HAMSTERS.length;i++) {
    if (G.unlocked.indexOf(i)>=0) continue;
    const need = [0,0,0,0, 300, 600, 1000, 1600];
    if (G.totalCoins >= need[i]) {
      G.unlocked.push(i);
      addFt(W/2, 200, '🎉 解锁仓鼠: '+HAMSTERS[i].name, '#ffd700');
      sfx(900,0.3,'sine',0.1);
    }
  }
}

function drawCage() {

  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

    ctx.fillStyle = '#ffd700';

  } else if (G.weather==='night') {

    ctx.beginPath(); ctx.arc(780, 50, 28, 0, Math.PI*2); ctx.fill();

    }
  } else if (G.weather==='rain') {
    ctx.strokeStyle = 'rgba(180,220,255,0.6)';
    ctx.lineWidth = 1;
    for (let i=0;i<60;i++) {
      const rx=(i*83+G.time*10)%W, ry=((i*157+G.time*16)%80);
      ctx.beginPath(); ctx.moveTo(rx,ry); ctx.lineTo(rx-3,ry+10); ctx.stroke();
    }
  }
  ctx.fillStyle = 'rgba(220,200,170,0.35)';

  ctx.fillRect(0, 520, W, H-520);
  ctx.fillStyle = '#a8875c';
  for (let x=0;x<W;x+=42) ctx.fillRect(x, 520, 1, H-520);
  ctx.fillStyle = '#f5e6c8';
  ctx.fillRect(0, 515, W, 8);
  ctx.fillStyle = 'rgba(200,170,130,0.25)';
  for (let i=0;i<120;i++) {
    ctx.beginPath();
    ctx.arc((i*73)%W, 522+(i*31)%(H-530), 1+Math.random()*2, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.strokeStyle = G.weather==='night' ? '#2a3a5c' : '#a07050';

  ctx.lineWidth = 3;

  for (let x=8;x<W;x+=28) { ctx.beginPath(); ctx.moveTo(x,88); ctx.lineTo(x,598); ctx.stroke(); }
  for (let y=88;y<600;y+=28) { ctx.beginPath(); ctx.moveTo(8,y); ctx.lineTo(W-8,y); ctx.stroke(); }
}

}

function drawParticles() {
  G.particles.forEach(p => {
    ctx.globalAlpha = p.life/45;
    ctx.fillStyle = p.c;
    ctx.font = '16px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(p.t, p.x, p.y);
  });
  ctx.globalAlpha = 1;
  G.floats.forEach(f => {
    ctx.globalAlpha = Math.min(1, f.life/38);
    ctx.fillStyle = f.c;
    ctx.font = 'bold 16px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.fillText(f.t, f.x, f.y);
  });
  ctx.globalAlpha = 1;
}

function render() {
  if (gameState === STATE_MENU) { ctx.fillStyle = '#654'; ctx.fillRect(0,0,W,H); return; }
  drawCage();
  drawFurnitures();
  drawHamster();
  drawParticles();
  drawHUD();
  drawButtons();
  if (gameState === STATE_SHOP) drawShop();
}

function doAction(k) {
  const h = G.hamster;
  if (G.cooldowns[k] > 0) return;
  if (k==='feed') {
    if (G.bowlFood < 100) {
      if (G.coins >= 3) {
        G.coins -= 3;
        G.bowlFood = Math.min(100, G.bowlFood + 25);
        h.hunger = Math.min(100, h.hunger + 5);
        addF(h.x,h.y-20,'#e67e22','🌻');
        addFt(h.x, h.y-60, '-3💰 +食盆', '#e67e22');
        sfx(600,0.1); G.cooldowns.feed=60;
      } else addFt(W/2,300,'金币不足!','#e74c3c');
    } else addFt(W/2,300,'食盆已满!','#e67e22');
  } else if (k==='water') {
    if (G.bottleWater < 100) {
      G.bottleWater = Math.min(100, G.bottleWater + 40);
      h.thirst = Math.min(100, h.thirst + 5);
      addF(h.x,h.y-20,'#3498db','💧');
      addFt(h.x, h.y-60, '水壶已加', '#3498db');
      sfx(520,0.1); G.cooldowns.water=90;
    } else addFt(W/2,300,'水壶已满!','#3498db');
  } else if (k==='pet') {
    h.happy = Math.min(100, h.happy + 8);
    h.anim='happy'; h.animT=45;
    addF(h.x-12,h.y-22,'#e84393','💖');
    addF(h.x+12,h.y-25,'#ffd700','✨');
    addFt(h.x,h.y-65,'+8 心情','#e84393');
    sfx(780,0.12,'triangle'); G.cooldowns.pet=30;
  } else if (k==='play') {
    if (h.energy>=15) {
      h.happy = Math.min(100,h.happy+12);
      h.energy = Math.max(0,h.energy-12);
      h.exp += 3;
      addF(h.x-18,h.y-25,'#2ecc71','🎾');
      addF(h.x+18,h.y-28,'#3498db','⭐');
      addFt(h.x,h.y-70,'+12心情 -12精力','#27ae60');
      sfx(700,0.15,'square',0.05); G.cooldowns.play=90;
    } else addFt(W/2,300,'精力不足!先睡一会吧','#e74c3c');
  } else if (k==='clean') {
    h.clean = Math.min(100, h.clean + 30);
    h.happy = Math.min(100, h.happy + 3);
    addF(h.x,h.y-20,'#9b59b6','✨');
    addF(h.x-15,h.y-15,'#9b59b6','✨');
    addF(h.x+15,h.y-18,'#9b59b6','✨');
    addFt(h.x,h.y-65,'+30 清洁度','#9b59b6');
    sfx(550,0.12); G.cooldowns.clean=120;
  } else if (k==='sleep') {
    if (h.inFurniture) leaveFurn();
    const houses = G.placed.filter(p=>['house','nest','hammock'].indexOf(p.id)>=0);
    if (houses.length>0) {
      const t = houses[0];
      h.tx = t.x; h.ty = t.y; h._enterId = t.id;
      addFt(W/2, 310, '去'+t.name+'睡觉啦~', '#5d6d7e');
    } else {
      h.energy = Math.min(100, h.energy + 20);
      addF(h.x,h.y-20,'#5d6d7e','💤');
      addFt(h.x,h.y-60,'+20 精力','#5d6d7e');
    }
    sfx(420,0.2,'sine',0.05); G.cooldowns.sleep=150;
  } else if (k==='shop') { gameState = STATE_SHOP; sfx(600,0.08); }
  else if (k==='book') { gameState = STATE_COLLECTION; showCollection(); sfx(650,0.1); }
}

function showCollection() {
  const el = document.getElementById('collection-layer');
  el.style.display = 'flex';
  const grid = document.getElementById('cageGrid');
  grid.innerHTML = '';
  FURNITURES.forEach((f,i) => {
    const u = G.furnitureUnlocked.indexOf(f.id)>=0;
    const hprices = [0,0,0,0,300,600,1000,1500,2200,3000];
    const di = document.createElement('div');
    di.className = 'ci '+(u?'unlocked':'locked');
    di.innerHTML = '<div class="ci-emoji">'+(u?f.emoji:'🔒')+'</div>'+
      '<div class="ci-n">'+(u?f.name:'???')+'</div>'+
      '<div class="ci-s">'+(u?f.desc:'累计'+(hprices[i]||f.price*5)+'💰解锁')+'</div>';
    grid.appendChild(di);
  });
}

function handleClick(pos) {
  if (gameState === STATE_MENU) return;
  if (gameState === STATE_SHOP) {
    const b = G._shopBack;
    if (b && pos.x>=b.x&&pos.x<=b.x+b.w&&pos.y>=b.y&&pos.y<=b.y+b.h) { gameState=STATE_CARE; sfx(500,0.08); return; }
    G.shopItems.forEach(it => {
      if (pos.x>=it.x&&pos.x<=it.x+it.w&&pos.y>=it.y&&pos.y<=it.y+it.h && it.canBuy) {
        G.coins -= it.price;
        G.furnitureUnlocked.push(it.id);
        const f = FURNITURES.find(x=>x.id===it.id);
        G.ownedFurniture[it.id] = { x: 200+Math.random()*500, y: 380+Math.random()*100 };
        rebuildPlaced();
        addFt(W/2, 320, '🎉 购买: '+f.name, '#2ecc71');
        saveGame();
        sfx(900,0.2,'sine',0.08);
      }
    });
    return;
  }
  G.actions.forEach(a => {
    if (pos.x>=a.x&&pos.x<=a.x+a.w&&pos.y>=a.y&&pos.y<=a.y+a.h) {
      doAction(a.k);
    }
  });
  if (gameState === STATE_CARE) {
    const h = G.hamster;
    const dx=pos.x-h.x, dy=pos.y-h.y;
    if (Math.sqrt(dx*dx+dy*dy)<55 && !h.inFurniture) {
      doAction('pet');
    }
    G.placed.forEach(fu => {
      const dx2=pos.x-fu.x, dy2=pos.y-fu.y;
      if (Math.abs(dx2)<fu.size[0]*0.7 && Math.abs(dy2)<fu.size[1]*0.7) {
        h.tx = fu.x; h.ty = fu.y; h._enterId = fu.id;
        addFt(fu.x, fu.y-50, '去 '+fu.name, '#c9a66b');
        sfx(550,0.08);
      }
    });
  }
}

function getPos(e) {
  const r = canvas.getBoundingClientRect();
  const sx = W/r.width, sy = H/r.height;
  const cx = e.touches ? e.touches[0].clientX : (e.changedTouches?e.changedTouches[0].clientX:e.clientX);
  const cy = e.touches ? e.touches[0].clientY : (e.changedTouches?e.changedTouches[0].clientY:e.clientY);
  return { x:(cx-r.left)*sx, y:(cy-r.top)*sy };
}
canvas.addEventListener('click', e => handleClick(getPos(e)));
canvas.addEventListener('touchend', e => { if(e.changedTouches) handleClick({...getPos(e)}); }, { passive:true });

document.addEventListener('keydown', e => {
  if (gameState===STATE_MENU) return;
  if (e.key==='Escape') {
    if (gameState===STATE_SHOP) gameState=STATE_CARE;
    else if (gameState===STATE_COLLECTION) { document.getElementById('collection-layer').style.display='none'; gameState=STATE_CARE; }
    sfx(500,0.06);
  }
  if (gameState===STATE_CARE) {
    if (e.key==='1') doAction('feed');
    if (e.key==='2') doAction('water');
    if (e.key==='3') doAction('pet');
    if (e.key==='4') doAction('play');
    if (e.key==='5') doAction('clean');
    if (e.key==='6') doAction('sleep');
    if (e.key==='s'||e.key==='S') doAction('shop');
    if (e.key==='c'||e.key==='C') { gameState=STATE_COLLECTION; showCollection(); }
  }
});

document.querySelectorAll('.ham-card').forEach(c => {
  c.addEventListener('click', () => {
    document.querySelectorAll('.ham-card').forEach(x=>x.classList.remove('selected'));
    c.classList.add('selected');
    selHam = parseInt(c.dataset.h);
    sfx(550,0.08);
  });
});

document.getElementById('start-game-btn').addEventListener('click', () => {
  try { audioCtx.resume(); } catch(e){}
  document.getElementById('startScreen').style.display='none';
  initGame(selHam);
  sfx(850,0.3,'sine');
});

document.getElementById('closeCollect').addEventListener('click', () => {
  document.getElementById('collection-layer').style.display='none';
  gameState = STATE_CARE;
});

let tm = 0;
function step() {
  if (gameState===STATE_CARE) updateHamster();
  render();
  tm = setTimeout(step, 16);
}
step();

window.addEventListener('beforeunload', saveGame);
setInterval(saveGame, 25000);

GameCore.init({ touch: false });
</script>

      c.style.maxWidth = '100%';

    });
  }
  window.addEventListener('resize', batchResizeCanvas);

  if (document.readyState === 'loading') {

<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>

  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
