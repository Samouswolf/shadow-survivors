<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>城堡防御</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a12; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
canvas { image-rendering: pixelated; border: 2px solid #4a9; cursor: pointer; max-width: 100%; height: auto; }
</style>
<style>/* 游戏工坊广告系统 */
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);height:90px;max-height:90px;overflow:hidden;contain:layout style paint;pointer-events:none!important}.ad-banner-container,.ad-banner-container *{pointer-events:none!important}.ad-banner-container iframe{max-height:90px;pointer-events:none!important}
.ad-banner-container iframe{max-width:100%}
.ad-label{position:absolute;top:1px;right:6px;font:9px "Microsoft YaHei",sans-serif;color:rgba(255,255,255,.35)}
.sponsor-btn{position:fixed;top:44px;right:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:3px 9px;border-radius:10px;font:11px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .qr-row{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.sponsor-panel .qr-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px;text-align:center;min-width:140px}
.sponsor-panel .qr-card .qr-icon{font-size:48px;margin-bottom:6px}
.sponsor-panel .qr-card .qr-label{color:#ccc;font:13px "Microsoft YaHei",sans-serif}
.sponsor-panel .qr-card .qr-hint{color:#888;font:11px "Microsoft YaHei",sans-serif;margin-top:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.interstitial-ad .ad-content{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;text-align:center;min-width:280px;max-width:400px}
.interstitial-ad .ad-content p{color:#aaa;font:14px "Microsoft YaHei",sans-serif;margin-bottom:12px}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="startScreen" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#0a0a12;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000">
  <h1 style="font-size:48px;color:#4a9;margin-bottom:20px">🏰 城堡防御</h1>
  <p style="color:#888;margin-bottom:40px">布置弓箭塔·法师塔·炮塔 · 抵御敌人进攻</p>
  <button id="startBtn" style="padding:15px 60px;font-size:20px;background:linear-gradient(135deg,#2d7a4f,#4a9);color:#fff;border:none;border-radius:12px;cursor:pointer">开始游戏</button>
</div>
<button id="pauseBtn" style="position:fixed;top:10px;right:10px;width:44px;height:44px;font-size:20px;background:rgba(0,0,0,0.5);color:#fff;border:1px solid rgba(255,255,255,0.3);border-radius:8px;z-index:100;display:none">⏸</button>
<div id="pauseScreen" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);flex-direction:column;align-items:center;justify-content:center;z-index:999">
  <h2 style="color:#fff;margin-bottom:30px">游戏暂停</h2>
  <button id="resumeBtn" style="padding:12px 40px;font-size:18px;background:#4a9;color:#fff;border:none;border-radius:8px;margin-bottom:15px">继续游戏</button>
  <button id="restartBtn" style="padding:12px 40px;font-size:18px;background:#666;color:#fff;border:none;border-radius:8px">重新开始</button>
</div>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = 800, H = 600;
canvas.width = W; canvas.height = H;

function resizeCanvas() {
    const maxW = window.innerWidth - 20;
    if (W > maxW) { canvas.style.width = maxW + 'px'; canvas.style.height = (H * maxW / W) + 'px'; }
    else { canvas.style.width = ''; canvas.style.height = ''; }
}
window.addEventListener('resize', resizeCanvas); resizeCanvas();

// roundRect polyfill
if (!ctx.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        r = Math.min(r, w / 2, h / 2);
        this.moveTo(x + r, y);
        this.arcTo(x + w, y, x + w, y + h, r);
        this.arcTo(x + w, y + h, x, y + h, r);
        this.arcTo(x, y + h, x, y, r);
        this.arcTo(x, y, x + w, y, r);
        this.closePath();
    };
}

// Audio
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(freq, dur, type) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
}

// Tower data
const TOWER_TYPES = [
    { name: '弓箭塔', color: '#4a9', cost: 80, range: 120, damage: 25, fireRate: 40, bulletSpeed: 6, bulletColor: '#8f8', splash: 0 },
    { name: '法师塔', color: '#a4f', cost: 120, range: 100, damage: 45, fireRate: 60, bulletSpeed: 4, bulletColor: '#c8f', splash: 40 },
    { name: '炮塔', color: '#f84', cost: 160, range: 90, damage: 80, fireRate: 90, bulletSpeed: 3, bulletColor: '#fa4', splash: 60 }
];

// Enemy types
const ENEMY_TYPES = [
    { name: '步兵', color: '#c55', hp: 60, speed: 1.0, reward: 10, size: 8 },
    { name: '骑兵', color: '#ca5', hp: 100, speed: 1.8, reward: 20, size: 10 },
    { name: '重甲', color: '#55a', hp: 200, speed: 0.6, reward: 30, size: 12 },
    { name: '巨人', color: '#a55', hp: 500, speed: 0.4, reward: 60, size: 16 }
];

// Wave data
const WAVES = [
    [{ type: 0, count: 5, interval: 60 }],
    [{ type: 0, count: 8, interval: 50 }],
    [{ type: 0, count: 5, interval: 50 }, { type: 1, count: 3, interval: 70 }],
    [{ type: 1, count: 6, interval: 60 }],
    [{ type: 0, count: 8, interval: 40 }, { type: 1, count: 4, interval: 60 }],
    [{ type: 2, count: 3, interval: 80 }],
    [{ type: 0, count: 10, interval: 35 }, { type: 2, count: 3, interval: 80 }],
    [{ type: 1, count: 8, interval: 45 }, { type: 2, count: 4, interval: 70 }],
    [{ type: 2, count: 6, interval: 60 }, { type: 3, count: 1, interval: 120 }],
    [{ type: 0, count: 12, interval: 30 }, { type: 1, count: 6, interval: 50 }, { type: 3, count: 2, interval: 100 }]
];

// Path waypoints
const PATH = [
    {x:0,y:100},{x:200,y:100},{x:200,y:300},{x:400,y:300},
    {x:400,y:150},{x:600,y:150},{x:600,y:400},{x:400,y:400},
    {x:400,y:500},{x:800,y:500}
];

// Game state
let G = {};
function resetGame() {
    G = {
        state: 'menu', // menu, playing, paused, gameover, victory
        gold: 200, lives: 20, score: 0, wave: 0,
        towers: [], enemies: [], bullets: [], particles: [],
        selectedTower: -1, placing: false, placeType: 0,
        waveTimer: 0, waveActive: false, spawnQueue: [],
        spawnTimer: 0, highScore: parseInt(localStorage.getItem('castleDefHigh') || '0'),
        towerIdCounter: 0, enemyIdCounter: 0,
        upgradePanel: null // {towerId, x, y}
    };
}
resetGame();

// Grid for tower placement
const GRID = 40;
function isOnPath(gx, gy) {
    const cx = gx * GRID + GRID/2, cy = gy * GRID + GRID/2;
    for (let i = 0; i < PATH.length - 1; i++) {
        const a = PATH[i], b = PATH[i+1];
        const dx = b.x - a.x, dy = b.y - a.y;
        const len = Math.sqrt(dx*dx + dy*dy);
        const nx = -dy/len, ny = dx/len;
        const px = cx - a.x, py = cy - a.y;
        const dist = Math.abs(px*nx + py*ny);
        const t = (px*dx + py*dy) / (len*len);
        if (t >= -0.1 && t <= 1.1 && dist < 25) return true;
    }
    return false;
}

function hasTowerAt(gx, gy) {
    return G.towers.some(t => t.gx === gx && t.gy === gy);
}

// Spawn enemies for current wave
function startWave() {
    if (G.wave >= WAVES.length) { G.state = 'victory'; return; }
    const waveData = WAVES[G.wave];
    G.spawnQueue = [];
    waveData.forEach(group => {
        for (let i = 0; i < group.count; i++) {
            G.spawnQueue.push({ type: group.type, delay: group.interval });
        }
    });
    G.waveActive = true;
    G.spawnTimer = 30; // initial delay
}

// Create enemy
function spawnEnemy(type) {
    const et = ENEMY_TYPES[type];
    G.enemies.push({
        id: G.enemyIdCounter++, type, x: PATH[0].x, y: PATH[0].y,
        hp: et.hp, maxHp: et.hp, speed: et.speed, reward: et.reward,
        size: et.size, pathIdx: 0, pathT: 0, slow: 0
    });
}

// Create bullet
function fireBullet(tower, target) {
    const td = TOWER_TYPES[tower.type];
    const dx = target.x - tower.x, dy = target.y - tower.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    G.bullets.push({
        x: tower.x, y: tower.y, vx: (dx/dist)*td.bulletSpeed, vy: (dy/dist)*td.bulletSpeed,
        damage: td.damage + tower.level * 10, splash: td.splash, color: td.bulletColor,
        life: 120, towerType: tower.type
    });
}

// Particles
function addParticle(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 3;
        G.particles.push({ x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
            life: 20 + Math.random()*20, color, size: 2 + Math.random()*3 });
    }
}

// Distance helper
function dist(a, b) { return Math.sqrt((a.x-b.x)**2 + (a.y-b.y)**2); }

// Draw path
function drawPath() {
    ctx.strokeStyle = '#3a3a2a';
    ctx.lineWidth = 28;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(PATH[0].x, PATH[0].y);
    for (let i = 1; i < PATH.length; i++) ctx.lineTo(PATH[i].x, PATH[i].y);
    ctx.stroke();
    ctx.strokeStyle = '#5a5a3a';
    ctx.lineWidth = 20;
    ctx.beginPath();
    ctx.moveTo(PATH[0].x, PATH[0].y);
    for (let i = 1; i < PATH.length; i++) ctx.lineTo(PATH[i].x, PATH[i].y);
    ctx.stroke();
    // Dashes
    ctx.strokeStyle = '#6a6a4a';
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 12]);
    ctx.beginPath();
    ctx.moveTo(PATH[0].x, PATH[0].y);
    for (let i = 1; i < PATH.length; i++) ctx.lineTo(PATH[i].x, PATH[i].y);
    ctx.stroke();
    ctx.setLineDash([]);
}

// Draw tower
function drawTower(t) {
    const td = TOWER_TYPES[t.type];
    const x = t.x, y = t.y;
    // Base
    ctx.fillStyle = '#333';
    ctx.beginPath(); ctx.arc(x, y, 16, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = td.color;
    ctx.beginPath(); ctx.arc(x, y, 12, 0, Math.PI*2); ctx.fill();
    // Level indicator
    ctx.fillStyle = '#fff';
    ctx.font = '10px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('' + (t.level + 1), x, y + 4);
    // Range circle on selected
    if (G.selectedTower === t.id) {
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(x, y, td.range + t.level * 15, 0, Math.PI*2); ctx.stroke();
    }
}

// Draw enemy
function drawEnemy(e) {
    const et = ENEMY_TYPES[e.type];
    // Body
    ctx.fillStyle = et.color;
    ctx.beginPath(); ctx.arc(e.x, e.y, et.size, 0, Math.PI*2); ctx.fill();
    // HP bar
    const barW = et.size * 2;
    const barH = 3;
    const barX = e.x - barW/2;
    const barY = e.y - et.size - 6;
    ctx.fillStyle = '#300';
    ctx.fillRect(barX, barY, barW, barH);
    ctx.fillStyle = '#0f0';
    ctx.fillRect(barX, barY, barW * (e.hp / e.maxHp), barH);
}

// Draw bullet
function drawBullet(b) {
    ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, Math.PI*2); ctx.fill();
}

// Draw UI
function drawUI() {
    // Top bar
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, 40);
    ctx.fillStyle = '#fa0';
    ctx.font = '16px Arial';
    ctx.textAlign = 'left';
    ctx.fillText('💰 ' + G.gold, 10, 26);
    ctx.fillStyle = '#f55';
    ctx.fillText('❤️ ' + G.lives, 120, 26);
    ctx.fillStyle = '#5af';
    ctx.fillText('🌊 波次 ' + (G.wave + 1) + '/' + WAVES.length, 230, 26);
    ctx.fillStyle = '#fff';
    ctx.fillText('🏆 ' + G.score, 400, 26);
    ctx.fillStyle = '#888';
    ctx.fillText('最高: ' + G.highScore, 530, 26);

    // Tower selection panel
    const panelY = H - 70;
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, panelY, W, 70);
    TOWER_TYPES.forEach((td, i) => {
        const px = 20 + i * 160;
        const py = panelY + 10;
        const selected = G.placeType === i && G.placing;
        ctx.fillStyle = selected ? 'rgba(255,255,255,0.2)' : 'rgba(255,255,255,0.05)';
        ctx.strokeStyle = selected ? '#4a9' : '#444';
        ctx.lineWidth = selected ? 2 : 1;
        ctx.beginPath(); ctx.roundRect(px, py, 140, 50, 8); ctx.fill(); ctx.stroke();
        // Tower icon
        ctx.fillStyle = td.color;
        ctx.beginPath(); ctx.arc(px + 25, py + 25, 10, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = '12px Arial';
        ctx.textAlign = 'left';
        ctx.fillText(td.name, px + 45, py + 20);
        ctx.fillStyle = G.gold >= td.cost ? '#fa0' : '#f55';
        ctx.fillText('💰' + td.cost, px + 45, py + 38);
    });

    // Start wave button
    if (!G.waveActive && G.state === 'playing') {
        const btnX = W - 180, btnY = panelY + 15;
        ctx.fillStyle = '#4a9';
        ctx.beginPath(); ctx.roundRect(btnX, btnY, 160, 40, 8); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = '16px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('开始下一波', btnX + 80, btnY + 26);
    }

    // Upgrade panel
    if (G.upgradePanel) {
        const tower = G.towers.find(t => t.id === G.upgradePanel.towerId);
        if (tower) {
            const td = TOWER_TYPES[tower.type];
            const px = G.upgradePanel.x, py = G.upgradePanel.y - 120;
            ctx.fillStyle = 'rgba(0,0,0,0.85)';
            ctx.strokeStyle = '#4a9';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.roundRect(px, py, 180, 110, 8); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#fff';
            ctx.font = '14px Arial';
            ctx.textAlign = 'left';
            ctx.fillText(td.name + ' Lv' + (tower.level + 1), px + 10, py + 22);
            ctx.fillStyle = '#aaa';
            ctx.font = '11px Arial';
            ctx.fillText('伤害: ' + (td.damage + tower.level * 10), px + 10, py + 40);
            ctx.fillText('范围: ' + (td.range + tower.level * 15), px + 10, py + 55);
            // Upgrade button
            if (tower.level < 2) {
                const upCost = Math.floor(td.cost * (1 + tower.level * 0.8));
                ctx.fillStyle = G.gold >= upCost ? '#4a9' : '#666';
                ctx.beginPath(); ctx.roundRect(px + 10, py + 65, 70, 30, 6); ctx.fill();
                ctx.fillStyle = '#fff'; ctx.font = '12px Arial'; ctx.textAlign = 'center';
                ctx.fillText('升级 💰' + upCost, px + 45, py + 84);
            }
            // Sell button
            ctx.fillStyle = '#a44';
            ctx.beginPath(); ctx.roundRect(px + 95, py + 65, 70, 30, 6); ctx.fill();
            ctx.fillStyle = '#fff'; ctx.font = '12px Arial'; ctx.textAlign = 'center';
            ctx.fillText('出售 💰' + Math.floor(td.cost * 0.6), px + 130, py + 84);
        }
    }

    // Wave start hint
    if (!G.waveActive && G.state === 'playing' && G.wave < WAVES.length) {
        ctx.fillStyle = '#fff';
        ctx.font = '14px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('点击右侧按钮或按空格开始下一波', W/2, 60);
    }
}

// Game over / victory screen
function drawEndScreen() {
    ctx.fillStyle = 'rgba(0,0,0,0.8)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    if (G.state === 'victory') {
        ctx.fillStyle = '#4a9';
        ctx.font = '48px Arial';
        ctx.fillText('胜利!', W/2, H/2 - 60);
        ctx.fillStyle = '#fff';
        ctx.font = '24px Arial';
        ctx.fillText('得分: ' + G.score, W/2, H/2);
    } else {
        ctx.fillStyle = '#f55';
        ctx.font = '48px Arial';
        ctx.fillText('游戏结束', W/2, H/2 - 60);
        ctx.fillStyle = '#fff';
        ctx.font = '24px Arial';
        ctx.fillText('得分: ' + G.score + '  最高: ' + G.highScore, W/2, H/2);
    }
    ctx.fillStyle = '#4a9';
    ctx.beginPath(); ctx.roundRect(W/2 - 80, H/2 + 30, 160, 45, 10); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '18px Arial';
    ctx.fillText('重新开始', W/2, H/2 + 58);
}

// Update game logic
function update() {
    if (G.state !== 'playing') return;

    // Spawn enemies
    if (G.waveActive && G.spawnQueue.length > 0) {
        G.spawnTimer--;
        if (G.spawnTimer <= 0) {
            const next = G.spawnQueue.shift();
            spawnEnemy(next.type);
            G.spawnTimer = next.delay;
        }
    }

    // Check wave complete
    if (G.waveActive && G.spawnQueue.length === 0 && G.enemies.length === 0) {
        G.waveActive = false;
        G.wave++;
        G.gold += 50 + G.wave * 20;
        if (G.wave >= WAVES.length) {
            G.state = 'victory';
            if (G.score > G.highScore) {
                G.highScore = G.score;
                localStorage.setItem('castleDefHigh', G.highScore);
            }
        }
    }

    // Move enemies
    for (let i = G.enemies.length - 1; i >= 0; i--) {
        const e = G.enemies[i];
        const target = PATH[e.pathIdx + 1];
        if (!target) {
            G.lives--;
            G.enemies.splice(i, 1);
            playSound(150, 0.3, 'sawtooth');
            if (G.lives <= 0) {
                G.state = 'gameover';
                if (G.score > G.highScore) {
                    G.highScore = G.score;
                    localStorage.setItem('castleDefHigh', G.highScore);
                }
            }
            continue;
        }
        const dx = target.x - e.x, dy = target.y - e.y;
        const d = Math.sqrt(dx*dx + dy*dy);
        const spd = e.speed * (e.slow > 0 ? 0.5 : 1);
        if (d < spd * 2) {
            e.pathIdx++;
        } else {
            e.x += (dx/d) * spd;
            e.y += (dy/d) * spd;
        }
        if (e.slow > 0) e.slow--;
    }

    // Tower shooting
    G.towers.forEach(tower => {
        tower.cooldown = (tower.cooldown || 0) - 1;
        if (tower.cooldown > 0) return;
        const td = TOWER_TYPES[tower.type];
        const range = td.range + tower.level * 15;
        let closest = null, closestDist = Infinity;
        G.enemies.forEach(e => {
            const d = dist(tower, e);
            if (d < range && d < closestDist) { closest = e; closestDist = d; }
        });
        if (closest) {
            fireBullet(tower, closest);
            tower.cooldown = td.fireRate - tower.level * 8;
            playSound(600 + tower.type * 200, 0.08, 'square');
        }
    });

    // Move bullets
    for (let i = G.bullets.length - 1; i >= 0; i--) {
        const b = G.bullets[i];
        b.x += b.vx; b.y += b.vy; b.life--;
        if (b.life <= 0 || b.x < -10 || b.x > W+10 || b.y < -10 || b.y > H+10) {
            G.bullets.splice(i, 1); continue;
        }
        // Hit detection
        for (let j = G.enemies.length - 1; j >= 0; j--) {
            const e = G.enemies[j];
            if (dist(b, e) < ENEMY_TYPES[e.type].size + 5) {
                // Apply damage (splash)
                if (b.splash > 0) {
                    G.enemies.forEach(e2 => {
                        if (dist(b, e2) < b.splash) {
                            e2.hp -= b.damage * (1 - dist(b, e2) / b.splash * 0.5);
                        }
                    });
                    addParticle(b.x, b.y, b.color, 12);
                } else {
                    e.hp -= b.damage;
                    addParticle(b.x, b.y, b.color, 5);
                }
                G.bullets.splice(i, 1);
                // Check kill
                if (e.hp <= 0) {
                    G.gold += e.reward;
                    G.score += e.reward;
                    addParticle(e.x, e.y, ENEMY_TYPES[e.type].color, 15);
                    G.enemies.splice(j, 1);
                    playSound(300, 0.15, 'triangle');
                }
                break;
            }
        }
    }

    // Update particles
    for (let i = G.particles.length - 1; i >= 0; i--) {
        const p = G.particles[i];
        p.x += p.vx; p.y += p.vy; p.life--; p.size *= 0.95;
        if (p.life <= 0) G.particles.splice(i, 1);
    }
}

// Render
function render() {
    ctx.fillStyle = '#2a2a1a';
    ctx.fillRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += GRID) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y < H; y += GRID) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

    drawPath();

    // Towers
    G.towers.forEach(drawTower);

    // Enemies
    G.enemies.forEach(drawEnemy);

    // Bullets
    G.bullets.forEach(drawBullet);

    // Particles
    G.particles.forEach(p => {
        ctx.globalAlpha = p.life / 40;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha = 1;

    drawUI();

    if (G.state === 'gameover' || G.state === 'victory') drawEndScreen();
}

// Main loop
let lastTime = 0;
function gameLoop(time) {
    const dt = time - lastTime;
    if (dt >= 16) {
        lastTime = time;
        update();
        render();
    }
    requestAnimationFrame(gameLoop);
}

// Input handling
function getCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width;
    const scaleY = H / rect.height;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
}

function handleClick(e) {
    if (G.state !== 'playing') {
        if (G.state === 'gameover' || G.state === 'victory') {
            const rect = canvas.getBoundingClientRect();
            const scaleX = W / rect.width;
            const scaleY = H / rect.height;
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            const mx = (clientX - rect.left) * scaleX;
            const my = (clientY - rect.top) * scaleY;
            if (mx > W/2-80 && mx < W/2+80 && my > H/2+30 && my < H/2+75) {
                resetGame();
                G.state = 'playing';
                document.getElementById('pauseBtn').style.display = 'block';
            }
        }
        return;
    }

    const pos = getCanvasPos(e);
    const gx = Math.floor(pos.x / GRID);
    const gy = Math.floor(pos.y / GRID);

    // Check upgrade panel clicks
    if (G.upgradePanel) {
        const tower = G.towers.find(t => t.id === G.upgradePanel.towerId);
        if (tower) {
            const td = TOWER_TYPES[tower.type];
            const px = G.upgradePanel.x, py = G.upgradePanel.y - 120;
            // Upgrade button
            if (tower.level < 2) {
                const upCost = Math.floor(td.cost * (1 + tower.level * 0.8));
                if (pos.x >= px+10 && pos.x <= px+80 && pos.y >= py+65 && pos.y <= py+95) {
                    if (G.gold >= upCost) {
                        G.gold -= upCost;
                        tower.level++;
                        playSound(800, 0.15, 'sine');
                    }
                    G.upgradePanel = null;
                    return;
                }
            }
            // Sell button
            if (pos.x >= px+95 && pos.x <= px+165 && pos.y >= py+65 && pos.y <= py+95) {
                G.gold += Math.floor(td.cost * 0.6);
                G.towers = G.towers.filter(t => t.id !== tower.id);
                G.upgradePanel = null;
                playSound(400, 0.1, 'triangle');
                return;
            }
        }
        G.upgradePanel = null;
        return;
    }

    // Check tower click (select)
    const clickedTower = G.towers.find(t => Math.abs(t.x - pos.x) < 18 && Math.abs(t.y - pos.y) < 18);
    if (clickedTower) {
        G.upgradePanel = { towerId: clickedTower.id, x: Math.min(clickedTower.x + 25, W - 190), y: clickedTower.y };
        G.selectedTower = clickedTower.id;
        return;
    }

    // Tower selection panel
    const panelY = H - 70;
    if (pos.y > panelY) {
        TOWER_TYPES.forEach((td, i) => {
            const px = 20 + i * 160;
            if (pos.x >= px && pos.x <= px + 140 && pos.y >= panelY + 10 && pos.y <= panelY + 60) {
                G.placing = true;
                G.placeType = i;
            }
        });
        // Start wave button
        if (!G.waveActive && pos.x >= W - 180 && pos.x <= W - 20 && pos.y >= panelY + 15 && pos.y <= panelY + 55) {
            startWave();
            playSound(500, 0.2, 'sine');
        }
        return;
    }

    // Place tower
    if (G.placing && gx >= 0 && gx < W/GRID && gy >= 0 && gy < H/GRID) {
        if (!isOnPath(gx, gy) && !hasTowerAt(gx, gy) && pos.y < panelY) {
            const td = TOWER_TYPES[G.placeType];
            if (G.gold >= td.cost) {
                G.gold -= td.cost;
                G.towers.push({
                    id: G.towerIdCounter++, type: G.placeType,
                    gx, gy, x: gx*GRID + GRID/2, y: gy*GRID + GRID/2,
                    level: 0, cooldown: 0
                });
                playSound(700, 0.1, 'sine');
            }
        }
    }
}

canvas.addEventListener('click', handleClick);
canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    handleClick(e.changedTouches ? { clientX: e.changedTouches[0].clientX, clientY: e.changedTouches[0].clientY } : e);
});

// Keyboard
document.addEventListener('keydown', (e) => {
    if (e.key === ' ' || e.key === 'Escape') {
        e.preventDefault();
        if (G.state === 'playing' && !G.waveActive) {
            startWave();
        } else if (G.state === 'playing') {
            G.state = 'paused';
            document.getElementById('pauseScreen').style.display = 'flex';
        }
    }
    if (e.key === '1') { G.placing = true; G.placeType = 0; }
    if (e.key === '2') { G.placing = true; G.placeType = 1; }
    if (e.key === '3') { G.placing = true; G.placeType = 2; }
});

// UI buttons
document.getElementById('startBtn').addEventListener('click', () => {
    audioCtx.resume();
    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('pauseBtn').style.display = 'block';
    resetGame();
    G.state = 'playing';
});
document.getElementById('pauseBtn').addEventListener('click', () => {
    if (G.state === 'playing') {
        G.state = 'paused';
        document.getElementById('pauseScreen').style.display = 'flex';
    }
});
document.getElementById('resumeBtn').addEventListener('click', () => {
    G.state = 'playing';
    document.getElementById('pauseScreen').style.display = 'none';
});
document.getElementById('restartBtn').addEventListener('click', () => {
    resetGame();
    G.state = 'playing';
    document.getElementById('pauseScreen').style.display = 'none';
});

requestAnimationFrame(gameLoop);


// ===== 游戏工坊统一广告系统 =====
const GameMonetize = {
	adsterra: { enabled: !/localhost|127\.0\.0\.1/.test(location.hostname) },
	sponsor: { enabled: true, wechatQR: '', alipayQR: '' },
	interstitial: { enabled: true, cooldownMs: 180000, gameCount: 2 },
	_lastInterTime: 0, _deathCount: 0,
	_gameOverDetected: false,
	init() {
		const banner = document.getElementById('adBanner');
		if (banner && this.adsterra.enabled) {
			const s1 = document.createElement('script');
			s1.src = 'https://pl29544740.effectivecpmnetwork.com/de/26/0e/de260e17b6a348e3489772a87b1cedf1.js';
			s1.async = true;
			banner.appendChild(s1);
		}
		const spBtn = document.getElementById('sponsorBtn');
		const spPanel = document.getElementById('sponsorPanel');
		const spClose = document.getElementById('sponsorClose');
		if (spBtn && spPanel && spClose && this.sponsor.enabled) {
			spBtn.onclick = () => { spPanel.style.display = 'flex'; spPanel.style.pointerEvents = 'auto'; };
			spClose.onclick = () => { spPanel.style.display = 'none'; spPanel.style.pointerEvents = 'none'; };
			spPanel.onclick = (e) => { if (e.target === spPanel) { spPanel.style.display = 'none'; spPanel.style.pointerEvents = 'none'; } };
		} else if (spBtn) { spBtn.style.display = 'none'; }
		const skipBtn = document.getElementById('skipInterstitial');
		const interstitial = document.getElementById('interstitialAd');
		if (skipBtn && interstitial) {
			skipBtn.onclick = () => {
				interstitial.style.display = 'none'; interstitial.style.pointerEvents = 'none';
				if (this._reviveCallback) { const cb = this._reviveCallback; this._reviveCallback = null; cb(); }
			};
		}
		// 自动检测游戏结束状态
		this._startGameOverWatcher();
	},
	_startGameOverWatcher() {
		// 检测#restartBtn或包含"重新开始"/"再来一局"的按钮变为可见
		const checkGameOver = () => {
			if (this._gameOverDetected) return;
			// 方法1: 检测#restartBtn可见
			const restartBtn = document.getElementById('restartBtn');
			if (restartBtn && restartBtn.offsetParent !== null && getComputedStyle(restartBtn).display !== 'none') {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
			// 方法2: 检测#gameOverScreen可见
			const goScreen = document.getElementById('gameOverScreen');
			if (goScreen && getComputedStyle(goScreen).display !== 'none') {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
			// 方法3: 检测screen-gameover可见
			const goScreen2 = document.getElementById('screen-gameover');
			if (goScreen2 && !goScreen2.classList.contains('hidden')) {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
		};
		// 每500ms检查一次
		this._goInterval = setInterval(() => {
			checkGameOver();
			// 如果检测到了，等2秒后重置标志，允许下次检测
			if (this._gameOverDetected) {
				setTimeout(() => { this._gameOverDetected = false; }, 2000);
			}
		}, 500);
	},
	requestRevive(callback) {
		this._reviveCallback = callback || null;
		const el = document.getElementById('interstitialAd');
		if (!el) { if (callback) callback(); return; }
		const s2 = document.createElement('script');
		s2.src = 'https://pl29544742.effectivecpmnetwork.com/be/a9/6d/bea96d779c0ee07c2b15613852dd3e70.js';
		s2.async = true;
		document.getElementById('interstitialAdSlot').innerHTML = '';
		document.getElementById('interstitialAdSlot').appendChild(s2);
		el.style.display = 'flex'; el.style.pointerEvents = 'auto';

		setTimeout(() => { const slot = document.getElementById('interstitialAdSlot'); if (slot && slot.innerHTML.includes('加载中')) { slot.innerHTML = '<div style=color:#aaa;font:13px Microsoft YaHei,sans-serif>广告暂时无法加载<br>点击下方按钮继续</div>'; } }, 3000);
		const skipBtn = document.getElementById('skipInterstitial');
		if (skipBtn) {
			skipBtn.textContent = '5 秒后可跳过'; skipBtn.disabled = true;
			let cd = 5;
			const timer = setInterval(() => {
				cd--;
				if (cd <= 0) { clearInterval(timer); skipBtn.textContent = '跳过广告 ▶'; skipBtn.disabled = false; }
				else { skipBtn.textContent = cd + ' 秒后可跳过'; }
			}, 1000);
		}
	},
	onGameOver() {
		this._deathCount++;
		if (!this.interstitial.enabled) return;
		if (this._deathCount < this.interstitial.gameCount) return;
		if (Date.now() - this._lastInterTime < this.interstitial.cooldownMs) return;
		this._lastInterTime = Date.now(); this._deathCount = 0;
		this.requestRevive(null);
	},
};
GameMonetize.init();
</script>
