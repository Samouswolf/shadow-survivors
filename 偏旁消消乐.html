<body>
<canvas id="cv"></canvas>
<script>
// ==================== 偏旁消消乐 ====================
// 认识汉字结构，偏旁部首配对消除

const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');

// ==================== 响应式设计 ====================
function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ==================== 偏旁部首数据 ====================
// 每个偏旁包含：符号、名称、所属汉字示例、颜色
const RADICALS = [
    { char:'亻', name:'单人旁', words:['他','们','你','作','休'], color:'#FF6B6B' },
    { char:'氵', name:'三点水', words:['河','海','湖','洗','清'], color:'#4ECDC4' },
    { char:'木', name:'木字旁', words:['林','树','桃','桥','松'], color:'#45B7D1' },
    { char:'火', name:'火字旁', words:['灯','烧','炒','烤','烟'], color:'#F7DC6F' },
    { char:'土', name:'土字旁', words:['地','城','坐','块','场'], color:'#BB8FCE' },
    { char:'口', name:'口字旁', words:['吃','喝','叫','听','唱'], color:'#F1948A' },
    { char:'女', name:'女字旁', words:['妈','姐','妹','好','她'], color:'#F8C471' },
    { char:'讠', name:'言字旁', words:['说','话','读','请','语'], color:'#82E0AA' },
    { char:'忄', name:'竖心旁', words:['快','慢','情','怕','惊'], color:'#D7BDE2' },
    { char:'扌', name:'提手旁', words:['打','拉','抱','抓','拍'], color:'#A9CCE3' },
    { char:'目', name:'目字旁', words:['眼','睛','看','盯','盼'], color:'#F5CBA7' },
    { char:'足', name:'足字旁', words:['跑','跳','踢','路','跟'], color:'#AED6F1' },
    { char:'虫', name:'虫字旁', words:['蚂','蚁','蛇','蛙','蜻'], color:'#ABEBC6' },
    { char:'钅', name:'金字旁', words:['铁','银','铜','钢','针'], color:'#FAD7A0' },
    { char:'月', name:'月字旁', words:['胖','脸','肚','腰','腿'], color:'#E8DAEF' },
    { char:'心', name:'心字底', words:['想','思','念','愿','意'], color:'#F5B7B1' },
    { char:'艹', name:'草字头', words:['花','草','茶','苹','落'], color:'#ABEBC6' },
    { char:'竹', name:'竹字头', words:['笑','笔','等','篮','筷'], color:'#A9CCE3' },
    { char:'纟', name:'绞丝旁', words:['红','绿','线','织','纺'], color:'#F9E79F' },
    { char:'辶', name:'走之旁', words:['这','边','远','近','还'], color:'#D5F5E3' },
    { char:'王', name:'王字旁', words:['玩','珠','球','理','现'], color:'#E8DAEF' },
    { char:'日', name:'日字旁', words:['明','时','晴','暗','早'], color:'#FAD7A0' },
    { char:'石', name:'石字旁', words:['砖','砍','破','碗','矿'], color:'#D5DBDB' },
    { char:'禾', name:'禾字旁', words:['种','秋','和','科','积'], color:'#ABEBC6' },
    { char:'米', name:'米字旁', words:['糖','粮','精','粗','粒'], color:'#F5CBA7' },
    { char:'车', name:'车字旁', words:['转','辆','轻','轮','较'], color:'#AED6F1' },
    { char:'马', name:'马字旁', words:['骑','驾','驱','驶','驻'], color:'#F5B7B1' },
    { char:'鸟', name:'鸟字旁', words:['鸡','鸭','鹅','鸽','鸦'], color:'#F8C471' },
    { char:'贝', name:'贝字旁', words:['贵','贫','赔','赚','赏'], color:'#FAD7A0' },
    { char:'雨', name:'雨字头', words:['雪','雷','霜','露','雾'], color:'#AED6F1' },
    { char:'食', name:'食字旁', words:['饭','饮','饱','饼','饿'], color:'#F8C471' },
    { char:'门', name:'门字框', words:['问','间','闪','闭','闻'], color:'#D7BDE2' },
];

// ==================== 游戏常量 ====================
const STATE = { MENU:0, PLAYING:1, PAUSED:2, GAMEOVER:3, LEVEL_CLEAR:4 };
const COLS = 6;
const ROWS = 6;
const PAIR_COUNT = COLS * ROWS / 2; // 18 pairs per board

// ==================== 游戏状态 ====================
let G = {};

function initGame() {
    G = {
        state: STATE.MENU,
        score: 0,
        level: 1,
        combo: 0,
        maxCombo: 0,
        moves: 0,
        timeLeft: 60,
        timer: 0,
        // grid: 2D array of radical indices
        grid: [],
        // selected tile {row, col} or null
        selected: null,
        // matched tiles animation
        matched: [],
        // particles
        particles: [],
        // hint tiles
        hintTiles: null,
        hintTimer: 0,
        // level clear animation
        clearAnim: 0,
        // game over animation
        gameOverAnim: 0,
        // menu animation
        menuAnim: 0,
        // combo display
        comboDisplay: 0,
        comboText: '',
        // difficulty scaling
        matchTime: 60,
        // for shuffle animation
        shuffling: false,
        shuffleAnim: 0,
    };
    loadHighScore();
}

// ==================== localStorage ====================
let highScore = 0;
function loadHighScore() {
    try { highScore = parseInt(localStorage.getItem('radical_match_hs') || '0'); }
    catch(e) { highScore = 0; }
}
function saveHighScore() {
    try { localStorage.setItem('radical_match_hs', highScore.toString()); }
    catch(e) {}
}

// ==================== 棋盘生成 ====================
function generateBoard(level) {
    const numPairs = Math.min(PAIR_COUNT, 14 + Math.min(level, 4) * 1);
    const totalTiles = numPairs * 2;
    // ensure even
    const adjustedPairs = Math.floor(totalTiles / 2);

    // pick random radicals
    const available = [...Array(RADICALS.length).keys()];
    shuffle(available);
    const chosen = available.slice(0, adjustedPairs);

    // create pairs
    let tiles = [];
    for (let idx of chosen) {
        tiles.push(idx);
        tiles.push(idx);
    }

    // pad to fill grid if needed
    while (tiles.length < COLS * ROWS) {
        tiles.push(-1); // empty
    }

    // ensure we fill exactly COLS*ROWS with pairs
    // recalculate: use exactly COLS*ROWS tiles, all paired
    const gridTotal = COLS * ROWS;
    const actualPairs = gridTotal / 2;
    const chosen2 = available.slice(0, actualPairs);
    tiles = [];
    for (let idx of chosen2) {
        tiles.push(idx);
        tiles.push(idx);
    }

    shuffle(tiles);

    G.grid = [];
    for (let r = 0; r < ROWS; r++) {
        G.grid[r] = [];
        for (let c = 0; c < COLS; c++) {
            G.grid[r][c] = tiles[r * COLS + c];
        }
    }

    // check if any valid moves exist, if not reshuffle
    if (!hasValidMoves()) {
        shuffleBoard();
    }
}

function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
}
const shuffle = shuffleArray;

function shuffleBoard() {
    let tiles = [];
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            if (G.grid[r][c] >= 0) tiles.push(G.grid[r][c]);
        }
    }
    shuffle(tiles);
    let idx = 0;
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            if (G.grid[r][c] >= 0) {
                G.grid[r][c] = tiles[idx++];
            }
        }
    }
    if (!hasValidMoves() && tiles.length > 0) {
        shuffleBoard();
    }
}

// ==================== 连线检测 ====================
// Check if two tiles can be connected with at most 2 turns (3 line segments)
function canConnect(r1, c1, r2, c2) {
    if (r1 === r2 && c1 === c2) return false;
    if (G.grid[r1][c1] < 0 || G.grid[r2][c2] < 0) return false;
    if (G.grid[r1][c1] !== G.grid[r2][c2]) return false;

    // Try direct line (0 turns)
    if (canLineConnect(r1, c1, r2, c2)) return true;

    // Try 1 turn
    if (canConnect1Turn(r1, c1, r2, c2)) return true;

    // Try 2 turns
    if (canConnect2Turns(r1, c1, r2, c2)) return true;

    return false;
}

// Check if a straight line between two points is clear (no blocking tiles)
function isLineClear(r1, c1, r2, c2) {
    if (r1 === r2) {
        // horizontal
        const minC = Math.min(c1, c2);
        const maxC = Math.max(c1, c2);
        for (let c = minC + 1; c < maxC; c++) {
            if (G.grid[r1][c] >= 0) return false;
        }
        return true;
    }
    if (c1 === c2) {
        // vertical
        const minR = Math.min(r1, r2);
        const maxR = Math.max(r1, r2);
        for (let r = minR + 1; r < maxR; r++) {
            if (G.grid[r][c1] >= 0) return false;
        }
        return true;
    }
    return false;
}

function canLineConnect(r1, c1, r2, c2) {
    if (r1 !== r2 && c1 !== c2) return false;
    return isLineClear(r1, c1, r2, c2);
}

// 1 turn: try corner points
function canConnect1Turn(r1, c1, r2, c2) {
    // Corner at (r1, c2)
    if (G.grid[r1][c2] < 0 && isLineClear(r1, c1, r1, c2) && isLineClear(r1, c2, r2, c2)) {
        return true;
    }
    // Corner at (r2, c1)
    if (G.grid[r2][c1] < 0 && isLineClear(r2, c1, r2, c2) && isLineClear(r1, c1, r2, c1)) {
        return true;
    }
    return false;
}

// 2 turns
function canConnect2Turns(r1, c1, r2, c2) {
    // Try horizontal lines from each point, then connect vertically
    for (let c = -1; c <= COLS; c++) {
        if (c === c1 || c === c2) continue;
        // Line from (r1,c1) to (r1,c), then (r1,c) to (r2,c), then (r2,c) to (r2,c2)
        const p1Empty = (c >= 0 && c < COLS) ? G.grid[r1][c] < 0 : true;
        const p2Empty = (c >= 0 && c < COLS) ? G.grid[r2][c] < 0 : true;
        if (p1Empty && p2Empty) {
            // Check horizontal from (r1,c1) to (r1,c)
            const minC1 = Math.min(c1, c), maxC1 = Math.max(c1, c);
            let clear1 = true;
            for (let cc = minC1 + 1; cc < maxC1; cc++) {
                if (cc >= 0 && cc < COLS && G.grid[r1][cc] >= 0) { clear1 = false; break; }
            }
            if (!clear1) continue;

            // Check vertical from (r1,c) to (r2,c)
            const minR = Math.min(r1, r2), maxR = Math.max(r1, r2);
            let clear2 = true;
            for (let rr = minR + 1; rr < maxR; rr++) {
                if (c >= 0 && c < COLS && G.grid[rr][c] >= 0) { clear2 = false; break; }
            }
            if (!clear2) continue;

            // Check horizontal from (r2,c) to (r2,c2)
            const minC2 = Math.min(c2, c), maxC2 = Math.max(c2, c);
            let clear3 = true;
            for (let cc = minC2 + 1; cc < maxC2; cc++) {
                if (cc >= 0 && cc < COLS && G.grid[r2][cc] >= 0) { clear3 = false; break; }
            }
            if (clear3) return true;
        }
    }

    // Try vertical lines from each point, then connect horizontally
    for (let r = -1; r <= ROWS; r++) {
        if (r === r1 || r === r2) continue;
        const p1Empty = (r >= 0 && r < ROWS) ? G.grid[r][c1] < 0 : true;
        const p2Empty = (r >= 0 && r < ROWS) ? G.grid[r][c2] < 0 : true;
        if (p1Empty && p2Empty) {
            // Check vertical from (r1,c1) to (r,c1)
            const minR1 = Math.min(r1, r), maxR1 = Math.max(r1, r);
            let clear1 = true;
            for (let rr = minR1 + 1; rr < maxR1; rr++) {
                if (rr >= 0 && rr < ROWS && G.grid[rr][c1] >= 0) { clear1 = false; break; }
            }
            if (!clear1) continue;

            // Check horizontal from (r,c1) to (r,c2)
            const minC = Math.min(c1, c2), maxC = Math.max(c1, c2);
            let clear2 = true;
            for (let cc = minC + 1; cc < maxC; cc++) {
                if (r >= 0 && r < ROWS && G.grid[r][cc] >= 0) { clear2 = false; break; }
            }
            if (!clear2) continue;

            // Check vertical from (r,c2) to (r2,c2)
            const minR2 = Math.min(r2, r), maxR2 = Math.max(r2, r);
            let clear3 = true;
            for (let rr = minR2 + 1; rr < maxR2; rr++) {
                if (rr >= 0 && rr < ROWS && G.grid[rr][c2] >= 0) { clear3 = false; break; }
            }
            if (clear3) return true;
        }
    }

    return false;
}

// Get connection path for drawing lines
function getConnectionPath(r1, c1, r2, c2) {
    // Direct
    if (canLineConnect(r1, c1, r2, c2)) {
        return [{r:r1,c:c1},{r:r2,c:c2}];
    }
    // 1 turn at (r1,c2)
    if (G.grid[r1][c2] < 0 && isLineClear(r1, c1, r1, c2) && isLineClear(r1, c2, r2, c2)) {
        return [{r:r1,c:c1},{r:r1,c:c2},{r:r2,c:c2}];
    }
    // 1 turn at (r2,c1)
    if (G.grid[r2][c1] < 0 && isLineClear(r2, c1, r2, c2) && isLineClear(r1, c1, r2, c1)) {
        return [{r:r1,c:c1},{r:r2,c:c1},{r:r2,c:c2}];
    }
    // 2 turns - find one
    for (let c = -1; c <= COLS; c++) {
        if (c === c1 || c === c2) continue;
        const p1Empty = (c >= 0 && c < COLS) ? G.grid[r1][c] < 0 : true;
        const p2Empty = (c >= 0 && c < COLS) ? G.grid[r2][c] < 0 : true;
        if (p1Empty && p2Empty) {
            const minC1 = Math.min(c1, c), maxC1 = Math.max(c1, c);
            let clear1 = true;
            for (let cc = minC1 + 1; cc < maxC1; cc++) {
                if (cc >= 0 && cc < COLS && G.grid[r1][cc] >= 0) { clear1 = false; break; }
            }
            if (!clear1) continue;
            const minR = Math.min(r1, r2), maxR = Math.max(r1, r2);
            let clear2 = true;
            for (let rr = minR + 1; rr < maxR; rr++) {
                if (c >= 0 && c < COLS && G.grid[rr][c] >= 0) { clear2 = false; break; }
            }
            if (!clear2) continue;
            const minC2 = Math.min(c2, c), maxC2 = Math.max(c2, c);
            let clear3 = true;
            for (let cc = minC2 + 1; cc < maxC2; cc++) {
                if (cc >= 0 && cc < COLS && G.grid[r2][cc] >= 0) { clear3 = false; break; }
            }
            if (clear3) return [{r:r1,c:c1},{r:r1,c:c},{r:r2,c:c},{r:r2,c:c2}];
        }
    }
    for (let r = -1; r <= ROWS; r++) {
        if (r === r1 || r === r2) continue;
        const p1Empty = (r >= 0 && r < ROWS) ? G.grid[r][c1] < 0 : true;
        const p2Empty = (r >= 0 && r < ROWS) ? G.grid[r][c2] < 0 : true;
        if (p1Empty && p2Empty) {
            const minR1 = Math.min(r1, r), maxR1 = Math.max(r1, r);
            let clear1 = true;
            for (let rr = minR1 + 1; rr < maxR1; rr++) {
                if (rr >= 0 && rr < ROWS && G.grid[rr][c1] >= 0) { clear1 = false; break; }
            }
            if (!clear1) continue;
            const minC = Math.min(c1, c2), maxC = Math.max(c1, c2);
            let clear2 = true;
            for (let cc = minC + 1; cc < maxC; cc++) {
                if (r >= 0 && r < ROWS && G.grid[r][cc] >= 0) { clear2 = false; break; }
            }
            if (!clear2) continue;
            const minR2 = Math.min(r2, r), maxR2 = Math.max(r2, r);
            let clear3 = true;
            for (let rr = minR2 + 1; rr < maxR2; rr++) {
                if (rr >= 0 && rr < ROWS && G.grid[rr][c2] >= 0) { clear3 = false; break; }
            }
            if (clear3) return [{r:r1,c:c1},{r:r,c:c1},{r:r,c:c2},{r:r2,c:c2}];
        }
    }
    return [{r:r1,c:c1},{r:r2,c:c2}];
}

function hasValidMoves() {
    for (let r1 = 0; r1 < ROWS; r1++) {
        for (let c1 = 0; c1 < COLS; c1++) {
            if (G.grid[r1][c1] < 0) continue;
            for (let r2 = r1; r2 < ROWS; r2++) {
                const startC = (r2 === r1) ? c1 + 1 : 0;
                for (let c2 = startC; c2 < COLS; c2++) {
                    if (G.grid[r2][c2] < 0) continue;
                    if (G.grid[r1][c1] === G.grid[r2][c2] && canConnect(r1, c1, r2, c2)) {
                        return true;
                    }
                }
            }
        }
    }
    return false;
}

function findHint() {
    for (let r1 = 0; r1 < ROWS; r1++) {
        for (let c1 = 0; c1 < COLS; c1++) {
            if (G.grid[r1][c1] < 0) continue;
            for (let r2 = r1; r2 < ROWS; r2++) {
                const startC = (r2 === r1) ? c1 + 1 : 0;
                for (let c2 = startC; c2 < COLS; c2++) {
                    if (G.grid[r2][c2] < 0) continue;
                    if (G.grid[r1][c1] === G.grid[r2][c2] && canConnect(r1, c1, r2, c2)) {
                        return [{r:r1,c:c1},{r:r2,c:c2}];
                    }
                }
            }
        }
    }
    return null;
}

// ==================== 粒子系统 ====================
function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 3;
        G.particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1.0,
            decay: 0.015 + Math.random() * 0.02,
            size: 2 + Math.random() * 4,
            color: color
        });
    }
}

function updateParticles() {
    for (let i = G.particles.length - 1; i >= 0; i--) {
        const p = G.particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.05; // gravity
        p.life -= p.decay;
        if (p.life <= 0) G.particles.splice(i, 1);
    }
}

// ==================== 布局计算 ====================
function getLayout() {
    const w = canvas.width;
    const h = canvas.height;
    const isPortrait = h > w;
    const headerH = isPortrait ? 100 : 70;
    const padding = isPortrait ? 10 : 15;

    const availW = w - padding * 2;
    const availH = h - headerH - padding * 2;

    const cellSize = Math.min(
        Math.floor(availW / COLS),
        Math.floor(availH / ROWS),
        isPortrait ? 65 : 80
    );

    const gridW = cellSize * COLS;
    const gridH = cellSize * ROWS;
    const offsetX = Math.floor((w - gridW) / 2);
    const offsetY = headerH + Math.floor((h - headerH - gridH) / 2);

    return { cellSize, offsetX, offsetY, headerH, w, h, isPortrait };
}

function getCellCenter(row, col) {
    const L = getLayout();
    return {
        x: L.offsetX + col * L.cellSize + L.cellSize / 2,
        y: L.offsetY + row * L.cellSize + L.cellSize / 2
    };
}

function getCellFromPos(px, py) {
    const L = getLayout();
    const col = Math.floor((px - L.offsetX) / L.cellSize);
    const row = Math.floor((py - L.offsetY) / L.cellSize);
    if (row >= 0 && row < ROWS && col >= 0 && col < COLS) {
        return { row, col };
    }
    return null;
}

// ==================== 输入处理 ====================
let touchStartPos = null;
let clickPos = null;

function handleInput(x, y) {
    if (G.state === STATE.MENU) {
        const L = getLayout();
        const btnX = L.w / 2;
        const btnY = L.h * 0.58;
        const btnW = 200;
        const btnH = 55;
        if (x > btnX - btnW/2 && x < btnX + btnW/2 && y > btnY - btnH/2 && y < btnY + btnH/2) {
            startGame();
        }
        return;
    }

    if (G.state === STATE.GAMEOVER) {
        const L = getLayout();
        const btnX = L.w / 2;
        const btnY = L.h * 0.6;
        if (x > btnX - 100 && x < btnX + 100 && y > btnY - 25 && y < btnY + 25) {
            startGame();
        }
        return;
    }

    if (G.state === STATE.LEVEL_CLEAR) {
        const L = getLayout();
        const btnX = L.w / 2;
        const btnY = L.h * 0.62;
        if (x > btnX - 100 && x < btnX + 100 && y > btnY - 25 && y < btnY + 25) {
            nextLevel();
        }
        return;
    }

    if (G.state === STATE.PAUSED) {
        // resume
        G.state = STATE.PLAYING;
        return;
    }

    if (G.state !== STATE.PLAYING) return;

    const cell = getCellFromPos(x, y);
    if (!cell) return;

    const { row, col } = cell;
    if (G.grid[row][col] < 0) return;

    if (G.selected === null) {
        G.selected = { row, col };
        G.hintTiles = null;
    } else {
        if (G.selected.row === row && G.selected.col === col) {
            G.selected = null;
            return;
        }

        if (canConnect(G.selected.row, G.selected.col, row, col)) {
            // Match found!
            const r1 = G.selected.row, c1 = G.selected.col;
            const radIdx = G.grid[r1][c1];
            const rad = RADICALS[radIdx];

            // Store connection path for animation
            G.matchPath = getConnectionPath(r1, c1, row, col);
            G.matchPathTimer = 30;

            // Remove tiles
            const p1 = getCellCenter(r1, c1);
            const p2 = getCellCenter(row, col);
            spawnParticles(p1.x, p1.y, rad.color, 12);
            spawnParticles(p2.x, p2.y, rad.color, 12);

            G.grid[r1][c1] = -1;
            G.grid[row][col] = -1;
            G.selected = null;
            G.matched = [{r:r1,c:c1},{r:row,c:col}];

            // Score
            G.combo++;
            if (G.combo > G.maxCombo) G.maxCombo = G.combo;
            const comboBonus = Math.floor(G.combo / 3);
            const points = 10 + comboBonus * 5;
            G.score += points;
            G.moves++;

            // Combo display
            if (G.combo >= 3) {
                G.comboDisplay = 60;
                G.comboText = G.combo + '连击! +' + points;
            }

            // Time bonus
            G.timeLeft = Math.min(G.timeLeft + 3, G.matchTime + 30);

            // Check if board is empty
            let allEmpty = true;
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (G.grid[r][c] >= 0) { allEmpty = false; break; }
                }
                if (!allEmpty) break;
            }

            if (allEmpty) {
                G.state = STATE.LEVEL_CLEAR;
                G.clearAnim = 0;
            } else if (!hasValidMoves()) {
                // Shuffle if no moves
                G.shuffling = true;
                G.shuffleAnim = 30;
                setTimeout(() => {
                    shuffleBoard();
                    G.shuffling = false;
                }, 500);
            }
        } else {
            // No match - select new tile
            G.selected = { row, col };
            G.hintTiles = null;
        }
    }
}

function startGame() {
    initGame();
    G.state = STATE.PLAYING;
    G.matchTime = 60 + (G.level - 1) * 10;
    G.timeLeft = G.matchTime;
    generateBoard(G.level);
}

function nextLevel() {
    G.level++;
    G.state = STATE.PLAYING;
    G.matchTime = 60 + (G.level - 1) * 10;
    G.timeLeft = G.matchTime;
    G.combo = 0;
    G.selected = null;
    G.matched = [];
    G.hintTiles = null;
    generateBoard(G.level);
}

// ==================== 游戏更新 ====================
function update() {
    if (G.state === STATE.MENU) {
        G.menuAnim += 0.02;
    }

    if (G.state === STATE.PLAYING) {
        G.timer++;
        if (G.timer >= 60) {
            G.timer = 0;
            G.timeLeft--;
            if (G.timeLeft <= 0) {
                G.state = STATE.GAMEOVER;
                G.gameOverAnim = 0;
                if (G.score > highScore) {
                    highScore = G.score;
                    saveHighScore();
                }
            }
        }

        // Hint system
        G.hintTimer++;
        if (G.hintTimer > 300 && !G.hintTiles && G.selected === null) {
            G.hintTiles = findHint();
            G.hintTimer = 0;
        }

        // Combo display decay
        if (G.comboDisplay > 0) G.comboDisplay--;

        // Match path animation
        if (G.matchPathTimer > 0) G.matchPathTimer--;

        // Reset combo after a delay if no new match
        if (G.combo > 0 && G.comboDisplay <= 0 && G.matchPathTimer <= 0) {
            // combo stays until next miss or timeout
        }
    }

    if (G.state === STATE.LEVEL_CLEAR) {
        G.clearAnim += 0.02;
    }

    if (G.state === STATE.GAMEOVER) {
        G.gameOverAnim = Math.min(G.gameOverAnim + 0.03, 1);
    }

    updateParticles();
}

    grad.addColorStop(0.5, '#16213e');
    grad.addColorStop(1, '#0f3460');

    ctx.fillRect(0, 0, w, h);
}

function drawGrid() {
    const L = getLayout();

    // Grid background
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    roundRect(ctx, L.offsetX - 5, L.offsetY - 5, L.cellSize * COLS + 10, L.cellSize * ROWS + 10, 12);
    ctx.fill();

    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            const idx = G.grid[r][c];
            if (idx < 0) continue;

            const rad = RADICALS[idx];
            const x = L.offsetX + c * L.cellSize;
            const y = L.offsetY + r * L.cellSize;
            const cx = x + L.cellSize / 2;
            const cy = y + L.cellSize / 2;

            // Check if selected
            const isSelected = G.selected && G.selected.row === r && G.selected.col === c;

            // Check if hint
            const isHint = G.hintTiles && (
                (G.hintTiles[0].r === r && G.hintTiles[0].c === c) ||
                (G.hintTiles[1].r === r && G.hintTiles[1].c === c)
            );

            // Tile background
            const tileGrad = ctx.createLinearGradient(x, y, x + L.cellSize, y + L.cellSize);
            tileGrad.addColorStop(0, isSelected ? 'rgba(255,215,0,0.35)' : 'rgba(255,255,255,0.12)');
            tileGrad.addColorStop(1, isSelected ? 'rgba(255,215,0,0.15)' : 'rgba(255,255,255,0.05)');
            ctx.fillStyle = tileGrad;
            roundRect(ctx, x + 2, y + 2, L.cellSize - 4, L.cellSize - 4, 8);
            ctx.fill();

            // Border
            if (isSelected) {
                ctx.strokeStyle = '#FFD700';
                ctx.lineWidth = 2.5;
            } else if (isHint && G.hintTimer > 300) {
                const flash = Math.sin(Date.now() / 200) * 0.5 + 0.5;
                ctx.strokeStyle = `rgba(78,205,196,${flash * 0.8})`;
                ctx.lineWidth = 2;
            } else {
                ctx.strokeStyle = 'rgba(255,255,255,0.15)';
                ctx.lineWidth = 1;
            }
            roundRect(ctx, x + 2, y + 2, L.cellSize - 4, L.cellSize - 4, 8);
            ctx.stroke();

            // Radical character
            const charSize = Math.floor(L.cellSize * 0.45);
            ctx.font = 'bold ' + charSize + 'px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = rad.color;
            ctx.fillText(rad.char, cx, cy - 4);

            // Radical name (small)
            const nameSize = Math.max(9, Math.floor(L.cellSize * 0.14));
            ctx.font = nameSize + 'px sans-serif';
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.fillText(rad.name, cx, cy + charSize * 0.4);
        }
    }
}

function drawMatchPath() {
    if (!G.matchPath || G.matchPathTimer <= 0) return;

    const L = getLayout();
    const alpha = G.matchPathTimer / 30;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = '#FFD700';
    ctx.lineWidth = 3;
    ctx.shadowColor = '#FFD700';
    ctx.shadowBlur = 10;
    ctx.setLineDash([8, 4]);

    ctx.beginPath();
    for (let i = 0; i < G.matchPath.length; i++) {
        const p = G.matchPath[i];
        // Convert grid coords to pixel coords (extend to edges for out-of-bounds)
        const px = L.offsetX + p.c * L.cellSize + L.cellSize / 2;
        const py = L.offsetY + p.r * L.cellSize + L.cellSize / 2;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
}

function drawParticles() {
    for (const p of G.particles) {
        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 5;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

function drawComboDisplay() {
    if (G.comboDisplay <= 0) return;

    const L = getLayout();
    const alpha = G.comboDisplay / 60;
    const scale = 1 + (1 - alpha) * 0.5;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const cx = L.w / 2;
    const cy = L.offsetY - 30;

    ctx.font = 'bold ' + (28 * scale) + 'px sans-serif';
    ctx.fillStyle = '#FF6B6B';
    ctx.shadowColor = '#FF6B6B';
    ctx.shadowBlur = 15;
    ctx.fillText(G.comboText, cx, cy);

    ctx.restore();
}

function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (G.state === STATE.MENU) {
        drawMenu();
        return;
    }

    drawGradientBg();
    drawHeader();
    drawGrid();
    drawMatchPath();
    drawParticles();
    drawComboDisplay();

    if (G.state === STATE.PAUSED) drawPauseScreen();
    if (G.state === STATE.LEVEL_CLEAR) drawLevelClear();
    if (G.state === STATE.GAMEOVER) drawGameOver();
}

// ==================== 工具函数 ====================
function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

// ==================== 事件绑定 ====================
canvas.addEventListener('click', function(e) {
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (canvas.width / rect.width);
    const y = (e.clientY - rect.top) * (canvas.height / rect.height);
    handleInput(x, y);
});

canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    const x = (touch.clientX - rect.left) * (canvas.width / rect.width);
    const y = (touch.clientY - rect.top) * (canvas.height / rect.height);
    handleInput(x, y);
}, { passive: false });

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
        if (G.state === STATE.PLAYING) {
            G.state = STATE.PAUSED;
        } else if (G.state === STATE.PAUSED) {
            G.state = STATE.PLAYING;
        }
    }
    if (e.key === ' ' || e.key === 'Enter') {
        if (G.state === STATE.MENU) {
            startGame();
        } else if (G.state === STATE.GAMEOVER) {
            startGame();
        } else if (G.state === STATE.LEVEL_CLEAR) {
            nextLevel();
        } else if (G.state === STATE.PAUSED) {
            G.state = STATE.PLAYING;
        }
    }
    // Hint with H key
    if ((e.key === 'h' || e.key === 'H') && G.state === STATE.PLAYING) {
        G.hintTiles = findHint();
        G.hintTimer = 0;
    }
});

// ==================== 主循环 ====================
function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
}

// ==================== 启动 ====================
initGame();
gameLoop();
