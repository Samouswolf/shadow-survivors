<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>跳一跳</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#f5f5f5;font-family:'Microsoft YaHei',sans-serif}
canvas{display:block;width:100%;height:100%}
#scoreDisplay{position:absolute;top:20px;left:50%;transform:translateX(-50%);font-size:32px;font-weight:bold;color:#333;z-index:10}
#powerBar{position:absolute;bottom:120px;left:50%;transform:translateX(-50%);width:200px;height:20px;background:rgba(0,0,0,.2);border-radius:10px;overflow:hidden;z-index:10;display:none}
#powerFill{height:100%;width:0%;background:linear-gradient(90deg,#4CAF50,#FFC107,#F44336);transition:width .05s}
#instruction{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:10;font-size:18px;color:#666}
#gameOver{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:20;background:rgba(255,255,255,.95);padding:30px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.2);display:none}
#gameOver h2{font-size:28px;color:#333;margin-bottom:15px}
#finalScore{font-size:22px;color:#666;margin-bottom:20px}
#restartBtn{padding:15px 40px;font-size:18px;font-weight:bold;color:#fff;background:#4CAF50;border:none;border-radius:25px;cursor:pointer;transition:all .3s}
#restartBtn:hover{background:#45a049;transform:scale(1.05)}
</style>
<style>
/* 游戏工坊广告系统 */
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);height:90px;max-height:90px;overflow:hidden;contain:layout style paint;pointer-events:none!important}.ad-banner-container,.ad-banner-container *{pointer-events:none!important}.ad-banner-container iframe{max-height:90px;pointer-events:none!important}
.ad-banner-container iframe{max-width:100%}
.ad-label{position:absolute;top:1px;right:6px;font:9px "Microsoft YaHei",sans-serif;color:rgba(255,255,255,.35)}
.sponsor-btn{position:fixed;top:44px;right:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:3px 9px;border-radius:10px;font:11px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .qr-row{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.sponsor-panel .qr-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px;text-align:center;min-width:140px}
.sponsor-panel .qr-card .qr-icon{font-size:48px;margin-bottom:6px}
.sponsor-panel .qr-card .qr-label{color:#ccc;font:13px "Microsoft YaHei",sans-serif}
.sponsor-panel .qr-card .qr-hint{color:#888;font:11px "Microsoft YaHei",sans-serif;margin-top:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.interstitial-ad .ad-content{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;text-align:center;min-width:280px;max-width:400px}
.interstitial-ad .ad-content p{color:#aaa;font:14px "Microsoft YaHei",sans-serif;margin-bottom:12px}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="scoreDisplay">0</div>
<div id="powerBar"><div id="powerFill"></div></div>
<div id="instruction">按住蓄力，松开跳跃</div>
<div id="gameOver">
<h2>游戏结束</h2>
<div id="finalScore">得分: 0</div>
<button id="restartBtn">重新开始</button>
</div>

<!-- 广告系统 -->
<div class="ad-banner-container" id="adBanner"><div class="ad-label">广告</div><div id="adSlot" style="width:728px;max-width:100%;height:90px;display:flex;align-items:center;justify-content:center;color:#888;font:12px 'Microsoft YaHei',sans-serif">广告加载中...</div></div>
<button class="sponsor-btn" id="sponsorBtn">☕ 赞助</button>
<div class="sponsor-panel" id="sponsorPanel">
<h2>💛 支持开发者</h2>
<div style="color:#aaa;font:14px 'Microsoft YaHei',sans-serif;text-align:center;max-width:280px">如果你喜欢这个游戏，请开发者喝杯咖啡吧 ☕<br>每一份支持都是持续更新的动力！</div>
<div class="qr-row">
<div class="qr-card"><div class="qr-icon">💚</div><div class="qr-label">微信赞赏</div><div class="qr-hint">打开微信扫一扫</div></div>
<div class="qr-card"><div class="qr-icon">💙</div><div class="qr-label">支付宝支持</div><div class="qr-hint">打开支付宝扫一扫</div></div>
</div>
<button class="sponsor-close" id="sponsorClose">关闭</button>
</div>
<div class="interstitial-ad" id="interstitialAd">
<div class="ad-content">
<p>📢 赞助商广告</p>
<div id="interstitialAdSlot" style="min-height:250px;display:flex;align-items:center;justify-content:center;color:#888;font:13px 'Microsoft YaHei',sans-serif">广告加载中...</div>
</div>
<button class="skip-btn" id="skipInterstitial">跳过广告 ▶</button>
</div>

<script>
(function(){
// Canvas设置
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// 响应式尺寸
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resize();
window.addEventListener('resize', resize);

// 游戏配置
const CFG = {
    GRAVITY: 0.4,
    MAX_POWER: 100,
    POWER_RATE: 1.5,
    JUMP_FACTOR: 0.15,
    PLATFORM_MIN_W: 60,
    PLATFORM_MAX_W: 120,
    PLATFORM_HEIGHT: 20,
    PLATFORM_GAP_MIN: 80,
    PLATFORM_GAP_MAX: 200,
    PLAYER_SIZE: 30
};

// 游戏状态
let gameState = 'waiting'; // waiting, charging, jumping, falling, gameOver
let score = 0;
let power = 0;
let isCharging = false;

// 玩家
const player = {
    x: 100,
    y: canvas.height - 100,
    vx: 0,
    vy: 0,
    squash: 1
};

// 平台
let platforms = [];
let currentPlatform = 0;

// 相机偏移
let cameraX = 0;

// DOM元素
const scoreDisplay = document.getElementById('scoreDisplay');
const powerBar = document.getElementById('powerBar');
const powerFill = document.getElementById('powerFill');
const instruction = document.getElementById('instruction');
const gameOverDiv = document.getElementById('gameOver');
const finalScoreDiv = document.getElementById('finalScore');
const restartBtn = document.getElementById('restartBtn');

// 初始化游戏
function initGame() {
    platforms = [];
    
    // 生成初始平台
    let x = 50;
    for (let i = 0; i < 10; i++) {
        const width = CFG.PLATFORM_MIN_W + Math.random() * (CFG.PLATFORM_MAX_W - CFG.PLATFORM_MIN_W);
        platforms.push({
            x: x,
            y: canvas.height - 80,
            width: width,
            height: CFG.PLATFORM_HEIGHT,
            color: getRandomColor()
        });
        
        x += width + CFG.PLATFORM_GAP_MIN + Math.random() * (CFG.PLATFORM_GAP_MAX - CFG.PLATFORM_GAP_MIN);
    }
    
    player.x = platforms[0].x + platforms[0].width / 2;
    player.y = platforms[0].y - CFG.PLAYER_SIZE;
    player.vx = 0;
    player.vy = 0;
    player.squash = 1;
    
    currentPlatform = 0;
    score = 0;
    power = 0;
    cameraX = 0;
    gameState = 'waiting';
    
    scoreDisplay.textContent = '0';
    powerBar.style.display = 'none';
    instruction.style.display = 'block';
    gameOverDiv.style.display = 'none';
}

// 随机颜色
function getRandomColor() {
    const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFEAA7', '#DDA0DD', '#FF6B9D', '#C7CEEA'];
    return colors[Math.floor(Math.random() * colors.length)];
}

// 开始蓄力
function startCharge() {
    if (gameState !== 'waiting') return;
    
    gameState = 'charging';
    isCharging = true;
    power = 0;
    powerBar.style.display = 'block';
    instruction.style.display = 'none';
}

// 结束蓄力，跳跃
function endCharge() {
    if (gameState !== 'charging') return;
    
    isCharging = false;
    gameState = 'jumping';
    
    // 计算跳跃速度
    player.vx = power * CFG.JUMP_FACTOR;
    player.vy = -power * CFG.JUMP_FACTOR * 0.8;
    
    powerBar.style.display = 'none';
}

// 更新游戏
function update() {
    // 蓄力
    if (gameState === 'charging' && isCharging) {
        power = Math.min(power + CFG.POWER_RATE, CFG.MAX_POWER);
        powerFill.style.width = `${power}%`;
        player.squash = 1 - power / CFG.MAX_POWER * 0.3;
    }
    
    // 跳跃物理
    if (gameState === 'jumping' || gameState === 'falling') {
        player.vy += CFG.GRAVITY;
        player.x += player.vx;
        player.y += player.vy;
        
        // 恢复形状
        if (gameState === 'jumping') {
            player.squash = Math.min(1, player.squash + 0.05);
        }
        
        // 检测落地
        if (player.vy > 0) {
            gameState = 'falling';
            
            for (let i = currentPlatform; i < platforms.length; i++) {
                const p = platforms[i];
                if (player.x > p.x && player.x < p.x + p.width &&
                    player.y + CFG.PLAYER_SIZE > p.y && player.y + CFG.PLAYER_SIZE < p.y + p.height + 20) {
                    // 成功落地
                    player.y = p.y - CFG.PLAYER_SIZE;
                    player.vx = 0;
                    player.vy = 0;
                    player.squash = 0.7;
                    
                    // 计分
                    if (i > currentPlatform) {
                        score += i - currentPlatform;
                        scoreDisplay.textContent = score;
                        currentPlatform = i;
                        
                        // 生成新平台
                        if (platforms.length - currentPlatform < 5) {
                            const lastP = platforms[platforms.length - 1];
                            const width = CFG.PLATFORM_MIN_W + Math.random() * (CFG.PLATFORM_MAX_W - CFG.PLATFORM_MIN_W);
                            platforms.push({
                                x: lastP.x + lastP.width + CFG.PLATFORM_GAP_MIN + Math.random() * (CFG.PLATFORM_GAP_MAX - CFG.PLATFORM_GAP_MIN),
                                y: canvas.height - 80,
                                width: width,
                                height: CFG.PLATFORM_HEIGHT,
                                color: getRandomColor()
                            });
                        }
                    }
                    
                    gameState = 'waiting';
                    return;
                }
            }
            
            // 掉落失败
            if (player.y > canvas.height) {
                gameOver();
            }
        }
    }
    
    // 相机跟随
    const targetCameraX = player.x - canvas.width / 3;
    cameraX = Math.max(0, targetCameraX);
}

// 绘制游戏
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // 背景
    ctx.fillStyle = '#f5f5f5';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // 平台
    for (const p of platforms) {
        const screenX = p.x - cameraX;
        if (screenX > -p.width && screenX < canvas.width) {
            ctx.fillStyle = p.color;
            ctx.fillRect(screenX, p.y, p.width, p.height);
            
            // 阴影
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            ctx.fillRect(screenX, p.y + p.height, p.width, 5);
        }
    }
    
    // 玩家
    const screenX = player.x - cameraX;
    ctx.save();
    ctx.translate(screenX, player.y + CFG.PLAYER_SIZE);
    ctx.scale(1, player.squash);
    ctx.translate(0, -CFG.PLAYER_SIZE);
    
    // 身体
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.arc(0, CFG.PLAYER_SIZE / 2, CFG.PLAYER_SIZE / 2, 0, Math.PI * 2);
    ctx.fill();
    
    // 眼睛
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(-5, CFG.PLAYER_SIZE / 2 - 5, 4, 0, Math.PI * 2);
    ctx.arc(5, CFG.PLAYER_SIZE / 2 - 5, 4, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(-5, CFG.PLAYER_SIZE / 2 - 5, 2, 0, Math.PI * 2);
    ctx.arc(5, CFG.PLAYER_SIZE / 2 - 5, 2, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.restore();
}

// 游戏结束
function gameOver() {
    gameState = 'gameOver';
    gameOverDiv.style.display = 'block';
    finalScoreDiv.textContent = `得分: ${score}`;
    showInterstitialAd();
}

// 游戏循环
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

// 事件监听
canvas.addEventListener('mousedown', startCharge);
canvas.addEventListener('mouseup', endCharge);
canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    startCharge();
});
canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    endCharge();
});
restartBtn.addEventListener('click', initGame);

// 初始化
initGame();
gameLoop();
})();

// 广告系统
(function(){
var sb=document.getElementById('sponsorBtn'),sp=document.getElementById('sponsorPanel'),sc=document.getElementById('sponsorClose');
if(sb&&sp){sb.onclick=function(){sp.style.display='flex'};if(sc)sc.onclick=function(){sp.style.display='none'}}
var ia=document.getElementById('interstitialAd'),si=document.getElementById('skipInterstitial');
if(ia&&si){si.onclick=function(){ia.style.display='none'}}
window.showInterstitialAd=function(){if(ia)ia.style.display='flex'};
})();
</script>
</body>
</html>
