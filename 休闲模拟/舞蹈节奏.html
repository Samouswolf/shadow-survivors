<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>舞蹈节奏</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #ff6b6b 0%, #4ecdc4 100%); min-height: 100vh; overflow: hidden; }
        .game-container { width: 100%; height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.2); border-radius: 15px; margin-bottom: 10px; }
        .score-display { color: #fff; font-size: 24px; font-weight: bold; }
        .combo-display { color: #ffd700; font-size: 16px; }
        
        .stage { flex: 1; background: rgba(0,0,0,0.3); border-radius: 20px; position: relative; overflow: hidden; }
        
        .dancer { position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); width: 80px; height: 80px; background: #3b82f6; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; transition: transform 0.2s; }
        .dancer.dancing { animation: danceMove 0.3s ease; }
        
        .arrow { position: absolute; width: 60px; height: 60px; background: rgba(255,255,255,0.3); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 32px; }
        .arrow.up { top: 20%; left: 50%; transform: translateX(-50%); }
        .arrow.down { bottom: 20%; left: 50%; transform: translateX(-50%); }
        .arrow.left { left: 20%; top: 50%; transform: translateY(-50%); }
        .arrow.right { right: 20%; top: 50%; transform: translateY(-50%); }
        .arrow.active { background: #ffd700; animation: arrowPulse 0.3s ease; }
        
        .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
        .btn { height: 60px; border: none; border-radius: 10px; font-size: 24px; cursor: pointer; transition: transform 0.1s; }
        .btn:active { transform: scale(0.9); }
        .btn-up { background: linear-gradient(135deg, #22c55e, #16a34a); color: #fff; grid-column: 2; }
        .btn-left { background: linear-gradient(135deg, #3b82f6, #2563eb); color: #fff; }
        .btn-right { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; }
        .btn-down { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #fff; grid-column: 2; }
        
        .stats { display: flex; justify-content: space-around; padding: 10px; background: rgba(255,255,255,0.2); border-radius: 15px; margin-top: 10px; }
        .stat-item { text-align: center; color: #fff; }
        .stat-value { font-size: 20px; font-weight: bold; }
        .stat-label { font-size: 12px; opacity: 0.7; }
        
        .message { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); color: #fff; padding: 20px 40px; border-radius: 15px; font-size: 20px; display: none; z-index: 100; }
        .message.show { display: block; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 10px; font-size: 14px; }
        
        @keyframes danceMove {
            0% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.2); }
            100% { transform: translateX(-50%) scale(1); }
        }
        
        @keyframes arrowPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    /* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}

/* [/BATCH-FIX:responsive-css] */
/* [BATCH-FIX:ad-components-css] */

.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}

<script src="../game_core.js"></script>
<script>
        const DIRECTIONS = ['up', 'down', 'left', 'right'];
        const BEAT_INTERVAL = 800;
        
        let score = 0;
        let combo = 0;
        let hits = 0;
        let misses = 0;
        let currentDirection = null;
        let beatLoop = null;
        
        function loadData() {
            const saved = GameCore.storage.get('dance_rhythm_data', null);
            if (saved) {
                score = saved.score;
            }
            updateUI();
            startBeat();
        }
        
        function saveData() {
            GameCore.storage.set('dance_rhythm_data', { score });
        }
        
        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('combo').textContent = combo;
            document.getElementById('hits').textContent = hits;
            document.getElementById('misses').textContent = misses;
        }
        
        function startBeat() {
            beatLoop = setInterval(() => {
                // Clear previous direction
                DIRECTIONS.forEach(dir => {
                    document.getElementById('arrow' + dir).classList.remove('active');
                });
                
                // Set new direction
                currentDirection = DIRECTIONS[Math.floor(Math.random() * DIRECTIONS.length)];
                document.getElementById('arrow' + currentDirection).classList.add('active');
            }, BEAT_INTERVAL);
        }
        
        function hitDirection(direction) {
            const dancer = document.getElementById('dancer');
            dancer.classList.add('dancing');
            setTimeout(() => dancer.classList.remove('dancing'), 300);
            
            if (direction === currentDirection) {
                hits++;
                combo++;
                score += 10 + combo * 2;
                showMessage('✨ 完美！');
                
                // Clear arrow
                document.getElementById('arrow' + direction).classList.remove('active');
                currentDirection = null;
            } else {
                misses++;
                combo = 0;
                showMessage('❌ 错误');
            }
            
            updateUI();
            saveData();
        }
        
        function showMessage(msg) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 500);
        }
        
        document.getElementById('btnUp').addEventListener('click', () => hitDirection('up'));
        document.getElementById('btnDown').addEventListener('click', () => hitDirection('down'));
        document.getElementById('btnLeft').addEventListener('click', () => hitDirection('left'));
        document.getElementById('btnRight').addEventListener('click', () => hitDirection('right'));
        
        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') hitDirection('up');
            if (e.key === 'ArrowDown') hitDirection('down');
            if (e.key === 'ArrowLeft') hitDirection('left');
            if (e.key === 'ArrowRight') hitDirection('right');
        });
        
        GameCore.init({ highScore: 'dance_rhythm' });
        loadData();
    </script>

<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>
<!-- [/BATCH-FIX:responsive-js] -->
<!-- [BATCH-FIX:touch-support] -->
<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>
<!-- [/BATCH-FIX:touch-support] -->

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
