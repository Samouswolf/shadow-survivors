<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI学习宠物</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; }
        
        .game-container { width: 100%; max-width: 500px; background: #fff; border-radius: 25px; padding: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.1); }
        
        .header { text-align: center; margin-bottom: 20px; }
        .title { font-size: 28px; font-weight: bold; color: #ff6b6b; }
        
        .pet-display { text-align: center; margin-bottom: 30px; }
        .pet { font-size: 120px; transition: transform 0.3s; }
        .pet.happy { animation: bounce 0.5s infinite; }
        .pet.sad { filter: grayscale(0.5); }
        .pet.sleeping { opacity: 0.7; }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .status-bar { display: flex; justify-content: space-around; margin-bottom: 20px; }
        .status { text-align: center; }
        .status-icon { font-size: 24px; margin-bottom: 5px; }
        .status-bar-inner { width: 80px; height: 10px; background: #eee; border-radius: 5px; overflow: hidden; }
        .status-fill { height: 100%; border-radius: 5px; }
        .status-fill.hunger { background: linear-gradient(90deg, #ff6b6b, #ffa502); }
        .status-fill.happiness { background: linear-gradient(90deg, #4ecdc4, #48c78e); }
        .status-fill.energy { background: linear-gradient(90deg, #667eea, #764ba2); }
        
        .ai-section { background: rgba(245,87,108,0.1); border-radius: 15px; padding: 20px; margin-bottom: 20px; }
        .ai-title { font-size: 16px; font-weight: bold; color: #f5576c; margin-bottom: 10px; }
        .ai-status { font-size: 14px; color: #666; }
        .ai-actions { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
        .ai-action-tag { background: rgba(245,87,108,0.2); padding: 5px 10px; border-radius: 15px; font-size: 12px; color: #f5576c; }
        
        .controls { display: flex; justify-content: center; gap: 15px; }
        .action-btn { width: 70px; height: 70px; border-radius: 50%; border: none; font-size: 30px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        .action-btn.feed { background: linear-gradient(135deg, #ff6b6b, #ffa502); color: #fff; }
        .action-btn.play { background: linear-gradient(135deg, #4ecdc4, #48c78e); color: #fff; }
        .action-btn.sleep { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
        .action-btn:hover { transform: scale(1.1); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 30px; font-size: 14px; }
    </style>
</head>
<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="title">🐾 AI学习宠物</div>
        </div>
        
        <div class="pet-display">
            <div class="pet" id="pet">🐱</div>
        </div>
        
        <div class="status-bar">
            <div class="status">
                <div class="status-icon">🍖</div>
                <div class="status-bar-inner">
                    <div class="status-fill hunger" id="hungerBar" style="width: 70%;"></div>
                </div>
            </div>
            <div class="status">
                <div class="status-icon">❤️</div>
                <div class="status-bar-inner">
                    <div class="status-fill happiness" id="happinessBar" style="width: 80%;"></div>
                </div>
            </div>
            <div class="status">
                <div class="status-icon">💤</div>
                <div class="status-bar-inner">
                    <div class="status-fill energy" id="energyBar" style="width: 60%;"></div>
                </div>
            </div>
        </div>
        
        <div class="ai-section">
            <div class="ai-title">🤖 AI学习状态</div>
            <div class="ai-status" id="aiStatus">AI正在观察你的照顾模式...</div>
            <div class="ai-actions" id="aiActions"></div>
        </div>
        
        <div class="controls">
            <button class="action-btn feed" onclick="action('feed')">🍖</button>
            <button class="action-btn play" onclick="action('play')">🎾</button>
            <button class="action-btn sleep" onclick="action('sleep')">💤</button>
        </div>
    </div>
    
    <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <script>
        const GAME_NAME = 'AI学习宠物';
        GameCore.init({ highScore: GAME_NAME });
        
        let hunger = 70;
        let happiness = 80;
        let energy = 60;
        
        const actions = {
            feed: { icon: '🍖', name: '喂食', hunger: 20, happiness: 5, energy: -5 },
            play: { icon: '🎾', name: '玩耍', hunger: -10, happiness: 25, energy: -15 },
            sleep: { icon: '💤', name: '睡觉', hunger: -5, happiness: -5, energy: 30 }
        };
        
        let actionHistory = [];
        let aiPatterns = {};
        let aiLevel = 0;
        let aiLastAction = null;
        
        function updateStatus() {
            hunger = Math.max(0, Math.min(100, hunger));
            happiness = Math.max(0, Math.min(100, happiness));
            energy = Math.max(0, Math.min(100, energy));
            
            document.getElementById('hungerBar').style.width = hunger + '%';
            document.getElementById('happinessBar').style.width = happiness + '%';
            document.getElementById('energyBar').style.width = energy + '%';
            
            updatePetState();
        }
        
        function updatePetState() {
            const pet = document.getElementById('pet');
            
            if (energy < 30) {
                pet.textContent = '😴';
                pet.className = 'pet sleeping';
            } else if (happiness < 30) {
                pet.textContent = '😿';
                pet.className = 'pet sad';
            } else if (hunger < 30) {
                pet.textContent = '😾';
                pet.className = 'pet sad';
            } else if (happiness > 80 && energy > 70) {
                pet.textContent = '😻';
                pet.className = 'pet happy';
            } else {
                pet.textContent = '🐱';
                pet.className = 'pet';
            }
        }
        
        function getCurrentState() {
            const h = hunger < 30 ? 'low' : hunger < 70 ? 'med' : 'high';
            const ha = happiness < 30 ? 'low' : happiness < 70 ? 'med' : 'high';
            const e = energy < 30 ? 'low' : energy < 70 ? 'med' : 'high';
            return `${h}_${ha}_${e}`;
        }
        
        function learnPattern(action) {
            const state = getCurrentState();
            
            if (!aiPatterns[state]) {
                aiPatterns[state] = {};
            }
            if (!aiPatterns[state][action]) {
                aiPatterns[state][action] = 0;
            }
            aiPatterns[state][action]++;
            
            actionHistory.push({ state, action, time: Date.now() });
            
            if (actionHistory.length > 50) {
                actionHistory.shift();
            }
            
            aiLevel = Math.min(10, Object.keys(aiPatterns).length);
            
            updateAIStatus();
        }
        
        function updateAIStatus() {
            const patterns = Object.keys(aiPatterns).length;
            const actions = actionHistory.length;
            
            let status = '';
            if (aiLevel === 0) {
                status = 'AI正在观察你的照顾模式...';
            } else if (aiLevel < 3) {
                status = `AI已学习 ${patterns} 种状态模式`;
            } else if (aiLevel < 7) {
                status = `AI正在模仿你的照顾风格 (Level ${aiLevel})`;
            } else {
                status = `AI已经精通你的照顾方式！(Level ${aiLevel})`;
            }
            
            document.getElementById('aiStatus').textContent = status;
            
            const recentActions = actionHistory.slice(-5).map(a => actions[a.action].name);
            document.getElementById('aiActions').innerHTML = recentActions.map(a => 
                `<span class="ai-action-tag">${a}</span>`
            ).join('');
        }
        
        function aiTakeAction() {
            if (aiLevel < 2) return;
            
            const state = getCurrentState();
            
            if (aiPatterns[state]) {
                let bestAction = null;
                let bestCount = 0;
                
                Object.keys(aiPatterns[state]).forEach(action => {
                    if (aiPatterns[state][action] > bestCount) {
                        bestCount = aiPatterns[state][action];
                        bestAction = action;
                    }
                });
                
                if (bestAction && bestAction !== aiLastAction && Math.random() < aiLevel * 0.08) {
                    applyAction(bestAction, true);
                    aiLastAction = bestAction;
                    
                    setTimeout(() => {
                        aiLastAction = null;
                    }, 2000);
                }
            }
        }
        
        function applyAction(actionKey, isAI = false) {
            const action = actions[actionKey];
            
            hunger += action.hunger;
            happiness += action.happiness;
            energy += action.energy;
            
            if (!isAI) {
                learnPattern(actionKey);
                
                const bonus = Math.floor((happiness + energy) / 20);
                GameCore.highScore.set(GAME_NAME, bonus * 10);
            } else {
                GameCore.hints.show(`🤖 AI模仿你：${action.name}`);
            }
            
            updateStatus();
        }
        
        function action(actionKey) {
            applyAction(actionKey);
        }
        
        setInterval(() => {
            hunger -= 0.5;
            happiness -= 0.3;
            energy -= 0.4;
            updateStatus();
            
            if (Math.random() < 0.1) {
                aiTakeAction();
            }
        }, 2000);
        
        updateStatus();
        GameCore.touch.enableAllButtons();
    </script>
</body>
</html>
