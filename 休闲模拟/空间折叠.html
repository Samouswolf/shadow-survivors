<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>空间折叠</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; overflow: hidden; color: #fff; }
        .game-container { width: 100%; height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 10px; }
        .stat { display: flex; flex-direction: column; align-items: center; }
        .stat-label { font-size: 12px; opacity: 0.7; }
        .stat-value { font-size: 24px; font-weight: bold; color: #a855f7; }
        
        .game-area { flex: 1; position: relative; background: rgba(0,0,0,0.4); border-radius: 15px; overflow: hidden; }
        #gameCanvas { width: 100%; height: 100%; display: block; }
        
        .fold-indicator { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 10px; font-size: 16px; }
        
        .controls { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
        .btn { padding: 12px 25px; border: none; border-radius: 25px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">关卡</div>
                <div class="stat-value" id="level">1</div>
            </div>
            <div class="stat">
                <div class="stat-label">分数</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">最高</div>
                <div class="stat-value" id="highScore">0</div>
            </div>
        </div>
        
        <div class="game-area">
            <canvas id="gameCanvas"></canvas>
            <div class="fold-indicator" id="foldIndicator">📐 空间: 正常</div>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" id="btnStart">▶️ 开始游戏</button>
        </div>
        
        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const GAME_NAME = '空间折叠';
        GameCore.init({ highScore: GAME_NAME });
        
        let level = 1;
        let score = 0;
        let gameRunning = false;
        let isFolded = false;
        let foldTimer = 0;
        
        let player = { x: 50, y: 300, width: 30, height: 50, vx: 0, vy: 0, onGround: false };
        let platforms = [];
        let portals = [];
        let collectibles = [];
        
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            initLevel();
        }
        
        function initLevel() {
            player.x = 50;
            player.y = canvas.height - 100;
            player.vx = 0;
            player.vy = 0;
            isFolded = false;
            
            platforms = [];
            portals = [];
            collectibles = [];
            
            const platformCount = 4 + level;
            for (let i = 0; i < platformCount; i++) {
                const isLeft = i % 2 === 0;
                platforms.push({
                    x: isLeft ? 50 + i * 50 : canvas.width - 100 - i * 30,
                    y: 100 + Math.random() * 250,
                    width: 80 + Math.random() * 40,
                    height: 15,
                    color: '#4ecdc4'
                });
            }
            
            platforms.push({ x: 0, y: canvas.height - 20, width: canvas.width, height: 20, color: '#4a5568' });
            
            portals.push({
                x: 50,
                y: canvas.height / 2 - 25,
                width: 30,
                height: 50,
                color: '#f5576c',
                targetX: canvas.width - 80
            });
            
            portals.push({
                x: canvas.width - 80,
                y: canvas.height / 2 - 25,
                width: 30,
                height: 50,
                color: '#48c78e',
                targetX: 50
            });
            
            for (let i = 0; i < 3 + level; i++) {
                collectibles.push({
                    x: 100 + i * 200,
                    y: 80 + Math.random() * 150,
                    collected: false
                });
            }
        }
        
        function toggleFold() {
            isFolded = !isFolded;
            foldTimer = 100;
            
            document.getElementById('foldIndicator').textContent = isFolded ? '📐 空间: 折叠' : '📐 空间: 正常';
            
            for (let i = 0; i < 20; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 15,
                    vy: (Math.random() - 0.5) * 15,
                    life: 1,
                    color: isFolded ? '#a855f7' : '#4ecdc4'
                });
            }
        }
        
        function updatePlayer() {
            player.vx *= 0.95;
            player.vy += 0.5;
            
            let onGround = false;
            platforms.forEach(platform => {
                if (player.y + player.height > platform.y &&
                    player.y + player.height < platform.y + platform.height + 10 &&
                    player.x < platform.x + platform.width &&
                    player.x + player.width > platform.x &&
                    player.vy >= 0) {
                    player.y = platform.y - player.height;
                    player.vy = 0;
                    onGround = true;
                }
            });
            player.onGround = onGround;
            
            player.x += player.vx;
            player.y += player.vy;
            
            // 传送门
            portals.forEach(portal => {
                if (player.x < portal.x + portal.width &&
                    player.x + player.width > portal.x &&
                    player.y < portal.y + portal.height &&
                    player.y + player.height > portal.y) {
                    player.x = portal.targetX;
                    
                    for (let i = 0; i < 15; i++) {
                        particles.push({
                            x: player.x,
                            y: player.y,
                            vx: (Math.random() - 0.5) * 8,
                            vy: (Math.random() - 0.5) * 8,
                            life: 1,
                            color: portal.color
                        });
                    }
                }
            });
            
            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
        }
        
        function checkCollisions() {
            collectibles.forEach(c => {
                if (!c.collected) {
                    const dx = player.x + player.width / 2 - c.x;
                    const dy = player.y + player.height / 2 - c.y;
                    if (Math.sqrt(dx * dx + dy * dy) < 30) {
                        c.collected = true;
                        score += 150;
                        
                        for (let i = 0; i < 8; i++) {
                            particles.push({
                                x: c.x,
                                y: c.y,
                                vx: (Math.random() - 0.5) * 5,
                                vy: (Math.random() - 0.5) * 5,
                                life: 1,
                                color: '#ffd700'
                            });
                        }
                    }
                }
            });
            
            if (collectibles.every(c => c.collected)) {
                level++;
                score += level * 500;
                initLevel();
            }
            
            if (player.y > canvas.height + 100) {
                initLevel();
            }
            
            updateStats();
        }
        
        function updateParticles() {
            particles = particles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;
                return p.life > 0;
            });
        }
        
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 空间网格
            ctx.strokeStyle = isFolded ? 'rgba(168, 85, 247, 0.2)' : 'rgba(255,255,255,0.1)';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 40) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
            
            // 空间折叠线
            if (isFolded) {
                ctx.strokeStyle = '#a855f7';
                ctx.lineWidth = 3;
                ctx.setLineDash([10, 10]);
                ctx.beginPath();
                ctx.moveTo(canvas.width / 2, 0);
                ctx.lineTo(canvas.width / 2, canvas.height);
                ctx.stroke();
                ctx.setLineDash([]);
                
                // 折叠效果
                ctx.fillStyle = 'rgba(168, 85, 247, 0.1)';
                ctx.fillRect(canvas.width / 2, 0, canvas.width / 2, canvas.height);
            }
            
            // 平台
            platforms.forEach(platform => {
                ctx.fillStyle = platform.color;
                ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
            });
            
            // 传送门
            portals.forEach(portal => {
                ctx.fillStyle = portal.color;
                ctx.shadowColor = portal.color;
                ctx.shadowBlur = 15;
                ctx.fillRect(portal.x, portal.y, portal.width, portal.height);
                ctx.shadowBlur = 0;
                
                ctx.fillStyle = '#fff';
                ctx.font = '20px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('🌀', portal.x + portal.width / 2, portal.y + portal.height / 2 + 7);
            });
            
            // 收集物
            collectibles.forEach(c => {
                if (!c.collected) {
                    ctx.fillStyle = '#ffd700';
                    ctx.shadowColor = '#ffd700';
                    ctx.shadowBlur = 10;
                    ctx.font = '24px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('⭐', c.x, c.y + 8);
                    ctx.shadowBlur = 0;
                }
            });
            
            // 玩家
            ctx.fillStyle = '#f5576c';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            
            // 粒子
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }
        
        let particles = [];
        
        function updateStats() {
            document.getElementById('level').textContent = level;
            document.getElementById('score').textContent = score;
            document.getElementById('highScore').textContent = GameCore.highScore.get(GAME_NAME);
            
            if (GameCore.highScore.set(GAME_NAME, score)) {
                GameCore.hints.show('新纪录！分数: ' + score);
            }
        }
        
        function gameLoop() {
            draw();
            
            if (gameRunning) {
                updatePlayer();
                checkCollisions();
                updateParticles();
                
                if (foldTimer > 0) foldTimer--;
            }
            
            updateStats();
            requestAnimationFrame(gameLoop);
        }
        
        document.addEventListener('keydown', e => {
            if (!gameRunning) return;
            
            if (e.code === 'ArrowRight' || e.code === 'KeyD') player.vx = 5;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') player.vx = -5;
            if (e.code === 'ArrowUp' || e.code === 'KeyW') {
                if (player.onGround) {
                    player.vy = -12;
                    player.onGround = false;
                }
            }
            if (e.code === 'Space') {
                toggleFold();
            }
        });
        
        document.addEventListener('keyup', e => {
            if (e.code === 'ArrowRight' || e.code === 'KeyD' || e.code === 'ArrowLeft' || e.code === 'KeyA') player.vx = 0;
        });
        
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            if (!gameRunning) return;
            
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            
            if (x < canvas.width / 3) {
                player.vx = -5;
            } else if (x > canvas.width * 2 / 3) {
                player.vx = 5;
            } else {
                if (player.onGround) {
                    player.vy = -12;
                    player.onGround = false;
                }
            }
        }, { passive: false });
        
        canvas.addEventListener('touchend', () => {
            player.vx = 0;
        });
        
        canvas.addEventListener('dblclick', toggleFold);
        
        document.getElementById('btnStart').onclick = () => {
            gameRunning = true;
            level = 1;
            score = 0;
            initLevel();
        };
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        gameLoop();
    </script>
</body>
</html>
