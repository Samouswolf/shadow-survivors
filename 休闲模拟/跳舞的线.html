html, body { width:100%; height:100%; overflow:hidden; background:#000; }

    font:16px 'Segoe UI',sans-serif; color:rgba(255,255,255,0.5);
    margin-bottom:40px; letter-spacing:3px;

.level-btn {
    width:140px; height:160px; border-radius:16px;

    transition:all 0.3s;

    background:rgba(255,255,255,0.12); border-color:rgba(255,255,255,0.5);

    padding:14px 50px; border-radius:30px; font:bold 18px sans-serif;

.start-btn { background:linear-gradient(135deg,#4a90d9,#7b68ee); color:#fff; }
.start-btn:hover { transform:scale(1.05); box-shadow:0 0 25px rgba(74,144,217,0.5); }
.result-title {
    font:bold 48px sans-serif; color:#fff; margin-bottom:10px;
    text-shadow:0 0 20px currentColor;

.result-score { font:22px sans-serif; color:rgba(255,255,255,0.8); margin-bottom:8px; }

.retry-btn { background:#e74c3c; color:#fff; }

// --- Game State ---
var G = {
    state: 'menu',
    levelIdx: 0,
    segIdx: 0,
    progress: 0,
    lineX: 0,
    lineY: 0,
    dirX: 0,
    dirY: -1,
    moveX: 0,
    moveY: -1,

    particles: [],
    decorations: [],

    startTime: 0,
    lastBeatTime: 0,
    beatInterval: 0,
    audioCtx: null,
    audioReady: false
};

// --- Path Helpers ---
function getCoordAtProgress(prog) {
    var rem = prog;
    for (var i = 0; i < LEVELS[G.levelIdx].segments.length; i++) {
        var s = LEVELS[G.levelIdx].segments[i];
        if (rem <= s.len) {
            var px = 0, py = 0;
            for (var j = 0; j < i; j++) {
                px += LEVELS[G.levelIdx].segments[j].dx * LEVELS[G.levelIdx].segments[j].len;
                py += LEVELS[G.levelIdx].segments[j].dy * LEVELS[G.levelIdx].segments[j].len;
            }
            return {
                x: px + s.dx * rem,
                y: py + s.dy * rem
            };
        }
        rem -= s.len;
    }
    var last = LEVELS[G.levelIdx].segments[LEVELS[G.levelIdx].segments.length - 1];
    var fx = 0, fy = 0;
    for (var k = 0; k < LEVELS[G.levelIdx].segments.length; k++) {
        fx += LEVELS[G.levelIdx].segments[k].dx * LEVELS[G.levelIdx].segments[k].len;
        fy += LEVELS[G.levelIdx].segments[k].dy * LEVELS[G.levelIdx].segments[k].len;
    }
    return { x: fx, y: fy };
}

function getSegDir(idx) {
    var lvl = LEVELS[G.levelIdx];
    if (idx < lvl.segments.length) {
        return { x: lvl.segments[idx].dx, y: lvl.segments[idx].dy };
    }
    var last = lvl.segments[lvl.segments.length - 1];
    return { x: last.dx, y: last.dy };
}

// --- Audio System ---
function ensureAudio() {
    if (G.audioCtx) return;
    try {
        G.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        G.audioReady = true;
    } catch (e) {
        G.audioReady = false;
    }
}

function scheduleBeat() {
    if (!G.audioReady || G.state !== 'playing' || G.dead || G.win) return;
    var now = G.audioCtx.currentTime;
    if (now - G.lastBeatTime < G.beatInterval * 0.9) return;
    var lvl = LEVELS[G.levelIdx];
    var noteIdx = Math.floor(Math.random() * lvl.scale.length);
    playTone(lvl.scale[noteIdx], 0.12, 'triangle', 0.15);
    if (Math.random() < 0.35) {
        playTone(lvl.scale[Math.min(noteIdx + 2, lvl.scale.length - 1)], 0.1, 'sine', 0.1);
    }
    if (Math.random() < 0.25) playKick(0.12);
    G.lastBeatTime = now;
}

function playTone(freq, dur, type, vol) {
    if (!G.audioReady) return;
    var t = G.audioCtx.currentTime;
    var o = G.audioCtx.createOscillator();
    var g = G.audioCtx.createGain();
    o.type = type || 'triangle';
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(Math.min(vol || 0.15, 0.25), t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(G.audioCtx.destination);
    o.start(t);
    o.stop(t + dur + 0.05);
}

function playKick(vol) {
    if (!G.audioReady) return;
    var t = G.audioCtx.currentTime;
    var o = G.audioCtx.createOscillator();
    var g = G.audioCtx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(160, t);
    o.frequency.exponentialRampToValueAtTime(40, t + 0.12);
    g.gain.setValueAtTime(Math.min(vol || 0.15, 0.3), t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    o.connect(g).connect(G.audioCtx.destination);
    o.start(t);
    o.stop(t + 0.2);
}

function playTurnSound() {
    var lvl = LEVELS[G.levelIdx];
    playTone(lvl.scale[4] * 1.5, 0.15, 'sine', 0.12);
}

function playDeathSound() {
    playTone(110, 0.4, 'sawtooth', 0.2);
    playTone(82, 0.5, 'square', 0.12);
}

function playWinSound() {
    var lvl = LEVELS[G.levelIdx];
    var sc = lvl.scale;
    for (var i = 0; i < Math.min(sc.length, 5); i++) {
        (function(idx) {
            setTimeout(function() { playTone(sc[idx], 0.3, 'triangle', 0.15); }, idx * 120);
        })(i);
    }
}

// --- Game Logic ---
function startGame(idx) {
    ensureAudio();
    G.levelIdx = idx;
    var lvl = LEVELS[idx];
    G.segIdx = 0;
    G.progress = 0;
    G.totalMoved = 0;
    G.lineX = 0;
    G.lineY = 0;
    G.dirX = lvl.segments[0].dx;
    G.dirY = lvl.segments[0].dy;
    G.moveX = G.dirX;
    G.moveY = G.dirY;
    G.totalLen = 0;
    for (var i = 0; i < lvl.segments.length; i++) {
        G.totalLen += lvl.segments[i].len;
    }
    G.score = 0;
    G.combo = 0;
    G.maxCombo = 0;
    G.lives = 3;
    G.dead = false;
    G.win = false;
    G.paused = false;
    G.turnQueued = false;
    G.particles = [];
    G.decorations = [];
    G.shakeDur = 0;
    G.shakeAmt = 0;
    G.startTime = performance.now();

    // Generate path decorations
    var px = 0, py = 0;
    for (var i = 0; i < lvl.segments.length; i++) {
        var s = lvl.segments[i];
        var numDeco = Math.floor(s.len / 60);
        for (var d = 1; d <= numDeco; d++) {
            var t = (d / (numDeco + 1)) * s.len;
            var dx = px + s.dx * t;
            var dy = py + s.dy * t;
            // Offset perpendicular to path direction
            var offDist = (Math.random() - 0.5) * PATH_WIDTH * 1.6;
            var offX = -s.dy * offDist;
            var offY = s.dx * offDist;
            G.decorations.push({
                x: dx + offX,
                y: dy + offY,
                type: lvl.decoType,
                color: lvl.decoColor,
                size: 6 + Math.random() * 6,
                rotation: Math.random() * Math.PI * 2,
                phase: Math.random() * Math.PI * 2
            });
        }
        px += s.dx * s.len;
        py += s.dy * s.len;
    }
    G.lastBeatTime = 0;
    G.beatInterval = 60 / lvl.bpm;
    G.state = 'playing';
    showScreen('none');
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('hint').classList.remove('hidden');
    setTimeout(function() {
        document.getElementById('hint').classList.add('hidden');
    }, 3000);
}

function doDeath() {
    G.dead = true;
    G.state = 'dead';
    G.lives--;
    G.shakeDur = 0.4;
    G.shakeAmt = 12;
    G.combo = 0;
    playDeathSound();
    for (var i = 0; i < 25; i++) {
        spawnParticle(G.lineX, G.lineY, LEVELS[G.levelIdx].lineColor, 3, 8);
    }
    setTimeout(function() {
        if (G.state === 'dead') {
            document.getElementById('deathScore').textContent =
                '得分: ' + G.score + ' | 最大连击: ' + G.maxCombo;
            showScreen('death');
        }
    }, 800);
}

function doWin() {
    G.win = true;
    G.state = 'win';
    playWinSound();
    for (var i = 0; i < 35; i++) {
        spawnParticle(G.lineX, G.lineY,
            ['#ffd700','#ff6b6b','#4ecdc4','#a8e6cf'][i % 4], 3, 10);
    }
    var pct = Math.round((G.totalMoved / G.totalLen) * 100);
    var grade = pct >= 100 && G.maxCombo >= 10 ? 'S' :
                pct >= 95 ? 'A' : pct >= 80 ? 'B' : 'C';
    var gc = { S:'#ffd700', A:'#2ecc71', B:'#3498db', C:'#95a5a6' };
    setTimeout(function() {
        document.getElementById('winScore').textContent =
            '得分: ' + G.score + ' | 最大连击: ' + G.maxCombo + ' | 完成: ' + pct + '%';
        var ge = document.getElementById('winGrade');
        ge.textContent = grade;
        ge.style.color = gc[grade];
        document.getElementById('nextBtn').style.display =
            G.levelIdx < LEVELS.length - 1 ? '' : 'none';
        showScreen('win');
    }, 600);
}

function updateGame(dt) {
    if (G.state !== 'playing' || G.dead || G.win || G.paused) return;
    var lvl = LEVELS[G.levelIdx];
    var seg = lvl.segments[G.segIdx];
    var spd = LINE_SPEED * dt * 60;
    var rem = seg.len - G.progress;

    // Move along current segment
    if (spd < rem) {
        G.lineX += G.moveX * spd;
        G.lineY += G.moveY * spd;
        G.progress += spd;
        G.totalMoved += spd;
    } else {
        // Reach end of segment
        G.lineX += G.moveX * rem;
        G.lineY += G.moveY * rem;
        G.totalMoved += rem;

        if (G.segIdx < lvl.segments.length - 1) {
            var nextDir = getSegDir(G.segIdx + 1);
            var sameDir = (nextDir.x === G.moveX && nextDir.y === G.moveY);

            if (sameDir) {
                // Same direction: auto-advance
                G.segIdx++;
                G.progress = spd - rem;
                G.dirX = nextDir.x;
                G.dirY = nextDir.y;
                G.totalMoved += (spd - rem);
                G.lineX += G.moveX * (spd - rem);
                G.lineY += G.moveY * (spd - rem);
            } else if (G.turnQueued) {
                // Turn executed
                G.turnQueued = false;
                G.moveX = nextDir.x;
                G.moveY = nextDir.y;
                G.dirX = nextDir.x;
                G.dirY = nextDir.y;
                G.segIdx++;
                G.progress = spd - rem;
                G.score += 10 * (1 + Math.floor(G.combo / 5));
                G.combo++;
                if (G.combo > G.maxCombo) G.maxCombo = G.combo;
                G.totalMoved += (spd - rem);
                G.lineX += G.moveX * (spd - rem);
                G.lineY += G.moveY * (spd - rem);
                spawnParticle(G.lineX, G.lineY, '#ffd700', 2, 5);
                playTurnSound();
            } else {
                // Missed turn
                G.lineX += G.moveX * (spd - rem);
                G.lineY += G.moveY * (spd - rem);
                G.totalMoved += (spd - rem);
                var distPast = spd - rem;
                if (distPast > 60) doDeath();
            }
        } else {
            // End of last segment
            G.totalMoved = G.totalLen;
            doWin();
            return;
        }
    }

    // Edge detection
    var cProg = G.segIdx === 0 ? G.progress :
        (function() {
            var p = 0;
            for (var i = 0; i < G.segIdx; i++) p += lvl.segments[i].len;
            return p + G.progress;
        })();
    var cp = getCoordAtProgress(cProg);
    var dx = G.lineX - cp.x;
    var dy = G.lineY - cp.y;
    var dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > PATH_WIDTH / 2 + EDGE_TOLERANCE) doDeath();

    // Beat
    scheduleBeat();
}

function spawnParticle(x, y, color, minSpd, maxSpd) {
    var a = Math.random() * Math.PI * 2;
    var s = minSpd + Math.random() * (maxSpd - minSpd);
    G.particles.push({
        x: x, y: y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        life: 0.6 + Math.random() * 0.4,
        maxLife: 1,
        r: 2 + Math.random() * 3,
        color: color
    });
}

function updateParticles(dt) {
    for (var i = G.particles.length - 1; i >= 0; i--) {
        var p = G.particles[i];
        p.x += p.vx * dt * 60;
        p.y += p.vy * dt * 60;
        p.vx *= 0.96;
        p.vy *= 0.96;
        p.life -= dt;
        if (p.life <= 0) G.particles.splice(i, 1);
    }
}

function doTurn() {
    if (G.state !== 'playing' || G.dead || G.win) return;
    if (G.turnQueued) return;
    var lvl = LEVELS[G.levelIdx];
    var seg = lvl.segments[G.segIdx];
    var distLeft = seg.len - G.progress;
    if (distLeft < TURN_INDICATOR_DIST) {
        G.turnQueued = true;
        spawnParticle(G.lineX, G.lineY, '#ffffff', 1, 3);
    }
}

function togglePause() {
    if (G.state !== 'playing' || G.dead || G.win) return;
    G.paused = !G.paused;
    document.getElementById('pauseScreen').classList.toggle('hidden', !G.paused);
}

// --- Input ---
function handleInput() {
    if (G.state === 'playing' && !G.paused) doTurn();
}

canvas.addEventListener('pointerdown', function(e) {
    e.preventDefault();
    handleInput();
});
document.addEventListener('keydown', function(e) {
    if (e.code === 'Space' || e.code === 'ArrowRight' || e.code === 'ArrowUp') {
        e.preventDefault();
        handleInput();
    }
    if (e.code === 'KeyP') {
        e.preventDefault();
        togglePause();
    }
});

// --- Screen Management ---
function showScreen(which) {
    document.getElementById('menuScreen').classList.toggle('hidden', which !== 'menu');
    document.getElementById('deathScreen').classList.toggle('hidden', which !== 'death');
    document.getElementById('winScreen').classList.toggle('hidden', which !== 'win');
    document.getElementById('pauseScreen').classList.toggle('hidden', which !== 'pause');
    if (which === 'none') {
        document.getElementById('hud').classList.remove('hidden');
    } else {
        document.getElementById('hud').classList.add('hidden');
        document.getElementById('hint').classList.add('hidden');
    }
}

// --- Rendering ---
function hexToRgb(hex) {
    var r = parseInt(hex.slice(1,3), 16);
    var g = parseInt(hex.slice(3,5), 16);
    var b = parseInt(hex.slice(5,7), 16);
    return r + ',' + g + ',' + b;
}

function updateHUD() {
    if (G.state !== 'playing') return;
    var lvl = LEVELS[G.levelIdx];
    document.getElementById('hudLevel').textContent = lvl.name;
    var pct = Math.min(100, Math.round((G.totalMoved / G.totalLen) * 100));
    document.getElementById('hudProgress').textContent = pct + '%';
    document.getElementById('hudCombo').textContent = G.combo > 1 ? G.combo + 'x' : '';
}

function render() {
    ctx.clearRect(0, 0, W, H);
    var lvl = LEVELS[G.levelIdx];
    if (!lvl) return;

    // Shake
    var sx = 0, sy = 0;
    if (G.shakeDur > 0) {
        sx = (Math.random() - 0.5) * G.shakeAmt * 2;
        sy = (Math.random() - 0.5) * G.shakeAmt * 2;
    }

    // Camera
    var camX = G.lineX - W / 2 + sx;
    var camY = G.lineY - H * 0.65 + sy;

    // Background with beat pulse
    var beatPulse = 0;
    if (G.state === 'playing' && !G.dead && !G.win && G.audioReady) {
        var timeSinceBeat = G.audioCtx.currentTime - G.lastBeatTime;
        if (timeSinceBeat < 0.15) {
            beatPulse = 1 - timeSinceBeat / 0.15;
        }
    }
    var bgRgb = hexToRgb(lvl.bg);
    var pulseAdd = Math.round(beatPulse * 8);
    var bgParts = bgRgb.split(',');
    var bgR = Math.min(255, parseInt(bgParts[0]) + pulseAdd);
    var bgG = Math.min(255, parseInt(bgParts[1]) + pulseAdd);
    var bgB = Math.min(255, parseInt(bgParts[2]) + pulseAdd);
    var grd = ctx.createLinearGradient(0, 0, 0, H);
    grd.addColorStop(0, 'rgb(' + bgR + ',' + bgG + ',' + bgB + ')');
    grd.addColorStop(1, 'rgb(' + Math.max(0,bgR-15) + ',' + Math.max(0,bgG-15) + ',' + Math.max(0,bgB-15) + ')');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, H);

    // Grid
    ctx.save();
    ctx.translate(-camX % 40, -camY % 40);
    ctx.strokeStyle = 'rgba(255,255,255,0.015)';
    ctx.lineWidth = 1;
    for (var gx = -40; gx < W + 80; gx += 40) {
        ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H + 40); ctx.stroke();
    }
    for (var gy = -40; gy < H + 80; gy += 40) {
        ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W + 40, gy); ctx.stroke();
    }
    ctx.restore();

    // Path
    ctx.save();
    ctx.translate(-camX, -camY);
    var segments = lvl.segments;
    var pathRgb = hexToRgb(lvl.pathColor);

    ctx.lineWidth = PATH_WIDTH;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // Path glow
    ctx.save();
    ctx.shadowColor = lvl.pathColor;
    ctx.shadowBlur = 25;
    ctx.strokeStyle = 'rgba(' + pathRgb + ',0.25)';
    ctx.beginPath();
    var px = 0, py = 0;
    ctx.moveTo(px, py);
    for (var i = 0; i < segments.length; i++) {
        px += segments[i].dx * segments[i].len;
        py += segments[i].dy * segments[i].len;
        ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.restore();

    // Path main
    ctx.strokeStyle = 'rgba(' + pathRgb + ',0.18)';
    ctx.beginPath();
    px = 0; py = 0;
    ctx.moveTo(px, py);
    for (var i = 0; i < segments.length; i++) {
        px += segments[i].dx * segments[i].len;
        py += segments[i].dy * segments[i].len;
        ctx.lineTo(px, py);
    }
    ctx.stroke();

    // Path edge highlight
    ctx.lineWidth = PATH_WIDTH - 6;
    ctx.strokeStyle = 'rgba(' + pathRgb + ',0.06)';
    ctx.beginPath();
    px = 0; py = 0;
    ctx.moveTo(px, py);
    for (var i = 0; i < segments.length; i++) {
        px += segments[i].dx * segments[i].len;
        py += segments[i].dy * segments[i].len;
        ctx.lineTo(px, py);
    }
    ctx.stroke();

    // Waypoints
    px = 0; py = 0;
    for (var i = 0; i < segments.length; i++) {
        px += segments[i].dx * segments[i].len;
        py += segments[i].dy * segments[i].len;
        if (i < segments.length - 1) {
            ctx.fillStyle = 'rgba(' + pathRgb + ',0.35)';
            ctx.beginPath();
            ctx.arc(px, py, 6, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // Start marker
    ctx.fillStyle = 'rgba(46,204,113,0.5)';
    ctx.beginPath();
    ctx.arc(0, 0, 10, 0, Math.PI * 2);
    ctx.fill();

    // End marker
    var endX = 0, endY = 0;
    for (var i = 0; i < segments.length; i++) {
        endX += segments[i].dx * segments[i].len;
        endY += segments[i].dy * segments[i].len;
    }
    ctx.fillStyle = 'rgba(231,76,60,0.5)';
    ctx.beginPath();
    ctx.arc(endX, endY, 10, 0, Math.PI * 2);
    ctx.fill();

    // Path decorations
    var now = performance.now();
    for (var i = 0; i < G.decorations.length; i++) {
        var d = G.decorations[i];
        var bob = Math.sin(now / 800 + d.phase) * 2;
        ctx.save();
        ctx.translate(d.x, d.y + bob);
        ctx.rotate(d.rotation);
        ctx.globalAlpha = 0.35;
        ctx.fillStyle = d.color;
        var sz = d.size;
        if (d.type === 'note') {
            // Music note
            ctx.beginPath();
            ctx.arc(0, 0, sz * 0.4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillRect(sz * 0.25, -sz * 1.2, 2, sz * 1.2);
            ctx.fillRect(sz * 0.25, -sz * 1.2, sz * 0.5, 2);
        } else if (d.type === 'snowflake') {
            // Snowflake
            ctx.strokeStyle = d.color;
            ctx.lineWidth = 1.5;
            for (var a = 0; a < 6; a++) {
                var ang = a * Math.PI / 3;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(Math.cos(ang) * sz * 0.6, Math.sin(ang) * sz * 0.6);
                ctx.stroke();
            }
        } else if (d.type === 'cactus') {
            // Cactus
            ctx.fillRect(-sz * 0.15, -sz * 0.6, sz * 0.3, sz * 0.8);
            ctx.fillRect(-sz * 0.4, -sz * 0.3, sz * 0.25, sz * 0.15);
            ctx.fillRect(sz * 0.15, -sz * 0.5, sz * 0.25, sz * 0.15);
        } else if (d.type === 'leaf') {
            // Leaf
            ctx.beginPath();
            ctx.ellipse(0, 0, sz * 0.5, sz * 0.25, d.rotation, 0, Math.PI * 2);
            ctx.fill();
        } else if (d.type === 'bubble') {
            // Bubble
            ctx.strokeStyle = d.color;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(0, 0, sz * 0.4, 0, Math.PI * 2);
            ctx.stroke();
            ctx.globalAlpha = 0.15;
            ctx.fill();
        }
        ctx.restore();
    }

    // Turn indicator (enhanced with arrow)
    if (G.state === 'playing' && !G.dead && !G.win && !G.paused && G.segIdx < segments.length - 1) {
        var seg = segments[G.segIdx];
        var distLeft = seg.len - G.progress;
        if (distLeft < TURN_INDICATOR_DIST && !G.turnQueued) {
            var wpX = 0, wpY = 0;
            for (var i = 0; i <= G.segIdx; i++) {
                wpX += segments[i].dx * segments[i].len;
                wpY += segments[i].dy * segments[i].len;
            }
            // Get next segment direction for arrow
            var nextSeg = segments[G.segIdx + 1];
            var arrowDirX = nextSeg.dx;
            var arrowDirY = nextSeg.dy;

            var t = now / 1000;
            var pulseAlpha = 0.3 + Math.sin(t * 6) * 0.25;
            var pulseR = 18 + Math.sin(t * 4) * 5;

            // Outer ring
            ctx.strokeStyle = 'rgba(255,255,255,' + pulseAlpha + ')';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(wpX, wpY, pulseR, 0, Math.PI * 2);
            ctx.stroke();

            // Inner flashing dot
            var dotAlpha = 0.4 + Math.sin(t * 8) * 0.3;
            ctx.fillStyle = 'rgba(255,255,255,' + dotAlpha + ')';
            ctx.beginPath();
            ctx.arc(wpX, wpY, 5, 0, Math.PI * 2);
            ctx.fill();

            // Directional arrow
            ctx.save();
            ctx.translate(wpX, wpY);
            var arrowAngle = Math.atan2(arrowDirY, arrowDirX);
            ctx.rotate(arrowAngle);
            var arrowLen = 22 + Math.sin(t * 5) * 4;
            ctx.fillStyle = 'rgba(255,255,0,' + (pulseAlpha + 0.15) + ')';
            ctx.beginPath();
            ctx.moveTo(arrowLen, 0);
            ctx.lineTo(-6, -8);
            ctx.lineTo(-6, 8);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }
    }

    // Line trail
    if (G.state === 'playing' || G.dead || G.win) {
        var trailLen = 120;
        var curProg = 0;
        for (var i = 0; i < G.segIdx; i++) curProg += segments[i].len;
        curProg += G.progress;

        ctx.save();
        ctx.shadowColor = lvl.lineColor;
        ctx.shadowBlur = 15;
        ctx.lineCap = 'round';

        var startProg = Math.max(0, curProg - trailLen);
        var p1 = getCoordAtProgress(startProg);
        var steps = 12;
        for (var s = 0; s < steps; s++) {
            var t1 = startProg + (curProg - startProg) * (s / steps);
            var t2 = startProg + (curProg - startProg) * ((s + 1) / steps);
            var c1 = getCoordAtProgress(t1);
            var c2 = getCoordAtProgress(t2);
            var alpha = (s / steps) * 0.7;
            ctx.strokeStyle = lvl.lineColor;
            ctx.globalAlpha = alpha;
            ctx.lineWidth = 3 + (s / steps) * 2;
            ctx.beginPath();
            ctx.moveTo(c1.x, c1.y);
            ctx.lineTo(c2.x, c2.y);
            ctx.stroke();
        }
        ctx.globalAlpha = 1;

        // Line head
        if (!G.dead) {
            ctx.shadowBlur = 25;
            ctx.fillStyle = lvl.lineColor;
            ctx.beginPath();
            ctx.arc(G.lineX, G.lineY, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(G.lineX, G.lineY, 2.5, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }

    // Particles
    for (var i = 0; i < G.particles.length; i++) {
        var p = G.particles[i];
        ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * (p.life / p.maxLife), 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.restore();

    // HUD
    updateHUD();
}

// --- Init ---
var selectedLevel = 0;

function buildLevelButtons() {
    var container = document.getElementById('levelBtns');
    container.innerHTML = '';
    for (var i = 0; i < LEVELS.length; i++) {
        (function(idx) {
            var btn = document.createElement('div');
            btn.className = 'level-btn' + (idx === selectedLevel ? ' selected' : '');
            btn.innerHTML = '<div class="ln" style="color:' + LEVELS[idx].pathColor + '">' +
                (idx + 1) + '</div><div style="font:bold 16px sans-serif;color:#fff">' +
                LEVELS[idx].name + '</div><div class="ld">' + LEVELS[idx].difficulty +
                '</div><div class="ld">BPM ' + LEVELS[idx].bpm + '</div>';
            btn.addEventListener('click', function() {
                selectedLevel = idx;
                var btns = container.children;
                for (var j = 0; j < btns.length; j++) {
                    btns[j].classList.toggle('selected', j === idx);
                }
                playClickSound();
            });
            container.appendChild(btn);
        })(i);
    }
}

function playClickSound() {
    ensureAudio();
    if (!G.audioReady) return;
    playTone(800, 0.08, 'sine', 0.1);
}

// Button handlers
document.getElementById('startBtn').addEventListener('click', function() {
    playClickSound();
    startGame(selectedLevel);
});
document.getElementById('retryBtn').addEventListener('click', function() {
    playClickSound();
    startGame(G.levelIdx);
});
document.getElementById('winRetryBtn').addEventListener('click', function() {
    playClickSound();
    startGame(G.levelIdx);
});
document.getElementById('nextBtn').addEventListener('click', function() {

});
document.getElementById('pauseBtn').addEventListener('click', function() {
    playClickSound();
    togglePause();
});
document.getElementById('resumeBtn').addEventListener('click', function() {
    playClickSound();
    togglePause();
});
document.getElementById('pauseRetryBtn').addEventListener('click', function() {
    playClickSound();
    G.paused = false;
    document.getElementById('pauseScreen').classList.add('hidden');
    startGame(G.levelIdx);
});

// Main loop
var lastTime = 0;
function loop(ts) {
    var dt = Math.min((ts - (lastTime || ts)) / 1000, 0.05);
    lastTime = ts;

    if (G.shakeDur > 0) G.shakeDur -= dt;

    updateGame(dt);
    updateParticles(dt);
    render();

    requestAnimationFrame(loop);
}

// Start
buildLevelButtons();
showScreen('menu');
G.levelIdx = 0;
requestAnimationFrame(loop);

		const interstitial = document.getElementById('interstitialAd');
		if (skipBtn && interstitial) {
			skipBtn.onclick = () => {
				interstitial.style.display = 'none'; interstitial.style.pointerEvents = 'none';
				if (this._reviveCallback) { const cb = this._reviveCallback; this._reviveCallback = null; cb(); }
			};
		}
		// 自动检测游戏结束状态
		this._startGameOverWatcher();
	},
	_startGameOverWatcher() {
		// 检测#restartBtn或包含"重新开始"/"再来一局"的按钮变为可见
		const checkGameOver = () => {
			if (this._gameOverDetected) return;
			// 方法1: 检测#restartBtn可见
			const restartBtn = document.getElementById('restartBtn');
			if (restartBtn && restartBtn.offsetParent !== null && getComputedStyle(restartBtn).display !== 'none') {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
			// 方法2: 检测#gameOverScreen可见
			const goScreen = document.getElementById('gameOverScreen');
			if (goScreen && getComputedStyle(goScreen).display !== 'none') {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
			// 方法3: 检测screen-gameover可见
			const goScreen2 = document.getElementById('screen-gameover');
			if (goScreen2 && !goScreen2.classList.contains('hidden')) {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
		};
		// 每500ms检查一次
		this._goInterval = setInterval(() => {
			checkGameOver();
			// 如果检测到了，等2秒后重置标志，允许下次检测
			if (this._gameOverDetected) {
				setTimeout(() => { this._gameOverDetected = false; }, 2000);
			}
		}, 500);
	},
	requestRevive(callback) {
		this._reviveCallback = callback || null;
		const el = document.getElementById('interstitialAd');
		if (!el) { if (callback) callback(); return; }
		const s2 = document.createElement('script');
		s2.src = 'https://pl29544742.effectivecpmnetwork.com/be/a9/6d/bea96d779c0ee07c2b15613852dd3e70.js';
		s2.async = true;
		document.getElementById('interstitialAdSlot').innerHTML = '';
		document.getElementById('interstitialAdSlot').appendChild(s2);
		el.style.display = 'flex'; el.style.pointerEvents = 'auto';

		setTimeout(() => { const slot = document.getElementById('interstitialAdSlot'); if (slot && slot.innerHTML.includes('加载中')) { slot.innerHTML = '<div style=color:#aaa;font:13px Microsoft YaHei,sans-serif>广告暂时无法加载<br>点击下方按钮继续</div>'; } }, 3000);
		const skipBtn = document.getElementById('skipInterstitial');
		if (skipBtn) {
			skipBtn.textContent = '5 秒后可跳过'; skipBtn.disabled = true;
			let cd = 5;
			const timer = setInterval(() => {
				cd--;
				if (cd <= 0) { clearInterval(timer); skipBtn.textContent = '跳过广告 ▶'; skipBtn.disabled = false; }
				else { skipBtn.textContent = cd + ' 秒后可跳过'; }
			}, 1000);
		}
	},
	onGameOver() {
		this._deathCount++;
		if (!this.interstitial.enabled) return;
		if (this._deathCount < this.interstitial.gameCount) return;
		if (Date.now() - this._lastInterTime < this.interstitial.cooldownMs) return;
		this._lastInterTime = Date.now(); this._deathCount = 0;
		this.requestRevive(null);
	},
};

<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>

  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
