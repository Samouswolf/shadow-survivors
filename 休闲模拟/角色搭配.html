<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>角色搭配</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; overflow: hidden; }
        .game-container { width: 100%; height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 10px; }
        .currency { display: flex; align-items: center; gap: 5px; color: #fff; font-size: 16px; font-weight: bold; }
        
        .character-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(255,255,255,0.05); border-radius: 15px; position: relative; }
        .character { font-size: 100px; }
        .character-stats { display: flex; gap: 20px; margin-top: 20px; color: #fff; font-size: 14px; }
        
        .category-tabs { display: flex; gap: 5px; margin-bottom: 10px; overflow-x: auto; }
        .tab { padding: 8px 15px; background: rgba(255,255,255,0.1); border-radius: 20px; cursor: pointer; font-size: 14px; white-space: nowrap; color: #fff; }
        .tab.active { background: linear-gradient(135deg, #ff6b6b, #ee5a5a); }
        
        .shop-area { flex: 1; background: rgba(255,255,255,0.05); border-radius: 15px; padding: 15px; overflow-y: auto; }
        .items-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .item { background: rgba(255,255,255,0.1); border-radius: 15px; padding: 15px; cursor: pointer; border: 3px solid transparent; transition: all 0.3s; }
        .item:hover { transform: scale(1.03); }
        .item.selected { border-color: #ffd700; }
        .item.owned { border-color: #4ecdc4; }
        .item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .item-icon { font-size: 32px; }
        .item-name { font-size: 14px; font-weight: bold; color: #fff; }
        .item-stats { font-size: 12px; color: #ccc; }
        
        .actions { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
        .btn { padding: 12px 30px; border: none; border-radius: 25px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #4ecdc4, #44a08d); color: #fff; }
        .btn-danger { background: linear-gradient(135deg, #ff6b6b, #ee5a5a); color: #fff; }
        
        .message { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); color: #fff; padding: 20px 40px; border-radius: 15px; font-size: 20px; display: none; z-index: 100; }
        .message.show { display: block; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 10px; font-size: 14px; }
    /* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */
/* [BATCH-FIX:ad-components-css] */
.sponsor-btn{position:fixed;bottom:8px;left:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:2px 6px;border-radius:10px;font:10px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.sponsor-panel.show{display:flex}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.interstitial-ad.show{display:flex}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* [/BATCH-FIX:ad-components-css] */

/* [AD-FIX:responsive] */
@media (max-width:768px){.ad-banner-container{display:none!important}.sponsor-btn{transform:scale(.8);opacity:.6}}
/* [/AD-FIX:responsive] */
</style>
</head>
<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="currency">💰 <span id="money">2000</span></div>
            <div class="currency">⚔️ <span id="power">100</span></div>
        </div>
        
        <div class="character-area">
            <div class="character" id="character">⚔️👤🛡️</div>
            <div class="character-stats" id="stats">
                <div>攻击: <span id="attack">10</span></div>
                <div>防御: <span id="defense">10</span></div>
                <div>速度: <span id="speed">10</span></div>
                <div>暴击: <span id="crit">5%</span></div>
            </div>
        </div>
        
        <div class="category-tabs" id="tabs">
            <div class="tab active" data-category="weapon">⚔️ 武器</div>
            <div class="tab" data-category="armor">🛡️ 护甲</div>
            <div class="tab" data-category="accessory">💍 饰品</div>
            <div class="tab" data-category="skill">✨ 技能</div>
        </div>
        
        <div class="shop-area" id="shopArea"></div>
        
        <div class="actions">
            <button class="btn btn-primary" id="btnEquip">🔧 装备</button>
            <button class="btn btn-danger" id="btnBuy">💰 购买</button>
        </div>
        
        <div class="message" id="message"></div>
        
        
    </div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script>
        const ITEMS = {
            weapon: [
                { id: 'w1', emoji: '⚔️', name: '铁剑', cost: 100, stats: { attack: 10 } },
                { id: 'w2', emoji: '🗡️', name: '匕首', cost: 150, stats: { attack: 15, speed: 5 } },
                { id: 'w3', emoji: '🗡️', name: '长剑', cost: 250, stats: { attack: 20 } },
                { id: 'w4', emoji: '🔪', name: '双剑', cost: 400, stats: { attack: 25, crit: 5 } },
                { id: 'w5', emoji: '⚔️', name: '圣剑', cost: 800, stats: { attack: 40, crit: 10 } },
                { id: 'w6', emoji: '🗡️', name: '暗影刃', cost: 600, stats: { attack: 30, speed: 10 } }
            ],
            armor: [
                { id: 'a1', emoji: '🛡️', name: '皮甲', cost: 100, stats: { defense: 10 } },
                { id: 'a2', emoji: '🛡️', name: '链甲', cost: 200, stats: { defense: 15 } },
                { id: 'a3', emoji: '🛡️', name: '板甲', cost: 400, stats: { defense: 25 } },
                { id: 'a4', emoji: '🛡️', name: '龙鳞甲', cost: 800, stats: { defense: 40, speed: -5 } },
                { id: 'a5', emoji: '🛡️', name: '魔法盾', cost: 600, stats: { defense: 30, crit: 5 } },
                { id: 'a6', emoji: '🛡️', name: '暗影甲', cost: 500, stats: { defense: 20, speed: 10 } }
            ],
            accessory: [
                { id: 'acc1', emoji: '💍', name: '戒指', cost: 150, stats: { attack: 5, defense: 5 } },
                { id: 'acc2', emoji: '📿', name: '项链', cost: 200, stats: { speed: 10 } },
                { id: 'acc3', emoji: '💎', name: '宝石', cost: 300, stats: { attack: 10, crit: 5 } },
                { id: 'acc4', emoji: '👑', name: '王冠', cost: 500, stats: { attack: 15, defense: 15 } },
                { id: 'acc5', emoji: '🎧', name: '耳环', cost: 250, stats: { speed: 15 } },
                { id: 'acc6', emoji: '🪢', name: '腰带', cost: 350, stats: { defense: 15, crit: 5 } }
            ],
            skill: [
                { id: 's1', emoji: '🔥', name: '火球术', cost: 300, stats: { attack: 20 } },
                { id: 's2', emoji: '💨', name: '疾风步', cost: 250, stats: { speed: 20 } },
                { id: 's3', emoji: '💚', name: '治疗术', cost: 400, stats: { defense: 20 } },
                { id: 's4', emoji: '💥', name: '暴击术', cost: 500, stats: { crit: 15 } },
                { id: 's5', emoji: '⚡', name: '闪电链', cost: 600, stats: { attack: 30, speed: 10 } },
                { id: 's6', emoji: '❄️', name: '冰冻术', cost: 450, stats: { attack: 15, speed: 5 } }
            ]
        };
        
        let money = 2000;
        let ownedItems = new Set(['w1', 'a1', 'acc1', 's1']);
        let equippedItems = { weapon: 'w1', armor: 'a1', accessory: 'acc1', skill: 's1' };
        
        let currentCategory = 'weapon';
        let selectedItem = null;
        
        const shopArea = document.getElementById('shopArea');
        const messageEl = document.getElementById('message');
        
        function renderItems() {
            shopArea.innerHTML = '';
            const items = ITEMS[currentCategory];
            
            items.forEach(item => {
                const el = document.createElement('div');
                el.className = `item ${ownedItems.has(item.id) ? 'owned' : ''} ${selectedItem === item.id ? 'selected' : ''}`;
                
                let statsHtml = '';
                Object.entries(item.stats).forEach(([stat, value]) => {
                    const names = { attack: '攻击', defense: '防御', speed: '速度', crit: '暴击' };
                    statsHtml += `${names[stat]} ${value > 0 ? '+' : ''}${value}<br>`;
                });
                
                el.innerHTML = `
                    <div class="item-header">
                        <div class="item-icon">${item.emoji}</div>
                        <div class="item-name">${item.name}</div>
                    </div>
                    <div class="item-stats">${statsHtml}</div>
                    ${ownedItems.has(item.id) ? '<div style="font-size: 12px; color: #4ecdc4;">已拥有</div>' : `<div style="font-size: 12px; color: #ff6b6b;">💰${item.cost}</div>`}
                `;
                el.onclick = () => selectItem(item.id);
                shopArea.appendChild(el);
            });
        }
        
        function selectItem(id) {
            selectedItem = id;
            renderItems();
        }
        
        function updateCharacter() {
            const weapon = ITEMS.weapon.find(i => i.id === equippedItems.weapon);
            const armor = ITEMS.armor.find(i => i.id === equippedItems.armor);
            const accessory = ITEMS.accessory.find(i => i.id === equippedItems.accessory);
            const skill = ITEMS.skill.find(i => i.id === equippedItems.skill);
            
            document.getElementById('character').textContent = weapon.emoji + '👤' + armor.emoji + accessory.emoji + skill.emoji;
            
            let attack = 10, defense = 10, speed = 10, crit = 5;
            
            [weapon, armor, accessory, skill].forEach(item => {
                if (item) {
                    attack += item.stats.attack || 0;
                    defense += item.stats.defense || 0;
                    speed += item.stats.speed || 0;
                    crit += item.stats.crit || 0;
                }
            });
            
            document.getElementById('attack').textContent = attack;
            document.getElementById('defense').textContent = defense;
            document.getElementById('speed').textContent = speed;
            document.getElementById('crit').textContent = crit + '%';
            
            const power = attack + defense + speed + crit;
            document.getElementById('power').textContent = power;
        }
        
        function equipItem() {
            if (!selectedItem || !ownedItems.has(selectedItem)) {
                showMessage('请选择已拥有的物品！');
                return;
            }
            
            equippedItems[currentCategory] = selectedItem;
            
            updateCharacter();
            renderItems();
            
            showMessage('装备成功！');
        }
        
        function buyItem() {
            if (!selectedItem || ownedItems.has(selectedItem)) {
                showMessage('请选择未拥有的物品！');
                return;
            }
            
            const item = ITEMS[currentCategory].find(i => i.id === selectedItem);
            if (money < item.cost) {
                showMessage('资金不足！');
                return;
            }
            
            money -= item.cost;
            ownedItems.add(selectedItem);
            
            document.getElementById('money').textContent = money;
            renderItems();
            
            showMessage(`购买了${item.name}！`);
        }
        
        function showMessage(msg) {
            messageEl.textContent = msg;
            messageEl.classList.add('show');
            setTimeout(() => messageEl.classList.remove('show'), 2000);
        }
        
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentCategory = tab.dataset.category;
                selectedItem = null;
                renderItems();
            });
        });
        
        document.getElementById('btnEquip').addEventListener('click', equipItem);
        document.getElementById('btnBuy').addEventListener('click', buyItem);
        
        updateCharacter();
        renderItems();
    </script>
<!-- [BATCH-FIX:responsive-js] -->
<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>
<!-- [/BATCH-FIX:responsive-js] -->
<!-- [BATCH-FIX:touch-support] -->
<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>
<!-- [/BATCH-FIX:touch-support] -->

</div>

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
