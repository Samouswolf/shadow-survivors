<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>宠物养成</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; color: #fff; }
        
        .game-container { width: 100%; flex: 1; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: #ffd700; }
        .level { font-size: 14px; opacity: 0.7; }
        
        .pet-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .pet-display { width: 200px; height: 200px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 80px; margin-bottom: 20px; }
        
        .status-bar { width: 100%; max-width: 300px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .status-item { display: flex; align-items: center; gap: 10px; }
        .status-label { width: 60px; font-size: 14px; }
        .status-bar-container { flex: 1; height: 20px; background: rgba(255,255,255,0.2); border-radius: 10px; overflow: hidden; }
        .status-fill { height: 100%; border-radius: 10px; }
        
        .actions-area { display: flex; gap: 15px; }
        .action-btn { padding: 15px 30px; border: none; border-radius: 15px; font-size: 20px; cursor: pointer; }
        .action-btn.feed { background: linear-gradient(135deg, #ffa502, #ffd700); color: #fff; }
        .action-btn.play { background: linear-gradient(135deg, #48c78e, #4ecdc4); color: #fff; }
        .action-btn.sleep { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
        .action-btn.bathe { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="title">🐱 宠物养成</div>
            <div class="level">等级: <span id="level">1</span></div>
        </div>
        
        <div class="pet-area">
            <div class="pet-display" id="petDisplay">🐱</div>
            
            <div class="status-bar">
                <div class="status-item">
                    <span class="status-label">🍖</span>
                    <div class="status-bar-container">
                        <div class="status-fill" id="hunger" style="width: 80%; background: #ffa502;"></div>
                    </div>
                </div>
                <div class="status-item">
                    <span class="status-label">💖</span>
                    <div class="status-bar-container">
                        <div class="status-fill" id="happiness" style="width: 60%; background: #48c78e;"></div>
                    </div>
                </div>
                <div class="status-item">
                    <span class="status-label">😴</span>
                    <div class="status-bar-container">
                        <div class="status-fill" id="energy" style="width: 70%; background: #667eea;"></div>
                    </div>
                </div>
                <div class="status-item">
                    <span class="status-label">✨</span>
                    <div class="status-bar-container">
                        <div class="status-fill" id="cleanliness" style="width: 90%; background: #f093fb;"></div>
                    </div>
                </div>
            </div>
            
            <div class="actions-area">
                <button class="action-btn feed" onclick="feedPet()">🍖 喂食</button>
                <button class="action-btn play" onclick="playPet()">🎾 玩耍</button>
                <button class="action-btn sleep" onclick="sleepPet()">😴 睡觉</button>
                <button class="action-btn bathe" onclick="bathePet()">🛁 洗澡</button>
            </div>
        </div>
    </div>
    
    <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <script>
        const GAME_NAME = '宠物养成';
        GameCore.init({ highScore: GAME_NAME });
        
        let stats = {
            hunger: 80,
            happiness: 60,
            energy: 70,
            cleanliness: 90
        };
        
        let level = 1;
        let exp = 0;
        
        function initGame() {
            updateUI();
            
            setInterval(() => {
                stats.hunger = Math.max(0, stats.hunger - 1);
                stats.happiness = Math.max(0, stats.happiness - 0.5);
                stats.energy = Math.max(0, stats.energy - 0.3);
                stats.cleanliness = Math.max(0, stats.cleanliness - 0.2);
                
                updateUI();
            }, 2000);
        }
        
        function updateUI() {
            document.getElementById('hunger').style.width = stats.hunger + '%';
            document.getElementById('happiness').style.width = stats.happiness + '%';
            document.getElementById('energy').style.width = stats.energy + '%';
            document.getElementById('cleanliness').style.width = stats.cleanliness + '%';
            
            document.getElementById('level').textContent = level;
            
            const petDisplay = document.getElementById('petDisplay');
            if (stats.hunger < 20) petDisplay.textContent = '😿';
            else if (stats.happiness < 20) petDisplay.textContent = '😔';
            else if (stats.energy < 20) petDisplay.textContent = '😴';
            else if (stats.cleanliness < 20) petDisplay.textContent = '🤢';
            else petDisplay.textContent = '🐱';
            
            GameCore.highScore.set(GAME_NAME, level);
        }
        
        function feedPet() {
            stats.hunger = Math.min(100, stats.hunger + 30);
            exp += 5;
            GameCore.hints.show('🍖 喂食成功！');
            checkLevelUp();
            updateUI();
        }
        
        function playPet() {
            stats.happiness = Math.min(100, stats.happiness + 25);
            stats.energy = Math.max(0, stats.energy - 15);
            exp += 10;
            GameCore.hints.show('🎾 玩耍开心！');
            checkLevelUp();
            updateUI();
        }
        
        function sleepPet() {
            stats.energy = Math.min(100, stats.energy + 40);
            stats.hunger = Math.max(0, stats.hunger - 5);
            exp += 5;
            GameCore.hints.show('😴 睡了个好觉！');
            checkLevelUp();
            updateUI();
        }
        
        function bathePet() {
            stats.cleanliness = Math.min(100, stats.cleanliness + 35);
            exp += 5;
            GameCore.hints.show('🛁 洗得干干净净！');
            checkLevelUp();
            updateUI();
        }
        
        function checkLevelUp() {
            if (exp >= level * 100) {
                level++;
                exp = 0;
                GameCore.hints.show(`🎉 升级到第${level}级！`);
            }
        }
        
        initGame();
        GameCore.touch.enableAllButtons();
    </script>
</body>
</html>
