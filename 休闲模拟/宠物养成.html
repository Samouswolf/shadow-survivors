<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宠物养成</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a12; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
canvas { image-rendering: pixelated; border: 2px solid #f5a; cursor: pointer; max-width: 100%; height: auto; }
</style>
<style>/* 游戏工坊广告系统 */
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);height:90px;max-height:90px;overflow:hidden;contain:layout style paint;pointer-events:none!important}.ad-banner-container,.ad-banner-container *{pointer-events:none!important}.ad-banner-container iframe{max-height:90px;pointer-events:none!important}
.ad-banner-container iframe{max-width:100%}
.ad-label{position:absolute;top:1px;right:6px;font:9px "Microsoft YaHei",sans-serif;color:rgba(255,255,255,.35)}
.sponsor-btn{position:fixed;top:44px;right:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:3px 9px;border-radius:10px;font:11px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .qr-row{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.sponsor-panel .qr-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px;text-align:center;min-width:140px}
.sponsor-panel .qr-card .qr-icon{font-size:48px;margin-bottom:6px}
.sponsor-panel .qr-card .qr-label{color:#ccc;font:13px "Microsoft YaHei",sans-serif}
.sponsor-panel .qr-card .qr-hint{color:#888;font:11px "Microsoft YaHei",sans-serif;margin-top:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.interstitial-ad .ad-content{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;text-align:center;min-width:280px;max-width:400px}
.interstitial-ad .ad-content p{color:#aaa;font:14px "Microsoft YaHei",sans-serif;margin-bottom:12px}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="startScreen" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#0a0a12;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000">
  <h1 style="font-size:48px;color:#f5a;margin-bottom:20px">🐾 宠物养成</h1>
  <p style="color:#888;margin-bottom:40px">喂食 · 玩耍 · 清洁 · 见证成长</p>
  <div style="display:flex;gap:20px;margin-bottom:30px">
    <button class="petSelect" data-pet="0" style="padding:15px 30px;font-size:18px;background:#f55;color:#fff;border:3px solid #f55;border-radius:12px;cursor:pointer">🐱 猫咪</button>
    <button class="petSelect" data-pet="1" style="padding:15px 30px;font-size:18px;background:#55f;color:#fff;border:3px solid #55f;border-radius:12px;cursor:pointer">🐶 小狗</button>
    <button class="petSelect" data-pet="2" style="padding:15px 30px;font-size:18px;background:#5f5;color:#fff;border:3px solid #5f5;border-radius:12px;cursor:pointer">🐰 兔子</button>
  </div>
</div>
<button id="pauseBtn" style="position:fixed;top:10px;right:10px;width:44px;height:44px;font-size:20px;background:rgba(0,0,0,0.5);color:#fff;border:1px solid rgba(255,255,255,0.3);border-radius:8px;z-index:100;display:none">⏸</button>
<div id="pauseScreen" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);flex-direction:column;align-items:center;justify-content:center;z-index:999">
  <h2 style="color:#fff;margin-bottom:30px">游戏暂停</h2>
  <button id="resumeBtn" style="padding:12px 40px;font-size:18px;background:#f5a;color:#fff;border:none;border-radius:8px;margin-bottom:15px">继续游戏</button>
  <button id="restartBtn" style="padding:12px 40px;font-size:18px;background:#666;color:#fff;border:none;border-radius:8px">重新开始</button>
</div>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = 800, H = 600;
canvas.width = W; canvas.height = H;

function resizeCanvas() {
    const maxW = window.innerWidth - 20;
    if (W > maxW) { canvas.style.width = maxW + 'px'; canvas.style.height = (H * maxW / W) + 'px'; }
    else { canvas.style.width = ''; canvas.style.height = ''; }
}
window.addEventListener('resize', resizeCanvas); resizeCanvas();

if (!ctx.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        r = Math.min(r, w / 2, h / 2);
        this.moveTo(x + r, y);
        this.arcTo(x + w, y, x + w, y + h, r);
        this.arcTo(x + w, y + h, x, y + h, r);
        this.arcTo(x, y + h, x, y, r);
        this.arcTo(x, y, x + w, y, r);
        this.closePath();
    };
}

// Audio
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(freq, dur, type) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
}

// Pet types
const PET_TYPES = [
    { name: '猫咪', icon: '🐱', color: '#f55', stages: ['幼猫', '小猫', '成猫', '老猫'] },
    { name: '小狗', icon: '🐶', color: '#55f', stages: ['幼犬', '小狗', '成犬', '老犬'] },
    { name: '兔子', icon: '🐰', color: '#5f5', stages: ['幼兔', '小兔', '成兔', '老兔'] }
];

// Actions
const ACTIONS = [
    { name: '喂食', icon: '🍖', desc: '恢复饱食度', effect: (p) => { p.hunger = Math.min(100, p.hunger + 25); p.happiness = Math.min(100, p.happiness + 5); p.exp += 5; }, cost: 5 },
    { name: '玩耍', icon: '🎾', desc: '增加快乐度', effect: (p) => { p.happiness = Math.min(100, p.happiness + 30); p.energy -= 10; p.exp += 8; }, cost: 0 },
    { name: '清洁', icon: '🛁', desc: '恢复清洁度', effect: (p) => { p.cleanliness = Math.min(100, p.cleanliness + 35); p.exp += 5; }, cost: 3 },
    { name: '睡觉', icon: '💤', desc: '恢复精力', effect: (p) => { p.energy = Math.min(100, p.energy + 40); p.hunger -= 5; p.exp += 3; }, cost: 0 },
    { name: '零食', icon: '🍪', desc: '快速恢复饱食', effect: (p) => { p.hunger = Math.min(100, p.hunger + 15); p.happiness = Math.min(100, p.happiness + 10); p.weight += 0.5; p.exp += 3; }, cost: 8 },
    { name: '训练', icon: '🏋️', desc: '增加经验值', effect: (p) => { p.exp += 15; p.energy -= 15; p.hunger -= 10; p.intelligence += 1; }, cost: 10 }
];

// Growth stages
const STAGE_THRESHOLDS = [0, 50, 150, 400];
const STAGE_NAMES = ['幼年期', '成长期', '成年期', '老年期'];

let G = {};
function resetGame(petType) {
    G = {
        state: 'playing',
        petType: petType || 0,
        pet: {
            hunger: 70, happiness: 60, energy: 80, cleanliness: 70,
            weight: 2, intelligence: 1, exp: 0, stage: 0, age: 0,
            x: W/2, y: 300, targetX: W/2, targetY: 300,
            anim: 'idle', animTimer: 0, bounceY: 0, facing: 1
        },
        coins: 50,
        score: 0,
        time: 0,
        particles: [],
        moodBubble: null,
        highScore: parseInt(localStorage.getItem('petRaiseHigh') || '0'),
        actionCooldowns: [0, 0, 0, 0, 0, 0],
        selectedAction: -1,
        day: 1,
        dayTimer: 0,
        dayLength: 3600, // 60s per day
        isSleeping: false
    };
}
resetGame(0);

function addParticle(x, y, color, text) {
    G.particles.push({ x, y, vx: (Math.random()-0.5)*2, vy: -2 - Math.random()*2, life: 50, color, text });
}

function showMood(text) {
    G.moodBubble = { text, timer: 120 };
}

// Update pet stats over time
function updatePet() {
    const p = G.pet;
    G.time++;
    G.dayTimer++;

    if (G.dayTimer >= G.dayLength) {
        G.dayTimer = 0;
        G.day++;
        G.coins += 10 + G.pet.stage * 5;
    }

    // Decay over time
    if (G.time % 120 === 0) { // every 2 seconds
        p.hunger = Math.max(0, p.hunger - 2);
        p.happiness = Math.max(0, p.happiness - 1);
        p.energy = Math.max(0, p.energy - 1);
        p.cleanliness = Math.max(0, p.cleanliness - 1);
    }

    // Age
    if (G.time % 600 === 0) { // every 10 seconds = 1 pet day
        p.age++;
        p.weight += 0.1;
    }

    // Stage check
    for (let i = STAGE_THRESHOLDS.length - 1; i >= 0; i--) {
        if (p.exp >= STAGE_THRESHOLDS[i] && p.stage < i) {
            p.stage = i;
            showMood('升级到' + STAGE_NAMES[i] + '!');
            playSound(600, 0.3, 'sine');
            addParticle(W/2, 200, '#ff5', '✨ ' + STAGE_NAMES[i] + ' ✨');
            break;
        }
    }

    // Happiness bonus from high stats
    const avg = (p.hunger + p.happiness + p.energy + p.cleanliness) / 4;
    if (avg > 80 && G.time % 300 === 0) {
        G.score++;
        G.coins++;
    }

    // Random movement
    if (G.time % 180 === 0 && !G.isSleeping) {
        p.targetX = 200 + Math.random() * 400;
        p.targetY = 250 + Math.random() * 150;
    }

    // Move towards target
    const dx = p.targetX - p.x;
    const dy = p.targetY - p.y;
    const d = Math.sqrt(dx*dx + dy*dy);
    if (d > 2) {
        p.x += (dx/d) * 0.8;
        p.y += (dy/d) * 0.8;
        p.facing = dx > 0 ? 1 : -1;
    }

    // Bounce animation
    p.bounceY = Math.sin(G.time * 0.08) * 3;
    if (p.anim === 'happy') p.bounceY = Math.sin(G.time * 0.15) * 8;
    if (p.anim === 'eat') p.bounceY = Math.sin(G.time * 0.2) * 5;

    // Anim timer
    if (p.animTimer > 0) {
        p.animTimer--;
        if (p.animTimer <= 0) p.anim = 'idle';
    }

    // Auto mood
    if (p.hunger < 20 && G.time % 180 === 0) showMood('好饿...');
    if (p.happiness < 20 && G.time % 180 === 0) showMood('好无聊...');
    if (p.energy < 20 && G.time % 180 === 0) showMood('好困...');
    if (p.cleanliness < 20 && G.time % 180 === 0) showMood('好脏...');

    // Cooldowns
    G.actionCooldowns = G.actionCooldowns.map(c => Math.max(0, c - 1));

    // Particles
    for (let i = G.particles.length - 1; i >= 0; i--) {
        const pt = G.particles[i];
        pt.x += pt.vx; pt.y += pt.vy; pt.life--;
        if (pt.life <= 0) G.particles.splice(i, 1);
    }

    // Mood bubble
    if (G.moodBubble) {
        G.moodBubble.timer--;
        if (G.moodBubble.timer <= 0) G.moodBubble = null;
    }
}

// Draw pet
function drawPet() {
    const p = G.pet;
    const pt = PET_TYPES[G.petType];
    const size = 30 + p.stage * 8 + p.weight * 0.5;

    ctx.save();
    ctx.translate(p.x, p.y + p.bounceY);
    ctx.scale(p.facing, 1);

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(0, size + 5, size * 0.8, 8, 0, 0, Math.PI * 2); ctx.fill();

    // Body
    ctx.fillStyle = pt.color;
    ctx.beginPath(); ctx.arc(0, 0, size, 0, Math.PI * 2); ctx.fill();

    // Face
    ctx.font = (size * 1.2) + 'px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(pt.icon, 0, size * 0.4);

    // Stage indicator
    ctx.fillStyle = '#fff';
    ctx.font = '10px Arial';
    ctx.fillText(STAGE_NAMES[p.stage], 0, -size - 10);

    ctx.restore();

    // Mood bubble
    if (G.moodBubble) {
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.beginPath();
        ctx.roundRect(p.x - 40, p.y - size - 55, 80, 30, 10);
        ctx.fill();
        ctx.fillStyle = '#333';
        ctx.font = '12px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(G.moodBubble.text, p.x, p.y - size - 35);
    }
}

// Draw stat bar
function drawStatBar(x, y, w, value, max, color, label, icon) {
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.roundRect(x, y, w, 16, 4); ctx.fill();
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.roundRect(x, y, w * (value / max), 16, 4); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '10px Arial';
    ctx.textAlign = 'left';
    ctx.fillText(icon + ' ' + label, x + 4, y + 12);
    ctx.textAlign = 'right';
    ctx.fillText(Math.floor(value) + '%', x + w - 4, y + 12);
}

// Draw action buttons
function drawActions() {
    const startX = 20, startY = 430;
    ACTIONS.forEach((a, i) => {
        const ax = startX + (i % 3) * 140;
        const ay = startY + Math.floor(i / 3) * 60;
        const cd = G.actionCooldowns[i];
        const canUse = cd <= 0 && G.coins >= a.cost;
        ctx.fillStyle = canUse ? '#2a2a4a' : '#1a1a2a';
        ctx.strokeStyle = G.selectedAction === i ? '#f5a' : '#444';
        ctx.lineWidth = G.selectedAction === i ? 2 : 1;
        ctx.beginPath(); ctx.roundRect(ax, ay, 130, 50, 8); ctx.fill(); ctx.stroke();
        ctx.font = '20px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(a.icon, ax + 25, ay + 32);
        ctx.fillStyle = canUse ? '#fff' : '#555';
        ctx.font = '12px Arial';
        ctx.fillText(a.name, ax + 70, ay + 22);
        ctx.fillStyle = a.cost > 0 ? '#fa0' : '#5a5';
        ctx.font = '10px Arial';
        ctx.fillText(a.cost > 0 ? '💰' + a.cost : '免费', ax + 70, ay + 38);
        if (cd > 0) {
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.beginPath(); ctx.roundRect(ax, ay, 130, 50, 8); ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.font = '14px Arial';
            ctx.fillText(Math.ceil(cd / 60) + 's', ax + 65, ay + 30);
        }
    });
}

// Draw info panel
function drawInfo() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, 40);
    ctx.fillStyle = '#fa0';
    ctx.font = '14px Arial';
    ctx.textAlign = 'left';
    ctx.fillText('💰 ' + G.coins, 15, 26);
    ctx.fillStyle = '#f5a';
    ctx.fillText('⭐ ' + G.score, 100, 26);
    ctx.fillStyle = '#5af';
    ctx.fillText('📅 第' + G.day + '天', 180, 26);
    ctx.fillStyle = '#aaa';
    ctx.fillText('🐾 ' + PET_TYPES[G.petType].name + ' ' + STAGE_NAMES[G.pet.stage], 280, 26);
    ctx.fillStyle = '#888';
    ctx.textAlign = 'right';
    ctx.fillText('🏆 最高: ' + G.highScore, W - 15, 26);

    // Stats
    const p = G.pet;
    drawStatBar(20, 50, 180, p.hunger, 100, '#f55', '饱食', '🍖');
    drawStatBar(20, 75, 180, p.happiness, 100, '#fa5', '快乐', '😊');
    drawStatBar(20, 100, 180, p.energy, 100, '#55f', '精力', '⚡');
    drawStatBar(20, 125, 180, p.cleanliness, 100, '#5f5', '清洁', '✨');

    // EXP bar
    const nextStage = Math.min(p.stage + 1, 3);
    const nextExp = STAGE_THRESHOLDS[nextStage];
    drawStatBar(20, 155, 180, p.exp, nextExp, '#c49bff', '经验', '📊');

    // Info text
    ctx.fillStyle = '#aaa';
    ctx.font = '11px Arial';
    ctx.textAlign = 'left';
    ctx.fillText('体重: ' + p.weight.toFixed(1) + 'kg  智力: ' + p.intelligence + '  年龄: ' + p.age + '天', 20, 190);
}

// Game over screen
function drawEndScreen() {
    ctx.fillStyle = 'rgba(0,0,0,0.8)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#f5a';
    ctx.font = '48px Arial';
    ctx.fillText('宠物养成结束', W/2, H/2 - 60);
    ctx.fillStyle = '#fff';
    ctx.font = '20px Arial';
    ctx.fillText('得分: ' + G.score + '  天数: ' + G.day, W/2, H/2);
    ctx.fillText('最高分: ' + G.highScore, W/2, H/2 + 30);
    ctx.fillStyle = '#f5a';
    ctx.beginPath(); ctx.roundRect(W/2 - 80, H/2 + 50, 160, 45, 10); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '18px Arial';
    ctx.fillText('重新开始', W/2, H/2 + 78);
}

// Render
function render() {
    // Background - room
    ctx.fillStyle = '#1a2a1a';
    ctx.fillRect(0, 0, W, H);
    // Floor
    ctx.fillStyle = '#2a3a2a';
    ctx.fillRect(0, 250, W, H - 250);
    // Wall decoration
    ctx.fillStyle = 'rgba(255,255,255,0.03)';
    for (let x = 0; x < W; x += 50) {
        ctx.fillRect(x, 250, 1, H - 250);
    }
    // Window
    ctx.fillStyle = '#3a5a7a';
    ctx.fillRect(350, 80, 100, 120);
    ctx.strokeStyle = '#5a7a9a';
    ctx.lineWidth = 3;
    ctx.strokeRect(350, 80, 100, 120);
    ctx.strokeStyle = '#5a7a9a';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(400, 80); ctx.lineTo(400, 200); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(350, 140); ctx.lineTo(450, 140); ctx.stroke();

    drawPet();
    drawInfo();
    drawActions();

    // Particles
    G.particles.forEach(p => {
        ctx.globalAlpha = p.life / 50;
        ctx.fillStyle = p.color;
        ctx.font = '14px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(p.text, p.x, p.y);
    });
    ctx.globalAlpha = 1;

    // Low stat warnings
    const p = G.pet;
    if (p.hunger < 15 || p.happiness < 15 || p.energy < 15 || p.cleanliness < 15) {
        ctx.fillStyle = 'rgba(255,0,0,0.3)';
        ctx.fillRect(0, 0, W, 4);
    }

    if (G.state === 'gameover') drawEndScreen();
}

// Input
function getCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width, scaleY = H / rect.height;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
}

function handleClick(e) {
    const pos = getCanvasPos(e);

    if (G.state === 'gameover') {
        if (pos.x > W/2-80 && pos.x < W/2+80 && pos.y > H/2+50 && pos.y < H/2+95) {
            resetGame(G.petType);
            G.state = 'playing';
        }
        return;
    }

    if (G.state !== 'playing') return;

    // Action buttons
    const startX = 20, startY = 430;
    ACTIONS.forEach((a, i) => {
        const ax = startX + (i % 3) * 140;
        const ay = startY + Math.floor(i / 3) * 60;
        if (pos.x >= ax && pos.x <= ax + 130 && pos.y >= ay && pos.y <= ay + 50) {
            if (G.actionCooldowns[i] <= 0 && G.coins >= a.cost) {
                G.coins -= a.cost;
                a.effect(G.pet);
                G.actionCooldowns[i] = 180; // 3 second cooldown
                G.pet.anim = a.name === '喂食' ? 'eat' : a.name === '玩耍' || a.name === '训练' ? 'happy' : 'idle';
                G.pet.animTimer = 60;
                playSound(500 + i * 50, 0.1, 'sine');
                addParticle(G.pet.x, G.pet.y - 40, '#fff', a.icon);
                G.score += 2;
            }
        }
    });

    // Pet click (pet it)
    const p = G.pet;
    const size = 30 + p.stage * 8 + p.weight * 0.5;
    const dx = pos.x - p.x, dy = pos.y - p.y;
    if (Math.sqrt(dx*dx + dy*dy) < size + 10) {
        p.happiness = Math.min(100, p.happiness + 5);
        p.anim = 'happy';
        p.animTimer = 40;
        playSound(700, 0.08, 'sine');
        addParticle(p.x, p.y - 30, '#f55', '❤️');
        G.score++;
    }
}

canvas.addEventListener('click', handleClick);
canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    if (e.changedTouches) handleClick({ clientX: e.changedTouches[0].clientX, clientY: e.changedTouches[0].clientY });
});

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        if (G.state === 'playing') {
            G.state = 'paused';
            document.getElementById('pauseScreen').style.display = 'flex';
        }
    }
    // Number keys for actions
    if (e.key >= '1' && e.key <= '6') {
        const i = parseInt(e.key) - 1;
        if (G.actionCooldowns[i] <= 0 && G.coins >= ACTIONS[i].cost) {
            G.coins -= ACTIONS[i].cost;
            ACTIONS[i].effect(G.pet);
            G.actionCooldowns[i] = 180;
            G.pet.anim = ACTIONS[i].name === '喂食' ? 'eat' : 'happy';
            G.pet.animTimer = 60;
            playSound(500 + i * 50, 0.1, 'sine');
            addParticle(G.pet.x, G.pet.y - 40, '#fff', ACTIONS[i].icon);
            G.score += 2;
        }
    }
});

// Pet selection buttons
document.querySelectorAll('.petSelect').forEach(btn => {
    btn.addEventListener('click', () => {
        audioCtx.resume();
        const petType = parseInt(btn.dataset.pet);
        document.getElementById('startScreen').style.display = 'none';
        document.getElementById('pauseBtn').style.display = 'block';
        resetGame(petType);
    });
});

document.getElementById('pauseBtn').addEventListener('click', () => {
    if (G.state === 'playing') {
        G.state = 'paused';
        document.getElementById('pauseScreen').style.display = 'flex';
    }
});
document.getElementById('resumeBtn').addEventListener('click', () => {
    G.state = 'playing';
    document.getElementById('pauseScreen').style.display = 'none';
});
document.getElementById('restartBtn').addEventListener('click', () => {
    resetGame(G.petType);
    document.getElementById('pauseScreen').style.display = 'none';
});

let lastTime = 0;
function gameLoop(time) {
    const dt = time - lastTime;
    if (dt >= 16) {
        lastTime = time;
        if (G.state === 'playing') updatePet();
    }
    render();
    requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);


// ===== 游戏工坊统一广告系统 =====
const GameMonetize = {
	adsterra: { enabled: !/localhost|127\.0\.0\.1/.test(location.hostname) },
	sponsor: { enabled: true, wechatQR: '', alipayQR: '' },
	interstitial: { enabled: true, cooldownMs: 180000, gameCount: 2 },
	_lastInterTime: 0, _deathCount: 0,
	_gameOverDetected: false,
	init() {
		const banner = document.getElementById('adBanner');
		if (banner && this.adsterra.enabled) {
			const s1 = document.createElement('script');
			s1.src = 'https://pl29544740.effectivecpmnetwork.com/de/26/0e/de260e17b6a348e3489772a87b1cedf1.js';
			s1.async = true;
			banner.appendChild(s1);
		}
		const spBtn = document.getElementById('sponsorBtn');
		const spPanel = document.getElementById('sponsorPanel');
		const spClose = document.getElementById('sponsorClose');
		if (spBtn && spPanel && spClose && this.sponsor.enabled) {
			spBtn.onclick = () => { spPanel.style.display = 'flex'; spPanel.style.pointerEvents = 'auto'; };
			spClose.onclick = () => { spPanel.style.display = 'none'; spPanel.style.pointerEvents = 'none'; };
			spPanel.onclick = (e) => { if (e.target === spPanel) { spPanel.style.display = 'none'; spPanel.style.pointerEvents = 'none'; } };
		} else if (spBtn) { spBtn.style.display = 'none'; }
		const skipBtn = document.getElementById('skipInterstitial');
		const interstitial = document.getElementById('interstitialAd');
		if (skipBtn && interstitial) {
			skipBtn.onclick = () => {
				interstitial.style.display = 'none'; interstitial.style.pointerEvents = 'none';
				if (this._reviveCallback) { const cb = this._reviveCallback; this._reviveCallback = null; cb(); }
			};
		}
		// 自动检测游戏结束状态
		this._startGameOverWatcher();
	},
	_startGameOverWatcher() {
		// 检测#restartBtn或包含"重新开始"/"再来一局"的按钮变为可见
		const checkGameOver = () => {
			if (this._gameOverDetected) return;
			// 方法1: 检测#restartBtn可见
			const restartBtn = document.getElementById('restartBtn');
			if (restartBtn && restartBtn.offsetParent !== null && getComputedStyle(restartBtn).display !== 'none') {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
			// 方法2: 检测#gameOverScreen可见
			const goScreen = document.getElementById('gameOverScreen');
			if (goScreen && getComputedStyle(goScreen).display !== 'none') {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
			// 方法3: 检测screen-gameover可见
			const goScreen2 = document.getElementById('screen-gameover');
			if (goScreen2 && !goScreen2.classList.contains('hidden')) {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
		};
		// 每500ms检查一次
		this._goInterval = setInterval(() => {
			checkGameOver();
			// 如果检测到了，等2秒后重置标志，允许下次检测
			if (this._gameOverDetected) {
				setTimeout(() => { this._gameOverDetected = false; }, 2000);
			}
		}, 500);
	},
	requestRevive(callback) {
		this._reviveCallback = callback || null;
		const el = document.getElementById('interstitialAd');
		if (!el) { if (callback) callback(); return; }
		const s2 = document.createElement('script');
		s2.src = 'https://pl29544742.effectivecpmnetwork.com/be/a9/6d/bea96d779c0ee07c2b15613852dd3e70.js';
		s2.async = true;
		document.getElementById('interstitialAdSlot').innerHTML = '';
		document.getElementById('interstitialAdSlot').appendChild(s2);
		el.style.display = 'flex'; el.style.pointerEvents = 'auto';

		setTimeout(() => { const slot = document.getElementById('interstitialAdSlot'); if (slot && slot.innerHTML.includes('加载中')) { slot.innerHTML = '<div style=color:#aaa;font:13px Microsoft YaHei,sans-serif>广告暂时无法加载<br>点击下方按钮继续</div>'; } }, 3000);
		const skipBtn = document.getElementById('skipInterstitial');
		if (skipBtn) {
			skipBtn.textContent = '5 秒后可跳过'; skipBtn.disabled = true;
			let cd = 5;
			const timer = setInterval(() => {
				cd--;
				if (cd <= 0) { clearInterval(timer); skipBtn.textContent = '跳过广告 ▶'; skipBtn.disabled = false; }
				else { skipBtn.textContent = cd + ' 秒后可跳过'; }
			}, 1000);
		}
	},
	onGameOver() {
		this._deathCount++;
		if (!this.interstitial.enabled) return;
		if (this._deathCount < this.interstitial.gameCount) return;
		if (Date.now() - this._lastInterTime < this.interstitial.cooldownMs) return;
		this._lastInterTime = Date.now(); this._deathCount = 0;
		this.requestRevive(null);
	},
};
GameMonetize.init();
</script>
