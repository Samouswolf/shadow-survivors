<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>像素画家</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; color: #fff; overflow: hidden; }
        
        .game-container { width: 100%; flex: 1; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: #fff; }
        
        .canvas-area { flex: 1; display: flex; justify-content: center; align-items: center; overflow: auto; }
        .pixel-grid { display: grid; gap: 1px; background: #333; padding: 2px; border-radius: 5px; }
        .pixel { width: 20px; height: 20px; background: #fff; cursor: pointer; }
        
        .tools { display: flex; flex-wrap: wrap; gap: 10px; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; }
        
        .color-btn { width: 35px; height: 35px; border-radius: 5px; border: none; cursor: pointer; }
        .color-btn.selected { border: 2px solid #fff; }
        
        .tool-btn { padding: 10px 20px; border: none; border-radius: 10px; font-size: 14px; cursor: pointer; background: rgba(255,255,255,0.2); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="title">🎮 像素画家</div>
            <button class="tool-btn" onclick="clearGrid()">🗑️ 清空</button>
        </div>
        
        <div class="canvas-area">
            <div class="pixel-grid" id="pixelGrid"></div>
        </div>
        
        <div class="tools">
            <button class="color-btn selected" style="background: #fff;" onclick="setColor('#fff')"></button>
            <button class="color-btn" style="background: #000;" onclick="setColor('#000')"></button>
            <button class="color-btn" style="background: #ff6b6b;" onclick="setColor('#ff6b6b')"></button>
            <button class="color-btn" style="background: #4ecdc4;" onclick="setColor('#4ecdc4')"></button>
            <button class="color-btn" style="background: #ffd700;" onclick="setColor('#ffd700')"></button>
            <button class="color-btn" style="background: #667eea;" onclick="setColor('#667eea')"></button>
            <button class="color-btn" style="background: #f093fb;" onclick="setColor('#f093fb')"></button>
            <button class="color-btn" style="background: #48c78e;" onclick="setColor('#48c78e')"></button>
            <button class="color-btn" style="background: #ffa502;" onclick="setColor('#ffa502')"></button>
            <button class="color-btn" style="background: #ff8c42;" onclick="setColor('#ff8c42')"></button>
            <button class="color-btn" style="background: #a8e063;" onclick="setColor('#a8e063')"></button>
            <button class="color-btn" style="background: #1a1a2e;" onclick="setColor('#1a1a2e')"></button>
        </div>
    </div>
    
    <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <script>
        const GAME_NAME = '像素画家';
        GameCore.init({ highScore: GAME_NAME });
        
        const gridSize = 16;
        const pixelGrid = document.getElementById('pixelGrid');
        let grid = [];
        let currentColor = '#fff';
        
        function initGrid() {
            pixelGrid.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
            grid = [];
            
            for (let y = 0; y < gridSize; y++) {
                grid[y] = [];
                for (let x = 0; x < gridSize; x++) {
                    grid[y][x] = '#fff';
                    
                    const pixel = document.createElement('div');
                    pixel.className = 'pixel';
                    pixel.style.backgroundColor = '#fff';
                    pixel.onclick = () => fillPixel(x, y);
                    pixel.onmouseenter = (e) => {
                        if (e.buttons === 1) fillPixel(x, y);
                    };
                    
                    pixelGrid.appendChild(pixel);
                }
            }
        }
        
        function fillPixel(x, y) {
            grid[y][x] = currentColor;
            const index = y * gridSize + x;
            pixelGrid.children[index].style.backgroundColor = currentColor;
        }
        
        function setColor(color) {
            currentColor = color;
            document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('selected'));
            event.target.classList.add('selected');
        }
        
        function clearGrid() {
            for (let y = 0; y < gridSize; y++) {
                for (let x = 0; x < gridSize; x++) {
                    fillPixel(x, y);
                }
            }
            setColor('#fff');
        }
        
        initGrid();
        GameCore.touch.enableAllButtons();
    </script>
</body>
</html>
