<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>医院模拟</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; color: #fff; }
        
        .game-container { width: 100%; flex: 1; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: #ffd700; }
        .stats { display: flex; gap: 20px; font-size: 14px; }
        
        .ward-area { flex: 1; display: flex; flex-direction: column; gap: 15px; }
        
        .ward-card { padding: 20px; background: rgba(255,255,255,0.1); border-radius: 15px; display: flex; justify-content: space-between; align-items: center; }
        .patient-info { display: flex; align-items: center; gap: 15px; }
        .patient-icon { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .patient-details h3 { font-size: 18px; }
        .patient-details p { font-size: 12px; opacity: 0.7; }
        
        .treat-btn { padding: 10px 20px; border: none; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; background: linear-gradient(135deg, #48c78e, #4ecdc4); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="title">🏥 医院模拟</div>
            <div class="stats">
                <span>💰 资金: <span id="money">1000</span></span>
                <span>👥 治愈: <span id="cured">0</span></span>
                <span>⚕️ 医生: <span id="doctors">3</span></span>
            </div>
        </div>
        
        <div class="ward-area" id="wardArea">
            <div class="ward-card">
                <div class="patient-info">
                    <div class="patient-icon" style="background: #ff6b6b;">🤒</div>
                    <div class="patient-details">
                        <h3>感冒患者</h3>
                        <p>症状: 发烧、咳嗽 | 治疗费: 50金币</p>
                    </div>
                </div>
                <button class="treat-btn" onclick="treatPatient('cold', 50)">治疗</button>
            </div>
            
            <div class="ward-card">
                <div class="patient-info">
                    <div class="patient-icon" style="background: #ffa502;">🤕</div>
                    <div class="patient-details">
                        <h3>受伤患者</h3>
                        <p>症状: 骨折、疼痛 | 治疗费: 100金币</p>
                    </div>
                </div>
                <button class="treat-btn" onclick="treatPatient('injury', 100)">治疗</button>
            </div>
            
            <div class="ward-card">
                <div class="patient-info">
                    <div class="patient-icon" style="background: #667eea;">😷</div>
                    <div class="patient-details">
                        <h3>流感患者</h3>
                        <p>症状: 高烧、乏力 | 治疗费: 80金币</p>
                    </div>
                </div>
                <button class="treat-btn" onclick="treatPatient('flu', 80)">治疗</button>
            </div>
            
            <div class="ward-card">
                <div class="patient-info">
                    <div class="patient-icon" style="background: #f093fb;">🩺</div>
                    <div class="patient-details">
                        <h3>体检患者</h3>
                        <p>症状: 常规检查 | 治疗费: 30金币</p>
                    </div>
                </div>
                <button class="treat-btn" onclick="treatPatient('checkup', 30)">治疗</button>
            </div>
        </div>
        
        <div style="display: flex; gap: 10px; justify-content: center;">
            <button class="treat-btn" onclick="hireDoctor()" style="width: 150px;">👨‍⚕️ 雇佣医生 (200)</button>
            <button class="treat-btn" onclick="upgradeEquipment()" style="width: 150px;">🔧 升级设备 (300)</button>
        </div>
    </div>
    
    <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>

    <script src="game_core.js"></script>
    <script>
        const GAME_NAME = '医院模拟';
        GameCore.init({ highScore: GAME_NAME });
        
        let money = 1000;
        let cured = 0;
        let doctors = 3;
        
        function initGame() {
            const highScore = GameCore.highScore.get(GAME_NAME);
            cured = highScore || 0;
            updateUI();
        }
        
        function updateUI() {
            document.getElementById('money').textContent = money;
            document.getElementById('cured').textContent = cured;
            document.getElementById('doctors').textContent = doctors;
            
            GameCore.highScore.set(GAME_NAME, cured);
        }
        
        function treatPatient(type, cost) {
            if (doctors > 0) {
                money += cost;
                cured++;
                doctors--;
                
                GameCore.hints.show('治疗成功！获得收益！');
                
                setTimeout(() => {
                    doctors++;
                    updateUI();
                }, 2000);
                
                updateUI();
            } else {
                GameCore.hints.show('没有医生可用！');
            }
        }
        
        function hireDoctor() {
            if (money >= 200) {
                money -= 200;
                doctors++;
                GameCore.hints.show('雇佣了新医生！');
                updateUI();
            } else {
                GameCore.hints.show('资金不足！');
            }
        }
        
        function upgradeEquipment() {
            if (money >= 300) {
                money -= 300;
                GameCore.hints.show('设备升级！治疗效率提升！');
                updateUI();
            } else {
                GameCore.hints.show('资金不足！');
            }
        }
        
        initGame();
        GameCore.touch.enableAllButtons();
    </script>
</body>
</html>
