<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>投票表决</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; color: #fff; }
        
        .game-container { width: 100%; flex: 1; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: #ffd700; }
        .round { font-size: 14px; opacity: 0.7; }
        
        .question-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 30px; background: rgba(255,255,255,0.05); border-radius: 15px; margin-bottom: 15px; text-align: center; }
        .question { font-size: 28px; font-weight: bold; margin-bottom: 30px; }
        .options { display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 400px; }
        .option-btn { padding: 20px; border: 2px solid rgba(255,255,255,0.2); border-radius: 15px; font-size: 18px; cursor: pointer; transition: all 0.2s; background: rgba(255,255,255,0.05); }
        .option-btn:hover { border-color: #ffd700; background: rgba(255,215,0,0.1); }
        .option-btn.selected { border-color: #4ecdc4; background: rgba(78,205,196,0.2); }
        
        .results-area { display: none; padding: 20px; background: rgba(72,199,142,0.1); border-radius: 15px; margin-bottom: 15px; }
        .results-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; text-align: center; }
        .result-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; margin-bottom: 10px; background: rgba(0,0,0,0.2); border-radius: 10px; }
        .result-text { flex: 1; }
        .result-bar-container { flex: 2; height: 20px; background: rgba(255,255,255,0.2); border-radius: 10px; overflow: hidden; margin-left: 10px; }
        .result-bar { height: 100%; border-radius: 10px; transition: width 0.5s; }
        
        .controls { display: flex; gap: 10px; justify-content: center; }
        .btn { padding: 12px 25px; border: none; border-radius: 15px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; }
        .btn-secondary { background: rgba(255,255,255,0.2); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="title">🗳️ 投票表决</div>
            <div class="round">第 <span id="round">1</span> 轮</div>
        </div>
        
        <div class="question-area" id="questionArea">
            <div class="question" id="question">你最喜欢的颜色是？</div>
            <div class="options" id="options">
                <button class="option-btn" onclick="vote('A')" id="optA">🔴 红色</button>
                <button class="option-btn" onclick="vote('B')" id="optB">🔵 蓝色</button>
                <button class="option-btn" onclick="vote('C')" id="optC">🟢 绿色</button>
            </div>
        </div>
        
        <div class="results-area" id="resultsArea">
            <div class="results-title">📊 投票结果</div>
            <div class="result-item">
                <div class="result-text">🔴 红色</div>
                <div class="result-bar-container">
                    <div class="result-bar" id="resA" style="width: 30%; background: #ff6b6b;"></div>
                </div>
            </div>
            <div class="result-item">
                <div class="result-text">🔵 蓝色</div>
                <div class="result-bar-container">
                    <div class="result-bar" id="resB" style="width: 40%; background: #667eea;"></div>
                </div>
            </div>
            <div class="result-item">
                <div class="result-text">🟢 绿色</div>
                <div class="result-bar-container">
                    <div class="result-bar" id="resC" style="width: 30%; background: #48c78e;"></div>
                </div>
            </div>
        </div>
        
        <div class="controls" id="controls">
            <button class="btn btn-primary" onclick="nextRound()">➡️ 下一题</button>
            <button class="btn btn-secondary" onclick="resetGame()">🔄 重新开始</button>
        </div>
    </div>
    
    <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <script>
        const GAME_NAME = '投票表决';
        GameCore.init({ highScore: GAME_NAME });
        
        const questions = [
            {
                question: '你最喜欢的颜色是？',
                options: { A: '🔴 红色', B: '🔵 蓝色', C: '🟢 绿色' },
                colors: { A: '#ff6b6b', B: '#667eea', C: '#48c78e' }
            },
            {
                question: '周末最想做什么？',
                options: { A: '🏠 宅在家', B: '🏃 户外运动', C: '👥 和朋友聚会' },
                colors: { A: '#f093fb', B: '#ffa502', C: '#4ecdc4' }
            },
            {
                question: '最喜欢的食物？',
                options: { A: '🍕 披萨', B: '🍣 寿司', C: '🍜 拉面' },
                colors: { A: '#ffd700', B: '#f5576c', C: '#48c78e' }
            },
            {
                question: '最喜欢的季节？',
                options: { A: '🌸 春天', B: '☀️ 夏天', C: '🍂 秋天' },
                colors: { A: '#f093fb', B: '#ffa502', C: '#ff6b6b' }
            },
            {
                question: '最喜欢的动物？',
                options: { A: '🐱 猫咪', B: '🐶 狗狗', C: '🐰 兔子' },
                colors: { A: '#ffa502', B: '#ff6b6b', C: '#f093fb' }
            }
        ];
        
        let currentRound = 0;
        let votes = {};
        let voted = false;
        
        function initGame() {
            currentRound = 0;
            voted = false;
            loadQuestion();
        }
        
        function loadQuestion() {
            const q = questions[currentRound];
            
            document.getElementById('question').textContent = q.question;
            document.getElementById('optA').textContent = q.options.A;
            document.getElementById('optB').textContent = q.options.B;
            document.getElementById('optC').textContent = q.options.C;
            
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
            
            document.getElementById('questionArea').style.display = 'flex';
            document.getElementById('resultsArea').style.display = 'none';
            document.getElementById('controls').style.display = 'none';
            
            voted = false;
            votes = { A: 2, B: 2, C: 2 };
        }
        
        function vote(option) {
            if (voted) return;
            
            voted = true;
            votes[option]++;
            
            document.getElementById(`opt${option}`).classList.add('selected');
            
            setTimeout(() => {
                showResults();
            }, 1000);
        }
        
        function showResults() {
            const q = questions[currentRound];
            const total = votes.A + votes.B + votes.C;
            
            document.getElementById('questionArea').style.display = 'none';
            document.getElementById('resultsArea').style.display = 'block';
            document.getElementById('controls').style.display = 'flex';
            
            ['A', 'B', 'C'].forEach(opt => {
                const percent = Math.round((votes[opt] / total) * 100);
                const bar = document.getElementById(`res${opt}`);
                bar.style.width = percent + '%';
                bar.style.background = q.colors[opt];
            });
            
            let winner = '';
            let maxVotes = 0;
            Object.keys(votes).forEach(opt => {
                if (votes[opt] > maxVotes) {
                    maxVotes = votes[opt];
                    winner = opt;
                }
            });
            
            GameCore.hints.show(`🎉 投票结束！${q.options[winner]} 获胜！`);
            
            GameCore.highScore.set(GAME_NAME, currentRound + 1);
        }
        
        function nextRound() {
            currentRound++;
            document.getElementById('round').textContent = currentRound + 1;
            
            if (currentRound >= questions.length) {
                currentRound = 0;
                document.getElementById('round').textContent = 1;
                GameCore.hints.show('🎊 所有问题已完成！');
            }
            
            loadQuestion();
        }
        
        function resetGame() {
            initGame();
        }
        
        initGame();
        GameCore.touch.enableAllButtons();
    </script>
</body>
</html>
