<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>投票表决</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; color: #fff; }
        
        .game-container { width: 100%; flex: 1; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: #ffd700; }
        .round { font-size: 14px; opacity: 0.7; }
        
        .question-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 30px; background: rgba(255,255,255,0.05); border-radius: 15px; margin-bottom: 15px; text-align: center; }
        .question { font-size: 28px; font-weight: bold; margin-bottom: 30px; }
        .options { display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 400px; }
        .option-btn { padding: 20px; border: 2px solid rgba(255,255,255,0.2); border-radius: 15px; font-size: 18px; cursor: pointer; transition: all 0.2s; background: rgba(255,255,255,0.05); }
        .option-btn:hover { border-color: #ffd700; background: rgba(255,215,0,0.1); }
        .option-btn.selected { border-color: #4ecdc4; background: rgba(78,205,196,0.2); }
        
        .results-area { display: none; padding: 20px; background: rgba(72,199,142,0.1); border-radius: 15px; margin-bottom: 15px; }
        .results-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; text-align: center; }
        .result-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; margin-bottom: 10px; background: rgba(0,0,0,0.2); border-radius: 10px; }
        .result-text { flex: 1; }
        .result-bar-container { flex: 2; height: 20px; background: rgba(255,255,255,0.2); border-radius: 10px; overflow: hidden; margin-left: 10px; }
        .result-bar { height: 100%; border-radius: 10px; transition: width 0.5s; }
        
        .controls { display: flex; gap: 10px; justify-content: center; }
        .btn { padding: 12px 25px; border: none; border-radius: 15px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; }
        .btn-secondary { background: rgba(255,255,255,0.2); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }
    /* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */
/* [BATCH-FIX:ad-components-css] */
.sponsor-btn{position:fixed;top:44px;right:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:3px 9px;border-radius:10px;font:11px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.sponsor-panel.show{display:flex}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.interstitial-ad.show{display:flex}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* [/BATCH-FIX:ad-components-css] */
</style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="title">🗳️ 投票表决</div>
            <div class="round">第 <span id="round">1</span> 轮</div>
        </div>
        
        <div class="question-area" id="questionArea">
            <div class="question" id="question">你最喜欢的颜色是？</div>
            <div class="options" id="options">
                <button class="option-btn" onclick="vote('A')" id="optA">🔴 红色</button>
                <button class="option-btn" onclick="vote('B')" id="optB">🔵 蓝色</button>
                <button class="option-btn" onclick="vote('C')" id="optC">🟢 绿色</button>
            </div>
        </div>
        
        <div class="results-area" id="resultsArea">
            <div class="results-title">📊 投票结果</div>
            <div class="result-item">
                <div class="result-text">🔴 红色</div>
                <div class="result-bar-container">
                    <div class="result-bar" id="resA" style="width: 30%; background: #ff6b6b;"></div>
                </div>
            </div>
            <div class="result-item">
                <div class="result-text">🔵 蓝色</div>
                <div class="result-bar-container">
                    <div class="result-bar" id="resB" style="width: 40%; background: #667eea;"></div>
                </div>
            </div>
            <div class="result-item">
                <div class="result-text">🟢 绿色</div>
                <div class="result-bar-container">
                    <div class="result-bar" id="resC" style="width: 30%; background: #48c78e;"></div>
                </div>
            </div>
        </div>
        
        <div class="controls" id="controls">
            <button class="btn btn-primary" onclick="nextRound()">➡️ 下一题</button>
            <button class="btn btn-secondary" onclick="resetGame()">🔄 重新开始</button>
        </div>
    </div>
    
    <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <script>
        const GAME_NAME = '投票表决';
        GameCore.init({ highScore: GAME_NAME });
        
        const questions = [
            {
                question: '你最喜欢的颜色是？',
                options: { A: '🔴 红色', B: '🔵 蓝色', C: '🟢 绿色' },
                colors: { A: '#ff6b6b', B: '#667eea', C: '#48c78e' }
            },
            {
                question: '周末最想做什么？',
                options: { A: '🏠 宅在家', B: '🏃 户外运动', C: '👥 和朋友聚会' },
                colors: { A: '#f093fb', B: '#ffa502', C: '#4ecdc4' }
            },
            {
                question: '最喜欢的食物？',
                options: { A: '🍕 披萨', B: '🍣 寿司', C: '🍜 拉面' },
                colors: { A: '#ffd700', B: '#f5576c', C: '#48c78e' }
            },
            {
                question: '最喜欢的季节？',
                options: { A: '🌸 春天', B: '☀️ 夏天', C: '🍂 秋天' },
                colors: { A: '#f093fb', B: '#ffa502', C: '#ff6b6b' }
            },
            {
                question: '最喜欢的动物？',
                options: { A: '🐱 猫咪', B: '🐶 狗狗', C: '🐰 兔子' },
                colors: { A: '#ffa502', B: '#ff6b6b', C: '#f093fb' }
            }
        ];
        
        let currentRound = 0;
        let votes = {};
        let voted = false;
        
        function initGame() {
            currentRound = 0;
            voted = false;
            loadQuestion();
        }
        
        function loadQuestion() {
            const q = questions[currentRound];
            
            document.getElementById('question').textContent = q.question;
            document.getElementById('optA').textContent = q.options.A;
            document.getElementById('optB').textContent = q.options.B;
            document.getElementById('optC').textContent = q.options.C;
            
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
            
            document.getElementById('questionArea').style.display = 'flex';
            document.getElementById('resultsArea').style.display = 'none';
            document.getElementById('controls').style.display = 'none';
            
            voted = false;
            votes = { A: 2, B: 2, C: 2 };
        }
        
        function vote(option) {
            if (voted) return;
            
            voted = true;
            votes[option]++;
            
            document.getElementById(`opt${option}`).classList.add('selected');
            
            setTimeout(() => {
                showResults();
            }, 1000);
        }
        
        function showResults() {
            const q = questions[currentRound];
            const total = votes.A + votes.B + votes.C;
            
            document.getElementById('questionArea').style.display = 'none';
            document.getElementById('resultsArea').style.display = 'block';
            document.getElementById('controls').style.display = 'flex';
            
            ['A', 'B', 'C'].forEach(opt => {
                const percent = Math.round((votes[opt] / total) * 100);
                const bar = document.getElementById(`res${opt}`);
                bar.style.width = percent + '%';
                bar.style.background = q.colors[opt];
            });
            
            let winner = '';
            let maxVotes = 0;
            Object.keys(votes).forEach(opt => {
                if (votes[opt] > maxVotes) {
                    maxVotes = votes[opt];
                    winner = opt;
                }
            });
            
            GameCore.hints.show(`🎉 投票结束！${q.options[winner]} 获胜！`);
            
            GameCore.highScore.set(GAME_NAME, currentRound + 1);
        }
        
        function nextRound() {
            currentRound++;
            document.getElementById('round').textContent = currentRound + 1;
            
            if (currentRound >= questions.length) {
                currentRound = 0;
                document.getElementById('round').textContent = 1;
                GameCore.hints.show('🎊 所有问题已完成！');
            }
            
            loadQuestion();
        }
        
        function resetGame() {
            initGame();
        }
        
        initGame();
        GameCore.touch.enableAllButtons();
    </script>
<!-- [BATCH-FIX:responsive-js] -->
<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>
<!-- [/BATCH-FIX:responsive-js] -->
<!-- [BATCH-FIX:touch-support] -->
<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>
<!-- [/BATCH-FIX:touch-support] -->

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
