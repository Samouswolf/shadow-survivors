<head>

<style>

canvas{display:block;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
</style>
<style>/* 游戏工坊广告系统 */
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);height:90px;max-height:90px;overflow:hidden;contain:layout style paint;pointer-events:none!important}.ad-banner-container,.ad-banner-container *{pointer-events:none!important}.ad-banner-container iframe{max-height:90px;pointer-events:none!important}
.ad-banner-container iframe{max-width:100%}
.ad-label{position:absolute;top:1px;right:6px;font:9px "Microsoft YaHei",sans-serif;color:rgba(255,255,255,.35)}

.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}

.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}

.interstitial-ad .ad-content{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;text-align:center;min-width:280px;max-width:400px}

.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
</style>

<body>
<canvas id="cv"></canvas>
<div class="ad-banner-container"><span class="ad-label">广告</span><iframe src="about:blank" width="728" height="90" frameborder="0" scrolling="no" style="border:0"></iframe></div>

    </div>
</div>
<script>
function openSponsor(){document.getElementById("sponsorPanel").style.display="flex"}
function closeSponsor(){document.getElementById("sponsorPanel").style.display="none"}
function showInterstitial(){var el=document.getElementById("interstitialAd");el.style.display="flex";el.style.pointerEvents="auto";var btn=el.querySelector(".skip-btn"),t=3;btn.textContent="跳过 ("+t+"s)";var iv=setInterval(function(){t--;if(t<=0){clearInterval(iv);closeInterstitial()}else btn.textContent="跳过 ("+t+"s)"},1000)}
function closeInterstitial(){var el=document.getElementById("interstitialAd");el.style.display="none";el.style.pointerEvents="none"}
</script>
<script>
(function(){
"use strict";

/* ===== Canvas Setup ===== */
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=800,H=600;
function resize(){
    var s=Math.min(innerWidth/W,(innerHeight-90)/H);
    cv.width=W;cv.height=H;
    cv.style.width=W*s+"px";cv.style.height=H*s+"px";
}
resize();addEventListener("resize",resize);

/* ===== Audio ===== */
var audioCtx=null;
function ensureAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
function playTone(freq,dur,vol,type){
    if(!audioCtx)return;
    var o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=type||"sine";o.frequency.value=freq;
    g.gain.setValueAtTime(vol||0.15,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
    o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur);
}
function sfxCatch(){playTone(600,0.08,0.18,"sine");playTone(900,0.1,0.12,"sine")}
function sfxPerfect(){playTone(880,0.1,0.22,"sine");playTone(1100,0.15,0.16,"sine");playTone(1320,0.2,0.12,"sine")}
function sfxCombo(n){playTone(500+n*60,0.06,0.15,"sine");setTimeout(function(){playTone(700+n*60,0.08,0.12,"sine")},50)}
function sfxThrow(){playTone(300,0.1,0.12,"triangle")}
function sfxDrop(){playTone(120,0.3,0.15,"sawtooth");playTone(80,0.4,0.1,"square")}
function sfxSpin(){playTone(440,0.03,0.06,"sine")}
function sfxGameOver(){playTone(400,0.2,0.12,"square");setTimeout(function(){playTone(300,0.2,0.12,"square")},200);setTimeout(function(){playTone(200,0.4,0.12,"square")},400)}
function sfxNewRecord(){playTone(600,0.1,0.18,"sine");setTimeout(function(){playTone(800,0.1,0.18,"sine")},100);setTimeout(function(){playTone(1000,0.3,0.18,"sine")},200)}
function sfxTrick(){playTone(1000,0.05,0.15,"sine");setTimeout(function(){playTone(1200,0.05,0.12,"sine")},40);setTimeout(function(){playTone(1500,0.08,0.1,"sine")},80)}
function sfxBtn(){playTone(500,0.08,0.12,"sine")}

/* ===== Game States ===== */
var ST_MENU=0,ST_PLAY=1,ST_OVER=2,ST_PAUSE=3;

/* ===== Trick Data ===== */
var TRICKS=[
    {name:"基本抖",score:5,reqCombo:0,diff:1,desc:"上下抖动保持旋转"},
    {name:"抛接",score:15,reqCombo:2,diff:2,desc:"抛向空中再接住"},
    {name:"绕线",score:25,reqCombo:4,diff:3,desc:"绳子绕空竹一圈"},
    {name:"望月",score:40,reqCombo:6,diff:4,desc:"高抛后背后接住"},
    {name:"翻山越岭",score:55,reqCombo:8,diff:5,desc:"空竹翻过身体接住"},
    {name:"盘丝",score:70,reqCombo:10,diff:6,desc:"连续缠绕再释放"},
    {name:"金鸡上架",score:90,reqCombo:13,diff:7,desc:"弹至棍尖旋转"},
    {name:"仙人过海",score:120,reqCombo:16,diff:8,desc:"飞越头顶背后接"},
    {name:"海底捞月",score:150,reqCombo:20,diff:9,desc:"从腿下穿过接住"},
    {name:"龙卷风",score:200,reqCombo:25,diff:10,desc:"高速旋转飞起"}
];

/* ===== Difficulty Levels ===== */
var DIFFS=[
    {name:"新手",gravity:0.18,spinDecay:0.997,bounceV:0.35,desc:"轻松入门",color:"#4CAF50"},
    {name:"学徒",gravity:0.22,spinDecay:0.994,bounceV:0.5,desc:"稍有挑战",color:"#2196F3"},
    {name:"高手",gravity:0.27,spinDecay:0.991,bounceV:0.65,desc:"技巧考验",color:"#FF9800"},
    {name:"大师",gravity:0.32,spinDecay:0.988,bounceV:0.8,desc:"极限操作",color:"#f44336"},
    {name:"宗师",gravity:0.38,spinDecay:0.985,bounceV:0.9,desc:"登峰造极",color:"#9C27B0"}
];

/* ===== Game State ===== */
var G={
    state:ST_MENU,diff:1,
    score:0,combo:0,maxCombo:0,
    highScore:parseInt(localStorage.getItem("diabolo_hs")||"0"),
    lives:3,trickCount:0,totalCatches:0,perfectCatches:0,
    /* current trick */
    curTrick:null,trickTimer:0,trickCD:0,
    /* physics */
    dx:400,dy:250,vx:0,vy:0,
    spinAngle:0,spinSpeed:3,
    falling:false,attached:true,
    /* sticks */
    sLX:320,sLY:460,sRX:480,sRY:460,
    sLAngle:-0.25,sRAngle:0.25,
    /* string */
    stringPts:[],STRING_N:14,
    /* particles & fx */
    particles:[],comboTexts:[],
    shakeX:0,shakeY:0,shakeDur:0,
    trickFlash:"",trickFlashT:0,
    comboDisp:"",comboDispT:0,
    comboTimer:0,
    /* trick queue */
    trickQueue:[0,1],nextTrickT:120,
    /* tutorial */
    showTut:false,tutPage:0,
    /* menu / over */
    menuT:0,overT:0,newRec:false,
    /* difficulty timer */
    diffTimer:0,diffLevel:1,
    /* time */
    totalT:0,
    /* trail */
    trail:[],
    /* ad timer */
    adTimer:0
};

/* ===== Helpers ===== */
function dist(x1,y1,x2,y2){var dx=x2-x1,dy=y2-y1;return Math.sqrt(dx*dx+dy*dy)}
function lerp(a,b,t){return a+(b-a)*t}
function clamp(v,mn,mx){return v<mn?mn:v>mx?mx:v}
function rand(a,b){return a+Math.random()*(b-a)}

/* ===== Particles ===== */
function spawnP(x,y,vx,vy,color,life,size){
    if(G.particles.length>120)G.particles.shift();
    G.particles.push({x:x,y:y,vx:vx,vy:vy,color:color,life:life,maxLife:life,size:size||3});
}
function spawnBurst(x,y,count,color,speed){
    for(var i=0;i<count;i++){
        var a=Math.random()*Math.PI*2,sp=rand(1,speed);
        spawnP(x,y,Math.cos(a)*sp,Math.sin(a)*sp,color,rand(20,50),rand(2,5));
    }
}
function spawnTrickBurst(x,y){
    for(var i=0;i<25;i++){
        var a=(i/25)*Math.PI*2,sp=rand(3,7);
        spawnP(x,y,Math.cos(a)*sp,Math.sin(a)*sp,"#FFD700",rand(35,65),rand(3,6));
    }
}
function updateP(){
    for(var i=G.particles.length-1;i>=0;i--){
        var p=G.particles[i];
        p.x+=p.vx;p.y+=p.vy;p.vy+=0.05;p.vx*=0.98;p.life--;
        if(p.life<=0)G.particles.splice(i,1);
    }
}
function drawP(){
    for(var i=0;i<G.particles.length;i++){
        var p=G.particles[i];var a=p.life/p.maxLife;
        ctx.globalAlpha=a;ctx.fillStyle=p.color;
        ctx.beginPath();ctx.arc(p.x,p.y,p.size*a,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
}

/* ===== Combo Texts ===== */
function addCT(text,x,y,color,size){
    G.comboTexts.push({text:text,x:x,y:y,life:60,maxLife:60,color:color||"#FFD700",size:size||18});
}
function updateCT(){
    for(var i=G.comboTexts.length-1;i>=0;i--){
        G.comboTexts[i].y-=1.2;G.comboTexts[i].life--;
        if(G.comboTexts[i].life<=0)G.comboTexts.splice(i,1);
    }
}
function drawCT(){
    ctx.save();ctx.textAlign="center";ctx.textBaseline="middle";
    for(var i=0;i<G.comboTexts.length;i++){
        var ct=G.comboTexts[i];var a=ct.life/ct.maxLife;
        ctx.globalAlpha=a;ctx.fillStyle=ct.color;
        ctx.font="bold "+Math.round(ct.size)+"px 'Microsoft YaHei',sans-serif";
        ctx.fillText(ct.text,ct.x,ct.y);
    }
    ctx.globalAlpha=1;ctx.restore();
}

/* ===== Stars Background ===== */
var stars=[];
for(var i=0;i<80;i++){
    stars.push({x:Math.random()*W,y:Math.random()*H,r:0.5+Math.random()*1.5,bri:0.3+Math.random()*0.7});
}

function drawBg(t){
    var grad=ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,"#0d1117");grad.addColorStop(0.4,"#161b22");
    grad.addColorStop(0.7,"#1a1f2b");grad.addColorStop(1,"#0d1117");
    ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
    for(var i=0;i<stars.length;i++){
        var s=stars[i];var bri=s.bri*(0.6+0.4*Math.sin(t*0.002+i));
        ctx.globalAlpha=bri;ctx.fillStyle="#fff";
        ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
    /* ground */
    var gG=ctx.createLinearGradient(0,H-100,0,H);
    gG.addColorStop(0,"rgba(34,139,34,0.12)");gG.addColorStop(1,"rgba(34,139,34,0.04)");
    ctx.fillStyle=gG;ctx.fillRect(0,H-100,W,100);
}

/* ===== Init String Points ===== */
function initString(){
    G.stringPts=[];
    for(var i=0;i<=G.STRING_N;i++){
        var t=i/G.STRING_N;
        G.stringPts.push({
            x:lerp(G.sLX+50,G.sRX-50,t),
            y:lerp(G.sLY-15,G.sRY-15,t)+Math.sin(t*Math.PI)*12,
            vx:0,vy:0
        });
    }
}

/* ===== Init Game ===== */
function initGame(){
    G.state=ST_PLAY;G.score=0;G.combo=0;G.maxCombo=0;
    G.lives=3;G.trickCount=0;G.totalCatches=0;G.perfectCatches=0;
    G.curTrick=null;G.trickTimer=0;G.trickCD=0;G.totalT=0;
    G.spinSpeed=3;G.spinAngle=0;G.falling=false;G.attached=true;
    G.particles=[];G.comboTexts=[];G.trail=[];
    G.shakeX=0;G.shakeY=0;G.shakeDur=0;
    G.trickFlash="";G.trickFlashT=0;
    G.comboDisp="";G.comboDispT=0;G.comboTimer=0;
    G.trickQueue=[0,1];G.nextTrickT=120;
    G.overT=0;G.newRec=false;G.adTimer=0;
    G.diffTimer=0;G.diffLevel=1;
    G.sLX=W*0.3;G.sLY=H*0.78;
    G.sRX=W*0.7;G.sRY=H*0.78;
    G.sLAngle=-0.25;G.sRAngle=0.25;
    initString();
    resetDiabolo(true);
}

function resetDiabolo(onStr){
    var cx=(G.sLX+G.sRX)/2,cy=(G.sLY+G.sRY)/2-30;
    G.dx=cx;G.dy=cy;G.vx=0;G.vy=0;
    G.falling=false;G.attached=onStr;
    G.trail=[];G.spinSpeed=3;
    initString();
}

/* ===== Draw Diabolo ===== */
function drawDiabolo(x,y,angle,spd){
    ctx.save();ctx.translate(x+G.shakeX,y+G.shakeY);
    var glow=Math.min(spd/15,1);
    if(glow>0.2){ctx.shadowColor="rgba(0,200,255,"+glow*0.5+")";ctx.shadowBlur=12+glow*8;}
    ctx.rotate(angle);
    var aw=14+spd*0.2,ah=7;
    /* left cup */
    ctx.fillStyle="#E74C3C";
    ctx.beginPath();ctx.ellipse(-aw,0,aw*0.75,ah*1.8,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="#c0392b";ctx.lineWidth=1.2;ctx.stroke();
    /* right cup */
    ctx.fillStyle="#3498DB";
    ctx.beginPath();ctx.ellipse(aw,0,aw*0.75,ah*1.8,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="#2980b9";ctx.stroke();
    /* center axle */
    ctx.fillStyle="#BDC3C7";
    ctx.fillRect(-3,-ah*2.2,6,ah*4.4);
    /* band */
    ctx.fillStyle="#F39C12";
    ctx.fillRect(-5,-1.5,10,3);
    /* spin lines */
    if(spd>3){
        var n=Math.min(Math.floor(spd/3),6);
        ctx.strokeStyle="rgba(255,255,255,"+Math.min(spd/25,0.5)+")";
        ctx.lineWidth=1;
        for(var i=0;i<n;i++){var a=i*Math.PI*2/n;
            ctx.beginPath();ctx.moveTo(Math.cos(a)*4,Math.sin(a)*3);
            ctx.lineTo(Math.cos(a)*(aw+5),Math.sin(a)*(ah+3));ctx.stroke();
        }
    }
    ctx.restore();
}

/* ===== Draw Stick ===== */
function drawStick(x,y,angle){
    ctx.save();ctx.translate(x,y);ctx.rotate(angle);
    var len=110;
    var sG=ctx.createLinearGradient(-3,0,3,0);
    sG.addColorStop(0,"#8B4513");sG.addColorStop(0.5,"#A0522D");sG.addColorStop(1,"#6B3410");
    ctx.fillStyle=sG;ctx.fillRect(-3,0,6,-len);
    ctx.fillStyle="#CD853F";ctx.beginPath();ctx.arc(0,-len,4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#4a2810";ctx.fillRect(-5,-12,10,12);
    ctx.restore();
}

/* ===== Draw String ===== */
function drawString(){
    ctx.beginPath();ctx.moveTo(G.stringPts[0].x,G.stringPts[0].y);
    for(var i=1;i<=G.STRING_N;i++){
        var p0=G.stringPts[i-1],p1=G.stringPts[i];
        var mx=(p0.x+p1.x)/2,my=(p0.y+p1.y)/2;
        ctx.quadraticCurveTo(p0.x,p0.y,mx,my);
    }
    ctx.strokeStyle=G.combo>=5?"rgba(255,215,0,"+Math.min(G.combo*0.03,0.8)+")":"rgba(255,255,255,0.5)";
    ctx.lineWidth=G.combo>=5?2.5:1.8;ctx.stroke();
}

/* ===== Trail ===== */
function drawTrail(){
    for(var i=0;i<G.trail.length;i++){
        var tr=G.trail[i];var a=tr.life/20*0.3;
        ctx.fillStyle="rgba(255,215,0,"+a+")";
        ctx.beginPath();ctx.arc(tr.x,tr.y,6*(tr.life/20),0,Math.PI*2);ctx.fill();
    }
}

/* ===== HUD ===== */
function drawHUD(){
    ctx.save();ctx.textAlign="left";
    ctx.fillStyle="#fff";ctx.font="bold 22px 'Microsoft YaHei',sans-serif";
    ctx.fillText("分数: "+G.score,15,30);
    ctx.font="13px 'Microsoft YaHei',sans-serif";ctx.fillStyle="#888";
    ctx.fillText("最高: "+G.highScore,15,50);
    if(G.combo>1){
        var ca=Math.min(G.comboTimer/30,1);
        ctx.globalAlpha=ca;ctx.fillStyle="#FFD700";
        ctx.font="bold "+(24+Math.min(G.combo,10)*2)+"px 'Microsoft YaHei',sans-serif";
        ctx.textAlign="center";ctx.fillText("连击 x"+G.combo,W/2,40);
        ctx.globalAlpha=1;
    }
    if(G.comboDispT>0){
        ctx.globalAlpha=G.comboDispT/50;ctx.fillStyle="#FFD700";
        ctx.font="bold 18px 'Microsoft YaHei',sans-serif";
        ctx.textAlign="center";ctx.fillText(G.comboDisp,W/2,65);ctx.globalAlpha=1;
    }
    /* lives */
    ctx.textAlign="right";ctx.font="18px 'Microsoft YaHei',sans-serif";
    var h="";for(var i=0;i<3;i++)h+=i<G.lives?"❤ ":"♡ ";
    ctx.fillText(h,W-15,30);
    /* spin */
    ctx.font="12px 'Microsoft YaHei',sans-serif";
    ctx.fillStyle=spinCol(G.spinSpeed);
    ctx.fillText("转速: "+G.spinSpeed.toFixed(1),W-15,48);
    /* diff */
    ctx.fillStyle=DIFFS[G.diff].color;
    ctx.fillText(DIFFS[G.diff].name,W-15,64);
    /* trick flash */
    if(G.trickFlashT>0){
        ctx.globalAlpha=G.trickFlashT/40;ctx.fillStyle="#FFD700";
        ctx.font="bold 26px 'Microsoft YaHei',sans-serif";
        ctx.textAlign="center";ctx.fillText(G.trickFlash,W/2,H/2-50);ctx.globalAlpha=1;
    }
    /* trick queue */
    if(G.trickQueue.length>0&&G.state===ST_PLAY){
        ctx.textAlign="left";ctx.font="12px 'Microsoft YaHei',sans-serif";
        ctx.fillStyle="rgba(255,255,255,0.4)";
        ctx.fillText("花式(数字键): "+G.trickQueue.map(function(t,i){return (i+1)+"."+TRICKS[t].name}).join(" | "),15,H-115);
    }
    /* current trick */
    if(G.curTrick){
        ctx.textAlign="center";ctx.font="bold 16px 'Microsoft YaHei',sans-serif";
        ctx.globalAlpha=Math.min(G.trickTimer/20,1);ctx.fillStyle="#00ff88";

/* ===== Round Rect ===== */
function rr(x,y,w,h,r){
    ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();ctx.fill();ctx.stroke();
}

/* ===== Physics ===== */
function updateSticks(){
    var spd=3;
    if(keys["arrowleft"]||keys["a"]){G.sLX-=spd;G.sRX-=spd;}
    if(keys["arrowright"]||keys["d"]){G.sLX+=spd;G.sRX+=spd;}
    if(keys["arrowup"]||keys["w"]){G.sLY-=spd;G.sRY-=spd;}
    if(keys["arrowdown"]||keys["s"]){G.sLY+=spd;G.sRY+=spd;}
    if(keys["j"]){G.sLX-=2;G.sRX+=2;}
    if(keys["l"]){G.sLX+=2;G.sRX-=2;}
    if(keys["i"]){G.sLY-=2;G.sRY-=2;}
    if(keys["k"]){G.sLY+=2;G.sRY+=2;}
    G.sLX=clamp(G.sLX,40,W*0.45);
    G.sRX=clamp(G.sRX,W*0.55,W-40);
    G.sLY=clamp(G.sLY,250,H-80);
    G.sRY=clamp(G.sRY,250,H-80);
    G.sLAngle=clamp((G.sLX-W*0.3)*0.004,-0.5,0.5);
    G.sRAngle=clamp((G.sRX-W*0.7)*0.004,-0.5,0.5);
    updateStickTips();
}

function updateStickTips(){
    var len=110;
    G.sLTX=G.sLX+Math.sin(G.sLAngle)*len;
    G.sLTY=G.sLY-Math.cos(G.sLAngle)*len;
    G.sRTX=G.sRX+Math.sin(G.sRAngle)*len;
    G.sRTY=G.sRY-Math.cos(G.sRAngle)*len;
}

function updateStringPhysics(){
    var lx=G.sLTX,ly=G.sLTY,rx=G.sRTX,ry=G.sRTY;
    G.stringPts[0].x=lx;G.stringPts[0].y=ly;
    G.stringPts[G.STRING_N].x=rx;G.stringPts[G.STRING_N].y=ry;
    for(var i=1;i<G.STRING_N;i++){
        var p=G.stringPts[i];var t=i/G.STRING_N;
        var tx=lerp(lx,rx,t),ty=lerp(ly,ry,t)+Math.sin(t*Math.PI)*12;
        p.vx+=(tx-p.x)*0.08;p.vy+=(ty-p.y)*0.08;
        p.vx*=0.88;p.vy*=0.88;
        p.x+=p.vx;p.y+=p.vy;
    }
}

function updateDiabolo(){
    var diff=DIFFS[G.diff];
    if(G.attached){
        updateStringPhysics();
        /* diabolo on string */
        var nearIdx=1,nearD=Infinity;
        for(var i=1;i<G.STRING_N;i++){
            var d=dist(G.dx,G.dy,G.stringPts[i].x,G.stringPts[i].y);
            if(d<nearD){nearD=d;nearIdx=i;}
        }
        var tgt=G.stringPts[nearIdx];
        G.vy+=diff.gravity*0.3;
        var dropY=Math.min(G.vy,(G.sRTX-G.sLTX)*0.3);
        G.dx=lerp(G.dx,tgt.x,0.3);
        G.dy=lerp(G.dy,tgt.y+dropY,0.25);
        G.vy*=0.95;
        /* string pull adds spin */
        if(Math.abs(G.dy-tgt.y)>8)G.spinSpeed+=0.05;
    }else{
        /* free falling */
        G.vy+=diff.gravity;
        G.dx+=G.vx;G.dy+=G.vy;
        G.vx*=0.995;
        /* wall bounce */
        if(G.dx<20){G.dx=20;G.vx=Math.abs(G.vx)*0.6;}
        if(G.dx>W-20){G.dx=W-20;G.vx=-Math.abs(G.vx)*0.6;}
        if(G.dy<20){G.dy=20;G.vy=Math.abs(G.vy)*0.4;}
        /* catch check */
        if(G.vy>0){
            var cx=(G.sLTX+G.sRTX)/2,cy=(G.sLTY+G.sRTY)/2;
            var cd=dist(G.dx,G.dy,cx,cy);
            var sl=dist(G.sLTX,G.sLTY,G.sRTX,G.sRTY);
            if(cd<sl*0.55+12&&G.dy>cy-35&&G.dy<cy+25){
                catchDiabolo();
            }
        }
        /* fell off */
        if(G.dy>H+30)dropDiabolo();
    }
    /* spin */
    G.spinSpeed*=diff.spinDecay;
    if(G.spinSpeed<0.3)G.spinSpeed=0.3;
    G.spinAngle+=G.spinSpeed*0.1;
    if(G.spinSpeed>4&&G.totalT%12===0)sfxSpin();
    /* trail */
    G.trail.push({x:G.dx,y:G.dy,life:20});
    if(G.trail.length>12)G.trail.shift();
    for(var j=G.trail.length-1;j>=0;j--){G.trail[j].life--;if(G.trail[j].life<=0)G.trail.splice(j,1);}
}

function catchDiabolo(){
    G.attached=true;G.falling=false;G.vy=0;G.vx=0;
    G.totalCatches++;
    /* scoring */
    var cx=(G.sLTX+G.sRTX)/2,cy=(G.sLTY+G.sRTY)/2;
    var d=dist(G.dx,G.dy,cx,cy);
    var pts=0,label="";
    if(d<25){pts=30;label="完美!";G.perfectCatches++;sfxPerfect();spawnBurst(G.dx,G.dy,15,"#FFD700",4);}
    else if(d<45){pts=15;label="漂亮!";sfxCatch();spawnBurst(G.dx,G.dy,10,"#4ECDC4",3);}
    else{pts=10;label="接住";sfxCatch();spawnBurst(G.dx,G.dy,5,"#fff",2);}
    /* combo */
    if(G.comboTimer>0){G.combo++;if(G.combo>=3&&G.combo%3===0){sfxCombo(G.combo);spawnBurst(G.dx,G.dy,12,"#FF6B6B",4);addCT(G.combo+"连击!",G.dx,G.dy-30,"#FF6B6B",22);}}
    else G.combo=1;
    G.maxCombo=Math.max(G.maxCombo,G.combo);
    G.comboTimer=120;
    pts=Math.round(pts*(1+G.combo*0.15));
    G.score+=pts;
    addCT(label+" +"+pts,G.dx,G.dy-18,"#fff",15);
    /* trick completion */
    if(G.curTrick)completeTrick();
    G.spinSpeed+=0.5;
    initString();
}

function dropDiabolo(){
    G.lives--;G.combo=0;G.curTrick=null;G.spinSpeed=3;
    sfxDrop();G.shakeDur=12;
    spawnBurst(G.dx,G.dy,15,"#ff4444",4);
    if(G.lives<=0){gameOver();return;}
    addCT("掉落! 剩余"+G.lives+"次",W/2,H/2,"#FF4444",20);
    resetDiabolo(true);
}

function throwDiabolo(){
    if(!G.attached)return;
    G.attached=false;G.falling=true;
    var pow=7+G.spinSpeed*0.15;
    G.vx=rand(-0.8,0.8);G.vy=-pow;
    sfxThrow();spawnBurst(G.dx,G.dy,5,"#aaa",2);
}

function doTrick(idx){
    if(!G.attached||G.trickCD>0)return;
    var trick=TRICKS[idx];
    if(G.combo<trick.reqCombo)return;
    G.curTrick=trick;G.trickTimer=100+trick.diff*12;G.trickCD=50;
    throwDiabolo();
    var qi=G.trickQueue.indexOf(idx);if(qi>=0)G.trickQueue.splice(qi,1);
    G.spinSpeed+=trick.diff*1.2;
}

function completeTrick(){
    var t=G.curTrick;
    var bonus=Math.floor(t.score*(1+G.combo*0.1));
    G.score+=bonus;G.trickCount++;
    sfxTrick();G.trickFlash=t.name+" +"+bonus;G.trickFlashT=40;
    spawnTrickBurst(G.dx,G.dy);
    G.curTrick=null;
    /* unlock tricks */
    for(var i=0;i<TRICKS.length;i++){
        if(G.combo>=TRICKS[i].reqCombo&&G.trickQueue.indexOf(i)<0){
            G.trickQueue.push(i);
        }
    }
}

function gameOver(){
    G.state=ST_OVER;G.overT=0;G.newRec=false;
    if(G.score>G.highScore){G.highScore=G.score;localStorage.setItem("diabolo_hs",G.highScore.toString());G.newRec=true;sfxNewRecord();}
    else sfxGameOver();
    showInterstitial();
}

/* ===== Update ===== */
function updateGame(){
    if(G.state!==ST_PLAY)return;
    G.totalT++;
    /* shake */
    if(G.shakeDur>0){G.shakeDur--;G.shakeX=rand(-2.5,2.5);G.shakeY=rand(-2.5,2.5);}
    else{G.shakeX=0;G.shakeY=0;}
    if(G.comboTimer>0)G.comboTimer--;
    if(G.comboDispT>0)G.comboDispT--;
    if(G.trickFlashT>0)G.trickFlashT--;
    if(G.trickCD>0)G.trickCD--;
    /* trick timer */
    if(G.curTrick){G.trickTimer--;if(G.trickTimer<=0){G.curTrick=null;G.combo=0;playTone(200,0.2,0.1,"sawtooth");}}
    /* next trick queue */
    G.nextTrickT--;
    if(G.nextTrickT<=0&&G.trickQueue.length<4){
        var maxU=0;
        for(var i=TRICKS.length-1;i>=0;i--){if(G.combo>=TRICKS[i].reqCombo){maxU=i;break;}}
        var tIdx=G.trickQueue.length>0?G.trickQueue[G.trickQueue.length-1]+1:0;
        if(tIdx>maxU)tIdx=0;
        if(G.trickQueue.indexOf(tIdx)<0)G.trickQueue.push(tIdx);
        G.nextTrickT=150+Math.random()*100;
    }
    /* difficulty */
    G.diffTimer+=16;
    if(G.diffTimer>15000){G.diffTimer=0;G.diffLevel++;if(G.diffLevel%3===0)addCT("难度提升!",W/2,H*0.25,"#FF6B6B",24);}
    /* ad timer */
    G.adTimer+=16;
}

/* ===== Input ===== */
var keys={};
addEventListener("keydown",function(e){
    keys[e.key.toLowerCase()]=true;ensureAudio();
    if(G.state===ST_MENU){
        if(e.key==="Enter"||e.key===" "){initGame();e.preventDefault();}
        if(e.key==="ArrowUp"||e.key==="w")G.diff=Math.max(0,G.diff-1);
        if(e.key==="ArrowDown"||e.key==="s")G.diff=Math.min(DIFFS.length-1,G.diff+1);
        if(e.key==="t"||e.key==="T"){G.showTut=true;G.tutPage=0;}
    }else if(G.state===ST_PLAY){
        if(e.key===" "||e.key==="Enter"){throwDiabolo();e.preventDefault();}
        if(e.key==="p"||e.key==="P"||e.key==="Escape"){G.state=ST_PAUSE;e.preventDefault();}
        var num=parseInt(e.key);
        if(!isNaN(num)){var idx=num===0?9:num-1;if(idx<G.trickQueue.length)doTrick(G.trickQueue[idx]);}
    }else if(G.state===ST_PAUSE){
        if(e.key==="p"||e.key==="P"||e.key==="Escape")G.state=ST_PLAY;
    }else if(G.state===ST_OVER){
        if(e.key==="Enter"||e.key===" "){initGame();e.preventDefault();}
        if(e.key==="Escape")G.state=ST_MENU;
    }
    if(G.showTut){
        if(e.key==="Escape"||e.key==="t")G.showTut=false;
        if(e.key==="ArrowRight")G.tutPage=Math.min(2,G.tutPage+1);
        if(e.key==="ArrowLeft")G.tutPage=Math.max(0,G.tutPage-1);
    }
});
addEventListener("keyup",function(e){keys[e.key.toLowerCase()]=false;});

var mX=400,mY=300;
cv.addEventListener("mousemove",function(e){var r=cv.getBoundingClientRect();mX=(e.clientX-r.left)*(W/r.width);mY=(e.clientY-r.top)*(H/r.height);});
cv.addEventListener("mousedown",function(e){ensureAudio();handleClick(mX,mY);});
cv.addEventListener("touchstart",function(e){
    e.preventDefault();ensureAudio();
    var t=e.touches[0],r=cv.getBoundingClientRect();
    handleClick((t.clientX-r.left)*(W/r.width),(t.clientY-r.top)*(H/r.height));
},{passive:false});

function handleClick(cx,cy){
    if(G.showTut){G.showTut=false;return;}
    if(G.state===ST_MENU){
        if(cx>W/2-90&&cx<W/2+90&&cy>439&&cy<491){sfxBtn();initGame();return;}
        for(var i=0;i<DIFFS.length;i++){
            var bx=W/2-130,by=265+i*34;
            if(cx>bx&&cx<bx+260&&cy>by&&cy<by+28){G.diff=i;sfxBtn();return;}
        }
        if(cx>W/2-50&&cx<W/2+50&&cy>495&&cy<520){G.showTut=true;G.tutPage=0;return;}
    }else if(G.state===ST_PLAY){
        throwDiabolo();
    }else if(G.state===ST_OVER){
        if(cx>W/2-90&&cx<W/2+90&&cy>H/2+55&&cy<H/2+101){sfxBtn();initGame();return;}
        if(cx>W/2-55&&cx<W/2+55&&cy>H/2+115&&cy<H/2+147){sfxBtn();G.state=ST_MENU;return;}
    }else if(G.state===ST_PAUSE){
        if(cx>W/2-75&&cx<W/2+75&&cy>H/2-15&&cy<H/2+23){G.state=ST_PLAY;return;}
        if(cx>W/2-55&&cx<W/2+55&&cy>H/2+35&&cy<H/2+67){G.state=ST_MENU;return;}
    }
}

/* ===== Render ===== */
function render(t){
    drawBg(t);
    if(G.state===ST_MENU){
        drawMenu(t);
    }else if(G.state===ST_PLAY||G.state===ST_PAUSE){
        drawTrail();drawString();
        drawStick(G.sLX,G.sLY,G.sLAngle);drawStick(G.sRX,G.sRY,G.sRAngle);
        drawDiabolo(G.dx,G.dy,G.spinAngle,G.spinSpeed);
        drawP();drawCT();drawHUD();
        if(G.state===ST_PAUSE)drawPause();
    }else if(G.state===ST_OVER){
        drawTrail();drawString();
        drawStick(G.sLX,G.sLY,G.sLAngle);drawStick(G.sRX,G.sRY,G.sRAngle);
        drawDiabolo(G.dx,G.dy,G.spinAngle,G.spinSpeed);
        drawP();drawCT();drawHUD();drawOver(t);
    }
    if(G.showTut)drawTut();
}

/* ===== Main Loop ===== */
var lastT=0;
function loop(time){
    requestAnimationFrame(loop);
    var dt=time-lastT;lastT=time;if(dt>100)dt=16;
    updateSticks();updateGame();updateP();updateCT();
    render(time);
}
requestAnimationFrame(loop);

})();
</script>
