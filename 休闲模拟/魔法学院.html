<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>魔法学院</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #2d1b4e 0%, #4a2c7a 50%, #6b3fa0 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; color: #fff; overflow: hidden; }
        
        .game-container { width: 100%; flex: 1; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: #fff; }
        .stats { display: flex; gap: 20px; font-size: 14px; }
        
        .main-area { flex: 1; background: rgba(0,0,0,0.5); border-radius: 15px; overflow: hidden; position: relative; }
        
        .magic-circle { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 200px; height: 200px; }
        .magic-circle svg { width: 100%; height: 100%; animation: rotate 10s linear infinite; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        .spell-display { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); text-align: center; font-size: 64px; }
        
        .progress-area { position: absolute; bottom: 100px; left: 0; right: 0; text-align: center; }
        .progress-bar { width: 200px; height: 20px; background: #333; border-radius: 10px; overflow: hidden; margin: 0 auto; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #9b59b6, #e74c3c); transition: width 0.3s; }
        
        .actions { display: flex; gap: 10px; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; }
        
        .action-btn { flex: 1; padding: 15px; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; background: rgba(255,255,255,0.2); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }
    /* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */
/* [BATCH-FIX:ad-components-css] */
.sponsor-btn{position:fixed;bottom:8px;left:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:2px 6px;border-radius:10px;font:10px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.sponsor-panel.show{display:flex}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.interstitial-ad.show{display:flex}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* [/BATCH-FIX:ad-components-css] */

/* [AD-FIX:responsive] */
@media (max-width:768px){.ad-banner-container{display:none!important}.sponsor-btn{transform:scale(.8);opacity:.6}}
/* [/AD-FIX:responsive] */
</style>
</head>
<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="title">🏰 魔法学院</div>
            <div class="stats">
                <span>🏆 等级: <span id="level">1</span></span>
                <span>💧 魔力: <span id="mana">100</span></span>
                <span>⭐ 法术: <span id="spells">0</span></span>
            </div>
        </div>
        
        <div class="main-area">
            <div class="spell-display" id="spellDisplay">✨</div>
            
            <div class="magic-circle">
                <svg viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="45" fill="none" stroke="#9b59b6" stroke-width="2" stroke-dasharray="10,5"/>
                    <circle cx="50" cy="50" r="35" fill="none" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,10"/>
                    <circle cx="50" cy="50" r="25" fill="none" stroke="#3498db" stroke-width="2" stroke-dasharray="15,5"/>
                    <path d="M50,10 L50,20 M50,80 L50,90 M10,50 L20,50 M80,50 L90,50" stroke="#fff" stroke-width="2"/>
                </svg>
            </div>
            
            <div class="progress-area">
                <div id="progressText">学习进度: 0%</div>
                <div class="progress-bar"><div class="progress-fill" id="progressBar"></div></div>
                <div id="message">开始学习魔法！</div>
            </div>
        </div>
        
        <div class="actions">
            <button class="action-btn" onclick="study()">📚 学习</button>
            <button class="action-btn" onclick="practice()">⚗️ 练习</button>
            <button class="action-btn" onclick="meditate()">🧘 冥想</button>
            <button class="action-btn" onclick="castSpell()">🪄 施法</button>
        </div>
    </div>
    
    

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <script>
        const GAME_NAME = '魔法学院';
        GameCore.init({ highScore: GAME_NAME });
        
        let wizard = {
            level: 1,
            mana: 100,
            maxMana: 100,
            knowledge: 0,
            spells: [],
            spellPower: 10
        };
        
        let learningProgress = 0;
        let currentSpell = null;
        
        const spells = [
            { name: '🔥 火球术', emoji: '🔥', cost: 20, damage: 30, knowledge: 0 },
            { name: '💧 冰霜术', emoji: '💧', cost: 25, damage: 35, knowledge: 100 },
            { name: '⚡ 闪电术', emoji: '⚡', cost: 30, damage: 45, knowledge: 250 },
            { name: '🌿 治愈术', emoji: '🌿', cost: 20, heal: 40, knowledge: 150 },
            { name: '💀 暗影术', emoji: '💀', cost: 40, damage: 60, knowledge: 400 },
            { name: '✨ 圣光术', emoji: '✨', cost: 50, damage: 50, heal: 30, knowledge: 500 }
        ];
        
        function initGame() {
            updateUI();
        }
        
        function updateUI() {
            document.getElementById('level').textContent = wizard.level;
            document.getElementById('mana').textContent = `${wizard.mana}/${wizard.maxMana}`;
            document.getElementById('spells').textContent = wizard.spells.length;
            
            document.getElementById('progressBar').style.width = `${learningProgress}%`;
            document.getElementById('progressText').textContent = `学习进度: ${learningProgress}%`;
            
            GameCore.highScore.set(GAME_NAME, wizard.level);
        }
        
        function setMessage(msg) {
            document.getElementById('message').textContent = msg;
        }
        
        function updateSpellDisplay(emoji) {
            document.getElementById('spellDisplay').textContent = emoji;
        }
        
        function study() {
            if (wizard.mana < 10) {
                setMessage('魔力不足！');
                return;
            }
            
            wizard.mana -= 10;
            wizard.knowledge += 5;
            learningProgress = Math.min(100, (wizard.knowledge % 100));
            
            setMessage('📚 正在学习魔法知识...');
            updateSpellDisplay('📖');
            
            checkLevelUp();
            checkNewSpells();
            updateUI();
        }
        
        function practice() {
            if (wizard.mana < 15) {
                setMessage('魔力不足！');
                return;
            }
            
            wizard.mana -= 15;
            wizard.spellPower += 2;
            learningProgress = Math.min(100, learningProgress + 10);
            
            setMessage('⚗️ 正在练习法术...');
            updateSpellDisplay('⚗️');
            
            updateUI();
        }
        
        function meditate() {
            const restore = Math.floor(wizard.maxMana * 0.3);
            wizard.mana = Math.min(wizard.maxMana, wizard.mana + restore);
            
            setMessage(`🧘 冥想恢复了 ${restore} 魔力！`);
            updateSpellDisplay('🧘');
            
            updateUI();
        }
        
        function castSpell() {
            if (wizard.spells.length === 0) {
                setMessage('还没有学会任何法术！');
                return;
            }
            
            const spellIndex = Math.floor(Math.random() * wizard.spells.length);
            const spell = wizard.spells[spellIndex];
            
            if (wizard.mana < spell.cost) {
                setMessage('魔力不足！');
                return;
            }
            
            wizard.mana -= spell.cost;
            const power = spell.damage ? spell.damage + wizard.spellPower : 0;
            const heal = spell.heal ? spell.heal + wizard.spellPower : 0;
            
            let message = `🪄 释放了 ${spell.name}！`;
            if (power > 0) message += ` 造成 ${power} 点伤害！`;
            if (heal > 0) message += ` 恢复 ${heal} 点生命！`;
            
            setMessage(message);
            updateSpellDisplay(spell.emoji);
            
            updateUI();
        }
        
        function checkLevelUp() {
            const levelThreshold = wizard.level * 200;
            if (wizard.knowledge >= levelThreshold) {
                wizard.level++;
                wizard.maxMana += 20;
                wizard.mana = wizard.maxMana;
                setMessage(`🏆 升级了！当前等级: ${wizard.level}`);
            }
        }
        
        function checkNewSpells() {
            spells.forEach(spell => {
                if (!wizard.spells.includes(spell) && wizard.knowledge >= spell.knowledge) {
                    wizard.spells.push(spell);
                    setMessage(`🎉 学会了新法术：${spell.name}！`);
                    updateSpellDisplay(spell.emoji);
                }
            });
        }
        
        initGame();
        GameCore.touch.enableAllButtons();
    </script>
<!-- [BATCH-FIX:responsive-js] -->
<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>
<!-- [/BATCH-FIX:responsive-js] -->
<!-- [BATCH-FIX:touch-support] -->
<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>
<!-- [/BATCH-FIX:touch-support] -->

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
