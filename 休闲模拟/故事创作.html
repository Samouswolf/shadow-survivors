<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>故事创作</title>
    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="../game_core.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            border-radius: 12px;
        }
        .stat {
            text-align: center;
            color: white;
        }
        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }
        .stat-value {
            font-size: 20px;
            font-weight: bold;
        }
        .story-area {
            padding: 20px;
            background: #ffeaa7;
            border-radius: 12px;
            margin-bottom: 15px;
            min-height: 150px;
        }
        .story-title {
            font-size: 18px;
            color: #2d3436;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .story-content {
            font-size: 14px;
            color: #2d3436;
            line-height: 1.6;
        }
        .story-content .highlight {
            color: #6c5ce7;
            font-weight: bold;
        }
        .choices-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }
        .choice-btn {
            padding: 15px;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid #dfe6e9;
            text-align: left;
        }
        .choice-btn:hover {
            border-color: #6c5ce7;
            background: #e8f4f8;
        }
        .choice-icon {
            font-size: 20px;
            margin-right: 10px;
        }
        .choice-text {
            font-size: 14px;
            color: #2d3436;
        }
        .word-count {
            text-align: center;
            color: #636e72;
            font-size: 12px;
            margin-bottom: 10px;
        }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white;
        }
        .btn-secondary {
            background: linear-gradient(135deg, #dfe6e9, #b2bec3);
            color: #2d3436;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 20px 40px;
            border-radius: 15px;
            font-size: 18px;
            display: none;
            z-index: 100;
            text-align: center;
        }
        .message.show { display: block; }
        .ad-banner {
            width: 100%;
            height: 60px;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            margin-top: 10px;
            font-size: 14px;
        }
    /* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */

.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}

.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}

.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}

/* [AD-FIX:responsive] */
@media (max-width:768px){.ad-banner-container{display:none!important}.sponsor-btn{transform:scale(.8);opacity:.6}}

</style>
</head>
<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">章节</div>
                <div class="stat-value" id="chapter">1</div>
            </div>
            <div class="stat">
                <div class="stat-label">字数</div>
                <div class="stat-value" id="words">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">选择</div>
                <div class="stat-value" id="choices">0</div>
            </div>
        </div>

        <div class="story-area">
            <div class="story-title" id="storyTitle">故事开始</div>
            <div class="story-content" id="storyContent"></div>
        </div>

        <div class="word-count" id="wordCount">已创作 0 字</div>

        <div class="choices-area" id="choicesArea"></div>

        <div class="controls">
            <button class="btn btn-secondary" id="btnRestart">🔄 重写</button>
            <button class="btn btn-primary" id="btnSave">💾 保存</button>
        </div>

        <div class="message" id="message"></div>

        
    </div>

    <script>
        const STORY_TEMPLATES = {
            start: {
                title: '故事开始',
                content: '在一个<span class="highlight">神秘的森林</span>里，你发现了一条<span class="highlight">古老的小路</span>...',
                choices: [
                    { icon: '🌲', text: '沿着小路走进森林深处', next: 'forest' },
                    { icon: '🚪', text: '转身回到村庄', next: 'village' },
                    { icon: '🔍', text: '仔细观察周围的痕迹', next: 'observe' }
                ]
            },
            forest: {
                title: '森林深处',
                content: '你走进了<span class="highlight">茂密的森林</span>，树木越来越高大。突然，你听到了<span class="highlight">奇怪的声音</span>...',
                choices: [
                    { icon: '👂', text: '循着声音前进', next: 'sound' },
                    { icon: '🏃', text: '快速逃离', next: 'escape' },
                    { icon: '🧙', text: '召唤魔法保护', next: 'magic' }
                ]
            },
            village: {
                title: '回到村庄',
                content: '你回到了<span class="highlight">熟悉的村庄</span>，村民们正在讨论<span class="highlight">森林的传说</span>...',
                choices: [
                    { icon: '💬', text: '询问村民关于传说', next: 'ask' },
                    { icon: '🏠', text: '回家休息', next: 'home' },
                    { icon: '📚', text: '去图书馆查阅资料', next: 'library' }
                ]
            },
            observe: {
                title: '观察痕迹',
                content: '你发现了<span class="highlight">古老的符文</span>，这些符文似乎指向<span class="highlight">某个秘密</span>...',
                choices: [
                    { icon: '📝', text: '记录符文并研究', next: 'study' },
                    { icon: '🧭', text: '跟随符文的指引', next: 'follow' },
                    { icon: '📸', text: '拍照留念', next: 'photo' }
                ]
            },
            sound: {
                title: '声音的来源',
                content: '你找到了<span class="highlight">一座古老的遗迹</span>，声音似乎来自<span class="highlight">深处</span>...',
                choices: [
                    { icon: '🚪', text: '进入遗迹探索', next: 'ruins' },
                    { icon: '🔔', text: '敲击遗迹入口', next: 'knock' },
                    { icon: '🛡️', text: '做好防御准备', next: 'prepare' }
                ]
            },
            magic: {
                title: '魔法力量',
                content: '你施展了<span class="highlight">强大的魔法</span>，森林中的<span class="highlight">精灵</span>出现了...',
                choices: [
                    { icon: '🤝', text: '与精灵友好交谈', next: 'friendly' },
                    { icon: '❓', text: '询问精灵的秘密', next: 'secret' },
                    { icon: '🎁', text: '赠送礼物给精灵', next: 'gift' }
                ]
            },
            ending: {
                title: '故事结束',
                content: '你的冒险故事<span class="highlight">圆满结束</span>，这段经历将成为<span class="highlight">永恒的记忆</span>...',
                choices: []
            }
        };

        let currentStory = 'start';
        let storyText = '';
        let chapter = 1;
        let words = 0;
        let choiceCount = 0;
        let savedStories = [];

        function initGame() {
            currentStory = 'start';
            storyText = '';
            chapter = 1;
            words = 0;
            choiceCount = 0;

            renderStory();
            updateUI();
        }

        function renderStory() {
            const story = STORY_TEMPLATES[currentStory];
            if (!story) return;

            document.getElementById('storyTitle').textContent = story.title;
            document.getElementById('storyContent').innerHTML = story.content;

            storyText += story.content.replace(/<[^>]*>/g, '') + '\n';

            const choicesEl = document.getElementById('choicesArea');
            choicesEl.innerHTML = '';

            if (story.choices.length === 0) {
                showMessage('🎉 故事创作完成！\n总字数: ' + words);
                return;
            }

            story.choices.forEach(choice => {
                const btn = document.createElement('div');
                btn.className = 'choice-btn';
                btn.innerHTML = `
                    <span class="choice-icon">${choice.icon}</span>
                    <span class="choice-text">${choice.text}</span>
                `;
                btn.addEventListener('click', () => makeChoice(choice));
                choicesEl.appendChild(btn);
            });

            updateWordCount();
        }

        function makeChoice(choice) {
            choiceCount++;
            chapter++;

            storyText += '【选择: ' + choice.text + '】\n';

            // 根据选择决定下一个场景
            if (STORY_TEMPLATES[choice.next]) {
                currentStory = choice.next;
            } else {
                // 随机生成结局
                currentStory = 'ending';
            }

            renderStory();
            updateUI();
        }

        function updateWordCount() {
            const cleanText = storyText.replace(/<[^>]*>/g, '').replace(/\s/g, '');
            words = cleanText.length;
            document.getElementById('wordCount').textContent = '已创作 ' + words + ' 字';
        }

        function saveStory() {
            if (words === 0) {
                showMessage('请先创作故事！');
                return;
            }

            savedStories.push({
                text: storyText,
                words: words,
                chapters: chapter
            });

            showMessage('故事已保存！\n字数: ' + words);
            GameCore.highScore.set('story_game', words);
        }

        function updateUI() {
            document.getElementById('chapter').textContent = chapter;
            document.getElementById('words').textContent = words;
            document.getElementById('choices').textContent = choiceCount;
        }

        function showMessage(msg) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 2000);
        }

        document.getElementById('btnRestart').addEventListener('click', initGame);
        document.getElementById('btnSave').addEventListener('click', saveStory);

        // 初始化
        GameCore.init({ highScore: 'story_game' });
        initGame();
    </script>
<!-- [BATCH-FIX:responsive-js] -->
<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>
<!-- [/BATCH-FIX:responsive-js] -->
<!-- [BATCH-FIX:touch-support] -->
<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>
<!-- [/BATCH-FIX:touch-support] -->

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
