<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>故事创作</title>
    <script src="game_core.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            border-radius: 12px;
        }
        .stat {
            text-align: center;
            color: white;
        }
        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }
        .stat-value {
            font-size: 20px;
            font-weight: bold;
        }
        .story-area {
            padding: 20px;
            background: #ffeaa7;
            border-radius: 12px;
            margin-bottom: 15px;
            min-height: 150px;
        }
        .story-title {
            font-size: 18px;
            color: #2d3436;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .story-content {
            font-size: 14px;
            color: #2d3436;
            line-height: 1.6;
        }
        .story-content .highlight {
            color: #6c5ce7;
            font-weight: bold;
        }
        .choices-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }
        .choice-btn {
            padding: 15px;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid #dfe6e9;
            text-align: left;
        }
        .choice-btn:hover {
            border-color: #6c5ce7;
            background: #e8f4f8;
        }
        .choice-icon {
            font-size: 20px;
            margin-right: 10px;
        }
        .choice-text {
            font-size: 14px;
            color: #2d3436;
        }
        .word-count {
            text-align: center;
            color: #636e72;
            font-size: 12px;
            margin-bottom: 10px;
        }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white;
        }
        .btn-secondary {
            background: linear-gradient(135deg, #dfe6e9, #b2bec3);
            color: #2d3436;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 20px 40px;
            border-radius: 15px;
            font-size: 18px;
            display: none;
            z-index: 100;
            text-align: center;
        }
        .message.show { display: block; }
        .ad-banner {
            width: 100%;
            height: 60px;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">章节</div>
                <div class="stat-value" id="chapter">1</div>
            </div>
            <div class="stat">
                <div class="stat-label">字数</div>
                <div class="stat-value" id="words">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">选择</div>
                <div class="stat-value" id="choices">0</div>
            </div>
        </div>

        <div class="story-area">
            <div class="story-title" id="storyTitle">故事开始</div>
            <div class="story-content" id="storyContent"></div>
        </div>

        <div class="word-count" id="wordCount">已创作 0 字</div>

        <div class="choices-area" id="choicesArea"></div>

        <div class="controls">
            <button class="btn btn-secondary" id="btnRestart">🔄 重写</button>
            <button class="btn btn-primary" id="btnSave">💾 保存</button>
        </div>

        <div class="message" id="message"></div>

        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    <script>
        const STORY_TEMPLATES = {
            start: {
                title: '故事开始',
                content: '在一个<span class="highlight">神秘的森林</span>里，你发现了一条<span class="highlight">古老的小路</span>...',
                choices: [
                    { icon: '🌲', text: '沿着小路走进森林深处', next: 'forest' },
                    { icon: '🚪', text: '转身回到村庄', next: 'village' },
                    { icon: '🔍', text: '仔细观察周围的痕迹', next: 'observe' }
                ]
            },
            forest: {
                title: '森林深处',
                content: '你走进了<span class="highlight">茂密的森林</span>，树木越来越高大。突然，你听到了<span class="highlight">奇怪的声音</span>...',
                choices: [
                    { icon: '👂', text: '循着声音前进', next: 'sound' },
                    { icon: '🏃', text: '快速逃离', next: 'escape' },
                    { icon: '🧙', text: '召唤魔法保护', next: 'magic' }
                ]
            },
            village: {
                title: '回到村庄',
                content: '你回到了<span class="highlight">熟悉的村庄</span>，村民们正在讨论<span class="highlight">森林的传说</span>...',
                choices: [
                    { icon: '💬', text: '询问村民关于传说', next: 'ask' },
                    { icon: '🏠', text: '回家休息', next: 'home' },
                    { icon: '📚', text: '去图书馆查阅资料', next: 'library' }
                ]
            },
            observe: {
                title: '观察痕迹',
                content: '你发现了<span class="highlight">古老的符文</span>，这些符文似乎指向<span class="highlight">某个秘密</span>...',
                choices: [
                    { icon: '📝', text: '记录符文并研究', next: 'study' },
                    { icon: '🧭', text: '跟随符文的指引', next: 'follow' },
                    { icon: '📸', text: '拍照留念', next: 'photo' }
                ]
            },
            sound: {
                title: '声音的来源',
                content: '你找到了<span class="highlight">一座古老的遗迹</span>，声音似乎来自<span class="highlight">深处</span>...',
                choices: [
                    { icon: '🚪', text: '进入遗迹探索', next: 'ruins' },
                    { icon: '🔔', text: '敲击遗迹入口', next: 'knock' },
                    { icon: '🛡️', text: '做好防御准备', next: 'prepare' }
                ]
            },
            magic: {
                title: '魔法力量',
                content: '你施展了<span class="highlight">强大的魔法</span>，森林中的<span class="highlight">精灵</span>出现了...',
                choices: [
                    { icon: '🤝', text: '与精灵友好交谈', next: 'friendly' },
                    { icon: '❓', text: '询问精灵的秘密', next: 'secret' },
                    { icon: '🎁', text: '赠送礼物给精灵', next: 'gift' }
                ]
            },
            ending: {
                title: '故事结束',
                content: '你的冒险故事<span class="highlight">圆满结束</span>，这段经历将成为<span class="highlight">永恒的记忆</span>...',
                choices: []
            }
        };

        let currentStory = 'start';
        let storyText = '';
        let chapter = 1;
        let words = 0;
        let choiceCount = 0;
        let savedStories = [];

        function initGame() {
            currentStory = 'start';
            storyText = '';
            chapter = 1;
            words = 0;
            choiceCount = 0;

            renderStory();
            updateUI();
        }

        function renderStory() {
            const story = STORY_TEMPLATES[currentStory];
            if (!story) return;

            document.getElementById('storyTitle').textContent = story.title;
            document.getElementById('storyContent').innerHTML = story.content;

            storyText += story.content.replace(/<[^>]*>/g, '') + '\n';

            const choicesEl = document.getElementById('choicesArea');
            choicesEl.innerHTML = '';

            if (story.choices.length === 0) {
                showMessage('🎉 故事创作完成！\n总字数: ' + words);
                return;
            }

            story.choices.forEach(choice => {
                const btn = document.createElement('div');
                btn.className = 'choice-btn';
                btn.innerHTML = `
                    <span class="choice-icon">${choice.icon}</span>
                    <span class="choice-text">${choice.text}</span>
                `;
                btn.addEventListener('click', () => makeChoice(choice));
                choicesEl.appendChild(btn);
            });

            updateWordCount();
        }

        function makeChoice(choice) {
            choiceCount++;
            chapter++;

            storyText += '【选择: ' + choice.text + '】\n';

            // 根据选择决定下一个场景
            if (STORY_TEMPLATES[choice.next]) {
                currentStory = choice.next;
            } else {
                // 随机生成结局
                currentStory = 'ending';
            }

            renderStory();
            updateUI();
        }

        function updateWordCount() {
            const cleanText = storyText.replace(/<[^>]*>/g, '').replace(/\s/g, '');
            words = cleanText.length;
            document.getElementById('wordCount').textContent = '已创作 ' + words + ' 字';
        }

        function saveStory() {
            if (words === 0) {
                showMessage('请先创作故事！');
                return;
            }

            savedStories.push({
                text: storyText,
                words: words,
                chapters: chapter
            });

            showMessage('故事已保存！\n字数: ' + words);
            GameCore.highScore.set('story_game', words);
        }

        function updateUI() {
            document.getElementById('chapter').textContent = chapter;
            document.getElementById('words').textContent = words;
            document.getElementById('choices').textContent = choiceCount;
        }

        function showMessage(msg) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 2000);
        }

        document.getElementById('btnRestart').addEventListener('click', initGame);
        document.getElementById('btnSave').addEventListener('click', saveStory);

        // 初始化
        GameCore.init({ highScore: 'story_game' });
        initGame();
    </script>
</body>
</html>
