<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>流体模拟</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #0c2461 0%, #1e3799 100%); min-height: 100vh; overflow: hidden; }
        .game-container { width: 100%; height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 10px; }
        .stat { display: flex; flex-direction: column; align-items: center; color: #fff; }
        .stat-label { font-size: 12px; opacity: 0.8; }
        .stat-value { font-size: 24px; font-weight: bold; color: #ffd700; }
        
        .canvas-container { flex: 1; position: relative; background: rgba(0,0,0,0.3); border-radius: 15px; overflow: hidden; }
        #gameCanvas { width: 100%; height: 100%; display: block; }
        
        .controls { display: flex; gap: 10px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
        .btn { padding: 12px 25px; border: none; border-radius: 25px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #00d2ff, #3a7bd5); color: #fff; }
        .btn-secondary { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; }
        .btn-success { background: linear-gradient(135deg, #4facfe, #00f2fe); color: #fff; }
        
        .color-picker { display: flex; gap: 5px; align-items: center; }
        .color-btn { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; }
        .color-btn.active { border-width: 4px; }
        
        .info-panel { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: #fff; padding: 10px; border-radius: 10px; font-size: 12px; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 10px; font-size: 14px; }

.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}

</style>
</head>
<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">粒子数</div>
                <div class="stat-value" id="particles">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">容器数</div>
                <div class="stat-value" id="containers">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">最高记录</div>
                <div class="stat-value" id="highScore">0</div>
            </div>
        </div>
        
        <div class="canvas-container">
            <canvas id="gameCanvas"></canvas>
            <div class="info-panel">
                <div>点击添加流体</div>
                <div>拖动绘制容器</div>
            </div>
        </div>
        
        <div class="controls">
            <div class="color-picker">
                <div class="color-btn active" style="background: #00d2ff" data-color="water"></div>
                <div class="color-btn" style="background: #f5576c" data-color="fire"></div>
                <div class="color-btn" style="background: #96ceb4" data-color="acid"></div>
                <div class="color-btn" style="background: #ffd700" data-color="gold"></div>
            </div>
            <button class="btn btn-primary" id="btnAdd">💧 添加流体</button>
            <button class="btn btn-secondary" id="btnClear">🗑️ 清空</button>
            <button class="btn btn-success" id="btnContainer">📦 添加容器</button>
        </div>
        
        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script src="../game_core.js"></script>
<script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let particles = [];
        let containers = [];
        let highScore = parseInt(localStorage.getItem('highscore_流体模拟') || '0');
        
        let currentColor = 'water';
        let drawingContainer = false;
        let containerStart = null;
        
        const FLUID_TYPES = {
            water: { color: '#00d2ff', gravity: 0.3, bounce: 0.5, viscosity: 0.98 },
            fire: { color: '#f5576c', gravity: -0.1, bounce: 0.3, viscosity: 0.95 },
            acid: { color: '#96ceb4', gravity: 0.25, bounce: 0.4, viscosity: 0.97 },
            gold: { color: '#ffd700', gravity: 0.4, bounce: 0.2, viscosity: 0.99 }
        };
        
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        
        class FluidParticle {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = Math.random() * 2;
                this.type = type;
                this.radius = 4 + Math.random() * 2;
                this.life = 1;
                
                const fluid = FLUID_TYPES[type];
                this.color = fluid.color;
                this.gravity = fluid.gravity;
                this.bounce = fluid.bounce;
                this.viscosity = fluid.viscosity;
            }
            
            update() {
                this.vy += this.gravity;
                this.vx *= this.viscosity;
                this.vy *= this.viscosity;
                
                this.x += this.vx;
                this.y += this.vy;
                
                // 边界碰撞
                if (this.x - this.radius < 0) {
                    this.x = this.radius;
                    this.vx *= -this.bounce;
                }
                if (this.x + this.radius > canvas.width) {
                    this.x = canvas.width - this.radius;
                    this.vx *= -this.bounce;
                }
                if (this.y - this.radius < 0) {
                    this.y = this.radius;
                    this.vy *= -this.bounce;
                }
                if (this.y + this.radius > canvas.height) {
                    this.y = canvas.height - this.radius;
                    this.vy *= -this.bounce;
                }
                
                // 容器碰撞
                containers.forEach(cont => {
                    if (this.x > cont.x && this.x < cont.x + cont.width &&
                        this.y > cont.y && this.y < cont.y + cont.height) {
                        
                        // 找最近的边界
                        const distances = [
                            { dist: this.y - cont.y, dir: 'top' },
                            { dist: cont.y + cont.height - this.y, dir: 'bottom' },
                            { dist: this.x - cont.x, dir: 'left' },
                            { dist: cont.x + cont.width - this.x, dir: 'right' }
                        ];
                        
                        const nearest = distances.reduce((a, b) => a.dist < b.dist ? a : b);
                        
                        if (nearest.dist < this.radius) {
                            switch (nearest.dir) {
                                case 'top':
                                    this.y = cont.y + this.radius;
                                    this.vy *= -this.bounce;
                                    break;
                                case 'bottom':
                                    this.y = cont.y + cont.height - this.radius;
                                    this.vy *= -this.bounce;
                                    break;
                                case 'left':
                                    this.x = cont.x + this.radius;
                                    this.vx *= -this.bounce;
                                    break;
                                case 'right':
                                    this.x = cont.x + cont.width - this.radius;
                                    this.vx *= -this.bounce;
                                    break;
                            }
                        }
                    }
                });
                
                // 粒子间碰撞（简化）
                for (let i = particles.indexOf(this) + 1; i < particles.length; i++) {
                    const other = particles[i];
                    const dx = other.x - this.x;
                    const dy = other.y - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < this.radius + other.radius && dist > 0) {
                        const force = (this.radius + other.radius - dist) / 2;
                        const angle = Math.atan2(dy, dx);
                        
                        this.x -= Math.cos(angle) * force * 0.5;
                        this.y -= Math.sin(angle) * force * 0.5;
                        other.x += Math.cos(angle) * force * 0.5;
                        other.y += Math.sin(angle) * force * 0.5;
                        
                        // 速度交换
                        const avgVx = (this.vx + other.vx) / 2;
                        const avgVy = (this.vy + other.vy) / 2;
                        
                        this.vx = avgVx + (this.vx - avgVx) * this.bounce;
                        this.vy = avgVy + (this.vy - avgVy) * this.bounce;
                        other.vx = avgVx + (other.vx - avgVx) * other.bounce;
                        other.vy = avgVy + (other.vy - avgVy) * other.bounce;
                    }
                }
                
                // 火焰粒子逐渐消失
                if (this.type === 'fire') {
                    this.life -= 0.005;
                    this.y -= 0.5;
                    if (this.life <= 0) return false;
                }
                
                return true;
            }
            
            draw() {
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.type === 'fire' ? this.life : 0.8;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 5;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 1;
            }
        }
        
        function addFluid(x, y, count = 20) {
            if (particles.length < 500) {
                for (let i = 0; i < count; i++) {
                    const offsetX = (Math.random() - 0.5) * 30;
                    const offsetY = (Math.random() - 0.5) * 30;
                    particles.push(new FluidParticle(x + offsetX, y + offsetY, currentColor));
                }
                updateStats();
            }
        }
        
        function addContainer(x, y, width, height) {
            containers.push({ x, y, width, height });
            updateStats();
        }
        
        function updateStats() {
            document.getElementById('particles').textContent = particles.length;
            document.getElementById('containers').textContent = containers.length;
            
            if (particles.length > highScore) {
                highScore = particles.length;
                localStorage.setItem('highscore_流体模拟', highScore);
            }
            document.getElementById('highScore').textContent = highScore;
        }
        
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 背景
            ctx.fillStyle = 'rgba(0,0,0,0.05)';
            for (let i = 0; i < 20; i++) {
                ctx.beginPath();
                ctx.arc(Math.random() * canvas.width, Math.random() * canvas.height, 1, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // 绘制容器
            containers.forEach(cont => {
                ctx.strokeStyle = '#666';
                ctx.lineWidth = 3;
                ctx.strokeRect(cont.x, cont.y, cont.width, cont.height);
                
                ctx.fillStyle = 'rgba(100,100,100,0.2)';
                ctx.fillRect(cont.x, cont.y, cont.width, cont.height);
            });
            
            // 绘制正在绘制的容器
            if (drawingContainer && containerStart) {
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.strokeRect(containerStart.x, containerStart.y, containerStart.width, containerStart.height);
                ctx.setLineDash([]);
            }
            
            // 更新和绘制粒子
            particles = particles.filter(p => p.update());
            particles.forEach(p => p.draw());
            
            requestAnimationFrame(gameLoop);
        }
        
        // 鼠标/触摸事件
        let lastMouseX = 0;
        let lastMouseY = 0;
        
        canvas.addEventListener('mousedown', e => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            if (e.shiftKey) {
                drawingContainer = true;
                containerStart = { x, y, width: 0, height: 0 };
            } else {
                addFluid(x, y);
                lastMouseX = x;
                lastMouseY = y;
            }
        });
        
        canvas.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            if (drawingContainer && containerStart) {
                containerStart.width = x - containerStart.x;
                containerStart.height = y - containerStart.y;
            } else if (e.buttons === 1) {
                const dx = x - lastMouseX;
                const dy = y - lastMouseY;
                if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
                    addFluid(x, y, 5);
                    lastMouseX = x;
                    lastMouseY = y;
                }
            }
        });
        
        canvas.addEventListener('mouseup', e => {
            if (drawingContainer && containerStart) {
                const width = Math.abs(containerStart.width);
                const height = Math.abs(containerStart.height);
                
                if (width > 20 && height > 20) {
                    const x = containerStart.width > 0 ? containerStart.x : containerStart.x + containerStart.width;
                    const y = containerStart.height > 0 ? containerStart.y : containerStart.y + containerStart.height;
                    addContainer(x, y, width, height);
                }
                
                drawingContainer = false;
                containerStart = null;
            }
        });
        
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            addFluid(x, y);
        }, { passive: false });
        
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            addFluid(x, y, 3);
        }, { passive: false });
        
        // 颜色选择
        document.querySelectorAll('.color-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentColor = btn.dataset.color;
            });
        });
        
        document.getElementById('btnAdd').addEventListener('click', () => {
            addFluid(canvas.width / 2, 50, 30);
        });
        
        document.getElementById('btnClear').addEventListener('click', () => {
            particles = [];
            containers = [];
            updateStats();
        });
        
        document.getElementById('btnContainer').addEventListener('click', () => {
            // 添加预设容器
            addContainer(
                canvas.width / 4,
                canvas.height / 3,
                canvas.width / 2,
                canvas.height / 3
            );
        });
        
        // 初始化
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        document.getElementById('highScore').textContent = highScore;
        
        // 添加初始流体
        addFluid(canvas.width / 2, 100, 50);
        
        gameLoop();
    </script>

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
