<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>位置反应</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; color: #fff; }
        
        .game-container { width: 100%; flex: 1; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: #ffd700; }
        .level { font-size: 14px; opacity: 0.7; }
        
        .game-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        
        .grid-area { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 20px; background: rgba(255,255,255,0.05); border-radius: 15px; }
        .grid-cell { width: 60px; height: 60px; border-radius: 10px; background: rgba(255,255,255,0.1); cursor: pointer; transition: all 0.2s; }
        .grid-cell.active { background: linear-gradient(135deg, #48c78e, #4ecdc4); }
        .grid-cell.clicked { background: linear-gradient(135deg, #f093fb, #f5576c); }
        .grid-cell.correct { background: linear-gradient(135deg, #48c78e, #4ecdc4); }
        .grid-cell.wrong { background: linear-gradient(135deg, #ff6b6b, #ffa502); }
        
        .instructions { font-size: 18px; margin-bottom: 20px; text-align: center; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="title">🎯 位置反应</div>
            <div class="level">第 <span id="level">1</span> 关</div>
        </div>
        
        <div class="game-area">
            <div class="instructions" id="instructions">记住亮灯的位置！</div>
            <div class="grid-area" id="grid"></div>
        </div>
    </div>
    
    <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>

    <script src="game_core.js"></script>
    <script>
        const GAME_NAME = '位置反应';
        GameCore.init({ highScore: GAME_NAME });
        
        let level = 1;
        let sequence = [];
        let playerIndex = 0;
        let isShowing = false;
        
        function initGame() {
            level = 1;
            nextLevel();
        }
        
        function nextLevel() {
            document.getElementById('level').textContent = level;
            sequence = [];
            
            for (let i = 0; i < level; i++) {
                sequence.push(Math.floor(Math.random() * 16));
            }
            
            playerIndex = 0;
            showSequence();
        }
        
        function showSequence() {
            isShowing = true;
            document.getElementById('instructions').textContent = '记住亮灯的位置...';
            
            let delay = 500;
            
            sequence.forEach((cellIndex, index) => {
                setTimeout(() => {
                    const cell = document.getElementById('cell-' + cellIndex);
                    if (cell) {
                        cell.classList.add('active');
                        
                        setTimeout(() => {
                            cell.classList.remove('active');
                            
                            if (index === sequence.length - 1) {
                                isShowing = false;
                                document.getElementById('instructions').textContent = '按顺序点击！';
                            }
                        }, 500);
                    }
                }, delay);
                
                delay += 1000;
            });
        }
        
        function handleClick(cellIndex) {
            if (isShowing) return;
            
            const cell = document.getElementById('cell-' + cellIndex);
            
            if (cellIndex === sequence[playerIndex]) {
                cell.classList.add('correct');
                
                playerIndex++;
                
                setTimeout(() => {
                    cell.classList.remove('correct');
                }, 200);
                
                if (playerIndex === sequence.length) {
                    level++;
                    GameCore.highScore.set(GAME_NAME, level);
                    GameCore.hints.show(`🎉 第${level - 1}关通过！`);
                    
                    setTimeout(() => {
                        nextLevel();
                    }, 1000);
                }
            } else {
                cell.classList.add('wrong');
                
                GameCore.hints.show(`💥 错误！到达第${level}关`);
                
                setTimeout(() => {
                    cell.classList.remove('wrong');
                    level = 1;
                    nextLevel();
                }, 500);
            }
        }
        
        function renderGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            
            for (let i = 0; i < 16; i++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                cell.id = 'cell-' + i;
                cell.onclick = () => handleClick(i);
                
                grid.appendChild(cell);
            }
        }
        
        renderGrid();
        initGame();
        GameCore.touch.enableAllButtons();
    </script>
</body>
</html>
