<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>磁力对抗</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; overflow: hidden; color: #fff; }
        .game-container { width: 100%; height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 10px; }
        .stat { display: flex; flex-direction: column; align-items: center; }
        .stat-label { font-size: 12px; opacity: 0.7; }
        .stat-value { font-size: 24px; font-weight: bold; color: #ffd700; }
        
        .game-area { flex: 1; position: relative; background: rgba(0,0,0,0.3); border-radius: 15px; overflow: hidden; }
        #gameCanvas { width: 100%; height: 100%; display: block; }
        
        .magnet-indicator { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 10px; font-size: 14px; display: flex; align-items: center; gap: 10px; }
        .magnet-btn { width: 40px; height: 40px; border-radius: 50%; border: none; font-size: 20px; cursor: pointer; }
        .btn-positive { background: #48c78e; }
        .btn-negative { background: #f5576c; }
        
        .controls { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
        .btn { padding: 12px 25px; border: none; border-radius: 25px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 10px; font-size: 14px; }
    /* [BATCH-FIX:ad-components-css] */

.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.sponsor-panel.show{display:flex}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.interstitial-ad.show{display:flex}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* [/BATCH-FIX:ad-components-css] */
</style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">关卡</div>
                <div class="stat-value" id="level">1</div>
            </div>
            <div class="stat">
                <div class="stat-label">分数</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">最高</div>
                <div class="stat-value" id="highScore">0</div>
            </div>
        </div>
        
        <div class="game-area">
            <canvas id="gameCanvas"></canvas>
            <div class="magnet-indicator">
                <button class="magnet-btn btn-positive" id="btnPositive">+</button>
                <span id="magnetStatus">中立</span>
                <button class="magnet-btn btn-negative" id="btnNegative">-</button>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" id="btnStart">▶️ 开始游戏</button>
        </div>
        
        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const GAME_NAME = '磁力对抗';
        GameCore.init({ highScore: GAME_NAME });
        
        let level = 1;
        let score = 0;
        let gameRunning = false;
        
        let player = { x: 0, y: 0, vx: 0, vy: 0, radius: 15, charge: 0 };
        let magnetMode = 0;
        
        let magnets = [];
        let obstacles = [];
        let goals = [];
        let particles = [];
        
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            initLevel();
        }
        
        function initLevel() {
            player.x = canvas.width / 2;
            player.y = canvas.height - 100;
            player.vx = 0;
            player.vy = 0;
            player.charge = 0;
            
            magnets = [];
            obstacles = [];
            goals = [];
            particles = [];
            
            const magnetCount = 3 + level;
            for (let i = 0; i < magnetCount; i++) {
                magnets.push({
                    x: 50 + (i % 2) * (canvas.width - 100),
                    y: 100 + Math.floor(i / 2) * 120,
                    radius: 25 + Math.random() * 15,
                    charge: i % 2 === 0 ? 1 : -1,
                    strength: 500 + Math.random() * 500,
                    color: i % 2 === 0 ? '#48c78e' : '#f5576c'
                });
            }
            
            const obstacleCount = level;
            for (let i = 0; i < obstacleCount; i++) {
                obstacles.push({
                    x: 100 + Math.random() * (canvas.width - 200),
                    y: 150 + Math.random() * (canvas.height - 300),
                    width: 60 + Math.random() * 40,
                    height: 60 + Math.random() * 40
                });
            }
            
            goals.push({
                x: canvas.width / 2 - 25,
                y: 50,
                width: 50,
                height: 50,
                color: '#ffd700'
            });
        }
        
        function setMagnetMode(mode) {
            magnetMode = mode;
            player.charge = mode;
            
            const statusEl = document.getElementById('magnetStatus');
            if (mode === 1) {
                statusEl.textContent = '正极 +';
                statusEl.style.color = '#48c78e';
            } else if (mode === -1) {
                statusEl.textContent = '负极 -';
                statusEl.style.color = '#f5576c';
            } else {
                statusEl.textContent = '中立';
                statusEl.style.color = '#fff';
            }
            
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x: player.x,
                    y: player.y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    life: 1,
                    color: mode === 1 ? '#48c78e' : mode === -1 ? '#f5576c' : '#888'
                });
            }
        }
        
        function updatePlayer() {
            magnets.forEach(m => {
                const dx = m.x - player.x;
                const dy = m.y - player.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist > 0 && dist < m.strength / 2) {
                    const force = (m.strength / (dist + 50)) * (player.charge * m.charge);
                    const fx = (dx / dist) * force;
                    const fy = (dy / dist) * force;
                    
                    player.vx += fx * 0.1;
                    player.vy += fy * 0.1;
                }
            });
            
            player.vy += 0.3;
            player.vx *= 0.98;
            player.vy *= 0.98;
            
            player.x += player.vx;
            player.y += player.vy;
            
            if (player.x < player.radius) {
                player.x = player.radius;
                player.vx *= -0.5;
            }
            if (player.x > canvas.width - player.radius) {
                player.x = canvas.width - player.radius;
                player.vx *= -0.5;
            }
            if (player.y < player.radius) {
                player.y = player.radius;
                player.vy *= -0.5;
            }
            if (player.y > canvas.height - player.radius) {
                player.y = canvas.height - player.radius;
                player.vy *= -0.5;
                
                for (let i = 0; i < 15; i++) {
                    particles.push({
                        x: player.x,
                        y: player.y,
                        vx: (Math.random() - 0.5) * 10,
                        vy: -Math.random() * 10,
                        life: 1,
                        color: '#ff6b6b'
                    });
                }
            }
            
            obstacles.forEach(obs => {
                if (player.x + player.radius > obs.x &&
                    player.x - player.radius < obs.x + obs.width &&
                    player.y + player.radius > obs.y &&
                    player.y - player.radius < obs.y + obs.height) {
                    
                    const overlapX = Math.min(player.x + player.radius - obs.x, obs.x + obs.width - (player.x - player.radius));
                    const overlapY = Math.min(player.y + player.radius - obs.y, obs.y + obs.height - (player.y - player.radius));
                    
                    if (overlapX < overlapY) {
                        player.x += player.x < obs.x + obs.width / 2 ? -overlapX : overlapX;
                        player.vx *= -0.3;
                    } else {
                        player.y += player.y < obs.y + obs.height / 2 ? -overlapY : overlapY;
                        player.vy *= -0.3;
                    }
                }
            });
            
            goals.forEach(g => {
                const dx = player.x - (g.x + g.width / 2);
                const dy = player.y - (g.y + g.height / 2);
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < g.width / 2 + player.radius) {
                    level++;
                    score += level * 300;
                    GameCore.hints.show('关卡完成！');
                    initLevel();
                }
            });
        }
        
        function updateParticles() {
            particles = particles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.2;
                p.life -= 0.02;
                return p.life > 0;
            });
        }
        
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = 'rgba(255,255,255,0.03)';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 30) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 30) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
            
            magnets.forEach(m => {
                const gradient = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, m.radius);
                gradient.addColorStop(0, m.color);
                gradient.addColorStop(0.5, m.color + '88');
                gradient.addColorStop(1, 'rgba(0,0,0,0)');
                
                ctx.fillStyle = gradient;
                ctx.shadowColor = m.color;
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.arc(m.x, m.y, m.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 20px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(m.charge === 1 ? '+' : '-', m.x, m.y + 7);
                
                ctx.strokeStyle = m.color + '44';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.arc(m.x, m.y, m.radius * 1.5, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);
            });
            
            obstacles.forEach(obs => {
                ctx.fillStyle = '#4a5568';
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                
                ctx.strokeStyle = '#6a7588';
                ctx.lineWidth = 2;
                ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);
            });
            
            goals.forEach(g => {
                ctx.fillStyle = g.color;
                ctx.shadowColor = g.color;
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.arc(g.x + g.width / 2, g.y + g.height / 2, 25, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                
                ctx.fillStyle = '#fff';
                ctx.font = '16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('🏁', g.x + g.width / 2, g.y + g.height / 2 + 5);
            });
            
            let playerColor = '#888';
            if (player.charge === 1) playerColor = '#48c78e';
            if (player.charge === -1) playerColor = '#f5576c';
            
            ctx.fillStyle = playerColor;
            ctx.shadowColor = playerColor;
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 14px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(player.charge === 1 ? '+' : player.charge === -1 ? '-' : '0', player.x, player.y + 5);
            
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }
        
        function updateStats() {
            document.getElementById('level').textContent = level;
            document.getElementById('score').textContent = score;
            document.getElementById('highScore').textContent = GameCore.highScore.get(GAME_NAME);
            
            if (GameCore.highScore.set(GAME_NAME, score)) {
                GameCore.hints.show('新纪录！分数: ' + score);
            }
        }
        
        function gameLoop() {
            draw();
            
            if (gameRunning) {
                updatePlayer();
                updateParticles();
            }
            
            updateStats();
            requestAnimationFrame(gameLoop);
        }
        
        document.getElementById('btnPositive').onclick = () => {
            if (gameRunning) setMagnetMode(1);
        };
        
        document.getElementById('btnNegative').onclick = () => {
            if (gameRunning) setMagnetMode(-1);
        };
        
        canvas.addEventListener('click', () => {
            if (gameRunning) {
                setMagnetMode(magnetMode === 0 ? 1 : magnetMode === 1 ? -1 : 0);
            }
        });
        
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            if (gameRunning) {
                setMagnetMode(magnetMode === 0 ? 1 : magnetMode === 1 ? -1 : 0);
            }
        }, { passive: false });
        
        document.getElementById('btnStart').onclick = () => {
            gameRunning = true;
            level = 1;
            score = 0;
            initLevel();
        };
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        gameLoop();
    </script>

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
