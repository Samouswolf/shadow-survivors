<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>时间倒流</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; overflow: hidden; color: #fff; }
        .game-container { width: 100%; height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 10px; }
        .stat { display: flex; flex-direction: column; align-items: center; }
        .stat-label { font-size: 12px; opacity: 0.7; }
        .stat-value { font-size: 24px; font-weight: bold; color: #4ecdc4; }
        
        .game-area { flex: 1; position: relative; background: rgba(0,0,0,0.4); border-radius: 15px; overflow: hidden; }
        #gameCanvas { width: 100%; height: 100%; display: block; }
        
        .time-control { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px; }
        .time-btn { width: 80px; height: 80px; border-radius: 50%; border: none; font-size: 32px; cursor: pointer; transition: all 0.3s; }
        .time-btn.reverse { background: linear-gradient(135deg, #ff6b6b, #ee5a5a); color: #fff; }
        .time-btn.reverse:hover { transform: scale(1.1); box-shadow: 0 0 20px rgba(255,107,107,0.5); }
        .time-btn.pause { background: linear-gradient(135deg, #4ecdc4, #44a08d); color: #fff; }
        
        .rewind-bar { position: absolute; top: 10px; left: 10px; right: 10px; height: 10px; background: rgba(255,255,255,0.2); border-radius: 5px; overflow: hidden; }
        .rewind-fill { height: 100%; background: linear-gradient(90deg, #ff6b6b, #ffd700); transition: width 0.1s; }
        
        .controls { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
        .btn { padding: 12px 25px; border: none; border-radius: 25px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">关卡</div>
                <div class="stat-value" id="level">1</div>
            </div>
            <div class="stat">
                <div class="stat-label">分数</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">最高</div>
                <div class="stat-value" id="highScore">0</div>
            </div>
        </div>
        
        <div class="game-area">
            <canvas id="gameCanvas"></canvas>
            <div class="rewind-bar">
                <div class="rewind-fill" id="rewindFill"></div>
            </div>
            
            <div class="time-control">
                <button class="time-btn pause" id="btnPause">⏸️</button>
                <button class="time-btn reverse" id="btnReverse">⏪</button>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" id="btnStart">▶️ 开始游戏</button>
        </div>
        
        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    <script src="game_core.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const GAME_NAME = '时间倒流';
        GameCore.init({ highScore: GAME_NAME });
        
        let level = 1;
        let score = 0;
        let gameRunning = false;
        let isRewinding = false;
        let rewindEnergy = 100;
        let history = [];
        let historyIndex = -1;
        
        let player = { x: 50, y: 300, width: 30, height: 50, vx: 0, vy: 0, onGround: false };
        let obstacles = [];
        let stars = [];
        let particles = [];
        
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            initLevel();
        }
        
        function initLevel() {
            player.x = 50;
            player.y = canvas.height - 100;
            player.vx = 0;
            player.vy = 0;
            
            obstacles = [];
            stars = [];
            
            const obstacleCount = 3 + level;
            for (let i = 0; i < obstacleCount; i++) {
                const type = Math.random() > 0.5 ? 'spike' : 'block';
                obstacles.push({
                    x: 200 + i * 150 + Math.random() * 50,
                    y: canvas.height - 60,
                    width: type === 'spike' ? 40 : 60,
                    height: type === 'spike' ? 40 : 30,
                    type: type,
                    color: type === 'spike' ? '#ff6b6b' : '#ffa502'
                });
            }
            
            for (let i = 0; i < obstacleCount; i++) {
                stars.push({
                    x: 150 + i * 150 + Math.random() * 50,
                    y: 100 + Math.random() * 150,
                    collected: false,
                    size: 15
                });
            }
            
            history = [];
            historyIndex = -1;
            saveState();
        }
        
        function saveState() {
            history.push({
                player: { ...player },
                obstacles: JSON.parse(JSON.stringify(obstacles)),
                stars: JSON.parse(JSON.stringify(stars)),
                particles: JSON.parse(JSON.stringify(particles))
            });
            
            if (history.length > 100) {
                history.shift();
            } else {
                historyIndex++;
            }
        }
        
        function rewind() {
            if (historyIndex > 0 && rewindEnergy > 0) {
                historyIndex--;
                rewindEnergy -= 0.5;
                
                const state = history[historyIndex];
                player = { ...state.player };
                obstacles = state.obstacles;
                stars = state.stars;
                particles = state.particles;
                
                updateRewindBar();
            } else {
                isRewinding = false;
            }
        }
        
        function updateRewindBar() {
            document.getElementById('rewindFill').style.width = rewindEnergy + '%';
        }
        
        function updatePlayer() {
            if (isRewinding) return;
            
            player.vx *= 0.95;
            player.vy += 0.5;
            
            if (player.y + player.height > canvas.height - 20) {
                player.y = canvas.height - 20 - player.height;
                player.vy = 0;
                player.onGround = true;
            } else {
                player.onGround = false;
            }
            
            player.x += player.vx;
            player.y += player.vy;
            
            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
        }
        
        function checkCollisions() {
            if (isRewinding) return;
            
            obstacles.forEach(obs => {
                if (player.x < obs.x + obs.width &&
                    player.x + player.width > obs.x &&
                    player.y < obs.y + obs.height &&
                    player.y + player.height > obs.y) {
                    gameOver();
                }
            });
            
            stars.forEach(star => {
                if (!star.collected) {
                    const dx = player.x + player.width / 2 - star.x;
                    const dy = player.y + player.height / 2 - star.y;
                    if (Math.sqrt(dx * dx + dy * dy) < 30) {
                        star.collected = true;
                        score += 100;
                        
                        for (let i = 0; i < 10; i++) {
                            particles.push({
                                x: star.x,
                                y: star.y,
                                vx: (Math.random() - 0.5) * 6,
                                vy: (Math.random() - 0.5) * 6,
                                life: 1,
                                color: '#ffd700'
                            });
                        }
                    }
                }
            });
            
            if (stars.every(s => s.collected)) {
                level++;
                score += level * 500;
                initLevel();
            }
            
            updateStats();
        }
        
        function updateParticles() {
            if (!isRewinding) {
                particles = particles.filter(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.2;
                    p.life -= 0.03;
                    return p.life > 0;
                });
            }
        }
        
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 背景
            for (let i = 0; i < 50; i++) {
                const x = (i * 73 + Date.now() / 50) % canvas.width;
                const y = (i * 97) % canvas.height;
                ctx.fillStyle = `rgba(255,255,255,${0.1 + Math.sin(Date.now() / 1000 + i) * 0.05})`;
                ctx.beginPath();
                ctx.arc(x, y, 1, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // 地面
            ctx.fillStyle = '#4a5568';
            ctx.fillRect(0, canvas.height - 20, canvas.width, 20);
            
            // 障碍物
            obstacles.forEach(obs => {
                ctx.fillStyle = obs.color;
                if (obs.type === 'spike') {
                    ctx.beginPath();
                    ctx.moveTo(obs.x, obs.y + obs.height);
                    ctx.lineTo(obs.x + obs.width / 2, obs.y);
                    ctx.lineTo(obs.x + obs.width, obs.y + obs.height);
                    ctx.closePath();
                    ctx.fill();
                } else {
                    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                }
            });
            
            // 星星
            stars.forEach(star => {
                if (!star.collected) {
                    ctx.fillStyle = '#ffd700';
                    ctx.shadowColor = '#ffd700';
                    ctx.shadowBlur = 10;
                    ctx.font = '24px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('⭐', star.x, star.y + 8);
                    ctx.shadowBlur = 0;
                }
            });
            
            // 玩家
            ctx.fillStyle = '#4ecdc4';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(player.x + 22, player.y + 15, 5, 0, Math.PI * 2);
            ctx.fill();
            
            // 粒子
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }
        
        function gameOver() {
            gameRunning = false;
            GameCore.hints.show('游戏结束！\n关卡: ' + level + ' | 分数: ' + score, 5000);
        }
        
        function updateStats() {
            document.getElementById('level').textContent = level;
            document.getElementById('score').textContent = score;
            document.getElementById('highScore').textContent = GameCore.highScore.get(GAME_NAME);
            
            if (GameCore.highScore.set(GAME_NAME, score)) {
                GameCore.hints.show('新纪录！分数: ' + score);
            }
        }
        
        function gameLoop() {
            draw();
            
            if (gameRunning) {
                if (isRewinding) {
                    rewind();
                } else {
                    updatePlayer();
                    checkCollisions();
                    updateParticles();
                    saveState();
                    
                    if (rewindEnergy < 100) rewindEnergy += 0.1;
                }
                
                updateRewindBar();
            }
            
            updateStats();
            requestAnimationFrame(gameLoop);
        }
        
        // 键盘控制
        document.addEventListener('keydown', e => {
            if (!gameRunning) return;
            
            if (e.code === 'ArrowRight' || e.code === 'KeyD') {
                player.vx = 5;
            }
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
                player.vx = -5;
            }
            if (e.code === 'ArrowUp' || e.code === 'KeyW') {
                if (player.onGround) {
                    player.vy = -12;
                    player.onGround = false;
                }
            }
            if (e.code === 'Space') {
                isRewinding = true;
            }
        });
        
        document.addEventListener('keyup', e => {
            if (e.code === 'Space') {
                isRewinding = false;
            }
        });
        
        // 触屏控制
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            if (!gameRunning) return;
            
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            
            if (x < canvas.width / 2) {
                player.vx = -5;
                if (player.onGround) {
                    player.vy = -12;
                    player.onGround = false;
                }
            } else {
                player.vx = 5;
            }
        }, { passive: false });
        
        canvas.addEventListener('touchend', () => {
            player.vx = 0;
        });
        
        document.getElementById('btnReverse').onmousedown = () => { isRewinding = true; };
        document.getElementById('btnReverse').onmouseup = () => { isRewinding = false; };
        document.getElementById('btnReverse').onmouseleave = () => { isRewinding = false; };
        
        document.getElementById('btnPause').onclick = () => {
            gameRunning = !gameRunning;
        };
        
        document.getElementById('btnStart').onclick = () => {
            gameRunning = true;
            level = 1;
            score = 0;
            rewindEnergy = 100;
            initLevel();
        };
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        gameLoop();
    </script>
</body>
</html>
