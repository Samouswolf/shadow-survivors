<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>语音控制</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; overflow: hidden; color: #fff; }
        .game-container { width: 100%; height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 10px; }
        .stat { display: flex; flex-direction: column; align-items: center; }
        .stat-label { font-size: 12px; opacity: 0.7; }
        .stat-value { font-size: 24px; font-weight: bold; color: #ff6b6b; }
        
        .game-area { flex: 1; position: relative; background: rgba(0,0,0,0.4); border-radius: 15px; overflow: hidden; }
        #gameCanvas { width: 100%; height: 100%; display: block; }
        
        .voice-indicator { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 10px; font-size: 16px; }
        .voice-wave { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 5px; align-items: flex-end; height: 60px; }
        .wave-bar { width: 10px; background: #4ecdc4; border-radius: 5px; transition: height 0.1s; }
        
        .controls { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
        .btn { padding: 12px 25px; border: none; border-radius: 25px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">关卡</div>
                <div class="stat-value" id="level">1</div>
            </div>
            <div class="stat">
                <div class="stat-label">分数</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">最高</div>
                <div class="stat-value" id="highScore">0</div>
            </div>
        </div>
        
        <div class="game-area">
            <canvas id="gameCanvas"></canvas>
            <div class="voice-indicator" id="voiceIndicator">🎤 点击开始录音</div>
            <div class="voice-wave" id="voiceWave">
                <div class="wave-bar" style="height: 10px;"></div>
                <div class="wave-bar" style="height: 20px;"></div>
                <div class="wave-bar" style="height: 15px;"></div>
                <div class="wave-bar" style="height: 25px;"></div>
                <div class="wave-bar" style="height: 18px;"></div>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" id="btnStart">▶️ 开始游戏</button>
        </div>
        
        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const GAME_NAME = '语音控制';
        GameCore.init({ highScore: GAME_NAME });
        
        let level = 1;
        let score = 0;
        let gameRunning = false;
        let volume = 0;
        
        let player = { x: canvas.width / 2, y: canvas.height / 2, radius: 20, vx: 0, vy: 0 };
        let targets = [];
        let obstacles = [];
        
        let audioContext;
        let analyser;
        let microphone;
        let isRecording = false;
        
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            player.x = canvas.width / 2;
            player.y = canvas.height / 2;
            initLevel();
        }
        
        function initLevel() {
            targets = [];
            obstacles = [];
            
            const targetCount = 3 + level;
            for (let i = 0; i < targetCount; i++) {
                targets.push({
                    x: 50 + (i % 3) * (canvas.width - 100) / 2,
                    y: 50 + Math.floor(i / 3) * (canvas.height - 200) / 2,
                    radius: 25,
                    collected: false,
                    color: `hsl(${i * 60}, 70%, 50%)`
                });
            }
            
            const obstacleCount = 2 + level;
            for (let i = 0; i < obstacleCount; i++) {
                obstacles.push({
                    x: 100 + i * 200,
                    y: 100 + Math.random() * (canvas.height - 200),
                    width: 40,
                    height: 40,
                    color: '#ff6b6b'
                });
            }
        }
        
        async function startRecording() {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                analyser = audioContext.createAnalyser();
                microphone = audioContext.createMediaStreamSource(stream);
                microphone.connect(analyser);
                
                analyser.fftSize = 256;
                isRecording = true;
                document.getElementById('voiceIndicator').textContent = '🎤 录音中...';
                
                analyzeAudio();
            } catch (e) {
                GameCore.hints.show('无法访问麦克风，请检查权限', 3000);
            }
        }
        
        function stopRecording() {
            if (isRecording) {
                isRecording = false;
                document.getElementById('voiceIndicator').textContent = '🎤 点击开始录音';
                
                if (microphone) {
                    microphone.disconnect();
                }
                if (audioContext) {
                    audioContext.close();
                }
            }
        }
        
        function analyzeAudio() {
            if (!isRecording) return;
            
            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(dataArray);
            
            const average = dataArray.reduce((sum, value) => sum + value, 0) / dataArray.length;
            volume = average / 255;
            
            // 更新波形显示
            const bars = document.querySelectorAll('.wave-bar');
            bars.forEach((bar, i) => {
                const height = dataArray[i * 10] / 255 * 60;
                bar.style.height = `${Math.max(5, height)}px`;
            });
            
            // 根据音量控制玩家
            if (volume > 0.2) {
                const angle = Math.random() * Math.PI * 2;
                const speed = volume * 10;
                player.vx += Math.cos(angle) * speed;
                player.vy += Math.sin(angle) * speed;
            }
            
            requestAnimationFrame(analyzeAudio);
        }
        
        function updatePlayer() {
            player.vx *= 0.95;
            player.vy *= 0.95;
            player.x += player.vx;
            player.y += player.vy;
            
            obstacles.forEach(obs => {
                if (player.x - player.radius < obs.x + obs.width &&
                    player.x + player.radius > obs.x &&
                    player.y - player.radius < obs.y + obs.height &&
                    player.y + player.radius > obs.y) {
                    
                    player.vx *= -0.5;
                    player.vy *= -0.5;
                }
            });
            
            if (player.x < player.radius) player.x = player.radius;
            if (player.x > canvas.width - player.radius) player.x = canvas.width - player.radius;
            if (player.y < player.radius) player.y = player.radius;
            if (player.y > canvas.height - player.radius) player.y = canvas.height - player.radius;
        }
        
        function checkCollisions() {
            targets.forEach(t => {
                if (!t.collected) {
                    const dx = player.x - t.x;
                    const dy = player.y - t.y;
                    if (Math.sqrt(dx * dx + dy * dy) < player.radius + t.radius) {
                        t.collected = true;
                        score += 100;
                        
                        for (let i = 0; i < 10; i++) {
                            particles.push({
                                x: t.x,
                                y: t.y,
                                vx: (Math.random() - 0.5) * 8,
                                vy: (Math.random() - 0.5) * 8,
                                life: 1,
                                color: t.color
                            });
                        }
                    }
                }
            });
            
            if (targets.every(t => t.collected)) {
                level++;
                score += level * 500;
                initLevel();
            }
            
            updateStats();
        }
        
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 音量可视化背景
            const gradient = ctx.createRadialGradient(player.x, player.y, 0, player.x, player.y, 200);
            gradient.addColorStop(0, `rgba(78, 205, 196, ${volume * 0.5})`);
            gradient.addColorStop(1, 'transparent');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 目标
            targets.forEach(t => {
                if (!t.collected) {
                    ctx.fillStyle = t.color;
                    ctx.shadowColor = t.color;
                    ctx.shadowBlur = 15;
                    ctx.beginPath();
                    ctx.arc(t.x, t.y, t.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            });
            
            // 障碍物
            obstacles.forEach(obs => {
                ctx.fillStyle = obs.color;
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            });
            
            // 玩家
            ctx.fillStyle = '#f5576c';
            ctx.shadowColor = '#f5576c';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius + volume * 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            // 粒子
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }
        
        let particles = [];
        
        function updateParticles() {
            particles = particles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;
                return p.life > 0;
            });
        }
        
        function updateStats() {
            document.getElementById('level').textContent = level;
            document.getElementById('score').textContent = score;
            document.getElementById('highScore').textContent = GameCore.highScore.get(GAME_NAME);
            
            if (GameCore.highScore.set(GAME_NAME, score)) {
                GameCore.hints.show('新纪录！分数: ' + score);
            }
        }
        
        function gameLoop() {
            draw();
            
            if (gameRunning) {
                updatePlayer();
                checkCollisions();
                updateParticles();
            }
            
            updateStats();
            requestAnimationFrame(gameLoop);
        }
        
        canvas.addEventListener('click', () => {
            if (!gameRunning) return;
            
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        });
        
        document.getElementById('btnStart').onclick = () => {
            gameRunning = true;
            level = 1;
            score = 0;
            initLevel();
        };
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        gameLoop();
    </script>
</body>
</html>
