<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>因果律</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%); min-height: 100vh; overflow: hidden; color: #fff; }
        .game-container { width: 100%; height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 10px; }
        .stat { display: flex; flex-direction: column; align-items: center; }
        .stat-label { font-size: 12px; opacity: 0.7; }
        .stat-value { font-size: 24px; font-weight: bold; color: #4ecdc4; }
        
        .game-area { flex: 1; position: relative; background: rgba(0,0,0,0.4); border-radius: 15px; overflow: hidden; }
        #gameCanvas { width: 100%; height: 100%; display: block; }
        
        .causality-indicator { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 10px; font-size: 16px; }
        
        .controls { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
        .btn { padding: 12px 25px; border: none; border-radius: 25px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 10px; font-size: 14px; }
    /* [BATCH-FIX:ad-components-css] */
.sponsor-btn{position:fixed;bottom:8px;left:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:2px 6px;border-radius:10px;font:10px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.sponsor-panel.show{display:flex}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.interstitial-ad.show{display:flex}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* [/BATCH-FIX:ad-components-css] */

/* [AD-FIX:responsive] */
@media (max-width:768px){.ad-banner-container{display:none!important}.sponsor-btn{transform:scale(.8);opacity:.6}}
/* [/AD-FIX:responsive] */
</style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">关卡</div>
                <div class="stat-value" id="level">1</div>
            </div>
            <div class="stat">
                <div class="stat-label">分数</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">最高</div>
                <div class="stat-value" id="highScore">0</div>
            </div>
        </div>
        
        <div class="game-area">
            <canvas id="gameCanvas"></canvas>
            <div class="causality-indicator" id="causalityIndicator">🔗 因果链: 0</div>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" id="btnStart">▶️ 开始游戏</button>
        </div>
        
        
    </div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const GAME_NAME = '因果律';
        GameCore.init({ highScore: GAME_NAME });
        
        let level = 1;
        let score = 0;
        let gameRunning = false;
        
        let player = { x: 50, y: 300, width: 30, height: 50, vx: 0, vy: 0, onGround: false };
        let platforms = [];
        let triggers = [];
        let effects = [];
        let causalLinks = [];
        
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            initLevel();
        }
        
        function initLevel() {
            player.x = 50;
            player.y = canvas.height - 100;
            player.vx = 0;
            player.vy = 0;
            
            platforms = [];
            triggers = [];
            effects = [];
            causalLinks = [];
            
            const platformCount = 4 + level;
            for (let i = 0; i < platformCount; i++) {
                platforms.push({
                    x: 100 + i * 120,
                    y: 150 + Math.random() * 200,
                    width: 80 + Math.random() * 40,
                    height: 15,
                    color: '#4ecdc4',
                    active: true
                });
            }
            
            platforms.push({ x: 0, y: canvas.height - 20, width: canvas.width, height: 20, color: '#4a5568', active: true });
            
            const triggerCount = 2 + level;
            for (let i = 0; i < triggerCount; i++) {
                triggers.push({
                    x: 150 + i * 180,
                    y: canvas.height - 50,
                    width: 40,
                    height: 30,
                    color: '#ffa502',
                    activated: false,
                    id: i
                });
            }
            
            for (let i = 0; i < triggerCount; i++) {
                effects.push({
                    type: Math.random() > 0.5 ? 'platform' : 'bridge',
                    x: 200 + i * 150,
                    y: 100 + (i % 2) * 200,
                    width: 60,
                    height: 15,
                    active: false,
                    triggerId: i,
                    color: '#48c78e'
                });
                
                causalLinks.push({
                    from: triggers[i],
                    to: effects[i],
                    active: false
                });
            }
        }
        
        function activateTrigger(id) {
            triggers[id].activated = true;
            
            causalLinks.forEach(link => {
                if (link.from.id === id) {
                    link.active = true;
                    link.to.active = true;
                }
            });
            
            score += 100;
            
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x: triggers[id].x + triggers[id].width / 2,
                    y: triggers[id].y,
                    vx: (Math.random() - 0.5) * 5,
                    vy: -Math.random() * 5,
                    life: 1,
                    color: '#ffa502'
                });
            }
        }
        
        function updatePlayer() {
            player.vx *= 0.95;
            player.vy += 0.5;
            
            let onGround = false;
            
            [...platforms, ...effects].forEach(obj => {
                if (!obj.active) return;
                
                if (player.y + player.height > obj.y &&
                    player.y + player.height < obj.y + obj.height + 10 &&
                    player.x < obj.x + obj.width &&
                    player.x + player.width > obj.x &&
                    player.vy >= 0) {
                    player.y = obj.y - player.height;
                    player.vy = 0;
                    onGround = true;
                }
            });
            
            player.onGround = onGround;
            
            player.x += player.vx;
            player.y += player.vy;
            
            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
        }
        
        function checkCollisions() {
            triggers.forEach(trigger => {
                if (!trigger.activated) {
                    if (player.x < trigger.x + trigger.width &&
                        player.x + player.width > trigger.x &&
                        player.y < trigger.y + trigger.height &&
                        player.y + player.height > trigger.y) {
                        activateTrigger(trigger.id);
                    }
                }
            });
            
            if (player.x > canvas.width - 50) {
                level++;
                score += level * 1000;
                initLevel();
            }
            
            if (player.y > canvas.height + 100) {
                initLevel();
            }
            
            updateStats();
        }
        
        function updateParticles() {
            particles = particles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;
                return p.life > 0;
            });
        }
        
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 背景
            const gradient = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, 0, canvas.width / 2, canvas.height / 2, canvas.width);
            gradient.addColorStop(0, '#1a1a2e');
            gradient.addColorStop(1, '#0f0c29');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 因果链
            causalLinks.forEach(link => {
                if (link.active) {
                    ctx.strokeStyle = '#ffa502';
                    ctx.shadowColor = '#ffa502';
                    ctx.shadowBlur = 10;
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(link.from.x + link.from.width / 2, link.from.y);
                    ctx.lineTo(link.to.x + link.to.width / 2, link.to.y + link.to.height);
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                    
                    // 箭头
                    const dx = link.to.x - link.from.x;
                    const dy = link.to.y - link.from.y;
                    const angle = Math.atan2(dy, dx);
                    ctx.fillStyle = '#ffa502';
                    ctx.beginPath();
                    ctx.moveTo(link.to.x + link.to.width / 2, link.to.y + link.to.height);
                    ctx.lineTo(link.to.x + link.to.width / 2 - Math.cos(angle - Math.PI / 6) * 10, 
                               link.to.y + link.to.height - Math.sin(angle - Math.PI / 6) * 10);
                    ctx.lineTo(link.to.x + link.to.width / 2 - Math.cos(angle + Math.PI / 6) * 10, 
                               link.to.y + link.to.height - Math.sin(angle + Math.PI / 6) * 10);
                    ctx.closePath();
                    ctx.fill();
                }
            });
            
            // 平台
            platforms.forEach(platform => {
                ctx.fillStyle = platform.active ? platform.color : 'rgba(78, 205, 196, 0.3)';
                ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
            });
            
            // 触发器
            triggers.forEach(trigger => {
                ctx.fillStyle = trigger.activated ? '#48c78e' : trigger.color;
                ctx.fillRect(trigger.x, trigger.y, trigger.width, trigger.height);
                
                ctx.fillStyle = '#fff';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(trigger.activated ? '✓' : '🔑', trigger.x + trigger.width / 2, trigger.y + trigger.height / 2 + 4);
            });
            
            // 效果平台
            effects.forEach(effect => {
                if (effect.active) {
                    ctx.fillStyle = effect.color;
                    ctx.shadowColor = effect.color;
                    ctx.shadowBlur = 10;
                    ctx.fillRect(effect.x, effect.y, effect.width, effect.height);
                    ctx.shadowBlur = 0;
                } else {
                    ctx.strokeStyle = 'rgba(72, 199, 142, 0.3)';
                    ctx.setLineDash([5, 5]);
                    ctx.strokeRect(effect.x, effect.y, effect.width, effect.height);
                    ctx.setLineDash([]);
                }
            });
            
            // 玩家
            ctx.fillStyle = '#f5576c';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            
            // 粒子
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }
        
        let particles = [];
        
        function updateStats() {
            document.getElementById('level').textContent = level;
            document.getElementById('score').textContent = score;
            document.getElementById('highScore').textContent = GameCore.highScore.get(GAME_NAME);
            document.getElementById('causalityIndicator').textContent = '🔗 因果链: ' + causalLinks.filter(l => l.active).length;
            
            if (GameCore.highScore.set(GAME_NAME, score)) {
                GameCore.hints.show('新纪录！分数: ' + score);
            }
        }
        
        function gameLoop() {
            draw();
            
            if (gameRunning) {
                updatePlayer();
                checkCollisions();
                updateParticles();
            }
            
            updateStats();
            requestAnimationFrame(gameLoop);
        }
        
        document.addEventListener('keydown', e => {
            if (!gameRunning) return;
            
            if (e.code === 'ArrowRight' || e.code === 'KeyD') player.vx = 5;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') player.vx = -5;
            if (e.code === 'ArrowUp' || e.code === 'KeyW') {
                if (player.onGround) {
                    player.vy = -12;
                    player.onGround = false;
                }
            }
        });
        
        document.addEventListener('keyup', e => {
            if (e.code === 'ArrowRight' || e.code === 'KeyD' || e.code === 'ArrowLeft' || e.code === 'KeyA') player.vx = 0;
        });
        
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            if (!gameRunning) return;
            
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            
            if (x < canvas.width / 2) {
                player.vx = -5;
            } else {
                player.vx = 5;
            }
            
            if (player.onGround) {
                player.vy = -12;
                player.onGround = false;
            }
        }, { passive: false });
        
        canvas.addEventListener('touchend', () => {
            player.vx = 0;
        });
        
        document.getElementById('btnStart').onclick = () => {
            gameRunning = true;
            level = 1;
            score = 0;
            initLevel();
        };
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        gameLoop();
    </script>

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
</body>
