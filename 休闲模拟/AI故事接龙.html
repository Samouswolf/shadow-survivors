<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI故事接龙</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; color: #fff; }
        
        .game-container { width: 100%; flex: 1; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: #ffd700; }
        .word-count { font-size: 14px; opacity: 0.7; }
        
        .story-area { flex: 1; background: rgba(255,255,255,0.05); border-radius: 15px; padding: 20px; overflow-y: auto; margin-bottom: 15px; }
        .story-item { margin-bottom: 20px; padding: 15px; border-radius: 10px; }
        .story-item.player { background: rgba(78,205,196,0.2); border-left: 4px solid #4ecdc4; }
        .story-item.ai { background: rgba(245,87,108,0.2); border-left: 4px solid #f5576c; }
        .story-author { font-size: 12px; opacity: 0.7; margin-bottom: 5px; }
        .story-text { font-size: 16px; line-height: 1.6; }
        
        .input-area { display: flex; gap: 10px; margin-bottom: 15px; }
        #storyInput { flex: 1; padding: 15px; border: none; border-radius: 15px; font-size: 16px; background: rgba(255,255,255,0.1); color: #fff; }
        #storyInput::placeholder { color: rgba(255,255,255,0.4); }
        
        .btn { padding: 15px 30px; border: none; border-radius: 15px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; }
        .btn-secondary { background: rgba(255,255,255,0.2); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }
    /* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}

/* [BATCH-FIX:ad-components-css] */
.sponsor-btn{position:fixed;bottom:8px;left:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:2px 6px;border-radius:10px;font:10px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}

.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}

<body>
    <div class="game-container">
        <div class="header">
            <div class="title">📖 AI故事接龙</div>
            <div class="word-count">字数: <span id="wordCount">0</span></div>
        </div>
        
        <div class="story-area" id="storyArea">
            <div class="story-item ai">
                <div class="story-author">🤖 AI</div>
                <div class="story-text" id="initialStory">很久很久以前，在一个遥远的星球上，住着一位年轻的探险家...</div>
            </div>
        </div>
        
        <div class="input-area">
            <input type="text" id="storyInput" placeholder="输入你的故事续接..." maxlength="50">
            <button class="btn btn-primary" onclick="submitStory()">发送</button>
            <button class="btn btn-secondary" onclick="resetStory()">重新开始</button>
        </div>
    </div>
    
    

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <script>
        const GAME_NAME = 'AI故事接龙';
        GameCore.init({ highScore: GAME_NAME });
        
        let story = ['很久很久以前，在一个遥远的星球上，住着一位年轻的探险家...'];
        let wordCount = 0;
        
        const aiTemplates = [
            '突然，{noun}出现在{noun}面前，让{noun}感到非常{noun}...',
            '{noun}决定{noun}，但是{noun}却{noun}...',
            '就在{noun}准备{noun}的时候，{noun}发生了{noun}...',
            '{noun}发现了{noun}，这让{noun}开始{noun}...',
            '经过{noun}之后，{noun}终于{noun}，{noun}...'
        ];
        
        const nouns = [
            '神秘的门', '发光的宝石', '会说话的猫', '古老的书籍', '魔法药水',
            '时间机器', '星际飞船', '隐形的城堡', '会飞的地毯', '彩虹独角兽',
            '黑暗森林', '水晶洞穴', '智慧树', '星星碎片', '月光宝盒',
            '探险者', '魔法师', '骑士', '精灵', '机器人',
            '惊讶', '兴奋', '恐惧', '好奇', '惊喜',
            '出发', '探索', '发现', '创造', '拯救'
        ];
        
        function generateAIResponse(userInput) {
            const template = aiTemplates[Math.floor(Math.random() * aiTemplates.length)];
            let response = template;
            
            const usedNouns = new Set();
            
            while (response.includes('{noun}')) {
                let randomNoun;
                do {
                    randomNoun = nouns[Math.floor(Math.random() * nouns.length)];
                } while (usedNouns.has(randomNoun));
                
                usedNouns.add(randomNoun);
                response = response.replace('{noun}', randomNoun);
            }
            
            const themes = extractThemes(userInput);
            if (themes.length > 0 && Math.random() < 0.5) {
                const theme = themes[Math.floor(Math.random() * themes.length)];
                response = response.replace('星球', theme)
                                  .replace('探险家', theme + '勇士');
            }
            
            return response;
        }
        
        function extractThemes(text) {
            const themeKeywords = [
                '冒险', '魔法', '太空', '森林', '海洋', '城堡', '王国', '宝藏',
                '时间', '未来', '过去', '魔法', '神秘', '奇幻', '科幻', '童话'
            ];
            
            return themeKeywords.filter(kw => text.includes(kw));
        }
        
        function addStoryItem(text, isPlayer) {
            const storyArea = document.getElementById('storyArea');
            const item = document.createElement('div');
            item.className = `story-item ${isPlayer ? 'player' : 'ai'}`;
            
            item.innerHTML = `
                <div class="story-author">${isPlayer ? '👤 玩家' : '🤖 AI'}</div>
                <div class="story-text">${text}</div>
            `;
            
            storyArea.appendChild(item);
            storyArea.scrollTop = storyArea.scrollHeight;
            
            story.push(text);
            wordCount += text.length;
            document.getElementById('wordCount').textContent = wordCount;
            
            if (GameCore.highScore.set(GAME_NAME, wordCount)) {
                GameCore.hints.show('新纪录！故事长度: ' + wordCount + '字');
            }
        }
        
        function submitStory() {
            const input = document.getElementById('storyInput');
            const text = input.value.trim();
            
            if (!text) return;
            
            addStoryItem(text, true);
            input.value = '';
            
            setTimeout(() => {
                const aiResponse = generateAIResponse(text);
                addStoryItem(aiResponse, false);
            }, 1000);
        }
        
        function resetStory() {
            const storyArea = document.getElementById('storyArea');
            storyArea.innerHTML = `
                <div class="story-item ai">
                    <div class="story-author">🤖 AI</div>
                    <div class="story-text">很久很久以前，在一个遥远的星球上，住着一位年轻的探险家...</div>
                </div>
            `;
            
            story = ['很久很久以前，在一个遥远的星球上，住着一位年轻的探险家...'];
            wordCount = 0;
            document.getElementById('wordCount').textContent = wordCount;
        }
        
        document.getElementById('storyInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') {
                submitStory();
            }
        });
        
        GameCore.touch.enableAllButtons();
    </script>
<!-- [BATCH-FIX:responsive-js] -->
<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>
<!-- [/BATCH-FIX:responsive-js] -->
<!-- [BATCH-FIX:touch-support] -->
<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>
<!-- [/BATCH-FIX:touch-support] -->

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
