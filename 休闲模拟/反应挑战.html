<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>反应挑战</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; color: #fff; }
        
        .game-container { width: 100%; flex: 1; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: #ffd700; }
        .score { font-size: 20px; color: #4ecdc4; }
        
        .game-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        
        .start-screen { text-align: center; }
        .start-btn { padding: 30px 60px; font-size: 24px; font-weight: bold; background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; border: none; border-radius: 20px; cursor: pointer; }
        
        .reaction-area { width: 300px; height: 300px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; transition: all 0.2s; }
        .reaction-area.waiting { background: linear-gradient(135deg, #4ecdc4, #48c78e); }
        .reaction-area.ready { background: linear-gradient(135deg, #ffa502, #ffd700); }
        .reaction-area.clicked { background: linear-gradient(135deg, #48c78e, #4ecdc4); }
        
        .result-area { text-align: center; margin-top: 20px; }
        .reaction-time { font-size: 48px; font-weight: bold; color: #ffd700; }
        .result-text { font-size: 18px; margin-top: 10px; }
        
        .leaderboard { width: 100%; max-width: 300px; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 15px; margin-top: 20px; }
        .leaderboard-title { font-size: 14px; opacity: 0.7; margin-bottom: 10px; }
        .leaderboard-item { display: flex; justify-content: space-between; padding: 5px 0; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="title">⚡ 反应挑战</div>
            <div class="score">最高: <span id="highScore">0</span>ms</div>
        </div>
        
        <div class="game-area">
            <div class="start-screen" id="startScreen">
                <button class="start-btn" onclick="startGame()">开始测试</button>
            </div>
            
            <div class="reaction-area waiting" id="reactionArea" onclick="handleClick()">
                点击开始
            </div>
            
            <div class="result-area" id="resultArea" style="display: none;">
                <div class="reaction-time" id="reactionTime">0</div>
                <div class="result-text" id="resultText"></div>
                <button class="btn btn-primary" onclick="startGame()" style="margin-top: 20px;">再测一次</button>
            </div>
            
            <div class="leaderboard">
                <div class="leaderboard-title">最快记录</div>
                <div class="leaderboard-item">
                    <span>1. 闪电侠</span>
                    <span>150ms</span>
                </div>
                <div class="leaderboard-item">
                    <span>2. 快枪手</span>
                    <span>180ms</span>
                </div>
                <div class="leaderboard-item">
                    <span>3. 快手王</span>
                    <span>200ms</span>
                </div>
            </div>
        </div>
    </div>
    
    <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <script>
        const GAME_NAME = '反应挑战';
        GameCore.init({ highScore: GAME_NAME });
        
        let gameState = 'start';
        let startTime = 0;
        let waitTimeout = null;
        
        function initGame() {
            const highScore = GameCore.highScore.get(GAME_NAME);
            document.getElementById('highScore').textContent = highScore || '0';
        }
        
        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('resultArea').style.display = 'none';
            
            const area = document.getElementById('reactionArea');
            area.style.display = 'flex';
            area.className = 'reaction-area waiting';
            area.textContent = '等待绿色...';
            
            gameState = 'waiting';
            
            const delay = Math.random() * 3000 + 1000;
            waitTimeout = setTimeout(() => {
                area.className = 'reaction-area ready';
                area.textContent = '点击！';
                gameState = 'ready';
                startTime = Date.now();
            }, delay);
        }
        
        function handleClick() {
            const area = document.getElementById('reactionArea');
            
            if (gameState === 'waiting') {
                clearTimeout(waitTimeout);
                area.className = 'reaction-area';
                area.textContent = '太早了！';
                area.style.background = '#ff6b6b';
                
                setTimeout(() => {
                    startGame();
                }, 1000);
            } else if (gameState === 'ready') {
                const reactionTime = Date.now() - startTime;
                
                area.style.display = 'none';
                
                document.getElementById('resultArea').style.display = 'block';
                document.getElementById('reactionTime').textContent = reactionTime + 'ms';
                
                let text = '';
                if (reactionTime < 200) {
                    text = '⚡ 神级反应！';
                } else if (reactionTime < 300) {
                    text = '👍 优秀！';
                } else if (reactionTime < 400) {
                    text = '😊 一般';
                } else {
                    text = '🐢 需要练习';
                }
                
                document.getElementById('resultText').textContent = text;
                
                const currentHigh = parseInt(document.getElementById('highScore').textContent) || 9999;
                if (reactionTime < currentHigh) {
                    document.getElementById('highScore').textContent = reactionTime;
                    GameCore.highScore.set(GAME_NAME, reactionTime);
                    GameCore.hints.show('🎉 新纪录！');
                }
                
                gameState = 'result';
            }
        }
        
        initGame();
        GameCore.touch.enableAllButtons();
    </script>
</body>
</html>
