<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>节奏舞者</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; color: #fff; overflow: hidden; }
        
        .game-container { width: 100%; flex: 1; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: #fff; }
        .stats { display: flex; gap: 20px; font-size: 14px; }
        
        .main-area { flex: 1; background: rgba(0,0,0,0.5); border-radius: 15px; overflow: hidden; position: relative; }
        
        .stage { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); font-size: 64px; animation: dance 0.5s infinite; }
        
        @keyframes dance {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-20px); }
        }
        
        .arrows { position: absolute; bottom: 20px; left: 0; right: 0; display: flex; justify-content: center; gap: 20px; }
        
        .arrow-key { width: 60px; height: 60px; background: rgba(255,255,255,0.2); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .arrow-key.active { background: #4ecdc4; }
        
        .score-display { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); font-size: 48px; font-weight: bold; color: #ffd700; }
        
        .combo-display { position: absolute; top: 80px; left: 50%; transform: translateX(-50%); font-size: 24px; color: #4ecdc4; }
        
        .actions { display: flex; gap: 10px; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; }
        
        .action-btn { flex: 1; padding: 20px; border: none; border-radius: 10px; font-size: 20px; cursor: pointer; background: rgba(255,255,255,0.2); color: #fff; }
        .action-btn:active { background: rgba(255,255,255,0.4); }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="title">💃 节奏舞者</div>
            <div class="stats">
                <span>⏱️ 时间: <span id="time">60</span></span>
                <span>⭐ 完美: <span id="perfect">0</span></span>
                <span>✅ 连击: <span id="combo">0</span></span>
            </div>
        </div>
        
        <div class="main-area">
            <div class="score-display" id="score">0</div>
            <div class="combo-display" id="comboText">COMBO: 0</div>
            
            <div class="stage" id="dancer">💃</div>
            
            <div class="arrows">
                <div class="arrow-key" id="arrowUp">⬆️</div>
                <div class="arrow-key" id="arrowLeft">⬅️</div>
                <div class="arrow-key" id="arrowDown">⬇️</div>
                <div class="arrow-key" id="arrowRight">➡️</div>
            </div>
        </div>
        
        <div class="actions">
            <button class="action-btn" id="btnUp" onclick="hitArrow('up')">⬆️</button>
            <button class="action-btn" id="btnLeft" onclick="hitArrow('left')">⬅️</button>
            <button class="action-btn" id="btnDown" onclick="hitArrow('down')">⬇️</button>
            <button class="action-btn" id="btnRight" onclick="hitArrow('right')">➡️</button>
        </div>
    </div>
    
    <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <script>
        const GAME_NAME = '节奏舞者';
        GameCore.init({ highScore: GAME_NAME });
        
        let score = 0;
        let combo = 0;
        let perfect = 0;
        let timeLeft = 60;
        let gameRunning = true;
        let currentArrow = null;
        
        const arrows = ['up', 'left', 'down', 'right'];
        const arrowEmojis = { up: '⬆️', left: '⬅️', down: '⬇️', right: '➡️' };
        
        function initGame() {
            updateUI();
            gameLoop();
            spawnArrow();
            startTimer();
        }
        
        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('time').textContent = timeLeft;
            document.getElementById('perfect').textContent = perfect;
            document.getElementById('combo').textContent = combo;
            document.getElementById('comboText').textContent = `COMBO: ${combo}`;
            
            GameCore.highScore.set(GAME_NAME, score);
        }
        
        function spawnArrow() {
            if (!gameRunning) return;
            
            currentArrow = arrows[Math.floor(Math.random() * 4)];
            
            document.querySelectorAll('.arrow-key').forEach(key => key.classList.remove('active'));
            document.getElementById(`arrow${currentArrow.charAt(0).toUpperCase() + currentArrow.slice(1)}`).classList.add('active');
            
            setTimeout(() => {
                if (gameRunning && currentArrow) {
                    combo = 0;
                    GameCore.hints.show('MISS');
                    updateUI();
                    currentArrow = null;
                    document.querySelectorAll('.arrow-key').forEach(key => key.classList.remove('active'));
                    spawnArrow();
                }
            }, 1000);
        }
        
        function startTimer() {
            const timer = setInterval(() => {
                timeLeft--;
                updateUI();
                
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    gameOver();
                }
            }, 1000);
        }
        
        function hitArrow(direction) {
            if (!gameRunning) return;
            
            if (currentArrow === direction) {
                score += 100 * (combo + 1);
                combo++;
                perfect++;
                GameCore.hints.show('PERFECT!');
                
                currentArrow = null;
                document.querySelectorAll('.arrow-key').forEach(key => key.classList.remove('active'));
                
                const dancer = document.getElementById('dancer');
                dancer.style.fontSize = '80px';
                setTimeout(() => dancer.style.fontSize = '64px', 100);
                
                setTimeout(spawnArrow, 300);
            } else {
                combo = 0;
                GameCore.hints.show('WRONG!');
            }
            
            updateUI();
            
            const btn = document.getElementById(`btn${direction.charAt(0).toUpperCase() + direction.slice(1)}`);
            btn.style.background = 'rgba(255,255,255,0.4)';
            setTimeout(() => btn.style.background = 'rgba(255,255,255,0.2)', 100);
        }
        
        function gameLoop() {
            if (gameRunning) {
                requestAnimationFrame(gameLoop);
            }
        }
        
        function gameOver() {
            gameRunning = false;
            GameCore.hints.show(`游戏结束！最终得分: ${score}`);
        }
        
        document.addEventListener('keydown', (e) => {
            const keyMap = { 'ArrowUp': 'up', 'ArrowLeft': 'left', 'ArrowDown': 'down', 'ArrowRight': 'right' };
            if (keyMap[e.key]) {
                hitArrow(keyMap[e.key]);
            }
        });
        
        initGame();
        GameCore.touch.enableAllButtons();
    </script>
</body>
</html>
