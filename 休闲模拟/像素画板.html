<body>

    <button id="start-game-btn" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:20px 40px;font-size:20px;background:#f5576c;color:white;border:none;border-radius:12px;cursor:pointer;z-index:999;font-weight:bold;">开始游戏</button>


    <div class="game-guide" style="margin-bottom:15px;padding:10px;background:#fff3f3;border-radius:8px;border:1px solid #ffcccc;">
        <div style="font-weight:bold;color:#f5576c;margin-bottom:5px;">🎮 操作说明</div>

    </div>

<canvas id="cv"></canvas>

  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;

<script>
/* [STORAGE-POLYFILL v1] */
;(function(){
  var G = (typeof window !== 'undefined') ? window : (typeof globalThis !== 'undefined' ? globalThis : this);
  // 浏览器已有 Storage 构造函数，需确保其带 load/save/remove 静态方法
  var S = G.Storage;
  var needAttach = (typeof S === 'undefined' || typeof S.load !== 'function' || typeof S.save !== 'function');
  if (!needAttach) return;
  if (typeof S === 'undefined') { S = function(){}; G.Storage = S; }
  function parseSafe(s, d){
    if (s === null || s === undefined) return d;
    try { return JSON.parse(s); } catch(e) { try { return s; } catch(e2){ return d; } }
  }
  S.load = function(k, d){ try { return parseSafe(localStorage.getItem(k), d); } catch(e){ return d; } };
  S.save = function(k, v){ try { localStorage.setItem(k, typeof v==='string'?v:JSON.stringify(v)); } catch(e){} };
  S.remove = function(k){ try { localStorage.removeItem(k); } catch(e){} };
})();

(function(){
"use strict";

/* ====== CONFIG ====== */
const CANVAS_W = 800, CANVAS_H = 600;
const GRID_SIZE = 32;           // 32x32 pixel grid
const PIXEL_SIZE = 14;          // each pixel on canvas
const GRID_OFFSET_X = 20;
const GRID_OFFSET_Y = 60;
const COLORS = [
    '#000000','#ffffff','#ff0000','#00ff00','#0000ff','#ffff00',
    '#ff00ff','#00ffff','#ff8800','#8800ff','#00ff88','#ff0088',
    '#888888','#444444','#ff4444','#44ff44','#4444ff','#ffaa00',
    '#aa00ff','#00aaff','#884400','#448800','#004488','#880044',
    '#c0c0c0','#808080','#800000','#008000','#000080','#808000',
    '#800080','#008080'
];
const TOOLBAR_X = 520, TOOLBAR_Y = 60;
const TOOLBAR_W = 260, TOOLBAR_H = 520;
const PALETTE_COLS = 4;

/* ====== STATE ====== */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
cv.width = CANVAS_W; cv.height = CANVAS_H;

let state = 'menu'; // menu | play | pause | over
let grid = [];       // 32x32 array of color indices
let selectedColor = 0;
let selectedTool = 'pen'; // pen | eraser | fill | line
let undoStack = [];
let redoStack = [];
let isDrawing = false;
let lineStart = null;
let linePreview = null;
let paletteScroll = 0;
let highScore = 0;
let score = 0;
let timer = 0;
let timerInterval = null;
let brushSize = 1;
let hoverPixel = null;
let lastPixel = null;

/* ====== AUDIO ====== */
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playTone(freq, dur, type, vol) {
    if (!audioCtx) return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type || 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(vol || 0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
    } catch(e) {}
}
function sfxDraw() { playTone(800 + Math.random()*200, 0.05, 'sine', 0.08); }
function sfxErase() { playTone(300, 0.08, 'triangle', 0.1); }
function sfxFill() { playTone(600, 0.15, 'sine', 0.12); }
function sfxClick() { playTone(1000, 0.06, 'square', 0.1); }
function sfxSave() { playTone(523, 0.1, 'sine', 0.15); setTimeout(() => playTone(659, 0.1, 'sine', 0.15), 100); setTimeout(() => playTone(784, 0.15, 'sine', 0.15), 200); }
function sfxUndo() { playTone(400, 0.08, 'triangle', 0.1); }
function sfxNewGame() { playTone(440, 0.08, 'sine', 0.12); setTimeout(() => playTone(554, 0.08, 'sine', 0.12), 80); setTimeout(() => playTone(659, 0.12, 'sine', 0.12), 160); }

/* ====== INIT ====== */
function initGrid() {
    grid = [];
    for (let y = 0; y < GRID_SIZE; y++) {
        grid[y] = [];
        for (let x = 0; x < GRID_SIZE; x++) {
            grid[y][x] = 1; // white
        }
    }
}
function loadHighScore() {
    try { highScore = parseInt(localStorage.getItem('pixelart_high')) || 0; } catch(e) { highScore = 0; }
}
function saveHighScore() {
    try { localStorage.setItem('pixelart_high', highScore.toString()); } catch(e) {}
}

/* ====== UNDO/REDO ====== */
function saveState() {
    undoStack.push(JSON.stringify(grid));
    if (undoStack.length > 50) undoStack.shift();
    redoStack = [];
}
function undo() {
    if (undoStack.length === 0) return;
    redoStack.push(JSON.stringify(grid));
    grid = JSON.parse(undoStack.pop());
    sfxUndo();
}
function redo() {
    if (redoStack.length === 0) return;
    undoStack.push(JSON.stringify(grid));
    grid = JSON.parse(redoStack.pop());
    sfxUndo();
}

/* ====== FLOOD FILL ====== */
function floodFill(sx, sy, newColor) {
    const targetColor = grid[sy][sx];
    if (targetColor === newColor) return;
    const stack = [[sx, sy]];
    const visited = new Set();
    while (stack.length > 0) {
        const [x, y] = stack.pop();
        const key = y * GRID_SIZE + x;
        if (visited.has(key)) continue;
        if (x < 0 || x >= GRID_SIZE || y < 0 || y >= GRID_SIZE) continue;
        if (grid[y][x] !== targetColor) continue;
        visited.add(key);
        grid[y][x] = newColor;
        stack.push([x-1,y],[x+1,y],[x,y-1],[x,y+1]);
    }
}

/* ====== Bresenham Line ====== */
function getLinePixels(x0, y0, x1, y1) {
    const pixels = [];
    const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
    const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx - dy;
    while (true) {
        pixels.push([x0, y0]);
        if (x0 === x1 && y0 === y1) break;
        const e2 = 2 * err;
        if (e2 > -dy) { err -= dy; x0 += sx; }
        if (e2 < dx) { err += dx; y0 += sy; }
    }
    return pixels;
}

/* ====== SCORE ====== */
function calcScore() {
    let filled = 0;
    for (let y = 0; y < GRID_SIZE; y++)
        for (let x = 0; x < GRID_SIZE; x++)
            if (grid[y][x] !== 1) filled++; // not white
    score = filled;
    if (score > highScore) { highScore = score; saveHighScore(); }
}

/* ====== TIMER ====== */
function startTimer() {
    timer = 0;
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => { timer++; }, 1000);
}
function stopTimer() {
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}
function formatTime(s) {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return (m < 10 ? '0' : '') + m + ':' + (sec < 10 ? '0' : '') + sec;
}

/* ====== INPUT HELPERS ====== */
function getGridPos(mx, my) {
    const gx = Math.floor((mx - GRID_OFFSET_X) / PIXEL_SIZE);
    const gy = Math.floor((my - GRID_OFFSET_Y) / PIXEL_SIZE);
    if (gx >= 0 && gx < GRID_SIZE && gy >= 0 && gy < GRID_SIZE) return {x: gx, y: gy};
    return null;
}
function applyTool(gx, gy) {
    if (gx < 0 || gx >= GRID_SIZE || gy < 0 || gy >= GRID_SIZE) return;
    if (selectedTool === 'pen') {
        if (grid[gy][gx] !== selectedColor) {
            grid[gy][gx] = selectedColor;
            sfxDraw();
        }
    } else if (selectedTool === 'eraser') {
        if (grid[gy][gx] !== 1) {
            grid[gy][gx] = 1;
            sfxErase();
        }
    } else if (selectedTool === 'fill') {
        floodFill(gx, gy, selectedColor);
        sfxFill();
    }
}
function applyBrush(gx, gy) {
    const half = Math.floor(brushSize / 2);
    for (let dy = -half; dy <= half; dy++) {
        for (let dx = -half; dx <= half; dx++) {
            applyTool(gx + dx, gy + dy);
        }
    }
}

/* ====== BUTTONS ====== */
const buttons = [];
function addButton(x, y, w, h, text, action, color) {
    buttons.push({x, y, w, h, text, action, color: color || '#4a90d9', hover: false});
}
function clearButtons() { buttons.length = 0; }

function initMenuButtons() {
    clearButtons();
    const cx = CANVAS_W / 2;
    addButton(cx - 100, 300, 200, 50, '开始创作', () => { startGame(); }, '#4a90d9');
    addButton(cx - 100, 370, 200, 50, '清除画布', () => { initGrid(); sfxClick(); }, '#e67e22');
}
function initGameButtons() {
    clearButtons();
    const tx = TOOLBAR_X, ty = TOOLBAR_Y;
    // Tool buttons
    addButton(tx, ty, 60, 30, '画笔', () => { selectedTool = 'pen'; sfxClick(); }, selectedTool === 'pen' ? '#2ecc71' : '#555');
    addButton(tx + 65, ty, 60, 30, '橡皮', () => { selectedTool = 'eraser'; sfxClick(); }, selectedTool === 'eraser' ? '#2ecc71' : '#555');
    addButton(tx + 130, ty, 60, 30, '填充', () => { selectedTool = 'fill'; sfxClick(); }, selectedTool === 'fill' ? '#2ecc71' : '#555');
    addButton(tx, ty + 35, 60, 30, '直线', () => { selectedTool = 'line'; sfxClick(); }, selectedTool === 'line' ? '#2ecc71' : '#555');
    // Brush size
    addButton(tx + 70, ty + 35, 30, 30, '1', () => { brushSize = 1; sfxClick(); }, brushSize === 1 ? '#3498db' : '#555');
    addButton(tx + 105, ty + 35, 30, 30, '2', () => { brushSize = 2; sfxClick(); }, brushSize === 2 ? '#3498db' : '#555');
    addButton(tx + 140, ty + 35, 30, 30, '3', () => { brushSize = 3; sfxClick(); }, brushSize === 3 ? '#3498db' : '#555');
    // Action buttons
    addButton(tx, ty + 420, 80, 35, '撤销', () => { undo(); }, '#e67e22');
    addButton(tx + 85, ty + 420, 80, 35, '重做', () => { redo(); }, '#e67e22');
    addButton(tx, ty + 460, 80, 35, '保存', () => { saveImage(); }, '#27ae60');
    addButton(tx + 85, ty + 460, 80, 35, '清除', () => { saveState(); initGrid(); sfxClick(); }, '#e74c3c');
    addButton(tx + 170, ty + 460, 80, 35, '暂停', () => { pauseGame(); }, '#8e44ad');
}
function initPauseButtons() {
    clearButtons();
    const cx = CANVAS_W / 2;
    addButton(cx - 100, 300, 200, 50, '继续创作', () => { resumeGame(); }, '#2ecc71');
    addButton(cx - 100, 370, 200, 50, '返回菜单', () => { state = 'menu'; initMenuButtons(); stopTimer(); }, '#e74c3c');
}

/* ====== SAVE IMAGE ====== */
function saveImage() {
    calcScore();
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = GRID_SIZE * 8;
    tempCanvas.height = GRID_SIZE * 8;
    const tctx = tempCanvas.getContext('2d');
    for (let y = 0; y < GRID_SIZE; y++) {
        for (let x = 0; x < GRID_SIZE; x++) {
            tctx.fillStyle = COLORS[grid[y][x]];
            tctx.fillRect(x * 8, y * 8, 8, 8);
        }
    }
    const link = document.createElement('a');
    link.download = 'pixel-art-' + Date.now() + '.png';
    link.href = tempCanvas.toDataURL('image/png');
    link.click();
    sfxSave();
}

/* ====== GAME FLOW ====== */
function startGame() {
    initAudio();
    initGrid();
    score = 0;
    undoStack = [];
    redoStack = [];
    selectedColor = 0;
    selectedTool = 'pen';
    brushSize = 1;
    lineStart = null;
    linePreview = null;
    state = 'play';
    startTimer();
    initGameButtons();
    sfxNewGame();
}
function pauseGame() {
    if (state !== 'play') return;
    state = 'pause';
    stopTimer();
    initPauseButtons();
    sfxClick();
}
function resumeGame() {
    state = 'play';
    startTimer();
    initGameButtons();
    sfxClick();
}

/* ====== RENDER ====== */
function drawMenu() {
    // Background
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    // Title
    ctx.fillStyle = '#e94560';
    ctx.font = 'bold 48px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('像素画板', CANVAS_W / 2, 120);
    // Subtitle
    ctx.fillStyle = '#aaa';
    ctx.font = '18px sans-serif';
    ctx.fillText('32x32 像素艺术创作工具', CANVAS_W / 2, 160);
    // Preview pixels
    const previewColors = [0, 2, 3, 4, 5, 6, 7, 8];
    for (let i = 0; i < 8; i++) {
        ctx.fillStyle = COLORS[previewColors[i]];
        const px = CANVAS_W / 2 - 80 + i * 22;
        ctx.fillRect(px, 200, 18, 18);
    }
    // High score
    ctx.fillStyle = '#f1c40f';
    ctx.font = '16px sans-serif';
    ctx.fillText('最高填充: ' + highScore + ' 像素', CANVAS_W / 2, 260);
    // Buttons
    drawButtons();
}
function drawGrid() {
    // Grid background
    ctx.fillStyle = '#2c2c54';
    ctx.fillRect(GRID_OFFSET_X - 2, GRID_OFFSET_Y - 2, GRID_SIZE * PIXEL_SIZE + 4, GRID_SIZE * PIXEL_SIZE + 4);
    // Pixels
    for (let y = 0; y < GRID_SIZE; y++) {
        for (let x = 0; x < GRID_SIZE; x++) {
            ctx.fillStyle = COLORS[grid[y][x]];
            ctx.fillRect(GRID_OFFSET_X + x * PIXEL_SIZE, GRID_OFFSET_Y + y * PIXEL_SIZE, PIXEL_SIZE - 1, PIXEL_SIZE - 1);
        }
    }
    // Grid lines (subtle)
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 0.5;
    for (let i = 0; i <= GRID_SIZE; i++) {
        ctx.beginPath();
        ctx.moveTo(GRID_OFFSET_X + i * PIXEL_SIZE, GRID_OFFSET_Y);
        ctx.lineTo(GRID_OFFSET_X + i * PIXEL_SIZE, GRID_OFFSET_Y + GRID_SIZE * PIXEL_SIZE);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(GRID_OFFSET_X, GRID_OFFSET_Y + i * PIXEL_SIZE);
        ctx.lineTo(GRID_OFFSET_X + GRID_SIZE * PIXEL_SIZE, GRID_OFFSET_Y + i * PIXEL_SIZE);
        ctx.stroke();
    }
    // Line preview
    if (selectedTool === 'line' && lineStart && linePreview) {
        const pixels = getLinePixels(lineStart.x, lineStart.y, linePreview.x, linePreview.y);
        ctx.fillStyle = COLORS[selectedColor] + '80';
        pixels.forEach(([px, py]) => {
            ctx.fillRect(GRID_OFFSET_X + px * PIXEL_SIZE, GRID_OFFSET_Y + py * PIXEL_SIZE, PIXEL_SIZE - 1, PIXEL_SIZE - 1);
        });
    }
    // Hover highlight
    if (hoverPixel && state === 'play') {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        const half = Math.floor(brushSize / 2);
        const hx = GRID_OFFSET_X + (hoverPixel.x - half) * PIXEL_SIZE;
        const hy = GRID_OFFSET_Y + (hoverPixel.y - half) * PIXEL_SIZE;
        const hs = (brushSize * PIXEL_SIZE);
        ctx.strokeRect(hx, hy, hs, hs);
    }
}
function drawToolbar() {
    // Toolbar background
    ctx.fillStyle = '#16213e';
    ctx.fillRect(TOOLBAR_X - 5, TOOLBAR_Y - 5, TOOLBAR_W + 10, TOOLBAR_H + 10);
    ctx.strokeStyle = '#0f3460';
    ctx.lineWidth = 2;
    ctx.strokeRect(TOOLBAR_X - 5, TOOLBAR_Y - 5, TOOLBAR_W + 10, TOOLBAR_H + 10);
    // Color palette
    ctx.fillStyle = '#aaa';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('颜色:', TOOLBAR_X, TOOLBAR_Y + 100);
    const palY = TOOLBAR_Y + 110;
    const cellSize = 22;
    const cols = PALETTE_COLS;
    const visibleRows = 8;
    for (let i = 0; i < COLORS.length; i++) {
        const row = Math.floor(i / cols) - paletteScroll;
        if (row < 0 || row >= visibleRows) continue;
        const col = i % cols;
        const px = TOOLBAR_X + col * (cellSize + 4);
        const py = palY + row * (cellSize + 4);
        // Color swatch
        ctx.fillStyle = COLORS[i];
        ctx.fillRect(px, py, cellSize, cellSize);
        // Border
        if (i === selectedColor) {
            ctx.strokeStyle = '#f1c40f';
            ctx.lineWidth = 3;
            ctx.strokeRect(px - 1, py - 1, cellSize + 2, cellSize + 2);
        } else {
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 1;
            ctx.strokeRect(px, py, cellSize, cellSize);
        }
    }
    // Palette scroll arrows
    ctx.fillStyle = '#aaa';
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'center';
    const maxScroll = Math.ceil(COLORS.length / cols) - visibleRows;
    if (paletteScroll > 0) ctx.fillText('▲', TOOLBAR_X + 50, palY - 5);
    if (paletteScroll < maxScroll) ctx.fillText('▼', TOOLBAR_X + 50, palY + visibleRows * (cellSize + 4) + 12);
    // Current color display
    ctx.fillStyle = '#aaa';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('当前:', TOOLBAR_X, TOOLBAR_Y + 80);
    ctx.fillStyle = COLORS[selectedColor];
    ctx.fillRect(TOOLBAR_X + 40, TOOLBAR_Y + 68, 24, 24);
    ctx.strokeStyle = '#f1c40f';
    ctx.lineWidth = 2;
    ctx.strokeRect(TOOLBAR_X + 40, TOOLBAR_Y + 68, 24, 24);
    // Buttons
    drawButtons();
}
function drawPlay() {
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    // Top bar
    ctx.fillStyle = '#16213e';
    ctx.fillRect(0, 0, CANVAS_W, 50);
    ctx.fillStyle = '#e94560';
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('像素画板', 15, 33);
    // Score & timer
    calcScore();
    ctx.fillStyle = '#f1c40f';
    ctx.font = '16px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('填充: ' + score + ' | 时间: ' + formatTime(timer) + ' | 最高: ' + highScore, CANVAS_W - 15, 33);
    // Draw components
    drawGrid();
    drawToolbar();
}
function drawPause() {
    drawPlay();
    // Overlay
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    ctx.fillStyle = '#e94560';
    ctx.font = 'bold 40px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('暂停', CANVAS_W / 2, 220);
    ctx.fillStyle = '#aaa';
    ctx.font = '16px sans-serif';
    ctx.fillText('按 ESC 或 P 继续', CANVAS_W / 2, 260);
    drawButtons();
}
function drawButtons() {
    buttons.forEach(b => {
        ctx.fillStyle = b.hover ? '#5a9de0' : b.color;
        roundRect(ctx, b.x, b.y, b.w, b.h, 6);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 14px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(b.text, b.x + b.w / 2, b.y + b.h / 2);
        ctx.textBaseline = 'alphabetic';
    });
}
function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

/* ====== INPUT ====== */
function getCanvasPos(e) {
    const rect = cv.getBoundingClientRect();
    const scaleX = CANVAS_W / rect.width;
    const scaleY = CANVAS_H / rect.height;
    let cx, cy;
    if (e.touches) {
        cx = (e.touches[0].clientX - rect.left) * scaleX;
        cy = (e.touches[0].clientY - rect.top) * scaleY;
    } else {
        cx = (e.clientX - rect.left) * scaleX;
        cy = (e.clientY - rect.top) * scaleY;
    }
    return {x: cx, y: cy};
}
function handleClick(cx, cy) {
    // Check buttons
    for (const b of buttons) {
        if (cx >= b.x && cx <= b.x + b.w && cy >= b.y && cy <= b.y + b.h) {
            b.action();
            return;
        }
    }
    // Check palette
    if (state === 'play') {
        const palY = TOOLBAR_Y + 110;
        const cellSize = 22;
        for (let i = 0; i < COLORS.length; i++) {
            const row = Math.floor(i / PALETTE_COLS) - paletteScroll;
            const col = i % PALETTE_COLS;
            const px = TOOLBAR_X + col * (cellSize + 4);
            const py = palY + row * (cellSize + 4);
            if (cx >= px && cx <= px + cellSize && cy >= py && cy <= py + cellSize) {
                selectedColor = i;
                sfxClick();
                initGameButtons();
                return;
            }
        }
        // Check palette scroll
        const maxScroll = Math.ceil(COLORS.length / PALETTE_COLS) - 8;
        if (cx >= TOOLBAR_X + 30 && cx <= TOOLBAR_X + 70) {
            if (cy >= palY - 18 && cy <= palY - 2 && paletteScroll > 0) { paletteScroll--; sfxClick(); return; }
            if (cy >= palY + 8 * (cellSize + 4) + 2 && cy <= palY + 8 * (cellSize + 4) + 18 && paletteScroll < maxScroll) { paletteScroll++; sfxClick(); return; }
        }
        // Check grid
        const gp = getGridPos(cx, cy);
        if (gp) {
            if (selectedTool === 'line') {
                if (!lineStart) {
                    lineStart = gp;
                    saveState();
                } else {
                    const pixels = getLinePixels(lineStart.x, lineStart.y, gp.x, gp.y);
                    saveState();
                    pixels.forEach(([px, py]) => { if (px >= 0 && px < GRID_SIZE && py >= 0 && py < GRID_SIZE) grid[py][px] = selectedColor; });
                    lineStart = null;
                    linePreview = null;
                    sfxDraw();
                }
            } else if (selectedTool === 'fill') {
                saveState();
                applyTool(gp.x, gp.y);
            }
        }
    }
}
function handleMouseDown(e) {
    e.preventDefault();
    initAudio();
    const pos = getCanvasPos(e);
    handleClick(pos.x, pos.y);
    if (state === 'play' && selectedTool !== 'line' && selectedTool !== 'fill') {
        const gp = getGridPos(pos.x, pos.y);
        if (gp) {
            isDrawing = true;
            saveState();
            applyBrush(gp.x, gp.y);
            lastPixel = gp;
        }
    }
}
function handleMouseMove(e) {
    e.preventDefault();
    const pos = getCanvasPos(e);
    // Update hover
    buttons.forEach(b => { b.hover = pos.x >= b.x && pos.x <= b.x + b.w && pos.y >= b.y && pos.y <= b.y + b.h; });
    if (state === 'play') {
        const gp = getGridPos(pos.x, pos.y);
        hoverPixel = gp;
        if (isDrawing && gp && selectedTool !== 'line' && selectedTool !== 'fill') {
            // Draw line from last pixel for smooth strokes
            if (lastPixel) {
                const pixels = getLinePixels(lastPixel.x, lastPixel.y, gp.x, gp.y);
                pixels.forEach(([px, py]) => applyBrush(px, py));
            } else {
                applyBrush(gp.x, gp.y);
            }
            lastPixel = gp;
        }
        if (selectedTool === 'line' && lineStart && gp) {
            linePreview = gp;
        }
    }
}
function handleMouseUp(e) {
    e.preventDefault();
    isDrawing = false;
    lastPixel = null;
}

/* Keyboard */
function handleKey(e) {
    initAudio();
    const key = e.key.toLowerCase();
    if (state === 'menu') {
        if (key === 'enter' || key === ' ') { startGame(); e.preventDefault(); }
    } else if (state === 'play') {
        if (key === 'escape' || key === 'p') { pauseGame(); e.preventDefault(); }
        else if (key === 'z' && e.ctrlKey) { undo(); e.preventDefault(); }
        else if (key === 'y' && e.ctrlKey) { redo(); e.preventDefault(); }
        else if (key === 's' && e.ctrlKey) { saveImage(); e.preventDefault(); }
        else if (key === '1') { selectedTool = 'pen'; initGameButtons(); sfxClick(); }
        else if (key === '2') { selectedTool = 'eraser'; initGameButtons(); sfxClick(); }
        else if (key === '3') { selectedTool = 'fill'; initGameButtons(); sfxClick(); }
        else if (key === '4') { selectedTool = 'line'; initGameButtons(); sfxClick(); lineStart = null; linePreview = null; }
        else if (key === '+' || key === '=') { brushSize = Math.min(3, brushSize + 1); initGameButtons(); sfxClick(); }
        else if (key === '-') { brushSize = Math.max(1, brushSize - 1); initGameButtons(); sfxClick(); }
    } else if (state === 'pause') {
        if (key === 'escape' || key === 'p') { resumeGame(); e.preventDefault(); }
    }
}

/* ====== EVENT BINDING ====== */
cv.addEventListener('mousedown', handleMouseDown);
cv.addEventListener('mousemove', handleMouseMove);
cv.addEventListener('mouseup', handleMouseUp);
cv.addEventListener('mouseleave', handleMouseUp);
cv.addEventListener('touchstart', handleMouseDown, {passive: false});
cv.addEventListener('touchmove', handleMouseMove, {passive: false});
cv.addEventListener('touchend', handleMouseUp, {passive: false});
document.addEventListener('keydown', handleKey);

/* Prevent context menu */
cv.addEventListener('contextmenu', e => e.preventDefault());

/* ====== GAME LOOP ====== */
function resizeCanvas() {
    const ratio = CANVAS_W / CANVAS_H;
    let w = window.innerWidth, h = window.innerHeight;
    if (w / h > ratio) { w = h * ratio; } else { h = w / ratio; }
    cv.style.width = w + 'px';
    cv.style.height = h + 'px';
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

loadHighScore();
initMenuButtons();

function gameLoop() {
    if (state === 'menu') drawMenu();
    else if (state === 'play') drawPlay();
    else if (state === 'pause') drawPause();
    requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);
