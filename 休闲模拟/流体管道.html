<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>流体管道</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(180deg, #0c1929 0%, #1a1a2e 50%, #16213e 100%); min-height: 100vh; overflow: hidden; color: #fff; }
        .game-container { width: 100%; height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 10px; }
        .stat { display: flex; flex-direction: column; align-items: center; }
        .stat-label { font-size: 12px; opacity: 0.7; }
        .stat-value { font-size: 24px; font-weight: bold; color: #ffd700; }
        
        .game-area { flex: 1; position: relative; background: rgba(0,0,0,0.3); border-radius: 15px; overflow: hidden; }
        #gameCanvas { width: 100%; height: 100%; display: block; }
        
        .controls { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
        .btn { padding: 12px 25px; border: none; border-radius: 25px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">关卡</div>
                <div class="stat-value" id="level">1</div>
            </div>
            <div class="stat">
                <div class="stat-label">分数</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">最高</div>
                <div class="stat-value" id="highScore">0</div>
            </div>
        </div>
        
        <div class="game-area">
            <canvas id="gameCanvas"></canvas>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" id="btnStart">▶️ 开始游戏</button>
        </div>
        
        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const GAME_NAME = '流体管道';
        GameCore.init({ highScore: GAME_NAME });
        
        let level = 1;
        let score = 0;
        let gameRunning = false;
        
        let pipes = [];
        let sources = [];
        let sinks = [];
        let particles = [];
        let gridSize = 60;
        
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            gridSize = Math.min(60, Math.floor(canvas.width / 8));
            initLevel();
        }
        
        function initLevel() {
            pipes = [];
            sources = [];
            sinks = [];
            particles = [];
            
            const cols = Math.floor(canvas.width / gridSize);
            const rows = Math.floor(canvas.height / gridSize);
            
            sources.push({
                x: Math.floor(1 + Math.random() * 2) * gridSize + gridSize / 2,
                y: Math.floor(rows / 2) * gridSize + gridSize / 2,
                color: '#4ecdc4'
            });
            
            sinks.push({
                x: Math.floor(cols - 3 + Math.random() * 2) * gridSize + gridSize / 2,
                y: Math.floor(rows / 2) * gridSize + gridSize / 2,
                color: '#f5576c',
                received: 0
            });
            
            const pipeCount = 5 + level * 2;
            for (let i = 0; i < pipeCount; i++) {
                const col = Math.floor(2 + Math.random() * (cols - 4));
                const row = Math.floor(1 + Math.random() * (rows - 2));
                
                let connections = [];
                const types = ['straight', 'corner', 't-junction', 'cross'];
                const type = types[Math.floor(Math.random() * Math.min(level + 1, 4))];
                
                if (type === 'straight') {
                    connections = ['top', 'bottom'];
                } else if (type === 'corner') {
                    const dirs = [['top', 'right'], ['right', 'bottom'], ['bottom', 'left'], ['left', 'top']];
                    connections = dirs[Math.floor(Math.random() * 4)];
                } else if (type === 't-junction') {
                    const dirs = [['top', 'right', 'bottom'], ['right', 'bottom', 'left'], ['bottom', 'left', 'top'], ['left', 'top', 'right']];
                    connections = dirs[Math.floor(Math.random() * 4)];
                } else {
                    connections = ['top', 'right', 'bottom', 'left'];
                }
                
                pipes.push({
                    x: col * gridSize + gridSize / 2,
                    y: row * gridSize + gridSize / 2,
                    width: gridSize - 10,
                    height: gridSize - 10,
                    type: type,
                    connections: connections,
                    rotation: 0,
                    selected: false,
                    flow: []
                });
            }
        }
        
        function rotatePipe(pipe) {
            pipe.rotation += Math.PI / 2;
            
            const newConnections = [];
            pipe.connections.forEach(conn => {
                if (conn === 'top') newConnections.push('right');
                else if (conn === 'right') newConnections.push('bottom');
                else if (conn === 'bottom') newConnections.push('left');
                else if (conn === 'left') newConnections.push('top');
            });
            pipe.connections = newConnections;
            
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x: pipe.x,
                    y: pipe.y,
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 0.5) * 5,
                    life: 1,
                    color: '#ffd700'
                });
            }
        }
        
        function getConnectedPipes(pipe) {
            const connected = [];
            
            pipe.connections.forEach(conn => {
                let checkX = pipe.x;
                let checkY = pipe.y;
                
                if (conn === 'top') checkY -= gridSize;
                else if (conn === 'right') checkX += gridSize;
                else if (conn === 'bottom') checkY += gridSize;
                else if (conn === 'left') checkX -= gridSize;
                
                pipes.forEach(other => {
                    if (other !== pipe && Math.abs(other.x - checkX) < gridSize / 2 && Math.abs(other.y - checkY) < gridSize / 2) {
                        const oppositeConn = conn === 'top' ? 'bottom' : conn === 'right' ? 'left' : conn === 'bottom' ? 'top' : 'right';
                        if (other.connections.includes(oppositeConn)) {
                            connected.push({ pipe: other, from: conn, to: oppositeConn });
                        }
                    }
                });
            });
            
            return connected;
        }
        
        function updateParticles() {
            particles = particles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.1;
                p.life -= 0.02;
                return p.life > 0;
            });
            
            sources.forEach(source => {
                if (Math.random() < 0.3) {
                    let found = false;
                    
                    pipes.forEach(pipe => {
                        const dx = pipe.x - source.x;
                        const dy = pipe.y - source.y;
                        
                        if (Math.abs(dx) < gridSize && Math.abs(dy) < gridSize) {
                            if (pipe.connections.includes('left') && dx > 0) {
                                particles.push({
                                    x: pipe.x - pipe.width / 2,
                                    y: pipe.y,
                                    vx: 1,
                                    vy: 0,
                                    life: 1,
                                    color: source.color,
                                    inPipe: pipe,
                                    progress: 0
                                });
                                found = true;
                            } else if (pipe.connections.includes('right') && dx < 0) {
                                particles.push({
                                    x: pipe.x + pipe.width / 2,
                                    y: pipe.y,
                                    vx: -1,
                                    vy: 0,
                                    life: 1,
                                    color: source.color,
                                    inPipe: pipe,
                                    progress: 0
                                });
                                found = true;
                            } else if (pipe.connections.includes('top') && dy > 0) {
                                particles.push({
                                    x: pipe.x,
                                    y: pipe.y + pipe.height / 2,
                                    vx: 0,
                                    vy: -1,
                                    life: 1,
                                    color: source.color,
                                    inPipe: pipe,
                                    progress: 0
                                });
                                found = true;
                            } else if (pipe.connections.includes('bottom') && dy < 0) {
                                particles.push({
                                    x: pipe.x,
                                    y: pipe.y - pipe.height / 2,
                                    vx: 0,
                                    vy: 1,
                                    life: 1,
                                    color: source.color,
                                    inPipe: pipe,
                                    progress: 0
                                });
                                found = true;
                            }
                        }
                    });
                }
            });
            
            particles.forEach(p => {
                if (!p.inPipe) return;
                
                p.progress += 0.02;
                
                if (p.progress >= 1) {
                    const pipe = p.inPipe;
                    const connected = getConnectedPipes(pipe);
                    
                    if (connected.length > 0) {
                        const nextPipe = connected[0].pipe;
                        p.inPipe = nextPipe;
                        p.progress = 0;
                        p.x = nextPipe.x;
                        p.y = nextPipe.y;
                    } else {
                        p.inPipe = null;
                        p.vx = (Math.random() - 0.5) * 2;
                        p.vy = (Math.random() - 0.5) * 2;
                    }
                } else {
                    if (p.vx > 0) {
                        p.x = p.inPipe.x - p.inPipe.width / 2 + p.inPipe.width * p.progress;
                    } else if (p.vx < 0) {
                        p.x = p.inPipe.x + p.inPipe.width / 2 - p.inPipe.width * p.progress;
                    } else if (p.vy > 0) {
                        p.y = p.inPipe.y - p.inPipe.height / 2 + p.inPipe.height * p.progress;
                    } else if (p.vy < 0) {
                        p.y = p.inPipe.y + p.inPipe.height / 2 - p.inPipe.height * p.progress;
                    }
                }
                
                sinks.forEach(sink => {
                    const dx = p.x - sink.x;
                    const dy = p.y - sink.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < sink.width / 2 + 5) {
                        p.life = 0;
                        sink.received++;
                        score += 10;
                        
                        for (let i = 0; i < 10; i++) {
                            particles.push({
                                x: sink.x,
                                y: sink.y,
                                vx: (Math.random() - 0.5) * 8,
                                vy: (Math.random() - 0.5) * 8,
                                life: 1,
                                color: sink.color
                            });
                        }
                    }
                });
            });
            
            sinks.forEach(sink => {
                if (sink.received >= 20 + level * 10) {
                    level++;
                    score += level * 500;
                    GameCore.hints.show('关卡完成！');
                    initLevel();
                }
            });
        }
        
        function drawPipe(pipe) {
            ctx.save();
            ctx.translate(pipe.x, pipe.y);
            ctx.rotate(pipe.rotation);
            
            ctx.strokeStyle = pipe.selected ? '#ffd700' : '#4a5568';
            ctx.lineWidth = 8;
            ctx.lineCap = 'round';
            
            const w = pipe.width / 2;
            const h = pipe.height / 2;
            
            if (pipe.type === 'straight') {
                ctx.beginPath();
                ctx.moveTo(0, -h);
                ctx.lineTo(0, h);
                ctx.stroke();
            } else if (pipe.type === 'corner') {
                ctx.beginPath();
                ctx.moveTo(0, -h);
                ctx.lineTo(0, 0);
                ctx.lineTo(w, 0);
                ctx.stroke();
            } else if (pipe.type === 't-junction') {
                ctx.beginPath();
                ctx.moveTo(0, -h);
                ctx.lineTo(0, h);
                ctx.moveTo(0, 0);
                ctx.lineTo(w, 0);
                ctx.stroke();
            } else {
                ctx.beginPath();
                ctx.moveTo(0, -h);
                ctx.lineTo(0, h);
                ctx.moveTo(-w, 0);
                ctx.lineTo(w, 0);
                ctx.stroke();
            }
            
            ctx.fillStyle = '#2d3748';
            ctx.fillRect(-w + 2, -h + 2, w * 2 - 4, h * 2 - 4);
            
            ctx.restore();
        }
        
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = 'rgba(255,255,255,0.03)';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
            
            pipes.forEach(pipe => {
                drawPipe(pipe);
            });
            
            sources.forEach(source => {
                ctx.fillStyle = source.color;
                ctx.shadowColor = source.color;
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.arc(source.x, source.y, 15, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                
                ctx.fillStyle = '#fff';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('🌀', source.x, source.y + 4);
            });
            
            sinks.forEach(sink => {
                const gradient = ctx.createRadialGradient(sink.x, sink.y, 0, sink.x, sink.y, 20);
                gradient.addColorStop(0, sink.color);
                gradient.addColorStop(1, 'rgba(0,0,0,0)');
                
                ctx.fillStyle = gradient;
                ctx.shadowColor = sink.color;
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.arc(sink.x, sink.y, 20, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                
                ctx.fillStyle = '#fff';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(`${sink.received}/${20 + level * 10}`, sink.x, sink.y + 4);
            });
            
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }
        
        function updateStats() {
            document.getElementById('level').textContent = level;
            document.getElementById('score').textContent = score;
            document.getElementById('highScore').textContent = GameCore.highScore.get(GAME_NAME);
            
            if (GameCore.highScore.set(GAME_NAME, score)) {
                GameCore.hints.show('新纪录！分数: ' + score);
            }
        }
        
        function gameLoop() {
            draw();
            
            if (gameRunning) {
                updateParticles();
            }
            
            updateStats();
            requestAnimationFrame(gameLoop);
        }
        
        canvas.addEventListener('click', e => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            pipes.forEach(pipe => {
                const dx = x - pipe.x;
                const dy = y - pipe.y;
                
                if (Math.abs(dx) < pipe.width / 2 && Math.abs(dy) < pipe.height / 2) {
                    rotatePipe(pipe);
                }
            });
        });
        
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            
            pipes.forEach(pipe => {
                const dx = x - pipe.x;
                const dy = y - pipe.y;
                
                if (Math.abs(dx) < pipe.width / 2 && Math.abs(dy) < pipe.height / 2) {
                    rotatePipe(pipe);
                }
            });
        }, { passive: false });
        
        document.getElementById('btnStart').onclick = () => {
            gameRunning = true;
            level = 1;
            score = 0;
            initLevel();
        };
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        gameLoop();
    </script>
</body>
</html>
