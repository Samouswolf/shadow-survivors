<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI猜拳</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; color: #fff; }
        
        .game-container { width: 100%; max-width: 500px; background: rgba(255,255,255,0.05); border-radius: 20px; padding: 30px; }
        
        .header { text-align: center; margin-bottom: 30px; }
        .title { font-size: 32px; font-weight: bold; color: #ffd700; margin-bottom: 10px; }
        .subtitle { font-size: 14px; opacity: 0.7; }
        
        .score-board { display: flex; justify-content: space-around; margin-bottom: 30px; }
        .player-score, .ai-score { text-align: center; }
        .score-label { font-size: 14px; opacity: 0.7; }
        .score-value { font-size: 48px; font-weight: bold; }
        .player-score .score-value { color: #4ecdc4; }
        .ai-score .score-value { color: #f5576c; }
        
        .battle-area { display: flex; justify-content: space-around; align-items: center; margin-bottom: 30px; height: 150px; }
        .hand-container { text-align: center; }
        .hand { font-size: 80px; transition: transform 0.3s; }
        .hand.player { transform: scaleX(-1); }
        .vs { font-size: 24px; color: #ffd700; font-weight: bold; }
        
        .result { text-align: center; font-size: 24px; font-weight: bold; margin-bottom: 20px; min-height: 32px; }
        .result.win { color: #48c78e; }
        .result.lose { color: #f5576c; }
        .result.draw { color: #ffd700; }
        
        .choices { display: flex; justify-content: center; gap: 20px; }
        .choice-btn { width: 80px; height: 80px; border-radius: 50%; border: none; font-size: 40px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; background: rgba(255,255,255,0.1); }
        .choice-btn:hover { transform: scale(1.1); box-shadow: 0 0 20px rgba(255,215,0,0.5); }
        .choice-btn:active { transform: scale(0.9); }
        
        .ai-status { text-align: center; margin-top: 20px; font-size: 12px; opacity: 0.5; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 30px; font-size: 14px; }
    </style>
</head>
<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="title">🤖 AI猜拳</div>
            <div class="subtitle">AI会学习你的出拳模式</div>
        </div>
        
        <div class="score-board">
            <div class="player-score">
                <div class="score-label">玩家</div>
                <div class="score-value" id="playerScore">0</div>
            </div>
            <div class="ai-score">
                <div class="score-label">AI</div>
                <div class="score-value" id="aiScore">0</div>
            </div>
        </div>
        
        <div class="battle-area">
            <div class="hand-container">
                <div class="hand player" id="playerHand">✊</div>
            </div>
            <div class="vs">VS</div>
            <div class="hand-container">
                <div class="hand ai" id="aiHand">✊</div>
            </div>
        </div>
        
        <div class="result" id="result"></div>
        
        <div class="choices">
            <button class="choice-btn" onclick="play('rock')">✊</button>
            <button class="choice-btn" onclick="play('paper')">✋</button>
            <button class="choice-btn" onclick="play('scissors')">✌️</button>
        </div>
        
        <div class="ai-status" id="aiStatus">AI正在观察你的模式...</div>
    </div>
    
    <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <script>
        const GAME_NAME = 'AI猜拳';
        GameCore.init({ highScore: GAME_NAME });
        
        let playerScore = 0;
        let aiScore = 0;
        let rounds = 0;
        
        const hands = {
            rock: '✊',
            paper: '✋',
            scissors: '✌️'
        };
        
        const beats = {
            rock: 'scissors',
            paper: 'rock',
            scissors: 'paper'
        };
        
        const aiHistory = [];
        const playerHistory = [];
        const patternMemory = {};
        
        function getPattern(history, length = 3) {
            return history.slice(-length).join(',');
        }
        
        function predictNext() {
            if (playerHistory.length < 3) {
                return ['rock', 'paper', 'scissors'][Math.floor(Math.random() * 3)];
            }
            
            const patterns = [1, 2, 3];
            let bestPrediction = null;
            let maxConfidence = 0;
            
            patterns.forEach(patternLen => {
                const pattern = getPattern(playerHistory, patternLen);
                if (patternMemory[pattern]) {
                    const counts = patternMemory[pattern];
                    let maxCount = 0;
                    let mostLikely = null;
                    
                    Object.keys(counts).forEach(choice => {
                        if (counts[choice] > maxCount) {
                            maxCount = counts[choice];
                            mostLikely = choice;
                        }
                    });
                    
                    if (mostLikely && maxCount > maxConfidence) {
                        maxConfidence = maxCount;
                        bestPrediction = beats[mostLikely];
                    }
                }
            });
            
            if (bestPrediction && Math.random() < Math.min(0.7 + maxConfidence * 0.1, 0.95)) {
                return bestPrediction;
            }
            
            return ['rock', 'paper', 'scissors'][Math.floor(Math.random() * 3)];
        }
        
        function updatePatternMemory() {
            if (playerHistory.length >= 4) {
                const pattern = getPattern(playerHistory.slice(0, -1), 3);
                const nextChoice = playerHistory[playerHistory.length - 1];
                
                if (!patternMemory[pattern]) {
                    patternMemory[pattern] = { rock: 0, paper: 0, scissors: 0 };
                }
                patternMemory[pattern][nextChoice]++;
            }
        }
        
        function play(playerChoice) {
            const aiChoice = predictNext();
            
            playerHistory.push(playerChoice);
            aiHistory.push(aiChoice);
            
            updatePatternMemory();
            
            document.getElementById('playerHand').textContent = hands[playerChoice];
            document.getElementById('aiHand').textContent = hands[aiChoice];
            
            let result = '';
            let resultClass = '';
            
            if (playerChoice === aiChoice) {
                result = '平局！';
                resultClass = 'draw';
            } else if (beats[playerChoice] === aiChoice) {
                result = '你赢了！';
                resultClass = 'win';
                playerScore++;
            } else {
                result = 'AI赢了！';
                resultClass = 'lose';
                aiScore++;
            }
            
            rounds++;
            
            document.getElementById('result').textContent = result;
            document.getElementById('result').className = `result ${resultClass}`;
            
            document.getElementById('playerScore').textContent = playerScore;
            document.getElementById('aiScore').textContent = aiScore;
            
            const patternsCount = Object.keys(patternMemory).length;
            document.getElementById('aiStatus').textContent = 
                `AI已识别 ${patternsCount} 种模式 | 胜率: ${Math.round((aiScore / rounds) * 100)}%`;
            
            if (GameCore.highScore.set(GAME_NAME, playerScore)) {
                GameCore.hints.show('新纪录！分数: ' + playerScore);
            }
        }
        
        GameCore.touch.enableAllButtons();
    </script>
</body>
</html>
