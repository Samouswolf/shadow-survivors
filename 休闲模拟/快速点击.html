<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>快速点击</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; color: #fff; }
        
        .game-container { width: 100%; flex: 1; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: #ffd700; }
        .stats { display: flex; gap: 20px; font-size: 18px; }
        
        .click-area { flex: 1; display: flex; justify-content: center; align-items: center; }
        .click-btn { width: 200px; height: 200px; border-radius: 50%; background: linear-gradient(135deg, #f093fb, #f5576c); display: flex; align-items: center; justify-content: center; font-size: 36px; cursor: pointer; transition: transform 0.1s; user-select: none; }
        .click-btn:active { transform: scale(0.95); }
        
        .progress-bar { width: 100%; height: 15px; background: rgba(255,255,255,0.2); border-radius: 10px; overflow: hidden; margin-bottom: 15px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #4ecdc4, #48c78e); transition: width 0.1s; }
        
        .leaderboard { width: 100%; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 15px; }
        .leaderboard-title { font-size: 14px; opacity: 0.7; margin-bottom: 10px; }
        .leaderboard-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="title">👆 快速点击</div>
            <div class="stats">
                <span>分数: <span id="score">0</span></span>
                <span>时间: <span id="time">10</span>s</span>
            </div>
        </div>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width: 100%;"></div>
        </div>
        
        <div class="click-area">
            <div class="click-btn" id="clickBtn" onclick="handleClick()">点击我！</div>
        </div>
        
        <div class="leaderboard">
            <div class="leaderboard-title">排行榜</div>
            <div class="leaderboard-item">
                <span>🏆 快手王</span>
                <span>250 次</span>
            </div>
            <div class="leaderboard-item">
                <span>🥈 闪电手</span>
                <span>220 次</span>
            </div>
            <div class="leaderboard-item">
                <span>🥉 快枪手</span>
                <span>180 次</span>
            </div>
            <div class="leaderboard-item">
                <span>你的最佳</span>
                <span><span id="bestScore">0</span> 次</span>
            </div>
        </div>
    </div>
    
    <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <script>
        const GAME_NAME = '快速点击';
        GameCore.init({ highScore: GAME_NAME });
        
        const TIME_LIMIT = 10;
        let score = 0;
        let timeLeft = TIME_LIMIT;
        let timer = null;
        let isPlaying = false;
        
        function initGame() {
            const highScore = GameCore.highScore.get(GAME_NAME);
            document.getElementById('bestScore').textContent = highScore || '0';
        }
        
        function handleClick() {
            if (!isPlaying) {
                startGame();
                return;
            }
            
            score++;
            document.getElementById('score').textContent = score;
            
            const btn = document.getElementById('clickBtn');
            btn.style.background = `linear-gradient(135deg, #${Math.floor(Math.random()*16777215).toString(16).padStart(6, '0')}, #${Math.floor(Math.random()*16777215).toString(16).padStart(6, '0')})`;
            
            if (score % 10 === 0) {
                GameCore.hints.show(`${score}次！继续加油！`);
            }
        }
        
        function startGame() {
            isPlaying = true;
            score = 0;
            timeLeft = TIME_LIMIT;
            
            document.getElementById('score').textContent = score;
            document.getElementById('time').textContent = timeLeft;
            document.getElementById('progressFill').style.width = '100%';
            
            const btn = document.getElementById('clickBtn');
            btn.textContent = '点击！';
            
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('time').textContent = timeLeft;
                
                const progress = (timeLeft / TIME_LIMIT) * 100;
                document.getElementById('progressFill').style.width = progress + '%';
                
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }
        
        function endGame() {
            clearInterval(timer);
            isPlaying = false;
            
            const btn = document.getElementById('clickBtn');
            btn.textContent = '点击开始';
            btn.style.background = 'linear-gradient(135deg, #f093fb, #f5576c)';
            
            const currentBest = parseInt(document.getElementById('bestScore').textContent) || 0;
            if (score > currentBest) {
                document.getElementById('bestScore').textContent = score;
                GameCore.highScore.set(GAME_NAME, score);
                GameCore.hints.show('🎉 新纪录！');
            }
            
            GameCore.hints.show(`时间到！得分: ${score}`);
        }
        
        initGame();
        GameCore.touch.enableAllButtons();
    </script>
</body>
</html>
