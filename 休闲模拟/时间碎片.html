<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>时间碎片</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; overflow: hidden; color: #fff; }
        .game-container { width: 100%; height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 10px; }
        .stat { display: flex; flex-direction: column; align-items: center; }
        .stat-label { font-size: 12px; opacity: 0.7; }
        .stat-value { font-size: 24px; font-weight: bold; color: #ffd700; }
        
        .game-area { flex: 1; position: relative; background: rgba(0,0,0,0.4); border-radius: 15px; overflow: hidden; }
        #gameCanvas { width: 100%; height: 100%; display: block; }
        
        .time-fragment-indicator { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 10px; font-size: 14px; }
        
        .controls { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
        .btn { padding: 12px 25px; border: none; border-radius: 25px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 10px; font-size: 14px; }

.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}

.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}

</style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">关卡</div>
                <div class="stat-value" id="level">1</div>
            </div>
            <div class="stat">
                <div class="stat-label">分数</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">最高</div>
                <div class="stat-value" id="highScore">0</div>
            </div>
        </div>
        
        <div class="game-area">
            <canvas id="gameCanvas"></canvas>
            <div class="time-fragment-indicator" id="fragmentIndicator">⏳ 碎片: 0/5</div>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" id="btnStart">▶️ 开始游戏</button>
        </div>
        
        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const GAME_NAME = '时间碎片';
        GameCore.init({ highScore: GAME_NAME });
        
        let level = 1;
        let score = 0;
        let gameRunning = false;
        let collectedFragments = 0;
        const TOTAL_FRAGMENTS = 5;
        
        let player = { x: 50, y: 300, width: 30, height: 50, vx: 0, vy: 0, onGround: false };
        let platforms = [];
        let fragments = [];
        let timeRifts = [];
        
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            initLevel();
        }
        
        function initLevel() {
            player.x = 50;
            player.y = canvas.height - 100;
            player.vx = 0;
            player.vy = 0;
            collectedFragments = 0;
            
            platforms = [];
            fragments = [];
            timeRifts = [];
            
            const platformCount = 5 + level;
            for (let i = 0; i < platformCount; i++) {
                platforms.push({
                    x: 100 + i * 100,
                    y: 150 + Math.random() * 200,
                    width: 60 + Math.random() * 40,
                    height: 15,
                    color: '#4ecdc4'
                });
            }
            
            platforms.push({ x: 0, y: canvas.height - 20, width: canvas.width, height: 20, color: '#4a5568' });
            
            for (let i = 0; i < TOTAL_FRAGMENTS; i++) {
                fragments.push({
                    x: 150 + i * 150 + Math.random() * 50,
                    y: 80 + Math.random() * 120,
                    size: 20,
                    collected: false,
                    phase: i * (Math.PI * 2 / TOTAL_FRAGMENTS)
                });
            }
            
            timeRifts.push({
                x: canvas.width - 80,
                y: canvas.height - 80,
                width: 50,
                height: 50,
                color: '#a855f7',
                active: false
            });
        }
        
        function updatePlayer() {
            player.vx *= 0.95;
            player.vy += 0.5;
            
            let onGround = false;
            platforms.forEach(platform => {
                if (player.y + player.height > platform.y &&
                    player.y + player.height < platform.y + platform.height + 10 &&
                    player.x < platform.x + platform.width &&
                    player.x + player.width > platform.x &&
                    player.vy >= 0) {
                    player.y = platform.y - player.height;
                    player.vy = 0;
                    onGround = true;
                }
            });
            player.onGround = onGround;
            
            player.x += player.vx;
            player.y += player.vy;
            
            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
        }
        
        function checkCollisions() {
            fragments.forEach(f => {
                if (!f.collected) {
                    const dx = player.x + player.width / 2 - f.x;
                    const dy = player.y + player.height / 2 - f.y;
                    if (Math.sqrt(dx * dx + dy * dy) < 30) {
                        f.collected = true;
                        collectedFragments++;
                        score += 200;
                        
                        for (let i = 0; i < 12; i++) {
                            particles.push({
                                x: f.x,
                                y: f.y,
                                vx: (Math.random() - 0.5) * 6,
                                vy: (Math.random() - 0.5) * 6,
                                life: 1,
                                color: '#ffd700'
                            });
                        }
                    }
                }
            });
            
            if (collectedFragments >= TOTAL_FRAGMENTS) {
                timeRifts[0].active = true;
            }
            
            timeRifts.forEach(rift => {
                if (rift.active) {
                    if (player.x < rift.x + rift.width &&
                        player.x + player.width > rift.x &&
                        player.y < rift.y + rift.height &&
                        player.y + player.height > rift.y) {
                        level++;
                        score += level * 1000;
                        initLevel();
                    }
                }
            });
            
            if (player.y > canvas.height + 100) {
                initLevel();
            }
            
            updateStats();
        }
        
        function updateParticles() {
            particles = particles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;
                return p.life > 0;
            });
        }
        
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 时间流动效果
            const time = Date.now() / 1000;
            for (let i = 0; i < 40; i++) {
                const x = (i * 43 + time * 50) % canvas.width;
                const y = (i * 67) % canvas.height;
                const alpha = 0.1 + Math.sin(time + i * 0.3) * 0.05;
                ctx.fillStyle = `rgba(255,215,0,${alpha})`;
                ctx.beginPath();
                ctx.arc(x, y, 2, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // 平台
            platforms.forEach(platform => {
                ctx.fillStyle = platform.color;
                ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
            });
            
            // 时间碎片
            fragments.forEach(f => {
                if (!f.collected) {
                    const pulse = 1 + Math.sin(time * 3 + f.phase) * 0.3;
                    ctx.fillStyle = '#ffd700';
                    ctx.shadowColor = '#ffd700';
                    ctx.shadowBlur = 15 * pulse;
                    ctx.font = `${24 * pulse}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.fillText('⏳', f.x, f.y + 8);
                    ctx.shadowBlur = 0;
                }
            });
            
            // 时间裂隙
            timeRifts.forEach(rift => {
                if (rift.active) {
                    const pulse = 1 + Math.sin(time * 2) * 0.2;
                    ctx.fillStyle = rift.color;
                    ctx.shadowColor = rift.color;
                    ctx.shadowBlur = 30 * pulse;
                    ctx.beginPath();
                    ctx.arc(rift.x + rift.width / 2, rift.y + rift.height / 2, 25 * pulse, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    
                    ctx.fillStyle = '#fff';
                    ctx.font = '24px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('🌀', rift.x + rift.width / 2, rift.y + rift.height / 2 + 8);
                } else {
                    ctx.strokeStyle = 'rgba(168, 85, 247, 0.3)';
                    ctx.setLineDash([5, 5]);
                    ctx.beginPath();
                    ctx.arc(rift.x + rift.width / 2, rift.y + rift.height / 2, 25, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            });
            
            // 玩家
            ctx.fillStyle = '#f5576c';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            
            // 粒子
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }
        
        let particles = [];
        
        function updateStats() {
            document.getElementById('level').textContent = level;
            document.getElementById('score').textContent = score;
            document.getElementById('highScore').textContent = GameCore.highScore.get(GAME_NAME);
            document.getElementById('fragmentIndicator').textContent = `⏳ 碎片: ${collectedFragments}/${TOTAL_FRAGMENTS}`;
            
            if (GameCore.highScore.set(GAME_NAME, score)) {
                GameCore.hints.show('新纪录！分数: ' + score);
            }
        }
        
        function gameLoop() {
            draw();
            
            if (gameRunning) {
                updatePlayer();
                checkCollisions();
                updateParticles();
            }
            
            updateStats();
            requestAnimationFrame(gameLoop);
        }
        
        document.addEventListener('keydown', e => {
            if (!gameRunning) return;
            
            if (e.code === 'ArrowRight' || e.code === 'KeyD') player.vx = 5;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') player.vx = -5;
            if (e.code === 'ArrowUp' || e.code === 'KeyW') {
                if (player.onGround) {
                    player.vy = -12;
                    player.onGround = false;
                }
            }
        });
        
        document.addEventListener('keyup', e => {
            if (e.code === 'ArrowRight' || e.code === 'KeyD' || e.code === 'ArrowLeft' || e.code === 'KeyA') player.vx = 0;
        });
        
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            if (!gameRunning) return;
            
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            
            if (x < canvas.width / 2) {
                player.vx = -5;
            } else {
                player.vx = 5;
            }
            
            if (player.onGround) {
                player.vy = -12;
                player.onGround = false;
            }
        }, { passive: false });
        
        canvas.addEventListener('touchend', () => {
            player.vx = 0;
        });
        
        document.getElementById('btnStart').onclick = () => {
            gameRunning = true;
            level = 1;
            score = 0;
            initLevel();
        };
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        gameLoop();
    </script>

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
