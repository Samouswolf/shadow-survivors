<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>手势操控</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; overflow: hidden; color: #fff; }
        .game-container { width: 100%; height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 10px; }
        .stat { display: flex; flex-direction: column; align-items: center; }
        .stat-label { font-size: 12px; opacity: 0.7; }
        .stat-value { font-size: 24px; font-weight: bold; color: #4ecdc4; }
        
        .game-area { flex: 1; position: relative; background: rgba(0,0,0,0.4); border-radius: 15px; overflow: hidden; }
        #gameCanvas { width: 100%; height: 100%; display: block; }
        
        .gesture-hint { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 15px 30px; border-radius: 10px; font-size: 18px; }
        
        .controls { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
        .btn { padding: 12px 25px; border: none; border-radius: 25px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">关卡</div>
                <div class="stat-value" id="level">1</div>
            </div>
            <div class="stat">
                <div class="stat-label">分数</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">最高</div>
                <div class="stat-value" id="highScore">0</div>
            </div>
        </div>
        
        <div class="game-area">
            <canvas id="gameCanvas"></canvas>
            <div class="gesture-hint" id="gestureHint">👆 点击屏幕开始</div>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" id="btnStart">▶️ 开始游戏</button>
        </div>
        
        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    <script src="game_core.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const GAME_NAME = '手势操控';
        GameCore.init({ highScore: GAME_NAME });
        
        let level = 1;
        let score = 0;
        let gameRunning = false;
        
        let player = { x: 0, y: 0, radius: 20 };
        let targets = [];
        let obstacles = [];
        let gesturePath = [];
        
        const GESTURES = ['circle', 'line', 'zigzag', 'wave'];
        let currentGesture = '';
        
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            initLevel();
        }
        
        function initLevel() {
            player.x = canvas.width / 2;
            player.y = canvas.height / 2;
            gesturePath = [];
            
            targets = [];
            obstacles = [];
            
            const targetCount = 3 + level;
            for (let i = 0; i < targetCount; i++) {
                targets.push({
                    x: 50 + (i % 3) * (canvas.width - 100) / 2,
                    y: 50 + Math.floor(i / 3) * (canvas.height - 100) / 2,
                    radius: 25,
                    collected: false,
                    color: `hsl(${i * 60}, 70%, 50%)`
                });
            }
            
            currentGesture = GESTURES[Math.floor(Math.random() * GESTURES.length)];
            updateHint();
        }
        
        function updateHint() {
            const hints = {
                circle: '🔄 画一个圆',
                line: '➡️ 画一条直线',
                zigzag: '⚡ 画闪电',
                wave: '🌊 画波浪'
            };
            document.getElementById('gestureHint').textContent = hints[currentGesture];
        }
        
        function checkGesture() {
            if (gesturePath.length < 10) return;
            
            const points = gesturePath;
            let detected = '';
            
            // 检测圆形
            const centerX = points.reduce((sum, p) => sum + p.x, 0) / points.length;
            const centerY = points.reduce((sum, p) => sum + p.y, 0) / points.length;
            const avgDist = points.reduce((sum, p) => sum + Math.sqrt(Math.pow(p.x - centerX, 2) + Math.pow(p.y - centerY, 2)), 0) / points.length;
            
            const circleScore = points.reduce((sum, p) => {
                const dist = Math.sqrt(Math.pow(p.x - centerX, 2) + Math.pow(p.y - centerY, 2));
                return sum + Math.abs(dist - avgDist);
            }, 0) / points.length;
            
            if (circleScore < 30) {
                detected = 'circle';
            }
            
            // 检测直线
            const first = points[0];
            const last = points[points.length - 1];
            const lineScore = points.reduce((sum, p) => {
                const dist = Math.abs((last.y - first.y) * p.x - (last.x - first.x) * p.y + last.x * first.y - last.y * first.x) / 
                            Math.sqrt(Math.pow(last.y - first.y, 2) + Math.pow(last.x - first.x, 2));
                return sum + dist;
            }, 0) / points.length;
            
            if (lineScore < 20 && Math.sqrt(Math.pow(last.x - first.x, 2) + Math.pow(last.y - first.y, 2)) > 100) {
                detected = 'line';
            }
            
            // 检测闪电
            let turns = 0;
            for (let i = 1; i < points.length - 1; i++) {
                const dx1 = points[i].x - points[i-1].x;
                const dy1 = points[i].y - points[i-1].y;
                const dx2 = points[i+1].x - points[i].x;
                const dy2 = points[i+1].y - points[i].y;
                const angle = Math.abs(Math.atan2(dy1, dx1) - Math.atan2(dy2, dx2));
                if (angle > Math.PI / 3) turns++;
            }
            if (turns >= 3) {
                detected = 'zigzag';
            }
            
            if (detected === currentGesture) {
                score += level * 200;
                triggerGestureEffect();
                
                for (let i = 0; i < 20; i++) {
                    particles.push({
                        x: player.x,
                        y: player.y,
                        vx: (Math.random() - 0.5) * 15,
                        vy: (Math.random() - 0.5) * 15,
                        life: 1,
                        color: '#4ecdc4'
                    });
                }
                
                gesturePath = [];
                currentGesture = GESTURES[Math.floor(Math.random() * GESTURES.length)];
                updateHint();
                
                if (targets.every(t => t.collected)) {
                    level++;
                    score += level * 500;
                    initLevel();
                }
            } else {
                gesturePath = [];
            }
        }
        
        function triggerGestureEffect() {
            targets.forEach(t => {
                if (!t.collected) {
                    t.collected = true;
                    score += 100;
                }
            });
        }
        
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 背景网格
            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            for (let x = 0; x < canvas.width; x += 50) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 50) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
            
            // 目标
            targets.forEach(t => {
                if (!t.collected) {
                    ctx.fillStyle = t.color;
                    ctx.shadowColor = t.color;
                    ctx.shadowBlur = 15;
                    ctx.beginPath();
                    ctx.arc(t.x, t.y, t.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            });
            
            // 手势轨迹
            if (gesturePath.length > 1) {
                ctx.strokeStyle = '#4ecdc4';
                ctx.lineWidth = 5;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.beginPath();
                ctx.moveTo(gesturePath[0].x, gesturePath[0].y);
                gesturePath.forEach(p => ctx.lineTo(p.x, p.y));
                ctx.stroke();
            }
            
            // 玩家
            ctx.fillStyle = '#f5576c';
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fill();
            
            // 粒子
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }
        
        let particles = [];
        
        function updateParticles() {
            particles = particles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;
                return p.life > 0;
            });
        }
        
        function updateStats() {
            document.getElementById('level').textContent = level;
            document.getElementById('score').textContent = score;
            document.getElementById('highScore').textContent = GameCore.highScore.get(GAME_NAME);
            
            if (GameCore.highScore.set(GAME_NAME, score)) {
                GameCore.hints.show('新纪录！分数: ' + score);
            }
        }
        
        function gameLoop() {
            draw();
            
            if (gameRunning) {
                updateParticles();
            }
            
            updateStats();
            requestAnimationFrame(gameLoop);
        }
        
        canvas.addEventListener('mousedown', e => {
            if (!gameRunning) return;
            
            const rect = canvas.getBoundingClientRect();
            gesturePath.push({
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            });
        });
        
        canvas.addEventListener('mousemove', e => {
            if (!gameRunning || gesturePath.length === 0) return;
            
            const rect = canvas.getBoundingClientRect();
            gesturePath.push({
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            });
        });
        
        canvas.addEventListener('mouseup', checkGesture);
        
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            if (!gameRunning) return;
            
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            gesturePath.push({
                x: touch.clientX - rect.left,
                y: touch.clientY - rect.top
            });
        }, { passive: false });
        
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            if (!gameRunning || gesturePath.length === 0) return;
            
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            gesturePath.push({
                x: touch.clientX - rect.left,
                y: touch.clientY - rect.top
            });
        }, { passive: false });
        
        canvas.addEventListener('touchend', checkGesture);
        
        document.getElementById('btnStart').onclick = () => {
            gameRunning = true;
            level = 1;
            score = 0;
            initLevel();
        };
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        gameLoop();
    </script>
</body>
</html>
