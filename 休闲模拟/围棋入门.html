<script>
/* [STORAGE-POLYFILL v1] */
;(function(){
  var G = (typeof window !== 'undefined') ? window : (typeof globalThis !== 'undefined' ? globalThis : this);
  // 浏览器已有 Storage 构造函数，需确保其带 load/save/remove 静态方法
  var S = G.Storage;
  var needAttach = (typeof S === 'undefined' || typeof S.load !== 'function' || typeof S.save !== 'function');
  if (!needAttach) return;
  if (typeof S === 'undefined') { S = function(){}; G.Storage = S; }
  function parseSafe(s, d){
    if (s === null || s === undefined) return d;
    try { return JSON.parse(s); } catch(e) { try { return s; } catch(e2){ return d; } }
  }
  S.load = function(k, d){ try { return parseSafe(localStorage.getItem(k), d); } catch(e){ return d; } };
  S.save = function(k, v){ try { localStorage.setItem(k, typeof v==='string'?v:JSON.stringify(v)); } catch(e){} };
  S.remove = function(k){ try { localStorage.removeItem(k); } catch(e){} };
})();

(function(){
'use strict';

// ==================== Constants ====================
const c = document.getElementById('gc'), ctx = c.getContext('2d');
const BOARD_SIZE = 9;
const SCREEN = {MENU:0, PLAYING:1, GAMEOVER:2};
const EMPTY = 0, BLACK = 1, WHITE = 2;

// ==================== Game State ====================
let W, H, cellSize, boardX, boardY, stoneRadius;
let screen = SCREEN.MENU;
let board = [];
let turn = BLACK;
let winner = null;
let moveHistory = [];
let hoverPos = null;
let scores = {win:0, lose:0, draw:0};
let lastMove = null;
let gameOverReason = '';
let paused = false;
let blackTerritory = 0;
let whiteTerritory = 0;
let blackCaptured = 0;
let whiteCaptured = 0;
let consecutivePasses = 0;
let aiThinking = false;
let difficulty = 1; // 0=easy, 1=normal, 2=hard
let moveAnimations = [];
let stonePlaceAnimation = null;
let showTerritory = false;
let territoryMap = null;

// ==================== Audio System ====================
let audioCtx = null;
function initAudio() {
    try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch(e) {}
}

function playSound(type) {
    if (!audioCtx) return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'place') {
            osc.frequency.value = 800;
            gain.gain.value = 0.3;
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'capture') {
            osc.frequency.value = 600;
            gain.gain.value = 0.4;
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
            osc.stop(audioCtx.currentTime + 0.2);
        } else if (type === 'win') {
            osc.frequency.value = 1000;
            gain.gain.value = 0.5;
            osc.start();
            osc.frequency.linearRampToValueAtTime(1500, audioCtx.currentTime + 0.3);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
            osc.stop(audioCtx.currentTime + 0.5);
        } else if (type === 'lose') {
            osc.frequency.value = 400;
            gain.gain.value = 0.4;
            osc.start();
            osc.frequency.linearRampToValueAtTime(200, audioCtx.currentTime + 0.3);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
            osc.stop(audioCtx.currentTime + 0.5);
        }
    } catch(e) {}
}

// ==================== Init ====================
function init() {
    initAudio();
    resize();
    window.addEventListener('resize', resize);
    c.addEventListener('click', handleClick);
    c.addEventListener('mousemove', handleMove);
    c.addEventListener('touchstart', handleTouch, {passive:false});
    document.addEventListener('keydown', handleKey);
    loadScores();
    resetGame();
    requestAnimationFrame(gameLoop);
}

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    c.width = W;
    c.height = H;
    cellSize = Math.min((W-60)/(BOARD_SIZE+1), (H-160)/(BOARD_SIZE+1));
    stoneRadius = cellSize * 0.42;
    boardX = (W - cellSize*(BOARD_SIZE-1))/2;
    boardY = (H - cellSize*(BOARD_SIZE-1))/2 + 20;
}

function resetGame() {
    board = Array(BOARD_SIZE).fill(null).map(()=>Array(BOARD_SIZE).fill(EMPTY));
    turn = BLACK;
    winner = null;
    moveHistory = [];
    hoverPos = null;
    lastMove = null;
    gameOverReason = '';
    blackTerritory = 0;
    whiteTerritory = 0;
    blackCaptured = 0;
    whiteCaptured = 0;
    consecutivePasses = 0;
    aiThinking = false;
    moveAnimations = [];
    stonePlaceAnimation = null;
    showTerritory = false;
    territoryMap = null;
}

function loadScores() {
    try {
        const s = localStorage.getItem('go_scores');
        if (s) scores = JSON.parse(s);
    } catch(e) {}
}

function saveScores() {
    try {
        localStorage.setItem('go_scores', JSON.stringify(scores));
    } catch(e) {}
}

// ==================== Input Handling ====================
function getBoardPos(x, y) {
    const col = Math.round((x - boardX) / cellSize);
    const row = Math.round((y - boardY) / cellSize);
    if (col >= 0 && col < BOARD_SIZE && row >= 0 && row < BOARD_SIZE) {
        return {col, row};
    }
    return null;
}

function handleClick(e) {
    if (screen === SCREEN.MENU) return;
    if (screen === SCREEN.GAMEOVER) {
        resetGame();
        screen = SCREEN.PLAYING;
        document.getElementById('startScreen').style.display = 'none';
        document.getElementById('pauseBtn').style.display = 'block';
        return;
    }
    if (paused || aiThinking) return;

    const rect = c.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (W / rect.width);
    const y = (e.clientY - rect.top) * (H / rect.height);
    const pos = getBoardPos(x, y);

    if (pos && board[pos.row][pos.col] === EMPTY) {
        if (isValidMove(pos.row, pos.col, turn)) {
            placeStone(pos.row, pos.col, turn);
            playSound('place');
            turn = WHITE;
            setTimeout(aiMove, 300);
        }
    }
}

function handleMove(e) {
    if (screen !== SCREEN.PLAYING || paused || aiThinking) return;
    const rect = c.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (W / rect.width);
    const y = (e.clientY - rect.top) * (H / rect.height);
    hoverPos = getBoardPos(x, y);
}

function handleTouch(e) {
    e.preventDefault();
    if (screen === SCREEN.MENU) return;
    if (screen === SCREEN.GAMEOVER) {
        resetGame();
        screen = SCREEN.PLAYING;
        document.getElementById('startScreen').style.display = 'none';
        document.getElementById('pauseBtn').style.display = 'block';
        return;
    }
    if (paused || aiThinking) return;

    const touch = e.touches[0];
    const rect = c.getBoundingClientRect();
    const x = (touch.clientX - rect.left) * (W / rect.width);
    const y = (touch.clientY - rect.top) * (H / rect.height);
    const pos = getBoardPos(x, y);

    if (pos && board[pos.row][pos.col] === EMPTY) {
        if (isValidMove(pos.row, pos.col, turn)) {
            placeStone(pos.row, pos.col, turn);
            playSound('place');
            turn = WHITE;
            setTimeout(aiMove, 300);
        }
    }
}

function handleKey(e) {
    if (e.key === 'p' || e.key === 'P') {
        togglePause();
    } else if (e.key === 'u' || e.key === 'U') {
        undoMove();
    } else if (e.key === ' ') {
        e.preventDefault();
        if (screen === SCREEN.PLAYING && !paused && !aiThinking && turn === BLACK) {
            passTurn();
        }
    }
}

// ==================== Game Logic ====================
function isValidMove(row, col, color) {
    if (board[row][col] !== EMPTY) return false;

    // Check for suicide
    const tempBoard = board.map(r => [...r]);
    tempBoard[row][col] = color;
    const opponent = color === BLACK ? WHITE : BLACK;

    // Check if captures any opponent stones
    for (const [dr, dc] of [[-1,0],[1,0],[0,-1],[0,1]]) {
        const nr = row + dr, nc = col + dc;
        if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && tempBoard[nr][nc] === opponent) {
            if (getLiberties(tempBoard, nr, nc) === 0) {
                return true;
            }
        }
    }

    // Check if has liberties itself
    if (getLiberties(tempBoard, row, col) > 0) {
        return true;
    }

    return false;
}

function getLiberties(b, row, col) {
    const color = b[row][col];
    if (color === EMPTY) return 0;

    const visited = Array(BOARD_SIZE).fill(null).map(()=>Array(BOARD_SIZE).fill(false));
    const liberties = new Set();
    const stack = [[row, col]];

    while (stack.length > 0) {
        const [r, c] = stack.pop();
        if (visited[r][c]) continue;
        visited[r][c] = true;

        for (const [dr, dc] of [[-1,0],[1,0],[0,-1],[0,1]]) {
            const nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE) {
                if (b[nr][nc] === EMPTY) {
                    liberties.add(nr * BOARD_SIZE + nc);
                } else if (b[nr][nc] === color && !visited[nr][nc]) {
                    stack.push([nr, nc]);
                }
            }
        }
    }

    return liberties.size;
}

function placeStone(row, col, color) {
    board[row][col] = color;
    const opponent = color === BLACK ? WHITE : BLACK;
    let captured = 0;

    // Remove captured opponent stones
    for (const [dr, dc] of [[-1,0],[1,0],[0,-1],[0,1]]) {
        const nr = row + dr, nc = col + dc;
        if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] === opponent) {
            if (getLiberties(board, nr, nc) === 0) {
                captured += removeGroup(nr, nc);
            }
        }
    }

    if (color === BLACK) {
        blackCaptured += captured;
    } else {
        whiteCaptured += captured;
    }

    moveHistory.push({row, col, color});
    lastMove = {row, col};
    consecutivePasses = 0;

    if (captured > 0) {
        playSound('capture');
    }
}

function removeGroup(row, col) {
    const color = board[row][col];
    const visited = Array(BOARD_SIZE).fill(null).map(()=>Array(BOARD_SIZE).fill(false));
    const stack = [[row, col]];
    let count = 0;

    while (stack.length > 0) {
        const [r, c] = stack.pop();
        if (visited[r][c] || board[r][c] !== color) continue;
        visited[r][c] = true;
        board[r][c] = EMPTY;
        count++;

        for (const [dr, dc] of [[-1,0],[1,0],[0,-1],[0,1]]) {
            const nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && !visited[nr][nc]) {
                stack.push([nr, nc]);
            }
        }
    }

    return count;
}

function passTurn() {
    moveHistory.push({row: -1, col: -1, color: turn});
    consecutivePasses++;

    if (consecutivePasses >= 2) {
        calculateTerritory();
        showTerritory = true;
        endGame();
        return;
    }

    turn = turn === BLACK ? WHITE : BLACK;
    if (turn === WHITE) {
        setTimeout(aiMove, 300);
    }
}

function undoMove() {
    if (screen !== SCREEN.PLAYING || paused || aiThinking) return;
    if (moveHistory.length < 2) return;

    // Undo AI move and player move
    for (let i = 0; i < 2; i++) {
        const move = moveHistory.pop();
        if (move.row >= 0 && move.col >= 0) {
            board[move.row][move.col] = EMPTY;
        }
    }

    turn = BLACK;
    lastMove = moveHistory.length > 0 ? moveHistory[moveHistory.length - 1] : null;
    if (lastMove && lastMove.row < 0) lastMove = null;
}

// ==================== AI ====================
function aiMove() {
    aiThinking = true;

    setTimeout(() => {
        let bestMove = null;
        let bestScore = -Infinity;
        const searchDepth = difficulty === 0 ? 1 : difficulty === 1 ? 2 : 3;

        // Evaluate all valid moves
        for (let row = 0; row < BOARD_SIZE; row++) {
            for (let col = 0; col < BOARD_SIZE; col++) {
                if (board[row][col] === EMPTY && isValidMove(row, col, WHITE)) {
                    const score = evaluateMove(row, col, WHITE, searchDepth);
                    // Add randomness for easier difficulty
                    const randomFactor = difficulty === 0 ? (Math.random() * 20 - 10) : (Math.random() * 5 - 2.5);
                    if (score + randomFactor > bestScore) {
                        bestScore = score + randomFactor;
                        bestMove = {row, col};
                    }
                }
            }
        }

        if (bestMove && bestScore > -50) {
            placeStone(bestMove.row, bestMove.col, WHITE);
            playSound('place');
            // Add animation
            stonePlaceAnimation = {
                x: boardX + bestMove.col * cellSize,
                y: boardY + bestMove.row * cellSize,
                radius: 0,
                targetRadius: stoneRadius,
                startTime: Date.now()
            };
        } else {
            // AI passes
            moveHistory.push({row: -1, col: -1, color: WHITE});
            consecutivePasses++;
            if (consecutivePasses >= 2) {
                calculateTerritory();
                showTerritory = true;
                endGame();
                aiThinking = false;
                return;
            }
        }

        turn = BLACK;
        aiThinking = false;
    }, 200);
}

function evaluateMove(row, col, color, depth) {
    let score = 0;
    const opponent = color === BLACK ? WHITE : BLACK;

    // Prefer center positions
    const centerDist = Math.abs(row - 4) + Math.abs(col - 4);
    score += (8 - centerDist) * 3;

    // Check captures
    const tempBoard = board.map(r => [...r]);
    tempBoard[row][col] = color;
    let captureCount = 0;

    for (const [dr, dc] of [[-1,0],[1,0],[0,-1],[0,1]]) {
        const nr = row + dr, nc = col + dc;
        if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && tempBoard[nr][nc] === opponent) {
            if (getLiberties(tempBoard, nr, nc) === 0) {
                captureCount++;
                score += 60;
            }
        }
    }

    // Check own liberties (life force)
    const myLiberties = getLiberties(tempBoard, row, col);
    score += myLiberties * 4;

    // Prefer moves near existing stones (influence)
    for (const [dr, dc] of [[-1,0],[1,0],[0,-1],[0,1]]) {
        const nr = row + dr, nc = col + dc;
        if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] !== EMPTY) {
            score += 12;
        }
    }

    // Prefer diagonal connections
    for (const [dr, dc] of [[-1,-1],[-1,1],[1,-1],[1,1]]) {
        const nr = row + dr, nc = col + dc;
        if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] === color) {
            score += 8;
        }
    }

    // Avoid suicide
    if (myLiberties === 0 && captureCount === 0) {
        score -= 150;
    }

    // Penalty for low liberties (danger)
    if (myLiberties === 1 && captureCount === 0) {
        score -= 30;
    }

    // Bonus for capturing
    if (captureCount > 0) {
        score += captureCount * 20;
    }

    // Edge play bonus for 9x9
    if (row === 0 || row === BOARD_SIZE-1 || col === 0 || col === BOARD_SIZE-1) {
        score += 5;
    }

    // Corner play bonus
    if ((row === 0 || row === BOARD_SIZE-1) && (col === 0 || col === BOARD_SIZE-1)) {
        score += 10;
    }

    return score;
}

// ==================== Territory Calculation ====================
function calculateTerritory() {
    blackTerritory = 0;
    whiteTerritory = 0;
    territoryMap = Array(BOARD_SIZE).fill(null).map(()=>Array(BOARD_SIZE).fill(EMPTY));

    const visited = Array(BOARD_SIZE).fill(null).map(()=>Array(BOARD_SIZE).fill(false));

    for (let row = 0; row < BOARD_SIZE; row++) {
        for (let col = 0; col < BOARD_SIZE; col++) {
            if (visited[row][col] || board[row][col] !== EMPTY) continue;

            // Flood fill to find territory
            const territory = [];
            const borderColors = new Set();
            const stack = [[row, col]];

            while (stack.length > 0) {
                const [r, c] = stack.pop();
                if (visited[r][c]) continue;
                visited[r][c] = true;
                territory.push([r, c]);

                for (const [dr, dc] of [[-1,0],[1,0],[0,-1],[0,1]]) {
                    const nr = r + dr, nc = c + dc;
                    if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE) {
                        if (board[nr][nc] === EMPTY && !visited[nr][nc]) {
                            stack.push([nr, nc]);
                        } else if (board[nr][nc] !== EMPTY) {
                            borderColors.add(board[nr][nc]);
                        }
                    }
                }
            }

            // If territory borders only one color, it belongs to that color
            if (borderColors.size === 1) {
                const owner = borderColors.values().next().value;
                if (owner === BLACK) {
                    blackTerritory += territory.length;
                    for (const [r, c] of territory) {
                        territoryMap[r][c] = BLACK;
                    }
                } else {
                    whiteTerritory += territory.length;
                    for (const [r, c] of territory) {
                        territoryMap[r][c] = WHITE;
                    }
                }
            }
        }
    }
}

function endGame() {
    calculateTerritory();

    const blackScore = blackTerritory + blackCaptured;
    const whiteScore = whiteTerritory + whiteCaptured + 6.5; // Komi

    if (blackScore > whiteScore) {
        winner = BLACK;
        gameOverReason = `黑方胜 ${(blackScore - whiteScore).toFixed(1)} 目`;
        scores.win++;
        playSound('win');
    } else if (whiteScore > blackScore) {
        winner = WHITE;
        gameOverReason = `白方胜 ${(whiteScore - blackScore).toFixed(1)} 目`;
        scores.lose++;

    } else {

}

// ==================== Rendering ====================
function drawBoard() {
    // Background with gradient
    const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, '#1a1510');
    bgGrad.addColorStop(1, '#0d0a07');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    // Board background with wood texture effect
    const boardSize = (BOARD_SIZE - 1) * cellSize;
    const boardGrad = ctx.createLinearGradient(boardX - cellSize*0.6, boardY - cellSize*0.6,
                                               boardX + boardSize + cellSize*0.6, boardY + boardSize + cellSize*0.6);
    boardGrad.addColorStop(0, '#d4b896');
    boardGrad.addColorStop(0.5, '#c8a96e');
    boardGrad.addColorStop(1, '#b89860');
    ctx.fillStyle = boardGrad;

    // Draw rounded board
    const boardLeft = boardX - cellSize*0.6;
    const boardTop = boardY - cellSize*0.6;
    const boardWidth = boardSize + cellSize*1.2;
    const boardHeight = boardSize + cellSize*1.2;
    const radius = 8;

    ctx.beginPath();
    ctx.moveTo(boardLeft + radius, boardTop);
    ctx.lineTo(boardLeft + boardWidth - radius, boardTop);
    ctx.quadraticCurveTo(boardLeft + boardWidth, boardTop, boardLeft + boardWidth, boardTop + radius);
    ctx.lineTo(boardLeft + boardWidth, boardTop + boardHeight - radius);
    ctx.quadraticCurveTo(boardLeft + boardWidth, boardTop + boardHeight, boardLeft + boardWidth - radius, boardTop + boardHeight);
    ctx.lineTo(boardLeft + radius, boardTop + boardHeight);
    ctx.quadraticCurveTo(boardLeft, boardTop + boardHeight, boardLeft, boardTop + boardHeight - radius);
    ctx.lineTo(boardLeft, boardTop + radius);
    ctx.quadraticCurveTo(boardLeft, boardTop, boardLeft + radius, boardTop);
    ctx.closePath();
    ctx.fill();

    // Board border
    ctx.strokeStyle = '#8B7355';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Grid lines
    ctx.strokeStyle = '#5C4033';
    ctx.lineWidth = 1;

    for (let i = 0; i < BOARD_SIZE; i++) {
        // Horizontal
        ctx.beginPath();
        ctx.moveTo(boardX, boardY + i * cellSize);
        ctx.lineTo(boardX + (BOARD_SIZE-1) * cellSize, boardY + i * cellSize);
        ctx.stroke();

        // Vertical
        ctx.beginPath();
        ctx.moveTo(boardX + i * cellSize, boardY);
        ctx.lineTo(boardX + i * cellSize, boardY + (BOARD_SIZE-1) * cellSize);
        ctx.stroke();
    }

    // Star points (Hoshi)
    const starPoints = [];
    if (BOARD_SIZE === 9) {
        starPoints.push([2,2], [2,6], [6,2], [6,6], [4,4]);
    } else if (BOARD_SIZE === 13) {
        starPoints.push([3,3], [3,9], [9,3], [9,9], [6,6]);
    } else if (BOARD_SIZE === 19) {
        starPoints.push([3,3], [3,9], [3,15], [9,3], [9,9], [9,15], [15,3], [15,9], [15,15]);
    }

    ctx.fillStyle = '#333';
    for (const [r, cl] of starPoints) {
        ctx.beginPath();
        ctx.arc(boardX + cl * cellSize, boardY + r * cellSize, cellSize * 0.12, 0, Math.PI * 2);
        ctx.fill();
    }

    // Draw territory overlay if game over
    if (showTerritory && territoryMap) {
        for (let row = 0; row < BOARD_SIZE; row++) {
            for (let col = 0; col < BOARD_SIZE; col++) {
                if (territoryMap[row][col] !== EMPTY && board[row][col] === EMPTY) {
                    const x = boardX + col * cellSize;
                    const y = boardY + row * cellSize;
                    ctx.beginPath();
                    ctx.arc(x, y, cellSize * 0.15, 0, Math.PI * 2);
                    ctx.fillStyle = territoryMap[row][col] === BLACK ? 'rgba(0,0,0,0.5)' : 'rgba(255,255,255,0.5)';
                    ctx.fill();
                }
            }
        }
    }
}

function drawStones() {
    const now = Date.now();

    for (let row = 0; row < BOARD_SIZE; row++) {
        for (let col = 0; col < BOARD_SIZE; col++) {
            if (board[row][col] !== EMPTY) {
                const x = boardX + col * cellSize;
                const y = boardY + row * cellSize;

                // Check if this stone is being animated
                let drawRadius = stoneRadius;
                if (stonePlaceAnimation && stonePlaceAnimation.x === x && stonePlaceAnimation.y === y) {
                    const elapsed = now - stonePlaceAnimation.startTime;
                    const duration = 150;
                    if (elapsed < duration) {
                        drawRadius = stoneRadius * (elapsed / duration);
                    } else {
                        stonePlaceAnimation = null;
                    }
                }

                // Shadow
                ctx.beginPath();
                ctx.arc(x + 2, y + 2, drawRadius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fill();

                // Stone with enhanced gradient
                ctx.beginPath();
                ctx.arc(x, y, drawRadius, 0, Math.PI * 2);

                if (board[row][col] === BLACK) {
                    const grad = ctx.createRadialGradient(x - drawRadius*0.3, y - drawRadius*0.3, drawRadius*0.1, x, y, drawRadius);
                    grad.addColorStop(0, '#666');
                    grad.addColorStop(0.7, '#222');
                    grad.addColorStop(1, '#000');
                    ctx.fillStyle = grad;
                } else {
                    const grad = ctx.createRadialGradient(x - drawRadius*0.3, y - drawRadius*0.3, drawRadius*0.1, x, y, drawRadius);
                    grad.addColorStop(0, '#fff');
                    grad.addColorStop(0.7, '#eee');
                    grad.addColorStop(1, '#bbb');
                    ctx.fillStyle = grad;
                }
                ctx.fill();

                // Stone border
                ctx.strokeStyle = board[row][col] === BLACK ? '#000' : '#999';
                ctx.lineWidth = 0.5;
                ctx.stroke();

                // Last move indicator
                if (lastMove && lastMove.row === row && lastMove.col === col) {
                    ctx.beginPath();
                    ctx.arc(x, y, drawRadius * 0.3, 0, Math.PI * 2);
                    ctx.fillStyle = board[row][col] === BLACK ? '#fff' : '#000';
                    ctx.fill();
                }
            }
        }
    }
}

function drawHover() {
    if (hoverPos && board[hoverPos.row][hoverPos.col] === EMPTY && !paused && !aiThinking && turn === BLACK) {
        const x = boardX + hoverPos.col * cellSize;
        const y = boardY + hoverPos.row * cellSize;

        ctx.beginPath();
        ctx.arc(x, y, stoneRadius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fill();
    }
}

function drawUI() {

    }
}

function drawGameOver() {
    if (screen !== SCREEN.GAMEOVER) return;

    // Semi-transparent overlay
    ctx.fillStyle = 'rgba(0,0,0,0.85)';
    ctx.fillRect(0, 0, W, H);

    // Game over card
    const cardWidth = 300;
    const cardHeight = 280;
    const cardX = W/2 - cardWidth/2;
    const cardY = H/2 - cardHeight/2 - 20;

    // Card background
    ctx.fillStyle = '#1a1a2e';
    ctx.strokeStyle = '#c49bff';
    ctx.lineWidth = 2;
    roundRect(ctx, cardX, cardY, cardWidth, cardHeight, 12);
    ctx.fill();
    ctx.stroke();

    // Title
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 28px Microsoft YaHei';
    ctx.textAlign = 'center';
    ctx.fillText('游戏结束', W/2, cardY + 45);

    // Result
    ctx.font = '20px Microsoft YaHei';
    if (winner === BLACK) {
        ctx.fillStyle = '#4CAF50';
        ctx.fillText(gameOverReason, W/2, cardY + 85);
    } else if (winner === WHITE) {
        ctx.fillStyle = '#f44336';
        ctx.fillText(gameOverReason, W/2, cardY + 85);
    } else {
        ctx.fillStyle = '#FFC107';
        ctx.fillText(gameOverReason, W/2, cardY + 85);
    }

    // Score breakdown
    ctx.font = '14px Microsoft YaHei';
    ctx.fillStyle = '#aaa';

    const blackTotal = blackTerritory + blackCaptured;
    const whiteTotal = whiteTerritory + whiteCaptured + 6.5;

    ctx.fillText('黑方得分', W/2 - 70, cardY + 125);
    ctx.fillText('白方得分', W/2 + 70, cardY + 125);

    ctx.fillStyle = '#fff';
    ctx.font = '16px Microsoft YaHei';
    ctx.fillText(`领地: ${blackTerritory}`, W/2 - 70, cardY + 150);
    ctx.fillText(`提子: ${blackCaptured}`, W/2 - 70, cardY + 175);
    ctx.fillText(`${blackTotal}`, W/2 - 70, cardY + 205);

    ctx.fillText(`领地: ${whiteTerritory}`, W/2 + 70, cardY + 150);
    ctx.fillText(`提子: ${whiteCaptured}`, W/2 + 70, cardY + 175);
    ctx.fillText(`${whiteTotal}`, W/2 + 70, cardY + 205);

    // Divider
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cardX + 20, cardY + 220);
    ctx.lineTo(cardX + cardWidth - 20, cardY + 220);
    ctx.stroke();

    // Continue prompt
    ctx.fillStyle = '#c49bff';
    ctx.font = '14px Microsoft YaHei';
    ctx.fillText('点击任意位置继续', W/2, cardY + 250);
}

function roundRect(ctx, x, y, width, height, radius) {
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.lineTo(x + width - radius, y);
    ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
    ctx.lineTo(x + width, y + height - radius);
    ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
    ctx.lineTo(x + radius, y + height);
    ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
    ctx.lineTo(x, y + radius);
    ctx.quadraticCurveTo(x, y, x + radius, y);
    ctx.closePath();
}

function gameLoop() {
    drawBoard();
    drawStones();
    drawHover();
    drawUI();
    drawGameOver();
    requestAnimationFrame(gameLoop);
}

<!-- [BATCH-FIX:responsive-js] -->
<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>
<!-- [/BATCH-FIX:responsive-js] -->
<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
