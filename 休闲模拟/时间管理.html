<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>时间管理</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #232526 0%, #414345 100%); min-height: 100vh; overflow: hidden; }
        .game-container { width: 100%; height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 10px; }
        .stat { display: flex; flex-direction: column; align-items: center; color: #fff; }
        .stat-label { font-size: 12px; opacity: 0.8; }
        .stat-value { font-size: 24px; font-weight: bold; }
        .stat-value.score { color: #ffd700; }
        .stat-value.time { color: #4facfe; }
        .stat-value.day { color: #48c78e; }
        
        .game-area { flex: 1; display: flex; gap: 15px; overflow: hidden; }
        
        .stations { flex: 1; display: flex; flex-direction: column; gap: 10px; }
        .station { background: rgba(255,255,255,0.1); border-radius: 15px; padding: 15px; display: flex; flex-direction: column; min-height: 120px; }
        .station-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .station-name { font-weight: bold; color: #fff; font-size: 16px; }
        .station-status { padding: 4px 12px; border-radius: 12px; font-size: 12px; color: #fff; }
        .station-status.idle { background: rgba(100,100,100,0.5); }
        .station-status.working { background: rgba(255, 193, 7, 0.7); }
        .station-status.done { background: rgba(72, 199, 142, 0.7); }
        
        .station-content { flex: 1; display: flex; align-items: center; justify-content: center; }
        .task-icon { font-size: 40px; }
        .task-progress { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; margin-top: 10px; }
        .task-progress-fill { height: 100%; background: linear-gradient(90deg, #ffd700, #ff6b6b); transition: width 0.3s; }
        
        .sidebar { width: 200px; background: rgba(255,255,255,0.1); border-radius: 15px; padding: 15px; display: flex; flex-direction: column; }
        .sidebar-title { color: #fff; font-weight: bold; margin-bottom: 15px; text-align: center; }
        
        .queue { flex: 1; overflow-y: auto; }
        .queue-item { background: rgba(255,255,255,0.1); border-radius: 10px; padding: 10px; margin-bottom: 8px; cursor: pointer; transition: all 0.2s; }
        .queue-item:hover { background: rgba(255,255,255,0.2); }
        .queue-item.selected { border: 2px solid #ffd700; }
        .queue-item-name { color: #fff; font-size: 14px; margin-bottom: 5px; }
        .queue-item-info { color: rgba(255,255,255,0.6); font-size: 11px; }
        
        .controls { display: flex; gap: 10px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
        .btn { padding: 12px 25px; border: none; border-radius: 25px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
        .btn-success { background: linear-gradient(135deg, #48c78e, #10b981); color: #fff; }
        
        .notification { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); color: #fff; padding: 30px 50px; border-radius: 15px; text-align: center; z-index: 100; display: none; }
        .notification.show { display: block; }
        .notification h2 { color: #ffd700; margin-bottom: 15px; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 10px; font-size: 14px; }
    /* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */

<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->

    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">天数</div>
                <div class="stat-value day" id="day">1</div>
            </div>

                <div class="stat-value time" id="timer">60</div>
            </div>
        </div>
        
        <div class="game-area">
            <div class="stations" id="stations"></div>

        <div class="notification" id="notification">
            <h2 id="notifTitle">任务完成！</h2>

  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script src="../game_core.js"></script>
<script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script>
        const TASKS = [
            { name: '咖啡订单', icon: '☕', duration: 5, reward: 30 },
            { name: '汉堡订单', icon: '🍔', duration: 8, reward: 50 },
            { name: '披萨订单', icon: '🍕', duration: 10, reward: 60 },
            { name: '寿司订单', icon: '🍣', duration: 12, reward: 80 },
            { name: '饮料订单', icon: '🥤', duration: 4, reward: 20 },
            { name: '甜点订单', icon: '🍰', duration: 6, reward: 40 },
            { name: '沙拉订单', icon: '🥗', duration: 7, reward: 45 },
            { name: '面条订单', icon: '🍜', duration: 9, reward: 55 }
        ];
        
        let day = 1;
        let score = 0;
        let highScore = parseInt(localStorage.getItem('highscore_时间管理') || '0');
        let timer = 60;
        let timerInterval = null;
        
        let stations = [
            { id: 0, name: '工位 A', task: null, progress: 0, status: 'idle' },
            { id: 1, name: '工位 B', task: null, progress: 0, status: 'idle' },
            { id: 2, name: '工位 C', task: null, progress: 0, status: 'idle' }
        ];
        
        let taskQueue = [];
        let selectedTask = null;
        
        function generateTasks() {
            taskQueue = [];
            const count = 5 + day;
            for (let i = 0; i < count; i++) {
                const task = {...TASKS[Math.floor(Math.random() * TASKS.length)]};
                task.id = Date.now() + i;
                task.remaining = task.duration;
                taskQueue.push(task);
            }
        }
        
        function render() {
            // 渲染工位
            const stationsEl = document.getElementById('stations');
            stationsEl.innerHTML = '';
            
            stations.forEach(station => {
                const el = document.createElement('div');
                el.className = 'station';
                
                const statusClass = station.status;
                el.innerHTML = `
                    <div class="station-header">
                        <span class="station-name">${station.name}</span>
                        <span class="station-status ${statusClass}">
                            ${station.status === 'idle' ? '空闲' : station.status === 'working' ? '工作中' : '完成'}
                        </span>
                    </div>
                    <div class="station-content">
                        ${station.task ? `<div class="task-icon">${station.task.icon}</div>` : '<div class="task-icon">⬜</div>'}
                    </div>
                    ${station.task ? `
                        <div style="color:#fff;text-align:center;margin-top:5px;">${station.task.name}</div>
                        <div class="task-progress">
                            <div class="task-progress-fill" style="width: ${station.progress}%"></div>
                        </div>
                    ` : ''}
                `;
                
                stationsEl.appendChild(el);
            });
            
            // 渲染队列
            const queueEl = document.getElementById('queue');
            queueEl.innerHTML = '';
            
            taskQueue.forEach((task, index) => {
                const el = document.createElement('div');
                el.className = 'queue-item';
                if (selectedTask === index) el.classList.add('selected');
                
                el.innerHTML = `
                    <div class="queue-item-name">${task.icon} ${task.name}</div>
                    <div class="queue-item-info">⏱️ ${task.duration}秒 | 💰 ${task.reward}金币</div>
                `;
                
                el.onclick = () => {
                    selectedTask = index;
                    render();
                };
                
                queueEl.appendChild(el);
            });
        }
        
        function assignTask() {
            if (selectedTask === null) {
                showNotification('请先选择任务！', '⚠️');
                return;
            }
            
            // 找空闲工位
            const idleStation = stations.find(s => s.status === 'idle');
            if (!idleStation) {
                showNotification('没有空闲工位！', '⚠️');
                return;
            }
            
            const task = taskQueue[selectedTask];
            idleStation.task = task;
            idleStation.progress = 0;
            idleStation.status = 'working';
            
            taskQueue.splice(selectedTask, 1);
            selectedTask = null;
            
            render();
        }
        
        function updateStations(deltaTime) {
            let anyComplete = false;
            
            stations.forEach(station => {
                if (station.status === 'working' && station.task) {
                    station.progress += (deltaTime / station.task.duration) * 100;
                    
                    if (station.progress >= 100) {
                        station.progress = 100;
                        station.status = 'done';
                        score += station.task.reward;
                        anyComplete = true;
                        
                        setTimeout(() => {
                            station.task = null;
                            station.progress = 0;
                            station.status = 'idle';
                            render();
                        }, 1000);
                    }
                }
            });
            
            if (anyComplete) {
                updateStats();
            }
        }
        
        function showNotification(text, title = '🎉') {
            const notif = document.getElementById('notification');
            document.getElementById('notifTitle').textContent = title;
            document.getElementById('notifText').textContent = text;
            notif.classList.add('show');
            
            setTimeout(() => notif.classList.remove('show'), 2000);
        }
        
        function updateStats() {
            document.getElementById('day').textContent = day;
            document.getElementById('score').textContent = score;
            document.getElementById('timer').textContent = timer;
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('highscore_时间管理', highScore);
            }
        }
        
        function startDay() {
            timer = 60;
            generateTasks();
            
            // 重置工位
            stations.forEach(s => {
                s.task = null;
                s.progress = 0;
                s.status = 'idle';
            });
            
            render();
            updateStats();
            
            if (timerInterval) clearInterval(timerInterval);
            
            timerInterval = setInterval(() => {
                timer--;
                document.getElementById('timer').textContent = timer;
                
                if (timer > 0) {
                    updateStations(1);
                    render();
                } else {
                    clearInterval(timerInterval);
                    showNotification(`今日结束！\n总收入：${score}`, '📅');
                    
                    setTimeout(() => {
                        day++;
                        updateStats();
                    }, 2000);
                }
            }, 1000);
        }
        
        document.getElementById('btnAssign').onclick = assignTask;
        document.getElementById('btnNextDay').onclick = startDay;
        
        startDay();
        document.getElementById('highScore').textContent = highScore;
    </script>

<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>
<!-- [/BATCH-FIX:responsive-js] -->
<!-- [BATCH-FIX:touch-support] -->
<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>
<!-- [/BATCH-FIX:touch-support] -->

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
