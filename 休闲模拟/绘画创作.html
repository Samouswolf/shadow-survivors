<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>绘画创作</title>
    <script src="game_core.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #ff7675 0%, #d63031 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px;
            background: linear-gradient(135deg, #ff7675, #d63031);
            border-radius: 12px;
        }
        .stat {
            text-align: center;
            color: white;
        }
        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }
        .stat-value {
            font-size: 20px;
            font-weight: bold;
        }
        .canvas-area {
            background: white;
            border-radius: 12px;
            margin-bottom: 15px;
            touch-action: none;
        }
        .canvas {
            width: 100%;
            height: 300px;
            border-radius: 12px;
            cursor: crosshair;
        }
        .tools-area {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .tool-section {
            flex: 1;
            padding: 10px;
            background: #dfe6e9;
            border-radius: 10px;
        }
        .tool-title {
            font-size: 12px;
            color: #636e72;
            margin-bottom: 8px;
        }
        .color-palette {
            display: flex;
            gap: 5px;
        }
        .color-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid white;
            transition: all 0.2s;
        }
        .color-btn:hover {
            transform: scale(1.1);
        }
        .color-btn.selected {
            border: 3px solid #2d3436;
        }
        .brush-sizes {
            display: flex;
            gap: 5px;
            align-items: center;
        }
        .size-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #2d3436;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .size-btn.selected {
            background: #ff7675;
        }
        .size-dot {
            background: white;
            border-radius: 50%;
        }
        .actions-area {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
        }
        .action-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-clear {
            background: #e74c3c;
            color: white;
        }
        .btn-save {
            background: #00b894;
            color: white;
        }
        .btn-undo {
            background: #6c5ce7;
            color: white;
        }
        .action-btn:hover {
            transform: scale(1.05);
        }
        .gallery {
            display: flex;
            gap: 10px;
            padding: 10px;
            background: #dfe6e9;
            border-radius: 10px;
            overflow-x: auto;
        }
        .gallery-item {
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 20px 40px;
            border-radius: 15px;
            font-size: 18px;
            display: none;
            z-index: 100;
            text-align: center;
        }
        .message.show { display: block; }
        .ad-banner {
            width: 100%;
            height: 60px;
            background: linear-gradient(135deg, #ff7675, #d63031);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">作品</div>
                <div class="stat-value" id="artCount">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">笔触</div>
                <div class="stat-value" id="strokes">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">颜色</div>
                <div class="stat-value" id="colorsUsed">0</div>
            </div>
        </div>

        <div class="canvas-area">
            <canvas class="canvas" id="canvas"></canvas>
        </div>

        <div class="tools-area">
            <div class="tool-section">
                <div class="tool-title">颜色</div>
                <div class="color-palette" id="colorPalette"></div>
            </div>
            <div class="tool-section">
                <div class="tool-title">笔刷</div>
                <div class="brush-sizes" id="brushSizes"></div>
            </div>
        </div>

        <div class="actions-area">
            <button class="action-btn btn-undo" id="btnUndo">↩️ 撤销</button>
            <button class="action-btn btn-clear" id="btnClear">🗑️ 清除</button>
            <button class="action-btn btn-save" id="btnSave">💾 保存</button>
        </div>

        <div class="gallery" id="gallery"></div>

        <div class="message" id="message"></div>

        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    <script>
        const COLORS = [
            '#e74c3c', '#f39c12', '#f1c40f', '#2ecc71', '#1abc9c',
            '#3498db', '#9b59b6', '#e84393', '#2d3436', '#ffffff'
        ];

        const BRUSH_SIZES = [5, 10, 15, 20, 30];

        let canvas, ctx;
        let currentColor = COLORS[0];
        let currentSize = BRUSH_SIZES[1];
        let isDrawing = false;
        let strokes = 0;
        let colorsUsed = new Set();
        let artCount = 0;
        let history = [];
        let gallery = [];

        function initCanvas() {
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');

            // 设置画布尺寸
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;

            // 白色背景
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 保存初始状态
            saveHistory();

            // 绑定事件
            canvas.addEventListener('mousedown', startDraw);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', endDraw);
            canvas.addEventListener('mouseleave', endDraw);

            canvas.addEventListener('touchstart', handleTouch);
            canvas.addEventListener('touchmove', handleTouch);
            canvas.addEventListener('touchend', endDraw);

            renderColorPalette();
            renderBrushSizes();
            renderGallery();
        }

        function renderColorPalette() {
            const palette = document.getElementById('colorPalette');
            palette.innerHTML = '';

            COLORS.forEach(color => {
                const btn = document.createElement('div');
                btn.className = 'color-btn' + (currentColor === color ? ' selected' : '');
                btn.style.background = color;
                btn.addEventListener('click', () => selectColor(color));
                palette.appendChild(btn);
            });
        }

        function renderBrushSizes() {
            const sizes = document.getElementById('brushSizes');
            sizes.innerHTML = '';

            BRUSH_SIZES.forEach(size => {
                const btn = document.createElement('div');
                btn.className = 'size-btn' + (currentSize === size ? ' selected' : '');
                const dot = document.createElement('div');
                dot.className = 'size-dot';
                dot.style.width = (size / 3) + 'px';
                dot.style.height = (size / 3) + 'px';
                btn.appendChild(dot);
                btn.addEventListener('click', () => selectSize(size));
                sizes.appendChild(btn);
            });
        }

        function renderGallery() {
            const galleryEl = document.getElementById('gallery');
            galleryEl.innerHTML = '';

            if (gallery.length === 0) {
                galleryEl.innerHTML = '<span style="color: #636e72;">暂无作品</span>';
            } else {
                gallery.forEach(art => {
                    const item = document.createElement('div');
                    item.className = 'gallery-item';
                    const img = document.createElement('img');
                    img.src = art;
                    item.appendChild(img);
                    galleryEl.appendChild(item);
                });
            }
        }

        function selectColor(color) {
            currentColor = color;
            colorsUsed.add(color);
            renderColorPalette();
            updateUI();
        }

        function selectSize(size) {
            currentSize = size;
            renderBrushSizes();
        }

        function startDraw(e) {
            isDrawing = true;
            ctx.beginPath();
            ctx.moveTo(e.offsetX, e.offsetY);
        }

        function draw(e) {
            if (!isDrawing) return;

            ctx.lineTo(e.offsetX, e.offsetY);
            ctx.strokeStyle = currentColor;
            ctx.lineWidth = currentSize;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();

            strokes++;
            updateUI();
        }

        function endDraw() {
            if (isDrawing) {
                isDrawing = false;
                saveHistory();
            }
        }

        function handleTouch(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;

            if (e.type === 'touchstart') {
                isDrawing = true;
                ctx.beginPath();
                ctx.moveTo(x, y);
            } else if (e.type === 'touchmove' && isDrawing) {
                ctx.lineTo(x, y);
                ctx.strokeStyle = currentColor;
                ctx.lineWidth = currentSize;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();
                strokes++;
                updateUI();
            }
        }

        function saveHistory() {
            history.push(canvas.toDataURL());
            if (history.length > 10) history.shift();
        }

        function undo() {
            if (history.length > 1) {
                history.pop();
                const img = new Image();
                img.onload = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0);
                };
                img.src = history[history.length - 1];
                showMessage('撤销成功');
            }
        }

        function clearCanvas() {
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            strokes = 0;
            colorsUsed.clear();
            history = [];
            saveHistory();
            updateUI();
            showMessage('画布已清除');
        }

        function saveArt() {
            const data = canvas.toDataURL();
            gallery.push(data);
            artCount++;
            renderGallery();
            updateUI();
            showMessage('作品已保存！');

            GameCore.highScore.set('paint_game', artCount);
        }

        function updateUI() {
            document.getElementById('artCount').textContent = artCount;
            document.getElementById('strokes').textContent = strokes;
            document.getElementById('colorsUsed').textContent = colorsUsed.size;
        }

        function showMessage(msg) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 1500);
        }

        document.getElementById('btnUndo').addEventListener('click', undo);
        document.getElementById('btnClear').addEventListener('click', clearCanvas);
        document.getElementById('btnSave').addEventListener('click', saveArt);

        // 初始化
        GameCore.init({ highScore: 'paint_game' });
        initCanvas();
    </script>
</body>
</html>
