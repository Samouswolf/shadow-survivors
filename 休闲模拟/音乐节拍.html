<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>音乐节拍</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #2d1b4e 0%, #4a2c7a 50%, #6b3fa0 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; color: #fff; overflow: hidden; }
        
        .game-container { width: 100%; flex: 1; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: #fff; }
        .stats { display: flex; gap: 20px; font-size: 14px; }
        
        .main-area { flex: 1; background: rgba(0,0,0,0.5); border-radius: 15px; overflow: hidden; position: relative; }
        
        .beat-circle { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 200px; height: 200px; border-radius: 50%; border: 4px solid rgba(255,255,255,0.3); }
        
        .beat-ring { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border-radius: 50%; border: 3px solid #ff6b6b; animation: pulse 1s infinite; }
        
        @keyframes pulse {
            0% { width: 50px; height: 50px; opacity: 1; }
            100% { width: 250px; height: 250px; opacity: 0; }
        }
        
        .score-display { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); font-size: 48px; font-weight: bold; color: #ffd700; }
        
        .beat-display { position: absolute; top: 80px; left: 50%; transform: translateX(-50%); font-size: 24px; color: #4ecdc4; }
        
        .actions { display: flex; gap: 10px; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; }
        
        .action-btn { flex: 1; padding: 20px; border: none; border-radius: 10px; font-size: 20px; cursor: pointer; background: rgba(255,255,255,0.2); color: #fff; }
        .action-btn:active { background: rgba(255,255,255,0.4); }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="title">🎶 音乐节拍</div>
            <div class="stats">
                <span>⏱️ 时间: <span id="time">60</span></span>
                <span>⭐ 完美: <span id="perfect">0</span></span>
                <span>✅ 连击: <span id="combo">0</span></span>
            </div>
        </div>
        
        <div class="main-area">
            <div class="score-display" id="score">0</div>
            <div class="beat-display" id="beatText">点击节拍！</div>
            
            <div class="beat-circle"></div>
            <div class="beat-ring" id="beatRing"></div>
        </div>
        
        <div class="actions">
            <button class="action-btn" id="beatBtn" onclick="hitBeat()">🎵 节拍</button>
        </div>
    </div>
    
    <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <script>
        const GAME_NAME = '音乐节拍';
        GameCore.init({ highScore: GAME_NAME });
        
        let score = 0;
        let combo = 0;
        let perfect = 0;
        let timeLeft = 60;
        let gameRunning = true;
        let beatInterval = 800;
        let lastBeat = 0;
        let beatReady = false;
        
        function initGame() {
            updateUI();
            startTimer();
            scheduleBeat();
        }
        
        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('time').textContent = timeLeft;
            document.getElementById('perfect').textContent = perfect;
            document.getElementById('combo').textContent = combo;
            
            GameCore.highScore.set(GAME_NAME, score);
        }
        
        function scheduleBeat() {
            if (!gameRunning) return;
            
            beatReady = true;
            const ring = document.getElementById('beatRing');
            ring.style.animation = 'none';
            ring.offsetHeight;
            ring.style.animation = 'pulse 1s infinite';
            
            setTimeout(() => {
                beatReady = false;
                if (gameRunning) scheduleBeat();
            }, beatInterval);
        }
        
        function startTimer() {
            const timer = setInterval(() => {
                timeLeft--;
                beatInterval = Math.max(400, 800 - (60 - timeLeft) * 5);
                updateUI();
                
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    gameOver();
                }
            }, 1000);
        }
        
        function hitBeat() {
            if (!gameRunning) return;
            
            const now = Date.now();
            
            if (beatReady) {
                const diff = now - lastBeat;
                
                if (diff < 200) {
                    score += 200 * (combo + 1);
                    perfect++;
                    combo++;
                    GameCore.hints.show('PERFECT!');
                } else {
                    score += 100 * (combo + 1);
                    combo++;
                    GameCore.hints.show('GOOD');
                }
                
                beatReady = false;
            } else {
                combo = 0;
                GameCore.hints.show('TOO EARLY/LATE');
            }
            
            lastBeat = now;
            updateUI();
            
            const btn = document.getElementById('beatBtn');
            btn.style.background = 'rgba(255,255,255,0.4)';
            setTimeout(() => btn.style.background = 'rgba(255,255,255,0.2)', 100);
        }
        
        function gameOver() {
            gameRunning = false;
            GameCore.hints.show(`游戏结束！最终得分: ${score}`);
        }
        
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                hitBeat();
            }
        });
        
        initGame();
        GameCore.touch.enableAllButtons();
    </script>
</body>
</html>
