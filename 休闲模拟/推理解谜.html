<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>推理解谜</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; }
        .game-container { padding: 15px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .level-display { color: #ffd700; font-size: 20px; font-weight: bold; }
        .score-display { color: #4ecdc4; font-size: 16px; }
        
        .puzzle-card { background: rgba(255,255,255,0.1); border-radius: 15px; padding: 20px; margin-bottom: 15px; }
        .puzzle-text { color: #fff; font-size: 16px; line-height: 1.8; margin-bottom: 20px; }
        
        .options { display: flex; flex-direction: column; gap: 10px; }
        .option-btn { padding: 15px; background: rgba(74,85,104,0.5); border: 2px solid transparent; border-radius: 12px; color: #fff; font-size: 14px; text-align: left; cursor: pointer; transition: all 0.2s; }
        .option-btn:hover { background: rgba(74,85,104,0.8); }
        .option-btn.selected { border-color: #4ecdc4; }
        .option-btn.correct { border-color: #22c55e; background: rgba(34,197,94,0.2); }
        .option-btn.wrong { border-color: #ef4444; background: rgba(239,68,68,0.2); }
        
        .hint-panel { background: rgba(251,191,36,0.1); border-radius: 15px; padding: 15px; margin-bottom: 15px; display: none; }
        .hint-panel.show { display: block; }
        .hint-text { color: #fbbf24; font-size: 14px; }
        
        .actions { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 15px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-hint { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #fff; }
        .btn-next { background: linear-gradient(135deg, #4ecdc4, #44a08d); color: #fff; display: none; }
        
        .message { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); color: #fff; padding: 20px 40px; border-radius: 15px; font-size: 20px; display: none; z-index: 100; }
        .message.show { display: block; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }
    /* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */
/* [BATCH-FIX:ad-components-css] */
.sponsor-btn{position:fixed;top:44px;right:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:3px 9px;border-radius:10px;font:11px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.sponsor-panel.show{display:flex}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.interstitial-ad.show{display:flex}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* [/BATCH-FIX:ad-components-css] */
</style>
</head>
<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="level-display">📝 第 <span id="level">1</span> 关</div>
            <div class="score-display">⭐ <span id="score">0</span></div>
        </div>
        
        <div class="puzzle-card">
            <div class="puzzle-text" id="puzzleText"></div>
        </div>
        
        <div class="options" id="options"></div>
        
        <div class="hint-panel" id="hintPanel">
            <div class="hint-text" id="hintText"></div>
        </div>
        
        <div class="actions">
            <button class="btn btn-hint" id="btnHint">💡 提示</button>
            <button class="btn btn-next" id="btnNext">➡️ 下一关</button>
        </div>
        
        <div class="message" id="message"></div>
        
        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script>
        const PUZZLES = [
            {
                text: '有一天，甲、乙、丙三人在一起聊天。甲说："我从来不说假话。"乙说："甲在说谎。"丙说："甲和乙都在说谎。"请问谁在说真话？',
                options: ['甲', '乙', '丙', '没有人'],
                answer: 1,
                hint: '如果甲说的是真话，那么乙就在说谎，丙也在说谎...'
            },
            {
                text: '一个房间里有四盏灯，房间外有四个开关，每个开关对应一盏灯。你只能进入房间一次，如何确定每个开关对应哪盏灯？',
                options: ['随便开一个', '先开两个，等几分钟再开一个', '全部打开', '无法确定'],
                answer: 1,
                hint: '灯不仅会发光，还会发热...'
            },
            {
                text: '一只蜗牛从井底往上爬，白天爬3米，晚上下滑2米。井深10米，请问蜗牛几天能爬出井口？',
                options: ['10天', '8天', '7天', '9天'],
                answer: 2,
                hint: '最后一天爬出井口后就不会下滑了...'
            },
            {
                text: '有两根一样的蜡烛，一根能烧4小时，另一根能烧3小时。同时点燃，什么时候一根是另一根的两倍长？',
                options: ['2小时', '1.5小时', '1.2小时', '2.4小时'],
                answer: 3,
                hint: '设时间为x小时，蜡烛长度为1，燃烧速度分别为1/4和1/3...'
            },
            {
                text: '三个人去住旅馆，每人交10元，共30元。老板优惠后收25元，让服务员退5元。服务员私吞2元，退给每人1元。现在每人花了9元，共27元，加上服务员的2元是29元，那1元去哪了？',
                options: ['老板拿走了', '服务员藏了', '计算错误', '不存在'],
                answer: 2,
                hint: '27元已经包含了服务员私吞的2元，应该加上退给每人的1元...'
            },
            {
                text: '一个人带着一只狼、一只羊和一棵白菜过河。小船只能载一人一物。狼会吃羊，羊会吃白菜。如何安全过河？',
                options: ['先带狼', '先带白菜', '先带羊', '无法过河'],
                answer: 2,
                hint: '先带中间的那个...'
            },
            {
                text: '有12个球，其中一个质量不同（可能更重或更轻）。用天平称3次，如何找出这个球？',
                options: ['分3组各4个', '分2组各6个', '分4组各3个', '无法做到'],
                answer: 0,
                hint: '第一次称4个对4个，如果平衡就在剩下的4个里...'
            },
            {
                text: '一位父亲对儿子说："我像你这么大时，你才4岁；你像我这么大时，我就79岁了。"请问父子现在各多少岁？',
                options: ['父54子29', '父56子30', '父52子28', '父58子31'],
                answer: 0,
                hint: '设年龄差为x，儿子现在x+4岁，父亲现在2x+4岁...'
            },
            {
                text: '一个人在沙漠中迷路，有两个瓶子，一个装5升水，一个装3升水。如何精确量出4升水？',
                options: ['无法做到', '装满5升倒入3升剩2升', '装满3升倒入5升两次', '装满5升倒空3升'],
                answer: 2,
                hint: '装满3升倒入5升，再装满3升倒入5升，3升瓶剩1升...'
            },
            {
                text: 'ABC三人中只有一人会开车。A说："我会开车。"B说："我不会开车。"C说："A不会开车。"如果只有一人说真话，谁会开车？',
                options: ['A', 'B', 'C', '无法确定'],
                answer: 1,
                hint: '如果A说真话，C就在说谎，但这样B也在说真话...'
            }
        ];
        
        let currentLevel = 0;
        let score = 0;
        let hasAnswered = false;
        
        function loadData() {
            const saved = GameCore.storage.get('logic_puzzle_data', null);
            if (saved) {
                currentLevel = saved.level;
                score = saved.score;
            }
            showPuzzle();
        }
        
        function saveData() {
            GameCore.storage.set('logic_puzzle_data', { level: currentLevel, score: score });
        }
        
        function showPuzzle() {
            const puzzle = PUZZLES[currentLevel];
            document.getElementById('level').textContent = currentLevel + 1;
            document.getElementById('score').textContent = score;
            document.getElementById('puzzleText').textContent = puzzle.text;
            document.getElementById('hintPanel').classList.remove('show');
            document.getElementById('btnNext').style.display = 'none';
            hasAnswered = false;
            
            const optionsEl = document.getElementById('options');
            optionsEl.innerHTML = '';
            
            puzzle.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.onclick = () => selectOption(index);
                optionsEl.appendChild(btn);
            });
        }
        
        function selectOption(index) {
            if (hasAnswered) return;
            hasAnswered = true;
            
            const puzzle = PUZZLES[currentLevel];
            const buttons = document.querySelectorAll('.option-btn');
            
            buttons.forEach((btn, i) => {
                if (i === puzzle.answer) {
                    btn.classList.add('correct');
                } else if (i === index) {
                    btn.classList.add('wrong');
                }
                btn.disabled = true;
            });
            
            if (index === puzzle.answer) {
                score += 10;
                showMessage('✅ 回答正确！+10分');
            } else {
                showMessage('❌ 回答错误');
            }
            
            document.getElementById('btnNext').style.display = 'block';
            saveData();
        }
        
        function showHint() {
            const puzzle = PUZZLES[currentLevel];
            document.getElementById('hintText').textContent = puzzle.hint;
            document.getElementById('hintPanel').classList.add('show');
        }
        
        function nextLevel() {
            currentLevel++;
            if (currentLevel >= PUZZLES.length) {
                showMessage('🎉 恭喜通关！');
                setTimeout(() => {
                    currentLevel = 0;
                    score = 0;
                    saveData();
                    showPuzzle();
                }, 2000);
            } else {
                showPuzzle();
                saveData();
            }
        }
        
        function showMessage(msg) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 2000);
        }
        
        document.getElementById('btnHint').addEventListener('click', showHint);
        document.getElementById('btnNext').addEventListener('click', nextLevel);
        
        GameCore.init({ highScore: 'logic_puzzle' });
        loadData();
    </script>
<!-- [BATCH-FIX:responsive-js] -->
<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>
<!-- [/BATCH-FIX:responsive-js] -->
<!-- [BATCH-FIX:touch-support] -->
<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>
<!-- [/BATCH-FIX:touch-support] -->

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
