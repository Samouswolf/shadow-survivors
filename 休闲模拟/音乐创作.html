<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>音乐创作</title>
    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #00cec9 0%, #00b894 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px;
            background: linear-gradient(135deg, #00cec9, #00b894);
            border-radius: 12px;
        }
        .stat {
            text-align: center;
            color: white;
        }
        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }
        .stat-value {
            font-size: 20px;
            font-weight: bold;
        }
        .sequencer {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 5px;
            margin-bottom: 15px;
            padding: 15px;
            background: #dfe6e9;
            border-radius: 12px;
        }
        .note-cell {
            height: 40px;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        .note-cell:hover {
            background: #e0f7fa;
        }
        .note-cell.active {
            background: #00b894;
            color: white;
        }
        .note-cell.playing {
            animation: pulse 0.2s;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .instruments {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .instrument {
            flex: 1;
            padding: 15px;
            background: white;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            border: 2px solid #dfe6e9;
            transition: all 0.2s;
        }
        .instrument:hover {
            border-color: #00b894;
        }
        .instrument.selected {
            border-color: #00b894;
            background: #e0f7fa;
        }
        .instrument-icon {
            font-size: 30px;
        }
        .instrument-name {
            font-size: 12px;
            color: #636e72;
        }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
        }
        .ctrl-btn {
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-play {
            background: #00b894;
            color: white;
        }
        .btn-stop {
            background: #e74c3c;
            color: white;
        }
        .btn-clear {
            background: #6c5ce7;
            color: white;
        }
        .ctrl-btn:hover {
            transform: scale(1.05);
        }
        .tempo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
        }
        .tempo-label {
            font-size: 14px;
            color: #2d3436;
        }
        .tempo-slider {
            width: 150px;
        }
        .tempo-value {
            font-size: 14px;
            color: #00b894;
            font-weight: bold;
        }
        .compositions {
            padding: 10px;
            background: #dfe6e9;
            border-radius: 10px;
        }
        .comp-title {
            font-size: 14px;
            color: #636e72;
            margin-bottom: 10px;
        }
        .comp-list {
            display: flex;
            gap: 5px;
        }
        .comp-item {
            padding: 8px 15px;
            background: white;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        .comp-item:hover {
            background: #00b894;
            color: white;
        }
        .message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 20px 40px;
            border-radius: 15px;
            font-size: 18px;
            display: none;
            z-index: 100;
            text-align: center;
        }
        .message.show { display: block; }
        .ad-banner {
            width: 100%;
            height: 60px;
            background: linear-gradient(135deg, #00cec9, #00b894);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">作品</div>
                <div class="stat-value" id="compCount">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">音符</div>
                <div class="stat-value" id="noteCount">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">节奏</div>
                <div class="stat-value" id="tempo">120</div>
            </div>
        </div>

        <div class="instruments" id="instruments"></div>

        <div class="sequencer" id="sequencer"></div>

        <div class="tempo-area">
            <span class="tempo-label">速度:</span>
            <input type="range" class="tempo-slider" id="tempoSlider" min="60" max="180" value="120">
            <span class="tempo-value" id="tempoValue">120 BPM</span>
        </div>

        <div class="controls">
            <button class="ctrl-btn btn-play" id="btnPlay">▶️ 播放</button>
            <button class="ctrl-btn btn-stop" id="btnStop">⏹️ 停止</button>
            <button class="ctrl-btn btn-clear" id="btnClear">🗑️ 清除</button>
        </div>

        <div class="compositions">
            <div class="comp-title">保存的作品：</div>
            <div class="comp-list" id="compList"></div>
        </div>

        <div class="message" id="message"></div>

        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    <script>
        const INSTRUMENTS = [
            { name: '钢琴', icon: '🎹', freqs: [262, 294, 330, 349, 392, 440, 494, 523] },
            { name: '吉他', icon: '🎸', freqs: [196, 220, 247, 262, 294, 330, 349, 392] },
            { name: '鼓', icon: '🥁', freqs: [100, 150, 200, 100, 150, 200, 100, 150] },
            { name: '小提琴', icon: '🎻', freqs: [294, 330, 349, 392, 440, 494, 523, 587] }
        ];

        const NOTE_NAMES = ['C', 'D', 'E', 'F', 'G', 'A', 'B', 'C+'];

        let audioCtx = null;
        let selectedInstrument = INSTRUMENTS[0];
        let sequence = [false, false, false, false, false, false, false, false];
        let tempo = 120;
        let isPlaying = false;
        let playInterval = null;
        let currentStep = 0;
        let compCount = 0;
        let noteCount = 0;
        let compositions = [];

        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function renderInstruments() {
            const el = document.getElementById('instruments');
            el.innerHTML = '';

            INSTRUMENTS.forEach(inst => {
                const div = document.createElement('div');
                div.className = 'instrument' + (selectedInstrument.name === inst.name ? ' selected' : '');
                div.innerHTML = `
                    <div class="instrument-icon">${inst.icon}</div>
                    <div class="instrument-name">${inst.name}</div>
                `;
                div.addEventListener('click', () => selectInstrument(inst));
                el.appendChild(div);
            });
        }

        function renderSequencer() {
            const el = document.getElementById('sequencer');
            el.innerHTML = '';

            sequence.forEach((active, i) => {
                const cell = document.createElement('div');
                cell.className = 'note-cell' + (active ? ' active' : '');
                cell.textContent = NOTE_NAMES[i];
                cell.addEventListener('click', () => toggleNote(i));
                el.appendChild(cell);
            });
        }

        function selectInstrument(inst) {
            selectedInstrument = inst;
            renderInstruments();
        }

        function toggleNote(index) {
            sequence[index] = !sequence[index];
            if (sequence[index]) {
                noteCount++;
                playNote(index);
            }
            renderSequencer();
            updateUI();
        }

        function playNote(index) {
            if (!audioCtx) initAudio();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.frequency.value = selectedInstrument.freqs[index];
            osc.type = selectedInstrument.name === '鼓' ? 'triangle' : 'sine';

            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function playSequence() {
            if (!audioCtx) initAudio();
            if (isPlaying) return;

            isPlaying = true;
            currentStep = 0;

            const interval = (60 / tempo) * 1000 / 2;

            playInterval = setInterval(() => {
                // 高亮当前步骤
                const cells = document.querySelectorAll('.note-cell');
                cells.forEach(c => c.classList.remove('playing'));
                cells[currentStep].classList.add('playing');

                if (sequence[currentStep]) {
                    playNote(currentStep);
                }

                currentStep++;
                if (currentStep >= 8) currentStep = 0;
            }, interval);
        }

        function stopSequence() {
            isPlaying = false;
            if (playInterval) clearInterval(playInterval);

            const cells = document.querySelectorAll('.note-cell');
            cells.forEach(c => c.classList.remove('playing'));
        }

        function clearSequence() {
            sequence = [false, false, false, false, false, false, false, false];
            noteCount = 0;
            renderSequencer();
            updateUI();
            showMessage('已清除');
        }

        function saveComposition() {
            if (noteCount === 0) {
                showMessage('请先创作音乐！');
                return;
            }

            const comp = {
                sequence: [...sequence],
                instrument: selectedInstrument.name,
                tempo: tempo
            };
            compositions.push(comp);
            compCount++;
            renderCompositions();
            updateUI();
            showMessage('作品已保存！');

            GameCore.highScore.set('music_game', compCount);
        }

        function renderCompositions() {
            const el = document.getElementById('compList');
            el.innerHTML = '';

            if (compositions.length === 0) {
                el.innerHTML = '<span style="color: #636e72;">暂无作品</span>';
            } else {
                compositions.forEach((comp, i) => {
                    const item = document.createElement('div');
                    item.className = 'comp-item';
                    item.textContent = '作品' + (i + 1);
                    item.addEventListener('click', () => loadComposition(i));
                    el.appendChild(item);
                });
            }
        }

        function loadComposition(index) {
            const comp = compositions[index];
            sequence = [...comp.sequence];
            selectedInstrument = INSTRUMENTS.find(i => i.name === comp.instrument);
            tempo = comp.tempo;
            document.getElementById('tempoSlider').value = tempo;
            renderInstruments();
            renderSequencer();
            updateUI();
            showMessage('已加载作品' + (index + 1));
        }

        function updateUI() {
            document.getElementById('compCount').textContent = compCount;
            document.getElementById('noteCount').textContent = noteCount;
            document.getElementById('tempo').textContent = tempo;
            document.getElementById('tempoValue').textContent = tempo + ' BPM';
        }

        function showMessage(msg) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 1500);
        }

        document.getElementById('tempoSlider').addEventListener('input', (e) => {
            tempo = parseInt(e.target.value);
            updateUI();
            if (isPlaying) {
                stopSequence();
                playSequence();
            }
        });

        document.getElementById('btnPlay').addEventListener('click', playSequence);
        document.getElementById('btnStop').addEventListener('click', stopSequence);
        document.getElementById('btnClear').addEventListener('click', clearSequence);

        // 双击保存
        document.getElementById('btnPlay').addEventListener('dblclick', saveComposition);

        // 初始化
        GameCore.init({ highScore: 'music_game' });
        renderInstruments();
        renderSequencer();
        renderCompositions();
        updateUI();
    </script>
</body>
</html>
