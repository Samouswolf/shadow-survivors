(function(){
'use strict';

// ==================== Constants ====================
const c = document.getElementById('gc'), ctx = c.getContext('2d');
const COLS = 8, ROWS = 4;
const RANK_NAMES = {7:'将',6:'士',5:'象',4:'車',3:'馬',2:'砲',1:'卒'};
const RANK_VALUES = {7:1000,4:500,3:300,2:300,5:200,6:150,1:100};
const PIECE_COUNTS = {7:1,6:2,5:2,4:2,3:2,2:2,1:5};
const SCREEN = {MENU:0,DIFFICULTY:1,PLAYING:2,GAMEOVER:3,STATS:4,SETTINGS:5};

let W,H,T;
let screen = SCREEN.MENU;
let menuCircles = [];
let woodGrainCache = {};
let difficulty = 1; // 0=简单,1=普通,2=困难
let isVsAI = true;

// ---- Game State ----
let board = [];
let turn = 'r';
let winner = null;
let moves = 0;
let selected = null; // {row, col}
let validMoves = []; // [{row,col,type:'move'|'eat'}]
let msg = '';
let msgTimer = 0;
let gameStartTime = 0;
let redEaten = 0, blackEaten = 0;
let isAnimating = false;

// ---- Animation State ----
let flipAnim = null; // {row,col,piece,progress,dir}
let moveAnim = null; // {fromRow,fromCol,toRow,toCol,piece,progress}
let eatParticles = []; // [{x,y,vx,vy,life,maxLife,color,size}]
let postAnimCallback = null;

// ---- Timer ----
let turnTimer = 30;

// ---- Pending Timers (for cleanup) ----
let pendingTimers = [];

// ---- Settings ----
let soundEnabled = true;

// ==================== Canvas Setup ====================
function resize() {
  const m = Math.min(window.innerWidth, window.innerHeight);
  const ratio = COLS / ROWS;
  let w = m * 0.95, h = w / ratio;
  if (h > m * 0.85) { h = m * 0.85; w = h * ratio; }
  W = Math.floor(w); H = Math.floor(h); T = Math.floor(W / COLS);
  c.width = W; c.height = H;
  c.style.width = W + 'px'; c.style.height = H + 'px';
  generateMenuCircles();
  generateWoodGrainCache();
}
window.addEventListener('resize', resize);
resize();

// ==================== Sound System ====================
const SFX = {
  _ctx: null,
  get ctx() {
    if (!this._ctx) {
      try { this._ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
    return this._ctx;
  },
  _resume() {
    const a = this._ctx;
    if (a && a.state === 'suspended') a.resume();
  },
  play(type) {
    if (!soundEnabled) return;
    const ctx = this.ctx;
    if (!ctx) return;
    this._resume();
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    switch (type) {
      case 'flip': {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(80, now);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
        osc.start(now); osc.stop(now + 0.06);
        break;
      }
      case 'eat': {
        osc.type = 'square';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.25);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.start(now); osc.stop(now + 0.25);
        break;
      }
      case 'move': {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, now);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
        osc.start(now); osc.stop(now + 0.03);
        break;
      }
      case 'select': {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, now);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        osc.start(now); osc.stop(now + 0.05);
        break;
      }
      case 'victory': {
        const notes = [261.63,329.63,392.0,523.25];
        notes.forEach((f,i) => {
          const o=ctx.createOscillator(), g=ctx.createGain();
          o.type='sine'; o.frequency.setValueAtTime(f,now+i*0.12);
          g.gain.setValueAtTime(0.12,now+i*0.12);
          g.gain.exponentialRampToValueAtTime(0.001,now+i*0.12+0.2);
          o.connect(g); g.connect(ctx.destination);
          o.start(now+i*0.12); o.stop(now+i*0.12+0.2);
        });
        return;
      }
      case 'defeat': {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(200, now + 0.6);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
        osc.start(now); osc.stop(now + 0.6);
        break;
      }
      case 'invalid': {
        osc.type = 'square';
        osc.frequency.setValueAtTime(100, now);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
        break;
      }
      case 'aiHint': {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(660, now);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
        osc.start(now); osc.stop(now + 0.03);
        break;
      }
    }
  }
};

// ==================== Board & Pieces ====================
function createPieces() {
  const p = [];
  for (const col of ['r','b']) {
    for (let r = 7; r >= 1; r--) {
      for (let i = 0; i < PIECE_COUNTS[r]; i++) {
        p.push({rank:r,color:col,flipped:false});
      }
    }
  }
  return p;
}

function shuffle(a) {
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function getFlippedPieces(color) {
  const res = [];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const p = board[r][c];
      if (p && p.flipped && p.color === color) res.push({piece:p,row:r,col:c});
    }
  }
  return res;
}

function getUnflippedPieces() {
  const res = [];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const p = board[r][c];
      if (p && !p.flipped) res.push({piece:p,row:r,col:c});
    }
  }
  return res;
}

function countPlayerPieces(color) {
  let n = 0;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const p = board[r][c];
      if (p && p.color === color) n++;
    }
  }
  return n;
}

// ==================== Movement System ====================
function canEat(attacker, defender) {
  if (attacker.color === defender.color) return false;
  // 卒(1) eats 将(7)
  if (attacker.rank === 1 && defender.rank === 7) return true;
  if (defender.rank === 1 && attacker.rank === 7) return false;
  return attacker.rank >= defender.rank;
}

function getValidMoves(bd, row, col) {
  const piece = bd[row][col];
  if (!piece || !piece.flipped) return [];
  const results = [];
  switch (piece.rank) {
    case 4: getLineMoves(bd,row,col,piece,results); break;
    case 2: getCannonMoves(bd,row,col,piece,results); break;
    default: getAdjMoves(bd,row,col,piece,results); break;
  }
  return results;
}

function getLineMoves(bd,row,col,piece,res) {
  const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
  for (const [dr,dc] of dirs) {
    let r = row+dr, c = col+dc;
    while (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
      const t = bd[r][c];
      if (!t) {
        res.push({row:r,col:c,type:'move'});
      } else if (t.flipped) {
        if (t.color !== piece.color && canEat(piece,t)) res.push({row:r,col:c,type:'eat'});
        break;
      } else {
        break;
      }
      r += dr; c += dc;
    }
  }
}

function getCannonMoves(bd,row,col,piece,res) {
  const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
  for (const [dr,dc] of dirs) {
    // Move phase: straight line, stop at any piece
    let r = row+dr, c = col+dc;
    while (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
      const t = bd[r][c];
      if (!t) { res.push({row:r,col:c,type:'move'}); }
      else { break; }
      r += dr; c += dc;
    }
    // Eat phase: need a screen piece
    r = row+dr; c = col+dc;
    let foundScreen = false;
    while (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
      const t = bd[r][c];
      if (!foundScreen) {
        if (t) foundScreen = true;
      } else {
        if (t) {
          if (t.flipped && t.color !== piece.color && canEat(piece,t)) {
            res.push({row:r,col:c,type:'eat'});
          }
          break;
        }
      }
      r += dr; c += dc;
    }
  }
}

function getAdjMoves(bd,row,col,piece,res) {
  const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
  for (const [dr,dc] of dirs) {
    const r = row+dr, c = col+dc;
    if (r < 0 || r >= ROWS || c < 0 || c >= COLS) continue;
    const t = bd[r][c];
    if (!t) {
      res.push({row:r,col:c,type:'move'});
    } else if (t.flipped && t.color !== piece.color && canEat(piece,t)) {
      res.push({row:r,col:c,type:'eat'});
    }
  }
}

// ==================== Game Actions ====================
function initGame() {
  const p = createPieces();
  shuffle(p);
  board = Array.from({length:ROWS},()=>Array(COLS).fill(null));
  let idx = 0;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      board[r][c] = p[idx]; idx++;
    }
  }
  turn = 'r';
  // Clear any pending AI timers
  for (const tid of pendingTimers) clearTimeout(tid);
  pendingTimers = [];

  winner = null;
  moves = 0;
  selected = null;
  validMoves = [];
  msg = '红方先手 - 翻牌或走棋';
  msgTimer = 120;
  gameStartTime = Date.now();
  redEaten = 0;
  blackEaten = 0;
  isAnimating = false;
  flipAnim = null;
  moveAnim = null;
  eatParticles = [];
  postAnimCallback = null;
  turnTimer = 30;
  timerAccum = 0;
}

function switchTurn() {
  turn = turn === 'r' ? 'b' : 'r';
  selected = null;
  validMoves = [];
  turnTimer = 30;
  const opp = turn === 'r' ? '红方' : '黑方';
  msg = opp + '回合';
  msgTimer = 90;

  // Check if current player has any pieces
  if (countPlayerPieces(turn) === 0) {
    winner = turn === 'r' ? 'b' : 'r';
    msg = winner === 'r' ? '🎉 红方胜利！' : '🎉 黑方胜利！';
    msgTimer = 9999;
    endGame(winner);
    return;
  }

  if (isVsAI && turn === 'b') {
    const tid = setTimeout(() => { if (!winner && screen === SCREEN.PLAYING) aiTurn(); }, 400);
    pendingTimers.push(tid);
  }
}

function endGame(w) {
  winner = w;
  selected = null;
  validMoves = [];
  const endTid = setTimeout(() => {
    screen = SCREEN.GAMEOVER;
    const won = (isVsAI && w === 'r') || (!isVsAI && w === 'r');
    saveGameResult(won);
    if (won) SFX.play('victory');
    else SFX.play('defeat');
  }, 600);
  pendingTimers.push(endTid);
}

function handleFlip(row, col) {
  if (winner || isAnimating) return;
  const p = board[row][col];
  if (!p || p.flipped) return;
  isAnimating = true;
  flipAnim = {row,col,piece:p,progress:0,dir:1};
}

function completeFlip(row, col) {
  SFX.play('flip');
  moves++;
  const p = board[row][col];
  p.flipped = true;

  if (p.color === turn) {
    msg = '翻出己方 ' + RANK_NAMES[p.rank] + '，换手';
  } else {
    msg = '翻出对方 ' + RANK_NAMES[p.rank] + '，换手';
  }
  msgTimer = 90;
  isAnimating = false;
  switchTurn();
}

function executeMove(fromRow, fromCol, toRow, toCol) {
  if (winner || isAnimating) return;
  const piece = board[fromRow][fromCol];
  if (!piece) return;
  isAnimating = true;

  // Update board
  board[toRow][toCol] = piece;
  board[fromRow][fromCol] = null;

  // Start move animation
  moveAnim = {
    fromRow, fromCol, toRow, toCol,
    piece: {rank:piece.rank,color:piece.color,flipped:true},
    progress: 0
  };

  postAnimCallback = () => {
    SFX.play('move');
    moves++;
    isAnimating = false;
    switchTurn();
  };
}

function executeEat(fromRow, fromCol, toRow, toCol) {
  if (winner || isAnimating) return;
  const piece = board[fromRow][fromCol];
  const target = board[toRow][toCol];
  if (!piece || !target) return;
  isAnimating = true;

  // Track eaten piece
  if (target.color === 'r') redEaten++;
  else blackEaten++;

  // Check if 将 captured
  const capturedGeneral = (target.rank === 7);

  // Move piece to target position
  board[toRow][toCol] = piece;
  board[fromRow][fromCol] = null;

  // Start eat animation
  moveAnim = {
    fromRow, fromCol, toRow, toCol,
    piece: {rank:piece.rank,color:piece.color,flipped:true},
    progress: 0
  };

  // Create eat particles at target
  const cx = toCol * T + T/2;
  const cy = toRow * T + T/2;
  for (let i = 0; i < 12; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 4;
    eatParticles.push({
      x: cx, y: cy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      maxLife: 0.3 + Math.random() * 0.4,
      color: target.color === 'r' ? `hsl(${10+Math.random()*20},100%,50%)` : `hsl(${220+Math.random()*20},100%,50%)`,
      size: 3 + Math.random() * 5
    });
  }

  postAnimCallback = () => {
    SFX.play('eat');
    moves++;

    if (capturedGeneral) {
      winner = turn;
      msg = turn === 'r' ? '🎉 红方胜利！' : '🎉 黑方胜利！';
      msgTimer = 9999;
      isAnimating = false;
      selected = null; validMoves = [];
      endGame(turn);
      return;
    }

    // Check if opponent has any pieces left
    const opp = turn === 'r' ? 'b' : 'r';
    if (countPlayerPieces(opp) === 0) {
      winner = turn;
      msg = turn === 'r' ? '🎉 红方胜利！' : '🎉 黑方胜利！';
      msgTimer = 9999;
      isAnimating = false;
      selected = null; validMoves = [];
      endGame(turn);
      return;
    }

    msg = turn === 'r' ? '红方继续行动' : '黑方继续行动';
    msgTimer = 60;
    isAnimating = false;

    // Player keeps turn after eating
    selected = null;
    validMoves = [];
    turnTimer = 30; // 重置倒计时
    timerAccum = 0;

    // AI continues its turn after eating
    if (isVsAI && turn === 'b') {
      const tid = setTimeout(() => { if (!winner && screen === SCREEN.PLAYING && !isAnimating) aiTurn(); }, 300);
      pendingTimers.push(tid);
    }
  };
}

function handleSelect(row, col) {
  if (winner || isAnimating) return;
  const p = board[row][col];
  if (!p || !p.flipped || p.color !== turn) return;

  if (selected && selected.row === row && selected.col === col) {
    selected = null;
    validMoves = [];
    return;
  }

  selected = {row, col};
  validMoves = getValidMoves(board, row, col);
  SFX.play('select');
  msg = RANK_NAMES[p.rank] + ' 已选中';
  msgTimer = 60;
}

// ==================== AI System ====================
function aiTurn() {
  if (winner || screen !== SCREEN.PLAYING || isAnimating) return;
  SFX.play('aiHint');
  let action = null;

  switch (difficulty) {
    case 0: action = aiSimple(); break;
    case 1: action = aiNormal(); break;
    case 2: action = aiHard(); break;
  }

  if (!action) {
    // Flip a random unflipped piece
    const u = getUnflippedPieces();
    if (u.length > 0) {
      const pick = u[Math.floor(Math.random() * u.length)];
      action = {type:'flip',row:pick.row,col:pick.col};
    }
  }

  if (action) {
    switch (action.type) {
      case 'flip': handleFlip(action.row,action.col); break;
      case 'move':
      case 'eat':
        selected = {row:action.fromRow,col:action.fromCol};
        if (action.type === 'eat') executeEat(action.fromRow,action.fromCol,action.toRow,action.toCol);
        else executeMove(action.fromRow,action.fromCol,action.toRow,action.toCol);
        break;
    }
  }
}

function aiSimple() {
  const pieces = getFlippedPieces('b');
  shuffle(pieces);

  for (const fp of pieces) {
    const mv = getValidMoves(board, fp.row, fp.col);
    const eats = mv.filter(m => m.type === 'eat');
    if (eats.length > 0) {
      eats.sort((a,b) => {
        const pa = board[a.row][a.col], pb = board[b.row][b.col];
        return (pb ? pb.rank : 0) - (pa ? pa.rank : 0);
      });
      return {type:'eat',fromRow:fp.row,fromCol:fp.col,toRow:eats[0].row,toCol:eats[0].col};
    }
  }

  for (const fp of pieces) {
    const mv = getValidMoves(board, fp.row, fp.col);
    const mov = mv.filter(m => m.type === 'move');
    if (mov.length > 0) {
      const m = mov[Math.floor(Math.random() * mov.length)];
      return {type:'move',fromRow:fp.row,fromCol:fp.col,toRow:m.row,toCol:m.col};
    }
  }
  return null;
}

function aiNormal() {
  const pieces = getFlippedPieces('b');
  let bestScore = -999999, bestAction = null;

  for (const fp of pieces) {
    const mv = getValidMoves(board, fp.row, fp.col);
    for (const m of mv) {
      let score = 0;
      if (m.type === 'eat') {
        const t = board[m.row][m.col];
        score = (RANK_VALUES[t.rank] || 0) * 10;
        const sim = simulateBoard(board, fp.row, fp.col, m.row, m.col);
        if (!isPosThreatened(sim, m.row, m.col, 'b')) score += 30;
        else score -= 20;
      } else {
        score = 1;
        const cd = Math.abs(m.col-3.5) + Math.abs(m.row-1.5);
        score += (4 - cd) * 2;
        if (m.row > fp.row) score += 3;
        const sim = simulateBoard(board, fp.row, fp.col, m.row, m.col);
        if (isPosThreatened(sim, m.row, m.col, 'b')) score -= 15;
      }
      if (score > bestScore) { bestScore = score; bestAction = {type:m.type,fromRow:fp.row,fromCol:fp.col,toRow:m.row,toCol:m.col}; }
    }
  }

  if (!bestAction || bestScore < 50) {
    const u = getUnflippedPieces();
    if (u.length > 0) {
      let bestU = null, bestUS = -999;
      for (const uu of u) {
        const n = nearbyOwn(uu.row,uu.col,'b');
        const s = 20 + n * 10 + Math.random() * 15;
        if (s > bestUS) { bestUS = s; bestU = uu; }
      }
      if (bestUS > bestScore) bestAction = {type:'flip',row:bestU.row,col:bestU.col};
    }
  }
  return bestAction;
}

function aiHard() {
  const pieces = getFlippedPieces('b');
  let bestScore = -999999, bestAction = null;

  for (const fp of pieces) {
    const mv = getValidMoves(board, fp.row, fp.col);
    for (const m of mv) {
      let score = 0;
      if (m.type === 'eat') {
        const t = board[m.row][m.col];
        score = (RANK_VALUES[t.rank] || 0) * 10;
        if (t.rank === 7) score += 5000;
        const sim = simulateBoard(board, fp.row, fp.col, m.row, m.col);
        if (!isPosThreatened(sim, m.row, m.col, 'b')) score += 50;
        else score -= (RANK_VALUES[fp.piece.rank] || 100);
        // Evaluate opponent's best response
        const oppScore = evaluateOpponentBest(sim, 'b');
        score -= oppScore * 0.5;
      } else {
        score = 5;
        const cd = Math.abs(m.col-3.5) + Math.abs(m.row-1.5);
        score += (4 - cd) * 3;
        if (m.row > fp.row) score += 5;
        const sim = simulateBoard(board, fp.row, fp.col, m.row, m.col);
        if (isPosThreatened(sim, m.row, m.col, 'b')) score -= 25;
        // Check if this move enables new attacks
        const newMoves = getValidMoves(sim, m.row, m.col);
        score += newMoves.filter(nm => nm.type === 'eat').length * 15;
      }
      if (score > bestScore) { bestScore = score; bestAction = {type:m.type,fromRow:fp.row,fromCol:fp.col,toRow:m.row,toCol:m.col}; }
    }
  }

  // Smart flip decision
  if (!bestAction || bestScore < 40) {
    const u = getUnflippedPieces();
    if (u.length > 0) {
      let bestU = null, bestUS = -999;
      for (const uu of u) {
        const n = nearbyOwn(uu.row,uu.col,'b');
        const enemy = nearbyEnemy(uu.row,uu.col,'b');
        const s = 25 + n * 12 - enemy * 8 + Math.random() * 10;
        if (s > bestUS) { bestUS = s; bestU = uu; }
      }
      if (bestUS > bestScore) bestAction = {type:'flip',row:bestU.row,col:bestU.col};
    }
  }
  return bestAction;
}

function evaluateOpponentBest(bd, aiColor) {
  const oppColor = aiColor === 'b' ? 'r' : 'b';
  let bestScore = 0;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const p = bd[r][c];
      if (p && p.flipped && p.color === oppColor) {
        const mv = getValidMoves(bd, r, c);
        for (const m of mv) {
          if (m.type === 'eat') {
            const t = bd[m.row][m.col];
            bestScore = Math.max(bestScore, (RANK_VALUES[t.rank]||0));
          }
        }
      }
    }
  }
  return bestScore;
}

function nearbyOwn(row, col, color) {
  let n = 0;
  for (let dr = -1; dr <= 1; dr++) {
    for (let dc = -1; dc <= 1; dc++) {
      if (dr === 0 && dc === 0) continue;
      const r = row+dr, c = col+dc;
      if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
        const p = board[r][c];
        if (p && p.flipped && p.color === color) n++;
      }
    }
  }
  return n;
}

function nearbyEnemy(row, col, color) {
  const opp = color === 'b' ? 'r' : 'b';
  let n = 0;
  for (let dr = -1; dr <= 1; dr++) {
    for (let dc = -1; dc <= 1; dc++) {
      if (dr === 0 && dc === 0) continue;
      const r = row+dr, c = col+dc;
      if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
        const p = board[r][c];
        if (p && p.flipped && p.color === opp) n++;
      }
    }
  }
  return n;
}

function simulateBoard(bd, fromRow, fromCol, toRow, toCol) {
  const sim = bd.map(row => row.map(c => c ? {...c} : null));
  sim[toRow][toCol] = sim[fromRow][fromCol];
  sim[fromRow][fromCol] = null;
  return sim;
}

function isPosThreatened(bd, row, col, color) {
  const opp = color === 'b' ? 'r' : 'b';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const p = bd[r][c];
      if (p && p.flipped && p.color === opp) {
        const mv = getValidMoves(bd, r, c);
        if (mv.some(m => m.row === row && m.col === col && m.type === 'eat')) return true;
      }
    }
  }
  return false;
}

// ==================== Stats ====================
function loadStats() {
  try {
    return JSON.parse(localStorage.getItem('chessFlipStats')) || {total:0,wins:0,losses:0,history:[]};
  } catch(e) { return {total:0,wins:0,losses:0,history:[]}; }
}

function saveGameResult(won) {
  const stats = loadStats();
  stats.total++;
  if (won) stats.wins++; else stats.losses++;
  const elapsed = Math.floor((Date.now() - gameStartTime) / 1000);
  const modeName = isVsAI ? ['简单','普通','困难'][difficulty] + 'AI' : '双人';
  stats.history.unshift({mode:modeName,won,moves,time:elapsed,date:Date.now()});
  if (stats.history.length > 20) stats.history.length = 20;
  try { localStorage.setItem('chessFlipStats', JSON.stringify(stats)); } catch(e) {}
}

// ==================== Animation Updates ====================
function updateFlipAnim() {
  if (!flipAnim) return;
  const row = flipAnim.row, col = flipAnim.col;
  const piece = flipAnim.piece;
  flipAnim.progress += 0.1;
  if (flipAnim.progress >= 1) {
    flipAnim.progress = 1;
    if (flipAnim.dir === 1) {
      piece.flipped = true;
      flipAnim.dir = -1;
      flipAnim.progress = 0;
    } else {
      flipAnim = null;
      if (postAnimCallback) {
        const cb = postAnimCallback;
        postAnimCallback = null;
        cb();
      } else {
        completeFlip(row, col);
      }
    }
  }
}

function updateMoveAnim() {
  if (!moveAnim) return;
  moveAnim.progress += 0.07;
  if (moveAnim.progress >= 1) {
    moveAnim = null;
    if (postAnimCallback) {
      const cb = postAnimCallback;
      postAnimCallback = null;
      cb();
    }
  }
}

function updateEatParticles(dt) {
  for (let i = eatParticles.length-1; i >= 0; i--) {
    const p = eatParticles[i];
    p.life -= dt / p.maxLife;
    if (p.life <= 0) { eatParticles.splice(i,1); continue; }
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.15;
  }
}

// ==================== Drawing ====================
function easeOutQuad(t) { return t * (2 - t); }

function seededRand(seed) {
  let x = Math.sin(seed) * 10000;
  return x - Math.floor(x);
}

function generateMenuCircles() {
  menuCircles = [];
  for (let i = 0; i < 5; i++) {
    menuCircles.push({
      cx: W * (0.2 + seededRand(i * 7 + 1) * 0.6),
      cy: H * (0.2 + seededRand(i * 13 + 3) * 0.6),
      r: 40 + seededRand(i * 19 + 5) * 80
    });
  }
}

function generateWoodGrainCache() {
  woodGrainCache = {};
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const key = r + ',' + c;
      const lines = [];
      for (let i = 0; i < 3; i++) {
        const seed = r * 100 + c * 10 + i;
        lines.push({
          offset: (seededRand(seed) - 0.5) * 5,
          skew: (seededRand(seed + 50) - 0.5) * 8
        });
      }
      woodGrainCache[key] = lines;
    }
  }
}

function drawWoodBg(x, y, s, row, col) {
  const grad = ctx.createLinearGradient(x, y, x+s, y+s);
  grad.addColorStop(0, '#3a2210');
  grad.addColorStop(0.3, '#4a2a14');
  grad.addColorStop(0.6, '#3d2010');
  grad.addColorStop(1, '#2d1808');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.roundRect(x, y, s, s, 3); ctx.fill();
  ctx.strokeStyle = 'rgba(90,60,30,0.15)';
  ctx.lineWidth = 1;
  const key = row + ',' + col;
  const lines = woodGrainCache[key] || [];
  for (let i = 0; i < lines.length; i++) {
    const gx = x + s * (0.2 + i * 0.3) + lines[i].offset;
    ctx.beginPath();
    ctx.moveTo(gx, y+2);
    ctx.lineTo(gx + lines[i].skew, y+s-2);
    ctx.stroke();
  }
}

function drawBack(x, y, s) {
  const r = 4;
  ctx.fillStyle = '#5a3a1a';
  ctx.beginPath(); ctx.roundRect(x, y, s, s, r); ctx.fill();
  ctx.fillStyle = '#7a5a2a';
  ctx.beginPath(); ctx.roundRect(x+3, y+3, s-6, s-6, r-1); ctx.fill();
  ctx.strokeStyle = '#4a2a0a';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(x+s/2, y+s/2, s*0.25, 0, Math.PI*2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x+s/2-s*0.15, y+s/2); ctx.lineTo(x+s/2+s*0.15, y+s/2);
  ctx.moveTo(x+s/2, y+s/2-s*0.15); ctx.lineTo(x+s/2, y+s/2+s*0.15);
  ctx.stroke();
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  ctx.beginPath(); ctx.roundRect(x+2, y+2, s, s, r); ctx.fill();
}

function drawPieceAt(x, y, s, p) {
  const r = s * 0.42, m = s/2;
  const isRed = p.color === 'r';

  // Glow halo for special pieces
  if (p.rank === 7 || p.rank === 4) {
    ctx.save();
    ctx.shadowColor = p.rank === 7 ? '#ffd700' : '#4488ff';
    ctx.shadowBlur = 20;
    ctx.fillStyle = p.rank === 7 ? 'rgba(255,215,0,0.12)' : 'rgba(68,136,255,0.12)';
    ctx.beginPath(); ctx.arc(x+m, y+m, r + 4, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  ctx.save();

  // Drop shadow for piece
  ctx.shadowColor = 'rgba(0,0,0,0.3)';
  ctx.shadowBlur = 5;
  ctx.shadowOffsetX = 2;
  ctx.shadowOffsetY = 2;

  const grad = ctx.createRadialGradient(x+m-r*0.3,y+m-r*0.3,0,x+m,y+m,r);
  grad.addColorStop(0, isRed?'#ffd0d0':'#d0d0d0');
  grad.addColorStop(1, isRed?'#cc3333':'#444444');
  ctx.fillStyle = grad;

  ctx.beginPath(); ctx.arc(x+m, y+m, r, 0, Math.PI*2); ctx.fill();

  // Border without shadow
  ctx.shadowColor = 'transparent';
  ctx.shadowBlur = 0;
  ctx.shadowOffsetX = 0;
  ctx.shadowOffsetY = 0;

  ctx.strokeStyle = isRed?'#aa1111':'#222222';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(x+m, y+m, r-1, 0, Math.PI*2); ctx.stroke();

  ctx.strokeStyle = isRed?'#ff6666':'#888888';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(x+m, y+m, r*0.7, 0, Math.PI*2); ctx.stroke();

  ctx.fillStyle = isRed?'#fff':'#eee';
  ctx.font = 'bold ' + Math.floor(r*1.1) + 'px "Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(RANK_NAMES[p.rank]||'?', x+m, y+m+1);
  ctx.restore();
}

function drawBoard() {
  // Background
  ctx.fillStyle = '#1a0a00';
  ctx.fillRect(0, 0, W, H);

  const pad = 2;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const x = c * T + pad, y = r * T + pad, s = T - pad * 2;
      const p = board[r][c];
      if (!p) {
        ctx.fillStyle = '#1a0a00';
        ctx.fillRect(x, y, s, s);
        continue;
      }
      drawWoodBg(x, y, s, r, c);
      if (moveAnim && moveAnim.toRow === r && moveAnim.toCol === c) continue;
      if (p.flipped) {
        drawPieceAt(x, y, s, p);
      } else {
        drawBack(x, y, s);
      }
    }
  }
}

function drawValidMoves() {
  if (!selected || validMoves.length === 0) return;
  const pulse = Math.sin(Date.now() * 0.006) * 0.3 + 0.7;

  for (const vm of validMoves) {
    const cx = vm.col * T + T/2;
    const cy = vm.row * T + T/2;

    if (vm.type === 'move') {
      ctx.fillStyle = `rgba(0,255,100,${0.35 * pulse})`;
      ctx.beginPath(); ctx.arc(cx, cy, T*0.12, 0, Math.PI*2); ctx.fill();
    } else {
      const flash = Math.sin(Date.now() * 0.008) * 0.3 + 0.7;
      ctx.strokeStyle = `rgba(255,50,50,${0.5 * flash})`;
      ctx.lineWidth = 3;
      const s = T - 4;
      ctx.beginPath(); ctx.roundRect(cx - s/2, cy - s/2, s, s, 4); ctx.stroke();
      // Inner fill
      ctx.fillStyle = `rgba(255,50,50,${0.12 * flash})`;
      ctx.beginPath(); ctx.roundRect(cx - s/2, cy - s/2, s, s, 4); ctx.fill();
    }
  }
}

function drawSelectedGlow() {
  if (!selected) return;
  const pulse = Math.sin(Date.now() * 0.005) * 0.3 + 0.7;
  const cx = selected.col * T + T/2;
  const cy = selected.row * T + T/2;
  ctx.save();
  ctx.shadowColor = '#ffd700';
  ctx.shadowBlur = 15 * pulse;
  ctx.strokeStyle = `rgba(255,215,0,${0.8 * pulse})`;
  ctx.lineWidth = 3;
  const s = T - 4;
  ctx.beginPath(); ctx.roundRect(cx - s/2, cy - s/2, s, s, 4); ctx.stroke();
  ctx.restore();
}

function drawFlipAnim() {
  if (!flipAnim) return;
  const p = flipAnim.piece;
  const row = flipAnim.row, col = flipAnim.col;
  const x = col * T, y = row * T, s = T;
  const progress = flipAnim.progress;
  const scaleX = flipAnim.dir === 1 ? 1 - progress : progress;
  if (scaleX <= 0.01) return;

  ctx.save();
  ctx.translate(x + s/2, y + s/2);
  ctx.scale(scaleX, 1);
  ctx.translate(-x - s/2, -y - s/2);

  if (flipAnim.dir === 1) {
    drawBack(x, y, s);
  } else {
    drawPieceAt(x, y, s, p);
  }
  ctx.restore();

  // Y bounce effect at midpoint
  if (progress > 0.4 && progress < 0.6) {
    const bounce = Math.sin((progress - 0.4) / 0.2 * Math.PI) * 3;
    ctx.fillStyle = 'rgba(255,255,200,0.05)';
    ctx.beginPath();
    ctx.arc(x + s/2, y + s/2 + bounce, s*0.3, 0, Math.PI*2);
    ctx.fill();
  }
}

function drawMoveAnim() {
  if (!moveAnim) return;
  const ma = moveAnim;
  const sx = ma.fromCol * T + T/2;
  const sy = ma.fromRow * T + T/2;
  const ex = ma.toCol * T + T/2;
  const ey = ma.toRow * T + T/2;
  const t = easeOutQuad(Math.min(ma.progress, 1));
  const cx = sx + (ex - sx) * t;
  const cy = sy + (ey - sy) * t;
  ctx.save();
  drawPieceAt(cx - T/2, cy - T/2, T, ma.piece);
  ctx.restore();
}

function drawEatParticles() {
  for (const ep of eatParticles) {
    const alpha = Math.max(0, ep.life);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = ep.color;
    ctx.fillRect(ep.x - ep.size/2, ep.y - ep.size/2, ep.size, ep.size);
  }
  ctx.globalAlpha = 1;
}

// ==================== Input ====================
function handleClick(mx, my) {
  switch (screen) {
    case SCREEN.MENU: handleMenuClick(mx,my); break;
    case SCREEN.DIFFICULTY: handleDiffClick(mx,my); break;
    case SCREEN.PLAYING: handleGameClick(mx,my); break;
    case SCREEN.GAMEOVER: handleOverlayClick(mx,my); break;
    case SCREEN.STATS: handleBackClick(() => screen = SCREEN.MENU, mx, my); break;
    case SCREEN.SETTINGS: handleSettingsClick(mx,my); break;
  }
}

function handleMenuClick(mx, my) {
  const btnW = Math.min(W*0.5, 220);
  const btnH = Math.min(H*0.08, 44);
  const btns = [
    {text:'',y:0.37,action:()=>screen=SCREEN.DIFFICULTY},
    {text:'',y:0.50,action:()=>{isVsAI=false;screen=SCREEN.PLAYING;initGame();}},
    {text:'',y:0.63,action:()=>screen=SCREEN.SETTINGS},
    {text:'',y:0.76,action:()=>screen=SCREEN.STATS}
  ];
  for (const b of btns) {
    const bx = (W-btnW)/2, by = H*b.y-btnH/2;
    if (mx>=bx && mx<=bx+btnW && my>=by && my<=by+btnH) { b.action(); return; }
  }
}

function handleDiffClick(mx, my) {
  const btnW = Math.min(W*0.45, 200);
  const btnH = Math.min(H*0.08, 44);
  const diffs = [
    {y:0.37,val:0},
    {y:0.50,val:1},
    {y:0.63,val:2}
  ];
  for (const d of diffs) {
    const bx = (W-btnW)/2, by = H*d.y-btnH/2;
    if (mx>=bx && mx<=bx+btnW && my>=by && my<=by+btnH) {
      isVsAI = true; difficulty = d.val; screen = SCREEN.PLAYING; initGame();
      return;
    }
  }
  // Back
  const bbw = Math.min(W*0.3,120), bbh = Math.min(H*0.06,34);
  const bbx = (W-bbw)/2, bby = H*0.78-bbh/2;
  if (mx>=bbx && mx<=bbx+bbw && my>=bby && my<=bby+bbh) screen = SCREEN.MENU;
}

function handleGameClick(mx, my) {
  if (winner || isAnimating) return;
  if (isVsAI && turn === 'b') return;

  const bh = Math.max(36, T*0.55);
  const by = H - bh - 5;
  const btnW = Math.min(80, W*0.18);
  const btnH = bh - 8;
  const btnY = by + 4;

  // Menu button
  if (mx >= 8 && mx <= 8+btnW && my >= btnY && my <= btnY+btnH) {
    screen = SCREEN.MENU; return;
  }
  // Restart button
  const rx = W - btnW - 8;
  if (mx >= rx && mx <= rx+btnW && my >= btnY && my <= btnY+btnH) {
    initGame(); return;
  }

  const col = Math.floor(mx / T);
  const row = Math.floor(my / T);
  if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return;

  const p = board[row][col];

  // Clicked on unflipped piece → flip
  if (p && !p.flipped) {
    handleFlip(row, col);
    return;
  }

  // If a piece is selected, check if we clicked a valid target
  if (selected) {
    const vm = validMoves.find(m => m.row === row && m.col === col);
    if (vm) {
      if (vm.type === 'move') executeMove(selected.row, selected.col, row, col);
      else executeEat(selected.row, selected.col, row, col);
      return;
    }
  }

  // Click on own flipped piece → select
  if (p && p.flipped && p.color === turn) {
    handleSelect(row, col);
    return;
  }

  // Click on enemy flipped piece or empty → deselect if selected
  if (selected) {
    selected = null;
    validMoves = [];
    return;
  }

  SFX.play('invalid');
}

function handleOverlayClick(mx, my) {
  const pw = W*0.65, ph = H*0.38;
  const px = (W-pw)/2, py = (H-ph)/2;
  const btnH2 = ph*0.16, btnW = pw*0.38;
  const btnY2 = py + ph*0.73;
  const btnGap = pw*0.04;
  const bx1 = px + (pw - btnW*2 - btnGap)/2;
  const bx2 = bx1 + btnW + btnGap;

  if (mx >= bx1 && mx <= bx1+btnW && my >= btnY2 && my <= btnY2+btnH2) {
    screen = SCREEN.PLAYING;
    initGame();
    return;
  }
  if (mx >= bx2 && mx <= bx2+btnW && my >= btnY2 && my <= btnY2+btnH2) {
    screen = SCREEN.MENU;
    return;
  }
}

function handleBackClick(action, mx, my) {
  const bbw = Math.min(W*0.3,120), bbh = Math.min(H*0.06,34);
  const bbx = (W-bbw)/2, bby = H*0.88;
  if (mx>=bbx && mx<=bbx+bbw && my>=bby && my<=bby+bbh) { action(); return; }
}

function handleSettingsClick(mx, my) {
  const btnW = Math.min(W*0.5,200), btnH = Math.min(H*0.08,44);
  const bx = (W-btnW)/2, by = H*0.38-btnH/2;
  if (mx>=bx && mx<=bx+btnW && my>=by && my<=by+btnH) {
    soundEnabled = !soundEnabled;
    return;
  }
  const bbw = Math.min(W*0.3,120), bbh = Math.min(H*0.06,34);
  const bbx = (W-bbw)/2, bby = H*0.7;
  if (mx>=bbx && mx<=bbx+bbw && my>=bby && my<=bby+bbh) screen = SCREEN.MENU;
}

// Pointer events - use flag to prevent click-on-touch double fire
let touchFired = false;

c.addEventListener('touchstart', e => {
  e.preventDefault();
  touchFired = true;
  const t = e.touches[0];
  const r = c.getBoundingClientRect();
  const mx = (t.clientX - r.left) * W / r.width;
  const my = (t.clientY - r.top) * H / r.height;
  handleClick(mx, my);
}, {passive: false});

c.addEventListener('click', e => {
  if (touchFired) { touchFired = false; return; }
  const r = c.getBoundingClientRect();
  const mx = (e.clientX - r.left) * W / r.width;
  const my = (e.clientY - r.top) * H / r.height;
  handleClick(mx, my);
});

// ==================== Timer ====================
let timerAccum = 0;

function updateTimer(dt) {
  if (screen !== SCREEN.PLAYING || winner || isAnimating) return;
  if (isVsAI && turn === 'b') return;

  timerAccum += dt;
  if (timerAccum >= 1) {
    timerAccum -= 1;
    turnTimer--;
    if (turnTimer <= 0) {
      turnTimer = 0;
      autoPlayerAction();
    }
  }
}

function autoPlayerAction() {
  if (selected && validMoves.length > 0) {
    const m = validMoves[Math.floor(Math.random() * validMoves.length)];
    if (m.type === 'move') executeMove(selected.row, selected.col, m.row, m.col);
    else executeEat(selected.row, selected.col, m.row, m.col);
    return;
  }
  selected = null;
  validMoves = [];
  const u = getUnflippedPieces();
  if (u.length > 0) {
    const idx = Math.floor(Math.random() * u.length);
    const pick = u[idx];
    if (pick) handleFlip(pick.row, pick.col);
  } else {
    const myPieces = getFlippedPieces(turn);
    if (myPieces.length === 0) {
      const opp = turn === 'r' ? 'b' : 'r';
      winner = opp;
      msg = winner === 'r' ? '🎉 红方胜利！' : '🎉 黑方胜利！';
      msgTimer = 9999;
      endGame(opp);
    } else {
      let hasMove = false;
      for (const fp of myPieces) {
        if (getValidMoves(board, fp.row, fp.col).length > 0) { hasMove = true; break; }
      }
      if (!hasMove) {
        const opp = turn === 'r' ? 'b' : 'r';
        winner = opp;
        msg = (turn === 'r' ? '红方' : '黑方') + '无棋可走，判负';
        msgTimer = 9999;
        endGame(opp);
      }
    }
  }
}

// ==================== Main Loop ====================
function loop(timestamp) {
  if (_htmlPaused) {
    requestAnimationFrame(loop);
    return;
  }

  const dt = lastTime ? Math.min((timestamp - lastTime) / 1000, 0.05) : 0.016;
  lastTime = timestamp;

  updateFlipAnim();
  updateMoveAnim();
  if (dt > 0) updateEatParticles(dt);
  updateTimer(dt);

  switch (screen) {
    case SCREEN.MENU:
      drawMenu();
      break;
    case SCREEN.DIFFICULTY:
      drawDifficulty();
      break;
    case SCREEN.PLAYING:
      drawBoard();
      drawValidMoves();
      drawSelectedGlow();
      drawFlipAnim();
      drawMoveAnim();
      drawEatParticles();
      drawTopBar();
      drawMsgBar();
      if (winner) drawGameOverOverlay();
      break;
    case SCREEN.GAMEOVER:
      drawBoard();
      drawValidMoves();
      drawSelectedGlow();
      drawEatParticles();
      drawTopBar();
      drawMsgBar();
      drawGameOverOverlay();
      break;
    case SCREEN.STATS:
      drawStats();
      break;
    case SCREEN.SETTINGS:
      drawSettings();
      break;
  }

  requestAnimationFrame(loop);
}

// ==================== Polyfill ====================
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
    if (r>w/2) r=w/2; if (r>h/2) r=h/2;
    this.moveTo(x+r,y); this.lineTo(x+w-r,y);
    this.quadraticCurveTo(x+w,y,x+w,y+r);
    this.lineTo(x+w,y+h-r);
    this.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    this.lineTo(x+r,y+h);
    this.quadraticCurveTo(x,y+h,x,y+h-r);
    this.lineTo(x,y+r);
    this.quadraticCurveTo(x,y,x+r,y);
  };
}
