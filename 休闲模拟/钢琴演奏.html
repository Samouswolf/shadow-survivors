<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>钢琴演奏</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #2d1f47 100%); min-height: 100vh; overflow: hidden; }
        .game-container { width: 100%; height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 10px; }
        .score-display { color: #ffd700; font-size: 24px; font-weight: bold; }
        .song-display { color: #4ecdc4; font-size: 16px; }
        
        .sheet { flex: 1; background: rgba(255,255,255,0.1); border-radius: 20px; position: relative; overflow: hidden; }
        .sheet-lines { position: absolute; inset: 10px; background: repeating-linear-gradient(180deg, transparent, transparent 20px, rgba(255,255,255,0.3) 20px, rgba(255,255,255,0.3) 22px); }
        
        .note-indicator { position: absolute; width: 30px; height: 30px; background: #ffd700; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        
        .piano { display: flex; gap: 2px; margin-top: 10px; }
        .key { flex: 1; height: 80px; border: none; border-radius: 5px; font-size: 14px; cursor: pointer; transition: transform 0.1s, background 0.1s; }
        .key:active { transform: scale(0.95); }
        .key-white { background: #fff; color: #1a1a2e; }
        .key-white:active { background: #e0e0e0; }
        .key-black { background: #1a1a2e; color: #fff; height: 50px; margin-top: -30px; }
        .key-black:active { background: #3a3a4e; }
        
        .stats { display: flex; justify-content: space-around; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-top: 10px; }
        .stat-item { text-align: center; color: #fff; }
        .stat-value { font-size: 20px; font-weight: bold; }
        .stat-label { font-size: 12px; opacity: 0.7; }
        
        .message { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); color: #fff; padding: 20px 40px; border-radius: 15px; font-size: 20px; display: none; z-index: 100; }
        .message.show { display: block; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="score-display">🎹 <span id="score">0</span></div>
            <div class="song-display">曲目: <span id="song">小星星</span></div>
        </div>
        
        <div class="sheet" id="sheet">
            <div class="sheet-lines"></div>
        </div>
        
        <div class="piano" id="piano">
            <button class="key key-white" data-note="C">C</button>
            <button class="key key-black" data-note="C#">C#</button>
            <button class="key key-white" data-note="D">D</button>
            <button class="key key-black" data-note="D#">D#</button>
            <button class="key key-white" data-note="E">E</button>
            <button class="key key-white" data-note="F">F</button>
            <button class="key key-black" data-note="F#">F#</button>
            <button class="key key-white" data-note="G">G</button>
            <button class="key key-black" data-note="G#">G#</button>
            <button class="key key-white" data-note="A">A</button>
            <button class="key key-black" data-note="A#">A#</button>
            <button class="key key-white" data-note="B">B</button>
        </div>
        
        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="correct">0</div>
                <div class="stat-label">正确</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="wrong">0</div>
                <div class="stat-label">错误</div>
            </div>
        </div>
        
        <div class="message" id="message"></div>
        
        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    <script>
        const SONGS = {
            '小星星': ['C', 'C', 'G', 'G', 'A', 'A', 'G', 'F', 'F', 'E', 'E', 'D', 'D', 'C'],
            '欢乐颂': ['E', 'E', 'F', 'G', 'G', 'F', 'E', 'D', 'C', 'C', 'D', 'E', 'E', 'D'],
            '生日歌': ['C', 'C', 'D', 'C', 'F', 'E', 'C', 'C', 'D', 'C', 'G', 'F']
        };
        
        let score = 0;
        let correct = 0;
        let wrong = 0;
        let currentSong = '小星星';
        let currentNoteIndex = 0;
        let noteIndicators = [];
        let gameRunning = true;
        let gameLoop = null;
        
        function loadData() {
            const saved = GameCore.storage.get('piano_play_data', null);
            if (saved) {
                score = saved.score;
            }
            updateUI();
            startSong();
        }
        
        function saveData() {
            GameCore.storage.set('piano_play_data', { score });
        }
        
        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('song').textContent = currentSong;
            document.getElementById('correct').textContent = correct;
            document.getElementById('wrong').textContent = wrong;
        }
        
        function startSong() {
            const song = SONGS[currentSong];
            currentNoteIndex = 0;
            noteIndicators = [];
            
            // Clear sheet
            document.getElementById('sheet').querySelectorAll('.note-indicator').forEach(el => el.remove());
            
            // Create note indicators
            song.forEach((note, index) => {
                const indicator = document.createElement('div');
                indicator.className = 'note-indicator';
                indicator.textContent = note;
                indicator.style.left = `${10 + index * 20}px`;
                indicator.style.top = '50%';
                indicator.dataset.note = note;
                document.getElementById('sheet').appendChild(indicator);
                noteIndicators.push(indicator);
            });
            
            highlightCurrentNote();
        }
        
        function highlightCurrentNote() {
            noteIndicators.forEach((el, index) => {
                if (index === currentNoteIndex) {
                    el.style.background = '#4ecdc4';
                    el.style.transform = 'scale(1.2)';
                } else if (index < currentNoteIndex) {
                    el.style.background = '#22c55e';
                    el.style.transform = 'scale(1)';
                } else {
                    el.style.background = '#ffd700';
                    el.style.transform = 'scale(1)';
                }
            });
        }
        
        function playNote(note) {
            if (currentNoteIndex >= SONGS[currentSong].length) return;
            
            const expectedNote = SONGS[currentSong][currentNoteIndex];
            
            if (note === expectedNote) {
                correct++;
                score += 10;
                currentNoteIndex++;
                
                if (currentNoteIndex >= SONGS[currentSong].length) {
                    showMessage('🎉 曲目完成！');
                    // Next song
                    const songNames = Object.keys(SONGS);
                    const currentIndex = songNames.indexOf(currentSong);
                    currentSong = songNames[(currentIndex + 1) % songNames.length];
                    setTimeout(() => startSong(), 2000);
                }
            } else {
                wrong++;
                showMessage('❌ 错误音符');
            }
            
            highlightCurrentNote();
            updateUI();
            saveData();
        }
        
        function showMessage(msg) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 1500);
        }
        
        // Setup piano keys
        document.querySelectorAll('.key').forEach(key => {
            key.addEventListener('click', () => {
                playNote(key.dataset.note);
            });
        });
        
        GameCore.init({ highScore: 'piano_play' });
        loadData();
    </script>
</body>
</html>
