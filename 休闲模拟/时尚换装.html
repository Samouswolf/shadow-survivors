<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>时尚换装</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%); min-height: 100vh; overflow: hidden; }
        .game-container { width: 100%; height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.5); border-radius: 15px; margin-bottom: 10px; }
        .currency { display: flex; align-items: center; gap: 5px; color: #333; font-size: 16px; font-weight: bold; }
        
        .character-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(255,255,255,0.5); border-radius: 15px; position: relative; }
        .character { font-size: 120px; transition: all 0.3s; }
        .outfit-preview { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.8); padding: 10px; border-radius: 10px; font-size: 12px; }
        
        .category-tabs { display: flex; gap: 5px; margin-bottom: 10px; overflow-x: auto; }
        .tab { padding: 8px 15px; background: rgba(255,255,255,0.5); border-radius: 20px; cursor: pointer; font-size: 14px; white-space: nowrap; }
        .tab.active { background: linear-gradient(135deg, #ff6b6b, #ee5a5a); color: #fff; }
        
        .shop-area { flex: 1; background: rgba(255,255,255,0.5); border-radius: 15px; padding: 15px; overflow-y: auto; }
        .items-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .item { aspect-ratio: 1; background: rgba(255,255,255,0.8); border-radius: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; border: 3px solid transparent; transition: all 0.3s; }
        .item:hover { transform: scale(1.05); }
        .item.selected { border-color: #ff6b6b; }
        .item.owned { border-color: #4ecdc4; }
        .item-icon { font-size: 32px; }
        .item-name { font-size: 10px; margin-top: 5px; text-align: center; }
        
        .actions { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
        .btn { padding: 12px 30px; border: none; border-radius: 25px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #4ecdc4, #44a08d); color: #fff; }
        .btn-danger { background: linear-gradient(135deg, #ff6b6b, #ee5a5a); color: #fff; }
        
        .message { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); color: #fff; padding: 20px 40px; border-radius: 15px; font-size: 20px; display: none; z-index: 100; }
        .message.show { display: block; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="currency">💰 <span id="money">1000</span></div>
            <div class="currency">⭐ <span id="style">0</span></div>
        </div>
        
        <div class="character-area">
            <div class="character" id="character">👧</div>
            <div class="outfit-preview" id="outfitPreview">当前装扮</div>
        </div>
        
        <div class="category-tabs" id="tabs">
            <div class="tab active" data-category="hair">👩‍🦰 发型</div>
            <div class="tab" data-category="top">👕 上衣</div>
            <div class="tab" data-category="bottom">👖 下装</div>
            <div class="tab" data-category="shoes">👟 鞋子</div>
            <div class="tab" data-category="accessory">🎀 配饰</div>
        </div>
        
        <div class="shop-area" id="shopArea"></div>
        
        <div class="actions">
            <button class="btn btn-primary" id="btnWear">👗 穿戴</button>
            <button class="btn btn-danger" id="btnBuy">💰 购买</button>
        </div>
        
        <div class="message" id="message"></div>
        
        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    <script>
        const ITEMS = {
            hair: [
                { id: 'h1', emoji: '👩‍🦰', name: '红发', cost: 100 },
                { id: 'h2', emoji: '👩‍🦱', name: '卷发', cost: 150 },
                { id: 'h3', emoji: '👩‍🦳', name: '白发', cost: 200 },
                { id: 'h4', emoji: '👩‍🦲', name: '光头', cost: 50 },
                { id: 'h5', emoji: '🧑‍🦰', name: '橙发', cost: 180 },
                { id: 'h6', emoji: '🧑‍🦱', name: '长发', cost: 250 }
            ],
            top: [
                { id: 't1', emoji: '👕', name: 'T恤', cost: 100 },
                { id: 't2', emoji: '👔', name: '衬衫', cost: 150 },
                { id: 't3', emoji: '👗', name: '连衣裙', cost: 300 },
                { id: 't4', emoji: '🧥', name: '外套', cost: 250 },
                { id: 't5', emoji: '👙', name: '泳衣', cost: 200 },
                { id: 't6', emoji: '🎽', name: '背心', cost: 80 }
            ],
            bottom: [
                { id: 'b1', emoji: '👖', name: '牛仔裤', cost: 100 },
                { id: 'b2', emoji: '👗', name: '短裙', cost: 150 },
                { id: 'b3', emoji: '👘', name: '和服', cost: 300 },
                { id: 'b4', emoji: '🩳', name: '短裤', cost: 80 },
                { id: 'b5', emoji: '👑', name: '长裙', cost: 250 },
                { id: 'b6', emoji: '🎒', name: '工装裤', cost: 180 }
            ],
            shoes: [
                { id: 's1', emoji: '👟', name: '运动鞋', cost: 100 },
                { id: 's2', emoji: '👠', name: '高跟鞋', cost: 150 },
                { id: 's3', emoji: '👢', name: '靴子', cost: 200 },
                { id: 's4', emoji: '🥿', name: '平底鞋', cost: 80 },
                { id: 's5', emoji: '👡', name: '凉鞋', cost: 120 },
                { id: 's6', emoji: '🥾', name: '登山靴', cost: 250 }
            ],
            accessory: [
                { id: 'a1', emoji: '🎀', name: '蝴蝶结', cost: 50 },
                { id: 'a2', emoji: '👓', name: '眼镜', cost: 100 },
                { id: 'a3', emoji: '🎩', name: '帽子', cost: 150 },
                { id: 'a4', emoji: '💍', name: '戒指', cost: 200 },
                { id: 'a5', emoji: '📿', name: '项链', cost: 180 },
                { id: 'a6', emoji: '👜', name: '包包', cost: 250 }
            ]
        };
        
        let money = 1000;
        let style = 0;
        let ownedItems = new Set(['h1', 't1', 'b1', 's1', 'a1']);
        let equippedItems = { hair: 'h1', top: 't1', bottom: 'b1', shoes: 's1', accessory: 'a1' };
        
        let currentCategory = 'hair';
        let selectedItem = null;
        
        const shopArea = document.getElementById('shopArea');
        const messageEl = document.getElementById('message');
        
        function renderItems() {
            shopArea.innerHTML = '';
            const items = ITEMS[currentCategory];
            
            items.forEach(item => {
                const el = document.createElement('div');
                el.className = `item ${ownedItems.has(item.id) ? 'owned' : ''} ${selectedItem === item.id ? 'selected' : ''}`;
                el.innerHTML = `
                    <div class="item-icon">${item.emoji}</div>
                    <div class="item-name">${item.name}</div>
                    ${ownedItems.has(item.id) ? '<div style="font-size: 10px; color: #4ecdc4;">已拥有</div>' : `<div style="font-size: 10px; color: #ff6b6b;">💰${item.cost}</div>`}
                `;
                el.onclick = () => selectItem(item.id);
                shopArea.appendChild(el);
            });
        }
        
        function selectItem(id) {
            selectedItem = id;
            renderItems();
        }
        
        function updateCharacter() {
            let display = '👧';
            
            const hair = ITEMS.hair.find(i => i.id === equippedItems.hair);
            const top = ITEMS.top.find(i => i.id === equippedItems.top);
            const bottom = ITEMS.bottom.find(i => i.id === equippedItems.bottom);
            const shoes = ITEMS.shoes.find(i => i.id === equippedItems.shoes);
            const accessory = ITEMS.accessory.find(i => i.id === equippedItems.accessory);
            
            display = hair.emoji + top.emoji + bottom.emoji + shoes.emoji + accessory.emoji;
            document.getElementById('character').textContent = display;
            
            document.getElementById('outfitPreview').textContent = `${hair.name} + ${top.name} + ${bottom.name}`;
        }
        
        function wearItem() {
            if (!selectedItem || !ownedItems.has(selectedItem)) {
                showMessage('请选择已拥有的物品！');
                return;
            }
            
            equippedItems[currentCategory] = selectedItem;
            style++;
            
            updateCharacter();
            renderItems();
            updateStats();
            
            showMessage('穿戴成功！');
        }
        
        function buyItem() {
            if (!selectedItem || ownedItems.has(selectedItem)) {
                showMessage('请选择未拥有的物品！');
                return;
            }
            
            const item = ITEMS[currentCategory].find(i => i.id === selectedItem);
            if (money < item.cost) {
                showMessage('资金不足！');
                return;
            }
            
            money -= item.cost;
            ownedItems.add(selectedItem);
            
            updateStats();
            renderItems();
            
            showMessage(`购买了${item.name}！`);
        }
        
        function updateStats() {
            document.getElementById('money').textContent = money;
            document.getElementById('style').textContent = style;
        }
        
        function showMessage(msg) {
            messageEl.textContent = msg;
            messageEl.classList.add('show');
            setTimeout(() => messageEl.classList.remove('show'), 2000);
        }
        
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentCategory = tab.dataset.category;
                selectedItem = null;
                renderItems();
            });
        });
        
        document.getElementById('btnWear').addEventListener('click', wearItem);
        document.getElementById('btnBuy').addEventListener('click', buyItem);
        
        updateCharacter();
        renderItems();
        updateStats();
    </script>
</body>
</html>
