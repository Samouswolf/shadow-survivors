<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>建筑设计</title>
    <script src="game_core.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px;
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            border-radius: 12px;
        }
        .stat {
            text-align: center;
            color: white;
        }
        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }
        .stat-value {
            font-size: 20px;
            font-weight: bold;
        }
        .building-area {
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
            padding: 20px;
            background: #dfe6e9;
            border-radius: 12px;
            min-height: 200px;
        }
        .building {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .roof {
            width: 120px;
            height: 40px;
            margin-bottom: -5px;
        }
        .floor {
            width: 100px;
            height: 30px;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .window {
            width: 20px;
            height: 20px;
            background: #ffeaa7;
            border-radius: 3px;
            margin: 0 5px;
        }
        .door {
            width: 30px;
            height: 40px;
            background: #2d3436;
            border-radius: 5px 5px 0 0;
            margin-top: 5px;
        }
        .ground {
            width: 150px;
            height: 20px;
            background: #2ecc71;
            border-radius: 10px;
        }
        .design-tools {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        .tool-section {
            padding: 10px;
            background: white;
            border-radius: 10px;
        }
        .tool-title {
            font-size: 12px;
            color: #2d3436;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .tool-options {
            display: flex;
            gap: 5px;
        }
        .tool-btn {
            padding: 8px;
            background: #dfe6e9;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
        }
        .tool-btn:hover {
            background: #74b9ff;
        }
        .tool-btn.selected {
            background: #0984e3;
            color: white;
        }
        .floor-control {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
        }
        .floor-btn {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            cursor: pointer;
            background: #74b9ff;
            color: white;
        }
        .floor-num {
            font-size: 20px;
            color: #2d3436;
            font-weight: bold;
        }
        .cost-area {
            padding: 15px;
            background: #ffeaa7;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
        }
        .cost-label {
            font-size: 14px;
            color: #636e72;
        }
        .cost-value {
            font-size: 24px;
            color: #e67e22;
            font-weight: bold;
        }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            color: white;
        }
        .btn-secondary {
            background: linear-gradient(135deg, #dfe6e9, #b2bec3);
            color: #2d3436;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 20px 40px;
            border-radius: 15px;
            font-size: 18px;
            display: none;
            z-index: 100;
            text-align: center;
        }
        .message.show { display: block; }
        .ad-banner {
            width: 100%;
            height: 60px;
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">设计</div>
                <div class="stat-value" id="designCount">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">楼层</div>
                <div class="stat-value" id="floorCount">3</div>
            </div>
            <div class="stat">
                <div class="stat-label">预算</div>
                <div class="stat-value" id="budget">1000</div>
            </div>
        </div>

        <div class="building-area">
            <div class="building" id="building"></div>
        </div>

        <div class="design-tools">
            <div class="tool-section">
                <div class="tool-title">屋顶</div>
                <div class="tool-options" id="roofOptions"></div>
            </div>
            <div class="tool-section">
                <div class="tool-title">墙体</div>
                <div class="tool-options" id="wallOptions"></div>
            </div>
            <div class="tool-section">
                <div class="tool-title">窗户</div>
                <div class="tool-options" id="windowOptions"></div>
            </div>
        </div>

        <div class="floor-control">
            <button class="floor-btn" id="btnRemoveFloor">-</button>
            <span class="floor-num" id="floorNum">3层</span>
            <button class="floor-btn" id="btnAddFloor">+</button>
        </div>

        <div class="cost-area">
            <div class="cost-label">建筑成本：</div>
            <div class="cost-value" id="costValue">300金币</div>
        </div>

        <div class="controls">
            <button class="btn btn-secondary" id="btnRandom">🎲 随机</button>
            <button class="btn btn-primary" id="btnSave">💾 保存</button>
            <button class="btn btn-primary" id="btnReset">🔄 新设计</button>
        </div>

        <div class="message" id="message"></div>

        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    <script>
        const ROOF_TYPES = [
            { icon: '🏠', style: 'triangle', color: '#e74c3c', cost: 50 },
            { icon: '🏢', style: 'flat', color: '#2d3436', cost: 30 },
            { icon: '🏛️', style: 'dome', color: '#f39c12', cost: 80 }
        ];

        const WALL_COLORS = ['#ecf0f1', '#bdc3c7', '#e74c3c', '#3498db', '#f39c12'];

        const WINDOW_TYPES = [
            { icon: '🪟', style: 'square', cost: 10 },
            { icon: '🔲', style: 'round', cost: 15 },
            { icon: '🧱', style: 'arch', cost: 20 }
        ];

        let roofType = ROOF_TYPES[0];
        let wallColor = WALL_COLORS[0];
        let windowType = WINDOW_TYPES[0];
        let floors = 3;
        let budget = 1000;
        let designCount = 0;

        function initDesign() {
            roofType = ROOF_TYPES[0];
            wallColor = WALL_COLORS[0];
            windowType = WINDOW_TYPES[0];
            floors = 3;

            renderTools();
            renderBuilding();
            updateCost();
        }

        function renderTools() {
            // 屋顶选项
            const roofEl = document.getElementById('roofOptions');
            roofEl.innerHTML = '';
            ROOF_TYPES.forEach(type => {
                const btn = document.createElement('div');
                btn.className = 'tool-btn' + (roofType.icon === type.icon ? ' selected' : '');
                btn.textContent = type.icon;
                btn.addEventListener('click', () => selectRoof(type));
                roofEl.appendChild(btn);
            });

            // 墙体颜色
            const wallEl = document.getElementById('wallOptions');
            wallEl.innerHTML = '';
            WALL_COLORS.forEach(color => {
                const btn = document.createElement('div');
                btn.className = 'tool-btn' + (wallColor === color ? ' selected' : '');
                btn.style.background = color;
                btn.style.width = '30px';
                btn.style.height = '30px';
                btn.addEventListener('click', () => selectWall(color));
                wallEl.appendChild(btn);
            });

            // 窗户类型
            const windowEl = document.getElementById('windowOptions');
            windowEl.innerHTML = '';
            WINDOW_TYPES.forEach(type => {
                const btn = document.createElement('div');
                btn.className = 'tool-btn' + (windowType.icon === type.icon ? ' selected' : '');
                btn.textContent = type.icon;
                btn.addEventListener('click', () => selectWindow(type));
                windowEl.appendChild(btn);
            });
        }

        function renderBuilding() {
            const buildingEl = document.getElementById('building');
            buildingEl.innerHTML = '';

            // 屋顶
            const roof = document.createElement('div');
            roof.className = 'roof';
            roof.style.background = roofType.color;

            if (roofType.style === 'triangle') {
                roof.style.clipPath = 'polygon(50% 0%, 0% 100%, 100% 100%)';
            } else if (roofType.style === 'dome') {
                roof.style.borderRadius = '50% 50% 0 0';
            }

            buildingEl.appendChild(roof);

            // 楼层
            for (let i = 0; i < floors; i++) {
                const floor = document.createElement('div');
                floor.className = 'floor';
                floor.style.background = wallColor;

                // 窗户
                const windowCount = 2;
                for (let j = 0; j < windowCount; j++) {
                    const win = document.createElement('div');
                    win.className = 'window';
                    if (windowType.style === 'round') {
                        win.style.borderRadius = '50%';
                    } else if (windowType.style === 'arch') {
                        win.style.borderRadius = '50% 50% 0 0';
                    }
                    floor.appendChild(win);
                }

                buildingEl.appendChild(floor);
            }

            // 门
            const door = document.createElement('div');
            door.className = 'door';
            buildingEl.appendChild(door);

            // 地面
            const ground = document.createElement('div');
            ground.className = 'ground';
            buildingEl.appendChild(ground);

            document.getElementById('floorNum').textContent = floors + '层';
        }

        function selectRoof(type) {
            roofType = type;
            renderTools();
            renderBuilding();
            updateCost();
        }

        function selectWall(color) {
            wallColor = color;
            renderTools();
            renderBuilding();
            updateCost();
        }

        function selectWindow(type) {
            windowType = type;
            renderTools();
            renderBuilding();
            updateCost();
        }

        function addFloor() {
            if (floors < 10) {
                floors++;
                renderBuilding();
                updateCost();
            }
        }

        function removeFloor() {
            if (floors > 1) {
                floors--;
                renderBuilding();
                updateCost();
            }
        }

        function updateCost() {
            const cost = roofType.cost + floors * 50 + windowType.cost * floors * 2;
            document.getElementById('costValue').textContent = cost + '金币';

            if (cost > budget) {
                document.getElementById('costValue').style.color = '#e74c3c';
            } else {
                document.getElementById('costValue').style.color = '#e67e22';
            }
        }

        function randomDesign() {
            roofType = ROOF_TYPES[Math.floor(Math.random() * ROOF_TYPES.length)];
            wallColor = WALL_COLORS[Math.floor(Math.random() * WALL_COLORS.length)];
            windowType = WINDOW_TYPES[Math.floor(Math.random() * WINDOW_TYPES.length)];
            floors = 1 + Math.floor(Math.random() * 5);

            renderTools();
            renderBuilding();
            updateCost();
        }

        function saveDesign() {
            const cost = roofType.cost + floors * 50 + windowType.cost * floors * 2;

            if (cost > budget) {
                showMessage('预算不足！');
                return;
            }

            budget -= cost;
            designCount++;

            showMessage('设计已保存！\n花费: ' + cost + '金币');
            GameCore.highScore.set('architect_game', designCount);

            updateUI();
        }

        function updateUI() {
            document.getElementById('designCount').textContent = designCount;
            document.getElementById('floorCount').textContent = floors;
            document.getElementById('budget').textContent = budget;
        }

        function showMessage(msg) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 1500);
        }

        document.getElementById('btnAddFloor').addEventListener('click', addFloor);
        document.getElementById('btnRemoveFloor').addEventListener('click', removeFloor);
        document.getElementById('btnRandom').addEventListener('click', randomDesign);
        document.getElementById('btnSave').addEventListener('click', saveDesign);
        document.getElementById('btnReset').addEventListener('click', () => {
            budget = 1000;
            designCount = 0;
            initDesign();
            updateUI();
        });

        // 初始化
        GameCore.init({ highScore: 'architect_game' });
        initDesign();
        updateUI();
    </script>
</body>
</html>
