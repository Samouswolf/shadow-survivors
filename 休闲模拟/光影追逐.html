<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>光影追逐</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: #0a0a0a; min-height: 100vh; overflow: hidden; color: #fff; }
        .game-container { width: 100%; height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 10px; }
        .stat { display: flex; flex-direction: column; align-items: center; }
        .stat-label { font-size: 12px; opacity: 0.7; }
        .stat-value { font-size: 24px; font-weight: bold; color: #ffd700; }
        
        .game-area { flex: 1; position: relative; background: #000; border-radius: 15px; overflow: hidden; }
        #gameCanvas { width: 100%; height: 100%; display: block; }
        
        .light-indicator { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 10px; font-size: 16px; }
        
        .controls { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
        .btn { padding: 12px 25px; border: none; border-radius: 25px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">关卡</div>
                <div class="stat-value" id="level">1</div>
            </div>
            <div class="stat">
                <div class="stat-label">分数</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">最高</div>
                <div class="stat-value" id="highScore">0</div>
            </div>
        </div>
        
        <div class="game-area">
            <canvas id="gameCanvas"></canvas>
            <div class="light-indicator" id="lightIndicator">💡 光源: 1</div>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" id="btnStart">▶️ 开始游戏</button>
        </div>
        
        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    <script src="game_core.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const GAME_NAME = '光影追逐';
        GameCore.init({ highScore: GAME_NAME });
        
        let level = 1;
        let score = 0;
        let gameRunning = false;
        
        let player = { x: 100, y: 100, radius: 15, vx: 0, vy: 0 };
        let lights = [];
        let shadows = [];
        let targets = [];
        
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            initLevel();
        }
        
        function initLevel() {
            player.x = 50;
            player.y = canvas.height / 2;
            player.vx = 0;
            player.vy = 0;
            
            lights = [];
            shadows = [];
            targets = [];
            
            const lightCount = 2 + level;
            for (let i = 0; i < lightCount; i++) {
                lights.push({
                    x: 100 + i * (canvas.width - 200) / (lightCount - 1),
                    y: 50 + Math.random() * 100,
                    radius: 150 + Math.random() * 100,
                    color: `hsl(${Math.random() * 60 + 330}, 100%, 50%)`,
                    angle: 0,
                    sweep: Math.PI / 2 + Math.random() * Math.PI / 2
                });
            }
            
            const shadowCount = 3 + level;
            for (let i = 0; i < shadowCount; i++) {
                shadows.push({
                    x: 150 + i * 150,
                    y: canvas.height - 50,
                    width: 60 + Math.random() * 40,
                    height: 100 + Math.random() * 100
                });
            }
            
            targets.push({
                x: canvas.width - 80,
                y: canvas.height / 2,
                radius: 25,
                color: '#fff'
            });
        }
        
        function updatePlayer() {
            player.x += player.vx;
            player.y += player.vy;
            player.vx *= 0.98;
            player.vy *= 0.98;
            
            if (player.x < player.radius) player.x = player.radius;
            if (player.x > canvas.width - player.radius) player.x = canvas.width - player.radius;
            if (player.y < player.radius) player.y = player.radius;
            if (player.y > canvas.height - player.radius) player.y = canvas.height - player.radius;
        }
        
        function checkCollisions() {
            targets.forEach(target => {
                const dx = player.x - target.x;
                const dy = player.y - target.y;
                if (Math.sqrt(dx * dx + dy * dy) < player.radius + target.radius) {
                    level++;
                    score += level * 500;
                    initLevel();
                }
            });
            
            updateStats();
        }
        
        function drawLight(light) {
            ctx.save();
            ctx.translate(light.x, light.y);
            
            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, light.radius);
            gradient.addColorStop(0, light.color);
            gradient.addColorStop(0.5, light.color.replace('100%', '50%'));
            gradient.addColorStop(1, 'transparent');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.arc(0, 0, light.radius, light.angle - light.sweep / 2, light.angle + light.sweep / 2);
            ctx.closePath();
            ctx.fill();
            
            ctx.restore();
            
            light.angle += 0.01;
        }
        
        function drawShadows() {
            ctx.fillStyle = 'rgba(0,0,0,0.8)';
            shadows.forEach(shadow => {
                ctx.fillRect(shadow.x, shadow.y, shadow.width, shadow.height);
                
                // 阴影投射
                lights.forEach(light => {
                    const dx = light.x - shadow.x;
                    const dy = light.y - shadow.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const angle = Math.atan2(dy, dx);
                    
                    ctx.fillStyle = 'rgba(0,0,0,0.5)';
                    ctx.beginPath();
                    ctx.moveTo(shadow.x, shadow.y + shadow.height);
                    ctx.lineTo(shadow.x + shadow.width, shadow.y + shadow.height);
                    ctx.lineTo(shadow.x + shadow.width + Math.cos(angle) * 200, canvas.height);
                    ctx.lineTo(shadow.x + Math.cos(angle) * 200, canvas.height);
                    ctx.closePath();
                    ctx.fill();
                });
            });
        }
        
        function draw() {
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 光源
            lights.forEach(drawLight);
            
            // 阴影
            drawShadows();
            
            // 目标
            targets.forEach(target => {
                ctx.fillStyle = target.color;
                ctx.shadowColor = target.color;
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.arc(target.x, target.y, target.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            });
            
            // 玩家
            ctx.fillStyle = '#fff';
            ctx.shadowColor = '#fff';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }
        
        function updateStats() {
            document.getElementById('level').textContent = level;
            document.getElementById('score').textContent = score;
            document.getElementById('highScore').textContent = GameCore.highScore.get(GAME_NAME);
            document.getElementById('lightIndicator').textContent = '💡 光源: ' + lights.length;
            
            if (GameCore.highScore.set(GAME_NAME, score)) {
                GameCore.hints.show('新纪录！分数: ' + score);
            }
        }
        
        function gameLoop() {
            draw();
            
            if (gameRunning) {
                updatePlayer();
                checkCollisions();
            }
            
            updateStats();
            requestAnimationFrame(gameLoop);
        }
        
        document.addEventListener('keydown', e => {
            if (!gameRunning) return;
            
            if (e.code === 'ArrowRight' || e.code === 'KeyD') player.vx = 5;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') player.vx = -5;
            if (e.code === 'ArrowUp' || e.code === 'KeyW') player.vy = -5;
            if (e.code === 'ArrowDown' || e.code === 'KeyS') player.vy = 5;
        });
        
        document.addEventListener('keyup', e => {
            if (e.code === 'ArrowRight' || e.code === 'KeyD' || e.code === 'ArrowLeft' || e.code === 'KeyA') player.vx = 0;
            if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'ArrowDown' || e.code === 'KeyS') player.vy = 0;
        });
        
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            if (!gameRunning) return;
            
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            
            player.vx = (x - player.x) * 0.1;
            player.vy = (y - player.y) * 0.1;
        }, { passive: false });
        
        document.getElementById('btnStart').onclick = () => {
            gameRunning = true;
            level = 1;
            score = 0;
            initLevel();
        };
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        gameLoop();
    </script>
</body>
</html>
