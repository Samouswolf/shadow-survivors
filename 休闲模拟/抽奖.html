];

const SEGMENT_COUNT = PRIZES.length;
const SEGMENT_ANGLE = (2 * Math.PI) / SEGMENT_COUNT;

// 游戏状态
let score = 0;
let spins = 10;
let isSpinning = false;

const ctx = canvas.getContext('2d');

    const size = Math.min(window.innerWidth - 40, window.innerHeight - 250, 400);
    canvas.width = size;
    canvas.height = size;
    drawWheel();
}

// 绘制转盘
function drawWheel() {
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const radius = Math.min(cx, cy) - 10;
    
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // 绘制外圈装饰
    ctx.beginPath();
    ctx.arc(cx, cy, radius + 8, 0, 2 * Math.PI);
    ctx.strokeStyle = '#FFD700';
    ctx.lineWidth = 4;
    ctx.stroke();
    
    // 绘制各段
    for (let i = 0; i < SEGMENT_COUNT; i++) {
        const startAngle = currentAngle + i * SEGMENT_ANGLE - Math.PI / 2;
        const endAngle = startAngle + SEGMENT_ANGLE;
        
        // 扇形
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, radius, startAngle, endAngle);
        ctx.closePath();
        ctx.fillStyle = PRIZES[i].color;
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
        
        // 文字
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(startAngle + SEGMENT_ANGLE / 2);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${Math.max(12, radius / 15)}px Microsoft YaHei`;
        ctx.shadowColor = 'rgba(0,0,0,0.5)';
        ctx.shadowBlur = 3;
        ctx.fillText(PRIZES[i].text, radius - 15, 5);
        ctx.restore();
    }
    
    // 中心圆
    ctx.beginPath();
    ctx.arc(cx, cy, radius * 0.15, 0, 2 * Math.PI);
    ctx.fillStyle = '#FFD700';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.stroke();
    
    // 指针
    ctx.beginPath();
    ctx.moveTo(cx, cy - radius - 5);
    ctx.lineTo(cx - 15, cy - radius - 30);
    ctx.lineTo(cx + 15, cy - radius - 30);
    ctx.closePath();
    ctx.fillStyle = '#FF4757';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
}

// 开始抽奖
function startSpin() {
    if (!gameStarted || isSpinning || spins <= 0) return;
    
    isSpinning = true;
    spins--;
    spinsDiv.textContent = `剩余次数: ${spins}`;
    spinBtn.disabled = true;
    resultDiv.textContent = '';
    
    // 随机选择结果
    const prizeIndex = Math.floor(Math.random() * SEGMENT_COUNT);
    
    // 计算目标角度（至少转5圈）
    const extraSpins = 5 + Math.random() * 3;
    targetAngle = currentAngle + extraSpins * 2 * Math.PI + prizeIndex * SEGMENT_ANGLE + SEGMENT_ANGLE / 2;
    
    // 初始速度
    spinSpeed = 0.3;
    
    animate();
}

// 动画循环
function animate() {
    if (!isSpinning) return;
    
    // 缓动减速
    const distance = targetAngle - currentAngle;
    
    if (distance > 0.01) {
        spinSpeed = Math.max(0.005, distance * 0.05);
        currentAngle += spinSpeed;
        drawWheel();
        requestAnimationFrame(animate);
    } else {
        // 停止
        currentAngle = targetAngle;
        isSpinning = false;
        spinBtn.disabled = false;
        
        // 计算结果
        const normalizedAngle = ((currentAngle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
        const prizeIndex = Math.floor((2 * Math.PI - normalizedAngle + Math.PI / 2) / SEGMENT_ANGLE) % SEGMENT_COUNT;
        const prize = PRIZES[prizeIndex];
        
        score += prize.value;
        scoreDiv.textContent = `积分: ${score}`;
        
        if (prize.value > 0) {
            resultDiv.textContent = `🎉 恭喜获得 ${prize.text}！`;
        } else {
            resultDiv.textContent = '😅 谢谢参与，再接再厉！';
        }
        
        // 检查游戏结束
        if (spins <= 0) {
            setTimeout(() => {
                resultDiv.textContent = `游戏结束！总积分: ${score}`;
                showInterstitialAd();
                // 关闭插屏广告后显示开始界面

                        document.getElementById('interstitialAd').style.display = 'none';
                        gameStarted = false;
                        document.getElementById('startScreen').classList.remove('hidden');
                    };
                }
            }, 1500);
        }
    }
}

// 事件监听
spinBtn.addEventListener('click', startSpin);
window.addEventListener('resize', resize);

    spinsDiv.textContent = '剩余次数: 10';
    spinBtn.disabled = false;
    resultDiv.textContent = '';
    drawWheel();
});
})();

<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>

<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
</body>
</html>
