    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #fd79a8 0%, #e84393 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px;
            background: linear-gradient(135deg, #fd79a8, #e84393);
            border-radius: 12px;
        }
        .stat {
            text-align: center;
            color: white;
        }
        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }
        .stat-value {
            font-size: 20px;
            font-weight: bold;
        }
        .model-area {
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
            padding: 20px;
            background: #dfe6e9;
            border-radius: 12px;
        }
        .model {
            width: 150px;
            height: 200px;
            position: relative;
        }
        .model-body {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .model-head {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #ffeaa7;
            margin-bottom: 5px;
        }
        .model-top {
            width: 80px;
            height: 60px;
            border-radius: 10px;
            margin-bottom: 5px;
        }
        .model-bottom {
            width: 70px;
            height: 80px;
            border-radius: 10px;
        }
        .model-shoes {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }
        .shoe {
            width: 30px;
            height: 15px;
            border-radius: 5px;
        }
        .design-tools {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        .tool-section {
            padding: 15px;
            background: white;
            border-radius: 10px;
        }
        .tool-title {
            font-size: 14px;
            color: #2d3436;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .color-options {
            display: flex;
            gap: 5px;
        }
        .color-opt {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid white;
            transition: all 0.2s;
        }
        .color-opt:hover {
            transform: scale(1.1);
        }
        .color-opt.selected {
            border: 3px solid #2d3436;
        }
        .style-options {
            display: flex;
            gap: 5px;
        }
        .style-btn {
            padding: 8px 12px;
            background: #dfe6e9;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        .style-btn:hover {
            background: #fd79a8;
            color: white;
        }
        .style-btn.selected {
            background: #e84393;
            color: white;
        }
        .rating-area {
            padding: 15px;
            background: #ffeaa7;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
        }
        .rating-label {
            font-size: 14px;
            color: #636e72;
        }
        .rating-stars {
            font-size: 30px;
            color: #f39c12;
        }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #fd79a8, #e84393);
            color: white;
        }
        .btn-secondary {
            background: linear-gradient(135deg, #dfe6e9, #b2bec3);
            color: #2d3436;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 20px 40px;
            border-radius: 15px;
            font-size: 18px;
            display: none;
            z-index: 100;
            text-align: center;
        }
        .message.show { display: block; }
        .ad-banner {
            width: 100%;
            height: 60px;
            background: linear-gradient(135deg, #fd79a8, #e84393);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            margin-top: 10px;
            font-size: 14px;
        }

<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">设计</div>
                <div class="stat-value" id="designCount">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">评分</div>
                <div class="stat-value" id="avgRating">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">风格</div>
                <div class="stat-value" id="styleCount">0</div>
            </div>
        </div>

        <div class="model-area">
            <div class="model">
                <div class="model-body">
                    <div class="model-head"></div>
                    <div class="model-top" id="modelTop"></div>
                    <div class="model-bottom" id="modelBottom"></div>
                    <div class="model-shoes">
                        <div class="shoe" id="shoe1"></div>
                        <div class="shoe" id="shoe2"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="design-tools">
            <div class="tool-section">
                <div class="tool-title">上衣颜色</div>
                <div class="color-options" id="topColors"></div>
            </div>
            <div class="tool-section">
                <div class="tool-title">上衣风格</div>
                <div class="style-options" id="topStyles"></div>
            </div>
            <div class="tool-section">
                <div class="tool-title">裤子颜色</div>
                <div class="color-options" id="bottomColors"></div>
            </div>
            <div class="tool-section">
                <div class="tool-title">鞋子颜色</div>
                <div class="color-options" id="shoeColors"></div>
            </div>
        </div>

        <div class="rating-area">
            <div class="rating-label">当前设计评分：</div>
            <div class="rating-stars" id="ratingStars">⭐⭐⭐⭐⭐</div>
        </div>

        <div class="controls">
            <button class="btn btn-secondary" id="btnRandom">🎲 随机</button>
            <button class="btn btn-primary" id="btnSave">💾 保存</button>
            <button class="btn btn-primary" id="btnReset">🔄 新设计</button>
        </div>

        <div class="message" id="message"></div>

        
    </div>

    <script>
        const COLORS = ['#e74c3c', '#f39c12', '#2ecc71', '#3498db', '#9b59b6', '#1abc9c', '#e84393', '#2d3436', '#ffffff'];

        const TOP_STYLES = ['休闲', '正式', '运动', '时尚', '复古'];

        let topColor = COLORS[0];
        let bottomColor = COLORS[3];
        let shoeColor = COLORS[7];
        let topStyle = TOP_STYLES[0];
        let designCount = 0;
        let totalRating = 0;
        let stylesUsed = new Set();

        function initDesign() {
            topColor = COLORS[0];
            bottomColor = COLORS[3];
            shoeColor = COLORS[7];
            topStyle = TOP_STYLES[0];

            renderColorOptions();
            renderStyleOptions();
            updateModel();
            updateRating();
        }

        function renderColorOptions() {
            ['topColors', 'bottomColors', 'shoeColors'].forEach((id, index) => {
                const el = document.getElementById(id);
                el.innerHTML = '';

                COLORS.forEach(color => {
                    const btn = document.createElement('div');
                    btn.className = 'color-opt';

                    const currentColor = index === 0 ? topColor : index === 1 ? bottomColor : shoeColor;
                    if (currentColor === color) btn.classList.add('selected');

                    btn.style.background = color;
                    btn.addEventListener('click', () => selectColor(index, color));
                    el.appendChild(btn);
                });
            });
        }

        function renderStyleOptions() {
            const el = document.getElementById('topStyles');
            el.innerHTML = '';

            TOP_STYLES.forEach(style => {
                const btn = document.createElement('div');
                btn.className = 'style-btn' + (topStyle === style ? ' selected' : '');
                btn.textContent = style;
                btn.addEventListener('click', () => selectStyle(style));
                el.appendChild(btn);
            });
        }

        function selectColor(part, color) {
            if (part === 0) topColor = color;
            else if (part === 1) bottomColor = color;
            else shoeColor = color;

            renderColorOptions();
            updateModel();
            updateRating();
        }

        function selectStyle(style) {
            topStyle = style;
            stylesUsed.add(style);
            renderStyleOptions();
            updateModel();
            updateRating();
        }

        function updateModel() {
            document.getElementById('modelTop').style.background = topColor;
            document.getElementById('modelBottom').style.background = bottomColor;
            document.getElementById('shoe1').style.background = shoeColor;
            document.getElementById('shoe2').style.background = shoeColor;

            // 根据风格调整形状
            const topEl = document.getElementById('modelTop');
            if (topStyle === '正式') {
                topEl.style.borderRadius = '5px';
            } else if (topStyle === '运动') {
                topEl.style.borderRadius = '20px';
            } else {
                topEl.style.borderRadius = '10px';
            }
        }

        function updateRating() {
            // 根据颜色搭配计算评分
            let rating = 3;

            // 同色系搭配加分
            if (topColor === bottomColor || bottomColor === shoeColor) {
                rating += 1;
            }

            // 对比色搭配加分
            const colorIndex1 = COLORS.indexOf(topColor);
            const colorIndex2 = COLORS.indexOf(bottomColor);
            if (Math.abs(colorIndex1 - colorIndex2) > 4) {
                rating += 1;
            }

            // 风格多样性加分
            if (stylesUsed.size > 3) {
                rating += 1;
            }

            rating = Math.min(5, Math.max(1, rating));

            const stars = '⭐'.repeat(rating);
            document.getElementById('ratingStars').textContent = stars;

            return rating;
        }

        function randomDesign() {
            topColor = COLORS[Math.floor(Math.random() * COLORS.length)];
            bottomColor = COLORS[Math.floor(Math.random() * COLORS.length)];
            shoeColor = COLORS[Math.floor(Math.random() * COLORS.length)];
            topStyle = TOP_STYLES[Math.floor(Math.random() * TOP_STYLES.length)];

            renderColorOptions();
            renderStyleOptions();
            updateModel();
            updateRating();
        }

        function saveDesign() {
            const rating = updateRating();
            designCount++;
            totalRating += rating;

            showMessage('设计已保存！评分: ' + rating + '星');
            GameCore.highScore.set('fashion_game', Math.floor(totalRating / designCount));

            updateUI();
        }

        function updateUI() {
            document.getElementById('designCount').textContent = designCount;
            document.getElementById('avgRating').textContent = designCount > 0 ? Math.floor(totalRating / designCount) : 0;
            document.getElementById('styleCount').textContent = stylesUsed.size;
        }

        function showMessage(msg) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 1500);
        }

        document.getElementById('btnRandom').addEventListener('click', randomDesign);
        document.getElementById('btnSave').addEventListener('click', saveDesign);
        document.getElementById('btnReset').addEventListener('click', () => {
            designCount = 0;
            totalRating = 0;
            stylesUsed.clear();
            initDesign();
            updateUI();
        });

        // 初始化
        GameCore.init({ highScore: 'fashion_game' });
        initDesign();
    </script>

<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>
<!-- [/BATCH-FIX:responsive-js] -->
<!-- [BATCH-FIX:touch-support] -->
<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
