<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>点击英雄</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; overflow: hidden; }
        .game-container { width: 100%; height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 10px; }
        .stat { display: flex; flex-direction: column; align-items: center; color: #fff; }
        .stat-label { font-size: 12px; opacity: 0.8; }
        .stat-value { font-size: 20px; font-weight: bold; }
        
        .hero-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .hero { width: 200px; height: 200px; background: linear-gradient(135deg, #ff6b6b, #ee5a5a); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 80px; cursor: pointer; transition: all 0.1s; box-shadow: 0 0 30px rgba(255, 107, 107, 0.5); }
        .hero:active { transform: scale(0.9); }
        .hero-name { color: #fff; font-size: 24px; margin-top: 20px; }
        
        .enemy-area { width: 100%; max-width: 400px; background: rgba(255,255,255,0.05); border-radius: 15px; padding: 15px; margin-top: 10px; }
        .enemy-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .enemy-emoji { font-size: 32px; }
        .hp-bar { flex: 1; height: 20px; background: rgba(255,255,255,0.2); border-radius: 10px; overflow: hidden; }
        .hp-fill { height: 100%; background: linear-gradient(90deg, #4ecdc4, #44a08d); transition: width 0.3s; }
        
        .panel { width: 100%; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-top: 10px; }
        .upgrades { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .upgrade-item { padding: 10px 15px; background: rgba(255,255,255,0.1); border-radius: 10px; color: #fff; cursor: pointer; transition: all 0.3s; text-align: center; }
        .upgrade-item:hover { background: rgba(255,255,255,0.2); }
        .upgrade-item:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .damage-popup { position: absolute; color: #ffd700; font-size: 24px; font-weight: bold; pointer-events: none; animation: floatUp 0.5s ease-out forwards; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-50px); } }
        
        .message { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); color: #fff; padding: 20px 40px; border-radius: 15px; font-size: 20px; display: none; z-index: 100; }
        .message.show { display: block; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 10px; font-size: 14px; }
    /* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */
/* [BATCH-FIX:ad-components-css] */
.sponsor-btn{position:fixed;bottom:8px;left:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:2px 6px;border-radius:10px;font:10px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.sponsor-panel.show{display:flex}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.interstitial-ad.show{display:flex}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* [/BATCH-FIX:ad-components-css] */

/* [AD-FIX:responsive] */
@media (max-width:768px){.ad-banner-container{display:none!important}.sponsor-btn{transform:scale(.8);opacity:.6}}
/* [/AD-FIX:responsive] */
</style>
</head>
<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">等级</div>
                <div class="stat-value" id="level">1</div>
            </div>
            <div class="stat">
                <div class="stat-label">金币</div>
                <div class="stat-value" id="gold">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">伤害</div>
                <div class="stat-value" id="damage">10</div>
            </div>
            <div class="stat">
                <div class="stat-label">秒伤</div>
                <div class="stat-value" id="dps">0</div>
            </div>
        </div>
        
        <div class="hero-area">
            <div class="hero" id="hero">⚔️</div>
            <div class="hero-name" id="heroName">勇士</div>
        </div>
        
        <div class="enemy-area">
            <div class="enemy-bar">
                <span class="enemy-emoji" id="enemyEmoji">👹</span>
                <div class="hp-bar">
                    <div class="hp-fill" id="hpFill" style="width: 100%;"></div>
                </div>
            </div>
            <div style="color: #fff; font-size: 14px; text-align: center;">敌人: <span id="enemyName">哥布林</span> | HP: <span id="enemyHp">100</span>/<span id="enemyMaxHp">100</span></div>
        </div>
        
        <div class="panel">
            <div class="upgrades">
                <div class="upgrade-item" id="upgDamage">⚔️ 攻击力<br><span style="font-size: 12px;">💰 <span id="costDamage">100</span></span></div>
                <div class="upgrade-item" id="upgAuto">🤖 自动攻击<br><span style="font-size: 12px;">💰 <span id="costAuto">500</span></span></div>
                <div class="upgrade-item" id="upgCrit">💥 暴击率<br><span style="font-size: 12px;">💰 <span id="costCrit">300</span></span></div>
                <div class="upgrade-item" id="upgHero">🌟 英雄升级<br><span style="font-size: 12px;">💰 <span id="costHero">1000</span></span></div>
            </div>
        </div>
        
        <div class="message" id="message"></div>
        
        
    </div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script src="../game_core.js"></script>
<script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script>
        const ENEMIES = [
            { emoji: '👹', name: '哥布林', hp: 100, reward: 50 },
            { emoji: '👺', name: '恶鬼', hp: 200, reward: 100 },
            { emoji: '💀', name: '骷髅', hp: 400, reward: 200 },
            { emoji: '🦇', name: '蝙蝠王', hp: 800, reward: 400 },
            { emoji: '🐉', name: '巨龙', hp: 2000, reward: 1000 }
        ];
        
        let level = 1;
        let gold = 0;
        let damage = 10;
        let dps = 0;
        let critRate = 0;
        let autoAttack = false;
        
        let currentEnemy = { ...ENEMIES[0] };
        let enemyHp = currentEnemy.hp;
        
        const hero = document.getElementById('hero');
        const messageEl = document.getElementById('message');
        
        function updateStats() {
            document.getElementById('level').textContent = level;
            document.getElementById('gold').textContent = gold;
            document.getElementById('damage').textContent = damage;
            document.getElementById('dps').textContent = dps;
            
            document.getElementById('costDamage').textContent = Math.floor(100 * Math.pow(1.5, level - 1));
            document.getElementById('costAuto').textContent = Math.floor(500 * Math.pow(1.5, level - 1));
            document.getElementById('costCrit').textContent = Math.floor(300 * Math.pow(1.5, level - 1));
            document.getElementById('costHero').textContent = Math.floor(1000 * Math.pow(1.5, level - 1));
            
            const cd = Math.floor(100 * Math.pow(1.5, level - 1));
            const ca = Math.floor(500 * Math.pow(1.5, level - 1));
            const cc = Math.floor(300 * Math.pow(1.5, level - 1));
            const ch = Math.floor(1000 * Math.pow(1.5, level - 1));
            
            document.getElementById('upgDamage').disabled = gold < cd;
            document.getElementById('upgAuto').disabled = gold < ca;
            document.getElementById('upgCrit').disabled = gold < cc;
            document.getElementById('upgHero').disabled = gold < ch;
        }
        
        function updateEnemy() {
            const enemyIndex = Math.min(Math.floor(level / 5), ENEMIES.length - 1);
            currentEnemy = { ...ENEMIES[enemyIndex] };
            currentEnemy.hp = Math.floor(currentEnemy.hp * Math.pow(1.2, Math.floor(level / 5)));
            enemyHp = currentEnemy.hp;
            
            document.getElementById('enemyEmoji').textContent = currentEnemy.emoji;
            document.getElementById('enemyName').textContent = currentEnemy.name;
            document.getElementById('enemyHp').textContent = enemyHp;
            document.getElementById('enemyMaxHp').textContent = currentEnemy.hp;
            document.getElementById('hpFill').style.width = '100%';
        }
        
        function clickHero() {
            let dmg = damage;
            if (Math.random() < critRate) {
                dmg *= 2;
                showDamage(dmg, '💥');
            } else {
                showDamage(dmg);
            }
            
            enemyHp -= dmg;
            updateEnemyDisplay();
            
            if (enemyHp <= 0) {
                killEnemy();
            }
        }
        
        function showDamage(dmg, prefix = '') {
            const popup = document.createElement('div');
            popup.className = 'damage-popup';
            popup.textContent = prefix + '+' + dmg;
            popup.style.left = (Math.random() * 200 + 50) + 'px';
            popup.style.top = '200px';
            document.body.appendChild(popup);
            
            setTimeout(() => popup.remove(), 500);
        }
        
        function updateEnemyDisplay() {
            document.getElementById('enemyHp').textContent = Math.max(0, enemyHp);
            const percent = (enemyHp / currentEnemy.hp) * 100;
            document.getElementById('hpFill').style.width = percent + '%';
        }
        
        function killEnemy() {
            gold += currentEnemy.reward;
            level++;
            
            showMessage(`击败${currentEnemy.name}！获得${currentEnemy.reward}金币！`);
            
            updateEnemy();
            updateStats();
            saveProgress();
        }
        
        function upgradeDamage() {
            const cost = Math.floor(100 * Math.pow(1.5, level - 1));
            if (gold < cost) return;
            
            gold -= cost;
            damage += 10;
            updateStats();
        }
        
        function upgradeAuto() {
            const cost = Math.floor(500 * Math.pow(1.5, level - 1));
            if (gold < cost) return;
            
            gold -= cost;
            autoAttack = true;
            dps = damage;
            updateStats();
        }
        
        function upgradeCrit() {
            const cost = Math.floor(300 * Math.pow(1.5, level - 1));
            if (gold < cost) return;
            
            gold -= cost;
            critRate = Math.min(0.5, critRate + 0.1);
            updateStats();
        }
        
        function upgradeHero() {
            const cost = Math.floor(1000 * Math.pow(1.5, level - 1));
            if (gold < cost) return;
            
            gold -= cost;
            damage *= 1.5;
            updateStats();
            showMessage('英雄觉醒！攻击力大幅提升！');
        }
        
        function showMessage(msg) {
            messageEl.textContent = msg;
            messageEl.classList.add('show');
            setTimeout(() => messageEl.classList.remove('show'), 2000);
        }
        
        function saveProgress() {
            localStorage.setItem('clickHero_progress', JSON.stringify({
                level, gold, damage, dps, critRate, autoAttack
            }));
        }
        
        function loadProgress() {
            const saved = localStorage.getItem('clickHero_progress');
            if (saved) {
                const data = JSON.parse(saved);
                level = data.level || 1;
                gold = data.gold || 0;
                damage = data.damage || 10;
                dps = data.dps || 0;
                critRate = data.critRate || 0;
                autoAttack = data.autoAttack || false;
            }
        }
        
        hero.addEventListener('click', clickHero);
        document.getElementById('upgDamage').addEventListener('click', upgradeDamage);
        document.getElementById('upgAuto').addEventListener('click', upgradeAuto);
        document.getElementById('upgCrit').addEventListener('click', upgradeCrit);
        document.getElementById('upgHero').addEventListener('click', upgradeHero);
        
        setInterval(() => {
            if (autoAttack) {
                let dmg = damage;
                if (Math.random() < critRate) dmg *= 2;
                enemyHp -= dmg;
                updateEnemyDisplay();
                
                if (enemyHp <= 0) {
                    killEnemy();
                }
            }
        }, 1000);
        
        loadProgress();
        updateEnemy();
        updateStats();
    </script>
<!-- [BATCH-FIX:responsive-js] -->
<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>
<!-- [/BATCH-FIX:responsive-js] -->
<!-- [BATCH-FIX:touch-support] -->
<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>
<!-- [/BATCH-FIX:touch-support] -->

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
