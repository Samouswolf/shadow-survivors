<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>密室逃脱</title>
    <script src="game_core.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px;
            background: linear-gradient(135deg, #2c3e50, #34495e);
            border-radius: 12px;
        }
        .stat {
            text-align: center;
            color: white;
        }
        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }
        .stat-value {
            font-size: 20px;
            font-weight: bold;
        }
        .room-view {
            height: 200px;
            background: #2c3e50;
            border-radius: 12px;
            margin-bottom: 15px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 5px;
            padding: 10px;
        }
        .room-item {
            background: #34495e;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .room-item:hover {
            background: #3f5c72;
        }
        .room-item.checked {
            background: #27ae60;
        }
        .room-item.locked {
            background: #e74c3c;
        }
        .room-item.door {
            background: #f39c12;
        }
        .description {
            padding: 15px;
            background: #dfe6e9;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .desc-title {
            font-size: 16px;
            color: #2d3436;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .desc-text {
            font-size: 14px;
            color: #636e72;
            line-height: 1.6;
        }
        .puzzle-area {
            padding: 15px;
            background: #ffeaa7;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .puzzle-title {
            font-size: 14px;
            color: #2d3436;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .puzzle-input {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .puzzle-text {
            flex: 1;
            padding: 10px;
            border: 2px solid #2c3e50;
            border-radius: 8px;
            font-size: 14px;
        }
        .puzzle-btn {
            padding: 10px 20px;
            background: #2c3e50;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }
        .inventory {
            display: flex;
            gap: 10px;
            padding: 10px;
            background: #dfe6e9;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .inv-item {
            padding: 10px;
            background: white;
            border-radius: 8px;
            font-size: 20px;
            cursor: pointer;
        }
        .inv-item.selected {
            background: #3498db;
        }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: white;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 20px 40px;
            border-radius: 15px;
            font-size: 18px;
            display: none;
            z-index: 100;
            text-align: center;
        }
        .message.show { display: block; }
        .ad-banner {
            width: 100%;
            height: 60px;
            background: linear-gradient(135deg, #2c3e50, #34495e);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">房间</div>
                <div class="stat-value" id="roomNum">1</div>
            </div>
            <div class="stat">
                <div class="stat-label">线索</div>
                <div class="stat-value" id="clues">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">时间</div>
                <div class="stat-value" id="time">60</div>
            </div>
        </div>

        <div class="room-view" id="roomView"></div>

        <div class="description">
            <div class="desc-title" id="descTitle">房间描述</div>
            <div class="desc-text" id="descText">你被困在一个神秘的房间里...</div>
        </div>

        <div class="puzzle-area" id="puzzleArea"></div>

        <div class="inventory" id="inventory"></div>

        <div class="controls">
            <button class="btn btn-primary" id="btnReset">🔄 新密室</button>
        </div>

        <div class="message" id="message"></div>

        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    <script>
        const ROOMS = [
            {
                items: ['🚪', '📚', '🔑', '💡', '🖼️', '🪟', '🛋️', '⏰', '📦'],
                description: '一个书房，书架上摆满了书籍。墙上有一幅画和一扇窗户。',
                puzzles: [
                    { item: '📚', hint: '书架上的书按颜色排列', answer: '红蓝绿', reward: '🔑' },
                    { item: '⏰', hint: '时钟指向3:15', answer: '315', reward: '💡' }
                ],
                doorCode: '1234'
            },
            {
                items: ['🚪', '🧪', '🔬', '💻', '📋', '🪟', '🛋️', '🧲', '📦'],
                description: '一个实验室，桌上放着各种仪器和试剂。',
                puzzles: [
                    { item: '🧪', hint: '试剂颜色顺序：蓝红黄', answer: '蓝红黄', reward: '🧲' },
                    { item: '💻', hint: '密码是元素周期表第1号元素', answer: 'H', reward: '📋' }
                ],
                doorCode: 'H2O'
            },
            {
                items: ['🚪', '🛏️', '🪞', '💡', '🖼️', '🪟', '衣柜', '⏰', '📦'],
                description: '一个卧室，床上有一面镜子。衣柜似乎可以打开。',
                puzzles: [
                    { item: '🪞', hint: '镜子里的数字是反的：123', answer: '321', reward: '💡' },
                    { item: '衣柜', hint: '衣柜密码是床的颜色', answer: '白', reward: '🔑' }
                ],
                doorCode: '321'
            }
        ];

        let currentRoom = null;
        let inventory = [];
        let clues = 0;
        let roomNum = 1;
        let time = 60;
        let checkedItems = [];
        let currentPuzzle = null;
        let gameOver = false;

        function initGame() {
            currentRoom = ROOMS[roomNum - 1];
            inventory = [];
            clues = 0;
            time = 60;
            checkedItems = [];
            currentPuzzle = null;
            gameOver = false;

            renderRoom();
            renderDescription();
            renderPuzzle();
            renderInventory();
            updateUI();

            // 开始计时
            if (window.timerInterval) clearInterval(window.timerInterval);
            window.timerInterval = setInterval(() => {
                if (!gameOver) {
                    time--;
                    updateUI();
                    if (time <= 0) {
                        gameOver = true;
                        showMessage('时间耗尽！被困在密室...');
                    }
                }
            }, 1000);
        }

        function renderRoom() {
            const el = document.getElementById('roomView');
            el.innerHTML = '';

            currentRoom.items.forEach((item, i) => {
                const div = document.createElement('div');
                div.className = 'room-item';

                if (checkedItems.includes(i)) div.classList.add('checked');
                if (item === '🚪') div.classList.add('door');

                div.textContent = item;
                div.addEventListener('click', () => examineItem(i));
                el.appendChild(div);
            });
        }

        function renderDescription() {
            document.getElementById('descTitle').textContent = '房间 ' + roomNum;
            document.getElementById('descText').textContent = currentRoom.description;
        }

        function renderPuzzle() {
            const el = document.getElementById('puzzleArea');

            if (currentPuzzle) {
                el.innerHTML = `
                    <div class="puzzle-title">解谜：${currentPuzzle.hint}</div>
                    <div class="puzzle-input">
                        <input type="text" class="puzzle-text" id="puzzleInput" placeholder="输入答案">
                        <div class="puzzle-btn" id="btnSubmit">提交</div>
                    </div>
                `;
                document.getElementById('btnSubmit').addEventListener('click', submitPuzzle);
            } else {
                el.innerHTML = '<div class="puzzle-title">点击物品查看线索</div>';
            }
        }

        function renderInventory() {
            const el = document.getElementById('inventory');
            el.innerHTML = '';

            if (inventory.length === 0) {
                el.innerHTML = '<div style="color: #636e72;">暂无物品</div>';
            } else {
                inventory.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'inv-item';
                    div.textContent = item;
                    el.appendChild(div);
                });
            }
        }

        function examineItem(index) {
            if (gameOver) return;

            const item = currentRoom.items[index];

            if (item === '🚪') {
                tryOpenDoor();
                return;
            }

            const puzzle = currentRoom.puzzles.find(p => p.item === item);
            if (puzzle && !checkedItems.includes(index)) {
                currentPuzzle = puzzle;
                checkedItems.push(index);
                clues++;
                renderRoom();
                renderPuzzle();
                updateUI();
            } else if (checkedItems.includes(index)) {
                showMessage('已检查过此物品');
            } else {
                showMessage('这个物品没有线索');
                checkedItems.push(index);
                renderRoom();
            }
        }

        function submitPuzzle() {
            if (!currentPuzzle) return;

            const input = document.getElementById('puzzleInput').value;
            if (input === currentPuzzle.answer) {
                inventory.push(currentPuzzle.reward);
                showMessage('解谜成功！获得 ' + currentPuzzle.reward);
                currentPuzzle = null;
                renderPuzzle();
                renderInventory();
            } else {
                showMessage('答案错误！');
            }
        }

        function tryOpenDoor() {
            if (gameOver) return;

            if (inventory.includes('🔑')) {
                showMessage('🎉 逃脱成功！');
                roomNum++;
                if (roomNum > ROOMS.length) {
                    gameOver = true;
                    showMessage('所有密室逃脱成功！\n用时: ' + (60 - time) + '秒');
                    GameCore.highScore.set('escape_game', 60 - time);
                } else {
                    setTimeout(initGame, 2000);
                }
            } else {
                showMessage('需要钥匙才能开门！');
            }
        }

        function updateUI() {
            document.getElementById('roomNum').textContent = roomNum;
            document.getElementById('clues').textContent = clues;
            document.getElementById('time').textContent = time;
        }

        function showMessage(msg) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 1500);
        }

        document.getElementById('btnReset').addEventListener('click', () => {
            roomNum = 1;
            initGame();
        });

        // 初始化
        GameCore.init({ highScore: 'escape_game' });
        initGame();
    </script>
</body>
</html>
