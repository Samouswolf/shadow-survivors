<script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;

    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script>
(function(){
// Canvas设置
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// 响应式尺寸
function resize() {
    const maxW = Math.min(window.innerWidth, 400);
    const maxH = Math.min(window.innerHeight - 100, 600);
    canvas.width = maxW;
    canvas.height = maxH;
}

resize();
window.addEventListener('resize', resize);

// 游戏配置
const CFG = {
    GRAVITY: 0.5,
    JUMP_FORCE: -8,
    PIPE_SPEED: 3,
    PIPE_GAP: 150,
    PIPE_WIDTH: 60,
    PIPE_SPACING: 200,
    BIRD_SIZE: 30,
    GROUND_HEIGHT: 50
};

// 游戏状态
let gameState = 'waiting'; // waiting, playing, gameOver
let score = 0;
let highScore = 0;
let gameStarted = false;

// 鸟
const bird = {
    x: 80,
    y: canvas.height / 2,
    velocity: 0,
    rotation: 0
};

// 管道
let pipes = [];

// 地面
let groundOffset = 0;

// DOM元素
const overlay = document.getElementById('overlay');
const gameOverDiv = document.getElementById('gameOver');
const scoreDisplay = document.getElementById('scoreDisplay');
const finalScoreDiv = document.getElementById('finalScore');
const restartBtn = document.getElementById('restartBtn');

// 初始化游戏
function initGame() {
    bird.y = canvas.height / 2;
    bird.velocity = 0;
    bird.rotation = 0;
    pipes = [];
    score = 0;
    groundOffset = 0;
    gameState = 'waiting';
    gameStarted = true;
    
    overlay.style.display = 'block';
    gameOverDiv.style.display = 'none';
    scoreDisplay.textContent = '0';
    document.getElementById('startScreen').classList.add('hidden');
}

// 跳跃
function jump() {
    if (gameState === 'waiting') {
        gameState = 'playing';
        overlay.style.display = 'none';
        bird.velocity = CFG.JUMP_FORCE;
    } else if (gameState === 'playing') {
        bird.velocity = CFG.JUMP_FORCE;
    }
}

// 生成管道
function generatePipe() {
    const minTop = 50;
    const maxTop = canvas.height - CFG.PIPE_GAP - CFG.GROUND_HEIGHT - 50;
    const topHeight = Math.random() * (maxTop - minTop) + minTop;
    
    pipes.push({
        x: canvas.width,
        topHeight: topHeight,
        bottomY: topHeight + CFG.PIPE_GAP,
        passed: false
    });
}

// 更新游戏
function update() {
    if (gameState !== 'playing') return;
    
    // 鸟物理
    bird.velocity += CFG.GRAVITY;
    bird.y += bird.velocity;
    
    // 旋转
    bird.rotation = Math.min(Math.max(bird.velocity * 3, -30), 90);
    
    // 地面滚动
    groundOffset = (groundOffset + CFG.PIPE_SPEED) % canvas.width;
    
    // 管道生成
    if (pipes.length === 0 || pipes[pipes.length - 1].x < canvas.width - CFG.PIPE_SPACING) {
        generatePipe();
    }
    
    // 管道移动和碰撞检测
    for (let i = pipes.length - 1; i >= 0; i--) {
        pipes[i].x -= CFG.PIPE_SPEED;
        
        // 移除超出屏幕的管道
        if (pipes[i].x + CFG.PIPE_WIDTH < 0) {
            pipes.splice(i, 1);
            continue;
        }
        
        // 计分
        if (!pipes[i].passed && pipes[i].x + CFG.PIPE_WIDTH < bird.x) {
            pipes[i].passed = true;
            score++;
            scoreDisplay.textContent = score;
        }
        
        // 碰撞检测
        if (bird.x + CFG.BIRD_SIZE / 2 > pipes[i].x &&
            bird.x - CFG.BIRD_SIZE / 2 < pipes[i].x + CFG.PIPE_WIDTH) {
            if (bird.y - CFG.BIRD_SIZE / 2 < pipes[i].topHeight ||
                bird.y + CFG.BIRD_SIZE / 2 > pipes[i].bottomY) {
                gameOver();
            }
        }
    }
    
    // 地面碰撞
    if (bird.y + CFG.BIRD_SIZE / 2 > canvas.height - CFG.GROUND_HEIGHT) {
        gameOver();
    }
    
    // 天空碰撞
    if (bird.y - CFG.BIRD_SIZE / 2 < 0) {
        bird.y = CFG.BIRD_SIZE / 2;
        bird.velocity = 0;
    }
}

// 绘制游戏
function draw() {
    // 天空
    ctx.fillStyle = '#4ec0ca';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // 云朵
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 3; i++) {
        const cloudX = ((i * 150 + groundOffset * 0.3) % (canvas.width + 100)) - 50;
        const cloudY = 50 + i * 30;
        ctx.beginPath();
        ctx.arc(cloudX, cloudY, 20, 0, Math.PI * 2);
        ctx.arc(cloudX + 25, cloudY - 10, 25, 0, Math.PI * 2);
        ctx.arc(cloudX + 50, cloudY, 20, 0, Math.PI * 2);
        ctx.fill();
    }
    
    // 管道
    for (const pipe of pipes) {
        // 上管道
        ctx.fillStyle = '#73bf2e';
        ctx.fillRect(pipe.x, 0, CFG.PIPE_WIDTH, pipe.topHeight);
        ctx.fillStyle = '#5a9c23';
        ctx.fillRect(pipe.x - 5, pipe.topHeight - 30, CFG.PIPE_WIDTH + 10, 30);
        
        // 下管道
        ctx.fillStyle = '#73bf2e';
        ctx.fillRect(pipe.x, pipe.bottomY, CFG.PIPE_WIDTH, canvas.height - pipe.bottomY - CFG.GROUND_HEIGHT);
        ctx.fillStyle = '#5a9c23';
        ctx.fillRect(pipe.x - 5, pipe.bottomY, CFG.PIPE_WIDTH + 10, 30);
    }
    
    // 地面
    ctx.fillStyle = '#ded895';
    ctx.fillRect(0, canvas.height - CFG.GROUND_HEIGHT, canvas.width, CFG.GROUND_HEIGHT);
    ctx.fillStyle = '#c4b577';
    for (let i = 0; i < canvas.width / 20; i++) {
        const x = ((i * 20 - groundOffset) % canvas.width);
        ctx.fillRect(x, canvas.height - CFG.GROUND_HEIGHT, 10, 5);
    }
    
    // 鸟
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rotation * Math.PI / 180);
    
    // 身体
    ctx.fillStyle = '#f7dc6f';
    ctx.beginPath();
    ctx.arc(0, 0, CFG.BIRD_SIZE / 2, 0, Math.PI * 2);
    ctx.fill();
    
    // 翅膀
    ctx.fillStyle = '#f39c12';
    ctx.beginPath();
    ctx.arc(-5, 5, 8, 0, Math.PI * 2);
    ctx.fill();
    
    // 眼睛
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(8, -5, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(10, -5, 3, 0, Math.PI * 2);
    ctx.fill();
    
    // 嘴
    ctx.fillStyle = '#e74c3c';
    ctx.beginPath();
    ctx.moveTo(15, 0);
    ctx.lineTo(25, 3);
    ctx.lineTo(15, 6);
    ctx.closePath();
    ctx.fill();
    
    ctx.restore();
}

// 游戏结束
function gameOver() {
    gameState = 'gameOver';
    highScore = Math.max(highScore, score);
    gameStarted = false;
    
    gameOverDiv.style.display = 'block';
    finalScoreDiv.textContent = `得分: ${score} | 最高: ${highScore}`;
    
    showInterstitialAd();
}

// 游戏循环
function gameLoop() {
    if (!gameStarted) { requestAnimationFrame(gameLoop); return; }
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

// 事件监听
canvas.addEventListener('click', jump);
document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
        e.preventDefault();
        jump();
    }
});
restartBtn.addEventListener('click', function() {
    gameStarted = false;
    document.getElementById('startScreen').classList.remove('hidden');
    gameOverDiv.style.display = 'none';
    overlay.style.display = 'block';
    bird.y = canvas.height / 2;
    bird.velocity = 0;
    bird.rotation = 0;
    pipes = [];
    score = 0;
    groundOffset = 0;
    gameState = 'waiting';
    scoreDisplay.textContent = '0';
});

// 开始界面按钮
document.getElementById('startBtn').addEventListener('click', function() {
    initGame();
});

// 初始化
gameLoop();
})();

// 广告系统
(function(){
var sb=document.getElementById('sponsorBtn'),sp=document.getElementById('sponsorPanel'),sc=document.getElementById('sponsorClose');
if(sb&&sp){sb.onclick=function(){sp.style.display='flex'};if(sc)sc.onclick=function(){sp.style.display='none'}}
var ia=document.getElementById('interstitialAd'),si=document.getElementById('skipInterstitial');
if(ia&&si){si.onclick=function(){ia.style.display='none'}}
window.showInterstitialAd=function(){if(ia)ia.style.display='flex'};
})();

        // 音效支持
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq = 440, duration = 0.1) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }
        
        // 视觉特效
        function showEffect(x, y) {
            const el = document.createElement("div");
            el.style.cssText = `position:absolute;left:${x}px;top:${y}px;width:20px;height:20px;background:#f5576c;border-radius:50%;animation:pulse 0.5s ease-out forwards;pointer-events:none;z-index:100;`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 500);
        }
        
        // 触屏支持
        document.addEventListener("touchstart", function(e) { e.preventDefault(); }, {passive: false});
        document.addEventListener("touchmove", function(e) { e.preventDefault(); }, {passive: false});
        
        // 存档系统
        const Storage = {
            save: function(key, value) {
                try { localStorage.setItem(key, JSON.stringify(value)); } catch(e) {}
            },
            load: function(key, defaultValue) {
                try { return JSON.parse(localStorage.getItem(key) || JSON.stringify(defaultValue)); }
                catch(e) { return defaultValue; }
            }
        };
        </script>

<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
