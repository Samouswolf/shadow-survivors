<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>声音反射</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; overflow: hidden; color: #fff; }
        .game-container { width: 100%; height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 10px; }
        .stat { display: flex; flex-direction: column; align-items: center; }
        .stat-label { font-size: 12px; opacity: 0.7; }
        .stat-value { font-size: 24px; font-weight: bold; color: #00d2ff; }
        
        .game-area { flex: 1; position: relative; background: rgba(0,0,0,0.4); border-radius: 15px; overflow: hidden; }
        #gameCanvas { width: 100%; height: 100%; display: block; }
        
        .sound-wave { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 10px; font-size: 14px; }
        
        .controls { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
        .btn { padding: 12px 25px; border: none; border-radius: 25px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">关卡</div>
                <div class="stat-value" id="level">1</div>
            </div>
            <div class="stat">
                <div class="stat-label">分数</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">最高</div>
                <div class="stat-value" id="highScore">0</div>
            </div>
        </div>
        
        <div class="game-area">
            <canvas id="gameCanvas"></canvas>
            <div class="sound-wave" id="soundWave">🎵 声波: 0</div>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" id="btnStart">▶️ 开始游戏</button>
        </div>
        
        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const GAME_NAME = '声音反射';
        GameCore.init({ highScore: GAME_NAME });
        
        let level = 1;
        let score = 0;
        let gameRunning = false;
        
        let player = { x: 100, y: 100, radius: 20, vx: 0, vy: 0 };
        let walls = [];
        let soundWaves = [];
        let targets = [];
        let reflectors = [];
        
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            initLevel();
        }
        
        function initLevel() {
            player.x = 50;
            player.y = canvas.height / 2;
            player.vx = 0;
            player.vy = 0;
            
            walls = [];
            soundWaves = [];
            targets = [];
            reflectors = [];
            
            const wallCount = 3 + level;
            for (let i = 0; i < wallCount; i++) {
                walls.push({
                    x: 150 + i * 120,
                    y: 50 + Math.random() * (canvas.height - 150),
                    width: 10,
                    height: 80 + Math.random() * 100,
                    angle: Math.random() * Math.PI / 4
                });
            }
            
            for (let i = 0; i < 2 + level; i++) {
                reflectors.push({
                    x: 200 + i * 150,
                    y: 100 + (i % 2) * (canvas.height - 200),
                    width: 60,
                    height: 20,
                    angle: Math.PI / 4,
                    color: '#00d2ff'
                });
            }
            
            targets.push({
                x: canvas.width - 80,
                y: canvas.height / 2,
                radius: 30,
                color: '#48c78e',
                activated: false
            });
            
            setTimeout(() => shootSoundWave(), 1000);
        }
        
        function shootSoundWave() {
            if (!gameRunning) return;
            
            soundWaves.push({
                x: player.x,
                y: player.y,
                vx: 8,
                vy: 0,
                radius: 0,
                maxRadius: 300,
                reflections: 0,
                maxReflections: 3 + level
            });
            
            setTimeout(shootSoundWave, 2000);
        }
        
        function updateSoundWaves() {
            soundWaves = soundWaves.filter(wave => {
                wave.x += wave.vx;
                wave.y += wave.vy;
                wave.radius += 2;
                
                if (wave.radius >= wave.maxRadius) return false;
                
                // 墙壁反射
                walls.forEach(wall => {
                    if (wave.x > wall.x && wave.x < wall.x + wall.width &&
                        wave.y > wall.y && wave.y < wall.y + wall.height) {
                        wave.vx *= -1;
                        wave.reflections++;
                    }
                });
                
                // 反射器反射
                reflectors.forEach(ref => {
                    if (wave.x > ref.x && wave.x < ref.x + ref.width &&
                        wave.y > ref.y && wave.y < ref.y + ref.height) {
                        const angle = Math.atan2(wave.vy, wave.vx);
                        wave.vx = Math.cos(angle + Math.PI / 2) * 8;
                        wave.vy = Math.sin(angle + Math.PI / 2) * 8;
                        wave.reflections++;
                    }
                });
                
                // 边界反射
                if (wave.x < 0 || wave.x > canvas.width) wave.vx *= -1;
                if (wave.y < 0 || wave.y > canvas.height) wave.vy *= -1;
                
                // 检测目标
                targets.forEach(target => {
                    const dx = wave.x - target.x;
                    const dy = wave.y - target.y;
                    if (Math.sqrt(dx * dx + dy * dy) < wave.radius + target.radius) {
                        target.activated = true;
                        score += 500;
                        
                        for (let i = 0; i < 20; i++) {
                            particles.push({
                                x: target.x,
                                y: target.y,
                                vx: (Math.random() - 0.5) * 10,
                                vy: (Math.random() - 0.5) * 10,
                                life: 1,
                                color: '#48c78e'
                            });
                        }
                    }
                });
                
                if (wave.reflections >= wave.maxReflections) return false;
                if (wave.x < 0 || wave.x > canvas.width || 
                    wave.y < 0 || wave.y > canvas.height) return false;
                
                return true;
            });
            
            targets.forEach(target => {
                if (target.activated) {
                    level++;
                    score += level * 500;
                    initLevel();
                }
            });
        }
        
        function updatePlayer() {
            player.x += player.vx;
            player.y += player.vy;
            player.vx *= 0.95;
            player.vy *= 0.95;
            
            if (player.x < player.radius) player.x = player.radius;
            if (player.x > canvas.width - player.radius) player.x = canvas.width - player.radius;
            if (player.y < player.radius) player.y = player.radius;
            if (player.y > canvas.height - player.radius) player.y = canvas.height - player.radius;
        }
        
        function updateParticles() {
            particles = particles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;
                return p.life > 0;
            });
        }
        
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 网格背景
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            for (let x = 0; x < canvas.width; x += 30) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 30) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
            
            // 墙壁
            walls.forEach(wall => {
                ctx.fillStyle = '#666';
                ctx.fillRect(wall.x, wall.y, wall.width, wall.height);
            });
            
            // 反射器
            reflectors.forEach(ref => {
                ctx.save();
                ctx.translate(ref.x + ref.width / 2, ref.y + ref.height / 2);
                ctx.rotate(ref.angle);
                ctx.fillStyle = ref.color;
                ctx.fillRect(-ref.width / 2, -ref.height / 2, ref.width, ref.height);
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.strokeRect(-ref.width / 2, -ref.height / 2, ref.width, ref.height);
                ctx.restore();
            });
            
            // 目标
            targets.forEach(target => {
                ctx.fillStyle = target.activated ? '#48c78e' : '#666';
                ctx.shadowColor = target.activated ? '#48c78e' : 'transparent';
                ctx.shadowBlur = target.activated ? 20 : 0;
                ctx.beginPath();
                ctx.arc(target.x, target.y, target.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                
                ctx.fillStyle = '#fff';
                ctx.font = '24px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('🎯', target.x, target.y + 8);
            });
            
            // 声波
            soundWaves.forEach(wave => {
                ctx.strokeStyle = '#00d2ff';
                ctx.shadowColor = '#00d2ff';
                ctx.shadowBlur = 10;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(wave.x, wave.y, wave.radius, 0, Math.PI * 2);
                ctx.stroke();
                ctx.shadowBlur = 0;
                
                // 中心指示
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(wave.x, wave.y, 5, 0, Math.PI * 2);
                ctx.fill();
            });
            
            // 玩家
            ctx.fillStyle = '#f5576c';
            ctx.shadowColor = '#f5576c';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            // 粒子
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }
        
        let particles = [];
        
        function updateStats() {
            document.getElementById('level').textContent = level;
            document.getElementById('score').textContent = score;
            document.getElementById('highScore').textContent = GameCore.highScore.get(GAME_NAME);
            document.getElementById('soundWave').textContent = '🎵 声波: ' + soundWaves.length;
            
            if (GameCore.highScore.set(GAME_NAME, score)) {
                GameCore.hints.show('新纪录！分数: ' + score);
            }
        }
        
        function gameLoop() {
            draw();
            
            if (gameRunning) {
                updatePlayer();
                updateSoundWaves();
                updateParticles();
            }
            
            updateStats();
            requestAnimationFrame(gameLoop);
        }
        
        document.addEventListener('keydown', e => {
            if (!gameRunning) return;
            
            if (e.code === 'ArrowRight' || e.code === 'KeyD') player.vx = 5;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') player.vx = -5;
            if (e.code === 'ArrowUp' || e.code === 'KeyW') player.vy = -5;
            if (e.code === 'ArrowDown' || e.code === 'KeyS') player.vy = 5;
        });
        
        document.addEventListener('keyup', e => {
            if (e.code === 'ArrowRight' || e.code === 'KeyD' || e.code === 'ArrowLeft' || e.code === 'KeyA') player.vx = 0;
            if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'ArrowDown' || e.code === 'KeyS') player.vy = 0;
        });
        
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            if (!gameRunning) return;
            
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            
            player.vx = (x - player.x) * 0.1;
            player.vy = (y - player.y) * 0.1;
        }, { passive: false });
        
        document.getElementById('btnStart').onclick = () => {
            gameRunning = true;
            level = 1;
            score = 0;
            initLevel();
        };
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        gameLoop();
    </script>
</body>
</html>
