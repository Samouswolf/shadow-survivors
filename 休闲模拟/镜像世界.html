<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>镜像世界</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%); min-height: 100vh; overflow: hidden; color: #fff; }
        .game-container { width: 100%; height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 10px; }
        .stat { display: flex; flex-direction: column; align-items: center; }
        .stat-label { font-size: 12px; opacity: 0.7; }
        .stat-value { font-size: 24px; font-weight: bold; color: #a855f7; }
        
        .game-area { flex: 1; position: relative; background: rgba(0,0,0,0.4); border-radius: 15px; overflow: hidden; }
        #gameCanvas { width: 100%; height: 100%; display: block; }
        
        .dimension-indicator { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 10px; font-size: 16px; }
        .dimension-indicator.real { color: #4ecdc4; }
        .dimension-indicator.mirror { color: #f5576c; }
        
        .controls { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
        .btn { padding: 12px 25px; border: none; border-radius: 25px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">关卡</div>
                <div class="stat-value" id="level">1</div>
            </div>
            <div class="stat">
                <div class="stat-label">分数</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">最高</div>
                <div class="stat-value" id="highScore">0</div>
            </div>
        </div>
        
        <div class="game-area">
            <canvas id="gameCanvas"></canvas>
            <div class="dimension-indicator" id="dimensionIndicator">🌍 现实世界</div>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" id="btnStart">▶️ 开始游戏</button>
        </div>
        
        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    <script src="game_core.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const GAME_NAME = '镜像世界';
        GameCore.init({ highScore: GAME_NAME });
        
        let level = 1;
        let score = 0;
        let gameRunning = false;
        let currentDimension = 'real';
        
        let player = { x: 50, y: 300, width: 30, height: 50, vx: 0, vy: 0, onGround: false };
        let platforms = [];
        let doors = [];
        let collectibles = [];
        let particles = [];
        
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            initLevel();
        }
        
        function initLevel() {
            player.x = 50;
            player.y = canvas.height - 100;
            player.vx = 0;
            player.vy = 0;
            
            platforms = [];
            doors = [];
            collectibles = [];
            
            const platformCount = 5 + level;
            
            for (let i = 0; i < platformCount; i++) {
                const isMirror = Math.random() > 0.6;
                platforms.push({
                    x: 100 + i * 120,
                    y: 150 + Math.random() * 200,
                    width: 80 + Math.random() * 60,
                    height: 15,
                    dimension: isMirror ? 'mirror' : 'both',
                    color: isMirror ? '#f5576c' : '#4ecdc4'
                });
            }
            
            platforms.push({
                x: 0,
                y: canvas.height - 20,
                width: canvas.width,
                height: 20,
                dimension: 'both',
                color: '#4a5568'
            });
            
            doors.push({
                x: canvas.width - 100,
                y: canvas.height - 80,
                width: 40,
                height: 60,
                color: '#48c78e',
                unlocked: false
            });
            
            for (let i = 0; i < 3 + level; i++) {
                collectibles.push({
                    x: 150 + i * 180,
                    y: 100 + Math.random() * 150,
                    dimension: Math.random() > 0.5 ? 'real' : 'mirror',
                    collected: false,
                    type: 'gem'
                });
            }
        }
        
        function switchDimension() {
            currentDimension = currentDimension === 'real' ? 'mirror' : 'real';
            
            const indicator = document.getElementById('dimensionIndicator');
            indicator.className = 'dimension-indicator ' + currentDimension;
            indicator.textContent = currentDimension === 'real' ? '🌍 现实世界' : '🔮 镜像世界';
            
            // 粒子效果
            for (let i = 0; i < 20; i++) {
                particles.push({
                    x: player.x + player.width / 2,
                    y: player.y + player.height / 2,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    life: 1,
                    color: currentDimension === 'real' ? '#4ecdc4' : '#f5576c'
                });
            }
        }
        
        function updatePlayer() {
            player.vx *= 0.95;
            player.vy += 0.5;
            
            let onGround = false;
            
            platforms.forEach(platform => {
                if (platform.dimension !== 'both' && platform.dimension !== currentDimension) return;
                
                if (player.y + player.height > platform.y &&
                    player.y + player.height < platform.y + platform.height + 10 &&
                    player.x < platform.x + platform.width &&
                    player.x + player.width > platform.x &&
                    player.vy >= 0) {
                    player.y = platform.y - player.height;
                    player.vy = 0;
                    onGround = true;
                }
            });
            
            player.onGround = onGround;
            
            player.x += player.vx;
            player.y += player.vy;
            
            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
        }
        
        function checkCollisions() {
            collectibles.forEach(c => {
                if (!c.collected && c.dimension === currentDimension) {
                    const dx = player.x + player.width / 2 - c.x;
                    const dy = player.y + player.height / 2 - c.y;
                    if (Math.sqrt(dx * dx + dy * dy) < 30) {
                        c.collected = true;
                        score += 150;
                        
                        for (let i = 0; i < 8; i++) {
                            particles.push({
                                x: c.x,
                                y: c.y,
                                vx: (Math.random() - 0.5) * 5,
                                vy: (Math.random() - 0.5) * 5,
                                life: 1,
                                color: '#a855f7'
                            });
                        }
                    }
                }
            });
            
            doors.forEach(door => {
                const allCollected = collectibles.every(c => c.collected);
                door.unlocked = allCollected;
                
                if (door.unlocked) {
                    if (player.x + player.width > door.x &&
                        player.x < door.x + door.width &&
                        player.y + player.height > door.y &&
                        player.y < door.y + door.height) {
                        level++;
                        score += level * 500;
                        initLevel();
                    }
                }
            });
            
            if (player.y > canvas.height + 100) {
                initLevel();
            }
            
            updateStats();
        }
        
        function updateParticles() {
            particles = particles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;
                return p.life > 0;
            });
        }
        
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 背景渐变
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            if (currentDimension === 'real') {
                gradient.addColorStop(0, '#0f0c29');
                gradient.addColorStop(1, '#24243e');
            } else {
                gradient.addColorStop(0, '#2d1b4e');
                gradient.addColorStop(1, '#1a0a2e');
            }
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 维度分界线
            ctx.strokeStyle = currentDimension === 'real' ? 'rgba(78, 205, 196, 0.3)' : 'rgba(245, 87, 108, 0.3)';
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);
            
            // 平台
            platforms.forEach(platform => {
                if (platform.dimension !== 'both') {
                    ctx.globalAlpha = platform.dimension === currentDimension ? 1 : 0.2;
                } else {
                    ctx.globalAlpha = 1;
                }
                
                ctx.fillStyle = platform.color;
                ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
            });
            ctx.globalAlpha = 1;
            
            // 收集物
            collectibles.forEach(c => {
                if (!c.collected) {
                    if (c.dimension === currentDimension) {
                        ctx.fillStyle = '#a855f7';
                        ctx.shadowColor = '#a855f7';
                        ctx.shadowBlur = 15;
                        ctx.font = '24px Arial';
                        ctx.textAlign = 'center';
                        ctx.fillText('💎', c.x, c.y + 8);
                        ctx.shadowBlur = 0;
                    } else {
                        ctx.globalAlpha = 0.3;
                        ctx.fillStyle = '#a855f7';
                        ctx.font = '24px Arial';
                        ctx.textAlign = 'center';
                        ctx.fillText('💎', c.x, c.y + 8);
                        ctx.globalAlpha = 1;
                    }
                }
            });
            
            // 门
            doors.forEach(door => {
                ctx.fillStyle = door.unlocked ? '#48c78e' : '#666';
                ctx.fillRect(door.x, door.y, door.width, door.height);
                
                if (door.unlocked) {
                    ctx.fillStyle = '#fff';
                    ctx.font = '20px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('🚪', door.x + door.width / 2, door.y + door.height / 2 + 7);
                }
            });
            
            // 玩家
            ctx.fillStyle = currentDimension === 'real' ? '#4ecdc4' : '#f5576c';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            
            // 粒子
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }
        
        function updateStats() {
            document.getElementById('level').textContent = level;
            document.getElementById('score').textContent = score;
            document.getElementById('highScore').textContent = GameCore.highScore.get(GAME_NAME);
            
            if (GameCore.highScore.set(GAME_NAME, score)) {
                GameCore.hints.show('新纪录！分数: ' + score);
            }
        }
        
        function gameLoop() {
            draw();
            
            if (gameRunning) {
                updatePlayer();
                checkCollisions();
                updateParticles();
            }
            
            updateStats();
            requestAnimationFrame(gameLoop);
        }
        
        document.addEventListener('keydown', e => {
            if (!gameRunning) return;
            
            if (e.code === 'ArrowRight' || e.code === 'KeyD') player.vx = 5;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') player.vx = -5;
            if (e.code === 'ArrowUp' || e.code === 'KeyW') {
                if (player.onGround) {
                    player.vy = -12;
                    player.onGround = false;
                }
            }
            if (e.code === 'Space') {
                switchDimension();
            }
        });
        
        document.addEventListener('keyup', e => {
            if (e.code === 'ArrowRight' || e.code === 'KeyD' || e.code === 'ArrowLeft' || e.code === 'KeyA') {
                player.vx = 0;
            }
        });
        
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            if (!gameRunning) return;
            
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            
            if (x < canvas.width / 3) {
                player.vx = -5;
            } else if (x > canvas.width * 2 / 3) {
                player.vx = 5;
            } else {
                if (player.onGround) {
                    player.vy = -12;
                    player.onGround = false;
                }
            }
        }, { passive: false });
        
        canvas.addEventListener('touchend', () => {
            player.vx = 0;
        });
        
        canvas.addEventListener('dblclick', switchDimension);
        
        document.getElementById('btnStart').onclick = () => {
            gameRunning = true;
            level = 1;
            score = 0;
            initLevel();
        };
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        gameLoop();
    </script>
</body>
</html>
