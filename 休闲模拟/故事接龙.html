<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>故事接龙</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; color: #fff; }
        
        .game-container { width: 100%; flex: 1; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: #ffd700; }
        .turn { font-size: 14px; opacity: 0.7; }
        
        .story-area { flex: 1; background: rgba(255,255,255,0.1); border-radius: 15px; padding: 20px; margin-bottom: 15px; overflow-y: auto; }
        .story-line { padding: 15px; margin-bottom: 10px; border-radius: 10px; }
        .story-line.you { background: rgba(78,205,196,0.3); border-left: 4px solid #4ecdc4; }
        .story-line.friend { background: rgba(240,147,251,0.3); border-left: 4px solid #f093fb; }
        
        .input-area { display: flex; gap: 10px; margin-bottom: 15px; }
        .story-input { flex: 1; padding: 15px; border: none; border-radius: 15px; font-size: 16px; background: rgba(255,255,255,0.9); }
        .submit-btn { padding: 15px 30px; border: none; border-radius: 15px; background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; font-weight: bold; cursor: pointer; }
        
        .suggestions-area { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
        .suggestion-tag { padding: 10px 15px; background: rgba(255,255,255,0.2); border-radius: 20px; cursor: pointer; font-size: 14px; }
        .suggestion-tag:hover { background: rgba(255,255,255,0.3); }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="title">📖 故事接龙</div>
            <div class="turn" id="turn">轮到你</div>
        </div>
        
        <div class="story-area" id="storyArea">
            <div class="story-line friend">
                <strong>👥 好友:</strong> 在一个遥远的星球上，有一个神秘的森林...
            </div>
        </div>
        
        <div class="suggestions-area">
            <div class="suggestion-tag" onclick="addSuggestion('突然出现了一道光芒')">✨ 突然出现了一道光芒</div>
            <div class="suggestion-tag" onclick="addSuggestion('一只会说话的猫走了出来')">🐱 一只会说话的猫走了出来</div>
            <div class="suggestion-tag" onclick="addSuggestion('森林深处传来奇怪的声音')">🔊 森林深处传来奇怪的声音</div>
            <div class="suggestion-tag" onclick="addSuggestion('一道传送门缓缓打开')">🌀 一道传送门缓缓打开</div>
        </div>
        
        <div class="input-area">
            <input type="text" class="story-input" id="storyInput" placeholder="继续故事...">
            <button class="submit-btn" onclick="submitStory()">发送</button>
        </div>
    </div>
    
    <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>

    <script src="game_core.js"></script>
    <script>
        const GAME_NAME = '故事接龙';
        GameCore.init({ highScore: GAME_NAME });
        
        const storyTemplates = [
            '突然，一只神奇的生物从树林中走了出来...',
            '就在这时，天空中出现了一道彩虹...',
            '远处传来了悠扬的歌声...',
            '地面开始微微震动...',
            '一道神秘的光芒笼罩了整个森林...',
            '一只会飞的兔子从头顶飞过...',
            '前方出现了一座古老的城堡...',
            '河水突然变得闪闪发光...',
            '森林里的树木开始移动...',
            '一个神秘的声音在耳边响起...'
        ];
        
        let storyLines = [
            { text: '在一个遥远的星球上，有一个神秘的森林...', author: 'friend' }
        ];
        let isYourTurn = true;
        
        function addSuggestion(text) {
            document.getElementById('storyInput').value = text;
        }
        
        function submitStory() {
            const input = document.getElementById('storyInput');
            const text = input.value.trim();
            
            if (!text) {
                GameCore.hints.show('请输入故事内容！');
                return;
            }
            
            if (!isYourTurn) {
                GameCore.hints.show('等待好友中...');
                return;
            }
            
            storyLines.push({ text: text, author: 'you' });
            renderStory();
            
            input.value = '';
            isYourTurn = false;
            document.getElementById('turn').textContent = '等待好友';
            
            GameCore.hints.show('✉️ 你发送了故事');
            
            setTimeout(() => {
                friendTurn();
            }, 2000);
        }
        
        function friendTurn() {
            const randomTemplate = storyTemplates[Math.floor(Math.random() * storyTemplates.length)];
            storyLines.push({ text: randomTemplate, author: 'friend' });
            renderStory();
            
            isYourTurn = true;
            document.getElementById('turn').textContent = '轮到你';
            
            GameCore.hints.show('👥 好友继续了故事');
        }
        
        function renderStory() {
            const area = document.getElementById('storyArea');
            area.innerHTML = '';
            
            storyLines.forEach(line => {
                const el = document.createElement('div');
                el.className = `story-line ${line.author}`;
                
                if (line.author === 'you') {
                    el.innerHTML = `<strong>👤 你:</strong> ${line.text}`;
                } else {
                    el.innerHTML = `<strong>👥 好友:</strong> ${line.text}`;
                }
                
                area.appendChild(el);
            });
            
            area.scrollTop = area.scrollHeight;
            
            GameCore.highScore.set(GAME_NAME, storyLines.length);
        }
        
        renderStory();
        GameCore.touch.enableAllButtons();
    </script>
</body>
</html>
