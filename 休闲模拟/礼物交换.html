<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>礼物交换</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; }
        
        .game-container { width: 100%; max-width: 500px; background: #fff; border-radius: 25px; padding: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.1); }
        
        .header { text-align: center; margin-bottom: 30px; }
        .title { font-size: 28px; font-weight: bold; color: #ff6b6b; }
        
        .players-area { display: flex; justify-content: space-around; margin-bottom: 30px; }
        .player-card { text-align: center; }
        .player-avatar { width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; margin-bottom: 10px; }
        .player-avatar.you { background: linear-gradient(135deg, #4ecdc4, #48c78e); }
        .player-avatar.friend1 { background: linear-gradient(135deg, #f093fb, #f5576c); }
        .player-avatar.friend2 { background: linear-gradient(135deg, #667eea, #764ba2); }
        .player-name { font-size: 14px; color: #666; }
        
        .gift-area { text-align: center; margin-bottom: 30px; }
        .gift-label { font-size: 14px; color: #666; margin-bottom: 15px; }
        .gift-box { width: 150px; height: 150px; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 60px; cursor: pointer; transition: transform 0.2s; margin: 0 auto; }
        .gift-box.unopened { background: linear-gradient(135deg, #ff6b6b, #ffa502); }
        .gift-box.opened { background: linear-gradient(135deg, #48c78e, #4ecdc4); }
        .gift-box:hover { transform: scale(1.1); }
        
        .exchange-area { display: flex; gap: 15px; justify-content: center; margin-bottom: 30px; }
        .exchange-btn { padding: 15px 30px; border: none; border-radius: 20px; font-size: 16px; font-weight: bold; cursor: pointer; transition: transform 0.2s; }
        .exchange-btn.confirm { background: linear-gradient(135deg, #48c78e, #4ecdc4); color: #fff; }
        .exchange-btn.cancel { background: rgba(0,0,0,0.1); color: #666; }
        .exchange-btn:hover { transform: scale(1.05); }
        
        .result-area { text-align: center; padding: 20px; background: rgba(72,199,142,0.1); border-radius: 15px; display: none; }
        .result-icon { font-size: 60px; margin-bottom: 10px; }
        .result-text { font-size: 20px; font-weight: bold; color: #48c78e; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 30px; font-size: 14px; }
    /* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */
/* [BATCH-FIX:ad-components-css] */
.sponsor-btn{position:fixed;bottom:8px;left:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:2px 6px;border-radius:10px;font:10px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.sponsor-panel.show{display:flex}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.interstitial-ad.show{display:flex}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* [/BATCH-FIX:ad-components-css] */

/* [AD-FIX:responsive] */
@media (max-width:768px){.ad-banner-container{display:none!important}.sponsor-btn{transform:scale(.8);opacity:.6}}
/* [/AD-FIX:responsive] */
</style>
</head>
<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="title">🎁 礼物交换</div>
        </div>
        
        <div class="players-area">
            <div class="player-card">
                <div class="player-avatar you">👤</div>
                <div class="player-name">你</div>
            </div>
            <div class="player-card">
                <div class="player-avatar friend1">👥</div>
                <div class="player-name">好友A</div>
            </div>
            <div class="player-card">
                <div class="player-avatar friend2">👧</div>
                <div class="player-name">好友B</div>
            </div>
        </div>
        
        <div class="gift-area">
            <div class="gift-label">你的礼物</div>
            <div class="gift-box unopened" id="giftBox" onclick="openGift()">🎁</div>
        </div>
        
        <div class="exchange-area" id="exchangeArea">
            <button class="exchange-btn confirm" onclick="confirmExchange()">✅ 交换礼物</button>
            <button class="exchange-btn cancel" onclick="cancelExchange()">❌ 取消</button>
        </div>
        
        <div class="result-area" id="resultArea">
            <div class="result-icon" id="resultIcon">🎉</div>
            <div class="result-text" id="resultText">交换成功！</div>
        </div>
    </div>
    
    

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <script>
        const GAME_NAME = '礼物交换';
        GameCore.init({ highScore: GAME_NAME });
        
        const gifts = [
            { emoji: '🎮', name: '游戏手柄', rarity: 'rare' },
            { emoji: '🎧', name: '耳机', rarity: 'rare' },
            { emoji: '📱', name: '手机', rarity: 'legendary' },
            { emoji: '👜', name: '包包', rarity: 'rare' },
            { emoji: '💄', name: '口红', rarity: 'common' },
            { emoji: '⌚', name: '手表', rarity: 'epic' },
            { emoji: '🎸', name: '吉他', rarity: 'epic' },
            { emoji: '📚', name: '书籍', rarity: 'common' },
            { emoji: '🎨', name: '画板', rarity: 'rare' },
            { emoji: '🚗', name: '玩具车', rarity: 'common' }
        ];
        
        let yourGift = null;
        let friendGifts = [];
        let giftOpened = false;
        let exchanged = false;
        
        function initGame() {
            yourGift = gifts[Math.floor(Math.random() * gifts.length)];
            
            friendGifts = [];
            for (let i = 0; i < 2; i++) {
                friendGifts.push(gifts[Math.floor(Math.random() * gifts.length)]);
            }
            
            giftOpened = false;
            exchanged = false;
            
            const giftBox = document.getElementById('giftBox');
            giftBox.className = 'gift-box unopened';
            giftBox.textContent = '🎁';
            
            document.getElementById('exchangeArea').style.display = 'none';
            document.getElementById('resultArea').style.display = 'none';
        }
        
        function openGift() {
            if (giftOpened) return;
            
            giftOpened = true;
            
            const giftBox = document.getElementById('giftBox');
            giftBox.className = 'gift-box opened';
            giftBox.textContent = yourGift.emoji;
            
            GameCore.hints.show(`你收到了 ${yourGift.name}！`);
            
            document.getElementById('exchangeArea').style.display = 'flex';
        }
        
        function confirmExchange() {
            if (exchanged) return;
            
            exchanged = true;
            
            const randomFriend = friendGifts[Math.floor(Math.random() * friendGifts.length)];
            
            const resultArea = document.getElementById('resultArea');
            const resultIcon = document.getElementById('resultIcon');
            const resultText = document.getElementById('resultText');
            
            resultArea.style.display = 'block';
            
            if (getRarityValue(randomFriend.rarity) >= getRarityValue(yourGift.rarity)) {
                resultIcon.textContent = '🎉';
                resultText.textContent = `交换成功！你换到了 ${randomFriend.emoji} ${randomFriend.name}`;
                GameCore.hints.show('交换成功！获得更好的礼物！');
            } else {
                resultIcon.textContent = '😢';
                resultText.textContent = `交换完成！你换到了 ${randomFriend.emoji} ${randomFriend.name}`;
                GameCore.hints.show('交换完成，礼物品质有所下降');
            }
            
            GameCore.highScore.set(GAME_NAME, getRarityValue(randomFriend.rarity) * 100);
        }
        
        function cancelExchange() {
            initGame();
        }
        
        function getRarityValue(rarity) {
            const values = { common: 1, rare: 2, epic: 3, legendary: 4 };
            return values[rarity] || 1;
        }
        
        initGame();
        GameCore.touch.enableAllButtons();
    </script>
<!-- [BATCH-FIX:responsive-js] -->
<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>
<!-- [/BATCH-FIX:responsive-js] -->
<!-- [BATCH-FIX:touch-support] -->
<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>
<!-- [/BATCH-FIX:touch-support] -->

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
