<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>礼物交换</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; }
        
        .game-container { width: 100%; max-width: 500px; background: #fff; border-radius: 25px; padding: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.1); }
        
        .header { text-align: center; margin-bottom: 30px; }
        .title { font-size: 28px; font-weight: bold; color: #ff6b6b; }
        
        .players-area { display: flex; justify-content: space-around; margin-bottom: 30px; }
        .player-card { text-align: center; }
        .player-avatar { width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; margin-bottom: 10px; }
        .player-avatar.you { background: linear-gradient(135deg, #4ecdc4, #48c78e); }
        .player-avatar.friend1 { background: linear-gradient(135deg, #f093fb, #f5576c); }
        .player-avatar.friend2 { background: linear-gradient(135deg, #667eea, #764ba2); }
        .player-name { font-size: 14px; color: #666; }
        
        .gift-area { text-align: center; margin-bottom: 30px; }
        .gift-label { font-size: 14px; color: #666; margin-bottom: 15px; }
        .gift-box { width: 150px; height: 150px; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 60px; cursor: pointer; transition: transform 0.2s; margin: 0 auto; }
        .gift-box.unopened { background: linear-gradient(135deg, #ff6b6b, #ffa502); }
        .gift-box.opened { background: linear-gradient(135deg, #48c78e, #4ecdc4); }
        .gift-box:hover { transform: scale(1.1); }
        
        .exchange-area { display: flex; gap: 15px; justify-content: center; margin-bottom: 30px; }
        .exchange-btn { padding: 15px 30px; border: none; border-radius: 20px; font-size: 16px; font-weight: bold; cursor: pointer; transition: transform 0.2s; }
        .exchange-btn.confirm { background: linear-gradient(135deg, #48c78e, #4ecdc4); color: #fff; }
        .exchange-btn.cancel { background: rgba(0,0,0,0.1); color: #666; }
        .exchange-btn:hover { transform: scale(1.05); }
        
        .result-area { text-align: center; padding: 20px; background: rgba(72,199,142,0.1); border-radius: 15px; display: none; }
        .result-icon { font-size: 60px; margin-bottom: 10px; }
        .result-text { font-size: 20px; font-weight: bold; color: #48c78e; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 30px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="title">🎁 礼物交换</div>
        </div>
        
        <div class="players-area">
            <div class="player-card">
                <div class="player-avatar you">👤</div>
                <div class="player-name">你</div>
            </div>
            <div class="player-card">
                <div class="player-avatar friend1">👥</div>
                <div class="player-name">好友A</div>
            </div>
            <div class="player-card">
                <div class="player-avatar friend2">👧</div>
                <div class="player-name">好友B</div>
            </div>
        </div>
        
        <div class="gift-area">
            <div class="gift-label">你的礼物</div>
            <div class="gift-box unopened" id="giftBox" onclick="openGift()">🎁</div>
        </div>
        
        <div class="exchange-area" id="exchangeArea">
            <button class="exchange-btn confirm" onclick="confirmExchange()">✅ 交换礼物</button>
            <button class="exchange-btn cancel" onclick="cancelExchange()">❌ 取消</button>
        </div>
        
        <div class="result-area" id="resultArea">
            <div class="result-icon" id="resultIcon">🎉</div>
            <div class="result-text" id="resultText">交换成功！</div>
        </div>
    </div>
    
    <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>

    <script src="game_core.js"></script>
    <script>
        const GAME_NAME = '礼物交换';
        GameCore.init({ highScore: GAME_NAME });
        
        const gifts = [
            { emoji: '🎮', name: '游戏手柄', rarity: 'rare' },
            { emoji: '🎧', name: '耳机', rarity: 'rare' },
            { emoji: '📱', name: '手机', rarity: 'legendary' },
            { emoji: '👜', name: '包包', rarity: 'rare' },
            { emoji: '💄', name: '口红', rarity: 'common' },
            { emoji: '⌚', name: '手表', rarity: 'epic' },
            { emoji: '🎸', name: '吉他', rarity: 'epic' },
            { emoji: '📚', name: '书籍', rarity: 'common' },
            { emoji: '🎨', name: '画板', rarity: 'rare' },
            { emoji: '🚗', name: '玩具车', rarity: 'common' }
        ];
        
        let yourGift = null;
        let friendGifts = [];
        let giftOpened = false;
        let exchanged = false;
        
        function initGame() {
            yourGift = gifts[Math.floor(Math.random() * gifts.length)];
            
            friendGifts = [];
            for (let i = 0; i < 2; i++) {
                friendGifts.push(gifts[Math.floor(Math.random() * gifts.length)]);
            }
            
            giftOpened = false;
            exchanged = false;
            
            const giftBox = document.getElementById('giftBox');
            giftBox.className = 'gift-box unopened';
            giftBox.textContent = '🎁';
            
            document.getElementById('exchangeArea').style.display = 'none';
            document.getElementById('resultArea').style.display = 'none';
        }
        
        function openGift() {
            if (giftOpened) return;
            
            giftOpened = true;
            
            const giftBox = document.getElementById('giftBox');
            giftBox.className = 'gift-box opened';
            giftBox.textContent = yourGift.emoji;
            
            GameCore.hints.show(`你收到了 ${yourGift.name}！`);
            
            document.getElementById('exchangeArea').style.display = 'flex';
        }
        
        function confirmExchange() {
            if (exchanged) return;
            
            exchanged = true;
            
            const randomFriend = friendGifts[Math.floor(Math.random() * friendGifts.length)];
            
            const resultArea = document.getElementById('resultArea');
            const resultIcon = document.getElementById('resultIcon');
            const resultText = document.getElementById('resultText');
            
            resultArea.style.display = 'block';
            
            if (getRarityValue(randomFriend.rarity) >= getRarityValue(yourGift.rarity)) {
                resultIcon.textContent = '🎉';
                resultText.textContent = `交换成功！你换到了 ${randomFriend.emoji} ${randomFriend.name}`;
                GameCore.hints.show('交换成功！获得更好的礼物！');
            } else {
                resultIcon.textContent = '😢';
                resultText.textContent = `交换完成！你换到了 ${randomFriend.emoji} ${randomFriend.name}`;
                GameCore.hints.show('交换完成，礼物品质有所下降');
            }
            
            GameCore.highScore.set(GAME_NAME, getRarityValue(randomFriend.rarity) * 100);
        }
        
        function cancelExchange() {
            initGame();
        }
        
        function getRarityValue(rarity) {
            const values = { common: 1, rare: 2, epic: 3, legendary: 4 };
            return values[rarity] || 1;
        }
        
        initGame();
        GameCore.touch.enableAllButtons();
    </script>
</body>
</html>
