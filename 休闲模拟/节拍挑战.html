<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>节拍挑战</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; color: #fff; overflow: hidden; }
        
        .game-container { width: 100%; flex: 1; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: #ffd700; }
        .stats { display: flex; gap: 20px; font-size: 14px; }
        
        .beat-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .beat-circle { width: 200px; height: 200px; border-radius: 50%; border: 4px solid rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; font-size: 48px; transition: all 0.1s; }
        .beat-circle.active { border-color: #ffd700; box-shadow: 0 0 50px rgba(255,215,0,0.5); transform: scale(1.1); }
        .beat-circle.perfect { border-color: #48c78e; background: rgba(72,199,142,0.3); }
        .beat-circle.good { border-color: #ffa502; background: rgba(255,165,2,0.3); }
        .beat-circle.miss { border-color: #ff6b6b; background: rgba(255,107,107,0.3); }
        
        .feedback { font-size: 24px; font-weight: bold; margin-top: 20px; opacity: 0; }
        .feedback.show { animation: feedbackAnim 0.5s; }
        
        @keyframes feedbackAnim {
            0% { opacity: 0; transform: translateY(20px); }
            50% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-20px); }
        }
        
        .progress-bar { width: 100%; height: 10px; background: rgba(255,255,255,0.2); border-radius: 5px; overflow: hidden; margin-bottom: 15px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #4ecdc4, #48c78e); transition: width 0.3s; }
        
        .controls { display: flex; gap: 10px; justify-content: center; }
        .btn { padding: 15px 30px; border: none; border-radius: 15px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }
    /* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}

<body>
    <div class="game-container">
        <div class="header">
            <div class="title">🥁 节拍挑战</div>
            <div class="stats">
                <span>分数: <span id="score">0</span></span>
                <span>连击: <span id="combo">0</span></span>
            </div>
        </div>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
        </div>
        
        <div class="beat-area">
            <div class="beat-circle" id="beatCircle">🎵</div>
            <div class="feedback" id="feedback">PERFECT!</div>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" id="beatBtn" onclick="hitBeat()">🎯 点击节拍</button>
        </div>
    </div>
    
    <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;

<script src="game_core.js"></script>
    <script>
        const GAME_NAME = '节拍挑战';
        GameCore.init({ highScore: GAME_NAME });
        
        let score = 0;
        let combo = 0;
        let beatInterval = 800;
        let beatTime = 0;
        let isPlaying = false;
        let beatsCompleted = 0;
        const totalBeats = 20;
        
        function initGame() {
            score = 0;
            combo = 0;
            beatInterval = 800;
            beatsCompleted = 0;
            isPlaying = false;
            
            updateUI();
        }
        
        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('combo').textContent = combo;
            document.getElementById('progressFill').style.width = (beatsCompleted / totalBeats * 100) + '%';
        }
        
        function startGame() {
            if (isPlaying) return;
            
            isPlaying = true;
            beatsCompleted = 0;
            score = 0;
            combo = 0;
            updateUI();
            
            scheduleBeat();
        }
        
        function scheduleBeat() {
            if (!isPlaying) return;
            
            setTimeout(() => {
                triggerBeat();
                
                beatsCompleted++;
                updateUI();
                
                if (beatsCompleted >= totalBeats) {
                    gameOver();
                    return;
                }
                
                beatInterval = Math.max(400, beatInterval - 20);
                scheduleBeat();
            }, beatInterval);
        }
        
        function triggerBeat() {
            const circle = document.getElementById('beatCircle');
            circle.classList.add('active');
            
            beatTime = Date.now();
            
            playBeatSound();
            
            setTimeout(() => {
                circle.classList.remove('active');
                circle.classList.remove('perfect');
                circle.classList.remove('good');
                circle.classList.remove('miss');
            }, 200);
        }
        
        function hitBeat() {
            if (!isPlaying) {
                startGame();
                return;
            }
            
            const now = Date.now();
            const diff = Math.abs(now - beatTime);
            
            const circle = document.getElementById('beatCircle');
            const feedback = document.getElementById('feedback');
            
            if (diff < 150) {
                combo++;
                score += 100 * combo;
                feedback.textContent = 'PERFECT!';
                feedback.style.color = '#48c78e';
                circle.classList.add('perfect');
            } else if (diff < 300) {
                combo++;
                score += 50 * combo;
                feedback.textContent = 'GOOD!';
                feedback.style.color = '#ffa502';
                circle.classList.add('good');
            } else {
                combo = 0;
                feedback.textContent = 'MISS!';
                feedback.style.color = '#ff6b6b';
                circle.classList.add('miss');
            }
            
            feedback.classList.remove('show');
            void feedback.offsetWidth;
            feedback.classList.add('show');
            
            updateUI();
        }
        
        function playBeatSound() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.frequency.value = 600;
            oscillator.type = 'square';
            
            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.1);
        }
        
        function gameOver() {
            isPlaying = false;
            GameCore.hints.show(`🎊 游戏结束！得分: ${score}`);
            GameCore.highScore.set(GAME_NAME, score);
        }
        
        initGame();
        GameCore.touch.enableAllButtons();
    </script>

<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>
<!-- [/BATCH-FIX:responsive-js] -->
<!-- [BATCH-FIX:touch-support] -->
<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>
<!-- [/BATCH-FIX:touch-support] -->

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
