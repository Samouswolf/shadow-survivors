<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>传奇英雄</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; color: #fff; overflow: hidden; }
        
        .game-container { width: 100%; flex: 1; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: #fff; }
        .stats { display: flex; gap: 20px; font-size: 14px; }
        
        .main-area { flex: 1; background: rgba(0,0,0,0.5); border-radius: 15px; overflow: hidden; position: relative; }
        
        .hero-display { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 80px; }
        
        .equipment-panel { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-around; }
        
        .equip-item { width: 60px; height: 60px; background: rgba(255,255,255,0.1); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        
        .status-panel { position: absolute; bottom: 20px; left: 0; right: 0; display: flex; justify-content: center; gap: 30px; }
        
        .status-item { text-align: center; }
        .status-bar { width: 100px; height: 15px; background: #333; border-radius: 8px; overflow: hidden; margin-top: 5px; }
        .status-fill { height: 100%; background: linear-gradient(90deg, #ff6b6b, #4ecdc4); }
        
        .actions { display: flex; gap: 10px; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; }
        
        .action-btn { flex: 1; padding: 15px; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; background: rgba(255,255,255,0.2); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="title">🦸 传奇英雄</div>
            <div class="stats">
                <span>🏆 等级: <span id="level">1</span></span>
                <span>⚔️ 攻击: <span id="attack">10</span></span>
                <span>🛡️ 防御: <span id="defense">5</span></span>
            </div>
        </div>
        
        <div class="main-area">
            <div class="equipment-panel">
                <div class="equip-item" id="weapon">🗡️</div>
                <div class="equip-item" id="armor">🛡️</div>
                <div class="equip-item" id="helmet">⛑️</div>
                <div class="equip-item" id="boots">👢</div>
            </div>
            
            <div class="hero-display" id="heroDisplay">🦸</div>
            
            <div class="status-panel">
                <div class="status-item">
                    <div>❤️ 生命</div>
                    <div class="status-bar"><div class="status-fill" id="hpBar"></div></div>
                    <div id="hpText">100/100</div>
                </div>
                <div class="status-item">
                    <div>✨ 经验</div>
                    <div class="status-bar"><div class="status-fill" id="expBar"></div></div>
                    <div id="expText">0/100</div>
                </div>
                <div class="status-item">
                    <div>💰 金币</div>
                    <div class="status-bar"><div class="status-fill" id="goldBar"></div></div>
                    <div id="goldText">0</div>
                </div>
            </div>
            
            <div id="message" style="position: absolute; top: 100px; left: 50%; transform: translateX(-50%); font-size: 18px;">开始你的传奇冒险！</div>
        </div>
        
        <div class="actions">
            <button class="action-btn" onclick="explore()">🗺️ 探索</button>
            <button class="action-btn" onclick="battle()">⚔️ 战斗</button>
            <button class="action-btn" onclick="shop()">🏪 商店</button>
            <button class="action-btn" onclick="rest()">😴 休息</button>
        </div>
    </div>
    
    <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <script>
        const GAME_NAME = '传奇英雄';
        GameCore.init({ highScore: GAME_NAME });
        
        let hero = {
            level: 1,
            hp: 100,
            maxHp: 100,
            attack: 10,
            defense: 5,
            exp: 0,
            gold: 0,
            equipment: {
                weapon: { name: '木剑', attack: 0 },
                armor: { name: '布衣', defense: 0 },
                helmet: { name: '无', defense: 0 },
                boots: { name: '草鞋', speed: 0 }
            }
        };
        
        const weapons = [
            { name: '木剑', attack: 0, price: 0 },
            { name: '铁剑', attack: 5, price: 50 },
            { name: '钢剑', attack: 10, price: 150 },
            { name: '秘银剑', attack: 20, price: 300 },
            { name: '屠龙剑', attack: 50, price: 1000 }
        ];
        
        const armors = [
            { name: '布衣', defense: 0, price: 0 },
            { name: '皮甲', defense: 3, price: 60 },
            { name: '锁子甲', defense: 8, price: 180 },
            { name: '板甲', defense: 15, price: 350 },
            { name: '龙鳞甲', defense: 30, price: 1200 }
        ];
        
        const enemies = [
            { name: '哥布林', hp: 30, attack: 5, reward: 15 },
            { name: '骷髅兵', hp: 50, attack: 10, reward: 25 },
            { name: '狼人', hp: 80, attack: 15, reward: 40 },
            { name: '石像鬼', hp: 120, attack: 25, reward: 60 },
            { name: '巨龙', hp: 300, attack: 50, reward: 200 }
        ];
        
        function initGame() {
            updateUI();
        }
        
        function updateUI() {
            const totalAttack = hero.attack + hero.equipment.weapon.attack;
            const totalDefense = hero.defense + hero.equipment.armor.defense + hero.equipment.helmet.defense;
            
            document.getElementById('level').textContent = hero.level;
            document.getElementById('attack').textContent = totalAttack;
            document.getElementById('defense').textContent = totalDefense;
            
            document.getElementById('hpText').textContent = `${hero.hp}/${hero.maxHp}`;
            document.getElementById('hpBar').style.width = `${(hero.hp / hero.maxHp) * 100}%`;
            
            const expNeeded = hero.level * 100;
            document.getElementById('expText').textContent = `${hero.exp}/${expNeeded}`;
            document.getElementById('expBar').style.width = `${(hero.exp / expNeeded) * 100}%`;
            
            document.getElementById('goldText').textContent = hero.gold;
            document.getElementById('goldBar').style.width = `${Math.min(100, (hero.gold / 500) * 10)}%`;
            
            GameCore.highScore.set(GAME_NAME, hero.level);
        }
        
        function setMessage(msg) {
            document.getElementById('message').textContent = msg;
        }
        
        function explore() {
            if (hero.hp < 20) {
                setMessage('体力不足！需要休息！');
                return;
            }
            
            hero.hp -= 10;
            
            const findGold = Math.floor(Math.random() * 30);
            const findExp = Math.floor(Math.random() * 20);
            
            hero.gold += findGold;
            hero.exp += findExp;
            
            setMessage(`🗺️ 探索发现了 ${findGold} 金币和 ${findExp} 经验！`);
            
            checkLevelUp();
            updateUI();
        }
        
        function battle() {
            if (hero.hp < 30) {
                setMessage('体力不足！需要休息！');
                return;
            }
            
            const enemyIndex = Math.min(Math.floor(hero.level / 2), enemies.length - 1);
            const enemy = enemies[enemyIndex];
            
            const totalAttack = hero.attack + hero.equipment.weapon.attack;
            const totalDefense = hero.defense + hero.equipment.armor.defense + hero.equipment.helmet.defense;
            
            const heroDamage = Math.max(1, totalAttack - enemy.attack / 2);
            const enemyDamage = Math.max(1, enemy.attack - totalDefense);
            
            hero.hp -= enemyDamage;
            
            if (heroDamage > Math.random() * 10) {
                hero.gold += enemy.reward;
                hero.exp += enemy.reward * 2;
                setMessage(`⚔️ 战胜了 ${enemy.name}！获得 ${enemy.reward} 金币和 ${enemy.reward * 2} 经验！`);
            } else {
                setMessage(`⚔️ 与 ${enemy.name} 战斗失败！`);
            }
            
            checkLevelUp();
            updateUI();
        }
        
        function shop() {
            const weaponIndex = Math.min(Math.floor(hero.gold / 100), weapons.length - 1);
            const armorIndex = Math.min(Math.floor(hero.gold / 100), armors.length - 1);
            
            const weapon = weapons[weaponIndex];
            const armor = armors[armorIndex];
            
            if (hero.gold >= weapon.price && weapon.attack > hero.equipment.weapon.attack) {
                hero.gold -= weapon.price;
                hero.equipment.weapon = weapon;
                setMessage(`🏪 购买了 ${weapon.name}！攻击+${weapon.attack}`);
            } else if (hero.gold >= armor.price && armor.defense > hero.equipment.armor.defense) {
                hero.gold -= armor.price;
                hero.equipment.armor = armor;
                setMessage(`🏪 购买了 ${armor.name}！防御+${armor.defense}`);
            } else {
                setMessage('🏪 没有足够的金币购买更好的装备！');
            }
            
            updateUI();
        }
        
        function rest() {
            const restore = Math.floor(hero.maxHp * 0.5);
            const cost = 10;
            
            if (hero.gold < cost) {
                setMessage('金币不足！');
                return;
            }
            
            hero.gold -= cost;
            hero.hp = Math.min(hero.maxHp, hero.hp + restore);
            
            setMessage(`😴 休息恢复了 ${restore} 点体力！花费 ${cost} 金币`);
            updateUI();
        }
        
        function checkLevelUp() {
            const expNeeded = hero.level * 100;
            if (hero.exp >= expNeeded) {
                hero.exp -= expNeeded;
                hero.level++;
                hero.maxHp += 20;
                hero.hp = hero.maxHp;
                hero.attack += 5;
                hero.defense += 2;
                setMessage(`🏆 升级了！当前等级: ${hero.level}`);
            }
        }
        
        initGame();
        GameCore.touch.enableAllButtons();
    </script>
</body>
</html>
