<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>涂鸦画板</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #2d1b4e 0%, #4a2c7a 50%, #6b3fa0 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; color: #fff; overflow: hidden; }
        
        .game-container { width: 100%; flex: 1; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: #fff; }
        
        .canvas-area { flex: 1; background: #fff; border-radius: 15px; overflow: hidden; position: relative; }
        canvas { width: 100%; height: 100%; cursor: crosshair; }
        
        .tools { display: flex; flex-wrap: wrap; gap: 10px; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; }
        
        .color-btn { width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer; }
        .color-btn.selected { border: 3px solid #fff; }
        
        .tool-btn { padding: 10px 20px; border: none; border-radius: 10px; font-size: 14px; cursor: pointer; background: rgba(255,255,255,0.2); color: #fff; }
        .tool-btn.selected { background: #4ecdc4; }
        
        .size-selector { display: flex; align-items: center; gap: 10px; }
        .size-btn { width: 30px; height: 30px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); cursor: pointer; }
        .size-btn.selected { background: #4ecdc4; border-color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="title">🎨 涂鸦画板</div>
            <button class="tool-btn" onclick="clearCanvas()">🗑️ 清空</button>
        </div>
        
        <div class="canvas-area">
            <canvas id="canvas"></canvas>
        </div>
        
        <div class="tools">
            <div class="size-selector">
                <span style="font-size: 14px;">粗细:</span>
                <button class="size-btn selected" onclick="setSize(2)"></button>
                <button class="size-btn" onclick="setSize(5)"></button>
                <button class="size-btn" onclick="setSize(10)"></button>
                <button class="size-btn" onclick="setSize(15)"></button>
            </div>
            
            <div style="width: 1px; background: rgba(255,255,255,0.3);"></div>
            
            <button class="color-btn selected" style="background: #000;" onclick="setColor('#000')"></button>
            <button class="color-btn" style="background: #ff6b6b;" onclick="setColor('#ff6b6b')"></button>
            <button class="color-btn" style="background: #4ecdc4;" onclick="setColor('#4ecdc4')"></button>
            <button class="color-btn" style="background: #ffd700;" onclick="setColor('#ffd700')"></button>
            <button class="color-btn" style="background: #667eea;" onclick="setColor('#667eea')"></button>
            <button class="color-btn" style="background: #f093fb;" onclick="setColor('#f093fb')"></button>
            <button class="color-btn" style="background: #48c78e;" onclick="setColor('#48c78e')"></button>
            <button class="color-btn" style="background: #ffa502;" onclick="setColor('#ffa502')"></button>
            
            <div style="width: 1px; background: rgba(255,255,255,0.3);"></div>
            
            <button class="tool-btn selected" onclick="setTool('brush')">✏️ 画笔</button>
            <button class="tool-btn" onclick="setTool('eraser')">🧹 橡皮</button>
        </div>
    </div>
    
    <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>

    <script src="game_core.js"></script>
    <script>
        const GAME_NAME = '涂鸦画板';
        GameCore.init({ highScore: GAME_NAME });
        
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let isDrawing = false;
        let currentColor = '#000';
        let currentSize = 2;
        let currentTool = 'brush';
        
        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        
        function startDrawing(e) {
            isDrawing = true;
            draw(e);
        }
        
        function stopDrawing() {
            isDrawing = false;
            ctx.beginPath();
        }
        
        function draw(e) {
            if (!isDrawing) return;
            
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX || e.touches[0].clientX) - rect.left;
            const y = (e.clientY || e.touches[0].clientY) - rect.top;
            
            ctx.lineWidth = currentSize;
            ctx.lineCap = 'round';
            
            if (currentTool === 'brush') {
                ctx.strokeStyle = currentColor;
            } else {
                ctx.strokeStyle = '#fff';
            }
            
            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }
        
        function setColor(color) {
            currentColor = color;
            document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('selected'));
            event.target.classList.add('selected');
        }
        
        function setSize(size) {
            currentSize = size;
            document.querySelectorAll('.size-btn').forEach(btn => btn.classList.remove('selected'));
            event.target.classList.add('selected');
        }
        
        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('selected'));
            event.target.classList.add('selected');
        }
        
        function clearCanvas() {
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        
        resizeCanvas();
        clearCanvas();
        
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseout', stopDrawing);
        
        canvas.addEventListener('touchstart', startDrawing);
        canvas.addEventListener('touchend', stopDrawing);
        canvas.addEventListener('touchmove', draw);
        
        window.addEventListener('resize', () => {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            resizeCanvas();
            ctx.putImageData(imageData, 0, 0);
        });
        
        GameCore.touch.enableAllButtons();
    </script>
</body>
</html>
