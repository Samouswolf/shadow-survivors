<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>流体穿梭</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: #0a0a0a; min-height: 100vh; overflow: hidden; color: #fff; }
        .game-container { width: 100%; height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 10px; }
        .stat { display: flex; flex-direction: column; align-items: center; }
        .stat-label { font-size: 12px; opacity: 0.7; }
        .stat-value { font-size: 24px; font-weight: bold; color: #00d2ff; }
        
        .game-area { flex: 1; position: relative; background: #000; border-radius: 15px; overflow: hidden; }
        #gameCanvas { width: 100%; height: 100%; display: block; }
        
        .fluid-indicator { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 10px; font-size: 16px; }
        
        .controls { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
        .btn { padding: 12px 25px; border: none; border-radius: 25px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">关卡</div>
                <div class="stat-value" id="level">1</div>
            </div>
            <div class="stat">
                <div class="stat-label">分数</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">最高</div>
                <div class="stat-value" id="highScore">0</div>
            </div>
        </div>
        
        <div class="game-area">
            <canvas id="gameCanvas"></canvas>
            <div class="fluid-indicator" id="fluidIndicator">💧 流体: 水</div>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" id="btnStart">▶️ 开始游戏</button>
        </div>
        
        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const GAME_NAME = '流体穿梭';
        GameCore.init({ highScore: GAME_NAME });
        
        let level = 1;
        let score = 0;
        let gameRunning = false;
        
        let player = { x: 50, y: 300, radius: 20, vx: 0, vy: 0 };
        let particles = [];
        let obstacles = [];
        let targets = [];
        
        const FLUID_TYPES = [
            { name: '水', color: '#00d2ff', viscosity: 0.98, gravity: 0.3 },
            { name: '岩浆', color: '#ff6b6b', viscosity: 0.95, gravity: 0.5 },
            { name: '果冻', color: '#a855f7', viscosity: 0.9, gravity: 0.1 },
            { name: '空气', color: '#4ecdc4', viscosity: 0.99, gravity: 0 }
        ];
        
        let currentFluid = FLUID_TYPES[0];
        
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            initLevel();
        }
        
        function initLevel() {
            player.x = 50;
            player.y = canvas.height / 2;
            player.vx = 0;
            player.vy = 0;
            
            particles = [];
            obstacles = [];
            targets = [];
            
            for (let i = 0; i < 100; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 2,
                    vy: (Math.random() - 0.5) * 2,
                    radius: 3 + Math.random() * 3
                });
            }
            
            const obstacleCount = 3 + level;
            for (let i = 0; i < obstacleCount; i++) {
                obstacles.push({
                    x: 150 + i * 150,
                    y: 100 + Math.random() * (canvas.height - 200),
                    width: 40,
                    height: 80 + Math.random() * 60,
                    color: '#666'
                });
            }
            
            targets.push({
                x: canvas.width - 80,
                y: canvas.height / 2,
                radius: 30,
                color: '#48c78e'
            });
        }
        
        function switchFluid() {
            const index = (FLUID_TYPES.indexOf(currentFluid) + 1) % FLUID_TYPES.length;
            currentFluid = FLUID_TYPES[index];
            
            document.getElementById('fluidIndicator').textContent = '💧 流体: ' + currentFluid.name;
            
            for (let i = 0; i < 30; i++) {
                particles.push({
                    x: player.x,
                    y: player.y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    radius: 5,
                    life: 1
                });
            }
        }
        
        function updatePlayer() {
            player.vx *= currentFluid.viscosity;
            player.vy += currentFluid.gravity;
            
            player.x += player.vx;
            player.y += player.vy;
            
            obstacles.forEach(obs => {
                if (player.x - player.radius < obs.x + obs.width &&
                    player.x + player.radius > obs.x &&
                    player.y - player.radius < obs.y + obs.height &&
                    player.y + player.radius > obs.y) {
                    
                    if (player.vx > 0) player.x = obs.x + obs.width + player.radius;
                    if (player.vx < 0) player.x = obs.x - player.radius;
                    if (player.vy > 0) player.y = obs.y + obs.height + player.radius;
                    if (player.vy < 0) player.y = obs.y - player.radius;
                    
                    player.vx *= -0.5;
                    player.vy *= -0.5;
                }
            });
            
            if (player.x < player.radius) player.x = player.radius;
            if (player.x > canvas.width - player.radius) player.x = canvas.width - player.radius;
            if (player.y < player.radius) player.y = player.radius;
            if (player.y > canvas.height - player.radius) player.y = canvas.height - player.radius;
        }
        
        function updateParticles() {
            particles = particles.filter(p => {
                p.vx *= currentFluid.viscosity;
                p.vy += currentFluid.gravity;
                p.x += p.vx;
                p.y += p.vy;
                
                if (p.x < 0) { p.x = canvas.width; }
                if (p.x > canvas.width) { p.x = 0; }
                if (p.y > canvas.height) { p.y = 0; }
                
                if (p.life !== undefined) {
                    p.life -= 0.02;
                    return p.life > 0;
                }
                
                return true;
            });
        }
        
        function checkCollisions() {
            targets.forEach(target => {
                const dx = player.x - target.x;
                const dy = player.y - target.y;
                if (Math.sqrt(dx * dx + dy * dy) < player.radius + target.radius) {
                    level++;
                    score += level * 500;
                    initLevel();
                }
            });
            
            updateStats();
        }
        
        function draw() {
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 流体背景
            const gradient = ctx.createRadialGradient(player.x, player.y, 0, player.x, player.y, 300);
            gradient.addColorStop(0, currentFluid.color + '40');
            gradient.addColorStop(1, 'transparent');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 粒子
            particles.forEach(p => {
                ctx.fillStyle = currentFluid.color;
                ctx.globalAlpha = p.life !== undefined ? p.life : 0.6;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
            
            // 障碍物
            obstacles.forEach(obs => {
                ctx.fillStyle = obs.color;
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            });
            
            // 目标
            targets.forEach(target => {
                ctx.fillStyle = target.color;
                ctx.shadowColor = target.color;
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.arc(target.x, target.y, target.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                
                ctx.fillStyle = '#fff';
                ctx.font = '24px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('🎯', target.x, target.y + 8);
            });
            
            // 玩家
            ctx.fillStyle = currentFluid.color;
            ctx.shadowColor = currentFluid.color;
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }
        
        function updateStats() {
            document.getElementById('level').textContent = level;
            document.getElementById('score').textContent = score;
            document.getElementById('highScore').textContent = GameCore.highScore.get(GAME_NAME);
            
            if (GameCore.highScore.set(GAME_NAME, score)) {
                GameCore.hints.show('新纪录！分数: ' + score);
            }
        }
        
        function gameLoop() {
            draw();
            
            if (gameRunning) {
                updatePlayer();
                updateParticles();
                checkCollisions();
            }
            
            updateStats();
            requestAnimationFrame(gameLoop);
        }
        
        document.addEventListener('keydown', e => {
            if (!gameRunning) return;
            
            if (e.code === 'ArrowRight' || e.code === 'KeyD') player.vx = 5;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') player.vx = -5;
            if (e.code === 'ArrowUp' || e.code === 'KeyW') player.vy = -5;
            if (e.code === 'ArrowDown' || e.code === 'KeyS') player.vy = 5;
            if (e.code === 'Space') switchFluid();
        });
        
        document.addEventListener('keyup', e => {
            if (e.code === 'ArrowRight' || e.code === 'KeyD' || e.code === 'ArrowLeft' || e.code === 'KeyA') player.vx = 0;
            if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'ArrowDown' || e.code === 'KeyS') player.vy = 0;
        });
        
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            if (!gameRunning) return;
            
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            
            if (x < canvas.width / 2) {
                player.vx = -5;
            } else {
                player.vx = 5;
            }
        }, { passive: false });
        
        canvas.addEventListener('touchend', () => {
            player.vx = 0;
        });
        
        canvas.addEventListener('dblclick', switchFluid);
        
        document.getElementById('btnStart').onclick = () => {
            gameRunning = true;
            level = 1;
            score = 0;
            initLevel();
        };
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        gameLoop();
    </script>
</body>
</html>
