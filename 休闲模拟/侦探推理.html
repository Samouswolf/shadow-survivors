<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>侦探推理</title>
    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #2d3436 0%, #636e72 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px;
            background: linear-gradient(135deg, #2d3436, #636e72);
            border-radius: 12px;
        }
        .stat {
            text-align: center;
            color: white;
        }
        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }
        .stat-value {
            font-size: 20px;
            font-weight: bold;
        }
        .case-area {
            padding: 20px;
            background: #dfe6e9;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .case-title {
            font-size: 18px;
            color: #2d3436;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .case-desc {
            font-size: 14px;
            color: #636e72;
            line-height: 1.6;
        }
        .suspects-area {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .suspect {
            flex: 1;
            padding: 15px;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            border: 2px solid #dfe6e9;
            transition: all 0.2s;
        }
        .suspect:hover {
            border-color: #2d3436;
        }
        .suspect.selected {
            border-color: #e74c3c;
            background: #ffeaa7;
        }
        .suspect-avatar {
            font-size: 30px;
            margin-bottom: 5px;
        }
        .suspect-name {
            font-size: 14px;
            color: #2d3436;
            font-weight: bold;
        }
        .suspect-info {
            font-size: 12px;
            color: #636e72;
        }
        .clues-area {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            padding: 10px;
            background: #ffeaa7;
            border-radius: 10px;
        }
        .clue-btn {
            padding: 10px 15px;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .clue-btn:hover {
            background: #2d3436;
            color: white;
        }
        .clue-btn.checked {
            background: #00b894;
            color: white;
        }
        .evidence-area {
            padding: 15px;
            background: #dfe6e9;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .evidence-title {
            font-size: 14px;
            color: #2d3436;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .evidence-list {
            font-size: 14px;
            color: #636e72;
        }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #2d3436, #636e72);
            color: white;
        }
        .btn-danger {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 20px 40px;
            border-radius: 15px;
            font-size: 18px;
            display: none;
            z-index: 100;
            text-align: center;
        }
        .message.show { display: block; }
        .ad-banner {
            width: 100%;
            height: 60px;
            background: linear-gradient(135deg, #2d3436, #636e72);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">案件</div>
                <div class="stat-value" id="caseNum">1</div>
            </div>
            <div class="stat">
                <div class="stat-label">线索</div>
                <div class="stat-value" id="cluesFound">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">破案</div>
                <div class="stat-value" id="solved">0</div>
            </div>
        </div>

        <div class="case-area">
            <div class="case-title" id="caseTitle">案件标题</div>
            <div class="case-desc" id="caseDesc">案件描述</div>
        </div>

        <div class="suspects-area" id="suspectsArea"></div>

        <div class="clues-area" id="cluesArea"></div>

        <div class="evidence-area">
            <div class="evidence-title">收集的证据：</div>
            <div class="evidence-list" id="evidenceList">暂无证据</div>
        </div>

        <div class="controls">
            <button class="btn btn-danger" id="btnAccuse">🔍 指认凶手</button>
            <button class="btn btn-primary" id="btnReset">🔄 新案件</button>
        </div>

        <div class="message" id="message"></div>

        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    <script>
        const CASES = [
            {
                title: '珠宝店盗窃案',
                desc: '珠宝店在夜间被盗，价值百万的钻石失踪。店门完好，窗户有破损痕迹。',
                suspects: [
                    { name: '店员A', avatar: '👨', info: '当晚值班', guilty: false },
                    { name: '店员B', avatar: '👩', info: '早班下班', guilty: true },
                    { name: '保安', avatar: '🧔', info: '巡逻时间', guilty: false }
                ],
                clues: [
                    { text: '检查窗户', evidence: '窗户破损来自内部' },
                    { text: '查看监控', evidence: '监控被删除' },
                    { text: '询问店员', evidence: '店员B有钥匙' }
                ],
                answer: '店员B'
            },
            {
                title: '书房谋杀案',
                desc: '富商在书房被发现死亡，门窗紧锁。桌上有一杯茶和未完成的书稿。',
                suspects: [
                    { name: '管家', avatar: '🧔', info: '发现尸体', guilty: false },
                    { name: '秘书', avatar: '👨', info: '整理书稿', guilty: true },
                    { name: '妻子', avatar: '👩', info: '外出购物', guilty: false }
                ],
                clues: [
                    { text: '检查茶杯', evidence: '茶中有毒药' },
                    { text: '查看书稿', evidence: '书稿被修改' },
                    { text: '询问秘书', evidence: '秘书知道密码' }
                ],
                answer: '秘书'
            },
            {
                title: '博物馆失窃案',
                desc: '珍贵文物在展览期间失踪，展厅监控显示无人进入。',
                suspects: [
                    { name: '馆长', avatar: '👨', info: '管理文物', guilty: false },
                    { name: '修复师', avatar: '👩', info: '修复文物', guilty: true },
                    { name: '清洁工', avatar: '🧔', info: '打扫展厅', guilty: false }
                ],
                clues: [
                    { text: '检查展柜', evidence: '展柜锁完好' },
                    { text: '查看记录', evidence: '修复记录异常' },
                    { text: '询问修复师', evidence: '修复师有复制品' }
                ],
                answer: '修复师'
            }
        ];

        let currentCase = null;
        let selectedSuspect = null;
        let cluesFound = 0;
        let evidence = [];
        let caseNum = 1;
        let solved = 0;
        let checkedClues = [];

        function initGame() {
            currentCase = CASES[caseNum - 1];
            selectedSuspect = null;
            cluesFound = 0;
            evidence = [];
            checkedClues = [];

            renderCase();
            renderSuspects();
            renderClues();
            renderEvidence();
            updateUI();
        }

        function renderCase() {
            document.getElementById('caseTitle').textContent = currentCase.title;
            document.getElementById('caseDesc').textContent = currentCase.desc;
        }

        function renderSuspects() {
            const el = document.getElementById('suspectsArea');
            el.innerHTML = '';

            currentCase.suspects.forEach(suspect => {
                const div = document.createElement('div');
                div.className = 'suspect' + (selectedSuspect?.name === suspect.name ? ' selected' : '');
                div.innerHTML = `
                    <div class="suspect-avatar">${suspect.avatar}</div>
                    <div class="suspect-name">${suspect.name}</div>
                    <div class="suspect-info">${suspect.info}</div>
                `;
                div.addEventListener('click', () => selectSuspect(suspect));
                el.appendChild(div);
            });
        }

        function renderClues() {
            const el = document.getElementById('cluesArea');
            el.innerHTML = '';

            currentCase.clues.forEach((clue, i) => {
                const btn = document.createElement('div');
                btn.className = 'clue-btn' + (checkedClues.includes(i) ? ' checked' : '');
                btn.textContent = clue.text;
                btn.addEventListener('click', () => checkClue(i));
                el.appendChild(btn);
            });
        }

        function renderEvidence() {
            const el = document.getElementById('evidenceList');
            if (evidence.length === 0) {
                el.textContent = '暂无证据';
            } else {
                el.innerHTML = evidence.map(e => '<div>• ' + e + '</div>').join('');
            }
        }

        function selectSuspect(suspect) {
            selectedSuspect = suspect;
            renderSuspects();
        }

        function checkClue(index) {
            if (checkedClues.includes(index)) {
                showMessage('已检查过此线索');
                return;
            }

            checkedClues.push(index);
            cluesFound++;
            evidence.push(currentCase.clues[index].evidence);

            showMessage('发现证据：' + currentCase.clues[index].evidence);

            renderClues();
            renderEvidence();
            updateUI();
        }

        function accuse() {
            if (!selectedSuspect) {
                showMessage('请先选择嫌疑人！');
                return;
            }

            if (selectedSuspect.name === currentCase.answer) {
                solved++;
                showMessage('🎉 破案成功！凶手是' + selectedSuspect.name);
                GameCore.highScore.set('detective_game', solved);

                caseNum++;
                if (caseNum > CASES.length) {
                    showMessage('所有案件已破！\n破案数: ' + solved);
                    return;
                }

                setTimeout(initGame, 2000);
            } else {
                showMessage('❌ 指认错误！请重新推理');
            }

            updateUI();
        }

        function updateUI() {
            document.getElementById('caseNum').textContent = caseNum;
            document.getElementById('cluesFound').textContent = cluesFound;
            document.getElementById('solved').textContent = solved;
        }

        function showMessage(msg) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 2000);
        }

        document.getElementById('btnAccuse').addEventListener('click', accuse);
        document.getElementById('btnReset').addEventListener('click', () => {
            caseNum = 1;
            solved = 0;
            initGame();
        });

        // 初始化
        GameCore.init({ highScore: 'detective_game' });
        initGame();
    </script>
</body>
</html>
