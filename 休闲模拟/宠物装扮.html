<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>宠物装扮</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); min-height: 100vh; overflow: hidden; }
        .game-container { width: 100%; height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.5); border-radius: 15px; margin-bottom: 10px; }
        .currency { display: flex; align-items: center; gap: 5px; color: #333; font-size: 16px; font-weight: bold; }
        
        .pet-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(255,255,255,0.5); border-radius: 15px; position: relative; }
        .pet { font-size: 150px; transition: all 0.3s; }
        .pet-name { font-size: 24px; color: #333; margin-top: 10px; }
        
        .category-tabs { display: flex; gap: 5px; margin-bottom: 10px; overflow-x: auto; }
        .tab { padding: 8px 15px; background: rgba(255,255,255,0.5); border-radius: 20px; cursor: pointer; font-size: 14px; white-space: nowrap; }
        .tab.active { background: linear-gradient(135deg, #ff6b6b, #ee5a5a); color: #fff; }
        
        .shop-area { flex: 1; background: rgba(255,255,255,0.5); border-radius: 15px; padding: 15px; overflow-y: auto; }
        .items-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .item { aspect-ratio: 1; background: rgba(255,255,255,0.8); border-radius: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; border: 3px solid transparent; transition: all 0.3s; }
        .item:hover { transform: scale(1.05); }
        .item.selected { border-color: #ff6b6b; }
        .item.owned { border-color: #4ecdc4; }
        .item-icon { font-size: 32px; }
        .item-name { font-size: 10px; margin-top: 5px; text-align: center; }
        
        .actions { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
        .btn { padding: 12px 30px; border: none; border-radius: 25px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #4ecdc4, #44a08d); color: #fff; }
        .btn-danger { background: linear-gradient(135deg, #ff6b6b, #ee5a5a); color: #fff; }
        
        .message { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); color: #fff; padding: 20px 40px; border-radius: 15px; font-size: 20px; display: none; z-index: 100; }
        .message.show { display: block; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 10px; font-size: 14px; }
    /* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */
/* [BATCH-FIX:ad-components-css] */
.sponsor-btn{position:fixed;top:44px;right:8px;z-index:20;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.25);color:#ffd700;padding:3px 9px;border-radius:10px;font:11px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.sponsor-panel.show{display:flex}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,.45);height:60px;max-height:60px}
.ad-banner-container .ad-label{color:rgba(255,255,255,.5);font:12px "Microsoft YaHei",sans-serif}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.interstitial-ad.show{display:flex}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* [/BATCH-FIX:ad-components-css] */
</style>
</head>
<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="currency">💰 <span id="money">1000</span></div>
            <div class="currency">❤️ <span id="happiness">100</span></div>
        </div>
        
        <div class="pet-area">
            <div class="pet" id="pet">🐱</div>
            <div class="pet-name" id="petName">咪咪</div>
        </div>
        
        <div class="category-tabs" id="tabs">
            <div class="tab active" data-category="head">🎩 头饰</div>
            <div class="tab" data-category="clothes">👕 衣服</div>
            <div class="tab" data-category="accessory">🎀 配饰</div>
            <div class="tab" data-category="background">🎨 背景</div>
        </div>
        
        <div class="shop-area" id="shopArea"></div>
        
        <div class="actions">
            <button class="btn btn-primary" id="btnWear">🎀 穿戴</button>
            <button class="btn btn-danger" id="btnBuy">💰 购买</button>
        </div>
        
        <div class="message" id="message"></div>
        
        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script>
        const PETS = ['🐱', '🐶', '🐰', '🐹', '🐻', '🐼'];
        
        const ITEMS = {
            head: [
                { id: 'h1', emoji: '🎩', name: '礼帽', cost: 100 },
                { id: 'h2', emoji: '🎀', name: '蝴蝶结', cost: 80 },
                { id: 'h3', emoji: '🐾', name: '猫耳', cost: 150 },
                { id: 'h4', emoji: '👑', name: '皇冠', cost: 300 },
                { id: 'h5', emoji: '🎃', name: '南瓜', cost: 120 },
                { id: 'h6', emoji: '🎄', name: '圣诞帽', cost: 200 }
            ],
            clothes: [
                { id: 'c1', emoji: '🎽', name: '背心', cost: 100 },
                { id: 'c2', emoji: '👗', name: '裙子', cost: 150 },
                { id: 'c3', emoji: '🧥', name: '外套', cost: 200 },
                { id: 'c4', emoji: '👕', name: 'T恤', cost: 80 },
                { id: 'c5', emoji: '🎃', name: '万圣节', cost: 250 },
                { id: 'c6', emoji: '🎄', name: '圣诞装', cost: 300 }
            ],
            accessory: [
                { id: 'a1', emoji: '🎈', name: '气球', cost: 50 },
                { id: 'a2', emoji: '🎀', name: '丝带', cost: 80 },
                { id: 'a3', emoji: '📿', name: '项链', cost: 120 },
                { id: 'a4', emoji: '💎', name: '宝石', cost: 200 },
                { id: 'a5', emoji: '🎁', name: '礼物', cost: 100 },
                { id: 'a6', emoji: '🍭', name: '棒棒糖', cost: 60 }
            ],
            background: [
                { id: 'bg1', emoji: '🌸', name: '樱花', cost: 150 },
                { id: 'bg2', emoji: '🌺', name: '花园', cost: 200 },
                { id: 'bg3', emoji: '🏠', name: '家', cost: 100 },
                { id: 'bg4', emoji: '🏝️', name: '沙滩', cost: 250 },
                { id: 'bg5', emoji: '❄️', name: '雪地', cost: 180 },
                { id: 'bg6', emoji: '🌟', name: '星空', cost: 300 }
            ]
        };
        
        let money = 1000;
        let happiness = 100;
        let currentPetIndex = 0;
        let ownedItems = new Set(['h1', 'c1', 'a1', 'bg1']);
        let equippedItems = { head: 'h1', clothes: 'c1', accessory: 'a1', background: 'bg1' };
        
        let currentCategory = 'head';
        let selectedItem = null;
        
        const shopArea = document.getElementById('shopArea');
        const messageEl = document.getElementById('message');
        
        function renderItems() {
            shopArea.innerHTML = '';
            const items = ITEMS[currentCategory];
            
            items.forEach(item => {
                const el = document.createElement('div');
                el.className = `item ${ownedItems.has(item.id) ? 'owned' : ''} ${selectedItem === item.id ? 'selected' : ''}`;
                el.innerHTML = `
                    <div class="item-icon">${item.emoji}</div>
                    <div class="item-name">${item.name}</div>
                    ${ownedItems.has(item.id) ? '<div style="font-size: 10px; color: #4ecdc4;">已拥有</div>' : `<div style="font-size: 10px; color: #ff6b6b;">💰${item.cost}</div>`}
                `;
                el.onclick = () => selectItem(item.id);
                shopArea.appendChild(el);
            });
        }
        
        function selectItem(id) {
            selectedItem = id;
            renderItems();
        }
        
        function updatePet() {
            const pet = PETS[currentPetIndex];
            const head = ITEMS.head.find(i => i.id === equippedItems.head);
            const clothes = ITEMS.clothes.find(i => i.id === equippedItems.clothes);
            const accessory = ITEMS.accessory.find(i => i.id === equippedItems.accessory);
            
            document.getElementById('pet').textContent = head.emoji + pet + clothes.emoji + accessory.emoji;
            
            const names = ['咪咪', '旺财', '兔兔', '仓鼠', '熊熊', '熊猫'];
            document.getElementById('petName').textContent = names[currentPetIndex];
        }
        
        function changePet() {
            currentPetIndex = (currentPetIndex + 1) % PETS.length;
            updatePet();
            happiness = Math.min(100, happiness + 10);
            updateStats();
            showMessage('换了一只宠物！');
        }
        
        function wearItem() {
            if (!selectedItem || !ownedItems.has(selectedItem)) {
                showMessage('请选择已拥有的物品！');
                return;
            }
            
            equippedItems[currentCategory] = selectedItem;
            happiness = Math.min(100, happiness + 5);
            
            updatePet();
            renderItems();
            updateStats();
            
            showMessage('穿戴成功！');
        }
        
        function buyItem() {
            if (!selectedItem || ownedItems.has(selectedItem)) {
                showMessage('请选择未拥有的物品！');
                return;
            }
            
            const item = ITEMS[currentCategory].find(i => i.id === selectedItem);
            if (money < item.cost) {
                showMessage('资金不足！');
                return;
            }
            
            money -= item.cost;
            ownedItems.add(selectedItem);
            
            updateStats();
            renderItems();
            
            showMessage(`购买了${item.name}！`);
        }
        
        function updateStats() {
            document.getElementById('money').textContent = money;
            document.getElementById('happiness').textContent = happiness;
        }
        
        function showMessage(msg) {
            messageEl.textContent = msg;
            messageEl.classList.add('show');
            setTimeout(() => messageEl.classList.remove('show'), 2000);
        }
        
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentCategory = tab.dataset.category;
                selectedItem = null;
                renderItems();
            });
        });
        
        document.getElementById('btnWear').addEventListener('click', wearItem);
        document.getElementById('btnBuy').addEventListener('click', buyItem);
        
        document.getElementById('pet').addEventListener('click', changePet);
        
        updatePet();
        renderItems();
        updateStats();
    </script>
<!-- [BATCH-FIX:responsive-js] -->
<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>
<!-- [/BATCH-FIX:responsive-js] -->
<!-- [BATCH-FIX:touch-support] -->
<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>
<!-- [/BATCH-FIX:touch-support] -->
<!-- [BATCH-FIX:ad-components-html] -->
<button class="sponsor-btn" id="batchSponsorBtn" onclick="document.getElementById('batchSponsorPanel').classList.add('show')">💚 赞助</button>
<div class="sponsor-panel" id="batchSponsorPanel">
  <h2>支持我们</h2>
  <p style="color:#ccc;font:14px 'Microsoft YaHei',sans-serif">您的支持是我们持续开发的动力</p>
  <button class="sponsor-close" onclick="document.getElementById('batchSponsorPanel').classList.remove('show')">关闭</button>
</div>
<div class="ad-banner-container"><span class="ad-label">📢 广告位</span></div>
<div class="interstitial-ad" id="batchInterstitialAd">
  <div style="text-align:center">
    <p style="color:#ccc;font:16px 'Microsoft YaHei',sans-serif;margin-bottom:16px">广告加载中...</p>
    <button class="skip-btn" onclick="document.getElementById('batchInterstitialAd').classList.remove('show')">跳过 ⏭</button>
  </div>
</div>

<script>
(function(){
  if (window.__batchFixAds) return;

  window.addEventListener('load', function() {
    var btn = document.getElementById('batchSponsorBtn');
    if (btn) btn.style.display = '';
  });

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
</body>
