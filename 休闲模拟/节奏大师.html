<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>节奏大师</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; color: #fff; overflow: hidden; }
        
        .game-container { width: 100%; flex: 1; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: #fff; }
        .stats { display: flex; gap: 20px; font-size: 14px; }
        
        .main-area { flex: 1; background: rgba(0,0,0,0.5); border-radius: 15px; overflow: hidden; position: relative; }
        
        .tracks { position: absolute; top: 0; left: 0; right: 0; bottom: 100px; display: flex; }
        
        .track { flex: 1; border-right: 1px solid rgba(255,255,255,0.1); position: relative; }
        
        .hit-zone { position: absolute; bottom: 20px; left: 10px; right: 10px; height: 60px; background: rgba(255,255,255,0.2); border-radius: 10px; }
        
        .note { position: absolute; width: 60%; left: 20%; height: 20px; background: #ff6b6b; border-radius: 5px; }
        
        .score-display { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); font-size: 48px; font-weight: bold; color: #ffd700; }
        
        .combo-display { position: absolute; top: 80px; left: 50%; transform: translateX(-50%); font-size: 24px; color: #4ecdc4; }
        
        .actions { display: flex; gap: 10px; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; }
        
        .action-btn { flex: 1; padding: 20px; border: none; border-radius: 10px; font-size: 20px; cursor: pointer; background: rgba(255,255,255,0.2); color: #fff; }
        .action-btn:active { background: rgba(255,255,255,0.4); }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="title">🎵 节奏大师</div>
            <div class="stats">
                <span>⏱️ 时间: <span id="time">60</span></span>
                <span>⭐ 完美: <span id="perfect">0</span></span>
                <span>✅ 连击: <span id="combo">0</span></span>
            </div>
        </div>
        
        <div class="main-area">
            <div class="score-display" id="score">0</div>
            <div class="combo-display" id="comboText">COMBO: 0</div>
            
            <div class="tracks">
                <div class="track" id="track0">
                    <div class="hit-zone"></div>
                </div>
                <div class="track" id="track1">
                    <div class="hit-zone"></div>
                </div>
                <div class="track" id="track2">
                    <div class="hit-zone"></div>
                </div>
                <div class="track" id="track3">
                    <div class="hit-zone"></div>
                </div>
            </div>
        </div>
        
        <div class="actions">
            <button class="action-btn" id="btn0" onclick="hitNote(0)">🔴</button>
            <button class="action-btn" id="btn1" onclick="hitNote(1)">🟢</button>
            <button class="action-btn" id="btn2" onclick="hitNote(2)">🔵</button>
            <button class="action-btn" id="btn3" onclick="hitNote(3)">🟡</button>
        </div>
    </div>
    
    <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <script>
        const GAME_NAME = '节奏大师';
        GameCore.init({ highScore: GAME_NAME });
        
        let score = 0;
        let combo = 0;
        let perfect = 0;
        let timeLeft = 60;
        let notes = [];
        let gameRunning = true;
        let noteSpeed = 3;
        
        const colors = ['#ff6b6b', '#4ecdc4', '#3498db', '#f39c12'];
        
        function initGame() {
            updateUI();
            gameLoop();
            spawnNote();
            startTimer();
        }
        
        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('time').textContent = timeLeft;
            document.getElementById('perfect').textContent = perfect;
            document.getElementById('combo').textContent = combo;
            document.getElementById('comboText').textContent = `COMBO: ${combo}`;
            
            GameCore.highScore.set(GAME_NAME, score);
        }
        
        function spawnNote() {
            if (!gameRunning) return;
            
            const track = Math.floor(Math.random() * 4);
            notes.push({
                track: track,
                y: -20,
                color: colors[track]
            });
            
            const interval = Math.max(300, 800 - score / 10);
            setTimeout(spawnNote, interval);
        }
        
        function startTimer() {
            const timer = setInterval(() => {
                timeLeft--;
                updateUI();
                
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    gameOver();
                }
            }, 1000);
        }
        
        function hitNote(track) {
            if (!gameRunning) return;
            
            const hitZoneY = 420;
            
            for (let i = notes.length - 1; i >= 0; i--) {
                const note = notes[i];
                if (note.track === track && Math.abs(note.y - hitZoneY) < 50) {
                    const distance = Math.abs(note.y - hitZoneY);
                    
                    if (distance < 20) {
                        score += 100 * (combo + 1);
                        perfect++;
                        combo++;
                        GameCore.hints.show('PERFECT!');
                    } else {
                        score += 50 * (combo + 1);
                        combo++;
                        GameCore.hints.show('GOOD');
                    }
                    
                    notes.splice(i, 1);
                    updateUI();
                    return;
                }
            }
            
            combo = 0;
            GameCore.hints.show('MISS');
            updateUI();
        }
        
        function update() {
            if (!gameRunning) return;
            
            notes.forEach(note => {
                note.y += noteSpeed;
            });
            
            notes = notes.filter(note => note.y < 500);
            
            notes.forEach(note => {
                if (note.y > 470) {
                    combo = 0;
                    updateUI();
                }
            });
        }
        
        function render() {
            notes.forEach(note => {
                const track = document.getElementById(`track${note.track}`);
                let existingNote = track.querySelector('.note');
                if (!existingNote) {
                    existingNote = document.createElement('div');
                    existingNote.className = 'note';
                    track.appendChild(existingNote);
                }
                
                existingNote.style.top = `${note.y}px`;
                existingNote.style.background = note.color;
            });
            
            document.querySelectorAll('.track').forEach(track => {
                const trackNotes = track.querySelectorAll('.note');
                trackNotes.forEach(note => {
                    const y = parseFloat(note.style.top);
                    if (y > 500) {
                        note.remove();
                    }
                });
            });
        }
        
        function gameLoop() {
            update();
            render();
            
            if (gameRunning) {
                requestAnimationFrame(gameLoop);
            }
        }
        
        function gameOver() {
            gameRunning = false;
            GameCore.hints.show(`游戏结束！最终得分: ${score}`);
        }
        
        document.addEventListener('keydown', (e) => {
            const keyMap = { 'd': 0, 'f': 1, 'j': 2, 'k': 3 };
            if (keyMap[e.key]) {
                hitNote(keyMap[e.key]);
                const btn = document.getElementById(`btn${keyMap[e.key]}`);
                btn.style.background = 'rgba(255,255,255,0.4)';
                setTimeout(() => btn.style.background = 'rgba(255,255,255,0.2)', 100);
            }
        });
        
        initGame();
        GameCore.touch.enableAllButtons();
    </script>
</body>
</html>
