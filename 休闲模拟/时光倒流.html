<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>时光倒流</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 20px; color: #fff; }
        
        .game-container { width: 100%; flex: 1; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 15px; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: #ffd700; }
        .time-status { font-size: 14px; opacity: 0.7; }
        
        .game-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; margin-bottom: 15px; }
        .canvas-container { position: relative; width: 300px; height: 400px; background: rgba(0,0,0,0.3); border-radius: 15px; overflow: hidden; }
        
        .player { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 40px; height: 40px; border-radius: 50%; background: #4ecdc4; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .player.reversed { background: #f093fb; }
        
        .obstacle { position: absolute; width: 60px; height: 20px; background: #ff6b6b; border-radius: 5px; }
        .obstacle.reversed { background: #ffa502; }
        
        .goal { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 60px; height: 60px; border-radius: 50%; background: #48c78e; display: flex; align-items: center; justify-content: center; font-size: 30px; }
        
        .controls { display: flex; gap: 10px; justify-content: center; }
        .btn { padding: 15px 30px; border: none; border-radius: 15px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; }
        .btn-secondary { background: rgba(255,255,255,0.2); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="title">⏰ 时光倒流</div>
            <div class="time-status" id="timeStatus">时间: 正向</div>
        </div>
        
        <div class="game-area">
            <div class="canvas-container" id="canvasContainer">
                <div class="goal" id="goal">🏁</div>
                <div class="player" id="player">👤</div>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn btn-secondary" onclick="moveLeft()">◀ 左移</button>
            <button class="btn btn-primary" onclick="reverseTime()">⏪ 时光倒流</button>
            <button class="btn btn-secondary" onclick="moveRight()">右移 ▶</button>
        </div>
    </div>
    
    <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>

    
  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="game_core.js"></script>
    <script>
        const GAME_NAME = '时光倒流';
        GameCore.init({ highScore: GAME_NAME });
        
        const levels = [
            [{ x: 50, y: 300, speed: 2 }],
            [{ x: 50, y: 300, speed: 3 }, { x: 200, y: 200, speed: -2 }],
            [{ x: 100, y: 350, speed: 2 }, { x: 150, y: 250, speed: -3 }, { x: 200, y: 150, speed: 2 }],
            [{ x: 80, y: 350, speed: 3 }, { x: 120, y: 280, speed: -2 }, { x: 180, y: 200, speed: 3 }, { x: 220, y: 120, speed: -2 }],
            [{ x: 60, y: 350, speed: 4 }, { x: 100, y: 300, speed: -3 }, { x: 150, y: 250, speed: 3 }, { x: 200, y: 180, speed: -4 }, { x: 240, y: 100, speed: 2 }]
        ];
        
        let currentLevel = 0;
        let player = { x: 150, y: 380 };
        let obstacles = [];
        let isReversed = false;
        let history = [];
        let historyIndex = -1;
        let gameLoop = null;
        
        function initGame() {
            currentLevel = 0;
            loadLevel();
        }
        
        function loadLevel() {
            player = { x: 150, y: 380 };
            isReversed = false;
            history = [];
            historyIndex = -1;
            
            const container = document.getElementById('canvasContainer');
            container.innerHTML = `
                <div class="goal" id="goal">🏁</div>
                <div class="player" id="player">👤</div>
            `;
            
            obstacles = [];
            levels[currentLevel].forEach((obs, index) => {
                const el = document.createElement('div');
                el.className = 'obstacle';
                el.style.left = obs.x + 'px';
                el.style.top = obs.y + 'px';
                el.id = `obstacle-${index}`;
                container.appendChild(el);
                
                obstacles.push({
                    x: obs.x,
                    y: obs.y,
                    speed: obs.speed,
                    el: el
                });
            });
            
            updatePlayer();
            updateTimeStatus();
            
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(gameUpdate, 50);
        }
        
        function updatePlayer() {
            const el = document.getElementById('player');
            el.style.left = player.x + 'px';
            el.style.top = player.y + 'px';
            el.className = `player ${isReversed ? 'reversed' : ''}`;
        }
        
        function updateTimeStatus() {
            document.getElementById('timeStatus').textContent = `时间: ${isReversed ? '倒流' : '正向'} | 关卡: ${currentLevel + 1}`;
        }
        
        function gameUpdate() {
            if (isReversed) {
                obstacles.forEach(obs => {
                    obs.speed = -obs.speed;
                });
                isReversed = false;
                updateTimeStatus();
            }
            
            obstacles.forEach(obs => {
                obs.x += obs.speed;
                
                if (obs.x < 0 || obs.x > 240) {
                    obs.speed = -obs.speed;
                }
                
                obs.el.style.left = obs.x + 'px';
            });
            
            checkCollision();
        }
        
        function checkCollision() {
            const playerEl = document.getElementById('player');
            const playerRect = playerEl.getBoundingClientRect();
            
            obstacles.forEach(obs => {
                const obsRect = obs.el.getBoundingClientRect();
                
                if (playerRect.left < obsRect.right &&
                    playerRect.right > obsRect.left &&
                    playerRect.top < obsRect.bottom &&
                    playerRect.bottom > obsRect.top) {
                    GameCore.hints.show('💥 碰撞！时光倒流中...');
                    reverseTime();
                }
            });
            
            const goalRect = document.getElementById('goal').getBoundingClientRect();
            if (playerRect.left < goalRect.right &&
                playerRect.right > goalRect.left &&
                playerRect.top < goalRect.bottom &&
                playerRect.bottom > goalRect.top) {
                GameCore.hints.show('🎉 通关！');
                GameCore.highScore.set(GAME_NAME, currentLevel + 1);
                
                currentLevel++;
                if (currentLevel >= levels.length) {
                    currentLevel = 0;
                    GameCore.hints.show('🎊 全部通关！');
                }
                
                setTimeout(() => {
                    loadLevel();
                }, 1000);
            }
        }
        
        function moveLeft() {
            player.x = Math.max(20, player.x - 20);
            updatePlayer();
        }
        
        function moveRight() {
            player.x = Math.min(280, player.x + 20);
            updatePlayer();
        }
        
        function reverseTime() {
            isReversed = true;
            updateTimeStatus();
            
            obstacles.forEach(obs => {
                obs.speed = -obs.speed;
                obs.el.classList.add('reversed');
            });
            
            const playerEl = document.getElementById('player');
            playerEl.classList.add('reversed');
            
            setTimeout(() => {
                obstacles.forEach(obs => {
                    obs.el.classList.remove('reversed');
                });
                playerEl.classList.remove('reversed');
            }, 500);
        }
        
        initGame();
        GameCore.touch.enableAllButtons();
    </script>
</body>
</html>
