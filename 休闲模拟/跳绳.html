<!DOCTYPE html>

<head>

<title>节奏跳绳</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a14;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent;font-family:"Microsoft YaHei","PingFang SC",sans-serif;user-select:none;-webkit-user-select:none}
canvas{display:block;position:fixed;top:0;left:0;width:100%;height:100%}
#ui{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:10}
.score-panel{position:absolute;top:20px;left:50%;transform:translateX(-50%);display:flex;gap:24px;align-items:center}
.score-item{text-align:center}
.score-label{font-size:11px;color:#666;text-transform:uppercase;letter-spacing:2px}
.score-value{font-size:42px;font-weight:900;color:#fff;line-height:1;text-shadow:0 0 20px rgba(0,255,200,.3)}
.score-value.combo{font-size:28px;color:#ff6b35;text-shadow:0 0 20px rgba(255,107,53,.5)}
.score-value.best{font-size:20px;color:#ffd700;text-shadow:0 0 15px rgba(255,215,0,.4)}
#comboText{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:48px;font-weight:900;color:#ff6b35;text-shadow:0 0 40px rgba(255,107,53,.8);pointer-events:none;opacity:0;transition:opacity .15s}
#comboText.show{opacity:1;animation:comboPop .4s ease-out}
@keyframes comboPop{0%{transform:translate(-50%,-50%) scale(0.5);opacity:0}30%{opacity:1}100%{transform:translate(-50%,-50%) scale(1.2);opacity:0}}
#gameOver{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.85);pointer-events:auto;z-index:15}
#gameOver.show{display:flex}
#gameOver h2{font-size:36px;color:#ff4444;margin-bottom:8px;text-shadow:0 0 30px rgba(255,68,68,.5)}
#gameOver .result-row{display:flex;gap:32px;margin:16px 0}
#gameOver .result-item{text-align:center}
#gameOver .result-item .r-val{font-size:36px;font-weight:900;color:#fff}
#gameOver .result-item .r-label{font-size:12px;color:#888;margin-top:4px}
#gameOver .new-best{color:#ffd700!important;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
#restartBtn{padding:14px 48px;background:linear-gradient(135deg,#ff6b35,#ff8c42);border:none;border-radius:30px;color:#fff;font-size:20px;font-weight:700;cursor:pointer;margin-top:20px;transition:.2s;pointer-events:auto;letter-spacing:1px;box-shadow:0 4px 20px rgba(255,107,53,.4)}
#restartBtn:hover{transform:scale(1.05);box-shadow:0 6px 30px rgba(255,107,53,.6)}
#restartBtn:active{transform:scale(.95)}
.instruction{position:absolute;bottom:140px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.3);font-size:13px;letter-spacing:1px;transition:opacity .5s}
/* 广告系统 */
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);height:90px;max-height:90px;overflow:hidden;contain:layout style paint;pointer-events:none!important}.ad-banner-container,.ad-banner-container *{pointer-events:none!important}.ad-banner-container iframe{max-height:90px;pointer-events:none!important}
.ad-banner-container iframe{max-width:100%}
.ad-label{position:absolute;top:1px;right:6px;font:9px "Microsoft YaHei",sans-serif;color:rgba(255,255,255,.35)}

.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}
.sponsor-panel{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.sponsor-panel.show{display:flex;pointer-events:auto}
.sponsor-panel h2{color:#ffd700;font:bold 26px "Microsoft YaHei",sans-serif;margin-bottom:4px}
.sponsor-panel .qr-row{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.sponsor-panel .qr-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px;text-align:center;min-width:140px}
.sponsor-panel .qr-card .qr-icon{font-size:48px;margin-bottom:6px}
.sponsor-panel .qr-card .qr-label{color:#ccc;font:13px "Microsoft YaHei",sans-serif}
.sponsor-panel .qr-card .qr-hint{color:#888;font:11px "Microsoft YaHei",sans-serif;margin-top:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.interstitial-ad.show{display:flex;pointer-events:auto}
.interstitial-ad .ad-content{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;text-align:center;min-width:280px;max-width:400px}
.interstitial-ad .ad-content p{color:#aaa;font:14px "Microsoft YaHei",sans-serif;margin-bottom:12px}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
/* 开始界面 */
.start-screen{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.88);gap:20px;pointer-events:auto}
.start-screen.hidden{display:none}
.start-screen h1{font-size:clamp(28px,6vw,48px);font-weight:900;color:#fff;text-shadow:0 0 30px rgba(255,255,255,.3);letter-spacing:3px;text-align:center;padding:0 20px}
.start-screen .subtitle{color:#888;font-size:14px;text-align:center;padding:0 20px;line-height:1.6}
.start-screen .start-btn{padding:14px 56px;background:linear-gradient(135deg,#667eea,#764ba2);border:none;border-radius:30px;color:#fff;font-size:20px;font-weight:700;cursor:pointer;transition:.2s;letter-spacing:2px;box-shadow:0 6px 30px rgba(102,126,234,.4);animation:startPulse 2s ease-in-out infinite}
.start-screen .start-btn:hover{transform:scale(1.05);box-shadow:0 8px 40px rgba(102,126,234,.6)}
.start-screen .start-btn:active{transform:scale(.95)}
@keyframes startPulse{0%,100%{box-shadow:0 6px 30px rgba(102,126,234,.4)}50%{box-shadow:0 6px 50px rgba(102,126,234,.7)}}
.start-screen .keys-hint{color:#555;font-size:12px;text-align:center;padding:0 20px;line-height:1.8}

/* [BUGFIX startgame-v2] 开始按钮强制可见+广告关闭可点击 */
.sponsor-close,#sponsorClose,.skip-btn,#skipInterstitial{pointer-events:auto!important;}
/* [BATCH-FIX:responsive-css] */
canvas{max-width:100%!important;height:auto!important}
.game-container,.game-area,#gameContainer,#gameArea{max-width:100%!important}
/* [/BATCH-FIX:responsive-css] */

/* [AD-FIX:responsive] */
@media (max-width:768px){.ad-banner-container{display:none!important}.sponsor-btn{transform:scale(.8);opacity:.6}}
/* [/AD-FIX:responsive] */
</style>

<div class="start-screen" id="startScreen">

<script>
/* [STORAGE-POLYFILL v1] */
;(function(){
  var G = (typeof window !== 'undefined') ? window : (typeof globalThis !== 'undefined' ? globalThis : this);
  // 浏览器已有 Storage 构造函数，需确保其带 load/save/remove 静态方法
  var S = G.Storage;
  var needAttach = (typeof S === 'undefined' || typeof S.load !== 'function' || typeof S.save !== 'function');
  if (!needAttach) return;
  if (typeof S === 'undefined') { S = function(){}; G.Storage = S; }
  function parseSafe(s, d){
    if (s === null || s === undefined) return d;
    try { return JSON.parse(s); } catch(e) { try { return s; } catch(e2){ return d; } }
  }
  S.load = function(k, d){ try { return parseSafe(localStorage.getItem(k), d); } catch(e){ return d; } };
  S.save = function(k, v){ try { localStorage.setItem(k, typeof v==='string'?v:JSON.stringify(v)); } catch(e){} };
  S.remove = function(k){ try { localStorage.removeItem(k); } catch(e){} };
})();

(function(){
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W,H;
let groundY, playerX, ropePivotX, ropePivotY;

// 游戏状态
const STATE = { IDLE:'idle', PLAYING:'playing', OVER:'over' };
let state = STATE.IDLE;
let score = 0;
let combo = 0;
let maxCombo = 0;
let bestScore = 0;
let ropeAngle = 0;
let ropeSpeed = 2.5; // 基础角速度
let ropeLength = 0;
let playerY = 0;
let playerBaseY = 0;
let playerVy = 0;
let playerJumping = false;
let playerJumpForce = 0;
let GRAVITY = 0;
let JUMP_VELOCITY = 0;
let trail = [];
let particles = [];
let speedLevel = 0;
let shakeAmount = 0;
let groundPulse = 0;
let jumpScoredThisSwing = false;

// 绳子视觉参数
const ROPE_SEGMENTS = 40;
const TRAIL_LENGTH = 25;

// 完美跳跃判定窗口（弧度）
let perfectWindow = 0.35;
let goodWindow = 0.55;

// 背景粒子
let bgParticles = [];

function resize(){
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  groundY = H * 0.78;
  ropePivotX = W/2;
  ropePivotY = H * 0.08;
  ropeLength = H * 0.84;
  playerX = W/2;
  playerBaseY = groundY;
  playerY = playerBaseY;
  GRAVITY = H * 0.0045;
  JUMP_VELOCITY = -H * 0.035;
  perfectWindow = 0.35;
  goodWindow = 0.55;
  initBgParticles();
}
window.addEventListener('resize',resize);

function initBgParticles(){
  bgParticles = [];
  for(let i=0;i<30;i++){
    bgParticles.push({
      x:Math.random()*W,
      y:Math.random()*H,
      r:Math.random()*1.5+0.5,
      vx:(Math.random()-0.5)*0.3,
      vy:(Math.random()-0.5)*0.3 - 0.2,
      alpha:Math.random()*0.3+0.1
    });
  }
}

// 输入处理
function handleJump(e){
  if(e&&e.preventDefault)e.preventDefault();
  if(state===STATE.OVER) return;
  if(state===STATE.IDLE){
    startGame();
    return;
  }
  if(!playerJumping){
    playerJumping = true;
    playerVy = JUMP_VELOCITY;
    playerJumpForce = 1;
  }
}

document.addEventListener('click',handleJump);
document.addEventListener('touchstart',handleJump,{passive:false});
document.addEventListener('keydown',function(e){
  if(e.code==='Space'||e.key===' '){
    e.preventDefault();
    handleJump();
  }
});

function startGame(){
  state = STATE.PLAYING;
  score = 0;
  combo = 0;
  maxCombo = 0;
  ropeAngle = 0;
  ropeSpeed = 2.5;
  speedLevel = 0;
  playerY = playerBaseY;
  playerVy = 0;
  playerJumping = false;
  trail = [];
  particles = [];
  shakeAmount = 0;
  groundPulse = 0;
  jumpScoredThisSwing = false;
  updateUI();
  document.getElementById('hint').style.opacity='0';
  document.getElementById('gameOver').classList.remove('show');
}

function gameOver(){
  state = STATE.OVER;
  if(score > bestScore){
    bestScore = score;
    localStorage.setItem('ropeSkippingBest',bestScore);
  }
  document.getElementById('goScore').textContent = score;
  document.getElementById('goMaxCombo').textContent = 'x'+maxCombo;
  document.getElementById('goBest').textContent = bestScore;
  if(score >= bestScore && score > 0){
    document.getElementById('goBest').classList.add('new-best');
  }else{
    document.getElementById('goBest').classList.remove('new-best');
  }
  document.getElementById('gameOver').classList.add('show');
  document.getElementById('hint').style.opacity='1';
  shakeAmount = 15;
  // 显示插屏广告
  setTimeout(function(){
    var ia=document.getElementById('interstitialAd');
    if(ia)ia.classList.add('show');
  },800);
}

function updateUI(){
  document.getElementById('score').textContent = score;
  document.getElementById('combo').textContent = 'x'+(combo+1);
  document.getElementById('best').textContent = bestScore;
}

function showComboText(text){
  var el = document.getElementById('comboText');
  el.textContent = text;
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
}

// 绳子碰撞检测 - 检测绳子任意位置是否碰到玩家
function checkCollision(){
  let footX = playerX;
  let footY = playerY + 50;
  let hitRadius = Math.max(35, W*0.06);
  
  // 绳子角度不在底部区域则不可能碰到
  let a = ropeAngle % (Math.PI*2);
  if(a < 0) a += Math.PI*2;
  if(a < Math.PI*0.4 || a > Math.PI*1.6) return false;
  
  // 检测绳子沿线多个采样点
  let samples = 12;
  for(let i=0;i<=samples;i++){
    let t = i/samples;
    let sx = ropePivotX + Math.cos(ropeAngle) * ropeLength * t;
    let sy = ropePivotY + Math.sin(ropeAngle) * ropeLength * t;
    let dx = sx - footX;
    let dy = sy - footY;
    let dist = Math.sqrt(dx*dx+dy*dy);
    if(dist < hitRadius) return true;
  }
  return false;
}

function update(dt){
  if(state!==STATE.PLAYING) return;
  
  dt = Math.min(dt, 0.05); // 防止大帧跳跃
  
  // 更新绳子角度
  ropeAngle += ropeSpeed * dt;
  if(ropeAngle > Math.PI*2) ropeAngle -= Math.PI*2;
  
  // 更新轨迹
  trail.push({
    angle: ropeAngle,
    life: 1,
    speed: ropeSpeed
  });
  if(trail.length > TRAIL_LENGTH) trail.shift();
  
  // 更新轨迹生命
  for(let t of trail) t.life -= dt * 2.5;
  trail = trail.filter(t=>t.life>0);
  
  // 更新玩家跳跃
  if(playerJumping){
    playerVy += GRAVITY * dt * 60;
    playerY += playerVy * dt * 60;
    playerJumpForce = Math.max(0, playerJumpForce - dt*3);
    
    if(playerY >= playerBaseY){
      playerY = playerBaseY;
      playerVy = 0;
      playerJumping = false;
    }
  }
  
  // 碰撞检测与跳跃判定
  let ropePhase = ropeAngle % (Math.PI*2);
  if(ropePhase < 0) ropePhase += Math.PI*2;
  
  // 绳子在底部区域时检测碰撞
  let inDangerZone = ropePhase > Math.PI*0.45 && ropePhase < Math.PI*1.55;
  
  if(inDangerZone && checkCollision()){
    if(!playerJumping || playerY > playerBaseY - 15){
      // 被绳子绊到
      gameOver();
      return;
    }
  }
  
  // 绳子经过底部中心时判定跳跃成功
  let isBottom = ropePhase > Math.PI*0.8 && ropePhase < Math.PI*1.2;
  
  if(isBottom && playerJumping && playerY < playerBaseY - 25 && !jumpScoredThisSwing){
    jumpScoredThisSwing = true;
    let inPerfect = Math.abs(ropePhase - Math.PI) < perfectWindow;
    let inGood = Math.abs(ropePhase - Math.PI) < goodWindow;
    
    if(inPerfect){
      // 完美跳跃
      combo++;
      if(combo>maxCombo) maxCombo = combo;
      score++;
      spawnParticles(playerX, groundY, 15, '#ff6b35');
      if(combo>=5 && combo%5===0){
        showComboText(combo+'x COMBO!');
        spawnParticles(playerX, groundY, 25, '#ffd700');
      }
    }else if(inGood){
      // 好跳跃
      combo = Math.max(0, combo-1);
      score++;
      spawnParticles(playerX, groundY, 8, '#00ffc8');
    }else{
      // 勉强跳过
      combo = 0;
      score++;
      spawnParticles(playerX, groundY, 4, '#888');
    }
    
    updateUI();
    
    // 速度递增
    if(score>0 && score%10===0){
      speedLevel++;
      ropeSpeed = 2.5 + speedLevel * 0.8;
      perfectWindow = Math.max(0.12, 0.35 - speedLevel*0.025);
      goodWindow = Math.max(0.2, 0.55 - speedLevel*0.03);
      groundPulse = 1;
      showComboText('⚡加速!');
    }
  }
  
  // 绳子离开底部区域时重置标记
  if(ropePhase > Math.PI*1.5 || ropePhase < Math.PI*0.5){
    jumpScoredThisSwing = false;
  }
  
  // 更新粒子
  for(let p of particles){
    p.x += p.vx * dt * 60;
    p.y += p.vy * dt * 60;
    p.vy += GRAVITY * 0.3 * dt * 60;
    p.life -= dt * 2;
  }
  particles = particles.filter(p=>p.life>0);
  
  // 震屏衰减
  if(shakeAmount>0) shakeAmount *= 0.9;
  if(groundPulse>0) groundPulse = Math.max(0, groundPulse-dt*3);
}

function spawnParticles(x,y,count,color){
  for(let i=0;i<count;i++){
    particles.push({
      x:x,
      y:y,
      vx:(Math.random()-0.5)*8,
      vy:-Math.random()*10-4,
      r:Math.random()*3+1,
      life:1,
      color:color
    });
  }
}

function drawRope(){
  // 绘制绳子轨迹拖尾
  for(let i=0;i<trail.length;i++){
    let t = trail[i];
    let alpha = t.life * 0.15;
    let endX = ropePivotX + Math.cos(t.angle) * ropeLength;
    let endY = ropePivotY + Math.sin(t.angle) * ropeLength;
    
    ctx.strokeStyle = `rgba(0,255,200,${alpha})`;
    ctx.lineWidth = 2 + t.life*2;
    ctx.shadowColor = `rgba(0,255,200,${alpha*0.5})`;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.moveTo(ropePivotX, ropePivotY);
    ctx.lineTo(endX, endY);
    ctx.stroke();
    ctx.shadowBlur = 0;
  }
  
  // 主绳子 - 带发光效果
  let ropeEndX = ropePivotX + Math.cos(ropeAngle) * ropeLength;
  let ropeEndY = ropePivotY + Math.sin(ropeAngle) * ropeLength;
  
  // 外发光
  ctx.strokeStyle = 'rgba(0,255,200,0.3)';
  ctx.lineWidth = 6;
  ctx.shadowColor = 'rgba(0,255,200,0.8)';
  ctx.shadowBlur = 20;
  ctx.beginPath();
  ctx.moveTo(ropePivotX, ropePivotY);
  ctx.lineTo(ropeEndX, ropeEndY);
  ctx.stroke();
  ctx.shadowBlur = 0;
  
  // 绳子主体
  let gradient = ctx.createLinearGradient(ropePivotX, ropePivotY, ropeEndX, ropeEndY);
  gradient.addColorStop(0,'rgba(0,255,200,0.6)');
  gradient.addColorStop(0.5,'rgba(0,255,200,1)');
  gradient.addColorStop(1,'rgba(0,255,200,0.9)');
  ctx.strokeStyle = gradient;
  ctx.lineWidth = 3;
  ctx.shadowColor = 'rgba(0,255,200,0.6)';
  ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.moveTo(ropePivotX, ropePivotY);
  ctx.lineTo(ropeEndX, ropeEndY);
  ctx.stroke();
  ctx.shadowBlur = 0;
  
  // 绳子尖端光点
  ctx.fillStyle = '#fff';
  ctx.shadowColor = 'rgba(0,255,200,1)';
  ctx.shadowBlur = 15;
  ctx.beginPath();
  ctx.arc(ropeEndX, ropeEndY, 4, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;
  
  // 绳子枢轴点
  ctx.fillStyle = '#fff';
  ctx.shadowColor = 'rgba(255,255,255,0.5)';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.arc(ropePivotX, ropePivotY, 5, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;
}

function drawPlayer(){
  let px = playerX;
  let py = playerY;
  let jumpT = playerJumpForce;
  
  ctx.save();
  ctx.translate(px, py);
  
  // 阴影
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath();
  ctx.ellipse(0, 55, 28, 6, 0, 0, Math.PI*2);
  ctx.fill();
  
  // 身体
  let bodyLean = jumpT * 0.05;
  ctx.save();
  ctx.rotate(bodyLean);
  
  // 腿部
  ctx.strokeStyle = '#e8e8e8';
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  // 左腿
  ctx.beginPath();
  ctx.moveTo(-6, 20);
  ctx.lineTo(-12, 52);
  ctx.stroke();
  // 右腿
  ctx.beginPath();
  ctx.moveTo(6, 20);
  ctx.lineTo(12, 52);
  ctx.stroke();
  
  // 身体
  ctx.fillStyle = '#2a2a3a';
  ctx.strokeStyle = '#e8e8e8';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(-10, -10, 20, 32, 5);
  ctx.fill();
  ctx.stroke();
  
  // 手臂
  ctx.strokeStyle = '#e8e8e8';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  let armAngle = jumpT * 0.3;
  // 左臂
  ctx.beginPath();
  ctx.moveTo(-10, 0);
  ctx.lineTo(-22, -12 + armAngle*10);
  ctx.stroke();
  // 右臂
  ctx.beginPath();
  ctx.moveTo(10, 0);
  ctx.lineTo(22, -12 + armAngle*10);
  ctx.stroke();
  
  // 头部
  ctx.fillStyle = '#e8e8e8';
  ctx.beginPath();
  ctx.arc(0, -20, 10, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#ccc';
  ctx.lineWidth = 1;
  ctx.stroke();
  
  // 眼睛
  ctx.fillStyle = '#1a1a2e';
  ctx.beginPath();
  ctx.arc(-3, -22, 2, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(3, -22, 2, 0, Math.PI*2);
  ctx.fill();
  
  // 头发
  ctx.fillStyle = '#333';
  ctx.beginPath();
  ctx.arc(0, -26, 11, Math.PI, Math.PI*2);
  ctx.fill();
  
  // 运动鞋
  ctx.fillStyle = '#ff6b35';
  ctx.beginPath();
  ctx.roundRect(-14, 48, 10, 7, 3);
  ctx.fill();
  ctx.beginPath();
  ctx.roundRect(4, 48, 10, 7, 3);
  ctx.fill();
  
  ctx.restore();
  ctx.restore();
}

function drawGround(){
  let pulse = groundPulse;
  let y = groundY + 5;
  
  // 地面线
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, y);
  ctx.lineTo(W, y);
  ctx.stroke();
  
  // 脉冲效果
  if(pulse>0){
    ctx.strokeStyle = `rgba(0,255,200,${pulse*0.4})`;
    ctx.lineWidth = 3;
    ctx.shadowColor = `rgba(0,255,200,${pulse*0.6})`;
    ctx.shadowBlur = 15;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
    ctx.shadowBlur = 0;
  }
  
  // 节奏指示器
  let indicatorX = W/2;
  let indicatorY = y + 18;
  let beat = (Math.sin(ropeAngle*2) + 1) / 2;
  ctx.fillStyle = `rgba(255,107,53,${0.15+beat*0.25})`;
  ctx.beginPath();
  ctx.arc(indicatorX, indicatorY, 6+beat*3, 0, Math.PI*2);
  ctx.fill();
}

function drawParticles(){
  for(let p of particles){
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 4;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;
}

function drawBgParticles(){
  for(let p of bgParticles){
    ctx.fillStyle = `rgba(255,255,255,${p.alpha})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fill();
    p.x += p.vx;
    p.y += p.vy;
    if(p.y<-10) p.y = H+10;
    if(p.y>H+10) p.y = -10;
    if(p.x<-10) p.x = W+10;
    if(p.x>W+10) p.x = -10;
  }
}

function drawSpeedIndicator(){
  // 速度等级指示
  let cx = W - 40;
  let cy = H/2;
  let levels = Math.min(speedLevel, 15);
  
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  ctx.beginPath();
  ctx.roundRect(cx-12, cy-80, 24, 160, 12);
  ctx.fill();
  
  for(let i=0;i<levels;i++){
    let t = i/14;
    let r = Math.floor(lerp(0,255,t));
    let g = Math.floor(lerp(255,107,t));
    let b = Math.floor(lerp(200,35,t));
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.shadowColor = `rgb(${r},${g},${b})`;
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.roundRect(cx-8, cy+70-i*10, 16, 8, 4);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

function lerp(a,b,t){return a+(b-a)*t;}

function drawBackground(){
  // 渐变背景
  let grad = ctx.createRadialGradient(W/2, H*0.3, 0, W/2, H*0.3, W);
  grad.addColorStop(0,'#1a1a30');
  grad.addColorStop(1,'#0a0a14');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);
  
  // 网格线
  ctx.strokeStyle = 'rgba(255,255,255,0.02)';
  ctx.lineWidth = 0.5;
  let gridSize = 50;
  for(let x=gridSize;x<W;x+=gridSize){
    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x,H);
    ctx.stroke();
  }
  for(let y=gridSize;y<H;y+=gridSize){
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(W,y);
    ctx.stroke();
  }
}

function render(){
  let sx = 0, sy = 0;
  if(shakeAmount>0.5){
    sx = (Math.random()-0.5)*shakeAmount;
    sy = (Math.random()-0.5)*shakeAmount;
  }
  
  ctx.save();
  ctx.translate(sx, sy);
  
  drawBackground();
  drawBgParticles();
  drawGround();
  drawRope();
  drawPlayer();
  drawParticles();
  drawSpeedIndicator();
  
  ctx.restore();
}

let lastTime = performance.now();
function loop(time){
  let dt = (time - lastTime) / 1000;
  lastTime = time;
  
  update(dt);
  render();
  requestAnimationFrame(loop);
}

  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();

<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();

<script>
(function(){
  if (window.__batchPauseFix) return;
  window.__batchPauseFix = true;
  var _paused = false;
  var _overlay = document.createElement('div');
  _overlay.id = 'batchPauseOverlay';
  _overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:9999;display:none;align-items:center;justify-content:center;color:#fff;font:bold 32px sans-serif;cursor:pointer';
  _overlay.textContent = 'PAUSED (click to resume)';
  _overlay.addEventListener('click', function(){ togglePause(); });
  document.body.appendChild(_overlay);
  window.togglePause = function() {
    _paused = !_paused;
    _overlay.style.display = _paused ? 'flex' : 'none';
  };
  window.isPaused = function() { return _paused; };
  document.addEventListener('keydown', function(e) {
    if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
      e.preventDefault();
      togglePause();
    }
  });
  var _origRAF = window.requestAnimationFrame || function(cb){return setTimeout(cb,16)};
  window.requestAnimationFrame = function(cb) {
    return _origRAF.call(window, function(ts) {
      if (!_paused) cb(ts);
      else window.requestAnimationFrame(cb);
    });
  };
})();
</script>
<!-- [/BATCH-FIX-V2:pause-system] -->
