        // 键盘支持

            if (e.code === 'Space') {
                e.preventDefault();
            }
        });
        
        // 存档支持
        const GAME_KEY = '中国象棋';
        function saveGame(data) {
            try { localStorage.setItem(GAME_KEY, JSON.stringify(data)); } catch(e) {}
        }
        function loadGame() {
            try { return JSON.parse(localStorage.getItem(GAME_KEY) || '{}'); } catch(e) { return {}; }
        }
        
        // 加载界面
        window.addEventListener('load', function() {
            const loading = document.createElement('div');
            loading.id = 'game-loading';
            loading.style.cssText = 'position:fixed;inset:0;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;color:white;font-size:18px';
            loading.innerHTML = '<div style="width:50px;height:50px;border:4px solid #f5576c;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;"></div><div style="margin-top:20px;">加载中...</div>';
            document.head.insertAdjacentHTML('beforeend', '<style>@keyframes spin {to{transform:rotate(360deg)}} @keyframes pulse { to { transform:scale(2); opacity:0; } }
        </style>');
            document.body.appendChild(loading);
            setTimeout(() => { loading.style.display = 'none'; }, 500);
        });
        
        // 动画帧更新
        function gameLoop() {
            requestAnimationFrame(gameLoop);
        }
        gameLoop();
        
        // 音效支持
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq = 440, duration = 0.1) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }
        
        // 视觉特效
        function showEffect(x, y) {
            const el = document.createElement("div");
            el.style.cssText = `position:absolute;left:${x}px;top:${y}px;width:20px;height:20px;background:#f5576c;border-radius:50%;animation:pulse 0.5s ease-out forwards;pointer-events:none;z-index:100;`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 500);
        }
        </script>

<script>
(function(){
'use strict';
const canvas = document.getElementById('gc'), ctx = canvas.getContext('2d');

// ==================== 常量 ====================
const ROWS = 10, COLS = 9;
const RED = 'red', BLACK = 'black';
const TYPES = ['king','advisor','elephant','horse','chariot','cannon','pawn'];

// 棋子中文名
const PIECE_NAMES = {
  red: {king:'帅',advisor:'仕',elephant:'相',horse:'馬',chariot:'車',cannon:'炮',pawn:'兵'},
  black:{king:'将',advisor:'士',elephant:'象',horse:'馬',chariot:'車',cannon:'炮',pawn:'卒'}
};

// ==================== 游戏状态 ====================
let gameStarted = false;
let board = [];           // board[row][col] = null | {type, side}
let turn = RED;           // 当前走棋方
let selected = null;      // {row, col} 选中的棋子
let validMoves = [];      // [{row, col}] 合法走法
let moveHistory = [];     // 走棋历史
let gameOver = false;
let winner = null;
let inCheck = false;      // 当前回合是否被将军
let capturedRed = [];     // 红方被吃棋子
let capturedBlack = [];   // 黑方被吃棋子
let lastMoveFrom = null;  // 上一步走棋起点
let lastMoveTo = null;    // 上一步走棋终点

// ==================== 棋盘初始化 ====================
function initBoard() {
  board = Array.from({length:ROWS}, () => Array(COLS).fill(null));
  const place = (row, col, side, type) => { board[row][col] = {side, type}; };

  // 黑方（上方，row 0-4）
  place(0,0,BLACK,'chariot'); place(0,1,BLACK,'horse'); place(0,2,BLACK,'elephant');
  place(0,3,BLACK,'advisor'); place(0,4,BLACK,'king');  place(0,5,BLACK,'advisor');
  place(0,6,BLACK,'elephant'); place(0,7,BLACK,'horse'); place(0,8,BLACK,'chariot');
  place(2,1,BLACK,'cannon'); place(2,7,BLACK,'cannon');
  place(3,0,BLACK,'pawn'); place(3,2,BLACK,'pawn'); place(3,4,BLACK,'pawn');
  place(3,6,BLACK,'pawn'); place(3,8,BLACK,'pawn');

  // 红方（下方，row 5-9）
  place(9,0,RED,'chariot'); place(9,1,RED,'horse'); place(9,2,RED,'elephant');
  place(9,3,RED,'advisor'); place(9,4,RED,'king');  place(9,5,RED,'advisor');
  place(9,6,RED,'elephant'); place(9,7,RED,'horse'); place(9,8,RED,'chariot');
  place(7,1,RED,'cannon'); place(7,7,RED,'cannon');
  place(6,0,RED,'pawn'); place(6,2,RED,'pawn'); place(6,4,RED,'pawn');
  place(6,6,RED,'pawn'); place(6,8,RED,'pawn');
}

function resetGame() {
  initBoard();
  turn = RED;
  selected = null;
  validMoves = [];
  moveHistory = [];
  gameOver = false;
  winner = null;
  inCheck = false;
  capturedRed = [];
  capturedBlack = [];
  lastMoveFrom = null;
  lastMoveTo = null;
  updateUI();
  document.getElementById('gameOverOverlay').classList.remove('show');
  document.getElementById('checkWarn').style.display = 'none';
}

// ==================== 走法生成 ====================
function inBounds(r, c) { return r >= 0 && r < ROWS && c >= 0 && c < COLS; }

function getPieceAt(r, c) { return inBounds(r,c) ? board[r][c] : null; }

function isEnemy(p, side) { return p && p.side !== side; }

function isFriend(p, side) { return p && p.side === side; }

// 帅/将走法：九宫内一步
function kingMoves(r, c, side) {
  const moves = [];
  const dirs = [[0,1],[0,-1],[1,0],[-1,0]];
  const [minR, maxR] = side === RED ? [7,9] : [0,2];
  for (const [dr,dc] of dirs) {
    const nr = r + dr, nc = c + dc;
    if (nr >= minR && nr <= maxR && nc >= 3 && nc <= 5) {
      const p = getPieceAt(nr, nc);
      if (!p || isEnemy(p, side)) moves.push({row:nr, col:nc});
    }
  }
  return moves;
}

// 仕/士走法：九宫内斜走一步
function advisorMoves(r, c, side) {
  const moves = [];
  const dirs = [[1,1],[1,-1],[-1,1],[-1,-1]];
  const [minR, maxR] = side === RED ? [7,9] : [0,2];
  for (const [dr,dc] of dirs) {
    const nr = r + dr, nc = c + dc;
    if (nr >= minR && nr <= maxR && nc >= 3 && nc <= 5) {
      const p = getPieceAt(nr, nc);
      if (!p || isEnemy(p, side)) moves.push({row:nr, col:nc});
    }
  }
  return moves;
}

// 相/象走法：田字，不过河，塞眼则不能走
function elephantMoves(r, c, side) {
  const moves = [];
  const dirs = [[2,2,1,1],[2,-2,1,-1],[-2,2,-1,1],[-2,-2,-1,-1]];
  const maxR = side === RED ? 9 : 4;
  const minR = side === RED ? 5 : 0;
  for (const [dr,dc,er,ec] of dirs) {
    const nr = r + dr, nc = c + dc;
    const eyeR = r + er, eyeC = c + ec;
    if (inBounds(nr,nc) && nr >= minR && nr <= maxR) {
      if (!getPieceAt(eyeR, eyeC)) {
        const p = getPieceAt(nr, nc);
        if (!p || isEnemy(p, side)) moves.push({row:nr, col:nc});
      }
    }
  }
  return moves;
}

// 馬/马走法：日字，蹩脚则不能走
function horseMoves(r, c, side) {
  const moves = [];
  const jumps = [
    [-2,-1,-1,0],[-2,1,-1,0],[2,-1,1,0],[2,1,1,0],
    [-1,-2,0,-1],[-1,2,0,1],[1,-2,0,-1],[1,2,0,1]
  ];
  for (const [dr,dc,lr,lc] of jumps) {
    const nr = r + dr, nc = c + dc;
    const legR = r + lr, legC = c + lc;
    if (inBounds(nr,nc) && !getPieceAt(legR, legC)) {
      const p = getPieceAt(nr, nc);
      if (!p || isEnemy(p, side)) moves.push({row:nr, col:nc});
    }
  }
  return moves;
}

// 車/车走法：直线
function chariotMoves(r, c, side) {
  const moves = [];
  const dirs = [[0,1],[0,-1],[1,0],[-1,0]];
  for (const [dr,dc] of dirs) {
    let nr = r + dr, nc = c + dc;
    while (inBounds(nr, nc)) {
      const p = getPieceAt(nr, nc);
      if (p) {
        if (isEnemy(p, side)) moves.push({row:nr, col:nc});
        break;
      }
      moves.push({row:nr, col:nc});
      nr += dr; nc += dc;
    }
  }
  return moves;
}

// 炮走法：走直线，吃子需翻山
function cannonMoves(r, c, side) {
  const moves = [];
  const dirs = [[0,1],[0,-1],[1,0],[-1,0]];
  for (const [dr,dc] of dirs) {
    let nr = r + dr, nc = c + dc;
    // 移动（无翻山）
    while (inBounds(nr, nc) && !getPieceAt(nr, nc)) {
      moves.push({row:nr, col:nc});
      nr += dr; nc += dc;
    }
    // 跳过炮架
    if (inBounds(nr, nc) && getPieceAt(nr, nc)) {
      nr += dr; nc += dc;
      while (inBounds(nr, nc)) {
        const p = getPieceAt(nr, nc);
        if (p) {
          if (isEnemy(p, side)) moves.push({row:nr, col:nc});
          break;
        }
        nr += dr; nc += dc;
      }
    }
  }
  return moves;
}

// 兵/卒走法
function pawnMoves(r, c, side) {
  const moves = [];
  const forward = side === RED ? -1 : 1;
  const crossed = side === RED ? (r <= 4) : (r >= 5);
  // 向前
  const fr = r + forward;
  if (inBounds(fr, c)) {
    const p = getPieceAt(fr, c);
    if (!p || isEnemy(p, side)) moves.push({row:fr, col:c});
  }
  // 过河后可以左右
  if (crossed) {
    for (const dc of [-1, 1]) {
      const nc = c + dc;
      if (inBounds(r, nc)) {
        const p = getPieceAt(r, nc);
        if (!p || isEnemy(p, side)) moves.push({row:r, col:nc});
      }
    }
  }
  return moves;
}

// 获取某棋子的原始走法（不考虑将军）
function getRawMoves(r, c) {
  const piece = board[r][c];
  if (!piece) return [];
  switch (piece.type) {
    case 'king': return kingMoves(r, c, piece.side);
    case 'advisor': return advisorMoves(r, c, piece.side);
    case 'elephant': return elephantMoves(r, c, piece.side);
    case 'horse': return horseMoves(r, c, piece.side);
    case 'chariot': return chariotMoves(r, c, piece.side);
    case 'cannon': return cannonMoves(r, c, piece.side);
    case 'pawn': return pawnMoves(r, c, piece.side);
    default: return [];
  }
}

// 找到某方的将/帅位置
function findKing(side) {
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (board[r][c] && board[r][c].type === 'king' && board[r][c].side === side)
        return {row:r, col:c};
  return null;
}

// 模拟走一步，返回新棋盘
function simulateMove(boardRef, fromR, fromC, toR, toC) {
  const newBoard = boardRef.map(row => row.map(cell => cell ? {...cell} : null));
  newBoard[toR][toC] = newBoard[fromR][fromC];
  newBoard[fromR][fromC] = null;
  return newBoard;
}

// 检查某方是否被将军
function isKingInCheck(boardRef, side) {
  const king = findKingOnBoard(boardRef, side);
  if (!king) return true; // 将被吃了（不应该发生）
  const enemy = side === RED ? BLACK : RED;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (boardRef[r][c] && boardRef[r][c].side === enemy) {
        const rawMoves = getRawMovesOnBoard(boardRef, r, c);
        if (rawMoves.some(m => m.row === king.row && m.col === king.col))
          return true;
      }
    }
  }
  return false;
}

function findKingOnBoard(boardRef, side) {
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (boardRef[r][c] && boardRef[r][c].type === 'king' && boardRef[r][c].side === side)
        return {row:r, col:c};
  return null;
}

// 在指定棋盘上获取原始走法
function getRawMovesOnBoard(boardRef, r, c) {
  const piece = boardRef[r][c];
  if (!piece) return [];
  // 需要用临时棋盘来计算走法
  const saved = board;
  board = boardRef;
  const moves = getRawMoves(r, c);
  board = saved;
  return moves;
}

// 检查飞将（两王对面）
function flyingGeneralCheck(boardRef) {
  const redKing = findKingOnBoard(boardRef, RED);
  const blackKing = findKingOnBoard(boardRef, BLACK);
  if (!redKing || !blackKing) return false;
  if (redKing.col !== blackKing.col) return false;
  const minR = Math.min(redKing.row, blackKing.row);
  const maxR = Math.max(redKing.row, blackKing.row);
  for (let r = minR + 1; r < maxR; r++) {
    if (boardRef[r][redKing.col]) return false;
  }
  return true;
}

// 获取合法走法（排除走后自己被将军的走法）
function getLegalMoves(r, c) {
  const piece = board[r][c];
  if (!piece) return [];
  const raw = getRawMoves(r, c);
  return raw.filter(move => {
    const newBoard = simulateMove(board, r, c, move.row, move.col);
    if (isKingInCheck(newBoard, piece.side)) return false;
    if (flyingGeneralCheck(newBoard)) return false;
    return true;
  });
}

// 检查某方是否有合法走法
function hasLegalMoves(side) {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (board[r][c] && board[r][c].side === side) {
        if (getLegalMoves(r, c).length > 0) return true;
      }
    }
  }
  return false;
}

// 判断是否被将死
function isCheckmate(side) {
  return isKingInCheck(board, side) && !hasLegalMoves(side);
}

// 判断是否困毙（无子可动但未被将军）
function isStalemate(side) {
  return !isKingInCheck(board, side) && !hasLegalMoves(side);
}

// ==================== 游戏逻辑 ====================
function handleClick(r, c) {
  if (gameOver) return;
  const piece = getPieceAt(r, c);

  // 如果已选中棋子
  if (selected) {
    // 点击自己的另一个棋子 → 切换选中
    if (piece && piece.side === turn) {
      selected = {row:r, col:c};
      validMoves = getLegalMoves(r, c);
      render();
      return;
    }
    // 点击合法目标 → 走棋
    const move = validMoves.find(m => m.row === r && m.col === c);
    if (move) {
      executeMove(selected.row, selected.col, r, c);
      return;
    }
    // 点击了无效位置 → 取消选中
    if (!piece || piece.side !== turn) {
      selected = null;
      validMoves = [];
      render();
      return;
    }
  }

  // 未选中 → 选中自己的棋子
  if (piece && piece.side === turn) {
    selected = {row:r, col:c};
    validMoves = getLegalMoves(r, c);
    render();
  }
}

function executeMove(fromR, fromC, toR, toC) {
  const piece = board[fromR][fromC];
  const captured = board[toR][toC];

  // 保存状态用于悔棋
  moveHistory.push({
    fromR, fromC, toR, toC,
    piece: {...piece},
    captured: captured ? {...captured} : null,
    inCheck
  });

  // 执行移动
  board[toR][toC] = piece;
  board[fromR][fromC] = null;

  // 记录被吃棋子
  if (captured) {
    if (captured.side === RED) capturedRed.push(captured);
    else capturedBlack.push(captured);
  }

  lastMoveFrom = {row:fromR, col:fromC};
  lastMoveTo = {row:toR, col:toC};

  // 切换回合
  const nextSide = turn === RED ? BLACK : RED;
  turn = nextSide;
  selected = null;
  validMoves = [];

  // 检查将军
  inCheck = isKingInCheck(board, nextSide);

  // 检查胜负
  if (isCheckmate(nextSide)) {
    gameOver = true;
    winner = nextSide === RED ? BLACK : RED;
  } else if (isStalemate(nextSide)) {
    gameOver = true;
    winner = nextSide === RED ? BLACK : RED; // 困毙也算输
  }

  updateUI();
  render();

  if (gameOver) {
    showGameOver();
  }
}

function undoMove() {
  if (gameOver || moveHistory.length === 0) return;
  const last = moveHistory.pop();
  board[last.fromR][last.fromC] = last.piece;
  board[last.toR][last.toC] = last.captured;
  if (last.captured) {
    if (last.captured.side === RED) capturedRed.pop();
    else capturedBlack.pop();
  }
  turn = turn === RED ? BLACK : RED;
  inCheck = last.inCheck;
  selected = null;
  validMoves = [];

  if (moveHistory.length > 0) {
    const prev = moveHistory[moveHistory.length - 1];
    lastMoveFrom = {row:prev.fromR, col:prev.fromC};
    lastMoveTo = {row:prev.toR, col:prev.toC};
  } else {
    lastMoveFrom = null;
    lastMoveTo = null;
  }

  updateUI();
  render();
}

function showGameOver() {
  const overlay = document.getElementById('gameOverOverlay');
  const title = document.getElementById('gameOverTitle');
  const sub = document.getElementById('gameOverSub');
  const wname = winner === RED ? '红方' : '黑方';
  title.textContent = `🏆 ${wname}获胜！`;
  if (isCheckmate(winner === RED ? BLACK : RED)) {
    sub.textContent = '将杀！';
  } else {
    sub.textContent = '对方无子可走';
  }
  overlay.classList.add('show');
  // 显示插屏广告
  if (window.showInterstitialAd) window.showInterstitialAd();
}

function updateUI() {
  const turnInd = document.getElementById('turnInd');
  const turnText = document.getElementById('turnText');
  const checkWarn = document.getElementById('checkWarn');

  turnInd.classList.remove('red-turn','black-turn');
  if (turn === RED) {
    turnInd.classList.add('red-turn');
    turnText.textContent = '红方走棋';
  } else {
    turnInd.classList.add('black-turn');
    turnText.textContent = '黑方走棋';
  }
  checkWarn.style.display = inCheck ? 'inline' : 'none';

  // 更新被吃棋子显示
  const capRed = document.getElementById('capturedRed');
  const capBlack = document.getElementById('capturedBlack');
  capRed.innerHTML = capturedBlack.map(p =>
    `<span class="captured-piece red-cap">${PIECE_NAMES[p.side][p.type]}</span>`
  ).join('');
  capBlack.innerHTML = capturedRed.map(p =>
    `<span class="captured-piece black-cap">${PIECE_NAMES[p.side][p.type]}</span>`
  ).join('');
}

// ==================== 渲染 ====================
let W, H, cellSize, padX, padY, boardW, boardH;

function calcLayout() {
  const container = canvas.parentElement;
  const maxW = Math.min(container.clientWidth - 16, 500);
  const maxH = container.clientHeight - 16;
  // 棋盘比例：宽9格，高10格（不含边距）
  const ratio = 9 / 10;
  let bw, bh;
  if (maxW / maxH > ratio) {
    bh = maxH * 0.92;
    bw = bh * ratio;
  } else {
    bw = maxW * 0.92;
    bh = bw / ratio;
  }
  cellSize = bw / 8; // 9条线，8个间隔
  boardW = cellSize * 8;
  boardH = cellSize * 9;
  padX = cellSize * 0.6;
  padY = cellSize * 0.6;
  W = boardW + padX * 2;
  H = boardH + padY * 2;
  canvas.width = W;
  canvas.height = H;
}

function boardToPixel(r, c) {
  return {x: padX + c * cellSize, y: padY + r * cellSize};
}

function pixelToBoard(px, py) {
  const c = Math.round((px - padX) / cellSize);
  const r = Math.round((py - padY) / cellSize);
  if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return null;
  // 检查是否在交叉点附近
  const {x, y} = boardToPixel(r, c);
  const dist = Math.sqrt((px-x)**2 + (py-y)**2);
  if (dist < cellSize * 0.45) return {row:r, col:c};
  return null;
}

function drawBoard() {
  // 棋盘背景 - 木纹效果
  const bgGrad = ctx.createLinearGradient(0, 0, W, H);
  bgGrad.addColorStop(0, '#d4a853');
  bgGrad.addColorStop(0.3, '#c9a040');
  bgGrad.addColorStop(0.5, '#d4a853');
  bgGrad.addColorStop(0.7, '#c4963a');
  bgGrad.addColorStop(1, '#b8892e');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // 木纹纹理
  ctx.globalAlpha = 0.06;
  for (let i = 0; i < H; i += 3) {
    ctx.fillStyle = i % 6 < 3 ? '#000' : '#fff';
    ctx.fillRect(0, i, W, 2);
  }
  ctx.globalAlpha = 1;

  // 棋盘边框
  ctx.strokeStyle = '#5c3a1e';
  ctx.lineWidth = 3;
  ctx.strokeRect(padX - 8, padY - 8, boardW + 16, boardH + 16);

  // 内边框
  ctx.strokeStyle = '#8b6914';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(padX - 3, padY - 3, boardW + 6, boardH + 6);

  // 网格线
  ctx.strokeStyle = '#3d2b0f';
  ctx.lineWidth = 1;
  // 横线
  for (let r = 0; r < ROWS; r++) {
    const y = padY + r * cellSize;
    ctx.beginPath();
    ctx.moveTo(padX, y);
    ctx.lineTo(padX + boardW, y);
    ctx.stroke();
  }
  // 竖线 - 河界处断开
  for (let c = 0; c < COLS; c++) {
    const x = padX + c * cellSize;
    // 上半部分
    ctx.beginPath();
    ctx.moveTo(x, padY);
    ctx.lineTo(x, padY + 4 * cellSize);
    ctx.stroke();
    // 下半部分
    ctx.beginPath();
    ctx.moveTo(x, padY + 5 * cellSize);
    ctx.lineTo(x, padY + boardH);
    ctx.stroke();
  }
  // 左右边线完整
  ctx.beginPath();
  ctx.moveTo(padX, padY);
  ctx.lineTo(padX, padY + boardH);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(padX + boardW, padY);
  ctx.lineTo(padX + boardW, padY + boardH);
  ctx.stroke();

  // 九宫格斜线
  const drawPalace = (r1, r2) => {
    const y1 = padY + r1 * cellSize, y2 = padY + r2 * cellSize;
    const x3 = padX + 3 * cellSize, x5 = padX + 5 * cellSize;
    ctx.strokeStyle = '#3d2b0f';
    ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(x3, y1); ctx.lineTo(x5, y2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x5, y1); ctx.lineTo(x3, y2); ctx.stroke();
  };
  drawPalace(0, 2);   // 黑方九宫
  drawPalace(7, 9);   // 红方九宫

  // 河界文字
  ctx.fillStyle = '#3d2b0f';
  ctx.font = `${cellSize*0.45}px "KaiTi","STKaiti","SimKai","Microsoft YaHei",serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const riverY = padY + 4.5 * cellSize;
  const x2 = padX + 2 * cellSize, x6 = padX + 6 * cellSize;
  ctx.fillText('楚', x2, riverY);
  ctx.fillText('河', x2 + cellSize, riverY);
  ctx.fillText('汉', x6 - cellSize, riverY);
  ctx.fillText('界', x6, riverY);
}

function drawPiece(r, c, piece, isSelected) {
  const {x, y} = boardToPixel(r, c);
  const radius = cellSize * 0.42;

  // 阴影
  ctx.beginPath();
  ctx.arc(x + 2, y + 2, radius, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fill();

  // 棋子底色
  const grad = ctx.createRadialGradient(x-2, y-3, radius*0.1, x, y, radius);
  grad.addColorStop(0, '#faf3e0');
  grad.addColorStop(0.7, '#e8d5a8');
  grad.addColorStop(1, '#c9a96a');
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI*2);
  ctx.fillStyle = grad;
  ctx.fill();

  // 金色边框
  ctx.strokeStyle = isSelected ? '#ffd700' : '#8b6914';
  ctx.lineWidth = isSelected ? 3 : 1.5;
  ctx.stroke();

  if (isSelected) {
    // 选中光环
    ctx.beginPath();
    ctx.arc(x, y, radius + 3, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(255,215,0,0.5)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // 内圈
  ctx.beginPath();
  ctx.arc(x, y, radius * 0.88, 0, Math.PI*2);
  ctx.strokeStyle = '#8b6914';
  ctx.lineWidth = 0.8;
  ctx.stroke();

  // 文字
  const name = PIECE_NAMES[piece.side][piece.type];
  const fontSize = radius * 1.1;
  ctx.font = `bold ${fontSize}px "KaiTi","STKaiti","SimKai","FangSong","Microsoft YaHei",serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = piece.side === RED ? '#b71c1c' : '#1a1a1a';
  ctx.fillText(name, x, y + 1);
}

function drawMoveIndicator(r, c) {
  const {x, y} = boardToPixel(r, c);
  const piece = getPieceAt(r, c);
  if (piece) {
    // 吃子目标：红色圆环
    ctx.beginPath();
    ctx.arc(x, y, cellSize * 0.44, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(220,50,50,0.7)';
    ctx.lineWidth = 3;
    ctx.setLineDash([4,3]);
    ctx.stroke();
    ctx.setLineDash([]);
  } else {
    // 空位：绿色圆点
    ctx.beginPath();
    ctx.arc(x, y, cellSize * 0.12, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(76,175,80,0.6)';
    ctx.fill();
  }
}

function drawLastMove() {
  if (!lastMoveFrom || !lastMoveTo) return;
  for (const pos of [lastMoveFrom, lastMoveTo]) {
    const {x, y} = boardToPixel(pos.row, pos.col);
    ctx.fillStyle = 'rgba(255,215,0,0.2)';
    ctx.fillRect(x - cellSize*0.42, y - cellSize*0.42, cellSize*0.84, cellSize*0.84);
  }
}

function render() {
  calcLayout();
  ctx.clearRect(0, 0, W, H);

  // 最近一步高亮
  drawLastMove();

  // 棋盘
  drawBoard();

  // 合法走法指示
  for (const move of validMoves) {
    drawMoveIndicator(move.row, move.col);
  }

  // 棋子
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (board[r][c]) {
        const isSel = selected && selected.row === r && selected.col === c;
        drawPiece(r, c, board[r][c], isSel);
      }
    }
  }
}

// ==================== 事件处理 ====================
canvas.addEventListener('click', (e) => {
  if (gameOver || !gameStarted) return;
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  const scaleY = H / rect.height;
  const px = (e.clientX - rect.left) * scaleX;
  const py = (e.clientY - rect.top) * scaleY;
  const pos = pixelToBoard(px, py);
  if (pos) handleClick(pos.row, pos.col);
});

// 触摸事件（移动端）
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (gameOver || !gameStarted) return;
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  const scaleY = H / rect.height;
  const touch = e.touches[0];
  const px = (touch.clientX - rect.left) * scaleX;
  const py = (touch.clientY - rect.top) * scaleY;
  const pos = pixelToBoard(px, py);
  if (pos) handleClick(pos.row, pos.col);
}, {passive: false});
