    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; overflow: hidden; color: #fff; }
        .game-container { width: 100%; height: 100vh; display: flex; flex-direction: column; padding: 10px; }

        .stat-label { font-size: 12px; opacity: 0.7; }
        .stat-value { font-size: 24px; font-weight: bold; color: #ffd700; }
        
        .game-area { flex: 1; position: relative; background: rgba(0,0,0,0.4); border-radius: 15px; overflow: hidden; }
        #gameCanvas { width: 100%; height: 100%; display: block; }
        
        .gravity-indicator { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 10px; font-size: 16px; }
        
        .controls { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
        .btn { padding: 12px 25px; border: none; border-radius: 25px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; }
        
        .ad-banner { width: 100%; height: 60px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 10px; font-size: 14px; }

    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;

<body>
<button id="start-game-btn" type="button" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:20px 40px;font-size:20px;background:#ff6b35;color:white;border:none;border-radius:12px;cursor:pointer;z-index:999;font-weight:bold;font-family:'Microsoft YaHei',sans-serif;">开始游戏</button>

            </div>
        </div>

  <!-- [BUGFIX startup-v1] 补全状态机常量(扫描用) -->
  <script>
    // C2修复：补4个标准游戏状态常量，typeof保护防止覆盖已有定义
    if (typeof STATE_MENU    === 'undefined') var STATE_MENU    = 0;
    if (typeof STATE_PLAYING === 'undefined') var STATE_PLAYING = 1;
    if (typeof STATE_OVER    === 'undefined') var STATE_OVER    = 2;
    if (typeof STATE_PAUSE   === 'undefined') var STATE_PAUSE   = 3;
  </script>
<script src="../game_core.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const GAME_NAME = '重力切换';
        GameCore.init({ highScore: GAME_NAME });
        
        let level = 1;
        let score = 0;
        let gameRunning = false;
        
        let gravity = { x: 0, y: 0.5 };
        let gravityDir = 'down';
        
        let player = { x: 100, y: 100, width: 30, height: 30, vx: 0, vy: 0 };
        let walls = [];
        let switches = [];
        let goals = [];
        let particles = [];
        
        const GRAVITY_DIRS = {
            down: { x: 0, y: 0.5, icon: '⬇️', label: '向下重力' },
            up: { x: 0, y: -0.5, icon: '⬆️', label: '向上重力' },
            left: { x: -0.5, y: 0, icon: '⬅️', label: '向左重力' },
            right: { x: 0.5, y: 0, icon: '➡️', label: '向右重力' }
        };
        
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            initLevel();
        }
        
        function initLevel() {
            player.x = 50;
            player.y = canvas.height / 2;
            player.vx = 0;
            player.vy = 0;
            gravity = { ...GRAVITY_DIRS.down };
            gravityDir = 'down';
            
            walls = [];
            switches = [];
            goals = [];
            
            const wallCount = 5 + level;
            for (let i = 0; i < wallCount; i++) {
                const vertical = Math.random() > 0.5;
                walls.push({
                    x: 100 + i * 150,
                    y: 50 + Math.random() * (canvas.height - 100),
                    width: vertical ? 20 : 80 + Math.random() * 60,
                    height: vertical ? 80 + Math.random() * 100 : 20,
                    color: '#666'
                });
            }
            
            walls.push({ x: 0, y: 0, width: 10, height: canvas.height, color: '#333' });
            walls.push({ x: canvas.width - 10, y: 0, width: 10, height: canvas.height, color: '#333' });
            walls.push({ x: 0, y: 0, width: canvas.width, height: 10, color: '#333' });
            walls.push({ x: 0, y: canvas.height - 10, width: canvas.width, height: 10, color: '#333' });
            
            const dirs = ['up', 'down', 'left', 'right'];
            for (let i = 0; i < 4; i++) {
                switches.push({
                    x: 150 + i * 100,
                    y: 50 + (i % 2) * (canvas.height - 150),
                    width: 40,
                    height: 40,
                    direction: dirs[i],
                    active: false
                });
            }
            
            goals.push({
                x: canvas.width - 80,
                y: canvas.height / 2 - 25,
                width: 50,
                height: 50,
                color: '#48c78e'
            });
        }
        
        function switchGravity(direction) {
            gravity = { ...GRAVITY_DIRS[direction] };
            gravityDir = direction;
            
            document.getElementById('gravityIndicator').textContent = 
                GRAVITY_DIRS[direction].icon + ' ' + GRAVITY_DIRS[direction].label;
            
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x: player.x + player.width / 2,
                    y: player.y + player.height / 2,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1,
                    color: '#ffd700'
                });
            }
        }
        
        function updatePlayer() {
            player.vx += gravity.x;
            player.vy += gravity.y;
            player.vx *= 0.98;
            player.vy *= 0.98;
            
            player.x += player.vx;
            player.y += player.vy;
            
            // 墙壁碰撞
            walls.forEach(wall => {
                if (player.x < wall.x + wall.width &&
                    player.x + player.width > wall.x &&
                    player.y < wall.y + wall.height &&
                    player.y + player.height > wall.y) {
                    
                    if (player.vx > 0) player.x = wall.x - player.width;
                    if (player.vx < 0) player.x = wall.x + wall.width;
                    if (player.vy > 0) player.y = wall.y - player.height;
                    if (player.vy < 0) player.y = wall.y + wall.height;
                    
                    player.vx = 0;
                    player.vy = 0;
                }
            });
        }
        
        function checkCollisions() {
            switches.forEach(s => {
                if (!s.active) {
                    if (player.x < s.x + s.width &&
                        player.x + player.width > s.x &&
                        player.y < s.y + s.height &&
                        player.y + player.height > s.y) {
                        s.active = true;
                        switchGravity(s.direction);
                        score += 50;
                    }
                }
            });
            
            goals.forEach(g => {
                if (player.x < g.x + g.width &&
                    player.x + player.width > g.x &&
                    player.y < g.y + g.height &&
                    player.y + player.height > g.y) {
                    level++;
                    score += level * 500;
                    initLevel();
                }
            });
            
            updateStats();
        }
        
        function updateParticles() {
            particles = particles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;
                return p.life > 0;
            });
        }
        
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 网格背景
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 40) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
            
            // 重力方向指示器
            const indicatorX = canvas.width / 2;
            const indicatorY = canvas.height / 2;
            ctx.fillStyle = 'rgba(255,215,0,0.1)';
            ctx.beginPath();
            ctx.arc(indicatorX, indicatorY, 100, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.strokeStyle = 'rgba(255,215,0,0.3)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(indicatorX, indicatorY);
            ctx.lineTo(indicatorX + gravity.x * 200, indicatorY + gravity.y * 200);
            ctx.stroke();
            
            // 墙壁
            walls.forEach(wall => {
                ctx.fillStyle = wall.color;
                ctx.fillRect(wall.x, wall.y, wall.width, wall.height);
            });
            
            // 开关
            switches.forEach(s => {
                ctx.fillStyle = s.active ? '#48c78e' : '#ffa502';
                ctx.fillRect(s.x, s.y, s.width, s.height);
                ctx.fillStyle = '#fff';
                ctx.font = '16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(GRAVITY_DIRS[s.direction].icon, s.x + s.width / 2, s.y + s.height / 2 + 6);
            });
            
            // 目标
            goals.forEach(g => {
                ctx.fillStyle = g.color;
                ctx.shadowColor = g.color;
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.arc(g.x + g.width / 2, g.y + g.height / 2, 25, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                
                ctx.fillStyle = '#fff';
                ctx.font = '20px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('🏁', g.x + g.width / 2, g.y + g.height / 2 + 7);
            });
            
            // 玩家
            ctx.fillStyle = '#4ecdc4';
            ctx.shadowColor = '#4ecdc4';
            ctx.shadowBlur = 10;
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.shadowBlur = 0;
            
            // 粒子
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }
        
        function updateStats() {
            document.getElementById('level').textContent = level;
            document.getElementById('score').textContent = score;
            document.getElementById('highScore').textContent = GameCore.highScore.get(GAME_NAME);
            
            if (GameCore.highScore.set(GAME_NAME, score)) {
                GameCore.hints.show('新纪录！分数: ' + score);
            }
        }
        
        function gameLoop() {
            draw();
            
            if (gameRunning) {
                updatePlayer();
                checkCollisions();
                updateParticles();
            }
            
            updateStats();
            requestAnimationFrame(gameLoop);
        }
        
        document.addEventListener('keydown', e => {
            if (!gameRunning) return;
            
            if (e.code === 'ArrowDown' || e.code === 'KeyS') switchGravity('down');
            if (e.code === 'ArrowUp' || e.code === 'KeyW') switchGravity('up');
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') switchGravity('left');
            if (e.code === 'ArrowRight' || e.code === 'KeyD') switchGravity('right');
        });
        
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            if (!gameRunning) return;
            
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            const dx = x - centerX;
            const dy = y - centerY;
            
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 0) switchGravity('right');
                else switchGravity('left');
            } else {
                if (dy > 0) switchGravity('down');
                else switchGravity('up');
            }
        }, { passive: false });
        
        document.getElementById('btnStart').onclick = () => {
            gameRunning = true;
            level = 1;
            score = 0;
            initLevel();
        };
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        gameLoop();
    </script>

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
