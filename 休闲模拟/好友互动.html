<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>好友互动</title>
    <script src="game_core.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #a29bfe 0%, #6c5ce7 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px;
            background: linear-gradient(135deg, #a29bfe, #6c5ce7);
            border-radius: 12px;
        }
        .stat {
            text-align: center;
            color: white;
        }
        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }
        .stat-value {
            font-size: 20px;
            font-weight: bold;
        }
        .friends-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        .friend-card {
            padding: 15px;
            background: white;
            border-radius: 12px;
            border: 2px solid #dfe6e9;
            cursor: pointer;
            transition: all 0.2s;
        }
        .friend-card:hover {
            border-color: #6c5ce7;
        }
        .friend-card.selected {
            border-color: #6c5ce7;
            background: #e8f4f8;
        }
        .friend-avatar {
            font-size: 40px;
            margin-bottom: 5px;
        }
        .friend-name {
            font-size: 16px;
            color: #2d3436;
            font-weight: bold;
        }
        .friend-status {
            font-size: 12px;
            color: #636e72;
            margin-top: 5px;
        }
        .friendship-meter {
            height: 8px;
            background: #dfe6e9;
            border-radius: 4px;
            margin-top: 8px;
        }
        .friendship-fill {
            height: 100%;
            background: linear-gradient(90deg, #a29bfe, #6c5ce7);
            border-radius: 4px;
        }
        .interaction-area {
            padding: 15px;
            background: #dfe6e9;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .interaction-title {
            font-size: 14px;
            color: #2d3436;
            margin-bottom: 10px;
        }
        .interaction-btns {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .interact-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .interact-btn:hover {
            transform: scale(1.05);
        }
        .btn-chat {
            background: #74b9ff;
            color: white;
        }
        .btn-gift {
            background: #fd79a8;
            color: white;
        }
        .btn-game {
            background: #00b894;
            color: white;
        }
        .btn-help {
            background: #f39c12;
            color: white;
        }
        .chat-area {
            padding: 15px;
            background: #ffeaa7;
            border-radius: 12px;
            margin-bottom: 15px;
            max-height: 150px;
            overflow-y: auto;
        }
        .chat-message {
            padding: 8px 12px;
            background: white;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .chat-message.from-friend {
            background: #e8f4f8;
        }
        .chat-message.from-me {
            background: #a29bfe;
            color: white;
        }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #a29bfe, #6c5ce7);
            color: white;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 20px 40px;
            border-radius: 15px;
            font-size: 18px;
            display: none;
            z-index: 100;
            text-align: center;
        }
        .message.show { display: block; }
        .ad-banner {
            width: 100%;
            height: 60px;
            background: linear-gradient(135deg, #a29bfe, #6c5ce7);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">好友</div>
                <div class="stat-value" id="friendCount">4</div>
            </div>
            <div class="stat">
                <div class="stat-label">互动</div>
                <div class="stat-value" id="interactions">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">好感</div>
                <div class="stat-value" id="totalFriendship">0</div>
            </div>
        </div>

        <div class="friends-grid" id="friendsGrid"></div>

        <div class="interaction-area">
            <div class="interaction-title">选择互动方式：</div>
            <div class="interaction-btns">
                <button class="interact-btn btn-chat" id="btnChat">💬 聊天</button>
                <button class="interact-btn btn-gift" id="btnGift">🎁 送礼</button>
                <button class="interact-btn btn-game" id="btnGame">🎮 游戏</button>
                <button class="interact-btn btn-help" id="btnHelp">🤝 帮助</button>
            </div>
        </div>

        <div class="chat-area" id="chatArea"></div>

        <div class="controls">
            <button class="btn btn-primary" id="btnReset">🔄 新社交</button>
        </div>

        <div class="message" id="message"></div>

        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    <script>
        const FRIENDS_DATA = [
            { name: '小明', avatar: '😊', personality: '活泼', status: '在线' },
            { name: '小红', avatar: '😄', personality: '温柔', status: '在线' },
            { name: '小华', avatar: '🤗', personality: '幽默', status: '忙碌' },
            { name: '小李', avatar: '😎', personality: '酷炫', status: '离线' }
        ];

        const CHATS = {
            '小明': ['今天天气真好！', '我们去玩吧！', '哈哈太有趣了！'],
            '小红': ['你好呀~', '谢谢你！', '真开心！'],
            '小华': ['哈哈哈！', '好搞笑！', '再来一个笑话！'],
            '小李': ['酷！', '不错！', '好的！']
        };

        let friends = [];
        let selectedFriend = null;
        let interactions = 0;
        let chatHistory = [];

        function initGame() {
            friends = FRIENDS_DATA.map(f => ({
                ...f,
                friendship: 30 + Math.floor(Math.random() * 20)
            }));
            selectedFriend = null;
            interactions = 0;
            chatHistory = [];

            renderFriends();
            renderChat();
            updateUI();
        }

        function renderFriends() {
            const grid = document.getElementById('friendsGrid');
            grid.innerHTML = '';

            friends.forEach(friend => {
                const card = document.createElement('div');
                card.className = 'friend-card' + (selectedFriend?.name === friend.name ? ' selected' : '');
                card.innerHTML = `
                    <div class="friend-avatar">${friend.avatar}</div>
                    <div class="friend-name">${friend.name}</div>
                    <div class="friend-status">${friend.status} · ${friend.personality}</div>
                    <div class="friendship-meter">
                        <div class="friendship-fill" style="width: ${friend.friendship}%"></div>
                    </div>
                `;
                card.addEventListener('click', () => selectFriend(friend.name));
                grid.appendChild(card);
            });
        }

        function renderChat() {
            const area = document.getElementById('chatArea');
            area.innerHTML = '';

            if (chatHistory.length === 0) {
                area.innerHTML = '<div style="color: #636e72; text-align: center;">选择好友开始互动</div>';
            } else {
                chatHistory.forEach(msg => {
                    const el = document.createElement('div');
                    el.className = 'chat-message ' + (msg.fromMe ? 'from-me' : 'from-friend');
                    el.textContent = msg.text;
                    area.appendChild(el);
                });
            }
        }

        function selectFriend(name) {
            selectedFriend = friends.find(f => f.name === name);
            chatHistory = [];
            renderFriends();
            renderChat();
        }

        function chat() {
            if (!selectedFriend) {
                showMessage('请先选择好友！');
                return;
            }

            addChatMessage('你好！', true);
            setTimeout(() => {
                const response = CHATS[selectedFriend.name][Math.floor(Math.random() * CHATS[selectedFriend.name].length)];
                addChatMessage(response, false);
                updateFriendship(5);
            }, 500);
        }

        function gift() {
            if (!selectedFriend) {
                showMessage('请先选择好友！');
                return;
            }

            addChatMessage('送给你一个礼物！🎁', true);
            setTimeout(() => {
                addChatMessage('谢谢你的礼物！❤️', false);
                updateFriendship(15);
            }, 500);
        }

        function game() {
            if (!selectedFriend) {
                showMessage('请先选择好友！');
                return;
            }

            addChatMessage('一起玩游戏吧！🎮', true);
            setTimeout(() => {
                addChatMessage('好啊！开始吧！🎯', false);
                updateFriendship(10);
            }, 500);
        }

        function help() {
            if (!selectedFriend) {
                showMessage('请先选择好友！');
                return;
            }

            addChatMessage('需要我帮你吗？🤝', true);
            setTimeout(() => {
                addChatMessage('太感谢了！你真好！💕', false);
                updateFriendship(20);
            }, 500);
        }

        function addChatMessage(text, fromMe) {
            chatHistory.push({ text, fromMe });
            interactions++;
            renderChat();
            updateUI();
        }

        function updateFriendship(amount) {
            selectedFriend.friendship = Math.min(100, selectedFriend.friendship + amount);
            renderFriends();
            updateUI();

            if (selectedFriend.friendship >= 100) {
                showMessage(`${selectedFriend.name}成为你的挚友！`);
            }
        }

        function updateUI() {
            document.getElementById('friendCount').textContent = friends.length;
            document.getElementById('interactions').textContent = interactions;
            const total = friends.reduce((sum, f) => sum + f.friendship, 0);
            document.getElementById('totalFriendship').textContent = Math.floor(total / friends.length);
        }

        function showMessage(msg) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 1500);
        }

        document.getElementById('btnChat').addEventListener('click', chat);
        document.getElementById('btnGift').addEventListener('click', gift);
        document.getElementById('btnGame').addEventListener('click', game);
        document.getElementById('btnHelp').addEventListener('click', help);
        document.getElementById('btnReset').addEventListener('click', initGame);

        // 初始化
        GameCore.init({ highScore: 'friend_game' });
        initGame();
    </script>
</body>
</html>
