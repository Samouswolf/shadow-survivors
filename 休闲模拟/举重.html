<script>
// // 初始化游戏变量

// ============================================
// 游戏名称: 举重
// 功能描述: 该游戏提供休闲娱乐体验
// 创建时间: 2026-06-23
// ============================================

// ============ CONFIGURATION ============
const CONFIG = {
INITIAL_WEIGHT: 40,
WEIGHT_INCREMENT: 10,
MAX_WEIGHT: 200,
ROUNDS_PER_WEIGHT: 3,
PERFECT_THRESHOLD: 0.08,
GREAT_THRESHOLD: 0.15,
GOOD_THRESHOLD: 0.25,
POWER_SPEED: 3,
LIFT_SPEED: 0.03,
BAR_WIDTH: 0.4,
BAR_HEIGHT: 0.06,
RHYTHM_INTERVAL: 2000,
AD_SHOW_INTERVAL: 5,
};

// ============ GAME STATE ============
var canvas, ctx;
var W, H, SCALE;
var G = {
state: 'menu',
score: 0,
combo: 0,
maxCombo: 0,
weight: CONFIG.INITIAL_WEIGHT,
round: 0,
totalLifts: 0,
perfectCount: 0,
greatCount: 0,
goodCount: 0,
power: 0,
powerDir: 1,
liftY: 0,
liftState: 'waiting',
beatTimer: 0,
beatInterval: CONFIG.RHYTHM_INTERVAL,
beatActive: false,
beatAlpha: 0,
lastBeatTime: 0,
particles: [],
textEffects: [],
shakes: [],
highScore: 0,
totalGames: 0,
adTimer: 0,
showAd: false,
adType: '',
sponsorVisible: false,
characterY: 0,
characterState: 'idle',
barbellRotation: 0,
sweatDrops: [],
breathPhase: 0,
groundShadow: 0,
spotlightAngle: 0,
achievementPopups: [],
achievements: {},
roundHistory: [],
lastRoundScore: 0,
difficulty: 1,
rhythmAccuracy: 0,
totalAttempts: 0,
};

// ============ PARTICLE SYSTEM ============
class Particle {
constructor(x, y, type) {
this.x = x;
this.y = y;
this.type = type || 'default';
this.life = 1;
this.maxLife = 1;
this.vx = (Math.random() - 0.5) * 4;
this.vy = -Math.random() * 3 - 1;
this.gravity = 0.1;
this.size = Math.random() * 4 + 2;
this.color = this.getColor();
this.rotation = Math.random() * Math.PI * 2;
this.rotationSpeed = (Math.random() - 0.5) * 0.2;
}

getColor() {
const colors = {
'default': ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#ff6b9d'],
'success': ['#4ade80', '#22c55e', '#86efac', '#bbf7d0'],
'perfect': ['#fbbf24', '#f59e0b', '#fcd34d', '#fde68a'],
'great': ['#60a5fa', '#3b82f6', '#93c5fd', '#bfdbfe'],
'good': ['#a78bfa', '#8b5cf6', '#c4b5fd', '#ddd6fe'],
'fail': ['#f87171', '#ef4444', '#fca5a5', '#fecaca'],
'sweat': ['#60a5fa', '#93c5fd', '#bfdbfe'],
'dust': ['#9ca3af', '#6b7280', '#d1d5db', '#e5e7eb'],
'star': ['#fbbf24', '#f59e0b', '#fcd34d', '#fde68a', '#fff'],
};
const c = colors[this.type] || colors['default'];
return c[Math.floor(Math.random() * c.length)];
}

update(dt) {
this.life -= dt * 2;
this.x += this.vx;
this.y += this.vy;
this.vy += this.gravity;
this.rotation += this.rotationSpeed;
if (this.type === 'sweat') {
this.vx *= 0.98;
this.gravity = 0.05;
}
if (this.type === 'dust') {
this.vy *= 0.95;
this.vx *= 0.97;
this.gravity = 0.02;
}
return this.life > 0;
}

draw(ctx) {
ctx.save();
ctx.globalAlpha = Math.max(0, this.life);
ctx.translate(this.x, this.y);
ctx.rotate(this.rotation);
ctx.fillStyle = this.color;
if (this.type === 'star') {
this.drawStar(ctx, 0, 0, this.size * 2, this.size, 5);
} else if (this.type === 'sweat') {
ctx.beginPath();
ctx.ellipse(0, 0, this.size * 0.6, this.size, 0, 0, Math.PI * 2);
ctx.fill();
} else {
ctx.beginPath();
ctx.arc(0, 0, this.size, 0, Math.PI * 2);
ctx.fill();
}
ctx.restore();
}

drawStar(ctx, cx, cy, outerR, innerR, points) {
ctx.beginPath();
for (let i = 0; i < points * 2; i++) {
const r = i % 2 === 0 ? outerR : innerR;
const angle = (i * Math.PI) / points - Math.PI / 2;
const x = cx + Math.cos(angle) * r;
const y = cy + Math.sin(angle) * r;
if (i === 0) ctx.moveTo(x, y);
else ctx.lineTo(x, y);
}
ctx.closePath();
ctx.fill();
}
}

// ============ INITIALIZATION ============
function init() {
canvas = document.getElementById('canvas');
ctx = canvas.getContext('2d');
resize();
window.addEventListener('resize', resize);
setupInput();
loadHighScore();
requestAnimationFrame(gameLoop);
}

function resize() {
const dpr = window.devicePixelRatio || 1;
const maxW = window.innerWidth;
const maxH = window.innerHeight - 50;
const aspect = 9 / 16;
if (maxW / maxH > aspect) {
H = maxH;
W = H * aspect;
} else {
W = maxW;
H = W / aspect;
}
canvas.width = W * dpr;
canvas.height = H * dpr;
canvas.style.width = W + 'px';
canvas.style.height = H + 'px';
ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
SCALE = W / 400;
}

function setupInput() {
const actions = [
{ keys: ['Space', 'Enter'], action: 'mainAction' },
{ keys: ['KeyZ'], action: 'mainAction' },
{ keys: ['Escape'], action: 'pause' },
];

document.addEventListener('keydown', (e) => {
if (G.showAd) { closeAd(); return; }
if (G.sponsorVisible) { closeSponsor(); return; }
const a = actions.find(a => a.keys.includes(e.code));
if (a) {
e.preventDefault();
handleInput(a.action);
}
});

canvas.addEventListener('click', (e) => {
if (G.showAd) { closeAd(); return; }
if (G.sponsorVisible) { closeSponsor(); return; }
handleInput('mainAction');
});

canvas.addEventListener('touchstart', (e) => {
e.preventDefault();
if (G.showAd) { closeAd(); return; }
if (G.sponsorVisible) { closeSponsor(); return; }
handleInput('mainAction');
}, { passive: false });
}

function handleInput(action) {
switch (G.state) {
case 'menu':
if (action === 'mainAction') startGame();
break;
case 'playing':
if (action === 'mainAction') handleLiftAction();
if (action === 'pause') G.state = 'paused';
break;
case 'paused':
if (action === 'mainAction' || action === 'pause') G.state = 'playing';
break;
case 'gameOver':
if (action === 'mainAction') startGame();
break;
case 'roundEnd':
if (action === 'mainAction') nextRound();
break;
}
}

// ============ GAME LOGIC ============
function startGame() {
G.state = 'playing';
G.score = 0;
G.combo = 0;
G.maxCombo = 0;
G.weight = CONFIG.INITIAL_WEIGHT;
G.round = 0;
G.totalLifts = 0;
G.perfectCount = 0;
G.greatCount = 0;
G.goodCount = 0;
G.power = 0;
G.powerDir = 1;
G.liftY = 0;
G.liftState = 'waiting';
G.beatTimer = 0;
G.beatActive = false;
G.beatAlpha = 0;
G.lastBeatTime = performance.now();
G.particles = [];
G.textEffects = [];
G.sweatDrops = [];
G.achievementPopups = [];
G.roundHistory = [];
G.lastRoundScore = 0;
G.difficulty = 1;
G.rhythmAccuracy = 0;
G.totalAttempts = 0;
G.characterY = 0;
G.characterState = 'idle';
G.adTimer = 0;
G.showAd = false;
G.totalGames++;
checkAchievements();
}

function handleLiftAction() {
if (G.liftState === 'waiting') {
G.liftState = 'powering';
G.power = 0;
G.powerDir = 1;
} else if (G.liftState === 'powering') {
const accuracy = Math.abs(0.5 - G.power / 100) * 2;
G.totalAttempts++;
if (accuracy <= CONFIG.PERFECT_THRESHOLD) {
scoreLift('PERFECT!', 300);
} else if (accuracy <= CONFIG.GREAT_THRESHOLD) {
scoreLift('GREAT!', 200);
} else if (accuracy <= CONFIG.GOOD_THRESHOLD) {
scoreLift('GOOD!', 100);
} else {
scoreLift('MISS!', 0);
}
} else if (G.liftState === 'lifting') {
// Already lifting
}
}

function scoreLift(text, points) {
if (points > 0) {
G.combo++;
if (G.combo > G.maxCombo) G.maxCombo = G.combo;
const comboBonus = Math.floor(G.combo / 5) * 50;
const weightBonus = Math.floor(G.weight / 10) * 10;
const totalPoints = (points + comboBonus + weightBonus) * G.difficulty;
G.score += totalPoints;
G.totalLifts++;
if (text === 'PERFECT!') {
G.perfectCount++;
G.liftState = 'lifting';
G.characterState = 'lifting';
spawnParticles(W / 2, H * 0.45, 'perfect', 30);
spawnParticles(W / 2, H * 0.35, 'star', 15);
addTextEffect(text, W / 2, H * 0.3, '#fbbf24', 48);
if (G.combo > 0 && G.combo % 5 === 0) {
addTextEffect(G.combo + ' COMBO!', W / 2, H * 0.25, '#ff6b6b', 36);
}
} else if (text === 'GREAT!') {
G.greatCount++;
G.liftState = 'lifting';
G.characterState = 'lifting';
spawnParticles(W / 2, H * 0.45, 'great', 20);
addTextEffect(text, W / 2, H * 0.3, '#60a5fa', 40);
} else if (text === 'GOOD!') {
G.goodCount++;
G.liftState = 'lifting';
G.characterState = 'lifting';
spawnParticles(W / 2, H * 0.45, 'good', 12);
addTextEffect(text, W / 2, H * 0.3, '#a78bfa', 32);
}
addTextEffect('+' + totalPoints, W / 2, H * 0.38, '#ffffff', 24);
} else {
G.combo = 0;
G.liftState = 'waiting';
spawnParticles(W / 2, H * 0.45, 'fail', 15);
addTextEffect('MISS!', W / 2, H * 0.3, '#f87171', 44);
addTextEffect('节奏没跟上', W / 2, H * 0.36, '#fca5a5', 20);
}
G.rhythmAccuracy += (text === 'PERFECT!' ? 1 : text === 'GREAT!' ? 0.7 : text === 'GOOD!' ? 0.4 : 0);
}

function nextRound() {
G.round++;
if (G.round >= CONFIG.ROUNDS_PER_WEIGHT) {
G.round = 0;
G.weight += CONFIG.WEIGHT_INCREMENT;
G.difficulty = 1 + (G.weight - CONFIG.INITIAL_WEIGHT) / 50;
if (G.weight > CONFIG.MAX_WEIGHT) {
gameOver();
return;
}
}
G.state = 'playing';
G.liftState = 'waiting';
G.beatTimer = 0;
G.beatActive = false;
G.lastBeatTime = performance.now();
G.beatInterval = CONFIG.RHYTHM_INTERVAL / G.difficulty;
}

function gameOver() {
G.state = 'gameOver';
if (G.score > G.highScore) {
G.highScore = G.score;
saveHighScore();
spawnParticles(W / 2, H * 0.3, 'star', 50);
}
G.adTimer++;
if (G.adTimer % CONFIG.AD_SHOW_INTERVAL === 0) {
showInterstitialAd();
}
checkAchievements();
}

// ============ RHYTHM SYSTEM ============
function updateBeat(dt) {
if (G.state !== 'playing') return;
G.beatTimer += dt * 1000;
if (G.beatTimer >= G.beatInterval) {
G.beatTimer -= G.beatInterval;
G.beatActive = true;
G.beatAlpha = 1;
G.lastBeatTime = performance.now();
spawnBeatParticles();
}
if (G.beatActive) {
G.beatAlpha -= dt * 3;
if (G.beatAlpha <= 0) {
G.beatActive = false;
}
}
}

function spawnBeatParticles() {
const bx = W / 2;
const by = H * 0.65;
for (let i = 0; i < 8; i++) {
const angle = (i / 8) * Math.PI * 2;
const p = new Particle(bx + Math.cos(angle) * 30, by + Math.sin(angle) * 20, 'default');
p.vx = Math.cos(angle) * 2;
p.vy = Math.sin(angle) * 2;
p.size = 3;
G.particles.push(p);
}
}

// ============ POWER BAR ============
function updatePower(dt) {
if (G.state !== 'playing' || G.liftState !== 'powering') return;
G.power += G.powerDir * CONFIG.POWER_SPEED * dt * 60;
if (G.power >= 100) {
G.power = 100;
G.powerDir = -1;
} else if (G.power <= 0) {
G.power = 0;
G.powerDir = 1;
}
}

// ============ LIFT ANIMATION ============
function updateLift(dt) {
if (G.liftState === 'lifting') {
G.liftY += CONFIG.LIFT_SPEED * dt * 60;
if (G.liftY >= 1) {
G.liftY = 1;
G.liftState = 'downing';
spawnParticles(W / 2, H * 0.3, 'dust', 10);
addShake(5, 200);
}
} else if (G.liftState === 'downing') {
G.liftY -= CONFIG.LIFT_SPEED * 0.5 * dt * 60;
if (G.liftY <= 0) {
G.liftY = 0;
G.liftState = 'waiting';
G.characterState = 'idle';
checkRoundComplete();
}
}
}

function checkRoundComplete() {
G.roundHistory.push(G.lastRoundScore);
if (G.round >= CONFIG.ROUNDS_PER_WEIGHT - 1 && G.weight >= CONFIG.MAX_WEIGHT) {
gameOver();
} else {
G.state = 'roundEnd';
}
}

// ============ PARTICLES ============
function spawnParticles(x, y, type, count) {
for (let i = 0; i < count; i++) {
G.particles.push(new Particle(x, y, type));
}
}

function updateParticles(dt) {
G.particles = G.particles.filter(p => p.update(dt));
}

// ============ TEXT EFFECTS ============
function addTextEffect(text, x, y, color, size) {
G.textEffects.push({
text, x, y, color, size,
life: 1,
vy: -1.5,
scale: 1.5
});
}

function updateTextEffects(dt) {
G.textEffects = G.textEffects.filter(t => {
t.life -= dt * 1.5;
t.y += t.vy;
t.vy *= 0.98;
if (t.scale > 1) t.scale -= dt * 3;
return t.life > 0;
});
}

// ============ SCREEN SHAKE ============
function addShake(intensity, duration) {
G.shakes.push({ intensity, duration, elapsed: 0 });
}

function updateShakes(dt) {
G.shakes = G.shakes.filter(s => {
s.elapsed += dt * 1000;
return s.elapsed < s.duration;
});
}

function getShakeOffset() {
let ox = 0, oy = 0;
G.shakes.forEach(s => {
const t = 1 - s.elapsed / s.duration;
const i = s.intensity * t;
ox += (Math.random() - 0.5) * i * 2;
oy += (Math.random() - 0.5) * i * 2;
});
return { x: ox, y: oy };
}

// ============ CHARACTER ============
function updateCharacter(dt) {
G.breathPhase += dt * 3;
if (G.characterState === 'idle') {
G.characterY = Math.sin(G.breathPhase) * 3;
}
if (G.characterState === 'lifting' && G.liftState === 'lifting') {
G.characterY = -G.liftY * 30;
}
if (Math.random() < dt * 2 && G.state === 'playing' && G.liftState === 'powering') {
const sx = W / 2 + (Math.random() - 0.5) * 40;
const sy = H * 0.35 + Math.random() * 20;
G.sweatDrops.push({
x: sx, y: sy,
vx: (Math.random() - 0.5) * 2,
vy: -Math.random() * 2 - 1,
life: 1
});
}
G.sweatDrops = G.sweatDrops.filter(d => {
d.life -= dt * 2;
d.x += d.vx;
d.y += d.vy;
d.vy += 0.1;
return d.life > 0;
});
}

function addAchievementPopup(name, desc) {
G.achievementPopups.push({ name, desc, life: 3, y: 0 });

function updateAchievements(dt) {
G.achievementPopups = G.achievementPopups.filter(a => {
a.life -= dt;
a.y = Math.min(a.y + dt * 60, 40);

});

function drawCharacter() {

const cy = H * 0.55 + G.characterY;

ctx.translate(0, -G.liftY * 40 * SCALE);
}

ctx.fillStyle = '#e8b86d';
const armAngle = G.liftState === 'lifting' ? -Math.PI / 2 : -Math.PI / 4;
ctx.save();
ctx.translate(-14 * SCALE, -14 * SCALE + breath);
ctx.rotate(armAngle);
roundRect(ctx, -4 * SCALE, 0, 8 * SCALE, 22 * SCALE, 4 * SCALE);
ctx.fill();
ctx.restore();
ctx.save();
ctx.translate(14 * SCALE, -14 * SCALE + breath);
ctx.rotate(-armAngle);
roundRect(ctx, -4 * SCALE, 0, 8 * SCALE, 22 * SCALE, 4 * SCALE);
ctx.fill();
ctx.restore();

ctx.fill();
roundRect(ctx, 2 * SCALE, 12 * SCALE + breath, 10 * SCALE, 20 * SCALE, 3 * SCALE);
ctx.fill();
ctx.fillStyle = '#fff';
ctx.beginPath();
ctx.arc(-4 * SCALE, -28 * SCALE + breath, 2 * SCALE, 0, Math.PI * 2);
ctx.arc(4 * SCALE, -28 * SCALE + breath, 2 * SCALE, 0, Math.PI * 2);

});
}

function drawBarbell() {
const cx = W / 2;
const baseY = H * 0.42;
const liftOffset = G.liftY * 60 * SCALE;
const y = baseY - liftOffset;
ctx.save();
ctx.translate(cx, y);
ctx.strokeStyle = '#aaa';
ctx.lineWidth = 6 * SCALE;
ctx.beginPath();
ctx.moveTo(-70 * SCALE, 0);
ctx.lineTo(70 * SCALE, 0);
ctx.stroke();
const plateCount = Math.min(Math.floor(G.weight / 20), 6);
const plateWidth = 12 * SCALE;
const plateHeight = 30 * SCALE;
for (let i = 0; i < plateCount; i++) {
const px = -70 * SCALE + i * (plateWidth + 2);
const grad = ctx.createLinearGradient(px, -plateHeight / 2, px + plateWidth, plateHeight / 2);
grad.addColorStop(0, '#555');
grad.addColorStop(0.5, '#888');
grad.addColorStop(1, '#555');
ctx.fillStyle = grad;
roundRect(ctx, px, -plateHeight / 2, plateWidth, plateHeight, 3 * SCALE);
ctx.fill();
ctx.strokeStyle = '#333';
ctx.lineWidth = 1;
ctx.stroke();
const px2 = 70 * SCALE - i * (plateWidth + 2) - plateWidth;
ctx.fillStyle = grad;
roundRect(ctx, px2, -plateHeight / 2, plateWidth, plateHeight, 3 * SCALE);
ctx.fill();
ctx.stroke();
}
ctx.fillStyle = '#777';
roundRect(ctx, -12 * SCALE, -10 * SCALE, 24 * SCALE, 20 * SCALE, 4 * SCALE);
ctx.fill();
ctx.strokeStyle = '#555';
ctx.lineWidth = 1;
ctx.stroke();
ctx.fillStyle = '#fff';
ctx.font = `bold ${10 * SCALE}px "Microsoft YaHei"`;
ctx.textAlign = 'center';
ctx.fillText(G.weight + 'kg', 0, 4 * SCALE);
ctx.restore();
}

function drawPowerMeter() {
if (G.state !== 'playing' || G.liftState !== 'powering') return;
const barW = W * CONFIG.BAR_WIDTH;
const barH = H * CONFIG.BAR_HEIGHT;
const barX = (W - barW) / 2;
const barY = H * 0.82;
ctx.fillStyle = 'rgba(0,0,0,0.6)';
roundRect(ctx, barX - 4, barY - 4, barW + 8, barH + 8, 12);
ctx.fill();
const grad = ctx.createLinearGradient(barX, barY, barX + barW, barY);
grad.addColorStop(0, '#ef4444');
grad.addColorStop(0.3, '#f59e0b');
grad.addColorStop(0.5, '#22c55e');
grad.addColorStop(0.7, '#f59e0b');
grad.addColorStop(1, '#ef4444');
ctx.fillStyle = grad;
roundRect(ctx, barX, barY, barW, barH, 8);
ctx.fill();
ctx.strokeStyle = 'rgba(255,255,255,0.3)';
ctx.lineWidth = 1;
roundRect(ctx, barX, barY, barW, barH, 8);
ctx.stroke();
const perfectX = barX + barW * 0.5;
const perfectW = barW * CONFIG.PERFECT_THRESHOLD;
ctx.fillStyle = 'rgba(255,255,255,0.2)';
ctx.fillRect(perfectX - perfectW / 2, barY, perfectW, barH);
const markerX = barX + (G.power / 100) * barW;
ctx.fillStyle = '#fff';
ctx.beginPath();
ctx.moveTo(markerX, barY - 10 * SCALE);
ctx.lineTo(markerX - 6 * SCALE, barY - 2 * SCALE);
ctx.lineTo(markerX + 6 * SCALE, barY - 2 * SCALE);
ctx.closePath();
ctx.fill();
ctx.beginPath();
ctx.moveTo(markerX, barY + barH + 10 * SCALE);
ctx.lineTo(markerX - 6 * SCALE, barY + barH + 2 * SCALE);
ctx.lineTo(markerX + 6 * SCALE, barY + barH + 2 * SCALE);
ctx.closePath();
ctx.fill();
ctx.fillStyle = '#fff';
ctx.font = `bold ${14 * SCALE}px "Microsoft YaHei"`;
ctx.textAlign = 'center';
ctx.fillText('按空格/点击 停止', W / 2, barY + barH + 30 * SCALE);
ctx.font = `${12 * SCALE}px "Microsoft YaHei"`;
ctx.fillStyle = '#22c55e';
ctx.fillText('PERFECT区域在中间', W / 2, barY - 20 * SCALE);
}

function drawBeatIndicator() {
if (G.state !== 'playing') return;
const bx = W / 2;
const by = H * 0.65;
if (G.beatActive) {
ctx.save();
ctx.globalAlpha = G.beatAlpha * 0.5;
const pulseR = 30 * SCALE * (1 + (1 - G.beatAlpha) * 2);
ctx.strokeStyle = '#e94560';
ctx.lineWidth = 3 * SCALE;
ctx.beginPath();
ctx.arc(bx, by, pulseR, 0, Math.PI * 2);
ctx.stroke();
ctx.restore();
}
const beatProgress = G.beatTimer / G.beatInterval;
const nextBeatIn = (1 - beatProgress) * G.beatInterval;
if (nextBeatIn < 500) {
const urgency = 1 - nextBeatIn / 500;
ctx.save();
ctx.globalAlpha = urgency * 0.3;
ctx.fillStyle = '#e94560';
ctx.beginPath();
ctx.arc(bx, by, 25 * SCALE * (1 + urgency * 0.3), 0, Math.PI * 2);
ctx.fill();
ctx.restore();
}
if (G.liftState === 'waiting') {
const pulse = Math.sin(performance.now() / 300) * 0.3 + 0.7;
ctx.save();
ctx.globalAlpha = pulse;
ctx.fillStyle = '#fff';
ctx.font = `bold ${16 * SCALE}px "Microsoft YaHei"`;
ctx.textAlign = 'center';
ctx.fillText('按节奏按键!', bx, by + 50 * SCALE);
ctx.restore();
}
}

ctx.fillText('再来一次', W / 2, btnY + 6 * SCALE);
ctx.font = `${11 * SCALE}px "Microsoft YaHei"`;
ctx.fillStyle = '#888';
ctx.fillText('空格/点击/触屏', W / 2, H * 0.85);
drawParticles();
drawTextEffects();
drawAchievementPopups();
drawAd();
drawSponsor();
}

function drawPaused() {
ctx.fillStyle = 'rgba(0,0,0,0.7)';
ctx.fillRect(0, 0, W, H);
ctx.fillStyle = '#fff';
ctx.font = `bold ${36 * SCALE}px "Microsoft YaHei"`;
ctx.textAlign = 'center';
ctx.fillText('暂停', W / 2, H * 0.4);
ctx.font = `${16 * SCALE}px "Microsoft YaHei"`;
ctx.fillStyle = '#aaa';
ctx.fillText('按空格/点击继续', W / 2, H * 0.5);
}

// ============ UTILITY ============
function roundRect(ctx, x, y, w, h, r) {
if (w < 2 * r) r = w / 2;
if (h < 2 * r) r = h / 2;
ctx.beginPath();
ctx.moveTo(x + r, y);
ctx.arcTo(x + w, y, x + w, y + h, r);
ctx.arcTo(x + w, y + h, x, y + h, r);
ctx.arcTo(x, y + h, x, y, r);
ctx.arcTo(x, y, x + w, y, r);
ctx.closePath();
}

// ============ SAVE/LOAD ============
function loadHighScore() {
try {
const saved = localStorage.getItem('weightlifting_highscore');
if (saved) G.highScore = parseInt(saved) || 0;
const games = localStorage.getItem('weightlifting_games');
if (games) G.totalGames = parseInt(games) || 0;
const achievements = localStorage.getItem('weightlifting_achievements');
if (achievements) G.achievements = JSON.parse(achievements) || {};
} catch (e) {}
}

function saveHighScore() {
try {
localStorage.setItem('weightlifting_highscore', G.highScore);
localStorage.setItem('weightlifting_games', G.totalGames);
} catch (e) {}
}

function saveAchievements() {
try {
localStorage.setItem('weightlifting_achievements', JSON.stringify(G.achievements));
} catch (e) {}
}

// ============ GAME LOOP ============
let lastTime = 0;
function gameLoop(timestamp) {
const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
lastTime = timestamp;
update(dt);
render();
requestAnimationFrame(gameLoop);
}

function update(dt) {
if (G.state === 'playing') {
updateBeat(dt);
updatePower(dt);
updateLift(dt);
updateCharacter(dt);
}
updateParticles(dt);
updateTextEffects(dt);
updateShakes(dt);
updateAchievements(dt);
G.spotlightAngle += dt * 0.5;
}

function render() {
ctx.clearRect(0, 0, W, H);
switch (G.state) {
case 'menu': drawMenu(); break;
case 'playing': drawGame(); break;
case 'paused': drawGame(); drawPaused(); break;
case 'roundEnd': drawRoundEnd(); break;
case 'gameOver': drawGameOver(); break;
}
}

<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>

  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {

      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
