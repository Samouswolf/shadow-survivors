<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>角色扮演</title>
    <script src="game_core.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            border-radius: 12px;
        }
        .stat {
            text-align: center;
            color: white;
        }
        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }
        .stat-value {
            font-size: 20px;
            font-weight: bold;
        }
        .character {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            padding: 15px;
            background: #dfe6e9;
            border-radius: 12px;
        }
        .char-avatar {
            width: 80px;
            height: 80px;
            background: #9b59b6;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        .char-info {
            flex: 1;
        }
        .char-name {
            font-size: 18px;
            color: #2d3436;
            font-weight: bold;
        }
        .char-class {
            font-size: 14px;
            color: #636e72;
        }
        .char-stats {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .char-stat {
            padding: 5px 10px;
            background: white;
            border-radius: 5px;
            font-size: 12px;
        }
        .story-area {
            padding: 20px;
            background: #ffeaa7;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .story-title {
            font-size: 16px;
            color: #2d3436;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .story-text {
            font-size: 14px;
            color: #636e72;
            line-height: 1.6;
        }
        .choices-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }
        .choice-btn {
            padding: 15px;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            border: 2px solid #dfe6e9;
            transition: all 0.2s;
        }
        .choice-btn:hover {
            border-color: #9b59b6;
            background: #e8f4f8;
        }
        .choice-icon {
            font-size: 20px;
            margin-right: 10px;
        }
        .choice-text {
            font-size: 14px;
            color: #2d3436;
        }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 20px 40px;
            border-radius: 15px;
            font-size: 18px;
            display: none;
            z-index: 100;
            text-align: center;
        }
        .message.show { display: block; }
        .ad-banner {
            width: 100%;
            height: 60px;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">等级</div>
                <div class="stat-value" id="level">1</div>
            </div>
            <div class="stat">
                <div class="stat-label">金币</div>
                <div class="stat-value" id="gold">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">经验</div>
                <div class="stat-value" id="exp">0</div>
            </div>
        </div>

        <div class="character">
            <div class="char-avatar" id="charAvatar">🧙</div>
            <div class="char-info">
                <div class="char-name" id="charName">勇者</div>
                <div class="char-class" id="charClass">战士</div>
                <div class="char-stats">
                    <div class="char-stat">❤️ HP: <span id="hp">100</span></div>
                    <div class="char-stat">⚔️ ATK: <span id="atk">10</span></div>
                    <div class="char-stat">🛡️ DEF: <span id="def">5</span></div>
                </div>
            </div>
        </div>

        <div class="story-area">
            <div class="story-title" id="storyTitle">故事标题</div>
            <div class="story-text" id="storyText">故事内容</div>
        </div>

        <div class="choices-area" id="choicesArea"></div>

        <div class="controls">
            <button class="btn btn-primary" id="btnReset">🔄 新冒险</button>
        </div>

        <div class="message" id="message"></div>

        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    <script>
        const STORIES = {
            start: {
                title: '冒险开始',
                text: '你是一名年轻的冒险者，来到了一个神秘的村庄。村民们告诉你附近有一座古老的城堡...',
                choices: [
                    { icon: '🏰', text: '前往城堡探索', next: 'castle' },
                    { icon: '🏪', text: '先去商店购买装备', next: 'shop' },
                    { icon: '💬', text: '与村民交谈获取信息', next: 'talk' }
                ]
            },
            castle: {
                title: '城堡入口',
                text: '城堡大门紧闭，门口有一个守卫。他看起来很强壮...',
                choices: [
                    { icon: '⚔️', text: '挑战守卫', next: 'fight' },
                    { icon: '🗣️', text: '尝试说服守卫', next: 'persuade' },
                    { icon: '🔍', text: '寻找其他入口', next: 'secret' }
                ]
            },
            shop: {
                title: '商店',
                text: '商店里摆满了各种装备。店主热情地招呼你...',
                choices: [
                    { icon: '⚔️', text: '购买武器（+5攻击）', next: 'buy_weapon' },
                    { icon: '🛡️', text: '购买护甲（+5防御）', next: 'buy_armor' },
                    { icon: '❤️', text: '购买药水（+20生命）', next: 'buy_potion' }
                ]
            },
            talk: {
                title: '村民情报',
                text: '村民告诉你城堡里有一个秘密通道，但需要找到钥匙...',
                choices: [
                    { icon: '🔑', text: '询问钥匙位置', next: 'key_hint' },
                    { icon: '🏰', text: '直接前往城堡', next: 'castle' }
                ]
            },
            fight: {
                title: '战斗',
                text: '你与守卫展开激烈的战斗！',
                choices: [
                    { icon: '⚔️', text: '全力攻击', next: 'attack' },
                    { icon: '🛡️', text: '防御反击', next: 'defend' }
                ]
            },
            ending: {
                title: '冒险结束',
                text: '你的冒险故事圆满结束，获得了丰富的经验和金币！',
                choices: []
            }
        };

        let character = {
            name: '勇者',
            class: '战士',
            avatar: '🧙',
            hp: 100,
            atk: 10,
            def: 5,
            level: 1,
            gold: 0,
            exp: 0
        };
        let currentStory = 'start';
        let gameOver = false;

        function initGame() {
            character = {
                name: '勇者',
                class: '战士',
                avatar: '🧙',
                hp: 100,
                atk: 10,
                def: 5,
                level: 1,
                gold: 0,
                exp: 0
            };
            currentStory = 'start';
            gameOver = false;

            renderCharacter();
            renderStory();
            updateUI();
        }

        function renderCharacter() {
            document.getElementById('charAvatar').textContent = character.avatar;
            document.getElementById('charName').textContent = character.name;
            document.getElementById('charClass').textContent = character.class;
            document.getElementById('hp').textContent = character.hp;
            document.getElementById('atk').textContent = character.atk;
            document.getElementById('def').textContent = character.def;
        }

        function renderStory() {
            const story = STORIES[currentStory];
            if (!story) return;

            document.getElementById('storyTitle').textContent = story.title;
            document.getElementById('storyText').textContent = story.text;

            const el = document.getElementById('choicesArea');
            el.innerHTML = '';

            if (story.choices.length === 0) {
                showMessage('🎉 冒险完成！\n等级: ' + character.level + '\n金币: ' + character.gold);
                GameCore.highScore.set('rpg_game', character.level);
                return;
            }

            story.choices.forEach(choice => {
                const btn = document.createElement('div');
                btn.className = 'choice-btn';
                btn.innerHTML = `
                    <span class="choice-icon">${choice.icon}</span>
                    <span class="choice-text">${choice.text}</span>
                `;
                btn.addEventListener('click', () => makeChoice(choice));
                el.appendChild(btn);
            });
        }

        function makeChoice(choice) {
            character.exp += 10;

            // 根据选择更新角色
            if (choice.next === 'buy_weapon') {
                character.atk += 5;
                character.gold -= 20;
                showMessage('购买武器！攻击+5');
            } else if (choice.next === 'buy_armor') {
                character.def += 5;
                character.gold -= 20;
                showMessage('购买护甲！防御+5');
            } else if (choice.next === 'buy_potion') {
                character.hp += 20;
                character.gold -= 10;
                showMessage('购买药水！生命+20');
            } else if (choice.next === 'attack') {
                character.hp -= 20;
                character.gold += 50;
                character.exp += 30;
                showMessage('战斗胜利！获得50金币');
            } else if (choice.next === 'defend') {
                character.hp -= 10;
                character.gold += 30;
                character.exp += 20;
                showMessage('防御成功！获得30金币');
            }

            // 升级检查
            if (character.exp >= character.level * 50) {
                character.level++;
                character.atk += 2;
                character.def += 1;
                showMessage('升级！等级' + character.level);
            }

            // 检查死亡
            if (character.hp <= 0) {
                gameOver = true;
                showMessage('战斗失败...\n等级: ' + character.level);
                return;
            }

            // 下一场景
            if (STORIES[choice.next]) {
                currentStory = choice.next;
            } else {
                currentStory = 'ending';
            }

            renderCharacter();
            renderStory();
            updateUI();
        }

        function updateUI() {
            document.getElementById('level').textContent = character.level;
            document.getElementById('gold').textContent = character.gold;
            document.getElementById('exp').textContent = character.exp;
        }

        function showMessage(msg) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 1500);
        }

        document.getElementById('btnReset').addEventListener('click', initGame);

        // 初始化
        GameCore.init({ highScore: 'rpg_game' });
        initGame();
    </script>
</body>
</html>
