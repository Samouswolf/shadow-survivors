<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>井字棋</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 100%;
        }

        .game-title {
            text-align: center;
            font-size: 32px;
            color: #333;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .game-info {
            text-align: center;
            font-size: 18px;
            color: #666;
            margin-bottom: 20px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .cell {
            background: #f0f0f0;
            border: 2px solid #ddd;
            border-radius: 10px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 48px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .cell:hover:not(.taken) {
            background: #e0e0e0;
            transform: scale(1.05);
        }

        .cell.taken {
            cursor: not-allowed;
        }

        .cell.x {
            color: #e74c3c;
        }

        .cell.o {
            color: #3498db;
        }

        .cell.win {
            background: #ffd700;
            animation: pulse 0.5s ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .btn-restart {
            background: #3498db;
            color: white;
        }

        .btn-restart:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }

        .btn-mode {
            background: #e74c3c;
            color: white;
        }

        .btn-mode:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 10px;
        }

        .score-item {
            text-align: center;
        }

        .score-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }

        .score-value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        .score-x {
            color: #e74c3c;
        }

        .score-o {
            color: #3498db;
        }

        /* 广告组件 */
        .ad-banner-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 90px;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .sponsor-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            z-index: 1001;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
            transition: all 0.3s;
        }

        .sponsor-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.6);
        }

        .sponsor-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            z-index: 1002;
            display: none;
            max-width: 300px;
            width: 90%;
        }

        .sponsor-panel.show {
            display: block;
        }

        .sponsor-close {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ddd;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
        }

        @media (max-width: 375px) {
            .game-container {
                padding: 20px;
            }

            .game-title {
                font-size: 24px;
            }

            .cell {
                height: 80px;
                font-size: 36px;
            }
        }
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.interstitial-ad.show{display:flex;pointer-events:auto}
.interstitial-ad .ad-content{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;text-align:center;min-width:280px;max-width:400px}
.interstitial-ad .ad-content p{color:#aaa;font:14px "Microsoft YaHei",sans-serif;margin-bottom:12px}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
    </style>
</head>
<body>
    <!-- 赞助按钮 -->
    <button class="sponsor-btn" onclick="toggleSponsor()">☕</button>

    <!-- 赞助弹窗 -->
    <div class="sponsor-panel" id="sponsorPanel">
        <button class="sponsor-close" onclick="toggleSponsor()">×</button>
        <h3 style="text-align: center; margin-bottom: 20px;">支持开发者</h3>
        <p style="text-align: center; color: #666; margin-bottom: 15px;">扫码赞赏</p>
        <div style="display: flex; justify-content: space-around;">
            <div style="text-align: center;">
                <div style="width: 150px; height: 150px; background: #f0f0f0; margin-bottom: 10px; border-radius: 10px;"></div>
                <small>微信赞赏</small>
            </div>
        </div>
    </div>

    <div class="game-container">
        <h1 class="game-title">井字棋</h1>
        <div class="game-info" id="gameInfo">玩家 X 的回合</div>

        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <div class="buttons">
            <button class="btn btn-restart" onclick="restartGame()">重新开始</button>
            <button class="btn btn-mode" onclick="toggleMode()">切换模式</button>
        </div>

        <div class="score-board">
            <div class="score-item">
                <div class="score-label">玩家 X</div>
                <div class="score-value score-x" id="scoreX">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">平局</div>
                <div class="score-value" id="scoreDraw">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">玩家 O</div>
                <div class="score-value score-o" id="scoreO">0</div>
            </div>
        </div>
    </div>

    <!-- 底部广告 -->
    <div class="ad-banner-container">
        <div style="color: white; font-size: 14px;">广告位招租</div>
    </div>

    <!-- 插屏广告 -->
    <div class="interstitial-ad" id="interstitialAd">
    <div class="ad-content">
    <p>📢 赞助商广告</p>
    <div style="color:#888;font:12px 'Microsoft YaHei',sans-serif;margin-bottom:12px">感谢支持，广告将在5秒后关闭</div>
    <button class="skip-btn" id="skipAd">跳过广告 ▶</button>
    </div>
    </div>

    <script>
        let board = ['', '', '', '', '', '', '', '', ''];
        let currentPlayer = 'X';
        let gameActive = true;
        let vsAI = false;
        let scores = { X: 0, O: 0, draw: 0 };

        const winPatterns = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // 横
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // 竖
            [0, 4, 8], [2, 4, 6]             // 斜
        ];

        const cells = document.querySelectorAll('.cell');

        cells.forEach(cell => {
            cell.addEventListener('click', handleCellClick);
        });

        function handleCellClick(e) {
            const index = e.target.dataset.index;

            if (board[index] !== '' || !gameActive) return;

            makeMove(index, currentPlayer);

            if (gameActive && vsAI && currentPlayer === 'O') {
                setTimeout(aiMove, 500);
            }
        }

        function makeMove(index, player) {
            board[index] = player;
            const cell = cells[index];
            cell.textContent = player;
            cell.classList.add('taken', player.toLowerCase());

            if (checkWin(player)) {
                gameActive = false;
                highlightWin(player);
                updateScore(player);
                document.getElementById('gameInfo').textContent = `玩家 ${player} 获胜！`;
                showInterstitialAd();
            } else if (board.every(cell => cell !== '')) {
                gameActive = false;
                updateScore('draw');
                document.getElementById('gameInfo').textContent = '平局！';
                showInterstitialAd();
            } else {
                currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                document.getElementById('gameInfo').textContent = vsAI && currentPlayer === 'O'
                    ? 'AI思考中...'
                    : `玩家 ${currentPlayer} 的回合`;
            }
        }

        function checkWin(player) {
            return winPatterns.some(pattern => {
                return pattern.every(index => board[index] === player);
            });
        }

        function highlightWin(player) {
            winPatterns.forEach(pattern => {
                if (pattern.every(index => board[index] === player)) {
                    pattern.forEach(index => {
                        cells[index].classList.add('win');
                    });
                }
            });
        }

        function aiMove() {
            // 简单AI：优先赢，其次阻止对手赢，否则随机
            let move = findWinningMove('O') || findWinningMove('X') || findRandomMove();
            if (move !== null) {
                makeMove(move, 'O');
            }
        }

        function findWinningMove(player) {
            for (let i = 0; i < 9; i++) {
                if (board[i] === '') {
                    board[i] = player;
                    if (checkWin(player)) {
                        board[i] = '';
                        return i;
                    }
                    board[i] = '';
                }
            }
            return null;
        }

        function findRandomMove() {
            const empty = board.map((cell, index) => cell === '' ? index : null).filter(i => i !== null);
            return empty.length > 0 ? empty[Math.floor(Math.random() * empty.length)] : null;
        }

        function updateScore(winner) {
            if (winner === 'draw') {
                scores.draw++;
                document.getElementById('scoreDraw').textContent = scores.draw;
            } else {
                scores[winner]++;
                document.getElementById(`score${winner}`).textContent = scores[winner];
            }
        }

        function restartGame() {
            board = ['', '', '', '', '', '', '', '', ''];
            currentPlayer = 'X';
            gameActive = true;

            cells.forEach(cell => {
                cell.textContent = '';
                cell.classList.remove('taken', 'x', 'o', 'win');
            });

            document.getElementById('gameInfo').textContent = '玩家 X 的回合';
        }

        function toggleMode() {
            vsAI = !vsAI;
            restartGame();
            document.getElementById('gameInfo').textContent = vsAI
                ? '模式：对战AI'
                : '模式：双人对战';
        }

        function toggleSponsor() {
            const panel = document.getElementById('sponsorPanel');
            panel.classList.toggle('show');
        }

        function showInterstitialAd() {
            const ad = document.getElementById('interstitialAd');
            ad.classList.add('show');
            setTimeout(() => {
                ad.classList.remove('show');
            }, 5000);
        }

        document.getElementById('skipAd').addEventListener('click', function() {
            document.getElementById('interstitialAd').classList.remove('show');
        });
    </script>
</body>
</html>
