    <style>
        * {

        body {
            font-family: 'Microsoft YaHei', sans-serif;

            font-size: 32px;

        }

            font-size: 18px;
            color: #666;
            margin-bottom: 20px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .cell {
            background: #f0f0f0;
            border: 2px solid #ddd;
            border-radius: 10px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 48px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .cell:hover:not(.taken) {
            background: #e0e0e0;
            transform: scale(1.05);
        }

        .cell.taken {
            cursor: not-allowed;
        }

        .cell.x {
            color: #e74c3c;
        }

        .cell.o {
            color: #3498db;
        }

        .cell.win {
            background: #ffd700;
            animation: pulse 0.5s ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }

        .buttons {
            display: flex;
            gap: 10px;
            justify-content: center;

        .btn {

            border: none;
            border-radius: 8px;

        .btn-mode {

            color: white;
        }

        .btn-mode:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }

            margin-top: 20px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 10px;
        }

        .score-item {
            text-align: center;
        }

        .score-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }

        .score-value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

            color: #e74c3c;
        }

        let board = ['', '', '', '', '', '', '', '', ''];
        let currentPlayer = 'X';
        let gameActive = true;
        let vsAI = false;
        let scores = { X: 0, O: 0, draw: 0 };

        const winPatterns = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // 横
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // 竖
            [0, 4, 8], [2, 4, 6]             // 斜
        ];

        const cells = document.querySelectorAll('.cell');

        cells.forEach(cell => {
            cell.addEventListener('click', handleCellClick);
        });

        function handleCellClick(e) {
            const index = e.target.dataset.index;

            if (board[index] !== '' || !gameActive) return;

            makeMove(index, currentPlayer);

            if (gameActive && vsAI && currentPlayer === 'O') {
                setTimeout(aiMove, 500);
            }
        }

        function makeMove(index, player) {
            board[index] = player;
            const cell = cells[index];
            cell.textContent = player;
            cell.classList.add('taken', player.toLowerCase());

            if (checkWin(player)) {
                gameActive = false;
                highlightWin(player);
                updateScore(player);
                document.getElementById('gameInfo').textContent = `玩家 ${player} 获胜！`;
                showInterstitialAd();
            } else if (board.every(cell => cell !== '')) {
                gameActive = false;
                updateScore('draw');
                document.getElementById('gameInfo').textContent = '平局！';
                showInterstitialAd();
            } else {
                currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                document.getElementById('gameInfo').textContent = vsAI && currentPlayer === 'O'
                    ? 'AI思考中...'
                    : `玩家 ${currentPlayer} 的回合`;
            }
        }

        function checkWin(player) {
            return winPatterns.some(pattern => {
                return pattern.every(index => board[index] === player);
            });
        }

        function highlightWin(player) {
            winPatterns.forEach(pattern => {
                if (pattern.every(index => board[index] === player)) {
                    pattern.forEach(index => {
                        cells[index].classList.add('win');
                    });
                }
            });
        }

        function aiMove() {
            // 简单AI：优先赢，其次阻止对手赢，否则随机
            let move = findWinningMove('O') || findWinningMove('X') || findRandomMove();
            if (move !== null) {
                makeMove(move, 'O');
            }
        }

        function findWinningMove(player) {
            for (let i = 0; i < 9; i++) {
                if (board[i] === '') {
                    board[i] = player;
                    if (checkWin(player)) {
                        board[i] = '';
                        return i;
                    }
                    board[i] = '';
                }
            }
            return null;
        }

        function findRandomMove() {
            const empty = board.map((cell, index) => cell === '' ? index : null).filter(i => i !== null);
            return empty.length > 0 ? empty[Math.floor(Math.random() * empty.length)] : null;
        }

        function updateScore(winner) {
            if (winner === 'draw') {
                scores.draw++;
                document.getElementById('scoreDraw').textContent = scores.draw;
            } else {
                scores[winner]++;
                document.getElementById(`score${winner}`).textContent = scores[winner];
            }
        }

        function restartGame() {
            board = ['', '', '', '', '', '', '', '', ''];
            currentPlayer = 'X';
            gameActive = true;

            cells.forEach(cell => {
                cell.textContent = '';
                cell.classList.remove('taken', 'x', 'o', 'win');
            });

            document.getElementById('gameInfo').textContent = '玩家 X 的回合';
        }

        function toggleMode() {
            vsAI = !vsAI;
            restartGame();
            document.getElementById('gameInfo').textContent = vsAI

                : '模式：双人对战';
        }

                ad.classList.remove('show');
            }, 5000);
        }

            document.getElementById('interstitialAd').classList.remove('show');
        });

        }

        }
        
        // 加载界面
        window.addEventListener('load', function() {
            const loading = document.createElement('div');
            loading.innerHTML = '<div style="width:50px;height:50px;border:4px solid #f5576c;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;"></div><div style="margin-top:20px;">加载中...</div>';
            document.head.insertAdjacentHTML('beforeend', '<style>@keyframes spin {to{transform:rotate(360deg)}} @keyframes pulse { to { transform:scale(2); opacity:0; } }

/* [/AD-FIX:responsive] */
</style>');
            document.body.appendChild(loading);
            setTimeout(() => { loading.style.display = 'none'; }, 500);
        });
        
        // 动画帧更新
        function gameLoop() {
            requestAnimationFrame(gameLoop);
        }
        gameLoop();
        
        // 游戏结束处理
        function gameOver() {
            console.log("游戏结束");
        }

            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.start();

        }
        
        // 视觉特效
        function showEffect(x, y) {
            const el = document.createElement("div");
            el.style.cssText = `position:absolute;left:${x}px;top:${y}px;width:20px;height:20px;background:#f5576c;border-radius:50%;animation:pulse 0.5s ease-out forwards;pointer-events:none;z-index:100;`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 500);
        }
        
        // 最高分系统
        let highScore = Storage.load("high_score", 0);
        function updateHighScore(newScore) {
            if(newScore > highScore) {
                highScore = newScore;
                Storage.save("high_score", highScore);

<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>

<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
</body>
</html>
