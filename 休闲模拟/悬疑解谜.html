<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>悬疑解谜</title>
    <script src="game_core.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 12px;
        }
        .stat {
            text-align: center;
            color: white;
        }
        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }
        .stat-value {
            font-size: 20px;
            font-weight: bold;
        }
        .mystery-area {
            padding: 20px;
            background: #dfe6e9;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .mystery-title {
            font-size: 18px;
            color: #2d3436;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .mystery-text {
            font-size: 14px;
            color: #636e72;
            line-height: 1.6;
        }
        .hints-area {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            padding: 10px;
            background: #ffeaa7;
            border-radius: 10px;
        }
        .hint-btn {
            padding: 10px 15px;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .hint-btn:hover {
            background: #1a1a2e;
            color: white;
        }
        .hint-btn.used {
            background: #00b894;
            color: white;
        }
        .answer-area {
            padding: 15px;
            background: #dfe6e9;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .answer-title {
            font-size: 14px;
            color: #2d3436;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .answer-input {
            display: flex;
            gap: 10px;
        }
        .answer-text {
            flex: 1;
            padding: 10px;
            border: 2px solid #1a1a2e;
            border-radius: 8px;
            font-size: 14px;
        }
        .answer-btn {
            padding: 10px 20px;
            background: #1a1a2e;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }
        .progress-area {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }
        .progress-step {
            width: 30px;
            height: 30px;
            background: #dfe6e9;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        .progress-step.done {
            background: #00b894;
            color: white;
        }
        .progress-step.current {
            background: #1a1a2e;
            color: white;
        }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 20px 40px;
            border-radius: 15px;
            font-size: 18px;
            display: none;
            z-index: 100;
            text-align: center;
        }
        .message.show { display: block; }
        .ad-banner {
            width: 100%;
            height: 60px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">谜题</div>
                <div class="stat-value" id="puzzleNum">1</div>
            </div>
            <div class="stat">
                <div class="stat-label">提示</div>
                <div class="stat-value" id="hintsLeft">3</div>
            </div>
            <div class="stat">
                <div class="stat-label">解谜</div>
                <div class="stat-value" id="solved">0</div>
            </div>
        </div>

        <div class="progress-area" id="progressArea"></div>

        <div class="mystery-area">
            <div class="mystery-title" id="mysteryTitle">谜题标题</div>
            <div class="mystery-text" id="mysteryText">谜题内容</div>
        </div>

        <div class="hints-area" id="hintsArea"></div>

        <div class="answer-area">
            <div class="answer-title">输入答案：</div>
            <div class="answer-input">
                <input type="text" class="answer-text" id="answerInput" placeholder="你的答案">
                <div class="answer-btn" id="btnSubmit">提交</div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" id="btnReset">🔄 新谜题</button>
        </div>

        <div class="message" id="message"></div>

        <div class="ad-banner">📺 游戏广告位 - 点击查看更多精彩游戏</div>
    </div>

    <script>
        const PUZZLES = [
            {
                title: '神秘数字',
                text: '有一个数字，加上10等于20，减去5等于5。这个数字是多少？',
                hints: ['这是一个简单的数学题', '答案是15', '15+10=20, 15-5=10'],
                answer: '15'
            },
            {
                title: '颜色谜题',
                text: '红+蓝=紫，黄+蓝=绿，红+黄=？',
                hints: ['想想画画时的颜色混合', '红加黄是橙色', '答案是橙'],
                answer: '橙'
            },
            {
                title: '时间谜题',
                text: '时针指向3，分针指向12。现在是几点？',
                hints: ['看时钟的读数', '时针在3的位置', '答案是3点'],
                answer: '3点'
            },
            {
                title: '文字谜题',
                text: '什么字，左边是女，右边是子？',
                hints: ['这是一个汉字谜', '女+子=好', '答案是好'],
                answer: '好'
            },
            {
                title: '逻辑谜题',
                text: '如果A>B，B>C，那么A和C的关系是？',
                hints: ['这是逻辑推理', 'A比B大，B比C大', '答案是A>C'],
                answer: 'A>C'
            }
        ];

        let currentPuzzle = null;
        let puzzleNum = 1;
        let hintsLeft = 3;
        let solved = 0;
        let usedHints = [];
        let gameOver = false;

        function initGame() {
            puzzleNum = 1;
            hintsLeft = 3;
            solved = 0;
            usedHints = [];
            gameOver = false;

            loadPuzzle();
        }

        function loadPuzzle() {
            currentPuzzle = PUZZLES[puzzleNum - 1];
            usedHints = [];

            renderPuzzle();
            renderHints();
            renderProgress();
            updateUI();
        }

        function renderPuzzle() {
            document.getElementById('mysteryTitle').textContent = currentPuzzle.title;
            document.getElementById('mysteryText').textContent = currentPuzzle.text;
        }

        function renderHints() {
            const el = document.getElementById('hintsArea');
            el.innerHTML = '';

            currentPuzzle.hints.forEach((hint, i) => {
                const btn = document.createElement('div');
                btn.className = 'hint-btn' + (usedHints.includes(i) ? ' used' : '');
                btn.textContent = '提示 ' + (i + 1);
                btn.addEventListener('click', () => useHint(i));
                el.appendChild(btn);
            });
        }

        function renderProgress() {
            const el = document.getElementById('progressArea');
            el.innerHTML = '';

            PUZZLES.forEach((p, i) => {
                const step = document.createElement('div');
                step.className = 'progress-step';
                if (i < solved) step.classList.add('done');
                else if (i === puzzleNum - 1) step.classList.add('current');
                step.textContent = i + 1;
                el.appendChild(step);
            });
        }

        function useHint(index) {
            if (usedHints.includes(index)) {
                showMessage('已使用此提示');
                return;
            }

            if (hintsLeft <= 0) {
                showMessage('提示次数已用完');
                return;
            }

            usedHints.push(index);
            hintsLeft--;

            showMessage('提示：' + currentPuzzle.hints[index]);

            renderHints();
            updateUI();
        }

        function submitAnswer() {
            const input = document.getElementById('answerInput').value;

            if (input === currentPuzzle.answer) {
                solved++;
                showMessage('🎉 解谜成功！');

                puzzleNum++;
                if (puzzleNum > PUZZLES.length) {
                    gameOver = true;
                    showMessage('所有谜题已解！\n解谜数: ' + solved);
                    GameCore.highScore.set('mystery_game', solved);
                } else {
                    setTimeout(loadPuzzle, 1500);
                }

                renderProgress();
                updateUI();
            } else {
                showMessage('答案错误！请再想想');
            }
        }

        function updateUI() {
            document.getElementById('puzzleNum').textContent = puzzleNum;
            document.getElementById('hintsLeft').textContent = hintsLeft;
            document.getElementById('solved').textContent = solved;
        }

        function showMessage(msg) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 1500);
        }

        document.getElementById('btnSubmit').addEventListener('click', submitAnswer);
        document.getElementById('btnReset').addEventListener('click', initGame);

        // 初始化
        GameCore.init({ highScore: 'mystery_game' });
        initGame();
    </script>
</body>
</html>
