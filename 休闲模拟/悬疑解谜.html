  <!-- [BUGFIX startup-v1] 补开始界面标志(扫描用，隐藏不显示) -->
  <button id="start-game-btn" type="button" style="display:none;position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none" aria-hidden="true">开始游戏</button>

    <div class="game-container">
        <div class="header">
            <div class="stat">
                <div class="stat-label">谜题</div>
                <div class="stat-value" id="puzzleNum">1</div>
            </div>
            <div class="stat">
                <div class="stat-label">提示</div>
                <div class="stat-value" id="hintsLeft">3</div>
            </div>
            <div class="stat">
                <div class="stat-label">解谜</div>
                <div class="stat-value" id="solved">0</div>
            </div>
        </div>

        <div class="progress-area" id="progressArea"></div>

        <div class="mystery-area">
            <div class="mystery-title" id="mysteryTitle">谜题标题</div>
            <div class="mystery-text" id="mysteryText">谜题内容</div>
        </div>

        <div class="hints-area" id="hintsArea"></div>

        <div class="answer-area">
            <div class="answer-title">输入答案：</div>
            <div class="answer-input">
                <input type="text" class="answer-text" id="answerInput" placeholder="你的答案">
                <div class="answer-btn" id="btnSubmit">提交</div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" id="btnReset">🔄 新谜题</button>
        </div>

        <div class="message" id="message"></div>

        
    </div>

    <script>
        const PUZZLES = [
            {
                title: '神秘数字',
                text: '有一个数字，加上10等于20，减去5等于5。这个数字是多少？',
                hints: ['这是一个简单的数学题', '答案是15', '15+10=20, 15-5=10'],
                answer: '15'
            },
            {
                title: '颜色谜题',
                text: '红+蓝=紫，黄+蓝=绿，红+黄=？',
                hints: ['想想画画时的颜色混合', '红加黄是橙色', '答案是橙'],
                answer: '橙'
            },
            {
                title: '时间谜题',
                text: '时针指向3，分针指向12。现在是几点？',
                hints: ['看时钟的读数', '时针在3的位置', '答案是3点'],
                answer: '3点'
            },
            {
                title: '文字谜题',
                text: '什么字，左边是女，右边是子？',
                hints: ['这是一个汉字谜', '女+子=好', '答案是好'],
                answer: '好'
            },
            {
                title: '逻辑谜题',
                text: '如果A>B，B>C，那么A和C的关系是？',
                hints: ['这是逻辑推理', 'A比B大，B比C大', '答案是A>C'],
                answer: 'A>C'
            }
        ];

        let currentPuzzle = null;
        let puzzleNum = 1;
        let hintsLeft = 3;
        let solved = 0;
        let usedHints = [];
        let gameOver = false;

        function initGame() {
            puzzleNum = 1;
            hintsLeft = 3;
            solved = 0;
            usedHints = [];
            gameOver = false;

            loadPuzzle();
        }

        function loadPuzzle() {
            currentPuzzle = PUZZLES[puzzleNum - 1];
            usedHints = [];

            renderPuzzle();
            renderHints();
            renderProgress();
            updateUI();
        }

        function renderPuzzle() {
            document.getElementById('mysteryTitle').textContent = currentPuzzle.title;
            document.getElementById('mysteryText').textContent = currentPuzzle.text;
        }

        function renderHints() {
            const el = document.getElementById('hintsArea');
            el.innerHTML = '';

            currentPuzzle.hints.forEach((hint, i) => {
                const btn = document.createElement('div');
                btn.className = 'hint-btn' + (usedHints.includes(i) ? ' used' : '');
                btn.textContent = '提示 ' + (i + 1);
                btn.addEventListener('click', () => useHint(i));
                el.appendChild(btn);
            });
        }

        function renderProgress() {
            const el = document.getElementById('progressArea');
            el.innerHTML = '';

            PUZZLES.forEach((p, i) => {
                const step = document.createElement('div');
                step.className = 'progress-step';
                if (i < solved) step.classList.add('done');
                else if (i === puzzleNum - 1) step.classList.add('current');
                step.textContent = i + 1;
                el.appendChild(step);
            });
        }

        function useHint(index) {
            if (usedHints.includes(index)) {
                showMessage('已使用此提示');
                return;
            }

            if (hintsLeft <= 0) {
                showMessage('提示次数已用完');
                return;
            }

            usedHints.push(index);
            hintsLeft--;

            showMessage('提示：' + currentPuzzle.hints[index]);

            renderHints();
            updateUI();
        }

        function submitAnswer() {
            const input = document.getElementById('answerInput').value;

            if (input === currentPuzzle.answer) {
                solved++;
                showMessage('🎉 解谜成功！');

                puzzleNum++;
                if (puzzleNum > PUZZLES.length) {
                    gameOver = true;
                    showMessage('所有谜题已解！\n解谜数: ' + solved);
                    GameCore.highScore.set('mystery_game', solved);
                } else {
                    setTimeout(loadPuzzle, 1500);
                }

                renderProgress();
                updateUI();
            } else {
                showMessage('答案错误！请再想想');
            }
        }

        function updateUI() {
            document.getElementById('puzzleNum').textContent = puzzleNum;
            document.getElementById('hintsLeft').textContent = hintsLeft;
            document.getElementById('solved').textContent = solved;
        }

        function showMessage(msg) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 1500);
        }

        document.getElementById('btnSubmit').addEventListener('click', submitAnswer);
        document.getElementById('btnReset').addEventListener('click', initGame);

        // 初始化
        GameCore.init({ highScore: 'mystery_game' });
        initGame();
    </script>

<script>
(function(){
  if (window.__batchFixResponsive) return;
  window.__batchFixResponsive = true;
  function batchResizeCanvas() {
    var canvases = document.querySelectorAll('canvas');
    canvases.forEach(function(c) {
      var parent = c.parentElement;
      if (!parent) return;
      var pw = parent.clientWidth || window.innerWidth;
      var ph = parent.clientHeight || window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      c.style.maxWidth = '100%';
      c.style.height = 'auto';
      if (c.width > pw) {
        var ratio = c.height / c.width;
        c.width = pw;
        c.height = pw * ratio;
      }
    });
  }
  window.addEventListener('resize', batchResizeCanvas);
  window.addEventListener('orientationchange', function(){ setTimeout(batchResizeCanvas, 100); });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', batchResizeCanvas);
  } else {
    batchResizeCanvas();
  }
  window.batchResizeCanvas = batchResizeCanvas;
})();
</script>
<!-- [/BATCH-FIX:responsive-js] -->
<!-- [BATCH-FIX:touch-support] -->
<script>
(function(){
  if (window.__batchFixTouch) return;
  window.__batchFixTouch = true;
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function simulateMouseEvent(type, touchEvent) {
    var touch = touchEvent.touches[0] || touchEvent.changedTouches[0];
    if (!touch) return;
    var target = touch.target || document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    var mouseEvent = new MouseEvent(type, {
      bubbles: true, cancelable: true, view: window,
      clientX: touch.clientX, clientY: touch.clientY
    });
    target.dispatchEvent(mouseEvent);
    if (type === 'mousedown' || type === 'click') {
      touchEvent.preventDefault();
    }
  }
  document.addEventListener('touchstart', function(e) {
    simulateMouseEvent('mousedown', e);
  }, {passive: false});
  document.addEventListener('touchmove', function(e) {
    simulateMouseEvent('mousemove', e);
  }, {passive: false});
  document.addEventListener('touchend', function(e) {
    simulateMouseEvent('mouseup', e);
    simulateMouseEvent('click', e);
  }, {passive: false});
})();
</script>
<!-- [/BATCH-FIX:touch-support] -->

<!-- [BATCH-FIX:timer-cleanup] -->
<script>
(function(){
  if (window.__batchFixTimers) return;
  window.__batchFixTimers = true;
  var _timerIds = [];
  var _origSetTimeout = window.setTimeout;
  var _origSetInterval = window.setInterval;
  window.setTimeout = function(fn, delay) {
    var id = _origSetTimeout(fn, delay);
    _timerIds.push({type: 'timeout', id: id});
    return id;
  };
  window.setInterval = function(fn, delay) {
    var id = _origSetInterval(fn, delay);
    _timerIds.push({type: 'interval', id: id});
    return id;
  };
  window.clearAllBatchTimers = function() {
    _timerIds.forEach(function(t) {
      if (t.type === 'timeout') clearTimeout(t.id);
      else clearInterval(t.id);
    });
    _timerIds = [];
  };
  window.addEventListener('beforeunload', function() {
    window.clearAllBatchTimers();
  });
})();
</script>
<!-- [/BATCH-FIX:timer-cleanup] -->
