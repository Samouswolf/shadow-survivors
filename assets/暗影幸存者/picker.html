<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>迷雾之塔 · 素材选取器</title>
<style>
body{background:#1a1a2e;color:#ddd;font:14px Microsoft YaHei;margin:0;padding:20px;display:flex;gap:20px}
h2{color:#c49bff;font-size:16px;margin:0 0 10px}
#sheetWrap{flex:1}
#sheetWrap canvas{image-rendering:pixelated;border:1px solid #444;cursor:crosshair}
#info{width:280px;background:#12122a;border:1px solid #333;border-radius:8px;padding:15px}
#info .title{color:#c49bff;font-size:15px;margin-bottom:8px}
#info .preview{width:64px;height:64px;image-rendering:pixelated;border:1px solid #555;margin:5px 0}
#info .coord{color:#ffd700;font:bold 16px monospace}
#info .file{color:#888;font:12px monospace}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
td,th{border:1px solid #333;padding:3px 6px;text-align:left}
th{color:#c49bff;background:#0a0a18}
td{cursor:pointer}
td:hover{background:#2a2a4a}
td.done{color:#4caf50}
td.pending{color:#ff9800}
</style>
</head>
<body>
<div id="sheetWrap">
<h2>迷雾之塔 · 点击选图（暗影幸存者 spritesheet）</h2>
<canvas id="c"></canvas>
</div>
<div id="info">
<div class="title">📍 当前选中</div>
<div id="selInfo" style="color:#888">点击上方图标</div>
<div class="title" style="margin-top:14px">📋 映射表</div>
<table id="map"></table>
</div>
<script>
const img = new Image();
img.src = 'spritesheet.png';
const TILE = 16, COLS = 20, ROWS = 11;
const SCALE = 3;

const elements = [
  {id:'floor', label:'地板', type:'map', done:false, note:'3种'},
  {id:'wall', label:'墙壁', type:'map', done:false},
  {id:'redDoor', label:'红门', type:'map', done:false},
  {id:'blueDoor', label:'蓝门', type:'map', done:false},
  {id:'yellowDoor', label:'黄门', type:'map', done:false},
  {id:'upStair', label:'上楼梯', type:'map', done:false},
  {id:'downStair', label:'下楼梯', type:'map', done:false},
  {id:'trap', label:'陷阱', type:'map', done:false},
  {id:'shop', label:'商店', type:'map', done:false},
  {id:'chest', label:'宝箱', type:'map', done:false},
  {id:'player', label:'玩家', type:'item', done:false},
  {id:'hpSmall', label:'小血瓶', type:'item', done:false},
  {id:'hpBig', label:'大血瓶', type:'item', done:false},
  {id:'atkGem', label:'攻击宝石', type:'item', done:false},
  {id:'defGem', label:'防御宝石', type:'item', done:false},
  {id:'gold', label:'金币', type:'item', done:false},
  {id:'key', label:'钥匙', type:'item', done:false},
  {id:'slime', label:'史莱姆', type:'monster', done:false},
  {id:'bat', label:'蝙蝠', type:'monster', done:false},
  {id:'skeleton', label:'骷髅兵', type:'monster', done:false},
  {id:'mushroom', label:'毒蘑菇', type:'monster', done:false},
  {id:'ghost', label:'幽灵', type:'monster', done:false},
  {id:'gargoyle', label:'石像鬼', type:'monster', done:false},
  {id:'assassin', label:'暗影刺客', type:'monster', done:false},
  {id:'priest', label:'巫毒祭司', type:'monster', done:false},
  {id:'deathKnight', label:'死亡骑士', type:'monster', done:false},
  {id:'golem', label:'深渊魔像', type:'monster', done:false},
  {id:'dragon', label:'混沌之龙', type:'monster', done:false},
  {id:'lord', label:'暗影领主', type:'monster', done:false},
];

const sel = {col:-1, row:-1};

function renderTable() {
  const tbl = document.getElementById('map');
  let h = '<tr><th>元素</th><th>坐标</th></tr>';
  elements.forEach(e => {
    h += '<tr class="'+(e.done?'done':'pending')+'" onclick="scrollToEl(\''+e.id+'\')">';
    h += '<td>'+(e.done?'✓ ':'')+e.label+'</td>';
    h += '<td>'+(e.coord ? e.coord : '—')+'</td>';
    h += '</tr>';
  });
  tbl.innerHTML = h;
}

function scrollToEl(id) {
  // Highlight in some way - just log
  console.log('Selected element:', id);
}

img.onload = () => {
  const c = document.getElementById('c');
  c.width = COLS * TILE * SCALE;
  c.height = ROWS * TILE * SCALE;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  function draw() {
    ctx.drawImage(img, 0, 0, c.width, c.height);
    ctx.strokeStyle = 'rgba(255,0,0,0.3)';
    ctx.lineWidth = 1;
    for (let r = 0; r < ROWS; r++) {
      for (let col = 0; col < COLS; col++) {
        ctx.strokeRect(col*TILE*SCALE, r*TILE*SCALE, TILE*SCALE, TILE*SCALE);
      }
    }
    if (sel.col >= 0) {
      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 2;
      ctx.strokeRect(sel.col*TILE*SCALE-1, sel.row*TILE*SCALE-1, TILE*SCALE+2, TILE*SCALE+2);
    }
  }

  c.onclick = (ev) => {
    const rect = c.getBoundingClientRect();
    const x = (ev.clientX - rect.left) / SCALE;
    const y = (ev.clientY - rect.top) / SCALE;
    sel.col = Math.floor(x / TILE);
    sel.row = Math.floor(y / TILE);
    if (sel.col >= COLS) sel.col = COLS-1;
    if (sel.row >= ROWS) sel.row = ROWS-1;

    draw();

    // Show info
    const si = document.getElementById('selInfo');
    const idx = sel.row * COLS + sel.col + 1;
    si.innerHTML = '<div class="coord">['+sel.col+', '+sel.row+']</div>'
      + '<div class="file">coord_'+String(sel.col).padStart(2,'0')+'_'+String(sel.row).padStart(2,'0')+'.png</div>'
      + '<div class="file">icon_'+String(idx).padStart(2,'0')+'.png</div>'
      + '<canvas class="preview" id="preview"></canvas>';
    const pv = document.getElementById('preview');
    if (pv) {
      const pctx = pv.getContext('2d');
      pctx.imageSmoothingEnabled = false;
      pctx.drawImage(img, sel.col*TILE*SCALE, sel.row*TILE*SCALE, TILE*SCALE, TILE*SCALE, 0, 0, 64, 64);
    }

    // Auto-fill next pending element with current coord
    const pending = elements.find(e => !e.done);
    if (pending) {
      pending.coord = '['+sel.col+', '+sel.row+']';
      pending.done = true;
      renderTable();
    }
  };

  draw();
  renderTable();
};
</script>
</body>
</html>
