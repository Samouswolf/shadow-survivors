<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">

<title>游戏工坊 - Game Studio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a12;
  --card:rgba(255,255,255,.04);
  --card-hover:rgba(200,150,255,.08);
  --border:rgba(255,255,255,.08);
  --border-hover:rgba(200,150,255,.3);
  --text:#fff;
  --text-dim:#888;
  --accent:#c49bff;
  --accent2:#ff6b35;
  --gold:#ffd700;
}
html,body{
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  overflow:hidden;
}
.app{
  display:flex;
  flex-direction:column;
  height:100vh;
  max-width:100vw;
}
.header{
  padding:12px 16px;
  background:rgba(10,10,18,.95);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:100;
}
.header-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}
.logo{
  display:flex;
  align-items:center;
  gap:8px;
}
.logo-icon{font-size:28px}
.logo-text{
  font-size:18px;
  font-weight:900;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.header-actions{
  display:flex;
  gap:8px;
}
.btn{
  padding:6px 12px;
  border-radius:20px;
  border:1px solid var(--border);
  background:transparent;
  color:var(--text-dim);
  font-size:12px;
  cursor:pointer;
  transition:.2s;
}
.btn:hover{
  border-color:var(--border-hover);
  color:var(--text);
  background:var(--card-hover);
}
.btn-primary{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none;
  color:#fff;
  font-weight:bold;
}
.btn-primary:hover{
  opacity:.9;
  transform:scale(1.02);
}
.search-box{position:relative}
.search-input{
  width:100%;
  padding:10px 16px 10px 36px;
  border-radius:24px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  font-size:14px;
  outline:none;
  transition:.2s;
}
.search-input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 2px rgba(196,155,255,.2);
}
.search-input::placeholder{color:var(--text-dim)}
.search-icon{
  position:absolute;
  left:12px;
  top:50%;
  transform:translateY(-50%);
  font-size:16px;
  opacity:.5;
}
.stats-bar{
  display:flex;
  gap:12px;
  padding:8px 16px;
  background:rgba(255,255,255,.02);
  border-bottom:1px solid var(--border);
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}
.stat-chip{
  display:flex;
  align-items:center;
  gap:4px;
  padding:4px 10px;
  border-radius:12px;
  background:var(--card);
  font-size:11px;
  white-space:nowrap;
}
.stat-chip .num{
  font-weight:bold;
  color:var(--gold);
}
.category-tabs{
  display:flex;
  gap:6px;
  padding:10px 16px;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.category-tabs::-webkit-scrollbar{display:none}
.tab{
  padding:6px 14px;
  border-radius:16px;
  border:1px solid var(--border);
  background:transparent;
  color:var(--text-dim);
  font-size:12px;
  cursor:pointer;
  white-space:nowrap;
  transition:.2s;
}
.tab:hover{
  border-color:var(--border-hover);
  color:var(--text);
}
.tab.active{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none;
  color:#fff;
  font-weight:bold;
}
.game-area{
  flex:1;
  overflow-y:auto;
  padding:12px 16px;
  -webkit-overflow-scrolling:touch;
}
.game-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(100px,1fr));
  gap:10px;
}
.game-card{
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:14px 8px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  cursor:pointer;
  transition:.2s;
  text-decoration:none;
  color:var(--text);
}
.game-card:hover{
  border-color:var(--border-hover);
  background:var(--card-hover);
  transform:translateY(-2px);
  box-shadow:0 6px 20px rgba(150,100,255,.15);
}
.game-card:active{transform:scale(.95)}
.game-icon{
  font-size:36px;
  margin-bottom:6px;
  line-height:1;
}
.game-name{
  font-size:11px;
  font-weight:600;
  text-align:center;
  line-height:1.3;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.game-tag{
  font-size:9px;
  color:var(--text-dim);
  margin-top:4px;
  padding:2px 6px;
  background:rgba(255,255,255,.05);
  border-radius:6px;
}
.bottom-bar{
  display:flex;
  justify-content:space-around;
  padding:8px 0;
  background:rgba(10,10,18,.98);
  border-top:1px solid var(--border);
  padding-bottom:max(8px,env(safe-area-inset-bottom));
}
.bottom-btn{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  padding:4px 12px;
  background:none;
  border:none;
  color:var(--text-dim);
  font-size:10px;
  cursor:pointer;
  transition:.2s;
}
.bottom-btn .icon{font-size:20px}
.bottom-btn.active{color:var(--accent)}
.empty-state{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:60px 20px;
  text-align:center;
}
.empty-state .icon{
  font-size:64px;
  margin-bottom:16px;
  opacity:.5;
}
.empty-state .text{
  color:var(--text-dim);
  font-size:14px;
}
.install-banner{
  display:none;
  padding:12px 16px;
  background:linear-gradient(135deg,rgba(196,155,255,.15),rgba(255,107,53,.15));
  border-bottom:1px solid var(--border);
  align-items:center;
  gap:12px;
}
.install-banner.show{display:flex}
.install-text{
  flex:1;
  font-size:13px;
}
.install-close{
  background:none;
  border:none;
  color:var(--text-dim);
  font-size:18px;
  cursor:pointer;
}
.preview-overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  z-index:1000;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.preview-overlay.show{display:flex}
.preview-box{
  width:100%;
  max-width:420px;
  background:var(--bg);
  border-radius:20px;
  border:1px solid var(--border);
  overflow:hidden;
}
.preview-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px;
  border-bottom:1px solid var(--border);
}
.preview-title{
  font-size:16px;
  font-weight:bold;
}
.preview-close{
  background:none;
  border:none;
  color:var(--text-dim);
  font-size:24px;
  cursor:pointer;
}
.preview-content{
  padding:20px;
  text-align:center;
}
.preview-icon{
  font-size:72px;
  margin-bottom:16px;
}
.preview-desc{
  color:var(--text-dim);
  font-size:13px;
  margin-bottom:20px;
  line-height:1.6;
  white-space:pre-line;
}
.preview-actions{
  display:flex;
  gap:10px;
  justify-content:center;
}
.preview-actions .btn{
  padding:10px 24px;
  font-size:14px;
}
@media(min-width:768px){
  .game-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
}
@media(min-width:1024px){
  .app{
    max-width:480px;
    margin:0 auto;
    border-left:1px solid var(--border);
    border-right:1px solid var(--border);
  }
}
</style>
<style>
.ad-banner-container{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);height:90px;max-height:90px;overflow:hidden;contain:layout style paint;pointer-events:none!important}.ad-banner-container,.ad-banner-container *{pointer-events:none!important}.ad-banner-container iframe{max-height:90px;pointer-events:none!important}
.ad-banner-container iframe{max-width:100%}
.ad-label{position:absolute;top:1px;right:6px;font:9px "Microsoft YaHei",sans-serif;color:rgba(255,255,255,.35)}

.sponsor-btn:hover{background:rgba(255,215,0,.25);transform:scale(1.05)}

.sponsor-panel .qr-row{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.sponsor-panel .qr-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px;text-align:center;min-width:140px}
.sponsor-panel .qr-card .qr-icon{font-size:48px;margin-bottom:6px}
.sponsor-panel .qr-card .qr-label{color:#ccc;font:13px "Microsoft YaHei",sans-serif}
.sponsor-panel .qr-card .qr-hint{color:#888;font:11px "Microsoft YaHei",sans-serif;margin-top:4px}
.sponsor-panel .sponsor-close{margin-top:8px;padding:8px 28px;border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#aaa;background:0 0;font:14px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.sponsor-panel .sponsor-close:hover{background:rgba(255,255,255,.08);color:#fff}
.interstitial-ad{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
.interstitial-ad .ad-content{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;text-align:center;min-width:280px;max-width:400px}
.interstitial-ad .ad-content p{color:#aaa;font:14px "Microsoft YaHei",sans-serif;margin-bottom:12px}
.interstitial-ad .skip-btn{padding:8px 28px;background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:20px;color:#ffd700;font:bold 15px "Microsoft YaHei",sans-serif;cursor:pointer;transition:.2s}
.interstitial-ad .skip-btn:hover{background:rgba(255,215,0,.25)}
</style>
</head>
<body>
<div class="app">
  <div class="install-banner" id="installBanner">
    <span class="icon">📲</span>
    <span class="install-text">安装游戏工坊到桌面，随时畅玩！</span>
    <button class="btn btn-primary" onclick="installApp()">安装</button>
    <button class="install-close" onclick="dismissInstall()">×</button>
  </div>

  <header class="header">
    <div class="header-top">
      <div class="logo">
        <span class="logo-icon">🎮</span>
        <span class="logo-text">游戏工坊</span>
      </div>
      <div class="header-actions">
        <button class="btn" onclick="showRandom()">🎲 随机</button>
        <button class="btn" onclick="showAbout()">关于</button>
      </div>
    </div>
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input class="search-input" id="searchInput" type="text" placeholder="搜索游戏..." oninput="filterGames()">
    </div>
  </header>

  <div class="stats-bar">
    <div class="stat-chip">🎮 <span class="num" id="totalCount">0</span> 款游戏</div>
    <div class="stat-chip">📂 <span class="num" id="catCount">0</span> 个分类</div>
    <div class="stat-chip">⭐ <span class="num">100%</span> 免费</div>
    <div class="stat-chip">📱 <span class="num">H5</span> 即点即玩</div>
  </div>

  <div class="category-tabs" id="categoryTabs"></div>

  <div class="game-area" id="gameArea">
    <div class="game-grid" id="gameGrid"></div>
  </div>

  <div class="bottom-bar">
    <button class="bottom-btn active" onclick="showAll()">
      <span class="icon">🏠</span>
      <span>全部</span>
    </button>
    <button class="bottom-btn" onclick="showRecent()">
      <span class="icon">⏱️</span>
      <span>最近</span>
    </button>
    <button class="bottom-btn" onclick="showFav()">
      <span class="icon">⭐</span>
      <span>收藏</span>
    </button>
    <button class="bottom-btn" onclick="showSettings()">
      <span class="icon">⚙️</span>
      <span>设置</span>
    </button>
  </div>
</div>

<div class="preview-overlay" id="previewOverlay" onclick="closePreview(event)">
  <div class="preview-box" onclick="event.stopPropagation()">
    <div class="preview-header">
      <span class="preview-title" id="previewTitle"></span>
      <button class="preview-close" onclick="closePreview()">×</button>
    </div>
    <div class="preview-content">
      <div class="preview-icon" id="previewIcon"></div>
      <div class="preview-desc" id="previewDesc"></div>
      <div class="preview-actions">
        <button class="btn" onclick="closePreview()">关闭</button>
        <button class="btn btn-primary" id="previewPlay" onclick="playGame()">▶ 开始游戏</button>
      </div>
    </div>
  </div>
</div>

let currentCategory = "all";
let currentGame = null;
let favorites = JSON.parse(localStorage.getItem("game-favorites") || "[]");
let recentGames = JSON.parse(localStorage.getItem("game-recent") || "[]");

function init() {
  renderCategories();
  renderGames();
  updateStats();
  checkInstall();
}

function renderCategories() {
  const container = document.getElementById("categoryTabs");
  container.innerHTML = CATEGORIES.map(cat =>
    `<button class="tab ${cat.id === currentCategory ? 'active' : ''}" onclick="setCategory('${cat.id}')">${cat.icon} ${cat.name}</button>`
  ).join("");
}

function renderGames() {
  const container = document.getElementById("gameGrid");
  const searchTerm = document.getElementById("searchInput").value.toLowerCase();
  let filtered = GAMES;

  if (currentCategory !== "all") {
    filtered = filtered.filter(g => g.cat === currentCategory);
  }
  if (searchTerm) {
    filtered = filtered.filter(g =>
      g.name.toLowerCase().includes(searchTerm) ||
      g.cat.toLowerCase().includes(searchTerm)
    );
  }

  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1">
        <div class="icon">🔍</div>
        <div class="text">没有找到匹配的游戏</div>
      </div>
    `;
    return;
  }

  container.innerHTML = filtered.map(game => `
    <div class="game-card" onclick="showPreview('${game.id}')">
      <div class="game-icon">${game.icon}</div>
      <div class="game-name">${game.name}</div>
      <div class="game-tag">${game.cat}</div>
    </div>
  `).join("");
}

function updateStats() {
  document.getElementById("totalCount").textContent = GAMES.length;
  const cats = new Set(GAMES.map(g => g.cat));
  document.getElementById("catCount").textContent = cats.size;
}

function setCategory(catId) {
  currentCategory = catId;
  renderCategories();
  renderGames();
}

function filterGames() {
  renderGames();
}

function showPreview(gameId) {
  currentGame = GAMES.find(g => g.id === gameId);
  if (!currentGame) return;
  document.getElementById("previewTitle").textContent = currentGame.name;
  document.getElementById("previewIcon").textContent = currentGame.icon;
  document.getElementById("previewDesc").textContent = `分类：${currentGame.cat}\n点击开始游戏，体验精彩内容！`;
  document.getElementById("previewOverlay").classList.add("show");
}

function closePreview(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById("previewOverlay").classList.remove("show");
  currentGame = null;
}

function playGame() {
  if (!currentGame) return;
  recentGames = recentGames.filter(g => g.id !== currentGame.id);
  recentGames.unshift({id: currentGame.id, time: Date.now()});
  recentGames = recentGames.slice(0, 20);
  localStorage.setItem("game-recent", JSON.stringify(recentGames));
  window.open(currentGame.file, "_blank");
  closePreview();
}

function showRandom() {
  const game = GAMES[Math.floor(Math.random() * GAMES.length)];
  showPreview(game.id);
}

function showAll() {
  currentCategory = "all";
  document.getElementById("searchInput").value = "";
  renderCategories();
  renderGames();
  updateBottomBar(0);
}

function showRecent() {
  currentCategory = "recent";
  const recentIds = recentGames.map(g => g.id);
  const filtered = GAMES.filter(g => recentIds.includes(g.id));
  document.getElementById("gameGrid").innerHTML = filtered.length ? filtered.map(game => `
    <div class="game-card" onclick="showPreview('${game.id}')">
      <div class="game-icon">${game.icon}</div>
      <div class="game-name">${game.name}</div>
      <div class="game-tag">${game.cat}</div>
    </div>
  `).join("") : `
    <div class="empty-state" style="grid-column:1/-1">
      <div class="icon">⏱️</div>
      <div class="text">还没有玩过的游戏</div>
    </div>
  `;
  updateBottomBar(1);
}

function showFav() {
  currentCategory = "favorites";
  const filtered = GAMES.filter(g => favorites.includes(g.id));
  document.getElementById("gameGrid").innerHTML = filtered.length ? filtered.map(game => `
    <div class="game-card" onclick="showPreview('${game.id}')">
      <div class="game-icon">${game.icon}</div>
      <div class="game-name">${game.name}</div>
      <div class="game-tag">${game.cat}</div>
    </div>
  `).join("") : `
    <div class="empty-state" style="grid-column:1/-1">
      <div class="icon">⭐</div>
      <div class="text">还没有收藏的游戏</div>
    </div>
  `;
  updateBottomBar(2);
}

function updateBottomBar(index) {
  document.querySelectorAll(".bottom-btn").forEach((btn, i) => {
    btn.classList.toggle("active", i === index);
  });
}

let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById("installBanner").classList.add("show");
});

function installApp() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then((choiceResult) => {
      if (choiceResult.outcome === "accepted") {
        console.log("用户安装了应用");
      }
      deferredPrompt = null;
      document.getElementById("installBanner").classList.remove("show");
    });
  }
}

function dismissInstall() {
  document.getElementById("installBanner").classList.remove("show");
}

function checkInstall() {
  if (window.matchMedia("(display-mode: standalone)").matches) {
    document.getElementById("installBanner").classList.remove("show");
  }
}

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").then(reg => {
    console.log("Service Worker 注册成功");
  }).catch(err => {
    console.log("Service Worker 注册失败:", err);
  });
}
