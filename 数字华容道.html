<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>数字华容道</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: 'Microsoft YaHei', sans-serif; }
canvas { display: block; }
#uiLayer { position: fixed; bottom: 0; left: 0; width: 100%; z-index: 100; }
#bannerAd { display: block; margin: 0 auto; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; text-align: center; padding: 8px 16px; font-size: 14px; border-top: 2px solid rgba(255,255,255,0.2); }
#bannerAd a { color: #fff; text-decoration: none; }
#sponsorBtn { position: fixed; top: 10px; right: 10px; z-index: 200; background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: #fff; border: none; padding: 8px 16px; border-radius: 20px; font-size: 13px; cursor: pointer; display: none; }
#sponsorModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 300; display: none; justify-content: center; align-items: center; }
#sponsorModal.active { display: flex; }
.modal-box { background: #fff; border-radius: 16px; padding: 30px; max-width: 360px; text-align: center; }
.modal-box h3 { margin-bottom: 15px; color: #333; }
.modal-box p { color: #666; margin-bottom: 20px; font-size: 14px; }
.modal-box .close-btn { background: #667eea; color: #fff; border: none; padding: 10px 30px; border-radius: 25px; font-size: 14px; cursor: pointer; }
.interstitialAd { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 400; display: none; justify-content: center; align-items: center; }
.interstitialAd.active { display: flex; }
.interstitial-box { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 16px; padding: 40px 30px; max-width: 320px; text-align: center; color: #fff; }
.interstitial-box h3 { margin-bottom: 15px; }
.interstitial-box p { margin-bottom: 20px; font-size: 14px; opacity: 0.9; }
.interstitial-box .skip-btn { background: rgba(255,255,255,0.2); color: #fff; border: 2px solid rgba(255,255,255,0.5); padding: 10px 30px; border-radius: 25px; font-size: 14px; cursor: pointer; }
</style>
</head>
<body>
<canvas id="gc"></canvas>

<div id="uiLayer">
    <div id="bannerAd">
        <a href="javascript:void(0)" onclick="showSponsor()">✨ 支持开发者 | 数字华容道 - 经典益智游戏 ✨</a>
    </div>
</div>

<button id="sponsorBtn" onclick="showSponsor()">💖 赞助</button>

<div id="sponsorModal">
    <div class="modal-box">
        <h3>💖 支持开发者</h3>
        <p>感谢您玩数字华容道！<br>您的支持是我们持续开发的动力。</p>
        <p style="font-size:12px;color:#999;">微信/支付宝扫码支持</p>
        <button class="close-btn" onclick="closeSponsor()">关闭</button>
    </div>
</div>

<div class="interstitialAd" id="interstitialAd">
    <div class="interstitial-box">
        <h3>🎮 继续挑战</h3>
        <p>观看广告后继续游戏<br>支持开发者持续更新</p>
        <button class="skip-btn" onclick="closeInterstitial()">跳过 (3s)</button>
    </div>
</div>

<script>
// ==================== 广告系统 ====================
var adTimer = null;
var interstitialCount = 0;
function showSponsor() {
    document.getElementById('sponsorModal').classList.add('active');
}
function closeSponsor() {
    document.getElementById('sponsorModal').classList.remove('active');
}
function showInterstitial(callback) {
    interstitialCount++;
    var el = document.getElementById('interstitialAd');
    el.classList.add('active');
    var btn = el.querySelector('.skip-btn');
    var sec = 3;
    btn.textContent = '跳过 (' + sec + 's)';
    btn.disabled = true;
    adTimer = setInterval(function() {
        sec--;
        if (sec <= 0) {
            clearInterval(adTimer);
            btn.textContent = '跳过';
            btn.disabled = false;
        } else {
            btn.textContent = '跳过 (' + sec + 's)';
        }
    }, 1000);
    el._callback = callback;
}
function closeInterstitial() {
    clearInterval(adTimer);
    document.getElementById('interstitialAd').classList.remove('active');
    var el = document.getElementById('interstitialAd');
    if (el._callback) { el._callback(); el._callback = null; }
}

// ==================== Canvas ====================
var canvas = document.getElementById('gc');
var ctx = canvas.getContext('2d');
var W, H, scale;
function resizeCanvas() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    scale = Math.min(W, H) / 600;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ==================== 音效系统 ====================
var audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}
function playSound(freq, duration, type, vol) {
    if (!audioCtx) return;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol || 0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (duration || 0.1));
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + (duration || 0.1));
}
function playMoveSound() { playSound(800, 0.08, 'sine', 0.12); }
function playWinSound() {
    playSound(523, 0.15, 'sine', 0.2);
    setTimeout(function() { playSound(659, 0.15, 'sine', 0.2); }, 150);
    setTimeout(function() { playSound(784, 0.3, 'sine', 0.25); }, 300);
}
function playClickSound() { playSound(600, 0.06, 'square', 0.08); }

// ==================== 粒子系统 ====================
var particles = [];
function spawnParticles(x, y, color, count) {
    for (var i = 0; i < (count || 10); i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6 - 2,
            life: 1,
            decay: 0.02 + Math.random() * 0.03,
            size: 2 + Math.random() * 4,
            color: color || '#FFD700'
        });
    }
}
function spawnWinParticles() {
    var colors = ['#FFD700', '#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFEAA7', '#DDA0DD'];
    for (var i = 0; i < 80; i++) {
        spawnParticles(W * Math.random(), H * Math.random(), colors[i % colors.length], 1);
    }
}
function updateParticles() {
    for (var i = particles.length - 1; i >= 0; i--) {
        var p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.1;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
    }
}
function drawParticles() {
    for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * scale, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

// ==================== 游戏配置 ====================
var SIZES = [
    { label: '3x3', cols: 3, rows: 3, name: '简单' },
    { label: '4x4', cols: 4, rows: 4, name: '经典' },
    { label: '5x5', cols: 5, rows: 5, name: '困难' }
];

// ==================== 游戏状态 ====================
var G = {
    state: 'menu', // menu, playing, paused, won, settings
    sizeIndex: 1,  // 默认4x4
    board: [],
    cols: 4,
    rows: 4,
    emptyPos: { r: 3, c: 3 },
    moves: 0,
    startTime: 0,
    elapsed: 0,
    bestMoves: [0, 0, 0],
    bestTimes: [0, 0, 0],
    totalGames: [0, 0, 0],
    totalWins: [0, 0, 0],
    animating: false,
    animTile: null,
    animFrom: null,
    animTo: null,
    animProgress: 0,
    hintTile: null,
    hintTimer: 0,
    shakeTimer: 0,
    shakeDir: 0,
    menuAnim: 0,
    winAnim: 0,
    settingsScroll: 0,
    touchStart: null,
    touchMoved: false,
    hoverTile: null
};

// ==================== 存储 ====================
function loadScores() {
    try {
        var d = JSON.parse(localStorage.getItem('puzzle15_best') || '{}');
        G.bestMoves = d.moves || [0, 0, 0];
        G.bestTimes = d.times || [0, 0, 0];
        G.totalGames = d.games || [0, 0, 0];
        G.totalWins = d.wins || [0, 0, 0];
    } catch(e) {}
}
function saveScores() {
    try {
        localStorage.setItem('puzzle15_best', JSON.stringify({
            moves: G.bestMoves,
            times: G.bestTimes,
            games: G.totalGames,
            wins: G.totalWins
        }));
    } catch(e) {}
}
loadScores();

// ==================== 初始化 ====================
function initGame() {
    G.cols = SIZES[G.sizeIndex].cols;
    G.rows = SIZES[G.sizeIndex].rows;
    G.board = [];
    var total = G.cols * G.rows;
    for (var i = 1; i < total; i++) G.board.push(i);
    G.board.push(0); // 0 = 空格
    G.emptyPos = { r: G.rows - 1, c: G.cols - 1 };
    G.moves = 0;
    G.startTime = 0;
    G.elapsed = 0;
    G.animating = false;
    G.animTile = null;
    G.hintTile = null;
    G.hintTimer = 0;
    G.shakeTimer = 0;
    G.state = 'playing';
    shuffleBoard();
    G.totalGames[G.sizeIndex]++;
    saveScores();
}

function shuffleBoard() {
    // 通过大量随机移动确保可解性
    var total = G.cols * G.rows;
    for (var i = 0; i < total * 50; i++) {
        var neighbors = getNeighbors(G.emptyPos.r, G.emptyPos.c);
        var idx = Math.floor(Math.random() * neighbors.length);
        var n = neighbors[idx];
        swapTiles(G.emptyPos.r, G.emptyPos.c, n.r, n.c);
        G.emptyPos = { r: n.r, c: n.c };
    }
    // 确保不是已完成状态
    if (isSolved()) shuffleBoard();
}

function getNeighbors(r, c) {
    var result = [];
    if (r > 0) result.push({ r: r - 1, c: c });
    if (r < G.rows - 1) result.push({ r: r + 1, c: c });
    if (c > 0) result.push({ r: r, c: c - 1 });
    if (c < G.cols - 1) result.push({ r: r, c: c + 1 });
    return result;
}

function swapTiles(r1, c1, r2, c2) {
    var idx1 = r1 * G.cols + c1;
    var idx2 = r2 * G.cols + c2;
    var tmp = G.board[idx1];
    G.board[idx1] = G.board[idx2];
    G.board[idx2] = tmp;
}

function getTileAt(r, c) {
    return G.board[r * G.cols + c];
}

function isSolved() {
    var total = G.cols * G.rows;
    for (var i = 0; i < total - 1; i++) {
        if (G.board[i] !== i + 1) return false;
    }
    return G.board[total - 1] === 0;
}

// ==================== 游戏逻辑 ====================
function tryMove(r, c) {
    if (G.state !== 'playing' || G.animating) return false;
    if (r === G.emptyPos.r && c === G.emptyPos.c) return false;
    // 检查是否相邻
    var dr = Math.abs(r - G.emptyPos.r);
    var dc = Math.abs(c - G.emptyPos.c);
    if ((dr === 1 && dc === 0) || (dr === 0 && dc === 1)) {
        // 开始计时
        if (G.startTime === 0) G.startTime = Date.now();
        // 动画
        var tileVal = getTileAt(r, c);
        G.animTile = tileVal;
        G.animFrom = { r: r, c: c };
        G.animTo = { r: G.emptyPos.r, c: G.emptyPos.c };
        G.animProgress = 0;
        G.animating = true;
        swapTiles(r, c, G.emptyPos.r, G.emptyPos.c);
        G.emptyPos = { r: r, c: c };
        G.moves++;
        playMoveSound();
        // 检查完成
        if (isSolved()) {
            setTimeout(function() { onWin(); }, 300);
        }
        return true;
    }
    return false;
}

function onWin() {
    G.state = 'won';
    G.elapsed = Date.now() - G.startTime;
    G.winAnim = 0;
    G.totalWins[G.sizeIndex]++;
    // 更新最佳成绩
    if (G.bestMoves[G.sizeIndex] === 0 || G.moves < G.bestMoves[G.sizeIndex]) {
        G.bestMoves[G.sizeIndex] = G.moves;
    }
    if (G.bestTimes[G.sizeIndex] === 0 || G.elapsed < G.bestTimes[G.sizeIndex]) {
        G.bestTimes[G.sizeIndex] = G.elapsed;
    }
    saveScores();
    playWinSound();
    spawnWinParticles();
    // 插屏广告（每3局赢一次）
    if (G.totalWins[G.sizeIndex] % 3 === 0) {
        showInterstitial(function() {});
    }
}

// ==================== 绘制工具 ====================
function drawRoundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

function drawGradientBg() {
    var grd = ctx.createLinearGradient(0, 0, W, H);
    grd.addColorStop(0, '#0f0c29');
    grd.addColorStop(0.5, '#302b63');
    grd.addColorStop(1, '#24243e');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, H);
}

function drawStars() {
    var time = Date.now() * 0.001;
    for (var i = 0; i < 30; i++) {
        var x = ((i * 137.5 + time * 10) % W);
        var y = ((i * 97.3 + Math.sin(time + i) * 20) % H);
        var s = 1 + Math.sin(time * 2 + i) * 0.5;
        ctx.globalAlpha = 0.3 + Math.sin(time * 3 + i * 0.7) * 0.2;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(x, y, s * scale, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

function formatTime(ms) {
    if (ms === 0) return '00:00';
    var sec = Math.floor(ms / 1000);
    var min = Math.floor(sec / 60);
    sec = sec % 60;
    return (min < 10 ? '0' : '') + min + ':' + (sec < 10 ? '0' : '') + sec;
}

function getTileColor(val, cols, rows) {
    var total = cols * rows;
    var ratio = val / total;
    if (ratio < 0.3) return { bg: '#4ECDC4', text: '#fff' };
    if (ratio < 0.6) return { bg: '#45B7D1', text: '#fff' };
    if (ratio < 0.85) return { bg: '#667eea', text: '#fff' };
    return { bg: '#f5576c', text: '#fff' };
}

// ==================== 绘制场景 ====================
function drawMenu() {
    drawGradientBg();
    drawStars();
    G.menuAnim += 0.02;

    var cx = W / 2;
    var cy = H * 0.3;

    // 标题
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var titleSize = Math.floor(48 * scale);
    ctx.font = 'bold ' + titleSize + 'px "Microsoft YaHei"';
    ctx.fillStyle = '#FFD700';
    ctx.shadowColor = '#FFD700';
    ctx.shadowBlur = 20 * scale;
    ctx.fillText('数字华容道', cx, cy);
    ctx.shadowBlur = 0;

    // 副标题
    var subSize = Math.floor(16 * scale);
    ctx.font = subSize + 'px "Microsoft YaHei"';
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillText('经典15数字滑块益智游戏', cx, cy + 50 * scale);

    // 难度选择
    var btnW = 160 * scale;
    var btnH = 60 * scale;
    var btnGap = 20 * scale;
    var startY = H * 0.48;
    for (var i = 0; i < SIZES.length; i++) {
        var bx = cx - btnW / 2;
        var by = startY + i * (btnH + btnGap);
        var hovered = G.hoverTile === 'menu_' + i;
        drawRoundRect(bx, by, btnW, btnH, 12 * scale);
        ctx.fillStyle = hovered ? 'rgba(255,255,255,0.25)' : 'rgba(255,255,255,0.1)';
        ctx.fill();
        ctx.strokeStyle = hovered ? 'rgba(255,255,255,0.6)' : 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 2 * scale;
        ctx.stroke();

        ctx.fillStyle = '#fff';
        ctx.font = 'bold ' + Math.floor(20 * scale) + 'px "Microsoft YaHei"';
        ctx.fillText(SIZES[i].label + ' ' + SIZES[i].name, cx, by + btnH * 0.35);

        // 最佳成绩
        ctx.font = Math.floor(12 * scale) + 'px "Microsoft YaHei"';
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        var best = G.bestMoves[i];
        ctx.fillText(best > 0 ? '最佳: ' + best + '步' : '未挑战', cx, by + btnH * 0.7);
    }

    // 统计信息
    var statY = H * 0.85;
    ctx.font = Math.floor(13 * scale) + 'px "Microsoft YaHei"';
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    var totalG = G.totalGames[0] + G.totalGames[1] + G.totalGames[2];
    var totalW = G.totalWins[0] + G.totalWins[1] + G.totalWins[2];
    ctx.fillText('累计挑战 ' + totalG + ' 局 | 胜利 ' + totalW + ' 局', cx, statY);

    // 提示
    ctx.font = Math.floor(12 * scale) + 'px "Microsoft Ya容道"';
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillText('点击选择难度开始游戏', cx, H * 0.92);
}

function drawGame() {
    drawGradientBg();
    drawStars();

    var total = G.cols * G.rows;
    var padding = 20 * scale;
    var headerH = 100 * scale;
    var footerH = 60 * scale;
    var availW = W - padding * 2;
    var availH = H - headerH - footerH - padding * 2;
    var tileSize = Math.min(availW / G.cols, availH / G.rows);
    tileSize = Math.min(tileSize, 100 * scale);
    var boardW = tileSize * G.cols;
    var boardH = tileSize * G.rows;
    var boardX = (W - boardW) / 2;
    var boardY = headerH + (availH - boardH) / 2 + padding;

    // 顶部信息
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // 步数
    ctx.font = 'bold ' + Math.floor(24 * scale) + 'px "Microsoft YaHei"';
    ctx.fillStyle = '#4ECDC4';
    ctx.fillText(G.moves + ' 步', W * 0.25, 35 * scale);
    ctx.font = Math.floor(12 * scale) + 'px "Microsoft YaHei"';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText('移动次数', W * 0.25, 58 * scale);

    // 时间
    var elapsed = G.startTime > 0 ? Date.now() - G.startTime : 0;
    G.elapsed = elapsed;
    ctx.font = 'bold ' + Math.floor(24 * scale) + 'px "Microsoft YaHei"';
    ctx.fillStyle = '#FFD700';
    ctx.fillText(formatTime(elapsed), W * 0.5, 35 * scale);
    ctx.font = Math.floor(12 * scale) + 'px "Microsoft YaHei"';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText('用时', W * 0.5, 58 * scale);

    // 难度标签
    ctx.font = 'bold ' + Math.floor(20 * scale) + 'px "Microsoft YaHei"';
    ctx.fillStyle = '#f5576c';
    ctx.fillText(SIZES[G.sizeIndex].label, W * 0.75, 35 * scale);
    ctx.font = Math.floor(12 * scale) + 'px "Microsoft YaHei"';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText(SIZES[G.sizeIndex].name, W * 0.75, 58 * scale);

    // 分隔线
    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padding, headerH - 10 * scale);
    ctx.lineTo(W - padding, headerH - 10 * scale);
    ctx.stroke();

    // 绘制棋盘背景
    drawRoundRect(boardX - 8 * scale, boardY - 8 * scale, boardW + 16 * scale, boardH + 16 * scale, 16 * scale);
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    ctx.lineWidth = 2 * scale;
    ctx.stroke();

    // 绘制数字块
    for (var r = 0; r < G.rows; r++) {
        for (var c = 0; c < G.cols; c++) {
            var val = getTileAt(r, c);
            if (val === 0) continue;

            var tx = boardX + c * tileSize;
            var ty = boardY + r * tileSize;
            var isAnimating = G.animating && G.animTile === val;

            if (isAnimating) {
                // 动画插值
                G.animProgress += 0.15;
                if (G.animProgress >= 1) {
                    G.animProgress = 1;
                    G.animating = false;
                    G.animTile = null;
                }
                var fx = boardX + G.animFrom.c * tileSize;
                var fy = boardY + G.animFrom.r * tileSize;
                var tox = boardX + G.animTo.c * tileSize;
                var toy = boardY + G.animTo.r * tileSize;
                tx = fx + (tox - fx) * G.animProgress;
                ty = fy + (toy - fy) * G.animProgress;
            }

            var colors = getTileColor(val, G.cols, G.rows);
            var m = 3 * scale;
            drawRoundRect(tx + m, ty + m, tileSize - m * 2, tileSize - m * 2, 10 * scale);
            ctx.fillStyle = colors.bg;
            ctx.fill();

            // 阴影
            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.shadowBlur = 4 * scale;
            ctx.shadowOffsetY = 2 * scale;

            drawRoundRect(tx + m, ty + m, tileSize - m * 2, tileSize - m * 2, 10 * scale);
            ctx.fillStyle = colors.bg;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;

            // 高光
            ctx.globalAlpha = 0.15;
            ctx.fillStyle = '#fff';
            ctx.fillRect(tx + m + 4 * scale, ty + m + 4 * scale, tileSize - m * 2 - 8 * scale, (tileSize - m * 2) * 0.3);
            ctx.globalAlpha = 1;

            // 数字
            var fontSize = Math.floor(tileSize * 0.45);
            ctx.font = 'bold ' + fontSize + 'px "Microsoft YaHei"';
            ctx.fillStyle = colors.text;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(val, tx + tileSize / 2, ty + tileSize / 2);
        }
    }

    // 底部按钮
    var btnY = boardY + boardH + 20 * scale;
    var btnSize = 45 * scale;
    var btnGap = 15 * scale;
    var totalBtnW = btnSize * 3 + btnGap * 2;
    var btnStartX = (W - totalBtnW) / 2;

    // 暂停按钮
    drawRoundRect(btnStartX, btnY, btnSize, btnSize, 10 * scale);
    ctx.fillStyle = G.hoverTile === 'pause' ? 'rgba(255,255,255,0.2)' : 'rgba(255,255,255,0.1)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1.5 * scale;
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = Math.floor(20 * scale) + 'px "Microsoft YaHei"';
    ctx.fillText('⏸', btnStartX + btnSize / 2, btnY + btnSize / 2);

    // 重新开始按钮
    var rx = btnStartX + btnSize + btnGap;
    drawRoundRect(rx, btnY, btnSize, btnSize, 10 * scale);
    ctx.fillStyle = G.hoverTile === 'restart' ? 'rgba(255,255,255,0.2)' : 'rgba(255,255,255,0.1)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1.5 * scale;
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = Math.floor(20 * scale) + 'px "Microsoft YaHei"';
    ctx.fillText('🔄', rx + btnSize / 2, btnY + btnSize / 2);

    // 返回菜单按钮
    var mx = rx + btnSize + btnGap;
    drawRoundRect(mx, btnY, btnSize, btnSize, 10 * scale);
    ctx.fillStyle = G.hoverTile === 'menu' ? 'rgba(255,255,255,0.2)' : 'rgba(255,255,255,0.1)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1.5 * scale;
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = Math.floor(20 * scale) + 'px "Microsoft YaHei"';
    ctx.fillText('🏠', mx + btnSize / 2, btnY + btnSize / 2);

    // 存储按钮位置供点击检测
    G._btns = {
        pause: { x: btnStartX, y: btnY, w: btnSize, h: btnSize },
        restart: { x: rx, y: btnY, w: btnSize, h: btnSize },
        menu: { x: mx, y: btnY, w: btnSize, h: btnSize },
        board: { x: boardX, y: boardY, w: boardW, h: boardH, tileSize: tileSize }
    };
}

function drawPaused() {
    drawGradientBg();

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold ' + Math.floor(40 * scale) + 'px "Microsoft YaHei"';
    ctx.fillStyle = '#FFD700';
    ctx.fillText('游戏暂停', W / 2, H * 0.3);

    ctx.font = Math.floor(16 * scale) + 'px "Microsoft YaHei"';
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillText('步数: ' + G.moves + '  |  用时: ' + formatTime(G.elapsed), W / 2, H * 0.4);

    var btnW = 200 * scale;
    var btnH = 50 * scale;
    var btnGap = 20 * scale;
    var startY = H * 0.5;

    // 继续
    drawRoundRect(W / 2 - btnW / 2, startY, btnW, btnH, 12 * scale);
    ctx.fillStyle = G.hoverTile === 'resume' ? 'rgba(78,205,196,0.4)' : 'rgba(78,205,196,0.2)';
    ctx.fill();
    ctx.strokeStyle = '#4ECDC4';
    ctx.lineWidth = 2 * scale;
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold ' + Math.floor(18 * scale) + 'px "Microsoft YaHei"';
    ctx.fillText('继续游戏', W / 2, startY + btnH / 2);

    // 重新开始
    var ry = startY + btnH + btnGap;
    drawRoundRect(W / 2 - btnW / 2, ry, btnW, btnH, 12 * scale);
    ctx.fillStyle = G.hoverTile === 'restart2' ? 'rgba(255,215,0,0.4)' : 'rgba(255,215,0,0.2)';
    ctx.fill();
    ctx.strokeStyle = '#FFD700';
    ctx.lineWidth = 2 * scale;
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.fillText('重新开始', W / 2, ry + btnH / 2);

    // 返回菜单
    var my = ry + btnH + btnGap;
    drawRoundRect(W / 2 - btnW / 2, my, btnW, btnH, 12 * scale);
    ctx.fillStyle = G.hoverTile === 'menu2' ? 'rgba(245,87,108,0.4)' : 'rgba(245,87,108,0.2)';
    ctx.fill();
    ctx.strokeStyle = '#f5576c';
    ctx.lineWidth = 2 * scale;
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.fillText('返回菜单', W / 2, my + btnH / 2);

    G._pausedBtns = {
        resume: { x: W / 2 - btnW / 2, y: startY, w: btnW, h: btnH },
        restart2: { x: W / 2 - btnW / 2, y: ry, w: btnW, h: btnH },
        menu2: { x: W / 2 - btnW / 2, y: my, w: btnW, h: btnH }
    };
}

function drawWin() {
    drawGradientBg();
    updateParticles();
    drawParticles();

    G.winAnim += 0.03;
    var bounce = Math.sin(G.winAnim * 2) * 10 * scale;

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // 恭喜标题
    ctx.font = 'bold ' + Math.floor(44 * scale) + 'px "Microsoft YaHei"';
    ctx.fillStyle = '#FFD700';
    ctx.shadowColor = '#FFD700';
    ctx.shadowBlur = 15 * scale;
    ctx.fillText('恭喜通关!', W / 2, H * 0.2 + bounce);
    ctx.shadowBlur = 0;

    // 难度
    ctx.font = Math.floor(18 * scale) + 'px "Microsoft YaHei"';
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText(SIZES[G.sizeIndex].label + ' ' + SIZES[G.sizeIndex].name + ' 模式', W / 2, H * 0.28);

    // 成绩卡片
    var cardW = 280 * scale;
    var cardH = 180 * scale;
    var cardX = W / 2 - cardW / 2;
    var cardY = H * 0.33;
    drawRoundRect(cardX, cardY, cardW, cardH, 16 * scale);
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 2 * scale;
    ctx.stroke();

    var lineH = cardH / 4;
    // 移动次数
    ctx.font = Math.floor(14 * scale) + 'px "Microsoft YaHei"';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText('移动次数', W / 2, cardY + lineH * 0.6);
    ctx.font = 'bold ' + Math.floor(28 * scale) + 'px "Microsoft YaHei"';
    ctx.fillStyle = '#4ECDC4';
    ctx.fillText(G.moves + ' 步', W / 2, cardY + lineH * 1.2);

    // 用时
    ctx.font = Math.floor(14 * scale) + 'px "Microsoft YaHei"';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText('用时', W / 2, cardY + lineH * 1.8);
    ctx.font = 'bold ' + Math.floor(28 * scale) + 'px "Microsoft YaHei"';
    ctx.fillStyle = '#FFD700';
    ctx.fillText(formatTime(G.elapsed), W / 2, cardY + lineH * 2.4);

    // 最佳成绩
    ctx.font = Math.floor(13 * scale) + 'px "Microsoft YaHei"';
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.fillText('最佳: ' + G.bestMoves[G.sizeIndex] + '步 / ' + formatTime(G.bestTimes[G.sizeIndex]), W / 2, cardY + lineH * 3.2);

    // 按钮
    var btnW = 180 * scale;
    var btnH = 50 * scale;
    var btnGap = 15 * scale;
    var btnY = H * 0.72;

    // 再来一局
    drawRoundRect(W / 2 - btnW - btnGap / 2, btnY, btnW, btnH, 12 * scale);
    ctx.fillStyle = G.hoverTile === 'again' ? 'rgba(78,205,196,0.4)' : 'rgba(78,205,196,0.2)';
    ctx.fill();
    ctx.strokeStyle = '#4ECDC4';
    ctx.lineWidth = 2 * scale;
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold ' + Math.floor(17 * scale) + 'px "Microsoft YaHei"';
    ctx.fillText('再来一局', W / 2 - btnW / 2 - btnGap / 2, btnY + btnH / 2);

    // 返回菜单
    drawRoundRect(W / 2 + btnGap / 2, btnY, btnW, btnH, 12 * scale);
    ctx.fillStyle = G.hoverTile === 'winmenu' ? 'rgba(245,87,108,0.4)' : 'rgba(245,87,108,0.2)';
    ctx.fill();
    ctx.strokeStyle = '#f5576c';
    ctx.lineWidth = 2 * scale;
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.fillText('返回菜单', W / 2 + btnW / 2 + btnGap / 2, btnY + btnH / 2);

    G._winBtns = {
        again: { x: W / 2 - btnW - btnGap / 2, y: btnY, w: btnW, h: btnH },
        winmenu: { x: W / 2 + btnGap / 2, y: btnY, w: btnW, h: btnH }
    };
}

// ==================== 主循环 ====================
function gameLoop() {
    ctx.clearRect(0, 0, W, H);
    switch (G.state) {
        case 'menu': drawMenu(); break;
        case 'playing': drawGame(); break;
        case 'paused': drawPaused(); break;
        case 'won': drawWin(); break;
    }
    requestAnimationFrame(gameLoop);
}

// ==================== 事件处理 ====================
function hitTest(x, y, rect) {
    return x >= rect.x && x <= rect.x + rect.w && y >= rect.y && y <= rect.y + rect.h;
}

function handlePointer(x, y) {
    initAudio();
    playClickSound();

    if (G.state === 'menu') {
        var btnW = 160 * scale;
        var btnH = 60 * scale;
        var btnGap = 20 * scale;
        var startY = H * 0.48;
        var cx = W / 2;
        for (var i = 0; i < SIZES.length; i++) {
            var bx = cx - btnW / 2;
            var by = startY + i * (btnH + btnGap);
            if (hitTest(x, y, { x: bx, y: by, w: btnW, h: btnH })) {
                G.sizeIndex = i;
                initGame();
                return;
            }
        }
    } else if (G.state === 'playing' && G._btns) {
        // 底部按钮
        if (hitTest(x, y, G._btns.pause)) {
            G.state = 'paused';
            return;
        }
        if (hitTest(x, y, G._btns.restart)) {
            initGame();
            return;
        }
        if (hitTest(x, y, G._btns.menu)) {
            G.state = 'menu';
            return;
        }
        // 棋盘点击
        var b = G._btns.board;
        if (hitTest(x, y, b)) {
            var c = Math.floor((x - b.x) / b.tileSize);
            var r = Math.floor((y - b.y) / b.tileSize);
            if (r >= 0 && r < G.rows && c >= 0 && c < G.cols) {
                tryMove(r, c);
            }
        }
    } else if (G.state === 'paused' && G._pausedBtns) {
        if (hitTest(x, y, G._pausedBtns.resume)) {
            G.state = 'playing';
            return;
        }
        if (hitTest(x, y, G._pausedBtns.restart2)) {
            initGame();
            return;
        }
        if (hitTest(x, y, G._pausedBtns.menu2)) {
            G.state = 'menu';
            return;
        }
    } else if (G.state === 'won' && G._winBtns) {
        if (hitTest(x, y, G._winBtns.again)) {
            initGame();
            return;
        }
        if (hitTest(x, y, G._winBtns.winmenu)) {
            G.state = 'menu';
            return;
        }
    }
}

// 鼠标
canvas.addEventListener('click', function(e) {
    handlePointer(e.clientX, e.clientY);
});

canvas.addEventListener('mousemove', function(e) {
    var x = e.clientX, y = e.clientY;
    G.hoverTile = null;

    if (G.state === 'menu') {
        var btnW = 160 * scale;
        var btnH = 60 * scale;
        var btnGap = 20 * scale;
        var startY = H * 0.48;
        var cx = W / 2;
        for (var i = 0; i < SIZES.length; i++) {
            var bx = cx - btnW / 2;
            var by = startY + i * (btnH + btnGap);
            if (hitTest(x, y, { x: bx, y: by, w: btnW, h: btnH })) {
                G.hoverTile = 'menu_' + i;
                canvas.style.cursor = 'pointer';
                return;
            }
        }
    } else if (G.state === 'playing' && G._btns) {
        if (hitTest(x, y, G._btns.pause) || hitTest(x, y, G._btns.restart) || hitTest(x, y, G._btns.menu)) {
            G.hoverTile = hitTest(x, y, G._btns.pause) ? 'pause' : hitTest(x, y, G._btns.restart) ? 'restart' : 'menu';
            canvas.style.cursor = 'pointer';
            return;
        }
        var b = G._btns.board;
        if (hitTest(x, y, b)) {
            canvas.style.cursor = 'pointer';
            return;
        }
    } else if (G.state === 'paused' && G._pausedBtns) {
        if (hitTest(x, y, G._pausedBtns.resume)) { G.hoverTile = 'resume'; canvas.style.cursor = 'pointer'; return; }
        if (hitTest(x, y, G._pausedBtns.restart2)) { G.hoverTile = 'restart2'; canvas.style.cursor = 'pointer'; return; }
        if (hitTest(x, y, G._pausedBtns.menu2)) { G.hoverTile = 'menu2'; canvas.style.cursor = 'pointer'; return; }
    } else if (G.state === 'won' && G._winBtns) {
        if (hitTest(x, y, G._winBtns.again)) { G.hoverTile = 'again'; canvas.style.cursor = 'pointer'; return; }
        if (hitTest(x, y, G._winBtns.winmenu)) { G.hoverTile = 'winmenu'; canvas.style.cursor = 'pointer'; return; }
    }
    canvas.style.cursor = 'default';
});

// 触屏
canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    var t = e.touches[0];
    G.touchStart = { x: t.clientX, y: t.clientY };
    G.touchMoved = false;
});

canvas.addEventListener('touchmove', function(e) {
    e.preventDefault();
    G.touchMoved = true;
});

canvas.addEventListener('touchend', function(e) {
    e.preventDefault();
    if (!G.touchStart) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - G.touchStart.x;
    var dy = t.clientY - G.touchStart.y;
    var dist = Math.sqrt(dx * dx + dy * dy);

    if (G.state === 'playing' && G._btns && dist < 10) {
        // 轻触检测
        handlePointer(t.clientX, t.clientY);
    } else if (G.state === 'playing' && dist > 30) {
        // 滑动检测
        var b = G._btns.board;
        if (b) {
            var sx = G.touchStart.x, sy = G.touchStart.y;
            if (sx >= b.x && sx <= b.x + b.w && sy >= b.y && sy <= b.y + b.h) {
                var c = Math.floor((sx - b.x) / b.tileSize);
                var r = Math.floor((sy - b.y) / b.tileSize);
                if (r >= 0 && r < G.rows && c >= 0 && c < G.cols) {
                    var val = getTileAt(r, c);
                    if (val !== 0) {
                        // 根据滑动方向找到空格
                        if (Math.abs(dx) > Math.abs(dy)) {
                            // 水平滑动
                            if (dx > 0 && c < G.cols - 1) tryMove(r, c + 1);
                            else if (dx < 0 && c > 0) tryMove(r, c - 1);
                        } else {
                            // 垂直滑动
                            if (dy > 0 && r < G.rows - 1) tryMove(r + 1, c);
                            else if (dy < 0 && r > 0) tryMove(r - 1, c);
                        }
                    }
                }
            }
        }
    } else {
        handlePointer(t.clientX, t.clientY);
    }
    G.touchStart = null;
});

// 键盘
document.addEventListener('keydown', function(e) {
    if (G.state !== 'playing') {
        if (e.key === 'Escape' && G.state === 'paused') {
            G.state = 'playing';
            return;
        }
        if (e.key === 'Enter' || e.key === ' ') {
            if (G.state === 'menu') { initGame(); return; }
            if (G.state === 'won') { initGame(); return; }
        }
        return;
    }

    var er = G.emptyPos.r, ec = G.emptyPos.c;
    switch (e.key) {
        case 'ArrowUp':
        case 'w':
        case 'W':
            if (er > 0) tryMove(er - 1, ec);
            break;
        case 'ArrowDown':
        case 's':
        case 'S':
            if (er < G.rows - 1) tryMove(er + 1, ec);
            break;
        case 'ArrowLeft':
        case 'a':
        case 'A':
            if (ec > 0) tryMove(er, ec - 1);
            break;
        case 'ArrowRight':
        case 'd':
        case 'D':
            if (ec < G.cols - 1) tryMove(er, ec + 1);
            break;
        case 'Escape':
            G.state = 'paused';
            break;
        case 'r':
        case 'R':
            initGame();
            break;
    }
});

// ==================== 启动 ====================
gameLoop();
</script>
</body>
</html>
