<style>

<body>
<canvas id="cv"></canvas>
<script>
"use strict";

// ==================== 音频系统 ====================
var audioCtx = null;
function initAudio(){
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
}
function playTone(freq,dur,type,vol){
    if(!audioCtx) return;
    try{
        var o=audioCtx.createOscillator();
        var g=audioCtx.createGain();
        o.type=type||"sine";
        o.frequency.setValueAtTime(freq,audioCtx.currentTime);
        g.gain.setValueAtTime(vol||0.15,audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
        o.connect(g);g.connect(audioCtx.destination);
        o.start();o.stop(audioCtx.currentTime+dur);
    }catch(e){}
}
function sfxRotate(){playTone(520,0.08,"square",0.1)}
function sfxPlace(){playTone(380,0.1,"sine",0.12)}
function sfxConnect(){playTone(660,0.15,"sine",0.15);playTone(880,0.15,"sine",0.1)}
function sfxWin(){playTone(523,0.15,"sine",0.15);setTimeout(function(){playTone(659,0.15,"sine",0.15)},150);setTimeout(function(){playTone(784,0.3,"sine",0.2)},300)}
function sfxFail(){playTone(300,0.2,"sawtooth",0.1);setTimeout(function(){playTone(200,0.3,"sawtooth",0.1)},200)}
function sfxClick(){playTone(600,0.05,"square",0.08)}

// ==================== 常量 ====================
var COLS=7, ROWS=7;
var PIPE_TYPES={
    EMPTY:0, STRAIGHT:1, BEND:2, TEE:3, CROSS:4, SOURCE:5, SINK:6
};
// 连接方向: bit mask: 1=上 2=右 4=下 8=左
var PIPE_OPENINGS=[
    0,  // EMPTY
    5,  // STRAIGHT (上下)
    3,  // BEND (上右)
    7,  // TEE (上右下)
    15, // CROSS (全通)
    1,  // SOURCE (上)
    4   // SINK (下)
];
var DX=[0,1,0,-1], DY=[-1,0,1,0]; // 上右下左
var OPPOSITE=[2,3,0,1];

// ==================== 颜色 ====================
var COLORS={
    bg:"#16213e", grid:"#0f3460", cellBg:"#1a1a3e",
    pipe:"#4ecca3", pipeInner:"#2d6a4f", pipeActive:"#76ffce",
    water:"#00b4d8", waterGlow:"#48cae4",
    source:"#ff6b6b", sink:"#ffd93d",
    text:"#e8e8e8", textGold:"#ffd93d", textDim:"#666",
    btn:"#4ecca3", btnHover:"#76ffce", btnText:"#1a1a2e",
    overlay:"rgba(0,0,0,0.7)", panel:"rgba(22,33,62,0.95)"
};

// ==================== 游戏状态 ====================
var canvas,ctx,W,H,cellSize,gridOffsetX,gridOffsetY;
var G={
    state:"menu", // menu, playing, paused, win, lose
    level:1, maxLevel:10,
    grid:null,    // grid[row][col]={type,rotation,fixed,hasWater}
    sourceR:0,sourceC:0, sinkR:0,sinkC:0,
    timer:0, maxTime:60, timerStart:0,
    score:0, highScore:0, combo:0,
    moves:0, totalMoves:0,
    animating:false, animTimer:0,
    lastTime:0, dt:0,
    particles:[],
    waterFlow:[], // animation
    hoverR:-1, hoverC:-1
};

// ==================== 关卡数据 ====================
var LEVELS=[
    {rows:5,cols:5,time:90,pipeCount:8,  name:"新手入门",   desc:"简单管道，熟悉操作"},
    {rows:5,cols:5,time:80,pipeCount:10, name:"初识水管",   desc:"更多管道需要连接"},
    {rows:6,cols:6,time:75,pipeCount:14, name:"管道迷宫",   desc:"更大的网格"},
    {rows:6,cols:6,time:70,pipeCount:16, name:"水流考验",   desc:"时间开始紧张"},
    {rows:7,cols:7,time:80,pipeCount:20, name:"复杂管网",   desc:"大网格挑战"},
    {rows:7,cols:7,time:75,pipeCount:22, name:"极限连接",   desc:"管道更多更复杂"},
    {rows:7,cols:7,time:70,pipeCount:24, name:"水管大师",   desc:"接近极限"},
    {rows:7,cols:7,time:65,pipeCount:26, name:"终极管网",   desc:"终极挑战"},
    {rows:7,cols:7,time:60,pipeCount:28, name:"神话水管",   desc:"传说级别"},
    {rows:7,cols:7,time:55,pipeCount:30, name:"水管之神",   desc:"神级难度"}
];

// ==================== 初始化 ====================
function init(){
    canvas=document.getElementById("cv");
    ctx=canvas.getContext("2d");
    resize();
    window.addEventListener("resize",resize);
    loadHighScore();
    bindEvents();
    G.lastTime=performance.now();
    requestAnimationFrame(loop);
}

function resize(){
    var dpr=window.devicePixelRatio||1;
    W=window.innerWidth; H=window.innerHeight;
    canvas.width=W*dpr; canvas.height=H*dpr;
    canvas.style.width=W+"px"; canvas.style.height=H+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
}

function loadHighScore(){
    try{G.highScore=parseInt(localStorage.getItem("plumber_high")||"0")}catch(e){G.highScore=0}
}
function saveHighScore(){
    if(G.score>G.highScore){
        G.highScore=G.score;
        try{localStorage.setItem("plumber_high",""+G.highScore)}catch(e){}
    }
}

// ==================== 关卡生成 ====================
function generateLevel(lvl){
    var ld=LEVELS[Math.min(lvl,LEVELS.length)-1];
    ROWS=ld.rows; COLS=ld.cols;
    G.maxTime=ld.time;

    // 初始化空白网格
    G.grid=[];
    for(var r=0;r<ROWS;r++){
        G.grid[r]=[];
        for(var c=0;c<COLS;c++){
            G.grid[r][c]={type:PIPE_TYPES.EMPTY,rotation:0,fixed:false,hasWater:false};
        }
    }

    // 放置水源和终点
    G.sourceR=0; G.sourceC=Math.floor(COLS/2);
    G.sinkR=ROWS-1; G.sinkC=Math.floor(COLS/2);
    G.grid[G.sourceR][G.sourceC]={type:PIPE_TYPES.SOURCE,rotation:0,fixed:true,hasWater:false};
    G.grid[G.sinkR][G.sinkC]={type:PIPE_TYPES.SINK,rotation:0,fixed:true,hasWater:false};

    // 生成解法路径(BFS随机路径)
    var path=generatePath(G.sourceR,G.sourceC,G.sinkR,G.sinkC);
    if(!path||path.length<2){
        // fallback: 直线
        path=[];
        for(var r=G.sourceR;r<=G.sinkR;r++) path.push([r,G.sourceC]);
    }

    // 根据路径放置管道
    var pipeCount=0;
    for(var i=1;i<path.length-1;i++){
        var pr=path[i][0], pc=path[i][1];
        var prevDir=getDir(path[i-1],[pr,pc]);
        var nextDir=getDir([pr,pc],path[i+1]);
        var pipeType=getPipeTypeForDirs(prevDir,nextDir);
        G.grid[pr][pc]={type:pipeType,rotation:0,fixed:false,hasWater:false};
        // 设置正确的旋转
        G.grid[pr][pc].rotation=findRotation(pipeType,prevDir,nextDir);
        pipeCount++;
    }

    // 随机旋转非固定管道
    for(var r=0;r<ROWS;r++){
        for(var c=0;c<COLS;c++){
            if(!G.grid[r][c].fixed&&G.grid[r][c].type!==PIPE_TYPES.EMPTY){
                var rots=Math.floor(Math.random()*4);
                G.grid[r][c].rotation=(G.grid[r][c].rotation+rots)%4;
            }
        }
    }

    // 补充额外管道(非路径上的)
    var extra=ld.pipeCount-pipeCount;
    var attempts=0;
    while(extra>0&&attempts<200){
        attempts++;
        var rr=Math.floor(Math.random()*ROWS);
        var cc=Math.floor(Math.random()*COLS);
        if(G.grid[rr][cc].type===PIPE_TYPES.EMPTY){
            var types=[PIPE_TYPES.STRAIGHT,PIPE_TYPES.BEND,PIPE_TYPES.CROSS];
            var t=types[Math.floor(Math.random()*types.length)];
            G.grid[rr][cc]={type:t,rotation:Math.floor(Math.random()*4),fixed:false,hasWater:false};
            extra--;
        }
    }

    G.timer=0; G.timerStart=performance.now();
    G.moves=0; G.combo=0; G.particles=[]; G.waterFlow=[];
    calcCellSize();
    checkWaterFlow();
}

function generatePath(sr,sc,er,ec){
    var visited=[];
    for(var r=0;r<ROWS;r++){visited[r]=[];for(var c=0;c<COLS;c++)visited[r][c]=false}
    var path=[];
    function dfs(r,c){
        visited[r][c]=true;
        path.push([r,c]);
        if(r===er&&c===ec) return true;
        // 随机方向
        var dirs=[[0,1],[1,0],[0,-1],[-1,0]];
        shuffle(dirs);
        for(var d=0;d<4;d++){
            var nr=r+dirs[d][0], nc=c+dirs[d][1];
            if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&!visited[nr][nc]){
                // 偏好走向终点
                if(dfs(nr,nc)) return true;
            }
        }
        path.pop();
        visited[r][c]=false;
        return false;
    }
    dfs(sr,sc);
    return path;
}

function shuffle(arr){
    for(var i=arr.length-1;i>0;i--){
        var j=Math.floor(Math.random()*(i+1));
        var t=arr[i];arr[i]=arr[j];arr[j]=t;
    }
}

function getDir(from,to){
    var dr=to[0]-from[0], dc=to[1]-from[1];
    if(dr===-1) return 0; // 上
    if(dc===1) return 1;  // 右
    if(dr===1) return 2;  // 下
    if(dc===-1) return 3; // 左
    return 0;
}

function getPipeTypeForDirs(d1,d2){
    var diff=Math.abs(d1-d2);
    if(diff===2) return PIPE_TYPES.STRAIGHT;
    return PIPE_TYPES.BEND;
}

function findRotation(type,d1,d2){
    // 尝试所有旋转找到匹配的
    for(var rot=0;rot<4;rot++){
        var open=getOpenings(type,rot);
        var mask1=1<<d1, mask2=1<<d2;
        if((open&mask1)&&(open&mask2)) return rot;
    }
    return 0;
}

function getOpenings(type,rotation){
    var base=PIPE_OPENINGS[type];
    // 旋转: 向右旋转rotation次
    for(var i=0;i<rotation;i++){
        base=((base<<1)|(base>>3))&15;
    }
    return base;
}

function calcCellSize(){
    var maxW=W*0.85, maxH=H*0.65;
    cellSize=Math.floor(Math.min(maxW/COLS,maxH/ROWS));
    cellSize=Math.min(cellSize,80);
    gridOffsetX=Math.floor((W-cellSize*COLS)/2);
    gridOffsetY=Math.floor((H-cellSize*ROWS)/2)+20;
}

// ==================== 水流检测 ====================
function checkWaterFlow(){
    // 重置
    for(var r=0;r<ROWS;r++)
        for(var c=0;c<COLS;c++)
            G.grid[r][c].hasWater=false;

    // BFS从水源开始
    var queue=[[G.sourceR,G.sourceC]];
    G.grid[G.sourceR][G.sourceC].hasWater=true;
    var waterReachSink=false;

    while(queue.length>0){
        var cur=queue.shift();
        var r=cur[0], c=cur[1];
        var curOpen=getOpenings(G.grid[r][c].type,G.grid[r][c].rotation);

        for(var d=0;d<4;d++){
            if(!(curOpen&(1<<d))) continue;
            var nr=r+DY[d], nc=c+DX[d];
            if(nr<0||nr>=ROWS||nc<0||nc>=COLS) continue;
            if(G.grid[nr][nc].hasWater) continue;
            if(G.grid[nr][nc].type===PIPE_TYPES.EMPTY) continue;

            var neighborOpen=getOpenings(G.grid[nr][nc].type,G.grid[nr][nc].rotation);
            var oppBit=1<<OPPOSITE[d];
            if(neighborOpen&oppBit){
                G.grid[nr][nc].hasWater=true;
                queue.push([nr,nc]);
                if(nr===G.sinkR&&nc===G.sinkC) waterReachSink=true;
            }
        }
    }
    return waterReachSink;
}

// ==================== 旋转管道 ====================
function rotatePipe(r,c){
    var cell=G.grid[r][c];
    if(cell.fixed) return;
    if(cell.type===PIPE_TYPES.EMPTY) return;
    cell.rotation=(cell.rotation+1)%4;
    G.moves++;
    sfxRotate();
    var connected=checkWaterFlow();
    addRotateParticles(r,c);
    if(connected){
        onLevelComplete();
    }
}

// ==================== 粒子系统 ====================
function addRotateParticles(r,c){
    var cx=gridOffsetX+c*cellSize+cellSize/2;
    var cy=gridOffsetY+r*cellSize+cellSize/2;
    for(var i=0;i<6;i++){
        G.particles.push({
            x:cx,y:cy,
            vx:(Math.random()-0.5)*3,
            vy:(Math.random()-0.5)*3,
            life:1,decay:0.03,
            color:COLORS.pipe,size:3
        });
    }
}

function addWaterParticles(){
    for(var r=0;r<ROWS;r++){
        for(var c=0;c<COLS;c++){
            if(!G.grid[r][c].hasWater) continue;
            if(Math.random()>0.3) continue;
            var cx=gridOffsetX+c*cellSize+cellSize/2;
            var cy=gridOffsetY+r*cellSize+cellSize/2;
            G.particles.push({
                x:cx+cellSize*0.3*(Math.random()-0.5),
                y:cy+cellSize*0.3*(Math.random()-0.5),
                vx:(Math.random()-0.5)*1,
                vy:-Math.random()*2,
                life:1,decay:0.02,
                color:COLORS.water,size:2
            });
        }
    }
}

function updateParticles(){
    for(var i=G.particles.length-1;i>=0;i--){
        var p=G.particles[i];
        p.x+=p.vx; p.y+=p.vy;
        p.life-=p.decay;
        if(p.life<=0) G.particles.splice(i,1);
    }
}

// ==================== 关卡完成 ====================
function onLevelComplete(){
    G.state="win";
    var timeUsed=(performance.now()-G.timerStart)/1000;
    var timeBonus=Math.max(0,Math.floor((G.maxTime-timeUsed)*10));
    var moveBonus=Math.max(0,100-G.moves*5);
    var levelScore=100+timeBonus+moveBonus+G.level*50;
    G.score+=levelScore;
    G.combo++;
    saveHighScore();
    sfxWin();
}

// ==================== 游戏结束 ====================
function onTimeUp(){
    G.state="lose";
    sfxFail();
    saveHighScore();
}

function startGame(lvl){
    initAudio();
    G.level=lvl||1;
    G.score=0; G.combo=0; G.totalMoves=0;
    generateLevel(G.level);
    G.state="playing";
}

function nextLevel(){
    G.level++;
    if(G.level>G.maxLevel){
        G.state="menu";
        return;
    }
    generateLevel(G.level);
    G.state="playing";
}

// ==================== 输入处理 ====================
function bindEvents(){
    canvas.addEventListener("click",handleClick);
    canvas.addEventListener("touchstart",handleTouch,{passive:false});
    canvas.addEventListener("mousemove",function(e){
        if(G.state!=="playing") return;
        var rect=canvas.getBoundingClientRect();
        var x=e.clientX-rect.left, y=e.clientY-rect.top;
        var gc=Math.floor((x-gridOffsetX)/cellSize);
        var gr=Math.floor((y-gridOffsetY)/cellSize);
        if(gr>=0&&gr<ROWS&&gc>=0&&gc<COLS){
            G.hoverR=gr; G.hoverC=gc;
        }else{
            G.hoverR=-1; G.hoverC=-1;
        }
    });
}

function handleClick(e){
    initAudio();
    var rect=canvas.getBoundingClientRect();
    var x=e.clientX-rect.left, y=e.clientY-rect.top;
    handleInput(x,y);
}

function handleTouch(e){
    e.preventDefault();
    initAudio();
    var touch=e.touches[0];
    var rect=canvas.getBoundingClientRect();
    var x=touch.clientX-rect.left, y=touch.clientY-rect.top;
    handleInput(x,y);
}

function handleInput(x,y){
    if(G.state==="menu"){
        handleMenuClick(x,y);
    }else if(G.state==="playing"){
        handleGameClick(x,y);
    }else if(G.state==="paused"){
        handlePausedClick(x,y);
    }else if(G.state==="win"){
        handleWinClick(x,y);
    }else if(G.state==="lose"){
        handleLoseClick(x,y);
    }
}

function handleMenuClick(x,y){
    // 开始按钮
    var bx=W/2-100, by=H/2+20, bw=200, bh=50;
    if(x>=bx&&x<=bx+bw&&y>=by&&y<=by+bh){
        sfxClick();
        startGame(1);
    }
}

function handleGameClick(x,y){
    // 暂停按钮(右上角)
    var px=W-60, py=15, ps=40;
    if(x>=px&&x<=px+ps&&y>=py&&y<=py+ps){
        sfxClick();
        G.state="paused";
        return;
    }

    // 网格点击
    var gc=Math.floor((x-gridOffsetX)/cellSize);
    var gr=Math.floor((y-gridOffsetY)/cellSize);
    if(gr>=0&&gr<ROWS&&gc>=0&&gc<COLS){
        rotatePipe(gr,gc);
    }
}

function handlePausedClick(x,y){
    // 继续按钮
    var bx=W/2-100, by=H/2, bw=200, bh=50;
    if(x>=bx&&x<=bx+bw&&y>=by&&y<=by+bh){
        sfxClick();
        G.state="playing";
        G.timerStart=performance.now()-G.timer*1000;
    }
    // 退出按钮
    by=H/2+70;
    if(x>=bx&&x<=bx+bw&&y>=by&&y<=by+bh){
        sfxClick();
        G.state="menu";
    }
}

function handleWinClick(x,y){
    var bx=W/2-100, by=H/2+60, bw=200, bh=50;
    if(x>=bx&&x<=bx+bw&&y>=by&&y<=by+bh){
        sfxClick();
        if(G.level>=G.maxLevel){
            G.state="menu";
        }else{
            nextLevel();
        }
    }
}

function handleLoseClick(x,y){
    var bx=W/2-100, by=H/2+60, bw=200, bh=50;
    if(x>=bx&&x<=bx+bw&&y>=by&&y<=by+bh){
        sfxClick();
        startGame(G.level);
    }
}

// 鼠标悬停 — moved into bindEvents() to ensure canvas is assigned

// ==================== 游戏循环 ====================
function loop(ts){
    var dt=(ts-G.lastTime)/1000;
    G.lastTime=ts;
    G.dt=dt;
    if(G.state==="playing"){
        G.timer=(ts-G.timerStart)/1000;
        if(G.timer>=G.maxTime) onTimeUp();
        updateParticles();
        if(Math.random()<0.1) addWaterParticles();
    }else{
        updateParticles();
    }
    render();
    requestAnimationFrame(loop);
}

// ==================== 渲染 ====================
function render(){
    // 清屏
    ctx.fillStyle=COLORS.bg;
    ctx.fillRect(0,0,W,H);

    switch(G.state){
        case "menu": renderMenu(); break;
        case "playing": renderGame(); break;
        case "paused": renderGame(); renderPaused(); break;
        case "win": renderGame(); renderWin(); break;
        case "lose": renderGame(); renderLose(); break;
    }
}

function renderMenu(){
    // 标题
    ctx.fillStyle=COLORS.text;
    ctx.font="bold 48px 'Microsoft YaHei',sans-serif";
    ctx.textAlign="center";
    ctx.fillText("水管工",W/2,H/2-80);

    ctx.font="18px 'Microsoft YaHei',sans-serif";
    ctx.fillStyle=COLORS.textDim;
    ctx.fillText("旋转管道，连接水源到终点",W/2,H/2-40);

    // 最高分
    ctx.font="16px 'Microsoft YaHei',sans-serif";
    ctx.fillStyle=COLORS.textGold;
    ctx.fillText("最高分: "+G.highScore,W/2,H/2-5);

    // 开始按钮
    drawButton(W/2-100,H/2+20,200,50,"开始游戏",COLORS.btn);

    // 操作说明
    ctx.font="14px 'Microsoft YaHei',sans-serif";
    ctx.fillStyle=COLORS.textDim;
    ctx.fillText("点击管道旋转 | P键暂停 | 目标: 让水流到终点",W/2,H/2+110);
}

function renderGame(){
    calcCellSize();

    // 网格背景
    ctx.fillStyle=COLORS.grid;
    ctx.fillRect(gridOffsetX-2,gridOffsetY-2,cellSize*COLS+4,cellSize*ROWS+4);

    // 绘制每个格子
    for(var r=0;r<ROWS;r++){
        for(var c=0;c<COLS;c++){
            var x=gridOffsetX+c*cellSize;
            var y=gridOffsetY+r*cellSize;
            var cell=G.grid[r][c];

            // 格子背景
            ctx.fillStyle=COLORS.cellBg;
            ctx.fillRect(x+1,y+1,cellSize-2,cellSize-2);

            // 悬停高亮
            if(r===G.hoverR&&c===G.hoverC&&!cell.fixed){
                ctx.fillStyle="rgba(78,204,163,0.15)";
                ctx.fillRect(x+1,y+1,cellSize-2,cellSize-2);
            }

            // 绘制管道
            if(cell.type!==PIPE_TYPES.EMPTY){
                drawPipe(x,y,cell);
            }
        }
    }

    // 粒子
    for(var i=0;i<G.particles.length;i++){
        var p=G.particles[i];
        ctx.globalAlpha=p.life;
        ctx.fillStyle=p.color;
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
        ctx.fill();
    }
    ctx.globalAlpha=1;

    // HUD
    renderHUD();
}

function drawPipe(x,y,cell){
    var cx=x+cellSize/2;
    var cy=y+cellSize/2;
    var pipeW=cellSize*0.3;
    var open=getOpenings(cell.type,cell.rotation);
    var hasW=cell.hasWater;

    ctx.save();
    ctx.translate(cx,cy);

    // 管道颜色
    var pipeColor=hasW?COLORS.water:COLORS.pipe;
    var innerColor=hasW?COLORS.waterGlow:COLORS.pipeInner;

    // 水源/终点特殊颜色
    if(cell.type===PIPE_TYPES.SOURCE) pipeColor=COLORS.source;
    if(cell.type===PIPE_TYPES.SINK) pipeColor=COLORS.sink;

    // 绘制连接管段
    ctx.strokeStyle=pipeColor;
    ctx.lineWidth=pipeW;
    ctx.lineCap="round";

    // 管道中心
    ctx.fillStyle=pipeColor;
    ctx.beginPath();
    ctx.arc(0,0,pipeW*0.6,0,Math.PI*2);
    ctx.fill();

    // 各方向管段
    for(var d=0;d<4;d++){
        if(open&(1<<d)){
            ctx.beginPath();
            ctx.moveTo(0,0);
            ctx.lineTo(DX[d]*cellSize*0.4,DY[d]*cellSize*0.4);
            ctx.stroke();

            // 内管
            ctx.strokeStyle=innerColor;
            ctx.lineWidth=pipeW*0.4;
            ctx.beginPath();
            ctx.moveTo(0,0);
            ctx.lineTo(DX[d]*cellSize*0.35,DY[d]*cellSize*0.35);
            ctx.stroke();

            ctx.strokeStyle=pipeColor;
            ctx.lineWidth=pipeW;
        }
    }

    // 水流光效
    if(hasW){
        var glow=0.3+0.2*Math.sin(performance.now()*0.003);
        ctx.globalAlpha=glow;
        ctx.fillStyle=COLORS.waterGlow;
        ctx.beginPath();
        ctx.arc(0,0,pipeW*0.8,0,Math.PI*2);
        ctx.fill();
        ctx.globalAlpha=1;
    }

    // 水源/终点标记
    if(cell.type===PIPE_TYPES.SOURCE){
        ctx.fillStyle="#fff";
        ctx.font="bold "+Math.floor(cellSize*0.35)+"px sans-serif";
        ctx.textAlign="center";
        ctx.textBaseline="middle";
        ctx.fillText("水",0,0);
    }
    if(cell.type===PIPE_TYPES.SINK){
        ctx.fillStyle="#fff";
        ctx.font="bold "+Math.floor(cellSize*0.35)+"px sans-serif";
        ctx.textAlign="center";
        ctx.textBaseline="middle";
        ctx.fillText("终",0,0);
    }

    // 固定标记
    if(cell.fixed&&cell.type!==PIPE_TYPES.SOURCE&&cell.type!==PIPE_TYPES.SINK){
        ctx.strokeStyle="rgba(255,255,255,0.3)";
        ctx.lineWidth=1;
        ctx.beginPath();
        ctx.arc(0,0,cellSize*0.35,0,Math.PI*2);
        ctx.stroke();
    }

    ctx.restore();
}

function renderHUD(){
    // 顶部信息栏
    ctx.fillStyle=COLORS.panel;
    ctx.fillRect(0,0,W,55);

    // 关卡
    ctx.fillStyle=COLORS.text;
    ctx.font="bold 18px 'Microsoft YaHei',sans-serif";
    ctx.textAlign="left";
    ctx.fillText("第"+G.level+"关",15,22);

    // 关卡名
    var ld=LEVELS[Math.min(G.level,LEVELS.length)-1];
    ctx.font="12px 'Microsoft YaHei',sans-serif";
    ctx.fillStyle=COLORS.textDim;
    ctx.fillText(ld.name,15,42);

    // 计时器
    var timeLeft=Math.max(0,G.maxTime-G.timer);
    var timePct=timeLeft/G.maxTime;
    ctx.fillStyle=COLORS.text;
    ctx.font="bold 20px 'Microsoft YaHei',sans-serif";
    ctx.textAlign="center";
    ctx.fillText(Math.ceil(timeLeft)+"s",W/2,25);

    // 时间条
    var barW=120, barH=6;
    var barX=W/2-barW/2, barY=36;
    ctx.fillStyle="#333";
    ctx.fillRect(barX,barY,barW,barH);
    ctx.fillStyle=timePct>0.3?COLORS.btn:"#ff4444";
    ctx.fillRect(barX,barY,barW*timePct,barH);

    // 分数
    ctx.fillStyle=COLORS.textGold;
    ctx.font="bold 16px 'Microsoft YaHei',sans-serif";
    ctx.textAlign="right";
    ctx.fillText("分数:"+G.score,W-65,22);

    // 步数
    ctx.fillStyle=COLORS.text;
    ctx.font="14px 'Microsoft YaHei',sans-serif";
    ctx.fillText("步数:"+G.moves,W-65,42);

    // 暂停按钮
    drawPauseButton(W-50,15,35,35);
}

function drawPauseButton(x,y,w,h){
    ctx.fillStyle="rgba(255,255,255,0.2)";
    ctx.fillRect(x,y,w,h);
    ctx.fillStyle="#fff";
    ctx.fillRect(x+10,y+8,5,h-16);
    ctx.fillRect(x+20,y+8,5,h-16);
}

function drawButton(x,y,w,h,text,color){
    ctx.fillStyle=color;
    roundRect(x,y,w,h,8);
    ctx.fill();
    ctx.fillStyle=COLORS.btnText;
    ctx.font="bold 20px 'Microsoft YaHei',sans-serif";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText(text,x+w/2,y+h/2);
    ctx.textBaseline="alphabetic";
}

function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
}

function renderPaused(){
    ctx.fillStyle=COLORS.overlay;
    ctx.fillRect(0,0,W,H);

    ctx.fillStyle=COLORS.panel;
    roundRect(W/2-150,H/2-80,300,200,12);
    ctx.fill();

    ctx.fillStyle=COLORS.text;
    ctx.font="bold 28px 'Microsoft YaHei',sans-serif";
    ctx.textAlign="center";
    ctx.fillText("暂停",W/2,H/2-35);

    drawButton(W/2-100,H/2,200,50,"继续游戏",COLORS.btn);
    drawButton(W/2-100,H/2+70,200,50,"返回菜单","#e74c3c");
}

function renderWin(){
    ctx.fillStyle=COLORS.overlay;
    ctx.fillRect(0,0,W,H);

    ctx.fillStyle=COLORS.panel;
    roundRect(W/2-160,H/2-100,320,240,12);
    ctx.fill();

    ctx.fillStyle=COLORS.textGold;
    ctx.font="bold 32px 'Microsoft YaHei',sans-serif";
    ctx.textAlign="center";
    ctx.fillText("通关!",W/2,H/2-50);

    var timeUsed=Math.floor((performance.now()-G.timerStart)/1000);
    ctx.font="16px 'Microsoft YaHei',sans-serif";
    ctx.fillStyle=COLORS.text;
    ctx.fillText("用时: "+timeUsed+"秒  步数: "+G.moves,W/2,H/2-10);

    ctx.fillStyle=COLORS.textGold;
    ctx.font="bold 20px 'Microsoft YaHei',sans-serif";
    ctx.fillText("得分: "+G.score,W/2,H/2+20);

    var btnText=G.level>=G.maxLevel?"返回菜单":"下一关";
    drawButton(W/2-100,H/2+60,200,50,btnText,COLORS.btn);
}

function renderLose(){
    ctx.fillStyle=COLORS.overlay;
    ctx.fillRect(0,0,W,H);

    ctx.fillStyle=COLORS.panel;
    roundRect(W/2-160,H/2-100,320,220,12);
    ctx.fill();

    ctx.fillStyle="#ff6b6b";
    ctx.font="bold 32px 'Microsoft YaHei',sans-serif";
    ctx.textAlign="center";
    ctx.fillText("时间到!",W/2,H/2-50);

    ctx.font="16px 'Microsoft YaHei',sans-serif";
    ctx.fillStyle=COLORS.text;
    ctx.fillText("当前得分: "+G.score,W/2,H/2-10);
    ctx.fillText("最高分: "+G.highScore,W/2,H/2+15);

    drawButton(W/2-100,H/2+60,200,50,"重新挑战","#e74c3c");
}

// ==================== 键盘 ====================
document.addEventListener("keydown",function(e){
    initAudio();
    if(e.key==="p"||e.key==="P"){
        if(G.state==="playing"){
            G.state="paused";
            sfxClick();
        }else if(G.state==="paused"){
            G.state="playing";
            G.timerStart=performance.now()-G.timer*1000;
            sfxClick();
        }
    }
    if(e.key==="Escape"){
        if(G.state==="playing"){
            G.state="paused";
            sfxClick();
        }else if(G.state==="paused"){
            G.state="playing";
            G.timerStart=performance.now()-G.timer*1000;
            sfxClick();
        }
    }
    if(e.key==="Enter"||e.key===" "){
        if(G.state==="win"){
            if(G.level>=G.maxLevel) G.state="menu";
            else nextLevel();
            sfxClick();
        }else if(G.state==="lose"){
            startGame(G.level);
            sfxClick();
        }else if(G.state==="menu"){
            startGame(1);
            sfxClick();
        }
    }
});

// ==================== 启动 ====================
init();


// ===== 游戏工坊统一广告系统 =====
const GameMonetize = {
	adsterra: { enabled: !/localhost|127\.0\.0\.1/.test(location.hostname) },
	sponsor: { enabled: true, wechatQR: '', alipayQR: '' },
	interstitial: { enabled: true, cooldownMs: 180000, gameCount: 2 },
	_lastInterTime: 0, _deathCount: 0,
	_gameOverDetected: false,
	init() {
		const banner = document.getElementById('adBanner');
		if (banner && this.adsterra.enabled) {
			const s1 = document.createElement('script');
			s1.src = 'https://pl29544740.effectivecpmnetwork.com/de/26/0e/de260e17b6a348e3489772a87b1cedf1.js';
			s1.async = true;
			banner.appendChild(s1);
		}
		const spBtn = document.getElementById('sponsorBtn');
		const spPanel = document.getElementById('sponsorPanel');
		const spClose = document.getElementById('sponsorClose');
		if (spBtn && spPanel && spClose && this.sponsor.enabled) {
			spBtn.onclick = () => { spPanel.style.display = 'flex'; spPanel.style.pointerEvents = 'auto'; };
			spClose.onclick = () => { spPanel.style.display = 'none'; spPanel.style.pointerEvents = 'none'; };
			spPanel.onclick = (e) => { if (e.target === spPanel) { spPanel.style.display = 'none'; spPanel.style.pointerEvents = 'none'; } };
		} else if (spBtn) { spBtn.style.display = 'none'; }
		const skipBtn = document.getElementById('skipInterstitial');
		const interstitial = document.getElementById('interstitialAd');
		if (skipBtn && interstitial) {
			skipBtn.onclick = () => {
				interstitial.style.display = 'none'; interstitial.style.pointerEvents = 'none';
				if (this._reviveCallback) { const cb = this._reviveCallback; this._reviveCallback = null; cb(); }
			};
		}
		// 自动检测游戏结束状态
		this._startGameOverWatcher();
	},
	_startGameOverWatcher() {
		// 检测#restartBtn或包含"重新开始"/"再来一局"的按钮变为可见
		const checkGameOver = () => {
			if (this._gameOverDetected) return;
			// 方法1: 检测#restartBtn可见
			const restartBtn = document.getElementById('restartBtn');
			if (restartBtn && restartBtn.offsetParent !== null && getComputedStyle(restartBtn).display !== 'none') {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
			// 方法2: 检测#gameOverScreen可见
			const goScreen = document.getElementById('gameOverScreen');
			if (goScreen && getComputedStyle(goScreen).display !== 'none') {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
			// 方法3: 检测screen-gameover可见
			const goScreen2 = document.getElementById('screen-gameover');
			if (goScreen2 && !goScreen2.classList.contains('hidden')) {
				this._gameOverDetected = true;
				this.onGameOver();
				return;
			}
		};
		// 每500ms检查一次
		this._goInterval = setInterval(() => {
			checkGameOver();
			// 如果检测到了，等2秒后重置标志，允许下次检测
			if (this._gameOverDetected) {
				setTimeout(() => { this._gameOverDetected = false; }, 2000);
			}
		}, 500);
	},
	requestRevive(callback) {
		this._reviveCallback = callback || null;
		const el = document.getElementById('interstitialAd');
		if (!el) { if (callback) callback(); return; }
		const s2 = document.createElement('script');
		s2.src = 'https://pl29544742.effectivecpmnetwork.com/be/a9/6d/bea96d779c0ee07c2b15613852dd3e70.js';
		s2.async = true;
		document.getElementById('interstitialAdSlot').innerHTML = '';
		document.getElementById('interstitialAdSlot').appendChild(s2);
		el.style.display = 'flex'; el.style.pointerEvents = 'auto';

		setTimeout(() => { const slot = document.getElementById('interstitialAdSlot'); if (slot && slot.innerHTML.includes('加载中')) { slot.innerHTML = '<div style=color:#aaa;font:13px Microsoft YaHei,sans-serif>广告暂时无法加载<br>点击下方按钮继续</div>'; } }, 3000);
		const skipBtn = document.getElementById('skipInterstitial');
		if (skipBtn) {
			skipBtn.textContent = '5 秒后可跳过'; skipBtn.disabled = true;
			let cd = 5;
			const timer = setInterval(() => {
				cd--;
				if (cd <= 0) { clearInterval(timer); skipBtn.textContent = '跳过广告 ▶'; skipBtn.disabled = false; }
				else { skipBtn.textContent = cd + ' 秒后可跳过'; }
			}, 1000);
		}
	},
	onGameOver() {
		this._deathCount++;
		if (!this.interstitial.enabled) return;
		if (this._deathCount < this.interstitial.gameCount) return;
		if (Date.now() - this._lastInterTime < this.interstitial.cooldownMs) return;
		this._lastInterTime = Date.now(); this._deathCount = 0;
		this.requestRevive(null);
	},
};
GameMonetize.init();
</script>
