<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>勇者冒险</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
canvas { image-rendering: pixelated; image-rendering: crisp-edges; border: 2px solid #444; }
#touch-controls { display: none; position: fixed; bottom: 0; left: 0; width: 100%; pointer-events: none; z-index: 100; }
.touch-btn { pointer-events: auto; display: flex; align-items: center; justify-content: center; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
.dpad { position: absolute; left: 16px; bottom: 16px; width: 140px; height: 140px; }
.dpad .touch-btn { position: absolute; width: 48px; height: 48px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; font-size: 20px; color: rgba(255,255,255,0.5); }
.dpad .touch-btn.pressed { background: rgba(255,255,255,0.35); }
.dpad .dpad-up { left: 46px; top: 0; }
.dpad .dpad-down { left: 46px; bottom: 0; }
.dpad .dpad-left { left: 0; top: 46px; }
.dpad .dpad-right { right: 0; top: 46px; }
.action-btns { position: absolute; right: 16px; bottom: 16px; display: flex; gap: 10px; align-items: flex-end; }
.action-btns .touch-btn { border-radius: 50%; font-weight: bold; }
.action-btns .btn-cancel { width: 50px; height: 50px; background: rgba(220,60,60,0.2); border: 1px solid rgba(220,60,60,0.35); font-size: 15px; color: rgba(220,60,60,0.7); }
.action-btns .btn-cancel.pressed { background: rgba(220,60,60,0.5); }
.action-btns .btn-confirm { width: 62px; height: 62px; background: rgba(60,180,60,0.2); border: 1px solid rgba(60,180,60,0.35); font-size: 18px; color: rgba(60,180,60,0.7); }
.action-btns .btn-confirm.pressed { background: rgba(60,180,60,0.5); }
.action-btns .btn-menu { width: 44px; height: 44px; background: rgba(80,130,220,0.15); border: 1px solid rgba(80,130,220,0.3); border-radius: 8px; font-size: 11px; color: rgba(80,130,220,0.6); }
.action-btns .btn-menu.pressed { background: rgba(80,130,220,0.4); }
</style>
</head>
<body>
<canvas id="gameCanvas" width="640" height="480"></canvas>
<div id="touch-controls">
  <div class="dpad">
    <div class="touch-btn dpad-up" data-key="ArrowUp">&#9650;</div>
    <div class="touch-btn dpad-down" data-key="ArrowDown">&#9660;</div>
    <div class="touch-btn dpad-left" data-key="ArrowLeft">&#9664;</div>
    <div class="touch-btn dpad-right" data-key="ArrowRight">&#9654;</div>
  </div>
  <div class="action-btns">
    <div class="touch-btn btn-cancel" data-key="x">X</div>
    <div class="touch-btn btn-confirm" data-key="z">Z</div>
    <div class="touch-btn btn-menu" data-key="m">菜单</div>
  </div>
</div>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = 640, H = 480;
const TILE = 32;
const MAP_W = 20, MAP_H = 15;

// Audio context
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playTone(freq, duration, type, volume) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.value = volume || 0.1;
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (duration || 0.1));
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + (duration || 0.1));
  } catch(e) {}
}
function sfxMove() { playTone(200, 0.05, 'square', 0.05); }
function sfxAttack() { playTone(150, 0.15, 'sawtooth', 0.1); playTone(100, 0.1, 'square', 0.08); }
function sfxHurt() { playTone(80, 0.2, 'sawtooth', 0.1); }
function sfxHeal() { playTone(400, 0.15, 'sine', 0.08); setTimeout(() => playTone(500, 0.15, 'sine', 0.08), 100); }
function sfxLevelUp() { playTone(300, 0.1, 'square', 0.08); setTimeout(() => playTone(400, 0.1, 'square', 0.08), 100); setTimeout(() => playTone(500, 0.2, 'square', 0.1), 200); }
function sfxChest() { playTone(350, 0.1, 'sine', 0.08); setTimeout(() => playTone(500, 0.2, 'sine', 0.1), 120); }
function sfxBoss() { playTone(100, 0.3, 'sawtooth', 0.12); playTone(80, 0.4, 'square', 0.1); }
function sfxCritical() { playTone(200, 0.05, 'square', 0.1); setTimeout(() => playTone(300, 0.05, 'square', 0.1), 50); setTimeout(() => playTone(500, 0.15, 'sawtooth', 0.12), 100); }
function sfxVictory() { [300,350,400,450,500].forEach((f,i) => setTimeout(() => playTone(f, 0.2, 'sine', 0.1), i*150)); }
function sfxDeath() { [300,250,200,150,100].forEach((f,i) => setTimeout(() => playTone(f, 0.3, 'sawtooth', 0.08), i*200)); }
function sfxEscape() { playTone(300, 0.1, 'triangle', 0.05); setTimeout(() => playTone(200, 0.15, 'triangle', 0.05), 80); }

// Game state
const GameState = { TITLE: 0, EXPLORE: 1, BATTLE: 2, MENU: 3, GAMEOVER: 4, VICTORY: 5, SHOP: 6, DIALOG: 7, CHEST: 8 };
let state = GameState.TITLE;
let titleSelection = 0;

// Player
let player = null;
function createPlayer() {
  return {
    x: 2, y: 2, floor: 0, dir: 0,
    hp: 50, maxHp: 50, mp: 20, maxMp: 20,
    attack: 8, defense: 3, critRate: 0.10,
    level: 1, exp: 0, nextExp: 10,
    gold: 20, steps: 0,
    weapon: null, armor: null, accessory: null,
    inventory: [
      { name: '药水', type: 'consumable', effect: 'heal', value: 30, count: 3 },
      { name: '魔力药水', type: 'consumable', effect: 'mp', value: 15, count: 2 }
    ],
    skills: [
      { name: '斩击', cost: 2, desc: '攻击力x1.5' },
      { name: '防御', cost: 0, desc: '本回合防御x2' },
      { name: '治疗', cost: 3, desc: '恢复20%最大HP' },
      { name: '暴击', cost: 4, desc: '100%暴击，伤害x4' }
    ],
    totalTime: 0,
    defeatedBosses: [],
    quests: {}
  };
}

// Items database
const weapons = [
  { name: '木剑', attack: 3, price: 30 },
  { name: '铁剑', attack: 6, price: 80 },
  { name: '钢剑', attack: 10, price: 200 },
  { name: '火焰剑', attack: 15, price: 500 },
  { name: '圣剑', attack: 25, price: 1200 }
];
const armors = [
  { name: '布衣', defense: 2, price: 20 },
  { name: '皮甲', defense: 5, price: 60 },
  { name: '锁子甲', defense: 9, price: 150 },
  { name: '铠甲', defense: 14, price: 400 },
  { name: '圣铠', defense: 20, price: 1000 }
];
const accessories = [
  { name: '生命戒指', stat: 'hp', value: 20, price: 100 },
  { name: '魔力戒指', stat: 'mp', value: 15, price: 100 },
  { name: '幸运戒指', stat: 'crit', value: 0.05, price: 200 }
];

// Monster definitions
const monsterDefs = [
  // Floor 0 (1层)
  { name: '史莱姆', hp: 10, attack: 3, defense: 1, exp: 10, gold: 5, floor: 0, color: '#4f4' },
  { name: '蝙蝠', hp: 8, attack: 5, defense: 0, exp: 10, gold: 6, floor: 0, color: '#a6a' },
  // Floor 1 (2层)
  { name: '骷髅', hp: 20, attack: 8, defense: 3, exp: 20, gold: 12, floor: 1, color: '#ddd' },
  { name: '哥布林', hp: 15, attack: 10, defense: 2, exp: 20, gold: 15, floor: 1, color: '#6b4' },
  // Floor 2 (3层)
  { name: '狼人', hp: 35, attack: 12, defense: 5, exp: 30, gold: 20, floor: 2, color: '#965' },
  { name: '石魔', hp: 50, attack: 8, defense: 10, exp: 35, gold: 25, floor: 2, color: '#888' },
  // Floor 3 (4层)
  { name: '暗影刺客', hp: 40, attack: 18, defense: 6, exp: 40, gold: 35, floor: 3, color: '#556' },
  { name: '龙蛋', hp: 60, attack: 15, defense: 12, exp: 45, gold: 40, floor: 3, color: '#c64' },
  // Floor 4 (5层)
  { name: '死灵法师', hp: 80, attack: 20, defense: 8, exp: 60, gold: 50, floor: 4, color: '#838' },
  { name: '暗影龙', hp: 200, attack: 25, defense: 15, exp: 200, gold: 200, floor: 4, color: '#609', isBoss: true }
];

// Map tiles
const TileType = { FLOOR: 0, WALL: 1, GRASS: 2, STAIRS_DOWN: 3, STAIRS_UP: 4, CHEST: 5, NPC: 6, SHOP: 7, BOSS_DOOR: 8 };
const tileColors = ['#3a3', '#553', '#4a4', '#aa4', '#aa4', '#da4', '#f84', '#4af', '#f44'];

// Generate maps
let maps = [];
let openedChests = new Set();

function generateFloor(floor) {
  const map = [];
  for (let y = 0; y < MAP_H; y++) {
    map[y] = [];
    for (let x = 0; x < MAP_W; x++) {
      if (x === 0 || y === 0 || x === MAP_W - 1 || y === MAP_H - 1) {
        map[y][x] = TileType.WALL;
      } else {
        map[y][x] = Math.random() < 0.15 ? TileType.WALL : (Math.random() < 0.3 ? TileType.GRASS : TileType.FLOOR);
      }
    }
  }
  // Ensure start position is clear
  map[2][2] = TileType.FLOOR;
  map[2][3] = TileType.FLOOR;
  map[3][2] = TileType.FLOOR;

  // Stairs
  if (floor < 4) {
    let dx, dy;
    do { dx = 3 + Math.floor(Math.random() * (MAP_W - 6)); dy = 3 + Math.floor(Math.random() * (MAP_H - 6)); }
    while (map[dy][dx] === TileType.WALL);
    map[dy][dx] = TileType.STAIRS_DOWN;
  }
  if (floor > 0) {
    map[2][1] = TileType.STAIRS_UP;
  }

  // Chests (2-3 per floor)
  const chestCount = 2 + Math.floor(Math.random() * 2);
  for (let i = 0; i < chestCount; i++) {
    let cx, cy;
    let attempts = 0;
    do {
      cx = 2 + Math.floor(Math.random() * (MAP_W - 4));
      cy = 2 + Math.floor(Math.random() * (MAP_H - 4));
      attempts++;
    } while ((map[cy][cx] !== TileType.FLOOR && map[cy][cx] !== TileType.GRASS) && attempts < 50);
    if (attempts < 50) map[cy][cx] = TileType.CHEST;
  }

  // NPC on floor 1
  if (floor === 1) {
    map[5][5] = TileType.NPC;
  }

  // Shop on floor 2
  if (floor === 2) {
    map[3][15] = TileType.SHOP;
  }

  // Boss door on floor 4
  if (floor === 4) {
    for (let y = 10; y < MAP_H - 1; y++) {
      for (let x = 1; x < MAP_W - 1; x++) {
        if (map[y][x] === TileType.FLOOR) {
          map[y][x] = TileType.BOSS_DOOR;
          break;
        }
      }
      if (map[y].includes(TileType.BOSS_DOOR)) break;
    }
  }

  // BFS to ensure connectivity
  ensureConnectivity(map, 2, 2, floor);
  return map;
}

function ensureConnectivity(map, startX, startY, floor) {
  function getReachable() {
    const visited = new Set();
    const queue = [[startX, startY]];
    visited.add(`${startX},${startY}`);
    const dirs = [[0,1],[0,-1],[1,0],[-1,0]];
    while (queue.length > 0) {
      const [cx, cy] = queue.shift();
      for (const [dx, dy] of dirs) {
        const nx = cx + dx, ny = cy + dy;
        const key = `${nx},${ny}`;
        if (nx >= 0 && nx < MAP_W && ny >= 0 && ny < MAP_H && !visited.has(key) && map[ny][nx] !== TileType.WALL) {
          visited.add(key);
          queue.push([nx, ny]);
        }
      }
    }
    return visited;
  }

  function carvePathTo(visited, tx, ty) {
    let nearest = null, minDist = Infinity;
    for (const v of visited) {
      const [vx, vy] = v.split(',').map(Number);
      const d = Math.abs(vx - tx) + Math.abs(vy - ty);
      if (d < minDist) { minDist = d; nearest = [vx, vy]; }
    }
    if (nearest) {
      let [px, py] = nearest;
      while (px !== tx) { px += px < tx ? 1 : -1; if (map[py][px] === TileType.WALL) map[py][px] = TileType.FLOOR; }
      while (py !== ty) { py += py < ty ? 1 : -1; if (map[py][px] === TileType.WALL) map[py][px] = TileType.FLOOR; }
    }
  }

  let visited = getReachable();
  const specials = [TileType.STAIRS_DOWN, TileType.STAIRS_UP, TileType.BOSS_DOOR, TileType.NPC, TileType.SHOP];
  for (let y = 0; y < MAP_H; y++) {
    for (let x = 0; x < MAP_W; x++) {
      if (specials.includes(map[y][x]) && !visited.has(`${x},${y}`)) {
        carvePathTo(visited, x, y);
        visited = getReachable();
      }
    }
  }
}

function initMaps() {
  maps = [];
  openedChests = new Set();
  for (let i = 0; i < 5; i++) maps.push(generateFloor(i));
}

// Battle state
let battle = null;
let battleLog = [];
let battleAnimations = [];
let battleMenuState = 'main'; // main, skill, item
let battleMenuSelection = 0;
let playerDefending = false;

function startBattle(monsterDef) {
  initAudio();
  const isBoss = monsterDef.isBoss || false;
  if (isBoss) sfxBoss();
  battle = {
    monster: {
      ...monsterDef,
      currentHp: monsterDef.hp,
      maxHp: monsterDef.hp
    },
    turn: 'player',
    animTimer: 0,
    damageNumbers: [],
    shakeTimer: 0,
    isBoss: isBoss,
    result: null,
    resultTimer: 0
  };
  battleLog = [`遭遇了${monsterDef.name}！`];
  battleMenuState = 'main';
  battleMenuSelection = 0;
  playerDefending = false;
  state = GameState.BATTLE;
}

function calcDamage(attacker, defender) {
  const base = Math.max(1, attacker - defender);
  const variance = Math.floor(base * 0.2);
  return base + Math.floor(Math.random() * (variance * 2 + 1)) - variance;
}

function addBattleLog(msg) {
  battleLog.push(msg);
  if (battleLog.length > 6) battleLog.shift();
}

function addDamageNum(x, y, text, color) {
  battle.damageNumbers.push({ x, y, text, color: color || '#fff', timer: 60, offsetY: 0 });
}

function playerAttack(isCritical, skillMult) {
  const weaponBonus = player.weapon ? weapons.find(w => w.name === player.weapon).attack : 0;
  const totalAttack = player.attack + weaponBonus;
  const mult = skillMult || 1;
  const crit = isCritical || Math.random() < player.critRate + (player.accessory === '幸运戒指' ? 0.05 : 0);
  let dmg = calcDamage(Math.floor(totalAttack * mult), battle.monster.defense);
  if (crit) { dmg = Math.floor(dmg * (skillMult ? 2 : 1.5)); sfxCritical(); }
  else sfxAttack();
  battle.monster.currentHp = Math.max(0, battle.monster.currentHp - dmg);
  addBattleLog(`${crit ? '暴击！' : ''}造成了${dmg}点伤害！`);
  addDamageNum(320, 150, `-${dmg}`, crit ? '#ff4' : '#f44');
  battle.shakeTimer = 10;
  return dmg;
}

function monsterAttack() {
  const armorBonus = player.armor ? armors.find(a => a.name === player.armor).defense : 0;
  const totalDefense = player.defense + armorBonus;
  const def = playerDefending ? totalDefense * 2 : totalDefense;
  let dmg = calcDamage(battle.monster.attack, def);
  if (dmg < 1) dmg = 1;
  player.hp = Math.max(0, player.hp - dmg);
  sfxHurt();
  addBattleLog(`${battle.monster.name}造成了${dmg}点伤害！`);
  addDamageNum(160, 200, `-${dmg}`, '#f44');
  battle.shakeTimer = 10;
  playerDefending = false;
  return dmg;
}

function endBattle(won) {
  if (won) {
    const exp = battle.monster.exp;
    const gold = battle.monster.gold;
    player.exp += exp;
    player.gold += gold;
    addBattleLog(`获得${exp}经验，${gold}金币！`);
    const wasBoss = battle.monster.isBoss;
    if (wasBoss) player.defeatedBosses.push(battle.monster.name);
    checkLevelUp();
    sfxVictory();
    battle.result = 'win';
    battle.resultTimer = 120;
    battle.isFinalBoss = wasBoss;
  } else {
    sfxDeath();
    battle.result = 'lose';
    battle.resultTimer = 120;
  }
}

function checkLevelUp() {
  while (player.exp >= player.nextExp && player.level < 20) {
    player.exp -= player.nextExp;
    player.level++;
    player.attack += 2;
    player.defense += 1;
    player.nextExp = player.level * 10;
    recalcAccessoryBonus();
    player.hp = player.maxHp;
    player.mp = player.maxMp;
    sfxLevelUp();
    addBattleLog(`升级！现在是${player.level}级！`);
  }
}

// Shop
let shopItems = [];
let shopSelection = 0;
let shopTab = 0;

function openShop() {
  shopItems = [
    { ...weapons[0] }, { ...weapons[1] }, { ...weapons[2] },
    { ...armors[0] }, { ...armors[1] }, { ...armors[2] },
    { name: '药水', price: 15, type: 'consumable', effect: 'heal', value: 30 },
    { name: '魔力药水', price: 20, type: 'consumable', effect: 'mp', value: 15 }
  ];
  shopSelection = 0;
  shopTab = 0;
  state = GameState.SHOP;
}

// Dialog
let dialogText = '';
let dialogCallback = null;

function showDialog(text, cb) {
  dialogText = text;
  dialogCallback = cb || null;
  state = GameState.DIALOG;
}

// Chest
let chestContent = null;

function openChest(floor) {
  const rand = Math.random();
  if (rand < 0.3) {
    const g = 10 + floor * 15 + Math.floor(Math.random() * 20);
    chestContent = { type: 'gold', value: g, text: `${g}金币` };
    player.gold += g;
  } else if (rand < 0.6) {
    const potions = ['药水', '魔力药水'];
    const p = potions[Math.floor(Math.random() * potions.length)];
    chestContent = { type: 'item', value: p, text: p };
    addItem(p);
  } else {
    const equipPool = floor < 2 ? [0, 1] : floor < 4 ? [1, 2, 3] : [2, 3, 4];
    if (Math.random() < 0.5) {
      const idx = equipPool[Math.floor(Math.random() * equipPool.length)];
      const w = weapons[idx];
      chestContent = { type: 'weapon', value: w.name, text: w.name };
      addItem(w.name);
    } else {
      const idx = equipPool[Math.floor(Math.random() * equipPool.length)];
      const a = armors[Math.min(idx, armors.length - 1)];
      chestContent = { type: 'armor', value: a.name, text: a.name };
      addItem(a.name);
    }
  }
  sfxChest();
  state = GameState.CHEST;
}

function addItem(name) {
  const existing = player.inventory.find(i => i.name === name);
  if (existing && existing.type === 'consumable') {
    existing.count = (existing.count || 1) + 1;
  } else if (!existing) {
    const weapon = weapons.find(w => w.name === name);
    const armor = armors.find(a => a.name === name);
    const accessory = accessories.find(a => a.name === name);
    if (weapon) player.inventory.push({ ...weapon, type: 'weapon', count: 1 });
    else if (armor) player.inventory.push({ ...armor, type: 'armor', count: 1 });
    else if (accessory) player.inventory.push({ ...accessory, type: 'accessory', count: 1 });
    else {
      if (name === '药水') player.inventory.push({ name: '药水', type: 'consumable', effect: 'heal', value: 30, count: 1 });
      else if (name === '魔力药水') player.inventory.push({ name: '魔力药水', type: 'consumable', effect: 'mp', value: 15, count: 1 });
    }
  }
}

function recalcAccessoryBonus() {
  const hpBonus = (player.accessory === '生命戒指') ? 20 : 0;
  const mpBonus = (player.accessory === '魔力戒指') ? 15 : 0;
  const baseMaxHp = 50 + (player.level - 1) * 10;
  const baseMaxMp = 20 + (player.level - 1) * 5;
  player.maxHp = baseMaxHp + hpBonus;
  player.maxMp = baseMaxMp + mpBonus;
  player.hp = Math.min(player.hp, player.maxHp);
  player.mp = Math.min(player.mp, player.maxMp);
}

// Menu state
let menuTab = 0;
let menuSelection = 0;

// Drawing functions
function drawText(text, x, y, color, size, align) {
  ctx.fillStyle = color || '#fff';
  ctx.font = `${size || 14}px monospace`;
  ctx.textAlign = align || 'left';
  ctx.fillText(text, x, y);
}

function drawPixelChar(x, y, color, size) {
  const s = size || 16;
  ctx.fillStyle = color;
  // Body
  ctx.fillRect(x + s*0.25, y + s*0.2, s*0.5, s*0.5);
  // Head
  ctx.fillRect(x + s*0.3, y, s*0.4, s*0.3);
  // Legs
  ctx.fillRect(x + s*0.25, y + s*0.7, s*0.15, s*0.3);
  ctx.fillRect(x + s*0.6, y + s*0.7, s*0.15, s*0.3);
  // Eyes
  ctx.fillStyle = '#fff';
  ctx.fillRect(x + s*0.35, y + s*0.08, s*0.1, s*0.1);
  ctx.fillRect(x + s*0.55, y + s*0.08, s*0.1, s*0.1);
}

function drawMonster(monsterDef, x, y, size) {
  const s = size || 64;
  const c = monsterDef.color;
  ctx.fillStyle = c;
  if (monsterDef.name.includes('史莱姆')) {
    ctx.beginPath();
    ctx.ellipse(x + s/2, y + s*0.7, s*0.4, s*0.3, 0, 0, Math.PI * 2);
    ctx.fill();

// Title screen
function drawTitle() {
  ctx.fillStyle = '#112';
  ctx.fillRect(0, 0, W, H);

  // Title
  ctx.fillStyle = '#ff8';
  ctx.font = 'bold 48px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('勇者冒险', W/2, 120);

  ctx.fillStyle = '#aaa';
  ctx.font = '16px monospace';
  ctx.fillText('Hero Adventure', W/2, 160);

  // Animated stars
  const t = Date.now() / 1000;
  for (let i = 0; i < 30; i++) {
    const sx = (Math.sin(i * 3.7 + t) * 0.5 + 0.5) * W;
    const sy = (Math.cos(i * 2.3 + t * 0.7) * 0.5 + 0.5) * H;
    ctx.fillStyle = `rgba(255,255,200,${0.3 + Math.sin(t * 3 + i) * 0.3})`;
    ctx.fillRect(sx, sy, 2, 2);
  }

  // Menu
  const items = ['新游戏', '继续游戏'];
  for (let i = 0; i < items.length; i++) {
    const y = 260 + i * 50;
    if (i === titleSelection) {
      ctx.fillStyle = '#ff8';
      ctx.font = 'bold 24px monospace';
      ctx.fillText('> ' + items[i] + ' <', W/2, y);
    } else {
      ctx.fillStyle = '#888';
      ctx.font = '20px monospace';
      ctx.fillText(items[i], W/2, y);
    }
  }

  // Save info
  const save = localStorage.getItem('heroAdventure');
  if (save) {
    const data = JSON.parse(save);
    ctx.fillStyle = '#666';
    ctx.font = '12px monospace';
    ctx.fillText(`最高通关: 第${data.maxFloor || 1}层 | 总时间: ${Math.floor((data.totalTime || 0) / 60)}分钟`, W/2, 400);
  }

  ctx.fillStyle = '#555';
  ctx.font = '12px monospace';
  ctx.fillText('方向键移动 | Z确认 | X返回 | M菜单', W/2, 450);
}

// Explore screen
function drawExplore() {
  const map = maps[player.floor];
  if (!map) return;

  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, W, H);

  // Draw tiles
  const offsetX = Math.max(0, Math.min(player.x * TILE - W/2 + TILE/2, MAP_W * TILE - W));
  const offsetY = Math.max(0, Math.min(player.y * TILE - H/2 + TILE/2, MAP_H * TILE - H));

  const startX = Math.floor(offsetX / TILE);
  const startY = Math.floor(offsetY / TILE);
  const endX = Math.min(startX + Math.ceil(W / TILE) + 1, MAP_W);
  const endY = Math.min(startY + Math.ceil(H / TILE) + 1, MAP_H);

  for (let y = startY; y < endY; y++) {
    for (let x = startX; x < endX; x++) {
      const tile = map[y][x];
      const px = x * TILE - offsetX;
      const py = y * TILE - offsetY;

      ctx.fillStyle = tileColors[tile] || '#3a3';
      ctx.fillRect(px, py, TILE, TILE);

      // Tile decorations
      if (tile === TileType.WALL) {
        ctx.fillStyle = '#665';
        ctx.fillRect(px + 2, py + 2, TILE - 4, TILE - 4);
      } else if (tile === TileType.GRASS) {
        ctx.fillStyle = '#5b5';
        ctx.fillRect(px + 4, py + 8, 2, 8);
        ctx.fillRect(px + 12, py + 6, 2, 10);
        ctx.fillRect(px + 22, py + 10, 2, 6);
      } else if (tile === TileType.CHEST) {
        const key = `${player.floor},${x},${y}`;
        if (openedChests.has(key)) {
          ctx.fillStyle = '#886';
          ctx.fillRect(px + 6, py + 8, 20, 16);
        } else {
          ctx.fillStyle = '#fc4';
          ctx.fillRect(px + 6, py + 8, 20, 16);
          ctx.fillStyle = '#a80';
          ctx.fillRect(px + 6, py + 8, 20, 4);
          ctx.fillRect(px + 14, py + 14, 4, 6);
        }
      } else if (tile === TileType.STAIRS_DOWN) {
        ctx.fillStyle = '#cc4';
        ctx.fillRect(px + 8, py + 4, 16, 24);
        ctx.fillStyle = '#aa2';
        for (let s = 0; s < 4; s++) {
          ctx.fillRect(px + 8, py + 4 + s * 6, 16, 2);
        }
      } else if (tile === TileType.STAIRS_UP) {
        ctx.fillStyle = '#44c';
        ctx.fillRect(px + 8, py + 4, 16, 24);
        ctx.fillStyle = '#228';
        for (let s = 0; s < 4; s++) {
          ctx.fillRect(px + 8, py + 4 + s * 6, 16, 2);
        }
      } else if (tile === TileType.NPC) {
        ctx.fillStyle = '#f84';
        ctx.fillRect(px + 10, py + 4, 12, 20);
        ctx.fillRect(px + 12, py, 8, 8);
        ctx.fillStyle = '#fff';
        ctx.fillRect(px + 13, py + 2, 3, 3);
        ctx.fillRect(px + 18, py + 2, 3, 3);
      } else if (tile === TileType.SHOP) {
        ctx.fillStyle = '#4af';
        ctx.fillRect(px + 4, py + 4, 24, 24);
        ctx.fillStyle = '#fff';
        ctx.font = '16px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('$', px + TILE/2, py + 22);
      } else if (tile === TileType.BOSS_DOOR) {
        ctx.fillStyle = '#f44';
        ctx.fillRect(px + 4, py + 2, 24, 28);
        ctx.fillStyle = '#a00';
        ctx.fillRect(px + 8, py + 6, 16, 20);
        ctx.fillStyle = '#ff0';
        ctx.fillRect(px + 14, py + 14, 4, 6);
      }
    }
  }

  // Draw player
  const playerScreenX = player.x * TILE - offsetX;
  const playerScreenY = player.y * TILE - offsetY;
  const blinkOn = Math.floor(Date.now() / 200) % 2 === 0;
  if (blinkOn || player.hp > player.maxHp * 0.3) {
    drawPixelChar(playerScreenX + 4, playerScreenY + 4, '#4af', 24);
  }

  // Direction indicator
  ctx.fillStyle = '#fff';
  const dirX = [0, 0, 1, -1][player.dir];
  const dirY = [-1, 1, 0, 0][player.dir];
  ctx.fillRect(playerScreenX + TILE/2 - 1 + dirX * 8, playerScreenY + TILE/2 - 1 + dirY * 8, 3, 3);

  // Status bar
  ctx.fillStyle = 'rgba(0,0,0,0.8)';
  ctx.fillRect(0, H - 80, W, 80);

  ctx.textAlign = 'left';
  drawText(`Lv.${player.level} ${player.floor + 1}层`, 10, H - 60, '#ff8', 14);
  drawText(`HP: ${player.hp}/${player.maxHp}`, 10, H - 42, '#f44', 14);
  drawText(`MP: ${player.mp}/${player.maxMp}`, 10, H - 24, '#48f', 14);
  drawText(`攻击: ${player.attack + (player.weapon ? weapons.find(w => w.name === player.weapon).attack : 0)}`, 200, H - 60, '#fa4', 14);
  drawText(`防御: ${player.defense + (player.armor ? armors.find(a => a.name === player.armor).defense : 0)}`, 200, H - 42, '#4af', 14);
  drawText(`金币: ${player.gold}`, 200, H - 24, '#ff4', 14);
  drawText(`EXP: ${player.exp}/${player.nextExp}`, 380, H - 60, '#8f8', 14);
  drawText(`步数: ${player.steps}`, 380, H - 42, '#aaa', 14);

  // HP bar
  ctx.fillStyle = '#400';
  ctx.fillRect(80, H - 48, 100, 10);
  ctx.fillStyle = '#f44';
  ctx.fillRect(80, H - 48, 100 * player.hp / player.maxHp, 10);

  // MP bar
  ctx.fillStyle = '#004';
  ctx.fillRect(80, H - 30, 100, 10);
  ctx.fillStyle = '#48f';
  ctx.fillRect(80, H - 30, 100 * player.mp / player.maxMp, 10);

  // Controls hint
  drawText('M:菜单', 550, H - 50, '#666', 12);
  drawText('Z:确认 X:返回', 500, H - 30, '#666', 12);
}

// Battle screen
function drawBattle() {
  if (!battle) return;

  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, W, H);

  // Background effect for boss
  if (battle.isBoss) {
    const t = Date.now() / 1000;
    for (let i = 0; i < 20; i++) {
      const px = (Math.sin(i * 2.1 + t) * 0.5 + 0.5) * W;
      const py = (Math.cos(i * 1.7 + t * 0.5) * 0.5 + 0.5) * H;
      ctx.fillStyle = `rgba(100,0,150,${0.1 + Math.sin(t * 2 + i) * 0.1})`;
      ctx.beginPath();
      ctx.arc(px, py, 30, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Ground
  ctx.fillStyle = '#2a2a3e';
  ctx.fillRect(0, 280, W, 200);
  ctx.fillStyle = '#3a3a4e';
  for (let i = 0; i < W; i += 40) {
    ctx.fillRect(i, 280, 20, 200);
  }

  // Monster
  const shakeX = battle.shakeTimer > 0 ? (Math.random() - 0.5) * 8 : 0;
  const shakeY = battle.shakeTimer > 0 ? (Math.random() - 0.5) * 8 : 0;
  const monsterSize = battle.isBoss ? 100 : 64;
  const mx = W/2 - monsterSize/2 + shakeX;
  const my = 160 - monsterSize/2 + shakeY;
  drawMonster(battle.monster, mx, my, monsterSize);

  // Monster HP bar
  ctx.fillStyle = '#400';
  ctx.fillRect(W/2 - 80, my - 20, 160, 12);
  ctx.fillStyle = '#f44';
  ctx.fillRect(W/2 - 80, my - 20, 160 * battle.monster.currentHp / battle.monster.maxHp, 12);
  ctx.strokeStyle = '#666';
  ctx.lineWidth = 1;
  ctx.strokeRect(W/2 - 80, my - 20, 160, 12);

  drawText(battle.monster.name, W/2, my - 26, '#fff', 14, 'center');
  drawText(`${battle.monster.currentHp}/${battle.monster.maxHp}`, W/2, my - 12, '#fff', 10, 'center');

  // Player character
  drawPixelChar(120, 220, '#4af', 40);

  // Player status
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(10, 300, 250, 70);
  drawText(`Lv.${player.level} 勇者`, 20, 320, '#ff8', 14);
  drawText(`HP: ${player.hp}/${player.maxHp}`, 20, 340, '#f44', 14);
  drawText(`MP: ${player.mp}/${player.maxMp}`, 20, 358, '#48f', 14);

  // HP/MP bars
  ctx.fillStyle = '#400';
  ctx.fillRect(100, 330, 120, 10);
  ctx.fillStyle = '#f44';
  ctx.fillRect(100, 330, 120 * player.hp / player.maxHp, 10);
  ctx.fillStyle = '#004';
  ctx.fillRect(100, 348, 120, 10);
  ctx.fillStyle = '#48f';
  ctx.fillRect(100, 348, 120 * player.mp / player.maxMp, 10);

  // Battle menu
  if (battle.turn === 'player' && !battle.result) {
    ctx.fillStyle = 'rgba(0,0,0,0.8)';
    ctx.fillRect(300, 300, 330, 170);

    if (battleMenuState === 'main') {
      const actions = ['攻击', '技能', '道具', '逃跑'];
      drawText('选择行动:', 310, 320, '#ff8', 14);
      for (let i = 0; i < actions.length; i++) {
        const y = 345 + i * 30;
        if (i === battleMenuSelection) {
          drawText('> ' + actions[i], 320, y, '#ff8', 16);
        } else {
          drawText(actions[i], 340, y, '#aaa', 14);
        }
      }
    } else if (battleMenuState === 'skill') {
      drawText('技能:', 310, 320, '#ff8', 14);
      for (let i = 0; i < player.skills.length; i++) {
        const y = 345 + i * 30;
        const sk = player.skills[i];
        const canUse = player.mp >= sk.cost;
        const color = i === battleMenuSelection ? (canUse ? '#ff8' : '#f44') : (canUse ? '#aaa' : '#644');
        const prefix = i === battleMenuSelection ? '> ' : '  ';
        drawText(`${prefix}${sk.name} (${sk.cost}MP) - ${sk.desc}`, 320, y, color, 12);
      }
    } else if (battleMenuState === 'item') {
      drawText('道具:', 310, 320, '#ff8', 14);
      const items = player.inventory.filter(i => i.type === 'consumable' && i.count > 0);
      for (let i = 0; i < items.length; i++) {
        const y = 345 + i * 30;
        const item = items[i];
        const color = i === battleMenuSelection ? '#ff8' : '#aaa';
        const prefix = i === battleMenuSelection ? '> ' : '  ';
        drawText(`${prefix}${item.name} x${item.count}`, 320, y, color, 14);
      }
      if (items.length === 0) {
        drawText('没有可用道具', 320, 345, '#666', 14);
      }
    }
  }

  // Battle log
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(10, 10, 300, 80);
  for (let i = 0; i < battleLog.length; i++) {
    drawText(battleLog[i], 20, 28 + i * 12, '#ccc', 11);
  }

  // Damage numbers
  for (const dn of battle.damageNumbers) {
    ctx.globalAlpha = Math.min(1, dn.timer / 20);
    drawText(dn.text, dn.x, dn.y - dn.offsetY, dn.color, 20, 'center');
    ctx.globalAlpha = 1;
  }

  // Battle result
  if (battle.result) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    if (battle.result === 'win') {
      drawText('战斗胜利！', W/2, H/2 - 30, '#ff8', 32, 'center');
      drawText('按Z继续', W/2, H/2 + 20, '#aaa', 16, 'center');
    } else {
      drawText('你被击败了...', W/2, H/2 - 30, '#f44', 32, 'center');
      drawText('按Z回到标题', W/2, H/2 + 20, '#aaa', 16, 'center');
    }
  }
}

// Menu screen
function drawMenu() {
  ctx.fillStyle = 'rgba(0,0,20,0.95)';
  ctx.fillRect(0, 0, W, H);

  drawText('== 菜单 ==', W/2, 30, '#ff8', 24, 'center');

  const tabs = ['状态', '装备', '道具'];
  for (let i = 0; i < tabs.length; i++) {
    const x = 50 + i * 200;
    const color = i === menuTab ? '#ff8' : '#666';
    drawText(tabs[i], x, 60, color, 18);
    if (i === menuTab) {
      ctx.fillStyle = '#ff8';
      ctx.fillRect(x, 65, ctx.measureText(tabs[i]).width, 2);
    }
  }

  ctx.fillStyle = 'rgba(255,255,255,0.1)';
  ctx.fillRect(20, 80, W - 40, 360);

  if (menuTab === 0) {
    // Status
    const weaponBonus = player.weapon ? weapons.find(w => w.name === player.weapon).attack : 0;
    const armorBonus = player.armor ? armors.find(a => a.name === player.armor).defense : 0;
    drawText(`等级: ${player.level}`, 50, 120, '#fff', 16);
    drawText(`经验: ${player.exp}/${player.nextExp}`, 50, 150, '#8f8', 16);
    drawText(`HP: ${player.hp}/${player.maxHp}`, 50, 180, '#f44', 16);
    drawText(`MP: ${player.mp}/${player.maxMp}`, 50, 210, '#48f', 16);
    drawText(`攻击力: ${player.attack} (+${weaponBonus})`, 50, 240, '#fa4', 16);
    drawText(`防御力: ${player.defense} (+${armorBonus})`, 50, 270, '#4af', 16);
    drawText(`暴击率: ${Math.floor((player.critRate + (player.accessory === '幸运戒指' ? 0.05 : 0)) * 100)}%`, 50, 300, '#f4f', 16);
    drawText(`金币: ${player.gold}`, 50, 330, '#ff4', 16);
    drawText(`当前层: ${player.floor + 1}`, 50, 360, '#aaa', 16);

    drawText(`武器: ${player.weapon || '无'}`, 350, 120, '#fa4', 16);
    drawText(`护甲: ${player.armor || '无'}`, 350, 150, '#4af', 16);
    drawText(`饰品: ${player.accessory || '无'}`, 350, 180, '#f4f', 16);

    drawText('已击败Boss:', 350, 230, '#f84', 16);
    if (player.defeatedBosses.length === 0) drawText('暂无', 350, 260, '#666', 14);
    player.defeatedBosses.forEach((b, i) => drawText(b, 350, 260 + i * 25, '#f84', 14));
  } else if (menuTab === 1) {
    // Equipment
    drawText('选择装备 (Z装备/卸下, X返回)', 50, 110, '#aaa', 12);

    const equipItems = player.inventory.filter(i => i.type === 'weapon' || i.type === 'armor' || i.type === 'accessory');
    const allEquipSlots = [
      { label: `武器: ${player.weapon || '无'}`, type: 'weapon', equipped: player.weapon },
      { label: `护甲: ${player.armor || '无'}`, type: 'armor', equipped: player.armor },
      { label: `饰品: ${player.accessory || '无'}`, type: 'accessory', equipped: player.accessory }
    ];

    for (let i = 0; i < allEquipSlots.length; i++) {
      const y = 140 + i * 30;
      const color = i === menuSelection ? '#ff8' : '#aaa';
      const prefix = i === menuSelection ? '> ' : '  ';
      drawText(`${prefix}${allEquipSlots[i].label}`, 50, y, color, 14);
    }

    // Show available equipment below
    const available = equipItems.filter(item => {
      if (item.type === 'weapon') return item.name !== player.weapon;
      if (item.type === 'armor') return item.name !== player.armor;
      if (item.type === 'accessory') return item.name !== player.accessory;
      return false;
    });

    drawText('背包中的装备:', 50, 260, '#ff8', 14);
    for (let i = 0; i < available.length; i++) {
      const y = 290 + i * 25;
      const item = available[i];
      let desc = '';
      if (item.type === 'weapon') desc = `攻击+${item.attack}`;
      else if (item.type === 'armor') desc = `防御+${item.defense}`;
      else if (item.type === 'accessory') {
        if (item.stat === 'hp') desc = `HP+${item.value}`;
        else if (item.stat === 'mp') desc = `MP+${item.value}`;
        else if (item.stat === 'crit') desc = `暴击+${Math.floor(item.value*100)}%`;
      }
      drawText(`${item.name} (${desc}) x${item.count || 1}`, 70, y, '#ccc', 12);
    }
    if (available.length === 0) drawText('暂无', 70, 290, '#666', 12);
  } else if (menuTab === 2) {
    // Items
    drawText('道具 (Z使用)', 50, 110, '#aaa', 12);
    const items = player.inventory.filter(i => i.type === 'consumable');
    for (let i = 0; i < items.length; i++) {
      const y = 150 + i * 30;
      const item = items[i];
      const color = i === menuSelection ? '#ff8' : '#aaa';
      const prefix = i === menuSelection ? '> ' : '  ';
      drawText(`${prefix}${item.name} x${item.count} - ${item.effect === 'heal' ? '恢复HP' : '恢复MP'}${item.value}`, 50, y, color, 14);
    }
    if (items.length === 0) drawText('没有道具', 50, 150, '#666', 14);
  }

  drawText('X:返回', W - 100, H - 20, '#666', 12);
}

// Shop screen
function drawShop() {
  ctx.fillStyle = 'rgba(0,0,30,0.95)';
  ctx.fillRect(0, 0, W, H);

  drawText('== 商店 ==', W/2, 30, '#4af', 24, 'center');
  drawText(`金币: ${player.gold}`, W/2, 55, '#ff4', 14, 'center');

  for (let i = 0; i < shopItems.length; i++) {
    const y = 90 + i * 35;
    const item = shopItems[i];
    const canBuy = player.gold >= item.price;
    const color = i === shopSelection ? (canBuy ? '#ff8' : '#f44') : (canBuy ? '#aaa' : '#644');
    const prefix = i === shopSelection ? '> ' : '  ';
    let desc = '';
    if (item.attack) desc = `攻击+${item.attack}`;
    else if (item.defense) desc = `防御+${item.defense}`;
    else if (item.effect === 'heal') desc = `恢复${item.value}HP`;
    else if (item.effect === 'mp') desc = `恢复${item.value}MP`;
    drawText(`${prefix}${item.name} ${desc} - ${item.price}G`, 80, y, color, 14);
  }

  drawText('Z:购买 X:离开', W/2, H - 30, '#666', 12, 'center');
}

// Victory screen
function drawVictory() {
  ctx.fillStyle = '#110';
  ctx.fillRect(0, 0, W, H);

  const t = Date.now() / 1000;
  for (let i = 0; i < 40; i++) {
    const px = (Math.sin(i * 1.3 + t) * 0.5 + 0.5) * W;
    const py = (Math.cos(i * 2.1 + t * 0.8) * 0.5 + 0.5) * H;
    ctx.fillStyle = `rgba(255,215,0,${0.2 + Math.sin(t * 3 + i) * 0.2})`;
    ctx.beginPath();
    ctx.arc(px, py, 5 + Math.sin(t + i) * 3, 0, Math.PI * 2);
    ctx.fill();
  }

  drawText('恭喜通关！', W/2, H/2 - 80, '#ff8', 40, 'center');
  drawText('你击败了暗影龙，拯救了王国！', W/2, H/2 - 30, '#fc4', 18, 'center');
  drawText(`等级: ${player.level} | 步数: ${player.steps}`, W/2, H/2 + 20, '#aaa', 16, 'center');
  drawText(`金币: ${player.gold} | 时间: ${Math.floor(player.totalTime / 60)}分`, W/2, H/2 + 50, '#aaa', 16, 'center');
  drawText('按Z回到标题', W/2, H/2 + 100, '#888', 16, 'center');
}

// Save/Load
function saveGame() {
  const data = {
    player: { ...player },
    openedChests: Array.from(openedChests),
    maps: maps,
    maxFloor: Math.max(player.floor + 1, parseInt(localStorage.getItem('heroAdventure') ? JSON.parse(localStorage.getItem('heroAdventure')).maxFloor || 1 : 1)),
    totalTime: player.totalTime
  };
  localStorage.setItem('heroAdventureSave', JSON.stringify(data));

  const stats = {
    maxFloor: data.maxFloor,
    totalTime: data.totalTime
  };
  localStorage.setItem('heroAdventure', JSON.stringify(stats));
}

function loadGame() {
  const saveStr = localStorage.getItem('heroAdventureSave');
  if (!saveStr) return false;
  try {
    const data = JSON.parse(saveStr);
    player = { ...createPlayer(), ...data.player };
    openedChests = new Set(data.openedChests || []);
    if (data.maps && data.maps.length === 5) {
      maps = data.maps;
    } else {
      initMaps();
    }
    recalcAccessoryBonus();
    return true;
  } catch (e) {
    return false;
  }
}

// Input handling
const keys = {};
let keyPressed = {};
document.addEventListener('keydown', (e) => {
  keys[e.key] = true;
  keyPressed[e.key] = true;
  handleInput();
});
document.addEventListener('keyup', (e) => {
  keys[e.key] = false;
});

// Touch controls
const activeTouches = new Map();
if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
  document.getElementById('touch-controls').style.display = 'block';
}
document.addEventListener('touchstart', (e) => {
  for (const touch of e.changedTouches) {
    const el = document.elementFromPoint(touch.clientX, touch.clientY);
    if (!el || !el.dataset.key) continue;
    const key = el.dataset.key;
    keys[key] = true;
    keyPressed[key] = true;
    el.classList.add('pressed');
    activeTouches.set(touch.identifier, el);
    handleInput();
  }
  e.preventDefault();
}, { passive: false });
document.addEventListener('touchend', (e) => {
  for (const touch of e.changedTouches) {
    const el = activeTouches.get(touch.identifier);
    if (!el) continue;
    keys[el.dataset.key] = false;
    el.classList.remove('pressed');
    activeTouches.delete(touch.identifier);
  }
  e.preventDefault();
}, { passive: false });
document.addEventListener('touchcancel', (e) => {
  for (const touch of e.changedTouches) {
    const el = activeTouches.get(touch.identifier);
    if (!el) continue;
    keys[el.dataset.key] = false;
    el.classList.remove('pressed');
    activeTouches.delete(touch.identifier);
  }
});

let moveTimer = 0;
const MOVE_DELAY = 150;

function handleInput() {
  if (state === GameState.TITLE) {
    if (keyPressed['ArrowUp'] || keyPressed['w']) { titleSelection = Math.max(0, titleSelection - 1); sfxMove(); }
    if (keyPressed['ArrowDown'] || keyPressed['s']) { titleSelection = Math.min(1, titleSelection + 1); sfxMove(); }
    if (keyPressed['z'] || keyPressed['Z'] || keyPressed['Enter']) {
      initAudio();
      if (titleSelection === 0) {
        player = createPlayer();
        initMaps();
        state = GameState.EXPLORE;
        showDialog('欢迎来到勇者冒险！\n探索地牢，击败暗影龙拯救王国！\n方向键/WASD移动，Z确认，X返回');
      } else {
        if (loadGame()) {
          state = GameState.EXPLORE;
        } else {
          player = createPlayer();
          initMaps();
          state = GameState.EXPLORE;
        }
      }
    }
  } else if (state === GameState.EXPLORE) {
    if (keyPressed['m'] || keyPressed['M']) {
      menuTab = 0;
      menuSelection = 0;
      state = GameState.MENU;
    }
  } else if (state === GameState.BATTLE) {
    if (battle && battle.result) {
      if (keyPressed['z'] || keyPressed['Z'] || keyPressed['Enter']) {
        if (battle.result === 'win') {
          if (battle.isFinalBoss) {
            state = GameState.VICTORY;
            saveGame();
          } else {
            state = GameState.EXPLORE;
          }
          battle = null;
        } else {
          state = GameState.GAMEOVER;
          battle = null;
        }
      }
      return;
    }
    if (battle && battle.turn === 'player') {
      if (battleMenuState === 'main') {
        if (keyPressed['ArrowUp'] || keyPressed['w']) { battleMenuSelection = Math.max(0, battleMenuSelection - 1); sfxMove(); }
        if (keyPressed['ArrowDown'] || keyPressed['s']) { battleMenuSelection = Math.min(3, battleMenuSelection + 1); sfxMove(); }
        if (keyPressed['z'] || keyPressed['Z'] || keyPressed['Enter']) {
          if (battleMenuSelection === 0) {
            // Attack
            playerAttack();
            if (battle.monster.currentHp <= 0) { endBattle(true); return; }
            battle.turn = 'monster';
            setTimeout(() => {
              monsterAttack();
              if (player.hp <= 0) { endBattle(false); return; }
              battle.turn = 'player';
            }, 800);
          } else if (battleMenuSelection === 1) {
            battleMenuState = 'skill';
            battleMenuSelection = 0;
          } else if (battleMenuSelection === 2) {
            battleMenuState = 'item';
            battleMenuSelection = 0;
          } else if (battleMenuSelection === 3) {
            // Escape
            if (battle.isBoss) {
              addBattleLog('无法从Boss战中逃跑！');
              battle.turn = 'monster';
              setTimeout(() => {
                monsterAttack();
                if (player.hp <= 0) { endBattle(false); return; }
                battle.turn = 'player';
              }, 800);
            } else if (Math.random() < 0.5) {
              sfxEscape();
              addBattleLog('逃跑成功！');
              state = GameState.EXPLORE;
              battle = null;
            } else {
              addBattleLog('逃跑失败！');
              battle.turn = 'monster';
              setTimeout(() => {
                monsterAttack();
                if (player.hp <= 0) { endBattle(false); return; }
                battle.turn = 'player';
              }, 800);
            }
          }
        }
        if (keyPressed['x'] || keyPressed['X']) { /* nothing on main */ }
      } else if (battleMenuState === 'skill') {
        if (keyPressed['ArrowUp'] || keyPressed['w']) { battleMenuSelection = Math.max(0, battleMenuSelection - 1); sfxMove(); }
        if (keyPressed['ArrowDown'] || keyPressed['s']) { battleMenuSelection = Math.min(player.skills.length - 1, battleMenuSelection + 1); sfxMove(); }
        if (keyPressed['z'] || keyPressed['Z'] || keyPressed['Enter']) {
          const skill = player.skills[battleMenuSelection];
          if (player.mp >= skill.cost) {
            player.mp -= skill.cost;
            if (battleMenuSelection === 0) {
              // Slash
              playerAttack(false, 1.5);
            } else if (battleMenuSelection === 1) {
              // Defend
              playerDefending = true;
              addBattleLog('防御力提升！');
              sfxHeal();
            } else if (battleMenuSelection === 2) {
              // Heal
              const healAmount = Math.floor(player.maxHp * 0.2);
              player.hp = Math.min(player.maxHp, player.hp + healAmount);
              addBattleLog(`恢复了${healAmount}HP！`);
              sfxHeal();
              addDamageNum(160, 200, `+${healAmount}`, '#4f4');
            } else if (battleMenuSelection === 3) {
              // Critical
              playerAttack(true, 2);
            }
            if (battle.monster.currentHp <= 0) { endBattle(true); return; }
            battle.turn = 'monster';
            setTimeout(() => {
              monsterAttack();
              if (player.hp <= 0) { endBattle(false); return; }
              battle.turn = 'player';
            }, 800);
            battleMenuState = 'main';
          } else {
            addBattleLog('MP不足！');
          }
        }
        if (keyPressed['x'] || keyPressed['X']) { battleMenuState = 'main'; battleMenuSelection = 0; }
      } else if (battleMenuState === 'item') {
        const items = player.inventory.filter(i => i.type === 'consumable' && i.count > 0);
        if (keyPressed['ArrowUp'] || keyPressed['w']) { battleMenuSelection = Math.max(0, battleMenuSelection - 1); sfxMove(); }
        if (keyPressed['ArrowDown'] || keyPressed['s']) { battleMenuSelection = Math.min(items.length - 1, battleMenuSelection + 1); sfxMove(); }
        if (keyPressed['z'] || keyPressed['Z'] || keyPressed['Enter']) {
          if (items.length > 0 && battleMenuSelection < items.length) {
            const item = items[battleMenuSelection];
            if (item.effect === 'heal') {
              player.hp = Math.min(player.maxHp, player.hp + item.value);
              addBattleLog(`使用${item.name}，恢复${item.value}HP！`);
              addDamageNum(160, 200, `+${item.value}`, '#4f4');
            } else if (item.effect === 'mp') {
              player.mp = Math.min(player.maxMp, player.mp + item.value);
              addBattleLog(`使用${item.name}，恢复${item.value}MP！`);
              addDamageNum(160, 200, `+${item.value}`, '#48f');
            }
            sfxHeal();
            item.count--;
            if (item.count <= 0) {
              const idx = player.inventory.indexOf(item);
              if (idx >= 0) player.inventory.splice(idx, 1);
            }
            battle.turn = 'monster';
            setTimeout(() => {
              monsterAttack();
              if (player.hp <= 0) { endBattle(false); return; }
              battle.turn = 'player';
            }, 800);
            battleMenuState = 'main';
          }
        }
        if (keyPressed['x'] || keyPressed['X']) { battleMenuState = 'main'; battleMenuSelection = 0; }
      }
    }
  } else if (state === GameState.MENU) {
    if (keyPressed['x'] || keyPressed['X']) { state = GameState.EXPLORE; }
    if (keyPressed['ArrowLeft'] || keyPressed['a']) { menuTab = Math.max(0, menuTab - 1); menuSelection = 0; sfxMove(); }
    if (keyPressed['ArrowRight'] || keyPressed['d']) { menuTab = Math.min(2, menuTab + 1); menuSelection = 0; sfxMove(); }
    if (keyPressed['ArrowUp'] || keyPressed['w']) { menuSelection = Math.max(0, menuSelection - 1); sfxMove(); }
    if (keyPressed['ArrowDown'] || keyPressed['s']) {
      let maxSel = 0;
      if (menuTab === 0) maxSel = 0;
      else if (menuTab === 1) maxSel = 2 + player.inventory.filter(i => i.type === 'weapon' || i.type === 'armor' || i.type === 'accessory').length;
      else if (menuTab === 2) maxSel = player.inventory.filter(i => i.type === 'consumable').length - 1;
      menuSelection = Math.min(maxSel, menuSelection + 1);
      sfxMove();
    }

    if (keyPressed['z'] || keyPressed['Z'] || keyPressed['Enter']) {
      if (menuTab === 1) {
        // Equipment
        const equipSlots = ['weapon', 'armor', 'accessory'];
        const available = player.inventory.filter(i => i.type === 'weapon' || i.type === 'armor' || i.type === 'accessory');
        if (menuSelection < 3) {
          const slot = equipSlots[menuSelection];
          const current = player[slot];
          if (current) {
            addItem(current);
            player[slot] = null;
            recalcAccessoryBonus();
          }
        } else {
          const itemIdx = menuSelection - 3;
          if (itemIdx < available.length) {
            const item = available[itemIdx];
            let slot = null;
            if (item.type === 'weapon') slot = 'weapon';
            else if (item.type === 'armor') slot = 'armor';
            else if (item.type === 'accessory') slot = 'accessory';
            if (slot) {
              if (player[slot]) addItem(player[slot]);
              player[slot] = item.name;
              item.count = (item.count || 1) - 1;
              if (item.count <= 0) {
                const idx = player.inventory.indexOf(item);
                if (idx >= 0) player.inventory.splice(idx, 1);
              }
              recalcAccessoryBonus();
            }
          }
        }
      } else if (menuTab === 2) {
        const items = player.inventory.filter(i => i.type === 'consumable');
        if (items.length > 0 && menuSelection < items.length) {
          const item = items[menuSelection];
          if (item.effect === 'heal') {
            player.hp = Math.min(player.maxHp, player.hp + item.value);
            sfxHeal();
          } else if (item.effect === 'mp') {
            player.mp = Math.min(player.maxMp, player.mp + item.value);
            sfxHeal();
          }
          item.count--;
          if (item.count <= 0) {
            const idx = player.inventory.indexOf(item);
            if (idx >= 0) player.inventory.splice(idx, 1);
          }
        }
      }
    }
  } else if (state === GameState.SHOP) {
    if (keyPressed['ArrowUp'] || keyPressed['w']) { shopSelection = Math.max(0, shopSelection - 1); sfxMove(); }
    if (keyPressed['ArrowDown'] || keyPressed['s']) { shopSelection = Math.min(shopItems.length - 1, shopSelection + 1); sfxMove(); }
    if (keyPressed['z'] || keyPressed['Z'] || keyPressed['Enter']) {
      const item = shopItems[shopSelection];
      if (player.gold >= item.price) {
        player.gold -= item.price;
        addItem(item.name);
        sfxChest();
        showDialog(`购买了${item.name}！`);
      } else {
        showDialog('金币不足！');
      }
    }
    if (keyPressed['x'] || keyPressed['X']) { state = GameState.EXPLORE; }
  } else if (state === GameState.DIALOG) {
    if (keyPressed['z'] || keyPressed['Z'] || keyPressed['Enter']) {
      state = GameState.EXPLORE;
      if (dialogCallback) dialogCallback();
    }
  } else if (state === GameState.CHEST) {
    if (keyPressed['z'] || keyPressed['Z'] || keyPressed['Enter']) {
      state = GameState.EXPLORE;
    }
  } else if (state === GameState.GAMEOVER) {
    if (keyPressed['z'] || keyPressed['Z'] || keyPressed['Enter']) {
      state = GameState.TITLE;
    }
  } else if (state === GameState.VICTORY) {
    if (keyPressed['z'] || keyPressed['Z'] || keyPressed['Enter']) {
      state = GameState.TITLE;
    }
  }

  keyPressed = {};
}

// Movement and exploration logic
function updateExplore(dt) {
  if (state !== GameState.EXPLORE) return;

  moveTimer -= dt;
  if (moveTimer > 0) return;

  let dx = 0, dy = 0;
  if (keys['ArrowUp'] || keys['w']) { dy = -1; player.dir = 0; }
  else if (keys['ArrowDown'] || keys['s']) { dy = 1; player.dir = 1; }
  else if (keys['ArrowRight'] || keys['d']) { dx = 1; player.dir = 2; }
  else if (keys['ArrowLeft'] || keys['a']) { dx = -1; player.dir = 3; }

  if (dx !== 0 || dy !== 0) {
    const nx = player.x + dx;
    const ny = player.y + dy;
    const map = maps[player.floor];

    if (nx >= 0 && nx < MAP_W && ny >= 0 && ny < MAP_H) {
      const tile = map[ny][nx];

      if (tile !== TileType.WALL) {
        player.x = nx;
        player.y = ny;
        player.steps++;
        moveTimer = MOVE_DELAY;
        sfxMove();

        // Tile interactions
        if (tile === TileType.STAIRS_DOWN) {
          if (player.floor < 4) {
            showDialog(`进入第${player.floor + 2}层地牢...`, () => {
              player.floor++;
              player.x = 2;
              player.y = 2;
              saveGame();
            });
          }
        } else if (tile === TileType.STAIRS_UP) {
          if (player.floor > 0) {
            showDialog(`返回第${player.floor}层...`, () => {
              player.floor--;
              player.x = 2;
              player.y = 2;
            });
          }
        } else if (tile === TileType.CHEST) {
          const chestKey = `${player.floor},${nx},${ny}`;
          if (!openedChests.has(chestKey)) {
            openedChests.add(chestKey);
            openChest(player.floor);
            map[ny][nx] = TileType.FLOOR;
          }
        } else if (tile === TileType.NPC) {
          if (player.floor === 1 && !player.quests.npc1) {
            player.quests.npc1 = true;
            showDialog('老者: "勇者啊，前方危险重重。\n带上这些药水，祝你好运！"\n获得2瓶药水！');
            addItem('药水');
            addItem('药水');
          } else if (player.floor === 1) {
            showDialog('老者: "祝你好运，勇者！"');
          }
        } else if (tile === TileType.SHOP) {
          openShop();
        } else if (tile === TileType.BOSS_DOOR) {
          showDialog('前方是强大的暗影龙！\n做好准备了吗？', () => {
            const boss = monsterDefs.find(m => m.isBoss);
            startBattle(boss);
          });
        }

        // Random encounter on grass
        if (tile === TileType.GRASS && Math.random() < 0.08) {
          const floorMons = monsterDefs.filter(m => m.floor === player.floor && !m.isBoss);
          if (floorMons.length > 0) {
            const mon = floorMons[Math.floor(Math.random() * floorMons.length)];
            startBattle(mon);
          }
        }
        // Random encounter on floor (lower rate)
        if (tile === TileType.FLOOR && Math.random() < 0.03) {
          const floorMons = monsterDefs.filter(m => m.floor === player.floor && !m.isBoss);
          if (floorMons.length > 0) {
            const mon = floorMons[Math.floor(Math.random() * floorMons.length)];
            startBattle(mon);
          }
        }
      }
    }
  }
}

// Battle animations update
function updateBattle(dt) {
  if (!battle) return;

  battle.shakeTimer = Math.max(0, battle.shakeTimer - 1);

  for (let i = battle.damageNumbers.length - 1; i >= 0; i--) {
    battle.damageNumbers[i].timer--;
    battle.damageNumbers[i].offsetY += 0.5;
    if (battle.damageNumbers[i].timer <= 0) {
      battle.damageNumbers.splice(i, 1);
    }
  }
}

// Main game loop
let lastTime = 0;
let gameTime = 0;

function gameLoop(timestamp) {
  const dt = timestamp - lastTime;
  lastTime = timestamp;
  gameTime += dt;

  if (player) player.totalTime = Math.floor(gameTime / 1000);

  updateExplore(dt);
  updateBattle(dt);

  // Draw
  ctx.clearRect(0, 0, W, H);

  switch (state) {
    case GameState.TITLE: drawTitle(); break;
    case GameState.EXPLORE: drawExplore(); break;
    case GameState.BATTLE: drawBattle(); break;
    case GameState.MENU: drawMenu(); break;
    case GameState.SHOP: drawShop(); break;
    case GameState.DIALOG: drawDialog(); break;
    case GameState.CHEST: drawChest(); break;
    case GameState.GAMEOVER: drawGameOver(); break;
    case GameState.VICTORY: drawVictory(); break;
  }

  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
