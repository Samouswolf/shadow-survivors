<script>
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
const W=400,H=500;
cv.width=W;cv.height=H;

function resizeCanvas(){
    const maxW=window.innerWidth-20;
    if(W>maxW){
        cv.style.width=maxW+'px';
        cv.style.height=(H*maxW/W)+'px';
    }else{
        cv.style.width='';
        cv.style.height='';
    }
}
window.addEventListener('resize',resizeCanvas);
resizeCanvas();

// 洞口布局 (3x3)
const HOLES=[
    {x:80,y:180},{x:200,y:180},{x:320,y:180},
    {x:80,y:280},{x:200,y:280},{x:320,y:280},
    {x:80,y:380},{x:200,y:380},{x:320,y:380}
];

// 地鼠类型
const MOLE_TYPES={
    normal:{emoji:'🐹',score:10,color:'#8B4513'},
    gold:{emoji:'⭐',score:30,color:'#FFD700'},
    bomb:{emoji:'💣',score:-20,color:'#FF0000'}
};

// 游戏状态
let G={
    state:'menu',
    score:0,
    time:30,
    moles:[], // {hole,type,showTime,maxShow,hit}
    particles:[],
    texts:[],
    spawnTimer:0,
    combo:0,
    hits:0,
    misses:0
};

let paused=false;

// 初始化游戏
function initGame(){
    G.state='playing';
    G.score=0;
    G.time=30;
    G.moles=[];
    G.particles=[];
    G.texts=[];
    G.spawnTimer=0;
    G.combo=0;
    G.hits=0;
    G.misses=0;

    // 初始化所有洞口无地鼠
    for(let i=0;i<HOLES.length;i++){
        G.moles.push(null);
    }

    document.getElementById('startScreen').style.display='none';
    document.getElementById('pauseBtn').style.display='block';
}

// 生成地鼠
function spawnMole(){
    // 找空洞
    const emptyHoles=[];
    for(let i=0;i<G.moles.length;i++){
        if(!G.moles[i])emptyHoles.push(i);
    }

    if(emptyHoles.length===0)return;

    const holeIdx=emptyHoles[Math.floor(Math.random()*emptyHoles.length)];

    // 随机类型
    const rand=Math.random();
    let type='normal';
    if(rand<0.15)type='gold';
    else if(rand<0.25)type='bomb';

    G.moles[holeIdx]={
        type:type,
        showTime:0,
        maxShow:type==='gold'?40:60, // 金色地鼠出现时间短
        hit:false,
        hitAnim:0
    };
}

// 创建粒子
function createParticles(x,y,color,count){
    for(let i=0;i<count;i++){
        G.particles.push({
            x:x,
            y:y,
            vx:(Math.random()-0.5)*8,
            vy:(Math.random()-0.5)*8-2,
            size:Math.random()*6+2,
            color:color,
            life:20+Math.random()*15
        });
    }
}

// 显示得分文字
function showScoreText(x,y,text,color){
    G.texts.push({
        x:x,
        y:y,
        text:text,
        color:color,
        life:40,
        vy:-2
    });
}

// 点击地鼠
function hitMole(holeIdx){
    const mole=G.moles[holeIdx];
    if(!mole||mole.hit)return;

    const hole=HOLES[holeIdx];
    const type=MOLE_TYPES[mole.type];

    mole.hit=true;
    mole.hitAnim=15;

    if(mole.type==='bomb'){
        // 炸弹
        G.score=Math.max(0,G.score+type.score);
        G.combo=0;
        createParticles(hole.x,hole.y,'#FF0000',15);
        showScoreText(hole.x,hole.y-30,type.score+'','#FF0000');
    }else{
        // 普通/金色
        G.hits++;
        G.combo++;
        const comboBonus=Math.min(G.combo,5);
        sfxScore();G.score+=type.score*comboBonus;
        createParticles(hole.x,hole.y,type.color,10);
        showScoreText(hole.x,hole.y-30,'+'+type.score*comboBonus,type.color);

        if(G.combo>=3){
            showScoreText(hole.x,hole.y-55,G.combo+'连击!','#FFD700');
        }
    }
}

// 更新游戏
function update(){
    if(G.state!=='playing'||paused)return;

    // 更新时间
    G.time-=1/60;
    if(G.time<=0){
        G.time=0;
        sfxLose();setHighScore(G.score);G.state='over';
        return;
    }

    // 生成地鼠
    G.spawnTimer++;
    const spawnRate=Math.max(20,50-G.time); // 越来越快
    if(G.spawnTimer>=spawnRate){
        G.spawnTimer=0;
        spawnMole();
    }

    // 更新地鼠
    for(let i=0;i<G.moles.length;i++){
        const mole=G.moles[i];
        if(!mole)continue;

        if(mole.hit){
            mole.hitAnim--;
            if(mole.hitAnim<=0){
                G.moles[i]=null;
            }
        }else{
            mole.showTime++;
            if(mole.showTime>=mole.maxShow){
                // 超时消失
                if(mole.type!=='bomb'){
                    G.combo=0; // 漏掉断连击
                }
                G.moles[i]=null;
            }
        }
    }

    // 更新粒子
    for(let i=G.particles.length-1;i>=0;i--){
        const p=G.particles[i];
        p.x+=p.vx;
        p.y+=p.vy;
        p.vy+=0.2;
        p.life--;
        if(p.life<=0){
            G.particles.splice(i,1);
        }
    }

    // 更新文字
    for(let i=G.texts.length-1;i>=0;i--){
        const t=G.texts[i];
        t.y+=t.vy;
        t.life--;
        if(t.life<=0){
            G.texts.splice(i,1);
        }
    }
}

// 绘制游戏
function render(){
    // 背景
    ctx.fillStyle='#2d1b00';
    ctx.fillRect(0,0,W,H);

    // 草地
    const gradient=ctx.createLinearGradient(0,100,0,H);
    gradient.addColorStop(0,'#4a6600');
    gradient.addColorStop(1,'#2d4400');
    ctx.fillStyle=gradient;
    ctx.fillRect(0,100,W,H-100);

    // 绘制洞口和地鼠
    for(let i=0;i<HOLES.length;i++){
        const hole=HOLES[i];
        const mole=G.moles[i];

        // 洞口阴影
        ctx.fillStyle='rgba(0,0,0,0.4)';
        ctx.beginPath();
        ctx.ellipse(hole.x,hole.y+10,40,15,0,0,Math.PI*2);
        ctx.fill();

        // 洞口
        ctx.fillStyle='#1a0f00';
        ctx.beginPath();
        ctx.ellipse(hole.x,hole.y,40,15,0,0,Math.PI*2);
        ctx.fill();

        // 洞口边缘
        ctx.strokeStyle='#3a2500';
        ctx.lineWidth=3;
        ctx.stroke();

        // 地鼠
        if(mole){
            const type=MOLE_TYPES[mole.type];
            let yOffset=0;
            let alpha=1;

            if(mole.hit){
                // 被打中动画
                yOffset=-10;
                alpha=mole.hitAnim/15;
            }else{
                // 出现动画
                const progress=Math.min(1,mole.showTime/10);
                yOffset=-30*progress;

                // 消失动画
                if(mole.showTime>mole.maxShow-10){
                    const fadeProgress=(mole.maxShow-mole.showTime)/10;
                    yOffset=-30*fadeProgress;
                }
            }

            ctx.globalAlpha=alpha;

            // 地鼠身体
            ctx.fillStyle=type.color;
            ctx.beginPath();
            ctx.arc(hole.x,hole.y+yOffset,25,0,Math.PI*2);
            ctx.fill();

            // 地鼠表情
            ctx.font='30px serif';
            ctx.textAlign='center';
            ctx.textBaseline='middle';
            ctx.fillText(type.emoji,hole.x,hole.y+yOffset);

            ctx.globalAlpha=1;
        }
    }

    // 绘制粒子
    for(const p of G.particles){
        ctx.globalAlpha=p.life/35;
        ctx.fillStyle=p.color;
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
        ctx.fill();
    }
    ctx.globalAlpha=1;

    // 绘制文字
    for(const t of G.texts){
        ctx.globalAlpha=t.life/40;
        ctx.font='bold 18px Microsoft YaHei';
        ctx.fillStyle=t.color;
        ctx.textAlign='center';
        ctx.fillText(t.text,t.x,t.y);
    }
    ctx.globalAlpha=1;

    // HUD
    ctx.fillStyle='#fff';
    ctx.font='bold 20px Microsoft YaHei';
    ctx.textAlign='left';
    ctx.fillText('得分: '+G.score,10,30);

    ctx.textAlign='center';
    ctx.fillStyle=G.time<10?'#ff4444':'#fff';
    ctx.fillText(Math.ceil(G.time)+'秒',W/2,30);

    if(G.combo>=2){
        ctx.textAlign='right';
        ctx.fillStyle='#FFD700';
        ctx.fillText(G.combo+'连击',W-10,30);
    }

    // 游戏结束
    if(G.state==='over'){
        ctx.fillStyle='rgba(0,0,0,0.7)';
        ctx.fillRect(0,0,W,H);

        ctx.fillStyle='#ffaa00';
        ctx.font='bold 36px Microsoft YaHei';
        ctx.textAlign='center';
        ctx.fillText('游戏结束!',W/2,H/2-60);

        ctx.fillStyle='#fff';
        ctx.font='20px Microsoft YaHei';
        ctx.fillText('最终得分: '+G.score,W/2,H/2-10);
        ctx.fillText('命中: '+G.hits+' 次',W/2,H/2+20);

        ctx.fillStyle='#88cc44';
        ctx.font='18px Microsoft YaHei';
        ctx.fillText('点击重新开始',W/2,H/2+70);
    }
}

// 主循环
function gameLoop(){
    update();
    render();
    requestAnimationFrame(gameLoop);
}

// 获取点击的洞口
function getHole(x,y){
    for(let i=0;i<HOLES.length;i++){
        const hole=HOLES[i];
        const dx=x-hole.x;
        const dy=y-hole.y;
        const dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<45)return i;
    }
    return -1;
}

// 事件绑定
cv.addEventListener('click',(e)=>{
    const rect=cv.getBoundingClientRect();
    const x=(e.clientX-rect.left)*(W/rect.width);
    const y=(e.clientY-rect.top)*(H/rect.height);

    if(G.state==='over'){
        initGame();
        return;
    }

    if(G.state!=='playing')return;

    const holeIdx=getHole(x,y);
    if(holeIdx>=0){
        hitMole(holeIdx);
    }
});

cv.addEventListener('touchstart',(e)=>{
    e.preventDefault();
    const rect=cv.getBoundingClientRect();
    const touch=e.touches[0];
    const x=(touch.clientX-rect.left)*(W/rect.width);
    const y=(touch.clientY-rect.top)*(H/rect.height);

    if(G.state==='over'){
        initGame();
        return;
    }

    if(G.state!=='playing')return;

    const holeIdx=getHole(x,y);
    if(holeIdx>=0){
        hitMole(holeIdx);
    }
},{passive:false});

// 开始按钮
document.getElementById('startBtn').onclick=()=>{
    initGame();
};

// 暂停按钮
document.getElementById('pauseBtn').onclick=()=>{
    paused=true;
    document.getElementById('pauseScreen').style.display='flex';
};

// 继续按钮
document.getElementById('resumeBtn').onclick=()=>{
    paused=false;
    document.getElementById('pauseScreen').style.display='none';
};

// 重新开始
document.getElementById('restartBtn').onclick=()=>location.reload();

// Escape键暂停
document.addEventListener('keydown',(e)=>{
    if(e.key==='Escape'&&G.state==='playing'){
        if(!paused){
            paused=true;
            document.getElementById('pauseScreen').style.display='flex';
        }else{
            paused=false;
            document.getElementById('pauseScreen').style.display='none';
        }
    }
});

// 广告系统
const GameMonetize={adsterra:{enabled:!/localhost|127\.0\.0\.1/.test(location.hostname)},sponsor:{enabled:true,wechatQR:'',alipayQR:''},interstitial:{enabled:true,cooldownMs:180000,gameCount:2},_lastInterTime:0,_deathCount:0,_reviveCallback:null,init(){const banner=document.getElementById('adBanner');if(banner&&this.adsterra.enabled){const s1=document.createElement('script');s1.src='https://pl29544740.effectivecpmnetwork.com/de/26/0e/de260e17b6a348e3489772a87b1cedf1.js';s1.async=true;banner.appendChild(s1)}const spBtn=document.getElementById('sponsorBtn');const spPanel=document.getElementById('sponsorPanel');const spClose=document.getElementById('sponsorClose');if(spBtn&&spPanel&&spClose&&this.sponsor.enabled){spBtn.onclick=()=>{spPanel.style.display='flex';spPanel.style.pointerEvents='auto'};spClose.onclick=()=>{spPanel.style.display='none';spPanel.style.pointerEvents='none'};spPanel.onclick=(e)=>{if(e.target===spPanel){spPanel.style.display='none';spPanel.style.pointerEvents='none'}}}else if(spBtn){spBtn.style.display='none'}const skipBtn=document.getElementById('skipInterstitial');const interstitial=document.getElementById('interstitialAd');if(skipBtn&&interstitial){skipBtn.onclick=()=>{interstitial.style.display='none';interstitial.style.pointerEvents='none';if(this._reviveCallback){const cb=this._reviveCallback;this._reviveCallback=null;cb()}}}},requestRevive(callback){this._reviveCallback=callback||null;const el=document.getElementById('interstitialAd');if(!el){if(callback)callback();return}const s2=document.createElement('script');s2.src='https://pl29544742.effectivecpmnetwork.com/be/a9/6d/bea96d779c0ee07c2b15613852dd3e70.js';s2.async=true;document.getElementById('interstitialAdSlot').innerHTML='';document.getElementById('interstitialAdSlot').appendChild(s2);el.style.display='flex';el.style.pointerEvents='auto';setTimeout(()=>{const slot=document.getElementById('interstitialAdSlot');if(slot&&slot.innerHTML.includes('加载中')){slot.innerHTML='<div style=color:#aaa;font:13px Microsoft YaHei,sans-serif>广告暂时无法加载<br>点击下方按钮继续</div>'}},3000);const skipBtn=document.getElementById('skipInterstitial');if(skipBtn){skipBtn.textContent='5 秒后可跳过';skipBtn.disabled=true;let cd=5;const timer=setInterval(()=>{cd--;if(cd<=0){clearInterval(timer);skipBtn.textContent='跳过广告 ▶';skipBtn.disabled=false}else{skipBtn.textContent=cd+' 秒后可跳过'}},1000)}},onDeath(){this._deathCount++;if(this.interstitial.enabled&&this._deathCount>=this.interstitial.gameCount&&Date.now()-this._lastInterTime>=this.interstitial.cooldownMs){this._lastInterTime=Date.now();return true}return false}};
GameMonetize.init();

// 启动
gameLoop();

// ===== 音效系统 =====
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }
function playTone(freq, dur, type='sine', vol=0.3) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}
function sfxClick() { initAudio(); playTone(800, 0.05, 'sine', 0.2); }
function sfxScore() { initAudio(); playTone(523, 0.1); playTone(659, 0.1); }
function sfxWin()   { initAudio(); playTone(523, 0.15); setTimeout(()=>playTone(659, 0.15), 100); setTimeout(()=>playTone(784, 0.2), 200); }

// ===== 最高分系统 =====
const HIGH_SCORE_KEY = 'whack_mole';
function getHighScore() { return parseInt(localStorage.getItem(HIGH_SCORE_KEY) || '0'); }
function setHighScore(score) {
  const high = getHighScore();
  if (score > high) { localStorage.setItem(HIGH_SCORE_KEY, score); return true; }
  return false;
}
